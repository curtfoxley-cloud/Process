/* ---- decomposition checks ---------------------------------------------------
   A tree of plain labelled boxes, top block first. Three modes:
     build  - place each block under its parent (decoys go in the bin)
     errors - the tree is shown with mistakes; click every block that is wrong
     label  - the tree is shown; pick the right label for each block
   It is right only when every block is right.
   ---------------------------------------------------------------------------- */
var DEC_TMP = {};
var DEC_NONE = -9, DEC_BIN = -2;
/* Fit, tighten, or switch. Each tree check gets one of three layouts:
     ""      the tree as drawn
     "tight" the tree with narrower boxes, when it is a little too wide
     "vert"  the indented list, when even the tight tree is too wide
   Trees in one check share a layout. A layout only escalates until the window
   resizes, so it does not flip while a trainee places blocks. A build check is
   sized by its full answer tree, because most blocks start in the tray.
   Print measures against the printable width of a Letter or A4 page. */
var DEC_VERT = {}, DEC_PRINTW = 0, DEC_PAGEW = 690, DEC_MODES = ["", "tight", "vert"];
function decFit(root){
  root = root || document;
  var pw = DEC_PRINTW || ((document.body && document.body.classList.contains("printmode")) ? DEC_PAGEW : 0);
  var groups = [], byId = {};
  Array.prototype.forEach.call(root.querySelectorAll(".dtree"), function(t){
    var c = t.closest ? t.closest("[data-check]") : null, id = c ? c.getAttribute("data-check") : "";
    if(id){ if(!byId[id]){ byId[id] = {id:id, ts:[]}; groups.push(byId[id]); } byId[id].ts.push(t); }
    else groups.push({id:"", ts:[t]});
  });
  groups.forEach(function(g){
    var sticky = (g.id && !pw && DEC_VERT[g.id]) || 0, rank = sticky;
    var sec = g.id ? decSec(g.id) : null;
    var build = !!(sec && sec.check && sec.check.dec && sec.check.dec.mode === "build");
    while(rank < 2 && !decFits(g.ts, DEC_MODES[rank], pw, build ? sec : null)) rank++;
    g.ts.forEach(function(t){ t.classList.remove("vert", "tight"); if(rank) t.classList.add(DEC_MODES[rank]); });
    if(g.id && !pw && rank > sticky) DEC_VERT[g.id] = rank;
  });
}
function decFits(ts, cls, pw, sec){
  var ok = true;
  ts.forEach(function(t){

/* ---- pick-the-codes drill --------------------------------------------------
   Each drill line is one item. The trainee ticks every code the line takes, or
   the "none" choice. Grading is an exact match of the set: one missing code or
   one extra code is wrong. The first attempt is the one that counts.

var CODES = DRILL.codes||[];
function sameSet(a,b){
  if(a.length!==b.length) return false;
  for(var i=0;i<a.length;i++) if(b.indexOf(a[i])<0) return false;
  return true;
}

function drillHtml(d,n){
  var rec=STATE.drills[d.id], locked=!!rec;
  var picks=rec?rec.picks:[];
  var L=DRILL.labels||{};
  var hd="<span><b>"+esc(L.line||"Line")+"</b>"+esc(d.id)+"</span>";

    "<div class='codes'>";
  CODES.concat(DRILL.noneLabel===""?[]:["NONE"]).forEach(function(c){
    var on=picks.indexOf(c)>=0, should=(c==="NONE") ? d.a.length===0 : d.a.indexOf(c)>=0;
    var cls="code"+(c==="NONE"?" none":"")+(locked?" locked":"");
    if(locked){
      if(on && should) cls+=" right";
      else if(on && !should) cls+=" wrong";
      else if(!on && should) cls+=" missed";
    }
    h+="<label class='"+cls+"'><input type='checkbox' data-dcode='"+esc(d.id)+"' value='"+esc(c)+"'"+(on?" checked":"")+(locked?" disabled":"")+">"+
       esc(c==="NONE"?(DRILL.noneLabel||"No code"):c)+"</label>";
  });

    h+="<div class='btnrow' style='margin-top:14px;margin-bottom:0'><button class='btn pri' data-dgo='"+esc(d.id)+"'>Check this line</button></div>";
  }else{

function gradeDrill(id){
  var d=null;
  MODULES.forEach(function(m){ (m.drill||[]).forEach(function(x){ if(x.id===id) d=x; }); });

  var ok = (picks[0]==="NONE") ? d.a.length===0 : sameSet(picks, d.a);

function grade(id){
  var sec=null;
  MODULES.forEach(function(m){ m.sections.forEach(function(s){ if(s.id===id) sec=s; }); });
  if(!sec) return;
  var picks=[];
  if(isDec(sec)){ gradeDec(sec); return; }
  if(isOrder(sec)){
    picks=(ORD_TMP[id]||startOrder(sec)).slice();
    var okO=true; picks.forEach(function(v,p){ if(v!==p) okO=false; });
    STATE.checks[id]={ first:okO, picks:picks, at:new Date().toISOString() };
    delete ORD_TMP[id];
    autosave(); draw();
    var elO=document.querySelector("[data-check='"+id+"']"); if(elO) elO.scrollIntoView({block:"center", behavior:"smooth"});
    return;
  }
  Array.prototype.forEach.call(document.querySelectorAll("input[name]"), function(r){ if(r.checked && r.name==="ck_"+id) picks.push(parseInt(r.value,10)); });
  if(!picks.length){ toast(isMulti(sec) ? "Tick at least one answer first." : "Choose an answer first."); return; }
  var ok = isMulti(sec) ? sameSet(picks, sec.check.a) : (picks[0]===sec.check.a);
  STATE.checks[id]={ first:ok, picks:picks, at:new Date().toISOString() };
  autosave(); draw();
  var el=document.querySelector("[data-check='"+id+"']");
  if(el) el.scrollIntoView({block:"center", behavior:"smooth"});
}

function download(name, text, type){
  try{
    var b=new Blob([text],{type:type||"text/plain;charset=utf-8"});
    var u=URL.createObjectURL(b);
    var a=document.createElement("a");
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); },600);
    return true;
  }catch(e){ return false; }
}

        var v=(STATE.answers[x.id+"."+pt.id]||"").trim();
        ex+="<p class='q'>"+esc(pt.id)+") "+esc(plain(pt.q))+"</p><div class='a"+(v?"":" empty")+"'>"+
            (v?esc(v).split("\n").join("<br>"):"No answer written")+"</div>";
      });
      ex+="</div>";
    });
  });
  return "<!DOCTYPE html><html><head><meta charset='utf-8'><title>"+esc(RTITLE)+" training record: "+esc(STATE.name||"unnamed")+"</title>"+
   "<style>"+palRecolor("body{font-family:Georgia,serif;max-width:860px;margin:36px auto;padding:0 24px;color:#1E262E;line-height:1.55}"+
   "h1{font-size:26px;margin:0 0 4px}.sub{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#5C6D78;letter-spacing:.06em}"+
   "table.meta{width:auto;margin:18px 0 26px;font-size:14px}table.meta th{background:none;color:#5C6D78;font-family:ui-monospace,Consolas,monospace;font-size:11px;text-transform:uppercase;text-align:left;padding:3px 18px 3px 0;white-space:nowrap;font-weight:normal;vertical-align:top}table.meta td{border:0;padding:3px 0}"+
   "table{border-collapse:collapse;width:100%;font-size:13.5px;margin-bottom:26px}"+
   "th{background:#1E262E;color:#fff;text-align:left;padding:7px 10px;font-size:12px}"+
   "td{padding:6px 10px;border-top:1px solid #D6DCDF;vertical-align:top}td.k{font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:nowrap;width:88px}th.r{width:150px}"+
   "tr.no td{background:#F4E2E2}tr.na td{background:#F6ECD8}"+
   "h2{font-size:19px;border-bottom:2px solid #1E262E;padding-bottom:5px;margin:32px 0 14px}"+
   ".ex{margin-bottom:26px}.ex h3{font-size:16px;margin:0 0 6px}"+
   ".sc{background:#F4F6F7;padding:10px 13px;border-radius:4px;font-size:13.5px;margin:0 0 12px}"+
   ".q{font-weight:bold;font-size:14px;margin:12px 0 5px}"+
   ".a{font-family:-apple-system,Segoe UI,Arial,sans-serif;font-size:14px;background:#fff;border-left:3px solid #A8481F;padding:8px 13px;white-space:normal}"+
   ".a.empty{color:#8998A2;border-left-color:#D6DCDF;font-style:italic}"+
   ".mk{font-family:-apple-system,Segoe UI,Arial,sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.05em;text-align:center;padding:4px 10px;margin:0 0 4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}"+
   ".mkblock{font-family:-apple-system,Segoe UI,Arial,sans-serif;font-size:12.5px;padding:10px 14px;border-radius:4px;margin:0 0 14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}"+
   ".mkbot{margin-top:30px}"+
   "@media print{body{margin:0}.ex{page-break-inside:avoid}}")+"</style></head><body>"+
   recMarks("top")+
   "<h1>"+esc(RTITLE)+": training record</h1>"+
   "<div class='sub'>"+esc(recordNo())+"</div>"+
   "<table class='meta'><tr><th>Trainee</th><td>"+esc(STATE.name||"(name not entered)")+"</td></tr>"+
   "<tr><th>Company</th><td>"+esc(CONFIG.companyName)+"</td></tr>"+
   "<tr><th>Completed</th><td>"+esc(new Date().toLocaleString())+"</td></tr>"+
   "<tr><th>Checks</th><td>"+c.right+" of "+c.totalChecks+" correct on the first attempt ("+(c.totalChecks?Math.round(100*c.right/c.totalChecks):0)+"%)</td></tr>"+
   (c.totalDrill?"<tr><th>Drill</th><td>"+c.drillRight+" of "+c.totalDrill+" lines right on the first attempt</td></tr>":"")+
   "<tr><th>Exercises</th><td>"+c.filledParts+" of "+c.totalParts+" answers written</td></tr></table>"+
   "<h2>Section checks</h2><table><colgroup><col style='width:88px'><col><col style='width:150px'></colgroup><thead><tr><th>Section</th><th>Title</th><th class='r'>Result</th></tr></thead><tbody>"+rows+"</tbody></table>"+
   (drows?"<h2>"+esc(DRILL.title||"Drill")+"</h2><table><thead><tr><th>Line</th><th>Item</th><th>Picked</th><th>Answer</th><th class='r'>Result</th></tr></thead><tbody>"+drows+"</tbody></table>":"")+
   ex+"<div class='mkbot'>"+recMarks("bottom")+"</div>"+

      record:recordNo(), completed:new Date().toISOString(), markings:mkTexts(), state:STATE}).replace(/</g,"\\u003c")+"</"+"script>"+
   "</body></html>";
}
function recMarks(pos){
  var h="";
  mkPick(pos,"banner").forEach(function(m){ h+=mkDiv(m,"mk"); });
  MK.filter(function(m){ return m.kind==="block" && (m.where===pos||m.where==="both"||(!m.where&&pos==="top")); }).forEach(function(m){ h+=mkDiv(m,"mkblock"); });
  return h;
}
function downloadRecord(){
  var ok=download(STEM+"-record-"+slug()+".html", recordHtml(), "text/html;charset=utf-8");
  toast(ok ? "Record downloaded. Attach it to an email to "+CONFIG.trainerName+"." : "This browser blocked the download. Use Copy as text instead.");
}
function copyRecord(){
  var txt=recordLines();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast("Record copied. Paste it into an email or chat."); },
      function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  var t=document.createElement("textarea");
  t.value=txt; t.style.position="fixed"; t.style.opacity="0";
  document.body.appendChild(t); t.select();
  var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  document.body.removeChild(t);
  toast(ok ? "Record copied. Paste it into an email or chat." : "Copying is blocked here. Use Download the record instead.");
}
function mailRecord(){
  var subj=(COURSE.shortName||RTITLE)+" record: "+(STATE.name||"unnamed")+": "+recordNo();
  var body=recordLines();
  var url="mailto:"+encodeURIComponent(CONFIG.trainerEmail)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
  if(url.length>1900){
    var c=counts();
    var shortBody=RTITLE+": training record\n"+recordNo()+
      "\nTrainee: "+(STATE.name||"(name not entered)")+
      "\nChecks: "+c.right+" of "+c.totalChecks+" correct first time"+
      (c.totalDrill?"\nDrill: "+c.drillRight+" of "+c.totalDrill+" lines right first time":"")+
      "\nExercises: "+c.filledParts+" of "+c.totalParts+" answers written"+
      "\n\nThe full record, including all written answers, is attached.\n(If it is not attached yet: go back to the training, choose Download the record, and attach the file.)";
    url="mailto:"+encodeURIComponent(CONFIG.trainerEmail)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(shortBody);
    downloadRecord();
    toast("Answers are too long for an email body, so the record was downloaded. Attach it to the message.");
  }
  window.location.href=url;
}
function postRecord(){
  var b=document.getElementById("btnPost");
  b.disabled=true; b.textContent="Sending…";
  var payload={ record:recordNo(), name:STATE.name||"", company:CONFIG.companyName,
    completed:new Date().toISOString(), score:counts(), checks:STATE.checks, drills:STATE.drills, answers:STATE.answers,
    course:COURSE.title, rev:CONFIG.contentRev };
  if(MK.length) payload.markings=mkTexts();
  fetch(CONFIG.submitEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
   .then(function(r){
      if(r.ok){ b.textContent="Sent"; toast("Sent to "+CONFIG.trainerName+"."); }
      else{ b.disabled=false; b.textContent="Send to trainer"; toast("The server refused it ("+r.status+"). Download the record and email it instead."); }
   })
   .catch(function(){
      b.disabled=false; b.textContent="Send to trainer";
      toast("Could not reach the server. Download the record and email it instead.");
   });
}

/* ==========================================================================
   MISC
   ========================================================================== */
var toastT;
function toast(m){
  var t=document.getElementById("toast");
  t.textContent=m; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("show"); },4200);
}

document.getElementById("who").addEventListener("input", function(e){
  STATE.name=e.target.value; autosave();
});
document.getElementById("btnSave").addEventListener("click", saveProgress);
document.getElementById("btnLoad").addEventListener("click", function(){ document.getElementById("fileIn").click(); });
document.getElementById("btnClear").addEventListener("click", function(){
  if(CLEAR_ARMED) resetAll(); else armClear();
});
document.getElementById("btnClear").addEventListener("blur", function(){ setTimeout(disarmClear, 200); });
document.getElementById("fileIn").addEventListener("change", function(e){
  if(e.target.files && e.target.files[0]) loadProgress(e.target.files[0]);
  e.target.value="";
});
document.getElementById("railToggle").addEventListener("click", function(e){
  e.stopPropagation();
  document.getElementById("rail").classList.toggle("open");
});
document.querySelector("main").addEventListener("click", function(){
  document.getElementById("rail").classList.remove("open");
});
document.addEventListener("keydown", function(e){
  if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  var i=pageIndex();
  if(e.key==="ArrowRight" && i<PAGES.length-1) go(pageKey(PAGES[i+1]));
  if(e.key==="ArrowLeft"  && i>0)              go(pageKey(PAGES[i-1]));
});

mkInit();
glInit();
document.getElementById("brandSub").textContent = CONFIG.companyName + " · interactive modules";
if(autoload()){ document.getElementById("who").value = STATE.name||""; }
if(PREVIEW_PAGE){ VIEW.page=PREVIEW_PAGE; if(PREVIEW_PAGE.indexOf("s:")===0) STATE.seen[PREVIEW_PAGE.slice(2)]=true; }
if(PRINT_MODE) printDoc(PRINT_MODE, false);
else if(/print/i.test(location.hash||"") && COURSE.printLink!==false) printDoc("handout", true);
else draw();

</script>
