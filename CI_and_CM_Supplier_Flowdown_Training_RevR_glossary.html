<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configuration Item and Configuration Management Supplier Flowdown Training</title>
<style>:root{
  --ink:#1E262E; --ink-2:#2C3841; --slate:#5C6D78; --mute:#8998A2;
  --paper:#FFFFFF; --surface:#F4F6F7; --surface-2:#EDF0F1; --rule:#D6DCDF;
  --rust:#A8481F; --rust-soft:#F2E4DD; --rust-ink:#7E340F;
  --teal:#1F5F5B; --teal-soft:#DFEAE8;
  --amber:#9A6508; --amber-soft:#F6ECD8;
  --alert:#8E2F2F; --alert-soft:#F4E2E2;
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --rail:290px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--surface);
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- header ---------- */
.top{
  position:sticky; top:0; z-index:40; background:var(--ink); color:#fff;
  display:flex; align-items:center; gap:16px; padding:0 20px; height:60px;
  border-bottom:1px solid #000;
}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#93A2AB}
.top .spacer{flex:1}
.who{display:flex;align-items:center;gap:8px}
.who label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#93A2AB}
.who input{
  background:#2C3841;border:1px solid #3D4B55;color:#fff;border-radius:4px;
  padding:6px 10px;font-size:13px;width:180px;
}
.who input:focus{outline:2px solid var(--rust);outline-offset:1px}
.tbtn{
  background:transparent;border:1px solid #46545F;color:#DCE3E7;border-radius:4px;
  padding:7px 12px;font-size:12.5px;white-space:nowrap;
}
.tbtn:hover{background:#2C3841;border-color:#5E6D77}
.tbtn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.tbtn.danger{border-color:#7A4A3A;color:#EBCDC2}
.tbtn.danger:hover{background:#4A2E26;border-color:#A85D45}
.tbtn.danger.armed{background:var(--rust);border-color:var(--rust);color:#fff;font-weight:600}
.railtoggle{display:none}

/* ---------- shell ---------- */
.shell{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto}
.rail{
  width:var(--rail); flex:0 0 var(--rail); background:var(--paper);
  border-right:1px solid var(--rule); min-height:calc(100vh - 60px);
  position:sticky; top:60px; max-height:calc(100vh - 60px); overflow-y:auto;
}
.railhead{padding:18px 20px 12px;border-bottom:1px solid var(--rule)}
.railhead h2{margin:0 0 3px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);font-weight:700}
.railhead p{margin:0;font-size:12px;color:var(--slate)}
.grp{padding:14px 0 6px}
.grp h3{
  margin:0 0 6px;padding:0 20px;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--slate);font-weight:700;
}
.nav{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;
  padding:7px 20px 7px 17px;display:flex;gap:10px;align-items:flex-start;line-height:1.35}
.nav:hover{background:var(--surface)}
.nav:focus-visible{outline:2px solid var(--rust);outline-offset:-2px}
.nav[aria-current="true"]{background:var(--surface-2);border-left-color:var(--rust)}
.nav .id{font-family:var(--mono);font-size:10.5px;color:var(--mute);flex:0 0 46px;padding-top:2px;letter-spacing:.02em}
.nav[aria-current="true"] .id{color:var(--rust-ink)}
.nav .nm{font-size:13px;color:var(--ink-2);flex:1}
.nav[aria-current="true"] .nm{font-weight:600}
.dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:5px;border:1.5px solid var(--rule);background:transparent}
.dot.work{border-color:var(--amber);background:var(--amber-soft)}
.dot.done{border-color:var(--teal);background:var(--teal)}

/* ---------- main ---------- */
main{flex:1;min-width:0;padding:0 0 80px}
.stage{max-width:820px;margin:0 auto;padding:34px 32px 0}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.recid{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--rust-ink);background:var(--rust-soft);
  padding:3px 8px;border-radius:3px;font-weight:700}
.status{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
h1.sect{font-family:var(--serif);font-size:31px;line-height:1.2;margin:0 0 6px;letter-spacing:-.2px}
.lede{font-size:15px;color:var(--slate);margin:0 0 22px}
.hr{height:1px;background:var(--rule);margin:0 0 26px}
p{margin:0 0 14px}
strong{font-weight:700}
ul.pl{margin:0 0 16px;padding-left:0;list-style:none}
ul.pl li{position:relative;padding-left:20px;margin-bottom:9px}
ul.pl li::before{content:"";position:absolute;left:3px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--rust)}

.callout{background:var(--surface);border-radius:6px;padding:16px 18px;margin:0 0 20px;border:1px solid var(--rule)}
.callout.teal{background:var(--teal-soft);border-color:#CBDDDA}
.callout .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:7px}
.callout.teal .lab{color:var(--teal)}
.callout.bg{background:transparent;border:1px dashed #AEB9BF;font-size:14.5px;color:var(--ink-2)}
.callout.bg .lab{color:var(--slate)}
.grader{margin-top:8px;background:var(--amber-soft);border:1px solid #E4D3AE;border-radius:5px;padding:10px 13px;font-size:13.5px}
.grader>b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:4px}
.callout p:last-child{margin-bottom:0}

.stmt{background:var(--ink);color:#fff;border-radius:6px;padding:20px 22px;margin:0 0 20px}
.stmt>b{display:block;font-family:var(--serif);font-size:19px;line-height:1.35;font-weight:700}
.stmt>span{display:block;margin-top:9px;font-size:13.5px;color:#B4C0C7}

.cards{display:grid;gap:12px;margin:0 0 20px}
.cards.c2{grid-template-columns:1fr 1fr}
.cards.c3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.card h4{margin:0 0 6px;font-size:14px;font-weight:700}
.card p{margin:0;font-size:13.5px;color:var(--ink-2)}

.steps{margin:0 0 20px;display:grid;gap:8px}
.step{display:flex;gap:12px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:11px 14px}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--rust);color:#fff;
  font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step.tl .n{background:var(--teal)}
.step .tx>b{display:block;font-size:14px;margin-bottom:2px}
.step .tx span{font-size:13.5px;color:var(--ink-2)}

.tw{overflow-x:auto;margin:0 0 20px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
thead th{background:var(--ink);color:#fff;text-align:left;padding:9px 12px;font-size:12px;font-weight:700;letter-spacing:.02em}
tbody td{padding:9px 12px;border-top:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
tbody tr:nth-child(even) td{background:#FAFBFB}
td.k{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}

/* ---------- knowledge check ---------- */
.check{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--rust);border-radius:6px;padding:18px 20px;margin:26px 0 0}
.check .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:8px}
.check .q{font-size:15.5px;font-weight:600;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--rule);border-radius:5px;margin-bottom:7px;cursor:pointer;background:var(--paper);font-size:14px}
.opt:hover{background:var(--surface)}
.opt input{margin:3px 0 0;accent-color:var(--rust);flex:0 0 auto}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt.wrong{border-color:var(--alert);background:var(--alert-soft)}
.opt.locked{cursor:default}
.fb{margin-top:11px;padding:12px 14px;border-radius:5px;font-size:14px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--teal-soft);border:1px solid #CBDDDA}
.fb.no{background:var(--alert-soft);border:1px solid #E8CFCF}
.fb>b{display:block;margin-bottom:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.fb.ok b{color:var(--teal)} .fb.no b{color:var(--alert)}

/* ---------- exercises ---------- */
.exwrap{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;margin:0 0 18px}
.exwrap h4{margin:0 0 8px;font-family:var(--serif);font-size:18px}
.scen{background:var(--surface);border-radius:5px;padding:13px 15px;font-size:14px;margin-bottom:16px}
.part{margin-bottom:16px}
.part label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
textarea{width:100%;border:1px solid var(--rule);border-radius:5px;padding:10px 12px;font-size:14px;
  line-height:1.55;resize:vertical;min-height:76px;background:var(--paper)}
textarea:focus{outline:2px solid var(--rust);outline-offset:0;border-color:var(--rust)}
.count{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:4px;text-align:right}

/* ---------- buttons / footer nav ---------- */
.pager{display:flex;justify-content:space-between;gap:12px;margin:32px 0 0;padding-top:22px;border-top:1px solid var(--rule)}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:5px;padding:10px 18px;font-size:14px;font-weight:600}
.btn:hover{background:var(--surface)}
.btn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.btn.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.pri:hover{background:var(--rust-ink)}
.btn.gh{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}

/* ---------- start + submit ---------- */
.hero{background:var(--ink);color:#fff;border-radius:8px;padding:34px 34px 30px;margin-bottom:26px}
.hero .kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust-soft);margin-bottom:12px}
.hero h1{font-family:var(--serif);font-size:35px;line-height:1.15;margin:0 0 6px}
  .hero .subtitle{font-family:var(--serif);font-size:19px;line-height:1.3;color:#C9D3D9;margin:0 0 10px}
  .hero .scale{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rust-soft);margin:0 0 14px}
.hero p{color:#B4C0C7;margin:0;font-size:15px;max-width:60ch}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 22px;font-size:14px}
.meta dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);padding-top:3px}
.meta dd{margin:0}
.transmit{border:1px solid var(--rule);border-radius:6px;background:var(--paper);overflow:hidden;margin-bottom:22px}
.transmit .hd{background:var(--surface-2);padding:12px 18px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.transmit .hd b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.transmit .hd span{font-family:var(--mono);font-size:11px;color:var(--slate)}
.transmit .bd{padding:18px}
.scorebox{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.scorebox .big{font-family:var(--serif);font-size:42px;font-weight:700;line-height:1}
.scorebox .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate)}
.gaps{margin-top:14px}
.gaps li{font-size:13.5px}
.note{font-size:13px;color:var(--slate);margin-top:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:5px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.warn{background:var(--amber-soft);border:1px solid #E4D3AE;border-radius:5px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.setup{font-size:13px;color:var(--slate);border-top:1px solid var(--rule);margin-top:26px;padding-top:16px}
.setup code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:3px}

.fadein{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:760px){
  .top{padding:0 12px;gap:8px}
  .brand{display:none}
  .lng{display:none}
  .who{flex:1;min-width:0}
  .who label{display:none}
  .top .who input{width:100%;min-width:90px}
  .tbtn{padding:7px 10px}
}
@media(max-width:440px){
  .top{flex-wrap:wrap;height:auto;padding:8px 12px;row-gap:8px}
  .who{order:9;flex:1 0 100%}
  .top .spacer{display:none}
  .top .tbtn{flex:1 1 auto}
  .top .who input{width:100%}
}
@media(max-width:900px){
  .cards.c3,.cards.c2{grid-template-columns:1fr}
  .rail{position:fixed;top:60px;left:0;bottom:0;z-index:35;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0);max-height:none}
  .rail.open{transform:none;box-shadow:2px 0 24px rgba(0,0,0,.25)}
  .railtoggle{display:inline-block}
  .stage{padding:26px 18px 0}
  .who input{width:120px}
  h1.sect{font-size:26px}
  .hero{padding:26px 22px}
  .hero h1{font-size:28px}
}

/* ---------- part note text ---------- */
.pnote{display:flex;gap:11px;align-items:flex-start;background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--teal);
  border-radius:5px;padding:10px 14px;margin:0 0 12px;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.pnote .pc{flex:0 0 auto;min-width:44px;text-align:center;background:var(--ink);color:#fff;font-weight:700;border-radius:3px;padding:1px 7px;font-size:11.5px;letter-spacing:.04em;margin-top:1px}

/* ---------- product tree ---------- */
.tree{border:1px solid var(--rule);border-radius:6px;background:var(--paper);margin:0 0 20px;overflow:hidden}
.trow{display:flex;gap:12px;align-items:flex-start;padding:9px 14px;border-top:1px solid var(--rule);font-size:13.5px}
.trow:first-child{border-top:0}
.trow .tn{flex:1;min-width:0;color:var(--ink-2)}
.trow .tn b{color:var(--ink)}
.trow .tn>i{display:block;font-style:normal;font-size:12.5px;color:var(--slate);margin-top:2px}
.trow .tc{flex:0 0 auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:45%}
.chip{font-family:var(--mono);font-size:11px;font-weight:700;border-radius:3px;padding:1px 6px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--rule)}
.chip.none{font-weight:400;color:var(--mute)}
.tbar{font-family:var(--mono);color:var(--mute);white-space:pre}

/* ---------- parts-list drill ---------- */
.dline{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--rust);border-radius:6px;margin:0 0 18px;overflow:hidden}
.dline .hd{background:var(--surface-2);padding:9px 16px;border-bottom:1px solid var(--rule);display:flex;gap:8px 18px;flex-wrap:wrap;
  font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.dline .hd span b{color:var(--slate);font-weight:400;letter-spacing:.08em;text-transform:uppercase;font-size:10px;margin-right:6px}
.dline .bd{padding:14px 16px 16px}
.dline .nm{font-family:var(--mono);font-size:14px;font-weight:700;margin:0 0 10px;letter-spacing:.02em}
.codes{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 0}
.code{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);border-radius:4px;padding:6px 11px;
  font-family:var(--mono);font-size:12.5px;font-weight:700;cursor:pointer;background:var(--paper);user-select:none}
.code:hover{background:var(--surface)}
.code input{accent-color:var(--rust);margin:0}
.code.none{font-weight:400}
.code.locked{cursor:default}
.code.locked:hover{background:inherit}
.code.right{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.code.wrong{border-color:var(--alert);background:var(--alert-soft);color:var(--alert);text-decoration:line-through}
.code.missed{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);border-style:dashed}
.legend{font-size:12.5px;color:var(--slate);margin:10px 0 0;display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;border:1px solid}
.legend .lr{background:var(--teal-soft);border-color:var(--teal)}
.legend .lw{background:var(--alert-soft);border-color:var(--alert)}
.legend .lm{background:var(--amber-soft);border-color:var(--amber);border-style:dashed}

/* ---------- builder additions: extra block types ---------- */
h2.sub2{font-family:var(--serif);font-size:21px;line-height:1.3;margin:26px 0 10px}
ol.ol{margin:0 0 16px;padding-left:22px}
ol.ol li{margin-bottom:8px;padding-left:4px}
ol.ol li::marker{color:var(--rust);font-family:var(--mono);font-size:13px;font-weight:700}
.callout.amb{background:var(--amber-soft);border-color:#E4D3AE}
.callout.amb .lab{color:var(--amber)}
.fig{margin:0 0 20px;text-align:center}
.fig img{max-width:100%;height:auto;border:1px solid var(--rule);border-radius:6px;background:#fff}
.fig figcaption{font-size:13px;color:var(--slate);margin-top:7px}

/* ---------- markings: banners and notice blocks ---------- */
.chrome{position:sticky;top:0;z-index:40}
.chrome .top{position:relative;top:auto}
.mk{font-family:var(--sans);font-weight:700;font-size:12.5px;letter-spacing:.05em;text-align:center;padding:4px 14px;line-height:1.35}
#mkBot{position:fixed;left:0;right:0;bottom:0;z-index:45}
.rail{top:var(--chh,60px);max-height:calc(100vh - var(--chh,60px) - var(--mkb,0px));min-height:calc(100vh - var(--chh,60px) - var(--mkb,0px))}
body{padding-bottom:var(--mkb,0px)}
.toast{bottom:calc(26px + var(--mkb,0px))}
.mkblock{border-radius:6px;padding:12px 16px;margin:0 0 20px;font-size:13px;line-height:1.5;border:1px solid rgba(0,0,0,.08)}
.mkblock.mkbtm{margin-top:26px}
@media(max-width:900px){ .rail{top:var(--chh,60px);bottom:var(--mkb,0px);max-height:none;min-height:0} }
@media print{ .mk,.mkblock{-webkit-print-color-adjust:exact;print-color-adjust:exact} #mkBot{position:static} .chrome{position:static} }

/* ---------- choose-all-that-apply checks ---------- */
.check .multi{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin:-6px 0 10px}
.opt.missed{border-color:var(--amber);background:var(--amber-soft);border-style:dashed}

/* ---------- glossary ---------- */
.gl{border-bottom:1.5px dotted var(--teal);cursor:help}
.stmt .gl,.hero .gl{border-bottom-color:#9FC3BE}
.gl:hover{background:var(--teal-soft)}
.stmt .gl:hover,.hero .gl:hover{background:rgba(255,255,255,.12)}
.gl:focus-visible{outline:2px solid var(--rust);outline-offset:1px;border-radius:2px}

  "t": "Supplier",
  "alt": [],
  "d": "An individual, partnership, company, corporation, association or other entity tasked under the terms of an Acquirer contract or an agreement to provide the Acquirer with the design, development, manufacture, maintenance, modification, or supply of items may also be referred to in certain binding agreements as a Contractor or Vendor. *Source: EIA-649-1A.* Your company is the Supplier to its Acquirer. In Modules 4 to 7, the supplier is the organization that holds a statement of work or purchase order from your company."
 },
 {
  "t": "Sub-tier supplier",
  "alt": [
   "sub-tier"
  ],
  "d": "A supplier of a supplier. A sub-tier receives requirements through the supplier under recursive flowdown rather than directly from the company."
 },
 {
  "t": "Design activity",
  "alt": [],
  "d": "An organization that has, or has had, responsibility for the design of an item. *Source: EIA-649-1A.* Its CAGE code goes on the item, its parts, its documentation and its media."
 },
 {
  "t": "Design authority",
  "alt": [],
  "d": "The authority to establish and change the technical definition of an item, including its detailed design content, and to approve departures from that definition. Design authority may be held in whole or in part. Under a source control drawing the supplier holds design authority for item internals while the company holds it for form, fit, function, interface, and qualification."
 },
 {
  "t": "Design holder",
  "alt": [],
  "d": "The party that holds the design of the procured item. Usually the company, the supplier, or both. For a vendor item bought through a distributor, broker, or reseller, the design holder is a sub-tier."
 },
 {
  "t": "Vendor",
  "alt": [],
  "d": "The party that holds the design of a vendor item. Not necessarily the party you contract with. A distributor, broker, or reseller classifies WT05 and holds no design."
 },
 {
  "t": "Vendor item",
  "alt": [
   "catalog item"
  ],
  "d": "A commercial or catalog article bought to the vendor’s own part number. A catalog item and a commercial item are the same kind of article. A vendor item is not a CI unless it is designated one."
 },
 {
  "t": "Technical data package",
  "alt": [],
  "d": "The authoritative technical description of an item. This technical description supports the acquisition, production, inspection, engineering, and logistics support of the item. The description defines the required design configuration and/or performance requirements, and procedures required to confirm adequacy of item performance. It consists of applicable technical data such as models, engineering design data, associated lists, specifications, standards, performance requirements, quality assurance provisions, software documentation and packaging details. *Source: EIA-649-1A.*"
 },
 {
  "t": "Performance specification",
  "alt": [],
  "d": "A specification that states requirements in terms of the required results with criteria for verifying compliance but without stating the methods for achieving the required results. A performance specification defines the functional requirements for the item, the environment in which it must operate, and interface and interchangeability characteristics. *Source: EIA-649-1A.*"
 },
 {
  "t": "Detail specification",
  "alt": [],
  "d": "A specification that states design requirements, such as materials to be used, how a requirement is to be achieved, or how an item is to be fabricated or constructed. A specification that contains both performance and detail requirements is still considered a detail specification. *Source: EIA-649-1A.*"
 },
 {
  "t": "System specification",
  "alt": [],
  "d": "The top-level specification for the whole system or end item. It sits in the functional configuration documentation."
 },
 {
  "t": "Item specification",
  "alt": [],
  "d": "The specification for one CI. It sits in the allocated configuration documentation."
 },
 {
  "t": "Source control drawing",
  "alt": [
   "SCD"
  ],
  "d": "A drawing that provides an engineering description, qualification requirements, and acceptance criteria for a vendor-developed or commercial item procurable from a specialized segment of industry that provides the performance, installation, and interchangeability characteristics required for a critical application, and that identifies the approved sources. The company controls form, fit, function, interface, and qualification. The vendor holds the detailed design."
 },
 {
  "t": "Vendor item control drawing",
  "alt": [
   "VICD"
  ],
  "d": "A drawing that provides an engineering description and acceptance criteria sufficient to identify and select a vendor-developed or commercial item, and that identifies the vendor and the vendor item identification. It controls selection. It does not control the item, and the company holds no design authority over it."
 },
 {
  "t": "Altered item drawing",
  "alt": [],
  "d": "Documents a purchased item that is permanently altered before it is installed, including a one-time programmable device burned with code."
 },
 {
  "t": "Contract data requirements list",
  "alt": [
   "CDRL",
   "contract data requirements"
  ],
  "d": "The list on the contract stating which data products are delivered, in what form, and when. A requirement with no data requirement behind it produces nothing you can ask for."
 },
 {
  "t": "Interface",
  "alt": [],
  "d": "The functional and physical characteristics at a common boundary. *Source: EIA-649-1A.*"
 },
 {
  "t": "Interface control documentation",
  "alt": [
   "ICD",
   "interface control document"
  ],
  "d": "Interface control drawings, requirements, or other descriptive products, which define, describe, and/or depict physical, functional, and test interface of related or co-functioning Configuration Items. *Source: EIA-649-1A.*"
 },
 {
  "t": "Interface control working group",
  "alt": [
   "ICWG"
  ],
  "d": "For programs, which encompass a system, Configuration Item or a Computer software Configuration item (CSCI) design cycle, an ICWG is established to control interface activity among the Acquirer, Supplier(s), or other agencies including documentation of interface agreements and resolution of interface problems. *Source: EIA-649-1A.*"
 },
 {
  "t": "Interface source",
  "alt": [],
  "d": "An artifact in which Systems Engineering identifies and defines interfaces, and which the program CMP names as an interface source. Interface sources include interface control documents, interface requirements specifications, interface design descriptions, the interface sections of specifications, source control drawings, vendor item control drawings, and drawings, and, where MBSE is used, interface elements between model elements at the CI-designation level. One interface source may define interfaces between several pairs of items. One interface may be defined in several interface sources."
 },
 {
  "t": "Interface register",
  "alt": [],
  "d": "The record holding one row for each interface between two sides, with every source that defines it and its revision, the controlling baseline, and the control authority. A row is an interface between two sides, not a document. CM maps each interface Systems Engineering identified to the CIs it joins, and checks that the map is complete."
 },
 {
  "t": "Critical Safety Item",
  "alt": [
   "CSI",
   "aviation critical safety item"
  ],
  "d": "An aviation critical safety item is “a part, an assembly, installation equipment, launch equipment, recovery equipment, or support equipment for an aircraft or aviation weapon system if the part, assembly, or equipment contains a characteristic any failure, malfunction, or absence of which could cause any of the following: (1) A catastrophic or critical failure resulting in the loss of or serious damage to the aircraft or weapon system; (2) An unacceptable risk of personal injury or loss of life; or (3) An uncommanded engine shutdown that jeopardizes safety.” *Source: DFARS 209.270-2.* The design control activity designates it. It is not the Safety-Critical Item."
 },
 {
  "t": "Design control activity",
  "alt": [],
  "d": "For an aviation critical safety item, “the systems command of a military department that is specifically responsible for ensuring the airworthiness of an aviation system or equipment, in which an aviation critical safety item is to be used.” *Source: DFARS 252.209-7010.*"
 },
 {
  "t": "Safety-Critical Item",
  "alt": [
   "SCI"
  ],
  "d": "A hardware or software item that has been determined through analysis to potentially contribute to a hazard with Catastrophic or Critical mishap potential, or that may be implemented to mitigate a hazard with Catastrophic or Critical mishap potential. *Source: MIL-STD-882E.* MIL-STD-882E states that this term is independent of the critical safety item term in the public laws. It is not the Critical Safety Item."
 },
 {
  "t": "Safety-Critical Function",
  "alt": [
   "SCF"
  ],
  "d": "A function whose failure or malfunction could result in a catastrophic or critical mishap. *Source: MIL-STD-882E.* A function is not an item. Only an item can go in a CI index."
 },
 {
  "t": "Fracture critical traceable part",
  "alt": [],
  "d": "A safety-of-flight structural component that is either single load path or sized by durability or damage tolerance requirements. *Source: MIL-STD-1530D with Change 1.* It is serialized, with heat and lot traceability in addition. It is a separate category from the fracture critical part."
 },
 {
  "t": "Fracture critical part",
  "alt": [],
  "d": "A safety-of-flight structural component that is not single load path and is not sized by durability or damage tolerance requirements, but that requires special emphasis due to the criticality. *Source: MIL-STD-1530D with Change 1.* It is lot or batch recorded at heat level. It carries no serialization obligation on this basis."
 },
 {
  "t": "Life-limited part",
  "alt": [
   "life-limited"
  ],
  "d": "Any part for which a mandatory replacement limit is specified in the type design, the Instructions for Continued Airworthiness, or the maintenance manual. *Source: 14 CFR 43.10.* A life limit is a maintenance control. It is not by itself a reason to make the item a CI."
 },
 {
  "t": "Life status",
  "alt": [],
  "d": "The accumulated cycles, hours, or any other mandatory replacement limit of a life-limited part. *Source: 14 CFR 43.10.*"
 },
 {
  "t": "Age or shelf-life limit",
  "alt": [
   "shelf-life limit",
   "shelf life"
  ],
  "d": "A life limit expressed in calendar time from manufacture, cure, or another stated start event. Shelf-life, cure-date, storage-age, and calendar replacement limits are age limits. The record carries the start date (date code, cure date, or manufacture date) and the expiry date."
 },
 {
  "t": "Cycle or usage limit",
  "alt": [
   "usage limit"
  ],
  "d": "A life limit expressed in a count of use, such as operating cycles, operating hours, landings, or starts. The record carries the assigned limit and the life consumed."
 },
 {
  "t": "Critical influencing part",
  "alt": [
   "influencing part"
  ],
  "d": "A part that sets the working conditions the approved life of an engine life-limited part was calculated for, such as a spacer, an air seal, or a tie bolt. It carries no life limit of its own, and its own failure is not hazardous. Change it, and the life stamped on the other part may no longer be valid."
 },
 {
  "t": "Severity category",
  "alt": [],
  "d": "A classification of a failure mode by its severity, the worst potential consequence of a failure, determined by the degree of injury, property damage, or system damage that could ultimately occur. Category I, Catastrophic: a failure which may cause death or weapon system loss (i.e., aircraft, tank, missile, ship, etc.). Category II, Critical: a failure which may cause severe injury, major property damage, or major system damage which will result in mission loss. Category III, Marginal: a failure which may cause minor injury, minor property damage, or minor system damage which will result in delay or loss of availability or mission degradation. Category IV, Minor: a failure not serious enough to cause injury, property damage, or system damage, but which will result in unscheduled maintenance or repair. *Source: MIL-STD-1629A.*"
 },
 {
  "t": "Criticality number",
  "alt": [],
  "d": "The number of system failures of a specific type expected due to an item’s failure modes. The failure mode criticality number is the portion of the item’s criticality number due to one of its failure modes under a particular severity classification. It is a frequency measure, not a consequence measure. *Source: MIL-STD-1629A.*"
 },
 {
  "t": "Safety-mandatory requirement",
  "alt": [
   "requirement mandatory for safety",
   "requirements mandatory for safety"
  ],
  "d": "A CM requirement listed in the enterprise register of safety-mandatory CM requirements. It is imposed on every applicable procurement, or an exception is routed to the safety disposition gate and recorded with its risk acceptance. The flowdown matrix marks each row that flows one. Its coverage record maps every register line to the row that flows it, or to a recorded rationale for non-flow at the supplier tier."
 },
 {
  "t": "Safety disposition gate",
  "alt": [],
  "d": "The gate that runs when a program proposes not to perform a requirement mandatory for safety. Exactly three dispositions exist. Perform the requirement. Replace it with a documented equivalent control, validated independently by CM and Safety Assurance against the hazard it controls. Or risk-accept its absence formally, at the authority the safety management system names. Catastrophic and severe both route to the accountable executive."
 },
 {
  "t": "Hazard log",
  "alt": [],
  "d": "The safety management system record of identified hazards, their severity, and the risk controls that address them."
 },
 {
  "t": "Statement of work",
  "alt": [
   "SOW",
   "SSOW",
   "supplier statement of work"
  ],
  "d": "The document that tells a supplier what to do. CM requirements reach a supplier through it, or they do not reach the supplier at all. A statement of work issued to a supplier is a supplier statement of work, or SSOW."
 },
 {
  "t": "Flowdown",
  "alt": [],
  "d": "Passing a requirement from your company down to a supplier. A requirement that exists at your tier and not at the tier doing the work is not protecting anything."
 },
 {
  "t": "Work type",
  "alt": [],
  "d": "A classification of the work a supplier performs, determined by who holds design authority and who performs the build, with item type (hardware, software, commercial item, service) as a modifier. This course uses nine work types, WT01 to WT09."
 },
 {
  "t": "Classification record",
  "alt": [],
  "d": "The recorded determination of a procurement’s work type(s), maintained on the classification log. The classification record constitutes the documented tailoring rationale required by the flowdown obligation."
 },
 {
  "t": "Classification log",
  "alt": [],
  "d": "The record where each work type classification is written, with a name and a date. One entry per procured item: the classification, and everything decided from it."
 },
 {
  "t": "Flowdown matrix",
  "alt": [],
  "d": "The controlled content the flowdown rests on: the work type definitions, the requirement matrix, the deliverable definitions, the safety-mandatory coverage record, the audit-consumed records map, the classification log, and the instructions for reading them."
 },
 {
  "t": "Requirement matrix",
  "alt": [],
  "d": "The controlled content that maps each work type to the CM requirements it receives. One row per CM requirement. One column per work type. Each cell carries a marking: R, T, C, or a dash. Each row carries its conditions and tailoring notes."
 },
 {
  "t": "Procured item",
  "alt": [],
  "d": "The hardware or software article the supplier delivers and the company accepts as a separate line on the acceptance record. A procurement may cover more than one procured item. A part the supplier installs into an assembly before delivery is embodied, and it is content of that assembly rather than a procured item in its own right. The same part shipped loose, and accepted on its own line, is a procured item. A procured item is not a supplier data deliverable."
 },
 {
  "t": "Supplier data deliverable",
  "alt": [
   "SDRL"
  ],
  "d": "The data the supplier submits under a cited requirement, identified by SDRL number and defined in the flowdown matrix workbook as to content, frequency or triggering event, and applicability. SDRL stands for Supplier Data Requirements List item. Each one carries an identifier from S-01 to S-21."
 },
 {
  "t": "Tailoring",
  "alt": [],
  "d": "Imposing a requirement in modified form, with the modification and its rationale recorded. A requirement omitted without a recorded rationale is not tailored. It is omitted."
 },
 {
  "t": "Conditional requirement",
  "alt": [],
  "d": "A requirement whose applicability depends on a stated condition. CM resolves the condition against the facts as of the resolution date, records the basis, and re-resolves the condition on any re-classification trigger."
 },
 {
  "t": "Standing conditional audit clause",
  "alt": [
   "standing audit clause"
  ],
  "d": "A statement-of-work clause imposing configuration audit conduct or support obligations that take effect if and when the procured item is or becomes designated for audit, with the audit deliverables cited as triggered items."
 },
 {
  "t": "Standing conditional recursive flowdown clause",
  "alt": [
   "standing recursive flowdown clause"
  ],
  "d": "A statement-of-work clause imposing recursive flowdown and the return of sub-tier product data, taking effect if and when the supplier uses or adds a sub-tier, with the sub-tier product data deliverables cited as triggered items."
 },
 {
  "t": "Recursive flowdown",
  "alt": [
   "recursion"
  ],
  "d": "The obligation on a supplier to flow the CM requirements imposed on it, or suitable tailorings, to its own sub-tier suppliers, and to return sub-tier product data upward with traceability to next higher assemblies."
 },
 {
  "t": "Company-provisioned materiel",
  "alt": [],
  "d": "Materiel whose configuration the company selects, procures, or furnishes, and which a supplier receives, verifies, and embodies rather than procures on its own authority. Includes kitted content, company-issued items, and items bought against a company purchase order and directed to the supplier."
 },
 {
  "t": "Critical or special process",
  "alt": [
   "special process"
  ],
  "d": "A process whose result cannot be fully verified by subsequent inspection or test of the product, and which therefore depends on qualification of the process, the equipment, and the personnel. Heat treat, coating, plating, welding, bonding, and non-destructive inspection are typical."
 },
 {
  "t": "Attestation scope",
  "alt": [],
  "d": "What the CM signature on a statement of work certifies: that CM review occurred, or that the flowdown content is adequate. The program CM plan defines it once."
 },
 {
  "t": "Change proposal",
  "alt": [
   "engineering change proposal",
   "ECP"
  ],
  "d": "A formal request to change baselined configuration documentation, made for a change classified Major (Class I) under the EIA-649-1A criteria. It carries the change definition, the need for it, full impact data, and a revision notice for every affected document. Delivered as S-04."
 },
 {
  "t": "Major (Class I) change",
  "alt": [
   "Major change",
   "Class I change",
   "Class I"
  ],
  "d": "An engineering change that meets one or more of the Major (Class I) criteria in the EIA-649-1A engineering change classification. The supplier submits it to the company as a change proposal. The company dispositions it. The supplier does not implement it before company approval."
 },
 {
  "t": "Minor (Class II) change",
  "alt": [
   "Minor change",
   "Class II change",
   "Class II"
  ],
  "d": "An engineering change that meets none of the EIA-649-1A Major (Class I) criteria. EIA-649-1A limits Minor (Class II) changes to administrative changes, documentation clarifications, corrections, or configuration changes that do not affect interchangeability."
 },
 {
  "t": "Classification concurrence",
  "alt": [],
  "d": "The company’s agreement that a change the supplier classified Minor (Class II) meets none of the Major (Class I) criteria. Concurrence is on the classification only. It does not approve the change or its implementation. Where the company does not concur, the change is Major (Class I), and the supplier resubmits it as a change proposal."
 },
 {
  "t": "Variance",
  "alt": [
   "request for variance"
  ],
  "d": "Approval to accept a departure from released design, requested before the affected unit is delivered. Called a deviation or a waiver in some conventions depending on timing. A recurring variance determined permanently acceptable becomes a change proposal. Each request is classified Critical, Major, or Minor under the EIA-649-1A variance classification criteria and submitted to the company for disposition, whatever its classification."
 },
 {
  "t": "Variance classification",
  "alt": [],
  "d": "The assignment of Critical, Major, or Minor to a request for variance under the EIA-649-1A variance classification criteria. Critical: a departure from requirements affecting safety, human health, the environment, or security. Major: a departure from requirements affecting performance or operational limits; interchangeability, reliability, survivability, maintainability, or durability of the item or its repair parts; structural strength; effective use or operation; weight, moment of inertia, or center of gravity; appearance; limits on product use or operation; or temporary use of alternate items; or a departure the configuration documentation classifies as major. Minor: a departure that involves none of the Critical or Major factors, or one the configuration documentation classifies as minor."
 },
 {
  "t": "Nonconformance",
  "alt": [],
  "d": "A condition that does not meet the released design or requirement. It is recorded, dispositioned by the required authority, and the disposition is then carried out and verified."
 },
 {
  "t": "Effectivity",
  "alt": [],
  "d": "The point at which an approved change takes effect, stated as a unit, lot, line number, or date. It answers which unit is the first to carry the change."
 },
 {
  "t": "Release record",
  "alt": [],
  "d": "The record that a document revision has been released for use: document identifiers, current revisions, release dates, and before-and-after traceability for each changed document. Delivered as S-19."
 },
 {
  "t": "First article inspection",
  "alt": [
   "FAI"
  ],
  "d": "A complete, documented inspection of a first production item against the released design, confirming that the production process makes conforming product. It is repeated when the process, source or tooling changes. Reported as S-14."
 },
 {
  "t": "Frozen planning",
  "alt": [],
  "d": "Manufacturing planning, process parameters, facilities and tooling that have been qualified or approved. None of them may change without notice and approval."
 },
 {
  "t": "Process change notification",
  "alt": [],
  "d": "Advance notice of any change to a frozen or qualified process, facility, tooling or source, with the effectivity and the requalification basis. Delivered as S-03."
 },
 {
  "t": "Notice period",
  "alt": [],
  "d": "The minimum time, stated in the statement of work, between a supplier’s notice and the change it announces."
 },
 {
  "t": "Last-time-buy terms",
  "alt": [
   "last-time-buy"
  ],
  "d": "The final date and conditions for placing a last order before a vendor discontinues an item."
 },
 {
  "t": "Alternates data",
  "alt": [],
  "d": "Identification of the substitute items a vendor offers for a changed or discontinued item."
 },
 {
  "t": "CM point of contact",
  "alt": [],
  "d": "The named supplier individual for CM matters, with role, contact details, a backup, the supplier’s change authority interface point, and the addressee for notices. Delivered as S-20."
 },
 {
  "t": "Build reproducibility",
  "alt": [],
  "d": "The ability to rebuild a delivered software load from identified source code, compiler, compiler version, settings and libraries, and get the same load."
 },
 {
  "t": "Withhold",
  "alt": [],
  "d": "Holding a delivered item back from use after it fails receiving inspection."
 },
 {
  "t": "As-designed configuration",
  "alt": [
   "as-designed"
  ],
  "d": "The configuration defined by the released design at a stated revision, including approved changes at their stated effectivity."
 },
 {
  "t": "As-built configuration",
  "alt": [
   "as-built"
  ],
  "d": "The configuration actually manufactured and assembled in a specific delivered unit or lot, evidenced by closed work orders, dispositioned nonconformance records, and part traceability records."
 },
 {
  "t": "As-maintained configuration",
  "alt": [
   "as-maintained"
  ],
  "d": "The configuration of an item as currently in-service. The as-maintained configuration consists of the as-built configuration, plus any approved changes, retrofits, or modifications implemented after the item is put into service; also referred to as the as-supported, as-installed, or in-service configuration. *Source: EIA-649-1A.*"
 },
 {
  "t": "Reconciliation",
  "alt": [
   "as-designed to as-built reconciliation"
  ],
  "d": "Comparing as-built against released design and dispositioning every difference. It runs continuously at scale, and audits sample it."
 },
 {
  "t": "Reconciliation elements",
  "alt": [
   "as-designed to as-built reconciliation elements"
  ],
  "d": "The entries the as-designed to as-built reconciliation compares for each unit or lot. Design entries, from the released design: (1) part number, with its CAGE code; (2) quantity; (3) next-higher-assembly part number, with its CAGE code; (4) product unit record requirement: serialization, lot or batch control, or both; (5) life limit requirement: none, an age or shelf-life limit, a cycle or usage limit, or both, with the assigned limit; (6) drawing number; and (7) drawing revision level. Build record entries, from the build records: (1) part number, with its CAGE code; (2) part quantity; (3) next-higher-assembly part number, with its CAGE code; (4) product unit record identifiers: serial number, lot or batch number, or both; (5) life limit data: for an age or shelf-life limit, the start date and the expiry date; for a cycle or usage limit, the life consumed; (6) work order (build record) number; (7) work order status; and (8) applicable nonconformances, each with its status. Design entries 1 to 5 reconcile to build record entries 1 to 5, pair by pair. Design entries 6 and 7 name the design revision every comparison runs against. Build record entries 6 to 8 name the record each build entry comes from, and say whether that record is closed. Any disagreement in a pair is a delta. A design entry with no build entry is a delta. A build entry with no design entry is a delta. A work order that is not closed, or an applicable nonconformance that is not dispositioned, is an open item, and the reconciliation of that unit is provisional until it closes."
 },
 {
  "t": "Reconciliation report",
  "alt": [],
  "d": "The recurring per-delivery or per-lot supplier deliverable that reconciles the released design to the build records, entry by entry, by the as-designed to as-built reconciliation elements; states open deltas with disposition, and open work orders and undispositioned nonconformances as open items; and lists incorporated changes with effectivity, expressed in part traceability record identifiers."
 },
 {
  "t": "Reconciliation process documentation",
  "alt": [],
  "d": "The supplier’s documented method for reconciling as-built (or as-maintained) configuration to released design at scale, covering the as-designed to as-built reconciliation elements and the data source for each, comparison method, delta disposition, frequency, and records produced. It names closed work orders and dispositioned nonconformance records as the as-built basis. Capability evidence, submitted once and on revision."
 },
 {
  "t": "Part traceability record",
  "alt": [
   "traceability record"
  ],
  "d": "The supplier deliverable recording, per delivered item: part number with its CAGE code and revision, quantity, and next-higher-assembly part number with its CAGE code; unit identifier, stated as a serial number, a lot or batch number, or both, according to the record structure the statement of work sets for that item, with a date code where a shelf-life or cure-date limit applies; heat numbers where material traceability applies; life-limited designation, identifying each life limit as an age or shelf-life limit, a cycle or usage limit, or both, with the assigned limit; for an age or shelf-life limit, the start date (date code, cure date, or manufacture date) and the expiry date; for a cycle or usage limit, the life consumed at delivery; safety-critical and special handling designations; and traceability to the next higher assembly, with sub-tier part numbers, each with its CAGE code, quantities, and unit identifiers resolved upward the same way, each with its next-higher-assembly part number and CAGE code."
 },
 {
  "t": "Delta",
  "alt": [],
  "d": "A difference the reconciliation finds. Every delta is dispositioned, meaning somebody decides what happens about it."
 },
 {
  "t": "Open item",
  "alt": [],
  "d": "An item that is not yet closed. In a reconciliation, a work order that is not closed, or an applicable nonconformance that is not dispositioned, is an open item, and the reconciliation of that unit is provisional until it closes."
 },
 {
  "t": "Effectiveness determination",
  "alt": [],
  "d": "The recorded judgment of whether a sub-supplier’s CM process meets the requirements imposed on it, expressed as Effective, Conditionally effective, or Ineffective, made over rolling accrued evidence on a defined cadence and on defined triggers."
 },
 {
  "t": "Accrual",
  "alt": [],
  "d": "Logging evidence as it arrives rather than collecting it when somebody asks. Evidence gathered after the question is asked is a reconstruction."
 },
 {
  "t": "Escape",
  "alt": [],

     {

       "882E also defines two terms CM must keep apart. A **Safety-Critical Function** is a function. A **Safety-Critical Item** is hardware or software. A function is not an item, and only the item can go in a CI index. **Section M2-15 carries both definitions word for word** and works out what each one obliges. What you need here is the habit: when a hazard analysis names a function, ask which items implement it.",

     {
      "t": "p",
      "x": "Three modules of identification are behind you. **This is where all of it starts earning its keep.**"
     },
     {
      "t": "p",

      "t": "stmt",
      "x": "A supplier flowdown is a set of CI decisions written into a contract.",
      "sub": "Almost every question the flowdown modules ask you to answer turns on a fact the identification modules produce. If the CI facts are missing, the flowdown still gets written. It just gets written wrong, and the error is discovered at delivery."
     },
     {
      "t": "p",
      "x": "Here is where the dependency actually bites:"

     {
      "t": "list",
      "x": [
       "**What you are buying.** The first question in any flowdown is whether the procured item is a CI, contains one, or is a part inside somebody else’s CI. That answer comes from CI screening. Get it wrong and every requirement downstream is aimed at the wrong thing.",
       "**What goes in the statement of work.** CI identifiers are cited in it. So are the **part attribute designations**: safety-critical, life-limited and special handling. Those are a separate decision from CI selection and they reach parts that are not CIs at all, so a buyer who only knows the CI answer still does not know what to cite.",
       "**What special handling means when you cite it.** An item requires **special handling** where controlled handling, packaging or storage is necessary to keep it conforming. Electrostatic discharge sensitivity, hazardous material content, and limits on temperature, humidity, shock or security classification are the common causes. The handling conditions, including segregation and packaging, are recorded against the lot. **Special handling is not a criticality designation and it is not a serialization driver.** An item can carry special handling and a serial number at once, and the serial number then comes from a different driver.",

        "b": "**Does the CI do what it was required to do, and can you prove it?** The formal audit that verifies the CI’s tested performance against its approved functional and allocated documentation. It also confirms that specifications and interfaces are accurately and adequately defined, and that the change control system genuinely controls the processing and release of documentation. Prerequisite: the Acquirer has already approved the functional and allocated baselines for the item."

       }

      "cols": 2
     },

      "t": "p",
      "x": "The order is not a convention. The physical audit examines a **validated** item, and validation is what the functional audit produces, so a physical audit cannot begin before its functional audit is complete or concurrent. The two may be run as one event where there is high confidence that both sets of requirements will be met within the same timeline."

   {
    "id": "M7-06",
    "gov": [
     "R_AUDIT_DESIGNATION"
    ],
    "title": "Audit designation: how a CI earns an audit",
    "body": [
     {
      "t": "p",
      "x": "Audit obligations hinge on whether a CI is designated for audit. Designation for audit is not a matter of taste, and it is not decided by the supplier’s work type: it is assessed per CI, and it arrives from two directions."
     },
     {
      "t": "cards",
      "x": [
       {
        "h": "Contract designation",
        "b": "The CI is named in the contract, the statement of work, or the CM plan as requiring audit. This includes **every CI whose product baseline the contract has the Acquirer formalize at physical audit completion, whatever its control tier.** For those CIs the audit is the formalizing event, so deferring the audit holds the CI on its initial product baseline."
       },
       {
        "h": "Risk-based designation",
        "b": "For every CI not designated for audit by contract, the program assesses whether an audit is warranted, at initial audit planning, at each CM plan revision, and on any trigger event. Nothing is left unassessed merely because nobody named it."
       }
      ],
      "cols": 2
     },
     {
      "t": "p",
      "x": "A contract designation does not end the assessment. The risk factors below are still walked, because they can **expand** what the audit has to cover: adding a delta audit of open scope, or pulling an increment earlier than planned."
     },
     {
      "t": "p",
      "x": "The assessment has a deliberate shape. It is not a scoring exercise where everything trades against everything. It is a form with four parts. **Parts A and B can each designate a CI for audit on their own. Part C designates on two or more risk factors. Part D says when the whole assessment runs again.**"
     },
     {
      "t": "steps",
      "x": [
       {
        "h": "Part A. Mandatory designation for audit",
        "b": "Two questions. Is the CI identified in the contract, the statement of work, or the CM plan as requiring an audit? Is the CI one whose product baseline the contract has the Acquirer formalize at physical audit completion, whatever its control tier? **Any yes designates the CI for audit** on its own. The remaining parts are still walked, because risk factors can expand what the audit has to cover."
       },
       {
        "h": "Part B. Safety criticality",
        "b": "Five questions. Does the CI implement or host a hazard risk control in the hazard log? Is it a safety-criterion CI under the CI identification process? Does its credible failure consequence sit in the highest two severity categories? Is it safety-critical software, or firmware in a safety-critical device? Is it a single point of failure for a safety-related function? **Any yes designates the CI for both a functional and a physical audit.** There is no concurrence route around it. System Safety signs the assessment. A proposal not to conduct an audit the CI is designated for goes to the safety disposition gate: performed, replaced by a validated equivalent control, or formally risk-accepted."
       },
       {
        "h": "Part C. Risk factors. Nine of them, and two or more designate for audit",
        "b": "**C1** new or novel design rather than proven heritage. **C2** substantive design change since the last audit. **C3** new or changed manufacturing source, process, facility or tooling. **C4** new or changed supplier or sub-tier for the CI or its critical components. **C5** history of quality escapes, nonconformances, foreign object findings or subcontractor disclosures. **C6** findings of work performed not in accordance with approved data, or of inaccurate, incomplete or ambiguous manufacturing data, recorded against the CI. **C7** status accounting reconciliation health anomalies: delta aging, unincorporated-change backlog, serial and effectivity discrepancies. **C8** never received an audit, or a prior audit has an open delta or unresolved action items. **C9** a supplier building the CI, or a critical component of it, determined less than effective. **Two or more designate the CI for audit. Exactly one is recorded and monitored.**"

        "h": "Part D. Reassessment triggers. Six of them",
        "b": "A substantive design, process, facility, tooling or supplier change. A new quality escape or safety event traceable to the CI. A status accounting reconciliation anomaly. A hazard log revision adding a risk control to the CI. A configuration management plan revision. **A supplier effectiveness determination of less than effective for a supplier building the CI.** Any one of the six re-runs the whole assessment. Designation for audit is a standing question, not an award-day answer."
       }

     },

      "lab": "Two distinctions inside Part C that are easy to lose",

      "x": "The assessment and its rationale are recorded for every CI evaluated: designated for audit or not.",

var STORE_KEY = (COURSE.storeKey||"training")+"_state";

var TRAINER = (CONFIG.trainerView===true) ||
  (typeof location!=="undefined" && /trainer/i.test((location.hash||"")+(location.search||"")));

(function buildPages(){
  PAGES.push({k:"start", id:"START", nm:"Start here", grp:null});
  for(var i=0;i<MODULES.length;i++){
    var m=MODULES[i];
    if(!m.sections) m.sections=[];
    if(!m.exercises) m.exercises=[];
    for(var j=0;j<m.sections.length;j++){
      PAGES.push({k:"sect", id:m.sections[j].id, nm:m.sections[j].title, grp:m.id, mi:i, si:j});
    }
    if(m.drill && m.drill.length) PAGES.push({k:"drill", id:m.id+"-DR", nm:DRILL.title||"Drill", grp:m.id, mi:i});
    if(m.exercises.length) PAGES.push({k:"ex", id:m.id+"-EX", nm:"Exercises", grp:m.id, mi:i});
  }
  if(GL.length && GLO.page!==false) PAGES.push({k:"gloss", id:"GLOSSARY", nm:"Glossary", grp:null});
  PAGES.push({k:"submit", id:"RESULTS", nm:"Review and send", grp:null});
  if(TRAINER && HAS_SOURCE) PAGES.push({k:"trainer", id:"SOURCE", nm:"Source map", grp:null});
})();

/* ---- guarded browser storage: used only if the browser allows it ---- */
function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ window.localStorage.removeItem(k); return true; }catch(e){ return false; } }

function freshState(){ var o={ name:"", started:new Date().toISOString(), checks:{} }; if(HAS_DRILLS) o.drills={}; o.answers={}; o.seen={}; if(PER_TRAINEE) o.order={}; return o; }
function normalize(o){
  if(HAS_DRILLS && !o.drills) o.drills={};
  if(!o.seen) o.seen={};
  if(PER_TRAINEE && !o.order) o.order={};
  return o;
}

/* ---- clear all: two-step arm so one stray click cannot wipe the record ---- */
var CLEAR_ARMED = false, clearT;
function clearLabel(){ return 'Clear<span class="lng"> all</span>'; }
function disarmClear(){
  CLEAR_ARMED = false;
  clearTimeout(clearT);
  var b = document.getElementById("btnClear");
  if(b){ b.innerHTML = clearLabel(); b.classList.remove("armed"); }
}
function armClear(){
  CLEAR_ARMED = true;
  var b = document.getElementById("btnClear");
  b.innerHTML = "Confirm clear";
  b.classList.add("armed");
  toast("This erases every answer and check. Click Confirm clear to go ahead. The button resets itself in ten seconds.");
  clearTimeout(clearT);
  clearT = setTimeout(disarmClear, 10000);
}
function resetAll(){
  disarmClear();
  STATE = freshState();
  VIEW  = { page:"start" };
  lsDel(STORE_KEY);
  var w = document.getElementById("who");
  if(w) w.value = "";
  draw();
  window.scrollTo({top:0,behavior:"auto"});
  var r = document.getElementById("rail");
  if(r) r.classList.remove("open");
  toast("Cleared. Answers, checks, and the trainee name are gone. You are back at the start.");
}
(function detect(){ AUTOSAVE = !PREVIEW && lsSet(STORE_KEY+"_probe","1"); })();

function autosave(){
  if(!AUTOSAVE) return;
  lsSet(STORE_KEY, JSON.stringify(STATE));
}
function autoload(){
  if(!AUTOSAVE) return false;
  var raw = lsGet(STORE_KEY);
  if(!raw) return false;
  try{ var o=JSON.parse(raw); if(o && o.checks){ STATE=normalize(o); return true; } }catch(e){}
  return false;
}

/* ==========================================================================
   RENDERING HELPERS
   ========================================================================== */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/'/g,"&#39;"); }
function tok(s){ return String(s==null?"":s).replace(/\{trainer\}/g, CONFIG.trainerName||"your trainer").replace(/\{company\}/g, CONFIG.companyName||""); }
function fmt(s){
  return esc(tok(s)).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
}
function plain(s){ return tok(s).replace(/\*\*/g,"").replace(/\*([^*]+)\*/g,"$1"); }

/* ---- option order ----------------------------------------------------------
   Options are authored in a fixed order, with the correct one at check.a. They
   are DISPLAYED in a shuffled order, so the position of the correct answer
   carries no information. The shuffle is deterministic, seeded from the section
   id, so a trainee sees the same order every time. OPTION_SALT is chosen by the
   Training Builder so the correct answer lands evenly across the positions.
   ---------------------------------------------------------------------------- */
if(typeof OPTION_SALT==="undefined") var OPTION_SALT = 0;
function optionOrder(id, n){
  var h = 2166136261;                            // FNV-1a over the section id
  for(var i=0;i<id.length;i++){ h = Math.imul(h ^ id.charCodeAt(i), 16777619); }
  var a = (h ^ OPTION_SALT) >>> 0;
  function rnd(){                                // mulberry32
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a>>>15), 1 | a);
    t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
    return ((t ^ (t>>>14)) >>> 0);
  }
  var idx=[]; for(var k=0;k<n;k++) idx.push(k);
  for(var j=n-1;j>0;j--){                        // Fisher-Yates, seeded
    var r = rnd() % (j+1);
    var t2 = idx[j]; idx[j]=idx[r]; idx[r]=t2;
  }
  return idx;
}
/* Per-trainee order: shuffled once for each trainee, then kept in their
   progress (STATE.order) so it survives Save and Resume. */
function orderFor(id, n){
  if(!STATE.order) STATE.order={};
  var cur=STATE.order[id];
  if(cur && cur.length===n) return cur;
  var a=[], i;
  for(i=0;i<n;i++) a.push(i);
  for(i=a.length-1;i>0;i--){ var k=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[k]; a[k]=t; }
  STATE.order[id]=a;
  autosave();
  return a;
}
function chips(codes){
  if(!codes || !codes.length) return "<span class='chip none'>"+esc(DRILL.noneLabel||"no code").toLowerCase()+"</span>";
  return codes.map(function(c){ return "<span class='chip'>"+esc(c)+"</span>"; }).join("");
}
function block(b){
  if(b.t==="p") return "<p>"+fmt(b.x)+"</p>";
  if(b.t==="list") return "<ul class='pl'>"+b.x.map(function(i){return "<li>"+fmt(i)+"</li>";}).join("")+"</ul>";
  if(b.t==="olist") return "<ol class='ol'>"+b.x.map(function(i){return "<li>"+fmt(i)+"</li>";}).join("")+"</ol>";
  if(b.t==="h") return "<h2 class='sub2'>"+fmt(b.x)+"</h2>";
  if(b.t==="callout") return "<div class='callout "+(b.tone==="teal"?"teal":(b.tone==="bg"?"bg":(b.tone==="amber"?"amb":"")))+"'>"+
      (b.lab?"<div class='lab'>"+esc(tok(b.lab))+"</div>":"")+
      b.x.map(function(i){return "<p>"+fmt(i)+"</p>";}).join("")+"</div>";
  if(b.t==="stmt") return "<div class='stmt'><b>"+fmt(b.x)+"</b>"+(b.sub?"<span>"+fmt(b.sub)+"</span>":"")+"</div>";
  if(b.t==="cards") return "<div class='cards c"+(b.cols||3)+"'>"+b.x.map(function(c){
      return "<div class='card'><h4>"+fmt(c.h)+"</h4><p>"+fmt(c.b)+"</p></div>";}).join("")+"</div>";
  if(b.t==="steps") return "<div class='steps'>"+b.x.map(function(s,i){
      return "<div class='step "+(b.tone||"")+"'><div class='n'>"+(i+1)+"</div><div class='tx'><b>"+fmt(s.h)+"</b><span>"+fmt(s.b)+"</span></div></div>";}).join("")+"</div>";
  if(b.t==="note"){
    var cut=b.x.indexOf(" – ");
    var code=cut>0&&cut<14?b.x.slice(0,cut):"", rest=code?b.x.slice(cut+3):b.x;
    return "<div class='pnote'>"+(code?"<span class='pc'>"+esc(code)+"</span>":"")+"<span>"+esc(rest)+"</span></div>";
  }
  if(b.t==="tree") return "<div class='tree'>"+b.x.map(function(r){
      var pad=(r[0]||0)*22;
      return "<div class='trow'><div class='tn' style='padding-left:"+pad+"px'>"+(r[0]?"<span class='tbar'>└ </span>":"")+
        "<b>"+fmt(r[1])+"</b>"+(r[3]?"<i>"+fmt(r[3])+"</i>":"")+"</div><div class='tc'>"+chips(r[2])+"</div></div>";
    }).join("")+"</div>";
  if(b.t==="table"){
    var th="<tr>"+b.head.map(function(h){return "<th>"+esc(tok(h))+"</th>";}).join("")+"</tr>";
    var tb=b.x.map(function(r){
      return "<tr>"+r.map(function(c,ci){
        var k = (!b.nokey && ci===0 && String(c).length<=10) ? " class='k'" : "";
        return "<td"+k+">"+fmt(c)+"</td>";}).join("")+"</tr>";}).join("");
    return "<div class='tw'><table><thead>"+th+"</thead><tbody>"+tb+"</tbody></table></div>";
  }
  if(b.t==="img"){
    if(!b.src) return "";
    return "<figure class='fig'><img src='"+esc(b.src)+"' alt='"+esc(b.alt||b.cap||"")+"' style='max-width:"+(b.w||100)+"%'>"+
      (b.cap?"<figcaption>"+fmt(b.cap)+"</figcaption>":"")+"</figure>";
  }
  return "";
}
function pageIndex(){
  for(var i=0;i<PAGES.length;i++){
    var p=PAGES[i];
    if(VIEW.page==="start"&&p.k==="start") return i;
    if(VIEW.page==="submit"&&p.k==="submit") return i;
    if(VIEW.page==="gloss"&&p.k==="gloss") return i;
    if(VIEW.page==="trainer"&&p.k==="trainer") return i;
    if(p.k==="sect"&&VIEW.page==="s:"+p.id) return i;
    if(VIEW.page==="d:"+p.grp&&p.k==="drill") return i;
    if(VIEW.page==="x:"+p.grp&&p.k==="ex") return i;
  }
  return 0;
}
function pageKey(p){
  if(p.k==="start") return "start";
  if(p.k==="submit") return "submit";
  if(p.k==="gloss") return "gloss";
  if(p.k==="trainer") return "trainer";
  if(p.k==="drill") return "d:"+p.grp;
  if(p.k==="ex") return "x:"+p.grp;
  return "s:"+p.id;
}

/* ---- completion status ---- */
function sectStatus(id){
  if(STATE.checks[id]) return "done";
  if(STATE.seen[id]) return "work";
  return "";
}
function drillStatus(modId){
  var m=mod(modId), n=0;
  (m.drill||[]).forEach(function(d){ if(STATE.drills[d.id]) n++; });
  if(n===0) return "";
  return n===m.drill.length ? "done" : "work";
}
function exStatus(modId){
  var m = mod(modId), total=0, filled=0;
  m.exercises.forEach(function(x){ x.parts.forEach(function(p){
    total++; var v=STATE.answers[x.id+"."+p.id]; if(v&&v.trim().length>0) filled++;
  });});
  if(filled===0) return "";
  return filled===total ? "done" : "work";
}
function mod(id){ for(var i=0;i<MODULES.length;i++) if(MODULES[i].id===id) return MODULES[i]; return null; }
function hasCheck(s){ return !!(s.check && s.check.q && ((s.check.o && s.check.o.length>1) || (s.check.dec && s.check.dec.blocks && s.check.dec.blocks.length>1))); }

function counts(){
  var totalChecks=0, answered=0, right=0;
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    if(!hasCheck(s)) return;
    totalChecks++;
    var c=STATE.checks[s.id];
    if(c){ answered++; if(c.first===true) right++; }
  });});
  var totalDrill=0, drilled=0, drillRight=0;
  MODULES.forEach(function(m){ (m.drill||[]).forEach(function(d){
    totalDrill++;
    var r=STATE.drills[d.id];
    if(r){ drilled++; if(r.first===true) drillRight++; }
  });});
  var totalParts=0, filledParts=0;
  MODULES.forEach(function(m){ m.exercises.forEach(function(x){ x.parts.forEach(function(p){
    totalParts++; var v=STATE.answers[x.id+"."+p.id]; if(v&&v.trim().length>0) filledParts++;
  });});});
  return {totalChecks:totalChecks, answered:answered, right:right,
          totalDrill:totalDrill, drilled:drilled, drillRight:drillRight,
          totalParts:totalParts, filledParts:filledParts};
}
var DRILL_LC = (DRILL.title||"Drill").toLowerCase();

/* ==========================================================================
   RAIL
   ========================================================================== */
function drawRail(){
  var c=counts();
  var bits=[c.answered+" of "+c.totalChecks+" sections released"];
  if(c.totalDrill) bits.push(c.drilled+" of "+c.totalDrill+" drill lines done");
  if(c.totalParts) bits.push(c.filledParts+" of "+c.totalParts+" exercise answers written");
  var h="<div class='railhead'><h2>Section register</h2><p>"+bits.join(" · ")+"</p></div>";
  h+="<div class='grp'>"+navBtn(PAGES[0])+"</div>";
  MODULES.forEach(function(m){
    h+="<div class='grp'><h3>"+esc(m.label)+": "+esc(m.title)+"</h3>";
    PAGES.forEach(function(p){ if(p.grp===m.id) h+=navBtn(p); });
    h+="</div>";
  });
  h+="<div class='grp'>";
  PAGES.forEach(function(p){ if(p.k==="submit"||p.k==="trainer"||p.k==="gloss") h+=navBtn(p); });
  h+="</div>";
  document.getElementById("rail").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll("#rail .nav"), function(b){
    b.addEventListener("click", function(){ go(b.getAttribute("data-k")); });
  });
}
function navBtn(p){
  var st = p.k==="sect" ? sectStatus(p.id) : (p.k==="ex" ? exStatus(p.grp) : (p.k==="drill" ? drillStatus(p.grp) : ""));
  var cur = pageKey(p)===VIEW.page;
  return "<button class='nav' data-k='"+esc(pageKey(p))+"' aria-current='"+(cur?"true":"false")+"'>"+
    "<span class='dot "+st+"'></span><span class='id'>"+esc(p.id)+"</span><span class='nm'>"+esc(p.nm)+"</span></button>";
}

/* ==========================================================================
   PAGE RENDERERS
   ========================================================================== */
function go(key){
  VIEW.page=key;
  var p=PAGES[pageIndex()];
  if(p.k==="sect") STATE.seen[p.id]=true;
  autosave(); draw();
  window.scrollTo({top:0,behavior:"auto"});
  document.getElementById("rail").classList.remove("open");
}

/* ==========================================================================
   GLOSSARY: terms are underlined where they appear, and show their definition
   when pointed at, focused, or tapped. Set in the Training Builder.
   ========================================================================== */
var GLRE=null, GLCS={}, GLCI={};
function reEsc(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function glKeys(g){ return [g.t].concat(g.alt||[]).map(function(k){ return String(k||"").trim(); }).filter(Boolean); }
function glIsCS(k){ return /[A-Z]/.test(k) && !/[a-z]/.test(k); }
(function glBuild(){
  var keys=[];
  GL.forEach(function(g,i){ glKeys(g).forEach(function(k){ if(glIsCS(k)) GLCS[k]=i; else GLCI[k.toLowerCase()]=i; keys.push(k); }); });
  keys.sort(function(a,b){ return b.length-a.length; });
  if(keys.length){ try{ GLRE=new RegExp("(?<![A-Za-z0-9])("+keys.map(reEsc).join("|")+")(?:e?s)?(?![A-Za-z0-9])","gi"); }catch(e){ GLRE=null; } }
})();
function glFind(txt){ if(Object.prototype.hasOwnProperty.call(GLCS,txt)) return GLCS[txt]; var l=txt.toLowerCase(); if(Object.prototype.hasOwnProperty.call(GLCI,l)) return GLCI[l]; return -1; }
function glSkip(el){
  if(/^(H1|TEXTAREA|INPUT|BUTTON|SCRIPT|STYLE|SELECT|CODE)$/.test(el.tagName)) return true;
  var c=el.classList; if(!c) return false;
  if(c.contains("gl")||c.contains("kick")||c.contains("scale")||c.contains("eyebrow")||c.contains("pager")||c.contains("pnote")||c.contains("codes")||c.contains("mkblock")||c.contains("transmit")||c.contains("legend")) return true;
  if(!GLO.inChecks && c.contains("check")) return true;
  return false;
}
function glApply(root){
  if(!GLRE) return;
  var used={}, nodes=[];
  var tw=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  var n; while((n=tw.nextNode())){
    var p=n.parentNode, skip=false;
    while(p && p!==root){ if(p.nodeType===1 && glSkip(p)){ skip=true; break; } p=p.parentNode; }
    if(!skip && /[A-Za-z]/.test(n.nodeValue)) nodes.push(n);
  }
  nodes.forEach(function(node){
    var t=node.nodeValue, last=0, frag=null, m;
    GLRE.lastIndex=0;
    while((m=GLRE.exec(t))){
      var gi=glFind(m[1]);
      if(gi<0) continue;
      if(GLO.firstOnly!==false){ if(used[gi]) continue; used[gi]=1; }
      if(!frag) frag=document.createDocumentFragment();
      if(m.index>last) frag.appendChild(document.createTextNode(t.slice(last,m.index)));
      var sp=document.createElement("span"); sp.className="gl"; sp.setAttribute("data-g",gi); sp.setAttribute("tabindex","0");
      sp.textContent=m[0]; frag.appendChild(sp);
      last=m.index+m[0].length;
    }
    if(frag){ if(last<t.length) frag.appendChild(document.createTextNode(t.slice(last))); node.parentNode.replaceChild(frag,node); }
  });
}
function glStrings(o, out){
  if(typeof o==="string") out.push(o);
  else if(Array.isArray(o)) o.forEach(function(v){ glStrings(v,out); });
  else if(o && typeof o==="object") for(var k in o){ if(k!=="t"&&k!=="tone"&&k!=="src"&&k!=="cols"&&k!=="id") glStrings(o[k],out); }
  return out;
}
function glWhere(gi){
  var g=GL[gi], ks=glKeys(g), out=[];
  var re; try{ re=new RegExp("(?<![A-Za-z0-9])("+ks.map(reEsc).join("|")+")(?:e?s)?(?![A-Za-z0-9])","gi"); }catch(x){ return out; }
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    var txt=glStrings([s.title, s.lede||"", s.body], []).join("\n"), mm, hit=false;
    re.lastIndex=0; while((mm=re.exec(txt))){ if(glFind(mm[1])===gi){ hit=true; break; } }
    if(hit) out.push(s);
  });});
  return out;
}
function viewGlossary(){
  var list=GL.map(function(g,i){ return {g:g,i:i}; }).sort(function(a,b){ return a.g.t.localeCompare(b.g.t, undefined, {sensitivity:"base"}); });
  var h="<div class='eyebrow'><span class='recid'>GLOSSARY</span><span class='status'>"+list.length+" term"+(list.length===1?"":"s")+"</span></div>"+
    "<h1 class='sect'>Glossary</h1><p class='lede'>Every term this course defines. Where a term appears in a section, it is underlined there too.</p><div class='hr'></div>";
  var letters={}; list.forEach(function(x){ var L=x.g.t.charAt(0).toUpperCase(); if(!/[A-Z]/.test(L)) L="#"; (letters[L]=letters[L]||[]).push(x); });
  var ks=Object.keys(letters).sort();
  if(ks.length>4) h+="<div class='glidx'>"+ks.map(function(L){ return "<a href='#gl-"+L+"' data-gll='"+L+"'>"+L+"</a>"; }).join("")+"</div>";
  ks.forEach(function(L){
    h+="<h2 class='sub2' id='gl-"+L+"'>"+L+"</h2><dl class='gldl'>";
    letters[L].forEach(function(x){
      var w=glWhere(x.i);
      h+="<dt>"+esc(x.g.t)+((x.g.alt&&x.g.alt.length)?"<span>"+esc(x.g.alt.join(" · "))+"</span>":"")+"</dt><dd>"+fmt(x.g.d)+
        (w.length?"<div class='glwhere'>Appears in "+w.map(function(s){ return "<button class='glnav' data-nav='s:"+esc(s.id)+"' title='"+esc(plain(s.title))+"'>"+esc(s.id)+"</button>"; }).join("")+"</div>":"")+"</dd>";
    });
    h+="</dl>";
  });
  return h;
}
function glInit(){
  var tip=document.createElement("div"); tip.id="glTip"; tip.setAttribute("role","tooltip"); document.body.appendChild(tip);
  var cur=null, hideT, shownAt=0;
  function show(el){
    var gi=+el.getAttribute("data-g"); clearTimeout(hideT);
    var g = gi<0 ? {t:"Glossary", d:"Definitions appear here when you point at an underlined word."} : GL[gi]; if(!g) return;
    tip.innerHTML="<b>"+esc(g.t)+"</b>"+((g.alt&&g.alt.length)?"<span class='al'>"+esc(g.alt.join(" · "))+"</span>":"")+"<div>"+fmt(g.d)+"</div>"+
      (GLO.page!==false && gi>=0 ? "<button type='button' class='glgo'>Open the glossary →</button>" : "");
    tip.style.display="block"; if(cur!==el) shownAt=Date.now(); cur=el;
    var r=el.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight, vw=window.innerWidth, vh=window.innerHeight;
    var top = r.bottom+8+th < vh-8 ? r.bottom+8 : Math.max(8, r.top-th-8);
    var left = Math.min(Math.max(8, r.left + r.width/2 - tw/2), vw-tw-8);
    tip.style.top=top+"px"; tip.style.left=left+"px";
  }
  function hide(){ hideT=setTimeout(function(){ tip.style.display="none"; cur=null; }, 150); }
  document.addEventListener("mouseover", function(e){ var el=e.target.closest && e.target.closest(".gl"); if(el) show(el); else if(e.target.closest && e.target.closest("#glTip")) clearTimeout(hideT); });
  document.addEventListener("mouseout", function(e){ var el=e.target.closest && (e.target.closest(".gl")||e.target.closest("#glTip")); if(el) hide(); });
  document.addEventListener("focusin", function(e){ if(e.target.classList && e.target.classList.contains("gl")) show(e.target); });
  document.addEventListener("focusout", function(e){ if(e.target.classList && e.target.classList.contains("gl")) hide(); });
  document.addEventListener("click", function(e){
    var el=e.target.closest && e.target.closest(".gl");
    if(el){ if(cur===el && tip.style.display==="block" && Date.now()-shownAt>400){ tip.style.display="none"; cur=null; } else show(el); return; }
    if(e.target.closest && e.target.closest(".glgo")){ tip.style.display="none"; go("gloss"); return; }
    var L=e.target.getAttribute && e.target.getAttribute("data-gll");
    if(L){ e.preventDefault(); var t=document.getElementById("gl-"+L); if(t) t.scrollIntoView({block:"start",behavior:"smooth"}); return; }
    if(!(e.target.closest && e.target.closest("#glTip"))){ tip.style.display="none"; cur=null; }
  });
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){ tip.style.display="none"; cur=null; }
    if((e.key==="Enter"||e.key===" ") && e.target.classList && e.target.classList.contains("gl")){ e.preventDefault(); show(e.target); }
  });
  window.addEventListener("scroll", function(){ if(cur) tip.style.display="none"; }, true);
}
