<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI Index Builder</title>
<style>
:root{
  --ink:#1E262E; --ink-2:#2C3841; --slate:#5C6D78; --mute:#8998A2;
  --paper:#FFFFFF; --surface:#F4F6F7; --surface-2:#EDF0F1; --rule:#D6DCDF;
  --rust:#A8481F; --rust-soft:#F2E4DD; --rust-ink:#7E340F;
  --teal:#1F5F5B; --teal-soft:#DFEAE8;
  --amber:#9A6508; --amber-soft:#F6ECD8;
  --alert:#8E2F2F; --alert-soft:#F4E2E2;
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--surface);font-size:14px;line-height:1.5;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
.top{background:var(--ink);color:#fff;padding:11px 18px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.top b{font-family:var(--serif);font-size:16px}
.top span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#93A2AB}
.bar{background:var(--paper);border-bottom:1px solid var(--rule);padding:8px 18px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:4px;padding:7px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible,.lnk:focus-visible,.nav button:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.btn.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.pri:hover{background:var(--rust-ink)}
.btn.gh{background:transparent;color:var(--slate)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.sep{width:1px;height:22px;background:var(--rule);margin:0 4px}
#msg{font-size:12px;color:var(--slate);flex:1;min-width:160px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:3px;border:1px solid var(--rule);background:var(--surface-2);color:var(--slate);white-space:nowrap}
.chip.bad{background:var(--alert-soft);color:var(--alert);border-color:#E0BFBF}
.chip.hold{background:var(--amber-soft);color:var(--amber);border-color:#E4D3AF}
.chip.ok{background:var(--teal-soft);color:var(--teal);border-color:#BFD6D2}
button.chip{cursor:pointer}

.main{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr)}
.main.l-below{grid-template-columns:200px minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.main.l-below .pv{grid-column:1/-1}
.main.l-editor{grid-template-columns:200px minmax(0,1fr)}
.main.l-editor .pv{display:none}
.main.l-preview{grid-template-columns:minmax(0,1fr)}
.main.l-preview .nav,.main.l-preview .ed{display:none}
.nav{background:var(--paper);border-right:1px solid var(--rule);overflow:auto;padding:12px 0}
.nav .h{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);font-weight:700;padding:10px 16px 4px}
.nav button{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:none;text-align:left;padding:7px 16px;font-size:13px;color:var(--ink-2);border-left:3px solid transparent}
.nav button:hover{background:var(--surface)}
.nav button.on{background:var(--rust-soft);border-left-color:var(--rust);color:var(--rust-ink);font-weight:600}
.nav .n{font-family:var(--mono);font-size:10px;color:var(--mute)}
.nav .n.e{color:var(--alert);font-weight:700}
.ed{overflow:auto;padding:18px 22px 60px}
.pv{display:flex;flex-direction:column;border-left:1px solid var(--rule);background:#E6EAEC;min-height:0}
.pvbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 10px;background:var(--paper);border-bottom:1px solid var(--rule);font-size:12px}
.pvbar label{display:flex;gap:5px;align-items:center;color:var(--ink-2)}
.pvbar select{padding:3px 5px;border:1px solid var(--rule);border-radius:3px;background:var(--paper)}
.pvbar .lab{margin:0}
.pvwrap{flex:1;min-height:0;display:flex;justify-content:center;overflow:auto}
.pvwrap iframe{border:0;background:#fff;width:100%;height:100%}
.pvwrap.phone{padding:14px 0}
.pvwrap.phone iframe{width:390px;height:100%;border:1px solid var(--rule);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}

h1{font-family:var(--serif);font-size:24px;font-weight:400;margin:0 0 4px;line-height:1.2}
.lede{font-size:13.5px;color:var(--slate);margin:0 0 16px;max-width:76ch}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:8px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;margin:0 0 14px}
.card.sel{border-left:3px solid var(--rust)}
.small{font-size:12.5px;color:var(--slate);max-width:80ch;margin:0}
.small+.small{margin-top:6px}
.hl{border:0;background:none;padding:0;font-size:12.5px;font-weight:600;color:var(--rust-ink);text-decoration:underline;text-underline-offset:3px;margin-left:6px}
.lnk{border:0;background:none;padding:2px 0;font-size:12.5px;font-weight:600;color:var(--slate);text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--rust)}
.lnk.del{color:var(--alert)}
.lnk[disabled]{color:var(--mute);text-decoration:none;cursor:not-allowed}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fg .w{grid-column:1/-1}
.fld label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700;margin-bottom:4px}
.fld input:not([type=checkbox]):not([type=color]),.fld select,.fld textarea,table.t input:not([type=checkbox]),table.t select{width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);line-height:1.4}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,table.t input:focus,table.t select:focus{outline:2px solid var(--rust);outline-offset:1px}
.fld .help{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.45}
.ck{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer}
.fld label.ck{font-family:var(--sans);font-size:13px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink-2);margin-bottom:0}
.ck input{margin:0;accent-color:var(--rust)}
.ro{font-family:var(--mono);font-size:12px;padding:6px 8px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;color:var(--slate)}

.crow{display:grid;grid-template-columns:52px 1fr 110px 150px 90px auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--surface-2);cursor:pointer;font-size:13px}
.crow:hover{background:var(--surface)}
.crow.open{background:var(--rust-soft)}
.crow .ttl{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .k{font-family:var(--mono);font-size:10.5px;color:var(--mute);font-weight:400;margin-left:6px}
.crow .m{font-size:12px;color:var(--slate);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv{display:flex;gap:2px}
.mv button{border:1px solid var(--rule);background:var(--paper);border-radius:3px;width:22px;height:22px;font-size:10px;color:var(--slate);padding:0}
.mv button:hover{border-color:var(--slate)}
.mv button[disabled]{opacity:.3;cursor:default}
.bd{font-family:var(--mono);font-size:9px;letter-spacing:.05em;font-weight:700;padding:1px 5px;border-radius:3px;border:1px solid var(--rule);color:var(--slate);background:var(--surface-2);white-space:nowrap}
.bd.core{background:var(--ink-2);color:#fff;border-color:var(--ink-2)}
.bd.bi{background:var(--teal-soft);color:var(--teal);border-color:#BFD6D2}
.bd.cu{background:var(--rust-soft);color:var(--rust-ink);border-color:#E3CCC2}
.bd.req{background:var(--amber-soft);color:var(--amber);border-color:#E4D3AF}
.cedit{padding:14px 12px 16px;border-top:1px solid var(--rule);background:#FCFCFC}
.note{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:9px 12px;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.note.warn{background:var(--amber-soft);border-color:#E4D3AF}
.note.err{background:var(--alert-soft);border-color:#E0BFBF;color:var(--alert)}
.addrow{display:grid;grid-template-columns:1fr 160px 200px auto;gap:8px;align-items:end;margin-top:12px;padding-top:12px;border-top:1px dashed var(--rule)}

table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);font-weight:700;padding:7px 6px;border-bottom:2px solid var(--rule);background:var(--surface-2);white-space:nowrap}
table.t td{padding:5px 6px;border-top:1px solid var(--surface-2);vertical-align:middle}
table.t td.k{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--rust-ink);white-space:nowrap}
table.t td.mm{font-size:11.5px;color:var(--slate)}
table.t tr.off td{opacity:.55}
.sev{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap}
.sev.error{background:var(--alert-soft);color:var(--alert)}
.sev.warn{background:var(--amber-soft);color:var(--amber)}
.sev.info{background:var(--surface-2);color:var(--slate)}
.sentence{font-family:var(--serif);font-size:15px;color:var(--ink-2);background:var(--surface);border-left:3px solid var(--rust);padding:8px 12px;margin:10px 0 0}
.rulegrid{display:grid;grid-template-columns:70px 170px 1fr;gap:8px;align-items:center;margin-top:8px}
.rulegrid .lw{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);font-weight:700}
.rulegrid select,.rulegrid input{width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.swatch{display:inline-block;width:28px;height:28px;border-radius:4px;border:1px solid var(--rule);vertical-align:middle}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:10px 12px}
.stat .v{font-family:var(--serif);font-size:24px}
.stat .t{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700}

/* help panel */
.help-ov{position:fixed;inset:0;background:rgba(20,26,31,.35);z-index:50;display:none}
.help-ov.on{display:block}
.helpp{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--paper);z-index:51;box-shadow:-4px 0 20px rgba(0,0,0,.15);display:none;flex-direction:column}
.helpp.on{display:flex}
.helpp .hh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.helpp .hh b{font-family:var(--serif);font-size:18px;font-weight:400;flex:1}
.helpp .hs{padding:10px 16px;border-bottom:1px solid var(--rule)}
.helpp .hs input{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:4px}
.helpp .hb{flex:1;overflow:auto;display:grid;grid-template-columns:170px 1fr}
.helpp .ht{border-right:1px solid var(--rule);padding:8px 0;overflow:auto}
.helpp .ht button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 14px;font-size:12.5px;color:var(--ink-2);border-left:3px solid transparent}
.helpp .ht button.on{background:var(--rust-soft);border-left-color:var(--rust);color:var(--rust-ink);font-weight:600}
.helpp .hc{padding:14px 18px 40px;overflow:auto}
.helpp .hc h2{font-family:var(--serif);font-size:20px;font-weight:400;margin:0 0 10px}
.helpp .hc p{font-size:13.5px;color:var(--ink-2);margin:0 0 10px;max-width:62ch}
.helpp .hc ul{margin:0 0 10px;padding-left:18px}
.helpp .hc li{font-size:13.5px;color:var(--ink-2);margin-bottom:6px}
.helpp .hc .ex{background:var(--surface);border-left:3px solid var(--rust);padding:8px 12px;font-size:13px;margin:0 0 10px}
mark{background:#FBE9A6;padding:0 1px}
@media(max-width:1100px){
  .main{grid-template-columns:170px minmax(0,1fr)}
  .main .pv{grid-column:1/-1;min-height:70vh}
  .crow{grid-template-columns:52px 1fr 90px auto}
  .crow .hide-s{display:none}
}
@media(max-width:700px){
  .main,.main.l-editor{grid-template-columns:1fr}
  .nav{display:flex;overflow:auto;padding:0;border-right:0;border-bottom:1px solid var(--rule)}
  .nav .h{display:none}
  .nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;width:auto}
  .nav button.on{border-bottom-color:var(--rust)}
  .fg,.stats,.addrow{grid-template-columns:1fr}
  .helpp .hb{grid-template-columns:1fr}
  .helpp .ht{display:none}
}
</style>
</head>
<body>
<div class="top"><b>CI Index Builder</b><span>Configuration Management &middot; Tool builder &middot; Rev C draft</span></div>
<div class="bar">
  <button class="btn pri" data-act="save">Save build</button>
  <button class="btn" data-act="open">Open build</button>
  <button class="btn pri" data-act="export">Export tool</button>
  <span class="sep"></span>
  <button class="btn" data-act="undo" id="b-undo" title="Undo">Undo</button>
  <button class="btn" data-act="redo" id="b-redo" title="Redo">Redo</button>
  <button class="btn gh" data-act="reset">Start over</button>
  <span class="sep"></span>
  <button class="btn" data-act="help">Help</button>
  <span id="vchip"></span>
  <span class="chip ok" id="dirty">Saved</span>
  <span id="msg" role="status" aria-live="polite"></span>
</div>
<input type="file" id="f-open" accept=".json,.html,.htm,application/json,text/html" style="display:none">

<div class="main" id="main">
  <nav class="nav" id="nav" aria-label="Builder sections"></nav>
  <div class="ed" id="ed"></div>
  <div class="pv" id="pv">
    <div class="pvbar">
      <span class="lab">Preview</span>
      <button class="btn sm" data-act="pv-refresh">Refresh</button>
      <label><input type="checkbox" id="pv-auto" checked> Auto</label>
      <label><input type="checkbox" id="pv-keep" checked> Keep my entries</label>
      <label>Start from <select id="pv-mode"><option value="examples">Example rows</option><option value="empty">Empty index</option></select></label>
      <label>Width <select id="pv-width"><option value="full">Full</option><option value="phone">Phone</option></select></label>
      <label>Layout <select id="pv-layout"><option value="side">Side by side</option><option value="below">Preview below</option><option value="editor">Editor only</option><option value="preview">Preview only</option></select></label>
      <button class="btn sm gh" data-act="pv-pop">Pop out</button>
    </div>
    <div class="pvwrap" id="pvwrap"><iframe id="pvf" title="Tool preview" sandbox="allow-scripts allow-modals allow-downloads allow-forms allow-popups"></iframe></div>
  </div>
</div>

<div class="help-ov" id="help-ov" data-act="help-close"></div>
<aside class="helpp" id="helpp" aria-label="Help">
  <div class="hh"><b>Help</b><button class="btn sm gh" data-act="help-close">Close</button></div>
  <div class="hs"><input id="help-q" placeholder="Search help" aria-label="Search help"></div>
  <div class="hb"><div class="ht" id="help-toc"></div><div class="hc" id="help-body"></div></div>
</aside>

<script>

ransform:uppercase;font-weight:700;text-align:left;padding:7px 8px;vertical-align:bottom;z-index:2;min-width:70px;max-width:180px;white-space:normal;line-height:1.3}\ntable.g td{padding:5px 8px;border-bottom:1px solid var(--rule);border-right:1px solid var(--surface-2);vertical-align:top;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;background:var(--paper);cursor:pointer}\ntable.g th.s0,table.g td.s0{position:sticky;left:0;z-index:1;min-width:44px;width:44px}\ntable.g th.s1,table.g td.s1{position:sticky;left:44px;z-index:1;min-width:84px;border-right:2px solid var(--rule)}\ntable.g th.s0,table.g th.s1{z-index:3}\ntable.g td.s1{font-family:var(--mono);font-weight:700;color:var(--rust-ink)}\ntable.g tr:hover td{background:var(--surface)}\ntable.g td.x-flag{background:var(--alert-soft)!important;color:var(--alert)}\ntable.g td.x-review{background:var(--amber-soft)!important}\ntable.g tr.ret td{color:var(--mute)}\n.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}\n.filters .fld{min-width:160px}\n.filters label.ck{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2);padding-bottom:8px}\ntable.dt{border-collapse:collapse;width:100%;font-size:13px;background:var(--paper)}\ntable.dt th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--rule);background:var(--surface-2)}\ntable.dt td{padding:7px 10px;border-top:1px solid var(--rule);color:var(--ink-2);vertical-align:top}\ntable.dt td.k{font-family:var(--mono);font-size:12px;color:var(--rust-ink);font-weight:700;white-space:nowrap}\ntable.dt td.m{font-size:12px;color:var(--slate)}\ntable.dt input,table.dt select{width:100%;padding:5px 7px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);font-size:12.5px}\ntable.dt input:focus,table.dt select:focus{outline:2px solid var(--rust);outline-offset:1px}\ntable.dt td.x-flag input,table.dt td.x-flag select{border-color:var(--alert);background:#FBF4F4}\ntable.dt td.x-review input,table.dt td.x-review select{border-color:var(--amber);background:#FCF8EF}\n.sev{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap}\n.sev.flag{background:var(--alert-soft);color:var(--alert)}\n.sev.review{background:var(--amber-soft);color:var(--amber)}\n.sev.note{background:var(--surface-2);color:var(--slate)}\n.cibtn{border:0;background:none;padding:0;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--rust-ink);text-decoration:underline;text-underline-offset:2px}\n\n/* overview */\n.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}\n.tile{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}\n.tile .v{font-family:var(--serif);font-size:32px;line-height:1.1}\n.tile .t{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700;margin-bottom:4px}\n.tile .s{font-size:12px;color:var(--mute);margin-top:4px}\n.tile.alert{border-left:3px solid var(--alert)}\n.tile.amb{border-left:3px solid var(--amber)}\n.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}\n.todo{margin:0;padding:0;list-style:none}\n.todo li{padding:9px 0;border-top:1px solid var(--surface-2);font-size:13.5px;color:var(--ink-2);display:flex;gap:10px;align-items:baseline}\n.todo li:first-child{border-top:0}\n.todo li .sev{flex:none}\n.sbar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--surface-2);margin:4px 0 2px}\n.sbar span{display:block;height:100%}\n.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--slate);margin:8px 0 0}\n.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}\n.brow{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-2);margin:6px 0}\n.brow .n{text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--slate)}\n.empty{text-align:center;padding:40px 20px}\n.empty h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 6px}\n.empty .btnrow{justify-content:center}\n.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px}\n.ref h3{font-family:var(--serif);font-size:18px;font-weight:400;margin:22px 0 8px}\n.ref ul{margin:0;padding-left:18px}\n.ref li{font-size:13px;color:var(--ink-2);margin-bottom:6px;max-width:84ch}\n.ref li b{color:var(--ink)}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}\n.foot{font-size:12.5px;color:var(--slate);border-top:1px solid var(--rule);padding-top:14px;margin-top:30px}\n.foot p{margin:0 0 7px}\n\n@media(max-width:980px){\n  .split{grid-template-columns:1fr}\n  .treebox{position:static;max-height:46vh}\n  .tiles,.grid4{grid-template-columns:1fr 1fr}\n  .cols2{grid-template-columns:1fr}\n}\n@media(max-width:640px){\n  .fgrid,.tiles,.grid4{grid-template-columns:1fr}\n}\n@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n@media print{\n  .top,.bar,.tabs,.acts,.treehead,.btnrow{display:none}\n  body{background:#fff;font-size:11pt}\n  .treebox{position:static;max-height:none;overflow:visible}\n  .gridwrap{max-height:none;overflow:visible}\n}\n\u003c/style>\n\u003cstyle>\n.prevbar{background:var(--amber-soft);color:var(--amber);border-bottom:1px solid #E4D3AF;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:6px 20px}\n.ref .chg td{font-size:12.5px}\n.minlist{margin:0 0 8px;padding-left:20px;font-size:13px;color:var(--ink-2)}\n.minlist li{margin-bottom:4px}\n.cmap code,.sect code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:0 4px;border-radius:3px}\n.pill{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:10px;border:1px solid var(--rule);background:var(--surface-2);color:var(--slate);white-space:nowrap}\n.pill.ok{background:var(--teal-soft);color:var(--teal);border-color:#BFD6D2}\n.pill.bad{background:var(--alert-soft);color:var(--alert);border-color:#E0BFBF}\n.pill.hold{background:var(--amber-soft);color:var(--amber);border-color:#E4D3AF}\n.pill.off{background:transparent;color:var(--mute);border-style:dashed}\ntable.cmap td{font-size:12.5px}\ntable.cmap tr.notdue td{background:var(--surface)}\n.heldbox{background:var(--surface-2);border:1px solid var(--rule);border-radius:5px;padding:9px 12px;font-size:12.5px;color:var(--ink-2);margin:0 0 12px}\n.stagerow{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-top:12px}\n.stagerow .fld{min-width:240px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"prevbar\" id=\"prevbar\" style=\"display:none\">Preview. Files you save here come from the build under test.\u003c/div>\n\u003cdiv class=\"top\">\u003cb id=\"t-top\">CI Index\u003c/b>\u003cspan id=\"t-sub\">\u003c/span>\u003c/div>\n\u003cdiv class=\"wrap\">\n\u003ch1 id=\"t-h1\">\u003c/h1>\n\u003cp class=\"lede\" id=\"t-lede\">\u003c/p>\n\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"lab\">Index\u003c/div>\n  \u003cdiv class=\"grid4\">\n    \u003cdiv class=\"fld\">\u003clabel for=\"m-prog\">Program\u003c/label>\u003cinput id=\"m-prog\" data-m=\"prog\">\u003c/div>\n    \u003cdiv class=\"fld\">\u003clabel for=\"m-doc\">Index document number\u003c/label>\u003cinput id=\"m-doc\" data-m=\"doc\">\u003c/div>\n    \u003cdiv class=\"fld\">\u003clabel for=\"m-rev\">Revision\u003c/label>\u003cinput id=\"m-rev\" data-m=\"rev\">\u003c/div>\n    \u003cdiv class=\"fld\">\u003clabel for=\"m-who\">Your name, for the edit log\u003c/label>\u003cinput id=\"m-who\" data-m=\"who\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"stagerow\" id=\"stagerow\">\u003cdiv class=\"fld\">\u003clabel for=\"m-stage\">Index stage\u003c/label>\u003cselect id=\"m-stage\" data-m=\"stage\">\u003c/select>\u003c/div>\u003cp class=\"small\" id=\"stagehelp\" style=\"flex:1;margin:0 0 6px\">\u003c/p>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"bar\" id=\"bar\">\n  \u003cbutton class=\"btn pri\" data-act=\"save\">Save index\u003c/button>\n  \u003cbutton class=\"btn\" data-act=\"open\">Open saved index\u003c/button>\n  \u003cbutton class=\"btn\" data-act=\"xlsx\">Export to Excel\u003c/button>\n  \u003cbutton class=\"btn\" data-act=\"import\">Import Excel workbook\u003c/button>\n  \u003cbutton class=\"btn gh\" data-act=\"clear\">Clear\u003c/button>\n  \u003cspan class=\"dirty n\" id=\"dirty\">Saved\u003c/span>\n  \u003cspan id=\"msg\" role=\"status\" aria-live=\"polite\">\u003c/span>\n\u003c/div>\n\u003cinput type=\"file\" id=\"f-json\" accept=\"application/json,.json\" style=\"display:none\">\n\u003cinput type=\"file\" id=\"f-xlsx\" accept=\".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\" style=\"display:none\">\n\u003cinput type=\"file\" id=\"f-cmp\" accept=\"application/json,.json\" style=\"display:none\">\n\n\u003cdiv class=\"tally\" id=\"tally\">\u003c/div>\n\u003cdiv class=\"tabs\" id=\"tabs\" role=\"tablist\">\u003c/div>\n\u003cdiv id=\"view\">\u003c/div>\n\u003cdiv id=\"dls\">\u003c/div>\n\u003cdatalist id=\"dl-pin\">\u003c/datalist>\n\n\u003cdiv class=\"foot\" id=\"t-foot\">\u003c/div>\n\u003c/div>\n\n\u003cscript>\n/* ===================================================================\n   Build block. The CI Index Builder writes this. Everything the tool\n   shows and checks reads from it.\n   =================================================================== */\nvar CONFIG=/*CFG>*/null/*\u003cCFG*/;\nvar PREVIEW=/*PRV>*/null/*\u003cPRV*/;\nvar TOOL='ci-index', ENGINE_REV='D';\nvar C=CONFIG, FBL_NA='N/A (system-level baseline)';\n\nvar COLS=C.cols, COL={}; COLS.forEach(function(c){ COL[c.k]=c; });\nfunction has(k){ return !!COL[k]; }\nfunction hd(k){ return COL[k]?COL[k].h:k; }\nvar VCOLS=C.vcols, VCOLK={}; VCOLS.forEach(function(c){ VCOLK[c.k]=c; });\nfunction VC(k){ return VCOLK[k]?VCOLK[k].h:k; }\nvar LISTS={yn:['Y','N']}, LITEMS={};\nObject.keys(C.lists).forEach(function(n){ LITEMS[n]=C.lists[n].items; LISTS[n]=C.lists[n].items.map(function(i){ return i.v; }); });\nfunction lab(n,m){ var it=(LITEMS[n]||[]).filter(function(i){ return i.m===m; })[0]; return it?it.v:null; }\nfunction abbr(n,v){ var it=(LITEMS[n]||[]).filter(function(i){ return i.v===v; })[0]; return it&&it.ab?it.ab:String(v||'').slice(0,4).toUpperCase(); }\nvar ST={active:lab('status','active'),proposed:lab('status','proposed'),dedes:lab('status','dedes'),split:lab('status','split'),cons:lab('status','cons')};\nvar RET={}; (LITEMS.status||[]).forEach(function(i){ if(i.ret) RET[i.v]=1; });\nvar TIER={acq:lab('tier','acq'),co:lab('tier','co'),gfe:lab('tier','gfe')};\nvar SWT={}; (LITEMS.type||[]).forEach(function(i){ if(i.sw) SWT[i.v]=1; });\nvar LIFE={cycle:lab('life','cycle'),age:lab('life','age'),both:lab('life','both'),none:lab('life','none')};\n\nvar SRC_LIST=C.sources.map(function(s){ return [s.name,s.d,s.c1?1:0,s.role||'']; });\nvar SRC={}; SRC_LIST.forEach(function(s){ SRC[s[0].toLowerCase()]={name:s[0],d:s[1],c1:!!s[2],role:s[3]}; });\nfunction srcInfo(s){ return SRC[String(s||'').trim().toLowerCase()]; }\nfunction canon(s){ var i=srcInfo(s); return i?i.name:String(s||'').trim(); }\nfunction drivesSerial(s){ var i=srcInfo(s); return !!i&&(i.d==='Serial'||i.d==='Both'); }\nfunction drivesLot(s){ var i=srcInfo(s); return !!i&&(i.d==='Lot/batch'||i.d==='Both'); }\nfunction isC1(s){ var i=srcInfo(s); return !!i&&i.c1; }\nfunction isRole(s,role){ var i=srcInfo(s); return !!i&&i.role===role; }\n\nvar OPS={is:'is',isnot:'is not',blank:'is blank',notblank:'is not blank',contains:'contains',notcontains:'does not contain',oneof:'is one of',always:'always'};\nvar THENW={notblank:'must not be blank',blank:'must be blank',is:'must be',isnot:'must not be',contains:'must contain',notcontains:'must not contain',oneof:'must be one of'};\nvar RULES=C.rules, CUST={};\n(C.custom||[]).forEach(function(c){ CUST[c.id]={on:c.on,sev:c.sev,area:'Custom',what:c.what||autoWhat(c),basis:c.basis||'Build settings',needs:[c.ifCol,c.thenCol].filter(function(k){ return k&&k!=='*'; })}; });\nvar RQ={on:true,sev:'review',area:'Required',what:'A column the build marks as required is filled.',basis:'Build settings',needs:[]};\nfunction ruleInfo(id){ return RULES[id]||CUST[id]||(id==='RQ'?RQ:null); }\nfunction ruleOn(id){ var r=ruleInfo(id); return !!r&&!!r.on&&(r.needs||[]).every(has); }\nvar FEAT=C.features;\nfunction autoWhat(c){\n  var h=function(k){ return (C.cols.filter(function(x){ return x.k===k; })[0]||{}).h||k; };\n  return (c.ifOp==='always'?'':'Where '+h(c.ifCol)+' '+OPS[c.ifOp]+(/blank|always/.test(c.ifOp)?'':' '+c.ifVal)+', ')+h(c.thenCol)+' '+THENW[c.thenOp]+(/blank/.test(c.thenOp)?'':' '+c.thenVal)+'.';\n}\n\n/* ===================================================================\n   State\n   =================================================================== */\nvar S=fresh();\nfunction fresh(){\n  return { meta:{prog:'',doc:'',rev:'',who:'',stage:''}, cis:[], vars:[], log:[], cmp:null, imp:null,\n    tab:'overview', sel:null, col:{}, showRet:true,\n    filt:{q:'',status:'',tier:'',only:false}, csev:'', logq:'',\n    panel:null, sp:[{id:'',name:''},{id:'',name:''}], cons:{pick:{},id:'',name:''},\n    dirty:false, focusVal:null };\n}\nvar F=[], FI={}, FV={}, T=null, CNT={flag:0,review:0,note:0};\nvar $=function(id){ return document.getElementById(id); };\nvar UIDN=0;\nfunction uid(){ UIDN++; return 'u'+Date.now().toString(36)+UIDN.toString(36); }\nfunction esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/\u003c/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }\nfunction md(s){ return esc(s).replace(/\\*\\*(.+?)\\*\\*/g,'\u003cb>$1\u003c/b>'); }\nfunction tr(s){ return String(s==null?'':s).trim(); }\nfunction isNA(v){ return /^n\\/?a\\b/i.test(tr(v)); }\nfunction splitIds(s){ return String(s||'').split(/[;,]/).map(tr).filter(Boolean); }\nfunction live(r){ return !RET[r.status]; }\nfunction isGFE(r){ return !!TIER.gfe&&r.tier===TIER.gfe; }\nfunction isSW(r){ return !!SWT[r.type]; }\nfunction isSup(r){ return r.status&&(r.status===ST.split||r.status===ST.cons); }\nfunction pad(n){ return String(n).padStart(2,'0'); }\nfunction today(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }\nfunction stamp(){ var d=new Date(); return today()+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }\nfunction slug(s){ return String(s||'program').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'program'; }\nfunction stem(){ return slug(C.text.stem||'CI-Index'); }\nfunction srcText(r){ return (r.src||[]).join('; '); }\nfunction val(r,k){ return k==='src'?srcText(r):tr(r[k]); }\nfunction blankRow(){ var r={uid:uid(),src:[]}; COLS.forEach(function(c){ if(c.kind!=='level'&&c.k!=='src') r[c.k]=''; }); return r; }\nfunction blankVar(){ var v={uid:uid()}; VCOLS.forEach(function(c){ v[c.k]=''; }); return v; }\nfunction cur(){ return S.sel&&T&&T.byUid[S.sel]; }\nfunction msg(t){ $('msg').textContent=t||''; }\nfunction dirty(){ S.dirty=true; var d=$('dirty'); d.className='dirty y'; d.textContent='Unsaved changes'; }\nfunction clean(){ S.dirty=false; var d=$('dirty'); d.className='dirty n'; d.textContent='Saved'; }\nfunction logEdit(ci,k,from,to,act){\n  S.log.push({t:stamp(), who:S.meta.who||'', ci:ci||'', f:k?hd(k):'', from:from==null?'':String(from), to:to==null?'':String(to), act:act||'Edit'});\n}\n\n/* ===================================================================\n   Theme and text\n   =================================================================== */\nfunction hex(h){ h=String(h||'').replace('#',''); if(h.length===3) h=h.split('').map(function(c){ return c+c; }).join(''); var n=parseInt(h,16); return isNaN(n)?null:[(n>>16)&255,(n>>8)&255,n&255]; }\nfunction mix(a,b,t){ return '#'+a.map(function(x,i){ return Math.round(x+(b[i]-x)*t).toString(16).padStart(2,'0'); }).join(''); }\nfunction applyText(){\n  var th=C.theme||{}, a=hex(th.accent), k=hex(th.ink), css=':root{';\n  if(a) css+='--rust:'+mix(a,a,0)+';--rust-ink:'+mix(a,[0,0,0],0.25)+';--rust-soft:'+mix(a,[255,255,255],0.85)+';';\n  if(k) css+='--ink:'+mix(k,k,0)+';--ink-2:'+mix(k,[255,255,255],0.08)+';';\n  var st=document.createElement('style'); st.textContent=css+'}'; document.head.appendChild(st);\n  var t=C.text||{};\n  document.title=t.title||'CI Index';\n  $('t-top').textContent=t.top||''; $('t-sub').textContent=t.sub||'';\n  $('t-h1').textContent=t.h1||''; $('t-lede').textContent=t.lede||'';\n  $('t-foot').innerHTML=(t.foot||[]).map(function(p){ return '\u003cp>'+md(p)+'\u003c/p>'; }).join('');\n  if(PREVIEW) $('prevbar').style.display='block';\n}\n\n/* ===================================================================\n   Hierarchy\n   =================================================================== */\nfunction buildTree(){\n  var ids={}, kids={}, roots=[], byUid={};\n  S.cis.forEach(function(r){ byUid[r.uid]=r; if(r.id) (ids[r.id]=ids[r.id]||[]).push(r); });\n  S.cis.forEach(function(r){\n    if(!r.parent) roots.push(r);\n    else if(ids[r.parent]&&ids[r.parent][0]!==r){ var p=ids[r.parent][0]; (kids[p.uid]=kids[p.uid]||[]).push(r); }\n  });\n  var order=[], lvl={}, seen={};\n  function walk(r,d){ if(seen[r.uid]) return; seen[r.uid]=1; lvl[r.uid]=d; order.push(r); (kids[r.uid]||[]).forEach(function(c){ walk(c,d+1); }); }\n  roots.forEach(function(r){ walk(r,0); });\n  var unplaced=S.cis.filter(function(r){ return !seen[r.uid]; });\n  var cyc={}, orphan={};\n  unplaced.forEach(function(r){\n    if(r.parent&&!ids[r.parent]) { orphan[r.uid]=1; return; }\n    if(r.parent===r.id){ cyc[r.uid]=1; return; }\n    var x=r, hop={}, n=0;\n    while(x&&x.parent&&ids[x.parent]&&n\u003c10000){ if(hop[x.uid]){ cyc[r.uid]=1; break; } hop[x.uid]=1; x=ids[x.parent][0]; n++; }\n  });\n  T={ids:ids,kids:kids,roots:roots,order:order,lvl:lvl,unplaced:unplaced,cyc:cyc,orphan:orphan,byUid:byUid};\n  return T;\n}\nfunction parentOf(r){ return r.parent&&T.ids[r.parent]?T.ids[r.parent][0]:null; }\nfunction ancestors(r){ var a=[], x=parentOf(r), n=0; while(x&&n\u003c500){ if(x===r||a.indexOf(x)>=0) break; a.push(x); x=parentOf(x); n++; } return a; }\nfunction descendants(r){ var out=[], st=(T.kids[r.uid]||[]).slice(); while(st.length){ var x=st.shift(); if(out.indexOf(x)>=0) continue; out.push(x); st=st.concat(T.kids[x.uid]||[]); } return out; }\nfunction liveKids(r){ return (T.kids[r.uid]||[]).filter(live); }\nfunction exportOrder(){ return T.order.concat(T.unplaced); }\n\n/* ===================================================================\n   Checks\n   =================================================================== */\nfunction cond(v,op,x){\n  v=tr(v).toLowerCase(); var s=String(x==null?'':x).trim().toLowerCase();\n  switch(op){\n    case 'always': return true;\n    case 'is': return v===s;\n    case 'isnot': return v!==s;\n    case 'blank': return !v;\n    case 'notblank': return !!v;\n    case 'contains': return v.indexOf(s)>=0;\n    case 'notcontains': return v.indexOf(s)\u003c0;\n    case 'oneof': return s.split(',').map(function(y){ return y.trim(); }).indexOf(v)>=0;\n  }\n  return false;\n}\nfunction runChecks(){\n  buildTree();\n  F=[]; FI={}; FV={}; CNT={flag:0,review:0,note:0}; HELD=[];\n  function add(rule,r,k,m,v,sev){\n    if(!sev){ if(!ruleOn(rule)) return; sev=ruleInfo(rule).sev; }\n    if(r&&!v&&heldBlank(rule,r,k)){ HELD.push({rule:rule,uid:r.uid,k:k}); return; }\n    var f={rule:rule,sev:sev,uid:r?r.uid:null,vuid:v?v.uid:null,k:k||null,m:m};\n    F.push(f); CNT[f.sev]++;\n    if(r){ var o=FI[r.uid]=FI[r.uid]||{all:[],k:{}}; o.all.push(f); if(k) (o.k[k]=o.k[k]||[]).push(f); }\n    if(v){ var p=FV[v.uid]=FV[v.uid]||{all:[],k:{}}; p.all.push(f); if(k) (p.k[k]=p.k[k]||[]).push(f); }\n  }\n  var usesMBSE=has('mbse')&&S.cis.some(function(r){ return tr(r.mbse); });\n  var liveRoots=T.roots.filter(live);\n  var srcRole=function(src,role){ return src.filter(function(s){ return isRole(s,role); }).map(canon); };\n\n  S.cis.forEach(function(r){\n    var L=live(r), G=isGFE(r), src=r.src||[], par=parentOf(r);\n    var hasOther=srcRole(src,'other').length>0;\n\n    /* columns: required, list, and format */\n    COLS.forEach(function(c){\n      if(c.kind==='level') return;\n      var v=val(r,c.k);\n      if(c.req&&L&&!v&&!(G&&!c.reqGFE)) add('RQ',r,c.k,hd(c.k)+' is required, and it is blank.',null,c.req);\n      if(c.kind==='enum'&&v&&LISTS[c.list]&&LISTS[c.list].indexOf(v)\u003c0) add('LS1',r,c.k,'\"'+v+'\" is not on the '+(C.lists[c.list]?C.lists[c.list].name:c.list)+' list.');\n      if(c.kind==='yn'&&v&&v!=='Y'&&v!=='N') add('LS1',r,c.k,hd(c.k)+' reads \"'+v+'\". Enter Y or N.');\n      if(c.kind==='number'&&v&&isNaN(+v)&&!isNA(v)) add('TY1',r,c.k,hd(c.k)+' reads \"'+v+'\". Enter a number.');\n      if(c.kind==='date'&&v&&!/^\\d{4}-\\d{2}-\\d{2}$/.test(v)) add('TY1',r,c.k,hd(c.k)+' reads \"'+v+'\". Enter a date as YYYY-MM-DD.');\n    });\n\n    /* custom rules */\n    (C.custom||[]).forEach(function(c){\n      if(!ruleOn(c.id)) return;\n      if(c.scope!=='all'&&!L) return;\n      if(c.skipGFE&&G) return;\n      if(!cond(c.ifCol==='*'?'':val(r,c.ifCol),c.ifOp,c.ifVal)) return;\n      if(cond(val(r,c.thenCol),c.thenOp,c.thenVal)) return;\n      add(c.id,r,c.thenCol,c.msg||CUST[c.id].what,null,c.sev);\n    });\n\n    /* structure */\n    if(!tr(r.id)) add('ST1',r,'id','CI ID is blank. Every CI needs a program-unique identifier.');\n    else if(T.ids[r.id].length>1) add('ST2',r,'id','CI ID '+r.id+' appears on '+T.ids[r.id].length+' rows. Each CI ID must be unique.');\n    if(r.parent&&T.orphan[r.uid]) add('ST3',r,'parent','Parent CI ID '+r.parent+' does not exist in the index.');\n    if(T.cyc[r.uid]) add('ST4',r,'parent','The parent chain loops back to this CI. Break the loop.');\n    if(!r.parent&&L&&liveRoots.length>1&&liveRoots[0]!==r) add('ST5',r,'parent','A second CI has no parent. Only the top-level CI ('+(liveRoots[0].id||'unnamed')+') has no parent.');\n    if(L&&par&&!live(par)) add('ST6',r,'parent','The parent CI '+par.id+' reads '+par.status+'. Reparent this CI or retire it.');\n    if(!tr(r.tier)) add('ST7',r,'tier',hd('tier')+' is blank.');\n    if(TIER.co&&r.tier===TIER.co&&!ancestors(r).some(function(a){ return a.tier===TIER.acq; }))\n      add('ST8',r,'tier','A '+TIER.co+' CI sits below an '+TIER.acq+' CI. No ancestor of this CI is '+TIER.acq+'.');\n    if(r.notdec==='Y'&&liveKids(r).length) add('ST9',r,'notdec','This CI is a supplier-designed unit, yet it has child CIs. Do not decompose a supplier-designed item to identify customer-facing CIs.');\n\n    /* status and concurrence */\n    if(!tr(r.status)) add('CO1',r,'status','Status is blank.');\n    if(!G){\n      if(r.status===ST.active&&!tr(r.concur)) add('CO2',r,'concur','Status reads '+ST.active+', but no Acquirer concurrence is recorded. A CI reads '+ST.proposed+' until the Acquirer concurs.');\n      if(r.status===ST.proposed&&tr(r.concur)&&!isNA(r.concur)) add('CO3',r,'status','An Acquirer concurrence is recorded. Set Status to '+ST.active+'.');\n      if(L&&!tr(r.selRef)) add('CO5',r,'selRef','No CI selection criteria checklist is referenced.');\n    } else if(tr(r.concur)&&!isNA(r.concur)) add('CO4',r,'concur','GFE rows read N/A for Acquirer concurrence.');\n\n    if(/see\\s+scd/i.test(r.spec||'')&&!tr(r.scd)) add('DO1',r,'scd',hd('spec')+' reads See SCD, but no SCD is recorded.');\n\n    /* supersession */\n    var sup=splitIds(r.sup);\n    if(isSup(r)&&!sup.length) add('SU1',r,'sup','A superseded row names the new CI ID or IDs.');\n    sup.forEach(function(id){\n      if(!T.ids[id]) { add('SU2',r,'sup',id+' does not exist in the index.'); return; }\n      var t=T.ids ank')+'.\u003c/p>':'')+'\u003c/div>\u003c/div>';\n\n  var COLR=['var(--rust)','var(--slate)','var(--teal)','var(--amber)','var(--ink-2)'];\n  var comp='';\n  if(has('tier')) comp+=barRows(LISTS.tier.map(function(t,i){ return [t,lv.filter(function(r){ return r.tier===t; }).length,COLR[i%5]]; }),lv.length)+'\u003cdiv style=\"height:8px\">\u003c/div>';\n  if(has('type')) comp+=barRows(LISTS.type.map(function(t){ return [t,lv.filter(function(r){ return r.type===t; }).length,'var(--ink-2)']; }),lv.length);\n  var recK=[['ser','Serialization = Y','var(--rust)'],['lot','Lot/Batch = Y','var(--rust)'],['iuid','IUID Required = Y','var(--slate)'],['sh','Special Handling = Y','var(--slate)']].filter(function(x){ return has(x[0]); });\n  var rec=recK.map(function(x){ return [x[1],ng.filter(function(r){ return r[x[0]]==='Y'; }).length,x[2]]; });\n  if(has('life')) rec.push(['Life clock set',ng.filter(function(r){ return r.life&&r.life!==LIFE.none; }).length,'var(--amber)']);\n  h+='\u003cdiv class=\"cols2\">\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Composition\u003c/div>'+(comp||'\u003cp class=\"small\">No tier or type columns in this build.\u003c/p>')+'\u003c/div>'+\n     '\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Product unit records\u003c/div>'+(rec.length?barRows(rec,ng.length)+'\u003cp class=\"small\" style=\"margin-top:10px\">Counts flags only. The product definition data defines each obligation.\u003c/p>':'\u003cp class=\"small\">No unit record columns in this build.\u003c/p>')+'\u003c/div>\u003c/div>';\n  return h;\n}\n\n/* ===================================================================\n   Hierarchy view\n   =================================================================== */\nfunction treeViewHTML(){\n  return '\u003cdiv class=\"split\">\u003cdiv class=\"treebox\">\u003cdiv class=\"treehead\">'+\n    '\u003cbutton class=\"lnk\" data-act=\"expand\">Expand all\u003c/button>\u003cbutton class=\"lnk\" data-act=\"collapse\">Collapse all\u003c/button>'+\n    '\u003clabel>\u003cinput type=\"checkbox\" data-opt=\"showRet\"'+(S.showRet?' checked':'')+'> Show retired\u003c/label>\u003c/div>'+\n    '\u003cdiv id=\"treelist\">'+treeListHTML()+'\u003c/div>\u003c/div>'+\n    '\u003cdiv id=\"detail\">'+detailHTML(cur())+'\u003c/div>\u003c/div>';\n}\nfunction badges(r){\n  var b='';\n  if(r.type) b+='\u003cspan class=\"bd\">'+esc(abbr('type',r.type))+'\u003c/span>';\n  if(r.tier) b+='\u003cspan class=\"bd'+(isGFE(r)?' g':'')+'\" title=\"'+esc(r.tier)+'\">'+esc(abbr('tier',r.tier))+'\u003c/span>';\n  if(r.critB==='Y') b+='\u003cspan class=\"bd b\" title=\"Criterion (b) met\">(b)\u003c/span>';\n  if(r.status===ST.proposed) b+='\u003cspan class=\"bd p\">PROP\u003c/span>';\n  else if(!live(r)) b+='\u003cspan class=\"bd\">'+(r.status===ST.dedes?'DE-DES':isSup(r)?'SUPER':'RET')+'\u003c/span>';\n  var c=rowCounts(r.uid);\n  if(c.f) b+='\u003cspan class=\"dot f\" title=\"'+c.f+' flag(s)\">'+c.f+'\u003c/span>';\n  else if(c.r) b+='\u003cspan class=\"dot r\" title=\"'+c.r+' to review\">'+c.r+'\u003c/span>';\n  return b;\n}\nfunction nodeHTML(r,d,unp){\n  var kids=(T.kids[r.uid]||[]).filter(function(k){ return S.showRet||live(k); });\n  var open=!S.col[r.uid];\n  var tw=kids.length?'\u003cbutton class=\"tw\" data-tog=\"'+r.uid+'\" aria-label=\"'+(open?'Collapse':'Expand')+'\">'+(open?'\u25be':'\u25b8')+'\u003c/button>':'\u003cspan class=\"tw leaf\">\u25b8\u003c/span>';\n  var g=''; for(var i=0;i\u003cd;i++) g+='\u003cspan class=\"guide\" style=\"left:'+(16+i*18)+'px\">\u003c/span>';\n  var h='\u003cdiv class=\"tn'+(S.sel===r.uid?' sel':'')+(live(r)?'':' ret')+'\" tabindex=\"0\" data-sel=\"'+r.uid+'\" style=\"padding-left:'+(8+d*18)+'px\">'+g+tw+\n    '\u003cspan class=\"tid\">'+esc(r.id||'(no ID)')+'\u003c/span>\u003cspan class=\"tname\" title=\"'+esc(r.name)+'\">'+esc(r.name||'(unnamed)')+'\u003c/span>'+badges(r)+'\u003c/div>';\n  if(open&&!unp) kids.forEach(function(k){ h+=nodeHTML(k,d+1); });\n  return h;\n}\nfunction treeListHTML(){\n  var h='';\n  T.roots.forEach(function(r){ if(S.showRet||live(r)) h+=nodeHTML(r,0); });\n  if(T.unplaced.length){\n    h+='\u003cdiv class=\"tsec\">Not placed in the hierarchy\u003c/div>';\n    T.unplaced.forEach(function(r){ h+=nodeHTML(r,0,true); });\n  }\n  return h||'\u003cp class=\"small\" style=\"padding:12px\">No rows to show.\u003c/p>';\n}\nfunction chipsFor(r){\n  var c=rowCounts(r.uid), lvl=T.lvl[r.uid];\n  return '\u003cdiv class=\"dchips\">'+\n    '\u003cspan class=\"chip'+(r.status===ST.active?' ok':r.status===ST.proposed?' hold':'')+'\">'+esc(r.status||'No status')+'\u003c/span>'+\n    (r.tier?'\u003cspan class=\"chip\">'+esc(r.tier)+'\u003c/span>':'')+\n    (r.type?'\u003cspan class=\"chip\">'+esc(r.type)+'\u003c/span>':'')+\n    '\u003cspan class=\"chip\">Level '+(lvl==null?'unknown':lvl)+'\u003c/span>'+\n    (r.critB==='Y'?'\u003cspan class=\"chip on\">Criterion (b)\u003c/span>':'')+\n    (r.sci==='Y'?'\u003cspan class=\"chip on\">SCI\u003c/span>':'')+\n    (c.f?'\u003cspan class=\"chip bad\">'+c.f+' flag'+(c.f>1?'s':'')+'\u003c/span>':'')+\n    (c.r?'\u003cspan class=\"chip hold\">'+c.r+' to review\u003c/span>':'')+'\u003c/div>';\n}\nfunction dheadHTML(r){\n  var a=ancestors(r).reverse();\n  return '\u003cdiv class=\"dh\">\u003cspan class=\"cid\">'+esc(r.id||'(no CI ID)')+'\u003c/span>\u003ch2>'+esc(r.name||'(unnamed CI)')+'\u003c/h2>\u003c/div>'+chipsFor(r)+\n    (a.length?'\u003cdiv class=\"path\">'+a.map(function(x){ return '\u003cbutton data-sel=\"'+x.uid+'\">'+esc(x.id)+'\u003c/button>'; }).join(' / ')+' / '+esc(r.id)+'\u003c/div>':'');\n}\nfunction dfindHTML(r){\n  var o=FI[r.uid]; if(!o||!o.all.length) return '';\n  return '\u003cdiv class=\"fl\">'+o.all.map(function(f){\n    return '\u003cdiv class=\"it '+f.sev+'\">\u003cspan class=\"r\">'+f.rule+'\u003c/span>'+(f.k?'\u003cspan class=\"c\">'+esc(f.vuid?VC(f.k):hd(f.k))+'\u003c/span>':'')+'\u003cspan>'+esc(f.m)+'\u003c/span>\u003c/div>';\n  }).join('')+'\u003c/div>';\n}\nfunction canDelete ), dH=s.some(function(x){ return isRole(x,'sh'); });\n  function pick(dem,k){ return dem?'Y':(other&&r[k]==='Y'?'Y':'N'); }\n  var o={ser:pick(dS,'ser'),lot:pick(dL,'lot'),iuid:pick(dI,'iuid'),sh:pick(dH,'sh')};\n  if(isSW(r)){ o.ser='N'; o.lot='N'; }\n  return o;\n}\nfunction implHTML(r){\n  var im=implied(r), keys=['ser','lot','iuid','sh'].filter(has), labs={ser:'Serialization',lot:'Lot/Batch',iuid:'IUID Required',sh:'Special Handling'};\n  if(!keys.length) return '';\n  var mis=keys.filter(function(k){ return r[k]!==im[k]; });\n  return '\u003cdiv class=\"impl\">\u003cb>What the sources call for.\u003c/b> '+(isSW(r)?'This is a software CI. Its recording flags read N and N.':'Each flag must agree with the named sources.')+\n    '\u003ctable>'+keys.map(function(k){ var ok=r[k]===im[k]; return '\u003ctr>\u003ctd>'+labs[k]+'\u003c/td>\u003ctd>'+im[k]+'\u003c/td>\u003ctd>'+(ok?'\u003cspan class=\"ok\">matches\u003c/span>':'\u003cspan class=\"no\">recorded '+(r[k]||'blank')+'\u003c/span>')+'\u003c/td>\u003c/tr>'; }).join('')+'\u003c/table>'+\n    (mis.length?'\u003cbutton class=\"btn sm\" data-act=\"apply-impl\">Set the flags to match the sources\u003c/button>':'')+'\u003c/div>';\n}\nfunction variantsMini(r){\n  var vs=S.vars.filter(function(v){ return tr(v.ciId)===tr(r.id)&&r.id; });\n  var h='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">PN Variants\u003c/div>';\n  if(!vs.length) h+='\u003cp class=\"small\">No variant rows. Add variants only for a one-CI, multiple-PIN-variant verdict from the same-CI decision aid. For a software CI, enter version identifiers for concurrent builds or loads.\u003c/p>';\n  else h+='\u003ctable class=\"dt\">\u003cthead>\u003ctr>'+VCOLS.filter(function(c){ return c.k!=='ciId'&&c.k!=='notes'; }).map(function(c){ return '\u003cth>'+esc(c.h)+'\u003c/th>'; }).join('')+'\u003c/tr>\u003c/thead>\u003ctbody>'+\n    vs.map(function(v){ return '\u003ctr>'+VCOLS.filter(function(c){ return c.k!=='ciId'&&c.k!=='notes'; }).map(function(c,i){ return \n    if(q&&!COLS.some(function(c){ return c.kind!=='level'&&val(r,c.k).toLowerCase().indexOf(q)>=0; })) return false;\n    return true;\n  });\n  var idI=COLS.indexOf(COL.id);\n  var h='\u003cdiv class=\"gridwrap\">\u003ctable class=\"g\">\u003cthead>\u003ctr>'+COLS.map(function(c,i){ return '\u003cth class=\"'+(c.kind==='level'?'s0':c.k==='id'?'s1':'')+'\" title=\"'+esc(c.h)+'\">'+esc(c.h)+'\u003c/th>'; }).join('')+'\u003c/tr>\u003c/thead>\u003ctbody>';\n  rows.forEach(function(r){\n    var lvl=T.lvl[r.uid];\n    h+='\u003ctr data-goto=\"'+r.uid+'\" class=\"'+(live(r)?'':'ret')+'\">';\n    COLS.forEach(function(c){\n      var v=c.kind==='level'?(lvl==null?'?':lvl):c.k==='name'?'\u00a0'.repeat(2*(lvl||0))+val(r,'name'):val(r,c.k);\n      var l=(FI[r.uid]&&(c.k==='id'?(FI[r.uid].k.id||[]).concat(FI[r.uid].all.filter(function(x){ return !x.k; })):FI[r.uid].k[c.k]))||[];\n      var w=worst(l), tt=l.length?l.map(function(x){ return x.rule+'. '+x.m; }).join('\\n'):String(v);\n      var sc=c.kind==='level'?'s0 ':c.k==='id'?'s1 ':'';\n      h+='\u003ctd class=\"'+sc+(w==='flag'||w==='review'?'x-'+w:'')+'\" title=\"'+esc(tt)+'\">'+esc(v)+'\u003c/td>';\n    });\n    h+='\u003c/tr>';\n  });\n  h+='\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"small\" style=\"margin-top:6px\">'+rows.length+' of '+S.cis.length+' rows shown.\u003c/p>';\n  return h;\n}\n\n/* ===================================================================\n   PN Variants view\n   =================================================================== */\nfunction vmsgHTML(v){ var o=FV[v.uid]; if(!o) return ''; return o.all.map(function(f){ return '\u003cdiv class=\"sev '+f.sev+'\" style=\"display:block;white-space:normal;margin-bottom:3px;letter-spacing:0;text-transform:none;font-family:var(--sans);font-size:11.5px;font-weight:600\">'+f.rule+'. '+esc(f.m)+'\u003c/div>'; }).join(''); }\nfunction variantsHTML(){\n  var ids=exportOrder().filter(function(r){ return r.id; });\n  var h='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">PN Variants\u003c/div>'+\n    '\u003cp class=\"small\">One row per variant, keyed by CI ID. This sheet records the variant mapping for a one-CI, multiple-PIN-variant verdict from the same-CI decision aid. Record the per-variant interface callout, recording flags, and effectivity. Variants share the CI\u2019s Product Unit Record Requirement Source. Where a variant\u2019s source differs, say so in that variant\u2019s Notes.\u003c/p>'+\n    '\u003cp class=\"small\" style=\"margin-top:6px\">Software variants go here too. For a software CI, enter the version identifier in place of the PIN, and the build or load in place of the variant. Use this only for concurrent builds or loads fielded at the same time. Successive versions go in the software version identifier records.\u003c/p>\u003c/div>';\n  h+='\u003cdiv class=\"gridwrap\" style=\"max-height:none\">\u003ctable class=\"dt\">\u003cthead>\u003ctr>'+VCOLS.map(function(c){ return '\u003cth title=\"'+esc(c.help||'')+'\">'+esc(c.h)+'\u003c/th>'; }).join('')+'\u003cth>Findings\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>';\n  if(!S.vars.length) h+='\u003ctr>\u003ctd colspan=\"'+(VCOLS.length+2)+'\" class=\"m\">No variant rows.\u003c/td>\u003c/tr>';\n  S.vars.forEach(function(v){\n    h+='\u003ctr>';\n    VCOLS.forEach(function(c){\n      var w=worst(FV[v.uid]&&FV[v.uid].k[c.k]), cls=(w==='flag'||w==='review')?' class=\"x-'+w+'\"':'';\n      var ctl;\n      if(c.k==='ciId'){\n        var o='\u003coption value=\"\">Pick a CI\u003c/option>', seen=!v.ciId;\n        ids.forEach(function(r){ if(r.id===v.ciId) seen=true; o+='\u003coption value=\"'+esc(r.id)+'\"'+(r.id===v.ciId?' selected':'')+'>'+esc(r.id)+'\u003c/option>'; });\n        if(!seen) o+='\u003coption selected value=\"'+esc(v.ciId)+'\">'+esc(v.ciId)+' (not found)\u003c/option>';\n        ctl='\u003cselect data-vf=\"ciId\" data-vu=\"'+v.uid+'\" aria-label=\"CI ID\">'+o+'\u003c/select>';\n      } else if(c.kind==='yn'){\n        ctl='\u003cselect data-vf=\"'+c.k+'\" data-vu=\"'+v.uid+'\" aria-label=\"'+esc(c.h)+'\">'+optList(LISTS.yn,v[c.k])+'\u003c/select>';\n      } else if(c.kind==='enum'){\n        ctl='\u003cselect data-vf=\"'+c.k+'\" data-vu=\"'+v.uid+'\" aria-label=\"'+esc(c.h)+'\">'+optList(LISTS[c.list],v[c.k])+'\u003c/select>';\n      } else ctl='\u003cinput data-vf=\"'+c.k+'\" data-vu=\"'+v.uid+'\" value=\"'+esc(v[c.k])+'\" aria-label=\"'+esc(c.h)+'\">';\n      h+='\u003ctd id=\"vc-'+v.uid+'-'+c.k+'\"'+cls+' style=\"min-width:'+(c.kind==='yn'?70:c.kind==='long'?200:110)+'px\">'+ctl+'\u003c/td>';\n    });\n    h+='\u003ctd id=\"vm-'+v.uid+'\" style=\"min-width:220px\">'+vmsgHTML(v)+'\u003c/td>\u003ctd>\u003cbutton class=\"lnk\" data-vdel=\"'+v.uid+'\">Remove\u003c/button>\u003c/td>\u003c/tr>';\n  });\n  h+='\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"btnrow\">\u003cbutton class=\"btn\" data-act=\"var-add\">Add a variant row\u003c/button>\u003c/div>';\n  return h;\n}\n\n/* ===================================================================\n   Checks view\n   =================================================================== */\nfunction allRuleIds(){ return Object.keys(RULES).concat(Object.keys(CUST)); }\nfunction checksHTML(){\n  var sv=S.csev;\n  var list=F.filter(function(f){ return !sv||f.sev===sv; });\n  var h=heldHTML()+'\u003cdiv class=\"filters\" style=\"align-items:center\">'+\n    ['','flag','review','note'].map(function(s){ var n=s?CNT[s]:F.length;\n      return '\u003cbutton class=\"btn sm'+(sv===s?' pri':'')+'\" data-csev=\"'+s+'\">'+(s?s.charAt(0).toUpperCase()+s.slice(1)+'s':'All')+' ('+n+')\u003c/button>'; }).join('')+\n    '\u003cspan class=\"small\">A flag marks a cell the workbook would highlight, or a record that disagrees with itself. A review item is a likely gap. A note is a reminder. Checks never block entry.\u003c/span>\u003c/div>';\n  if(!list.length) h+='\u003cdiv class=\"sect\">\u003cp class=\"small\">Nothing to show. '+(F.length?'Pick another filter.':'Every check passes.')+'\u003c/p>\u003c/div>';\n  else{\n    h+='\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>Severity\u003c/th>\u003cth>Rule\u003c/th>\u003cth>CI\u003c/th>\u003cth>Column\u003c/th>\u003cth>Finding\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>';\n    list.forEach(function(f){\n      var r=f.uid&&T.byUid[f.uid], v=f.vuid&&S.vars.filter(function(x){ return x.uid===f.vuid; })[0];\n      var ci=r?'\u003cbutton class=\"cibtn\" data-goto=\"'+r.uid+'\">'+esc(r.id||'(no ID)')+'\u003c/button>':(v?'\u003cbutton class=\"cibtn\" data-tab=\"variants\">Variant row\u003c/button>':'');\n      var col=f.k?(f.vuid?'PN Variants: '+VC(f.k):hd(f.k)):'';\n      h+='\u003ctr>\u003ctd>\u003cspan class=\"sev '+f.sev+'\">'+f.sev+'\u003c/span>\u003c/td>\u003ctd class=\"k\">'+f.rule+'\u003c/td>\u003ctd>'+ci+'\u003c/td>\u003ctd class=\"m\">'+esc(col)+'\u003c/td>\u003ctd>'+esc(f.m)+'\u003c/td>\u003c/tr>';\n    });\n    h+='\u003c/tbody>\u003c/table>';\n  }\n  h+='\u003ch2 style=\"font-family:var(--serif);font-weight:400;font-size:19px;margin:30px 0 10px\">Rule catalog\u003c/h2>'+\n    '\u003cp class=\"small\" style=\"margin-bottom:10px\">Every check this build runs, and the part of the template or the process it comes from. GFE rows are thin, so the safety, recording, baseline, and model checks skip them. Retired rows skip them too. A rule that needs a column this build does not carry is listed as inactive.\u003c/p>'+\n    '\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>Rule\u003c/th>\u003cth>Severity\u003c/th>\u003cth>Area\u003c/th>\u003cth>What it checks\u003c/th>\u003cth>Basis\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    allRuleIds().map(function(k){ var x=ruleInfo(k), on=ruleOn(k); return '\u003ctr'+(on?'':' style=\"opacity:.5\"')+'>\u003ctd class=\"k\">'+k+'\u003c/td>\u003ctd>'+(on?'\u003cspan class=\"sev '+x.sev+'\">'+x.sev+'\u003c/span>':'\u003cspan class=\"sev note\">off\u003c/span>')+'\u003c/td>\u003ctd class=\"m\">'+esc(x.area)+'\u003c/td>\u003ctd>'+esc(x.what)+'\u003c/td>\u003ctd class=\"m\">'+esc(x.basis)+'\u003c/td>\u003c/tr>'; }).join('')+\n    (COLS.some(function(c){ return c.req; })?'\u003ctr>\u003ctd class=\"k\">RQ\u003c/td>\u003ctd>\u003cspan class=\"sev review\">per column\u003c/span>\u003c/td>\u003ctd class=\"m\">Required\u003c/td>\u003ctd>Required columns: '+esc(COLS.filter(function(c){ return c.req; }).map(function(c){ return c.h; }).join(', '))+'.\u003c/td>\u003ctd class=\"m\">Build settings\u003c/td>\u003c/tr>':'')+\n    '\u003c/tbody>\u003c/table>';\n  return h;\n}\n\n/* ===================================================================\n   Structural floor\n   The part of the interface register's structural floor that the CI\n   index can predict. Sibling CIs are not paired: interfaces reach the\n   register from Systems Engineering's interface sources.\n   =================================================================== */\nfunction deriveFloor(){\n  var out=[], lv=S.cis.filter(function(r){ return live(r)&&r.id&&T.unplaced.indexOf(r)\u003c0; });\n  lv.forEach(function(r){ var p=parentOf(r); if(p&&live(p)&&p.tier&&r.tier&&p.tier!==r.tier) out.push({basis:'Parent and child, different control tiers',a:p,b:r,need:'At least one Mapped row joining the two CIs'}); });\n  lv.forEach(function(r){ if(isGFE(r)) out.push({basis:'GFE CI',a:r,b:null,need:'At least one Mapped row naming this CI'}); });\n  return out;\n}\nfunction floorHTML(){\n  var b=deriveFloor(), pc=b.filter(function(x){ return x.b; }).length, g=b.length-pc;\n  var h='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Structural floor\u003c/div>'+\n    '\u003cp class=\"small\">Systems Engineering identifies interfaces and defines them in its interface sources. CM maps each one to the CIs it joins on the interface register. The register is the record. This list is the part of the structural floor the CI index can predict: each parent and child in different control tiers, and each GFE CI. Each one needs at least one Mapped row on the interface register. External items named in the system specification or the contract complete the floor. They are not in the index, so check them on the register directly.\u003c/p>'+\n    '\u003cp class=\"small\" style=\"margin-top:8px\">An entry with no Mapped row is a floor gap, and a floor gap is a coverage exception. Systems Engineering dispositions it. Where Systems Engineering confirms that no interface exists, record that confirmation on the coverage log. Nothing is signed in advance. Sibling CIs are not paired here. An interface between siblings, or between CIs in different branches, reaches the register from the interface sources.\u003c/p>\u003c/div>';\n  h+='\u003cp class=\"small\" style=\"margin:0 0 8px\">\u003cb>'+b.length+'\u003c/b> floor entr'+(b.length===1?'y':'ies')+' across live CIs: '+pc+' parent-and-child pair'+(pc===1?'':'s')+' and '+g+' GFE CI'+(g===1?'':'s')+'.'+(FEAT.sheets.bound?' The Excel export carries them on a Structural Floor sheet.':'')+'\u003c/p>';\n  if(!b.length) return h;\n  h+='\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Basis\u003c/th>\u003cth>CI\u003c/th>\u003cth>Other CI\u003c/th>\u003cth>The register needs\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    b.map(function(x,i){ return '\u003ctr>\u003ctd class=\"m\">'+(i+1)+'\u003c/td>\u003ctd>'+esc(x.basis)+'\u003c/td>'+\n      '\u003ctd>\u003cbutton class=\"cibtn\" data-goto=\"'+x.a.uid+'\">'+esc(x.a.id)+'\u003c/button> \u003cspan class=\"m\">'+esc(x.a.name)+'\u003c/span>\u003c/td>'+\n      '\u003ctd>'+(x.b?'\u003cbutton class=\"cibtn\" data-goto=\"'+x.b.uid+'\">'+esc(x.b.id)+'\u003c/button> \u003cspan class=\"m\">'+esc(x.b.name)+'\u003c/span>':'\u003cspan class=\"m\">Any CI or external item\u003c/span>')+'\u003c/td>'+\n      '\u003ctd>'+esc(x.need)+'\u003c/td>\u003c/tr>'; }).join('')+'\u003c/tbody>\u003c/table>';\n  return h;\n}\n\n/* ===================================================================\n   Edit log and comparison\n   =================================================================== */\nfunction logHTML(){\n  var h='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Compare with a saved index\u003c/div>'+\n    '\u003cp class=\"small\">Open an earlier saved file. The tool lists every CI added, removed, or changed since then, field by field. Use it to prepare a CSA report or to check a resubmittal.\u003c/p>'+\n    '\u003cdiv class=\"btnrow\">\u003cbutton class=\"btn\" data-act=\"cmp-open\">Compare with a saved file\u003c/button>'+(S.cmp?'\u003cbutton class=\"btn gh\" data-act=\"cmp-clear\">Clear the comparison\u003c/button>':'')+'\u003c/div>'+\n    (S.cmp?cmpHTML():'')+'\u003c/div>';\n  h+='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Edit log\u003c/div>\u003cp class=\"small\">Every change made in this tool, with who and when. Saved with the index file.'+(FEAT.sheets.log?' Exported to Excel on an Edit Log sheet.':'')+'\u003c/p>'+\n    '\u003cdiv class=\"filters\" style=\"margin-top:10px\">\u003cdiv class=\"fld\" style=\"min-width:260px\">\u003clabel for=\"lq\">Filter\u003c/label>\u003cinput id=\"lq\" data-lq=\"1\" value=\"'+esc(S.logq)+'\" placeholder=\"CI ID, column, or name\">\u003c/div>\u003c/div>\u003cdiv id=\"logbox\">'+logTable()+'\u003c/div>\u003c/div>';\n  return h;\n}\nfunction logTable(){\n  var q=S.logq.toLowerCase();\n  var L=S.log.slice().reverse().filter(function(e){ return !q||[e.ci,e.f,e.who,e.act,e.from,e.to].join(' ').toLowerCase().indexOf(q)>=0; });\n  if(!L.length) return '\u003cp class=\"small\">No entries.\u003c/p>';\n  return '\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>When\u003c/th>\u003cth>Who\u003c/th>\u003cth>Action\u003c/th>\u003cth>CI\u003c/th>\u003cth>Column\u003c/th>\u003cth>From\u003c/th>\u003cth>To\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    L.slice(0,500).map(function(e){ return '\u003ctr>\u003ctd class=\"m\" style=\"white-space:nowrap\">'+esc(e.t)+'\u003c/td>\u003ctd class=\"m\">'+esc(e.who)+'\u003c/td>\u003ctd>'+esc(e.act)+'\u003c/td>\u003ctd class=\"k\">'+esc(e.ci)+'\u003c/td>\u003ctd class=\"m\">'+esc(e.f)+'\u003c/td>\u003ctd class=\"m\">'+esc(e.from)+'\u003c/td>\u003ctd>'+esc(e.to)+'\u003c/td>\u003c/tr>'; }).join('')+\n    '\u003c/tbody>\u003c/table>'+(L.length>500?'\u003cp class=\"small\">Showing the latest 500 of '+L.length+'. The saved file carries every entry.\u003c/p>':'');\n}\nfunction diffIndex(old){\n  var out=[], om={}, nm={};\n  (old.cis||[]).forEach(function(r){ if(r.id) om[r.id]=r; });\n  S.cis.forEach(function(r){ if(r.id) nm[r.id]=r; });\n  Object.keys(nm).forEach(function(id){\n    var n=nm[id], o=om[id];\n    if(!o){ out.push({ci:id,ch:'Added',f:'',from:'',to:n.name}); return; }\n    COLS.forEach(function(c){ if(c.kind==='level'||c.k==='id') return; var a=val(o,c.k), b=val(n,c.k); if(a!==b) out.push({ci:id,ch:'Changed',f:c.h,from:a,to:b}); });\n  });\n  Object.keys(om).forEach(function(id){ if(!nm[id]) out.push({ci:id,ch:'Removed',f:'',from:om[id].name,to:''}); });\n  function vk(v){ return tr(v.ciId)+' | '+tr(v.pin); }\n  var ov={}, nv={};\n  (old.vars||[]).forEach(function(v){ ov[vk(v)]=v; }); S.vars.forEach(function(v){ nv[vk(v)]=v; });\n  Object.keys(nv).forEach(function(k){ var n=nv[k], o=ov[k];\n    if(!o){ out.push({ci:tr(n.ciId),ch:'Variant added',f:VC('pin'),from:'',to:n.pin}); return; }\n    VCOLS.forEach(function(c){ if(tr(o[c.k])!==tr(n[c.k])) out.push({ci:tr(n.ciId),ch:'Variant changed',f:n.pin+': '+c.h,from:tr(o[c.k]),to:tr(n[c.k])}); });\n  });\n  Object.keys(ov).forEach(function(k){ if(!nv[k]) out.push({ci:tr(ov[k].ciId),ch:'Variant removed',f:VC('pin'),from:ov[k].pin,to:''}); });\n  return out;\n}\nfunction cmpHTML(){\n  var d=diffIndex(S.cmp.data);\n  var h='\u003cp class=\"small\" style=\"margin-top:12px\">\u003cb>Compared with '+esc(S.cmp.name)+'\u003c/b>, saved '+esc(S.cmp.data.saved||'on an unknown date')+'. '+d.length+' difference'+(d.length===1?'':'s')+'. The Excel export carries them on a Comparison sheet.\u003c/p>';\n  if(!d.length) return h+'\u003cp class=\"small\">The two indexes match.\u003c/p>';\n  return h+'\u003ctable class=\"dt\" style=\"margin-top:8px\">\u003cthead>\u003ctr>\u003cth>CI\u003c/th>\u003cth>Change\u003c/th>\u003cth>Column\u003c/th>\u003cth>Then\u003c/th>\u003cth>Now\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    d.map(function(x){ return '\u003ctr>\u003ctd class=\"k\">'+esc(x.ci)+'\u003c/td>\u003ctd>'+esc(x.ch)+'\u003c/td>\u003ctd class=\"m\">'+esc(x.f)+'\u003c/td>\u003ctd class=\"m\">'+esc(x.from)+'\u003c/td>\u003ctd>'+esc(x.to)+'\u003c/td>\u003c/tr>'; }).join('')+'\u003c/tbody>\u003c/table>';\n}\n\n/* ===================================================================\n   Reference\n   =================================================================== */\nfunction refHTML(){\n  var h='\u003cdiv class=\"sect ref\">';\n  (C.reference||[]).forEach(function(s,i){\n    if(s.title) h+=(i?'\u003ch3>':'\u003cdiv class=\"lab\">')+esc(s.title)+(i?'\u003c/h3>':'\u003c/div>');\n    if(s.kind==='list') h+='\u003cul>'+(s.items||[]).map(function(x){ return '\u003cli>'+md(x)+'\u003c/li>'; }).join('')+'\u003c/ul>';\n    else if(s.kind==='pull') h+=(s.items||[]).map(function(x){ return '\u003cp class=\"pull\">'+md(x)+'\u003c/p>'; }).join('');\n    else h+=(s.items||[]).map(function(x){ return '\u003cp class=\"small\" style=\"margin:0 0 8px\">'+md(x)+'\u003c/p>'; }).join('');\n  });\n  if(has('src')) h+='\u003ch3>Product Unit Record Requirement Sources\u003c/h3>'+\n    '\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>Source\u003c/th>\u003cth>Drives\u003c/th>\u003cth>Meets criterion (b) on its own (Table C-1)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    SRC_LIST.map(function(s){ return '\u003ctr>\u003ctd>'+esc(s[0])+'\u003c/td>\u003ctd class=\"m\">'+s[1]+'\u003c/td>\u003ctd>'+(s[2]?'\u003cspan class=\"sev flag\">Yes\u003c/span>':'\u003cspan class=\"m\">No\u003c/span>')+'\u003c/td>\u003c/tr>'; }).join('')+'\u003c/tbody>\u003c/table>';\n  var b=C.build||{};\n  h+='\u003ch3>About this build\u003c/h3>\u003cp class=\"small\">'+esc(b.name||'')+', revision '+esc(b.rev||'')+'. Engine revision '+ENGINE_REV+'. Edit the build in the CI Index Builder.\u003c/p>';\n  if(b.changes&&b.changes.length) h+='\u003ctable class=\"dt chg\" style=\"margin-top:8px\">\u003cthead>\u003ctr>\u003cth>Rev\u003c/th>\u003cth>Date\u003c/th>\u003cth>By\u003c/th>\u003cth>Change\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    b.changes.map(function(c){ return '\u003ctr>\u003ctd class=\"k\">'+esc(c.rev)+'\u003c/td>\u003ctd class=\"m\">'+esc(c.date)+'\u003c/td>\u003ctd class=\"m\">'+esc(c.by)+'\u003c/td>\u003ctd>'+esc(c.text)+'\u003c/td>\u003c/tr>'; }).join('')+'\u003c/tbody>\u003c/table>';\n  return h+'\u003c/div>';\n}\n\n/* ===================================================================\n   Excel columns. What the import reads, the header it accepts, the\n   minimum to load, and the stage at which each column falls due.\n   =================================================================== */\nvar STAGES=C.stages||[], HELD=[];\nfunction stageIdx(k){ for(var i=0;i\u003cSTAGES.length;i++) if(STAGES[i].k===k) return i; return -1; }\nfunction stageName(k){ var i=stageIdx(k); return i>=0?STAGES[i].name:'Any time'; }\nfunction colStage(k){ return COL[k]&&COL[k].stage?stageIdx(COL[k].stage):-1; }\nfunction notDue(k){ if(!S.meta.stage) return false; var cur=stageIdx(S.meta.stage); return cur>=0&&colStage(k)>cur; }\n/* rules that fire because a cell is blank, and the column they name */\nvar BLANKR={ST1:'id',ST5:'parent',ST7:'tier',CO1:'status',CO5:'selRef',SA1:'critB',SA7:'sci',SA5:'sciRef',BA1:'fbl',BA2:'fbl',QT2:'qty',MO1:'mbse'};\nvar BLANK_ONLY={BA2:1};\nfunction heldBlank(rule,r,k){\n  if(!S.meta.stage||!k||!notDue(k)) return false;\n  if(BLANKR[rule]===k){ if(BLANK_ONLY[rule]&&tr(r[k])) return false; return true; }\n  if(rule==='RQ') return true;\n  var cu=(C.custom||[]).filter(function(c){ return c.id===rule; })[0];\n  return !!cu&&cu.thenOp==='notblank'&&cu.thenCol===k;\n}\nfunction headerKeys(){ return ['id','parent'].filter(has); }\nfunction blankEffect(c){\n  var out=[], k=c.k;\n  Object.keys(BLANKR).forEach(function(id){ if(BLANKR[id]!==k||!ruleOn(id)) return; var x=ruleInfo(id); out.push(id+' ('+x.sev+'): '+x.what); });\n  if(['ser','lot','iuid','sh','life'].indexOf(k)>=0&&ruleOn('RE12')) out.push('RE12 ('+ruleInfo('RE12').sev+'): '+ruleInfo('RE12').what);\n  if(c.req) out.push('RQ ('+c.req+'): the build marks this column required'+(c.reqGFE?', on GFE rows too':'')+'.');\n  (C.custom||[]).forEach(function(cu){ if(cu.on&&cu.thenOp==='notblank'&&cu.thenCol===k) out.push(cu.id+' ('+cu.sev+'): '+(cu.what||autoWhat(cu))); });\n  if(k==='parent') out.unshift('The CI becomes a top-level CI. Only one live CI may have no parent.');\n  if(k==='id') out.unshift('The row still loads. Nothing can name it as a parent, a variant, or a register side until it has an ID.');\n  var t=out.length?out.join(' '):'No hint fires. The column stays blank.';\n  if(c.blankNote) t+=' '+c.blankNote;\n  return t;\n}\nfunction readers(c){\n  var r=Object.keys(RULES).filter(function(id){ return (RULES[id].needs||[]).indexOf(c.k)>=0&&ruleOn(id); });\n  var s=r.length?'Rules '+r.join(', ')+'.':'';\n  if(c.k==='parent') s='Level, indentation, and the hierarchy. '+s;\n  if(c.reg) s+=(s?' ':'')+'Also read by the CI Interface Register.';\n  return s||'Kept for the record. No rule reads it.';\n}\nfunction fillCounts(){\n  if(!S.cis.length) return null;\n  var lv=S.cis.filter(live), ng=lv.filter(function(r){ return !isGFE(r); }), o={n:lv.length,ng:ng.length,f:{}};\n  COLS.forEach(function(c){ if(c.kind==='level') return; var base=c.core?lv:ng; o.f[c.k]={n:base.filter(function(r){ return !!val(r,c.k); }).length,of:base.length}; });\n  return o;\n}\nfunction heldHTML(){\n  if(!HELD.length) return '';\n  var by={}; HELD.forEach(function(h){ by[h.k]=(by[h.k]||0)+1; });\n  return '\u003cdiv class=\"heldbox\">\u003cb>'+HELD.length+' blank-entry hint'+(HELD.length===1?' is':'s are')+' held.\u003c/b> Index stage reads '+esc(stageName(S.meta.stage))+'. These columns fall due at a later stage: '+\n    Object.keys(by).map(function(k){ return esc(hd(k))+' ('+by[k]+')'; }).join(', ')+'. Set Index stage to a later stage, or to All columns due, to see them. Hints that compare two filled cells are never held.\u003c/div>';\n}\nfunction minLoadHTML(){\n  var hk=headerKeys().map(function(k){ var c=COL[k]; return '\u003cb>'+esc(c.h)+'\u003c/b>'+((c.alias||[]).length?' (or '+c.alias.map(esc).join(', ')+')':''); });\n  return '\u003cdiv class=\"lab\">Minimum to load\u003c/div>\u003col class=\"minlist\">'+\n    '\u003cli>\u003cb>A save file\u003c/b> from this tool opens by key. Nothing else is needed.\u003c/li>'+\n    '\u003cli>\u003cb>An Excel workbook\u003c/b> needs a sheet named \u003cb>CI Index\u003c/b>.\u003c/li>'+\n    '\u003cli>Within its first 15 rows, that sheet needs a header row with '+hk.join(' or ')+'. Header matching ignores case, spaces, and punctuation. Older headers listed under Also accepts work too.\u003c/li>'+\n    '\u003cli>Every row below the header with at least one filled cell loads. A row with no CI ID still loads. ST1 flags it.\u003c/li>'+\n    (FEAT.tabs.variants?'\u003cli>A \u003cb>PN Variants\u003c/b> sheet is optional. When present, it needs a header row with \u003cb>'+esc(VC('pin'))+'\u003c/b>.\u003c/li>':'')+'\u003c/ol>'+\n    '\u003cp class=\"small\">That is all the import requires. Every other column is optional. A missing column loads as blank. A blank cell never stops the import and never blocks entry. Level and the indentation of '+esc(hd('name'))+' are not read. The tool derives both from '+esc(hd('parent'))+'.\u003c/p>';\n}\nfunction minEntryHTML(){\n  var first=STAGES[0], cols=first?COLS.filter(function(c){ return c.kind!=='level'&&c.stage===first.k; }):[];\n  if(!cols.length) return '';\n  return '\u003cdiv class=\"lab\" style=\"margin-top:16px\">Minimum entry for a new CI\u003c/div>\u003cp class=\"small\ var DEFAULT={"schema":1,"build":{"name":"CI Index","rev":"D","changes":[{"rev":"A","date":"2026-10-06","by":"CM","text":"First release. Implements CI Index Template Rev C draft."},{"rev":"B","date":"2026-10-06","by":"CM","text":"Configuration moved into one build block. Editable in the CI Index Builder."},{"rev":"C","date":"2026-10-07","by":"CM","text":"Implements the interface register redesign. The ICD column stays, and its help ties it to the ICD cross-check in the interface coverage check. The Boundaries tab is now Structural floor: each parent and child in different control tiers, and each GFE CI. Sibling pairs are no longer derived. Split and consolidate messages follow the re-mapping rules. Examples: CI-0021 is source-controlled under SCD-2230-001; CI-0031 added; ICD values list every ICD, IRS, and IDD on each CI’s mapped register rows."},{"rev":"D","date":"2026-10-08","by":"CM","text":"Added the Excel columns tab. It shows each column the import reads, the header and save file key it accepts, the minimum to load, the minimum entry for a new CI, what reads each column, and what a blank cell does. The import now finds the header row by CI ID or Parent CI ID. Added Index stage: blank-entry hints for columns that fall due at a later stage are held, so an index filled in stages stays readable. Hints that compare two filled cells always run. The Excel export adds a Column Map sheet and records the stage on the About sheet."}]},"text":{"title":"CI Index","top":"CI Index","sub":"Configuration Management · CI Index Template Rev C draft · Tool rev D draft","h1":"Configuration Item Index","lede":"One record per Configuration Item. The index flags what applies to each CI and points to the record that owns each answer. It does not copy content from those records. The tool checks every row as you work and shows what needs review.","foot":["**Reference.** CI Identification Process Rev I draft, the records and outputs section. CI Index Template Rev C draft.","This tool is a working aid. The index of record is maintained current in the CSA system for the program life.","Nothing is stored in the browser. Save the index to a file before you close the tab. The saved file keeps the edit log. An Excel export does not."],"stem":"CI-Index"},"theme":{"accent":"#A8481F","ink":"#1E262E"},"features":{"tabs":{"overview":true,"table":true,"variants":true,"checks":true,"bound":true,"log":true,"ref":true,"colmap":true},"actions":{"dup":true,"split":true,"cons":true,"dedes":true,"del":true},"sheets":{"about":true,"checks":true,"queue":true,"bound":true,"log":true,"colmap":true},"examples":true},"cols":[{"k":"level","h":"Level","kind":"level","w":6,"help":"Derived from Parent CI ID. 0 is the top-level CI.","group":"","wide":false,"core":true,"req":"","reqGFE":false,"alias":[]},{"k":"id","h":"CI ID","kind":"text","w":11,"help":"Program-unique identifier for the CI. It is not the PIN. Renaming a CI ID updates every parent, variant, and supersession reference to it.","group":"Identification","wide":false,"core":true,"req":"","reqGFE":false,"alias":[],"stage":"cand","reg":true,"blankNote":""},{"k":"parent","h":"Parent CI ID","kind":"parent","w":12,"help":"Every CI except the top-level CI names a parent that exists in the index. The tool derives Level and the name indentation from the parent, so the three forms of hierarchy always agree.","group":"Structure","wide":false,"core":true,"req":"","reqGFE":false,"alias":[],"stage":"cand","reg":true,"blankNote":""},{"k":"name","h":"CI Name / Nomenclature","kind":"text","w":36,"help":"Nomenclature for the CI. Enter it without indentation. The export indents it two spaces per level.","group":"Identification","wide":true,"core":true,"req":"","reqGFE":false,"alias":["CI Name","Nomenclature"],"stage":"cand","reg":true,"blankNote":""},{"k":"type","h":"CI Type","kind":"enum","w":9,"help":"HWCI, CSCI, or Firmware. Computer software is designated as CIs (CSCIs).","group":"Identification","wide":false,"core":false,"req":"", ,"req":"","reqGFE":false,"alias":[],"stage":"ident","reg":false,"blankNote":""},{"k":"life","h":"Life Clock","kind":"enum","w":13,"help":"The category of life limit only. The limit value stays in the product definition data. The recording flags come from the sources, not from the clock.","group":"Product unit records","wide":false,"core":false,"req":"","reqGFE":false,"list":"life","alias":[],"stage":"ident","reg":false,"blankNote":""},{"k":"sh","h":"Special Handling (Y/N)","kind":"yn","w":10,"help":"Y where the product definition data imposes controlled handling, packaging, or storage to keep the item conforming. Special handling is not a criticality designation and not a serialization driver.","group":"Product unit records","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"ident","reg":false,"blankNote":""},{"k":"iuid","h":"IUID Required (Y/N)","kind":"yn","w":10,"help":"Y where item unique identification applies to the CI. The identifier registers carry the unique item identifiers, not this index.","group":"Product unit records","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"ident","reg":false,"blankNote":""},{"k":"notdec","h":"Not Decomposed (supplier-designed unit)","kind":"yn","w":13,"help":"Y where the CI is a supplier-designed item procured as a unit, such as a vendor item or a supplier-designed assembly. The company does not decompose it into further CIs.","group":"Structure","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"sel","reg":false,"blankNote":""},{"k":"status","h":"Status","kind":"enum","w":14,"help":"A CI reads Proposed until the Acquirer concurs. Rows are not deleted once concurred. De-designate the CI, or supersede it by a split or a consolidation.","group":"Selection, concurrence, and status","wide":false,"core":true,"req":"","reqGFE":false,"list":"status","alias":[],"stage":"cand","reg":true,"blankNote":""},{"k":"sup","h":"Supersedes / Superseded By","kind":"text","w":18,"help":"F
