      "Where a same-CI-or-separate decision disagrees with the model, it goes to Systems Engineering for model disposition before it enters the index. Recording it anyway is exactly how two decompositions begin to drift, one entry at a time, each perfectly defensible on its own."),
    C("The model informs the decision. It does not decide it.",[
      "A mismatch does not make either view wrong. A variant family can legitimately be represented as one logical block with several physical realizations, or as sibling blocks. Both are valid, and a mismatch may mean only that the architect stopped abstracting at a different level than you did.",
      "**So carry the screen result to Systems Engineering as engineering evidence for which representation is correct.** Adjudicating the CI question sometimes changes the model. That is an expected outcome of the process, not a workaround, and the resulting decomposition change is itself a re-evaluation trigger.",
      "Where Systems Engineering does not concur, the disagreement is a genuine engineering dispute. Resolve it at a technical review. CM does not re-cut the model, and Systems Engineering does not silently overrule the screen."
    ]),
    C("Why this is a CM problem, not a modeling preference",[
      "Two authoritative decompositions of one product is not an untidiness. Every structural question afterwards, which CI is the parent, which pair of items forms a boundary, which effectivity address a change belongs to: now has two answers and no principled way to choose between them.",
      "**And the fix is never unilateral.** CM does not re-cut the model, and Systems Engineering does not re-cut the CI index. Realignment is done jointly and recorded, because whichever one you quietly edited, you have just created the divergence you were trying to close."
    ],"teal")
  ], check:{
    q:"A program\u2019s architecture model decomposes the system by functional thread rather than by either preferred scheme. What does the CI structure do?",
    o:["Follows a preferred scheme, since that is the standard the technical data uses",
       "Mirrors the functional thread decomposition, with the mapping convention recorded: the obligation is one decomposition, not one particular scheme",
       "Follows the engineering bill of material instead, as a neutral basis both sides can accept",
       "Is held until the model is rebuilt to a preferred scheme"],
    a:1,
    why:"The preference is real but it is a preference. The obligation is that the CI structure and the model remain one decomposition. Mirroring a non-preferred scheme satisfies it; building a preferred-scheme CI structure alongside a functional-thread model creates precisely the divergence the rule exists to prevent. The product structure is the fallback for programs with no model at all, not a neutral third option."
  }},

  {id:"M1-27", title:"Interfaces: coverage, not content", body:[
    P("This is where CM engineers most often misunderstand their own role. The split is not between an active function and a passive one. It is between the **boundary set** and the **boundary content**, and CM owns the first."),
    CARDS([
      {h:"Systems Engineering owns the content", b:"Identifies what crosses each boundary: internal interface requirements between CIs, and external interfaces with other systems, facilities and support equipment. Human Factors identifies the human system interfaces at those boundaries, which are interfaces like any other and are registered like any other. Signs the no-interface determinations. Verifies technical adequacy through the technical review process. CM does not derive interface requirements. **This identification is mandatory for safety.** The obligation sits on the company, so CM does not get to treat it as somebody else\u2019s problem."},
      {h:"CM owns the boundary set", b:"CM owns the CI structure, so CM owns the list of boundaries that exist. CM derives that list, maintains the register keyed to it, verifies every boundary is covered, and controls the interface documentation products: identifiers, release, and inclusion in the documentation determination. CM confirms a representative is designated where an interface control working group exists."}
    ],2),
    P("The CI structure defines a **finite** set of boundaries: every pair of interfacing sibling CIs, every boundary to an external system, and every boundary between Acquirer-controlled and Supplier-controlled levels. Because the set is finite, coverage is checkable, which is the whole reason the register is keyed to the structure."),
    S("Where a boundary has no interface, the register records an explicit no-interface determination signed by Systems Engineering.",
      "A blank cell is indistinguishable from an oversight. A signed determination is a decision with an owner."),
    P("Verify coverage at three points: at CI-list submittal for Acquirer concurrence, at each technical review, and before each baseline establishment. Where modeling is used, add the two-way check that every model interface element resolves to a register row and every row to a model element."),
    C("Four interface requirements are mandatory for safety",[
      "All four are on the register of safety-mandatory requirements. On a safety-significant product line they are performed regardless of what the contract flows down, or dispositioned through the safety disposition gate.",
      "**Identify** the internal and external interface requirements. Systems Engineering does the identifying. The obligation is the company\u2019s.",
      "**Incorporate** the interface information into the functional, allocated and product documentation. That is the documentation determination, covered in M1-28.",
      "**Maintain configuration control** of baselined interface requirements. That is baseline establishment, covered in M1-09.",
      "**Provide a representative** to the Acquirer\u2019s interface control working group where one exists. Conditional on the group existing, and mandatory once it does.",
      "**The interface register and the coverage verification records are CM\u2019s evidence that the first one was performed.** They are what the program safety-requirement disposition record points at. A register with blank rows is not a filing lapse on a safety-mandatory requirement. It is the absence of the evidence."
    ]),
    C("The interface control working group",[
      "An interface sometimes crosses organizations. It may run between two suppliers, or between the system and another system. The Acquirer may run a working group to control it. Where one exists, **a company CM representative is allocated to it, and that allocation is mandatory for safety.** The representative is **empowered to commit** your company to specific interface actions and agreements.",
      "The role carries real obligations: provide the agreed draft interface documentation the specified period before the meeting; update, release, control and re-release the interface documentation reflecting the group\u2019s decisions; and distribute the released documentation to the other participants. CM confirms the representative is designated and records which interfaces are working-group controlled.",
      "**A representative who cannot commit is an observer**: and the group will settle the interface without your company\u2019s position in it."
    ],"teal")
  ], check:{
    q:"Systems Engineering asks you to confirm that the interface requirements between two CIs are technically adequate. What do you do?",
    o:["Confirm it, since CM maintains the interface register",
       "Decline, and offer instead the coverage status, the documentation identified against that boundary, and its controlling baseline",
       "Confirm it after reviewing the interface control document",
       "Refer them to the Acquirer"],
    a:1,
    why:"CM verifies coverage, not adequacy. Accepting would put CM outside its competence and, worse, create a record suggesting interface content had been reviewed when it had not. Offer what CM actually holds."
  }},

  {id:"M1-28", title:"Determining the documentation, and the records you keep", body:[
    P("For each CI, determine the documentation that defines its performance, functional, and physical attributes: interfaces included. This is not a filing decision. The documentation type follows three facts about the item: its maturity, who owns the design, and the level at which it is controlled."),
    CARDS([
      {h:"Performance specifications", b:"For Acquirer-controlled items on performance-based contracts: what the item must do and how that is verified, leaving the design solution to the Supplier."},
      {h:"Detail definition", b:"Detail specifications, drawings, and models where design disclosure is required: the full description of the design solution itself."},
      {h:"Commercial and privately developed items", b:"Commercial item descriptions or form-fit-function data: enough definition to procure, apply, and replace the item without owning its design."}
    ],3),
    P("The interface information identified against each boundary is incorporated into the determined documentation, in the applicable specifications directly, or through referenced interface documentation. **Incorporating it is mandatory for safety.** Where it is not performed, it is dispositioned through the safety disposition gate. An interface defined nowhere in the documentation set is an interface the baseline does not control, and the hazard the interface carried does not care that the omission was clerical."),
    P("The whole identification effort then lives in two records, and their structure is where most of this module\u2019s rules become visible. A well-formed CI index row carries:"),
    L(["The hierarchy level, the CI identifier, and the parent: the structure, expressed consistently three ways.",
       "Nomenclature, the CI type: hardware, software, or firmware, and the Acquirer- or Supplier-control designation.",
       "The owning design activity and its enterprise code, the PIN, and the specification reference.",
       "The safety-critical flag with its hazard reference: the product-level binding of the hazard log.",
       "Baseline status per baseline, audit designation status, and the item\u2019s status."]),
    S("De-designated rows are retained, never deleted, and where one CI carries several part-number variants, the CI-to-PIN variant mapping is recorded in full.",
      "An index that shows only the current answer cannot show how the program got there. And every change and record made under the old designation still points at that identifier. Delete the row and they point at nothing."),
    P("The interface register is the second record. One structural decision does most of the work. **Rows are boundaries, not documents.**"),
    P("Each row carries these fields:"),
    L(["**The boundary type.** Internal CI-to-CI, external, or a control-level boundary between Acquirer-controlled and Supplier-controlled tiers.",
       "**Either the defining documentation with its revision, or the signed no-interface determination.** One or the other, never neither.",
       "**The controlling baseline.** System-boundary interfaces belong to the functional baseline through the system specification. CI-to-CI interfaces belong to the allocated baseline through the item specifications.",
       "**The control authority.**",
       "**The safety-related flag, with its hazard control reference.**",
       "**Variant applicability**, per part-number variant.",
       "**The model element identifier**, where modeling is used."]),
    C("Why boundaries and not documents",[
      "One interface control document may appear on several boundary rows, and one boundary may cite several documents. A register keyed to documents can list everything it has and still not show what is missing. The boundary set is finite and derived from the CI structure, so a boundary-keyed register can be checked for coverage, which is the register\u2019s whole point."
    ],"teal")
  ], check:{
    q:"A CI is de-designated after the Acquirer concurs it no longer warrants separate control. What happens to its row in the CI index?",
    o:["Deleted: the index reflects the current CI set",
       "Moved to an archive file outside the index",
       "Retained, with the status changed to de-designated",
       "Retained only if the CI was safety-critical"],
    a:2,
    why:"Designation history is part of the traceability record. Changes, status entries, and audit results made while the item was a CI all reference that identifier: deleting or exporting the row orphans them. The status field exists precisely so the index can hold the full history and still answer \u201cwhat is a CI today?\u201d with a filter."
  }},

  {id:"M1-29", title:"Acquirer concurrence", body:[
    S("Potential CIs must be selected AND submitted for Acquirer review and selection concurrence.",
      "A program that has selected excellent CIs and never submitted them is non-compliant."),
    P("Read the underlying requirement carefully: it requires potential CIs to be selected **and submitted** for Acquirer review and concurrence. Selection alone does not satisfy it."),
    L(["**Submit** the proposed CI list: candidates, selection results and rationale, for Acquirer review and concurrence.",
       "**Resubmit** when the design evolves, when new candidates emerge, and when designated CIs are proposed for de-designation.",
       "**Remember** that final designation authority for Acquirer-controlled CIs rests with the Acquirer. Selection is iterative, so concurrence is too."]),
    P("Below the Acquirer-controlled level, the Supplier determines which items to place under internal configuration management and what documentation types to use. Subcontractor-developed items are CIs from the Supplier\u2019s point of view, and equivalent CM requirements are flowed to the subcontractor, which is where Module 2 begins.")
  ], check:{
    q:"A program has applied the criteria carefully, recorded rationale for every candidate, and produced a well-structured CI index. It has never submitted the list to the Acquirer. Where does it stand?",
    o:["Compliant, since the requirement is about selection quality",
       "Compliant, provided the list is delivered at the next design review",
       "Non-compliant: the requirement is to select AND submit for review and concurrence",
       "Compliant for Supplier-controlled CIs only"],
    a:2,
    why:"Selection alone does not satisfy the requirement. Treat submittal as part of selection rather than a follow-on task, and resubmit on every iteration, because designation authority for Acquirer-controlled CIs is not yours."
  }},

  {id:"M1-30", title:"Same CI or separate CIs: the principle", body:[
    P("Two or more items carry different part numbers and look closely related. Same function, same subsystem, same vendor. Do they share one CI identifier with part-number variants, or get designated separately? This is the most common judgment call you will be asked to make."),
    P("The question runs two ways, and the two ways take different paths. **Path A** compares two or more distinct items against each other. **Path B** handles one part number installed in more than one place. Decide which one you are in before you start, because the triggers differ and answering path A triggers on a path B problem produces a confident wrong answer."),
    S("The CI identifier follows function and the management need for separate control. The PIN follows form, fit and function.",
      "They answer different questions and are decoupled on purpose."),
    CARDS([
      {h:"Multiple PINs under one CI", b:"Variants of one managed function that are not interchangeable with each other: different interface details, say, but share one specification basis, one verification basis, and common change effectivity. Example: three variants of one valve, tabulated in a single specification, changed as a family."},
      {h:"One PIN under multiple CIs", b:"The same physical item instantiated in subsystems performing distinct functions. Example: one antenna part number installed once in the UHF subsystem and once in MIDS JTRS, one PIN, two CIs. Each satisfies a different end-use function, sits in a different branch of the hierarchy, and needs its own effectivity address, hazard traceability and logistics reporting."}
    ],2),
    C("The thing to remember",[
      "Neither \u201cthey have different part numbers\u201d nor \u201cthey are the same part number\u201d decides the CI question. **Do not designate CIs to solve a part-numbering problem**: the PINs already capture non-interchangeability."
    ])
  ], check:{
    q:"One cooling fan part number is installed in the mission computer for processor thermal management, and in the environmental control unit as part of cabin air recirculation. How many CIs and how many PINs?",
    o:["One CI, one PIN: it is the same hardware",
       "Two CIs, two PINs: records should match",
       "Two CIs, one PIN: different end-use functions, different branches, different effectivity addresses; but one design definition",
       "One CI, two PINs: the installations differ"],
    a:2,
    why:"Different end-use functions and different parents drive separate CIs, and the two installations need independent effectivity addresses. Nothing about that creates a non-interchangeable condition, so the PIN does not split. Creating a second part number to \u201cmake the records match\u201d is designating identity to solve a bookkeeping discomfort."
  }},

  {id:"M1-31", title:"The triggers, and four cautions", body:[
    P("The assessment runs in four stages. Establish where you are. Clear the scope questions. Pass the qualifying gates. Then run the separation triggers. Any single trigger separates on its own, so the triggers are a logical OR, and every one of them is run and recorded even after the first has fired."),
    P("The labels below are the labels on the decision tool and in the process appendix. Use them when you record a verdict, because a rationale citing S4 can be checked and one citing \u201cthe specification gate\u201d cannot."),
    TABLE(["Stage","Node","Question","Trigger \u2192 result"],[
      ["Context","C1","Are these items already designated as a CI? Not yet, one CI today, or separate today","Sets whether the verdict is a first designation, a split, or a consolidation. Not a trigger"],
      ["Scope","P1","Is any item inside a larger item procured as a unit from its designing supplier?","YES \u2192 re-frame the comparison at the procured level and continue. A scope check, not a stop"],
      ["Scope","P2","Is this assessment about computer software?","YES \u2192 read version identifier for PIN, and build or load for variant, throughout"],
      ["Qualify","Q1","Does each item satisfy a system end-use function?","NO \u2192 not CI candidates. Control within the parent CI. Stop"],
      ["Qualify","Q2","Does each item meet at least one CI selection criterion?","NO \u2192 parts, not CIs. The PINs already capture the differences. Stop"],
      ["Trigger","S1","Do the items perform different end-use functions?","YES \u2192 separate CIs"],
      ["Trigger","S2","Do the items sit under different parents in the hierarchy? (answer from the model where used)","YES \u2192 separate CIs"],
      ["Trigger","S3","Is ANY one of the items safety-critical?","YES \u2192 separate CIs"],
      ["Trigger","S4","Does either item have or need its own specification for performance or for interfaces?","YES \u2192 separate CIs. NOT ESTABLISHED \u2192 hold"],
      ["Trigger","S5","Do the items have or need different verification requirements or different verification plans?","YES \u2192 separate CIs. NOT ESTABLISHED \u2192 hold"],
      ["Trigger","S6","Will changes to one item routinely need a separate change or maintenance effectivity address?","YES \u2192 separate CIs"],
      ["Trigger","S7","Does Acquirer direction, nomenclature or logistics force separation?","YES \u2192 separate. No trigger fired at all \u2192 one CI, multiple PIN variants"],
      ["Model","M1 / M2","Where modeling is used: does the verdict match the model?","**Every verdict runs this check, including a separation verdict.** NO \u2192 hold and route to Systems Engineering. YES \u2192 record"]
    ]),
    S("P1 looks like gate 3 and behaves oppositely.",
      "On the checklist, the procurement question is gate 3 and it **ends** the screen. You stop and go screen the parent instead. Here, P1 **re-frames** the comparison at the procured level and the assessment continues. Same fact, two different consequences, and knowing gate 3 well is exactly what makes people get P1 wrong."),
    S("Establish C1 before you run anything.",
      "The same verdict means different work depending on where you started. Separate CIs against items not yet designated is a first designation. The same verdict against one existing CI is a split. The same verdict again where the items are already separate confirms what you have. Three different pieces of work, one verdict, and M1-33 covers the two that restructure."),
    CARDS([
      {h:"S3: safety separates on ANY item, not all", b:"A safety-critical variant sharing a CI with a non-critical one either forces the whole CI to inherit safety obligations, or blurs hazard-to-CI traceability. Both are worse than a second CI number. If all are safety-critical, they are also separated, because each needs distinct hazard traceability. Answer S3 from the safety management system. Do not re-determine the consequence here."},
      {h:"S4: the interface control document caution", b:"Appearing on the same interface control document is NOT evidence of a common interface. If the document distinctly calls out separate interfaces for each item, analyze that before you answer no. Distinct callouts usually mean different mating definitions and different interface change traffic."},
      {h:"S5: verification is usually the deciding fact", b:"One qualification and acceptance basis must cover all variants. The verification picture is often unknown early, and that is common rather than careless. Obtain it before deciding. Deciding without it means deciding twice."},
      {h:"S6: effectivity is the day-to-day discriminator", b:"If a change or a maintenance interval on one variant must routinely be dispositioned, tracked and cut in independently, each variant needs its own effectivity address. If changes travel across the family, one CI suffices. **S6 is the trigger that catches an influencing part.** S3 never will, because an influencing part fails the safety criterion by its own definition."}
    ],2),
    C("Two verdicts are holds",[
      "**Not established is an answer.** Where S4 or S5 cannot be answered from what is known today, the assessment holds. Name the fact, name who owns it, and ask in writing. Any trigger that already fired still stands, and the hold does not undo it.",
      "**A verdict that does not match the model holds too**, and routes to Systems Engineering for model disposition before it is recorded.",
      "Neither hold is a failure to decide. Each is a decision not to decide yet, and each is recorded as one. The alternative is deciding twice, and the second decision is always the expensive one."
    ]),
    C("Recording a separate-CI verdict",[
      "Splitting a CI creates new boundaries, and they do not register themselves. On any separate-CI verdict, verify that **every pairwise boundary between the new sibling CIs** appears in the interface register or carries a signed no-interface determination."
    ])
  ], check:{
    q:"Three relays share a function and a parent, none is safety-critical, and their interfaces are described as \u201cslightly different.\u201d Verification requirements have not yet been established. What is the correct next step?",
    o:["Designate one CI with three part-number variants: nothing has triggered separation",
       "Designate three separate CIs, because the interfaces differ",
       "Answer S5 not established and hold. Obtain the verification answer, and analyze whether one specification really can define interfaces for all three",
       "Escalate to the Acquirer for direction"],
    a:2,
    why:"S5 is frequently where the decision actually turns, and the interface control document caution on S4 applies squarely to \u201cslightly different interfaces.\u201d Recognizing that you cannot yet decide is the correct answer here. Naming the fact you need, and who owns it, is the rest of it."
  }}
,

  {id:"M1-31b", title:"One part number in more than one place", body:[
    P("The triggers in the previous section compare two or more distinct items against each other. That is decision path A. It does not fit the reverse case, because in the reverse case there is only one item."),
    S("One part number, installed in more than one place, runs a different path.",
      "Path A asks what is different between two items. Here nothing is different about the item. What differs is where it sits and what it is doing there. So the comparison is between the item instances and their next higher items together, never between the items alone."),
    P("Four triggers. Any single YES separates. The qualifying gates and the model check still apply, exactly as they do on path A."),
    TABLE(["Node","Question","YES means"],[
      ["B1","Does each item instance satisfy a different end-use function?","Separate CIs"],
      ["B2","Does each item instance sit under a different parent in the hierarchy?","Separate CIs"],
      ["B3","Does each item instance need its own change or maintenance effectivity address?","Separate CIs"],
      ["B4","Is one item instance safety-critical when another is not?","Separate CIs"]
    ]),
    P("The verdict is separate CIs against one part number. Nothing about installing one item in two places creates a non-interchangeable condition, so the part number does not split. Two CI identifiers, one design definition."),
    C("State the cost before you adopt this verdict",[
      "One part number under two CI identifiers carries a consequence for the life of the program, and it is not a small one.",
      "**The CI identifier no longer resolves from the item alone.** It resolves from the item and its installed position together.",
      "The as-built record has to carry the CI identifier at the installation, not on the part.",
      "Status accounting has to key on the CI and the position together.",
      "**Marking on the part cannot carry the CI identifier.** The part is one part number, and there is nowhere on it for a second answer to live."
    ]),
    S("Confirm that the status accounting system supports position-keyed CI identity before you record this verdict.",
      "Record that confirmation with the rationale. A verdict the tooling cannot hold is a verdict that will be quietly abandoned by whoever inherits the records, and nobody will be able to say when."),
    P("Everything else follows the normal path:"),
    L(["Record the rationale on the selection criteria checklist, citing every trigger that fired.",
       "Verify every pairwise boundary between the new siblings in the interface register.",
       "Apply the product unit record-structure test to the item and to its component parts.",
       "Submit for Acquirer concurrence."])
  ], check:{
    q:"One cooling fan part number is installed in the mission computer and in the environmental control unit. The two installations perform different end-use functions, sit under different parents, and would take a bearing-life change on different schedules. You reach a two-CIs-one-PIN verdict. What must happen before you record it?",
    o:["Nothing further: three triggers fired, so the verdict is settled",
       "Create a second part number so the CI identifiers and the part numbers stay aligned",
       "Confirm that the status accounting system supports position-keyed CI identity, and record that confirmation with the rationale",
       "Obtain System Safety concurrence, since one installation may later be classified safety-critical"],
    a:2,
    why:"The triggers give you the verdict. The confirmation is what makes the verdict recordable, because from here the CI identifier resolves only from the item and its installed position together, and the as-built record and status accounting both have to carry it that way. Creating a second part number is the error this whole section exists to prevent: nothing here made the two installations non-interchangeable, and inventing a part number to make the records look symmetrical is designating identity to solve a bookkeeping discomfort."
  }},

  {id:"M1-32", title:"Worked examples: same CI or separate?", body:[
    P("Three walks. The first two are path A, comparing items against each other. The third is path B, one part number in more than one place. Notice in each how few triggers actually do any work: the verdict nearly always turns on one, and your job is to find which."),
    STEPS([
      {h:"Two fuel pump variants, one safety-critical", b:"Same end-use function, same parent, and one specification could comfortably define both. Same verification basis. But hazard analysis classifies failure of the high-pressure variant as capable of causing loss of primary system capability, and the low-pressure variant\u2019s as not. **S3 triggers on ANY item being safety-critical, not all of them. Separate CIs.** Sharing one identifier would either force the non-critical variant to inherit the safety obligations, or blur hazard-to-CI traceability. Both are worse than a second CI number."},
      {h:"Two power distribution unit variants differing in input voltage", b:"Same function, same parent, neither safety-critical. One tabulated specification defines performance and interfaces for both. One qualification and acceptance basis covers both. Changes travel across the family and cut in together. Nothing triggers. **One CI, two part-number variants**: with the variant mapping recorded and the interface callouts tabulated per variant."},
      {h:"One antenna part number installed in two subsystems", b:"The reverse case, and the one that trips people. **This is path B, so run B1 through B4 rather than the S triggers.** The same physical item is installed once in the UHF subsystem and once in MIDS JTRS. B1 asks whether the instances satisfy different end-use functions, and they do. B2 asks about parents, and these differ too. **Two CIs against one part number.** Nothing here creates a non-interchangeable condition, so the part number does not split. Then state the cost and confirm the tooling: from here the CI identifier resolves only from the item and its installed position together, and status accounting has to support that before the verdict is recorded. No second part number is invented to make the records look symmetrical."}
    ],"tl"),
    P("Five shorter ones, with the trigger that decides each:"),
    TABLE(["Scenario","Decides at","Verdict"],[
      ["Two display unit variants; the Acquirer directs that one carry its own nomenclature","S7","Separate CIs. External direction forces it"],
      ["Three cable assembly variants; a change to one is routinely dispositioned and cut in on its own schedule","S6","Separate CIs. Each needs its own effectivity address"],
      ["Two valve variants, alike in every respect, but the qualification basis for the second has not been established","S5","Answer not established and hold. Obtain the verification answer, because deciding without it means deciding twice"],
      ["Two connector variants appearing on one interface control document, with distinct callouts for each","S4","Analyze the callouts. Distinct callouts usually mean different mating definitions and separate interface change traffic, which separates"],
      ["Two brackets with different part numbers; neither meets any criterion on the screen","Q2","Parts, not CIs. The part numbers already capture the difference. Do not designate CIs to solve a part-numbering problem"]
    ]),
    C("What each verdict obliges you to record",[
      "**Separate CIs:** each gets its own hierarchy position, documentation determination, effectivity address and baseline management, and every pairwise boundary between the new siblings appears in the interface register or carries a signed no-interface determination.",
      "**One CI, multiple variants:** the variant mapping goes in the index, and the specification is tabulated by variant including per-variant interface callouts.",
      "**Two CIs against one part number:** the CI identifier is recorded against the installed position rather than against the part, and the status accounting confirmation is recorded with the rationale.",
      "**Any verdict:** apply the product unit record-structure test to each variant and its component parts, submit for Acquirer concurrence, record the verdict citing every trigger that fired, and re-run the assessment on trigger, including a variant later diverging in specification, verification, effectivity or safety classification."
    ])
  ], check:{
    q:"Which situation produces two CI identifiers but only one part number?",
    o:["Two variants of one managed function that are not interchangeable with each other",
       "The same physical item instantiated in two subsystems that perform distinct end-use functions",
       "An item whose nomenclature the Acquirer directs be split",
       "Two items with the same function whose verification bases differ"],
    a:1,
    why:"Different end-use functions and different parents drive separate CI identifiers, but nothing about installing one item in two places creates a non-interchangeable condition, so the part number does not split. The first option is the mirror image: one CI carrying several part-number variants. The identifiers are decoupled on purpose, and they move for different reasons."
  }}
,

  {id:"M1-33", title:"De-designation, splits and consolidations", body:[
    P("A CI structure is not a ratchet. Three mid-life changes have mechanics worth knowing before you meet one, because each touches identifiers, boundaries and records at the same time."),
    S("The same-CI decision detects all three at node C1.",
      "That is what the current-designation question is for. A separate-CIs verdict against items not yet designated is a first designation. The same verdict against one existing CI is a split. The same verdict where the items are already separate confirms what you have. Run C1 first and the assessment tells you which of the three you are in."),
    CARDS([
      {h:"De-designation", b:"An item stops being separately managed. For an Acquirer-controlled CI the designation was theirs, so the de-designation is theirs too: proposed, submitted and concurred like any other selection change. The item does not become uncontrolled: it returns to control within its parent CI\u2019s documentation, and **the parent has to be named.** The index row is retained with the status changed, never deleted."},
      {h:"Split", b:"One CI becomes two or more. CI identifiers change, because the management need changed. Part numbers do not move unless the split created a non-interchangeable condition, and unit identifiers never move at all. Every pairwise boundary between the new siblings appears in the interface register or carries a signed no-interface determination, and each new CI needs its own documentation determination, effectivity address and baseline management."},
      {h:"Consolidation", b:"Several CIs become one. The part-number variants come with it, and the variant mapping is recorded against the surviving CI. Boundaries that used to be interfaces between the old CIs become internal to the new one: those register rows are dispositioned, with the reason recorded, rather than quietly abandoned."}
    ],3),
    S("Identifiers move for management reasons. Part numbers move for interchangeability reasons. Unit identifiers never move at all.",
      "Three restructurings, one rule, and it is the same rule you met in the very first identifier section. Everything here is that principle applied while the program is running."),
    S("Apply the product unit record-structure test again after any of the three.",
      "The product unit record structure follows the test, not the CI structure. **A split does not create a serialization obligation. A consolidation does not remove one.** Run the product unit record-structure test against the surviving CIs and their component parts, and record the result with the rest of the assessment."),
    P("All three are selection changes, and they are treated as such. Each one is assessed against the criteria with the rationale recorded, submitted for Acquirer concurrence where the CIs are Acquirer-controlled, recorded in status accounting, and followed by a fresh interface coverage check."),
    P("None of the three is a records-tidying exercise that CM performs alone."),
    C("Why the retained row matters more than it looks",[
      "Every change, every status entry, every audit result and every delivered unit\u2019s record made while the item was a CI still references that identifier. Delete the row and all of them point at nothing.",
      "**The index answers two different questions:** what is a CI today, and what was a CI when this record was written. A status field answers both. A deletion answers only the first, and silently corrupts the second."
    ])
  ], check:{
    q:"A program proposes to de-designate an Acquirer-controlled CI that no longer warrants separate management. Who decides, and what happens to the item?",
    o:["CM decides, records the rationale, and the item is controlled by its own drawings thereafter",
       "The program decides; the Acquirer is notified at the next review",
       "The Acquirer decides, since the designation was theirs, and the item returns to control within its parent CI\u2019s documentation, with the parent named and the index row retained",
       "The item cannot be de-designated once a baseline has been established against it"],
    a:2,
    why:"Designation authority for Acquirer-controlled CIs rests with the Acquirer, and so does the authority to remove it: the proposal is submitted and concurred like any other selection change. And de-designation moves an item to a different level of control rather than out of control: the parent whose documentation now governs it must be identified, exactly as it would be for a candidate rejected at the end-use gate."
  }}
 ],
 exercises:[
  {id:"M1-E1", title:"Exercise 1. The end-use gate",
   scen:"Screen each item against the end-use function gate only. State pass or fail, and if it fails, say where the item is controlled instead.",
   parts:[
     {id:"a", q:"A titanium alloy billet, specified by material standard, from which structural fittings are machined."},
     {id:"b", q:"A structural bracket that carries no load-path requirement of its own, but positions a safety-critical sensor to its specified alignment."},
     {id:"c", q:"The compiler used to build the flight software."}
   ]},
  {id:"M1-E2", title:"Exercise 2. The criteria screen",
   scen:"A cabin pressure control valve is a candidate CI. It is procured from a single qualified source with a fourteen-month lead time. Hazard analysis classifies its failure as capable of causing loss of primary system capability. It requires a dedicated test set for depot maintenance and will appear in the technical manuals. The Acquirer has expressed no view.",
   parts:[
     {id:"a", q:"Which criteria does it meet? List every one that applies, with a one-line justification each."},
     {id:"b", q:"How many criteria are needed to designate it? Why list more than one?"},
     {id:"c", q:"What concurrence, if any, would be needed if the program proposed NOT to designate it?"}
   ]},
  {id:"M1-E3", title:"Exercise 3: Same CI or separate?",
   scen:"Three relays carry different part numbers. Same end-use function, same sub-subsystem, same vendor, same maintenance requirements. None is safety-critical. Interfaces are \u201cslightly different.\u201d Verification requirements are not yet established. The program uses a model-based architecture.",
   parts:[
     {id:"a", q:"Walk the nodes in order, C1 through the model check, and state the outcome at each. Say which path you are on and why."},
     {id:"b", q:"Identify the trigger at which the decision actually turns, name it by its label, and say what you would need before deciding."},
     {id:"c", q:"The relays all appear on one interface control document. Does that settle the interface question? Explain."},
     {id:"d", q:"Assume you conclude \u201cone CI, three part-number variants.\u201d List everything that must now be recorded, and where."}
   ]},
  {id:"M1-E4", title:"Exercise 4, One part number, two places",
   scen:"A cooling fan assembly, one part number, is installed inside the mission computer (processor temperature) and inside the environmental control unit (cabin air recirculation). The installations are on different branches of the CI hierarchy, maintenance is planned separately, and a bearing-life change would be cut in on different schedules.",
   parts:[
     {id:"a", q:"One CI or two? Which path are you on, and which triggers drive your answer?"},
     {id:"b", q:"How many PINs are involved? Does your answer to the CI question change that?"},
     {id:"c", q:"If the fan in the mission computer is later classified safety-critical and the other is not, what changes? Name the trigger."},
     {id:"d", q:"Before you record a two-CIs-one-PIN verdict, what has to be confirmed, and with whom? Say what goes wrong later if nobody confirms it."}
   ]},
  {id:"M1-E5", title:"Exercise 5: Interface register coverage",
   scen:"A CI has just been split into two sibling CIs. Before the split, the parent had documented interfaces to three external systems and to two sibling CIs.",
   parts:[
     {id:"a", q:"List every boundary that must now appear in the interface register."},
     {id:"b", q:"One new sibling has no connection to one of the external systems. What goes in the register for that boundary, and who signs it?"},
     {id:"c", q:"At what three points is coverage verified?"}
   ]},
  {id:"M1-E6", title:"Exercise 6: Identifiers",
   scen:"Unit serial 0047 of a designated CI is modified in service. The modification changes the mounting flange pattern, so the item can no longer be installed in place of an unmodified unit.",
   parts:[
     {id:"a", q:"Does the PIN change? Does the serial number? Does the CI identifier? Give the reason for each."},
     {id:"b", q:"Name three records that must be updated as a result."}
   ]},
  {id:"M1-E7", title:"Exercise 7. The safety disposition gate",
   scen:"A program is tailoring its CM requirements at the start of a safety-significant development. It proposes not to perform a requirement that turns out to be mandatory for safety, on the grounds that the contract does not flow it down and the schedule is tight. The item\u2019s pre-anchored severity is catastrophic.",
   parts:[
     {id:"a", q:"Walk the gate. What is the first thing you establish, and what are the program\u2019s options once you have established it?"},
     {id:"b", q:"The program offers an alternative control it says achieves the same thing. Who decides whether that is true, and against what?"},
     {id:"c", q:"The alternative is not accepted, and the program still wants to proceed. Who signs, and at what level? What would change if the severity had been severe rather than catastrophic?"},
     {id:"d", q:"A colleague suggests re-rating the severity for this program, arguing the design makes the hazard less likely here. How do you answer?"},
     {id:"e", q:"The requirement is performed after all. What still has to be recorded, and why does it matter that the record is queryable?"}
   ]},
  {id:"M1-E8", title:"Exercise 8: Identifiers under a firmware change",
   scen:"A designated CI is a controller with embedded firmware. The hardware device and its code are controlled together on a single altered-item drawing. A defect is corrected in the code; the hardware is untouched, and the corrected units cannot be installed alongside uncorrected ones in the same system.",
   parts:[
     {id:"a", q:"Under this control arrangement, how many part numbers represent the device, and what does the part number now stand for?"},
     {id:"b", q:"What happens to the part number, and what happens to the serial numbers of units that are reworked to the new code?"},
     {id:"c", q:"The program is considering controlling the code separately from the device on future builds. What would change about the identifiers, and what would you gain and lose?"},
     {id:"d", q:"Whichever arrangement is used, what identification does every version of the code itself require?"}
   ]},
  {id:"M1-E9", title:"Exercise 9. The three documentation sets",
   scen:"An avionics processing unit is a designated CI on a performance-based contract, approaching preliminary design review. It contains a commercially procured processor module. Accepting a delivered unit requires a special calibration fixture that does not exist yet. The unit is life-limited.",
   parts:[
     {id:"a", q:"Which requirements belong in the allocated documentation for this CI, and which stay at system level in the functional documentation? Give one concrete example of each."},
     {id:"b", q:"The calibration fixture is needed to inspect the item at acceptance. Where is its design documented, and under which baseline?"},
     {id:"c", q:"The processor module is commercial and the supplier will not release its internals. What must the product documentation still say about it?"},
     {id:"d", q:"The contract is performance-based and requires no design disclosure. What does that change about the product documentation, and what does it not change?"},
     {id:"e", q:"Eight months after the product baseline is established, a change is approved. What happens to the documentation, and what must the new revision be able to show?"},
     {id:"f", q:"Where does verification appear across the three sets? Name what each set\u2019s verification content is for."}
   ]},
  {id:"M1-E10", title:"Exercise 10: Reading an index and a register",
   scen:"You are handed the identification records for a subsystem you have never seen. The index shows: a level-2 subsystem CI, Acquirer-controlled, safety-critical flag set with a hazard reference, product baseline planned; beneath it three level-3 CIs, two Supplier-controlled and one Acquirer-controlled; one of the three is a software CI with no allocated baseline date recorded; one carries three part-number variants on the variant sheet; and one row is marked de-designated with its status changed but its baseline dates still populated. The register carries five boundary rows for these CIs, one of which is a signed no-interface determination, and two of which cite the same interface control document with different variant applicability.",
   parts:[
     {id:"a", q:"How many CIs are actively designated here, and how do you know without counting rows?"},
     {id:"b", q:"The software CI has no allocated baseline date. Name two different things that could mean, and say what you would look at to tell them apart."},
     {id:"c", q:"Two register rows cite the same interface control document. Is that an error? Explain what the register is keyed to and why that answers the question."},
     {id:"d", q:"The de-designated row still shows baseline dates. Should those be cleared? Why or why not?"},
     {id:"e", q:"Is the register\u2019s coverage complete for these four CIs? State how you would check, and what number of boundary rows you would expect to find."},
     {id:"f", q:"The parent CI is flagged safety-critical but one child is not. What would you want to confirm about that, and with whom?"}
   ]},
  {id:"M1-E11", title:"Exercise 11: Translating safety evidence",
   scen:"You are the CM engineer on a military transport program derived from a civil type, so both a military system safety population and civil airworthiness limitations exist. In one week, the following crosses your desk. (1) The customer\u2019s engineering authority issues a critical safety item designation for a flap track fitting. (2) The system safety analysis names \u201ccargo fire suppression\u201d as a safety-critical function. (3) The airworthiness limitations list a corrosion inspection task for a wing zone. (4) The maintenance program shows a shelf-life limit on the cargo compartment fire suppression bottles. (5) The engine overhaul manual identifies two influencing parts for the fan disc life model. (6) A drawing arrives with a key characteristic flagged on a bracket hole pattern.",
   parts:[
     {id:"a", q:"For each of the six, name what the evidence is attached to: an item, a function, a task, a location or zone, or a feature."},
     {id:"b", q:"Which of the six answer the safety-critical screen on their own? For those, what does CM record?"},
     {id:"c", q:"For the fire suppression function and for the bottles themselves, write the exact request you would send to the safety team."},
     {id:"d", q:"The flap track fitting is small, and a colleague argues it fails the end-use function gate. Respond."},
     {id:"e", q:"The two influencing parts: which screen do they pass, and why not the safety-critical screen?"},
     {id:"f", q:"The wing zone inspection task and the bracket key characteristic: what do you screen in each case, and where does control live if no CI is designated?"},
     {id:"g", q:"Name one class of safety-significant item that none of this week\u2019s evidence would ever surface, and say how those items get found."}
   ]},
  {id:"M1-E12", title:"Exercise 12: Reading a situation",
   scen:"You join a program at preliminary design review. You find: a CI index with 340 entries, most at bracket and connector level; no candidate list; an interface register with 61 rows, 22 blank in the \u201cdefining documentation\u201d column; and a model that decomposes the system by ATA chapter while the CI index is organized by the contract work breakdown structure.",
   parts:[
     {id:"a", q:"Name each problem you see and say what it will cost if left alone."},
     {id:"b", q:"Which one would you address first, and why?"},
     {id:"c", q:"Which of these can CM fix alone, and which need another function to act?"}
   ]}
,
  {id:"M1-E13", title:"Exercise 13: Building a structure from scratch",
   scen:"A new program will deliver a podded surveillance radar carried on a transport aircraft. It comprises: an antenna assembly with a positioner; a transmitter unit; a receiver and signal processing unit running two software applications, the signal processing chain and an operator display, on separate processors; a power conditioning unit bought as a catalog item to a vendor\u2019s part number; a liquid cooling unit procured to your source control drawing from one qualified vendor with an eleven-month lead time; interconnecting cable assemblies; and the pod structure with its radome. Hazard analysis identifies the pod attachment fittings as safety-critical: failure could release the pod in flight. The system interfaces to the aircraft mission computer and to aircraft power. The contract line items are the radar system and a separate spares package. No architecture model exists yet.",
   parts:[
     {id:"a", q:"Produce the candidate list. Say who you would expect to have nominated each candidate, and name anything you are including only because it must be screened rather than because you expect to designate it."},
     {id:"b", q:"Screen each candidate: gate result, and every criterion met with a one-line rationale. State your verdict for each, including the ones you reject and where they are controlled instead."},
     {id:"c", q:"Lay out the structure: levels, parents, and which CIs you would expect to be Acquirer-controlled. Say what basis you used for the decomposition, given that no model exists."},
     {id:"d", q:"How do you handle the two software applications, one software CI or two? Give the questions you asked, not just the answer."},
     {id:"e", q:"List every boundary that must appear in the interface register. Include the external ones."},
     {id:"f", q:"Which of your verdicts would you expect to be challenged at Acquirer review, and what would you have ready?"},
     {id:"g", q:"Six months later the cooling skid vendor is replaced with a second qualified source and the shelter is redesigned to be non-transportable. What do you re-open?"}
   ]},

  {id:"M1-E14", title:"Exercise 14: Read the specification like CM",
   scen:"Below is a fragment of a specification for an environmental control unit. Read it as a CM engineer nominating candidates. Do not screen and do not designate anything yet.\n\n3.1.1 The environmental control unit shall condition bleed air to supply cabin air at the temperatures of Table 3-1.\n\n3.1.4 The unit shall comprise an air cycle machine, a heat exchanger, a water separator, and a temperature control valve.\n\n3.2.2 The temperature control valve shall receive commands from the cabin temperature controller over the aircraft data bus.\n\n3.2.9 The air cycle machine bearings shall be lubricated by the oil system of 3.5.\n\n3.3.4 The heat exchanger core shall be replaceable at the organizational maintenance level.\n\n3.4.1 The unit shall be qualified to the vibration and thermal environments of Appendix B.\n\n3.5.2 Oil shall conform to the specification of Appendix D and shall be replaced at intervals not exceeding those of Table 3-4.\n\n4.2.6 Each air cycle machine shall be marked with a serial number and shall carry a record of operating hours since new.\n\n5.1.3 Embedded software in the temperature control valve shall be reloadable without valve removal.\n\nAppendix B, Note 3: Units delivered to the extended-range configuration use the high-flow heat exchanger of drawing 88-4471-02 in place of the standard core.",
   parts:[
     {id:"a", q:"List every noun in this fragment that names a thing. Do not filter yet. Say which ones have a requirement written against them, because that is your strongest nomination signal."},
     {id:"b", q:"Find the boundaries. Which requirements name two things at once, and what would you ask about each boundary? Name the document you would ask for."},
     {id:"c", q:"Find the identification and traceability signals. Quote the words that produced each one, and say what product unit record each implies."},
     {id:"d", q:"Find the qualification, supportability, and software signals. For each, say which function you would take the question to and what you would ask them."},
     {id:"e", q:"Appendix B Note 3 does something the body of the specification does not. What is it, and what does it add to your candidate list?"},
     {id:"f", q:"Produce your candidate list. For each entry, give the one-line reason it is a candidate. Do not screen it and do not designate it."},
     {id:"g", q:"Name one thing you cannot answer from this document, and say who you would ask."}
   ]},

  {id:"M1-E15", title:"Exercise 15: Read the FMECA like CM",
   scen:"Below are rows from a FMECA on the same environmental control unit. Read them as a CM engineer nominating candidates. Do not screen and do not designate anything yet.\n\nItem: Air cycle machine turbine wheel. Failure mode: Burst. Effect: Uncontained release, loss of unit, possible structural damage. Criticality: 1. Cause: Fatigue, overspeed.\n\nItem: Bearing oil. Failure mode: Degradation. Effect: Elevated bearing wear rate. Criticality: 4. Cause: Thermal cycling, contamination.\n\nItem: Overspeed protection function. Failure mode: Loss of protection. Effect: Turbine overspeed not prevented. Criticality: 1. Cause: Multiple.\n\nItem: Temperature control valve. Failure mode: Fails open. Effect: Cabin overtemperature. Criticality: 2. Cause: Actuator jam.\n\nItem: Heat exchanger core. Failure mode: Internal leakage. Effect: Bleed air contamination of cabin air. Criticality: 1. Cause: Corrosion, fatigue.\n\nItem: Water separator coalescer. Failure mode: Blockage. Effect: Reduced flow. Criticality: 3. Cause: Contamination.\n\nItem: Mounting bracket. Failure mode: Fracture. Effect: Unit displacement, duct strain. Criticality: 2. Cause: Fatigue.\n\nItem: Unit nameplate. Failure mode: Illegible. Effect: Identification not readable. Criticality: 4. Cause: Abrasion.\n\nAnalysis note: This FMECA covers the unit as delivered. The bleed air supply upstream of the unit inlet is analyzed separately.",
   parts:[
     {id:"a", q:"Which items enter the candidate set on the strength of their own failure consequence? Give the one-line reason for each."},
     {id:"b", q:"Which rows require clarification before you can do anything with them? Say exactly what you would ask and who you would ask."},
     {id:"c", q:"Now look sideways. Which row describes a failure whose consequence lands on a different item, and what does that make the first item? Name the pattern."},
     {id:"d", q:"The turbine wheel is criticality 1 and the bearing oil is criticality 4. Explain why criticality is not a CI selection criterion, using these two rows."},
     {id:"e", q:"Read the analysis note. What does it tell you about what is missing, and what would you do about it?"},
     {id:"f", q:"One row produces no candidate at all. Which one, and why does that matter to say out loud?"},
     {id:"g", q:"Produce your candidate list, then compare it against the list you produced in Exercise 14 from the specification. Which items appear in only one of the two, and why? Hold both lists. You will lay a third beside them in Exercise 16."}
   ]},

  {id:"M1-E16", title:"Exercise 16: Read the hazard analysis like CM",
   scen:"Below is an extract from a subsystem hazard analysis on the same environmental control unit you worked in Exercises 14 and 15. Read it as a CM engineer nominating candidates. Do not screen and do not designate anything yet.\n\nHAZ-101. Hazard: Uncontained turbine burst. Cause: Turbine wheel overspeed following load loss. Severity: Catastrophic. Control: Overspeed protection implemented in the unit controller software, plus a containment ring around the turbine section. Verification: Overspeed test and containment demonstration.\n\nHAZ-102. Hazard: Cabin air contamination. Cause: Heat exchanger internal leakage admitting bleed air contaminants. Severity: Critical. Control: Heat exchanger core leak test at overhaul, interval stated in the airworthiness limitations. Verification: Test procedure and interval substantiation.\n\nHAZ-103. Hazard: Cabin overtemperature. Cause: Temperature control valve fails open. Severity: Critical. Control: Independent overtemperature sensor and shutoff, separate from the primary control loop. Verification: Failure mode test.\n\nHAZ-104. Hazard: Turbine bearing failure leading to burst. Cause: Loss of lubrication. Severity: Catastrophic. Control: Oil replacement interval and oil specification conformance. Verification: Bearing life substantiation.\n\nHAZ-105. Hazard: Unit displacement in flight. Cause: Mounting bracket fatigue fracture. Severity: Critical. Control: Bracket inspection interval, and torque control procedure at installation. Verification: Fatigue analysis and inspection interval substantiation.\n\nHAZ-106. Hazard: Crew injury during servicing. Cause: Hot surface contact at the bleed air inlet. Severity: Marginal. Control: Warning placard adjacent to the inlet flange, and a cool-down step in the servicing procedure. Verification: Inspection of installed placard.\n\nAnalysis note: This analysis addresses the unit and its installation. Bleed air quality upstream of the unit inlet is controlled by the engine bleed system analysis.",
   parts:[
     {id:"a", q:"Work the control column, not the hazard column. For each of the six records, say where the control actually lives: a design feature in an item, a software function, a life limit or interval, a separation or routing rule, a marking, or a procedure."},
     {id:"b", q:"Which controls resolve to an item you can nominate, and which resolve to a document? For the document cases, name the document you would ask for and say why its baseline matters."},
     {id:"c", q:"HAZ-103 describes an independent sensor and shutoff, separate from the primary loop. What is the control really, and what can a change destroy without touching either part number?"},
     {id:"d", q:"HAZ-104 controls a catastrophic hazard using an oil interval and an oil specification. What does that make the oil, and how does this row connect to the row you flagged in Exercise 15?"},
     {id:"e", q:"HAZ-106 is only marginal severity and its control is a placard and a procedure. Explain why it is still a CM concern, and name the two configuration-controlled things it produces."},
     {id:"f", q:"Read the severity column across all six. What does severity determine, and what does it not determine? Be precise about the difference between severity and CI selection."},
     {id:"g", q:"Read the analysis note. What is outside this analysis, and what would you do about it?"},
     {id:"h", q:"Produce your candidate list. Then lay it beside your lists from Exercises 14 and 15. Which items appear in all three sources, which in only one, and what does the pattern tell you about nominating from a single document?"}
   ]}
 ]
},

{
 id:"M2", label:"Module 2", title:"Sub-Supplier CM Flowdown",
 sub:"Imposing CM requirements on the supply chain, and proving they work",
 sections:[
  {id:"M2-01", title:"Why flowdown exists", body:[
    P("Performing configuration management includes responsibility for the CM performance of the supply chain. The governing obligation: **flow to sub-suppliers the same CM requirements imposed on the company, or suitable tailorings of them.**"),
    P("Two words do most of the work. *Same* sets the default: the starting point is everything, not nothing. *Suitable* permits reduction, but suitability has to be established and recorded."),
    S("A barrier that exists at this tier and not at the tier that performs the work is not a barrier.",
      "If your company controls change and records as-built configuration, but the supplier who actually builds the item does neither, the control does not exist where the risk is. The paperwork is at one address and the hazard is at another."),
    CARDS([
      {h:"Not a sixth CM function", b:"The requirements flowed are identification, change, status accounting and audit requirements: the same four you already know. This process governs how they are selected, imposed and verified at the supplier tier."},
      {h:"Every tier, every procurement", b:"Design, build, software or firmware development, repair or overhaul, special processes, or catalog items incorporated into the product. A supplier with sub-tiers of its own flows the same obligation downward."},
      {h:"These requirements flow too", b:"Requirements mandatory for safety flow to every tier. A supplier-tier proposal to tailor or omit one is dispositioned through the safety disposition gate and recorded: performed, replaced by a documented equivalent control, or risk-accepted at the named authority. Never silently dropped."}
    ],3)
  ], check:{
    q:"What is the default position when deciding what CM requirements to flow to a sub-supplier?",
    o:["Flow the minimum the contract explicitly requires",
       "Flow everything imposed on the company, then reduce only where suitability is established and recorded",
       "Flow whatever the supplier\u2019s quality system already covers",
       "Flow requirements proportionate to the value of the purchase order"],
    a:1,
    why:"\u201cSame requirements, or suitable tailorings\u201d sets the default at everything. Reduction is permitted but must be earned: suitability has to be established and recorded, never assumed."
  }},

  {id:"M2-02", title:"Two questions drive everything", body:[
    CARDS([
      {h:"1. Who holds design authority?", b:"The company, the supplier, the vendor, or split, with the company controlling form, fit, function, interface and qualification while the supplier owns the internals. This determines whether the supplier can change anything, which decides whether change control applies."},
      {h:"2. Who performs the build?", b:"The company, the supplier, or nobody: a process-only service. This determines whether there is an as-built configuration to reconcile, which decides whether the whole traceability and reconciliation apparatus applies."}
    ],2),
    P("Item type, whether hardware, software, commercial item or service, is a modifier on the answer rather than a third question."),
    S("Every other requirement in the matrix follows from those two facts.",
      "Which is why classification is performed before derivation, and why a procurement whose classification cannot be determined is not released until it can.")
  ], check:{
    q:"Why are design authority and who-performs-the-build the two questions that drive classification?",
    o:["Because they are the two facts most reliably stated in a purchase order",
       "Because they determine price and schedule risk",
       "Because they determine whether change control applies and whether there is an as-built configuration to reconcile",
       "Because the Acquirer requires both to be recorded"],
    a:2,
    why:"They determine what can go wrong. Design authority decides whether the supplier can change anything. Who builds decides whether there is an as-built to reconcile against released design."
  }},

  {id:"M2-02b", title:"The words you will meet in this module", body:[
    P("Module 2 uses a working vocabulary that will be unfamiliar if you have not written a subcontract before. None of it is difficult. All of it is used precisely, and a word used loosely here is how requirements go missing."),
    TABLE(["Term","What it means here"],[
      ["Statement of work","The document that tells a supplier what to do. CM requirements reach a supplier through it, or they do not reach the supplier at all. Often abbreviated SOW, and when it is a subcontract to a supplier you may see SSOW."],
      ["Flowdown","Passing a requirement from your company down to a supplier. A requirement that exists at your tier and not at the tier doing the work is not protecting anything."],
      ["Work type","One of nine categories describing what kind of work a supplier performs for you. It is decided by two questions and it determines what you impose."],
      ["Classification","The recorded decision that a given procurement is one or more work types. It is written on the classification log, with a name and a date."],
      ["Requirement matrix","The workbook that maps each work type to the requirements it receives. You read down the column for your work type."],
      ["Deliverable","A defined data item the supplier submits: content, frequency or trigger, and submittal terms. Every requirement is cited with one, unless it is a conduct or access obligation."],
      ["Tailoring","Imposing a requirement in modified form. Tailoring is legitimate and is recorded. Silently dropping a requirement is not tailoring, it is omission."],
      ["Conditional requirement","A requirement that applies only if a stated condition is true, such as the presence of embedded software. You resolve it before citation and record the basis."],
      ["As-built","What was actually manufactured and installed in a specific unit. It is compared against the released design, and the comparison is the reconciliation."],
      ["Reconciliation","Comparing as-built against released design and dispositioning every difference. It runs continuously at scale, and audits sample it."],
      ["Delta","A difference the reconciliation finds. Every delta is dispositioned, meaning somebody decides what happens about it."],
      ["Variance","Approval to accept a departure from the released design, requested before delivery. Also called a deviation or waiver depending on timing and local convention."],
      ["Nonconformance","A condition that does not meet the released design. It is recorded, dispositioned by the required authority, and the disposition is then carried out and verified."],
      ["Effectivity","The point at which a change takes effect, usually stated as a unit or line number. It answers the question: starting with which one?"],
      ["Unit identifier","The number that identifies one physical item. It is a serial number where the item is tracked individually, or a lot or batch number where a whole lot is accepted together."],
      ["Traceability record","The record that ties each delivered item to its part number, its unit identifier, its designations, and the assembly above it."],
      ["Designation","This word carries four meanings, so it never stands alone. Say which one every time. Designated **as a CI** means the item is managed as a configuration item. Designated **for audit** means the item will receive a formal configuration audit. A **part attribute designation** means a part carries a safety-critical, life-limited or special handling attribute. An **external criticality designation** is a label that arrives from a customer, a regulator or a certification basis, such as a critical safety item or an engine life-limited part. All four are separate decisions, made by different people against different tests, and an item can carry the last two while being neither of the first two"],
      ["Accrual","Logging evidence as it arrives rather than collecting it when somebody asks. Evidence gathered after the question is asked is a reconstruction."],
      ["Determination","The recorded judgment of whether a supplier CM process is effective. It is made against the requirements you actually imposed on that supplier."],
      ["Sub-tier","A supplier of your supplier. Requirements flow to them too, through your supplier, which is what recursion means."]
    ]),
    C("Two words to be careful with",[
      "**Severity.** Two scales use this word and they are not the same one. **Barrier severity** is the band a floor requirement sits in, catastrophic or severe. It is pre-anchored and a program cannot re-rate it. **Hazard severity** is the category the safety analysis assigns to a specific hazard, catastrophic through negligible. Say which one you mean. And neither of them tells you what product unit record an item needs.",
      "**Designated.** Always say which kind, because there are four. Being a CI, being audited, carrying a part attribute, and carrying an external criticality label are separate decisions, made by different screens, at different times. A part inside a procured vendor item can be life-limited and serialized without ever being a CI, and that is ordinary rather than an anomaly.",
      "**Life limited.** This means two different things. An item limited by flight cycles or operating hours is tracked per unit. An item limited by shelf life or cure date is tracked by lot with a date code. The phrase is identical and the product unit record structure is opposite. This is the two-clocks rule from M1-08b, and the product unit record-structure test there governs here too."
    ])
  ], check:{
    q:"A supplier asks whether they may deliver a part that departs slightly from the drawing. The departure is acceptable to engineering. What is the correct instrument, and when?",
    o:["A nonconformance record raised after delivery","A variance request, submitted before the affected unit is delivered","A change proposal, submitted after the lot ships","No instrument is needed if engineering agrees"],
    a:1,
    why:"A variance is approval to accept a departure, and it is requested before delivery. Engineering agreeing verbally is not an approval anybody can find later. If the same departure keeps recurring and is permanently acceptable, it stops being a variance and becomes a change proposal."
  }},

  {id:"M2-03", title:"The nine work types", body:[
    P("Every procurement is classified into one or more of nine work types. The type is decided by two questions. Who holds design authority for the item? Who performs the build? Each type carries its own identifier, WT01 through WT09, and those identifiers are used on the classification log and in the statement of work."),
    TABLE(["ID","Work type","What it is","Design authority","Build by"],[
      ["WT01","Build-to-print","The company designs the item. The supplier manufactures it to the released technical data package.","Company","Supplier"],
      ["WT02","Source-controlled design and build","The supplier designs the internals under a company source control drawing. The company fixes the outside of the item and the qualification.","Supplier for internals. Company for form, fit, function, interface, and qualification.","Supplier"],
      ["WT03","Design agent","The supplier develops the design. The company performs the build. The technical data package is the deliverable.","Supplier develops. Company owns.","Company"],
      ["WT04","Full CI design and build to company specification","The supplier designs the CI against a company specification and also manufactures it. This is the heaviest flowdown in the taxonomy.","Supplier, at CI level","Supplier"],
      ["WT05","Vendor item, commercial or catalog item","An item of the vendor own design, selected as offered. The company controls selection through a vendor item control drawing. It does not control the item.","Vendor","Vendor"],
      ["WT06","Software or firmware development","Development of deliverable software or embedded code. It is usually combined with another type rather than standing alone.","Supplier, per specification","Supplier"],
      ["WT07","Repair and overhaul","As-maintained records, retrofit incorporation, and retention of unit identifiers and life through part-number changes.","Company. Supplier where delegated.","Supplier"],
      ["WT08","Special process services","Process work only, with no item design. Flowdown is process specification control and change notification.","Company, through the process specification","Not applicable"],
      ["WT09","Installation build to company-provisioned materiel","The supplier assembles a complete end item by executing installation work orders. The materiel is provided by the company rather than bought by the supplier.","Company","Supplier, for installation and integration"]
    ]),
    C("Two names that changed, and why it matters",[
      "WT04 used to be called full CI development. That name never said the supplier builds the item. The type it is most easily confused with is WT03, the design agent, where the supplier develops a design and does not build. The two most confusable types were using the same word for the thing that separates them.",
      "WT05 used to be called catalog item. That name never mentioned vendor items. A vendor-item-controlled procurement is the case people most often fail to classify, and the usual mistake is filing it as WT02. That mistake imposes a design-authority requirement set on a supplier that holds no design authority."
    ]),
    P("Typical examples. Machined parts to released drawings are WT01. Source-controlled valves, actuators, and power supplies are WT02. Design houses producing drawings and models are WT03. Major subsystem development subcontracts are WT04. Catalog connectors and commercial computing are WT05. Operational flight program subcontracts and embedded firmware are WT06. Depot and OEM repair stations are WT07. Heat treat, coating, plating, and non-destructive inspection are WT08. Licensed or contract final assembly lines are WT09.")
  ], check:{
    q:"A supplier develops and builds an actuator under your source control drawing. You control form, fit, function, interface and qualification. They are the design activity for the internals. Which work type?",
    o:["WT01 Build-to-print","WT02 Source-controlled design and build","WT03 Design agent","WT04 Full CI design and build"],
    a:1,
    why:"Design authority is split and the supplier builds. That is WT02. WT01 puts no design authority at the supplier at all. WT03 has the company performing the build. WT04 has the supplier holding design authority against a company specification, with the company baselining at the allocated level."
  }},

  {id:"M2-03b", title:"Company-provisioned materiel, and why WT09 exists", body:[
    P("WT09 is the newest work type. It covers a supplier who assembles a whole end item, such as an aircraft, from materiel the supplier did not buy."),
    P("The materiel arrives in one of three ways. It may be issued as a kit against a kit content list. It may be furnished loose, item by item, from a bonded store or straight to the line. Or the company may direct the purchase, raising the demand and choosing the source, with the supplier simply receiving and installing. All three are called company-provisioned materiel."),
    C("The sentence that defines the type",[
      "The company holds the demand. The supplier executes the installation.",
      "The company raises the demand, picks the source, and holds design authority for everything embodied. The supplier verifies what it receives, executes installation work orders written against company-released data, and owns the as-built record of the finished end item."
    ]),
    P("The three provisioning modes create the same CM problem. In every case the supplier receives materiel whose configuration was decided somewhere else. The supplier has to check it against released content before installing it. Only the thing being checked against differs. It is a kit content list, or an issue document, or a receiving record against a company purchase order."),
    C("Why WT09 is not just build-to-print",[
      "A WT01 supplier buys its own material to a drawing and delivers a component. The CM question is whether the part conforms.",
      "A WT09 supplier delivers an end item built from materiel it did not select. The CM question is different. Was the right configuration embodied, on the right unit, at the right effectivity?",
      "A WT09 supplier also delivers with open work. Deferred jobs, shortages, travelers, and carried deviations are normal at delivery. That is exactly where end-item configuration control fails, and no other work type has to manage it."
    ]),
    P("WT09 also has an audit role no other type has. The system-level audit happens where the end item is assembled. That supplier holds no design authority, so it cannot conduct the audit. It hosts it instead, providing the article, the floor, access to the installation zone, and the assembled evidence, while the company or the customer conducts.")
  ], check:{
    q:"Your company buys the avionics, ships them to a supplier, and that supplier installs them into the aircraft it is assembling for you. What classifies this as WT09?",
    o:["The supplier is large enough to assemble an aircraft","The company holds the demand and the supplier executes the installation","The avionics arrived as a kit","The supplier holds design authority for the installation"],
    a:1,
    why:"The defining split is demand versus execution. The company raised the demand and chose the source; the supplier installs what arrives. Kitting is only one of three provisioning modes, so the absence of a kit changes nothing. The supplier holds no design authority in WT09, and size is irrelevant to classification."
  }},

  {id:"M2-04", title:"Mixed classification, and the record", body:[
