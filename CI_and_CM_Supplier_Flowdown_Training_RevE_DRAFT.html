    why:"This is the influencing part pattern. The blanket fails the safety criterion on its own terms, which is why screening on safety alone misses it. It passes criterion (a), the system-functioning screen, because the bearing life limit was approved on the assumption of a particular thermal environment, and the blanket is part of that assumption. Physical attachment is not the reason and would not be a criterion. Ask RM&SH to confirm the dependency, then nominate it."
  }},

  {id:"M1-11e", title:"How CM reads a system safety hazard analysis", body:[
    P("This is the most consequential of the three documents, and the one CM engineers read least well. A specification tells you what exists. A FMECA tells you what fails. **A hazard analysis tells you what is protecting you.** That matters to CM more than either of the others, because a configuration change can remove a protection without anybody noticing that a protection was there."),
    C("Where these documents come from",[
      "System safety work in defense programs runs to **MIL-STD-882E**, the standard practice for system safety. It defines a set of analysis tasks, and the ones CM meets most often are the **subsystem hazard analysis (SSHA)** and the **system hazard analysis (SHA)**. The subsystem analysis looks inside a subsystem at component failure modes, human errors, and single point and common mode failures. The system analysis looks at the interfaces and interactions between subsystems.",
      "882E also defines two terms CM must keep apart. A **safety-critical function** is a function whose failure or incorrect performance could contribute to a hazard with catastrophic or critical consequence. A **safety-critical item** is a hardware or software item determined through analysis to potentially contribute to such a hazard. A function is not an item. Only the second one is something you can put in a CI index.",
      "The living record is the **hazard tracking system**. It is not a report issued once. It is revised as hazards are identified, as controls are implemented, and as risk is accepted, which is why a revision to it is a re-identification trigger.",
      "882E is explicit that system safety personnel are not responsible for hazard management in other disciplines, and that the disciplines coordinate. Its planning task names **configuration control and data management** among the functions whose interrelationship with the hazard effort must be defined. CM is named in the standard. Reading these reports is part of that relationship."
    ]),
    P("Here is an extract from a fictional analysis on a flight control system. Read the **control column first.** That is the CM habit that separates a useful reading from a filing exercise."),
    TABLE(["Hazard","Cause","Severity","Control","What CM does with it"],[
      ["Uncommanded elevator movement","Control law computes an erroneous surface command","Catastrophic",
       "Dual-channel command monitor implemented in the operational flight program, with cross-channel comparison",
       "**The control lives in software.** That software is a safety-critical item and a CI by rule. Its configuration now carries a hazard control, so a version change is a safety question, not just a software question. Record the hazard reference against the CI."],
      ["Loss of surface position feedback","Sensor failure","Critical",
       "Triplex sensor architecture with voting logic",
       "**The control is an architecture, not a part.** Ask which items realize it: three sensors, the wiring that keeps them independent, and the voting logic. Redundancy does not relieve the screen. Each item is screened, and the independence between them is itself something a change can destroy."],
      ["Actuator jam","Output gear fracture","Catastrophic",
       "Gear life limit of 15,000 cycles under the fracture control plan",
       "**The control is a life limit.** That forces a product unit record structure: the gear is serialized and life tracked, with consumed life carried at delivery. Then look sideways. What does the lifing basis assume about lubrication, cooling, or duty cycle? Those items influence the limit and are candidates."],
      ["Pod release in flight","Attachment fitting fracture","Catastrophic",
       "Fitting designated fracture critical and traceable, with an inspection interval in the airworthiness limitations",
       "**Three consequences at once.** The fitting is a safety-critical item. It is serialized and traceable because the traceable subclass requires it. And the inspection interval is an airworthiness limitation, which drives marking and technical manual content."],
      ["Loss of both control channels","Shared electrical power source","Catastrophic",
       "Separate feeds from independent buses, with physical separation of the two harness runs",
       "**The control is a routing rule, not a part.** No single item implements it. Ask what document enforces it: an installation drawing, a separation requirement in an interface control document, or a zonal routing standard. That document is controlled information and its baseline matters. A harness rerouted during a fit problem can remove this control with every part number unchanged."],
      ["Crew injury during maintenance","Stored hydraulic pressure released on disconnect","Critical",
       "Warning placard at the access panel, and a depressurization procedure in the maintenance manual",
       "**The weakest tier of control, and still CM\u2019s problem.** 882E orders mitigations by precedence, and warnings and procedures sit at the bottom because they depend on people. The placard has a part number and a location. The manual has a revision. Both are configuration-controlled, and both can be lost in a change nobody flagged as safety-relevant."]
    ]),
    C("The reading technique",[
      "**Read the control column first.** The hazard tells you why something matters. The control tells you what CM has to protect.",
      "**Resolve every control to an item or a document.** Every control lands in one of six places: a design feature in an item, a software function, a life limit or inspection interval, a physical separation or routing rule, a marking or placard, or a procedure in a manual. Each of those has an owner and a change stream.",
      "**Where the control names a function, ask which hardware implements it.** That identification is engineering analysis. Ask for it. Do not infer it, because a good guess produces a candidate set that looks complete and is not.",
      "**Read the severity.** It sets the authority required to accept residual risk, and it is the pre-anchored severity that the safety disposition gate uses later. An item hosting a catastrophic-severity control is not one you quietly tailor a requirement off.",
      "**Read the verification column.** It tells you what evidence closes the hazard. That same evidence is what the functional audit will look for, so a hazard control with no named verification is a finding waiting to happen.",
      "**Watch the analysis boundary and the multiple-cause entries.** Items outside the boundary were never analyzed. They are not absent because they are safe."
    ]),
    S("The item that hosts a hazard control is the item whose configuration must not drift.",
      "That is the whole reason CM reads these reports. A hazard is accepted on the basis that a control is in place. If the configuration of the item hosting that control changes and nobody connects the two, the risk acceptance is still on file and is no longer true."),
    P("Record the hazard reference against the CI in the index. That single cross-reference is what lets somebody, two years from now, answer the question that matters: if we change this item, what were we relying on it for?")
  ], check:{
    q:"A hazard record reads: hazard, loss of both flight control channels; cause, shared power source; severity, catastrophic; control, separate feeds from independent buses with physical separation of the harness runs. No part number appears anywhere in the record. What does CM do?",
    o:["Nothing. No item is named, so there is no CI consequence",
       "Nominate both harnesses as CIs, since they implement the control",
       "Identify what document enforces the separation, treat that document as controlled information carrying a hazard control, and ask engineering which items and which installation data realize the routing",
       "Refer it to System Safety, since it is a safety matter rather than a configuration matter"],
    a:2,
    why:"The control is a routing rule, so no single part implements it and nominating the harnesses alone would miss the point. What enforces separation is a document: an installation drawing, a separation requirement in an interface control document, or a zonal standard. That document is where the control actually lives, so its baseline and change control are what protect the risk acceptance. The items still get identified, but you have to ask engineering which ones, because the record does not say."
  }},

  {id:"M1-12", title:"What makes something a Configuration Item", body:[
    P("Here is the definition, as it stands in the process, in the decision aid, and on the tools. Use it as written."),
    C("Configuration Item (CI)",[
      "Any hardware, software, firmware, or aggregation thereof that satisfies a system end-use function and is designated for separate configuration management. Designation includes establishing the CI\u2019s requirements and verifying that its configuration meets those requirements and that its configuration documentation accurately describes its configuration."
    ]),
    P("Three parts of that carry weight. **Satisfies a system end-use function** is the gate. **Designated for separate configuration management** is the screen. And the second sentence is the part people skip, because it says what designating an item as a CI actually obliges: establish the requirements, verify the configuration meets them, and verify the documentation describes it. Designating a CI is not a filing act. It is a commitment to do three things for the life of the item."),
    P("The screen runs in two steps. Step 1 is three qualifying gates. All three must pass. Step 2 is the criteria screen."),
    STEPS([
      {h:"Gate 1: the item gate", b:"Is the candidate an item, rather than a function, a task, a failure mode, a feature, or a location? Only an item can be a CI. If NO: the candidate cannot be designated. It is a signal that items worth screening exist nearby. Ask for the items that implement it, screen those, and stop. Section M1-16 is about getting from a label to the items behind it."},
      {h:"Gate 2: the end-use function gate", b:"Does the item satisfy a system end-use function? If NO: not a CI candidate. Record the rationale, identify the parent CI whose documentation controls it, and stop. Raw materials, bulk commodities and purely structural elements with no defined functional role fail here."},
      {h:"Gate 3: the procurement level gate", b:"Is the item a child of a commercial, catalog or vendor item, and is it procured inseparable from that parent? If YES: screen the procured parent instead. Do not decompose a supplier-designed item. Record the parent that was screened in its place, and stop. Section M1-18 is about why this gate exists."},
      {h:"Step 2: the criteria screen", b:"Designate as a CI if the item meets or impacts one or more of seven criteria, plus the software rule. One YES is sufficient."}
    ]),
    S("Three gates, then the screen. A candidate that fails any gate never reaches the criteria.",
      "Which gate an item failed is a fact the record has to carry, because the three failures mean different things. Gate 1 says you were screening the wrong kind of thing. Gate 2 says the item has no function of its own. Gate 3 says you were screening at the wrong level."),
    S("Items that are not CIs are not uncontrolled: they are controlled within their parent CI\u2019s configuration documentation.",
      "The question is never \u201ccontrolled or not.\u201d It is \u201ccontrolled at what level, with what independence.\u201d"),
    C("Record the rationale for every candidate",[
      "Record the assessment and reasoning for **every candidate**, whether designated or not. This is the step new engineers skip most often, and the one that costs most later.",
      "A list of selected CIs shows an outcome. A candidate list showing what was considered and rejected, and why, shows that judgment was exercised. When the Acquirer asks why a particular assembly is not a CI, \u201cit isn\u2019t on the list\u201d is not an answer."
    ])
  ], check:{
    q:"A titanium billet, specified by material standard, is the stock from which several structural fittings are machined. How is it treated?",
    o:["Designated as a CI because it is critical to structural integrity",
       "Fails gate 2, the end-use function gate. Controlled within the parent CI\u2019s documentation via the material specification",
       "Designated as a CI only if it is sole-source",
       "Left outside configuration control entirely"],
    a:1,
    why:"Raw material satisfies no system end-use function of its own, so it never reaches the criteria screen. It is still controlled, by the material specification called out on the drawings of the parts made from it, inside the parent CI\u2019s documentation."
  }},

  {id:"M1-13", title:"The criteria screen", body:[
    P("One YES is sufficient. Four is not four times as designated, but listing all four is worth doing, because each is an independent reason the designation survives if one fact later changes."),
    TABLE(["Ref","The screen","The criterion, as the checklist words it","What it looks like in practice"],[
      ["(a)","System-functioning screen","Critical to the functioning of the system","The system cannot perform its mission without it. Not \u201cuseful\u201d: necessary"],
      ["(b)","Safety-critical screen","Failure might result in serious injury, loss of life, or loss of primary system capability","Screen every safety-critical item here. This screen is mandatory for safety"],
      ["(c)","Technology screen","Technology is complex, not well known, and critical to acquisition, operational, or supportability goals","All three conditions, not one of them. Novel or immature technology the program actually depends on. Complexity on its own does not meet this screen"],
      ["(d)","Acquirer-designation screen","The item is under control as designated by the Acquirer","Broader than a contract line naming the item as a CI. Any designation assigned by a customer or government activity engages this criterion. The Acquirer\u2019s act of placing an item under control is theirs to make, not yours to predict"],
      ["(e)","Separate-identity screen","Requires separate type designation, versions, or nomenclatures","The item needs its own formal name, model number or version identity"],
      ["(f)","Risk-and-cost screen","Critical or high risk; failure would have significant financial impact","Long lead, sole source, high value, or a failure that stops a line"],
      ["(g)","Logistics screen","Requires dedicated logistics support elements: APL, AEL or ACL provisioning lists; test equipment, whether general purpose, special purpose or built-in; technical manuals; PMS MIP and MRC; danger or caution tag-out","Any one of them is enough. Test equipment counts even when it is general purpose, which is the one people exclude by habit"],
      ["SW","The software rule","Item is computer software","Designate it as a software CI. The process documents, the checklist and the standard all call it a **computer software configuration item**, or CSCI. Same thing. A rule, not a judgment"]
    ]),
    P("**APL, AEL and ACL** are distinctive provisioning lists. **PMS MIP and MRC** are planned maintenance system documentation, the maintenance index pages and the maintenance requirement cards. You will meet all five as acronyms on the checklist and nowhere else."),
    S("Letter it and name it. Every time, in speech and on the form.",
      "\u201cIt meets criterion (g), the logistics screen, and criterion (b), the safety-critical screen.\u201d The letter is what the checklist, the concurrence rules and the safety linkage rule all key on, so a rationale without it cannot be checked against the form. The name is what tells a reader what you actually found, so a rationale without it sends them hunting. Give both and neither problem exists."),
    P("Programs may adopt supplemental criteria. The usual candidates are these:"),
    L(["Independent end-use function.",
       "Separate change effectivity address.",
       "Commonality across systems, or interfaces with an existing CI.",
       "Interchangeability level, or separate delivery or installation.",
       "Separate performance and test requirements, or independent testability.",
       "Configurable state, or new or modified design."]),
    S("Supplemental criteria only expand the screen.",
      "They cannot narrow it and they cannot tailor a mandatory criterion. A program that adopts a supplemental criterion has added a way to reach yes. It has not bought a way to reach no. Check what your program has adopted before you start screening."),
    S("Record the rationale and the document reference against every criterion, whether the answer is yes or no.",
      "The checklist gives you two fields per row for this. A yes with no document behind it is an assertion. A no with no document behind it is the one a reviewer will ask about first, because it is the answer that ended the assessment.")
  ], check:{
    q:"A valve is sole-source with a fourteen-month lead time, and the Acquirer has expressed no view on it. Which screen does the lead time engage?",
    o:["The Acquirer-designation screen, since they will probably want it designated",
       "The technology screen",
       "The risk-and-cost screen: critical or high risk, where failure would have significant financial impact",
       "None; lead time is a procurement matter, not a CI screen"],
    a:2,
    why:"Sole source with a long lead is exactly the risk-and-cost screen: a failure or an uncontrolled change stops the line for over a year. The Acquirer-designation screen applies only where the Acquirer has actually designated the item: predicting what they will want is not the same as designation."
  }},

  {id:"M1-14", title:"Three standing rules", body:[
    CARDS([
      {h:"Software", b:"Computer software is designated as a software CI. Product-unique identifiers also go to elements of the software development environment that form part of the system: compilers, linkers, loaders, developmental libraries, configuration settings, automation scripts. If the build cannot be reproduced without it, it needs an identity."},
      {h:"Safety linkage", b:"Any item identified as safety-critical under the safety management system is screened against criterion (b), the safety-critical screen, and usually criterion (a), the system-functioning screen, too. Consider both direct failure modes and cascading effects. If criterion (b) was answered yes and the item is **not** designated a CI, the rationale requires System Safety concurrence. A CM engineer does not make that call alone."},
      {h:"Requirements mandatory for safety", b:"Criterion (b), the safety-critical screen, is mandatory for safety. On safety-significant product lines it is performed regardless of what the contract flows down. Any proposal not to perform it goes through the safety disposition gate and is recorded, never quietly dropped."}
    ],3),
    C("The consequence to hold on to",[
      "Three years from now, a field failure requires you to rebuild the delivered software load and compare it byte-for-byte against what is in the unit. If the compiler version, build settings and library state were never identified, and the toolchain has since been upgraded, the load cannot be reproduced.",
      "That means the product baseline cannot be demonstrated, which means the physical configuration audit for that CI was never actually satisfiable."
    ],"teal")
  ], check:{
    q:"A program proposes not to designate a safety-critical actuator as a CI, arguing it is adequately controlled within its parent assembly. What is required?",
    o:["Nothing. CM may record the rationale and move on",
       "Acquirer approval only",
       "System Safety concurrence on the rationale, with the proposal dispositioned through the safety disposition gate and recorded",
       "A design change to remove the safety criticality"],
    a:2,
    why:"The safety-critical screen is mandatory for safety, so a proposal not to perform it goes through the safety disposition gate and is recorded. And a safety-critical item not designated a CI needs System Safety concurrence on the rationale. CM does not make that call alone."
  }},

  {id:"M1-15", title:"Designations that answer the safety-critical screen for you", body:[
    P("CM teams and safety teams often talk past each other. CM asks: what are the safety-critical parts? Safety asks back: what types of critical parts do you mean? Both questions are fair. Neither can be answered as asked. This section and the next three give you the vocabulary that fixes the exchange."),
    P("Start with the easiest case. Some designations land directly on a part. Their own definitions state a consequence that meets the safety-critical screen. When one of these lands on an item, the screening question is already answered."),
    TABLE(["Designation","Where you will meet it","Why it always meets the safety-critical screen","Product unit record it implies"],[
      ["A critical safety item, assigned by the customer\u2019s engineering authority","Military aviation programs. A legacy version of the label appears on older drawings. **Verify** the legacy label against the drawing before relying on it","Its definition is the safety-critical screen in different words. Failure could cause loss of the aircraft, serious injury, or loss of life","Lot or batch at minimum, with traceability to an approved source. Serialization only where a separate requirement imposes it, never by the designation itself"],
      ["A safety-critical **item** from the system safety analysis","Any program running a formal system safety program","It names hardware or software that analysis found could contribute to a catastrophic or critical mishap","Not set by the external criticality designation. It follows from the control chosen to mitigate the hazard. A life limit gives a serial number. An acceptance requirement gives lot or batch. A design-based mitigation may give neither"],
      ["A fracture critical part, and its traceable subclass","Military airframe structure, under the structures control plan","Failure by cracking would cause loss of the aircraft","The traceable subclass is serialized. The base class may be lot-controlled with heat traceability"],
      ["A fracture critical engine component","Military engines. The basis usually arrives through the statement of work. **Verify** against the governing contract","Same consequence. Failure would be catastrophic","Conditional. Determined by the fracture control plan rather than by the label"],
      ["An engine life-limited part","Civil engine certification, FAA environment","This population is defined by hazardous failure consequence. The life limit is how that consequence is managed","Serial number. The clearest case there is: remaining life is a per-unit quantity and back-to-birth records depend on it"],
      ["Engine, propeller, and auxiliary power unit critical parts","Civil certification, EASA environment","Primary failure is likely to produce a hazardous effect","Serial number where an airworthiness limitation attaches"],
      ["A rotorcraft critical part","Civil rotorcraft certification","Failure could have a catastrophic effect on the rotorcraft","Serial number where an airworthiness limitation attaches. Otherwise lot or batch"],
      ["Fracture critical hardware, per the fracture control board","Spaceflight programs","Failure from a crack would produce a catastrophic hazard","Serial number, with material traceability"],
      ["A safety-related structure, system or component","Nuclear applications, on the quality list","Required to perform a safety function, or to prevent or mitigate the consequences of an accident","Lot or batch, under commercial grade dedication against identified critical characteristics. A catastrophic-consequence item that is legitimately not serialized"]
    ]),
    C("Read the fourth column across before you assume",[
      "Every row above satisfies criterion (b), the safety-critical screen. Every row also carries a product unit record, and the records are nothing alike. They run from serialization driven by a per-unit life clock, to lot control with traceability to an approved source on an item whose failure would be catastrophic.",
      "**Both are real control. Lot control is not the weak version of serialization.** It is the correct answer where the approved basis for continued service is conformance to an approved source rather than the history of one article.",
      "**Determine the product unit record from the test in M1-08b, never from the external criticality designation.** The designation answers a selection question. It does not answer a product unit record question, and reading one off the other is how programs serialize populations that gain nothing from it and lot-control populations that needed a per-unit history.",
      "Rows marked **Verify** rest on terminology that is program-specific, contract-specific, or subject to recent revision. Confirm those against the governing contract or the current issue of the cited document before you rely on them."
    ]),
    S("When one of these lands on an item, the safety-critical screen is met. CM records the designation. CM does not re-determine it.",
      "The consequence judgment was made by qualified people. It was accepted by an authority. Your job is to record it, cite the external criticality designation as the basis, and keep screening, because the other criteria still matter. A customer-assigned designation also engages criterion (d), the Acquirer-designation screen. Sustainment reach usually engages criterion (g), the logistics screen. List every criterion that applies, by letter and by name."),
    C("The \u201cit is just a bolt\u201d escape hatch, closed",[
      "These designations often land on small parts. A fitting. A bushing. A fastener. An assessor may argue the part fails the end-use function gate. That argument rejects the part at gate 2, before the safety criterion is ever reached.",
      "The rule: **an external criticality designation from the table above satisfies gate 2.** The designation is evidence that the part performs a function with system-level consequence. An assessor who still concludes the part fails the gate needs System Safety concurrence in writing. That decision goes through the safety disposition gate, on the same terms as any other non-designation of a safety-critical item."
    ]),
    P("One caution before moving on. This table under-catches. The safety-critical screen also covers loss of primary system capability. No external criticality designation scheme keys on lost capability without an injury pathway. Items in that class appear on no safety list. They come from your own decomposition, or they come from nowhere.")
  ], check:{
    q:"A customer-assigned critical safety designation lands on a small structural fitting. An assessor argues the fitting fails the end-use function gate: it is \u201cjust a fitting.\u201d What does the process require?",
    o:["Nothing further. Gate 2 comes before the screen, and an item that fails a gate never reaches the criteria",
       "The designation satisfies gate 2. Failing it anyway requires System Safety concurrence in writing, and the decision goes through the safety disposition gate",
       "The fitting is screened as a normal candidate, with the designation counting as one criterion among seven",
       "The designation is returned to the customer for clarification"],
    a:1,
    why:"The designation is evidence of a function with system-level consequence, so gate 2 is satisfied. Failing the part at the gate is the one move that skips the safety criterion entirely, which is exactly why that move is not free. A written safety concurrence and a safety disposition make the decision visible, at the right altitude."
  }},

  {id:"M1-16", title:"When the safety designation is not a part classification", body:[
    P("Not every safety label lands on a part. Many land on something else. A function. A maintenance task. A failure mode. A development assurance level. A feature on a drawing. A location on the airframe. None of these is an item. So none of them can be a CI. And none of them designates anything on its own."),
    P("But each one is a signal. It tells you that parts worth screening exist nearby. Your job is to get from the label to the parts. **You do not work that out yourself. You ask.** Identifying the hardware behind a function is engineering analysis. A good guess is still a guess, and a guess misses the parts you did not think of."),
    TABLE(["The label","What it is attached to","What you ask for"],[
      ["A safety-critical **function** from the system safety analysis","A function","The items that implement the function"],
      ["A maintenance task created to catch a hidden failure","A task","The items whose hidden failure the task exists to detect"],
      ["A failure-mode criticality code","A failure mode","The hardware in which that failure mode lives. Note that a redundant configuration with the same end consequence carries the same code. Redundancy does not relieve the screen"],
      ["A development assurance level","A function, or a development baseline","Nothing, on its own. A top-level function can be built from parts that do not meet the safety-critical screen. Software is a CI by rule regardless of level"],
      ["A published airworthiness limitation","Sometimes a part. Sometimes an inspection task on a zone","Which one it is. A limitation attaching to a discrete part sends you to that part. A zonal inspection task names no item: control lives in the parent CI\u2019s documentation"],
      ["A critical or key characteristic","A feature or process parameter","Screen the **parent part.** Also ask why it was flagged: the quality-system term covers producibility and fit as well as safety"],
      ["A principal structural element","A location, tracked by tail number and position","The detail parts at that location, screened on their own merits"]
    ]),
    S("Ask for the parts behind the mitigations, not only the parts behind the hazards.",
      "A hazard log read only for causes returns the parts that can start an accident. It does not return a cargo fire suppression bottle, a crew oxygen system, or an ejection seat component. Those items protect people during an accident that something else caused. Ask for them by name: the items implementing protective functions and hazard mitigations."),
    C("Do protective items pass the safety-critical screen?",[
      "This needs a straight answer, because the screen asks whether the item\u2019s own failure might cause serious injury, loss of life, or loss of primary system capability. A fire bottle that fails does not start the fire. On its own failure consequence, it does not pass.",
      "**But you do not make that determination.** If the safety analysis names the item as a safety-critical item, or as implementing a hazard control, then it passes the safety-critical screen and you record it on that basis. That is one of the populations from the previous section.",
      "**If the safety analysis does not name it, the item still gets screened against everything else, and protective equipment very often passes.** Scheduled replacement, provisioning, a technical manual, dedicated test equipment: that is the logistics screen. Its own type designation or version identity: that is the separate-identity screen. Ask the safety question, then run the rest of the screen regardless of the answer.",
      "And if it is designated on none of them, it is not uncontrolled. It is controlled within its parent CI\u2019s configuration documentation, and the assessment names that parent."
    ],"teal"),
    C("The exchange runs both ways",[
      "CM asks for the parts behind the labels. CM also sends something back. Two lists. The first is the current CI list, with its safety-critical flags and hazard references. The second is every item that carried a safety designation and was **not** designated a CI, with the rationale for each.",
      "The second list is not a courtesy. It is the population System Safety has to concur on. Without it, the interface fails quietly, one undesignated item at a time."
    ],"teal")
  ], check:{
    q:"The system safety analysis names \u201cautomatic ground collision avoidance\u201d as a safety-critical function. What does CM do with that?",
    o:["Designate the function as a CI, since the analysis is authoritative",
       "Nothing: functions are outside CM\u2019s scope",
       "Ask the safety and engineering teams to name the items that implement the function, then screen those items",
       "Screen the flight control computer, since that is where such functions usually live"],
    a:2,
    why:"A function is not an item, so it cannot be designated. But it is a strong signal. The correct move is a named request: which items implement this function? Guessing at the hardware is doing engineering that belongs to another team, even when the guess is a good one. And it misses the items you did not think of."
  }},

  {id:"M1-17", title:"Life-limited parts", body:[
    P("Many aerospace parts carry a life limit. A compressor disc is limited by engine cycles. A landing gear component is limited by landing cycles or flight hours. An elastomeric seal is limited by cure date. A sealant or adhesive is limited by shelf life. The word is the same in all four cases. The reasons are not."),
    S("A life limit is a maintenance control. It is not by itself a reason to make the item a CI. It also does not satisfy the safety-critical screen on its own.",
      "A limit tells you the item degrades, and it tells you how continued service is assured. It tells you nothing about what happens if the item fails. Those are different questions, and only the second one is what the safety-critical screen asks."),
    P("So a life limit never designates anything on its own. What it does is tell you to run the screen properly. A life-limited item is designated when it passes a screen, and there are two ways that happens."),
    CARDS([
      {h:"It performs a safety-critical function", b:"Some life-limited parts are limited **because** their failure would be severe. An engine life-limited part is the clearest case, and that population appears in the designation table two sections back. A landing gear safe-life component is another. In these cases a consequence determination already exists somewhere. Follow the limit back to it, and screen on that determination rather than on the limit."},
      {h:"It passes some other screen", b:"A life limit almost always brings scheduled replacement, provisioning, and a maintenance procedure. That is the logistics screen, and it is met regardless of whether anything about the item is safety-critical. Life-limited items also frequently carry their own version identity or type designation, which is the separate-identity screen."}
    ],2),
    P("And a life-limited item can pass neither. That is a legitimate outcome, recorded like any other, with the parent CI whose documentation controls the item."),
    TABLE(["Life-limited item","Why the limit exists","Where it lands"],[
      ["Engine compressor disc, limited by cycles","Failure would be hazardous. The limit is how that consequence is managed","Passes the safety-critical screen through its designation. Also the logistics screen"],
      ["Main landing gear cylinder, safe-life limited","Structural failure consequence drives the limit","Follow the limit to the consequence determination and screen on that. Logistics applies too"],
      ["Hydraulic system seal, limited by cure date","The material ages in storage. Nothing about the consequence of a single seal failing","Fails the safety-critical screen. Usually controlled within the parent CI\u2019s documentation"],
      ["Structural sealant, limited by shelf life","Shelf life of the material as supplied","Fails the safety-critical screen. Normally a specification callout, not a CI"],
      ["Emergency battery, limited by service life","Capacity degrades with age. Its protective role is a separate question from its limit","Ask the safety team about the protective function. Screen the rest regardless, where logistics usually applies"]
    ]),
    C("Screen the item, not the label",[
      "The word \u201clife-limited\u201d sorts limits, not items. Two items carrying the same label can land in completely different places, and one item can have more than one reason for its limit.",
      "The limit also decides nothing about the product unit record. A cycles or hours limit serializes. A shelf-life or cure-date limit does not. That is the two-clocks rule from M1-08b, and it is a separate assessment from this one.",
      "**An aircraft lithium main battery is the example worth remembering.** It has a service life limit, which suggests a routine replacement item. It can also fail in a way that starts a fire, which is a hazard the battery itself causes. The limit tells you nothing about that. The screen does."
    ])
  ], check:{
    q:"A hydraulic seal carries a cure-date shelf life. Does the life limit make it a Configuration Item?",
    o:["Yes. A life limit is a form of criticality designation",
       "Yes, because life-limited items always require tracking",
       "No. The limit is a maintenance control and designates nothing. Screen the seal on consequence and on the other screens, and record where it is controlled if it is not designated",
       "No, and no further screening is needed once the limit is identified"],
    a:2,
    why:"The limit says the material ages in storage. It says nothing about what happens if the seal fails, which is what the safety-critical screen asks. A seal like this usually fails every screen and is controlled within its parent CI\u2019s documentation. But that is a screening outcome you record, not something the life limit decided for you. The last option makes the opposite error: the limit ends no assessment either."
  }},

  {id:"M1-18", title:"Critical influencing parts", body:[
    P("This one is narrow, and it comes almost entirely from engines. It is worth a section because it is the case that defeats a careless screen."),
    P("The approved life of an engine life-limited part, a compressor disc for example, is calculated from a model. That model assumes things about the disc\u2019s working environment: the loads on it, the temperatures it sees, how it is clamped and spaced. Other parts set those conditions. A spacer, an air seal, a tie bolt. In engine work these are called **critical influencing parts**."),
    P("An influencing part carries no life limit of its own. Its own failure is not hazardous. What it does is hold up the assumptions behind somebody else\u2019s stamped life."),
    S("Change an influencing part, and the life stamped on the disc may no longer be valid.",
      "The disc has not changed. Its paperwork has not changed. The calculation behind its life has, and nobody was told. The part keeps flying inside a limit that was computed for conditions that no longer apply."),
    P("Against the screens, an influencing part behaves in a way that catches people out:"),
    L(["**It fails criterion (b), the safety-critical screen**, by its own definition. Its own failure has no hazardous effect, so citing that criterion would be wrong.",
       "**It can pass criterion (a), the system-functioning screen**, where the life basis of a safety-critical part depends on its configuration. A change to it needs its own effectivity address, because somebody has to be able to ask which discs were assembled with which spacer.",
       "**CM does not identify influencing parts.** That is lifing analysis. It belongs to propulsion, or to the engine manufacturer. CM asks, per life-limited part, whether influencing parts exist for its life basis, and screens whatever comes back."]),
    C("If the engine is a commercial or vendor-controlled item, stop",[
      "This is gate 3, and it is where the rule is enforced. CM does not decompose a commercial or vendor-controlled item into smaller CIs. Where the engine is procured as a catalog or vendor-controlled item, **the engine is the CI.** Its internal parts are not CIs, and its critical influencing parts are not CIs either.",
      "They are controlled inside the engine\u2019s own documentation, under the vendor\u2019s design authority. Your question is no longer a selection question. It becomes a flowdown question: does the vendor notify you when they change one, and what does your change process do with that notice? That is what the change and discontinuance notification requirement in Module 2 exists for.",
      "**The influencing part becomes a CI candidate only where your company holds design authority over the engine or the module containing it**, or where the part is separately procured and managed at your level."
    ]),
    C("Four things the rule does not do",[
      "Not decomposing is not the same as not controlling, and this is where the rule gets misread.",
      "**Part attribute identification still applies inside the item.** Safety-critical, life-limited and special handling attributes attach to parts within a procured item whether or not those parts are CIs. Engine life-limited parts are the standard example. They are not customer-facing CIs, and they are individually serialized, life tracked and traceable. Part attribute identification and CI selection are separate decisions.",
      "**The item can still be designated for audit** at the procurement level, and the supplier\u2019s audit role follows from the type of work it performs.",
      "**Interfaces at the item boundary are still registered.** The boundary between the procured item and the rest of the system is an interface like any other.",
      "**The supplier still holds its own structure.** They maintain CIs internally at whatever level their own design authority requires. Those are supplier relationship CIs, not customer-facing ones, and what they owe you upward is a flowdown question."
    ]),
    S("The rule follows design authority, not the item.",
      "Your company may later take on design authority for a supplier-designed item, usually by acquiring the data rights or by initiating a company-controlled modification. When that happens, identification is re-run. The engine did not change. Who is allowed to define it did."),
    P("The general lesson outlives the engine case. Run every screen, not just the one that brought the candidate to your attention. An influencing part screened against the safety-critical screen alone gives you a clean no, and the no is correct. Stopping there is the mistake."),
    S("The same pattern runs through the same-CI decision later.",
      "S3, the safety trigger, will never catch an influencing part, because the part fails the safety criterion by its own definition. S6 will, because a change to it needs its own effectivity address. Two different tests, one part, and only one of them finds it.")
  ], check:{
    q:"An engine is procured as a vendor-controlled catalog item. The manufacturer identifies two critical influencing parts for the fan disc life model. Do you designate them as Configuration Items?",
    o:["Yes. Anything affecting a life-limited part is designated",
       "Yes, but at a lower level than the engine",
       "No. The engine is the CI, and a commercial or vendor-controlled item is not decomposed into smaller CIs. The influencing parts are controlled inside the engine\u2019s documentation, and your control is the vendor\u2019s change notification",
       "No, and the manufacturer\u2019s information can be disregarded"],
    a:2,
    why:"Decomposing a vendor-controlled item into CIs claims a level of control your company does not hold and cannot exercise. The engine is the CI. What the influencing-part information changes is your flowdown: you need to know when the vendor changes one, which makes the change and discontinuance notification requirement load-bearing rather than routine. Disregarding the information is the other error, because it is exactly what tells you which notices matter."
  }},

  {id:"M1-19", title:"Worked examples: is it a CI?", body:[
    P("The three gates, then the criteria screen, in that order, every time. Most of the difficulty in practice is not the rule. It is being honest about which gate an item actually fails."),
    TABLE(["Candidate item","How it screens","Verdict"],[
      ["Hydraulic reservoir assembly storing and conditioning fluid for the flight control system","Passes the gate: it performs a defined system function. Meets the system-functioning screen: the system cannot operate without it. Also the logistics screen: provisioning and maintenance documentation","**CI.** Designate, and list both criteria"],
      ["A structural fastener, one of eleven thousand, called out by specification on the assembly drawing","Fails the gate: no system end-use function of its own","**Not a CI.** Controlled by the specification called out in the parent CI\u2019s documentation"],
      ["The operational flight program running on the flight control computer","Computer software. A rule, not a judgment: it does not need a criterion","**CI.** Designate as a software CI"],
      ["Cabin sidewall trim panel: cosmetic, no load path, no functional role","Fails the gate","**Not a CI.** Controlled within the parent CI\u2019s documentation"],
      ["A commercially procured inertial measurement unit embedded in the navigation subsystem","Passes the gate. Meets the system-functioning screen, the separate-identity screen: it carries its own version identity, and the logistics screen","**CI.** Who designed it and who owns it are not criteria"],
      ["Landing gear uplock actuator whose failure can prevent gear extension","Passes the gate. Meets the safety-critical screen squarely, and almost certainly the system-functioning screen","**CI.** And the safety-critical screen is mandatory for safety: non-designation would need System Safety concurrence and a recorded safety disposition"],
      ["Ground support test set delivered under the contract, with its own type designation and technical manual","Passes the gate: support equipment performs a defined function for the system. Meets the separate-identity and logistics screens","**CI.** Support equipment is screened on the same terms as flight hardware"],
      ["A wiring harness between two CIs, procured to a company drawing","Passes the gate: it carries defined signal and power interfaces. Whether to designate turns on the screens: separate provisioning and maintenance action? Long lead or sole source?","**Judgment.** Screen it honestly and record the rationale either way"],
      ["A drag brace fitting carrying a customer-assigned critical safety designation","The designation satisfies gate 2 and answers the safety-critical screen. The customer assignment also meets the Acquirer-designation screen, and sustainment reach brings the logistics screen","**CI.** CM records the designation: it does not re-determine it, and lists every screen that applies"],
      ["A cargo fire suppression bottle with a shelf-life limit, on no critical-parts list","The limit answers nothing. Whether its protective function is safety-critical is a safety determination, so ask. Then screen the rest regardless, where the logistics screen usually applies","**Ask, then screen.** Designate on whichever screens it passes, and name the parent if it passes none"],
      ["A spacer that sets the boundary conditions in a life-limited disc\u2019s approved life model","Fails criterion (b), the safety-critical screen, by its own definition. No hazardous failure of its own. Passes criterion (a), the system-functioning screen, because the disc\u2019s stamped life depends on this part\u2019s configuration","**CI on criterion (a).** And a decision not to designate still gets System Safety visibility"]
    ]),
    P("Two worked questions, walked the way you should walk them out loud:"),
    STEPS([
      {h:"A valve the Acquirer has placed on their designated CI list, which your team thinks is too small to warrant it", b:"Gate: it performs a defined function, so it passes. Screen: the Acquirer-designation screen is met the moment the Acquirer designates it. Nothing else needs to apply. **Designate.** The judgment about whether it \u2018warrants\u2019 designation is not yours to make for an Acquirer-controlled item: final designation authority there rests with them. Record the Acquirer-designation screen as the basis and move on."},
      {h:"A battery pack that is not critical to the mission, is not safety-critical, and is neither novel nor high value, but requires danger tag-out and a dedicated maintenance procedure", b:"Gate: passes. Screen: system functioning, no. Safety-critical, no. Technology, no. Risk-and-cost, no. Logistics, **yes**: it requires logistics elements. **Designate.** One YES is sufficient, and the logistics screen is the one newcomers most often forget to look at, because it has nothing to do with how impressive the item is."}
    ]),
    C("Two errors to watch for in yourself",[
      "**Failing an item at the gate because you would rather not designate it.** The gate asks one question: does this satisfy a system end-use function, and \u201cthat would be inconvenient\u201d is not an answer to it. If an item passes the gate and no criterion applies, say exactly that. The screen is where a defensible no comes from.",
      "**Passing an item at the screen because it feels important.** Importance is not a criterion. Name the criterion, or do not designate."
    ])
  ], check:{
    q:"A program declines to designate an item, reasoning that it is a commercial part bought to a vendor\u2019s part number and that the company holds no design authority over it. Is the reasoning sound?",
    o:["Yes: items the company does not design are controlled by the vendor rather than designated",
       "Yes, provided the vendor is a qualified source",
       "No: design ownership is not among the criteria; the item is screened on the same terms as anything else",
       "No: commercial items are always designated"],
    a:2,
    why:"The gate asks about end-use function and the screen runs the seven questions. Neither asks who drew it. A commercial item can easily meet the separate-identity screen for its own version identity, the logistics screen for provisioning, or the risk-and-cost screen where it is sole-source, and buying it rather than designing it changes none of that. \u201cAlways designated\u201d is equally wrong: it still has to meet something."
  }},

  {id:"M1-20", title:"The selection assessment record", body:[
    P("You have now been told several times to record the rationale for every candidate. Here is the artifact that instruction refers to. One assessment per candidate, and it is short."),
    TABLE(["What it carries","Why that field is there"],[
      ["The candidate item, and the part or model reference it is known by today","So the assessment can be found again by someone who knows the item under a different name than you did"],
      ["The assessor and the date","So a later reader knows who judged it and what was known at the time. Assessments made before a hazard analysis existed read differently from ones made after"],
      ["The result of each of the three gates","A reader needs to know which gate an item failed, because the three mean different things. Not an item. No end-use function of its own. Procured inside a parent that should have been screened instead. Failing a gate and failing the screen are different facts, and so are the gates from each other"],
      ["Each criterion, with a yes or no, the rationale for that answer, and the document reference the rationale rests on","Every row, not just the ones that were met. A recorded \u201cno\u201d against the logistics criterion is a claim someone made and can be challenged, and the document reference is what lets them challenge it. The checklist carries two fields per criterion for exactly this reason"],
      ["The software rule where it applies, and the safety linkage","The concurrence lives with the assessment, not in somebody\u2019s inbox"],
      ["Four concurrence blocks, each recorded where it applies","**System Safety**, required where criterion (b) was answered yes and the item is not designated. **RM&SH**, required where the determination rests on failure modes and effects or criticality analysis, on single point or common mode failure identification, or on a maintainability or health-monitoring driven limit. **Systems Engineering**, required on the end-use function gate and where the determination rests on specification or interface considerations. **CM**, the determination itself"],
      ["The design authority basis, where the item was screened at a procured level","So a later reader knows why the assessment stopped where it did. If your company subsequently acquires the data rights or initiates a company-controlled modification, that basis has changed and the assessment is re-run"],
      ["The disposition, and the parent, where the item is not designated","A rejected candidate is not released into the wild. The assessment names what does control it. For a gate 2 or no-criterion outcome that is the parent CI whose documentation governs. For a gate 3 outcome it is the higher parent item that was procured as a unit and screened instead, which is a different fact"]
    ]),
    S("CI selection is a CM decision. The concurrences confirm that the technical basis is sound. They do not make the selection.",
      "Three of the four blocks are somebody else certifying a fact you relied on. The fourth is you, deciding. A concurrence that arrives without a determination beside it is an opinion nobody acted on, and a determination that cites an analysis without the concurrence of the function that owns it is a claim you made on their behalf."),
    S("A \u201cno\u201d with a reason is a decision. A \u201cno\u201d with no record is indistinguishable from never having looked.",
      "This is the difference the Acquirer is testing when they ask why a particular assembly is not a CI, and the answer they are hoping not to hear is that it simply is not on the list."),
    P("Retain assessments for the program life alongside the rest of the identification records, and they are **re-run on trigger rather than replaced.** Design evolution, a new hazard analysis, an Acquirer designation, a change in the supportability strategy, each re-opens the question for the affected candidates. The retained record is what the next assessment starts from, so the work is a re-evaluation rather than a fresh guess by whoever holds the job that year."),
    C("What a usable rationale looks like",[
      "**Weak:** \u201cN/A.\u201d \u201cNot required.\u201d \u201cToo small.\u201d None of these can be checked, and none tells the next person anything.",
      "**Usable:** \u201cNot designated. Fails gate 2, no independent function. Controlled by the material specification called out on the parent CI\u2019s drawings.\u201d \u201cDesignated. Criterion (b), hazard analysis rates failure as capable of causing loss of primary system capability. Also criterion (g), dedicated depot test set and technical manual.\u201d",
      "**A usable rationale names its document.** \u201cHazard analysis rates failure as capable of causing loss of primary system capability\u201d is a claim. The same sentence with the analysis number and its revision is evidence. The checklist gives you a document reference field beside every rationale field, and a rationale with the reference blank is half a record."
    ])
  ], check:{
    q:"Why does the assessment record carry the assessor and date, and why is it retained rather than overwritten when the assessment is re-run on trigger?",
    o:["For audit traceability only: the content of a superseded assessment has no further use",
       "Because personnel changes require reassignment of the record",
       "Because a later reader needs to know what was known at the time, and because the retained assessment is what the re-run starts from rather than a fresh guess",
       "Because the Acquirer requires a complete revision history of every selection decision"],
    a:2,
    why:"Selection is iterative, so assessments accumulate rather than replace one another. Knowing an item was screened before the hazard analysis existed explains an answer that would otherwise look careless, and the previous rationale is the most useful input the next assessor has."
  }},

  {id:"M1-21", title:"Dividing software into CIs", body:[
    P("That software is designated as a CI is a rule. **How much software constitutes one CI is a judgment**: and the training so far has given you no way to make it, because every worked example has been hardware."),
    P("A software CI is an aggregate of software that satisfies an end-use function and is designated for purposes of specification, interfacing, qualification testing and configuration management. It is composed of one or more software units: source code, object code, control code, control data, or a collection of these. Read that definition closely and the questions fall out of it, and they are the familiar ones:"),
    L(["Does this aggregate satisfy an **end-use function** of its own, or is it a part of something else\u2019s function?",
       "Will it be **specified** separately: does it get its own requirements document?",
       "Does it have **interfaces** of its own that need defining and controlling?",
       "Will it be **qualification tested** as a unit, against its own requirements?",
       "Does it need its own **version identity and change effectivity**: will it be re-versioned and fielded on its own schedule?"]),
    CARDS([
      {h:"Divided too coarsely", b:"One software CI for an entire load. Every correction to any part re-versions the whole thing, so the version identifier stops telling anyone what actually changed. The qualification scope for a display string change is the entire load. And the effectivity address is shared, so nothing can be fielded independently of anything else."},
      {h:"Divided too finely", b:"Dozens of software CIs, each carrying a specification, a version identity, a qualification basis and its own interfaces. The integration burden is real. The version matrix becomes a management product in its own right, and which build of each is compatible with which build of the others is now a question somebody maintains an answer to."}
    ],2),
    S("The same failure directions as hardware, for the same reason: the CI is the unit of separate management, and separate management has a cost in both directions.",
      "If a piece of software will be specified, tested, versioned and fielded on its own, it is its own CI. If it travels with its neighbors in all four, it is a unit within theirs."),
    P("Two rules sit alongside the judgment. **Elements of the software development environment that form part of the system get product-unique identifiers**: compilers, linkers, loaders, developmental libraries, configuration settings, automation scripts. They are identified not because they satisfy an end-use function but because the build cannot be reproduced without them. **Firmware follows the arrangement, not the technology.** Where the code and its device are controlled together on a single altered item drawing, one part number represents the device with the code in it. Where they are controlled separately, the code is its own software CI with its own version identifiers."),
    C("The same-CI question arises for software too",[
      "One software CI with several versions, or several software CIs? That is the same question M1-31 answers for hardware, and the same triggers answer it. Run them, with two substitutions.",
      "**Read version identifier for PIN. Read build or load for variant.** The decision tool makes the swap for you once you answer its software scope question, and it prints CSCI in the verdict.",
      "**The product unit record structure is different, and it is not a substitution.** Software carries identity on the loadable part number and the baseline. It never carries a physical unit identifier, so the product unit record-structure test in M1-08b lands on \u201cconfiguration identity only\u201d for every software CI you will ever screen."
    ])
  ], check:{
    q:"A flight display application and the control laws it renders are written by one team, run on one processor, and are loaded as a single image. Each is separately specified, separately qualification tested against its own requirements, and re-versioned on its own schedule. One software CI or two?",
    o:["One: they share a processor and are delivered as a single load",
       "One, with the control laws recorded as a unit within it",
       "Two: separate specification, separate qualification and separate version and effectivity needs are exactly what designates separately",
       "Two, but only if the control laws are safety-critical"],
    a:2,
    why:"Sharing a processor and a load image is a packaging fact, not a management one, in the same way that sharing an interface control document does not make two hardware items one CI. Separate specification, separate qualification basis and independent re-versioning are three of the questions that define a software CI, and here all three point the same way."
  }},

  {id:"M1-22", title:"Selecting at the right level", body:[
    P("Select CIs at the level optimum for **both acquisition and support**: the level at which items are specified, contracted, accepted, and at which logistics organizes and reports maintenance and modification actions. Both failure directions are real and both are expensive."),
    CARDS([
      {h:"Over-designation", b:"Hundreds of CIs at fastener and bracket level. Every trivial change becomes formal change traffic against its own CI. Board time consumed by triviality, real changes queued behind noise, status accounting nobody reads. Control degrades because there is too much of it."},
      {h:"Under-designation", b:"Whole subsystems buried inside one CI. Changes to distinct functions share one effectivity address, so they cannot be cut in independently. Hazard traceability stops above the item that causes the hazard. Logistics cannot report maintenance at the level it is performed."}
    ],2),
    C("A useful test when you are unsure",[
      "**Will a change to this item routinely need to be dispositioned, tracked and cut into service independently of its neighbors?**",
      "If yes, it needs its own effectivity address, one of the main reasons separate CIs exist. If changes will normally travel with the parent, it does not."
    ])
  ], check:{
    q:"A program has 340 CIs, most at individual bracket and connector level. What is the practical consequence?",
    o:["Excellent visibility and control, at some administrative cost",
       "Unmanageable change traffic, with real changes queued behind trivial ones: control degrades because there is too much of it",
       "A compliance finding, but no operational effect",
       "Reduced audit scope, since each CI is small"],
    a:1,
    why:"Over-designation is not over-control; it is a different kind of loss of control. Board time goes to triviality, status accounting stops being read, and genuine changes wait behind noise."
  }},

  {id:"M1-23", title:"The CI structure", body:[
    P("Selection produces a set of CIs. Structure puts them in an order, and the order does real work, because it defines the parents, the boundaries and the reporting lines everything downstream uses."),
    C("CM builds and owns the CI structure",[ "Systems Engineering decomposes the system architecture. That is their product and CM does not write it.", "**CM builds the CI hierarchy** and owns it. The hierarchy mirrors the architecture decomposition as closely as the selection criteria allow, because two structures that disagree produce two versions of the truth.", "They are not always identical, and that is expected. The architecture decomposes function. The CI structure organizes what is separately specified, contracted, accepted and supported. Where the two diverge, CM records why the CI structure sits where it does.", "CM assigns each CI its parent, its children, its owning design activity and its control tier, and maintains the CI index. If the structure is wrong, that is a CM finding." ]),
    P("A product structure is built by decomposing the system into its levels of assembly. The conventional five, top to bottom:"),
    STEPS([
      {h:"System or end item", b:"The final combination of end products, component parts, software and materials, ready for its intended use."},
      {h:"Subsystem", b:"A combination of assemblies performing an operational function within the system: a major subdivision of it."},
      {h:"Assembly", b:"Parts or subassemblies joined to perform a specific function, and capable of disassembly."},
      {h:"Subassembly", b:"Two or more parts forming a portion of an assembly, replaceable as a whole but with individually replaceable parts."},
      {h:"Part", b:"One piece, or pieces joined so that they are not normally taken apart without destroying their designed use."}
    ],"tl"),
    S("CIs may be designated at any level of assembly.",
      "The levels describe the product. They do not tell you where the CIs go: that is the selection judgment of the previous section. What they give you is a shared vocabulary for arguing about it."),
    P("For each CI, record its parent, its children, and the owning design activity. Then two designations that decide who is in charge of what:"),
    CARDS([
      {h:"Acquirer-controlled", b:"The CIs the Acquirer specifies, baselines and controls. Their designation is the Acquirer\u2019s to make, their product baseline is the Acquirer\u2019s to establish, and changes to them run to the Acquirer\u2019s approval authority."},
      {h:"Supplier-controlled", b:"Below the Acquirer-controlled level, **the Supplier determines** which items to place under internal configuration management and what documentation types to use. This is not a gap in control: it is control exercised by your company, on its own authority, against the same criteria."},
      {h:"Sub-tier developed", b:"An item developed by a sub-supplier is a CI **from your company\u2019s point of view**, and equivalent CM requirements are flowed down to the organization that builds it. That sentence is the entire premise of Module 2."}
    ],3),
    P("Each CI also carries a **type**: hardware, software, or firmware. The first two are what they sound like. Firmware is the case where code and the device it lives in are managed as one thing. Flag it in the index. It is the type people forget has two natures."),
    C("Where everything that is not a CI lives",[
      "Every part sits somewhere in the product structure. Not everything in the product structure is a CI, and the items that are not are controlled within their parent CI\u2019s configuration documentation.",
      "**Which is why a rejected candidate has to name its parent.** \u201cNot a CI\u201d is only half an answer. The other half is which CI\u2019s documentation controls it, and an assessment that stops at the first half has left the item genuinely uncontrolled rather than controlled elsewhere.",
      "**Three verdicts need a parent named, not one.** An item that fails gate 2 names the parent CI whose documentation controls it. An item that meets no criterion names the same thing. And an item that fails gate 3 names the **higher parent item that was procured as a unit and screened in its place**, which is a different fact and is recorded as one. The checklist relabels the field to ask for it."
    ])
  ], check:{
    q:"An assembly sits two levels below the lowest Acquirer-controlled CI. Who decides whether it is placed under configuration management, and against what?",
    o:["Nobody: below the Acquirer-controlled level, items are controlled only by the drawings that define them",
       "The Acquirer, since all designation authority is theirs",
       "The Supplier, applying the same criteria and determining the documentation types to use",
       "The sub-supplier who builds it, under their own CM system"],
    a:2,
    why:"Below the Acquirer-controlled level the Supplier determines which items to place under internal configuration management and what documentation types apply. The authority changes hands; the criteria and the discipline do not. And where the item is developed by a sub-supplier, it is a CI from your company\u2019s point of view with equivalent requirements flowed down, not a matter left to their own system."
  }},

  {id:"M1-24", title:"The nine activities", body:[
    P("The process is **iterative, not sequential-once.** Selection begins early, typically before or at the system functional and requirements reviews, and is revisited as the design matures and at every baseline establishment."),
    TABLE(["#","Activity","Principal output"],[
      ["1","Candidate CI identification","Candidate list; the decomposition basis for the CI structure"],
      ["2","Application of selection criteria","Assessments with rationale for every candidate; selected-CI determinations"],
      ["3","CI structure and hierarchy","Parent/child and owning design activity; Acquirer- vs Supplier-controlled designation"],
      ["4","Interface identification and recording","Interface register; coverage verification; signed no-interface determinations"],
      ["5","Acquirer review and concurrence","Submittal; concurrence or direction records; concurred CI list"],
      ["6","Identifier assignment","PINs, unit identifiers with their product unit record structure, nomenclature, software and version identifiers, document identifiers, and unique item identification marking where the contract requires it. Also the recorded part attribute designations, safety-critical, life-limited and special handling, each with its assigning authority"],
      ["7","Configuration documentation determination","Documentation type recorded against each CI"],
      ["8","Baseline establishment","FBL, ABL, PBL per CI with approved change status"],
      ["9","Maintenance and iteration","Updated index, register and submittals; status accounting records of every change"]
    ]),
    C("Where modeling is used, the CI structure mirrors the model",[
      "The CI hierarchy and the architecture model are **two views of one decomposition, and shall not diverge.** Preferred schemes are the ATA chapter scheme or the S1000D standard numbering system, in SysML or UAF conventions. Where no model exists, the CI structure follows specification decomposition methods or certification decomposition methods.",
      "This is not a formality. A CI structure that has drifted from the model means two authoritative decompositions of one product, and the moment they disagree, nobody can say which is right."
    ],"teal"),
    P("**Re-evaluate on any of these triggers:**"),
    L(["Design evolution introducing new items, functions or interfaces.",
       "Changes to the architecture decomposition.",
       "New or revised hazard analyses.",
       "Changes to supportability strategy or procurement decisions.",
       "Contract changes, including Acquirer designation or de-designation of CIs.",
       "Non-interchangeable modifications requiring a PIN change.",
       "Your company taking on design authority for a supplier-designed item, by acquiring data rights or by initiating a company-controlled modification."])
  ], check:{
    q:"A program\u2019s CI index is organized by the contract work breakdown structure, while its architecture model decomposes the system by ATA chapter. What is the problem?",
    o:["None: the two serve different purposes and may legitimately differ",
       "The WBS is the wrong basis for any CI structure",
       "Two authoritative decompositions of one product exist; when they disagree, nobody can say which is right",
       "The model should be rebuilt to match the contract"],
    a:2,
    why:"Where modeling is used the CI structure mirrors the model: they are two views of one decomposition. Divergence makes every subsequent structural decision contestable. The fix is realignment by CM and Systems Engineering jointly, not a unilateral change to either."
  }},

  {id:"M1-25", title:"When the work happens", body:[
    P("The activities are iterative, but they are not evenly spread across a program. Each has a normal moment, and each has something that must already exist by the time it arrives."),
    STEPS([
      {h:"System requirements and functional reviews", b:"Candidate identification and the first pass of selection. The **functional baseline** is established at or after the system functional review, documented by the functional configuration documentation. The proposed CI list goes to the Acquirer for review and concurrence around here, and interface coverage is verified at that submittal."},
      {h:"Preliminary design review, per CI", b:"The **allocated baseline** for a CI is established at or after its preliminary design review. So the allocated documentation for that CI must exist and be approved by then. That means its allocated requirements, its interfaces with the CIs it touches, and its verifications. A CI still under debate at its own preliminary design review has a baseline problem, not a paperwork problem."},
      {h:"Critical design review", b:"The **product baseline** is initially established at completion of critical design review, on the released detailed design definition."},
      {h:"First production unit delivery, or physical configuration audit", b:"The product baseline is formalized no later than this point, and where the Acquirer establishes it, they do so on successful completion of the physical audit and approval of the product specification."},
      {h:"Throughout, and afterwards", b:"Re-evaluation on every trigger. Resubmittal to the Acquirer on every iteration. Interface coverage verified at CI-list submittal, at each technical review, and before each baseline establishment. Identification does not finish; it is maintained."}
    ],"tl"),
    S("Selection that starts at critical design review is not selection.",
      "It is documentation of whatever happened to be built. By then the structure, the interfaces, the effectivity addresses and the audit scope have all been decided by default, and every one of them will be expensive to undo."),
    C("What is fixed and what is not",[
      "These are the normal points, and a contract can move them. What does not move is the **dependency order**: you cannot allocate requirements to a CI you have not selected, cannot baseline documentation that has not been released, and cannot audit against a baseline that was never established.",
      "So when a program compresses its schedule, the question to ask is not which review slipped. It is which dependency the compression assumes away."
    ])
  ], check:{
    q:"A CI is approaching its preliminary design review. What must exist and be approved by that point?",
    o:["Its detailed design definition, since the product baseline follows immediately",
       "Its allocated configuration documentation: the requirements allocated to it, its interface requirements, and its verifications, because the allocated baseline is established at or after that review",
       "Only the system specification; CI-level documentation follows critical design review",
       "Its selection assessment, and nothing further until critical design review"],
    a:1,
    why:"The allocated baseline is established at or after a CI\u2019s preliminary design review, and a baseline is made of its documentation, so the allocated set has to be there and approved. The detailed design belongs to critical design review and the product baseline; the selection assessment should have been done considerably earlier."
  }},

  {id:"M1-26", title:"Where the model is the decomposition", body:[
    P("On a program using model-based systems engineering, the CI structure does not get to be its own idea. The CI parent-and-child hierarchy mirrors the decomposition method of the architecture model, because the two are one decomposition seen twice."),
    CARDS([
      {h:"The preferred schemes", b:"Decomposition by ATA chapter, or by the standard numbering system used across the technical data suite, implemented in the program\u2019s modeling conventions. Each CI carries the corresponding chapter or numbering reference as an attribute in the index, so the CI structure and the technical data agree about where an item sits."},
      {h:"When the model uses something else", b:"Functional thread, zonal, work-breakdown-based: the CI structure mirrors **that** method. The rule is not \u201cuse the preferred scheme.\u201d It is \u201cdo not maintain a second, independent decomposition.\u201d Record the mapping convention. Note any contract-driven exception explicitly in the index, an Acquirer-directed CI level being the usual one."},
      {h:"When there is no model", b:"The CI structure follows **specification decomposition methods or certification decomposition methods**. Work down from how the requirements are allocated, or from how the certification basis divides the product. There is still exactly one decomposition. It simply lives somewhere other than a model. Note that this is not the engineering bill of material. The bill of material is organized for building the product, and building it is not the only thing the structure has to serve."}
    ],3),
    P("Alignment is not a one-time reconciliation you perform and then trust. Four practices keep it true:"),
    L(["**Cross-reference in both directions.** The model element identifier recorded against the CI in the index, and the CI identifier carried as a property of the model element. A one-directional link rots silently: you discover it when something at the far end has already been deleted or renamed.",
       "**Treat model decomposition changes as triggers.** A change to how the model decomposes the system re-opens CI structure selection. Once the structure is baselined, structural changes are processed through formal change action like anything else.",
       "**Verify alignment at each technical review and before each baseline establishment.** Every Acquirer-controlled CI resolves to a model element, and every model element at the CI-designation level has actually been screened against the criteria, not assumed to have been.",
       "**Run the interface check both ways.** Every interface element in the model resolves to a register row, and every register row to a model element."]),
    S("A verdict that does not match the model is held, not recorded.",
