      {h:"Part attribute designation authorship", b:"Who proposes and who approves the **part attribute designations**: safety-critical, life-limited and special handling. These are attributes on parts. They are not CI designation and not audit designation. **Three cases exist, and the statement of work names which one applies.** *Company-assigned*, where the company holds design authority: the designations are provided in the technical data, and the supplier marks, records and reports against them. *Supplier-proposed and company-approved*, where the supplier holds design authority at its level: they propose during design development and your engineering function approves. *Externally assigned*, where a customer or a regulatory authority assigns the designation: both parties record it and flow it, neither proposes it, neither approves it, and a dispute goes to the assigning authority rather than between the two of you. Leave the case unstated and each party waits for the other."},
      {h:"Both reconciliation flowdowns", b:"The process documentation as capability evidence, submitted before reliance is placed on it, and the recurring report per delivery or lot."},
      {h:"Part traceability record content in full", b:"Including life limits and life consumed at delivery for life-limited items. This is the identifier vocabulary everything else is expressed in."},
      {h:"Recursive flowdown", b:"And the return of sub-tier product data with next-higher-assembly traceability, wherever sub-tiers exist."},
      {h:"Change and variance control", b:"Consistent with where design authority sits and who builds. A build-to-print supplier cannot propose changes; a design-authority supplier must."}
    ]),
    P("Where a requirement mandatory for safety has been dispositioned other than by imposition, reference the recorded disposition. And define the **attestation scope of the CM signature once**, in the program CM plan: does it attest that CM review occurred, or that the flowdown content is adequate? Fixing it once prevents later disputes over what a past signature meant.")
  ], check:{
    q:"A regulatory authority assigns a life-limited part attribute designation to a component your supplier designs and builds. Who proposes it, and who approves it?",
    o:["The supplier proposes it, because they hold design authority for the item",
       "Your engineering function approves it, because approval always sits with the company",
       "Neither. This is the externally assigned case: both parties record it and flow it, and a dispute goes to the assigning authority",
       "The Acquirer approves it on your behalf at first article"],
    a:2,
    why:"Two of the three authorship cases have a proposer and an approver. The third does not. An externally assigned part attribute designation arrives already made, and the only obligations are to record it, to flow it, and to carry the assigning authority in the CI index alongside it. The first two options are the other two cases applied to the wrong one, and each of them invites a party to re-open a designation that was never theirs. Leave the case unstated in the statement of work and both parties wait, which is how a life-limited part arrives with a blank consumed-life field."
  }},

  {id:"M2-20", title:"Before release: the readiness check", body:[
    P("One check, completed per statement of work or purchase order before release, attached to the classification record. It exists because every failure it catches is cheap now and expensive later."),
    STEPS([
      {h:"Classification", b:"Design authority and build responsibility determined, and the item type identified. **All applicable work types recorded, not only the dominant one.** The mixed-classification question asked out loud: does this supplier also develop software or firmware, or also hold any element of design authority? CI identifiers recorded where the procured item is or contains a designated CI. And where the supplier is an incumbent, their history reviewed: prior determinations, open findings, open actions."},
      {h:"Derivation and conditional resolution", b:"The requirement set read from **every** applicable column, with the most demanding cell applied. Every conditional resolved and its basis recorded. Audit designation status determined. The standing conditional clause included where designation is possible, or audit requirements imposed outright where designation is already in effect. And every requirement mandatory for safety either imposed, or dispositioned through the safety disposition gate with the disposition referenced."},
      {h:"Citation completeness", b:"Every cited requirement carrying its deliverable, with content, frequency or trigger, and submittal terms. The part attribute authorship case stated, and it is one of three. Both reconciliation flowdowns imposed where the supplier builds. Part traceability content imposed in full, life limits and life consumed included. Recursive flowdown and the return of sub-tier data imposed wherever sub-tiers exist. Software CM imposed where deliverable software or embedded code exists. Change and variance control consistent with where design authority sits."},
      {h:"Release", b:"CM signature applied before release, per the attestation scope defined in the program CM plan. The classification record complete, including signature and date. And the re-classification triggers communicated to subcontracts and program management, because they will see the triggers before CM does."}
    ]),
    S("The checklist is not a formality tax. Every line on it is a failure somebody has already had.",
      "The dominant-work-type-only classification. The unresolved conditional. The requirement with no deliverable. The unstated part attribute authorship case. Each has a section of this module behind it."),
    C("When a statement of work is released without CM signature",[
      "It happens. The response is defined, and its shape matters: the release is recorded as a **process finding against the release gate, not against an individual**. The classification and derivation are then performed retroactively and reconciled against what was actually released.",
      "Both halves are deliberate. A release path that can bypass CM will do it again next quarter no matter whose name was on this one, so the finding has to attach to the path. And the retroactive derivation is not paperwork: it is the only way to find out what you actually bought, and what is now missing from it."
    ])
  ], check:{
    q:"A statement of work reaches a supplier without ever passing through CM review. What is the correct response?",
    o:["Record it against the engineer or buyer who released it, and re-brief them",
       "Record a process finding against the release gate, then perform the classification and derivation retroactively and reconcile them against what was actually released",
       "Leave it: the work is under contract and the requirements cannot now be changed",
       "Issue a modification imposing the standard requirement set, without classifying"],
    a:1,
    why:"The finding attaches to the gate because a bypassable release path is the actual defect: naming a person fixes this instance and nothing else. And the retroactive derivation is what tells you the gap: what should have been imposed, what was, and therefore which deliverables you will never receive unless the statement of work is modified. Imposing a standard set without classifying repeats the original error at speed."
  }},

  {id:"M2-21", title:"Two reconciliation deliverables, and the traceability record", body:[
    P("New engineers frequently treat the two reconciliation deliverables as one requirement. They are two, and imposing only one is a defined failure. A report produced by an undocumented method is a number with no method behind it. A documented method that never reports is a method with no evidence behind it."),
    TABLE(["","Process documentation","Reconciliation report"],[
      ["What it is","The supplier\u2019s documented METHOD: data sources, comparison method, delta disposition, frequency, records produced","The recurring OUTPUT: as-built against released design revision, open deltas with disposition, changes incorporated with effectivity"],
      ["When","Once, plus on revision: before reliance is placed on it","Per delivery or lot"],
      ["What it proves","Capability: a method exists and covers all deliverable configurations at scale","Performance: the method is being run, and what it found"],
      ["If it is missing","Reports arrive by an unknown method. A number without a method","A method exists on paper and produces nothing. A method without evidence"]
    ]),
    C("The part traceability record",[
      "Defined once and referenced from several requirement rows, because it is the identifier vocabulary the rest of the flowdown speaks in. Per delivered unit or lot it records: serial numbers; lot or batch numbers; **life-limited designation with the assigned life limit and the life consumed at delivery**; safety-critical designation; special handling designations; and traceability to the next higher assembly.",
      "The field that goes missing most often is life consumed at delivery. A blank there on a life-limited item is not a clerical defect: it is an item that can never be accurately tracked for the rest of its service life."
    ])
  ], check:{
    q:"A supplier submits reconciliation reports per lot, but never submitted the reconciliation process documentation. What is the problem?",
    o:["None, provided the reports show no deltas",
       "The reports arrive by an unknown method: nobody can say what configurations the method covers or whether it works at scale",
       "Only a records retention issue",
       "The reports must be re-submitted in a different format"],
    a:1,
    why:"The process documentation is capability evidence, submitted before reliance is placed on it. Without it you have a number without a method, and no basis for believing a clean report means anything."
  }},

  {id:"M2-22", title:"Evidence accrues; it is not assembled", body:[
    P("A determination reconstructed from memory a week before it is due is not a determination."),
    L(["Log every supplier data deliverable on receipt, and score it at review: accepted first pass, accepted with comment, or rejected, with defect codes for anything less than first pass.",
       "Log every finding and escape as it occurs.",
       "Flag safety relevance on any finding affecting a hazard control, a safety-critical item or a life-limited item, and route it into the safety data stream."]),
    C("Effectiveness includes what a supplier FAILS to submit",[
      "These events look like nothing happening, which is exactly why they need logging as findings:",
      "\u2022 Post-delivery discovery of a departure that should have been variance-requested. \u2022 An unauthorized process change, found after the fact. \u2022 Traceability gaps found at receiving. \u2022 Reconciliation deltas the supplier\u2019s own report did not disclose. \u2022 Configuration-related nonconformances."
    ]),
    S("The strongest single indicator of an ineffective process: a delta discovered by company receiving that the supplier report cleared as no-delta.",
      "It means the detection mechanism itself does not work, so everything previously reported as clean is unevidenced."),
    P("Five records carry all of this, and they are standing records: open continuously, written to as events occur, never opened for the first time at determination:"),
    TABLE(["Record","What each row carries"],[
      ["The classification log","Supplier, item and scope, work types, item identifiers, audit designation status, whether the standing conditional clause is present, safety dispositions, and the classifier and CM signature with dates"],
      ["The deliverable receipt log","Every supplier data deliverable received: date, reviewer, the review result, and defect codes for anything short of first-pass acceptance"],
      ["The findings and escapes log","Findings, escapes and non-submittal events per supplier, with safety relevance flagged and the safety report reference where one was routed"],
      ["The effectiveness determination records","The determination, its rationale, the evidence relied on, the determining authority, the date, and the next-due date"],
      ["The actions log","Actions arising from determinations and findings, with owner, due date, status, and closure evidence including extent checks"]
    ]),
    S("These are kept as structured, queryable data, not as narrative documents.",
      "The performance measures are computed from them. **Records that cannot be queried cannot be measured**: and a supplier picture that has to be reconstructed by reading through prose is a picture nobody will produce often enough to act on.")
  ], check:{
    q:"Receiving finds a superseded bracket revision on two units. The supplier\u2019s reconciliation report for that lot stated no open deltas. Which is the more serious signal?",
    o:["The superseded bracket: it is the tangible hardware problem",
       "The clean reconciliation report: it means the detection mechanism itself does not work",
       "Neither is serious if the units are conforming in every other respect",
       "They are equally serious"],
    a:1,
    why:"A bracket on two units is one delivery that went wrong. A report that cleared it as no-delta means the control that should catch such things does not operate, which puts every previous clean report in question."
  }},

  {id:"M2-23", title:"The seventeen evidence streams", body:[
    P("Accrued evidence is read stream by stream. Each has a shape when it is working, and a signal when it is not. The failure signals are worth memorizing. They are what you are actually looking for when a deliverable lands on your desk. Not every stream applies to every supplier. You evaluate a supplier only on the streams you imposed on them."),
    TABLE(["Evidence stream","What effective looks like","The failure signal"],[
      ["CM plan adequacy","The plan implements the imposed requirement set, including recursive sub-tier flowdown, and is kept current through revisions","A plan silent on sub-tier flowdown, or never revised as the scope grew"],
      ["Reconciliation process capability","A documented method, accepted, covering all deliverable configurations at scale","The method covers only sampled items, or reports keep arriving with no method on file at all"],
      ["Reconciliation reporting","Reports per delivery or lot; deltas dispositioned and aged within threshold; content expressed in traceability-record identifiers","A delta found by company receiving that the report cleared as no-delta. The strongest single indicator of an ineffective process"],
      ["Part traceability completeness","Records complete on first pass: life limit and life consumed, the safety-critical and special handling part attribute designations, next-higher-assembly traceability","A blank consumed-life field on a life-limited item. Missing part attribute designations where the supplier holds design authority and was supposed to propose them"],
      ["Change control discipline","Change proposals complete on first pass; no baseline-affecting change implemented without approval","Changes visible in delivered hardware or data that were never proposed"],
      ["Variance discipline","Departures variance-requested before delivery; recurring variances converted to change action","Post-delivery discovery of a departure that should have been variance-requested"],
      ["Process change notification","No unauthorized change to frozen or approved processes; notifications timely within the agreed notice period","A process, facility or tooling change discovered after the fact"],
      ["Status accounting currency","Records timely, current, historically traceable and retrievable per the agreed data terms","Records reconstructed on request rather than maintained"],
      ["Audit performance","Where designated: audits conducted or supported per role, substance in full, action items closed by their agreed dates","Substance tailored: verification steps omitted rather than ceremony simplified"],
      ["Vendor change and discontinuance notification","Notices arrive within the agreed period, carrying effectivity, last-time-buy terms, and alternates","A product change or an end-of-life discovered at receiving inspection, or after the part is already unavailable"],
      ["First article performance","First article complete and accepted before first production delivery, and re-accomplished on each stated trigger","Production delivered against an incomplete or superseded first article"],
      ["Provisioned materiel control","Materiel checked against released content at receipt, with discrepancies reported before anything is installed","A kit or issue discrepancy that first surfaces at the end-item reconciliation, or at delivery"],
      ["Change embodiment and effectivity accuracy","Changes embodied at the directed effectivity and recorded per unit","Two units in the same block at different configurations, both believed correct"],
      ["Delivery configuration completeness","Every deferred item, traveler, shortage, and carried deviation documented at delivery with an approving authority and a closure plan","Open work discovered after delivery that no delivery statement disclosed"],
      ["Sub-tier product data return","Sub-tier part numbers and unit identifiers returned with traceability to the assembly above, and sub-tier inspection confirmed","Sub-tier data reconstructed on request rather than reported. A tier you cannot see through"],
      ["CM point of contact currency","A named, reachable CM contact on file, with changes of incumbent notified","Notices routed to somebody who left. Nobody knows who can approve a change at the supplier"],
      ["CM process audit findings","Findings closed by their suspense dates; no repeats","Repeat findings across audit cycles"]
    ]),
    S("A supplier is evaluated against the requirement set actually imposed on it: streams that were not imposed are not evaluated.",
      "A catalog vendor with no reconciliation requirement does not score badly on reconciliation. They score nothing on it, because nothing was asked. Grading a supplier against requirements you chose not to flow is grading your own classification, not their process.")
  ], check:{
    q:"A build-to-print supplier was never required to submit status accounting reports: the requirement was not imposed. At determination time, how is that stream treated?",
    o:["Scored as a deficiency, since the records are not available",
       "Scored as effective by default, since nothing went wrong",
       "Not evaluated: a supplier is evaluated against the requirement set actually imposed on it",
       "Scored against the standard applied to full-development suppliers, for comparability"],
    a:2,
    why:"Neither a deficiency nor a free pass. The stream is simply out of scope for that supplier. If the absence of those records is actually a problem, the fault is in what was flowed, which is a classification and derivation question to reopen, not something to hold against the supplier at determination."
  }},

  {id:"M2-24", title:"Three determinations", body:[
    P("Determine effectiveness over the rolling accrued evidence, **against the requirement set actually imposed on that supplier.** A supplier is evaluated on what was flowed to it, not against a uniform standard. Streams that were not imposed are not evaluated."),
    STEPS([
      {h:"Effective", b:"The imposed requirements are being met. Routine surveillance continues."},
      {h:"Conditionally effective", b:"Deficiencies exist, with credible correction underway. Actions from the ladder apply."},
      {h:"Ineffective", b:"Systemic failure to meet imposed requirements. Actions from the ladder apply, and escalate."}
    ]),
    C("The judgment that separates the three",[
      "**Isolated, non-systemic defects with credible correction** support Effective or Conditionally effective.",
      "**Evidence that a control did not operate**, rather than that a record contained an error, supports Conditionally effective at best, and Ineffective where the pattern recurs or the evidence is safety-relevant.",
      "A wrong entry on a form is a record defect. A departure that reached delivery without a variance request is a control that did not operate. They are not the same finding wearing different clothes."
    ],"teal"),
    P("Determinations run on a tiered cadence as a backstop. Work type sets the cadence, because the exposure differs."),
    L(["**Annually** for full-development and software work: the heaviest flowdown, the most to go wrong, and design authority sitting at the supplier.",
       "**Annually to every two years, by risk**, for build-to-print, source-controlled design-and-build, and repair work.",
       "**Event-driven** for catalog items and special-process services: there is no steady stream of configuration deliverables to read, so the events are what there is."]),
    P("The cadence is a backstop, never the mechanism. A determination also runs on any of five triggers. A rejection streak or a sustained decline in first-pass acceptance. Any safety-relevant escape. A reconciliation miss the company finds itself. An adverse configuration audit result. A source, process or facility change.")
  ], check:{
    q:"Which finding indicates a control that did not operate, rather than a record defect?",
    o:["A transposed serial number on a traceability record",
       "A late submittal of a status accounting report",
       "A departure from released design discovered after delivery that should have been variance-requested",
       "A formatting non-compliance against the deliverable definition"],
    a:2,
    why:"The first, second and fourth are defects in records or timeliness. A departure reaching delivery without a variance request means the mechanism that should have stopped it never ran, which supports Conditionally effective at best."
  }},

  {id:"M2-25", title:"The actions ladder, and what follows", body:[
    P("A determination of less than effective is **an action-forcing event, not a filing event.** Select and record actions proportionate to the determination and to the safety relevance of the evidence."),
    STEPS([
      {h:"Increased surveillance", b:"And elevated deliverable review: full review rather than sampling."},
      {h:"Corrective action request", b:"Tracked to closure on the corrective artifact, not on an assertion of completion. Include an extent check across delivered units where the finding indicates a control failure rather than an isolated error."},
      {h:"Source inspection", b:"Or witness points at defined operations."},
      {h:"Delivery or payment holds", b:"Per the contract terms, administered by subcontracts."},
      {h:"Award restriction", b:"Restriction or suspension of new awards, and where warranted, disqualification."}
    ]),
    P("An **ineffective** determination requires four things beyond the ladder. So does a conditionally effective one founded on safety-relevant evidence. These close loops that would otherwise stay open:"),
    TABLE(["Required action","What it protects against"],[
      ["Re-run the audit designation assessment for items that supplier builds","A product built by a process now known to be ineffective, never sampled by audit. Supplier ineffectiveness and escape history are designation factors"],
      ["Report into the safety data stream where evidence is safety-relevant","Configuration escapes on safety-significant product treated as a supply chain matter and never reaching the people who own the hazard analysis"],
      ["Review any validated equivalent control that relies on that supplier\u2019s process","An equivalent control resting on an ineffective process is no longer validated, and returns to the safety disposition gate"],
      ["Re-assess classification and the derived requirement set","Requirements tailored on the assumption of a capable process. That assumption has just been disproved"]
    ])
  ], check:{
    q:"A supplier responds to a corrective action request by confirming in writing that the process has been fixed. What is needed before closure?",
    o:["Nothing further: the supplier owns their process",
       "A follow-up audit at the next scheduled interval",
       "The corrective artifact itself, plus an extent check across delivered units where a control failed",
       "Acquirer concurrence on the closure"],
    a:2,
    why:"Corrective actions close on the corrective artifact, not on an assertion of completion. Where the finding indicates a control failure rather than an isolated error, the extent check across already-delivered units is part of closure, not an optional extra."
  }},

  {id:"M2-26", title:"Recursion, and safety requirements at depth", body:[
    S("A tier that cannot be seen through is a tier that is not controlled.",
      "Wherever a supplier has sub-tiers, the comply-or-suitably-tailor obligation flows again, and sub-tier product data, part numbers and serial numbers, returns upward with traceability to next higher assemblies."),
    P("This is why the sub-supplier CM plan must address sub-tier flowdown, and why a plan silent on it is a **named failure signal** rather than a missing detail. Your company does not contract with the lower tiers: the supplier does. What you impose is the recursive obligation, and what you verify is that they have discharged it."),
    S("Requirements mandatory for safety do not dilute with depth.",
      "Tier three is not a place where the obligation becomes optional. Supplier-tier tailoring of a requirement mandatory for safety goes through the safety disposition gate, is evaluated independently where an equivalent control is proposed, and is recorded at the named authority level."),
    C("Common failure modes to recognize",[
      "Classifying by the dominant work type only. Tailoring without recording the classification. Citing a requirement without its deliverable. Deciding audit applicability once, at award. Reading \u201cno designation\u201d as \u201cno verification flowdown.\u201d Imposing the reconciliation report but not the method. Leaving the part attribute authorship case unstated. Assembling effectiveness evidence at review time. Treating a determination as a filing event. Closing a corrective action on an assertion. Letting the classification go stale."
    ])
  ], check:{
    q:"A supplier proposes not to flow a requirement mandatory for safety to its own small machining sub-tier. What is the correct response?",
    o:["Accept it: proportionality is the point of tailoring",
       "Refuse it verbally and move on",
       "Route the proposal through the safety disposition gate for disposition and record the outcome; the decision is not the supplier\u2019s and not yours alone",
       "Escalate to the Acquirer for direction"],
    a:2,
    why:"The size of the shop is not a disposition. Requirements mandatory for safety do not dilute with depth. Even a refusal is recorded through the gate, so that the next person can see the decision and its basis."
  }}
 ],
 exercises:[
  {id:"M2-E1", title:"Exercise 1: Classify five procurements",
   scen:"For each, state the work type or types, and give the two answers that drove it, who holds design authority, and who performs the build.",
   parts:[
     {id:"a", q:"A machine shop produces a titanium fitting to your company\u2019s released drawing."},
     {id:"b", q:"A supplier develops and manufactures an electro-hydraulic actuator to your source control drawing. It contains a microcontroller running the supplier\u2019s own embedded firmware."},
     {id:"c", q:"An engineering services firm produces the drawing package for a wing rib; your company manufactures it."},
     {id:"d", q:"A heat-treat house processes forgings you supply, to your process specification. And: a vendor supplies a catalog connector to their own part number under your vendor item control drawing."}
   ]},
  {id:"M2-E2", title:"Exercise 2: Derive from a mixed classification",
   scen:"Take the actuator above. The matrix marks the sub-supplier CM plan row T for the SCD work type and R for the software work type; the software CM row C for the SCD work type and R for the software work type; and the reconciliation report row R for both.",
   parts:[
     {id:"a", q:"What is imposed for each of the three rows, and why?"},
     {id:"b", q:"State the rule you applied, in one sentence."},
     {id:"c", q:"The engineer before you classified this as the SCD work type only. Name three specific requirements that would not have been imposed, and the consequence."}
   ]},
  {id:"M2-E3", title:"Exercise 3. The audit clause",
   scen:"You are writing the statement of work for a new supplier who will build a designated CI to print. At award, the CI has NOT been designated for configuration audit.",
   parts:[
     {id:"a", q:"Do you cite audit requirements? Explain your reasoning, and say what the supplier\u2019s role would be if designation arrived."},
     {id:"b", q:"What is it about introducing this supplier that bears on the designation question?"},
     {id:"c", q:"Six months after award the CI is designated. What happens under the statement of work you would write, versus one that decided audit applicability at award?"},
     {id:"d", q:"The program manager argues that since the CI is not designated, no verification requirements need flow at all. How do you answer?"}
   ]},
  {id:"M2-E4", title:"Exercise 4: Reading a delivery",
   scen:"Twelve life-limited actuators arrive from a source-controlled design-and-build supplier. Part traceability records are present for all twelve, with serial and lot numbers complete, but the life-consumed field is blank on all twelve. The reconciliation report for the lot states no open deltas. Receiving separately finds that two units carry a bracket to a revision superseded four months earlier.",
   parts:[
     {id:"a", q:"List each finding, classify each as a record defect or a control that did not operate, and say which evidence stream it belongs to."},
     {id:"b", q:"Which finding is the most serious signal about the supplier\u2019s CM process, and why?"},
     {id:"c", q:"Is any of this safety-relevant? What follows if it is?"},
     {id:"d", q:"What determination would you support on this evidence alone, and what would you want to see before making it?"}
   ]},
  {id:"M2-E5", title:"Exercise 5: Acting on a determination",
   scen:"After a further two quarters of accrued evidence showing a declining first-pass acceptance rate, you record a determination of Ineffective on that supplier.",
   parts:[
     {id:"a", q:"Select actions from the ladder and justify the level you chose."},
     {id:"b", q:"One action is a corrective action request. What must be true before you close it?"},
     {id:"c", q:"Name the four downstream consequences an ineffective determination triggers beyond the ladder, and what each protects against."},
     {id:"d", q:"A requirement was tailored at award on the basis that the supplier had a mature process. What now?"}
   ]},
  {id:"M2-E6", title:"Exercise 6: Recursion",
   scen:"The actuator supplier subcontracts machining of the housing to a shop of their own, and buys the position sensor from a catalog vendor.",
   parts:[
     {id:"a", q:"What obligation, if any, does your company have with respect to those two lower-tier sources?"},
     {id:"b", q:"What data must come back up, and in what form?"},
     {id:"c", q:"The supplier\u2019s CM plan describes internal change control thoroughly and does not mention sub-tier suppliers. What is your review finding, which evidence stream does it belong to, and why is it a failure signal rather than a missing detail?"}
   ]},
  {id:"M2-E7", title:"Exercise 7: Audit designation over a program life",
   scen:"At award, a CI built by a source-controlled design-and-build supplier is not contractually designated for audit. It hosts no hazard risk control. The assessment finds one risk factor: the supplier is a new source. Eighteen months later a hazard log revision adds a risk control to the CI. Six months after that, the supplier introduces a new sub-tier for a critical component.",
   parts:[
     {id:"a", q:"What is the designation outcome at award, and what is recorded?"},

/* ==========================================================================
   STATE
   ========================================================================== */
var STATE = { name:"", started:new Date().toISOString(), checks:{}, answers:{}, seen:{} };
var VIEW = { page:"start" };          // "start" | "s:<id>" | "x:<modId>" | "submit"
var PAGES = [];                        // flat ordered page list
var AUTOSAVE = false;

(function buildPages(){
  PAGES.push({k:"start", id:"START", nm:"Start here", grp:null});
  for(var i=0;i<MODULES.length;i++){
    var m=MODULES[i];
    for(var j=0;j<m.sections.length;j++){
      PAGES.push({k:"sect", id:m.sections[j].id, nm:m.sections[j].title, grp:m.id, mi:i, si:j});
    }
    PAGES.push({k:"ex", id:m.id+"-EX", nm:"Exercises", grp:m.id, mi:i});
  }
  PAGES.push({k:"submit", id:"RESULTS", nm:"Review and send", grp:null});
})();

/* ---- guarded browser storage: used only if the browser allows it ---- */
function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ window.localStorage.removeItem(k); return true; }catch(e){ return false; } }

/* ---- clear all: two-step arm so one stray click cannot wipe the record ---- */
var CLEAR_ARMED = false, clearT;
function clearLabel(){ return 'Clear<span class="lng"> all</span>'; }
function disarmClear(){
  CLEAR_ARMED = false;
  clearTimeout(clearT);
  var b = document.getElementById("btnClear");
  if(b){ b.innerHTML = clearLabel(); b.classList.remove("armed"); }
}
function armClear(){
  CLEAR_ARMED = true;
  var b = document.getElementById("btnClear");
  b.innerHTML = "Confirm clear";
  b.classList.add("armed");
  toast("This erases every answer and every check. Click Confirm clear to go ahead. The button resets itself in ten seconds.");
  clearTimeout(clearT);
  clearT = setTimeout(disarmClear, 10000);
}
function resetAll(){
  disarmClear();
  STATE = { name:"", started:new Date().toISOString(), checks:{}, answers:{}, seen:{} };
  VIEW  = { page:"start" };
  lsDel("cmtrain_state");
  var w = document.getElementById("who");
  if(w) w.value = "";
  draw();
  window.scrollTo({top:0,behavior:"auto"});
  var r = document.getElementById("rail");
  if(r) r.classList.remove("open");
  toast("Cleared. Answers, checks, and the trainee name are gone. You are back at the start.");
}
(function detect(){ AUTOSAVE = lsSet("cmtrain_probe","1"); })();

function autosave(){
  if(!AUTOSAVE) return;
  lsSet("cmtrain_state", JSON.stringify(STATE));
}
function autoload(){
  if(!AUTOSAVE) return false;
  var raw = lsGet("cmtrain_state");
  if(!raw) return false;
  try{ var o=JSON.parse(raw); if(o && o.checks){ STATE=o; return true; } }catch(e){}
  return false;
}

/* ==========================================================================
   RENDERING HELPERS
   ========================================================================== */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
}
function block(b){
  if(b.t==="p") return "<p>"+fmt(b.x)+"</p>";
  if(b.t==="list") return "<ul class='pl'>"+b.x.map(function(i){return "<li>"+fmt(i)+"</li>";}).join("")+"</ul>";
  if(b.t==="callout") return "<div class='callout "+(b.tone==="teal"?"teal":"")+"'>"+
      (b.lab?"<div class='lab'>"+esc(b.lab)+"</div>":"")+
      b.x.map(function(i){return "<p>"+fmt(i)+"</p>";}).join("")+"</div>";
  if(b.t==="stmt") return "<div class='stmt'><b>"+fmt(b.x)+"</b>"+(b.sub?"<span>"+fmt(b.sub)+"</span>":"")+"</div>";
  if(b.t==="cards") return "<div class='cards c"+b.cols+"'>"+b.x.map(function(c){
      return "<div class='card'><h4>"+fmt(c.h)+"</h4><p>"+fmt(c.b)+"</p></div>";}).join("")+"</div>";
  if(b.t==="steps") return "<div class='steps'>"+b.x.map(function(s,i){
      return "<div class='step "+(b.tone||"")+"'><div class='n'>"+(i+1)+"</div><div class='tx'><b>"+fmt(s.h)+"</b><span>"+fmt(s.b)+"</span></div></div>";}).join("")+"</div>";
  if(b.t==="table"){
    var th="<tr>"+b.head.map(function(h){return "<th>"+esc(h)+"</th>";}).join("")+"</tr>";
    var tb=b.x.map(function(r){
      return "<tr>"+r.map(function(c,ci){
        var k = (ci===0 && String(c).length<=10) ? " class='k'" : "";
        return "<td"+k+">"+fmt(c)+"</td>";}).join("")+"</tr>";}).join("");
    return "<div class='tw'><table><thead>"+th+"</thead><tbody>"+tb+"</tbody></table></div>";
  }
  return "";
}
function pageIndex(){
  for(var i=0;i<PAGES.length;i++){
    var p=PAGES[i];
    if(VIEW.page==="start"&&p.k==="start") return i;
    if(VIEW.page==="submit"&&p.k==="submit") return i;
    if(VIEW.page==="s:"+p.id) return i;
    if(VIEW.page==="x:"+p.grp&&p.k==="ex") return i;
  }
  return 0;
}
function pageKey(p){
  if(p.k==="start") return "start";
  if(p.k==="submit") return "submit";
  if(p.k==="ex") return "x:"+p.grp;
  return "s:"+p.id;
}

/* ---- completion status ---- */
function sectStatus(id){
  if(STATE.checks[id]) return "done";
  if(STATE.seen[id]) return "work";
  return "";
}
function exStatus(modId){
  var m = mod(modId), total=0, filled=0;
  m.exercises.forEach(function(x){ x.parts.forEach(function(p){
    total++; var v=STATE.answers[x.id+"."+p.id]; if(v&&v.trim().length>0) filled++;
  });});
  if(filled===0) return "";
  return filled===total ? "done" : "work";
}
function mod(id){ for(var i=0;i<MODULES.length;i++) if(MODULES[i].id===id) return MODULES[i]; return null; }

function counts(){
  var totalChecks=0, answered=0, right=0;
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    totalChecks++;
    var c=STATE.checks[s.id];
    if(c){ answered++; if(c.first===true) right++; }
  });});
  var totalParts=0, filledParts=0;
  MODULES.forEach(function(m){ m.exercises.forEach(function(x){ x.parts.forEach(function(p){
    totalParts++; var v=STATE.answers[x.id+"."+p.id]; if(v&&v.trim().length>0) filledParts++;
  });});});
  return {totalChecks:totalChecks, answered:answered, right:right, totalParts:totalParts, filledParts:filledParts};
}

/* ==========================================================================
   RAIL
   ========================================================================== */
function drawRail(){
  var c=counts();
  var h="<div class='railhead'><h2>Section register</h2><p>"+c.answered+" of "+c.totalChecks+
        " sections released \u00b7 "+c.filledParts+" of "+c.totalParts+" exercise answers written</p></div>";
  h+="<div class='grp'>"+navBtn(PAGES[0])+"</div>";
  MODULES.forEach(function(m){
    h+="<div class='grp'><h3>"+esc(m.label)+": "+esc(m.title)+"</h3>";
    PAGES.forEach(function(p){ if(p.grp===m.id) h+=navBtn(p); });
    h+="</div>";
  });
  h+="<div class='grp'>"+navBtn(PAGES[PAGES.length-1])+"</div>";
  document.getElementById("rail").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll("#rail .nav"), function(b){
    b.addEventListener("click", function(){ go(b.getAttribute("data-k")); });
  });
}
function navBtn(p){
  var st = p.k==="sect" ? sectStatus(p.id) : (p.k==="ex" ? exStatus(p.grp) : "");
  var cur = pageKey(p)===VIEW.page;
  return "<button class='nav' data-k='"+pageKey(p)+"' aria-current='"+(cur?"true":"false")+"'>"+
    "<span class='dot "+st+"'></span><span class='id'>"+esc(p.id)+"</span><span class='nm'>"+esc(p.nm)+"</span></button>";
}

/* ==========================================================================
   PAGE RENDERERS
   ========================================================================== */
function go(key){
  VIEW.page=key;
  var p=PAGES[pageIndex()];
  if(p.k==="sect") STATE.seen[p.id]=true;
  autosave(); draw();
  window.scrollTo({top:0,behavior:"auto"});
  document.getElementById("rail").classList.remove("open");
}
function draw(){
  drawRail();
  var i=pageIndex(), p=PAGES[i], st=document.getElementById("stage");
  if(p.k==="start") st.innerHTML=viewStart();
  else if(p.k==="submit") st.innerHTML=viewSubmit();
  else if(p.k==="ex") st.innerHTML=viewExercises(mod(p.grp));
  else st.innerHTML=viewSection(MODULES[p.mi], MODULES[p.mi].sections[p.si], p);
  st.className="stage fadein";
  st.innerHTML += pager(i);
  wire(i,p);
}
function pager(i){
  var prev=i>0?PAGES[i-1]:null, next=i<PAGES.length-1?PAGES[i+1]:null;
  return "<div class='pager'>"+
   (prev?"<button class='btn gh' data-nav='"+pageKey(prev)+"'>\u2190 "+esc(prev.nm)+"</button>":"<span></span>")+
   (next?"<button class='btn pri' data-nav='"+pageKey(next)+"'>"+esc(next.nm)+" \u2192</button>":"<span></span>")+
   "</div>";
}

  var nS=0,nE=0; MODULES.forEach(function(m){nS+=m.sections.length; nE+=m.exercises.length;});
  var save = AUTOSAVE

    "<dl class='meta'>"+
    "<dt>Module 1</dt><dd>Configuration identification: what a Configuration Item is, how one is selected, and how the identification is maintained. "+MODULES[0].sections.length+" sections, "+MODULES[0].exercises.length+" exercises.</dd>"+
    "<dt>Module 2</dt><dd>Sub-supplier CM requirements flowdown: what is imposed on a supplier, how it is imposed, and how you find out whether it worked. "+MODULES[1].sections.length+" sections, "+MODULES[1].exercises.length+" exercises.</dd>"+
    "<dt>Prerequisites</dt><dd>None. Module 2 assumes Module 1.</dd>"+
    "<dt>Time</dt><dd>Allow around three hours per module, plus the exercises. Very few people do this in one sitting, and it is not designed to be.</dd></dl>"+
    "<div class='callout'><div class='lab'>How your work is kept</div><p>"+save+"</p>"+
    "<p>When you are done, go to <strong>Review and send</strong>. It shows your score, gathers every answer into one record, and gives you the ways to send it.</p></div>"+
    "<div class='callout teal'><div class='lab'>Where are the document numbers?</div>"+
    "<p>This training teaches the rules themselves rather than pointing you at documents. Where you see \u201cthe classification log\u201d or \u201cthe flowdown matrix,\u201d your trainer will show you where the current versions live: titles and numbers change; the obligations do not.</p></div>"+
    "<p class='note'>Enter your name in the header before you begin: it goes on the record you send.</p>";
}

function viewSection(m,s,p){
  var idx=m.sections.indexOf(s)+1;
  var st=sectStatus(s.id);
  var stl = st==="done" ? "Released" : (st==="work" ? "In work" : "Not started");
  var h="<div class='eyebrow'><span class='recid'>"+esc(s.id)+"</span>"+
        "<span class='status'>"+esc(m.label)+" \u00b7 section "+idx+" of "+m.sections.length+" \u00b7 "+stl+"</span></div>"+
        "<h1 class='sect'>"+esc(s.title)+"</h1><div class='hr'></div>";
  s.body.forEach(function(b){ h+=block(b); });
  h+=checkHtml(s);
  return h;
}
function checkHtml(s){
  var rec=STATE.checks[s.id];
  var locked=!!rec;
  var h="<div class='check' data-check='"+esc(s.id)+"'><div class='lab'>Check yourself</div><div class='q'>"+fmt(s.check.q)+"</div>";
  s.check.o.forEach(function(o,i){
    var cls="opt"+(locked?" locked":"");
    if(locked){
      if(i===s.check.a) cls+=" right";
      else if(rec.picks && rec.picks.indexOf(i)>=0) cls+=" wrong";
    }
    h+="<label class='"+cls+"'><input type='radio' name='ck_"+esc(s.id)+"' value='"+i+"'"+
       (locked?" disabled":"")+(rec&&rec.picks&&rec.picks.indexOf(i)>=0?" checked":"")+"> <span>"+fmt(o)+"</span></label>";
  });
  h+="<div class='btnrow' style='margin-top:12px;margin-bottom:0'>"+
     (locked?"":"<button class='btn pri' data-ckgo='"+esc(s.id)+"'>Check answer</button>")+"</div>";
  var fb="";
  if(locked){
    var ok = rec.first===true;
    fb="<div class='fb show "+(ok?"ok":"no")+"'><b>"+(ok?"Correct":"Not quite")+"</b>"+fmt(s.check.why)+"</div>";
  }else{
    fb="<div class='fb' data-fb='"+esc(s.id)+"'></div>";
  }
  return h+fb+"</div>";
}

function viewExercises(m){
  var h="<div class='eyebrow'><span class='recid'>"+esc(m.id)+"-EX</span><span class='status'>"+esc(m.label)+" \u00b7 written exercises</span></div>"+
    "<h1 class='sect'>Exercises: "+esc(m.title)+"</h1><div class='hr'></div>"+
    "<p>Write your reasoning, not just your conclusion: the reasoning is what is being assessed, and several of these have more than one defensible answer. Where a question turns on a fact you have not been given, <strong>say so, and say what you would ask for and whom you would ask.</strong> Recognizing the missing fact is part of the exercise.</p>"+
    "<p class='note'>Answers save as you type. There is no word limit and no right length.</p>";
  m.exercises.forEach(function(x){
    h+="<div class='exwrap'><h4>"+esc(x.title)+"</h4><div class='scen'>"+fmt(x.scen)+"</div>";
    x.parts.forEach(function(pt){
      var key=x.id+"."+pt.id, v=STATE.answers[key]||"";
      h+="<div class='part'><label for='ta_"+esc(key)+"'>"+esc(pt.id)+".&nbsp; "+fmt(pt.q)+"</label>"+
         "<textarea id='ta_"+esc(key)+"' data-ans='"+esc(key)+"' rows='4' placeholder='Your answer'>"+esc(v)+"</textarea>"+
         "<div class='count' data-cnt='"+esc(key)+"'>"+wordCount(v)+"</div></div>";
    });
    h+="</div>";
  });
  return h;
}
function wordCount(v){
  var n=(v||"").trim(); n = n? n.split(/\s+/).length : 0;
  return n===0 ? "not started" : (n+" word"+(n===1?"":"s"));
}

function viewSubmit(){
  var c=counts();
  var pct = c.totalChecks ? Math.round(100*c.right/c.totalChecks) : 0;
  var gaps=[];
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    var r=STATE.checks[s.id];
    if(!r) gaps.push([s.id, s.title, "not attempted"]);
    else if(r.first!==true) gaps.push([s.id, s.title, "wrong on first attempt"]);
  });});
  var missing=[];
  MODULES.forEach(function(m){ m.exercises.forEach(function(x){ x.parts.forEach(function(pt){
    var v=STATE.answers[x.id+"."+pt.id];
    if(!v||!v.trim()) missing.push(x.id+"."+pt.id);
  });});});

  var h="<div class='eyebrow'><span class='recid'>RESULTS</span><span class='status'>Training record \u00b7 review and send</span></div>"+
    "<h1 class='sect'>Review and send</h1>"+
    "<p class='lede'>Check the record below, then send it to "+esc(CONFIG.trainerName)+". Nothing leaves this page until you choose one of the options.</p><div class='hr'></div>";

  if(!STATE.name || !STATE.name.trim()){
    h+="<div class='warn'>Add your name in the header before sending: the record needs to say whose it is.</div>";
  }
  if(missing.length){
    h+="<div class='warn'>"+missing.length+" exercise answer"+(missing.length===1?" is":"s are")+" still blank. You can send anyway, but "+esc(CONFIG.trainerName)+" will only see what you wrote.</div>";
  }

  h+="<div class='transmit'><div class='hd'><b>Training record</b><span>"+esc(recordNo())+"</span></div><div class='bd'>"+
     "<div class='scorebox'>"+
     "<div><div class='big'>"+c.right+" / "+c.totalChecks+"</div><div class='lab'>Section checks correct first time</div></div>"+
     "<div><div class='big'>"+pct+"%</div><div class='lab'>First-attempt score</div></div>"+
     "<div><div class='big'>"+c.filledParts+" / "+c.totalParts+"</div><div class='lab'>Exercise answers written</div></div>"+
     "</div>";
  if(gaps.length){
    h+="<div class='gaps'><p style='margin:14px 0 6px'><strong>Sections to revisit</strong> these are what your trainer will focus the review session on:</p><ul class='pl'>"+
       gaps.map(function(g){return "<li><span style='font-family:var(--mono);font-size:12px'>"+esc(g[0])+"</span> &nbsp;"+esc(g[1])+": "+esc(g[2])+"</li>";}).join("")+"</ul></div>";
  }else{
    h+="<p style='margin-top:14px'><strong>Every section check answered correctly on the first attempt.</strong></p>";
  }
  h+="</div></div>";

  h+="<h2 style='font-family:var(--serif);font-size:22px;margin:26px 0 10px'>Send it</h2>";
  h+="<div class='btnrow'>"+
     "<button class='btn pri' id='btnDownload'>Download the record</button>"+
     "<button class='btn' id='btnCopy'>Copy as text</button>"+
     (CONFIG.trainerEmail?"<button class='btn' id='btnMail'>Open an email to "+esc(CONFIG.trainerEmail)+"</button>":"")+
     (CONFIG.submitEndpoint?"<button class='btn' id='btnPost'>Send to trainer</button>":"")+
     "</div>";
  h+="<p class='note'><strong>Download the record</strong> gives you a single file to attach to an email: it opens in any browser and prints cleanly. "+
     "<strong>Copy as text</strong> puts everything on the clipboard for pasting into email or chat."+
     (CONFIG.trainerEmail?" <strong>Open an email</strong> starts a message with your answers in the body; long answers may be cut short by your mail program, so attach the downloaded file as well.":"")+"</p>";

  if(!CONFIG.trainerEmail && !CONFIG.submitEndpoint){
    h+="<div class='setup'><strong>Trainer setup not finished.</strong> No delivery address has been set, so the email option is hidden. "+
       "Open this file in a text editor, find <code>var CONFIG</code> near the top of the script, set <code>trainerEmail</code>, and save. "+
       "Everything else keeps working without it.</div>";
  }
  return h;
}
function recordNo(){
  var d=new Date();
  var pad=function(n){return n<10?"0"+n:""+n;};
  var initials=(STATE.name||"").trim().split(/\s+/).map(function(w){return w.charAt(0).toUpperCase();}).join("").slice(0,3)||"XXX";
  return "CMT-"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"-"+initials;
}

/* ==========================================================================
   WIRING
   ========================================================================== */
function wire(i,p){
  Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"), function(b){
    b.addEventListener("click", function(){ go(b.getAttribute("data-nav")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ckgo]"), function(b){
    b.addEventListener("click", function(){ grade(b.getAttribute("data-ckgo")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ans]"), function(t){
    t.addEventListener("input", function(){
      var k=t.getAttribute("data-ans");
      STATE.answers[k]=t.value;
      var c=document.querySelector("[data-cnt='"+k+"']");
      if(c) c.textContent=wordCount(t.value);
      clearTimeout(window.__sv); window.__sv=setTimeout(function(){ autosave(); drawRail(); },400);
    });
  });
  var bd=document.getElementById("btnDownload"); if(bd) bd.addEventListener("click", downloadRecord);
  var bc=document.getElementById("btnCopy");     if(bc) bc.addEventListener("click", copyRecord);
  var bm=document.getElementById("btnMail");     if(bm) bm.addEventListener("click", mailRecord);
  var bp=document.getElementById("btnPost");     if(bp) bp.addEventListener("click", postRecord);
}

function grade(id){
  var sec=null;
  MODULES.forEach(function(m){ m.sections.forEach(function(s){ if(s.id===id) sec=s; }); });
  if(!sec) return;
  var picked=document.querySelector("input[name='ck_"+id+"']:checked");
  if(!picked){ toast("Choose an answer first."); return; }
  var v=parseInt(picked.value,10);
  STATE.checks[id]={ first:(v===sec.check.a), picks:[v], at:new Date().toISOString() };
  autosave(); draw();
  var el=document.querySelector("[data-check='"+id+"']");
  if(el) el.scrollIntoView({block:"center", behavior:"smooth"});
}

/* ==========================================================================
   SAVE / RESUME / SEND
   ========================================================================== */
function download(name, text, type){
  try{
    var b=new Blob([text],{type:type||"text/plain;charset=utf-8"});
    var u=URL.createObjectURL(b);
    var a=document.createElement("a");
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); },600);
    return true;
  }catch(e){ return false; }
}
function slug(){ return (STATE.name||"unnamed").trim().replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"") || "unnamed"; }

function saveProgress(){
  STATE.saved=new Date().toISOString();
  var ok=download("CM-training-progress-"+slug()+".json", JSON.stringify(STATE,null,2), "application/json");
  toast(ok ? "Progress file downloaded. Reopen it with Resume." : "This browser blocked the download. Use Copy as text on the Review and send page instead.");
}
function loadProgress(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o || !o.checks || !o.answers) throw new Error("shape");
      STATE=o; document.getElementById("who").value=STATE.name||"";
      autosave(); go("start");
      toast("Progress restored.");
    }catch(e){ toast("That file is not a training progress file. Look for CM-training-progress-….json"); }
  };
  r.onerror=function(){ toast("The file could not be read. Try selecting it again."); };
  r.readAsText(file);
}

function recordLines(){
  var c=counts(), out=[];
  out.push("CONFIGURATION ITEM AND CM SUPPLIER FLOWDOWN TRAINING: TRAINING RECORD");
  out.push("Record: "+recordNo());
  out.push("Trainee: "+(STATE.name||"(name not entered)"));
  out.push("Company: "+CONFIG.companyName);
  out.push("Completed: "+new Date().toLocaleString());
  out.push("");
  out.push("SCORE");
  out.push("  Section checks correct first time: "+c.right+" of "+c.totalChecks+"  ("+(c.totalChecks?Math.round(100*c.right/c.totalChecks):0)+"%)");
  out.push("  Exercise answers written: "+c.filledParts+" of "+c.totalParts);
  out.push("");
  out.push("SECTIONS TO REVISIT");
  var any=false;
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    var r=STATE.checks[s.id];
    if(!r){ out.push("  "+s.id+"  "+s.title+", not attempted"); any=true; }
    else if(r.first!==true){ out.push("  "+s.id+"  "+s.title+": wrong on first attempt"); any=true; }
  });});
  if(!any) out.push("  None: every check correct on the first attempt.");
  MODULES.forEach(function(m){
    out.push(""); out.push("=".repeat(60));
    out.push(m.label.toUpperCase()+": "+m.title.toUpperCase()+": EXERCISE ANSWERS");
    out.push("=".repeat(60));
    m.exercises.forEach(function(x){
      out.push(""); out.push(x.title);
      out.push("Scenario: "+x.scen);
      x.parts.forEach(function(pt){
        var v=(STATE.answers[x.id+"."+pt.id]||"").trim();
        out.push("");
        out.push("  "+pt.id+") "+pt.q);
        out.push("     "+(v? v.split("\n").join("\n     ") : "(no answer written)"));
      });
    });
  });
  return out.join("\n");
}
function recordHtml(){
  var c=counts();
  var rows="";
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    var r=STATE.checks[s.id];
    var st = !r ? "Not attempted" : (r.first===true ? "Correct first time" : "Wrong first attempt");
    var cls = !r ? "na" : (r.first===true ? "ok" : "no");
    rows+="<tr class='"+cls+"'><td class='k'>"+esc(s.id)+"</td><td>"+esc(s.title)+"</td><td>"+st+"</td></tr>";
  });});
  var ex="";
  MODULES.forEach(function(m){
    ex+="<h2>"+esc(m.label)+": "+esc(m.title)+"</h2>";
    m.exercises.forEach(function(x){
      ex+="<div class='ex'><h3>"+esc(x.title)+"</h3><p class='sc'>"+esc(x.scen)+"</p>";
      x.parts.forEach(function(pt){
        var v=(STATE.answers[x.id+"."+pt.id]||"").trim();
        ex+="<p class='q'>"+esc(pt.id)+") "+esc(pt.q)+"</p><div class='a"+(v?"":" empty")+"'>"+
            (v?esc(v).split("\n").join("<br>"):"No answer written")+"</div>";
      });
      ex+="</div>";
    });
  });
  return "<!DOCTYPE html><html><head><meta charset='utf-8'><title>CI and supplier flowdown training record: "+esc(STATE.name||"unnamed")+"</title>"+
   "<style>body{font-family:Georgia,serif;max-width:820px;margin:36px auto;padding:0 24px;color:#1E262E;line-height:1.55}"+
   "h1{font-size:26px;margin:0 0 4px}.sub{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#5C6D78;letter-spacing:.06em}"+
   "table.meta{width:auto;margin:18px 0 26px;font-size:14px}table.meta th{background:none;color:#5C6D78;font-family:ui-monospace,Consolas,monospace;font-size:11px;text-transform:uppercase;text-align:left;padding:3px 18px 3px 0;white-space:nowrap;font-weight:normal;vertical-align:top}table.meta td{border:0;padding:3px 0}"+
   "table{border-collapse:collapse;width:100%;font-size:13.5px;margin-bottom:26px}"+
   "th{background:#1E262E;color:#fff;text-align:left;padding:7px 10px;font-size:12px}"+
   "td{padding:6px 10px;border-top:1px solid #D6DCDF;vertical-align:top}td.k{font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:nowrap;width:88px}th.r{width:150px}"+
   "tr.no td{background:#F4E2E2}tr.na td{background:#F6ECD8}"+
   "h2{font-size:19px;border-bottom:2px solid #1E262E;padding-bottom:5px;margin:32px 0 14px}"+
   ".ex{margin-bottom:26px}.ex h3{font-size:16px;margin:0 0 6px}"+
   ".sc{background:#F4F6F7;padding:10px 13px;border-radius:4px;font-size:13.5px;margin:0 0 12px}"+
   ".q{font-weight:bold;font-size:14px;margin:12px 0 5px}"+
   ".a{font-family:-apple-system,Segoe UI,Arial,sans-serif;font-size:14px;background:#fff;border-left:3px solid #A8481F;padding:8px 13px;white-space:normal}"+
   ".a.empty{color:#8998A2;border-left-color:#D6DCDF;font-style:italic}"+
   "@media print{body{margin:0}.ex{page-break-inside:avoid}}</style></head><body>"+
   "<h1>Configuration management onboarding: training record</h1>"+
   "<div class='sub'>"+esc(recordNo())+"</div>"+
   "<table class='meta'><tr><th>Trainee</th><td>"+esc(STATE.name||"(name not entered)")+"</td></tr>"+
   "<tr><th>Company</th><td>"+esc(CONFIG.companyName)+"</td></tr>"+
   "<tr><th>Completed</th><td>"+esc(new Date().toLocaleString())+"</td></tr>"+
   "<tr><th>Checks</th><td>"+c.right+" of "+c.totalChecks+" correct on the first attempt ("+(c.totalChecks?Math.round(100*c.right/c.totalChecks):0)+"%)</td></tr>"+
   "<tr><th>Exercises</th><td>"+c.filledParts+" of "+c.totalParts+" answers written</td></tr></table>"+
   "<h2>Section checks</h2><table><colgroup><col style='width:88px'><col><col style='width:150px'></colgroup><thead><tr><th>Section</th><th>Title</th><th class='r'>Result</th></tr></thead><tbody>"+rows+"</tbody></table>"+
   ex+"</body></html>";
}
function downloadRecord(){
  var ok=download("CI-CM-flowdown-training-record-"+slug()+".html", recordHtml(), "text/html;charset=utf-8");
  toast(ok ? "Record downloaded. Attach it to an email to "+CONFIG.trainerName+"." : "This browser blocked the download. Use Copy as text instead.");
}
function copyRecord(){
  var txt=recordLines();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast("Record copied. Paste it into an email or chat."); },
      function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  var t=document.createElement("textarea");
  t.value=txt; t.style.position="fixed"; t.style.opacity="0";
  document.body.appendChild(t); t.select();
  var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  document.body.removeChild(t);
  toast(ok ? "Record copied. Paste it into an email or chat." : "Copying is blocked here. Use Download the record instead.");
}
function mailRecord(){
  var subj="CI and supplier flowdown training record: "+(STATE.name||"unnamed")+": "+recordNo();
  var body=recordLines();
  var url="mailto:"+encodeURIComponent(CONFIG.trainerEmail)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
  if(url.length>1900){
    var c=counts();
    var shortBody="Configuration management onboarding: training record\n"+recordNo()+
      "\nTrainee: "+(STATE.name||"(name not entered)")+
      "\nChecks: "+c.right+" of "+c.totalChecks+" correct first time"+
      "\nExercises: "+c.filledParts+" of "+c.totalParts+" answers written"+
      "\n\nThe full record, including all written answers, is attached.\n(If it is not attached yet: go back to the training, choose Download the record, and attach the file.)";
    url="mailto:"+encodeURIComponent(CONFIG.trainerEmail)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(shortBody);
    downloadRecord();
    toast("Answers are too long for an email body, so the record was downloaded: attach it to the message.");
  }
  window.location.href=url;
}
function postRecord(){
  var b=document.getElementById("btnPost");
  b.disabled=true; b.textContent="Sending\u2026";
  var payload={ record:recordNo(), name:STATE.name||"", company:CONFIG.companyName,
    completed:new Date().toISOString(), score:counts(), checks:STATE.checks, answers:STATE.answers };
  fetch(CONFIG.submitEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
   .then(function(r){
      if(r.ok){ b.textContent="Sent"; toast("Sent to "+CONFIG.trainerName+"."); }
      else{ b.disabled=false; b.textContent="Send to trainer"; toast("The server refused it ("+r.status+"). Download the record and email it instead."); }
   })
   .catch(function(){
      b.disabled=false; b.textContent="Send to trainer";
      toast("Could not reach the server. Download the record and email it instead.");
   });
}

/* ==========================================================================
   MISC
   ========================================================================== */
var toastT;
function toast(m){
  var t=document.getElementById("toast");
  t.textContent=m; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("show"); },4200);
}

document.getElementById("who").addEventListener("input", function(e){
  STATE.name=e.target.value; autosave();
});
document.getElementById("btnSave").addEventListener("click", saveProgress);
document.getElementById("btnLoad").addEventListener("click", function(){ document.getElementById("fileIn").click(); });
document.getElementById("btnClear").addEventListener("click", function(){
  if(CLEAR_ARMED) resetAll(); else armClear();
});
document.getElementById("btnClear").addEventListener("blur", function(){ setTimeout(disarmClear, 200); });
document.getElementById("fileIn").addEventListener("change", function(e){
  if(e.target.files && e.target.files[0]) loadProgress(e.target.files[0]);
  e.target.value="";
});
document.getElementById("railToggle").addEventListener("click", function(e){
  e.stopPropagation();
  document.getElementById("rail").classList.toggle("open");
});
document.querySelector("main").addEventListener("click", function(){
  document.getElementById("rail").classList.remove("open");
});
document.addEventListener("keydown", function(e){
  if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  var i=pageIndex();
  if(e.key==="ArrowRight" && i<PAGES.length-1) go(pageKey(PAGES[i+1]));
  if(e.key==="ArrowLeft"  && i>0)              go(pageKey(PAGES[i-1]));
});

document.getElementById("brandSub").textContent = CONFIG.companyName + " \u00b7 interactive modules";
if(autoload()){ document.getElementById("who").value = STATE.name||""; }
draw();
</script>
