    P("Where a supplier performs more than one type of work under a single procurement, **record every applicable type, not only the dominant one.** Mixed classifications are ordinary for suppliers who both develop and build, or who build hardware and develop its embedded software."),
    C("The case people miss",[
      "A hardware procurement quietly acquires firmware, nobody re-classifies, and the entire software CM requirement set: version identification, library control, build reproducibility: is never imposed.",
      "When the build cannot be reproduced three years later, that is where it started. **One missing letter in one classification field.**"
    ]),
    S("Tailoring without a recorded classification is omission, not tailoring.",
      "A reduced requirement set with no record of the reasoning is indistinguishable from having forgotten."),
    S("A procurement whose classification cannot be determined is not released until it can.",
      "If you cannot answer who holds design authority and who builds, nobody has defined the procurement well enough to buy against it."),
    P("CM performs classification at statement-of-work development, before release, and records it on the classification log with classifier and date. **That record is the documented tailoring rationale the flowdown obligation requires.**")
  ], check:{
    q:"A source-controlled actuator contains the supplier\u2019s own embedded firmware. The engineer classifies it as source-controlled design and build only. What is the practical consequence?",
    o:["None: source-controlled design and build is the dominant work type and governs",
       "The software CM requirement set is never imposed: version identification, library control and build reproducibility records",
       "The supplier will be over-burdened with unnecessary requirements",
       "Only the audit requirements are affected"],
    a:1,
    why:"Mixed classifications take the union, not the dominant type. Leaving the software and firmware work type off means that requirement set never reaches the statement of work, and the failure surfaces years later when the delivered load cannot be rebuilt."
  }},

  {id:"M2-05", title:"The transaction flow", body:[
    P("Flowdown is transaction-driven: it executes for every procurement, and re-executes whenever the facts change."),
    STEPS([
      {h:"Classify", b:"Work type or types recorded on the classification log, with classifier and date."},
      {h:"Derive", b:"Read the requirement set from the matrix columns. Identify conditionals and rows that are mandatory for safety."},
      {h:"Resolve conditionals", b:"Each resolved against its stated condition, with the basis recorded. Determine audit designation status."},
      {h:"Cite in the statement of work", b:"Every requirement with its deliverable. Standing conditional audit clause where designation is possible."},
      {h:"CM review and signature", b:"Prior to release, recorded on the classification log."},
      {h:"Maintain the classification", b:"Re-run on trigger. Classification is dated, not permanent."},
      {h:"Accrue evidence", b:"Log every deliverable at receipt and every finding or escape as it occurs."},
      {h:"Determine effectiveness", b:"Against the requirement set actually imposed. Record rationale, date and next-due date."},
      {h:"Act on the determination", b:"Actions from the ladder, with owner and due date, tracked to closure."}
    ],"tl"),
    C("Re-classification triggers",[
      "**Scope change, including scope that grows from build into any element of design authority**: the common and easily missed one, because it silently makes change control applicable.",
      "Work type change, including added software or firmware. Audit designation change. Source change: new supplier, facility or sub-tier. Revision of the register of safety-mandatory requirements, or of the requirement matrix. An effectiveness determination of less than effective."
    ])
  ], check:{
    q:"A build-to-print procurement grows in scope: the supplier will now propose minor design improvements for company approval. Why does this matter to flowdown?",
    o:["It does not: the company still owns the design",
       "It changes the price, so the statement of work is reissued anyway",
       "Design authority has partly moved, which silently makes change control applicable: re-classify and update the derived requirement set",
       "It only affects first article inspection"],
    a:2,
    why:"Scope growing from build into any element of design authority is a named re-classification trigger, and the most commonly missed one. Once the supplier can propose changes, an entire requirement set becomes applicable that a build-to-print classification never imposed."
  }},

  {id:"M2-06", title:"Who does what", body:[
    P("Flowdown is not a CM activity with an audience. It is a chain of handoffs, and nearly every failure in this module is a handoff that did not happen, not a judgment that went wrong."),
    TABLE(["Function","What they own in this process"],[
      ["Configuration Management","Owns the process. Classifies each procurement and records it; derives the requirement set and its deliverables; resolves conditionals; drafts or reviews the CM content of the statement of work and signs it before release; maintains the classification through its triggers; logs deliverable receipts and findings; makes or recommends effectiveness determinations; tracks actions to closure"],
      ["Subcontracts and supply chain","Routes **every** statement of work through CM before release; incorporates the cited requirements and deliverables; administers notice periods and delivery terms; notifies CM of scope changes, source changes and award actions; executes the contractual actions arising from a determination"],
      ["Systems and Design Engineering","Provides the technical content the flowdown depends on: source control drawings, specifications, technical data packages, interface definitions. **Approves supplier-proposed part attribute designations**, meaning safety-critical, life-limited and special handling, where the supplier holds design authority. Approves nothing where the designation was externally assigned, because that case has no approver"],
      ["Quality Assurance","Performs receiving verification; records nonconformances, escapes and findings against supplier deliverables; provides first article and source inspection results; supports the extent checks that follow a control failure"],
      ["System Safety","Receives safety-relevant supplier findings and escapes into the safety data stream; concurs on dispositions affecting hazard controls; supports evaluation of tailoring proposals at the supplier tier"],
      ["Program Management","Resources the flowdown and effectiveness work; approves award restrictions and other actions carrying schedule or cost consequence; escalates unresolved supplier CM performance"],
      ["Independent CM and Safety Assurance","Evaluates a proposed equivalent control where a supplier or program wants to tailor a requirement mandatory for safety: independent of the program bearing the decision, which is the entire point of the role"],
      ["Enterprise CM functional lead","Owns the work type taxonomy, the requirement matrix and the deliverable definitions, and maintains them as the requirement set or the register of safety-mandatory requirements changes"],
      ["The sub-tier supplier","Complies with or suitably tailors what is flowed; submits the required deliverables; flows requirements recursively to its own sub-tiers and returns their product data with traceability to next higher assemblies; participates in audits per its work-type role"]
    ]),
    S("Name the handoffs and you have named the failure modes.",
      "A statement of work released without passing through CM. A part attribute authorship case nobody stated, so engineering never approved what the supplier never proposed. An escape found by receiving that never reached the findings log. None of these is a hard judgment call, each is a handoff that had no owner."),
    C("The two roles that must stay independent",[
      "Where a requirement mandatory for safety is proposed for tailoring at the supplier tier, the evaluation is done by CM and Safety Assurance **independent of the program bearing the decision**, and the risk acceptance is signed at the authority the severity names.",
      "A program evaluating its own proposed equivalent control is not an evaluation. It is the proposal, written twice."
    ])
  ], check:{
    q:"A supplier holding design authority proposes which of its parts are safety-critical and life-limited. Who approves those part attribute designations?",
    o:["CM, since CM maintains the traceability records they appear in",
       "The supplier, since they hold design authority for the item",
       "Systems or Design Engineering at your company, as the technical authority for the content the flowdown rests on",
       "Quality Assurance, at receiving verification"],
    a:2,
    why:"This is the second of the three authorship cases. Where the supplier holds design authority they **propose** the part attribute designations during design development, and your company\u2019s engineering function approves them. CM states in the statement of work which case applies, and records the result, but does not make the technical judgment. Leave the case unstated and each party waits for the other, which is how a life-limited part arrives with no assigned limit."
  }},

  {id:"M2-07", title:"Reading the matrix", body:[
    TABLE(["Marking","Means","What you do"],[
      ["R","Required","Impose as written, with its defined data deliverable"],
      ["T","Tailored","Impose with the tailoring documented. What the tailoring is gets recorded, not assumed"],
      ["C","Conditional","Resolve against the stated condition before citation, and record the basis"],
      [". ","Not applicable","Nothing to impose for this work type. The absence is derived from the two questions. It is not negotiated."]
    ]),
    L(["**Mixed work types: apply the most demanding cell for each row.** Wherever any applicable column requires a requirement, it is required. The union, never the intersection.",
       "**Requirements mandatory for safety are not silently dropped.** Where the program proposes not to impose one, the proposal goes through the safety disposition gate and the disposition is referenced in the statement of work."]),
    S("A requirement is cited with its deliverable, or it is not cited.",
      "A clause imposing an obligation without identifying the data that evidences it is unenforceable at receipt and unverifiable at audit. You will have written a sentence that sounds like control and produces nothing you can check.")
  ], check:{
    q:"A row is marked T for one of a supplier\u2019s work types and R for the other. What is imposed?",
    o:["T: the more permissive marking, since one column allows tailoring",
       "R: the most demanding cell governs; wherever any applicable column requires it, it is required",
       "Whichever the dominant work type specifies",
       "Neither, until the conflict is escalated"],
    a:1,
    why:"Mixed classifications take the union. R is more demanding than T, so R governs, and the requirement is imposed as written, with its deliverable."
  }},

  {id:"M2-08", title:"What the matrix actually imposes", body:[
    P("The markings tell you *how much* of a requirement applies. This is *what* the requirements are. A derivation walks these families in order, and each one produces something you can ask for at receipt."),
    TABLE(["Requirement family","What is imposed","What it produces"],[
      ["CM program and planning","The supplier operates CM against the flowed requirement set, and addresses recursive flowdown to its own sub-tiers wherever they exist","A full CM plan for full-development and software work; a tailored plan, or a CM section within the quality plan, where the supplier designs internals, acts as design agent, or performs repair"],
      ["Working to released data","Work only to current released data, with no unauthorized departure from it. Data currency verified at receipt of every revision","No standing deliverable: evidenced through everything else, and by its absence when a departure surfaces"],
      ["Change control","Changes affecting the baseline, form-fit-function-interface, qualification or company-controlled documentation are proposed, not made","Change proposals carrying the need for the change, its full impact data, and a notice for every affected document"],
      ["Variance control","Any departure or nonconformance is variance-requested **before delivery**; a recurring variance found permanently acceptable converts to change action","Variance requests identifying affected units and lots by identifier, with cause, classification and recurrence status"],
      ["Process change notification","For processes identified as critical or special, and for frozen planning: no change without notice, within the agreed notice period, and no implementation before approval","Process change notifications, event-driven"],
      ["Identification and traceability","Enterprise code, part numbers, unit identifiers and nomenclature applied and recorded; unit identifiers never revised or re-used","The part traceability record, per delivered unit or lot"],
      ["Reconciliation","As-built reconciled against released design, or as-maintained against approved configuration, for repair work","Two deliverables, not one: the process documentation once and on revision, and the report per delivery or lot"],
      ["Status accounting","Configuration records kept timely, current, historically traceable and retrievable per the agreed data terms","Status accounting reports by item identifier, current and historical"],
      ["Software CM","Where deliverable software or embedded code exists: version identification, developmental library control, and the ability to reproduce a build","Version descriptions and build reproducibility records: compiler, settings, library and media identification, sufficient to rebuild"],
      ["Configuration audit","Conditional on the item\u2019s audit designation. Held open by the standing clause","The triggered audit deliverables, scoped to the supplier\u2019s role: conduct at their facility, or support with data and access"]
    ]),
    S("Which families produce nothing for a given supplier is itself an answer, and it comes from the two questions.",
      "No design authority, no change proposals. No build, no as-built to reconcile and no traceability record. The families that fall away should fall away for a reason you can state.")
  ], check:{
    q:"A design house develops the technical data package for a wing rib; your company manufactures it. Which family produces no deliverable, and why?",
    o:["Change control: the company owns the design",
       "Software CM: there is no software of any kind on a wing rib",
       "Reconciliation and traceability: the supplier builds nothing, so there is no as-built configuration at their end to reconcile or trace",
       "Status accounting: the supplier holds no configuration records"],
    a:2,
    why:"Who performs the build decides whether the reconciliation and traceability apparatus applies at all, and here nobody builds anything at the supplier, so there is no as-built to reconcile against and no delivered unit to trace. Change control does apply: they develop the design, so changes to it are proposed rather than made."
  }},

  {id:"M2-09", title:"What each work type gets: the design and build types", body:[
    P("The families and the markings are the mechanism. This is the output: what a supplier of each type actually receives. Read the third column as carefully as the second: what is **absent** from a flowdown, and why, is the part people get wrong."),
    TABLE(["Work type","What is imposed","What is absent, and why"],[
      ["Build-to-print","Work only to current released data. Identification and marking. The part traceability record. Both reconciliation flowdowns: method and report. Variance requests before delivery. First article inspection. Status accounting tailored to as-built records. Process change notification where critical or special processes are identified in the data package","**No change proposals**: the supplier holds no design authority, so changes arise from company action or surface as variances. **No interface obligations**: the interfaces are defined in the data package they were given. **No CM plan** in most cases; the reconciliation method is imposed standalone instead"],
      ["Source-controlled design and build","Nearly everything. A tailored CM plan, or a CM section within the quality plan. Change proposals for anything touching the baseline, form-fit-function-interface, qualification or company-controlled documentation. Variances. Identification, traceability, both reconciliation flowdowns, status accounting, engineering release discipline, interface participation, first article. Software CM **where embedded code exists**","Little. This is the type where the split of authority is the difficulty: they design the internals, so change control is real, but the characteristics and the interfaces are yours, so change proposals come to you"],
      ["Design agent","Change proposals and release discipline above all: the technical data package **is** the product, so how they release and revise it is the thing being bought. Interfaces. Status accounting over the developmental configuration. Support for CM process audits","**No traceability record, no reconciliation, no first article**: they build nothing, so there is no as-built configuration at their end and no delivered unit to trace"],
      ["Full CI development","The full set, as written: a full CM plan, change and variance control, identification and traceability, both reconciliation flowdowns, interfaces, release, status accounting, first article, and software CM where deliverable software or embedded code exists","Nothing of substance. This is the heaviest flowdown: the supplier holds design authority at its level and builds, so both of the two questions point at them"]
    ]),
    S("The absences are derived, not negotiated.",
      "Every blank in a flowdown traces back to one of the two questions. If you cannot say which question produced an absence, you have not derived the set: you have copied one."),
    C("The one that catches people",[
      "A build-to-print supplier cannot propose changes, which sounds like less risk and is often read as less flowdown. It is not. It means every departure they encounter has only two honest exits: a variance request before delivery, or a change raised through your company, and if neither is imposed clearly, the third exit is the one you find in the hardware later.",
      "**Imposing less on a supplier with no design authority is exactly when the variance discipline matters most.**"
    ])
  ], check:{
    q:"Why does a design agent receive no part traceability record requirement and no reconciliation report requirement?",
    o:["Because those requirements belong to the quality system rather than to CM",
       "Because the deliverable is data, and the company performs the build: there is no as-built configuration at the supplier to trace or reconcile",
       "Because design agents are typically small firms and the flowdown is proportioned to size",
       "Because those requirements are imposed on the company\u2019s own manufacturing organization instead"],
    a:1,
    why:"Who performs the build decides whether the traceability and reconciliation apparatus applies. Nothing is manufactured at a design agent, so there is no physical article to serialize and no as-built to compare against released design. What they do get is the discipline that fits what they produce: release control, change proposals, and status accounting over the developmental configuration."
  }},

  {id:"M2-10", title:"What each work type gets: the specialized types", body:[
    P("Four types where the flowdown is narrow. Narrow is not the same as light, in each case one or two requirements carry nearly all the weight, and missing them is what goes wrong."),
    TABLE(["Work type","What carries the weight","Notes"],[
      ["Catalog item","**Change and discontinuance notification.** Notice of any product change or discontinuance, with effectivity, last-time-buy terms and alternates data, within the agreed notice period. Your company evaluates the impact through its own change process","Identification and traceability are tailored to what a vendor item can carry: vendor part identification, media and version marking, and pass-through of vendor life or safety data where the catalog item carries it. A vendor nonconformance is normally handled by receiving and withhold, with a variance where a company drawing is invoked"],
      ["Software and firmware development","**Software CM in full:** version identification, developmental library control, a version description per release, and build reproducibility records: compiler, version, settings, build procedure and library and media identification, sufficient to rebuild the delivered load","Usually combined with source-controlled or full-development work rather than standing alone. When it is combined and nobody records the second work type, this whole column silently disappears from the statement of work"],
      ["Repair and overhaul","**Retention of unit identifiers and consumed life through part-number changes**, plus retrofit incorporation records. Reconciliation is as-maintained against approved configuration rather than as-built against released design","Change control covers changes to approved repair schemes. First article applies to the first article of a repair where required. The traceability record is updated through repair and survives overhaul: the life consumed field keeps counting"],
      ["Special process services","**Process change notification**, and working only to the current released process specification. No change to a frozen or approved process, planning, facility or tooling without notice and approval","There is no item design and no as-built configuration, so nearly everything else falls away. The single requirement that remains is the one that protects every part that has ever passed through that process"]
    ]),
    S("On a special process, one requirement stands between you and a fleet-wide question.",
      "If a heat-treat house changes its cycle without notice, the question is not whether this delivery conforms. It is which units, over what period, were processed under a condition nobody assessed, and if the notification requirement was never imposed, nobody can bound the answer."),
    P("Two of these four types are the ones most often missed at classification. A hardware procurement that quietly acquires firmware loses the entire software column. A procurement that includes a special process performed in-house is frequently classified only as the hardware work. That drops the notification requirement on the process that was hardest to qualify.")
  ], check:{
    q:"A plating vendor processes parts you supply, to your process specification. They change their bath chemistry without telling anyone; the change is discovered four months later. What was the requirement that should have prevented this, and why does its absence matter beyond this delivery?",
    o:["First article inspection: the change would have been caught on the next first article",
       "Process change notification: without it, nobody can bound which units over what period were processed under an unassessed condition",
       "The reconciliation report: the delta would have appeared in it",
       "Status accounting: the process revision would have been recorded"],
    a:1,
    why:"Special process work produces no as-built configuration to reconcile and no item design to control, so the notification requirement is carrying almost the whole flowdown on its own. Its absence is not a missed record: it is the loss of the ability to scope an investigation across every unit processed since the change."
  }},

  {id:"M2-11", title:"The deliverables, and what each must contain", body:[
    P("A requirement is cited with its deliverable or it is not cited. Here is what each deliverable definition actually fixes, and each one answers the same three questions: **what is in it, when it arrives, and what triggers it.**"),
    TABLE(["Deliverable","Content","When"],[
      ["Sub-supplier CM plan","How the supplier implements the flowed requirements: organization, change control, release, status accounting, identification, and flowdown to their own sub-tiers","Once plus revisions; approved before the work it governs begins"],
      ["Reconciliation process documentation","Data sources, comparison method, delta disposition, frequency, and the records the method produces","Once plus revisions; with the plan, or standalone where there is no plan"],
      ["Reconciliation report","As-built against the released design revision; open deltas with disposition status; changes incorporated with effectivity; expressed in traceability-record identifiers","Per delivery or lot"],
      ["Part traceability record","Per unit or lot: serial numbers; lot and batch numbers; life-limited designation **with the assigned limit and the life consumed at delivery**; safety-critical designation; special handling designations; traceability to the next higher assembly","Per delivery"],
      ["Change proposal package","The change definition; the need for it; full impact data; a summary of testing validating any new concept or technology; and a revision notice for every affected document","Event-driven"],
      ["Variance request","The departure described; affected units and lots by identifier; classification; cause; corrective action; and recurrence status","Event-driven, before delivery"],
      ["Process change notification","Advance notice of any change to a frozen or approved process, planning, facility or tooling identified as critical, with no implementation before approval","Event-driven, within the agreed notice period"],
      ["Status accounting report","Status of configuration documentation, changes and variances by item identifier; current and historical","Periodic, per the agreed terms"],
      ["Software version description and build records","Version identification and contents; changes since the prior version; compiler, compiler version and settings; a build procedure sufficient to reproduce the build; library and media identification","Per software release"],
      ["Audit plan and agenda, data package, minutes and closure","Scoped to the supplier\u2019s role. Minutes carry the required content and the action items, and are delivered within the agreed period after the audit","Triggered by audit designation"],
      ["Change or discontinuance notice","For a vendor item: notice of product change or discontinuance with effectivity, last-time-buy terms and alternates data","Event-driven, per the agreed notice period"],
      ["First article inspection report","Per the applicable standard or an agreed equivalent; re-accomplished on process, source or tooling change","First article, plus its triggers"]
    ]),
    S("Content, frequency or trigger, and submittal terms. A deliverable definition missing any one of the three is not enforceable at receipt.",
      "\u201cSubmit a traceability record\u201d gives you nothing to reject. \u201cPer delivery, containing life consumed at delivery for life-limited items\u201d gives you a blank field you can point at.")
  ], check:{
    q:"A statement of work requires the supplier to \u201cmaintain configuration records and make them available on request.\u201d What is wrong with it as a cited requirement?",
    o:["Nothing: it imposes the obligation clearly",
       "It names no data deliverable with content, frequency and submittal terms, so there is nothing to review at receipt and nothing to find missing",
       "It should have been imposed as a tailored requirement rather than as written",
       "It duplicates the reconciliation report requirement"],
    a:1,
    why:"An obligation with no deliverable behind it produces nothing on a schedule and nothing to score. \u201cAvailable on request\u201d also inverts the status accounting test: records reconstructed on request rather than maintained is a named failure signal, and this wording invites exactly that."
  }},

  {id:"M2-11b", title:"What each work type actually owes", body:[
    P("The requirement families tell you what kind of obligation applies. The deliverable definitions tell you what each submittal contains. Neither one tells you what a particular supplier owes you. That is what this section does, and it is the thing you will actually write into a statement of work."),
    P("Read the block for each work type you assigned. Where a procurement carries more than one type, take the union of the blocks. Where two blocks disagree on the same deliverable, the more demanding one governs."),
    C("WT01 build-to-print",[
      "Required: reconciliation process documentation, reconciliation report per delivery or lot, part traceability record, variance requests before delivery, sub-tier product data where the supplier has sub-tiers.",
      "Conditional: first article inspection, process change notification where critical or special processes are identified, physical audit support if the item is designated for audit.",
      "Tailored: status accounting as as-built records only, CM point of contact through the quality function.",
      "Not imposed: CM plan, change proposals, release records. The supplier holds no design authority, so there is nothing to change and nothing to release."
    ]),
    C("WT02 source-controlled design and build",[
      "Required: CM plan (tailored form acceptable), both reconciliation flowdowns, part traceability record, change proposals, variance requests, status accounting, release records, sub-tier data, CM point of contact.",
      "Conditional: software CM if there is embedded code, first article, interface obligations only if a boundary is allocated to them, both audits if the item is designated.",
      "This is the second heaviest set. Design authority is split, and the supplier builds, so nearly everything applies."
    ]),
    C("WT03 design agent",[
      "Required: CM plan, change proposals, status accounting, release records, CM point of contact.",
      "Conditional: interface obligations where a boundary is allocated, functional audit data support if designated.",
      "Not imposed: reconciliation, part traceability, first article, physical audit. The supplier builds nothing, so there is no as-built to reconcile and no article to examine.",
      "The release record is the important one here. The data package is the product, so release discipline is the thing you are buying."
    ]),
    C("WT04 full CI design and build",[
      "Required: everything WT02 requires, plus CI identification within their own scope.",
      "This is the heaviest set in the taxonomy. Both questions point at the supplier, so both families of requirement apply in full."
    ]),
    C("WT05 vendor item, commercial or catalog",[
      "Required: vendor change and discontinuance notice.",
      "Tailored: variance requests, part traceability pass-through, software version data where the item contains software.",
      "Not imposed: everything else. You do not hold the design, so notification is the only control available to you.",
      "Do not read the short list as a light obligation. That single notice is nearly the whole flowdown for this type, and an end-of-life you learn about from a receiving inspection rather than from the vendor is a serious failure."
    ]),
    C("WT06 software or firmware development",[
      "Required: CM plan, software version description and build records, change proposals, status accounting, release records, reconciliation, CM point of contact.",
      "Conditional: process change notification where the build environment is baselined for reproducibility, software functional audit and witnessed build if designated.",
      "Not imposed: first article inspection. There is no first article of a compile."
    ]),
    C("WT07 repair and overhaul",[
      "Required: reconciliation process and report, part traceability record with life retention, variance requests, change embodiment and effectivity records, sub-tier data, CM point of contact.",
      "Conditional: software CM where the repair scheme includes a load, first article of the repair scheme, process change notification.",
      "The effectivity record matters most here. Retrofit incorporation is where this type carries an obligation that most others do not."
    ]),
    C("WT08 special process services",[
      "Required: process change notification.",
      "Tailored: variance requests, support for CM process audits, CM point of contact through the notifying official.",
      "Not imposed: everything item-related. There is no item design and no delivered item, so identification, traceability, and reconciliation have nothing to attach to.",
      "Like WT05, the short list is not a light one. The process change notice carries almost the entire flowdown."
    ]),
    C("WT09 installation build to company-provisioned materiel",[
      "Required: CM plan, both reconciliation flowdowns with the report per end item, part traceability with roll-up to the end-item identifier, variance requests, status accounting, provisioned materiel discrepancy reports, change embodiment and effectivity records, the as-delivered configuration statement, sub-tier data, CM point of contact.",
      "Conditional: software CM where the line loads software, first article of installation, hosting the audit if the end item is designated.",
      "Tailored: change proposals as requests only, release of installation planning, interface verification at installation.",
      "Two of these exist for no other type. The provisioned materiel report catches a bad kit before it is installed rather than after. The as-delivered configuration statement is the only place open work at delivery gets documented."
    ]),
    P("One habit to build. When you finish a derivation, say out loud which work types get nothing from a requirement family, and say which of the two questions produced that absence. If you cannot answer, you are spreading requirements rather than deriving them.")
  ], check:{
    q:"You are writing the statement of work for a design agent. Which of these should not appear in it?",
    o:["A release record with each data delivery","A CM plan covering change control and status accounting","A reconciliation report per delivery","Interface data, if a boundary is allocated to them"],
    a:2,
    why:"A reconciliation report compares as-built against released design. A design agent builds nothing, so there is no as-built and nothing to compare. The absence comes from the second question: who performs the build. The other three all apply, and the release record is the most important of them because the data package is the deliverable."
  }},

  {id:"M2-11c", title:"Deriving the deliverable set: practice", body:[
    P("Three facts decide which deliverables a supplier owes. Work through them in this order every time."),
    STEPS([
      {h:"1. What work type or types apply?",b:"This gives the base set. Where more than one type applies, take the union, and where two disagree on the same deliverable the more demanding one governs."},
      {h:"2. Is the item the supplier delivers a configuration item?",b:"If it is not a CI, it is controlled inside a parent CI\u2019s documentation. No audit deliverable can ever become due for it, because audits are audits of configuration items. Everything else still applies. Reconciliation, traceability, and variance control do not depend on CI status."},
      {h:"3. If it is a CI, has it been designated for audit?",b:"If yes, the three audit deliverables are due and scheduled. If no, they are cited as triggered items under the standing conditional clause and become due only if designation arrives. If the item is not a CI at all, there is nothing to cite."}
    ]),
    C("The order matters",[
      "Skipping step 2 is how audit deliverables end up cited against a bracket that was never a configuration item.",
      "Skipping step 3 is how a supplier gets billed for audit preparation on an item nobody ever designated.",
      "Doing step 3 before step 1 is how a build-to-print supplier gets asked to conduct a functional audit they have no documentation to conduct against."
    ])
  ], check:{
    q:"A supplier machines a fitting to your released drawing. The fitting is controlled inside its parent assembly\u2019s drawing package and is not a configuration item in its own right. Which deliverables do you cite?",
    o:["The full WT01 set including the audit data package, since the parent assembly is designated",
       "Reconciliation process documentation and report, part traceability record, variance requests, and first article where the condition applies. No audit deliverables, because the item is not a CI",
       "Only a part traceability record, since a non-CI carries no other obligation",
       "Nothing, because CM requirements apply only to configuration items"],
    a:1,
    why:"CI status decides whether audit deliverables are even possible, and this item is not a CI, so they are not. It decides almost nothing else. Reconciliation, traceability, variance control, and first article all attach to the fact that the supplier is building to your released data, not to whether the thing they build is a CI. Option 3 is the common overcorrection, and it strips out the requirements that catch configuration drift."
  }},

  {id:"M2-11d", title:"Deriving the deliverable set: four worked cases", body:[
    P("Each case gives the three facts. Decide the deliverable set before reading the answer."),
    TABLE(["The procurement","The three facts","The deliverable set"],[
      ["A supplier designs and builds a hydraulic valve under your source control drawing. The valve is a CI. The designation assessment found two risk factors.",
       "WT02. It is a CI. It is designated for audit.",
       "CM plan; reconciliation process documentation and report; part traceability record; change proposals; variance requests; status accounting; release records; first article; CM point of contact; sub-tier data if they have sub-tiers. Plus all three audit deliverables, due and scheduled, because the supplier conducts both audits."],
      ["The same valve, same supplier, but the designation assessment found one risk factor and recorded it.",
       "WT02. It is a CI. It is not designated.",
       "Exactly the same set, minus the audit deliverables becoming due. The audit deliverables are still cited, as triggered items under the standing conditional clause. Nothing else changes. This is the row that shows designation touching only the audit line."],
      ["A supplier writes the operational flight program for a computer another supplier builds. The software is a CI by rule. It is designated.",
       "WT06. It is a CI. It is designated.",
       "CM plan; software version description and build records; change proposals; status accounting; release records; reconciliation; CM point of contact. Plus the audit deliverables, because they conduct the software functional audit and the witnessed build. No first article, because there is no first article of a compile."],
      ["A plating house anodizes parts to your process specification. Some of those parts end up inside a designated CI.",
       "WT08. They deliver no item. The CI is designated.",
       "Process change notification. Variance requests and CM process audit support, tailored. A CM point of contact, tailored. **No audit deliverables at all,** even though a designated CI is downstream. There is no item configuration at their facility for an audit to examine, and their work type carries no audit role."]
    ]),
    S("The second and fourth rows are the two that get argued about.",
      "The second row shows that designation changes one line of the flowdown and nothing else. The fourth row shows that a designated CI downstream does not reach back and create an audit obligation at a supplier whose work type has no audit role.")
  ], check:{
    q:"Your company procures a machined housing from a build-to-print supplier. The housing is a CI and it has been designated for both audits. Which audit deliverables does the supplier owe, and which do they not?",
    o:["All three audit deliverables for both audits, since the CI is designated",
       "The audit data package for the physical audit only. No audit plan and no minutes, because they support rather than conduct, and no functional audit involvement at all",
       "No audit deliverables, because build-to-print suppliers hold no design authority",
       "The audit plan and data package, but not the minutes"],
    a:1,
    why:"Designation makes the audits happen. Work type scopes what this supplier owes. A build-to-print supplier supports the physical audit, so they provide the data package for it, along with access and the manufacturing instructions actually used. The audit plan and the minutes belong to whoever conducts, which is your company. And they have no functional audit role at all, because they hold no functional or allocated documentation to audit against."
  }},

  {id:"M2-12", title:"What a configuration audit is", body:[
    P("Two audits. They are asked at different moments, about different questions, and almost everything else about them follows from knowing which question is on the table."),
    CARDS([
      {h:"Functional configuration audit", b:"**Does the item do what it was required to do, and can you prove it?** The formal audit that verifies the item\u2019s tested performance against its approved functional and allocated documentation. It also confirms that specifications and interfaces are accurately and adequately defined, and that the change control system genuinely controls the processing and release of documentation. Prerequisite: the Acquirer has already approved the functional and allocated baselines for the item."},
      {h:"Physical configuration audit", b:"**Is the thing you actually built the thing the documentation describes?** The formal examination of the as-built configuration of a validated item, or the as-coded configuration for software, against its product documentation, verifying that the documentation is a clear, complete and accurate representation of what physically exists. Prerequisite: the functional audit completed successfully, or running concurrently."}
    ],2),
    P("The order is not a convention. The physical audit examines a **validated** item, and validation is what the functional audit produces, so a physical audit cannot begin before its functional audit is complete or concurrent. The two may be run as one event where there is high confidence that both sets of requirements will be met within the same timeline."),
    S("Successful completion of the physical audit is the event that establishes the product baseline.",
      "Until it passes, there is no product baseline to change against. After it passes, every subsequent change is processed by formal engineering change action. Skipping it does not save an activity: it leaves the item with no reference point for everything measured against it afterwards."),
    P("Audits proceed bottom-up: lower-level items first, then subsystems, then the system level. Two variations are worth knowing by name, because you will hear both:"),
    CARDS([
      {h:"Incremental, and the capstone", b:"Audits conducted bottom-up in increments, concluding with a final system-level audit that confirms all functional, allocated and product baseline requirements are satisfied. Open action items from the lower-level audits are carried into the system-level minutes: they do not evaporate on the way up."},
      {h:"Delta audit", b:"A follow-on audit covering only the portion left open at the original, typically verification that could not be completed in time. Its results are added to, or supersede, the original minutes. This is the mechanism that lets an audit proceed honestly with known gaps instead of pretending they closed."}
    ],2),
    C("Audits do not do the verification. They test whether the verification works",[
      "Configuration verification is continuous and embedded: functional verification through the test program, physical verification through inspection and process control on every unit, and as-designed-to-as-built reconciliation run at scale across the data for all items.",
      "An audit is a discrete validation, on a designated item and a representative unit. Its purpose is to confirm that continuous machinery is working, not to replace it. It is not the intent of an audit to verify every change individually.",
      "**Which is why \u201cwe will catch it at the audit\u201d is never a plan, and why \u201cnot designated for audit\u201d never means \u201cno verification.\u201d**"
    ],"teal")
  ], check:{
    q:"Why can a physical configuration audit not begin before its functional audit is complete or running concurrently?",
    o:["Because contracts conventionally schedule them in that order",
       "Because the physical audit examines the as-built configuration of a **validated** item, and validation is what the functional audit produces",
       "Because the Acquirer will not attend two audits at once",
       "It can: the two are independent examinations and either may go first"],
    a:1,
    why:"The physical audit asks whether the documentation accurately describes what was built. That question only means something once the item has been shown to meet its requirements: otherwise you are confirming that the paperwork faithfully describes something nobody has established works."
  }},

  {id:"M2-13", title:"Inside a functional configuration audit", body:[
    P("At bottom the functional audit is one question, asked over and over: **for this requirement, where is the evidence it was met?**"),
    C("Before that question can be asked: the requirements allocation matrix",[ "A requirements allocation matrix states which system requirements are allocated to this item. It is what the item is accountable for.", "It is not the same as the traceability matrix. The allocation matrix answers what this item must satisfy. The traceability matrix answers how each of those was verified, and with what result.", "The audit needs both, and the traceability matrix is checked against the allocation matrix rather than against itself. Without that check, the audit can only verify the requirements somebody chose to put on a list.", "The worst finding a functional audit can produce is a requirement nobody verified, because nobody recorded that it was allocated here. That finding is only reachable if the allocation matrix is in the room." ]),
    STEPS([
      {h:"The opening briefing", b:"The design team briefs each audited item: an overview, test results and findings, requirements not met with proposed remedies, changes incorporated, tested and proposed, and the overall test effort including its problem areas. Opening with what did not work is part of the format, not a failure of it."},
      {h:"The documentation flow, requirement by requirement", b:"For each requirement, or for an agreed sample, walk the chain: the baseline requirement in the specification, to the test plan, to the test procedure, to the test report. Where a requirement is not verified by test, the analysis, inspection or demonstration record stands in the same position. Interface requirements are verified through this same flow."},
      {h:"Account for what has not been done", b:"Tests accomplished; tests performed without recorded detail data; tests not yet performed, each with the plan to accomplish it; and the analyses or simulations covering requirements not fully verifiable by test. An honest account of the gaps is an audit output in its own right."},
      {h:"Changes and prior findings", b:"Review all approved changes, with an account of those incorporated, those tested, and those proposed. Examine the earlier design review minutes to confirm their findings were incorporated and action items closed, and review lower-level audit minutes and their open items."}
    ],"tl"),
    P("Software is audited on the same logic, with more surface. Five things get examined:"),
    L(["Database characteristics, storage allocation, and timing and sequencing, against requirements.",
       "Every document describing the product, checked for format and completeness.",
       "Developmental configuration change records.",
       "The listing of every developmental and non-developmental version held in the library.",
       "The findings of internal CM and software quality audits."]),
    P(" For software the standard is stated flatly. **Every requirement has a related test step, and that test passes.**"),
    P("One deliverable carries the whole audit: a traceability matrix covering all requirements, cross-referencing the test plans, procedures, test programs and reports, and identifying each known deficiency by its report number. It is provided before the audit and becomes part of the minutes. It is the artifact that makes the audit checkable by someone who was not in the room."),
    S("Where sampling is agreed, safety-critical requirements and those verifying hazard controls are included in the sample, never sampled out.",
      "Sampling is a concession to volume, not a lottery that safety requirements are allowed to lose. A sample that quietly excludes the requirements that matter most has inverted the purpose of sampling."),
    P("Where verification genuinely depends on integrated system testing that has not happened yet, partial completion may be acknowledged. The open requirements become action items. A delta audit closes them once the outstanding testing passes.")
  ], check:{
    q:"A specification carries 1,900 requirements and the audit is agreed to proceed on a sample. How are the requirements that verify hazard controls treated?",
    o:["Sampled on the same basis as every other requirement, so the sample stays statistically valid",
       "Deferred to a delta audit, since safety verification usually completes late",
       "Included in the sample as a matter of rule: they are never sampled out",
       "Excluded, because System Safety verifies them separately"],
    a:2,
    why:"Sampling exists to make a large requirement set auditable in the time available. It is not a random draw, and the requirements whose failure hurts most are the ones the audit least affords to miss. They go in the sample by rule, and the remaining sample is drawn around them."
  }},

  {id:"M2-14", title:"Inside a physical configuration audit", body:[
    P("The physical audit takes one unit. It is an early production-representative unit, **agreed with the Acquirer** rather than offered up by whoever is being audited, and the audit asks whether the documentation describes it. The audit is conducted jointly at a time and place both parties agree on, the Acquirer co-chairs it, and **the Acquirer co-chair identifies the drawing sample** and the items to be examined."),
    C("What the audit works from, and what it is really testing",[ "The primary input is the as-designed to as-built reconciliation report for that specific unit, including its nonconformance records and their dispositions.", "The audit does not perform the reconciliation. The reconciliation already ran, at scale, through the status accounting system. The audit checks whether that machinery produced the right answer for this unit.", "That is why a delta the audit finds that the report did not is a finding against the reconciliation process, not just against the unit. One unit was wrong. The process that was supposed to catch it was also wrong.", "A physical audit convened without the reconciliation report has nothing to verify. It becomes an inspection of the article, which is not what a physical audit is for." ]),
    C("Three conditions that must be true before the audit convenes",[ "**No open work orders** against the unit. Every one is complete and closed.", "**No open nonconformance records.** Every one has been dispositioned by the required authority.", "**No open dispositions.** Every disposition has been carried out and verified. This is the one people miss. A unit can show every nonconformance dispositioned and still have rework sitting in the queue.", "Until all three are true, the as-built configuration is not final. Any reconciliation drawn from it is provisional, and the audit would be testing a comparison whose right-hand side can still move. Auditing anyway produces a clean result against a configuration the unit does not yet have.", "Any one of the three open is a stop condition. The audit is rescheduled. It is not run with the item carried as an action." ]),
    L(["**Reconcile the item to its documentation:** item, to drawings, to associated lists, to the parts list. Effectivity and next assembly. The accuracy of notes and references. The released documents those references point at.",
       "**Review a representative sample of drawings and model data with the matching manufacturing instructions**, confirming the instructions reflect the design detail and incorporate the authorized changes.",
       "**Confirm compatibility with the approved parts selection list, and examine the item to confirm the proper parts are actually installed.** Not the records about the parts: the parts.",
       "**Verify approved changes were incorporated**, and reconcile and correct any delta between as-designed and as-built data.",
       "**Identify the differences between this unit and the unit used at the functional audit**, and certify or demonstrate that those differences do not degrade functional characteristics.",
       "**Review shortage lists and undocumented design changes**, confirming no unapproved change exists in the documentation and every approved change is present in the hardware."]),
    P("For software, the audit examines the as-coded configuration against its documentation: source listings compared to the released documentation, and the version description verified, including the compiler, the compiler version, and the build settings. Then the part that surprises people:"),
    S("The build is produced during the audit, installed on the target, verified against its version description, and witnessed.",
      "Every software update listed on the build\u2019s problem reports is confirmed applied. This is the moment the toolchain identification pays for itself or fails in public: if the compiler version, settings and library state were never identified, the build cannot be reproduced and the audit cannot be satisfied."),
    P("For commercial software, the check is narrower but real: that the documentation supports the versions actually delivered on the media, and that identification and marking of every deliverable medium are adequate."),
    C("Why the examination is physical",[
      "A record can agree perfectly with the design while the hardware does not. That gap is the entire reason a physical audit exists, and it is not hypothetical: a door plug delivered with missing bolts, and tools and debris repeatedly found inside delivered aircraft, are precisely the class of non-conformance this examination is built to catch.",
      "**A parts list that matches the drawing proves the parts list. Only looking at the item proves the item.**"
    ])
  ], check:{
    q:"Why does the physical audit include a physical examination of installed parts, rather than a review of the parts records against the approved parts list?",
    o:["Because the records are frequently unavailable at the audit",
       "Because the Acquirer requires a demonstration of access to the facility",
       "Because the records can agree with the design while the hardware does not, and that divergence is the thing the audit exists to find",
       "Because the parts list is not a controlled document"],
    a:2,
    why:"Records comparing correctly to records tells you the paperwork is self-consistent. The failure mode that matters is as-built diverging from as-documented, and no amount of reading will surface it. Somebody has to look at the item."
  }},

  {id:"M2-15", title:"Findings, closure, and certification", body:[
    P("Nothing found at an audit exists until it is written down. Every discrepancy becomes an action item defining four things: the issue, the agreed closure plan, the responsible person, and the agreed suspense date. There is no such thing as a verbal finding."),
    TABLE(["Classification","What it covers"],[
      ["Major","Production definition documentation or design data incorrect or incomplete; a systematic breakdown of process control; clear non-adherence to workmanship standards; hardware or software not included in the build process; non-adherence to specification, interface or statement-of-work requirements; first article data missing or incomplete"],
      ["Minor","Non-systematic errors: a typographical mistake in production definition documentation, in a process control record, or in workmanship standards documentation"],
      ["Observation","General queries and process improvement recommendations. Anything meeting neither the major nor the minor criteria. Simple in nature, and not a cause for delay or for stopping production"]
    ]),
    S("The line between major and minor is systematic versus not, not how many instances you found.",
      "One typo in one record is minor. The same error across eleven records because the process producing them is broken is major, and it would still be major if it had appeared only once."),
    S("The third class exists so a real observation does not get inflated into a minor finding.",
      "It also gives an auditor somewhere to record what they noticed. An audit with only two boxes pushes every general query into one of them, and the program then spends closure effort on something that was never a discrepancy."),
    P("The minutes are the audit\u2019s durable record. Their required content is specific:"),
    L(["The audited item.",
       "The decisions and the proceedings.",
       "The attendees.",
       "The action items.",
       "The complete list of documents, **with their revision level at the time of audit**.",
       "The complete list of requirements audited.",
       "Identification of everything examined, by name, specification number, product identifiers, serial numbers, part numbers and enterprise code."]),
    STEPS([
      {h:"Publish", b:"Finalized minutes delivered within sixty days of audit completion, or per contract."},
      {h:"Close", b:"Every action item tracked to closure, with the corrective action documentation delivered for review. A summary report reflects all action items and discrepancies; the detailed final report issues only after the Acquirer has verified the completed action items."},
      {h:"Certify", b:"Joint certification signatures from the audit lead, the program manager, and Acquirer representatives, recording the result as **complete and successful** where nothing is open, or **conditional** where resolutions are agreed but tasks are not yet finished."},
      {h:"Disposition", b:"The Acquirer dispositions the audit as **approval** where all action items are satisfactorily completed, **contingent approval** pending their completion, or **disapproval** where the result is seriously inadequate."},
      {h:"Record", b:"Scheduled and actual audit dates, accomplishments and results recorded in status accounting, per item audited."}
    ]),
    P("Note where the product baseline sits in that sequence. It is established by the Acquirer **after** successful completion of the physical audit and approval of the product specification, not on the day the audit ends.")
  ], check:{
    q:"A drawing reviewed at audit carries a superseded note. Investigation finds the same superseded note on eleven drawings, because change notices are not propagating through the release process. Major or minor?",
    o:["Minor: a note error is a documentation typo by definition",
       "Minor, but raised to major if it recurs at the next audit",
       "Major: it is a systematic breakdown of process control, and the count of affected drawings is not what makes it so",
       "Neither: it is a change management issue rather than an audit finding"],
    a:2,
    why:"The classification turns on systematic versus non-systematic, not on volume. A release process that fails to propagate change notices produces incorrect production definition documentation on purpose, so to speak, and would be a major finding on the strength of the mechanism even if it had surfaced on one drawing only."
  }},

  {id:"M2-16", title:"Audit designation: how a CI earns an audit", body:[
    P("Audit obligations hinge on whether a CI is designated for audit. Designation is not a matter of taste, and it is not decided by the supplier\u2019s work type: it is assessed per CI, and it arrives from two directions."),
    CARDS([
      {h:"Contract designation", b:"The CI is named in the contract, the statement of work, or the CM plan as requiring audit. This includes **every Acquirer-controlled CI whose product baseline the Acquirer will establish**: because the physical audit is the event that establishes it. There is no baseline without the audit."},
      {h:"Risk-based designation", b:"For every CI not designated by contract, the program assesses whether an audit is warranted, at initial audit planning, at each CM plan revision, and on any trigger event. Nothing is left undesignated merely because nobody named it."}
    ],2),
    P("A contract designation does not end the assessment. The risk factors below are still walked, because they can **expand** what the audit has to cover: adding a delta audit of open scope, or pulling an increment earlier than planned."),
    P("The risk-based assessment has a deliberate shape. It is not a scoring exercise where everything trades against everything:"),
    STEPS([
      {h:"Safety criteria: presumptive designation", b:"A CI that implements or hosts a hazard risk control, that was selected under the safety criterion, whose credible failure consequence sits in the top severity band, that is safety-critical software or firmware in a safety-critical device, or that is a single point of failure for a safety-related function, is **designated by presumption.** Omission requires System Safety concurrence in writing. CM cannot make that call alone."},
      {h:"Risk factors, two or more designates", b:"New or novel design rather than proven heritage; substantive design change since the last audit; new or changed manufacturing source, process, facility or tooling; a new or changed sub-tier supplier; a history of escapes, nonconformances or work performed not to approved data; status accounting reconciliation health showing delta aging, unincorporated-change backlog or effectivity discrepancies; and never having been audited, or a prior audit with open actions. **Two or more designates.** One is recorded and monitored."},
      {h:"Triggers: the assessment re-runs", b:"A substantive design, process, facility, tooling or supplier change; a new quality escape or safety event traceable to the CI; a reconciliation anomaly; a hazard log revision adding a risk control to the CI; a CM plan revision. Designation is a standing question, not an award-day answer."}
    ],"tl"),
    S("The assessment and its rationale are recorded for every CI evaluated: designated or not.",
      "The same principle as CI selection. A list of designated CIs shows an outcome. A record of what was assessed, and why it was not designated, gives the next assessment something to start from and gives a reviewer something to argue with."),
    P("Designation decides **whether** an audit happens to an item. The supplier\u2019s work type decides **what their part in it is**. They conduct the audit at their own facility for items they design and build. They support one with data, records and facility access where the design or the build sits with the company. Those are different obligations with different costs, and the next section is about buying both before you need them."),
    C("Ceremony may be tailored. Substance may not.",[
      "Where an audit is initiated internally rather than by the Acquirer, the **ceremony** may be simplified: an internal co-chair and internal certification in lieu of Acquirer participation. The **substance** is performed in full: the requirements-to-test reconciliation and its traceability matrix, the as-built examination with approved-parts verification, and the documented non-compliances.",
      "The distinction generalizes, and it is worth carrying into every tailoring conversation you will have. Simplifying the format of a record, or sampling rather than checking exhaustively, is ceremony. **Removing a verification because an automated system is asserted to prevent the failure is substance: that verification exists to test the assertion.**"
    ],"teal")
  ], check:{
    q:"A CI is not contractually designated and hosts no hazard risk control. The assessment finds exactly one risk factor: a new sub-tier supplier. What follows?",
    o:["Designate for audit: any risk factor is sufficient",
       "Nothing; with no safety criterion met and only one factor, the CI is out of scope until the contract says otherwise",
       "Record the factor and the rationale for not designating, and monitor it, two or more factors designate, and the assessment re-runs on trigger",
       "Refer the question to the Acquirer, who owns designation"],
    a:2,
    why:"One factor does not designate; two or more do. But \u201cnot designated\u201d is a recorded decision with a rationale, not a silence, and the assessment re-runs on trigger, so a second factor arriving later changes the answer without anyone having to remember to ask."
  }},

  {id:"M2-17", title:"What designation obliges: roles by work type", body:[
    P("Designation decides **whether** an item is audited. The supplier\u2019s work type decides **what their part in it is**: and the gap between conducting an audit and supporting one is the difference between a substantial obligation and a modest one. Both have to be bought in advance."),
    TABLE(["Work type","Role if the item is designated"],[
      ["WT01 build-to-print","**Supports** the physical audit on their build: facility access, as-built records, approved-parts evidence, and manufacturing instructions. They do not conduct: they hold no design authority and there is nothing at their end to audit against but the build"],
      ["WT02 source-controlled design and build","**Conducts** the item-level functional and physical audits at their own facility, substance in full"],
      ["WT03 design agent","**Data support:** the technical data package and the inputs to the requirements-to-test traceability matrix. There is no build at their end and no unit to examine"],
      ["WT04 full CI design and build","**Conducts** the item-level functional and physical audits at their facility, substance in full: the heaviest audit role, matching the heaviest flowdown"],
      ["WT05 vendor item, commercial or catalog","Generally not applicable"],
      ["WT06 software and firmware development","**Conducts** the software functional audit, and the witnessed build and installation verification against the version description: the live rebuild you met in the physical audit section"],
      ["WT07 repair and overhaul","Generally not applicable in its own right; their as-maintained records support audits of the parent item"],
      ["WT08 special process services","Not applicable: there is no item configuration to audit"],
      ["WT09 installation build","**Hosts** the end-item and system-level audit on its build. It provides the article, the facility, access including the installation zone, the zone closeout records, and the assembled evidence. Your company or the customer conducts, because the supplier holds no design authority"]
    ]),
    S("Mixed classification takes the most demanding role, exactly as it takes the most demanding cell.",
      "A supplier who designs and builds a unit **and** develops its embedded software conducts the hardware audits and the software audit and the witnessed build. That is a materially larger commitment than either alone, and it follows from a classification field."),
    P("When designation does arrive, three things become due, each scoped to that role: the audit plan and agenda; the audit data package; and afterwards the minutes with the action items tracked to closure. None of that is a surprise if the standing clause was written: you notify, and you set dates."),
    C("Preparation is a joint punch list, not a request",[
      "The preparation tracker is shared with the supplier and worked as one list. Each row is a required input: an entry criterion, a pre-audit submittal, or a data package item, with a provider, a due date derived from the audit date, and a status. Rows that do not apply to that item or that role are marked as such and **kept**, so the record shows they were considered rather than forgotten.",
      "**Entry criteria must all be complete before the audit convenes.** Readiness short of that on the day is a schedule conversation, not a footnote in the minutes, and holding that line is easier when the tracker has been visible to both sides for weeks."
    ],"teal")
  ], check:{
    q:"A build-to-print supplier manufactures a CI that has just been designated for a physical configuration audit. What is their role?",
    o:["Conduct the audit at their facility, since the article is built there",
       "Support it on their build: facility access, as-built records, approved-parts evidence and manufacturing instructions",
       "No role; the company conducts audits of items it designed",
       "Conduct the functional audit only, with the company conducting the physical audit"],
    a:1,
    why:"The article is theirs but the design is not, so there is nothing at their end to audit the design against: they hold no design authority and produce no design documentation. What they do hold is the build and the evidence about it, which is exactly what the physical audit needs from them. Conducting the audit is the role of suppliers who design what they build."
  }},

  {id:"M2-17b", title:"Two gates, not one: the mistake that runs in both directions", body:[
    P("This section exists because two teams commonly hold two opposite wrong beliefs, and each one is expensive."),
    CARDS([
      {h:"The audit team error", b:"Believing every configuration item gets a functional and physical audit. It does not. Being a CI means the item is managed separately, with its own specification, its own change control, and its own status accounting. Being audited is a second and much narrower decision. Most CIs are never formally audited."},
      {h:"The supplier CM error", b:"Believing that a supplier conducts an audit because of their work type. They do not. Work type never decides whether an audit happens. It decides only what the supplier\u2019s part in one would be, if an audit were to happen at all."}
    ],2),
    C("The rule, stated once",[
      "**Designation decides whether.** An audit happens only where the CI has been designated for audit by the audit designation assessment. No designation, no audit.",
      "**Work type decides what part.** If an audit does happen, the supplier\u2019s work type decides whether they conduct it, host it, support it, or provide data for it.",
      "**Both must be true.** Neither one alone produces an audit obligation. A designated CI built by a special process house produces no supplier audit role. A source-controlled supplier whose items are never designated conducts no audits, ever."
    ]),
    P("Read the table below across, not down. Every row is a real combination, and four of the six produce no supplier audit at all."),
    TABLE(["Is the CI designated for audit?","Supplier work type","What actually happens"],[
      ["No","WT02 source-controlled","**No audit.** The audit deliverables are never triggered. Everything else in the WT02 flowdown still applies in full: reconciliation, traceability, change control, first article. The standing conditional clause still goes into the statement of work, because designation can arrive later."],
      ["Yes","WT02 source-controlled","**Supplier conducts** the item-level functional and physical audits. The three audit deliverables become due."],
      ["Yes","WT01 build-to-print","**Supplier supports** the physical audit only. No functional audit role, because they hold no functional or allocated documentation to audit against."],
      ["Yes","WT09 installation build","**Supplier hosts.** Your company or the customer conducts."],
      ["Yes","WT08 special process","**No supplier audit role at all,** even though the CI is designated. There is no item configuration at their facility to audit."],
      ["No","WT05 vendor item","**Nothing.** No audit, and no audit role if there were one."]
    ]),
    S("The item does not even have to be a CI.",
      "A supplier may build a part that is controlled inside a parent CI\u2019s documentation and is not a CI in its own right. Audits are audits of configuration items. If the item is not a CI, no audit deliverable can ever become due for it, at any work type. The rest of the flowdown still applies, because reconciliation, traceability, and variance control do not depend on CI status."),
    C("Why both errors cost money",[
      "Believing every CI is audited produces audit plans, data packages, and travel for items that were never designated. It also devalues designation, because if everything is audited then nothing was selected.",
      "Believing work type triggers the audit produces two failures at once. Audit obligations get priced into subcontracts where no item will ever be designated. And where designation does arrive later on a supplier whose type has no audit role, somebody goes looking for an obligation that never existed.",
      "The honest position is narrower than either. Audits are rare, deliberate, and expensive, and that is the point of them."
    ])
  ], check:{
    q:"A supplier designs and builds a unit under your source control drawing. The unit is a configuration item. The audit designation assessment recorded one risk factor and did not designate it. What audit obligations belong in the statement of work?",
    o:["Full functional and physical audit obligations, because WT02 suppliers conduct audits",
       "None, because the item is not designated",
       "A standing conditional audit clause, with the audit deliverables cited as triggered items that become due only if designation arrives",
       "Physical audit support only, since one risk factor was recorded"],
    a:2,
    why:"Designation decides whether, and this item is not designated, so no audit is due today. But one recorded risk factor means a second factor at any reassessment tips it into designation. The clause goes in now, while the condition is dormant and the supplier has a reason to price it reasonably. Adding it after designation arrives is a contract modification negotiated from the weakest position."
  }},

  {id:"M2-18", title:"Conditionals, and the standing audit clause", body:[
    P("Resolve each conditional against its stated condition and record the basis. Software CM requirements are conditional on deliverable software or embedded code; process-change notification on identified critical or special processes; first article requirements on the applicable quality system criteria. Re-resolve any conditional when its condition changes."),
    P("Configuration audit obligations are conditional on the **CI\u2019s audit designation**: not on work type. Work type determines the supplier\u2019s *role* if the item is or becomes designated: conduct the audit at their facility, or support one with data and access."),
    S("Designation can arrive after award. Awarding work to a new sub-supplier re-runs the designation assessment. It also adds one risk factor to that assessment.",
      "One risk factor on its own does not designate the item. Designation follows where that factor combines with another one. So the award can still be the event that leads to designation later. The clause has to already be in the subcontract when that happens."),
    CARDS([
      {h:"Standing conditional clause", b:"The clause takes effect on designation; triggered deliverables are scheduled. You notify the supplier and set dates. No commercial negotiation: the obligation was already bought. Cost: administrative."},
      {h:"Decided once, at award", b:"You have no clause when designation arrives. Obtaining audit support requires a contract modification, negotiated after the supplier holds the work and knows you need the access. Cost: commercial, schedule, or a designated CI you cannot audit."}
    ],2),
    C("The trap to name out loud",[
      "**\u201cNo audit designation\u201d does not mean \u201cno verification flowdown.\u201d** Never-designated CIs still carry the at-scale machinery: reconciliation, status accounting, part traceability and first article inspection, which apply by work type regardless of designation.",
      "Audit is a sampling event laid on top of continuous verification. Removing the sampling event does not remove the thing it samples."
    ])
  ], check:{
    q:"You are writing a statement of work for a supplier who will build a designated CI to print. At award, the CI is not designated for configuration audit. What do you cite?",
    o:["Nothing on audit; add it by modification if designation ever arrives",
       "Full audit conduct requirements, to be safe",
       "A standing conditional audit clause, with the audit deliverables cited as triggered items",
       "Audit requirements only if the Acquirer asks"],
    a:2,
    why:"Deciding audit applicability once, at award, converts every post-award designation into a contract modification negotiated from an unfavorable position. The standing clause costs nothing now and buys the obligation before you need it."
  }},

  {id:"M2-19", title:"Citing in the statement of work", body:[
    P("Each cited requirement identifies its data deliverable by reference to the deliverable definition: content, frequency or triggering event, and submittal terms. Beyond that, five things must be stated explicitly, because each is a known failure point."),
    STEPS([
