<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI Interface Register Builder</title>
<style>
:root{
  --ink:#1E262E; --ink-2:#2C3841; --slate:#5C6D78; --mute:#8998A2;
  --paper:#FFFFFF; --surface:#F4F6F7; --surface-2:#EDF0F1; --rule:#D6DCDF;
  --rust:#A8481F; --rust-soft:#F2E4DD; --rust-ink:#7E340F;
  --teal:#1F5F5B; --teal-soft:#DFEAE8;
  --amber:#9A6508; --amber-soft:#F6ECD8;
  --alert:#8E2F2F; --alert-soft:#F4E2E2;
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--surface);font-size:14px;line-height:1.5;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
.top{background:var(--ink);color:#fff;padding:11px 18px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.top b{font-family:var(--serif);font-size:16px}
.top span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#93A2AB}
.bar{background:var(--paper);border-bottom:1px solid var(--rule);padding:8px 18px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:4px;padding:7px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible,.lnk:focus-visible,.nav button:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.btn.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.pri:hover{background:var(--rust-ink)}
.btn.gh{background:transparent;color:var(--slate)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.sep{width:1px;height:22px;background:var(--rule);margin:0 4px}
#msg{font-size:12px;color:var(--slate);flex:1;min-width:160px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:3px;border:1px solid var(--rule);background:var(--surface-2);color:var(--slate);white-space:nowrap}
.chip.bad{background:var(--alert-soft);color:var(--alert);border-color:#E0BFBF}
.chip.hold{background:var(--amber-soft);color:var(--amber);border-color:#E4D3AF}
.chip.ok{background:var(--teal-soft);color:var(--teal);border-color:#BFD6D2}
button.chip{cursor:pointer}

.main{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr)}
.main.l-below{grid-template-columns:200px minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.main.l-below .pv{grid-column:1/-1}
.main.l-editor{grid-template-columns:200px minmax(0,1fr)}
.main.l-editor .pv{display:none}
.main.l-preview{grid-template-columns:minmax(0,1fr)}
.main.l-preview .nav,.main.l-preview .ed{display:none}
.nav{background:var(--paper);border-right:1px solid var(--rule);overflow:auto;padding:12px 0}
.nav .h{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);font-weight:700;padding:10px 16px 4px}
.nav button{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:none;text-align:left;padding:7px 16px;font-size:13px;color:var(--ink-2);border-left:3px solid transparent}
.nav button:hover{background:var(--surface)}
.nav button.on{background:var(--rust-soft);border-left-color:var(--rust);color:var(--rust-ink);font-weight:600}
.nav .n{font-family:var(--mono);font-size:10px;color:var(--mute)}
.nav .n.e{color:var(--alert);font-weight:700}
.ed{overflow:auto;padding:18px 22px 60px}
.pv{display:flex;flex-direction:column;border-left:1px solid var(--rule);background:#E6EAEC;min-height:0}
.pvbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 10px;background:var(--paper);border-bottom:1px solid var(--rule);font-size:12px}
.pvbar label{display:flex;gap:5px;align-items:center;color:var(--ink-2)}
.pvbar select{padding:3px 5px;border:1px solid var(--rule);border-radius:3px;background:var(--paper)}
.pvbar .lab{margin:0}
.pvwrap{flex:1;min-height:0;display:flex;justify-content:center;overflow:auto}
.pvwrap iframe{border:0;background:#fff;width:100%;height:100%}
.pvwrap.phone{padding:14px 0}
.pvwrap.phone iframe{width:390px;height:100%;border:1px solid var(--rule);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}

h1{font-family:var(--serif);font-size:24px;font-weight:400;margin:0 0 4px;line-height:1.2}
.lede{font-size:13.5px;color:var(--slate);margin:0 0 16px;max-width:76ch}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:8px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;margin:0 0 14px}
.card.sel{border-left:3px solid var(--rust)}
.small{font-size:12.5px;color:var(--slate);max-width:80ch;margin:0}
.small+.small{margin-top:6px}
.hl{border:0;background:none;padding:0;font-size:12.5px;font-weight:600;color:var(--rust-ink);text-decoration:underline;text-underline-offset:3px;margin-left:6px}
.lnk{border:0;background:none;padding:2px 0;font-size:12.5px;font-weight:600;color:var(--slate);text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--rust)}
.lnk.del{color:var(--alert)}
.lnk[disabled]{color:var(--mute);text-decoration:none;cursor:not-allowed}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fg .w{grid-column:1/-1}
.fld label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700;margin-bottom:4px}
.fld input:not([type=checkbox]):not([type=color]),.fld select,.fld textarea,table.t input:not([type=checkbox]),table.t select{width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);line-height:1.4}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,table.t input:focus,table.t select:focus{outline:2px solid var(--rust);outline-offset:1px}
.fld .help{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.45}
.ck{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer}
.ck input{margin:0;accent-color:var(--rust)}
.ro{font-family:var(--mono);font-size:12px;padding:6px 8px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;color:var(--slate)}

.crow{display:grid;grid-template-columns:52px 1fr 110px 150px 90px auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--surface-2);cursor:pointer;font-size:13px}
.crow:hover{background:var(--surface)}
.crow.open{background:var(--rust-soft)}
.crow .ttl{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .k{font-family:var(--mono);font-size:10.5px;color:var(--mute);font-weight:400;margin-left:6px}
.crow .m{font-size:12px;color:var(--slate);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv{display:flex;gap:2px}
.mv button{border:1px solid var(--rule);background:var(--paper);border-radius:3px;width:22px;height:22px;font-size:10px;color:var(--slate);padding:0}
.mv button:hover{border-color:var(--slate)}
.mv button[disabled]{opacity:.3;cursor:default}
.bd{font-family:var(--mono);font-size:9px;letter-spacing:.05em;font-weight:700;padding:1px 5px;border-radius:3px;border:1px solid var(--rule);color:var(--slate);background:var(--surface-2);white-space:nowrap}
.bd.core{background:var(--ink-2);color:#fff;border-color:var(--ink-2)}
.bd.bi{background:var(--teal-soft);color:var(--teal);border-color:#BFD6D2}
.bd.cu{background:var(--rust-soft);color:var(--rust-ink);border-color:#E3CCC2}
.bd.req{background:var(--amber-soft);color:var(--amber);border-color:#E4D3AF}
.cedit{padding:14px 12px 16px;border-top:1px solid var(--rule);background:#FCFCFC}
.note{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:9px 12px;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.note.warn{background:var(--amber-soft);border-color:#E4D3AF}
.note.err{background:var(--alert-soft);border-color:#E0BFBF;color:var(--alert)}
.addrow{display:grid;grid-template-columns:1fr 160px 200px auto;gap:8px;align-items:end;margin-top:12px;padding-top:12px;border-top:1px dashed var(--rule)}

table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);font-weight:700;padding:7px 6px;border-bottom:2px solid var(--rule);background:var(--surface-2);white-space:nowrap}
table.t td{padding:5px 6px;border-top:1px solid var(--surface-2);vertical-align:middle}
table.t td.k{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--rust-ink);white-space:nowrap}
table.t td.mm{font-size:11.5px;color:var(--slate)}
table.t tr.off td{opacity:.55}
.sev{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap}
.sev.error{background:var(--alert-soft);color:var(--alert)}
.sev.warn{background:var(--amber-soft);color:var(--amber)}
.sev.info{background:var(--surface-2);color:var(--slate)}
.sentence{font-family:var(--serif);font-size:15px;color:var(--ink-2);background:var(--surface);border-left:3px solid var(--rust);padding:8px 12px;margin:10px 0 0}
.rulegrid{display:grid;grid-template-columns:70px 170px 1fr;gap:8px;align-items:center;margin-top:8px}
.rulegrid .lw{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);font-weight:700}
.rulegrid select,.rulegrid input{width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.swatch{display:inline-block;width:28px;height:28px;border-radius:4px;border:1px solid var(--rule);vertical-align:middle}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:10px 12px}
.stat .v{font-family:var(--serif);font-size:24px}
.stat .t{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700}

/* help panel */
.help-ov{position:fixed;inset:0;background:rgba(20,26,31,.35);z-index:50;display:none}
.help-ov.on{display:block}
.helpp{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--paper);z-index:51;box-shadow:-4px 0 20px rgba(0,0,0,.15);display:none;flex-direction:column}
.helpp.on{display:flex}
.helpp .hh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.helpp .hh b{font-family:var(--serif);font-size:18px;font-weight:400;flex:1}
.helpp .hs{padding:10px 16px;border-bottom:1px solid var(--rule)}
.helpp .hs input{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:4px}
.helpp .hb{flex:1;overflow:auto;display:grid;grid-template-columns:170px 1fr}
.helpp .ht{border-right:1px solid var(--rule);padding:8px 0;overflow:auto}
.helpp .ht button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 14px;font-size:12.5px;color:var(--ink-2);border-left:3px solid transparent}
.helpp .ht button.on{background:var(--rust-soft);border-left-color:var(--rust);color:var(--rust-ink);font-weight:600}
.helpp .hc{padding:14px 18px 40px;overflow:auto}
.helpp .hc h2{font-family:var(--serif);font-size:20px;font-weight:400;margin:0 0 10px}
.helpp .hc p{font-size:13.5px;color:var(--ink-2);margin:0 0 10px;max-width:62ch}
.helpp .hc ul{margin:0 0 10px;padding-left:18px}
.helpp .hc li{font-size:13.5px;color:var(--ink-2);margin-bottom:6px}
.helpp .hc .ex{background:var(--surface);border-left:3px solid var(--rust);padding:8px 12px;font-size:13px;margin:0 0 10px}
mark{background:#FBE9A6;padding:0 1px}
@media(max-width:1100px){
  .main{grid-template-columns:170px minmax(0,1fr)}
  .main .pv{grid-column:1/-1;min-height:70vh}
  .crow{grid-template-columns:52px 1fr 90px auto}
  .crow .hide-s{display:none}
}
@media(max-width:700px){
  .main,.main.l-editor{grid-template-columns:1fr}
  .nav{display:flex;overflow:auto;padding:0;border-right:0;border-bottom:1px solid var(--rule)}
  .nav .h{display:none}
  .nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;width:auto}
  .nav button.on{border-bottom-color:var(--rust)}
  .fg,.stats,.addrow{grid-template-columns:1fr}
  .helpp .hb{grid-template-columns:1fr}
  .helpp .ht{display:none}
}
</style>
<style>
.fld label.ck{display:flex;font-family:var(--sans);font-size:13px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink-2);margin-bottom:0}
.ro2{font-family:var(--mono);font-size:11.5px;color:var(--slate)}
table.t textarea{width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);font-family:inherit;font-size:12.5px;resize:vertical}
.stepcard .head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stepcard select{width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.stepcard .sid{font-family:var(--mono);font-weight:700;color:var(--rust-ink);min-width:36px}
</style>
</head>
<body>
<div class="top"><b>CI Interface Register Builder</b><span>Configuration Management &middot; Tool builder &middot; Rev B draft</span></div>
<div class="bar">
  <button class="btn pri" data-act="save">Save build</button>
  <button class="btn" data-act="open">Open build</button>
  <button class="btn pri" data-act="export">Export tool</button>
  <span class="sep"></span>
  <button class="btn" data-act="undo" id="b-undo" title="Undo">Undo</button>
  <button class="btn" data-act="redo" id="b-redo" title="Redo">Redo</button>
  <button class="btn gh" data-act="reset">Start over</button>
  <span class="sep"></span>
  <button class="btn" data-act="help">Help</button>
  <span id="vchip"></span>
  <span class="chip ok" id="dirty">Saved</span>
  <span id="msg" role="status" aria-live="polite"></span>
</div>
<input type="file" id="f-open" accept=".json,.html,.htm,application/json,text/html" style="display:none">

<div class="main" id="main">
  <nav class="nav" id="nav" aria-label="Builder sections"></nav>
  <div class="ed" id="ed"></div>
  <div class="pv" id="pv">
    <div class="pvbar">
      <span class="lab">Preview</span>
      <button class="btn sm" data-act="pv-refresh">Refresh</button>
      <label><input type="checkbox" id="pv-auto" checked> Auto</label>
      <label><input type="checkbox" id="pv-keep" checked> Keep my entries</label>
      <label>Start from <select id="pv-mode"><option value="examples">Example set</option><option value="empty">Empty register</option></select></label>
      <label>Width <select id="pv-width"><option value="full">Full</option><option value="phone">Phone</option></select></label>
      <label>Layout <select id="pv-layout"><option value="side">Side by side</option><option value="below">Preview below</option><option value="editor">Editor only</option><option value="preview">Preview only</option></select></label>
      <button class="btn sm gh" data-act="pv-pop">Pop out</button>
    </div>
    <div class="pvwrap" id="pvwrap"><iframe id="pvf" title="Tool preview" sandbox="allow-scripts allow-modals allow-downloads allow-forms allow-popups"></iframe></div>
  </div>
</div>

<div class="help-ov" id="help-ov" data-act="help-close"></div>
<aside class="helpp" id="helpp" aria-label="Help">
  <div class="hh"><b>Help</b><button class="btn sm gh" data-act="help-close">Close</button></div>
  <div class="hs"><input id="help-q" placeholder="Search help" aria-label="Search help"></div>
  <div class="hb"><div class="ht" id="help-toc"></div><div class="hc" id="help-body"></div></div>
</aside>

<script>

r.bnd||''))) return '\u003cdiv id=\"sugg\">\u003c/div>';\n  return '\u003cdiv class=\"sugg\" id=\"sugg\">\u003cb>Suggested mapping.\u003c/b> '+esc(s.map)+(s.bnd?', '+esc(s.bnd):'')+'. '+esc(s.why)+\n    ' \u003cbutton class=\"btn sm\" data-act=\"apply-sugg\" style=\"margin-left:6px\">Apply\u003c/button>\u003c/div>';\n}\nfunction fieldHTML(r,k){\n  var c=COL[k], x=xcls(r,k), ctl, id='f-'+k;\n  if(c.kind==='yn'){\n    ctl='\u003cdiv class=\"seg'+x+'\" id=\"'+id+'\" role=\"group\" aria-label=\"'+esc(c.h)+'\">'+LISTS.yn.map(function(v){\n      return '\u003cbutton type=\"button\" data-yn=\"'+k+'\" data-v=\"'+v+'\" class=\"'+(r[k]===v?'on':'')+'\" aria-pressed=\"'+(r[k]===v)+'\">'+v+'\u003c/button>'; }).join('')+'\u003c/div>';\n    if(r[k]) ctl+=' \u003cbutton class=\"lnk\" style=\"font-size:12px;margin-left:8px\" data-yn=\"'+k+'\" data-v=\"\">Clear\u003c/button>';\n  } else if(c.kind==='enum'){\n    ctl='\u003cselect id=\"'+id+'\" data-f=\"'+k+'\" class=\"'+x+'\">'+optList(LISTS[c.list],r[k])+'\u003c/select>';\n  } else if(c.kind==='long'){\n    ctl='\u003ctextarea id=\"'+id+'\" data-f=\"'+k+'\" rows=\"2\" class=\"'+x+'\">'+esc(r[k])+'\u003c/textarea>';\n  } else {\n    var dl=c.kind==='side'?'dl-ci':c.kind==='sideb'?'dl-b':k==='inv'?'dl-inv':(c.sug&&c.sug.length?'dl-'+k:'');\n    ctl='\u003cinput id=\"'+id+'\" data-f=\"'+k+'\" value=\"'+esc(r[k])+'\" class=\"'+x+'\"'+(dl?' list=\"'+dl+'\"':'')+(c.kind==='date'?' placeholder=\"YYYY-MM-DD\"':'')+(c.kind==='srcs'?' placeholder=\"ICD-1234-001 \u00a73.2 Rev B; IRS-...\"':'')+' autocomplete=\"off\">';\n    if(c.kind==='side'||c.kind==='sideb') ctl+=resolveHTML(r,k==='a'?'a':'b');\n    if(c.kind==='srcs') ctl+=refChipsHTML(r);\n  }\n  var lb=c.kind==='yn'?'\u003clabel id=\"lb-'+k+'\">'+esc(c.h)+(c.req?' \u003cspan class=\"bd p\">REQUIRED\u003c/span>':'')+'\u003c/label>':'\u003clabel for=\"'+id+'\">'+esc(c.h)+(c.req?' \u003cspan class=\"bd p\">REQUIRED\u003c/span>':'')+'\u003c/label>';\n  return '\u003cdiv class=\"fld'+(c.wide ======================== */\nfunction mapRows(){ return S.rows.filter(function(r){ return S.mopt.ret||active(r); }); }\nfunction mapNodes(){\n  var out=[], seen={};\n  if(IX.on) IX.order.forEach(function(c){ if(S.mopt.ret||ixLive(c)){ seen[c.id]=1; out.push({id:c.id,name:c.name||'',lvl:IX.lvl[c.id]||0,c:c}); } });\n  var extra=[];\n  mapRows().forEach(function(r){ [tr(r.a),tr(r.b)].forEach(function(x,i){ if(x&&!seen[x]&&(i===0||sideKind(x)==='ci')){ seen[x]=1; extra.push(x); } }); });\n  extra.sort().forEach(function(x){ out.push({id:x,name:'',lvl:0,c:null,stray:IX.on}); });\n  return out;\n}\nfunction laneKind(b){ var k=sideKind(b); return k==='ci'?null:k; }\nfunction mapModel(){\n  var nodes=mapNodes(), isNode={}; nodes.forEach(function(n){ isNode[n.id]=n; });\n  var lanes=[], laneBy={};\n  function lane(kind,name){ var k=kind+':'+norm(stripParen(name)||name); if(!laneBy[k]){ laneBy[k]={key:'L:'+k,kind:kind,name:tr(name),rows:[]}; lanes.push(laneBy[k]); } return laneBy[k]; }\n  S.ext.forEach(function(x){ if(tr(x.name)) lane('ext',x.name); });\n  var cells={};\n  function pk(x,y){ return x\u003cy?x+'|'+y:y+'|'+x; }\n  function addCell(k,r){ (cells[k]=cells[k]||[]).push(r); }\n  mapRows().forEach(function(r){\n    var a=tr(r.a), b=tr(r.b); if(!a) return;\n    if(!b){ return; }\n    if(a===b){ addCell(a+'|'+a,r); return; }\n    if(isNode[b]&&isNode[a]&&!(r.bnd===BT.ext||r.bnd===BT.shared)){ addCell(pk(a,b),r); return; }\n    var kind=r.map===MS.unmapped?'unk':r.bnd===BT.shared?'shared':r.bnd===BT.ext?'ext':(laneKind(b)||'unk');\n    var em=kind==='ext'?extMatch(b):null, L=lane(kind,em?em.name:b);\n    L.rows.push(r); addCell(a+'|'+L.key,r);\n  });\n  var req={}, gaps={};\n  if(IX.on){\n    nodes.forEach(function(n){ var c=n.c; if(!c||!ixLive(c)) return; var p=ixParent(c);\n      if(p&&ixLive(p)&&tr(p.tier)&&tr(c.tier)&&p.tier!==c.tier&&isNode[p.id]){ var k=pk(p.id,c.id); req[k]=1; if(!(cells[k]||[]).some(function(r){ return active(r)&&isMapped(r); })) gaps[k]=1; } }) \">'+esc(title)+'\u003c/div>\u003cp class=\"small\">Floor gap. These two CIs sit in different control tiers, so the structural floor expects at least one Mapped row between them. Systems Engineering dispositions the gap. Where no interface exists, record that confirmation on the exception.\u003c/p>\u003cdiv class=\"btnrow\">\u003cbutton class=\"btn sm\" data-act=\"add-row-pair\" data-pair=\"'+esc(S.mcell)+'\">Add a row between them\u003c/button>\u003c/div>\u003c/div>'; }\n  if(S.mapv==='diagram'&&S.dsel){\n    if(S.dsel.node){ rows=mapRows().filter(function(r){ return tr(r.a)===S.dsel.node||tr(r.b)===S.dsel.node; }); title='Rows on '+S.dsel.node; }\n    else if(S.dsel.edge){ rows=M.cells[S.dsel.edge]; var q=S.dsel.edge.split('|'), L2=M.lanes.filter(function(x){ return x.key===q[1]; })[0]; title=q[0]+' and '+(L2?L2.name:q[1]);\n      if(!rows&&M.gaps[S.dsel.edge]) return '\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">'+esc(title)+'\u003c/div>\u003cp class=\"small\">Floor gap. No Mapped row joins these two CIs.\u003c/p>\u003c/div>'; }\n  }\n  if(!rows) return '\u003cp class=\"small\">'+(S.mapv==='matrix'?'Click a cell to list its rows.':'Click a CI or a line to list its rows. Click empty space to clear.')+'\u003c/p>';\n  return '\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">'+esc(title)+'\u003c/div>\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>'+esc(hd('id'))+'\u003c/th>\u003cth>Sides\u003c/th>\u003cth>'+esc(hd('map'))+'\u003c/th>\u003cth>'+esc(hd('bnd'))+'\u003c/th>\u003cth>'+esc(hd('src'))+'\u003c/th>\u003cth>'+esc(hd('safe'))+'\u003c/th>\u003cth>'+esc(hd('rstat'))+'\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    rows.map(function(r){ return '\u003ctr'+(active(r)?'':' class=\"cleared\"')+'>\u003ctd>\u003cbutton class=\"cibtn\" data-goto=\"'+r.uid+'\">'+esc(r.id||'?')+'\u003c/button>\u003c/td>\u003ctd class=\"m\">'+esc(tr(r.a)+' / '+tr(r.b))+'\u003c/td>\u003ctd>'+esc(r.map)+'\u003c/td>\u003ctd class=\"m\">'+esc(r.bnd)+'\u003c/td>\u003ctd class=\"m\">'+esc(r.src)+'\u003c/td>\u003ctd>'+esc(r.safe)+'\u003c/td>\u003ctd class=\"m\">'+esc(r.rstat)+'\u003c/td>\u003c/tr>'; }).join('')+'\u003c/tbody>\u003c/table>\u003c/div>';\n}\n\n/* diagram */\nfunction diagramHTML(M){\n  var W=150, NH=46, GX=26, GY=78, PAD=30;\n  var pos={}, nodes=M.nodes, isN={}; nodes.forEach(function(n){ isN[n.id]=n; });\n  var next=0, maxLvl=0;\n  if(IX.on){\n    var kidsOf=function(n){ return (IX.kids[n.id]||[]).filter(function(k){ return isN[k.id]; }); };\n    var placed={};\n    var place=function(n,d){\n      if(placed[n.id]) return; placed[n.id]=1; maxLvl=Math.max(maxLvl,d);\n      var ks=kidsOf(n).filter(function(k){ return !placed[k.id]; });\n      if(!ks.length){ pos[n.id]={x:next*(W+GX),y:d*(NH+GY)}; next++; return; }\n      ks.forEach(function(k){ place(isN[k.id],d+1); });\n      var xs=ks.map(function(k){ return pos[k.id].x; });\n      pos[n.id]={x:(Math.min.apply(null,xs)+Math.max.apply(null,xs))/2,y:d*(NH+GY)};\n    };\n    nodes.filter(function(n){ return n.c&&(!n.c.parent||!isN[n.c.parent]); }).forEach(function(n){ place(n,0); });\n    var strays=nodes.filter(function(n){ return !placed[n.id]; });\n    if(strays.length){ var y0=(maxLvl+1)*(NH+GY)+20; strays.forEach(function(n,i){ pos[n.id]={x:(i%8)*(W+GX),y:y0+Math.floor(i/8)*(NH+GY)}; }); maxLvl+=Math.ceil(strays.length/8)+1; }\n  } else {\n    var per=Math.max(4,Math.ceil(Math.sqrt(nodes.length*1.6)));\n    nodes.forEach(function(n,i){ pos[n.id]={x:(i%per)*(W+GX*2),y:Math.floor(i/per)*(NH+GY)}; });\n  }\n  var maxX=0, maxY=0; Object.keys(pos).forEach(function(k){ maxX=Math.max(maxX,pos[k].x); maxY=Math.max(maxY,pos[k].y); });\n  var lx=maxX+W+110, lp={};\n  M.lanes.forEach(function(L,i){ lp[L.key]={x:lx,y:i*(NH+16)}; maxY=Math.max(maxY,i*(NH+16)); });\n  var TW=(M.lanes.length?lx+W+60:maxX+W)+PAD*2, TH=maxY+NH+PAD*2+40;\n  var sel=S.dsel||{}, selN=sel.node||null, selE=sel.edge||null;\n  var touches=function(k){ if(selE) return k===selE; if(selN){ var p=k.split('|'); return p[0]===selN||p[1]===selN; } return true; };\n  var g='\u003cg transform=\"translate('+PAD+','+(PAD+30)+')\">';\n  /* hierarchy lines */\n  if(IX.on&&S.mopt.tree) nodes.forEach(function(n){ if(!n.c||!n.c.parent||!pos[n.c.parent]||!pos[n.id]) return; var p=pos[n.c.parent], c=pos[n.id];\n    var my=p.y+NH+GY/2;\n    g+='\u003cpath d=\"M'+(p.x+W/2)+' '+(p.y+NH)+' V'+my+' H'+(c.x+W/2)+' V'+c.y+'\" style=\"fill:none;stroke:var(--rule);stroke-width:1.2\"/>'; });\n  /* interface lines */\n  var edges=Object.keys(M.cells).filter(function(k){ var p=k.split('|'); return p[0]!==p[1]; });\n  Object.keys(M.gaps).forEach(function(k){ if(!M.cells[k]) edges.push(k); });\n  edges.forEach(function(k,i){\n    var p=k.split('|'), A=pos[p[0]], rows=M.cells[k]||[], lane=p[1].indexOf('L:')===0, B=lane?lp[p[1]]:pos[p[1]];\n    if(!A||!B) return;\n    var gap=!rows.length, d, mx, my;\n    if(lane){\n      var x1=A.x+W, y1=A.y+NH/2, x2=B.x, y2=B.y+NH/2;\n      d='M'+x1+' '+y1+' C'+(x1+90)+' '+y1+' '+(x2-90)+' '+y2+' '+x2+' '+y2; mx=(x1+x2)/2; my=(y1+y2)/2;\n    } else {\n      var a=A, b=B; if(a.y>b.y||(a.y===b.y&&a.x>b.x)){ var t=a; a=b; b=t; }\n      var off=M.req[k]&&S.mopt.tree?14:0;\n      if(Math.abs(a.y-b.y)\u003c1){\n        var xa=a.x+W/2, xb=b.x+W/2, ya=a.y, h0=28+Math.min(120,Math.abs(xb-xa)*0.18)+(i%3)*6;\n        d='M'+xa+' '+ya+' C'+xa+' '+(ya-h0)+' '+xb+' '+(ya-h0)+' '+xb+' '+ya; mx=(xa+xb)/2; my=ya-h0*0.75;\n      } else {\n        var xa2=a.x+W/2+off, ya2=a.y+NH, xb2=b.x+W/2+off, yb2=b.y, dy=(yb2-ya2)/2;\n        d='M'+xa2+' '+ya2+' C'+xa2+' '+(ya2+dy)+' '+xb2+' '+(yb2-dy)+' '+xb2+' '+yb2; mx=(xa2+xb2)/2; my=(ya2+yb2)/2;\n      }\n    }\n    var act1=rows.filter(active), unm=act1.some(function(r){ return r.map===MS.unmapped; }), safe=act1.some(function(r){ return r.safe==='Y'; });\n    var bnd=(act1.filter(isMapped)[0]||{}).bnd;\n    var col=gap||unm?'var(--alert)':safe?'var(--rust)':bnd===BT.ctl?'var(--teal)':bnd===BT.ext?'var(--amber)':bnd===BT.shared?'var(--ink-2)':act1.lengt n      '\u003crect x=\"'+p.x+'\" y=\"'+p.y+'\" width=\"'+W+'\" height=\"'+NH+'\" rx=\"5\" style=\"fill:'+(uncovered?'var(--amber-soft)':c&&!ixLive(c)?'var(--surface-2)':'var(--paper)')+';stroke:'+(isSel?'var(--rust)':M.gfeGap[n.id]?'var(--alert)':stroke)+';stroke-width:'+(isSel?2.5:1.4)+(tierM==='gfe'?';stroke-dasharray:5 3':'')+'\"/>'+\n      '\u003ctext x=\"'+(p.x+9)+'\" y=\"'+(p.y+18)+'\" style=\"font-family:var(--mono);font-size:11px;font-weight:700;fill:var(--rust-ink)\">'+esc(n.id)+'\u003c/text>'+\n      (tierM?'\u003ctext x=\"'+(p.x+W-8)+'\" y=\"'+(p.y+18)+'\" text-anchor=\"end\" style=\"font-family:var(--mono);font-size:8.5px;font-weight:700;fill:'+stroke+'\">'+(tierM==='acq'?'ACQ':tierM==='co'?'CO':'GFE')+'\u003c/text>':'')+\n      '\u003ctext x=\"'+(p.x+9)+'\" y=\"'+(p.y+35)+'\" style=\"font-size:11px;fill:var(--ink-2)\">'+esc(nm)+'\u003c/text>'+\n      (nInt?'\u003ctext x=\"'+(p.x+W)+'\" y=\"'+(p.y+NH+12)+'\" text-anchor=\"end\" style=\"font-size:9.5px;fill:var(--slate)\">'+plural(nInt,'internal row')+'\u003c/text>':'')+'\u003c/g>';\n  });\n  /* lanes */\n  if(M.lanes.length) g+='\u003ctext x=\"'+lx+'\" y=\"-12\" style=\"font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;font-weight:700;fill:var(--slate)\">EXTERNAL, SHARED, AND UNRESOLVED\u003c/text>';\n  M.lanes.forEach(function(L){ var p=lp[L.key], col=L.kind==='ext'?'var(--amber)':L.kind==='shared'?'var(--ink-2)':'var(--alert)';\n    var nm=L.name.length>26?L.name.slice(0,25)+'\u2026':L.name, dim=(selN&&!M.cells[selN+'|'+L.key])||(selE&&selE.split('|')[1]!==L.key);\n    g+='\u003cg opacity=\"'+(dim?0.35:1)+'\">\u003ctitle>'+esc(L.name)+'\u003c/title>\u003crect x=\"'+p.x+'\" y=\"'+p.y+'\" width=\"'+W+'\" height=\"'+NH+'\" rx=\"'+(L.kind==='shared'?22:5)+'\" style=\"fill:var(--surface);stroke:'+(M.laneGap[L.key]?'var(--alert)':col)+';stroke-width:1.4'+(L.kind==='unk'||M.laneGap[L.key]?';stroke-dasharray:5 3':'')+'\"/>'+\n      '\u003ctext x=\"'+(p.x+12)+'\" y=\"'+(p.y+18)+'\" style=\"font-family:var(--mono);font-size:8.5px;font-weight:700;fill:'+col+'\">'+(L.kind==='ext'?'EXTERNAL':L.kind==='shared'?'SHARED':'UNRESOLVED')+(M.laneGap[L.key]?' \u00b7 NO ROW':'')+'\u003c/text>'+\n      '\u003ctext x=\"'+(p.x+12)+'\" y=\"'+(p.y+34)+'\" style=\"font-size:11px;fill:var(--ink-2)\">'+esc(nm)+'\u003c/text>\u003c/g>'; });\n  g+='\u003c/g>';\n  var avail=Math.max(400,($('view').clientWidth||1200)-4);\n  var Z=S.zoom==null?Math.max(0.4,Math.min(1,Math.floor(avail/TW*100)/100)):S.zoom; S.zoomEff=Z;\n  var svg='\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"'+Math.round(TW*Z)+'\" height=\"'+Math.round(TH*Z)+'\" viewBox=\"0 0 '+TW+' '+TH+'\" role=\"img\" aria-label=\"Interface diagram\">\u003crect data-dclear=\"1\" x=\"0\" y=\"0\" width=\"'+TW+'\" height=\"'+TH+'\" style=\"fill:var(--paper)\"/>'+g+'\u003c/svg>';\n  return '\u003cdiv class=\"dgwrap\" id=\"dgwrap\">'+svg+'\u003c/div>'+\n    '\u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"swatch\" style=\"background:var(--slate)\">\u003c/i>Same-Tier\u003c/span>\u003cspan>\u003ci class=\"swatch\" style=\"background:var(--teal)\">\u003c/i>Control-Level\u003c/span>\u003cspan>\u003ci class=\"swatch\" style=\"background:var(--amber)\">\u003c/i>External\u003c/span>\u003cspan>\u003ci class=\"swatch\" style=\"background:var(--ink-2)\">\u003c/i>Shared\u003c/span>\u003cspan>\u003ci class=\"swatch\" style=\"background:var(--rust)\">\u003c/i>Safety-related (heavy)\u003c/span>\u003cspan>\u003ci class=\"swatch\" style=\"background:var(--alert)\">\u003c/i>Unmapped or floor gap (dashed)\u003c/span>\u003cspan>\u003ci class=\"swatch\" style=\"background:var(--amber-soft)\">\u003c/i>CI on no Mapped row\u003c/span>\u003c/div>';\n}\n\n/* ===================================================================\n   Sources and impact\n   =================================================================== */\nfunction srcStatus(s){\n  var rows=citing(s.doc), act=rows.filter(active), st=0;\n  act.forEach(function(r){ refs(r.src).forEach(function(e){ if(dkey(e.doc)===dkey(s.doc)&&e.rev&&tr(s.rev)&&e.rev.toUpperCase()!==tr(s.rev).toUpperCase()) st++; }); });\n  return {rows:rows,act:act,stale:st};\n}\nfunction sourcesHTML(){\n  var q=S.srcq.toLowerCase();\n  var h='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Interface sources\u003c/div>'+\n    '\u003cp class=\"small\">List each interface source the CM plan names: ICDs, IRSs, IDDs, the interface sections of specifications, source control drawings, drawings, and model interface elements. Record the revision and release status. Step 1 of the coverage check confirms each released source appears on at least one active row. Rows that cite an older revision are flagged for re-mapping.\u003c/p>'+\n    '\u003cdiv class=\"btnrow\">\u003cbutton class=\"btn sm pri\" data-act=\"src-add\">Add a source\u003c/button>\u003cbutton class=\"btn sm\" data-act=\"src-seed\">Seed from the register rows\u003c/button>'+\n    '\u003cdiv class=\"fld\" style=\"min-width:220px;margin-left:auto\">\u003cinput data-srcq=\"1\" value=\"'+esc(S.srcq)+'\" placeholder=\"Filter sources\" aria-label=\"Filter sources\">\u003c/div>\u003c/div>\u003c/div>';\n  var list=S.sources.filter(function(s){ return !q||[s.doc,s.title,s.type,s.rev,s.rel,s.notes].join(' ').toLowerCase().indexOf(q)>=0; });\n  h+='\u003cdiv class=\"gridwrap\" style=\"max-height:none\">\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>Document\u003c/th>\u003cth>Title\u003c/th>\u003cth>Type\u003c/th>\u003cth>Rev\u003c/th>\u003cth>Release Status\u003c/th>\u003cth>Release Date\u003c/th>\u003cth>Rows\u003c/th>\u003cth>Notes\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>';\n  if(!list.length) h+='\u003ctr>\u003ctd colspan=\"9\" class=\"m\">'+(S.sources.length?'No source matches the filter.':'No sources listed. Press Seed from the register rows to start from the documents the rows already cite.')+'\u003c/td>\u003c/tr>';\n  list.forEach(function(s){\n    var t=srcStatus(s), pill=!isRel(s)?'\u003cspan class=\"pill off\">'+esc(s.rel||'No status')+'\u003c/span>':!t.act.length?'\u003cspan class=\"pill bad\">No rows\u003c/span>':t.stale?'\u003cspan class=\"pill hold\">'+t.stale+' stale\u003c/span>':'\u003cspan class=\"pill ok\">Mapped\u003c/span>';\n    var cell=function(k,ctl){ return '\u003ctd id=\"sc-'+s.uid+'-'+k+'\" class=\"'+xcls(s,k).trim()+'\">'+ctl+'\u003c/td>'; };\n    h+='\u003ctr>'+cell('doc','\u003cinput data-sf=\"doc\" data-su=\"'+s.uid+'\" value=\"'+esc(s.doc)+'\" aria-label=\"Document\" style=\"min-width:130px;font-family:var(--mono)\">')+\n      '\u003ctd>\u003cinput data-sf=\"title\" data-su=\"'+s.uid+'\" value=\"'+esc(s.title)+'\" aria-label=\"Title\" style=\"min-width:180px\">\u003c/td>'+\n      cell('type','\u003cselect style=\"min-width:120px\"  data-sf=\"type\" data-su=\"'+s.uid+'\" aria-label=\"Type\">'+optList(STYPES.map(function(x){ return x.v; }),s.type)+'\u003c/select>')+\n      cell('rev','\u003cinput data-sf=\"rev\" data-su=\"'+s.uid+'\" value=\"'+esc(s.rev)+'\" aria-label=\"Revision\" style=\"width:60px\">')+\n      '\u003ctd style=\"min-width:130px\">\u003cselect data-sf=\"rel\" data-su=\"'+s.uid+'\" aria-label=\"Release status\">'+optList(LISTS.srel,s.rel)+'\u003c/select>\u003c/td>'+\n      '\u003ctd>\u003cinput data-sf=\"date\" data-su=\"'+s.uid+'\" value=\"'+esc(s.date)+'\" placeholder=\"YYYY-MM-DD\" aria-label=\"Release date\" style=\"width:110px\">\u003c/td>'+\n      '\u003ctd style=\"white-space:nowrap\">'+pill+' \u003cbutton class=\"lnk\" data-srcsel=\"'+esc(s.doc)+'\">'+t.act.length+' active\u003c/button>\u003c/td>'+\n      '\u003ctd>\u003cinput data-sf=\"notes\" data-su=\"'+s.uid+'\" value=\"'+esc(s.notes)+'\" aria-label=\"Notes\" style=\"min-width:160px\">\u003c/td>'+\n      '\u003ctd>\u003cbutton class=\"lnk\" data-srcdel=\"'+s.uid+'\">Remove\u003c/button>\u003c/td>\u003c/tr>';\n  });\n  h+='\u003c/tbody>\u003c/table>\u003c/div>';\n\n  h+='\u003cdiv class=\"sect\" style=\"margin-top:18px\">\u003cdiv class=\"lab\">Named external items\u003c/div>\u003cp class=\"small\">Each external item named in the system specification or the contract. Step 4 of the coverage check confirms each one appears on at least one External row. Side B matches when it starts with the name here.\u003c/p>'+\n    '\u003ctable class=\"dt\" style=\"margin-top:10px\">\u003cthead>\u003ctr>\u003cth>External item\u003c/th>\u003cth>Named in\u003c/th>\u003cth>Notes\u003c/th>\u003cth>External rows\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    (S.ext.length?S.ext.map(function(x,i){ var ne=norm(stripParen(x.name)); var n=S.rows.filter(function(r){ return active(r)&&isMapped(r)&&r.bnd===BT.ext&&ne&&(norm(stripParen(r.b))===ne||norm(stripParen(r.b)).indexOf(ne)===0); });\n      return '\u003ctr>\u003ctd>\u003cinput data-xt=\"name\" data-xi=\"'+i+'\" value=\"'+esc(x.name)+'\" aria-label=\"External item\">\u003c/td>\u003ctd>\u003cinput data-xt=\"basis\" data-xi=\"'+i+'\" value=\"'+esc(x.basis)+'\" aria-label=\"Named in\" placeholder=\"System specification or contract reference\">\u003c/td>\u003ctd>\u003cinput data-xt=\"notes\" data-xi=\"'+i+'\" value=\"'+esc(x.notes)+'\" aria-label=\"Notes\">\u003c/td>'+\n        '\u003ctd>'+(n.length?n.map(function(r){ return '\u003cbutton class=\"cibtn\" data-goto=\"'+r.uid+'\">'+esc(r.id)+'\u003c/button>'; }).join(', '):'\u003cspan class=\"pill bad\">None\u003c/span>')+'\u003c/td>\u003ctd>\u003cbutton class=\"lnk\" data-xdel=\"'+i+'\">Remove\u003c/button>\u003c/td>\u003c/tr>'; }).join(''):'\u003ctr>\u003ctd colspan=\"5\" class=\"m\">No named external items.\u003c/td>\u003c/tr>')+\n    '\u003c/tbody>\u003c/table>\u003cdiv class=\"btnrow\">\u003cbutton class=\"btn sm\" data-act=\"ext-add\">Add an external item\u003c/button>\u003c/div>\u003c/div>';\n\n  h+='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Source impact\u003c/div>\u003cp class=\"small\">Pick a source. The tool lists every row that cites it and every CI those rows touch. Use it when Systems Engineering revises a tive row')+' cite it: '+I.act.map(function(r){ return r.id; }).join(', ')+'.');\n  L.push(plural(I.cis.length,'CI')+' touched: '+I.cis.join(', ')+'.');\n  if(I.specs.length) L.push('Invoking specifications: '+I.specs.join(', ')+'.');\n  if(I.base.length) L.push('Controlling baselines: '+I.base.join(', ')+'.');\n  if(I.icwg) L.push(plural(I.icwg,'row')+' under ICWG control.');\n  if(I.safe.length) L.push('Safety-related rows: '+I.safe.map(function(r){ return r.id+' ('+(r.haz||'no hazard ref')+')'; }).join(', ')+'.');\n  if(I.stale.length) L.push('Rows citing an older revision: '+I.stale.map(function(x){ return x.r.id+' at Rev '+x.e.rev; }).join(', ')+'.');\n  if(I.ixOnly.length) L.push('CI Index rows that list it with no register row: '+I.ixOnly.map(function(c){ return c.id; }).join(', ')+'.');\n  return L.join('\\n');\n}\nfunction impactHTML(doc){\n  if(!tr(doc)) return '';\n  var I=impact(doc), s=I.s;\n  var h='\u003cdiv class=\"tiles\" style=\"margin-top:12px\">'+\n    '\u003cdiv class=\"tile\">\u003cdiv class=\"t\">Active rows\u003c/div>\u003cdiv class=\"v\">'+I.act.length+'\u003c/div>\u003cdiv class=\"s\">'+(I.rows.length-I.act.length)+' retired or superseded\u003c/div>\u003c/div>'+\n    '\u003cdiv class=\"tile\">\u003cdiv class=\"t\">CIs touched\u003c/div>\u003cdiv class=\"v\">'+I.cis.length+'\u003c/div>\u003cdiv class=\"s\">'+esc(I.cis.slice(0,6).join(', '))+(I.cis.length>6?', and more':'')+'\u003c/div>\u003c/div>'+\n    '\u003cdiv class=\"tile'+(I.safe.length?' alert':'')+'\">\u003cdiv class=\"t\">Safety-related rows\u003c/div>\u003cdiv class=\"v\">'+I.safe.length+'\u003c/div>\u003cdiv class=\"s\">'+(I.icwg?I.icwg+' under ICWG control':'No ICWG control')+'\u003c/div>\u003c/div>'+\n    '\u003cdiv class=\"tile'+(I.stale.length?' amb':'')+'\">\u003cdiv class=\"t\">Citations to re-map\u003c/div>\u003cdiv class=\"v\">'+I.stale.length+'\u003c/div>\u003cdiv class=\"s\">'+(s?'List carries Rev '+esc(s.rev||'?'):'Not on the source list')+'\u003c/div>\u003c/div>\u003c/div>';\n  h+='\u003cdl class=\"kv\">\u003cdt>Invoking specifications\u003c/dt>\u003cdd>'+esc(I.specs.join(', ')||'None')+'\u003c/dd>\u003cdt>Controlling baselines\u003c/dt>\u003cdd>'+esc(I.base.join(', ')||'None')+'\u003c/dd>'+\n    (IX.on?'\u003cdt>Index rows, no register row\u003c/dt>\u003cdd>'+(I.ixOnly.length?I.ixOnly.map(function(c){ return '\u003cbutton class=\"cibtn\" data-byci-go=\"'+esc(c.id)+'\">'+esc(c.id)+'\u003c/button>'; }).join(', ')+' list it in the ICD column. Step 6 will raise '+(I.ixOnly.length>1?'them':'it')+'.':'None')+'\u003c/dd>':'')+'\u003c/dl>';\n  if(I.rows.length) h+='\u003ctable class=\"dt\" style=\"margin-top:12px\">\u003cthead>\u003ctr>\u003cth>'+esc(hd('id'))+'\u003c/th>\u003cth>Sides\u003c/th>\u003cth>Cited as\u003c/th>\u003cth>'+esc(hd('map'))+'\u003c/th>\u003cth>'+esc(hd('inv'))+'\u003c/th>\u003cth>'+esc(hd('auth'))+'\u003c/th>\u003cth>'+esc(hd('safe'))+'\u003c/th>\u003cth>'+esc(hd('rstat'))+'\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    I.rows.map(function(r){ var e=refs(r.src).filter(function(x){ return dkey(x.doc)===dkey(doc); })[0]||{}; var st=s&&e.rev&&tr(s.rev)&&e.rev.toUpperCase()!==tr(s.rev).toUpperCase();\n      return '\u003ctr'+(active(r)?'':' class=\"cleared\"')+'>\u003ctd>\u003cbutton class=\"cibtn\" data-goto=\"'+r.uid+'\">'+esc(r.id||'?')+'\u003c/button>\u003c/td>\u003ctd class=\"m\">'+esc(tr(r.a)+' / '+tr(r.b))+'\u003c/td>\u003ctd'+(st?' class=\"over\"':'')+'>'+esc(e.raw||'')+'\u003c/td>\u003ctd>'+esc(r.map)+'\u003c/td>\u003ctd class=\"m\">'+esc(r.inv)+'\u003c/td>\u003ctd class=\"m\">'+esc(r.auth)+'\u003c/td>\u003ctd>'+esc(r.safe)+'\u003c/td>\u003ctd class=\"m\">'+esc(r.rstat)+'\u003c/td>\u003c/tr>'; }).join('')+'\u003c/tbody>\u003c/table>';\n  h+='\u003cdiv class=\"btnrow\">'+(I.stale.length&&s?'\u003cbutton class=\"btn sm pri\" data-act=\"imp-update\">Update '+plural(I.stale.length,'citation')+' to Rev '+esc(s.rev)+'\u003c/button>':'')+\n    '\u003cbutton class=\"btn sm\" data-act=\"imp-copy\">Copy the summary\u003c/button>'+(s?'':'\u003cbutton class=\"btn sm\" data-act=\"imp-addsrc\">Add '+esc(doc)+' to the source list\u003c/button>')+'\u003c/div>'+\n    (I.stale.length&&s?'\u003cp class=\"small\" style=\"margin-top:8px\">Update only after CM has mapped the revised source. The update changes the cited revision on each active row and logs it. The section stays as it is. Check each row against the new revision.\u003c/p>':'');\n  return h;\n}\n\n/* ===================================================================\n   Coverage\n   =================================================================== */\nfunction pillFor(s){\n  if(!s||!s.on) return '\u003cspan class=\"pill off\">Off\u003c/span>';\n  if(!s.ran) return '\u003cspan class=\"pill off\">Not run\u003c/span>';\n  if(!s.items.length) return '\u003cspan class=\"pill ok\">Pass\u003c/span>';\n  return '\u003cspan class=\"pill '+(s.mode==='exception'?'bad':'hold')+'\">'+plural(s.items.length,s.mode==='exception'?'exception':'finding')+'\u003c/span>';\n}\nfunction nePill(s){ return s&&s.ran&&s.ne&&s.ne.length?' \u003cspan class=\"pill hold\" title=\"Blank CI Index entries kept the tool from evaluating these\">'+s.ne.length+' not evaluated\u003c/span>':''; }\nfunction neHTML(s){\n  if(!s||!s.ran||!s.ne||!s.ne.length) return '';\n  return '\u003cdiv class=\"nebox\">\u003cb>Not evaluated ('+s.ne.length+').\u003c/b> Blank CI Index entries kept the tool from deciding these. They are not passes. Fill the CI Index and reload the snapshot. \u003cbutton class=\"lnk\" data-act=\"ixmap-open\">What each column feeds\u003c/button>\u003cul>'+\n    s.ne.map(function(x){ var e=x.key&&excFor(x.key); return '\u003cli>'+itemLink(x)+'. '+esc(x.m)+(e&&e.state!==XS.clear?' \u003cspan class=\"pill hold\">'+esc(e.id)+' stays '+esc(e.state)+'\u003c/span>':'')+'\u003c/li>'; }).join('')+'\u003c/ul>\u003c/div>';\n}\nfunction itemLink(x){\n  var l=x.link||{};\n  if(l.row) return '\u003cbutton class=\"cibtn\" data-goto=\"'+l.row+'\">'+esc(x.item)+'\u003c/button>';\n  if(l.ci&&tabOn('byci')) return '\u003cbutton class=\"cibtn\" data-byci-go=\"'+esc(l.ci)+'\">'+esc(x.item)+'\u003c/button>';\n  if(l.src) return '\u003cbutton class=\"cibtn\" data-srcsel=\"'+esc(l.src)+'\">'+esc(x.item)+'\u003c/button>';\n  return '\u003cb>'+esc(x.item)+'\u003c/b>';\n}\nfunction coverageHTML(){\n  var cf=S.cform, nid=nextCheckId();\n  var h='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Coverage check\u003c/div>'+\n    '\u003cp class=\"small\">Run the check when you want to see where the register stands. Running it records nothing. Record it at CI-list submittal for Acquirer concurrence, at each technical review, and before each baseline is established. Recording adds a row to the Coverage Log and carries each exception forward on the Exceptions tab.\u003c/p>'+\n    '\u003cdiv class=\"btnrow\">\u003cbutton class=\"btn pri\" data-act=\"cov-run\">Run coverage check\u003c/button>'+(S.cov?'\u003cbutton class=\"btn\" data-act=\"cov-clear\">Clear the results\u003c/button>':'')+'\u003c/div>\u003c/div>';\n  if(S.cov){\n    var cov=S.cov, ex=excItems(cov).length, fi=0; STEP_IDS.forEach(function(id){ var s=cov.steps[id]; if(s&&s.ran&&s.mode!=='exception') fi+=s.items.length; });\n    if(S.covStale) h+='\u003cdiv class=\"stale\">The register changed after this run. Run it again before you record.\u003c/div>';\n    h+='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Results, run '+esc(cov.at)+'\u003c/div>'+\n      '\u003cp class=\"small\">\u003cb>'+plural(cov.counts.total,'active row')+'\u003c/b>: '+cov.counts.mapped+' Mapped, '+cov.counts.internal+' Internal, '+cov.counts.unmapped+' Unmapped'+(cov.counts.blank?', '+cov.counts.blank+' with no mapping status':'')+'. '+plural(ex,'exception')+(fi?' and '+plural(fi,'finding'):'')+'. '+\n      'Compared with the tracked exceptions: '+cov.cmp.nw.length+' new, '+cov.cmp.carry.length+' carried forward, '+cov.cmp.clear.length+' would clear.\u003c/p>'+\n      (cov.cmp.clear.length?'\u003cp class=\"small\" style=\"margin-top:6px\">Would clear: '+cov.cmp.clear.map(function(e){ return esc(e.id)+' ('+esc(e.item)+')'; }).join(', ')+'.\u003c/p>':'')+\n      '\u003cdiv class=\"steps\" style=\"margin-top:12px\">'+STEP_IDS.map(function(id){\n        var s=cov.steps[id], meta=STEPS[id]||{};\n        var body=!s.on?'\u003cp class=\"why\">This step is off in this build.\u003c/p>':!s.ran?'\u003cp class=\"why\">'+esc(s.why)+'\u003c/p>':\n          (s.part?'\u003cp class=\"why\">'+esc(s.part)+'\u003c/p>':'')+(s.items.length?'\u003cul>'+s.items.map(function(x){ var e=excFor(x.key); return '\u003cli>'+itemLink(x)+'. '+esc(x.m)+(e&&e.state!==XS.clear?' \u003cspan class=\"pill '+(e.state===XS.open?(overdue(e)?'bad':'hold'):'ok')+'\">'+esc(e.id)+' '+esc(e.state)+'\u003c/span>':s.mode==='exception'?' \u003cspan class=\"pill\">new\u003c/span>':'')+'\u003c/li>'; }).join('')+'\u003c/ul>':'\u003cp class=\"why\">No '+(s.mode==='exception'?'exceptions':'findings')+'.'+(s.note?' '+esc(s.note):'')+'\u003c/p>');\n        return '\u003cdiv class=\"step\">\u003cdiv>\u003cdiv class=\"sn\">'+esc(id==='MA'?'Report':'Step '+id.slice(1))+'\u003c/div>\u003cdiv class=\"st\">'+esc(meta.name)+'\u003c/div>'+pillFor(s)+nePill(s)+'\u003c/div>\u003cdiv>\u003cp class=\"why\" style=\"margin-bottom:4px\">'+esc(meta.what)+'\u003c/p>'+body+neHTML(s)+'\u003c/div>\u003c/div>'; }).join('')+'\u003c/div>\u003c/div>';\n    h+='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Record this check as '+esc(nid)+'\u003c/div>\u003cdiv class=\"covform\">'+\n      '\u003cdiv class=\"fld\">\u003clabel for=\"cf-ev\">Event Type\u003c/label>\u003cselect id=\"cf-ev\" data-cf=\"evType\">'+optList(LISTS.event,cf.evType)+'\u003c/select>\u003c/div>'+\n      '\u003cdiv class=\"fld\">\u003clabel for=\"cf-e\">Event\u003c/label>\u003cinput id=\"cf-e\" data-cf=\"event\" value=\"'+esc(cf.event)+'\" placeholder=\"For example: CI list submittal CIL-SUB-003\">\u003c/div>'+\n      '\u003cdiv class=\"fld\">\u003clabel for=\"cf-d\">Date\u003c/label>\u003cinput id=\"cf-d\" data-cf=\"date\" value=\"'+esc(cf.date||today())+'\" placeholder=\"YYYY-MM-DD\">\u003c/div>'+\n      '\u003cdiv class=\"fld\">\u003clabel for=\"cf-b\">Performed By\u003c/label>\u003cinput id=\"cf-b\" data-cf=\"by\" value=\"'+esc(cf.by||S.meta.who)+'\">\u003c/div>'+\n      '\u003cdiv class=\"fld wide\">\u003clabel for=\"cf-s\">Sources in Scope\u003c/label>\u003cinput id=\"cf-s\" data-cf=\"scope\" value=\"'+esc(cf.scope)+'\" placeholder=\"'+esc(logFields(cov).scope)+'\">\u003c/div>\u003c/div>'+\n      '\u003cdiv class=\"btnrow\">\u003cbutton class=\"btn pri\" data-act=\"cov-record\">Record '+esc(nid)+'\u003c/button>\u003cspan class=\"small\">Recording runs the check again on the current register. Each exception gets an owner and a due date on the Exceptions tab.\u003c/span>\u003c/div>\u003c/div>';\n  }\n  h+='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Coverage Log\u003c/div>'+(S.checks.length?logTableHTML():'\u003cp class=\"small\">No coverage check is recorded yet.\u003c/p>')+'\u003c/div>';\n  return h;\n}\nfunction logTableHTML(){\n  var h='\u003cdiv class=\"gridwrap\" style=\"max-height:none\">\u003ctable class=\"dt\">\u003cthead>\u003ctr>'+LCOLS.map(function(c){ return '\u003cth>'+esc(c.h)+'\u003c/th>'; }).join('')+'\u003c/tr>\u003c/thead>\u003ctbody>';\n  S.checks.slice().reverse().forEach(function(rec){\n    h+='\u003ctr>'+LCOLS.map(function(c){\n      var k=c.k, v=k==='disp'?checkDisp(rec):k==='status'?checkStatus(rec):rec[k];\n      if(k==='checkId') return '\u003ctd class=\"k\">'+esc(v)+'\u003c/td>';\n      if(k==='evType') return '\u003ctd>\u003cselect data-lf=\"evType\" data-li=\"'+esc(rec.checkId)+'\" aria-label=\"Event type\">'+optList(LISTS.event,v)+'\u003c/select>\u003c/td>';\n      if(k==='event'||k==='date'||k==='by'||k==='scope') return '\u003ctd>\u003cinput data-lf=\"'+k+'\" data-li=\"'+esc(rec.checkId)+'\" value=\"'+esc(v)+'\" aria-label=\"'+esc(c.h)+'\" style=\"min-width:'+(k==='date'?100:150)+'px\">\u003c/td>';\n      if(k==='status') return '\u003ctd>\u003cspan class=\"pill '+(v===CS.open?'bad':v===CS.disp?'hold':'ok')+'\">'+esc(v)+'\u003c/span>\u003c/td>';\n      return '\u003ctd class=\"m\" style=\"min-width:'+(k==='disp'?320:k==='model'?200:60)+'px\">'+esc(v==null?'':v)+'\u003c/td>';\n    }).join('')+'\u003c/tr>';\n  });\n  h+='\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"btnrow\">\u003cbutton class=\"btn sm gh\" data-act=\"cov-undo\">Remove '+esc(S.checks[S.checks.length-1].checkId)+', the latest check\u003c/button>'+\n    '\u003cspan class=\"small\">Disposition and Status follow the exceptions each check found. The log is kept for the program life. Remove a check only when it was recorded in error.\u003c/span>\u003c/div>';\n  return h;\n}\n\n/* ===================================================================\n   Exceptions\n   =================================================================== */\nfunction excHTML(){\n  var f=S.xf, q=f.q.toLowerCase();\n  var list=S.exc.filter(function(e){\n    if(f.state==='overdue'&&!overdue(e)) return false;\n    if(f.state&&f.state!=='overdue'&&e.state!==f.state) return false;\n    if(q&&[e.id,e.item,e.m,e.owner,e.action,e.disp,e.step].join(' ').toLowerCase().indexOf(q)\u003c0) return false;\n    return true;\n  });\n  var h='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Exceptions\u003c/div>\u003cp class=\"small\">One row per coverage exception. A recorded check writes each one once and carries it forward. Give every exception an owner and a due date. Record the disposition. Set Dispositioned when it is closed, for example when Systems Engineering confirms no interface exists behind a floor gap. A later check that no longer finds the exception marks it '+esc(XS.clear||'Cleared')+'.\u003c/p>'+\n    '\u003cdiv class=\"filters\" style=\"margin-top:10px\">\u003cdiv class=\"fld\">\u003clabel for=\"xs\">State\u003c/label>\u003cselect id=\"xs\" data-xf=\"state\">\u003coption value=\"\">Any state\u003c/option>'+(LISTS.exstate||[]).map(function(v){ return '\u003coption'+(f.state===v?' selected':'')+'>'+esc(v)+'\u003c/option>'; }).join('')+'\u003coption value=\"overdue\"'+(f.state==='overdue'?' selected':'')+'>Past due\u003c/option>\u003c/select>\u003c/div>'+\n    '\u003cdiv class=\"fld\" style=\"flex:1;min-width:220px\">\u003clabel for=\"xq\">Search\u003c/label>\u003cinput id=\"xq\" data-xf=\"q\" value=\"'+esc(f.q)+'\" placeholder=\"ID, item, owner, action, or disposition\">\u003c/div>\u003c/div>\u003c/div>';\n  if(!list.length) return h+'\u003cdiv class=\"sect\">\u003cp class=\"small\">'+(S.exc.length?'No exception matches the filter.':'No exceptions yet. Record a coverage check to track them.')+'\u003c/p>\u003c/div>';\n  h+='\u003cdiv class=\"gridwrap\" style=\"max-height:none\">\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>ID\u003c/th>\u003cth>Step\u003c/th>\u003cth>Item and finding\u003c/th>\u003cth>Owner\u003c/th>\u003cth>Due\u003c/th>\u003cth>Action\u003c/th>\u003cth>Disposition\u003c/th>\u003cth>State\u003c/th>\u003cth>Checks\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>';\n  list.forEach(function(e){\n    var od=overdue(e), st=STEPS[e.step]||{};\n    var cell=function(k,ctl,w){ return '\u003ctd id=\"xc-'+e.uid+'-'+k+'\" class=\"'+xcls(e,k).trim()+'\" style=\"min-width:'+w+'px\">'+ctl+'\u003c/td>'; };\n    var link=null; var r=/^S2\\|/.test(e.key)||/^S5\\|/.test(e.key)||/^S7R\\|/.test(e.key)||/^MA\\|/.test(e.key)?rowById(e.item):null;\n    if(r) link='\u003cbutton class=\"cibtn\" data-goto=\"'+r.uid+'\">'+esc(e.item)+'\u003c/button>';\n    else if(/^S3\\||^S7C\\||^S4\\|gfe/.test(e.key)) link='\u003cbutton class=\"cibtn\" data-byci-go=\"'+esc(e.item)+'\">'+esc(e.item)+'\u003c/button>';\n    else if(/^S4\\|pc/.test(e.key)) link='\u003cbutton class=\"cibtn\" data-byci-go=\"'+esc(e.item.split('/')[0])+'\">'+esc(e.item)+'\u003c/button>';\n    else if(/^S1\\||^S1U\\|/.test(e.key)) link='\u003cbutton class=\"cibtn\" data-srcsel=\"'+esc(e.item)+'\">'+esc(e.item)+'\u003c/button>';\n    else link='\u003cb>'+esc(e.item)+'\u003c/b>';\n    h+='\u003ctr class=\"'+(e.state===XS.clear?'cleared':'')+'\">\u003ctd class=\"k\">'+esc(e.id)+'\u003c/td>\u003ctd class=\"m\">'+esc(e.step==='MA'?'Model':'Step '+e.step.slice(1))+'\u003cbr>'+esc(st.name||'')+'\u003c/td>'+\n      '\u003ctd style=\"min-width:240px\">'+link+'\u003cdiv class=\"small\" style=\"margin-top:3px\">'+esc(e.m)+'\u003c/div>\u003c/td>'+\n      cell('owner','\u003cinput data-xe=\"'+e.uid+'\" data-xk=\"owner\" value=\"'+esc(e.owner)+'\" list=\"dl-own\" aria-label=\"Owner\">',180)+\n      cell('due','\u003cinput data-xe=\"'+e.uid+'\" data-xk=\"due\" value=\"'+esc(e.due)+'\" placeholder=\"YYYY-MM-DD\" aria-label=\"Due date\">'+(od?'\u003cdiv class=\"small over\" style=\"margin-top:3px\">'+plural(daysBetween(e.due,today()),'day')+' late\u003c/div>':''),110)+\n      cell('action','\u003cinput data-xe=\"'+e.uid+'\" data-xk=\"action\" value=\"'+esc(e.action)+'\" aria-label=\"Action reference\">',100)+\n      cell('disp','\u003ctextarea data-xe=\"'+e.uid+'\" data-xk=\"disp\" rows=\"2\" aria-label=\"Disposition\">'+esc(e.disp)+'\u003c/textarea>',240)+\n      '\u003ctd style=\"min-width:150px\">\u003cselect data-xe=\"'+e.uid+'\" data-xk=\"state\" aria-label=\"State\">'+optList(LISTS.exstate,e.state)+'\u003c/select>'+(e.state===XS.clear&&e.clearedBy?'\u003cdiv class=\"small\">by '+esc(e.clearedBy)+'\u003c/div>':'')+'\u003c/td>'+\n      '\u003ctd class=\"m\">'+esc(e.seen.join(', '))+'\u003c/td>\u003c/tr>';\n  });\n  return h+'\u003c/tbody>\u003c/table>\u003c/div>';\n}\n\n/* ===================================================================\n   Checks, edit log, reference\n   =================================================================== */\nfunction allRuleIds(){ return Object.keys(RULES).concat(Object.keys(CUST)); }\nfunction findItem(f){\n  if(f.kind==='src'){ var s=S.sources.filter(function(x){ return x.uid===f.uid; })[0]; return s?'\u003cbutton class=\"cibtn\" data-srcsel=\"'+esc(s.doc)+'\">'+esc(s.doc||'(no number)')+'\u003c/button>':''; }\n  if(f.kind==='exc'){ var e=S.exc.filter(function(x){ return x.uid===f.uid; })[0]; return e?'\u003cbutton class=\"cibtn\" data-tab=\"exc\">'+esc(e.id)+'\u003c/button>':''; }\n  var r=S.rows.filter(function(x){ return x.uid===f.uid; })[0]; return r?'\u003cbutton class=\"cibtn\" data-goto=\"'+r.uid+'\">'+esc(r.id||'(no ID)')+'\u003c/button>':'';\n}\nfunction checksHTML(){\n  var sv=S.csev, list=F.filter(function(f){ return !sv||f.sev===sv; });\n  var h=(S.hints?'':'\u003cdiv class=\"stale\">Hints are off. Cells are not shaded. The list below still shows every finding.\u003c/div>')+\n    '\u003cdiv class=\"filters\" style=\"align-items:center\">'+['','flag','review','note'].map(function(s){ var n=s?CNT[s]:F.length;\n      return '\u003cbutton class=\"btn sm'+(sv===s?' pri':'')+'\" data-csev=\"'+s+'\">'+(s?s.charAt(0).toUpperCase()+s.slice(1)+'s':'All')+' ('+n+')\u003c/button>'; }).join('')+\n    '\u003cspan class=\"small\">These are completeness hints on rows, sources, and exceptions. They never block entry. The coverage check is separate. It runs from the Coverage tab.\u003c/span>\u003c/div>';\n  if(!list.length) h+='\u003cdiv class=\"sect\">\u003cp class=\"small\">Nothing to show. '+(F.length?'Pick another filter.':'Every check passes.')+'\u003c/p>\u003c/div>';\n  else h+='\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>Severity\u003c/th>\u003cth>Rule\u003c/th>\u003cth>Item\u003c/th>\u003cth>Column\u003c/th>\u003cth>Finding\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    list.map(function(f){ return '\u003ctr>\u003ctd>\u003cspan class=\"sev '+f.sev+'\">'+f.sev+'\u003c/span>\u003c/td>\u003ctd class=\"k\">'+f.rule+'\u003c/td>\u003ctd>'+findItem(f)+'\u003c/td>\u003ctd class=\"m\">'+esc(f.kind==='row'&&f.k?hd(f.k):f.k||'')+'\u003c/td>\u003ctd>'+esc(f.m)+'\u003c/td>\u003c/tr>'; }).join('')+'\u003c/tbody>\u003c/table>';\n  h+='\u003ch2 style=\"font-family:var(--serif);font-weight:400;font-size:19px;margin:30px 0 10px\">Rule catalog\u003c/h2>'+\n    '\u003cp class=\"small\" style=\"margin-bottom:10px\">Every hint this build runs, and the part of the template or the process it comes from. Retired and superseded rows skip most checks. Rules marked CI Index run only while a snapshot is loaded.\u003c/p>'+\n    '\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>Rule\u003c/th>\u003cth>Severity\u003c/th>\u003cth>Area\u003c/th>\u003cth>What it checks\u003c/th>\u003cth>Basis\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    allRuleIds().map(function(k){ var x=ruleInfo(k), on=ruleOn(k); return '\u003ctr'+(on?'':' style=\"opacity:.5\"')+'>\u003ctd class=\"k\">'+k+'\u003c/td>\u003ctd>'+(on?'\u003cspan class=\"sev '+x.sev+'\">'+x.sev+'\u003c/span>':'\u003cspan class=\"sev note\">off\u003c/span>')+'\u003c/td>\u003ctd class=\"m\">'+esc(x.area)+'\u003c/td>\u003ctd>'+esc(x.what)+'\u003c/td>\u003ctd class=\"m\">'+esc(x.basis)+'\u003c/td>\u003c/tr>'; }).join('')+\n    '\u003c/tbody>\u003c/table>';\n  h+='\u003ch2 style=\"font-family:var(--serif);font-weight:400;font-size:19px;margin:30px 0 10px\">Coverage steps\u003c/h2>\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Reports as\u003c/th>\u003cth>What it checks\u003c/th>\u003cth>Basis\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    STEP_IDS.map(function(id){ var s=STEPS[id]; return '\u003ctr'+(s.on?'':' style=\"opacity:.5\"')+'>\u003ctd class=\"k\">'+id+' '+esc(s.name)+'\u003c/td>\u003ctd>'+(s.on?'\u003cspan class=\"sev '+(s.mode==='exception'?'flag':'review')+'\">'+(s.mode==='exception'?'exception':'finding')+'\u003c/span>':'\u003cspan class=\"sev note\">off\u003c/span>')+'\u003c/td>\u003ctd>'+esc(s.what)+'\u003c/td>\u003ctd class=\"m\">'+esc(s.basis)+'\u003c/td>\u003c/tr>'; }).join('')+'\u003c/tbody>\u003c/table>';\n  return h;\n}\nfunction logHTML(){\n  var h='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Compare with a saved register\u003c/div>'+\n    '\u003cp class=\"small\">Open an earlier saved file. The tool lists every row added, removed, or changed since then, field by field, and every source added, removed, or revised. Use it to prepare a CSA report.\u003c/p>'+\n    '\u003cdiv class=\"btnrow\">\u003cbutton class=\"btn\" data-act=\"cmp-open\">Compare with a saved file\u003c/button>'+(S.cmp?'\u003cbutton class=\"btn gh\" data-act=\"cmp-clear\">Clear the comparison\u003c/button>':'')+'\u003c/div>'+\n    (S.cmp?cmpHTML():'')+'\u003c/div>';\n  h+='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Edit log\u003c/div>\u003cp class=\"small\">Every change made in this tool, with who and when. Saved with the register file.'+(FEAT.sheets.log?' Exported to Excel on an Edit Log sheet.':'')+'\u003c/p>'+\n    '\u003cdiv class=\"filters\" style=\"margin-top:10px\">\u003cdiv class=\"fld\" style=\"min-width:260px\">\u003clabel for=\"lq\">Filter\u003c/label>\u003cinput id=\"lq\" data-lq=\"1\" value=\"'+esc(S.logq)+'\" placeholder=\"Interface ID, column, or name\">\u003c/div>\u003c/div>\u003cdiv id=\"logbox\">'+logTable()+'\u003c/div>\u003c/div>';\n  return h;\n}\nfunction logTable(){\n  var q=S.logq.toLowerCase();\n  var L=S.log.slice().reverse().filter(function(e){ return !q||[e.item,e.f,e.who,e.act,e.from,e.to].join(' ').toLowerCase().indexOf(q)>=0; });\n  if(!L.length) return '\u003cp class=\"small\">No entries.\u003c/p>';\n  return '\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>When\u003c/th>\u003cth>Who\u003c/th>\u003cth>Action\u003c/th>\u003cth>Item\u003c/th>\u003cth>Column\u003c/th>\u003cth>From\u003c/th>\u003cth>To\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    L.slice(0,500).map(function(e){ return '\u003ctr>\u003ctd class=\"m\" style=\"white-space:nowrap\">'+esc(e.t)+'\u003c/td>\u003ctd class=\"m\">'+esc(e.who)+'\u003c/td>\u003ctd>'+esc(e.act)+'\u003c/td>\u003ctd class=\"k\">'+esc(e.item)+'\u003c/td>\u003ctd class=\"m\">'+esc(e.f)+'\u003c/td>\u003ctd class=\"m\">'+esc(e.from)+'\u003c/td>\u003ctd>'+esc(e.to)+'\u003c/td>\u003c/tr>'; }).join('')+\n    '\u003c/tbody>\u003c/table>'+(L.length>500?'\u003cp class=\"small\">Showing the latest 500 of '+L.length+'. The saved file carries every entry.\u003c/p>':'');\n}\nfunction diffReg(old){\n  var out=[], om={}, nm={};\n  (old.rows||[]).forEach(function(r){ if(tr(r.id)) om[tr(r.id)]=r; });\n  S.rows.forEach(function(r){ if(tr(r.id)) nm[tr(r.id)]=r; });\n  Object.keys(nm).forEach(function(id){ var n=nm[id], o=om[id];\n    if(!o){ out.push({item:id,ch:'Row added',f:'',from:'',to:tr(n.a)+' / '+tr(n.b)}); return; }\n    COLS.forEach(function(c){ if(c.k==='id') return; var a=tr(o[c.k]), b=tr(n[c.k]); if(a!==b) out.push({item:id,ch:'Row changed',f:c.h,from:a,to:b}); }); });\n  Object.keys(om).forEach(function(id){ if(!nm[id]) out.push({item:id,ch:'Row removed',f:'',from:tr(om[id].a)+' / '+tr(om[id].b),to:''}); });\n  var os={}, ns={}; (old.sources||[]).forEach(function(s){ os[dkey(s.doc)]=s; }); S.sources.forEach(function(s){ ns[dkey(s.doc)]=s; });\n  Object.keys(ns).forEach(function(k){ var n=ns[k], o=os[k]; if(!k) return;\n    if(!o){ out.push({item:n.doc,ch:'Source added',f:'',from:'',to:'Rev '+(n.rev||'?')}); return; }\n    ['title','type','rev','rel','date'].forEach(function(f){ if(tr(o[f])!==tr(n[f])) out.push({item:n.doc,ch:'Source changed',f:f==='rel'?'Release Status':f==='rev'?'Rev':f.charAt(0).toUpperCase()+f.slice(1),from:tr(o[f]),to:tr(n[f])}); }); });\n  Object.keys(os).forEach(function(k){ if(k&&!ns[k]) out.push({item:os[k].doc,ch:'Source removed',f:'',from:'Rev '+(os[k].rev||'?'),to:''}); });\n  var oc={}; (old.checks||[]).forEach(function(c){ oc[c.checkId]=1; }); S.checks.forEach(function(c){ if(!oc[c.checkId]) out.push({item:c.checkId,ch:'Coverage check added',f:'',from:'',to:c.date+' '+c.event}); });\n  return out;\n}\nfunction cmpHTML(){\n  var d=diffReg(S.cmp.data);\n  var h='\u003cp class=\"small\" style=\"margin-top:12px\">\u003cb>Compared with '+esc(S.cmp.name)+'\u003c/b>, saved '+esc(S.cmp.data.saved||'on an unknown date')+'. '+plural(d.length,'difference')+'. The Excel export carries them on a Comparison sheet.\u003c/p>';\n  if(!d.length) return h+'\u003cp class=\"small\">The two registers match.\u003c/p>';\n  return h+'\u003ctable class=\"dt\" style=\"margin-top:8px\">\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Change\u003c/th>\u003cth>Column\u003c/th>\u003cth>Then\u003c/th>\u003cth>Now\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    d.map(function(x){ return '\u003ctr>\u003ctd class=\"k\">'+esc(x.item)+'\u003c/td>\u003ctd>'+esc(x.ch)+'\u003c/td>\u003ctd class=\"m\">'+esc(x.f)+'\u003c/td>\u003ctd class=\"m\">'+esc(x.from)+'\u003c/td>\u003ctd>'+esc(x.to)+'\u003c/td>\u003c/tr>'; }).join('')+'\u003c/tbody>\u003c/table>';\n}\nfunction refHTML(){\n  var h='\u003cdiv class=\"sect ref\">';\n  (C.reference||[]).forEach(function(s,i){\n    if(s.title) h+=(i?'\u003ch3>':'\u003cdiv class=\"lab\">')+esc(s.title)+(i?'\u003c/h3>':'\u003c/div>');\n    if(s.kind==='list') h+='\u003cul>'+(s.items||[]).map(function(x){ return '\u003cli>'+md(x)+'\u003c/li>'; }).join('')+'\u003c/ul>';\n    else if(s.kind==='pull') h+=(s.items||[]).map(function(x){ return '\u003cp class=\"pull\">'+md(x)+'\u003c/p>'; }).join('');\n    else h+=(s.items||[]).map(function(x){ return '\u003cp class=\"small\" style=\"margin:0 0 8px\">'+md(x)+'\u003c/p>'; }).join('');\n  });\n  h+='\u003ch3>CI Index column map\u003c/h3>\u003cp class=\"small\" style=\"margin-bottom:10px\">What the register reads when it loads a CI Index. The same map sits on the snapshot card and on the CI Index Column Map sheet of the Excel export.\u003c/p>'+ixMapHTML();\n  h+='\u003ch3>Interface source types\u003c/h3>\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Name\u003c/th>\u003cth>ICD cross-check\u003c/th>\u003cth>Guessed from a document number that matches\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    STYPES.map(function(t){ return '\u003ctr>\u003ctd class=\"k\">'+esc(t.v)+'\u003c/td>\u003ctd>'+esc(t.name||'')+'\u003c/td>\u003 ||''; if(has('var')) r.var='All'; if(has('safe')) r.safe='N'; if(has('alloc')) r.alloc='N';\n  if(a) r.a=a; if(b) r.b=b;\n  return r;\n}\nfunction addRow(r,how){\n  S.rows.push(r); logEdit(r.id,null,'',tr(r.a)+' / '+tr(r.b),how||'Add row');\n  S.sel=r.uid; S.tab='reg'; S.rq=''; S.rmap=''; dirty(); render();\n  var n=$('f-'+(tr(r.a)?'b':'a')); if(n) n.focus();\n}\nfunction setField(r,k,v,act){ var o=tr(r[k]); v=tr(v); if(o===v) return; r[k]=v; logEdit(r.id,k,o,v,act); }\nfunction renameRowId(r,old,nw){\n  if(!old||!nw||old===nw) return;\n  var n=0;\n  S.rows.forEach(function(x){ var t=splitIds(x.supby); if(t.indexOf(old)>=0){ x.supby=t.map(function(y){ return y===old?nw:y; }).join('; '); n++; } });\n  S.exc.forEach(function(e){ if(e.item===old){ e.item=nw; n++; } if(e.key.split('|')[1]===old){ var p=e.key.split('|'); p[1]=nw; e.key=p.join('|'); } });\n  S.checks.forEach(function(c){ var i=(c.rows||[]).indexOf(old); if(i>=0) c.rows[i]=nw; });\n  if(n){ logEdit(nw,null,old,nw,'Rename ('+plural(n,'reference')+' updated)'); msg('Renamed '+old+' to '+nw+'. Updated '+plural(n,'reference')+'.'); }\n}\nfunction applySugg(r){\n  var s=suggest(r); if(!s) return;\n  setField(r,'map',s.map,'Apply suggested mapping'); setField(r,'bnd',s.bnd,'Apply suggested mapping');\n  dirty(); render(); msg('Mapping set to '+s.map+(s.bnd?', '+s.bnd:'')+'.');\n}\n\n/* ===================================================================\n   Split and consolidation guides\n   =================================================================== */\nfunction wizTableHTML(){\n  var w=S.wiz, rows=rowsOn(w.ci).filter(active), ids=w.news.map(tr).filter(Boolean);\n  var opts=function(r,v){\n    var o='\u003coption value=\"\">Leave for now\u003c/option>';\n    ids.forEach(function(x){ o+='\u003coption value=\"'+esc(x)+'\"'+(v===x?' selected':'')+'>'+(r.map===MS.internal?'Internal on ':'Re-map to ')+esc(x)+'\u003c/option>'; });\n    if(r.map!==MS.internal&&ids.length>1) o+='\u003coption value=\"*\"'+(v==='*'?' selected':'')+'>One row for each new CI\u003c/option>';\n    if(r.map===MS.internal) for(var i=0;i\u003cids.length;i++) for(var j=i+1;j\u003cids.length;j++){ var k=ids[i]+'~'+ids[j]; o+='\u003coption value=\"'+esc(k)+'\"'+(v===k?' selected':'')+'>Now between '+esc(ids[i])+' and '+esc(ids[j])+'\u003c/option>'; }\n    return o;\n  };\n  return rows.length?'\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>'+esc(hd('id'))+'\u003c/th>\u003cth>Other side\u003c/th>\u003cth>'+esc(hd('map'))+'\u003c/th>\u003cth>Goes to\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    rows.map(function(r){ var o=tr(r.a)===w.ci?tr(r.b):tr(r.a); return '\u003ctr>\u003ctd class=\"k\">'+esc(r.id)+'\u003c/td>\u003ctd class=\"m\">'+esc(o)+'\u003c/td>\u003ctd>'+esc(r.map)+'\u003c/td>\u003ctd>\u003cselect data-wt=\"'+r.uid+'\" aria-label=\"Where '+esc(r.id)+' goes\">'+opts(r,w.map[r.uid]||'')+'\u003c/select>\u003c/td>\u003c/tr>'; }).join('')+'\u003c/tbody>\u003c/table>':'\u003cp class=\"small\">No active rows land on '+esc(w.ci)+'.\u003c/p>';\n}\nfunction wizHTML(){\n  var w=S.wiz; if(!w||w.ci!==S.byci) return '';\n  if(w.type==='split'){\n    return '\u003cdiv class=\"panel\">\u003cdiv class=\"lab\">Split '+esc(w.ci)+'\u003c/div>'+\n      '\u003cp>A split re-maps every row that landed on the old CI. Name the new CIs. Then pick where each row goes. The tool copies each row under a new Interface ID, sets the old row to '+esc(RS.sup)+', and writes the Superseded By trace. Re-map the old CI\u2019s Internal rows too. An interface inside the old CI may now cross the new boundary.\u003c/p>'+\n      '\u003cp>Add the new CIs to the CI Index first, then reload the snapshot. The tool then knows their tiers and sets each boundary type.\u003c/p>'+\n      w.news.map(function(x,i){ return '\u003cdiv class=\"row2\">\u003cspan class=\"small\" style=\"padding-top:6px\">New CI '+(i+1)+'\u003c/span>\u003cinput type=\"text\" data-wn=\"'+i+'\" value=\"'+esc(x)+'\" list=\"dl-ci\" placeholder=\"New CI ID\" aria-label=\"New CI ID '+(i+1)+'\">\u003c/div>'; }).join('')+\n      '\u003cdiv class=\"btnrow\" style=\"margin:4px 0 10px\">\u003cbutton class=\"btn sm\" data-act=\"wiz-addnew\">Add another new CI\u003c/button>\u003c/div>'+\n      '\u003cdiv id=\"wiztab\">'+wizTableHTML()+'\u003c/div>'+\n      '\u003cdiv class=\"btnrow\">\u003cbutton class=\"btn sm pri\" data-act=\"wiz-apply\">Re-map the rows\u003c/button>\u003cbutton class=\"btn sm gh\" data-act=\"wiz-close\">Cancel\u003c/button>\u003c/div>\u003c/div>';\n  }\n  var ch=ciChoices().filter(function(x){ return x.id!==w.ci; });\n  return '\u003cdiv class=\"panel\">\u003cdiv class=\"lab\">Consolidate '+esc(w.ci)+'\u003c/div>'+\n    '\u003cp>A consolidation puts the interfaces between the old CIs inside one CI. Pick the CIs that join '+esc(w.ci)+', and name the new CI. Each row between the old CIs is superseded by an Internal row on the new CI, with the reason in Notes. Each other row is re-mapped to the new CI.\u003c/p>'+\n    '\u003cdiv class=\"cklist\">'+(ch.length?ch.map(function(x){ return '\u003clabel>\u003cinput type=\"checkbox\" data-wp=\"'+esc(x.id)+'\"'+(w.pick[x.id]?' checked':'')+'> '+esc(x.label)+'\u003c/label>'; }).join(''):'\u003cspan class=\"small\">No other CIs.\u003c/span>')+'\u003c/div>'+\n    '\u003cdiv class=\"row2\">\u003cspan class=\"small\" style=\"padding-top:6px\">New CI ID\u003c/span>\u003cinput type=\"text\" data-wc=\"1\" value=\"'+esc(w.nid)+'\" list=\"dl-ci\" placeholder=\"New CI ID\" aria-label=\"New CI ID\">\u003c/div>'+\n    '\u003cdiv class=\"btnrow\">\u003cbutton class=\"btn sm pri\" data-act=\"wiz-apply\">Re-map the rows\u003c/button>\u003cbutton class=\"btn sm gh\" data-act=\"wiz-close\">Cancel\u003c/button>\u003c/div>\u003c/div>';\n}\nfunction bndFor(n){ var s=suggest(n); return s&&s.map===MS.mapped?s.bnd:n.bnd; }\nfunction applySplit(){\n  var w=S.wiz, old=w.ci, ids=w.news.map(tr).filter(Boolean);\n  if(ids.length\u003c2){ msg('Name at least two new CIs.'); return; }\n  if(ids.some(fun z","h":"Hazard Control Ref","kind":"text","w":13,"help":"The hazard control the interface carries or bounds. Blank where Safety-Related = N.","group":"Safety","wide":false,"core":false,"req":"","alias":[]},{"k":"rstat","h":"Row Status","kind":"enum","w":11,"help":"Active, Retired, or Superseded. Never delete a row. Set Retired where the interface source no longer defines the interface. Set Superseded when a split or a consolidation re-maps the row.","group":"Status","wide":false,"core":true,"req":"","alias":[],"list":"rstat"},{"k":"supby","h":"Superseded By","kind":"ids","w":14,"help":"The replacing Interface IDs, separated by semicolons.","group":"Status","wide":false,"core":false,"req":"","alias":[]},{"k":"notes","h":"Notes","kind":"long","w":60,"help":"Short notes. Point to the owning record rather than copying its content.","group":"Notes","wide":true,"core":false,"req":"","alias":[]}],"groups":["Identification and mapping","Sides","Interface sources and incorporation","Control","Supplier","Safety","Model and variants","Status","Notes"],"lcols":[{"k":"checkId","h":"Check ID","w":9},{"k":"evType","h":"Event Type","w":16},{"k":"event","h":"Event","w":24},{"k":"date","h":"Date","w":11},{"k":"scope","h":"Sources in Scope","w":26},{"k":"nMap","h":"Rows Mapped","w":9},{"k":"nInt","h":"Rows Internal","w":9},{"k":"nUnm","h":"Rows Unmapped","w":9},{"k":"ciNot","h":"CIs Not Covered","w":16},{"k":"floor","h":"Floor Gaps","w":18},{"k":"uninv","h":"Uninvoked Rows","w":14},{"k":"icd","h":"ICD Cross-Check","w":18},{"k":"safety","h":"Safety Exceptions","w":18},{"k":"model","h":"Model Alignment Findings","w":30},{"k":"disp","h":"Disposition","w":70},{"k":"status","h":"Status","w":16},{"k":"by","h":"Performed By","w":16}],"lists":{"map":{"name":"Mapping Status","core":true,"items":[{"v":"Mapped","m":"mapped","ab":"MAP"},{"v":"Internal","m":"internal","ab":"INT"},{"v":"Unmapped","m":"unmapped","ab":"UNM"}]},"bnd":{"name":"Boundary Type","core":true,"items":[{"v":"Same-Tier","m":"s
