ars on at least one active row.","basis":"Coverage checks, Step 1","revs":true,"unlisted":true},"S2":{"on":true,"mode":"exception","name":"Landing","what":"Every active row is Mapped or Internal. An Unmapped row is an exception.","basis":"Coverage checks, Step 2"},"S3":{"on":true,"mode":"exception","name":"CI coverage","what":"Every CI in the CI index that is not de-designated or superseded appears on at least one Mapped row.","basis":"Coverage checks, Step 3"},"S4":{"on":true,"mode":"exception","name":"Structural floor","what":"Each parent and child in different control tiers shares a Mapped row. Each GFE CI appears on a Mapped row. Each named external item appears on an External row.","basis":"Coverage checks, Step 4","pc":true,"gfe":true,"ext":true},"S5":{"on":true,"mode":"exception","name":"Incorporation","what":"Every Mapped row names an Invoking Specification.","basis":"Coverage checks, Step 5"},"S6":{"on":true,"mode":"exception","name":"ICD cross-check","what":"Each ICD on a CI’s index row appears on a register row for that CI. Each ICD, IRS, and IDD on a Mapped row appears on the index row of each side CI.","basis":"Coverage checks, Step 6"},"S7":{"on":true,"mode":"exception","name":"Safety cross-check","what":"Each safety-related row has a side CI with Criterion (b) Met = Y. Each SCI with no SCI child CI has a safety-related row.","basis":"Coverage checks, Step 7"},"MA":{"on":true,"mode":"finding","name":"Model alignment","what":"A Mapped row between two modeled CIs cites an MBSE Interface Element ID, unless a side CI carries a model alignment exception.","basis":"Coverage checks, Model alignment"}},"rules":{"ID1":{"on":true,"sev":"flag","area":"Identification","what":"Every row carries an Interface ID.","basis":"Column notes, Interface ID","needs":["id"]},"ID2":{"on":true,"sev":"flag","area":"Identification","what":"Each Interface ID is unique.","basis":"Column notes, Interface ID","needs":["id"]},"MS1":{"on":true,"sev":"flag","area":"Completeness","what":"Every row has a Mapping Status.","basis":"How to use, completeness checks","needs":["map"]},"MS2":{"on":true,"sev":"flag","area":"Completeness","what":"Every row names an interface source.","basis":"How to use, completeness checks","needs":["src"]},"MS3":{"on":true,"sev":"flag","area":"Completeness","what":"A Mapped row has a Boundary Type.","basis":"How to use, completeness checks","needs":["map","bnd"]},"MS4":{"on":true,"sev":"flag","area":"Completeness","what":"A Mapped row names its Invoking Specification.","basis":"How to use, completeness checks","needs":["map","inv"]},"MS5":{"on":true,"sev":"flag","area":"Completeness","what":"Internal and Unmapped rows leave Boundary Type blank.","basis":"How to use, completeness checks","needs":["map","bnd"]},"MS6":{"on":true,"sev":"review","area":"Completeness","what":"An active Unmapped row stays highlighted until it is dispositioned.","basis":"How to use, completeness checks","needs":["map"]},"MS7":{"on":true,"sev":"flag","area":"Completeness","what":"Safety-Related = Y needs a Hazard Control Ref.","basis":"How to use, completeness checks","needs":["safe","haz"]},"MS8":{"on":true,"sev":"flag","area":"Completeness","what":"Allocated to Supplier = Y needs an SSOW.","basis":"How to use, completeness checks","needs":["alloc","ssow"]},"MS9":{"on":true,"sev":"flag","area":"Completeness","what":"Row Status = Superseded needs Superseded By.","basis":"How to use, completeness checks","needs":["rstat","supby"]},"SD1":{"on":true,"sev":"review","area":"Sides","what":"Side A and Side B are both filled.","basis":"Column notes, Side A and Side B","needs":["a","b"]},"SD2":{"on":true,"sev":"flag","area":"Sides","what":"An Internal row names the same CI on both sides.","basis":"Column notes, Side A and Side B","needs":["map","a","b"]},"SD3":{"on":true,"sev":"review","area":"Sides","what":"A Mapped row with the same CI on both sides reads Internal.","basis":"How to use, Mapping Status","needs":["map","a","b"]},"IX1":{"on":true,"sev":"review","area":"CI Index","what":"Side A is a CI in the CI Index snapshot.","basis":"Column notes, Side A and Side B","needs":["a"],"ix":true},"IX2":{"on":true,"sev":"review","area":"CI Index","what":"Both sides of a Same-Tier or Control-Level row are CIs in the snapshot.","basis":"Column notes, Boundary Type","needs":["bnd","a","b"],"ix":true},"IX3":{"on":true,"sev":"review","area":"CI Index","what":"Side B of an External or Shared row is not a CI.","basis":"Column notes, Boundary Type","needs":["bnd","b"],"ix":true},"IX4":{"on":true,"sev":"review","area":"CI Index","what":"Boundary Type agrees with the control tiers of the two CIs.","basis":"Column notes, Boundary Type","needs":["map","bnd","a","b"],"ix":true},"IX5":{"on":true,"sev":"review","area":"CI Index","what":"An active row does not land on a de-designated or superseded CI.","basis":"How to use, splits and consolidations","needs":["a","b","rstat"],"ix":true},"IX6":{"on":true,"sev":"review","area":"CI Index","what":"A safety-related row has a side CI with Criterion (b) Met = Y.","basis":"Coverage checks, Step 7","needs":["safe","a","b"],"ix":true},"SR1":{"on":true,"sev":"review","area":"Sources","what":"Each interface source carries its revision, as document §x Rev y.","basis":"Column notes, ICD(s) and Other Interface Sources","needs":["src"]},"SR2":{"on":true,"sev":"review","area":"Sources","what":"Each cited revision matches the revision on the source list.","basis":"Coverage checks, Step 1","needs":["src"]},"SR3":{"on":true,"sev":"note","area":"Sources","what":"Each cited source is on the source list.","basis":"Coverage checks, Step 1","needs":["src"]},"CT1":{"on":true,"sev":"review","area":"Control","what":"A Mapped row records its Controlling Baseline and Control Authority.","basis":"Column notes, Controlling Baseline and Control Authority","needs":["map","base","auth"]},"CT2":{"on":true,"sev":"review","area":"Control","what":"SSOW stays blank unless Allocated to Supplier = Y.","basis":"Column notes, SSOW","needs":["alloc","ssow"]},"CT3":{"on":true,"sev":"review","area":"Control","what":"Hazard Control Ref stays blank unless Safety-Related = Y.","basis":"How to use, safety-related interfaces","needs":["safe","haz"]},"CT4":{"on":true,"sev":"review","area":"Control","what":"Variant Applicability is recorded.","basis":"How to use, Variant Applicability","needs":["var"]},"SU1":{"on":true,"sev":"flag","area":"Supersession","what":"Every ID in Superseded By exists on the register.","basis":"How to use, never delete a row","needs":["supby"]},"SU2":{"on":true,"sev":"review","area":"Supersession","what":"A row that names Superseded By reads Superseded.","basis":"Column notes, Row Status","needs":["rstat","supby"]},"SL1":{"on":true,"sev":"flag","area":"Source list","what":"Each source document number is unique.","basis":"Coverage checks, Step 1","needs":[]},"SL2":{"on":true,"sev":"review","area":"Source list","what":"A released source records its revision.","basis":"Coverage checks, Step 1","needs":[]},"SL3":{"on":true,"sev":"review","area":"Source list","what":"A source carries a type from the source type list.","basis":"Build settings, source types","needs":[]},"EX1":{"on":true,"sev":"review","area":"Exceptions","what":"An open exception names an owner and a due date.","basis":"Coverage checks: give every exception an owner and a due date","needs":[]},"EX2":{"on":true,"sev":"flag","area":"Exceptions","what":"An open exception is not past its due date.","basis":"Coverage checks: give every exception an owner and a due date","needs":[]},"EX3":{"on":true,"sev":"review","area":"Exceptions","what":"A dispositioned exception records its disposition.","basis":"Process, coverage exception dispositions","needs":[]},"LS1":{"on":true,"sev":"review","area":"Lists","what":"A dropdown column holds a value from its list.","basis":"Lists sheet","needs":[]},"TY1":{"on":true,"sev":"review","area":"Format","what":"A number or date column holds a number or a date.","basis":"Build settings","needs":[]}},"custom":[],"idx":{"fields":[{"k":"id","h":"CI ID","alias":[],"use":"Every check that reads the index. Side A and Side B match on it.","blank":"The row is skipped. CI ID is the only entry the register requires."},{"k":"parent","h":"Parent CI ID","alias":[],"use":"Step 4 parent and child pairs. Step 7 SCI child test. The hierarchy in By CI, the matrix, and the diagram.","blank":"The CI is treated as top level. No parent and child pair is checked for it."},{"k":"name","h":"CI Name / Nomenclature","alias":["CI Name"],"use":"Labels in By CI, the row form, the matrix, and the diagram.","blank":"The CI shows by ID only. No check reads the name."},{"k":"type","h":"CI Type","alias":[],"use":"Shown in By CI.","blank":"No effect on any check."},{"k":"tier","h":"Control Tier","alias":["Control"],"use":"Step 4 parent and child pairs and GFE CIs. Hint IX4. The suggested boundary type.","blank":"Step 4 lists each pair with this CI as not evaluated. The suggestion cannot tell Same-Tier from Control-Level."},{"k":"pin","h":"PIN","alias":[],"use":"Kept in the snapshot for reference.","blank":"No effect on any check."},{"k":"icd","h":"ICD (optional)","alias":["ICD"],"use":"Step 6 ICD cross-check, in both directions.","blank":"Step 6 has nothing to check from the index side. A Mapped row on this CI that cites an ICD, IRS, or IDD is listed as not evaluated, or raised as an exception if the build says so."},{"k":"mbse","h":"MBSE Element ID","alias":[],"use":"Model alignment report. A CI with a model element counts as modeled.","blank":"The CI counts as not modeled. Rows on it raise no model alignment finding."},{"k":"mae","h":"Model Alignment Exception","alias":[],"use":"Model alignment report. Rows on this CI are exempt.","blank":"No exemption."},{"k":"critB","h":"Criterion (b) Met (Y/N)","alias":[],"use":"Step 7. A safety-related row needs a side CI with Y. Hint IX6.","blank":"A safety-related row whose side CIs all leave it blank is listed as not evaluated, or raised as an exception if the build says so."},{"k":"sci","h":"SCI (Y/N)","alias":[],"use":"Step 7. An SCI with no SCI child needs a safety-related row.","blank":"The CI counts as not SCI. Step 7 does not check it, and it does not count as an SCI child. The coverage results count these CIs."},{"k":"status","h":"Status","alias":[],"use":"Steps 3, 4, 6, and 7 skip de-designated and superseded CIs. Hint IX5.","blank":"The CI counts as live, so every step checks it."}],"sheets":["CI Index","CI Index Snapshot"],"tiers":{"acq":"Acquirer-spec controlled","co":"Company-spec controlled","gfe":"GFE"},"retired":["De-designated","Superseded (split)","Superseded (consolidated)"],"yes":"Y","staleDays":30,"blankNotEval":true},"owners":["Systems Engineering","System Safety","CM","Supplier Requirements Engineering","Human Factors"],"instr":[{"title":"","kind":"para","items":["Rev C DRAFT. Per the interface identification, verification, and recording section and the records and outputs section of the CI Identification Process. Maintained current in the CSA system. Interface requirement identification is mandatory for safety. Systems Engineering’s interface sources are the evidence that it was performed. The register and the Coverage Log are CM’s evidence that every identified interface was mapped to the CI structure, incorporated into the configuration documentation, and placed under configuration control."]},{"title":"What this register is","kind":"list","items":["The register maps interfaces to the CI structure. Systems Engineering identifies and defines each interface in an interface source. CM maps it to the CIs it joins. The register records the mapping.","The register points to the interface sources. It does not copy interface content, and it does not repeat Systems Engineering’s work. The ICDs, specifications, drawings, and model hold the content. The register is not an interface diagram.","A row records the interface between two sides. It is not scoped to a document. One ICD often defines several interfaces between several CIs, so it appears on every row it defines. One interface defined in several sources lists every source on its row.","Each column holds a fixed property of the row. Coverage check results are events, so they go on the Coverage Log."]},{"title":"How to use","kind":"list","items":["Enter data only on the ‘Interface Register’ and ‘Coverage Log’ sheets, below the header row. The ‘By CI’ sheet is a read-only view. Type a CI ID in its yellow cell to list every row that CI appears on.","Systems Engineering identifies and defines interfaces in the interface sources the CM plan names. CM maps each interface as its source is released or revised. Human Factors identifies human system interfaces. Each one is defined in the interface source for the interface it sits on, or in the specification of the CI the person operates or maintains. It takes no row of its own. System Safety identifies interfaces that carry a hazard risk control. Supplier Requirements Engineering confirms which supplier holds an interface under contract.","Interface sources: interface control documents, interface requirements specifications, and interface design descriptions; the interface sections of specifications, source control drawings, and drawings; and, where MBSE is used, interface elements between model elements at the CI-designation level. The CM plan names the sources for the program.","One row per interface between two sides. The two sides are two CIs, a CI and an external item, or a CI and a shared interface. A pair of sides takes more than one row only where its variants carry distinct interface callouts, or where its interfaces sit under different control authorities.","A shared interface, such as a data bus defined by one ICD, takes one row per participating CI. Side B names the shared interface. A ten-terminal bus takes ten rows, not forty-five.","Mapping Status. Mapped: the interface joins two CIs, a CI and an external item, or a CI and a shared interface. Internal: the interface lies within one CI. Record it, so a later split can re-map it. Unmapped: a side resolves to no CI and no named external item. The row is a coverage exception until it is dispositioned.","External items include other systems, facilities, support equipment, and existing customer items the work installs into or connects to. Customer test equipment the work must interface with is External too. CIs that exist only between a sub-supplier and the company have no rows here.","Variant Applicability identifies which PIN variants of a CI a row applies to: ‘All’, specific variant PINs, or ‘N/A’. Where one ICD carries distinct callouts for different variants, use one row per callout. Appearing on the same ICD is not evidence of a common interface.","Never delete a row. A split re-maps every row that landed on the old CI. Set the old row to Superseded and enter the re-mapped Interface IDs in Superseded By. Re-map the old CI’s Internal rows too. A consolidation puts the interfaces between the old CIs inside one CI. Supersede each such row with an Internal row and say why in Notes. Set Row Status = Retired where the interface source no longer defines the interface.","Safety-related interfaces, those that carry or bound a hazard risk control, get Safety-Related = Y and the hazard control reference.","Interface requirements flow into the configuration documentation and are controlled once baselined. Changes to a baselined interface go through formal change action. Both are mandatory for safety. Invoking Specification shows where the flow happens.","Completeness checks highlight a cell for review. They do not block entry. Every row needs a Mapping Status and an interface source. Mapped needs Boundary Type and Invoking Specification. Internal and Unmapped leave Boundary Type blank. An active Unmapped row stays highlighted until it is dispositioned. Safety-Related = Y needs Hazard Control Ref. Allocated to Supplier = Y needs SSOW. Row Status = Superseded needs Superseded By."]},{"title":"Coverage checks","kind":"list","items":["Run a coverage check at CI-list submittal for Acquirer concurrence, at each technical review, and before each baseline is established. Record each check as one row on the Coverage Log. Give every exception an owner and a due date.","Step 1, source coverage. Every released interface source the CM plan names is mapped. Each interface it defines has a row. An interface with no row is an exception.","Step 2, landing. Every row is Mapped or Internal. An Unmapped row is an exception.","Step 3, CI coverage. Every CI in the CI index that is not de-designated or superseded appears on at least one Mapped row. A CI that no interface lands on is an exception.","Step 4, structural floor. CM checks three facts from the CI index and the contract alone. Each parent and child in different control tiers shares a Mapped row. Each GFE CI appears on a Mapped row. Each external item named in the system specification or the contract appears on an External row. A floor gap is an exception. Where Systems Engineering confirms that no interface exists, record that confirmation as the disposition. Nothing is signed in advance.","Step 5, incorporation. Every Mapped row names an Invoking Specification. A released interface that no specification invokes is an exception. Incorporation is mandatory for safety.","Step 6, ICD cross-check. Where a CI’s index row lists ICDs, each one appears in ICD(s) and Other Interface Sources on at least one row for that CI. Each ICD, IRS, and IDD on a Mapped row appears in the ICD column of each side CI’s index row. External items and shared interfaces are exempt. Specifications, source control drawings, and drawings are not checked.","Step 7, safety cross-check. A row with Safety-Related = Y has at least one side CI with Criterion (b) Met = Y in the CI index. A CI with SCI = Y and no SCI child CI has at least one Safety-Related row, unless System Safety records that none of its interfaces carries or bounds a hazard risk control. Cite that record with the exception.","Model alignment. Where MBSE is used, a Mapped row between two modeled CIs that cites no MBSE Interface Element ID goes to Systems Engineering as a model alignment finding. The exception is a side CI that carries a Model Alignment Exception in the CI index. CM reports the finding. CM does not correct the model.","The check verifies coverage, not technical content. Systems Engineering and the technical review process verify technical adequacy. No register finds an interface that nobody identified. That stays with Systems Engineering, through the model and the technical reviews."]},{"title":"Sheets the tool adds","kind":"list","items":["The CI Interface Register tool wrote this workbook. Its first five sheets follow the template. The sheets after Lists come from the tool.","Sources lists each interface source the CM plan names, with its type, revision, and release status. Coverage Step 1 reads it.","External Items lists each external item named in the system specification or the contract. The structural floor reads it.","Exceptions holds one row per coverage exception, with its owner, due date, action, disposition, and state. The Coverage Log Disposition cell is built from it.","Checks lists every completeness finding, its rule, and its cell. A cell shaded red carries a flag. A cell shaded amber carries a review item.","CI Index Snapshot holds the CI Index data the coverage check used. The CI Index stays the record.","CI Index Column Map lists each CI Index column the register reads, the header it accepts, what reads it, and what a blank cell does. CI ID is the only column a row needs to load."]}],"reference":[{"title":"What this register is","kind":"list","items":["The register maps interfaces to the CI structure. Systems Engineering identifies and defines each interface in an interface source. CM maps it to the CIs it joins. The register records the mapping.","The register points to the interface sources. It does not copy interface content, and it does not repeat Systems Engineering’s work. The ICDs, specifications, drawings, and model hold the content. The register is not an interface diagram.","A row records the interface between two sides. It is not scoped to a document. One ICD often defines several interfaces between several CIs, so it appears on every row it defines. One interface defined in several sources lists every source on its row.","Each column holds a fixed property of the row. Coverage check results are events, so they go on the Coverage Log."]},{"title":"Definitions","kind":"list","items":["**Interface.** The functional and physical characteristics at a common boundary. (EIA-649-1A)","**Interface source.** An artifact in which Systems Engineering identifies and defines interfaces, and which the program CMP names as an interface source. Interface sources include interface control documents, interface requirements specifications, interface design descriptions, the interface sections of specifications, source control drawings, and drawings, and, where MBSE is used, interface elements between model elements at the CI-designation level. One interface source may define interfaces between several pairs of items. One interface may be defined in several interface sources. (CI Identification Process)","**Interface control documentation (ICD).** Interface control drawings, requirements, or other descriptive products, which define, describe, and/or depict physical, functional, and test interface of related or co-functioning Configuration Items. (EIA-649-1A)","**Interface control working group (ICWG).** For programs, which encompass a system, Configuration Item or a Computer software Configuration item (CSCI) design cycle, an ICWG is established to control interface activity among the Acquirer, Supplier(s), or other agencies including documentation of interface agreements and resolution of interface problems. (EIA-649-1A)","**Control Tier.** The record of who baselines and controls a CI’s specification. The three tiers are Acquirer-spec controlled, Company-spec controlled, and GFE. (CI Identification Process)"]},{"title":"","kind":"pull","items":["CM owns coverage. Systems Engineering owns content."]},{"title":"How the tool works","kind":"list","items":["**Enter what you have.** Partial rows are normal. Hints shade a cell for review. They never block entry. Turn them off with Show hints.","**The coverage check runs when you press the button.** Nothing runs on its own. Run it as often as you like. Record it only at the events the process names: CI-list submittal, each technical review, and before each baseline.","**Exceptions carry forward.** Recording a check writes each exception once. The next check finds the same gap and updates it. It does not open a second one. An exception the next check no longer finds is marked Cleared.","**The CI Index is a reference, not a gate.** Load a CI Index save file or Excel export as a snapshot. Steps 3, 4, 6, and 7 and the model alignment report read it. Without it, those steps read Not run. Everything else works.","**The index can be partial.** A row needs only a CI ID to load. A blank cell never stops the load. The coverage check lists what it could not evaluate, so a gap in the index shows as a gap, not as a pass. The column map below says what each column feeds.","**The source list feeds Step 1.** List each interface source the CM plan names, with its revision and release status. The tool flags rows that cite an older revision. Seed the list from the rows already entered.","**Views.** By CI lists every row on one CI. The interface map shows an N-squared matrix and a node-and-line diagram. Sources shows the impact of a source revision on rows and CIs.","**Rows are retired or superseded, not deleted.** A row counted by a recorded coverage check cannot be deleted. The split and consolidation guides re-map rows and write the Superseded By trace.","**Save keeps everything.** The saved file holds the register, the Coverage Log, the exceptions, the source list, the CI Index snapshot, and the edit log. The Excel export follows the template, with the By CI sheet live. Import reads the template or a prior export."]}],"examples":{"rows":[{"id":"IF-0001","map":"Mapped","bnd":"External","a":"CI-0001","b":"Ground Support System (customer equipment)","src":"ICD-1000-501 Rev C","inv":"SS-1000","base":"FBL","auth":"CCB + ICWG","alloc":"N","ssow":"","mbse":"if.AV-GSS","var":"All","safe":"N","haz":"","rstat":"Active","supby":"","notes":"System-boundary data link. The structural floor names the Ground Support System as an external item. Control Authority records the ICWG control."},{"id":"IF-0002","map":"Mapped","bnd":"Same-Tier","a":"CI-0013","b":"CI-0014","src":"IRS-2210-101 Rev B; IDD-2211-001 Rev A","inv":"PS-2210; SRS-2211","base":"ABL","auth":"Program CCB","alloc":"N","ssow":"","mbse":"if.FCC-OFP","var":"All","safe":"Y","haz":"HL-015-C2","rstat":"Active","supby":"","notes":"FCC to OFP execution interface. A hosted CSCI and its host. One interface defined in two sources, so one row lists both. Hosts a hazard control."},{"id":"IF-0003","map":"Mapped","bnd":"Control-Level","a":"CI-0013","b":"CI-0021","src":"ICD-2200-210 §4.1 Rev A","inv":"PS-2210; SCD-2230-001","base":"ABL","auth":"Program CCB","alloc":"N","ssow":"","mbse":"if.FCC-ACT","var":"ACT-2230-002 only","safe":"Y","haz":"HL-014-C1","rstat":"Active","supby":"","notes":"Baseline-connector variant; see IF-0006. The company fixed the interface in ICD-2200-210, and SCD-2230-001 invokes it. ACME consumes the definition, so the interface is not allocated."},{"id":"IF-0006","map":"Mapped","bnd":"Control-Level","a":"CI-0013","b":"CI-0021","src":"ICD-2200-210 §4.2 Rev A","inv":"PS-2210; SCD-2230-001","base":"ABL","auth":"Program CCB","alloc":"N","ssow":"","mbse":"if.FCC-ACT2","var":"ACT-2230-004 only","safe":"Y","haz":"HL-014-C1","rstat":"Active","supby":"","notes":"Revised-connector variant. A distinct cal /* ===================================================================
   Upgrade an opened build so it carries every setting this engine knows
   =================================================================== */
function upgrade(cfg){
  var d=DEFAULT;
  ['build','text','theme','features','groups','lcols','lists','stypes','steps','rules','idx','instr','reference','examples','owners'].forEach(function(k){ if(cfg[k]==null) cfg[k]=clone(d[k]); });
  if(!cfg.custom) cfg.custom=[];
  if(!cfg.cols) cfg.cols=clone(d.cols);
  ['tabs','actions','sheets'].forEach(function(k){ cfg.features[k]=cfg.features[k]||{}; Object.keys(d.features[k]).forEach(function(x){ if(cfg.features[k][x]==null) cfg.features[k][x]=d.features[k][x]; }); });
  if(cfg.features.examples==null) cfg.features.examples=true;
  Object.keys(d.rules).forEach(function(k){ if(!cfg.rules[k]) cfg.rules[k]=clone(d.rules[k]); else { cfg.rules[k].needs=d.rules[k].needs.slice(); if(d.rules[k].ix) cfg.rules[k].ix=true; } });
  Object.keys(d.steps).forEach(function(k){ if(!cfg.steps[k]) cfg.steps[k]=clone(d.steps[k]); else Object.keys(d.steps[k]).forEach(function(x){ if(cfg.steps[k][x]==null) cfg.steps[k][x]=d.steps[k][x]; }); });
  d.cols.filter(function(c){ return c.core; }).forEach(function(c){ if(!cfg.cols.some(function(x){ return x.k===c.k; })) cfg.cols.unshift(clone(c)); });
  d.lcols.forEach(function(c){ if(!cfg.lcols.some(function(x){ return x.k===c.k; })) cfg.lcols.push(clone(c)); });
  Object.keys(d.lists).forEach(function(n){
    if(!cfg.lists[n]) cfg.lists[n]=clone(d.lists[n]);
    d.lists[n].items.filter(function(i){ return i.m; }).forEach(function(i){ if(!cfg.lists[n].items.some(function(x){ return x.m===i.m; })) cfg.lists[n].items.push(clone(i)); });
  });
  ['tiers','retired','yes','staleDays','fields','sheets','blankNotEval'].forEach(function(k){ if(cfg.idx[k]==null) cfg.idx[k]=clone(d.idx[k]); });
  d.idx.fields.forEach(function(f){ var x=cfg.idx.fields.filter(function(y){ return y.k===f.k; })[0]; if(!x) cfg.idx.fields.push(clone(f)); else { if(x.use==null) x.use=f.use; if(x.blank==null) x.blank=f.blank; if(x.alias==null) x.alias=[]; } });
  cfg.cols.forEach(function(c){ if(c.alias==null) c.alias=[]; });
  return cfg;
}

function usesList(n){ return C().cols.some(function(c){ return c.kind==='enum'&&c.list===n; })||!!LIST_USE[n]||['map','bnd','rstat'].indexOf(n)>=0; }
function validate(){
  var c=C(), out=[];
  function E(sec,m){ out.push({sev:'error',sec:sec,m:m}); }
  function W(sec,m){ out.push({sev:'warn',sec:sec,m:m}); }
  function I(sec,m){ out.push({sev:'info',sec:sec,m:m}); }
  var hs={}, ks={};
  c.cols.forEach(function(x){
    if(!tr(x.h)) E('cols','A column has no header. Key: '+x.k+'.');
    var h=tr(x.h).toLowerCase(); if(h){ if(hs[h]) E('cols','Two columns share the header "'+x.h+'". Excel import matches on headers, so each must be unique.'); hs[h]=1; }
    if(ks[x.k]) E('cols','Two columns share the key '+x.k+'.'); ks[x.k]=1;

function cascade(path,old,nw){
  var c=C(), m, ex=c.examples||{};
  if((m=/^groups\.(\d+)$/.exec(path))) c.cols.forEach(function(x){ if(x.group===old) x.group=nw; });
  if((m=/^lists\.([^.]+)\.items\.(\d+)\.v$/.exec(path))){
    var n=m[1], keys=c.cols.filter(function(x){ return x.kind==='enum'&&x.list===n; }).map(function(x){ return x.k; });
    B.ren.push({list:n,keys:keys,old:old,nw:nw});
    applyRenTo(ex,{list:n,keys:keys,old:old,nw:nw});
  }
  if((m=/^stypes\.(\d+)\.v$/.exec(path))){ B.ren.push({stype:true,old:old,nw:nw}); applyRenTo(ex,{stype:true,old:old,nw:nw}); }
}
function applyRenTo(d,x){
  if(!d) return;
  if(x.stype){ (d.sources||[]).forEach(function(s){ if(s.type===x.old) s.type=x.nw; }); return; }
  (d.rows||[]).forEach(function(r){ x.keys.forEach(function(k){ if(r[k]===x.old) r[k]=x.nw; }); });
  if(x.list==='srel') (d.sources||[]).forEach(function(s){ if(s.rel===x.old) s.rel=x.nw; });
  if(x.list==='exstate') (d.exc||[]).forEach(function(e){ if(e.state===x.old) e.state=x.nw; });
  if(x.list==='event') (d.checks||[]).forEach(function(e){ if(e.evType===x.old) e.evType=x.nw; });
}
function readVal(t){
  var ty=t.dataset.t;
  if(ty==='b') return t.checked;
  if(ty==='n') return t.value===''?'':(+t.value||0);
  if(ty==='lines') return t.value.split('\n').map(function(x){ return x.replace(/\s+$/,''); }).filter(function(x){ return x.trim(); });
  return t.value;
}

function doOpen(file){
  var rd=new FileReader();
  rd.onload=function(){
    var t=rd.result, cfg=null;
    try{
      if(/\.html?$/i.test(file.name)||/^\s*</.test(t)){
        var m=/\/\*CFG>\*\/([\s\S]*?)\/\*<CFG\*\//.exec(t);
        if(!m||m[1]==='null') throw new Error('this HTML file carries no build. Open a tool exported by this builder');
        cfg=JSON.parse(m[1]);
        if(!cfg.lcols||!cfg.steps) throw new Error('this is not a CI Interface Register tool. A CI Index tool opens in the CI Index Builder');
      } else {
        var o=JSON.parse(t);
        if(o.builder===BUILDER) cfg=o.config;
        else if(o.cols&&o.lcols) cfg=o;
        else if(o.tool===TOOLKEY) throw new Error('this is a saved register, not a build. Open it inside the tool');
        else if(o.builder||o.tool) throw new Error('this file belongs to another tool');
        else throw new Error('this is not a CI Interface Register build');
      }
      if(B.dirty&&!confirm('You have unsaved changes. Open '+file.name+' anyway?')) return;
      B.cfg=upgrade(cfg); B.undo=[]; B.redo=[]; B.open={}; clean(); renderAll(); refreshPreview(true);
      msg('Opened '+file.name+'. Build '+(cfg.build&&cfg.build.name||'')+', revision '+(cfg.build&&cfg.build.rev||'')+'.');
    }catch(err){ msg('Could not open that file: '+err.message+'.'); }
  };
  rd.readAsText(file);
}

    case 'open': $('f-open').click(); break;
    case 'export': doExport(); break;
    case 'undo': if(!B.undo.length) break; B.redo.push(JSON.stringify(B.cfg)); B.cfg=JSON.parse(B.undo.pop()); dirty(); renderAll(); schedPrev(); msg('Undone.'); break;
    case 'redo': if(!B.redo.length) break; B.undo.push(JSON.stringify(B.cfg)); B.cfg=JSON.parse(B.redo.pop()); dirty(); renderAll(); schedPrev(); msg('Redone.'); break;
    case 'reset': if(!confirm('Start over from the default build? Save first if you want to keep this one.')) break; pushUndo(); B.cfg=clone(DEFAULT); B.open={}; dirty(); renderAll(); refreshPreview(true); msg('Back to the default build. Undo brings your build back.'); break;
    case 'help': openHelp('start'); break;
    case 'help-close': closeHelp(); break;
    case 'pv-refresh': refreshPreview(); break;
    case 'pv-pop': var w=window.open(URL.createObjectURL(new Blob([toolHTML(B.cfg,{mode:$('pv-mode').value,data:B.snap?B.snap.irSnap:null})],{type:'text/html'})),'_blank'); if(!w) msg('The browser blocked the new window. Allow pop-ups for this file.'); break;
    case 'mv':
      var kind=d.kind, dir=+d.d, arr=kind.indexOf('list:')===0?c.lists[kind.slice(5)].items:c[kind], j=i+dir;
      if(j<0||j>=arr.length) break;
      change(function(){ var x=arr[i]; arr[i]=arr[j]; arr[j]=x; }); break;
    case 'add-col':
      var hh=tr($('nc-h').value); if(!hh){ msg('Name the new column first.'); $('nc-h').focus(); break; }
      if(c.cols.some(function(x){ return tr(x.h).toLowerCase()===hh.toLowerCase(); })){ msg('A column already carries that header.'); break; }
      var kd=$('nc-kind').value, k=uniqKey(keyFrom(hh),c.cols.map(function(x){ return x.k; }));
      var nc={k:k,h:hh,kind:kd,w:kd==='long'?36:16,help:'',group:$('nc-group').value,wide:kd==='long',core:false,req:'',alias:[]};
      if(kd==='enum'){ var ln=Object.keys(c.lists).filter(function(n){ return !c.lists[n].core; })[0]; nc.list=ln||'base'; }
      B.newc={h:'',kind:kd,group:nc.group};
      change(function(){ var at=c.cols.findIndex(function(x){ return x.k==='notes'; }); if(at<0) c.cols.push(nc); else c.cols.splice(at,0,nc); B.open['c:'+k]=true; });
      msg('Added '+hh+'. It sits before Notes. Move it with the arrows.'); break;
    case 'del-col':
      var col=colByK(d.k), rn=rulesNeeding(d.k), cr=(c.custom||[]).filter(function(r){ return r.ifCol===d.k||r.thenCol===d.k; });
      if(!confirm('Delete the column '+col.h+'?'+(rn.length?'\n\nThese built-in rules will turn off: '+rn.join(', ')+'.':'')+(cr.length?'\n\nThese custom rules read it and will show as errors: '+cr.map(function(r){ return r.id; }).join(', ')+'.':'')+'\n\nRegister files saved with this column keep their data. This build will not show it.')) break;
      change(function(){ c.cols=c.cols.filter(function(x){ return x.k!==d.k; }); }); msg('Deleted '+col.h+'. Undo brings it back.'); break;
    case 'add-group': change(function(){ var n='New group', s=n, x=2; while(c.groups.indexOf(s)>=0) s=n+' '+(x++); c.groups.push(s); }); break;
    case 'del-group': change(function(){ c.groups.splice(i,1); }); break;
    case 'add-item': change(function(){ c.lists[d.list].items.push({v:'New value'}); }); break;
    case 'del-item': change(function(){ c.lists[d.list].items.splice(i,1); }); break;
    case 'add-list':
      var nm=tr($('nl-name').value); if(!nm){ msg('Name the new list first.'); break; }
      var lk=uniqKey('l_'+(nm.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,20)),Object.keys(c.lists));
      change(function(){ c.lists[lk]={name:nm,core:false,items:[{v:'First value'}]}; }); msg('Added the list '+nm+'. Give a dropdown column this list on the Register columns page.'); break;
    case 'del-list': if(confirm('Delete the list '+c.lists[d.list].name+'?')) change(function(){ delete c.lists[d.list]; }); break;
    case 'add-stype': change(function(){ c.stypes.push({v:'New type',name:'',xc:false,pat:'',dflt:false}); }); break;
    case 'del-stype': if(confirm('Remove the source type '+c.stypes[i].v+'?')) change(function(){ c.stypes.splice(i,1); }); break;
    case 'stype-dflt': change(function(){ c.stypes.forEach(function(x,j){ x.dflt=j===i; }); }); break;
    case 'rules-all-on': change(function(){ Object.keys(c.rules).forEach(function(k){ c.rules[k].on=true; }); }); break;
    case 'rules-reset': if(confirm('Restore every built-in rule to its default severity and words?')) change(function(){ c.rules=clone(DEFAULT.rules); }); break;
    case 'add-cr':
      change(function(){ c.custom=c.custom||[]; var n=1; while(c.custom.some(function(r){ return r.id==='CR'+n; })) n++;
        c.custom.push({id:'CR'+n,on:true,sev:'review',scope:'live',ifCol:colByK('auth')?'auth':'*',ifOp:colByK('auth')?'is':'always',ifVal:colByK('auth')?'ICWG':'',thenCol:'notes',thenOp:'notblank',thenVal:'',msg:'',basis:''}); }); break;
    case 'del-cr': if(confirm('Delete '+c.custom[i].id+'?')) change(function(){ c.custom.splice(i,1); }); break;
    case 'add-sec': change(function(){ c[d.key].push({title:'New section',kind:'list',items:['First item.']}); }); break;
    case 'del-sec': if(confirm('Delete this section?')) change(function(){ c[d.key].splice(i,1); }); break;
    case 'add-chg': change(function(){ c.build.changes=c.build.changes||[]; c.build.changes.push({rev:c.build.rev||'',date:today(),by:'',text:''}); }); break;
    case 'del-chg': change(function(){ c.build.changes.splice(i,1); }); break;
    case 'theme-reset': change(function(){ c.theme=clone(DEFAULT.theme); }); break;
    case 'ex-clear': if(confirm('Remove the example set from the build?')) change(function(){ c.examples={rows:[],sources:[],ext:[],idx:null,checks:[],exc:[]}; }); break;
    case 'ex-default': change(function(){ c.examples=clone(DEFAULT.examples); }); msg('Restored the Rev C example set.'); break;
    case 'ex-preview': B.wantEx=true; try{ $('pvf').contentWindow.postMessage({irReq:'snapshot'},'*'); }catch(err){ msg('The preview is not ready.'); } break;
  }
});
document.addEventListener('focusin',function(e){ var t=e.target; if(t.dataset&&t.dataset.p){ B.pend=JSON.stringify(B.cfg); B.lastVal=getP(B.cfg,t.dataset.p); B.focusVal=B.lastVal; } });
document.addEventListener('input',function(e){
  var t=e.target, p=t.dataset&&t.dataset.p;
  if(t.id==='help-q'){ renderHelp(); return; }
  if(t.id==='nc-h') { B.newc.h=t.value; return; }
  if(!p) return;
  if(B.pend){ pushUndo(B.pend); B.pend=null; }
  var v=readVal(t), old=getP(B.cfg,p);
  setP(B.cfg,p,v);
  if(typeof v==='string') cascade(p,B.lastVal!=null?B.lastVal:old,v);
  B.lastVal=v;
  document.querySelectorAll('[data-mirror="'+p+'"]').forEach(function(m){ m.textContent=v; });
  document.querySelectorAll('[data-p="'+p+'"]').forEach(function(x){ if(x===t||x.type==='checkbox') return; if(x.type==='color'){ if(/^#[0-9a-f]{6}$/i.test(v)) x.value=v; } else if(x.tagName==='INPUT') x.value=v; });
  var m=/^custom\.(\d+)\./.exec(p); if(m){ var s=document.querySelector('[data-auto="'+m[1]+'"]'); if(s) s.textContent=autoMsg(C().custom[+m[1]]); }
  dirty(); schedPrev(); vchip(); renderNav();
});
document.addEventListener('change',function(e){
  var t=e.target, p=t.dataset&&t.dataset.p;
  if(t.id==='f-open'){ var f=t.files&&t.files[0]; t.value=''; if(f) doOpen(f); return; }
  if(t.id==='r-filt'){ B.rfilt=t.value; renderEd(); return; }
  if(t.id==='pv-mode'){ refreshPreview(true); return; }
  if(t.id==='pv-width'||t.id==='pv-layout'){ setLayout(); return; }
  if(t.id==='pv-auto'||t.id==='pv-keep') return;
  if(!p) return;
  var hm=/^cols\.(\d+)\.h$/.exec(p);
  if(hm&&B.focusVal&&tr(B.focusVal)!==tr(t.value)){
    var col=C().cols[+hm[1]]; col.alias=col.alias||[]; if(col.alias.indexOf(B.focusVal)<0) col.alias.push(B.focusVal);
    msg('Renamed. The old header "'+B.focusVal+'" is now an import alias.');
  }
  B.focusVal=getP(B.cfg,p);
  if(t.tagName==='SELECT'||t.type==='checkbox'||/\.kind$/.test(p)) renderAll();
});
window.addEventListener('beforeunload',function(e){ if(B.dirty){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeHelp(); });

/* ===================================================================
   Help
   =================================================================== */
var HELP=[
 {id:'start',t:'Start here',b:[
  'p:This builder changes the CI Interface Register tool without code. You edit settings in forms. The preview runs the real tool with your settings.',
  'p:A build is the full set of settings: columns, lists, source types, coverage steps, rules, the CI Index link, features, text, and theme. Save the build as a JSON file. Reopen it later and keep working.',
  'p:When the build is ready, export it. The export is one HTML file. It runs offline in any current browser.',
  'ex:Three steps. Edit a section. Watch the preview. Export the tool.',
  'p:Pick a section on the left. Each section has a Help link that opens its topic here.']},
 {id:'build',t:'Builds and change control',b:[
  'p:Give each build a name and a revision. The tool shows both on its Reference tab and on the About sheet of its Excel exports.',
  'p:Record each change in the change log. Say what changed and why. The log travels inside the tool.',
  'p:Treat a build like any controlled document. The build file is the source. The exported tool is the output. Keep them together.',
  'p:Saved register files carry the build name and revision. A tool opens register files saved by another build. It keeps the columns it knows. It drops the rest and says so.',
  'p:The build check lists errors, warnings, and information. An error stops the export unless you choose to go on.']},
 {id:'cols',t:'Register columns',b:[
  'p:Each column is one property of an interface row. The order on the page is the order in the table and on the Interface Register sheet.',
  'ul:**Core columns** carry the mapping: Interface ID, Mapping Status, Side A, Side B, and Row Status. Rename them. Move them. You cannot delete them.|**Built-in columns** carry the template’s meaning. Rules and coverage steps read them. Rename, move, or delete them. Delete one, and the rules that need it turn off. The builder names those rules first.|**Custom columns** are yours. Add as many as you need.',
  'p:Every column has a key. The key never changes. Saved register files store data by key, so renaming a header never loses data.',
  'p:Renaming a header adds the old header to the import aliases. Workbooks with the old header still import.',
  'p:Four columns run special controls: the Side A picker, the Side B picker, the source picker, and the Superseded By list. Their types are fixed.',
  'p:Mark a column as required to have the tool raise a review item or a flag when it is blank. Required checks skip retired and superseded rows.']},
 {id:'groups',t:'Form groups',b:[
  'p:The Register tab shows one card per group. Each card holds the columns assigned to it, in column order.',
  'p:Set a column to Not in the form to keep it in the table and the export only.',
  'p:Renaming a group moves its columns with it. Remove a group only when it is empty.']},
 {id:'lcols',t:'Coverage Log columns',b:[
  'p:The Coverage Log follows the template. The coverage check fills each column when a check is recorded. The set and the order are fixed.',
  'p:Rename a header to match the program’s template. Import matches on these headers.',
  'p:Disposition and Status are not typed. The tool builds them from the Exceptions tab, so they always agree with the exceptions.']},
 {id:'lists',t:'Lists and meanings',b:[
  'p:A list feeds dropdowns in the tool and on the Lists sheet of the export.',
  'p:Some values carry a meaning the tool depends on. Mapped, Internal, and Unmapped drive the landing step. The four boundary types drive the boundary checks and the interface map. Active, Retired, and Superseded decide which rows the coverage check counts. Released decides which sources Step 1 checks. Open, Dispositioned, and Cleared drive exception tracking. Rename these values freely. You cannot remove them.',
  'p:Mark a control authority as ICWG control. The overview and the source impact count those rows.',
  'p:The short tag is the badge in the row list. Leave it blank, and the tool uses the first four letters.',
  'p:Renaming a value updates the example set. It does not update register files saved earlier. The tool marks the old value for review on those rows.']},
 {id:'stypes',t:'Interface source types',b:[
  'p:Each source on the Sources tab carries a type. The CM plan names the types for the program.',
  'p:Mark a type for the ICD cross-check. Step 6 checks each source of a marked type against the ICD column of each side CI. The process marks ICDs, IRSs, and IDDs. It does not mark specifications, source control drawings, or drawings.',
  'p:A pattern lets the tool guess a type from the document number when the source is not on the list. The pattern is a regular expression. It ignores case.',
  'ex:^ICD matches ICD-2200-210 and ICD-G-4000.',
  'p:One type is the default. A document that matches no pattern gets the default type.']},
 {id:'steps',t:'Coverage steps',b:[
  'p:The coverage check has seven steps and a model alignment report. Each runs only when the user presses Run coverage check. Nothing runs on its own, and nothing blocks entry.',
  'ul:**On.** Turn a step off only when the program’s CM plan says so. Record the reason in the change log.|**Exception.** Each item is tracked on the Exceptions tab, with an owner, a due date, and a disposition. A later check carries it forward.|**Finding.** Each item is reported on the Coverage Log only. The process treats model alignment this way: CM reports the finding, and Systems Engineering acts on it.',
  'p:Step 1 and Step 4 have parts you can turn off. Step 1 can also flag rows that cite an older revision, and sources the rows cite that are not on the list.',
  'p:Steps 3, 4, 6, and 7 and the model alignment report need a CI Index snapshot. Without one, they read Not run. The rest still run.']},
 {id:'rules',t:'Built-in rules',b:[
  'p:The built-in rules are the template’s completeness checks, plus checks the tool adds. Each has an ID, an area, a severity, and a basis.',
  'ul:**Flag.** A disagreement. The row contradicts itself or the template.|**Review.** A likely gap. It may have a good answer.|**Note.** A reminder.',
  'p:Turn a rule off, or change its severity. Edit the words to match your program. The logic lives in the engine.',
  'p:Rules marked for the CI Index run only while a snapshot is loaded.',
  'p:No rule ever blocks entry. Users can turn the shading off with Show hints. The Checks tab still lists every finding.']},
 {id:'custom',t:'Custom rules',b:[
  'p:A custom rule reads like a sentence. Where one column meets a condition, another column must meet a condition.',
  'ex:Where Control Authority is ICWG, Notes must not be blank.',
  'p:Pick Any row and Always to check a column on every row.',
  'p:Is one of takes a list of values separated by commas. Matching ignores case.',
  'p:Scope sets the rows. Active rows only skips retired and superseded rows.',
  'p:Test each custom rule in the preview. Change a row until the rule fires, then change it back.']},
 {id:'idx',t:'CI Index link',b:[
  'p:The register reads the CI Index as a snapshot. The user loads a CI Index save file or Excel export. The tool keeps a copy in the register file. The CI Index stays the record.',
  'p:A save file is read by key. An Excel workbook is read by header, on its CI Index sheet. Set the headers to match the CI Index build the program uses. Add other headers to accept.',
  'p:A row needs only a CI ID to load. Every other column and cell is optional. The tool shows users this in its column map: each field, the header it accepts, the save file key, what reads it, and what a blank cell does. Edit the last two to match the program.',
  'p:The CI Index is rarely filled in one sitting. With List as not evaluated on, a blank cell that keeps a step from deciding is listed as not evaluated. It never reads as a pass, and a tracked exception stays open. Turn it off when the program wants Steps 6 and 7 to raise those cases as exceptions.',
  'p:The coverage check reads the tier values, the retired statuses, and the yes value. Match them to the CI Index lists.',
  'p:The age warning reminds the user to reload the snapshot before recording a check.']},
 {id:'features',t:'Features and examples',b:[
  'p:Turn tabs, actions, and Excel sheets on or off. The Register tab is always on. It holds the editor.',
  'p:The By CI sheet carries live formulas. It needs no macros and works in Excel 2010 and later.',
  'p:The example set lets a new user see the tool working before entering real data. It holds rows, sources, a CI Index snapshot, a recorded check, and its exceptions. Replace it with a sample from your own program, or remove it.']},
 {id:'text',t:'Text, Instructions, and Reference',b:[
  'p:The text page sets the header, title, introduction, footer, and file names.',
  'p:The Instructions sheet is the first sheet of each export. It carries the template’s instructions.',
  'p:The Reference tab is a list of sections. Each section is a bullet list, plain paragraphs, or a pull quote. Enter one item per line.',
  'p:Two asterisks on each side make a phrase bold: **like this**.',
  'p:Keep technical definitions word for word. Write the explanation around them in short sentences.']},
 {id:'theme',t:'Theme',b:[
  'p:The accent color marks buttons, flags, and selections. The ink color sets the header bar and table headings. The Excel header row uses the ink color too.',
  'p:Red and amber already mean flag and review. Avoid them as the accent.']},
 {id:'preview',t:'Preview',b:[
  'p:The preview runs the real tool with the current build. It refreshes a moment after each change.',
  'ul:**Auto.** Refresh after each change. Turn it off for large edits, then press Refresh.|**Keep my entries.** Carry the data you entered across refreshes.|**Start from.** The example set or an empty register, used when nothing is kept.|**Width.** Full, or a phone at 390 pixels.|**Layout.** Side by side, preview below, editor only, or preview only.|**Pop out.** Opens the preview in its own window.',
  'p:Files saved from the preview come from the build under test. They are real files. Use them to test imports and exports.']},
 {id:'saving',t:'Saving, opening, and exporting',b:[
  'p:**Save build** writes a JSON file. It holds every setting. **Open build** reads it back.',
  'p:Open build also reads a tool HTML exported by this builder. Use that when the build file is lost. The tool carries its whole build inside it.',
  'p:**Export tool** writes the finished HTML. Send that file to users. It needs no install and no network.',
  'p:**Undo** and **Redo** step through your changes in this session. **Start over** returns to the default build. Undo brings your build back.',
  'p:Nothing is stored in the browser. Save the build before you close the tab.']},
 {id:'limits',t:'What the builder cannot change',b:[
  'ul:The logic of the built-in rules and the coverage steps. You can turn them off, change how they report, and edit their words.|The page layout and the tab set. You can hide tabs.|The sheet names and layout of the template sheets. The By CI formulas follow the template columns by key.|The Coverage Log columns. You can rename their headers.',
  'p:For changes past these limits, the engine needs a code change. Bring the build file. It carries every setting, so nothing is retyped.']}
];
var HS={topic:'start'};
function mdh(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
function hitext(s,q){ var h=mdh(s); if(!q) return h; var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); return ('>'+h+'<').replace(/>([^<]+)</g,function(m,x){ return '>'+x.replace(re,'<mark>$1</mark>')+'<'; }).slice(1,-1); }
function topicHTML(tp,q){
  return '<h2>'+esc(tp.t)+'</h2>'+tp.b.map(function(x){
    var k=x.slice(0,x.indexOf(':')), s=x.slice(x.indexOf(':')+1);
    if(k==='ul') return '<ul>'+s.split('|').map(function(y){ return '<li>'+hitext(y,q)+'</li>'; }).join('')+'</ul>';
    if(k==='ex') return '<div class="ex">'+hitext(s,q)+'</div>';
    return '<p>'+hitext(s,q)+'</p>';
  }).join('');
}
function renderHelp(){
  var q=tr($('help-q').value).toLowerCase();
  var list=HELP.filter(function(t){ return !q||(t.t+' '+t.b.join(' ')).toLowerCase().indexOf(q)>=0; });
  $('help-toc').innerHTML=list.map(function(t){ return '<button class="'+(t.id===HS.topic&&!q?'on':'')+'" data-htopic="'+t.id+'">'+esc(t.t)+'</button>'; }).join('')||'<p class="small" style="padding:10px 14px">No match.</p>';
  if(q) $('help-body').innerHTML=list.length?list.map(function(t){ return topicHTML(t,q); }).join('<hr style="border:0;border-top:1px solid var(--rule);margin:16px 0">'):'<p>No topic mentions "'+esc(q)+'".</p>';
  else $('help-body').innerHTML=topicHTML(HELP.filter(function(t){ return t.id===HS.topic; })[0]||HELP[0]);
}
function openHelp(id){ HS.topic=HELP.some(function(t){ return t.id===id; })?id:'start'; $('help-q').value=''; $('help-ov').classList.add('on'); $('helpp').classList.add('on'); renderHelp(); $('help-body').scrollTop=0; }
function closeHelp(){ $('help-ov').classList.remove('on'); $('helpp').classList.remove('on'); }
document.addEventListener('click',function(e){ var t=e.target.closest('[data-htopic]'); if(t){ HS.topic=t.dataset.htopic; $('help-q').value=''; renderHelp(); $('help-body').scrollTop=0; } });
$('help-ov').addEventListener('click',closeHelp);
