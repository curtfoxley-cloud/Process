  check:{q:"A statement of work requires the supplier to \u201cmaintain configuration records and make them available on request.\u201d What is wrong with it as a cited requirement?",
   o:[
     "Nothing: it imposes the obligation clearly",
     "It names no data deliverable with content, frequency and submittal terms, so there is nothing to review at receipt and nothing to find missing",
     "It should have been imposed as a tailored requirement rather than as written",
     "It duplicates the reconciliation report requirement"],
   a:1, why:"An obligation with no deliverable behind it produces nothing on a schedule and nothing to score. \u201cAvailable on request\u201d also inverts the status accounting test: records reconstructed on request rather than maintained is a named failure signal, and this wording invites exactly that."}},
 {id:"M5-04", title:"What each work type actually owes", body:[
    P("The requirement families tell you what kind of obligation applies. The deliverable definitions tell you what each submittal contains. Neither one tells you what a particular supplier owes you. That is what this section does, and it is the thing you will actually write into a statement of work."),
    P("Read the block for each work type you assigned. Where a procurement carries more than one type, take the union of the blocks. Where two blocks disagree on the same deliverable, the more demanding one governs."),
    C("WT01 build-to-print", [
      "Required: reconciliation process documentation, reconciliation report per delivery or lot, part traceability record, variance requests before delivery, sub-tier product data where the supplier has sub-tiers.",
      "Conditional: first article inspection, process change notification where critical or special processes are identified, physical audit support if the CI is designated for audit.",
      "Tailored: status accounting as as-built records only, CM point of contact through the quality function.",
      "Not imposed: CM plan, change proposals, release records. The supplier holds no design authority, so there is nothing to change and nothing to release."]),
    C("WT02 source-controlled design and build", [
      "Required: CM plan (tailored form acceptable), both reconciliation flowdowns, part traceability record, change proposals, variance requests, status accounting, release records, sub-tier data, CM point of contact.",
      "Conditional: software CM if there is embedded code, first article, interface obligations only if a boundary is allocated to them, both audits if the CI is designated for audit.",
      "This is the second heaviest set. Design authority is split, and the supplier builds, so nearly everything applies."]),
    C("WT03 design agent", [
      "Required: CM plan, change proposals, status accounting, release records, CM point of contact.",
      "Conditional: interface obligations where a boundary is allocated, functional audit data support if designated for audit.",
      "Not imposed: reconciliation, part traceability, first article, physical audit. The supplier builds nothing, so there is no as-built to reconcile and no article to examine.",
      "The release record is the important one here. The data package is the product, so release discipline is the thing you are buying."]),
    C("WT04 full CI design and build", [
      "Required: everything WT02 requires, plus CI identification within their own scope.",
      "This is the heaviest set in the taxonomy. Both questions point at the supplier, so both families of requirement apply in full."]),
    C("WT05 vendor item, commercial or catalog", [
      "Required: vendor change and discontinuance notice.",
      "Tailored: variance requests, part traceability pass-through, software version data where the item contains software.",
      "Not imposed: everything else. You do not hold the design, so notification is the only control available to you.",
      "Do not read the short list as a light obligation. That single notice is nearly the whole flowdown for this type, and an end-of-life you learn about from a receiving inspection rather than from the vendor is a serious failure."]),
    C("WT06 software or firmware development", [
      "Required: CM plan, software version description and build records, change proposals, status accounting, release records, reconciliation, CM point of contact.",
      "Conditional: process change notification where the build environment is baselined for reproducibility, software functional audit and witnessed build if designated for audit.",
      "Not imposed: first article inspection. There is no first article of a compile."]),
    C("WT07 repair and overhaul", [
      "Required: reconciliation process and report, part traceability record with life retention, variance requests, change embodiment and effectivity records, sub-tier data, CM point of contact.",
      "Conditional: software CM where the repair scheme includes a load, first article of the repair scheme, process change notification.",
      "The effectivity record matters most here. Retrofit incorporation is where this type carries an obligation that most others do not."]),
    C("WT08 special process services", [
      "Required: process change notification.",
      "Tailored: variance requests, support for CM process audits, CM point of contact through the notifying official.",
      "Not imposed: everything item-related. There is no item design and no delivered item, so identification, traceability, and reconciliation have nothing to attach to.",
      "Like WT05, the short list is not a light one. The process change notice carries almost the entire flowdown."]),
    C("WT09 installation build to company-provisioned materiel", [
      "Required: CM plan, both reconciliation flowdowns with the report per end item, part traceability with roll-up to the end-item identifier, variance requests, status accounting, provisioned materiel discrepancy reports, change embodiment and effectivity records, the as-delivered configuration statement, sub-tier data, CM point of contact.",
      "Conditional: software CM where the line loads software, first article of installation, hosting the audit if the end item is designated for audit.",
      "Tailored: change proposals as requests only, release of installation planning, interface verification at installation.",
      "Two of these exist for no other type. The provisioned materiel report catches a bad kit before it is installed rather than after. The as-delivered configuration statement is the only place open work at delivery gets documented."]),
    P("One habit to build. When you finish a derivation, say out loud which work types get nothing from a requirement family, and say which of the two questions produced that absence. If you cannot answer, you are spreading requirements rather than deriving them.")
  ],
  check:{q:"You are writing the statement of work for a design agent. Which of these should not appear in it?",
   o:[
     "A release record with each data delivery",
     "A CM plan covering change control and status accounting",
     "A reconciliation report per delivery",
     "Interface data, if a boundary is allocated to them"],
   a:2, why:"A reconciliation report compares as-built against released design. A design agent builds nothing, so there is no as-built and nothing to compare. The absence comes from the second question: who performs the build. The other three all apply, and the release record is the most important of them because the data package is the deliverable."}},
 {id:"M5-05", title:"Deriving the deliverable set: practice", body:[
    P("Three facts decide which deliverables a supplier owes. Work through them in this order every time."),
    STEPS([
      {h:"1. What work type or types apply?", b:"This gives the base set. Where more than one type applies, take the union, and where two disagree on the same deliverable the more demanding one governs."},
      {h:"2. Is the item the supplier delivers a configuration item?", b:"If it is not a CI, it is controlled inside a parent CI\u2019s documentation. No audit deliverable can ever become due for it, because audits are audits of configuration items. Everything else still applies. Reconciliation, traceability, and variance control do not depend on CI status."},
      {h:"3. If it is a CI, has it been designated for audit?", b:"If yes, the three audit deliverables are due and scheduled. If no, they are cited as triggered items under the standing conditional clause and become due only if designation for audit arrives. If the procured item is not a CI at all, there is nothing to cite."}]),
    C("The order matters", [
      "Skipping step 2 is how audit deliverables end up cited against a bracket that was never a configuration item.",
      "Skipping step 3 is how a supplier gets billed for audit preparation on a CI nobody ever designated for audit.",
      "Doing step 3 before step 1 is how a build-to-print supplier gets asked to conduct a functional audit they have no documentation to conduct against."])
  ],
  check:{q:"A supplier machines a fitting to your released drawing. The fitting is controlled inside its parent assembly\u2019s drawing package and is not a configuration item in its own right. Which deliverables do you cite?",
   o:[
     "The full WT01 set including the audit data package, since the parent assembly is designated for audit",
     "Reconciliation process documentation and report, part traceability record, variance requests, and first article where the condition applies. No audit deliverables, because the procured item is not a CI",
     "Only a part traceability record, since a non-CI carries no other obligation",
     "Nothing, because CM requirements apply only to configuration items"],
   a:1, why:"CI status decides whether audit deliverables are even possible, and this procured item is not a CI, so they are not. It decides almost nothing else. Reconciliation, traceability, variance control, and first article all attach to the fact that the supplier is building to your released data, not to whether the thing they build is a CI. Option 3 is the common overcorrection, and it strips out the requirements that catch configuration drift."}},
 {id:"M5-06", title:"Deriving the deliverable set: five worked cases", body:[
    P("Each case gives the facts. Decide the deliverable set before reading the answer."),
    TABLE(["The procurement", "The three facts", "The deliverable set"], [
      ["A supplier designs and builds a hydraulic valve under your source control drawing. The valve is a CI. The designation assessment found two risk factors.", "WT02. It is a CI. It is designated for audit.", "CM plan; reconciliation process documentation and report; part traceability record; change proposals; variance requests; status accounting; release records; first article; CM point of contact; sub-tier data if they have sub-tiers. Plus all three audit deliverables, due and scheduled, because the supplier conducts both audits."],
      ["The same valve, same supplier, but the designation assessment found one risk factor and recorded it.", "WT02. It is a CI. It is not designated for audit.", "Exactly the same set, minus the audit deliverables becoming due. The audit deliverables are still cited, as triggered items under the standing conditional clause. Nothing else changes. This is the row that shows designation for audit touching only the audit line."],
      ["A supplier writes the operational flight program for a computer another supplier builds. The software is a CI by rule. It is designated for audit.", "WT06. It is a CI. It is designated for audit.", "CM plan; software version description and build records; change proposals; status accounting; release records; reconciliation; CM point of contact. Plus the audit deliverables, because they conduct the software functional audit and the witnessed build. No first article, because there is no first article of a compile."],
      ["A plating house anodizes parts to your process specification. Some of those parts end up inside a CI designated for audit.", "WT08. They deliver no item. The CI is designated for audit.", "Process change notification. Variance requests and CM process audit support, tailored. A CM point of contact, tailored. **No audit deliverables at all,** even though a CI designated for audit is downstream. There is no item configuration at their facility for an audit to examine, and their work type carries no audit role."],
      ["One statement of work with one supplier. They deliver a source-controlled pump assembly, and on a separate accepted line item, the vendor-item-controlled pressure switch installed inside it.", "Two procured items, not one. The pump is WT02. The switch is WT05. Two design authorities on one classification record.", "Derive per procured item. **Pump:** CM plan; reconciliation process documentation and report; part traceability record; change proposals; variance requests; status accounting; release records; first article; sub-tier data; CM point of contact; standing conditional audit clause. **Switch:** vendor change and discontinuance notice, plus variance requests and part traceability record, tailored. Provide both sets, with each requirement naming its procured item in its own text rather than by heading. The switch owes **no reconciliation report**, because no company-held released design exists to reconcile it against."]]),
    C("The fifth row, read the other way", [
      "Change one fact. The pressure switch is not accepted on its own line. The supplier buys it and installs it, and your company accepts only the pump.",
      "Now there is **one procured item.** The classification is WT02 alone. The switch is sub-tier content, its part numbers and unit identifiers come up through **R-19 and S-18**, and the pump reconciliation shows which switch went into which pump.",
      "**What does not come up on its own is R-08.** A reconciliation report tells you what was installed last quarter. It does not tell you the vendor is changing the part next quarter, or discontinuing it. R-08 reads C for WT02, conditional on exactly this case: a vendor item directed into the assembly as content your company selects but does not separately accept. Resolve it as met. Notification is the only control anyone has over a design your company does not hold."]),
    S("The second, fourth and fifth rows are the three that get argued about.",
      "The second row shows that designation for audit changes one line of the flowdown and nothing else. The fourth row shows that a CI designated for audit downstream does not reach back and create an audit obligation at a supplier whose work type has no audit role. The fifth row shows that one statement of work can carry two requirement sets that never merge."),
    S("Four more cases follow, and none of them is solved by reading the matrix correctly.",
      "Each one is a procurement where the classification is right, the column is read right, and the statement of work still comes out wrong.")
  ],
  check:{q:"Your company procures a machined housing from a build-to-print supplier. The housing is a CI and it has been designated for both audits. Which audit deliverables does the supplier owe, and which do they not?",
   o:[
     "All three audit deliverables for both audits, since the CI is designated for audit",
     "The audit data package for the physical audit only. No audit plan and no minutes, because they support rather than conduct, and no functional audit involvement at all",
     "No audit deliverables, because build-to-print suppliers hold no design authority",
     "The audit plan and data package, but not the minutes"],
   a:1, why:"Designation for audit makes the audits happen. Work type scopes what this supplier owes. A build-to-print supplier supports the physical audit, so they provide the data package for it, along with access and the manufacturing instructions actually used. The audit plan and the minutes belong to whoever conducts, which is your company. And they have no functional audit role at all, because they hold no functional or allocated documentation to audit against."}},
 {id:"M5-07", title:"Worked case: the distributor who is not the vendor", body:[
    P("You are buying a vendor-item-controlled RF connector. Your supplier is a franchised distributor. The connector is designed and manufactured by a company two tiers below you, and your supplier has never held that design."),
    P("**Classify it first.** Who holds design authority? The manufacturer. Who performs the build? The manufacturer. Neither answer points at the party you contracted with, and neither question asks who you contracted with. The classification is **WT05**, and it does not change."),
    S("Classification tells you who holds the design. It does not tell you whether the party you contracted with can perform the requirement.",
      "Those are two different questions and the matrix only answers the first one."),
    C("Now read the WT05 column and watch a row fail", [
      "**R-08, vendor change and discontinuance notification, carries nearly the whole WT05 flowdown.** It is the only real control you have over a design your company does not hold.",
      "A notice originates with whoever holds the design. **Your distributor holds none.** It cannot originate the notice. At best it can forward one, and only if it receives one, and only if its own agreement with the manufacturer obliges the manufacturer to send it.",
      "**R-19 reads C for WT05.** The condition is that the supplier does not hold the design of the vendor item. Here it does not, so resolve the condition as met. Impose R-19 with S-06 and S-18, and the manufacturer notices have a route up through your supplier.",
      "That cell read not applicable until Rev C, on a rationale that WT05 sub-tiers sit inside a design the company does not hold. **That rationale is sound only when your supplier is the vendor.** Somebody noticed the assumption did not fit and said so. That is the job."]),
    P("**What CM does about it.** Impose R-08 with a documented tailoring. The tailoring states three things: that the supplier obtains the obligation from the manufacturer, that it forwards each notice within a stated interval of receipt, and that it identifies the manufacturer and the manufacturer part number. Record the manufacturer in the Design Holder field on the classification record, because the supplier and the design holder are not the same party."),
    S("A dash that is right for the common case and wrong for yours is still wrong for yours.",
      "When a cell does not fit the facts in front of you, say so in writing the same day. Two cells in this matrix were opened because somebody did."),
    S("Ask one question at classification and it costs you nothing: is this supplier the vendor, or a route to the vendor?",
      "Franchised distributor, broker, value-added reseller, and manufacturer all classify WT05. Only one of them can originate a change notice.")
  ],
  check:{q:"You buy a vendor-item-controlled connector from a franchised distributor. The manufacturer sits two tiers below you. What is the correct reading?",
   o:[
     "The classification is not WT05, because the distributor performs no design and no build",
     "The classification stays WT05, but R-08 cannot be performed as written, because the party under contract does not hold the design the notice must originate from",
     "R-19 applies automatically, since a sub-tier demonstrably exists",
     "Nothing changes. A distributor and a manufacturer are interchangeable for CM purposes"],
   a:1, why:"The two classification questions ask who holds design authority and who builds. Both answers point at the manufacturer, so WT05 is correct and stays correct. What breaks is performance. R-08 requires a notice that only the design holder can originate, and R-19 is switched off for WT05 on a rationale that assumes your supplier is the vendor. Impose R-08 with a tailoring that obliges pass-through, record the manufacturer as the design holder, and raise the R-19 cell."}},
 {id:"M5-08", title:"Worked case: the company furnishes the part", body:[
    P("A source-controlled pump assembly, WT02. The supplier designs the internals. Your company controls form, fit, function, interface, and qualification."),
    P("With one difference. **Your company furnishes the pressure switch.** You hold a long-term agreement with the switch vendor, you get a better price than your supplier can, and you ship the switches to the supplier for installation."),
    P("Read the R-20 row. Company-provisioned materiel configuration control: verify against released content at receipt, no substitution without company approval, report discrepancies, shortages, and revision mismatches before embodiment. **The WT02 cell reads C.** The condition is that the company furnishes, issues, or directs materiel the supplier embodies rather than procures on its own authority. Here it does, so resolve the condition as met and impose the requirement with S-15."),
    C("That cell read not applicable until Rev C, and here is what it gave away", [
      "The supplier owed **no receipt verification** against released content.",
      "The supplier could **substitute** without your approval.",
      "The supplier owed **no discrepancy, shortage, or revision-mismatch report** before it embodied the switch into a pump you would accept.",
      "Nobody wrote those permissions. They fell out of one dash, on every procurement of this shape, for as long as the dash stood."]),
    P("**Why the dash was there.** R-20 read required for WT09, tailored for WT01 and WT07, and not applicable everywhere else. The pattern assumed a WT02 supplier procures its own content, which is ordinarily true. The Instructions sheet states that a dash is derived from the two classification questions rather than negotiated. **A derivation is only as good as the assumption under it,** and this procurement broke that assumption."),
    C("And this row is mandatory for safety", [
      "R-20 is marked mandatory for safety. Every safety-mandatory requirement is either imposed, or its exception goes to the safety disposition gate with a recorded risk acceptance.",
      "**A dash never reaches that gate.** The gate catches tailoring. A dash is not tailoring. It says the requirement was never applicable, so nothing is presented and nothing is signed.",
      "So a correct dash costs nothing and a wrong dash costs everything. It drops a safety-mandatory requirement on every affected procurement, silently, and leaves no record that anything was skipped.",
      "**When a dash looks wrong for your facts, say so in writing the same day.** You are the only control on that failure mode."]),
    S("A dash is a derivation. It is not a permission.",
      "When the facts break the assumption the derivation rests on, the dash is wrong, and CM says so in writing rather than working around it."),
    P("**What CM does now.** Resolve the R-20 condition as met and impose it with S-15. Name the verification source, because the row requires one: the kit content list at its stated revision, the issue document, or the receiving record against the company purchase order. Record the resolution basis on the classification log, and record the provisioning arrangement in the Provisioning Mode field."),
    C("What this is not", [
      "**It is not WT09.** WT09 is installation build where your company holds design authority for what is being assembled. Here the supplier holds design authority for the pump internals under a source control drawing. Furnishing one part does not move design authority.",
      "**It is not a reason to re-classify.** The two classification questions are unchanged. What changed is a condition the matrix did not anticipate, and conditions are handled by tailoring with a recorded rationale."])
  ],
  check:{q:"Your company furnishes a pressure switch to a WT02 supplier for installation in a source-controlled pump. The matrix shows R-20 as C for WT02. What does CM do?",
   o:[
     "Do not impose R-20. The supplier did not buy the switch, so its configuration is the company\u2019s problem rather than the supplier\u2019s",
     "Re-classify the procurement as WT09, because company-provisioned materiel is now involved",
     "Resolve the R-20 condition as met, impose it with S-15, name the verification source, and record the resolution basis on the classification log",
     "Impose R-20 informally, since a competent supplier will verify receipts anyway"],
   a:2, why:"R-20 reads C for WT02. The condition is that the company furnishes, issues, or directs materiel the supplier embodies, and this procurement meets it. Resolve the condition as met, impose R-20 with S-15, and name the verification source the row requires. Re-classifying to WT09 is wrong, because design authority for the pump internals still sits with the supplier. Not imposing it is wrong, because R-20 is mandatory for safety and a requirement omitted without a gate disposition leaves no record that anything was skipped."}},
 {id:"M5-09", title:"Worked case: one part number, two paths", body:[
    P("The same pressure switch, and one part number. It reaches your company two ways."),
    P("**Path one.** Your WT02 supplier buys it and installs it in the pump. It is sub-tier content inside the assembly."),
    P("**Path two.** You buy it direct from the vendor as spares, on its own procurement, classified WT05."),
    P("Derive per procured item and you have done the hard part right. The pump gets the WT02 set. The spares get the WT05 set. That is the rule from the earlier module and it holds here."),
    S("Deriving correctly is not the same as controlling correctly.",
      "You can classify both procurements right, cite both sets right, and still take two revisions of one part number."),
    C("Follow one change notice", [
      "The vendor issues a change notice. It reaches you on the spares line, through **R-08 and S-13**, because you imposed that requirement on that procurement.",
      "It does not reach the pump line. Your supplier bought the switch on its own purchase order, to its own approved-vendor list, under its own agreement with the vendor. **Your vendor item control drawing does not govern that purchase order.**",
      "Now the spares stock holds one revision. The switches going into pumps hold another. One part number, two configurations.",
      "**Nobody notices**, because the spares receiving record and the pump reconciliation report live in different files and nobody compares them."]),
    P("**The cross-check you already own.** R-19 and S-18 require your WT02 supplier to return sub-tier part numbers and unit identifiers with next-higher-assembly traceability. That data names the switch part number and revision going into each pump. Compare it against what you accept on the spares line. A revision mismatch between the two is a finding, and it is a finding nothing else in the flowdown will surface."),
    P("**The better fix.** Name the vendor item control drawing as the selection control on the WT02 line as well, so both paths buy to the same document. Then the vendor change notice has one governing document to change against, and the two paths cannot drift apart quietly."),
    S("One part number is not one configuration.",
      "Two supply paths are two configurations until somebody makes them agree, and making them agree is a CM act rather than an assumption.")
  ],
  check:{q:"The same switch part number reaches you two ways: installed by your WT02 pump supplier, and bought direct as WT05 spares. Both procurements are classified and derived correctly. What is the exposure?",
   o:[
     "None. Two procurements, two classifications, derived per procured item, which is correct",
     "The vendor change notice arrives on the spares line through R-08 and never reaches the assembly line, so one part number is delivered at two revisions and neither record shows it alone",
     "The spares procurement should have been classified WT02 to match the pump",
     "The pump supplier must submit R-08 notices for the switch it installs"],
   a:1, why:"R-08 was imposed on the spares procurement, not on the pump supplier\u2019s own purchase order to the vendor. Your vendor item control drawing does not govern that purchase order. The two paths drift, and the drift is invisible because the receiving record and the reconciliation report are never compared. Use the S-18 sub-tier data to cross-check the two, and name the control drawing on the WT02 line so both paths buy to one document."}},
 {id:"M5-10", title:"Worked case: the sub-tier that did not exist at award", body:[
    P("A source-controlled actuator, WT02. At award, the supplier machined, anodized, and assembled everything in one building. It had no sub-tiers."),
    P("R-19 is conditional. The condition is that the supplier has sub-tiers, and the matrix note says the procurement establishes that at award. CM resolved the condition as not met, did not impose R-19, and recorded the basis. **That was correct.**"),
    P("Eighteen months later the supplier moves housing machining to a new machine shop and sends the anodize to a plating house."),
    C("What is now true that was not true at award", [
      "**Two sub-tiers exist.** R-19 was never imposed, so no sub-tier part numbers come up, no sub-tier unit identifiers come up, and no next-higher-assembly traceability comes up. You cannot see through the tier.",
      "**Anodize is a special process.** R-05, process-change notification and frozen planning, is conditional on critical or special processes being identified. That condition is now met and it was not met at award.",
      "**The first article basis may have moved.** R-16 is conditional, and a source change is one of the standard first article triggers."]),
    P("**The trigger that should have fired.** A source, process, or facility change is a re-classification trigger, and Supplier Requirements Engineering notifies CM of source changes. The first question CM asks is whether that notice arrived. If it did not, the finding is against the notification path rather than against this procurement, and it will repeat on every other procurement with that supplier."),
    P("**What CM does.** Re-resolve every conditional cell against the facts as they now stand. Impose R-19 with S-06 and S-18 by contract change. Re-resolve R-05 and R-16. Record the re-resolution on the classification log with the new date and the classifier, alongside the original resolution rather than over it."),
    S("A conditional resolved correctly at award can be wrong eighteen months later.",
      "Conditions are resolved at a date. They are not resolved for all time, and a classification record that shows only the first resolution hides that."),
    P("**Do not backfill quietly.** Imposing a requirement the supplier never priced, without a contract change, is how a flowdown becomes unenforceable. Route it through Supplier Requirements Engineering the same way the original requirements went.")
  ],
  check:{q:"At award, an actuator supplier had no sub-tiers, so CM resolved R-19 as not met and recorded the basis. Eighteen months later the supplier subcontracts machining and anodize. What is correct?",
   o:[
     "Nothing is required. The conditional was resolved correctly at award and that resolution governs the procurement",
     "Re-resolve every affected conditional, impose R-19 with S-06 and S-18 by contract change, and record the re-resolution on the classification log with the new date",
     "Raise a nonconformance against the supplier for adding sub-tiers without approval",
     "Impose R-19 immediately by letter, since the requirement was implied from award"],
   a:1, why:"Conditions are resolved at a date against the facts of that date. A source, process, or facility change is a re-classification trigger, and both R-19 and R-05 now resolve differently than they did at award. Re-resolve them, record the new resolution alongside the old one, and impose the requirements through a contract change. Adding sub-tiers is ordinary supplier behavior rather than a nonconformance, and imposing a requirement the supplier never priced without a contract change makes the flowdown unenforceable."}},
 {id:"M5-11", title:"Conditionals, and the standing audit clause", body:[
    P("Resolve each conditional against its stated condition and record the basis. Software CM requirements are conditional on deliverable software or embedded code; process-change notification on identified critical or special processes; first article requirements on the applicable quality system criteria. Re-resolve any conditional when its condition changes."),
    P("Configuration audit obligations are conditional on the **CI\u2019s audit designation**: not on work type. Work type determines the supplier\u2019s *role* if the CI is or becomes designated for audit: conduct the audit at their facility, or support one with data and access."),
    S("Designation for audit can arrive after award. Awarding work to a new sub-supplier re-runs the designation assessment. It also adds one risk factor to that assessment.",
      "One risk factor on its own does not designate the CI for audit. Designation for audit follows where that factor combines with another one, or where a mandatory designation criterion or a safety criticality criterion applies. So the award can still be the event that leads to designation for audit later. The clause has to already be in the subcontract when that happens."),
    CARDS([
      {h:"Standing conditional clause", b:"The clause takes effect on designation for audit; triggered deliverables are scheduled. You notify the supplier and set dates. No commercial negotiation: the obligation was already bought. Cost: administrative."},
      {h:"Decided once, at award", b:"You have no clause when designation for audit arrives. Obtaining audit support requires a contract modification, negotiated after the supplier holds the work and knows you need the access. Cost: commercial, schedule, or a CI designated for audit you cannot audit."}], 2),
    P("**The clause exists so that designation for audit does not have to be settled at award.** You do not need the answer today. You need the obligation in the contract for the day the answer arrives. Module 7 covers what the audits are, how a CI earns one, and what a supplier is actually agreeing to when this clause fires."),
    C("The trap to name out loud", [
      "**\u201cNo audit designation\u201d does not mean \u201cno verification flowdown.\u201d** Never-CI designated for audits still carry the at-scale machinery: reconciliation, status accounting, part traceability and first article inspection, which apply by work type regardless of designation for audit.",
      "Audit is a sampling event laid on top of continuous verification. Removing the sampling event does not remove the thing it samples."])
  ],
  check:{q:"You are writing a statement of work for a supplier who will build a CI designated for audit to print. At award, the CI is not designated for audit for configuration audit. What do you cite?",
   o:[
     "Nothing on audit; add it by modification if designation for audit ever arrives",
     "Full audit conduct requirements, to be safe",
     "A standing conditional audit clause, with the audit deliverables cited as triggered items",
     "Audit requirements only if the Acquirer asks"],
   a:2, why:"Deciding audit applicability once, at award, converts every post-award designation for audit into a contract modification negotiated from an unfavorable position. The standing clause costs nothing now and buys the obligation before you need it."}},
 {id:"M5-12", title:"Providing the CM requirements and SDRLs", body:[
    P("CM provides the CM requirements and the CM SDRLs to Supplier Requirements Engineering, which owns and authors the statement of work. Each cited requirement identifies its supplier data deliverable by reference to the SDRL definition: content, frequency or triggering event, and submittal terms. Beyond that, five things must be stated explicitly, because each is a known failure point."),
    STEPS([
      {h:"Part attribute designation authorship", b:"Who proposes and who approves the **part attribute designations**: safety-critical, life-limited and special handling. These are attributes on parts. They are not CI designation and not audit designation. **Three cases exist, and the statement of work names which one applies.** *Company-assigned*, where the company holds design authority: the designations are provided in the technical data, and the supplier marks, records and reports against them. *Supplier-proposed and company-approved*, where the supplier holds design authority at its level: they propose during design development and your engineering function approves. *Externally assigned*, where a customer or a regulatory authority assigns the designation: both parties record it and flow it, neither proposes it, neither approves it, and a dispute goes to the assigning authority rather than between the two of you. Leave the case unstated and each party waits for the other."},
      {h:"Both reconciliation flowdowns", b:"The process documentation as capability evidence, submitted before reliance is placed on it, and the recurring report per delivery or lot."},
      {h:"Part traceability record content in full", b:"Including life limits and life consumed at delivery for life-limited items. This is the identifier vocabulary everything else is expressed in."},
      {h:"Recursive flowdown", b:"And the return of sub-tier product data with next-higher-assembly traceability, wherever sub-tiers exist."},
      {h:"Change and variance control", b:"Consistent with where design authority sits and who builds. A build-to-print supplier cannot propose changes; a design-authority supplier must."}]),
    P("Where a requirement mandatory for safety has been dispositioned other than by imposition, reference the recorded disposition. And define the **attestation scope of the CM signature once**, in the program CM plan: does it attest that CM review occurred, or that the flowdown content is adequate? Fixing it once prevents later disputes over what a past signature meant.")
  ],
  check:{q:"A regulatory authority assigns a life-limited part attribute designation to a component your supplier designs and builds. Who proposes it, and who approves it?",
   o:[
     "The supplier proposes it, because they hold design authority for the item",
     "Your engineering function approves it, because approval always sits with the company",
     "Neither. This is the externally assigned case: both parties record it and flow it, and a dispute goes to the assigning authority",
     "The Acquirer approves it on your behalf at first article"],
   a:2, why:"Two of the three authorship cases have a proposer and an approver. The third does not. An externally assigned part attribute designation arrives already made, and the only obligations are to record it, to flow it, and to carry the assigning authority in the CI index alongside it. The first two options are the other two cases applied to the wrong one, and each of them invites a party to re-open a designation that was never theirs. Leave the case unstated in the statement of work and both parties wait, which is how a life-limited part arrives with a blank consumed-life field."}},
 {id:"M5-13", title:"Before release: the readiness check", body:[
    P("One check, completed per statement of work or purchase order before release, attached to the classification record. It exists because every failure it catches is cheap now and expensive later."),
    STEPS([
      {h:"Classification", b:"Design authority and build responsibility determined, and the item type identified. **All applicable work types recorded, not only the dominant one.** The mixed-classification question asked out loud: does this supplier also develop software or firmware, or also hold any element of design authority? CI identifiers recorded where the procured item is or contains a CI designated for audit. And where the supplier is an incumbent, their history reviewed: prior determinations, open findings, open actions."},
      {h:"Derivation and conditional resolution", b:"The requirement set read from **every** applicable column, with the most demanding cell applied. Every conditional resolved and its basis recorded. Audit designation status determined. The standing conditional clause included where designation for audit is possible, or audit requirements imposed outright where designation for audit is already in effect. And every requirement mandatory for safety either imposed, or dispositioned through the safety disposition gate with the disposition referenced."},
      {h:"Citation completeness", b:"Every cited requirement carrying its deliverable, with content, frequency or trigger, and submittal terms. The part attribute authorship case stated, and it is one of three. Both reconciliation flowdowns imposed where the supplier builds. Part traceability content imposed in full, life limits and life consumed included. Recursive flowdown and the return of sub-tier data imposed wherever sub-tiers exist. Software CM imposed where deliverable software or embedded code exists. Change and variance control consistent with where design authority sits."},
      {h:"Release", b:"CM signature applied before release, per the attestation scope defined in the program CM plan. The classification record complete, including signature and date. And the re-classification triggers communicated to subcontracts and program management, because they will see the triggers before CM does."}]),
    S("The checklist is not a formality tax. Every line on it is a failure somebody has already had.",
      "The dominant-work-type-only classification. The unresolved conditional. The requirement with no deliverable. The unstated part attribute authorship case. Each one has a section behind it. Three are in this module. The first is in Module 4."),
    C("When a statement of work is released without CM signature", [
      "It happens. The response is defined, and its shape matters: the release is recorded as a **process finding against the release gate, not against an individual**. The classification and derivation are then performed retroactively and reconciled against what was actually released.",
      "Both halves are deliberate. A release path that can bypass CM will do it again next quarter no matter whose name was on this one, so the finding has to attach to the path. And the retroactive derivation is not paperwork: it is the only way to find out what you actually bought, and what is now missing from it."])
  ],
  check:{q:"A statement of work reaches a supplier without ever passing through CM review. What is the correct response?",
   o:[
     "Record it against the engineer or buyer who released it, and re-brief them",
     "Record a process finding against the release gate, then perform the classification and derivation retroactively and reconcile them against what was actually released",
     "Leave it: the work is under contract and the requirements cannot now be changed",
     "Issue a modification imposing the standard requirement set, without classifying"],
   a:1, why:"The finding attaches to the gate because a bypassable release path is the actual defect: naming a person fixes this instance and nothing else. And the retroactive derivation is what tells you the gap: what should have been imposed, what was, and therefore which deliverables you will never receive unless the statement of work is modified. Imposing a standard set without classifying repeats the original error at speed."}}
 ],
 exercises:[
 {id:"M5-E1", title:"Exercise 1: Derive from a mixed classification",
  scen:"Take the actuator above. The matrix marks the sub-supplier CM plan row T for the SCD work type and R for the software work type; the software CM row C for the SCD work type and R for the software work type; and the reconciliation report row R for both.",
  parts:[
   {id:"a", q:"What is imposed for each of the three rows, and why?"},
   {id:"b", q:"State the rule you applied, in one sentence."},
   {id:"c", q:"The engineer before you classified this as the SCD work type only. Name three specific requirements that would not have been imposed, and the consequence."},
   {id:"d", q:"Would your answer change if the software were delivered and accepted as a separate item rather than embedded in the actuator? Say what changes and what does not."}
  ]},
 {id:"M5-E2", title:"Exercise 2: The audit clause",
  scen:"You are writing the statement of work for a new supplier who will build a CI designated for audit to print. At award, the CI has NOT been designated for audit for configuration audit.",
  parts:[
   {id:"a", q:"Do you cite audit requirements? Explain your reasoning, and say what the supplier\u2019s role would be if designation for audit arrived."},
   {id:"b", q:"What is it about introducing this supplier that bears on the designation for audit question?"},
   {id:"c", q:"Six months after award the CI is designated for audit. What happens under the statement of work you would write, versus one that decided audit applicability at award?"},
   {id:"d", q:"The program manager argues that since the CI is not designated for audit, no verification requirements need flow at all. How do you answer?"}
  ]},
 {id:"M5-E3", title:"Exercise 3: Writing the flowdown end to end",
  scen:"A new procurement: a supplier will develop and build an environmental control unit under your source control drawing. You control form, fit, function, interface and qualification; they design the internals. The unit contains a controller running their own embedded firmware. They will subcontract the heat exchanger core to a specialist shop of their own, and they will send housings out for anodizing to a process house under your process specification. The unit contains two life-limited components. The CI is not designated for audit for configuration audit at award.",
  parts:[
   {id:"a", q:"Record the classification. Name every applicable work type and give the two answers that produced each one."},
   {id:"b", q:"Derive the requirement set. Work through the families in order and say what is imposed, naming anything that is imposed because of the most-demanding-cell rule rather than the dominant type."},
   {id:"c", q:"List the deliverables you will cite, with the frequency or trigger for each. Flag any where the content must be stated explicitly rather than left to the definition."},
   {id:"d", q:"Resolve every conditional in this procurement and record the basis for each."},
   {id:"e", q:"What do you write about configuration audit, and why? What would the supplier\u2019s role be if designation for audit arrived after award?"},
   {id:"f", q:"Two sub-tiers exist. What is imposed about them, and what has to come back up?"},
   {id:"g", q:"Walk the readiness check and name anything in this scenario that a hurried classifier would most likely miss."}
  ]}
 ]
},
{
 id:"M6", label:"Module 6", title:"Proving it worked", sub:"The deliverables you receive and score, the evidence that accrues, and the determination that follows",
 sections:[
 {id:"M6-01", title:"Two reconciliation deliverables, and the traceability record", body:[
    P("New engineers frequently treat the two reconciliation deliverables as one requirement. They are two, and imposing only one is a defined failure. A report produced by an undocumented method is a number with no method behind it. A documented method that never reports is a method with no evidence behind it."),
    TABLE(["", "Process documentation", "Reconciliation report"], [
      ["What it is", "The supplier\u2019s documented METHOD: data sources, comparison method, delta disposition, frequency, records produced", "The recurring OUTPUT: as-built against released design revision, open deltas with disposition, changes incorporated with effectivity"],
      ["When", "Once, plus on revision: before reliance is placed on it", "Per delivery or lot"],
      ["What it proves", "Capability: a method exists and covers all deliverable configurations at scale", "Performance: the method is being run, and what it found"],
      ["If it is missing", "Reports arrive by an unknown method. A number without a method", "A method exists on paper and produces nothing. A method without evidence"]]),
    P("A reconciliation report compares five elements, on two sides. Read the report as a comparison rather than as a verdict."),
    TABLE(["Element", "As-designed side, from the parts list", "As-built side, from the build records"], [
      ["1", "Part number", "Part number"],
      ["2", "Next higher part number", "Next higher part number"],
      ["3", "Quantity", "Quantity"],
      ["4", "The traceability requirement: serial, lot or batch", "The traceability actually captured"],
      ["5", "The life limit notation and its type: shelf-life, or usage and cycle", "The life limit information actually captured"]]),
    C("Element 5 is the subtle one", [
      "The parts list says whether a part has a life limit and **which kind**. It does not say how much life remains, and it is not expected to.",
      "A **shelf-life** notation requires a date code with cure or expiry evidence.",
      "A **usage or cycle** notation requires a serialized record with life consumed at delivery.",
      "The parts list notation is where a reader learns which clock applies. Nothing else in the package states it. This is the two-clocks rule from M1-08 in Module 1, and it governs here too.",
      "**Lot control is not a lesser form of control.** A part of catastrophic hazard severity may be legitimately lot controlled."]),
    C("The part traceability record", [
      "Defined once and referenced from several requirement rows, because it is the identifier vocabulary the rest of the flowdown speaks in. Per delivered unit or lot it records: serial numbers; lot or batch numbers; **life-limited designation with the assigned life limit and the life consumed at delivery**; safety-critical designation; special handling designations; and traceability to the next higher assembly.",
      "The field that goes missing most often is life consumed at delivery. A blank there on a life-limited item is not a clerical defect: it is an item that can never be accurately tracked for the rest of its service life."])
  ],
  check:{q:"A supplier submits reconciliation reports per lot, but never submitted the reconciliation process documentation. What is the problem?",
   o:[
     "None, provided the reports show no deltas",
     "The reports arrive by an unknown method: nobody can say what configurations the method covers or whether it works at scale",
     "Only a records retention issue",
     "The reports must be re-submitted in a different format"],
   a:1, why:"The process documentation is capability evidence, submitted before reliance is placed on it. Without it you have a number without a method, and no basis for believing a clean report means anything."}},
 {id:"M6-02", title:"How to read an as-designed to as-built reconciliation report", body:[
    P("You receive this report and you score it. You do not audit it. That distinction sets how you read it."),
    P("Five elements, two sides. The as-designed side comes from the parts list. The as-built side comes from the build records and the production system."),
    TABLE(["Element", "As-designed, from the parts list", "As-built, from the build records"], [
      ["1", "Part number", "Part number"],
      ["2", "Next higher part number", "Next higher part number"],
      ["3", "Quantity", "Quantity"],
      ["4", "Traceability requirement: serial, lot or batch", "Traceability actually captured"],
      ["5", "Life limit notation and its type", "Life limit information actually captured"]]),
    P("**The as-built side comes from completed and closed build records**, meaning the work orders and the non-conformance record dispositions. If those are not closed, the as-built side is provisional and the report is provisional with it. A report on an open unit is a draft, whatever it is called."),
    C("Six deltas this comparison produces", [
      "A part on the as-designed data with **no entry** in the build record.",
      "A **quantity** that does not agree.",
      "A part recorded under a **different next higher part number**.",
      "A part required to be **serialized and captured only by lot**.",
      "A part noted life limited with **no matching life record, or a record on the wrong clock**.",
      "A **life record in the build system against a part the design does not note as life limited**, which usually means the design changed and the production system did not hear about it."]),
    P("**Include the small hardware.** Shims, washers, O-rings, potting compounds, adhesives and thread-locker are in scope. They are the items most often left out of a reconciliation and the ones most often missing from a unit."),
    C("What an open delta means to you", [
      "**An open delta is not automatically a finding against the supplier.** It is a difference that has not yet been dispositioned. Somebody still has to decide what happens about it.",
      "**An open delta on a unit presented as ready is a finding**, because the unit is not closed out and should not have been offered.",
      "**A clean report on a unit that later turns out to have a delta is the serious one.** The method cleared the unit and the method runs on every unit.",
      "So read the open items before you read the deltas. The open items tell you whether the report means anything yet."]),
    S("Absence in the record is itself the delta.",
      "It is not resolved by inspecting the article and concluding the part must be present. The article is not the evidence here. The record is.")
  ],
  check:{q:"A supplier submits a per-lot reconciliation report showing zero deltas. Two months later a unit from that lot is found with a bracket installed under a different next higher assembly than the parts list shows. What have you learned?",
   o:[
     "That one bracket was misinstalled, and the supplier should correct it",
     "That the reconciliation method either does not compare element 2 or was not run properly, which is a question about every unit the method has cleared",
     "That the parts list next higher part number is ambiguous",
     "That the report should have been submitted per unit rather than per lot"],
   a:1, why:"There is a real defect on one unit and that is the smaller half of it. Element 2 is next higher part number, and comparing it is exactly what the reconciliation was supposed to do. A clean report that missed a real delta says the method is not doing what it claims, and that method cleared every other unit in the lot. Correcting the bracket fixes one bracket. The reporting frequency is not the issue and neither is the parts list, which is the side that was right."}},
 {id:"M6-03", title:"How to read a part traceability record", body:[
    P("The last section defined this record and never showed you one. Here is what is on it and how to read each field."),
    TABLE(["Field", "What it carries", "How to read it"], [
      ["Part number", "The part identity", "Compare against the parts list at the governing revision, not against the last one you saw"],
      ["Unit identifier", "A serial number, or a lot or batch number", "Which one applies is set by the design, not by the supplier's convenience"],
      ["Date code", "Manufacture, cure or expiry date", "Required wherever a shelf-life or cure limit applies. A lot number with no date code does not satisfy a shelf-life notation"],
      ["Life limit and life consumed", "The assigned limit, and life consumed at delivery", "Required on a per-unit clock. A blank here on a life-limited part is not a clerical defect"],
      ["Part designations", "Safety-critical, life-limited, special handling", "Carried and reported. Who assigned them is one of three cases, and the statement of work names which"],
      ["Next higher assembly", "The assembly this part installs into", "This is what keeps a fleet-wide lot question answerable after an escape"]]),
    C("Serial against lot, and why it is not a quality ranking", [
      "A **serial number** applies where the approved basis for continued service depends on what happened to that individual unit.",
      "A **lot or batch number** applies, with a date code where a shelf-life or cure limit applies, where lot acceptance is sufficient.",
      "Both are unit identifiers. **Lot control is not a lesser form of control.** A part of catastrophic hazard severity may be legitimately lot controlled.",
      "Read the requirement before you challenge the record. A supplier who lot-controlled a part the design said to serialize has a defect. A supplier who lot-controlled a part the design said to lot-control does not."]),
    C("Two clocks, and the field that goes missing", [
      "A part limited by **cycles or operating hours** is serialized, because remaining life is a per-unit quantity. Its record carries **life consumed at delivery**.",
      "A part limited by **shelf life, cure date or storage age** is lot controlled with a **date code**, because the limit attaches to the lot.",
      "The field that goes missing most often is life consumed at delivery. A blank there on a per-unit clock is a part that can never be accurately tracked for the rest of its service life.",
      "**State the finding against the right clock.** Asking a shelf-life part for consumed life invites the supplier to answer that it is not serialized and was never meant to be, and the real defect survives the exchange."], "amber"),
    P("**Two rules about trace numbers.** They are never re-used and never revised. A modified unit keeps its original unit identifier even though its part number changes, so a unit identifier that traces to a superseded part number is not by itself wrong."),
    S("Read the parts list first, then the record.",
      "The record can only be scored against what the design required, and the design is the thing you hold.")
  ],
  check:{q:"A traceability record shows an adhesive installed, with a lot number and no date code. The parts list carries a shelf-life notation against that line. You write the finding. What does it say?",
   o:[
     "A life-limited part was delivered with no consumed-life record",
     "A shelf-life part was delivered with no date code and no cure or expiry evidence",
     "A part requiring serialization was captured only by lot",
     "Nothing. Lot control is sufficient for adhesives"],
   a:1, why:"The defect is real and only one statement of it will survive. A shelf-life notation puts the part on the lot clock, and what that clock requires is a date code with cure or expiry evidence. Consumed life belongs to the cycles and hours clock on a serialized part, so asking for it here lets the supplier correctly answer that the part is not serialized. Nothing required serialization. And lot control is not the problem, because lot control is what a shelf-life part is supposed to have."}},
 {id:"M6-04", title:"Evidence accrues; it is not assembled", body:[
    P("A determination reconstructed from memory a week before it is due is not a determination."),
    L([
      "Log every supplier data deliverable on receipt, and score it at review: accepted first pass, accepted with comment, or rejected, with defect codes for anything less than first pass.",
      "Log every finding and escape as it occurs.",
      "Flag safety relevance on any finding affecting a hazard control, a safety-critical item or a life-limited item, and route it into the safety data stream."]),
    C("Effectiveness includes what a supplier FAILS to submit", [
      "These events look like nothing happening, which is exactly why they need logging as findings:",
      "\u2022 Post-delivery discovery of a departure that should have been variance-requested. \u2022 An unauthorized process change, found after the fact. \u2022 Traceability gaps found at receiving. \u2022 Reconciliation deltas the supplier\u2019s own report did not disclose. \u2022 Configuration-related nonconformances."]),
    S("The strongest single indicator of an ineffective process: a delta discovered by company receiving that the supplier report cleared as no-delta.",
      "It means the detection mechanism itself does not work, so everything previously reported as clean is unevidenced."),
    P("Five records carry all of this, and they are standing records: open continuously, written to as events occur, never opened for the first time at determination:"),
    TABLE(["Record", "What each row carries"], [
      ["The classification log", "Supplier, item and scope, work types, item identifiers, audit designation status, whether the standing conditional clause is present, safety dispositions, and the classifier and CM signature with dates"],
      ["The deliverable receipt log", "Every supplier data deliverable received: date, reviewer, the review result, and defect codes for anything short of first-pass acceptance"],
      ["The findings and escapes log", "Findings, escapes and non-submittal events per supplier, with safety relevance flagged and the safety report reference where one was routed"],
      ["The effectiveness determination records", "The determination, its rationale, the evidence relied on, the determining authority, the date, and the next-due date"],
      ["The actions log", "Actions arising from determinations and findings, with owner, due date, status, and closure evidence including extent checks"]]),
    S("These are kept as structured, queryable data, not as narrative documents.",
      "The performance measures are computed from them. **Records that cannot be queried cannot be measured**: and a supplier picture that has to be reconstructed by reading through prose is a picture nobody will produce often enough to act on.")
  ],
  check:{q:"Receiving finds a superseded bracket revision on two units. The supplier\u2019s reconciliation report for that lot stated no open deltas. Which is the more serious signal?",
   o:[
     "The superseded bracket: it is the tangible hardware problem",
     "The clean reconciliation report: it means the detection mechanism itself does not work",
     "Neither is serious if the units are conforming in every other respect",
     "They are equally serious"],
   a:1, why:"A bracket on two units is one delivery that went wrong. A report that cleared it as no-delta means the control that should catch such things does not operate, which puts every previous clean report in question."}},
 {id:"M6-05", title:"The seventeen evidence streams", body:[
    P("Accrued evidence is read stream by stream. Each has a shape when it is working, and a signal when it is not. The failure signals are worth memorizing. They are what you are actually looking for when a deliverable lands on your desk. Not every stream applies to every supplier. You evaluate a supplier only on the streams you imposed on them."),
    TABLE(["Evidence stream", "What effective looks like", "The failure signal"], [
      ["CM plan adequacy", "The plan implements the imposed requirement set, including recursive sub-tier flowdown, and is kept current through revisions", "A plan silent on sub-tier flowdown, or never revised as the scope grew"],
      ["Reconciliation process capability", "A documented method, accepted, covering all deliverable configurations at scale", "The method covers only sampled items, or reports keep arriving with no method on file at all"],
      ["Reconciliation reporting", "Reports per delivery or lot; deltas dispositioned and aged within threshold; content expressed in traceability-record identifiers", "A delta found by company receiving that the report cleared as no-delta. The strongest single indicator of an ineffective process"],
      ["Part traceability completeness", "Records complete on first pass: life limit and life consumed, the safety-critical and special handling part attribute designations, next-higher-assembly traceability", "A blank consumed-life field on a life-limited item. Missing part attribute designations where the supplier holds design authority and was supposed to propose them"],
      ["Change control discipline", "Change proposals complete on first pass; no baseline-affecting change implemented without approval", "Changes visible in delivered hardware or data that were never proposed"],
      ["Variance discipline", "Departures variance-requested before delivery; recurring variances converted to change action", "Post-delivery discovery of a departure that should have been variance-requested"],
      ["Process change notification", "No unauthorized change to frozen or approved processes; notifications timely within the agreed notice period", "A process, facility or tooling change discovered after the fact"],
      ["Status accounting currency", "Records timely, current, historically traceable and retrievable per the agreed data terms", "Records reconstructed on request rather than maintained"],
      ["Audit performance", "Where designated for audit: audits conducted or supported per role, substance in full, action items closed by their agreed dates", "Substance tailored: verification steps omitted rather than ceremony simplified"],
      ["Vendor change and discontinuance notification", "Notices arrive within the agreed period, carrying effectivity, last-time-buy terms, and alternates", "A product change or an end-of-life discovered at receiving inspection, or after the part is already unavailable"],
      ["First article performance", "First article complete and accepted before first production delivery, and re-accomplished on each stated trigger", "Production delivered against an incomplete or superseded first article"],
      ["Provisioned materiel control", "Materiel checked against released content at receipt, with discrepancies reported before anything is installed", "A kit or issue discrepancy that first surfaces at the end-item reconciliation, or at delivery"],
      ["Change embodiment and effectivity accuracy", "Changes embodied at the directed effectivity and recorded per unit", "Two units in the same block at different configurations, both believed correct"],
      ["Delivery configuration completeness", "Every deferred item, traveler, shortage, and carried deviation documented at delivery with an approving authority and a closure plan", "Open work discovered after delivery that no delivery statement disclosed"],
      ["Sub-tier product data return", "Sub-tier part numbers and unit identifiers returned with traceability to the assembly above, and sub-tier inspection confirmed", "Sub-tier data reconstructed on request rather than reported. A tier you cannot see through"],
      ["CM point of contact currency", "A named, reachable CM contact on file, with changes of incumbent notified", "Notices routed to somebody who left. Nobody knows who can approve a change at the supplier"],
      ["CM process audit findings", "Findings closed by their suspense dates; no repeats", "Repeat findings across audit cycles"]]),
    S("A supplier is evaluated against the requirement set actually imposed on it: streams that were not imposed are not evaluated.",
      "A catalog vendor with no reconciliation requirement does not score badly on reconciliation. They score nothing on it, because nothing was asked. Grading a supplier against requirements you chose not to flow is grading your own classification, not their process.")
  ],
  check:{q:"A build-to-print supplier was never required to submit status accounting reports: the requirement was not imposed. At determination time, how is that stream treated?",
   o:[
     "Scored as a deficiency, since the records are not available",
     "Scored as effective by default, since nothing went wrong",
     "Not evaluated: a supplier is evaluated against the requirement set actually imposed on it",
     "Scored against the standard applied to full-development suppliers, for comparability"],
   a:2, why:"Neither a deficiency nor a free pass. The stream is simply out of scope for that supplier. If the absence of those records is actually a problem, the fault is in what was flowed, which is a classification and derivation question to reopen, not something to hold against the supplier at determination."}},
 {id:"M6-06", title:"How to read a supplier CM plan", body:[
    P("The supplier CM plan is a deliverable. You receive it and you score it at review. It is usually the first evidence you get about a supplier, and it arrives before anything has been built."),
    P("A CM plan describes how the supplier will perform the CM requirements you imposed. So read it against what you imposed, not against a generic idea of good CM. **A plan is adequate when it covers the requirement set that supplier actually received.**"),
    TABLE(["What to look for", "What adequate looks like"], [
      ["Scope", "Names the procured items and the work types. A plan that does not name what it covers covers nothing"],
      ["Identification", "How part numbers, unit identifiers and revisions are assigned and applied, including marking"],
      ["Change control", "Who approves what, at what level, and where the boundary with your company's authority sits"],
      ["Status accounting", "Which records are kept, where, and how a question is answered from them"],
      ["Reconciliation", "The method: data sources, comparison, delta disposition, frequency, records produced"],
      ["Sub-tier flowdown", "How the same requirements reach their suppliers, and how sub-tier data comes back"],
      ["Named people", "A CM point of contact, a role, a backup, and the change authority interface point"]]),
    C("A plan that describes an intention rather than a practice", [
      "**Watch the verb tense.** Will be established, is being developed, will be maintained. A practice is described in the present tense because it exists.",
      "**Watch for the absent actor.** Changes are controlled. By whom, against what, and with what record?",
      "**Watch for the restated requirement.** A plan that repeats your statement of work back to you in the supplier's letterhead has told you nothing about how they will do it.",
      "**Watch for the missing seam.** A plan that never says where their change authority ends and yours begins has not thought about the interface, and that seam is where escapes happen."]),
    P("**Score the plan against the imposed set, requirement by requirement.** Where a requirement you imposed has no corresponding practice in the plan, that is a finding now, while it costs a revision. Later it costs a delivery."),
    C("What a plan cannot tell you", [
      "A plan is **capability evidence**. It says a method exists.",
      "It is not **performance evidence**. It does not say the method is being run.",
      "That is why the reconciliation process documentation and the recurring reconciliation report are two separate flowdowns, and why both are imposed.",
      "So a good plan raises your confidence and settles nothing. The determination is made against evidence that accrues, and the plan is the first entry in it."]),
    S("Read the plan against the statement of work, side by side, once.",
      "It takes an afternoon and it is the cheapest finding you will ever raise on that supplier.")
  ],
  check:{q:"A supplier CM plan is thorough, well written, and describes a full CM system. It does not mention sub-tier flowdown. The supplier subcontracts a machined housing. What do you do?",
   o:[
     "Accept the plan. It is thorough, and sub-tier flowdown is covered by the statement of work",
     "Raise a finding against the plan now, because you imposed recursive flowdown and the plan describes no practice for it",
     "Wait for the first reconciliation report and see whether sub-tier data appears",
     "Reject the plan and require a full rewrite"],
   a:1, why:"You score the plan against the requirement set that supplier received, and recursive flowdown is imposed wherever the supplier has sub-tiers. A requirement with no corresponding practice in the plan is a finding, and it is cheapest now, while the answer is a plan revision. The statement of work imposing it is what makes it a finding rather than a preference. Waiting for a report means finding out after parts have been built through a tier nobody described. A full rewrite is disproportionate to one gap."}},
 {id:"M6-07", title:"Three determinations", body:[
    P("Determine effectiveness over the rolling accrued evidence, **against the requirement set actually imposed on that supplier.** A supplier is evaluated on what was flowed to it, not against a uniform standard. Streams that were not imposed are not evaluated."),
    STEPS([
      {h:"Effective", b:"The imposed requirements are being met. Routine surveillance continues."},
      {h:"Conditionally effective", b:"Deficiencies exist, with credible correction underway. Actions from the ladder apply."},
      {h:"Ineffective", b:"Systemic failure to meet imposed requirements. Actions from the ladder apply, and escalate."}]),
    C("The judgment that separates the three", [
      "**Isolated, non-systemic defects with credible correction** support Effective or Conditionally effective.",
      "**Evidence that a control did not operate**, rather than that a record contained an error, supports Conditionally effective at best, and Ineffective where the pattern recurs or the evidence is safety-relevant.",
      "A wrong entry on a form is a record defect. A departure that reached delivery without a variance request is a control that did not operate. They are not the same finding wearing different clothes."], "teal"),
    P("Determinations run on a tiered cadence as a backstop. Work type sets the cadence, because the exposure differs."),
    L([
      "**Annually** for full-development and software work: the heaviest flowdown, the most to go wrong, and design authority sitting at the supplier.",
      "**Annually to every two years, by risk**, for build-to-print, source-controlled design-and-build, and repair work.",
      "**Event-driven** for catalog items and special-process services: there is no steady stream of configuration deliverables to read, so the events are what there is."]),
    P("The cadence is a backstop, never the mechanism. A determination also runs on any of five triggers. A rejection streak or a sustained decline in first-pass acceptance. Any safety-relevant escape. A reconciliation miss the company finds itself. An adverse configuration audit result. A source, process or facility change.")
  ],
  check:{q:"Which finding indicates a control that did not operate, rather than a record defect?",
   o:[
     "A transposed serial number on a traceability record",
     "A late submittal of a status accounting report",
     "A departure from released design discovered after delivery that should have been variance-requested",
     "A formatting non-compliance against the deliverable definition"],
   a:2, why:"The first, second and fourth are defects in records or timeliness. A departure reaching delivery without a variance request means the mechanism that should have stopped it never ran, which supports Conditionally effective at best."}},
 {id:"M6-08", title:"The actions ladder, and what follows", body:[
    P("A determination of less than effective is **an action-forcing event, not a filing event.** Select and record actions proportionate to the determination and to the safety relevance of the evidence."),
    STEPS([
      {h:"Increased surveillance", b:"And elevated deliverable review: full review rather than sampling."},
      {h:"Corrective action request", b:"Tracked to closure on the corrective artifact, not on an assertion of completion. Include an extent check across delivered units where the finding indicates a control failure rather than an isolated error."},
      {h:"Source inspection", b:"Or witness points at defined operations."},
      {h:"Delivery or payment holds", b:"Per the contract terms, administered by subcontracts."},
      {h:"Award restriction", b:"Restriction or suspension of new awards, and where warranted, disqualification."}]),
    P("An **ineffective** determination requires four things beyond the ladder. So does a conditionally effective one founded on safety-relevant evidence. These close loops that would otherwise stay open:"),
    TABLE(["Required action", "What it protects against"], [
      ["Re-run the audit designation assessment for items that supplier builds", "A product built by a process now known to be ineffective, never sampled by audit. Supplier ineffectiveness and escape history are risk factors in the audit designation assessment"],
      ["Report into the safety data stream where evidence is safety-relevant", "Configuration escapes on safety-significant product treated as a supply chain matter and never reaching the people who own the hazard analysis"],
      ["Review any validated equivalent control that relies on that supplier\u2019s process", "An equivalent control resting on an ineffective process is no longer validated, and returns to the safety disposition gate"],
      ["Re-assess classification and the derived requirement set", "Requirements tailored on the assumption of a capable process. That assumption has just been disproved"]])
  ],
  check:{q:"A supplier responds to a corrective action request by confirming in writing that the process has been fixed. What is needed before closure?",
   o:[
     "Nothing further: the supplier owns their process",
     "A follow-up audit at the next scheduled interval",
     "The corrective artifact itself, plus an extent check across delivered units where a control failed",
     "Acquirer concurrence on the closure"],
   a:2, why:"Corrective actions close on the corrective artifact, not on an assertion of completion. Where the finding indicates a control failure rather than an isolated error, the extent check across already-delivered units is part of closure, not an optional extra."}},
 {id:"M6-09", title:"Recursion, and safety requirements at depth", body:[
    S("A tier that cannot be seen through is a tier that is not controlled.",
      "Wherever a supplier has sub-tiers, the comply-or-suitably-tailor obligation flows again, and sub-tier product data, part numbers and serial numbers, returns upward with traceability to next higher assemblies."),
    P("This is why the sub-supplier CM plan must address sub-tier flowdown, and why a plan silent on it is a **named failure signal** rather than a missing detail. Your company does not contract with the lower tiers: the supplier does. What you impose is the recursive obligation, and what you verify is that they have discharged it."),
    S("Requirements mandatory for safety do not dilute with depth.",
      "Tier three is not a place where the obligation becomes optional. Supplier-tier tailoring of a requirement mandatory for safety goes through the safety disposition gate, is evaluated independently where an equivalent control is proposed, and is recorded at the named authority level."),
    C("Common failure modes to recognize", [
