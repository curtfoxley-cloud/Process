  scen:"Below are rows from a FMECA on the same environmental control unit. Read them as a CM engineer nominating candidates. Do not screen and do not designate anything yet.\n\nItem: Air cycle machine turbine wheel. Failure mode: Burst. Effect: Uncontained release, loss of unit, possible structural damage. Criticality: 1. Cause: Fatigue, overspeed.\n\nItem: Bearing oil. Failure mode: Degradation. Effect: Elevated bearing wear rate. Criticality: 4. Cause: Thermal cycling, contamination.\n\nItem: Overspeed protection function. Failure mode: Loss of protection. Effect: Turbine overspeed not prevented. Criticality: 1. Cause: Multiple.\n\nItem: Temperature control valve. Failure mode: Fails open. Effect: Cabin overtemperature. Criticality: 2. Cause: Actuator jam.\n\nItem: Heat exchanger core. Failure mode: Internal leakage. Effect: Bleed air contamination of cabin air. Criticality: 1. Cause: Corrosion, fatigue.\n\nItem: Water separator coalescer. Failure mode: Blockage. Effect: Reduced flow. Criticality: 3. Cause: Contamination.\n\nItem: Mounting bracket. Failure mode: Fracture. Effect: Unit displacement, duct strain. Criticality: 2. Cause: Fatigue.\n\nItem: Unit nameplate. Failure mode: Illegible. Effect: Identification not readable. Criticality: 4. Cause: Abrasion.\n\nAnalysis note: This FMECA covers the unit as delivered. The bleed air supply upstream of the unit inlet is analyzed separately.",
  parts:[
   {id:"a", q:"Which items enter the candidate set on the strength of their own failure consequence? Give the one-line reason for each."},
   {id:"b", q:"Which rows require clarification before you can do anything with them? Say exactly what you would ask and who you would ask."},
   {id:"c", q:"Now look sideways. Which row describes a failure whose consequence lands on a different item, and what does that make the first item? Name the pattern."},
   {id:"d", q:"The turbine wheel is criticality 1 and the bearing oil is criticality 4. Explain why criticality is not a CI selection criterion, using these two rows."},
   {id:"e", q:"Read the analysis note. What does it tell you about what is missing, and what would you do about it?"},
   {id:"f", q:"One row produces no candidate at all. Which one, and why does that matter to say out loud?"},
   {id:"g", q:"Produce your candidate list, then compare it against the list you produced in Exercise 14 from the specification. Which items appear in only one of the two, and why? Hold both lists. You will lay a third beside them in Exercise 16."}
  ]},
 {id:"M2-E3", title:"Exercise 3: Read the hazard analysis like CM",
  scen:"Below is an extract from a subsystem hazard analysis on the same environmental control unit you worked in Exercises 14 and 15. Read it as a CM engineer nominating candidates. Do not screen and do not designate anything yet.\n\nHAZ-101. Hazard: Uncontained turbine burst. Cause: Turbine wheel overspeed following load loss. Severity: Catastrophic. Control: Overspeed protection implemented in the unit controller software, plus a containment ring around the turbine section. Verification: Overspeed test and containment demonstration.\n\nHAZ-102. Hazard: Cabin air contamination. Cause: Heat exchanger internal leakage admitting bleed air contaminants. Severity: Critical. Control: Heat exchanger core leak test at overhaul, interval stated in the airworthiness limitations. Verification: Test procedure and interval substantiation.\n\nHAZ-103. Hazard: Cabin overtemperature. Cause: Temperature control valve fails open. Severity: Critical. Control: Independent overtemperature sensor and shutoff, separate from the primary control loop. Verification: Failure mode test.\n\nHAZ-104. Hazard: Turbine bearing failure leading to burst. Cause: Loss of lubrication. Severity: Catastrophic. Control: Oil replacement interval and oil specification conformance. Verification: Bearing life substantiation.\n\nHAZ-105. Hazard: Unit displacement in flight. Cause: Mounting bracket fatigue fracture. Severity: Critical. Control: Bracket inspection interval, and torque control procedure at installation. Verification: Fatigue analysis and inspection interval substantiation.\n\nHAZ-106. Hazard: Crew injury during servicing. Cause: Hot surface contact at the bleed air inlet. Severity: Marginal. Control: Warning placard adjacent to the inlet flange, and a cool-down step in the servicing procedure. Verification: Inspection of installed placard.\n\nAnalysis note: This analysis addresses the unit and its installation. Bleed air quality upstream of the unit inlet is controlled by the engine bleed system analysis.",
  parts:[
   {id:"a", q:"Work the control column, not the hazard column. For each of the six records, say where the control actually lives: a design feature in an item, a software function, a life limit or interval, a separation or routing rule, a marking, or a procedure."},
   {id:"b", q:"Which controls resolve to an item you can nominate, and which resolve to a document? For the document cases, name the document you would ask for and say why its baseline matters."},
   {id:"c", q:"HAZ-103 describes an independent sensor and shutoff, separate from the primary loop. What is the control really, and what can a change destroy without touching either part number?"},
   {id:"d", q:"HAZ-104 controls a catastrophic hazard using an oil interval and an oil specification. What does that make the oil, and how does this row connect to the row you flagged in Exercise 15?"},
   {id:"e", q:"HAZ-106 is only marginal severity and its control is a placard and a procedure. Explain why it is still a CM concern, and name the two configuration-controlled things it produces."},
   {id:"f", q:"Read the severity column across all six. What does severity determine, and what does it not determine? Be precise about the difference between severity and CI selection."},
   {id:"g", q:"Read the analysis note. What is outside this analysis, and what would you do about it?"},
   {id:"h", q:"Produce your candidate list. Then lay it beside your lists from Exercises 14 and 15. Which items appear in all three sources, which in only one, and what does the pattern tell you about nominating from a single document?"}
  ]},
 {id:"M2-E4", title:"Exercise 4: Translating safety evidence",
  scen:"You are the CM engineer on a military transport program derived from a civil type, so both a military system safety population and civil airworthiness limitations exist. In one week, the following crosses your desk. (1) The customer\u2019s engineering authority issues a critical safety item designation for a flap track fitting. (2) The system safety analysis names \u201ccargo fire suppression\u201d as a safety-critical function. (3) The airworthiness limitations list a corrosion inspection task for a wing zone. (4) The maintenance program shows a shelf-life limit on the cargo compartment fire suppression bottles. (5) The engine overhaul manual identifies two influencing parts for the fan disc life model. (6) A drawing arrives with a key characteristic flagged on a bracket hole pattern.",
  parts:[
   {id:"a", q:"For each of the six, name what the evidence is attached to: an item, a function, a task, a location or zone, or a feature."},
   {id:"b", q:"Which of the six answer the safety-critical screen on their own? For those, what does CM record?"},
   {id:"c", q:"For the fire suppression function and for the bottles themselves, write the exact request you would send to the safety team."},
   {id:"d", q:"The flap track fitting is small, and a colleague argues it fails the end-use function gate. Respond."},
   {id:"e", q:"The two influencing parts: which screen do they pass, and why not the safety-critical screen?"},
   {id:"f", q:"The wing zone inspection task and the bracket key characteristic: what do you screen in each case, and where does control live if no CI is designated?"},
   {id:"g", q:"Name one class of safety-significant item that none of this week\u2019s evidence would ever surface, and say how those items get found."}
  ]},
 {id:"M2-E5", title:"Exercise 5: The end-use gate",
  scen:"Screen each item against the end-use function gate only. State pass or fail, and if it fails, say where the item is controlled instead.",
  parts:[
   {id:"a", q:"A titanium alloy billet, specified by material standard, from which structural fittings are machined."},
   {id:"b", q:"A structural bracket that carries no load-path requirement of its own, but positions a safety-critical sensor to its specified alignment."},
   {id:"c", q:"The compiler used to build the flight software."}
  ]},
 {id:"M2-E6", title:"Exercise 6: The criteria screen",
  scen:"A cabin pressure control valve is a candidate CI. It is procured from a single qualified source with a fourteen-month lead time. Hazard analysis classifies its failure as capable of causing loss of primary system capability. It requires a dedicated test set for depot maintenance and will appear in the technical manuals. The Acquirer has expressed no view.",
  parts:[
   {id:"a", q:"Which criteria does it meet? List every one that applies, with a one-line justification each."},
   {id:"b", q:"How many criteria are needed to designate it as a CI? Why list more than one?"},
   {id:"c", q:"What concurrence, if any, would be needed if the program proposed NOT to designate it as a CI?"}
  ]}
 ]
},
{
 id:"M3", label:"Module 3", title:"Structuring and maintaining the identification", sub:"The CI structure, the interface register, the documentation determination, and what happens when any of them changes",
 sections:[
 {id:"M3-01", title:"The selection assessment record", body:[
    P("You have now been told several times to record the rationale for every candidate. Here is the artifact that instruction refers to. One assessment per candidate, and it is short."),
    TABLE(["What it carries", "Why that field is there"], [
      ["The candidate item, and the part or model reference it is known by today", "So the assessment can be found again by someone who knows the item under a different name than you did"],
      ["The assessor and the date", "So a later reader knows who judged it and what was known at the time. Assessments made before a hazard analysis existed read differently from ones made after"],
      ["The result of each of the three gates", "A reader needs to know which gate an item failed, because the three mean different things. Not an item. No end-use function of its own. Procured inside a parent that should have been screened instead. Failing a gate and failing the screen are different facts, and so are the gates from each other"],
      ["Each criterion, with a yes or no, the rationale for that answer, and the document reference the rationale rests on", "Every row, not just the ones that were met. A recorded \u201cno\u201d against the logistics criterion is a claim someone made and can be challenged, and the document reference is what lets them challenge it. The checklist carries two fields per criterion for exactly this reason"],
      ["The software rule where it applies, and the safety linkage", "The concurrence lives with the assessment, not in somebody\u2019s inbox"],
      ["Four concurrence blocks, each recorded where it applies", "**System Safety**, required where criterion (b) was answered yes and the item is not designated as a CI. **RM&SH**, required where the determination rests on failure modes and effects or criticality analysis, on single point or common mode failure identification, or on a maintainability or health-monitoring driven limit. **Systems Engineering**, required on the end-use function gate and where the determination rests on specification or interface considerations. **CM**, the determination itself"],
      ["The design authority basis, where the item was screened at a procured level", "So a later reader knows why the assessment stopped where it did. If your company subsequently acquires the data rights or initiates a company-controlled modification, that basis has changed and the assessment is re-run"],
      ["The disposition, and the parent, where the item is not designated as a CI", "A rejected candidate is not released into the wild. The assessment names what does control it. For a gate 2 or no-criterion outcome that is the parent CI whose documentation governs. For a gate 3 outcome it is the higher parent item that was procured as a unit and screened instead, which is a different fact"]]),
    S("CI selection is a CM decision. The concurrences confirm that the technical basis is sound. They do not make the selection.",
      "Three of the four blocks are somebody else certifying a fact you relied on. The fourth is you, deciding. A concurrence that arrives without a determination beside it is an opinion nobody acted on, and a determination that cites an analysis without the concurrence of the function that owns it is a claim you made on their behalf."),
    S("A \u201cno\u201d with a reason is a decision. A \u201cno\u201d with no record is indistinguishable from never having looked.",
      "This is the difference the Acquirer is testing when they ask why a particular assembly is not a CI, and the answer they are hoping not to hear is that it simply is not on the list."),
    P("Retain assessments for the program life alongside the rest of the identification records, and they are **re-run on trigger rather than replaced.** Design evolution, a new hazard analysis, an Acquirer designation, a change in the supportability strategy, each re-opens the question for the affected candidates. The retained record is what the next assessment starts from, so the work is a re-evaluation rather than a fresh guess by whoever holds the job that year."),
    C("What a usable rationale looks like", [
      "**Weak:** \u201cN/A.\u201d \u201cNot required.\u201d \u201cToo small.\u201d None of these can be checked, and none tells the next person anything.",
      "**Usable:** \u201cNot designated as a CI. Fails gate 2, no independent function. Controlled by the material specification called out on the parent CI\u2019s drawings.\u201d \u201cDesignated as a CI. Criterion (b), hazard analysis rates failure as capable of causing loss of primary system capability. Also criterion (g), dedicated depot test set and technical manual.\u201d",
      "**A usable rationale names its document.** \u201cHazard analysis rates failure as capable of causing loss of primary system capability\u201d is a claim. The same sentence with the analysis number and its revision is evidence. The checklist gives you a document reference field beside every rationale field, and a rationale with the reference blank is half a record."])
  ],
  check:{q:"Why does the assessment record carry the assessor and date, and why is it retained rather than overwritten when the assessment is re-run on trigger?",
   o:[
     "For audit traceability only: the content of a superseded assessment has no further use",
     "Because personnel changes require reassignment of the record",
     "Because a later reader needs to know what was known at the time, and because the retained assessment is what the re-run starts from rather than a fresh guess",
     "Because the Acquirer requires a complete revision history of every selection decision"],
   a:2, why:"Selection is iterative, so assessments accumulate rather than replace one another. Knowing an item was screened before the hazard analysis existed explains an answer that would otherwise look careless, and the previous rationale is the most useful input the next assessor has."}},
 {id:"M3-02", title:"Dividing software into CIs", body:[
    P("Software is always designated as a CI. That is a rule. **How much software constitutes one CI is a judgment**: and the training so far has given you no way to make it, because every worked example has been hardware."),
    P("A software CI is an aggregate of software that satisfies an end-use function and is designated for purposes of specification, interfacing, qualification testing and configuration management. It is composed of one or more software units: source code, object code, control code, control data, or a collection of these. Read that definition closely and the questions fall out of it, and they are the familiar ones:"),
    L([
      "Does this aggregate satisfy an **end-use function** of its own, or is it a part of something else\u2019s function?",
      "Will it be **specified** separately: does it get its own requirements document?",
      "Does it have **interfaces** of its own that need defining and controlling?",
      "Will it be **qualification tested** as a unit, against its own requirements?",
      "Does it need its own **version identity and change effectivity**: will it be re-versioned and fielded on its own schedule?"]),
    CARDS([
      {h:"Divided too coarsely", b:"One software CI for an entire load. Every correction to any part re-versions the whole thing, so the version identifier stops telling anyone what actually changed. The qualification scope for a display string change is the entire load. And the effectivity address is shared, so nothing can be fielded independently of anything else."},
      {h:"Divided too finely", b:"Dozens of software CIs, each carrying a specification, a version identity, a qualification basis and its own interfaces. The integration burden is real. The version matrix becomes a management product in its own right, and which build of each is compatible with which build of the others is now a question somebody maintains an answer to."}], 2),
    S("The same failure directions as hardware, for the same reason: the CI is the unit of separate management, and separate management has a cost in both directions.",
      "If a piece of software will be specified, tested, versioned and fielded on its own, it is its own CI. If it travels with its neighbors in all four, it is a unit within theirs."),
    P("Two rules sit alongside the judgment. **Elements of the software development environment that form part of the system get product-unique identifiers**: compilers, linkers, loaders, developmental libraries, configuration settings, automation scripts. They are identified not because they satisfy an end-use function but because the build cannot be reproduced without them. **Firmware follows the arrangement, not the technology.** Where the code and its device are controlled together on a single altered item drawing, one part number represents the device with the code in it. Where they are controlled separately, the code is its own software CI with its own version identifiers."),
    C("The same-CI question arises for software too", [
      "One software CI with several versions, or several software CIs? That is the same question section M3-14 answers for hardware, and the same triggers answer it. Run them, with two substitutions.",
      "**Read version identifier for PIN. Read build or load for variant.** The decision tool makes the swap for you once you answer its software scope question, and it prints CSCI in the verdict.",
      "**The product unit record structure is different, and it is not a substitution.** Software carries identity on the loadable part number and the baseline. It never carries a physical unit identifier, so the product unit record-structure test in M1-08 in Module 1 lands on \u201cconfiguration identity only\u201d for every software CI you will ever screen."])
  ],
  check:{q:"A flight display application and the control laws it renders are written by one team, run on one processor, and are loaded as a single image. Each is separately specified, separately qualification tested against its own requirements, and re-versioned on its own schedule. One software CI or two?",
   o:[
     "One: they share a processor and are delivered as a single load",
     "One, with the control laws recorded as a unit within it",
     "Two: separate specification, separate qualification and separate version and effectivity needs are exactly what designates separately",
     "Two, but only if the control laws are safety-critical"],
   a:2, why:"Sharing a processor and a load image is a packaging fact, not a management one, in the same way that sharing an interface control document does not make two hardware items one CI. Separate specification, separate qualification basis and independent re-versioning are three of the questions that define a software CI, and here all three point the same way."}},
 {id:"M3-03", title:"Selecting at the right level", body:[
    P("Select CIs at the level optimum for **both acquisition and support**: the level at which items are specified, contracted, accepted, and at which logistics organizes and reports maintenance and modification actions. Both failure directions are real and both are expensive."),
    CARDS([
      {h:"Over-designation", b:"Hundreds of CIs at fastener and bracket level. Every trivial change becomes formal change traffic against its own CI. Board time consumed by triviality, real changes queued behind noise, status accounting nobody reads. Control degrades because there is too much of it."},
      {h:"Under-designation", b:"Whole subsystems buried inside one CI. Changes to distinct functions share one effectivity address, so they cannot be cut in independently. Hazard traceability stops above the item that causes the hazard. Logistics cannot report maintenance at the level it is performed."}], 2),
    C("A useful test when you are unsure", [
      "**Will a change to this item routinely need to be dispositioned, tracked and cut into service independently of its neighbors?**",
      "If yes, it needs its own effectivity address, one of the main reasons separate CIs exist. If changes will normally travel with the parent, it does not."])
  ],
  check:{q:"A program has 340 CIs, most at individual bracket and connector level. What is the practical consequence?",
   o:[
     "Excellent visibility and control, at some administrative cost",
     "Unmanageable change traffic, with real changes queued behind trivial ones: control degrades because there is too much of it",
     "A compliance finding, but no operational effect",
     "Reduced audit scope, since each CI is small"],
   a:1, why:"Over-designation is not over-control; it is a different kind of loss of control. Board time goes to triviality, status accounting stops being read, and genuine changes wait behind noise."}},
 {id:"M3-04", title:"The CI structure", body:[
    P("Selection produces a set of CIs. Structure puts them in an order, and the order does real work, because it defines the parents, the boundaries and the reporting lines everything downstream uses."),
    C("CM builds and owns the CI structure", [
      "Systems Engineering decomposes the system architecture. That is their product and CM does not write it.",
      "**CM builds the CI hierarchy** and owns it. The hierarchy mirrors the architecture decomposition as closely as the selection criteria allow, because two structures that disagree produce two versions of the truth.",
      "They are not always identical, and that is expected. The architecture decomposes function. The CI structure organizes what is separately specified, contracted, accepted and supported. Where the two diverge, CM records why the CI structure sits where it does.",
      "CM assigns each CI its parent, its children, its owning design activity and its control tier, and maintains the CI index. If the structure is wrong, that is a CM finding."]),
    P("A product structure is built by decomposing the system into its levels of assembly. The conventional five, top to bottom:"),
    STEPS([
      {h:"System or end item", b:"The final combination of end products, component parts, software and materials, ready for its intended use."},
      {h:"Subsystem", b:"A combination of assemblies performing an operational function within the system: a major subdivision of it."},
      {h:"Assembly", b:"Parts or subassemblies joined to perform a specific function, and capable of disassembly."},
      {h:"Subassembly", b:"Two or more parts forming a portion of an assembly, replaceable as a whole but with individually replaceable parts."},
      {h:"Part", b:"One piece, or pieces joined so that they are not normally taken apart without destroying their designed use."}], "tl"),
    S("CIs may be designated at any level of assembly.",
      "The levels describe the product. They do not tell you where the CIs go: that is the selection judgment of the previous section. What they give you is a shared vocabulary for arguing about it."),
    P("For each CI, record its parent, its children, and the owning design activity. Then two control designations that decide who is in charge of what:"),
    CARDS([
      {h:"Acquirer-controlled", b:"The CIs the Acquirer specifies, baselines and controls. Their designation is the Acquirer\u2019s to make, their product baseline is the Acquirer\u2019s to establish, and changes to them run to the Acquirer\u2019s approval authority."},
      {h:"Supplier-controlled", b:"Below the Acquirer-controlled level, **the Supplier determines** which items to place under internal configuration management and what documentation types to use. This is not a gap in control: it is control exercised by your company, on its own authority, against the same criteria."},
      {h:"Sub-tier developed", b:"An item developed by a sub-supplier is a CI **from your company\u2019s point of view**, and equivalent CM requirements are flowed down to the organization that builds it. That sentence is the entire premise of Modules 4 to 7."}]),
    P("Each CI also carries a **type**: hardware, software, or firmware. The first two are what they sound like. Firmware is the case where code and the device it lives in are managed as one thing. Flag it in the index. It is the type people forget has two natures."),
    C("Where everything that is not a CI lives", [
      "Every part sits somewhere in the product structure. Not everything in the product structure is a CI, and the items that are not are controlled within their parent CI\u2019s configuration documentation.",
      "**Which is why a rejected candidate has to name its parent.** \u201cNot a CI\u201d is only half an answer. The other half is which CI\u2019s documentation controls it, and an assessment that stops at the first half has left the item genuinely uncontrolled rather than controlled elsewhere.",
      "**Three verdicts need a parent named, not one.** An item that fails gate 2 names the parent CI whose documentation controls it. An item that meets no criterion names the same thing. And an item that fails gate 3 names the **higher parent item that was procured as a unit and screened in its place**, which is a different fact and is recorded as one. The checklist relabels the field to ask for it."])
  ],
  check:{q:"An assembly sits two levels below the lowest Acquirer-controlled CI. Who decides whether it is placed under configuration management, and against what?",
   o:[
     "Nobody: below the Acquirer-controlled level, items are controlled only by the drawings that define them",
     "The Acquirer, since all designation authority is theirs",
     "The Supplier, applying the same criteria and determining the documentation types to use",
     "The sub-supplier who builds it, under their own CM system"],
   a:2, why:"Below the Acquirer-controlled level the Supplier determines which items to place under internal configuration management and what documentation types apply. The authority changes hands; the criteria and the discipline do not. And where the item is developed by a sub-supplier, it is a CI from your company\u2019s point of view with equivalent requirements flowed down, not a matter left to their own system."}},
 {id:"M3-05", title:"The nine activities", body:[
    P("The process is **iterative, not sequential-once.** Selection begins early, typically before or at the system functional and requirements reviews, and is revisited as the design matures and at every baseline establishment."),
    TABLE(["#", "Activity", "Principal output"], [
      ["1", "Candidate CI identification", "Candidate list; the decomposition basis for the CI structure"],
      ["2", "Application of selection criteria", "Assessments with rationale for every candidate; selected-CI determinations"],
      ["3", "CI structure and hierarchy", "Parent/child and owning design activity; Acquirer- vs Supplier-controlled designation"],
      ["4", "Interface identification and recording", "Interface register; coverage verification; signed no-interface determinations"],
      ["5", "Acquirer review and concurrence", "Submittal; concurrence or direction records; concurred CI list"],
      ["6", "Identifier assignment", "PINs, unit identifiers with their product unit record structure, nomenclature, software and version identifiers, document identifiers, and unique item identification marking where the contract requires it. Also the recorded part attribute designations, safety-critical, life-limited and special handling, each with its assigning authority"],
      ["7", "Configuration documentation determination", "Documentation type recorded against each CI"],
      ["8", "Baseline establishment", "FBL, ABL, PBL per CI with approved change status"],
      ["9", "Maintenance and iteration", "Updated index, register and submittals; status accounting records of every change"]]),
    C("Where modeling is used, the CI structure mirrors the model", [
      "The CI hierarchy and the architecture model are **two views of one decomposition, and shall not diverge.** Preferred schemes are the ATA chapter scheme or the S1000D standard numbering system, in SysML or UAF conventions. Where no model exists, the CI structure follows specification decomposition methods or certification decomposition methods.",
      "This is not a formality. A CI structure that has drifted from the model means two authoritative decompositions of one product, and the moment they disagree, nobody can say which is right."], "teal"),
    P("**Re-evaluate on any of these triggers:**"),
    L([
      "Design evolution introducing new items, functions or interfaces.",
      "Changes to the architecture decomposition.",
      "New or revised hazard analyses.",
      "Changes to supportability strategy or procurement decisions.",
      "Contract changes, including Acquirer designation or de-designation of CIs.",
      "Non-interchangeable modifications requiring a PIN change.",
      "Your company taking on design authority for a supplier-designed item, by acquiring data rights or by initiating a company-controlled modification."])
  ],
  check:{q:"A program\u2019s CI index is organized by the contract work breakdown structure, while its architecture model decomposes the system by ATA chapter. What is the problem?",
   o:[
     "None: the two serve different purposes and may legitimately differ",
     "The WBS is the wrong basis for any CI structure",
     "Two authoritative decompositions of one product exist; when they disagree, nobody can say which is right",
     "The model should be rebuilt to match the contract"],
   a:2, why:"Where modeling is used the CI structure mirrors the model: they are two views of one decomposition. Divergence makes every subsequent structural decision contestable. The fix is realignment by CM and Systems Engineering jointly, not a unilateral change to either."}},
 {id:"M3-06", title:"When the work happens", body:[
    P("The activities are iterative, but they are not evenly spread across a program. Each has a normal moment, and each has something that must already exist by the time it arrives."),
    STEPS([
      {h:"System requirements and functional reviews", b:"Candidate identification and the first pass of selection. The **functional baseline** is established at or after the system functional review, documented by the functional configuration documentation. The proposed CI list goes to the Acquirer for review and concurrence around here, and interface coverage is verified at that submittal."},
      {h:"Preliminary design review, per CI", b:"The **allocated baseline** for a CI is established at or after its preliminary design review. So the allocated documentation for that CI must exist and be approved by then. That means its allocated requirements, its interfaces with the CIs it touches, and its verifications. A CI still under debate at its own preliminary design review has a baseline problem, not a paperwork problem."},
      {h:"Critical design review", b:"The **product baseline** is initially established at completion of critical design review, on the released detailed design definition."},
      {h:"First production unit delivery, or physical configuration audit", b:"The product baseline is formalized no later than this point, and where the Acquirer establishes it, they do so on successful completion of the physical audit and approval of the product specification."},
      {h:"Throughout, and afterwards", b:"Re-evaluation on every trigger. Resubmittal to the Acquirer on every iteration. Interface coverage verified at CI-list submittal, at each technical review, and before each baseline establishment. Identification does not finish; it is maintained."}], "tl"),
    S("Selection that starts at critical design review is not selection.",
      "It is documentation of whatever happened to be built. By then the structure, the interfaces, the effectivity addresses and the audit scope have all been decided by default, and every one of them will be expensive to undo."),
    C("What is fixed and what is not", [
      "These are the normal points, and a contract can move them. What does not move is the **dependency order**: you cannot allocate requirements to a CI you have not selected, cannot baseline documentation that has not been released, and cannot audit against a baseline that was never established.",
      "So when a program compresses its schedule, the question to ask is not which review slipped. It is which dependency the compression assumes away."])
  ],
  check:{q:"A CI is approaching its preliminary design review. What must exist and be approved by that point?",
   o:[
     "Its detailed design definition, since the product baseline follows immediately",
     "Its allocated configuration documentation: the requirements allocated to it, its interface requirements, and its verifications, because the allocated baseline is established at or after that review",
     "Only the system specification; CI-level documentation follows critical design review",
     "Its selection assessment, and nothing further until critical design review"],
   a:1, why:"The allocated baseline is established at or after a CI\u2019s preliminary design review, and a baseline is made of its documentation, so the allocated set has to be there and approved. The detailed design belongs to critical design review and the product baseline; the selection assessment should have been done considerably earlier."}},
 {id:"M3-07", title:"What MBSE is, in one page", body:[
    P("The next section says the CI structure mirrors the model. This one says what a model is, because the rest of the course assumes you already know."),
    P("Model-based systems engineering replaces the document as the authoritative description of the system. The system is described once, in a model, and the documents are views generated from it."),
    STEPS([
      {h:"Elements", b:"The things in the model. A block representing a hydraulic pump. A port representing a connector. A requirement. An activity. Each element has a type and an identifier, and the identifier is persistent."},
      {h:"Relationships", b:"The links between elements. This block is part of that block. This port connects to that port. This element satisfies that requirement. The relationships carry as much meaning as the elements, and they are what make a model different from a drawing set."},
      {h:"Views", b:"A diagram is a view of part of the model, drawn for a purpose. Two views can show the same element. Change the element and both views change, because there is one element and not two copies of it."},
      {h:"The decomposition", b:"The part-of relationships form a hierarchy. That hierarchy is the model's decomposition of the system, and it is the thing the CI structure has to mirror."}], "tl"),
    P("You will meet two modeling languages by name. **SysML** and **UAF**. You do not need to read either fluently. You need to know that the model element type used for decomposition is recorded in the program CM plan, and that you can ask for it."),
    C("What a model element is not", [
      "**A model element is not automatically a CI.** The model decomposes the system for engineering purposes. It goes as deep as the architect found useful.",
      "Every model element at the CI-designation level is **screened against the selection criteria**. Screened, not assumed.",
      "Most model elements fail that screen, and failing it is an ordinary outcome with a recorded rationale.",
      "**The reverse is also true.** A CI that resolves to no model element is a gap in one of the two, and it is resolved jointly rather than by whoever noticed."]),
    P("**Why the CI structure mirrors the model at all.** Two authoritative decompositions of one product is not untidiness. Every structural question afterwards gets two answers and no principled way to choose. Which CI is the parent. Which pair of CIs forms a boundary. Which effectivity address a change belongs to."),
    S("The model informs the decision. It does not make it.",
      "A CI verdict that disagrees with the model goes to Systems Engineering before it enters the index. Adjudicating the CI question sometimes changes the model, and that is an expected outcome rather than a workaround.")
  ],
  check:{q:"An architecture model decomposes an environmental control system down to individual valves and sensors. A new engineer proposes designating every element at that level as a CI, on the grounds that the CI structure mirrors the model. What is wrong with that?",
   o:[
     "Nothing. Mirroring the model is the rule",
     "The CI structure mirrors the model's decomposition method, but every element at the CI-designation level is screened against the selection criteria, and most elements fail that screen",
     "The model is not authoritative, so the CI structure should follow the bill of material instead",
     "Valves and sensors can never be CIs"],
   a:1, why:"Mirroring means the CI hierarchy follows the same decomposition method the model uses, so the two do not diverge. It does not mean every model element becomes a CI. The model goes as deep as the architect found useful, which is usually deeper than the CI structure needs. Each element at the designation level is screened, and a recorded no is an ordinary result. The bill of material is organized for building the product and is not the fallback. And a valve or a sensor can certainly be a CI where it passes a screen."}},
 {id:"M3-08", title:"Where the model is the decomposition", body:[
    P("On a program using model-based systems engineering, the CI structure does not get to be its own idea. The CI parent-and-child hierarchy mirrors the decomposition method of the architecture model, because the two are one decomposition seen twice."),
    CARDS([
      {h:"The preferred schemes", b:"Decomposition by ATA chapter, or by the standard numbering system used across the technical data suite, implemented in the program\u2019s modeling conventions. Each CI carries the corresponding chapter or numbering reference as an attribute in the index, so the CI structure and the technical data agree about where an item sits."},
      {h:"When the model uses something else", b:"Functional thread, zonal, work-breakdown-based: the CI structure mirrors **that** method. The rule is not \u201cuse the preferred scheme.\u201d It is \u201cdo not maintain a second, independent decomposition.\u201d Record the mapping convention. Note any contract-driven exception explicitly in the index, an Acquirer-directed CI level being the usual one."},
      {h:"When there is no model", b:"The CI structure follows **specification decomposition methods or certification decomposition methods**. Work down from how the requirements are allocated, or from how the certification basis divides the product. There is still exactly one decomposition. It simply lives somewhere other than a model. Note that this is not the engineering bill of material. The bill of material is organized for building the product, and building it is not the only thing the structure has to serve."}]),
    P("Alignment is not a one-time reconciliation you perform and then trust. Four practices keep it true:"),
    L([
      "**Cross-reference in both directions.** The model element identifier recorded against the CI in the index, and the CI identifier carried as a property of the model element. A one-directional link rots silently: you discover it when something at the far end has already been deleted or renamed.",
      "**Treat model decomposition changes as triggers.** A change to how the model decomposes the system re-opens CI structure selection. Once the structure is baselined, structural changes are processed through formal change action like anything else.",
      "**Verify alignment at each technical review and before each baseline establishment.** Every Acquirer-controlled CI resolves to a model element, and every model element at the CI-designation level has actually been screened against the criteria, not assumed to have been.",
      "**Run the interface check both ways.** Every interface element in the model resolves to a register row, and every register row to a model element."]),
    S("A verdict that does not match the model is held, not recorded.",
      "Where a same-CI-or-separate decision disagrees with the model, it goes to Systems Engineering for model disposition before it enters the index. Recording it anyway is exactly how two decompositions begin to drift, one entry at a time, each perfectly defensible on its own."),
    C("The model informs the decision. It does not decide it.", [
      "A mismatch does not make either view wrong. A variant family can legitimately be represented as one logical block with several physical realizations, or as sibling blocks. Both are valid, and a mismatch may mean only that the architect stopped abstracting at a different level than you did.",
      "**So carry the screen result to Systems Engineering as engineering evidence for which representation is correct.** Adjudicating the CI question sometimes changes the model. That is an expected outcome of the process, not a workaround, and the resulting decomposition change is itself a re-evaluation trigger.",
      "Where Systems Engineering does not concur, the disagreement is a genuine engineering dispute. Resolve it at a technical review. CM does not re-cut the model, and Systems Engineering does not silently overrule the screen."]),
    C("Why this is a CM problem, not a modeling preference", [
      "Two authoritative decompositions of one product is not an untidiness. Every structural question afterwards, which CI is the parent, which pair of items forms a boundary, which effectivity address a change belongs to: now has two answers and no principled way to choose between them.",
      "**And the fix is never unilateral.** CM does not re-cut the model, and Systems Engineering does not re-cut the CI index. Realignment is done jointly and recorded, because whichever one you quietly edited, you have just created the divergence you were trying to close."], "teal")
  ],
  check:{q:"A program\u2019s architecture model decomposes the system by functional thread rather than by either preferred scheme. What does the CI structure do?",
   o:[
     "Follows a preferred scheme, since that is the standard the technical data uses",
     "Mirrors the functional thread decomposition, with the mapping convention recorded: the obligation is one decomposition, not one particular scheme",
     "Follows the engineering bill of material instead, as a neutral basis both sides can accept",
     "Is held until the model is rebuilt to a preferred scheme"],
   a:1, why:"The preference is real but it is a preference. The obligation is that the CI structure and the model remain one decomposition. Mirroring a non-preferred scheme satisfies it; building a preferred-scheme CI structure alongside a functional-thread model creates precisely the divergence the rule exists to prevent. The product structure is the fallback for programs with no model at all, not a neutral third option."}},
 {id:"M3-09", title:"Interfaces: coverage, not content", body:[
    P("This is where CM engineers most often misunderstand their own role. The split is not between an active function and a passive one. It is between the **boundary set** and the **boundary content**, and CM owns the first."),
    CARDS([
      {h:"Systems Engineering owns the content", b:"Identifies what crosses each boundary: internal interface requirements between CIs, and external interfaces with other systems, facilities and support equipment. Human Factors identifies the human system interfaces at those boundaries, which are interfaces like any other and are registered like any other. Signs the no-interface determinations. Verifies technical adequacy through the technical review process. CM does not derive interface requirements. **This identification is mandatory for safety.** The obligation sits on the company, so CM does not get to treat it as somebody else\u2019s problem."},
      {h:"CM owns the boundary set", b:"CM owns the CI structure, so CM owns the list of boundaries that exist. CM derives that list, maintains the register keyed to it, verifies every boundary is covered, and controls the interface documentation products: identifiers, release, and inclusion in the documentation determination. CM confirms a representative is designated where an interface control working group exists."}], 2),
    P("The CI structure defines a **finite** set of boundaries: every pair of interfacing sibling CIs, every boundary to an external system, and every boundary between Acquirer-controlled and Supplier-controlled levels. Because the set is finite, coverage is checkable, which is the whole reason the register is keyed to the structure."),
    S("Where a boundary has no interface, the register records an explicit no-interface determination signed by Systems Engineering.",
      "A blank cell is indistinguishable from an oversight. A signed determination is a decision with an owner."),
    P("Verify coverage at three points: at CI-list submittal for Acquirer concurrence, at each technical review, and before each baseline establishment. Where modeling is used, add the two-way check that every model interface element resolves to a register row and every row to a model element."),
    C("Four interface requirements are mandatory for safety", [
      "On a safety-significant product line these four are performed regardless of what the contract flows down, or dispositioned through the safety disposition gate.",
      "**Identify** the internal and external interface requirements. Systems Engineering does the identifying. The obligation is the company\u2019s.",
      "**Incorporate** the interface information into the functional, allocated and product documentation. That is the documentation determination, covered in section M3-11.",
      "**Maintain configuration control** of baselined interface requirements. That is baseline establishment, covered in M1-05 in Module 1.",
      "**Provide a representative** to the Acquirer\u2019s interface control working group where one exists. Conditional on the group existing, and mandatory once it does.",
      "**The interface register and the coverage verification records are CM\u2019s evidence that the first one was performed.** They are what the program safety-requirement disposition record points at. A register with blank rows is not a filing lapse on a safety-mandatory requirement. It is the absence of the evidence."]),
    C("The interface control working group", [
      "An interface sometimes crosses organizations. It may run between two suppliers, or between the system and another system. The Acquirer may run a working group to control it. Where one exists, **a company CM representative is allocated to it, and that allocation is mandatory for safety.** The representative is **empowered to commit** your company to specific interface actions and agreements.",
      "The role carries real obligations: provide the agreed draft interface documentation the specified period before the meeting; update, release, control and re-release the interface documentation reflecting the group\u2019s decisions; and distribute the released documentation to the other participants. CM confirms the representative is designated and records which interfaces are working-group controlled.",
      "**A representative who cannot commit is an observer**: and the group will settle the interface without your company\u2019s position in it."], "teal")
  ],
  check:{q:"Systems Engineering asks you to confirm that the interface requirements between two CIs are technically adequate. What do you do?",
   o:[
     "Confirm it, since CM maintains the interface register",
     "Decline, and offer instead the coverage status, the documentation identified against that boundary, and its controlling baseline",
     "Confirm it after reviewing the interface control document",
     "Refer them to the Acquirer"],
   a:1, why:"CM verifies coverage, not adequacy. Accepting would put CM outside its competence and, worse, create a record suggesting interface content had been reviewed when it had not. Offer what CM actually holds."}},
 {id:"M3-10", title:"How to read an interface control document", body:[
    P("The previous section said CM owns the boundary set and Systems Engineering owns the content. This section is the document itself. You will register it, cite it and check its revision, so you have to be able to read it."),
    P("An interface control document defines a boundary between two things. Read it as a boundary, not as a specification for either side."),
    TABLE(["What to find", "What it tells you"], [
      ["The two sides", "Which CI, system, facility or support equipment sits on each side. Named, with identifiers"],
      ["The boundary", "Exactly where the interface falls. A connector face. A mounting plane. A message set. A physical envelope"],
      ["What is controlled", "The attributes both sides must meet. These are requirements and a change to them is a change to both sides"],
      ["What is informational", "Context provided so a reader understands the interface. Not a requirement, and not enforceable"],
      ["Effectivity", "From which unit or line number the definition applies. Two sides at two effectivities do not meet"],
      ["Control authority", "Who approves a change to it. A change board, an interface control working group, or both"]]),
    C("An ICD is not an interface requirements specification", [
      "An **interface requirements specification** states what the interface has to achieve. It is a requirement document and it sits with the requirements.",
      "An **interface control document** states how the boundary is actually defined, in enough detail that two organizations can build to it independently.",
      "You will meet programs that use one, the other, or both. Ask which document is controlling before you record anything against a boundary.",
      "**Controlled and informational content sit in the same document and look alike.** Read the applicability statement. An attribute in the informational section obliges nobody."]),
    C("Why this matters more here than it looks", [
      "The interface register holds one row per boundary in the CI structure, with the defining documentation and revision, the controlling baseline, and the control authority.",
      "**That register is the population the final system-level audit draws its interface examination from.** Not the installation drawings.",
      "Each CI's own audit verified its side against its own documentation. No CI-level audit establishes that two CIs meet correctly.",
      "So a blank row is not a tidiness problem. It is a boundary nobody will ever examine, on a program where the audit population was built from the register."]),
    S("A boundary in the register with no documentation and no signed determination is a finding against coverage, not against the article.",
      "Nothing is wrong with the hardware. What is wrong is that nobody can say what the two sides agreed to.")
  ],
  check:{q:"A CI structure is revised and one CI is split into two siblings. Both siblings are documented and released. What does the interface register need?",
   o:[
     "Nothing. Both siblings carry their own documentation, so both sides are defined",
     "A row for the new boundary between the two siblings, with either defining documentation or a signed no-interface determination",
     "A revision to the parent CI's interface documentation only",
     "A new interface control document, in every case"],
   a:1, why:"A split creates a boundary that did not exist before, and the register holds one row per boundary in the CI structure. Both siblings being documented tells you each side is defined. It does not tell you what crosses between them. The row is required, and it is satisfied by either identified interface documentation or a no-interface determination signed by Systems Engineering. An ICD is one way to satisfy it and not the only way."}},
 {id:"M3-11", title:"Determining the documentation, and the records you keep", body:[
    P("For each CI, determine the documentation that defines its performance, functional, and physical attributes: interfaces included. This is not a filing decision. The documentation type follows three facts about the item: its maturity, who owns the design, and the level at which it is controlled."),
    CARDS([
      {h:"Performance specifications", b:"For Acquirer-controlled items on performance-based contracts: what the item must do and how that is verified, leaving the design solution to the Supplier."},
      {h:"Detail definition", b:"Detail specifications, drawings, and models where design disclosure is required: the full description of the design solution itself."},
      {h:"Commercial and privately developed items", b:"Commercial item descriptions or form-fit-function data: enough definition to procure, apply, and replace the item without owning its design."}]),
    P("The interface information identified against each boundary is incorporated into the determined documentation, in the applicable specifications directly, or through referenced interface documentation. **Incorporating it is mandatory for safety.** Where it is not performed, it is dispositioned through the safety disposition gate. An interface defined nowhere in the documentation set is an interface the baseline does not control, and the hazard the interface carried does not care that the omission was clerical."),
    P("The whole identification effort then lives in two records, and their structure is where most of this module\u2019s rules become visible. A well-formed CI index row carries:"),
    L([
      "The hierarchy level, the CI identifier, and the parent: the structure, expressed consistently three ways.",
      "Nomenclature, the CI type: hardware, software, or firmware, and the Acquirer- or Supplier-control designation.",
      "The owning design activity and its CAGE code, the PIN, and the specification reference.",
      "The safety-critical flag with its hazard reference: the product-level binding of the hazard log.",
      "Baseline status per baseline, audit designation status, and the item\u2019s status."]),
    S("De-designated rows are retained, never deleted, and where one CI carries several part-number variants, the CI-to-PIN variant mapping is recorded in full.",
      "An index that shows only the current answer cannot show how the program got there. And every change and record made under the old designation still points at that identifier. Delete the row and they point at nothing."),
    P("The interface register is the second record. One structural decision does most of the work. **Rows are boundaries, not documents.**"),
    P("Each row carries these fields:"),
    L([
      "**The boundary type.** Internal CI-to-CI, external, or a control-level boundary between Acquirer-controlled and Supplier-controlled tiers.",
      "**Either the defining documentation with its revision, or the signed no-interface determination.** One or the other, never neither.",
      "**The controlling baseline.** System-boundary interfaces belong to the functional baseline through the system specification. CI-to-CI interfaces belong to the allocated baseline through the item specifications.",
      "**The control authority.**",
      "**The safety-related flag, with its hazard control reference.**",
      "**Variant applicability**, per part-number variant.",
      "**The model element identifier**, where modeling is used."]),
    C("Why boundaries and not documents", [
      "One interface control document may appear on several boundary rows, and one boundary may cite several documents. A register keyed to documents can list everything it has and still not show what is missing. The boundary set is finite and derived from the CI structure, so a boundary-keyed register can be checked for coverage, which is the register\u2019s whole point."], "teal")
  ],
  check:{q:"A CI is de-designated after the Acquirer concurs it no longer warrants separate control. What happens to its row in the CI index?",
   o:[
     "Deleted: the index reflects the current CI set",
     "Moved to an archive file outside the index",
     "Retained, with the status changed to de-designated",
     "Retained only if the CI was safety-critical"],
   a:2, why:"Designation history is part of the traceability record. Changes, status entries, and audit results made while the item was a CI all reference that identifier: deleting or exporting the row orphans them. The status field exists precisely so the index can hold the full history and still answer \u201cwhat is a CI today?\u201d with a filter."}},
 {id:"M3-12", title:"Acquirer concurrence", body:[
    S("Potential CIs must be selected AND submitted for Acquirer review and selection concurrence.",
      "A program that has selected excellent CIs and never submitted them is non-compliant."),
    P("Read the underlying requirement carefully: it requires potential CIs to be selected **and submitted** for Acquirer review and concurrence. Selection alone does not satisfy it."),
    L([
      "**Submit** the proposed CI list: candidates, selection results and rationale, for Acquirer review and concurrence.",
      "**Resubmit** when the design evolves, when new candidates emerge, and when designated CIs are proposed for de-designation.",
      "**Remember** that final designation authority for Acquirer-controlled CIs rests with the Acquirer. Selection is iterative, so concurrence is too."]),
    P("Below the Acquirer-controlled level, the Supplier determines which items to place under internal configuration management and what documentation types to use. Subcontractor-developed items are CIs from the Supplier\u2019s point of view, and equivalent CM requirements are flowed to the subcontractor, which is where Module 4 begins.")
  ],
  check:{q:"A program has applied the criteria carefully, recorded rationale for every candidate, and produced a well-structured CI index. It has never submitted the list to the Acquirer. Where does it stand?",
   o:[
     "Compliant, since the requirement is about selection quality",
     "Compliant, provided the list is delivered at the next design review",
     "Non-compliant: the requirement is to select AND submit for review and concurrence",
     "Compliant for Supplier-controlled CIs only"],
   a:2, why:"Selection alone does not satisfy the requirement. Treat submittal as part of selection rather than a follow-on task, and resubmit on every iteration, because designation authority for Acquirer-controlled CIs is not yours."}},
 {id:"M3-13", title:"Same CI or separate CIs: the principle", body:[
    P("Two or more items carry different part numbers and look closely related. Same function, same subsystem, same vendor. Do they share one CI identifier with part-number variants, or get designated as separate CIs? This is the most common judgment call you will be asked to make."),
    P("The question runs two ways, and the two ways take different paths. **Path A** compares two or more distinct items against each other. **Path B** handles one part number installed in more than one place. Decide which one you are in before you start, because the triggers differ and answering path A triggers on a path B problem produces a confident wrong answer."),
    S("The CI identifier follows function and the management need for separate control. The PIN follows form, fit and function.",
      "They answer different questions and are decoupled on purpose."),
    CARDS([
      {h:"Multiple PINs under one CI", b:"Variants of one managed function that are not interchangeable with each other: different interface details, say, but share one specification basis, one verification basis, and common change effectivity. Example: three variants of one valve, tabulated in a single specification, changed as a family."},
      {h:"One PIN under multiple CIs", b:"The same physical item instantiated in subsystems performing distinct functions. Example: one antenna part number installed once in the UHF subsystem and once in MIDS JTRS, one PIN, two CIs. Each satisfies a different end-use function, sits in a different branch of the hierarchy, and needs its own effectivity address, hazard traceability and logistics reporting."}], 2),
    C("The thing to remember", [
      "Neither \u201cthey have different part numbers\u201d nor \u201cthey are the same part number\u201d decides the CI question. **Do not designate CIs to solve a part-numbering problem**: the PINs already capture non-interchangeability."])
  ],
  check:{q:"One cooling fan part number is installed in the mission computer for processor thermal management, and in the environmental control unit as part of cabin air recirculation. How many CIs and how many PINs?",
   o:[
     "One CI, one PIN: it is the same hardware",
     "Two CIs, two PINs: records should match",
     "Two CIs, one PIN: different end-use functions, different branches, different effectivity addresses; but one design definition",
     "One CI, two PINs: the installations differ"],
   a:2, why:"Different end-use functions and different parents drive separate CIs, and the two installations need independent effectivity addresses. Nothing about that creates a non-interchangeable condition, so the PIN does not split. Creating a second part number to \u201cmake the records match\u201d is designating identity to solve a bookkeeping discomfort."}},
 {id:"M3-14", title:"The triggers, and four cautions", body:[
    P("The assessment runs in four stages. Establish where you are. Clear the scope questions. Pass the qualifying gates. Then run the separation triggers. Any single trigger separates on its own, so the triggers are a logical OR, and every one of them is run and recorded even after the first has fired."),
    P("The labels below are the labels on the decision tool and in the process appendix. Use them when you record a verdict, because a rationale citing S4 can be checked and one citing \u201cthe specification gate\u201d cannot."),
    TABLE(["Stage", "Node", "Question", "Trigger \u2192 result"], [
      ["Context", "C1", "Are these items already designated as CIs? Not yet, one CI today, or separate today", "Sets whether the verdict is a first designation, a split, or a consolidation. Not a trigger"],
      ["Scope", "P1", "Is any item inside a larger item procured as a unit from its designing supplier?", "YES \u2192 re-frame the comparison at the procured level and continue. A scope check, not a stop"],
      ["Scope", "P2", "Is this assessment about computer software?", "YES \u2192 read version identifier for PIN, and build or load for variant, throughout"],
      ["Qualify", "Q1", "Does each item satisfy a system end-use function?", "NO \u2192 not CI candidates. Control within the parent CI. Stop"],
      ["Qualify", "Q2", "Does each item meet at least one CI selection criterion?", "NO \u2192 parts, not CIs. The PINs already capture the differences. Stop"],
      ["Trigger", "S1", "Do the items perform different end-use functions?", "YES \u2192 separate CIs"],
      ["Trigger", "S2", "Do the items sit under different parents in the hierarchy? (answer from the model where used)", "YES \u2192 separate CIs"],
      ["Trigger", "S3", "Is ANY one of the items safety-critical?", "YES \u2192 separate CIs"],
      ["Trigger", "S4", "Does either item have or need its own specification for performance or for interfaces?", "YES \u2192 separate CIs. NOT ESTABLISHED \u2192 hold"],
      ["Trigger", "S5", "Do the items have or need different verification requirements or different verification plans?", "YES \u2192 separate CIs. NOT ESTABLISHED \u2192 hold"],
      ["Trigger", "S6", "Will changes to one item routinely need a separate change or maintenance effectivity address?", "YES \u2192 separate CIs"],
      ["Trigger", "S7", "Does Acquirer direction, nomenclature or logistics force separation?", "YES \u2192 separate. No trigger fired at all \u2192 one CI, multiple PIN variants"],
      ["Model", "M1 / M2", "Where modeling is used: does the verdict match the model?", "**Every verdict runs this check, including a separation verdict.** NO \u2192 hold and route to Systems Engineering. YES \u2192 record"]]),
    S("P1 looks like gate 3 and behaves oppositely.",
      "On the checklist, the procurement question is gate 3 and it **ends** the screen. You stop and go screen the parent instead. Here, P1 **re-frames** the comparison at the procured level and the assessment continues. Same fact, two different consequences, and knowing gate 3 well is exactly what makes people get P1 wrong."),
    S("Establish C1 before you run anything.",
      "The same verdict means different work depending on where you started. Separate CIs against items not yet designated is a first designation. The same verdict against one existing CI is a split. The same verdict again where the items are already separate confirms what you have. Three different pieces of work, one verdict, and section M3-17 covers the two that restructure."),
    CARDS([
      {h:"S3: safety separates on ANY item, not all", b:"A safety-critical variant sharing a CI with a non-critical one either forces the whole CI to inherit safety obligations, or blurs hazard-to-CI traceability. Both are worse than a second CI number. If all are safety-critical, they are also separated, because each needs distinct hazard traceability. Answer S3 from the safety management system. Do not re-determine the consequence here."},
      {h:"S4: the interface control document caution", b:"Appearing on the same interface control document is NOT evidence of a common interface. If the document distinctly calls out separate interfaces for each item, analyze that before you answer no. Distinct callouts usually mean different mating definitions and different interface change traffic."},
      {h:"S5: verification is usually the deciding fact", b:"One qualification and acceptance basis must cover all variants. The verification picture is often unknown early, and that is common rather than careless. Obtain it before deciding. Deciding without it means deciding twice."},
      {h:"S6: effectivity is the day-to-day discriminator", b:"If a change or a maintenance interval on one variant must routinely be dispositioned, tracked and cut in independently, each variant needs its own effectivity address. If changes travel across the family, one CI suffices. **S6 is the trigger that catches an influencing part.** S3 never will, because an influencing part fails the safety criterion by its own definition."}], 2),
    C("Two verdicts are holds", [
      "**Not established is an answer.** Where S4 or S5 cannot be answered from what is known today, the assessment holds. Name the fact, name who owns it, and ask in writing. Any trigger that already fired still stands, and the hold does not undo it.",
      "**A verdict that does not match the model holds too**, and routes to Systems Engineering for model disposition before it is recorded.",
      "Neither hold is a failure to decide. Each is a decision not to decide yet, and each is recorded as one. The alternative is deciding twice, and the second decision is always the expensive one."]),
    C("Recording a separate-CI verdict", [
      "Splitting a CI creates new boundaries, and they do not register themselves. On any separate-CI verdict, verify that **every pairwise boundary between the new sibling CIs** appears in the interface register or carries a signed no-interface determination."])
  ],
  check:{q:"Three relays share a function and a parent, none is safety-critical, and their interfaces are described as \u201cslightly different.\u201d Verification requirements have not yet been established. What is the correct next step?",
   o:[
     "Designate as a CI one CI with three part-number variants: nothing has triggered separation",
     "Designate as a CI three separate CIs, because the interfaces differ",
     "Answer S5 not established and hold. Obtain the verification answer, and analyze whether one specification really can define interfaces for all three",
     "Escalate to the Acquirer for direction"],
   a:2, why:"S5 is frequently where the decision actually turns, and the interface control document caution on S4 applies squarely to \u201cslightly different interfaces.\u201d Recognizing that you cannot yet decide is the correct answer here. Naming the fact you need, and who owns it, is the rest of it."}},
 {id:"M3-15", title:"One part number in more than one place", body:[
    P("The triggers in the previous section compare two or more distinct items against each other. That is decision path A. It does not fit the reverse case, because in the reverse case there is only one item."),
    S("One part number, installed in more than one place, runs a different path.",
      "Path A asks what is different between two items. Here nothing is different about the item. What differs is where it sits and what it is doing there. So the comparison is between the item instances and their next higher items together, never between the items alone."),
    P("Four triggers. Any single YES separates. The qualifying gates and the model check still apply, exactly as they do on path A."),
    TABLE(["Node", "Question", "YES means"], [
      ["B1", "Does each item instance satisfy a different end-use function?", "Separate CIs"],
      ["B2", "Does each item instance sit under a different parent in the hierarchy?", "Separate CIs"],
      ["B3", "Does each item instance need its own change or maintenance effectivity address?", "Separate CIs"],
      ["B4", "Is one item instance safety-critical when another is not?", "Separate CIs"]]),
    P("The verdict is separate CIs against one part number. Nothing about installing one item in two places creates a non-interchangeable condition, so the part number does not split. Two CI identifiers, one design definition."),
    C("State the cost before you adopt this verdict", [
      "One part number under two CI identifiers carries a consequence for the life of the program, and it is not a small one.",
      "**The CI identifier no longer resolves from the item alone.** It resolves from the item and its installed position together.",
      "The as-built record has to carry the CI identifier at the installation, not on the part.",
      "Status accounting has to key on the CI and the position together.",
      "**Marking on the part cannot carry the CI identifier.** The part is one part number, and there is nowhere on it for a second answer to live."]),
    S("Confirm that the status accounting system supports position-keyed CI identity before you record this verdict.",
      "Record that confirmation with the rationale. A verdict the tooling cannot hold is a verdict that will be quietly abandoned by whoever inherits the records, and nobody will be able to say when."),
    P("Everything else follows the normal path:"),
    L([
      "Record the rationale on the selection criteria checklist, citing every trigger that fired.",
      "Verify every pairwise boundary between the new siblings in the interface register.",
      "Apply the product unit record-structure test to the item and to its component parts.",
      "Submit for Acquirer concurrence."])
  ],
  check:{q:"One cooling fan part number is installed in the mission computer and in the environmental control unit. The two installations perform different end-use functions, sit under different parents, and would take a bearing-life change on different schedules. You reach a two-CIs-one-PIN verdict. What must happen before you record it?",
   o:[
     "Nothing further: three triggers fired, so the verdict is settled",
     "Create a second part number so the CI identifiers and the part numbers stay aligned",
     "Confirm that the status accounting system supports position-keyed CI identity, and record that confirmation with the rationale",
     "Obtain System Safety concurrence, since one installation may later be classified safety-critical"],
   a:2, why:"The triggers give you the verdict. The confirmation is what makes the verdict recordable, because from here the CI identifier resolves only from the item and its installed position together, and the as-built record and status accounting both have to carry it that way. Creating a second part number is the error this whole section exists to prevent: nothing here made the two installations non-interchangeable, and inventing a part number to make the records look symmetrical is designating identity to solve a bookkeeping discomfort."}},
 {id:"M3-16", title:"Worked examples: same CI or separate?", body:[
    P("Three walks. The first two are path A, comparing items against each other. The third is path B, one part number in more than one place. Notice in each how few triggers actually do any work: the verdict nearly always turns on one, and your job is to find which."),
    STEPS([
      {h:"Two fuel pump variants, one safety-critical", b:"Same end-use function, same parent, and one specification could comfortably define both. Same verification basis. But hazard analysis classifies failure of the high-pressure variant as capable of causing loss of primary system capability, and the low-pressure variant\u2019s as not. **S3 triggers on ANY item being safety-critical, not all of them. Separate CIs.** Sharing one identifier would either force the non-critical variant to inherit the safety obligations, or blur hazard-to-CI traceability. Both are worse than a second CI number."},
      {h:"Two power distribution unit variants differing in input voltage", b:"Same function, same parent, neither safety-critical. One tabulated specification defines performance and interfaces for both. One qualification and acceptance basis covers both. Changes travel across the family and cut in together. Nothing triggers. **One CI, two part-number variants**: with the variant mapping recorded and the interface callouts tabulated per variant."},
      {h:"One antenna part number installed in two subsystems", b:"The reverse case, and the one that trips people. **This is path B, so run B1 through B4 rather than the S triggers.** The same physical item is installed once in the UHF subsystem and once in MIDS JTRS. B1 asks whether the instances satisfy different end-use functions, and they do. B2 asks about parents, and these differ too. **Two CIs against one part number.** Nothing here creates a non-interchangeable condition, so the part number does not split. Then state the cost and confirm the tooling: from here the CI identifier resolves only from the item and its installed position together, and status accounting has to support that before the verdict is recorded. No second part number is invented to make the records look symmetrical."}], "tl"),
    P("Five shorter ones, with the trigger that decides each:"),
    TABLE(["Scenario", "Decides at", "Verdict"], [
      ["Two display unit variants; the Acquirer directs that one carry its own nomenclature", "S7", "Separate CIs. External direction forces it"],
      ["Three cable assembly variants; a change to one is routinely dispositioned and cut in on its own schedule", "S6", "Separate CIs. Each needs its own effectivity address"],
      ["Two valve variants, alike in every respect, but the qualification basis for the second has not been established", "S5", "Answer not established and hold. Obtain the verification answer, because deciding without it means deciding twice"],
      ["Two connector variants appearing on one interface control document, with distinct callouts for each", "S4", "Analyze the callouts. Distinct callouts usually mean different mating definitions and separate interface change traffic, which separates"],
      ["Two brackets with different part numbers; neither meets any criterion on the screen", "Q2", "Parts, not CIs. The part numbers already capture the difference. Do not designate CIs to solve a part-numbering problem"]]),
    C("What each verdict obliges you to record", [
      "**Separate CIs:** each gets its own hierarchy position, documentation determination, effectivity address and baseline management, and every pairwise boundary between the new siblings appears in the interface register or carries a signed no-interface determination.",
      "**One CI, multiple variants:** the variant mapping goes in the index, and the specification is tabulated by variant including per-variant interface callouts.",
      "**Two CIs against one part number:** the CI identifier is recorded against the installed position rather than against the part, and the status accounting confirmation is recorded with the rationale.",
      "**Any verdict:** apply the product unit record-structure test to each variant and its component parts, submit for Acquirer concurrence, record the verdict citing every trigger that fired, and re-run the assessment on trigger, including a variant later diverging in specification, verification, effectivity or safety classification."])
  ],
  check:{q:"Which situation produces two CI identifiers but only one part number?",
   o:[
     "Two variants of one managed function that are not interchangeable with each other",
     "The same physical item instantiated in two subsystems that perform distinct end-use functions",
     "An item whose nomenclature the Acquirer directs be split",
     "Two items with the same function whose verification bases differ"],
   a:1, why:"Different end-use functions and different parents drive separate CI identifiers, but nothing about installing one item in two places creates a non-interchangeable condition, so the part number does not split. The first option is the mirror image: one CI carrying several part-number variants. The identifiers are decoupled on purpose, and they move for different reasons."}},
 {id:"M3-17", title:"De-designation, splits and consolidations", body:[
