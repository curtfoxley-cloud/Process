   a:1, why:"The definition has two halves, and the second one is an obligation. Importance is not designation. Designation is a recorded decision that commits the program to three things for the life of the item: establish the requirements, verify the configuration meets them, and verify the documentation describes the configuration. Criticality does matter, but it matters as criterion (b) inside the screen rather than as a substitute for running it. Part numbers follow designation rather than precede it. The Acquirer may designate CIs, and where they do it binds, but the Supplier is responsible for the comprehensive recommendation."}},
 {id:"M2-02", title:"Where candidates come from", body:[
    P("Everything that follows screens a **candidate list.** Building that list is CM work. It does not assemble itself, and it does not arrive from somewhere else."),
    CARDS([
      {h:"Who nominates", b:"**CM nominates.** A CM engineer builds the candidate set by reading the source material and asking the questions it raises. Other functions do not hand CM a list. They maintain analyses and answer questions about them. Logistics knows what will need provisioning and a technical manual. Design knows what is novel. Systems Engineering knows what carries a function. CM has to go and find out all three, and then decide what enters the set."},
      {h:"Who is responsible", b:"Either the Acquirer or the Supplier may make initial top-level recommendations. But the **Supplier is responsible for the comprehensive recommendation,** and inside the Supplier that responsibility sits with CM. An Acquirer list is a starting point, never a completed one, and \u201cthey didn\u2019t ask for it\u201d is not a defense for an item nobody considered."}], 2),
    P("The method is top-down decomposition of the product structure. The top tier of candidates normally matches the contract line items and the work breakdown structure. That is where the money and the deliverables sit. Separate management is nearly always warranted there. Lower-level candidates are nominated wherever separate management looks warranted, and settled by the screen rather than by argument."),
    P("Gather these before you start:"),
    L([
      "The product structure and the architecture model.",
      "The contract, its statement of work and its data requirements, including any Acquirer-directed designations.",
      "The hazard analyses and the safety-critical item lists.",
      "The supportability planning products."]),
    S("Items flagged safety-critical by hazard analysis go into the candidate set and are screened. They are not filtered out beforehand.",
      "Screening produces a record with a rationale. Filtering produces nothing at all, and a safety-critical item that was never a candidate has no assessment, no rationale, and nothing for System Safety to concur with."),
    C("Candidates are cheap. Missing candidates are not.", [
      "Over-nominating costs one assessment row and a recorded \u201cno.\u201d An item that was never nominated is never screened, never rejected on the record, and invisible at every review that follows, because reviews look at what was considered, and it was not.",
      "**When you are unsure whether something is a candidate, it is a candidate.** The screen exists to say no."])
  ],
  check:{q:"The Acquirer provides a list of top-level items they expect to be designated as CIs. What is your company\u2019s position on the candidate list?",
   o:[
     "The Acquirer\u2019s list defines the candidate set; adding to it invites unnecessary scope",
     "The list is a starting point: the Supplier remains responsible for the comprehensive recommendation, nominating below and beyond it as separate management is warranted",
     "The list is advisory only and carries no weight in CI designation",
     "The list is adopted for Acquirer-controlled CIs, and no further candidates are considered"],
   a:1, why:"Either side may recommend at the top, but responsibility for a complete recommendation sits with the Supplier. The Acquirer\u2019s designations do bind: an item they designate as a CI meets a criterion by that fact alone, but their list bounds nothing. Everything below it still has to be decomposed, nominated and screened."}},
 {id:"M2-03", title:"What CM reads to nominate", body:[
    P("Nomination is a reading job before it is a decision. A CM engineer works through seven bodies of material, and each one answers a different question. You are not checking whether somebody else flagged an item. You are looking for items that need separate management, and most of them will not be flagged anywhere."),
    TABLE(["What CM reads", "What CM is looking for", "The question CM asks the owning function"], [
      ["System and item specifications", "Items with performance stated and owned at their own level. A requirement written against a thing is evidence that the thing is a candidate.", "Is this requirement allocated to an item, or to a function spread across several? Which item owns it?"],
      ["The MBSE architecture and its decomposition", "The decomposition method, the blocks and their boundaries, and where the model separates things. The CI structure mirrors this scheme.", "Why does the model separate these two? Is that a functional split or a physical one? Does the split follow how the item is contracted and supported?"],
      ["Hazard analyses and safety-critical item lists", "Items whose failure carries a top-band hazard severity. Every one enters the candidate set and gets screened, never filtered out beforehand.", "What is the hardware behind this hazard? Which item implements this control? A function is not an item, so ask which items realize it."],
      ["Human factors analyses and the human system interfaces", "Items whose operation or maintenance carries a human error consequence. The consequence pathway sometimes runs through an operator or a maintainer rather than through the hardware failing on its own.", "Does the consequence here depend on someone doing something? Which item do they touch? Is there a human system interface at this CI boundary that nobody has registered?"],
      ["Failure modes, effects and criticality analyses", "Single point failures, common mode failures, criticality codes, and items whose failure drives a maintenance or health-monitoring consequence. Also influencing parts, which fail criterion (b), the safety-critical screen, and pass criterion (a), the system-functioning screen.", "Which hardware does this failure mode live in? Does any other part influence the lifing basis of this one? Is that part identified anywhere?"],
      ["Procurement statements of work and the contract", "What is bought separately, at what level, and from whom. Separate procurement is a criterion in its own right, and a supplier-designed item bought as a unit sets where the customer-facing CI sits.", "At what level is this actually procured? Who holds design authority for it? Does the buy split anything the architecture keeps together?"],
      ["Supplier Management, the equipment managers and the responsible engineers", "What is actually being sourced, from whom, and what the sourcing plan is about to change. These are the people who know a second source is coming before the contract says so.", "Is a second source planned for this? Is anything here about to move between suppliers? Does anybody hold design authority you have not accounted for?"]]),
    C("Two habits that separate a real nomination from a filing exercise", [
      "**Read for what is missing, not just for what is listed.** A hazard analysis names hazards. It does not name every item that implements a control. An FMECA names failure modes. It does not name the influencing part that sits outside the analysis boundary. The candidate CM misses is almost never one that appeared on a list.",
      "**Ask the question rather than infer the answer.** Identifying which hardware sits behind a function is engineering analysis. CM is entitled to ask for it and should. A good guess produces a candidate set that looks complete and is not."]),
    S("Other functions own their analyses. CM owns the candidate set.",
      "Systems Engineering maintains the architecture. System Safety maintains the hazard analyses. RM&SH maintains the criticality analyses. None of them maintains the CI candidate list, and none of them is accountable if an item is missing from it. That accountability sits with CM, which is why the reading is CM work and cannot be delegated to whoever happens to send something over.")
  ],
  check:{q:"A CM engineer is nominating candidates. The hazard analysis lists a hazard controlled by \u201cflight control surface position feedback.\u201d No hardware is named. What is the correct next action?",
   o:[
     "Record the hazard and move on, since no item is named",
     "Nominate every item in the flight control system, to be safe",
     "Ask Systems Engineering which items implement that control, then nominate those items and screen them",
     "Wait for System Safety to update the analysis with part numbers"],
   a:2, why:"A function is not an item, and a hazard control named at function level cannot be screened until somebody identifies the hardware that realizes it. That identification is engineering analysis, so CM asks for it rather than guessing. Nominating the whole system produces a candidate set nobody can screen honestly. Waiting produces nothing, because a hazard analysis is not obliged to carry part numbers."}},
 {id:"M2-04", title:"How CM reads a specification", body:[
    P("You are not reading the specification to understand the design. Engineering owns the design. You are reading it to discover **what things require independent configuration management.** That is a different job, and it uses a different technique."),
    P("Here is a fragment of a fictional specification for a flight control computer. Read it the way a CM engineer reads it."),
    TABLE(["Requirement", "What it says", "What CM does with it"], [
      ["3.2.1 Processor Unit", "The processor unit shall provide continuous computation of control surface commands at a rate of not less than 100 Hz.", "**Candidate.** The requirement is written against an identifiable item. A performance requirement owned at the level of a thing is the clearest signal there is."],
      ["3.2.4 Interface", "The processor unit shall exchange surface position and command data with the actuator control electronics.", "**Boundary signal.** Ask three questions. What is the interface? Where exactly does the boundary fall? Is there an interface control document, and at what revision? Two items named in one requirement means a boundary exists between them."],
      ["3.3.7 Maintainability", "The unit shall permit replacement of the power supply module without removal of the unit from the aircraft.", "**Logistics and supportability signal.** Something is separately replaceable, so something is separately provisioned, separately stocked, and separately changed. Ask Logistics whether the power supply module gets its own provisioning and technical manual coverage."],
      ["4.1.2 Environmental qualification", "The assembly shall withstand the vibration environment of Table 4-2 without loss of function.", "**Qualification and control signal.** An item qualified in its own right has a qualification basis that a change can invalidate. Ask what the qualification was performed on, and whether the qualified configuration is separately identified."],
      ["5.4 Software", "The embedded software shall implement the control laws of Appendix C and shall be reloadable in the installed unit.", "**Software CI by rule,** and a second signal besides. Reloadable in the installed unit means the software version and the hardware version move independently, so they need separate identity."]]),
    C("The reading technique: nouns, verbs, boundaries", [
      "**Nouns.** What things exist? Every named thing is a possible candidate. Build the noun list first and prune later.",
      "**Requirements assigned to a noun.** Is this thing independently specified? A requirement written against a thing is evidence that the thing is a candidate.",
      "**Interfaces.** What crosses the boundary, and where is the boundary? Two nouns in one requirement usually means a boundary between them.",
      "**Shall statements.** What is being controlled, and at what level is the obligation stated? A shall written at system level tells you less than one written against a unit.",
      "**References.** What other controlled information exists? A reference to a drawing, a standard, an appendix, or another specification points at a document that has its own identity and its own change stream.",
      "**Quantity and identity words.** Each, per unit, per lot, serial number, batch, effectivity. These carry identification and traceability implications, and they tell you what product unit record the item will need.",
      "**Appendices and notes.** Hidden part designations, variants, and applicability rules live here. So do the qualification tables, the load lists, and the parts that only appear once."]),
    S("Read the whole document, including the parts nobody reads.",
      "Appendices, notes, and tables are where variants and applicability rules hide. An item that appears only in a table in Appendix C is exactly the candidate nobody nominated."),
    P("Then build a candidate list from what you found. Do not screen yet. Nomination and screening are separate steps for a reason: a candidate you never wrote down cannot be rejected on the record, and an item rejected on the record is a defensible decision.")
  ],
  check:{q:"A specification requirement reads: \u201cThe hydraulic manifold shall be removable and replaceable at the flight line without special tooling.\u201d What has CM just learned?",
   o:[
     "Nothing relevant. This is a maintainability requirement and belongs to Logistics",
     "That the manifold is a CI, because it is separately replaceable",
     "That the manifold is a candidate, and that there is a supportability signal to follow up with Logistics on provisioning and technical manual coverage",
     "That the manifold needs a serial number"],
   a:2, why:"The requirement is written against a named thing, which makes the manifold a candidate. Separate replaceability is a strong logistics signal, so it is worth asking Logistics what follows from it. But none of that designates anything as a CI. The screen decides that, and it comes after nomination. The serial number question is a product unit record question that is settled later, not here."}},
 {id:"M2-05", title:"How CM reads a FMECA", body:[
    P("You are not trying to become the FMECA analyst. RM&SH owns that analysis and you are not going to redo it. **You are mining it for configuration management consequences.**"),
    S("Where the FMECA sits in the standards.",
      "A failure modes, effects and criticality analysis is a reliability product, and its lineage runs through the failure mode analysis standards. MIL-STD-882E does not own it. What 882E does is name it as an analytical technique that feeds the hazard analyses, and its subsystem hazard analysis task requires determining component failure modes, human errors, and single point and common mode failures. So the FMECA is usually the document where those failure modes are actually written down, and it reaches CM through the safety analyses as well as directly."),
    P("Here are nine rows from a fictional analysis of a flight control actuation system. Read across each row, and then read past it."),
    TABLE(["Item", "Failure mode", "Effect", "Criticality", "Cause"], [
      ["Flight-control actuator", "Stuck output", "Loss of surface movement", "1", "Motor winding failure"],
      ["Position sensor", "Erroneous output", "Incorrect feedback to control law", "2", "Sensor drift"],
      ["Output gear", "Fracture", "Actuator jam", "1", "Fatigue"],
      ["Gearbox lubricant", "Degradation", "Increased gear wear rate", "4", "Age and thermal cycling"],
      ["Position feedback function", "Loss of feedback", "Hazardous control condition", "1", "Multiple causes"],
      ["Electrical power bus B", "Loss of supply", "Loss of two actuator channels", "1", "Common cause"],
      ["Actuator mounting bolt", "Fracture", "Actuator separation", "1", "Fatigue, installation torque"],
      ["Control law software", "Incorrect surface command", "Uncommanded surface movement", "1", "Requirements or coding defect"],
      ["Housing paint finish", "Degradation", "Cosmetic", "4", "Environmental exposure"]]),
    C("Three questions to ask of every FMECA", [
      "**Which items enter the candidate set?** The actuator, the position sensor, the output gear, the mounting bolt, and the control law software. Each is a named item with a failure consequence. The gearbox lubricant enters too, for a reason covered below. The paint finish does not: cosmetic degradation carries no configuration management consequence, and not everything in a FMECA is a candidate.",
      "**Which ones require clarification?** Two. **Position feedback function** is a function, not an item. Ask engineering which hardware implements it, then nominate that hardware. **Electrical power bus B** is a common cause entry that reaches two channels, so ask what the bus actually is: a harness, a distribution unit, a set of breakers, or an architectural abstraction. You cannot screen an abstraction.",
      "**What does the FMECA tell CM, and what does it not?** It tells you which items have failure consequences and how severe they are. It does not tell you which items need separate configuration management. Criticality is a hazard severity judgment, not a CI criterion. An item can be criticality 1 and still be controlled inside its parent, and an item can be criticality 4 and still need its own change stream."]),
    S("The FMECA tells CM to look sideways.",
      "Do not read only component, failure, effect. Read component, failure, effect, consequence, and then ask what other component or analysis that consequence depends on. That last step is where the items nobody remembered to nominate are hiding."),
    P("The gearbox lubricant is the example. Its own failure is criticality 4 and hazardous to nothing. But its degradation drives the wear rate of the output gear, and the output gear is criticality 1 with an approved life limit. The lubricant specification is part of the basis for that life limit."),
    C("Why the lubricant is a candidate", [
      "It fails criterion (b), the safety-critical screen, by its own definition. Its failure has no hazardous effect, so screening only on safety and stopping is how it goes unscreened as a CI.",
      "It passes criterion (a), the system-functioning screen, because the approved lifing basis of a safety-critical part depends on its configuration.",
      "A change to it needs an independent effectivity address. If somebody substitutes an equivalent lubricant, the gear is still inside its stamped life limit, on a basis that has quietly stopped being valid.",
      "This is the **influencing part** pattern. Cooling air metering hardware, seals, bearings, and oil nozzles behave the same way. The consequence is displaced onto a different part number, which is exactly what makes it hard to see."]),
    S("The analysis boundary matters as much as the analysis.",
      "When the FMECA says loss of position feedback causes a hazardous condition, do not conclude that the position sensor is the CI. Ask what hardware implements position feedback, and ask where the FMECA drew its analysis boundary. Items outside that boundary were never analyzed, and they are not absent because they are safe.")
  ],
  check:{q:"A FMECA row reads: item, thermal blanket; failure mode, degradation; effect, elevated bearing temperature; criticality, 4. The bearing it protects is criticality 1 with an approved life limit. Is the thermal blanket a candidate?",
   o:[
     "No. Criticality 4 with no hazardous effect of its own",
     "Yes, but only because it is physically attached to a criticality 1 item",
     "Yes. It influences the approved lifing basis of a safety-critical part, so a change to it needs an independent effectivity address",
     "Only if the bearing manufacturer requires it"],
   a:2, why:"This is the influencing part pattern. The blanket fails the safety criterion on its own terms, which is why screening on safety alone misses it. It passes criterion (a), the system-functioning screen, because the bearing life limit was approved on the assumption of a particular thermal environment, and the blanket is part of that assumption. Physical attachment is not the reason and would not be a criterion. Ask RM&SH to confirm the dependency, then nominate it."}},
 {id:"M2-06", title:"How CM reads a system safety hazard analysis", body:[
    P("This is the most consequential of the three documents, and the one CM engineers read least well. A specification tells you what exists. A FMECA tells you what fails. **A hazard analysis tells you what is protecting you.** That matters to CM more than either of the others, because a configuration change can remove a protection without anybody noticing that a protection was there."),
    C("Where these documents come from", [
      "System safety work in defense programs runs to **MIL-STD-882E**, the standard practice for system safety. It defines a set of analysis tasks, and the ones CM meets most often are the **subsystem hazard analysis (SSHA)** and the **system hazard analysis (SHA)**. The subsystem analysis looks inside a subsystem at component failure modes, human errors, and single point and common mode failures. The system analysis looks at the interfaces and interactions between subsystems.",
      "882E also defines two terms CM must keep apart. A **safety-critical function** is a function whose failure or incorrect performance could contribute to a hazard with catastrophic or critical consequence. A **safety-critical item** is a hardware or software item determined through analysis to potentially contribute to such a hazard. A function is not an item. Only the second one is something you can put in a CI index.",
      "The living record is the **hazard tracking system**. It is not a report issued once. It is revised as hazards are identified, as controls are implemented, and as risk is accepted, which is why a revision to it is a re-identification trigger.",
      "882E is explicit that system safety personnel are not responsible for hazard management in other disciplines, and that the disciplines coordinate. Its planning task names **configuration control and data management** among the functions whose interrelationship with the hazard effort must be defined. CM is named in the standard. Reading these reports is part of that relationship."]),
    P("Here is an extract from a fictional analysis on a flight control system. Read the **control column first.** That is the CM habit that separates a useful reading from a filing exercise."),
    TABLE(["Hazard", "Cause", "Severity", "Control", "What CM does with it"], [
      ["Uncommanded elevator movement", "Control law computes an erroneous surface command", "Catastrophic", "Dual-channel command monitor implemented in the operational flight program, with cross-channel comparison", "**The control lives in software.** That software is a safety-critical item and a CI by rule. Its configuration now carries a hazard control, so a version change is a safety question, not just a software question. Record the hazard reference against the CI."],
      ["Loss of surface position feedback", "Sensor failure", "Critical", "Triplex sensor architecture with voting logic", "**The control is an architecture, not a part.** Ask which items realize it: three sensors, the wiring that keeps them independent, and the voting logic. Redundancy does not relieve the screen. Each item is screened, and the independence between them is itself something a change can destroy."],
      ["Actuator jam", "Output gear fracture", "Catastrophic", "Gear life limit of 15,000 cycles under the fracture control plan", "**The control is a life limit.** That forces a product unit record structure: the gear is serialized and life tracked, with consumed life carried at delivery. Then look sideways. What does the lifing basis assume about lubrication, cooling, or duty cycle? Those items influence the limit and are candidates."],
      ["Pod release in flight", "Attachment fitting fracture", "Catastrophic", "Fitting designated fracture critical and traceable, with an inspection interval in the airworthiness limitations", "**Three consequences at once.** The fitting is a safety-critical item. It is serialized and traceable because the traceable subclass requires it. And the inspection interval is an airworthiness limitation, which drives marking and technical manual content."],
      ["Loss of both control channels", "Shared electrical power source", "Catastrophic", "Separate feeds from independent buses, with physical separation of the two harness runs", "**The control is a routing rule, not a part.** No single item implements it. Ask what document enforces it: an installation drawing, a separation requirement in an interface control document, or a zonal routing standard. That document is controlled information and its baseline matters. A harness rerouted during a fit problem can remove this control with every part number unchanged."],
      ["Crew injury during maintenance", "Stored hydraulic pressure released on disconnect", "Critical", "Warning placard at the access panel, and a depressurization procedure in the maintenance manual", "**The weakest tier of control, and still CM\u2019s problem.** 882E orders mitigations by precedence, and warnings and procedures sit at the bottom because they depend on people. The placard has a part number and a location. The manual has a revision. Both are configuration-controlled, and both can be lost in a change nobody flagged as safety-relevant."]]),
    C("The reading technique", [
      "**Read the control column first.** The hazard tells you why something matters. The control tells you what CM has to protect.",
      "**Resolve every control to an item or a document.** Every control lands in one of six places: a design feature in an item, a software function, a life limit or inspection interval, a physical separation or routing rule, a marking or placard, or a procedure in a manual. Each of those has an owner and a change stream.",
      "**Where the control names a function, ask which hardware implements it.** That identification is engineering analysis. Ask for it. Do not infer it, because a good guess produces a candidate set that looks complete and is not.",
      "**Read the severity.** It sets the authority required to accept residual risk, and it is the pre-anchored severity that the safety disposition gate uses later. An item hosting a catastrophic-severity control is not one you quietly tailor a requirement off.",
      "**Read the verification column.** It tells you what evidence closes the hazard. That same evidence is what the functional audit will look for, so a hazard control with no named verification is a finding waiting to happen.",
      "**Watch the analysis boundary and the multiple-cause entries.** Items outside the boundary were never analyzed. They are not absent because they are safe."]),
    S("The item that hosts a hazard control is the item whose configuration must not drift.",
      "That is the whole reason CM reads these reports. A hazard is accepted on the basis that a control is in place. If the configuration of the item hosting that control changes and nobody connects the two, the risk acceptance is still on file and is no longer true."),
    P("Record the hazard reference against the CI in the index. That single cross-reference is what lets somebody, two years from now, answer the question that matters: if we change this item, what were we relying on it for?")
  ],
  check:{q:"A hazard record reads: hazard, loss of both flight control channels; cause, shared power source; severity, catastrophic; control, separate feeds from independent buses with physical separation of the harness runs. No part number appears anywhere in the record. What does CM do?",
   o:[
     "Nothing. No item is named, so there is no CI consequence",
     "Nominate both harnesses as CIs, since they implement the control",
     "Identify what document enforces the separation, treat that document as controlled information carrying a hazard control, and ask engineering which items and which installation data realize the routing",
     "Refer it to System Safety, since it is a safety matter rather than a configuration matter"],
   a:2, why:"The control is a routing rule, so no single part implements it and nominating the harnesses alone would miss the point. What enforces separation is a document: an installation drawing, a separation requirement in an interface control document, or a zonal standard. That document is where the control actually lives, so its baseline and change control are what protect the risk acceptance. The items still get identified, but you have to ask engineering which ones, because the record does not say."}},
 {id:"M2-07", title:"How to read an engineering drawing", body:[
    P("You will screen candidates against documents. The drawing is the document you will meet first and read most, so start there."),
    P("A CM reader reads a drawing's text far more than its geometry. The geometry is the designer's work. The text is where configuration lives."),
    TABLE(["Where to look", "What it carries", "Why CM needs it"], [
      ["Title block", "Part number, drawing number, title, CAGE code, scale, sheet count", "Identity. It is also where the drawing number and the part number turn out not to be the same thing"],
      ["Revision block", "Revision letter, a description of each change, the authorizing change number, the date", "The governing revision. A part number does not carry a revision. The product definition data does"],
      ["Notes and flagnotes", "General notes applying to the whole drawing, and flagnotes applying to one called-out feature", "Process requirements, material calls, marking, and the traceability requirement, which is very often a note"],
      ["Find numbers", "The reference for each part on the drawing face", "Locates a part on the drawing. A find number is not a part number"],
      ["Zones and sheets", "Grid references down the margins, and the sheet count in the title block", "How a question is located precisely enough for somebody else to find it again. Sheet 1 of 6 means five more sheets exist"],
      ["Next assembly", "Where this part is used", "The upward half of traceability, and the boundary question"],
      ["Associated lists", "Parts list, wiring list, data list, referenced by number", "The parts list is a separate document and it is part of the definition"],
      ["Unless otherwise specified", "A block of default tolerances and finishes", "What applies wherever the drawing is silent. Silence is not absence"]]),
    C("The distinction that causes the most confusion", [
      "**The part number identifies the part. The revision identifies the definition of it.**",
      "A change that produces a non-interchangeable part produces a new part number.",
      "A change that does not produces a new revision against the same part number.",
      "So an article marked 88231-3 tells you what it is. It does not tell you which definition it was built to."]),
    P("**Where model-based definition applies, the model is the authority and the drawing may be a view of it.** The same reading applies and the places change. Attributes live in the model. Notes live in annotation planes. The revision sits on the model rather than on a sheet. Ask which is the authority before you rely on either."),
    C("What this course wants you to take from a drawing", [
      "**Part identity against CI identity.** A CI has one CI identifier. It may carry several part numbers across variants. Reading the title block tells you the part. It does not tell you the CI.",
      "**Which documentation set this drawing belongs to.** A drawing can sit in the allocated set or the product set, and the set decides what a supplier is owed.",
      "**The reprocurement sufficiency test.** Read the drawing and ask whether it alone is enough to buy this part again. If design-critical data sits somewhere the drawing neither carries nor references, the answer is no, and that is a finding you can raise long before any audit.",
      "**The traceability requirement.** It is usually a note, it is easy to skim past, and it is what decides whether a build record has to carry a serial number or a lot number."]),
    S("Read the title block for identity, the revision block for definition, and the notes for everything that will actually cost you money.",
      "The geometry is rarely the problem. The note nobody read usually is.")
  ],
  check:{q:"A candidate part is marked 88231-3. The drawing in front of you is 88231 revision F. The drawing carries a general note requiring lot traceability with a date code, and no serial number. What can you conclude about the part's CI identity?",
   o:[
     "It is a CI, because it has its own part number and its own drawing",
     "It is not a CI, because lot control means the part is not individually managed",
     "Nothing. The drawing establishes part identity, the traceability requirement and the governing definition. CI identity is decided by the selection screen, not by the drawing",
     "It is a CI only if revision F is the governing revision at this effectivity"],
   a:2, why:"A drawing tells you what the part is, what definition governs it, and what its build record has to capture. None of those decides whether the part is a CI. The selection screen decides that, and it runs against the criteria rather than against the drawing. Having its own part number and drawing is ordinary and means nothing on its own. Lot control is not evidence against CI status either, and lot control is not a lesser form of control. The governing revision matters for conformity and not for identity."}},
 {id:"M2-08", title:"The three gates and the screen", body:[
    P("Section M2-01 gave you the definition. This is where you apply it."),
    P("The screen runs in two steps. Step 1 is three qualifying gates. All three must pass. Step 2 is the criteria screen. The gates come from the first sentence of the definition. The criteria come from the second."),
    STEPS([
      {h:"Gate 1: the item gate", b:"Is the candidate an item, rather than a function, a task, a failure mode, a feature, or a location? Only an item can be a CI. If NO: the candidate cannot be designated as a CI. It is a signal that items worth screening exist nearby. Ask for the items that implement it, screen those, and stop. Section M2-12 is about getting from a label to the items behind it."},
      {h:"Gate 2: the end-use function gate", b:"Does the candidate satisfy a system end-use function? If NO: not a CI candidate. Record the rationale, identify the parent CI whose documentation controls it, and stop. Raw materials, bulk commodities and purely structural elements with no defined functional role fail here."},
      {h:"Gate 3: the procurement level gate", b:"Is the candidate a child of a commercial, catalog or vendor item, and is it procured inseparable from that parent? If YES: screen the procured parent instead. Do not decompose a supplier-designed item. Record the parent that was screened in its place, and stop. Section M2-14 is about why this gate exists."},
      {h:"Step 2: the criteria screen", b:"Designate as a CI if the candidate meets or impacts one or more of seven criteria, plus the software rule. One YES is sufficient."}]),
    S("Three gates, then the screen. A candidate that fails any gate never reaches the criteria.",
      "Which gate a candidate failed is a fact the record has to carry, because the three failures mean different things. Gate 1 says you were screening the wrong kind of thing. Gate 2 says the candidate has no function of its own. Gate 3 says you were screening at the wrong level."),
    C("Record the rationale for every candidate", [
      "Record the assessment and reasoning for **every candidate**, whether designated as a CI or not. This is the step new engineers skip most often, and the one that costs most later.",
      "A list of selected CIs shows an outcome. A candidate list showing what was considered and rejected, and why, shows that judgment was exercised. When the Acquirer asks why a particular assembly is not a CI, \u201cit isn\u2019t on the list\u201d is not an answer."])
  ],
  check:{q:"A titanium billet, specified by material standard, is the stock from which several structural fittings are machined. How is it treated?",
   o:[
     "Designated as a CI because it is critical to structural integrity",
     "Fails gate 2, the end-use function gate. Controlled within the parent CI\u2019s documentation via the material specification",
     "Designated as a CI only if it is sole-source",
     "Left outside configuration control entirely"],
   a:1, why:"Raw material satisfies no system end-use function of its own, so it never reaches the criteria screen. It is still controlled, by the material specification called out on the drawings of the parts made from it, inside the parent CI\u2019s documentation."}},
 {id:"M2-09", title:"The criteria screen", body:[
    P("One YES is sufficient. Four is not four times as designated, but listing all four is worth doing, because each is an independent reason the designation survives if one fact later changes."),
    TABLE(["Ref", "The screen", "The criterion, as the checklist words it", "What it looks like in practice"], [
      ["(a)", "System-functioning screen", "Critical to the functioning of the system", "The system cannot perform its mission without it. Not \u201cuseful\u201d: necessary"],
      ["(b)", "Safety-critical screen", "Failure might result in serious injury, loss of life, or loss of primary system capability", "Screen every safety-critical item here. This screen is mandatory for safety"],
      ["(c)", "Technology screen", "Technology is complex, not well known, and critical to acquisition, operational, or supportability goals", "All three conditions, not one of them. Novel or immature technology the program actually depends on. Complexity on its own does not meet this screen"],
      ["(d)", "Acquirer-designation screen", "The candidate is under control as designated by the Acquirer", "Broader than a contract line naming the item as a CI. Any part designation assigned by a customer or government activity engages this criterion. The Acquirer\u2019s act of placing an item under control is theirs to make, not yours to predict"],
      ["(e)", "Separate-identity screen", "Requires separate type designation, versions, or nomenclatures", "The candidate needs its own formal name, model number or version identity"],
      ["(f)", "Risk-and-cost screen", "Critical or high risk; failure would have significant financial impact", "Long lead, sole source, high value, or a failure that stops a line"],
      ["(g)", "Logistics screen", "Requires dedicated logistics support elements: APL, AEL or ACL provisioning lists; test equipment, whether general purpose, special purpose or built-in; technical manuals; PMS MIP and MRC; danger or caution tag-out", "Any one of them is enough. Test equipment counts even when it is general purpose, which is the one people exclude by habit"],
      ["SW", "The software rule", "Item is computer software", "Designate it as a software CI. The process documents, the checklist and the standard all call it a **computer software configuration item**, or CSCI. Same thing. A rule, not a judgment"]]),
    P("**APL, AEL and ACL** are distinctive provisioning lists. **PMS MIP and MRC** are planned maintenance system documentation, the maintenance index pages and the maintenance requirement cards. You will meet all five as acronyms on the checklist and nowhere else."),
    S("Letter it and name it. Every time, in speech and on the form.",
      "\u201cIt meets criterion (g), the logistics screen, and criterion (b), the safety-critical screen.\u201d The letter is what the checklist, the concurrence rules and the safety linkage rule all key on, so a rationale without it cannot be checked against the form. The name is what tells a reader what you actually found, so a rationale without it sends them hunting. Give both and neither problem exists."),
    P("Programs may adopt supplemental criteria. The usual candidates are these:"),
    L([
      "Independent end-use function.",
      "Separate change effectivity address.",
      "Commonality across systems, or interfaces with an existing CI.",
      "Interchangeability level, or separate delivery or installation.",
      "Separate performance and test requirements, or independent testability.",
      "Configurable state, or new or modified design."]),
    S("Supplemental criteria only expand the screen.",
      "They cannot narrow it and they cannot tailor a mandatory criterion. A program that adopts a supplemental criterion has added a way to reach yes. It has not bought a way to reach no. Check what your program has adopted before you start screening."),
    S("Record the rationale and the document reference against every criterion, whether the answer is yes or no.",
      "The checklist gives you two fields per row for this. A yes with no document behind it is an assertion. A no with no document behind it is the one a reviewer will ask about first, because it is the answer that ended the assessment.")
  ],
  check:{q:"A valve is sole-source with a fourteen-month lead time, and the Acquirer has expressed no view on it. Which screen does the lead time engage?",
   o:[
     "The Acquirer-designation screen, since they will probably want it designated as a CI",
     "The technology screen",
     "The risk-and-cost screen: critical or high risk, where failure would have significant financial impact",
     "None; lead time is a procurement matter, not a CI screen"],
   a:2, why:"Sole source with a long lead is exactly the risk-and-cost screen: a failure or an uncontrolled change stops the line for over a year. The Acquirer-designation screen applies only where the Acquirer has actually designated the candidate as a CI: predicting what they will want is not the same as designation."}},
 {id:"M2-10", title:"Three standing rules", body:[
    CARDS([
      {h:"Software", b:"Computer software is designated as a software CI. Product-unique identifiers also go to elements of the software development environment that form part of the system: compilers, linkers, loaders, developmental libraries, configuration settings, automation scripts. If the build cannot be reproduced without it, it needs an identity."},
      {h:"Safety linkage", b:"Any item identified as safety-critical under the safety management system is screened against criterion (b), the safety-critical screen, and usually criterion (a), the system-functioning screen, too. Consider both direct failure modes and cascading effects. If criterion (b) was answered yes and the item is **not** designated a CI, the rationale requires System Safety concurrence. A CM engineer does not make that call alone."},
      {h:"Requirements mandatory for safety", b:"Criterion (b), the safety-critical screen, is mandatory for safety. On safety-significant product lines it is performed regardless of what the contract flows down. Any proposal not to perform it goes through the safety disposition gate and is recorded, never quietly dropped."}]),
    C("The consequence to hold on to", [
      "Three years from now, a field failure requires you to rebuild the delivered software load and compare it byte-for-byte against what is in the unit. If the compiler version, build settings and library state were never identified, and the toolchain has since been upgraded, the load cannot be reproduced.",
      "That means the product baseline cannot be demonstrated, which means the physical configuration audit for that CI was never actually satisfiable."], "teal")
  ],
  check:{q:"A program proposes not to designate a safety-critical actuator as a CI, arguing it is adequately controlled within its parent assembly. What is required?",
   o:[
     "Nothing. CM may record the rationale and move on",
     "Acquirer approval only",
     "System Safety concurrence on the rationale, with the proposal dispositioned through the safety disposition gate and recorded",
     "A design change to remove the safety criticality"],
   a:2, why:"The safety-critical screen is mandatory for safety, so a proposal not to perform it goes through the safety disposition gate and is recorded. And a safety-critical item not designated a CI needs System Safety concurrence on the rationale. CM does not make that call alone."}},
 {id:"M2-11", title:"Part designations that answer the safety-critical screen for you", body:[
    P("CM teams and safety teams often talk past each other. CM asks: what are the safety-critical parts? Safety asks back: what types of critical parts do you mean? Both questions are fair. Neither can be answered as asked. This section and the next three give you the vocabulary that fixes the exchange."),
    P("Start with the easiest case. Some part designations land directly on a part. Their own definitions state a consequence that meets the safety-critical screen. When one of these lands on an item, the screening question is already answered."),
    TABLE(["Part designation", "Where you will meet it", "Why it always meets the safety-critical screen", "Product unit record it implies"], [
      ["A critical safety item, assigned by the customer\u2019s engineering authority", "Military aviation programs. A legacy version of the label appears on older drawings. **Verify** the legacy label against the drawing before relying on it", "Its definition is the safety-critical screen in different words. Failure could cause loss of the aircraft, serious injury, or loss of life", "Lot or batch at minimum, with traceability to an approved source. Serialization only where a separate requirement imposes it, never by the external criticality designation itself"],
      ["A safety-critical **item** from the system safety analysis", "Any program running a formal system safety program", "It names hardware or software that analysis found could contribute to a catastrophic or critical mishap", "Not set by the external criticality designation. It follows from the control chosen to mitigate the hazard. A life limit gives a serial number. An acceptance requirement gives lot or batch. A design-based mitigation may give neither"],
      ["A fracture critical part, and its traceable subclass", "Military airframe structure, under the structures control plan", "Failure by cracking would cause loss of the aircraft", "The traceable subclass is serialized. The base class may be lot-controlled with heat traceability"],
      ["A fracture critical engine component", "Military engines. The basis usually arrives through the statement of work. **Verify** against the governing contract", "Same consequence. Failure would be catastrophic", "Conditional. Determined by the fracture control plan rather than by the label"],
      ["An engine life-limited part", "Civil engine certification, FAA environment", "This population is defined by hazardous failure consequence. The life limit is how that consequence is managed", "Serial number. The clearest case there is: remaining life is a per-unit quantity and back-to-birth records depend on it"],
      ["Engine, propeller, and auxiliary power unit critical parts", "Civil certification, EASA environment", "Primary failure is likely to produce a hazardous effect", "Serial number where an airworthiness limitation attaches"],
      ["A rotorcraft critical part", "Civil rotorcraft certification", "Failure could have a catastrophic effect on the rotorcraft", "Serial number where an airworthiness limitation attaches. Otherwise lot or batch"],
      ["Fracture critical hardware, per the fracture control board", "Spaceflight programs", "Failure from a crack would produce a catastrophic hazard", "Serial number, with material traceability"],
      ["A safety-related structure, system or component", "Nuclear applications, on the quality list", "Required to perform a safety function, or to prevent or mitigate the consequences of an accident", "Lot or batch, under commercial grade dedication against identified critical characteristics. A catastrophic-consequence item that is legitimately not serialized"]]),
    C("Read the fourth column across before you assume", [
      "Every row above satisfies criterion (b), the safety-critical screen. Every row also carries a product unit record, and the records are nothing alike. They run from serialization driven by a per-unit life clock, to lot control with traceability to an approved source on an item whose failure would be catastrophic.",
      "**Both are real control. Lot control is not the weak version of serialization.** It is the correct answer where the approved basis for continued service is conformance to an approved source rather than the history of one article.",
      "**Determine the product unit record from the test in M1-08 in Module 1, never from the external criticality designation.** The external criticality designation answers a selection question. It does not answer a product unit record question, and reading one off the other is how programs serialize populations that gain nothing from it and lot-control populations that needed a per-unit history.",
      "Rows marked **Verify** rest on terminology that is program-specific, contract-specific, or subject to recent revision. Confirm those against the governing contract or the current issue of the cited document before you rely on them."]),
    S("When one of these lands on an item, the safety-critical screen is met. CM records the external criticality designation. CM does not re-determine it.",
      "The consequence judgment was made by qualified people. It was accepted by an authority. Your job is to record it, cite the external criticality designation as the basis, and keep screening, because the other criteria still matter. A customer-assigned designation also engages criterion (d), the Acquirer-designation screen. Sustainment reach usually engages criterion (g), the logistics screen. List every criterion that applies, by letter and by name."),
    C("The \u201cit is just a bolt\u201d escape hatch, closed", [
      "These part designations often land on small parts. A fitting. A bushing. A fastener. An assessor may argue the part fails the end-use function gate. That argument rejects the part at gate 2, before the safety criterion is ever reached.",
      "The rule: **an external criticality designation from the table above satisfies gate 2.** The designation is evidence that the part performs a function with system-level consequence. An assessor who still concludes the part fails the gate needs System Safety concurrence in writing. That decision goes through the safety disposition gate, on the same terms as any other non-designation of a safety-critical item."]),
    P("One caution before moving on. This table under-catches. The safety-critical screen also covers loss of primary system capability. No external criticality designation scheme keys on lost capability without an injury pathway. Items in that class appear on no safety list. They come from your own decomposition, or they come from nowhere.")
  ],
  check:{q:"A customer-assigned critical safety part designation lands on a small structural fitting. An assessor argues the fitting fails the end-use function gate: it is \u201cjust a fitting.\u201d What does the process require?",
   o:[
     "Nothing further. Gate 2 comes before the screen, and a candidate that fails a gate never reaches the criteria",
     "The external criticality designation satisfies gate 2. Failing it anyway requires System Safety concurrence in writing, and the decision goes through the safety disposition gate",
     "The fitting is screened as a normal candidate, with the external criticality designation counting as one criterion among seven",
     "The external criticality designation is returned to the customer for clarification"],
   a:1, why:"The external criticality designation is evidence of a function with system-level consequence, so gate 2 is satisfied. Failing the part at the gate is the one move that skips the safety criterion entirely, which is exactly why that move is not free. A written safety concurrence and a safety disposition make the decision visible, at the right altitude."}},
 {id:"M2-12", title:"When the safety designation is not a part classification", body:[
    P("Not every safety label lands on a part. Many land on something else. A function. A maintenance task. A failure mode. A development assurance level. A feature on a drawing. A location on the airframe. None of these is an item. So none of them can be a CI. And none of them designates a CI on its own."),
    P("But each one is a signal. It tells you that parts worth screening exist nearby. Your job is to get from the label to the parts. **You do not work that out yourself. You ask.** Identifying the hardware behind a function is engineering analysis. A good guess is still a guess, and a guess misses the parts you did not think of."),
    TABLE(["The label", "What it is attached to", "What you ask for"], [
      ["A safety-critical **function** from the system safety analysis", "A function", "The items that implement the function"],
      ["A maintenance task created to catch a hidden failure", "A task", "The items whose hidden failure the task exists to detect"],
      ["A failure-mode criticality code", "A failure mode", "The hardware in which that failure mode lives. Note that a redundant configuration with the same end consequence carries the same code. Redundancy does not relieve the screen"],
      ["A development assurance level", "A function, or a development baseline", "Nothing, on its own. A top-level function can be built from parts that do not meet the safety-critical screen. Software is a CI by rule regardless of level"],
      ["A published airworthiness limitation", "Sometimes a part. Sometimes an inspection task on a zone", "Which one it is. A limitation attaching to a discrete part sends you to that part. A zonal inspection task names no item: control lives in the parent CI\u2019s documentation"],
      ["A critical or key characteristic", "A feature or process parameter", "Screen the **parent part.** Also ask why it was flagged: the quality-system term covers producibility and fit as well as safety"],
      ["A principal structural element", "A location, tracked by tail number and position", "The detail parts at that location, screened on their own merits"]]),
    S("Ask for the parts behind the mitigations, not only the parts behind the hazards.",
      "A hazard log read only for causes returns the parts that can start an accident. It does not return a cargo fire suppression bottle, a crew oxygen system, or an ejection seat component. Those items protect people during an accident that something else caused. Ask for them by name: the items implementing protective functions and hazard mitigations."),
    C("Do protective items pass the safety-critical screen?", [
      "This needs a straight answer, because the screen asks whether the item\u2019s own failure might cause serious injury, loss of life, or loss of primary system capability. A fire bottle that fails does not start the fire. On its own failure consequence, it does not pass.",
      "**But you do not make that determination.** If the safety analysis names the item as a safety-critical item, or as implementing a hazard control, then it passes the safety-critical screen and you record it on that basis. That is one of the populations from the previous section.",
      "**If the safety analysis does not name it, the item still gets screened against everything else, and protective equipment very often passes.** Scheduled replacement, provisioning, a technical manual, dedicated test equipment: that is the logistics screen. Its own type designation or version identity: that is the separate-identity screen. Ask the safety question, then run the rest of the screen regardless of the answer.",
      "And if it is designated as a CI on none of them, it is not uncontrolled. It is controlled within its parent CI\u2019s configuration documentation, and the assessment names that parent."], "teal"),
    C("The exchange runs both ways", [
      "CM asks for the parts behind the labels. CM also sends something back. Two lists. The first is the current CI list, with its safety-critical flags and hazard references. The second is every item that carried a safety designation and was **not** designated a CI, with the rationale for each.",
      "The second list is not a courtesy. It is the population System Safety has to concur on. Without it, the interface fails quietly, one undesignated item at a time."], "teal")
  ],
  check:{q:"The system safety analysis names \u201cautomatic ground collision avoidance\u201d as a safety-critical function. What does CM do with that?",
   o:[
     "Designate the function as a CI, since the analysis is authoritative",
     "Nothing: functions are outside CM\u2019s scope",
     "Ask the safety and engineering teams to name the items that implement the function, then screen those items",
     "Screen the flight control computer, since that is where such functions usually live"],
   a:2, why:"A function is not an item, so it cannot be designated as a CI. But it is a strong signal. The correct move is a named request: which items implement this function? Guessing at the hardware is doing engineering that belongs to another team, even when the guess is a good one. And it misses the items you did not think of."}},
 {id:"M2-13", title:"Life-limited parts", body:[
    P("Many aerospace parts carry a life limit. A compressor disc is limited by engine cycles. A landing gear component is limited by landing cycles or flight hours. An elastomeric seal is limited by cure date. A sealant or adhesive is limited by shelf life. The word is the same in all four cases. The reasons are not."),
    S("A life limit is a maintenance control. It is not by itself a reason to make the item a CI. It also does not satisfy the safety-critical screen on its own.",
      "A limit tells you the item degrades, and it tells you how continued service is assured. It tells you nothing about what happens if the item fails. Those are different questions, and only the second one is what the safety-critical screen asks."),
    P("So a life limit never designates a CI on its own. What it does is tell you to run the screen properly. A life-limited part is designated as a CI when it passes a screen, and there are two ways that happens."),
    CARDS([
      {h:"It performs a safety-critical function", b:"Some life-limited parts are limited **because** their failure would be severe. An engine life-limited part is the clearest case, and that population appears in the designation table two sections back. A landing gear safe-life component is another. In these cases a consequence determination already exists somewhere. Follow the limit back to it, and screen on that determination rather than on the limit."},
      {h:"It passes some other screen", b:"A life limit almost always brings scheduled replacement, provisioning, and a maintenance procedure. That is the logistics screen, and it is met regardless of whether anything about the item is safety-critical. Life-limited items also frequently carry their own version identity or type designation, which is the separate-identity screen."}], 2),
    P("And a life-limited item can pass neither. That is a legitimate outcome, recorded like any other, with the parent CI whose documentation controls the item."),
    TABLE(["Life-limited item", "Why the limit exists", "Where it lands"], [
      ["Engine compressor disc, limited by cycles", "Failure would be hazardous. The limit is how that consequence is managed", "Passes the safety-critical screen through its part designation. Also the logistics screen"],
      ["Main landing gear cylinder, safe-life limited", "Structural failure consequence drives the limit", "Follow the limit to the consequence determination and screen on that. Logistics applies too"],
      ["Hydraulic system seal, limited by cure date", "The material ages in storage. Nothing about the consequence of a single seal failing", "Fails the safety-critical screen. Usually controlled within the parent CI\u2019s documentation"],
      ["Structural sealant, limited by shelf life", "Shelf life of the material as supplied", "Fails the safety-critical screen. Normally a specification callout, not a CI"],
      ["Emergency battery, limited by service life", "Capacity degrades with age. Its protective role is a separate question from its limit", "Ask the safety team about the protective function. Screen the rest regardless, where logistics usually applies"]]),
    C("Screen the item, not the label", [
      "The word \u201clife-limited\u201d sorts limits, not items. Two items carrying the same label can land in completely different places, and one item can have more than one reason for its limit.",
      "The limit also decides nothing about the product unit record. A cycles or hours limit serializes. A shelf-life or cure-date limit does not. That is the two-clocks rule from M1-08 in Module 1, and it is a separate assessment from this one.",
      "**An aircraft lithium main battery is the example worth remembering.** It has a service life limit, which suggests a routine replacement item. It can also fail in a way that starts a fire, which is a hazard the battery itself causes. The limit tells you nothing about that. The screen does."])
  ],
  check:{q:"A hydraulic seal carries a cure-date shelf life. Does the life limit make it a Configuration Item?",
   o:[
     "Yes. A life limit is a form of criticality designation",
     "Yes, because life-limited items always require tracking",
     "No. The limit is a maintenance control and designates no CI. Screen the seal on consequence and on the other screens, and record where it is controlled if it is not designated as a CI",
     "No, and no further screening is needed once the limit is identified"],
   a:2, why:"The limit says the material ages in storage. It says nothing about what happens if the seal fails, which is what the safety-critical screen asks. A seal like this usually fails every screen and is controlled within its parent CI\u2019s documentation. But that is a screening outcome you record, not something the life limit decided for you. The last option makes the opposite error: the limit ends no assessment either."}},
 {id:"M2-14", title:"Critical influencing parts", body:[
    P("This one is narrow, and it comes almost entirely from engines. It is worth a section because it is the case that defeats a careless screen."),
    P("The approved life of an engine life-limited part, a compressor disc for example, is calculated from a model. That model assumes things about the disc\u2019s working environment: the loads on it, the temperatures it sees, how it is clamped and spaced. Other parts set those conditions. A spacer, an air seal, a tie bolt. In engine work these are called **critical influencing parts**."),
    P("An influencing part carries no life limit of its own. Its own failure is not hazardous. What it does is hold up the assumptions behind somebody else\u2019s stamped life."),
    S("Change an influencing part, and the life stamped on the disc may no longer be valid.",
      "The disc has not changed. Its paperwork has not changed. The calculation behind its life has, and nobody was told. The part keeps flying inside a limit that was computed for conditions that no longer apply."),
    P("Against the screens, an influencing part behaves in a way that catches people out:"),
    L([
      "**It fails criterion (b), the safety-critical screen**, by its own definition. Its own failure has no hazardous effect, so citing that criterion would be wrong.",
      "**It can pass criterion (a), the system-functioning screen**, where the life basis of a safety-critical part depends on its configuration. A change to it needs its own effectivity address, because somebody has to be able to ask which discs were assembled with which spacer.",
      "**CM does not identify influencing parts.** That is lifing analysis. It belongs to propulsion, or to the engine manufacturer. CM asks, per life-limited part, whether influencing parts exist for its life basis, and screens whatever comes back."]),
    C("If the engine is a commercial or vendor-controlled item, stop", [
      "This is gate 3, and it is where the rule is enforced. CM does not decompose a commercial or vendor-controlled item into smaller CIs. Where the engine is procured as a catalog or vendor-controlled item, **the engine is the CI.** Its internal parts are not CIs, and its critical influencing parts are not CIs either.",
      "They are controlled inside the engine\u2019s own documentation, under the vendor\u2019s design authority. Your question is no longer a selection question. It becomes a flowdown question: does the vendor notify you when they change one, and what does your change process do with that notice? That is what the change and discontinuance notification requirement in Module 5 exists for.",
      "**The influencing part becomes a CI candidate only where your company holds design authority over the engine or the module containing it**, or where the part is separately procured and managed at your level."]),
    C("Four things the rule does not do", [
      "Not decomposing is not the same as not controlling, and this is where the rule gets misread.",
      "**Part attribute identification still applies inside the item.** Safety-critical, life-limited and special handling attributes attach to parts within a procured item whether or not those parts are CIs. Engine life-limited parts are the standard example. They are not customer-facing CIs, and they are individually serialized, life tracked and traceable. Part attribute identification and CI selection are separate decisions.",
      "**The item can still be designated for audit** at the procurement level, and the supplier\u2019s audit role follows from the type of work it performs.",
      "**Interfaces at the item boundary are still registered.** The boundary between the procured item and the rest of the system is an interface like any other.",
      "**The supplier still holds its own structure.** They maintain CIs internally at whatever level their own design authority requires. Those are supplier relationship CIs, not customer-facing ones, and what they owe you upward is a flowdown question."]),
    S("The rule follows design authority, not the item.",
      "Your company may later take on design authority for a supplier-designed item, usually by acquiring the data rights or by initiating a company-controlled modification. When that happens, identification is re-run. The engine did not change. Who is allowed to define it did."),
    P("The general lesson outlives the engine case. Run every screen, not just the one that brought the candidate to your attention. An influencing part screened against the safety-critical screen alone gives you a clean no, and the no is correct. Stopping there is the mistake."),
    S("The same pattern runs through the same-CI decision later.",
      "S3, the safety trigger, will never catch an influencing part, because the part fails the safety criterion by its own definition. S6 will, because a change to it needs its own effectivity address. Two different tests, one part, and only one of them finds it.")
  ],
  check:{q:"An engine is procured as a vendor-controlled catalog item. The manufacturer identifies two critical influencing parts for the fan disc life model. Do you designate them as CIs?",
   o:[
     "Yes. Anything affecting a life-limited part is designated as a CI",
     "Yes, but at a lower level than the engine",
     "No. The engine is the CI, and a commercial or vendor-controlled item is not decomposed into smaller CIs. The influencing parts are controlled inside the engine\u2019s documentation, and your control is the vendor\u2019s change notification",
     "No, and the manufacturer\u2019s information can be disregarded"],
   a:2, why:"Decomposing a vendor-controlled item into CIs claims a level of control your company does not hold and cannot exercise. The engine is the CI. What the influencing-part information changes is your flowdown: you need to know when the vendor changes one, which makes the change and discontinuance notification requirement load-bearing rather than routine. Disregarding the information is the other error, because it is exactly what tells you which notices matter."}},
 {id:"M2-15", title:"Worked examples: is it a CI?", body:[
    P("The three gates, then the criteria screen, in that order, every time. Most of the difficulty in practice is not the rule. It is being honest about which gate a candidate actually fails."),
    TABLE(["Candidate item", "How it screens", "Verdict"], [
      ["Hydraulic reservoir assembly storing and conditioning fluid for the flight control system", "Passes the gate: it performs a defined system function. Meets the system-functioning screen: the system cannot operate without it. Also the logistics screen: provisioning and maintenance documentation", "**CI.** Designate as a CI, and list both criteria"],
      ["A structural fastener, one of eleven thousand, called out by specification on the assembly drawing", "Fails the gate: no system end-use function of its own", "**Not a CI.** Controlled by the specification called out in the parent CI\u2019s documentation"],
      ["The operational flight program running on the flight control computer", "Computer software. A rule, not a judgment: it does not need a criterion", "**CI.** Designate as a CI as a software CI"],
      ["Cabin sidewall trim panel: cosmetic, no load path, no functional role", "Fails the gate", "**Not a CI.** Controlled within the parent CI\u2019s documentation"],
      ["A commercially procured inertial measurement unit embedded in the navigation subsystem", "Passes the gate. Meets the system-functioning screen, the separate-identity screen: it carries its own version identity, and the logistics screen", "**CI.** Who designed it and who owns it are not criteria"],
      ["Landing gear uplock actuator whose failure can prevent gear extension", "Passes the gate. Meets the safety-critical screen squarely, and almost certainly the system-functioning screen", "**CI.** And the safety-critical screen is mandatory for safety: non-designation as a CI would need System Safety concurrence and a recorded safety disposition"],
      ["Ground support test set delivered under the contract, with its own type designation and technical manual", "Passes the gate: support equipment performs a defined function for the system. Meets the separate-identity and logistics screens", "**CI.** Support equipment is screened on the same terms as flight hardware"],
      ["A wiring harness between two CIs, procured to a company drawing", "Passes the gate: it carries defined signal and power interfaces. Whether to designate as a CI turns on the screens: separate provisioning and maintenance action? Long lead or sole source?", "**Judgment.** Screen it honestly and record the rationale either way"],
      ["A drag brace fitting carrying a customer-assigned critical safety designation", "The external criticality designation satisfies gate 2 and answers the safety-critical screen. The customer assignment also meets the Acquirer-designation screen, and sustainment reach brings the logistics screen", "**CI.** CM records the designation: it does not re-determine it, and lists every screen that applies"],
      ["A cargo fire suppression bottle with a shelf-life limit, on no critical-parts list", "The limit answers nothing. Whether its protective function is safety-critical is a safety determination, so ask. Then screen the rest regardless, where the logistics screen usually applies", "**Ask, then screen.** Designate as a CI on whichever screens it passes, and name the parent if it passes none"],
      ["A spacer that sets the boundary conditions in a life-limited disc\u2019s approved life model", "Fails criterion (b), the safety-critical screen, by its own definition. No hazardous failure of its own. Passes criterion (a), the system-functioning screen, because the disc\u2019s stamped life depends on this part\u2019s configuration", "**CI on criterion (a).** And a decision not to designate as a CI still gets System Safety visibility"]]),
    P("Two worked questions, walked the way you should walk them out loud:"),
    STEPS([
      {h:"A valve the Acquirer has placed on their designated CI list, which your team thinks is too small to warrant it", b:"Gate: it performs a defined function, so it passes. Screen: the Acquirer-designation screen is met the moment the Acquirer designates it. Nothing else needs to apply. **Designate as a CI.** The judgment about whether it \u2018warrants\u2019 designation as a CI is not yours to make for an Acquirer-controlled item: final designation authority there rests with them. Record the Acquirer-designation screen as the basis and move on."},
      {h:"A battery pack that is not critical to the mission, is not safety-critical, and is neither novel nor high value, but requires danger tag-out and a dedicated maintenance procedure", b:"Gate: passes. Screen: system functioning, no. Safety-critical, no. Technology, no. Risk-and-cost, no. Logistics, **yes**: it requires logistics elements. **Designate as a CI.** One YES is sufficient, and the logistics screen is the one newcomers most often forget to look at, because it has nothing to do with how impressive the item is."}]),
    C("Two errors to watch for in yourself", [
      "**Failing a candidate at the gate because you would rather not designate it.** The gate asks one question: does this satisfy a system end-use function, and \u201cthat would be inconvenient\u201d is not an answer to it. If a candidate passes the gate and no criterion applies, say exactly that. The screen is where a defensible no comes from.",
      "**Passing a candidate at the screen because it feels important.** Importance is not a criterion. Name the criterion, or do not designate."])
  ],
  check:{q:"A program declines to designate an item as a CI, reasoning that it is a commercial part bought to a vendor\u2019s part number and that the company holds no design authority over it. Is the reasoning sound?",
   o:[
     "Yes: items the company does not design are controlled by the vendor rather than designated as a CI",
     "Yes, provided the vendor is a qualified source",
     "No: design ownership is not among the criteria; the item is screened on the same terms as anything else",
     "No: commercial items are always designated as a CI"],
   a:2, why:"The gate asks about end-use function and the screen runs the seven questions. Neither asks who drew it. A commercial item can easily meet the separate-identity screen for its own version identity, the logistics screen for provisioning, or the risk-and-cost screen where it is sole-source, and buying it rather than designing it changes none of that. \u201cAlways designated as a CI\u201d is equally wrong: it still has to meet something."}}
 ],
 exercises:[
 {id:"M2-E1", title:"Exercise 1: Read the specification like CM",
  scen:"Below is a fragment of a specification for an environmental control unit. Read it as a CM engineer nominating candidates. Do not screen and do not designate anything yet.\n\n3.1.1 The environmental control unit shall condition bleed air to supply cabin air at the temperatures of Table 3-1.\n\n3.1.4 The unit shall comprise an air cycle machine, a heat exchanger, a water separator, and a temperature control valve.\n\n3.2.2 The temperature control valve shall receive commands from the cabin temperature controller over the aircraft data bus.\n\n3.2.9 The air cycle machine bearings shall be lubricated by the oil system of 3.5.\n\n3.3.4 The heat exchanger core shall be replaceable at the organizational maintenance level.\n\n3.4.1 The unit shall be qualified to the vibration and thermal environments of Appendix B.\n\n3.5.2 Oil shall conform to the specification of Appendix D and shall be replaced at intervals not exceeding those of Table 3-4.\n\n4.2.6 Each air cycle machine shall be marked with a serial number and shall carry a record of operating hours since new.\n\n5.1.3 Embedded software in the temperature control valve shall be reloadable without valve removal.\n\nAppendix B, Note 3: Units delivered to the extended-range configuration use the high-flow heat exchanger of drawing 88-4471-02 in place of the standard core.",
  parts:[
   {id:"a", q:"List every noun in this fragment that names a thing. Do not filter yet. Say which ones have a requirement written against them, because that is your strongest nomination signal."},
   {id:"b", q:"Find the boundaries. Which requirements name two things at once, and what would you ask about each boundary? Name the document you would ask for."},
   {id:"c", q:"Find the identification and traceability signals. Quote the words that produced each one, and say what product unit record each implies."},
   {id:"d", q:"Find the qualification, supportability, and software signals. For each, say which function you would take the question to and what you would ask them."},
   {id:"e", q:"Appendix B Note 3 does something the body of the specification does not. What is it, and what does it add to your candidate list?"},
   {id:"f", q:"Produce your candidate list. For each entry, give the one-line reason it is a candidate. Do not screen it and do not designate it."},
   {id:"g", q:"Name one thing you cannot answer from this document, and say who you would ask."}
  ]},
 {id:"M2-E2", title:"Exercise 2: Read the FMECA like CM",
