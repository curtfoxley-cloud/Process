      "Classifying by the dominant work type only. Tailoring without recording the classification. Citing a requirement without its deliverable. Deciding audit applicability once, at award. Reading \u201cno designation for audit\u201d as \u201cno verification flowdown.\u201d Imposing the reconciliation report but not the method. Leaving the part attribute authorship case unstated. Assembling effectiveness evidence at review time. Treating a determination as a filing event. Closing a corrective action on an assertion. Letting the classification go stale."])
  ],
  check:{q:"A supplier proposes not to flow a requirement mandatory for safety to its own small machining sub-tier. What is the correct response?",
   o:[
     "Accept it: proportionality is the point of tailoring",
     "Refuse it verbally and move on",
     "Route the proposal through the safety disposition gate for disposition and record the outcome; the decision is not the supplier\u2019s and not yours alone",
     "Escalate to the Acquirer for direction"],
   a:2, why:"The size of the shop is not a disposition. Requirements mandatory for safety do not dilute with depth. Even a refusal is recorded through the gate, so that the next person can see the decision and its basis."}}
 ],
 exercises:[
 {id:"M6-E1", title:"Exercise 1: Reading a delivery",
  scen:"Twelve life-limited actuators arrive from a source-controlled design-and-build supplier. Part traceability records are present for all twelve, with serial and lot numbers complete, but the life-consumed field is blank on all twelve. The reconciliation report for the lot states no open deltas. Receiving separately finds that two units carry a bracket to a revision superseded four months earlier.",
  parts:[
   {id:"a", q:"List each finding, classify each as a record defect or a control that did not operate, and say which evidence stream it belongs to."},
   {id:"b", q:"Which finding is the most serious signal about the supplier\u2019s CM process, and why?"},
   {id:"c", q:"Is any of this safety-relevant? What follows if it is?"},
   {id:"d", q:"What determination would you support on this evidence alone, and what would you want to see before making it?"}
  ]},
 {id:"M6-E2", title:"Exercise 2: Reading a situation",
  scen:"You inherit a supplier portfolio. You find: classification records for eleven of forty-three active statements of work; a receipt log last updated fourteen months ago; no findings log; three suppliers with determinations recorded as Effective, all dated the same day; and a fourth supplier with two safety-relevant escapes in the past year and no determination at all.",
  parts:[
   {id:"a", q:"Name each problem and say what it means for the determinations that exist."},
   {id:"b", q:"Which supplier do you address first, and why?"},
   {id:"c", q:"Which of these can CM fix alone, and which need another function to act?"},
   {id:"d", q:"Some statements of work were released without CM signature. Against what is that finding recorded, and why does it matter that it is recorded that way?"}
  ]},
 {id:"M6-E3", title:"Exercise 3: Acting on a determination",
  scen:"After a further two quarters of accrued evidence showing a declining first-pass acceptance rate, you record a determination of Ineffective on that supplier.",
  parts:[
   {id:"a", q:"Select actions from the ladder and justify the level you chose."},
   {id:"b", q:"One action is a corrective action request. What must be true before you close it?"},
   {id:"c", q:"Name the four downstream consequences an ineffective determination triggers beyond the ladder, and what each protects against."},
   {id:"d", q:"A requirement was tailored at award on the basis that the supplier had a mature process. What now?"}
  ]},
 {id:"M6-E4", title:"Exercise 4: Recursion",
  scen:"The actuator supplier subcontracts machining of the housing to a shop of their own, and buys the position sensor from a catalog vendor.",
  parts:[
   {id:"a", q:"What obligation, if any, does your company have with respect to those two lower-tier sources?"},
   {id:"b", q:"What data must come back up, and in what form?"},
   {id:"c", q:"The supplier\u2019s CM plan describes internal change control thoroughly and does not mention sub-tier suppliers. What is your review finding, which evidence stream does it belong to, and why is it a failure signal rather than a missing detail?"}
  ]}
 ]
},
{
 id:"M7", label:"Module 7", title:"Audits in the supply chain", sub:"What the two audits are, how a CI earns one, and what a supplier is agreeing to when the clause fires",
 sections:[
 {id:"M7-01", title:"What a configuration audit is", body:[
    P("Two audits. They are asked at different moments, about different questions, and almost everything else about them follows from knowing which question is on the table."),
    CARDS([
      {h:"Functional configuration audit", b:"**Does the CI do what it was required to do, and can you prove it?** The formal audit that verifies the CI\u2019s tested performance against its approved functional and allocated documentation. It also confirms that specifications and interfaces are accurately and adequately defined, and that the change control system genuinely controls the processing and release of documentation. Prerequisite: the Acquirer has already approved the functional and allocated baselines for the item."},
      {h:"Physical configuration audit", b:"**Is the thing you actually built the thing the documentation describes?** The formal examination of the as-built configuration of a validated CI, or the as-coded configuration for software, against its product documentation, verifying that the documentation is a clear, complete and accurate representation of what physically exists. Prerequisite: the functional audit completed successfully, or running concurrently."}], 2),
    P("The order is not a convention. The physical audit examines a **validated** item, and validation is what the functional audit produces, so a physical audit cannot begin before its functional audit is complete or concurrent. The two may be run as one event where there is high confidence that both sets of requirements will be met within the same timeline."),
    C("The product baseline has two states, and each has its own event", [
      "The **initial product baseline** is established at completion of critical design review.",
      "The **formalized product baseline** is established no later than first production unit delivery or physical audit completion.",
      "For a CI designated for a physical audit, that audit is the formalizing event. The Acquirer formalizes the product baseline on successful completion of the audit and approval of the product specification.",
      "For a CI not designated for audit, the product baseline is formalized no later than first production unit delivery.",
      "Between the two events the CI carries its initial product baseline. That is a real baseline and it is real control. What it does not yet carry is the Acquirer's acceptance of it as the definition of the CI."]),
    S("Deferring the audit does not save an activity. It holds the CI on its initial product baseline.",
      "Every unit built in the meantime is built against a product baseline the Acquirer has not yet formalized. After formalization, every change to the CI is processed by formal engineering change action."),
    P("Audits proceed bottom-up: lower-level items first, then subsystems, then the system level. Two variations are worth knowing by name, because you will hear both:"),
    CARDS([
      {h:"Incremental, and the final system-level audit", b:"Audits conducted bottom-up in increments, concluding with a final system-level audit that confirms all functional, allocated and product baseline requirements are satisfied. Open action items from the lower-level audits are carried into the system-level minutes: they do not evaporate on the way up."},
      {h:"Delta audit", b:"A follow-on audit covering only the portion left open at the original, typically verification that could not be completed in time. Its results are added to, or supersede, the original minutes. This is the mechanism that lets an audit proceed honestly with known gaps instead of pretending they closed."}], 2),
    C("Audits do not do the verification. They test whether the verification works", [
      "Configuration verification is continuous and embedded: functional verification through the test program, physical verification through inspection and process control on every unit, and as-designed-to-as-built reconciliation run at scale across the data for all items.",
      "An audit is a discrete validation, on a item designated for audit and a representative unit. Its purpose is to confirm that continuous machinery is working, not to replace it. It is not the intent of an audit to verify every change individually.",
      "**Which is why \u201cwe will catch it at the audit\u201d is never a plan, and why \u201cnot designated for audit\u201d never means \u201cno verification.\u201d**"], "teal")
  ],
  check:{q:"Why can a physical configuration audit not begin before its functional audit is complete or running concurrently?",
   o:[
     "Because contracts conventionally schedule them in that order",
     "Because the physical audit examines the as-built configuration of a **validated** item, and validation is what the functional audit produces",
     "Because the Acquirer will not attend two audits at once",
     "It can: the two are independent examinations and either may go first"],
   a:1, why:"The physical audit asks whether the documentation accurately describes what was built. That question only means something once the item has been shown to meet its requirements: otherwise you are confirming that the paperwork faithfully describes something nobody has established works."}},
 {id:"M7-02", title:"Inside a functional configuration audit", body:[
    P("At bottom the functional audit is one question, asked over and over: **for this requirement, where is the evidence it was met?**"),
    C("Before that question can be asked: the requirements allocation matrix", [
      "A requirements allocation matrix states which system requirements are allocated to this item. It is what the item is accountable for.",
      "It is not the same as the traceability matrix. The allocation matrix answers what this item must satisfy. The traceability matrix answers how each of those was verified, and with what result.",
      "The audit needs both, and the traceability matrix is checked against the allocation matrix rather than against itself. Without that check, the audit can only verify the requirements somebody chose to put on a list.",
      "The worst finding a functional audit can produce is a requirement nobody verified, because nobody recorded that it was allocated here. That finding is only reachable if the allocation matrix is in the room."]),
    STEPS([
      {h:"The opening briefing", b:"The design team briefs each audited CI: an overview, test results and findings, requirements not met with proposed remedies, changes incorporated, tested and proposed, and the overall test effort including its problem areas. Opening with what did not work is part of the format, not a failure of it."},
      {h:"The documentation flow, requirement by requirement", b:"For each requirement, or for an agreed sample, walk the chain: the baseline requirement in the specification, to the test plan, to the test procedure, to the test report. Where a requirement is not verified by test, the analysis, inspection or demonstration record stands in the same position. Interface requirements are verified through this same flow."},
      {h:"Account for what has not been done", b:"Tests accomplished; tests performed without recorded detail data; tests not yet performed, each with the plan to accomplish it; and the analyses or simulations covering requirements not fully verifiable by test. An honest account of the gaps is an audit output in its own right."},
      {h:"Changes and prior findings", b:"Review all approved changes, with an account of those incorporated, those tested, and those proposed. Examine the earlier design review minutes to confirm their findings were incorporated and action items closed, and review lower-level audit minutes and their open items."}], "tl"),
    P("Software is audited on the same logic, with more surface. Five things get examined:"),
    L([
      "Database characteristics, storage allocation, and timing and sequencing, against requirements.",
      "Every document describing the product, checked for format and completeness.",
      "Developmental configuration change records.",
      "The listing of every developmental and non-developmental version held in the library.",
      "The findings of internal CM and software quality audits."]),
    P(" For software the standard is stated flatly. **Every requirement has a related test step, and that test passes.**"),
    P("The audit does not invent its own questions. The configuration audit process carries a **functional audit check set of twenty checks, in five groups.** Every check is performed for every CI designated for a functional audit, and every check is recorded as pass, finding, or not applicable. A check that does not apply is recorded as not applicable. It is never omitted."),
    TABLE(["Group", "Checks", "What the group establishes"], [
      ["The verification chain", "1 to 5", "Every requirement is verified, by a stated method, with an unbroken evidence trail, against the right configuration"],
      ["Completeness", "6 to 9", "What was tested, what was tested without recorded data, and what has not been tested yet"],
      ["Change and variance", "10 to 12", "Nothing verified has since been changed, and known departures and known failures are visible"],
      ["Software", "13 to 17", "The five examinations with no hardware equivalent"],
      ["Carry-forward and closure", "18 to 20", "Prior findings closed, reprocurement data exists, and open verification is carried rather than dropped"]]),
    C("What a buyer needs from this, and what a buyer does not", [
      "You do not need the twenty checks memorized. The audit team owns them.",
      "You need three things. **A named set exists.** **Depth is fixed by the set, not by the audit plan.** Each check is marked in full or sampled, and the plan sets only the sample sizes within that depth.",
      "That is what lets you cite the audit in a statement of work and tell a supplier what is coming.",
      "**One rule in the set is not tailorable.** Requirements that verify hazard risk controls are in the sample for every sampled check. They are never sampled out."]),
    P("One deliverable carries the whole audit: a traceability matrix covering all requirements, cross-referencing the test plans, procedures, test programs and reports, and identifying each known deficiency by its report number. It is provided before the audit and becomes part of the minutes. It is the artifact that makes the audit checkable by someone who was not in the room."),
    S("Where sampling is agreed, safety-critical requirements and those verifying hazard controls are included in the sample, never sampled out.",
      "Sampling is a concession to volume, not a lottery that safety requirements are allowed to lose. A sample that quietly excludes the requirements that matter most has inverted the purpose of sampling."),
    P("Where verification genuinely depends on integrated system testing that has not happened yet, partial completion may be acknowledged. The open requirements become action items. A delta audit closes them once the outstanding testing passes.")
  ],
  check:{q:"A specification carries 1,900 requirements and the audit is agreed to proceed on a sample. How are the requirements that verify hazard controls treated?",
   o:[
     "Sampled on the same basis as every other requirement, so the sample stays statistically valid",
     "Deferred to a delta audit, since safety verification usually completes late",
     "Included in the sample as a matter of rule: they are never sampled out",
     "Excluded, because System Safety verifies them separately"],
   a:2, why:"Sampling exists to make a large requirement set auditable in the time available. It is not a random draw, and the requirements whose failure hurts most are the ones the audit least affords to miss. They go in the sample by rule, and the remaining sample is drawn around them."}},
 {id:"M7-03", title:"Inside a physical configuration audit", body:[
    P("The physical audit takes one unit. It is an early production-representative unit, **agreed with the Acquirer** rather than offered up by whoever is being audited, and the audit asks whether the documentation describes it. The audit is conducted jointly at a time and place both parties agree on, the Acquirer co-chairs it, and **the Acquirer co-chair identifies the drawing sample** and the items to be examined."),
    C("What the audit works from, and what it is really testing", [
      "The primary input is the as-designed to as-built reconciliation report for that specific unit, including its nonconformance records and their dispositions.",
      "The audit does not perform the reconciliation. The reconciliation already ran, at scale, through the status accounting system. The audit checks whether that machinery produced the right answer for this unit.",
      "That is why a delta the audit finds that the report did not is a finding against the reconciliation process, not just against the unit. One unit was wrong. The process that was supposed to catch it was also wrong.",
      "A physical audit convened without the reconciliation report has nothing to verify. It becomes an inspection of the article, which is not what a physical audit is for."]),
    C("Three conditions that must be true before the audit convenes", [
      "**No open work orders** against the unit. Every one is complete and closed.",
      "**No open nonconformance records.** Every one has been dispositioned by the required authority.",
      "**No open dispositions.** Every disposition has been carried out and verified. This is the one people miss. A unit can show every nonconformance dispositioned and still have rework sitting in the queue.",
      "Until all three are true, the as-built configuration is not final. Any reconciliation drawn from it is provisional, and the audit would be testing a comparison whose right-hand side can still move. Auditing anyway produces a clean result against a configuration the unit does not yet have.",
      "Any one of the three open is a stop condition. The audit is rescheduled. It is not run with the item carried as an action."]),
    P("The physical audit runs a **check set of eighteen named checks.** Every check is performed for every CI designated for a physical audit. Every check is recorded as pass, finding, or not applicable. A check that does not apply is recorded as not applicable, never omitted, and the completed check set is the record that the substance was performed in full."),
    C("Depth is fixed by the set. The audit plan sets only sample sizes.", [
      "Each check carries its depth in the set itself: **in full**, or **sampled**.",
      "The approved audit plan decides how large a sample is. It does not decide which checks are performed in full.",
      "**Features implementing or protecting hazard risk controls are in every sample. They are never sampled out.** Nor are safety-critical characteristics. That rule is not tailorable.",
      "The physical audit samples in order to judge whether inspection and process control worked. It is not a re-inspection of the article, and it cannot verify material or process conformance by looking. It verifies the evidence chain, and its findings are breaks in that chain."]),
    P("The reconciliation activities below frame that examination. They are what the check set is doing, stated at the level a buyer needs:"),
    L([
      "**Reconcile the item to its documentation:** item, to drawings, to associated lists, to the parts list. Effectivity and next assembly. The accuracy of notes and references. The released documents those references point at.",
      "**Review a representative sample of drawings and model data with the matching manufacturing instructions**, confirming the instructions reflect the design detail and incorporate the authorized changes.",
      "**Confirm compatibility with the approved parts selection list, and examine the item to confirm the proper parts are actually installed.** Not the records about the parts: the parts.",
      "**Verify approved changes were incorporated**, and reconcile and correct any delta between as-designed and as-built data.",
      "**Identify the differences between this unit and the unit used at the functional audit**, and certify or demonstrate that those differences do not degrade functional characteristics.",
      "**Review shortage lists and undocumented design changes**, confirming no unapproved change exists in the documentation and every approved change is present in the hardware."]),
    P("For software, the audit examines the as-coded configuration against its documentation: source listings compared to the released documentation, and the version description verified, including the compiler, the compiler version, and the build settings. Then the part that surprises people:"),
    S("The build is produced during the audit, installed on the target, verified against its version description, and witnessed.",
      "Every software update listed on the build\u2019s problem reports is confirmed applied. This is the moment the toolchain identification pays for itself or fails in public: if the compiler version, settings and library state were never identified, the build cannot be reproduced and the audit cannot be satisfied."),
    P("For commercial software, the check is narrower but real: that the documentation supports the versions actually delivered on the media, and that identification and marking of every deliverable medium are adequate."),
    C("Why the examination is physical", [
      "A record can agree perfectly with the design while the hardware does not. That gap is the entire reason a physical audit exists, and it is not hypothetical: a door plug delivered with missing bolts, and tools and debris repeatedly found inside delivered aircraft, are precisely the class of non-conformance this examination is built to catch.",
      "**A parts list that matches the drawing proves the parts list. Only looking at the item proves the item.**"])
  ],
  check:{q:"Why does the physical audit include a physical examination of installed parts, rather than a review of the parts records against the approved parts list?",
   o:[
     "Because the records are frequently unavailable at the audit",
     "Because the Acquirer requires a demonstration of access to the facility",
     "Because the records can agree with the design while the hardware does not, and that divergence is the thing the audit exists to find",
     "Because the parts list is not a controlled document"],
   a:2, why:"Records comparing correctly to records tells you the paperwork is self-consistent. The failure mode that matters is as-built diverging from as-designed, and no amount of reading will surface it. Somebody has to look at the item."}},
 {id:"M7-04", title:"Findings, closure, and certification", body:[
    P("Nothing found at an audit exists until it is written down. Every discrepancy becomes an action item defining four things: the issue, the agreed closure plan, the responsible person, and the agreed suspense date. There is no such thing as a verbal finding."),
    TABLE(["Classification", "What it covers"], [
      ["Major", "Production definition documentation or design data incorrect or incomplete; a systematic breakdown of process control; clear non-adherence to workmanship standards; hardware or software not included in the build process; non-adherence to specification, interface or statement-of-work requirements; first article data missing or incomplete"],
      ["Minor", "Non-systematic errors: a typographical mistake in production definition documentation, in a process control record, or in workmanship standards documentation"],
      ["Observation", "General queries and process improvement recommendations. Anything meeting neither the major nor the minor criteria. Simple in nature, and not a cause for delay or for stopping production"]]),
    S("The line between major and minor is systematic versus not, not how many instances you found.",
      "One typo in one record is minor. The same error across eleven records because the process producing them is broken is major, and it would still be major if it had appeared only once."),
    S("The third class exists so a real observation does not get inflated into a minor finding.",
      "It also gives an auditor somewhere to record what they noticed. An audit with only two boxes pushes every general query into one of them, and the program then spends closure effort on something that was never a discrepancy."),
    C("Where these three classes come from, and the scheme people import by mistake", [
      "The three classes and their criteria are adopted from **GEIA-HB-649A**, which is guidance rather than a requirement. This company has adopted them.",
      "**EIA-649-1A does not classify audit findings at all.** It classifies two other things with similar words.",
      "Engineering changes are **major or minor**. Requests for variance are **critical, major or minor**.",
      "Neither scheme belongs on an audit finding. The variance scheme is the one that pulls people in, because it adds a critical class that audit findings do not have. There is no critical audit finding."], "amber"),
    P("The minutes are the audit\u2019s durable record. Their required content is specific:"),
    L([
      "The audited CI.",
      "The decisions and the proceedings.",
      "The attendees.",
      "The action items.",
      "The complete list of documents, **with their revision level at the time of audit**.",
      "The complete list of requirements audited.",
      "Identification of everything examined, by name, specification number, product identifiers, serial numbers, part numbers and CAGE code."]),
    STEPS([
      {h:"Publish", b:"Finalized minutes delivered within sixty days of audit completion, or per contract."},
      {h:"Close", b:"Every action item tracked to closure, with the corrective action documentation delivered for review. A summary report reflects all action items and discrepancies; the detailed final report issues only after the Acquirer has verified the completed action items."},
      {h:"Certify", b:"Joint certification signatures from the audit lead, the program manager, and Acquirer representatives, recording the result as **complete and successful** where nothing is open, or **conditional** where resolutions are agreed but tasks are not yet finished."},
      {h:"Disposition", b:"The Acquirer dispositions the audit as **approval** where all action items are satisfactorily completed, **contingent approval** pending their completion, or **disapproval** where the result is seriously inadequate."},
      {h:"Record", b:"Scheduled and actual audit dates, accomplishments and results recorded in status accounting, per CI audited."}]),
    P("Note where the product baseline sits in that sequence. For a CI designated for a physical audit, the Acquirer **formalizes** the product baseline after successful completion of the audit and approval of the product specification. Not on the day the audit ends. Until then the CI carries the initial product baseline established at critical design review.")
  ],
  check:{q:"A drawing reviewed at audit carries a superseded note. Investigation finds the same superseded note on eleven drawings, because change notices are not propagating through the release process. Major or minor?",
   o:[
     "Minor: a note error is a documentation typo by definition",
     "Minor, but raised to major if it recurs at the next audit",
     "Major: it is a systematic breakdown of process control, and the count of affected drawings is not what makes it so",
     "Neither: it is a change management issue rather than an audit finding"],
   a:2, why:"The classification turns on systematic versus non-systematic, not on volume. A release process that fails to propagate change notices produces incorrect production definition documentation on purpose, so to speak, and would be a major finding on the strength of the mechanism even if it had surfaced on one drawing only."}},
 {id:"M7-05", title:"Audit designation: how a CI earns an audit", body:[
    P("Audit obligations hinge on whether a CI is designated for audit. Designation for audit is not a matter of taste, and it is not decided by the supplier\u2019s work type: it is assessed per CI, and it arrives from two directions."),
    CARDS([
      {h:"Contract designation", b:"The CI is named in the contract, the statement of work, or the CM plan as requiring audit. This includes **every Acquirer-controlled CI whose product baseline the Acquirer will formalize at physical audit completion.** For those CIs the audit is the formalizing event, so deferring the audit holds the CI on its initial product baseline."},
      {h:"Risk-based designation", b:"For every CI not designated for audit by contract, the program assesses whether an audit is warranted, at initial audit planning, at each CM plan revision, and on any trigger event. Nothing is left unassessed merely because nobody named it."}], 2),
    P("A contract designation does not end the assessment. The risk factors below are still walked, because they can **expand** what the audit has to cover: adding a delta audit of open scope, or pulling an increment earlier than planned."),
    P("The assessment has a deliberate shape. It is not a scoring exercise where everything trades against everything. It is a form with four parts. **Parts A and B can designate for audit a CI for audit on their own. Part C designates on two or more risk factors. Part D says when the whole assessment runs again.**"),
    STEPS([
      {h:"Part A. Mandatory designation for audit", b:"Two questions. Is the CI identified in the contract, the statement of work, or the CM plan as requiring an audit? Is the CI an Acquirer-controlled CI whose product baseline the Acquirer will formalize at physical audit completion? **Any yes designates the CI for audit** on its own. The remaining parts are still walked, because risk factors can expand what the audit has to cover."},
      {h:"Part B. Safety criticality", b:"Five questions. Does the CI implement or host a hazard risk control in the hazard log? Is it a safety-criterion CI under the CI identification process? Does its credible failure consequence sit in the highest two severity categories? Is it safety-critical software, or firmware in a safety-critical device? Is it a single point of failure for a safety-related function? **Any yes designates the CI for audit by presumption.** Omission requires System Safety concurrence in writing. CM cannot make that call alone."},
      {h:"Part C. Risk factors. Nine of them, and two or more designate for audit", b:"**C1** new or novel design rather than proven heritage. **C2** substantive design change since the last audit. **C3** new or changed manufacturing source, process, facility or tooling. **C4** new or changed sub-tier supplier for the CI or its critical components. **C5** history of quality escapes, nonconformances, foreign object findings or subcontractor disclosures. **C6** findings of work performed not in accordance with approved data, or of inaccurate, incomplete or ambiguous manufacturing data, recorded against the CI. **C7** status accounting reconciliation health anomalies: delta aging, unincorporated-change backlog, serial and effectivity discrepancies. **C8** never received an audit, or a prior audit has an open delta or unresolved action items. **C9** a sub-supplier building the CI, or a critical component of it, determined less than effective. **Two or more designate the CI for audit. Exactly one is recorded and monitored.**"},
      {h:"Part D. Reassessment triggers. Six of them", b:"A substantive design, process, facility, tooling or supplier change. A new quality escape or safety event traceable to the CI. A status accounting reconciliation anomaly. A hazard log revision adding a risk control to the CI. A configuration management plan revision. **A sub-supplier effectiveness determination of less than effective for a supplier building the CI.** Any one of the six re-runs the whole assessment. Designation for audit is a standing question, not an award-day answer."}], "tl"),
    C("Two distinctions inside Part C that are easy to lose", [
      "**C5 and C6 are not the same factor.** C5 is escapes found in the product. C6 is findings about how the work was done. A line can have a clean escape record and a history of building to superseded data.",
      "**C9 and the sixth reassessment trigger are the loop this whole course teaches.** Poor effectiveness evidence on a sub-supplier is a risk factor, and it is a trigger that re-runs the assessment. The evidence you score in Module 6 is what sends a CI to audit in this module.",
      "Use **reassessment trigger** as the name. Not trigger event."]),
    S("The assessment and its rationale are recorded for every CI evaluated: designated for audit or not.",
      "The same principle as CI selection. A list of CI designated for audits shows an outcome. A record of what was assessed, and why it was not designated for audit, gives the next assessment something to start from and gives a reviewer something to argue with."),
    P("Designation for audit decides **whether** an audit happens to a CI. The supplier\u2019s work type decides **what their part in it is**. They conduct the audit at their own facility for items they design and build. They support one with data, records and facility access where the design or the build sits with the company. Those are different obligations with different costs, and the next section is about buying both before you need them."),
    C("Ceremony may be tailored. Substance may not.", [
      "Where an audit is initiated internally rather than by the Acquirer, the **ceremony** may be simplified: an internal co-chair and internal certification in lieu of Acquirer participation. The **substance** is performed in full: the requirements-to-test reconciliation and its traceability matrix, the as-built examination with approved-parts verification, and the documented non-compliances.",
      "The distinction generalizes, and it is worth carrying into every tailoring conversation you will have. Simplifying the format of a record, or sampling rather than checking exhaustively, is ceremony. **Removing a verification because an automated system is asserted to prevent the failure is substance: that verification exists to test the assertion.**"], "teal")
  ],
  check:{q:"A CI is not contractually designated for audit and hosts no hazard risk control. The assessment finds exactly one risk factor: a new sub-tier supplier. What follows?",
   o:[
     "Designate for audit: any risk factor is sufficient",
     "Nothing; with no safety criterion met and only one factor, the CI is out of scope until the contract says otherwise",
     "Record the factor and the rationale for not designating for audit, and monitor it, two or more factors designate for audit, and the assessment re-runs on trigger",
     "Refer the question to the Acquirer, who owns designation for audit"],
   a:2, why:"One factor does not designate for audit. Two or more do. But not designated for audit is a recorded decision with a rationale, not a silence. The assessment also re-runs on any of the six reassessment triggers, so a second factor arriving later changes the answer without anyone having to remember to ask."}},
 {id:"M7-06", title:"What designation for audit obliges: roles by work type", body:[
    P("Designation for audit decides **whether** a CI is audited. The supplier\u2019s work type decides **what their part in it is**: and the gap between conducting an audit and supporting one is the difference between a substantial obligation and a modest one. Both have to be bought in advance."),
    TABLE(["Work type", "Role if the CI is designated for audit"], [
      ["WT01 build-to-print", "**Supports** the physical audit on their build: facility access, as-built records, approved-parts evidence, and manufacturing instructions. They do not conduct: they hold no design authority and there is nothing at their end to audit against but the build"],
      ["WT02 source-controlled design and build", "**Conducts** the CI-level functional and physical audits at their own facility, substance in full"],
      ["WT03 design agent", "**Data support:** the technical data package and the inputs to the requirements-to-test traceability matrix. There is no build at their end and no unit to examine"],
      ["WT04 full CI design and build", "**Conducts** the CI-level functional and physical audits at their facility, substance in full: the heaviest audit role, matching the heaviest flowdown"],
      ["WT05 vendor item, commercial or catalog", "Generally not applicable"],
      ["WT06 software and firmware development", "**Conducts** the software functional audit, and the witnessed build and installation verification against the version description: the live rebuild you met in the physical audit section"],
      ["WT07 repair and overhaul", "Generally not applicable in its own right; their as-maintained records support audits of the parent item"],
      ["WT08 special process services", "Not applicable: there is no item configuration to audit"],
      ["WT09 installation build", "**Hosts** the end-item and system-level audit on its build. It provides the article, the facility, access including the installation zone, the zone closeout records, and the assembled evidence. Your company or the customer conducts, because the supplier holds no design authority"]]),
    S("Mixed classification takes the most demanding role, exactly as it takes the most demanding cell.",
      "A supplier who designs and builds a unit **and** develops its embedded software conducts the hardware audits and the software audit and the witnessed build. That is a materially larger commitment than either alone, and it follows from a classification field."),
    P("When designation for audit does arrive, three things become due, each scoped to that role: the audit plan and agenda; the audit data package; and afterwards the minutes with the action items tracked to closure. None of that is a surprise if the standing clause was written: you notify, and you set dates."),
    C("Preparation is a joint punch list, not a request", [
      "The preparation tracker is shared with the supplier and worked as one list. Each row is a required input: an entry criterion, a pre-audit submittal, or a data package item, with a provider, a due date derived from the audit date, and a status. Rows that do not apply to that item or that role are marked as such and **kept**, so the record shows they were considered rather than forgotten.",
      "**Entry criteria must all be complete before the audit convenes.** Readiness short of that on the day is a schedule conversation, not a footnote in the minutes, and holding that line is easier when the tracker has been visible to both sides for weeks."], "teal")
  ],
  check:{q:"A build-to-print supplier manufactures a CI that has just been designated for a physical configuration audit. What is their role?",
   o:[
     "Conduct the audit at their facility, since the article is built there",
     "Support it on their build: facility access, as-built records, approved-parts evidence and manufacturing instructions",
     "No role; the company conducts audits of items it designed",
     "Conduct the functional audit only, with the company conducting the physical audit"],
   a:1, why:"The article is theirs but the design is not, so there is nothing at their end to audit the design against: they hold no design authority and produce no design documentation. What they do hold is the build and the evidence about it, which is exactly what the physical audit needs from them. Conducting the audit is the role of suppliers who design what they build."}},
 {id:"M7-07", title:"Two gates, not one: the mistake that runs in both directions", body:[
    P("This section exists because two teams commonly hold two opposite wrong beliefs, and each one is expensive."),
    CARDS([
      {h:"The audit team error", b:"Believing every configuration item gets a functional and physical audit. It does not. Being a CI means the CI is managed separately, with its own specification, its own change control, and its own status accounting. Being audited is a second and much narrower decision. Most CIs are never formally audited."},
      {h:"The supplier CM error", b:"Believing that a supplier conducts an audit because of their work type. They do not. Work type never decides whether an audit happens. It decides only what the supplier\u2019s part in one would be, if an audit were to happen at all."}], 2),
    C("The rule, stated once", [
      "**Designation for audit decides whether.** An audit happens only where the CI has been designated for audit by the audit designation assessment. No designation for audit, no audit.",
      "**Work type decides what part.** If an audit does happen, the supplier\u2019s work type decides whether they conduct it, host it, support it, or provide data for it.",
      "**Both must be true.** Neither one alone produces an audit obligation. A CI designated for audit and built by a special process house produces no supplier audit role. A source-controlled supplier whose CIs are never designated for audit conducts no audits, ever."]),
    P("Read the table below across, not down. Every row is a real combination, and four of the six produce no supplier audit at all."),
    TABLE(["Is the CI designated for audit?", "Supplier work type", "What actually happens"], [
      ["No", "WT02 source-controlled", "**No audit.** The audit deliverables are never triggered. Everything else in the WT02 flowdown still applies in full: reconciliation, traceability, change control, first article. The standing conditional clause still goes into the statement of work, because designation for audit can arrive later."],
      ["Yes", "WT02 source-controlled", "**Supplier conducts** the CI-level functional and physical audits. The three audit deliverables become due."],
      ["Yes", "WT01 build-to-print", "**Supplier supports** the physical audit only. No functional audit role, because they hold no functional or allocated documentation to audit against."],
      ["Yes", "WT09 installation build", "**Supplier hosts.** Your company or the customer conducts."],
      ["Yes", "WT08 special process", "**No supplier audit role at all,** even though the CI is designated for audit. There is no CI configuration at their facility to audit."],
      ["No", "WT05 vendor item", "**Nothing.** No audit, and no audit role if there were one."]]),
    S("The item does not even have to be a CI.",
      "A supplier may build a part that is controlled inside a parent CI\u2019s documentation and is not a CI in its own right. Audits are audits of configuration items. If the procured item is not a CI, no audit deliverable can ever become due for it, at any work type. The rest of the flowdown still applies, because reconciliation, traceability, and variance control do not depend on CI status."),
    C("Why both errors cost money", [
      "Believing every CI is audited produces audit plans, data packages, and travel for CIs that were never designated for audit. It also devalues designation for audit, because if everything is audited then nothing was selected.",
      "Believing work type triggers the audit produces two failures at once. Audit obligations get priced into subcontracts where no CI will ever be designated for audit. And where designation for audit does arrive later on a supplier whose type has no audit role, somebody goes looking for an obligation that never existed.",
      "The honest position is narrower than either. Audits are rare, deliberate, and expensive, and that is the point of them."])
  ],
  check:{q:"A supplier designs and builds a unit under your source control drawing. The unit is a configuration item. The audit designation assessment recorded one risk factor and did not designate for audit it. What audit obligations belong in the statement of work?",
   o:[
     "Full functional and physical audit obligations, because WT02 suppliers conduct audits",
     "None, because the item is not designated for audit",
     "A standing conditional audit clause, with the audit deliverables cited as triggered items that become due only if designation for audit arrives",
     "Physical audit support only, since one risk factor was recorded"],
   a:2, why:"Designation for audit decides whether, and this item is not designated for audit, so no audit is due today. But one recorded risk factor means a second factor at any reassessment tips it into designation for audit. The clause goes in now, while the condition is dormant and the supplier has a reason to price it reasonably. Adding it after designation for audit arrives is a contract modification negotiated from the weakest position."}},
 {id:"M7-08", title:"What a supplier is actually agreeing to", body:[
    P("You put a standing conditional audit clause in a statement of work. One day the CI is designated for audit and the clause fires. This section is what happens next, from the supplier's side of the table."),
    P("Nothing in this list is negotiated on that day. All of it was bought at award or it was not bought at all."),
    STEPS([
      {h:"Access at their facility", b:"Unencumbered access to inspection, fabrication, production, assembly and test facilities. Where the CI is already installed in something, access extends to the installed CI and to the zone it sits in. Tools, inspection equipment and test software are available. **Access produces no submitted data, so it is cited with the access right and the verification method that evidences it, named explicitly.** Left implicit, it is a request, and a request can be declined."},
      {h:"A unit they do not select", b:"The audited unit is an early production-representative unit, **selected jointly by the Acquirer and your company.** The supplier does not offer one up. They also meet the entry criteria for whichever unit is chosen, which means they cannot solve the problem by nominating their best."},
      {h:"An audit plan submitted for agreement", b:"The supplier prepares an audit plan identifying their requirements and responsibilities. **It is submitted for agreement rather than issued for information.** From that point the preparation tracker is worked jointly. And the people who attend are competent to discuss the technical detail of the material presented, which is a real obligation and not a courtesy."},
      {h:"A unit closed out on all three conditions", b:"No open work orders. No open non-conformance records. **No open dispositions**, meaning every disposition has been carried out and verified. Any one of the three open is a stop condition and the audit is rescheduled. It is not run with the item carried as an action."}], "tl"),
    C("What the supplier can decline, and what they cannot", [
      "**They can decline anything that was not bought.** Access not cited with its verification method. A conduct obligation that was described rather than imposed. A deliverable with no SDRL behind it.",
      "**They cannot decline the substance.** Where an audit is tailored, the ceremony may be simplified. The requirements-to-test reconciliation and its traceability matrix, the as-built examination with approved-parts verification, the unit-difference certification, and the documented non-compliances are performed in full.",
      "**They cannot decline the sample rule.** Features implementing or protecting hazard risk controls are in every sample. That rule is not tailorable and no audit plan changes it.",
      "**They cannot decline the unit.** Joint selection is joint. Their agreement is to the process, not to a particular article."]),
    P("**What it costs them, stated plainly.** People off the line for the duration. Records retrieved and assembled in advance. A facility opened up. A build held in a state nobody is allowed to touch. Those costs are real, and a supplier who priced no audit obligation at award has priced none of them."),
    C("Which is why the clause goes in at award", [
      "At award, designation for audit is a possibility and the supplier prices a contingency.",
      "After designation for audit arrives, it is a certainty, they hold the work, and they know you need the access.",
      "**Same obligation, two completely different prices.** Nothing about the audit changed. The negotiating position did.",
      "This is the one thing in this course that is entirely within your control and entirely decided before anything goes wrong."], "amber"),
    S("Write the clause so a supplier can read it and know what they are agreeing to.",
      "A clause a supplier cannot price is a clause they will argue about later, and they will be right to.")
  ],
  check:{q:"A statement of work carries a standing conditional audit clause citing the audit plan, the data package and the minutes as triggered deliverables. It says nothing about access. The CI is designated for a physical audit and the unit sits at the supplier's plant. What is the position?",
   o:[
     "The clause covers it. Audit deliverables imply the audit happens, and the audit happens where the unit is",
     "The three deliverables are obligations. Access is not, because conduct and access obligations produce no submitted data and have to be cited with the access right and the verification method that evidences them",
     "Access is covered by the general right to audit a supplier's quality system",
     "The audit is moved to your facility instead"],
   a:1, why:"The three cited deliverables are bought and will be submitted. Access is a different kind of obligation. It produces nothing you receive, so citing a deliverable does not reach it, and it has to be written with the access right named and the verification method that evidences it. Without that it is a request. A general quality-system audit right is not the same right and usually does not reach a specific zone, a specific unit, or the tools and test equipment. And moving a physical audit away from the unit is not available, because the article is the point."}}
 ],
 exercises:[
 {id:"M7-E1", title:"Exercise 1: Audit designation over a program life",
  scen:"At award, a CI built by a source-controlled design-and-build supplier is not contractually designated for audit. It hosts no hazard risk control. The assessment finds one risk factor: the supplier is a new source. Eighteen months later a hazard log revision adds a risk control to the CI. Six months after that, the supplier introduces a new sub-tier for a critical component.",
  parts:[
   {id:"a", q:"What is the designation for audit outcome at award, and what is recorded?"},
   {id:"b", q:"What does the hazard log revision do: both to the designation for audit and to the question of who may decide it?"},
   {id:"c", q:"The new sub-tier arrives. Which two things does that single event set in motion?"},
   {id:"d", q:"What does the statement of work you wrote at award now allow you to do that a statement of work deciding audit applicability at award would not?"},
   {id:"e", q:"The audit is initiated internally rather than by the Acquirer. The supplier proposes to sample the as-built examination rather than perform it in full, and to skip the requirements-to-test reconciliation because their automated toolchain enforces it. Which proposal is acceptable, and why?"}
  ]},
 {id:"M7-E2", title:"Exercise 2: Reading a physical audit",
  scen:"A item designated for audit is built by a source-controlled design-and-build supplier, who conducts the physical audit at their own facility. The audited unit is agreed jointly. During the audit: the software build is attempted and fails, because the supplier upgraded their compiler eight months ago and the original version is gone; two drawings carry notes citing a superseded revision, which turns out to be because approved change notices are not reaching the release process; one installed connector is not on the approved parts selection list; and the audited unit carries a bracket in a different material from the unit used at the functional audit. The supplier proposes to certify the audit complete and successful, carrying all four as open action items.",
  parts:[
   {id:"a", q:"Classify each of the four findings, and say what makes each one what it is."},
   {id:"b", q:"The audited unit differs from the functional-audit unit. What has to happen before that difference is acceptable, and who is on the hook for it?"},
   {id:"c", q:"The build cannot be reproduced. What does that mean for the product baseline, and what earlier failure, in a different CM activity entirely, actually caused this?"},
   {id:"d", q:"Can the audit be certified complete and successful as the supplier proposes? Name the certification outcomes and the dispositions that are actually available here."},
   {id:"e", q:"What audit outputs do you expect to reach your company, and on what timing? What in the statement of work made them yours to expect?"},
   {id:"f", q:"Which of the four findings tells you something about the supplier\u2019s CM process rather than about this unit, and what would you do with that beyond the audit?"}
  ]},
 {id:"M7-E3", title:"Exercise 3: Audit roles across a supply chain",
  scen:"Four suppliers each hold work on a CI designated for audit or its components. A machine shop builds a housing to your released drawing. A supplier designs and builds a valve assembly under your source control drawing, including its embedded firmware. An engineering firm produced the technical data package for a structural fitting your company manufactures. A plating house anodizes parts to your process specification. The parent CI has just been designated for both a functional and a physical audit.",
  parts:[
   {id:"a", q:"State each supplier\u2019s audit role, and say what makes it that role rather than another."},
   {id:"b", q:"For the two suppliers who conduct audits, what deliverables become due and roughly when?"},
   {id:"c", q:"The firmware supplier proposes to demonstrate the build from an archived binary rather than rebuilding during the audit. How do you answer, and on what principle?"},
   {id:"d", q:"One supplier has no audit role at all. Does that mean nothing about them is verified? Explain what still applies and why."},
   {id:"e", q:"The valve supplier\u2019s audit is internally initiated rather than Acquirer-chaired. Name one thing that may be simplified and one that may not."},
   {id:"f", q:"Preparation begins six weeks out and two entry criteria are still open on the audit date. What is the correct handling, and what should have prevented the situation?"}
  ]},
 {id:"M7-E4", title:"Exercise 4: The day the clause fires",
  scen:"Eighteen months after award, a CI built by a source-controlled design-and-build supplier is designated for a physical audit. The designation follows a hazard log revision that added a risk control to the CI, plus a prior recorded risk factor for a new manufacturing source. The statement of work carries a standing conditional audit clause citing the audit plan, the data package and the minutes as triggered deliverables, and citing unencumbered access to inspection, fabrication, assembly and test areas, evidenced by an on-site verification at the audit. The supplier has four units built. Two have open rework against dispositioned non-conformance records. The supplier offers unit 3, which is clean, and proposes to issue its audit plan for your information thirty days before the audit.",
  parts:[
   {id:"a", q:"List what becomes due from this supplier now that the clause has fired, and say which of those items the clause actually bought."},
   {id:"b", q:"The supplier offers unit 3. What is your answer, and on what basis?"},
   {id:"c", q:"Two units have open rework against dispositioned non-conformance records. Explain why that matters, naming the closeout condition it fails, and say what happens if one of those units is selected."},
   {id:"d", q:"The supplier proposes to issue the audit plan for information. What is the correct status of that plan, and what follows from it?"},
   {id:"e", q:"The supplier asks for a contract modification to cover the cost of opening the facility. What is your position, and what would your position have been if the clause had not been in the statement of work?"},
   {id:"f", q:"The supplier proposes to sample the audit so as to exclude the features implementing the newly added risk control, on the grounds that those features are new and were inspected in full at first article. Answer them."}
  ]}
 ]
}
];

var STATE = { name:"", started:new Date().toISOString(), checks:{}, answers:{}, seen:{} };
var VIEW = { page:"start" };          // "start" | "s:<id>" | "x:<modId>" | "submit"
var PAGES = [];                        // flat ordered page list
var AUTOSAVE = false;

(function buildPages(){
  PAGES.push({k:"start", id:"START", nm:"Start here", grp:null});
  for(var i=0;i<MODULES.length;i++){
    var m=MODULES[i];
    for(var j=0;j<m.sections.length;j++){
      PAGES.push({k:"sect", id:m.sections[j].id, nm:m.sections[j].title, grp:m.id, mi:i, si:j});
    }
    PAGES.push({k:"ex", id:m.id+"-EX", nm:"Exercises", grp:m.id, mi:i});
  }
  PAGES.push({k:"submit", id:"RESULTS", nm:"Review and send", grp:null});
})();

/* ---- guarded browser storage: used only if the browser allows it ---- */
function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ window.localStorage.removeItem(k); return true; }catch(e){ return false; } }

/* ---- clear all: two-step arm so one stray click cannot wipe the record ---- */
var CLEAR_ARMED = false, clearT;
function clearLabel(){ return 'Clear<span class="lng"> all</span>'; }
function disarmClear(){
  CLEAR_ARMED = false;
  clearTimeout(clearT);
  var b = document.getElementById("btnClear");
  if(b){ b.innerHTML = clearLabel(); b.classList.remove("armed"); }
}
function armClear(){
  CLEAR_ARMED = true;
  var b = document.getElementById("btnClear");
  b.innerHTML = "Confirm clear";
  b.classList.add("armed");
  toast("This erases every answer and every check. Click Confirm clear to go ahead. The button resets itself in ten seconds.");
  clearTimeout(clearT);
  clearT = setTimeout(disarmClear, 10000);
}
function resetAll(){
  disarmClear();
  STATE = { name:"", started:new Date().toISOString(), checks:{}, answers:{}, seen:{} };
  VIEW  = { page:"start" };
  lsDel("cmtrain_state");
  var w = document.getElementById("who");
  if(w) w.value = "";
  draw();
  window.scrollTo({top:0,behavior:"auto"});
  var r = document.getElementById("rail");
  if(r) r.classList.remove("open");
  toast("Cleared. Answers, checks, and the trainee name are gone. You are back at the start.");
}
(function detect(){ AUTOSAVE = lsSet("cmtrain_probe","1"); })();

function autosave(){
  if(!AUTOSAVE) return;
  lsSet("cmtrain_state", JSON.stringify(STATE));
}
function autoload(){
  if(!AUTOSAVE) return false;
  var raw = lsGet("cmtrain_state");
  if(!raw) return false;
  try{ var o=JSON.parse(raw); if(o && o.checks){ STATE=o; return true; } }catch(e){}
  return false;
}

/* ==========================================================================
   RENDERING HELPERS
   ========================================================================== */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
}
function block(b){
  if(b.t==="p") return "<p>"+fmt(b.x)+"</p>";
  if(b.t==="list") return "<ul class='pl'>"+b.x.map(function(i){return "<li>"+fmt(i)+"</li>";}).join("")+"</ul>";
  if(b.t==="callout") return "<div class='callout "+(b.tone==="teal"?"teal":"")+"'>"+
      (b.lab?"<div class='lab'>"+esc(b.lab)+"</div>":"")+
      b.x.map(function(i){return "<p>"+fmt(i)+"</p>";}).join("")+"</div>";
  if(b.t==="stmt") return "<div class='stmt'><b>"+fmt(b.x)+"</b>"+(b.sub?"<span>"+fmt(b.sub)+"</span>":"")+"</div>";
  if(b.t==="cards") return "<div class='cards c"+b.cols+"'>"+b.x.map(function(c){
      return "<div class='card'><h4>"+fmt(c.h)+"</h4><p>"+fmt(c.b)+"</p></div>";}).join("")+"</div>";
  if(b.t==="steps") return "<div class='steps'>"+b.x.map(function(s,i){
      return "<div class='step "+(b.tone||"")+"'><div class='n'>"+(i+1)+"</div><div class='tx'><b>"+fmt(s.h)+"</b><span>"+fmt(s.b)+"</span></div></div>";}).join("")+"</div>";
  if(b.t==="table"){
    var th="<tr>"+b.head.map(function(h){return "<th>"+esc(h)+"</th>";}).join("")+"</tr>";
    var tb=b.x.map(function(r){
      return "<tr>"+r.map(function(c,ci){
        var k = (ci===0 && String(c).length<=10) ? " class='k'" : "";
        return "<td"+k+">"+fmt(c)+"</td>";}).join("")+"</tr>";}).join("");
    return "<div class='tw'><table><thead>"+th+"</thead><tbody>"+tb+"</tbody></table></div>";
  }
  return "";
}
function pageIndex(){
  for(var i=0;i<PAGES.length;i++){
    var p=PAGES[i];
    if(VIEW.page==="start"&&p.k==="start") return i;
    if(VIEW.page==="submit"&&p.k==="submit") return i;
    if(VIEW.page==="s:"+p.id) return i;
    if(VIEW.page==="x:"+p.grp&&p.k==="ex") return i;
  }
  return 0;
}
function pageKey(p){
  if(p.k==="start") return "start";
  if(p.k==="submit") return "submit";
  if(p.k==="ex") return "x:"+p.grp;
  return "s:"+p.id;
}

/* ---- completion status ---- */
function sectStatus(id){
  if(STATE.checks[id]) return "done";
  if(STATE.seen[id]) return "work";
  return "";
}
function exStatus(modId){
  var m = mod(modId), total=0, filled=0;
  m.exercises.forEach(function(x){ x.parts.forEach(function(p){
    total++; var v=STATE.answers[x.id+"."+p.id]; if(v&&v.trim().length>0) filled++;
  });});
  if(filled===0) return "";
  return filled===total ? "done" : "work";
}
function mod(id){ for(var i=0;i<MODULES.length;i++) if(MODULES[i].id===id) return MODULES[i]; return null; }

function counts(){
  var totalChecks=0, answered=0, right=0;
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    totalChecks++;
    var c=STATE.checks[s.id];
    if(c){ answered++; if(c.first===true) right++; }
  });});
  var totalParts=0, filledParts=0;
  MODULES.forEach(function(m){ m.exercises.forEach(function(x){ x.parts.forEach(function(p){
    totalParts++; var v=STATE.answers[x.id+"."+p.id]; if(v&&v.trim().length>0) filledParts++;
  });});});
  return {totalChecks:totalChecks, answered:answered, right:right, totalParts:totalParts, filledParts:filledParts};
}

/* ==========================================================================
   RAIL
   ========================================================================== */
function drawRail(){
  var c=counts();
  var h="<div class='railhead'><h2>Section register</h2><p>"+c.answered+" of "+c.totalChecks+
        " sections released \u00b7 "+c.filledParts+" of "+c.totalParts+" exercise answers written</p></div>";
  h+="<div class='grp'>"+navBtn(PAGES[0])+"</div>";
  MODULES.forEach(function(m){
    h+="<div class='grp'><h3>"+esc(m.label)+": "+esc(m.title)+"</h3>";
    PAGES.forEach(function(p){ if(p.grp===m.id) h+=navBtn(p); });
    h+="</div>";
  });
  h+="<div class='grp'>"+navBtn(PAGES[PAGES.length-1])+"</div>";
  document.getElementById("rail").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll("#rail .nav"), function(b){
    b.addEventListener("click", function(){ go(b.getAttribute("data-k")); });
  });
}
function navBtn(p){
  var st = p.k==="sect" ? sectStatus(p.id) : (p.k==="ex" ? exStatus(p.grp) : "");
  var cur = pageKey(p)===VIEW.page;
  return "<button class='nav' data-k='"+pageKey(p)+"' aria-current='"+(cur?"true":"false")+"'>"+
    "<span class='dot "+st+"'></span><span class='id'>"+esc(p.id)+"</span><span class='nm'>"+esc(p.nm)+"</span></button>";
}

/* ==========================================================================
   PAGE RENDERERS
   ========================================================================== */
function go(key){
  VIEW.page=key;
  var p=PAGES[pageIndex()];
  if(p.k==="sect") STATE.seen[p.id]=true;
  autosave(); draw();
  window.scrollTo({top:0,behavior:"auto"});
  document.getElementById("rail").classList.remove("open");
}
function draw(){
  drawRail();
  var i=pageIndex(), p=PAGES[i], st=document.getElementById("stage");
  if(p.k==="start") st.innerHTML=viewStart();
  else if(p.k==="submit") st.innerHTML=viewSubmit();
  else if(p.k==="ex") st.innerHTML=viewExercises(mod(p.grp));
  else st.innerHTML=viewSection(MODULES[p.mi], MODULES[p.mi].sections[p.si], p);
  st.className="stage fadein";
  st.innerHTML += pager(i);
  wire(i,p);
}
function pager(i){
  var prev=i>0?PAGES[i-1]:null, next=i<PAGES.length-1?PAGES[i+1]:null;
  return "<div class='pager'>"+
   (prev?"<button class='btn gh' data-nav='"+pageKey(prev)+"'>\u2190 "+esc(prev.nm)+"</button>":"<span></span>")+
   (next?"<button class='btn pri' data-nav='"+pageKey(next)+"'>"+esc(next.nm)+" \u2192</button>":"<span></span>")+
   "</div>";
}

function viewSection(m,s,p){
  var idx=m.sections.indexOf(s)+1;
  var st=sectStatus(s.id);
  var stl = st==="done" ? "Released" : (st==="work" ? "In work" : "Not started");
  var h="<div class='eyebrow'><span class='recid'>"+esc(s.id)+"</span>"+
        "<span class='status'>"+esc(m.label)+" \u00b7 section "+idx+" of "+m.sections.length+" \u00b7 "+stl+"</span></div>"+
        "<h1 class='sect'>"+esc(s.title)+"</h1><div class='hr'></div>";
  s.body.forEach(function(b){ h+=block(b); });
  h+=checkHtml(s);
  return h;
}
function checkHtml(s){
  var rec=STATE.checks[s.id];
  var locked=!!rec;
  var h="<div class='check' data-check='"+esc(s.id)+"'><div class='lab'>Check yourself</div><div class='q'>"+fmt(s.check.q)+"</div>";
  s.check.o.forEach(function(o,i){
    var cls="opt"+(locked?" locked":"");
    if(locked){
      if(i===s.check.a) cls+=" right";
      else if(rec.picks && rec.picks.indexOf(i)>=0) cls+=" wrong";
    }
    h+="<label class='"+cls+"'><input type='radio' name='ck_"+esc(s.id)+"' value='"+i+"'"+
       (locked?" disabled":"")+(rec&&rec.picks&&rec.picks.indexOf(i)>=0?" checked":"")+"> <span>"+fmt(o)+"</span></label>";
  });
  h+="<div class='btnrow' style='margin-top:12px;margin-bottom:0'>"+
     (locked?"":"<button class='btn pri' data-ckgo='"+esc(s.id)+"'>Check answer</button>")+"</div>";
  var fb="";
  if(locked){
    var ok = rec.first===true;
    fb="<div class='fb show "+(ok?"ok":"no")+"'><b>"+(ok?"Correct":"Not quite")+"</b>"+fmt(s.check.why)+"</div>";
  }else{
    fb="<div class='fb' data-fb='"+esc(s.id)+"'></div>";
  }
  return h+fb+"</div>";
}

function viewExercises(m){
  var h="<div class='eyebrow'><span class='recid'>"+esc(m.id)+"-EX</span><span class='status'>"+esc(m.label)+" \u00b7 written exercises</span></div>"+
    "<h1 class='sect'>Exercises: "+esc(m.title)+"</h1><div class='hr'></div>"+
    "<p>Write your reasoning, not just your conclusion: the reasoning is what is being assessed, and several of these have more than one defensible answer. Where a question turns on a fact you have not been given, <strong>say so, and say what you would ask for and whom you would ask.</strong> Recognizing the missing fact is part of the exercise.</p>"+
    "<p class='note'>Answers save as you type. There is no word limit and no right length.</p>";
  m.exercises.forEach(function(x){
    h+="<div class='exwrap'><h4>"+esc(x.title)+"</h4><div class='scen'>"+fmt(x.scen)+"</div>";
    x.parts.forEach(function(pt){
      var key=x.id+"."+pt.id, v=STATE.answers[key]||"";
      h+="<div class='part'><label for='ta_"+esc(key)+"'>"+esc(pt.id)+".&nbsp; "+fmt(pt.q)+"</label>"+
         "<textarea id='ta_"+esc(key)+"' data-ans='"+esc(key)+"' rows='4' placeholder='Your answer'>"+esc(v)+"</textarea>"+
         "<div class='count' data-cnt='"+esc(key)+"'>"+wordCount(v)+"</div></div>";
    });
    h+="</div>";
  });
  return h;
}
function wordCount(v){
  var n=(v||"").trim(); n = n? n.split(/\s+/).length : 0;
  return n===0 ? "not started" : (n+" word"+(n===1?"":"s"));
}

function viewSubmit(){
  var c=counts();
  var pct = c.totalChecks ? Math.round(100*c.right/c.totalChecks) : 0;
  var gaps=[];
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    var r=STATE.checks[s.id];
    if(!r) gaps.push([s.id, s.title, "not attempted"]);
    else if(r.first!==true) gaps.push([s.id, s.title, "wrong on first attempt"]);
  });});
  var missing=[];
  MODULES.forEach(function(m){ m.exercises.forEach(function(x){ x.parts.forEach(function(pt){
