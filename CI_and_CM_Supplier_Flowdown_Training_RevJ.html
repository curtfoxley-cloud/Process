    P("A CI structure is not a ratchet. Three mid-life changes have mechanics worth knowing before you meet one, because each touches identifiers, boundaries and records at the same time."),
    S("The same-CI decision detects all three at node C1.",
      "That is what the current-designation question is for. A separate-CIs verdict against items not yet designated is a first designation. The same verdict against one existing CI is a split. The same verdict where the items are already separate confirms what you have. Run C1 first and the assessment tells you which of the three you are in."),
    CARDS([
      {h:"De-designation", b:"An item stops being separately managed. For an Acquirer-controlled CI the designation was theirs, so the de-designation is theirs too: proposed, submitted and concurred like any other selection change. The item does not become uncontrolled: it returns to control within its parent CI\u2019s documentation, and **the parent has to be named.** The index row is retained with the status changed, never deleted."},
      {h:"Split", b:"One CI becomes two or more. CI identifiers change, because the management need changed. Part numbers do not move unless the split created a non-interchangeable condition, and unit identifiers never move at all. Every pairwise boundary between the new siblings appears in the interface register or carries a signed no-interface determination, and each new CI needs its own documentation determination, effectivity address and baseline management."},
      {h:"Consolidation", b:"Several CIs become one. The part-number variants come with it, and the variant mapping is recorded against the surviving CI. Boundaries that used to be interfaces between the old CIs become internal to the new one: those register rows are dispositioned, with the reason recorded, rather than quietly abandoned."}]),
    S("Identifiers move for management reasons. Part numbers move for interchangeability reasons. Unit identifiers never move at all.",
      "Three restructurings, one rule, and it is the same rule you met in the very first identifier section. Everything here is that principle applied while the program is running."),
    S("Apply the product unit record-structure test again after any of the three.",
      "The product unit record structure follows the test, not the CI structure. **A split does not create a serialization obligation. A consolidation does not remove one.** Run the product unit record-structure test against the surviving CIs and their component parts, and record the result with the rest of the assessment."),
    P("All three are selection changes, and they are treated as such. Each one is assessed against the criteria with the rationale recorded, submitted for Acquirer concurrence where the CIs are Acquirer-controlled, recorded in status accounting, and followed by a fresh interface coverage check."),
    P("None of the three is a records-tidying exercise that CM performs alone."),
    C("Why the retained row matters more than it looks", [
      "Every change, every status entry, every audit result and every delivered unit\u2019s record made while the item was a CI still references that identifier. Delete the row and all of them point at nothing.",
      "**The index answers two different questions:** what is a CI today, and what was a CI when this record was written. A status field answers both. A deletion answers only the first, and silently corrupts the second."])
  ],
  check:{q:"A program proposes to de-designate an Acquirer-controlled CI that no longer warrants separate management. Who decides, and what happens to the item?",
   o:[
     "CM decides, records the rationale, and the item is controlled by its own drawings thereafter",
     "The program decides; the Acquirer is notified at the next review",
     "The Acquirer decides, since the designation was theirs, and the item returns to control within its parent CI\u2019s documentation, with the parent named and the index row retained",
     "The item cannot be de-designated once a baseline has been established against it"],
   a:2, why:"Designation authority for Acquirer-controlled CIs rests with the Acquirer, and so does the authority to remove it: the proposal is submitted and concurred like any other selection change. And de-designation moves an item to a different level of control rather than out of control: the parent whose documentation now governs it must be identified, exactly as it would be for a candidate rejected at the end-use gate."}},
 {id:"M3-18", title:"Who to ask", body:[
    P("The who-does-what sections run from a function to its duties. This one runs the other way, because that is the direction a question actually arrives in. You have a question. You do not know whose desk it belongs on."),
    TABLE(["The question you have", "Who answers it"], [
      ["Is this a CI, and at what level?", "Systems Engineering, with the Responsible Engineer. CM records the answer and owns the screen"],
      ["Which requirements is this CI accountable for?", "Systems Engineering, from the requirements allocation matrix"],
      ["Who holds design authority for this CI?", "Systems Engineering and the Responsible Engineer. Not procurement, and not CM"],
      ["Is this requirement mandatory for safety?", "System Safety, against the safety management system"],
      ["Does this failure consequence sit in the top two severity bands?", "System Safety, from the hazard log. Use the pre-anchored severity where one is recorded"],
      ["What are the failure modes and the criticality for this CI?", "RM&SH, from the FMECA"],
      ["Which hardware implements this hazard control?", "System Safety names the control. Systems Engineering names the hardware"],
      ["Is this CI designated for audit?", "Configuration Management, from the audit designation assessment"],
      ["What is this supplier's work type, and what is their audit role?", "You, from the classification. CM signs it. The flowdown process defines the roles"],
      ["Did we buy the right to audit at their facility?", "Supplier Requirements Engineering. Access is bought in the statement of work or it is a request"],
      ["Is this supplier's CM effective?", "CM holds the evidence. The determining authority named in the CM plan decides"],
      ["What is the as-built configuration of this unit?", "CM status accounting, from the reconciliation report"],
      ["Who assigned this safety-critical or life-limited part designation?", "One of three cases, and the statement of work names which. Establish it before writing anything against anyone"],
      ["What does this drawing note mean?", "Design Engineering, or the Responsible Engineer for the CI"],
      ["Can we ship with this open?", "Quality, and the approving authority for the disposition"]]),
    C("Two answers that are almost always wrong", [
      "**Ask CM.** CM records most of these answers and owns few of them. Asking CM to decide design authority, or criticality, or whether a requirement is mandatory for safety, produces a recorded answer with no authority behind it. It will hold until the first time somebody tests it.",
      "**Ask whoever is in the room.** An answer given in a meeting and never written down is not an answer. It is a thing somebody will remember differently in a year, usually at an audit."]),
    P("**Two habits make the table work.** Ask the owner rather than the nearest person. And write the answer where the next person will look for it, which is the assessment record, the register, or the classification log."),
    S("Most delays on this work are not technical. They are a question sitting on the wrong desk.",
      "Getting it to the right one on the first try is worth more than any other habit in this course.")
  ],
  check:{q:"A supplier proposes that a bracket inside their assembly does not need serial traceability. Your CM lead thinks that sounds right. Who settles it?",
   o:[
     "Configuration Management, since CM owns the traceability requirement",
     "The parts list settles it. It states the traceability requirement for each line, and the Responsible Engineer confirms which revision governs at this effectivity",
     "Quality Assurance, from the inspection records",
     "The supplier, since they hold the build records"],
   a:1, why:"The question is what the design required, and the design states the traceability requirement on the parts list, usually as a note or a coded column. So it is settled by reading the governing revision, with the Responsible Engineer confirming which revision governs. CM records the requirement and does not set it, which is exactly the ask-CM error. Inspection records and build records tell you what happened, which is the other side of the comparison and not the requirement."}}
 ],
 exercises:[
 {id:"M3-E1", title:"Exercise 1: Building a structure from scratch",
  scen:"A new program will deliver a podded surveillance radar carried on a transport aircraft. It comprises: an antenna assembly with a positioner; a transmitter unit; a receiver and signal processing unit running two software applications, the signal processing chain and an operator display, on separate processors; a power conditioning unit bought as a catalog item to a vendor\u2019s part number; a liquid cooling unit procured to your source control drawing from one qualified vendor with an eleven-month lead time; interconnecting cable assemblies; and the pod structure with its radome. Hazard analysis identifies the pod attachment fittings as safety-critical: failure could release the pod in flight. The system interfaces to the aircraft mission computer and to aircraft power. The contract line items are the radar system and a separate spares package. No architecture model exists yet.",
  parts:[
   {id:"a", q:"Produce the candidate list. Say who you would expect to have nominated each candidate, and name anything you are including only because it must be screened rather than because you expect to designate it as a CI."},
   {id:"b", q:"Screen each candidate: gate result, and every criterion met with a one-line rationale. State your verdict for each, including the ones you reject and where they are controlled instead."},
   {id:"c", q:"Lay out the structure: levels, parents, and which CIs you would expect to be Acquirer-controlled. Say what basis you used for the decomposition, given that no model exists."},
   {id:"d", q:"How do you handle the two software applications, one software CI or two? Give the questions you asked, not just the answer."},
   {id:"e", q:"List every boundary that must appear in the interface register. Include the external ones."},
   {id:"f", q:"Which of your verdicts would you expect to be challenged at Acquirer review, and what would you have ready?"},
   {id:"g", q:"Six months later the cooling skid vendor is replaced with a second qualified source and the shelter is redesigned to be non-transportable. What do you re-open?"}
  ]},
 {id:"M3-E2", title:"Exercise 2: Same CI or separate?",
  scen:"Three relays carry different part numbers. Same end-use function, same sub-subsystem, same vendor, same maintenance requirements. None is safety-critical. Interfaces are \u201cslightly different.\u201d Verification requirements are not yet established. The program uses a model-based architecture.",
  parts:[
   {id:"a", q:"Walk the nodes in order, C1 through the model check, and state the outcome at each. Say which path you are on and why."},
   {id:"b", q:"Identify the trigger at which the decision actually turns, name it by its label, and say what you would need before deciding."},
   {id:"c", q:"The relays all appear on one interface control document. Does that settle the interface question? Explain."},
   {id:"d", q:"Assume you conclude \u201cone CI, three part-number variants.\u201d List everything that must now be recorded, and where."}
  ]},
 {id:"M3-E3", title:"Exercise 3: One part number, two places",
  scen:"A cooling fan assembly, one part number, is installed inside the mission computer (processor temperature) and inside the environmental control unit (cabin air recirculation). The installations are on different branches of the CI hierarchy, maintenance is planned separately, and a bearing-life change would be cut in on different schedules.",
  parts:[
   {id:"a", q:"One CI or two? Which path are you on, and which triggers drive your answer?"},
   {id:"b", q:"How many PINs are involved? Does your answer to the CI question change that?"},
   {id:"c", q:"If the fan in the mission computer is later classified safety-critical and the other is not, what changes? Name the trigger."},
   {id:"d", q:"Before you record a two-CIs-one-PIN verdict, what has to be confirmed, and with whom? Say what goes wrong later if nobody confirms it."}
  ]},
 {id:"M3-E4", title:"Exercise 4: Interface register coverage",
  scen:"A CI has just been split into two sibling CIs. Before the split, the parent had documented interfaces to three external systems and to two sibling CIs.",
  parts:[
   {id:"a", q:"List every boundary that must now appear in the interface register."},
   {id:"b", q:"One new sibling has no connection to one of the external systems. What goes in the register for that boundary, and who signs it?"},
   {id:"c", q:"At what three points is coverage verified?"}
  ]},
 {id:"M3-E5", title:"Exercise 5: Reading an index and a register",
  scen:"You are handed the identification records for a subsystem you have never seen. The index shows: a level-2 subsystem CI, Acquirer-controlled, safety-critical flag set with a hazard reference, product baseline planned; beneath it three level-3 CIs, two Supplier-controlled and one Acquirer-controlled; one of the three is a software CI with no allocated baseline date recorded; one carries three part-number variants on the variant sheet; and one row is marked de-designated with its status changed but its baseline dates still populated. The register carries five boundary rows for these CIs, one of which is a signed no-interface determination, and two of which cite the same interface control document with different variant applicability.",
  parts:[
   {id:"a", q:"How many CIs are actively designated here, and how do you know without counting rows?"},
   {id:"b", q:"The software CI has no allocated baseline date. Name two different things that could mean, and say what you would look at to tell them apart."},
   {id:"c", q:"Two register rows cite the same interface control document. Is that an error? Explain what the register is keyed to and why that answers the question."},
   {id:"d", q:"The de-designated row still shows baseline dates. Should those be cleared? Why or why not?"},
   {id:"e", q:"Is the register\u2019s coverage complete for these four CIs? State how you would check, and what number of boundary rows you would expect to find."},
   {id:"f", q:"The parent CI is flagged safety-critical but one child is not. What would you want to confirm about that, and with whom?"}
  ]},
 {id:"M3-E6", title:"Exercise 6: Reading a situation",
  scen:"You join a program at preliminary design review. You find: a CI index with 340 entries, most at bracket and connector level; no candidate list; an interface register with 61 rows, 22 blank in the \u201cdefining documentation\u201d column; and a model that decomposes the system by ATA chapter while the CI index is organized by the contract work breakdown structure.",
  parts:[
   {id:"a", q:"Name each problem you see and say what it will cost if left alone."},
   {id:"b", q:"Which one would you address first, and why?"},
   {id:"c", q:"Which of these can CM fix alone, and which need another function to act?"}
  ]}
 ]
},
{
 id:"M4", label:"Module 4", title:"Classifying the procurement", sub:"Reading a statement of work, the nine work types, and the recorded classification everything downstream depends on",
 sections:[
 {id:"M4-01", title:"Why flowdown exists", body:[
    P("Performing configuration management includes responsibility for the CM performance of the sub-suppliers. The governing obligation: **flow to sub-suppliers the same CM requirements imposed on the company, or suitable tailorings of them.**"),
    P("Two words do most of the work. *Same* sets the default: the starting point is everything, not nothing. *Suitable* permits reduction, but suitability has to be established and recorded."),
    S("A barrier that exists at this tier and not at the tier that performs the work is not a barrier.",
      "If your company controls change and records as-built configuration, but the supplier who actually builds the item does neither, the control does not exist where the risk is. The paperwork is at one address and the hazard is at another."),
    CARDS([
      {h:"Not a sixth CM function", b:"The requirements flowed are identification, change, status accounting and audit requirements: the same four you already know. This process governs how they are selected, imposed and verified at the supplier tier."},
      {h:"Every tier, every procurement", b:"Design, build, software or firmware development, repair or overhaul, special processes, or catalog items incorporated into the product. A supplier with sub-tiers of its own flows the same obligation downward."},
      {h:"These requirements flow too", b:"Requirements mandatory for safety flow to every tier. A supplier-tier proposal to tailor or omit one is dispositioned through the safety disposition gate and recorded: performed, replaced by a documented equivalent control, or risk-accepted at the named authority. Never silently dropped."}])
  ],
  check:{q:"What is the default position when deciding what CM requirements to flow to a sub-supplier?",
   o:[
     "Flow the minimum the contract explicitly requires",
     "Flow everything imposed on the company, then reduce only where suitability is established and recorded",
     "Flow whatever the supplier\u2019s quality system already covers",
     "Flow requirements proportionate to the value of the purchase order"],
   a:1, why:"\u201cSame requirements, or suitable tailorings\u201d sets the default at everything. Reduction is permitted but must be earned: suitability has to be established and recorded, never assumed."}},
 {id:"M4-02", title:"Two questions drive everything", body:[
    CARDS([
      {h:"1. Who holds design authority?", b:"The company, the supplier, the vendor, or split, with the company controlling form, fit, function, interface and qualification while the supplier owns the internals. This determines whether the supplier can change anything, which decides whether change control applies."},
      {h:"2. Who performs the build?", b:"The company, the supplier, or nobody: a process-only service. This determines whether there is an as-built configuration to reconcile, which decides whether the whole traceability and reconciliation apparatus applies."}], 2),
    P("Item type, whether hardware, software, commercial item or service, is a modifier on the answer rather than a third question."),
    S("Every other requirement in the matrix follows from those two facts.",
      "Which is why classification is performed before derivation, and why a procurement whose classification cannot be determined is not released until it can.")
  ],
  check:{q:"Why are design authority and who-performs-the-build the two questions that drive classification?",
   o:[
     "Because they are the two facts most reliably stated in a purchase order",
     "Because they determine price and schedule risk",
     "Because they determine whether change control applies and whether there is an as-built configuration to reconcile",
     "Because the Acquirer requires both to be recorded"],
   a:2, why:"They determine what can go wrong. Design authority decides whether the supplier can change anything. Who builds decides whether there is an as-built to reconcile against released design."}},
 {id:"M4-03", title:"The words you will meet in this module", body:[
    P("This module and the three that follow use a working vocabulary that will be unfamiliar if you have not written a subcontract before. None of it is difficult. All of it is used precisely, and a word used loosely here is how requirements go missing."),
    TABLE(["Term", "What it means here"], [
      ["Statement of work", "The document that tells a supplier what to do. CM requirements reach a supplier through it, or they do not reach the supplier at all. Often abbreviated SOW, and when it is a subcontract to a supplier you may see SSOW."],
      ["Flowdown", "Passing a requirement from your company down to a supplier. A requirement that exists at your tier and not at the tier doing the work is not protecting anything."],
      ["Work type", "One of nine categories describing what kind of work a supplier performs for you. It is decided by two questions and it determines what you impose."],
      ["Classification", "The recorded decision that a given procurement is one or more work types. It is written on the classification log, with a name and a date."],
      ["Requirement matrix", "The workbook that maps each work type to the requirements it receives. You read down the column for your work type."],
      ["Supplier data deliverable (SDRL)", "A defined data item the supplier submits: content, frequency or trigger, and submittal terms. Identified by SDRL number in the matrix workbook. Every requirement is cited with one, unless it is a conduct or access obligation."],
      ["Procured item", "The hardware or software article your company accepts as a separate line on the acceptance record. Ask what the company signs for. Each answer is one procured item. A part the supplier installed into an assembly before shipping is **embodied**, and it is content of that assembly. The same part shipped loose is a procured item on its own. **A procured item is not a supplier data deliverable, and the word deliverable alone does not distinguish them.**"],
      ["Design authority", "The authority to establish and change the technical definition of an item. It can be split. Under a source control drawing the supplier holds it for the internals and your company holds it for form, fit, function, interface, and qualification."],
      ["Source control drawing", "Your company controls form, fit, function, interface, qualification, and the approved sources. The vendor designs the internals. Work type WT02."],
      ["Vendor item control drawing", "Your company identifies and selects the item. The vendor designs and owns it. You control which one you buy, and nothing about how it is built. Work type WT05."],
      ["Vendor", "The party that holds the design of a vendor item. **Not necessarily the party you contract with.** A distributor, broker, or reseller classifies WT05 and holds no design, which matters the moment you need a change notice."],
      ["Company-provisioned materiel", "Materiel your company selects, buys, or furnishes, which the supplier receives and installs rather than procures. It carries its own requirement, and it can appear on a procurement whose work type does not expect it."],
      ["Escape", "A configuration departure that reached delivery without the required approval or record. Escapes accrue as evidence, and a safety-relevant escape is a determination trigger on its own."],
      ["Tailoring", "Imposing a requirement in modified form. Tailoring is legitimate and is recorded. Silently dropping a requirement is not tailoring, it is omission."],
      ["Conditional requirement", "A requirement that applies only if a stated condition is true, such as the presence of embedded software. You resolve it before citation and record the basis."],
      ["As-built", "What was actually manufactured and installed in a specific unit. It is compared against the released design, and the comparison is the reconciliation."],
      ["Reconciliation", "Comparing as-built against released design and dispositioning every difference. It runs continuously at scale, and audits sample it."],
      ["Delta", "A difference the reconciliation finds. Every delta is dispositioned, meaning somebody decides what happens about it."],
      ["Variance", "Approval to accept a departure from the released design, requested before delivery. Also called a deviation or waiver depending on timing and local convention."],
      ["Nonconformance", "A condition that does not meet the released design. It is recorded, dispositioned by the required authority, and the disposition is then carried out and verified."],
      ["Effectivity", "The point at which a change takes effect, usually stated as a unit or line number. It answers the question: starting with which one?"],
      ["Unit identifier", "The number that identifies one physical item. It is a serial number where the item is tracked individually, or a lot or batch number where a whole lot is accepted together."],
      ["Traceability record", "The record that ties each delivered item to its part number, its unit identifier, its designations, and the assembly above it."],
      ["Designation", "This word carries four meanings, so it never stands alone. Say which one every time. Designated **as a CI** means the procured item is managed as a configuration item. Designated **for audit** means the item will receive a formal configuration audit. A **part attribute designation** means a part carries a safety-critical, life-limited or special handling attribute. An **external criticality designation** is a label that arrives from a customer, a regulator or a certification basis, such as a critical safety item or an engine life-limited part. All four are separate decisions, made by different people against different tests, and an item can carry the last two while being neither of the first two"],
      ["Accrual", "Logging evidence as it arrives rather than collecting it when somebody asks. Evidence gathered after the question is asked is a reconstruction."],
      ["Determination", "The recorded judgment of whether a supplier CM process is effective. It is made against the requirements you actually imposed on that supplier."],
      ["Sub-tier", "A supplier of your supplier. Requirements flow to them too, through your supplier, which is what recursion means."]]),
    C("Three words to be careful with", [
      "**Deliverable.** This word names two different things and the course uses it for both. A **procured item** is the article the supplier delivers and your company accepts. A **supplier data deliverable**, or SDRL, is data the supplier submits. Say which one you mean every time. A statement of work that says every deliverable requires a reconciliation report has said something false about one of them.",
      "**Severity.** Two scales use this word and they are not the same one. **Barrier severity** is the band a floor requirement sits in, catastrophic or severe. It is pre-anchored and a program cannot re-rate it. **Hazard severity** is the category the safety analysis assigns to a specific hazard, catastrophic through negligible. Say which one you mean. And neither of them tells you what product unit record an item needs.",
      "**Designated.** Always say which kind, because there are four. Being a CI, being audited, carrying a part attribute, and carrying an external criticality label are separate decisions, made by different screens, at different times. A part inside a procured vendor item can be life-limited and serialized without ever being a CI, and that is ordinary rather than an anomaly.",
      "**Life limited.** This means two different things. An item limited by flight cycles or operating hours is tracked per unit. An item limited by shelf life or cure date is tracked by lot with a date code. The phrase is identical and the product unit record structure is opposite. This is the two-clocks rule from M1-08 in Module 1. The product unit record-structure test there governs here too."])
  ],
  check:{q:"A supplier asks whether they may deliver a part that departs slightly from the drawing. The departure is acceptable to engineering. What is the correct instrument, and when?",
   o:[
     "A nonconformance record raised after delivery",
     "A variance request, submitted before the affected unit is delivered",
     "A change proposal, submitted after the lot ships",
     "No instrument is needed if engineering agrees"],
   a:1, why:"A variance is approval to accept a departure, and it is requested before delivery. Engineering agreeing verbally is not an approval anybody can find later. If the same departure keeps recurring and is permanently acceptable, it stops being a variance and becomes a change proposal."}},
 {id:"M4-04", title:"How to read a statement of work", body:[
    P("This course teaches you to write the CM content of a statement of work. Reading one is the prerequisite, and nothing teaches it. So read one here first."),
    P("A statement of work tells a supplier what to do. It is authored by Supplier Requirements Engineering. CM writes the CM requirements and identifies the data deliverables, and hands both over for incorporation. **CM does not decide how the statement of work is arranged.**"),
    TABLE(["Part of the document", "What it does", "What to watch for"], [
      ["Scope", "Names the work and the articles", "The procured items. Count them. Each one your company accepts on a line is one procured item"],
      ["Applicable documents", "Lists specifications and standards invoked", "A document listed here with no requirement citing it obliges nothing"],
      ["Requirements sections", "The obligations themselves", "Where CM content sits, usually in its own section and sometimes scattered"],
      ["Data requirements", "The deliverables, by SDRL number", "Content, frequency or triggering event, and submittal terms. A requirement with no deliverable produces nothing you can ask for"],
      ["Special provisions", "Access rights, facility clauses, government property", "Conduct and access obligations live here, and they produce no submitted data"]]),
    C("How to tell an obligation from a description", [
      "**The supplier shall submit a reconciliation report per lot.** An obligation. There is an actor, a verb, and a thing.",
      "**The reconciliation report compares as-built against released design.** A description. It tells the supplier what the report is. It does not tell them to produce one.",
      "Both sentences are useful and only one is enforceable. A CM section made entirely of the second kind reads well and buys nothing.",
      "**Test every CM sentence by asking who does what, and by when.** If you cannot name all three, it is background."]),
    C("Where applicability has to live", [
      "**Applicability is written into the text of each CM requirement, not carried by a heading.**",
      "Where a statement of work covers more than one procured item, the procured item is named inside the requirement.",
      "A requirement whose applicability lives in a section heading loses that applicability the moment the heading moves, and headings move during negotiation.",
      "This is a real failure, not a stylistic preference. It is how a requirement written for one procured item ends up applying to everything, or to nothing."]),
    P("**A data deliverable is cited, not described.** Each cited requirement identifies its supplier data deliverable by reference to the SDRL definition. The SDRL definition carries the content, the frequency or triggering event, and the submittal terms. Cite it, and the definition does the rest."),
    P("**Conduct and access obligations are the exception, and they are the ones people get wrong.** They produce no submitted data, so there is no SDRL to cite. They are cited with the access right and with the verification method that evidences it, both named explicitly. Left implicit, they are requests rather than obligations, and a supplier can decline a request."),
    C("How a conditional clause reads", [
      "A conditional requirement applies only if a stated condition is true.",
      "**Software CM requirements** are conditional on deliverable software or embedded code being present.",
      "**Process-change notification** is conditional on critical or special processes being identified.",
      "**Audit obligations** are conditional on the procured item being or becoming designated for audit. That one is the standing conditional audit clause, and Module 5 covers its mechanics.",
      "Every conditional is resolved against its stated condition before the requirement is provided, and the basis is recorded. **CM does not leave a condition for the supplier to interpret.**"], "amber"),
    S("Read the whole CM section and ask one question. What can I actually ask this supplier for on Monday?",
      "The answer is the set of obligations with an actor, a deliverable or an access right, and a date. Everything else is context.")
  ],
  check:{q:"A CM section reads: \"Configuration audits verify that the as-built configuration conforms to the product configuration documentation. The Supplier's facility shall be made available as required.\" The procured item is not designated for audit at award. What did this buy?",
   o:[
     "Full audit conduct and access obligations, triggered when designation for audit arrives",
     "Very little. The first sentence is a description with no actor. The second names no access right, no verification method, and no triggering condition, so it is closer to a request than an obligation",
     "Nothing at all, because the procured item is not designated for audit",
     "Access only, which is the part that matters"],
   a:1, why:"The first sentence describes what an audit is and obliges nobody. The second has an actor and a verb, but as required names no condition, and it names neither the specific access right nor the verification method that evidences it. Conduct and access obligations produce no submitted data, so they have to be written explicitly or they do not exist. Not being designated for audit at award is not the problem here, and it is exactly the case the standing conditional clause is written for."}},
 {id:"M4-05", title:"The nine work types", body:[
    P("Every procurement is classified into one or more of nine work types. The type is decided by two questions. Who holds design authority for the item? Who performs the build? Each type carries its own identifier, WT01 through WT09, and those identifiers are used on the classification log and in the statement of work."),
    TABLE(["ID", "Work type", "What it is", "Design authority", "Build by"], [
      ["WT01", "Build-to-print", "The company designs the item. The supplier manufactures it to the released technical data package.", "Company", "Supplier"],
      ["WT02", "Source-controlled design and build", "The supplier designs the internals under a company source control drawing. The company fixes the outside of the item and the qualification.", "Supplier for internals. Company for form, fit, function, interface, and qualification.", "Supplier"],
      ["WT03", "Design agent", "The supplier develops the design. The company performs the build. The technical data package is the deliverable.", "Supplier develops. Company owns.", "Company"],
      ["WT04", "Full CI design and build to company specification", "The supplier designs the CI against a company specification and also manufactures it. This is the heaviest flowdown in the taxonomy.", "Supplier, at CI level", "Supplier"],
      ["WT05", "Vendor item, commercial or catalog item", "An item of the vendor own design, selected as offered. The company controls selection through a vendor item control drawing. It does not control the item.", "Vendor", "Vendor"],
      ["WT06", "Software or firmware development", "Development of deliverable software or embedded code. It is usually combined with another type rather than standing alone.", "Supplier, per specification", "Supplier"],
      ["WT07", "Repair and overhaul", "As-maintained records, retrofit incorporation, and retention of unit identifiers and life through part-number changes.", "Company. Supplier where delegated.", "Supplier"],
      ["WT08", "Special process services", "Process work only, with no item design. Flowdown is process specification control and change notification.", "Company, through the process specification", "Not applicable"],
      ["WT09", "Installation build to company-provisioned materiel", "The supplier assembles a complete end item by executing installation work orders. The materiel is provided by the company rather than bought by the supplier.", "Company", "Supplier, for installation and integration"]]),
    C("Two names that changed, and why it matters", [
      "WT04 used to be called full CI development. That name never said the supplier builds the item. The type it is most easily confused with is WT03, the design agent, where the supplier develops a design and does not build. The two most confusable types were using the same word for the thing that separates them.",
      "WT05 used to be called catalog item. That name never mentioned vendor items. A vendor-item-controlled procurement is the case people most often fail to classify, and the usual mistake is filing it as WT02. That mistake imposes a design-authority requirement set on a supplier that holds no design authority."]),
    P("Typical examples. Machined parts to released drawings are WT01. Source-controlled valves, actuators, and power supplies are WT02. Design houses producing drawings and models are WT03. Major subsystem development subcontracts are WT04. Catalog connectors and commercial computing are WT05. Operational flight program subcontracts and embedded firmware are WT06. Depot and OEM repair stations are WT07. Heat treat, coating, plating, and non-destructive inspection are WT08. Licensed or contract final assembly lines are WT09.")
  ],
  check:{q:"A supplier develops and builds an actuator under your source control drawing. You control form, fit, function, interface and qualification. They are the design activity for the internals. Which work type?",
   o:[
     "WT01 Build-to-print",
     "WT02 Source-controlled design and build",
     "WT03 Design agent",
     "WT04 Full CI design and build"],
   a:1, why:"Design authority is split and the supplier builds. That is WT02. WT01 puts no design authority at the supplier at all. WT03 has the company performing the build. WT04 has the supplier holding design authority against a company specification, with the company baselining at the allocated level."}},
 {id:"M4-06", title:"Company-provisioned materiel, and why WT09 exists", body:[
    P("WT09 is the newest work type. It covers a supplier who assembles a whole end item, such as an aircraft, from materiel the supplier did not buy."),
    P("The materiel arrives in one of three ways. It may be issued as a kit against a kit content list. It may be furnished loose, item by item, from a bonded store or straight to the line. Or the company may direct the purchase, raising the demand and choosing the source, with the supplier simply receiving and installing. All three are called company-provisioned materiel."),
    C("The sentence that defines the type", [
      "The company holds the demand. The supplier executes the installation.",
      "The company raises the demand, picks the source, and holds design authority for everything embodied. The supplier verifies what it receives, executes installation work orders written against company-released data, and owns the as-built record of the finished end item."]),
    P("The three provisioning modes create the same CM problem. In every case the supplier receives materiel whose configuration was decided somewhere else. The supplier has to check it against released content before installing it. Only the thing being checked against differs. It is a kit content list, or an issue document, or a receiving record against a company purchase order."),
    C("Why WT09 is not just build-to-print", [
      "A WT01 supplier buys its own material to a drawing and delivers a component. The CM question is whether the part conforms.",
      "A WT09 supplier delivers an end item built from materiel it did not select. The CM question is different. Was the right configuration embodied, on the right unit, at the right effectivity?",
      "A WT09 supplier also delivers with open work. Deferred jobs, shortages, travelers, and carried deviations are normal at delivery. That is exactly where end-item configuration control fails, and no other work type has to manage it."]),
    P("WT09 also has an audit role no other type has. The system-level audit happens where the end item is assembled. That supplier holds no design authority, so it cannot conduct the audit. It hosts it instead, providing the article, the floor, access to the installation zone, and the assembled evidence, while the company or the customer conducts.")
  ],
  check:{q:"Your company buys the avionics, ships them to a supplier, and that supplier installs them into the aircraft it is assembling for you. What classifies this as WT09?",
   o:[
     "The supplier is large enough to assemble an aircraft",
     "The company holds the demand and the supplier executes the installation",
     "The avionics arrived as a kit",
     "The supplier holds design authority for the installation"],
   a:1, why:"The defining split is demand versus execution. The company raised the demand and chose the source; the supplier installs what arrives. Kitting is only one of three provisioning modes, so the absence of a kit changes nothing. The supplier holds no design authority in WT09, and size is irrelevant to classification."}},
 {id:"M4-07", title:"Mixed classification, and the record", body:[
    P("Where a supplier performs more than one type of work on the same procured item, **record every applicable type, not only the dominant one.** Mixed classifications are ordinary for suppliers who both develop and build, or who build hardware and develop its embedded software."),
    C("Two words that get used for the same thing", [
      "**A procured item** is the hardware or software article your company accepts as a separate line on the acceptance record. Ask what your company signs for. Each answer is one procured item. A source-controlled pump assembly is one. A pressure switch shipped loose and accepted on its own line is one. **The same switch, installed in the pump by the supplier before shipping, is not.** It is content of the pump.",
      "**A supplier data deliverable** is data the supplier submits, identified by SDRL number. A reconciliation report is one. A part traceability record is one.",
      "The rest of this module says procured item every time it means the article. Keep the two apart, because the next module turns on the difference."]),
    P("For every work type recorded against one procured item, apply the **most demanding cell** of each applicable column, obligation by obligation. Wherever any applicable column requires a requirement, it is required."),
    C("The case people miss", [
      "A hardware procurement quietly acquires firmware. Nobody re-classifies. The entire software CM requirement set is never imposed: version identification, library control, build reproducibility.",
      "When the build cannot be reproduced three years later, that is where it started. **One missing letter in one classification field.**"]),
    S("Tailoring without a recorded classification is omission, not tailoring.",
      "A reduced requirement set with no record of the reasoning is indistinguishable from having forgotten."),
    S("A procurement whose classification cannot be determined is not released until it can.",
      "If you cannot answer who holds design authority and who builds, nobody has defined the procurement well enough to buy against it."),
    P("CM performs classification at statement-of-work development, before release, and records it on the classification log with classifier and date. **That record is the documented tailoring rationale the flowdown obligation requires.**"),
    S("One more rule follows this one, and it runs the other way.",
      "The union is right when two kinds of work land on one procured item. It is wrong when two procured items land on one statement of work. The next section is that case.")
  ],
  check:{q:"A source-controlled actuator contains the supplier\u2019s own embedded firmware. The engineer classifies it as source-controlled design and build only. What is the practical consequence?",
   o:[
     "None: source-controlled design and build is the dominant work type and governs",
     "The software CM requirement set is never imposed: version identification, library control and build reproducibility records",
     "The supplier will be over-burdened with unnecessary requirements",
     "Only the audit requirements are affected"],
   a:1, why:"Two kinds of work, one procured item. That is the union case, and mixed classifications take the union rather than the dominant type. Leaving the software and firmware work type off means that requirement set never reaches the statement of work, and the failure surfaces years later when the delivered load cannot be rebuilt."}},
 {id:"M4-08", title:"When the union does not apply", body:[
    P("You have just learned to take the union. Here is the case where taking it writes a statement of work the supplier cannot perform."),
    P("One statement of work. One supplier. Two procured items. A source-controlled assembly, and a vendor-item-controlled part accepted on its own line. **WT02 and WT05, on one classification record.**"),
    C("Count the procured items before you do anything else", [
      "Ask what your company accepts as a separate line on the acceptance record. Each answer is one procured item.",
      "**The supplier installs the switch into the pump before shipping.** Your company accepts one pump. **One procured item.** The switch is content of the pump and gets no separate classification.",
      "**The supplier ships the pump and the switch loose, and your company accepts both.** **Two procured items.** Each gets its own work type and its own requirement set.",
      "Same pump, same switch, same supplier. The answer turns on whether the supplier installed it before shipping. **Get this count wrong and everything after it is wrong.**"]),
    C("Run the union and read what you wrote", [
      "**R-14** would require an as-designed to as-built reconciliation report for the vendor item. Reconciled against what? A vendor item control drawing identifies and selects. It does not define as-designed content, and your company holds no released design for that part.",
      "**R-06** would require a change proposal for any change affecting baselined configuration documentation. Your company holds no baselined configuration documentation for a design the vendor owns.",
      "**R-12** would require an engineering release system for that same design. **R-24** would require the supplier to propose CIs inside it.",
      "These are not merely heavy. They are unperformable. That is how you know the union was the wrong operation."]),
    S("The union runs across work types on one procured item. It does not run across procured items.",
      "Two kinds of work on one article means one design authority and one released design. Every requirement in both columns has something to attach to. Two articles under two design authorities means the requirements from one column have nothing to attach to on the other article."),
    P("So derive per procured item. Read the WT02 column for the assembly. Read the WT05 column for the vendor item. Hand both sets to Supplier Requirements Engineering."),
    P("Then do one more thing. **Write the procured item into the text of each requirement you provide.** Supplier Requirements Engineering owns the statement of work and decides how it is arranged. You do not. A requirement whose applicability lives in a heading loses it when the heading moves. A requirement that says which item it applies to carries that fact wherever it lands."),
    CARDS([
      {h:"What the assembly gets", b:"The full WT02 set. CM plan, both reconciliation flowdowns, part traceability, change proposals, variance requests, status accounting, release records, first article, sub-tier data return, CM point of contact, and the standing conditional audit clause."},
      {h:"What the vendor item gets", b:"Vendor change and discontinuance notification, which carries nearly the whole WT05 flowdown. Variance requests and part traceability, tailored. Version data where software or firmware is present. Nothing that presumes a design your company does not hold."},
      {h:"What nothing gets", b:"A merged column. Deriving per procured item is not a weaker flowdown. R-08 survives on the vendor line, where the union would have buried it under twelve requirements the supplier could not perform."}]),
    C("The fork to settle before you classify", [
      "**Named on the statement of work is not the same as delivered under it.** Ask whether the vendor item has its own acceptance.",
      "**Separate line item, separate acceptance.** It is a procured item. WT05 goes on the classification record and everything above applies.",
      "**Directed content the supplier installs and never delivers separately.** It is not a procured item at all. It is sub-tier content inside the assembly, WT05 does not belong on the record, and **R-19 and S-18** bring its part numbers and unit identifiers up. Resolve the R-08 condition as met on the WT02 line, because you still need those notices. The WT02 cell reads C for this case."]),
    S("Nesting is a product structure fact. It is not a classification fact.",
      "The vendor item sitting inside the assembly changes nothing about how you derive. What changes the derivation is how many articles your company accepts.")
  ],
  check:{q:"One statement of work covers a source-controlled valve body and, on a separate accepted line item, the vendor-item-controlled solenoid installed in it. An engineer records WT02 and WT05 and applies the most demanding cell across both columns. What has gone wrong?",
   o:[
     "Nothing. Mixed classifications take the union, and both types are on one classification record",
     "The union was applied across two procured items under two design authorities, so the solenoid now carries reconciliation, change proposal and release requirements against a design the company does not hold",
     "WT05 should not have been recorded at all, since the solenoid is installed inside a WT02 item",
     "The engineer should have chosen the more demanding of the two work types and applied it to the whole statement of work"],
   a:1, why:"The union runs across work types on one procured item. Here it ran across two procured items. The solenoid is a vendor design, so there is no company-held released design to reconcile against and no baselined documentation to change. Derive per procured item, then provide both sets and name the item each requirement applies to. Recording WT05 was correct, and choosing a dominant type is the error the previous module already ruled out."}},
 {id:"M4-09", title:"The transaction flow", body:[
    P("Flowdown is transaction-driven: it executes for every procurement, and re-executes whenever the facts change."),
    STEPS([
      {h:"Classify", b:"Work type or types recorded on the classification log, with classifier and date."},
      {h:"Derive", b:"Read the requirement set from the matrix columns. Identify conditionals and rows that are mandatory for safety."},
      {h:"Resolve conditionals", b:"Each resolved against its stated condition, with the basis recorded. Determine audit designation status."},
      {h:"Cite in the statement of work", b:"Every requirement with its deliverable. Standing conditional audit clause where designation for audit is possible."},
      {h:"CM review and signature", b:"Prior to release, recorded on the classification log."},
      {h:"Maintain the classification", b:"Re-run on trigger. Classification is dated, not permanent."},
      {h:"Accrue evidence", b:"Log every deliverable at receipt and every finding or escape as it occurs."},
      {h:"Determine effectiveness", b:"Against the requirement set actually imposed. Record rationale, date and next-due date."},
      {h:"Act on the determination", b:"Actions from the ladder, with owner and due date, tracked to closure."}], "tl"),
    C("Re-classification triggers", [
      "**Scope change, including scope that grows from build into any element of design authority**: the common and easily missed one, because it silently makes change control applicable.",
      "Work type change, including added software or firmware. Audit designation change. Source change: new supplier, facility or sub-tier. Revision of the requirement matrix, or a change in which requirements are mandatory for safety. An effectiveness determination of less than effective."])
  ],
  check:{q:"A build-to-print procurement grows in scope: the supplier will now propose minor design improvements for company approval. Why does this matter to flowdown?",
   o:[
     "It does not: the company still owns the design",
     "It changes the price, so the statement of work is reissued anyway",
     "Design authority has partly moved, which silently makes change control applicable: re-classify and update the derived requirement set",
     "It only affects first article inspection"],
   a:2, why:"Scope growing from build into any element of design authority is a named re-classification trigger, and the most commonly missed one. Once the supplier can propose changes, an entire requirement set becomes applicable that a build-to-print classification never imposed."}},
 {id:"M4-10", title:"Who does what", body:[
    P("Flowdown is not a CM activity with an audience. It is a chain of handoffs, and nearly every failure in this module is a handoff that did not happen, not a judgment that went wrong."),
    TABLE(["Function", "What they own in this process"], [
      ["Configuration Management", "Owns the process. Classifies each procurement and records it; derives the requirement set and its deliverables; resolves conditionals; drafts or reviews the CM content of the statement of work and signs it before release; maintains the classification through its triggers; logs deliverable receipts and findings; makes or recommends effectiveness determinations; tracks actions to closure"],
      ["Subcontracts and supply chain", "Routes **every** statement of work through CM before release; incorporates the cited requirements and deliverables; administers notice periods and delivery terms; notifies CM of scope changes, source changes and award actions; executes the contractual actions arising from a determination"],
      ["Systems and Design Engineering", "Provides the technical content the flowdown depends on: source control drawings, specifications, technical data packages, interface definitions. **Approves supplier-proposed part attribute designations**, meaning safety-critical, life-limited and special handling, where the supplier holds design authority. Approves nothing where the designation for audit was externally assigned, because that case has no approver"],
      ["Quality Assurance", "Performs receiving verification; records nonconformances, escapes and findings against supplier deliverables; provides first article and source inspection results; supports the extent checks that follow a control failure"],
      ["System Safety", "Receives safety-relevant supplier findings and escapes into the safety data stream; concurs on dispositions affecting hazard controls; supports evaluation of tailoring proposals at the supplier tier"],
      ["Program Management", "Resources the flowdown and effectiveness work; approves award restrictions and other actions carrying schedule or cost consequence; escalates unresolved supplier CM performance"],
      ["Independent CM and Safety Assurance", "Evaluates a proposed equivalent control where a supplier or program wants to tailor a requirement mandatory for safety: independent of the program bearing the decision, which is the entire point of the role"],
      ["Enterprise CM functional lead", "Owns the work type taxonomy, the requirement matrix and the deliverable definitions, and maintains them as the requirement set changes, or as the requirements mandatory for safety change"],
      ["The sub-tier supplier", "Complies with or suitably tailors what is flowed; submits the required deliverables; flows requirements recursively to its own sub-tiers and returns their product data with traceability to next higher assemblies; participates in audits per its work-type role"]]),
    S("Name the handoffs and you have named the failure modes.",
      "A statement of work released without passing through CM. A part attribute authorship case nobody stated, so engineering never approved what the supplier never proposed. An escape found by receiving that never reached the findings log. None of these is a hard judgment call, each is a handoff that had no owner."),
    C("The two roles that must stay independent", [
      "Where a requirement mandatory for safety is proposed for tailoring at the supplier tier, the evaluation is done by CM and Safety Assurance **independent of the program bearing the decision**, and the risk acceptance is signed at the authority the severity names.",
      "A program evaluating its own proposed equivalent control is not an evaluation. It is the proposal, written twice."])
  ],
  check:{q:"A supplier holding design authority proposes which of its parts are safety-critical and life-limited. Who approves those part attribute designations?",
   o:[
     "CM, since CM maintains the traceability records they appear in",
     "The supplier, since they hold design authority for the item",
     "Systems or Design Engineering at your company, as the technical authority for the content the flowdown rests on",
     "Quality Assurance, at receiving verification"],
   a:2, why:"This is the second of the three authorship cases. Where the supplier holds design authority they **propose** the part attribute designations during design development, and your company\u2019s engineering function approves them. CM states in the statement of work which case applies, and records the result, but does not make the technical judgment. Leave the case unstated and each party waits for the other, which is how a life-limited part arrives with no assigned limit."}},
 {id:"M4-11", title:"Reading the matrix", body:[
    TABLE(["Marking", "Means", "What you do"], [
      ["R", "Required", "Impose as written, with its defined data deliverable"],
      ["T", "Tailored", "Impose with the tailoring documented. What the tailoring is gets recorded, not assumed"],
      ["C", "Conditional", "Resolve against the stated condition before citation, and record the basis"],
      [". ", "Not applicable", "Nothing to impose for this work type. The absence is derived from the two questions. It is not negotiated."]]),
    L([
      "**Mixed work types: apply the most demanding cell for each row.** Wherever any applicable column requires a requirement, it is required. The union, never the intersection.",
      "**Requirements mandatory for safety are not silently dropped.** Where the program proposes not to impose one, the proposal goes through the safety disposition gate and the disposition is referenced in the statement of work."]),
    S("A requirement is cited with its deliverable, or it is not cited.",
      "A clause imposing an obligation without identifying the data that evidences it is unenforceable at receipt and unverifiable at audit. You will have written a sentence that sounds like control and produces nothing you can check.")
  ],
  check:{q:"A row is marked T for one of a supplier\u2019s work types and R for the other. What is imposed?",
   o:[
     "T: the more permissive marking, since one column allows tailoring",
     "R: the most demanding cell governs; wherever any applicable column requires it, it is required",
     "Whichever the dominant work type specifies",
     "Neither, until the conflict is escalated"],
   a:1, why:"Mixed classifications take the union. R is more demanding than T, so R governs, and the requirement is imposed as written, with its deliverable."}},
 {id:"M4-12", title:"What the matrix actually imposes", body:[
    P("The markings tell you *how much* of a requirement applies. This is *what* the requirements are. A derivation walks these families in order, and each one produces something you can ask for at receipt."),
    TABLE(["Requirement family", "What is imposed", "What it produces"], [
      ["CM program and planning", "The supplier operates CM against the flowed requirement set, and addresses recursive flowdown to its own sub-tiers wherever they exist", "A full CM plan for full-development and software work; a tailored plan, or a CM section within the quality plan, where the supplier designs internals, acts as design agent, or performs repair"],
      ["Working to released data", "Work only to current released data, with no unauthorized departure from it. Data currency verified at receipt of every revision", "No standing deliverable: evidenced through everything else, and by its absence when a departure surfaces"],
      ["Change control", "Changes affecting the baseline, form-fit-function-interface, qualification or company-controlled documentation are proposed, not made", "Change proposals carrying the need for the change, its full impact data, and a notice for every affected document"],
      ["Variance control", "Any departure or nonconformance is variance-requested **before delivery**; a recurring variance found permanently acceptable converts to change action", "Variance requests identifying affected units and lots by identifier, with cause, classification and recurrence status"],
      ["Process change notification", "For processes identified as critical or special, and for frozen planning: no change without notice, within the agreed notice period, and no implementation before approval", "Process change notifications, event-driven"],
      ["Identification and traceability", "CAGE code, part numbers, unit identifiers and nomenclature applied and recorded; unit identifiers never revised or re-used", "The part traceability record, per delivered unit or lot"],
      ["Reconciliation", "As-built reconciled against released design, or as-maintained against approved configuration, for repair work", "Two deliverables, not one: the process documentation once and on revision, and the report per delivery or lot"],
      ["Status accounting", "Configuration records kept timely, current, historically traceable and retrievable per the agreed data terms", "Status accounting reports by item identifier, current and historical"],
      ["Software CM", "Where deliverable software or embedded code exists: version identification, developmental library control, and the ability to reproduce a build", "Version descriptions and build reproducibility records: compiler, settings, library and media identification, sufficient to rebuild"],
      ["Configuration audit", "Conditional on the CI\u2019s audit designation status. Held open by the standing clause", "The triggered audit deliverables, scoped to the supplier\u2019s role: conduct at their facility, or support with data and access"]]),
    S("Which families produce nothing for a given supplier is itself an answer, and it comes from the two questions.",
      "No design authority, no change proposals. No build, no as-built to reconcile and no traceability record. The families that fall away should fall away for a reason you can state.")
  ],
  check:{q:"A design house develops the technical data package for a wing rib; your company manufactures it. Which family produces no deliverable, and why?",
   o:[
     "Change control: the company owns the design",
     "Software CM: there is no software of any kind on a wing rib",
     "Reconciliation and traceability: the supplier builds nothing, so there is no as-built configuration at their end to reconcile or trace",
     "Status accounting: the supplier holds no configuration records"],
   a:2, why:"Who performs the build decides whether the reconciliation and traceability apparatus applies at all, and here nobody builds anything at the supplier, so there is no as-built to reconcile against and no delivered unit to trace. Change control does apply: they develop the design, so changes to it are proposed rather than made."}}
 ],
 exercises:[
 {id:"M4-E1", title:"Exercise 1: Classify five procurements",
  scen:"For each, state the work type or types, and give the two answers that drove it, who holds design authority, and who performs the build.",
  parts:[
   {id:"a", q:"A machine shop produces a titanium fitting to your company\u2019s released drawing."},
   {id:"b", q:"A supplier develops and manufactures an electro-hydraulic actuator to your source control drawing. It contains a microcontroller running the supplier\u2019s own embedded firmware."},
   {id:"c", q:"An engineering services firm produces the drawing package for a wing rib; your company manufactures it."},
   {id:"d", q:"A heat-treat house processes forgings you supply, to your process specification. And: a vendor supplies a catalog connector to their own part number under your vendor item control drawing."}
  ]},
 {id:"M4-E2", title:"Exercise 2: Reading a statement of work",
  scen:"A supplier statement of work covers two procured items: an actuator built to your source control drawing, and a wiring harness built to print. The CM section reads, in full:\n\n\u201c4.3 Configuration Management. 4.3.1 The Supplier shall maintain configuration control of the deliverable hardware. 4.3.2 As-designed to as-built reconciliation compares the released design against the configuration actually manufactured. 4.3.3 The Supplier shall submit a reconciliation report per lot (SDRL C004). 4.3.4 Where the item is or becomes designated for configuration audit, the Supplier shall conduct the item-level functional and physical audits at its facility and shall submit the audit plan (SDRL C011), the audit data package (SDRL C012) and the audit minutes (SDRL C013). 4.3.5 Supplier facilities shall be made available as required.\u201d",
  parts:[
   {id:"a", q:"Which sentences in 4.3 are obligations and which are descriptions? For each description, say what it would take to make it an obligation."},
   {id:"b", q:"4.3.4 says \u201cthe item.\u201d Two procured items are covered by this statement of work. What is wrong with that, and how would you fix it?"},
   {id:"c", q:"The harness is build-to-print. If the harness CI is designated for audit, does 4.3.4 describe the right obligation for that supplier's work on it? Explain."},
   {id:"d", q:"4.3.5 is intended to buy audit access at the supplier's plant. Say why it does not, and write a replacement sentence that does."},
   {id:"e", q:"List every CM requirement you would expect to see for these two procured items that is missing from 4.3 entirely. For each, say what it buys you."}
  ]}
 ]
},
{
 id:"M5", label:"Module 5", title:"Deriving the requirement set", sub:"What each work type owes, how conditionals resolve, and how the requirements reach the supplier",
 sections:[
 {id:"M5-01", title:"What each work type gets: the design and build types", body:[
    P("The families and the markings are the mechanism. This is the output: what a supplier of each type actually receives. Read the third column as carefully as the second: what is **absent** from a flowdown, and why, is the part people get wrong."),
    TABLE(["Work type", "What is imposed", "What is absent, and why"], [
      ["Build-to-print", "Work only to current released data. Identification and marking. The part traceability record. Both reconciliation flowdowns: method and report. Variance requests before delivery. First article inspection. Status accounting tailored to as-built records. Process change notification where critical or special processes are identified in the data package", "**No change proposals**: the supplier holds no design authority, so changes arise from company action or surface as variances. **No interface obligations**: the interfaces are defined in the data package they were given. **No CM plan** in most cases; the reconciliation method is imposed standalone instead"],
      ["Source-controlled design and build", "Nearly everything. A tailored CM plan, or a CM section within the quality plan. Change proposals for anything touching the baseline, form-fit-function-interface, qualification or company-controlled documentation. Variances. Identification, traceability, both reconciliation flowdowns, status accounting, engineering release discipline, interface participation, first article. Software CM **where embedded code exists**", "Little. This is the type where the split of authority is the difficulty: they design the internals, so change control is real, but the characteristics and the interfaces are yours, so change proposals come to you"],
      ["Design agent", "Change proposals and release discipline above all: the technical data package **is** the product, so how they release and revise it is the thing being bought. Interfaces. Status accounting over the developmental configuration. Support for CM process audits", "**No traceability record, no reconciliation, no first article**: they build nothing, so there is no as-built configuration at their end and no delivered unit to trace"],
      ["Full CI development", "The full set, as written: a full CM plan, change and variance control, identification and traceability, both reconciliation flowdowns, interfaces, release, status accounting, first article, and software CM where deliverable software or embedded code exists", "Nothing of substance. This is the heaviest flowdown: the supplier holds design authority at its level and builds, so both of the two questions point at them"]]),
    S("The absences are derived, not negotiated.",
      "Every blank in a flowdown traces back to one of the two questions. If you cannot say which question produced an absence, you have not derived the set: you have copied one."),
    C("The one that catches people", [
      "A build-to-print supplier cannot propose changes, which sounds like less risk and is often read as less flowdown. It is not. It means every departure they encounter has only two honest exits: a variance request before delivery, or a change raised through your company, and if neither is imposed clearly, the third exit is the one you find in the hardware later.",
      "**Imposing less on a supplier with no design authority is exactly when the variance discipline matters most.**"])
  ],
  check:{q:"Why does a design agent receive no part traceability record requirement and no reconciliation report requirement?",
   o:[
     "Because those requirements belong to the quality system rather than to CM",
     "Because the deliverable is data, and the company performs the build: there is no as-built configuration at the supplier to trace or reconcile",
     "Because design agents are typically small firms and the flowdown is proportioned to size",
     "Because those requirements are imposed on the company\u2019s own manufacturing organization instead"],
   a:1, why:"Who performs the build decides whether the traceability and reconciliation apparatus applies. Nothing is manufactured at a design agent, so there is no physical article to serialize and no as-built to compare against released design. What they do get is the discipline that fits what they produce: release control, change proposals, and status accounting over the developmental configuration."}},
 {id:"M5-02", title:"What each work type gets: the specialized types", body:[
    P("Four types where the flowdown is narrow. Narrow is not the same as light, in each case one or two requirements carry nearly all the weight, and missing them is what goes wrong."),
    TABLE(["Work type", "What carries the weight", "Notes"], [
      ["Catalog item", "**Change and discontinuance notification.** Notice of any product change or discontinuance, with effectivity, last-time-buy terms and alternates data, within the agreed notice period. Your company evaluates the impact through its own change process", "Identification and traceability are tailored to what a vendor item can carry: vendor part identification, media and version marking, and pass-through of vendor life or safety data where the catalog item carries it. A vendor nonconformance is normally handled by receiving and withhold, with a variance where a company drawing is invoked"],
      ["Software and firmware development", "**Software CM in full:** version identification, developmental library control, a version description per release, and build reproducibility records: compiler, version, settings, build procedure and library and media identification, sufficient to rebuild the delivered load", "Usually combined with source-controlled or full-development work rather than standing alone. When it is combined and nobody records the second work type, this whole column silently disappears from the statement of work"],
      ["Repair and overhaul", "**Retention of unit identifiers and consumed life through part-number changes**, plus retrofit incorporation records. Reconciliation is as-maintained against approved configuration rather than as-built against released design", "Change control covers changes to approved repair schemes. First article applies to the first article of a repair where required. The traceability record is updated through repair and survives overhaul: the life consumed field keeps counting"],
      ["Special process services", "**Process change notification**, and working only to the current released process specification. No change to a frozen or approved process, planning, facility or tooling without notice and approval", "There is no item design and no as-built configuration, so nearly everything else falls away. The single requirement that remains is the one that protects every part that has ever passed through that process"]]),
    S("On a special process, one requirement stands between you and a fleet-wide question.",
      "If a heat-treat house changes its cycle without notice, the question is not whether this delivery conforms. It is which units, over what period, were processed under a condition nobody assessed, and if the notification requirement was never imposed, nobody can bound the answer."),
    P("Two of these four types are the ones most often missed at classification. A hardware procurement that quietly acquires firmware loses the entire software column. A procurement that includes a special process performed in-house is frequently classified only as the hardware work. That drops the notification requirement on the process that was hardest to qualify.")
  ],
  check:{q:"A plating vendor processes parts you supply, to your process specification. They change their bath chemistry without telling anyone; the change is discovered four months later. What was the requirement that should have prevented this, and why does its absence matter beyond this delivery?",
   o:[
     "First article inspection: the change would have been caught on the next first article",
     "Process change notification: without it, nobody can bound which units over what period were processed under an unassessed condition",
     "The reconciliation report: the delta would have appeared in it",
     "Status accounting: the process revision would have been recorded"],
   a:1, why:"Special process work produces no as-built configuration to reconcile and no item design to control, so the notification requirement is carrying almost the whole flowdown on its own. Its absence is not a missed record: it is the loss of the ability to scope an investigation across every unit processed since the change."}},
 {id:"M5-03", title:"The deliverables, and what each must contain", body:[
    P("A requirement is cited with its deliverable or it is not cited. Here is what each deliverable definition actually fixes, and each one answers the same three questions: **what is in it, when it arrives, and what triggers it.**"),
    TABLE(["Deliverable", "Content", "When"], [
      ["Sub-supplier CM plan", "How the supplier implements the flowed requirements: organization, change control, release, status accounting, identification, and flowdown to their own sub-tiers", "Once plus revisions; approved before the work it governs begins"],
      ["Reconciliation process documentation", "Data sources, comparison method, delta disposition, frequency, and the records the method produces", "Once plus revisions; with the plan, or standalone where there is no plan"],
      ["Reconciliation report", "As-built against the released design revision; open deltas with disposition status; changes incorporated with effectivity; expressed in traceability-record identifiers", "Per delivery or lot"],
      ["Part traceability record", "Per unit or lot: serial numbers; lot and batch numbers; life-limited designation **with the assigned limit and the life consumed at delivery**; safety-critical designation; special handling designations; traceability to the next higher assembly", "Per delivery"],
      ["Change proposal package", "The change definition; the need for it; full impact data; a summary of testing validating any new concept or technology; and a revision notice for every affected document", "Event-driven"],
      ["Variance request", "The departure described; affected units and lots by identifier; classification; cause; corrective action; and recurrence status", "Event-driven, before delivery"],
      ["Process change notification", "Advance notice of any change to a frozen or approved process, planning, facility or tooling identified as critical, with no implementation before approval", "Event-driven, within the agreed notice period"],
      ["Status accounting report", "Status of configuration documentation, changes and variances by item identifier; current and historical", "Periodic, per the agreed terms"],
      ["Software version description and build records", "Version identification and contents; changes since the prior version; compiler, compiler version and settings; a build procedure sufficient to reproduce the build; library and media identification", "Per software release"],
      ["Audit plan and agenda, data package, minutes and closure", "Scoped to the supplier\u2019s role. Minutes carry the required content and the action items, and are delivered within the agreed period after the audit", "Triggered by audit designation"],
      ["Change or discontinuance notice", "For a vendor item: notice of product change or discontinuance with effectivity, last-time-buy terms and alternates data", "Event-driven, per the agreed notice period"],
      ["First article inspection report", "Per the applicable standard or an agreed equivalent; re-accomplished on process, source or tooling change", "First article, plus its triggers"]]),
    S("Content, frequency or trigger, and submittal terms. A deliverable definition missing any one of the three is not enforceable at receipt.",
      "\u201cSubmit a traceability record\u201d gives you nothing to reject. \u201cPer delivery, containing life consumed at delivery for life-limited items\u201d gives you a blank field you can point at.")
  ],
