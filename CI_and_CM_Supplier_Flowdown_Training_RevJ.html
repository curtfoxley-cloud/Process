<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configuration Item and Configuration Management Supplier Flowdown Training</title>
<style>
:root{
  --ink:#1E262E; --ink-2:#2C3841; --slate:#5C6D78; --mute:#8998A2;
  --paper:#FFFFFF; --surface:#F4F6F7; --surface-2:#EDF0F1; --rule:#D6DCDF;
  --rust:#A8481F; --rust-soft:#F2E4DD; --rust-ink:#7E340F;
  --teal:#1F5F5B; --teal-soft:#DFEAE8;
  --amber:#9A6508; --amber-soft:#F6ECD8;
  --alert:#8E2F2F; --alert-soft:#F4E2E2;
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --rail:290px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--surface);
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- header ---------- */
.top{
  position:sticky; top:0; z-index:40; background:var(--ink); color:#fff;
  display:flex; align-items:center; gap:16px; padding:0 20px; height:60px;
  border-bottom:1px solid #000;
}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#93A2AB}
.top .spacer{flex:1}
.who{display:flex;align-items:center;gap:8px}
.who label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#93A2AB}
.who input{
  background:#2C3841;border:1px solid #3D4B55;color:#fff;border-radius:4px;
  padding:6px 10px;font-size:13px;width:180px;
}
.who input:focus{outline:2px solid var(--rust);outline-offset:1px}
.tbtn{
  background:transparent;border:1px solid #46545F;color:#DCE3E7;border-radius:4px;
  padding:7px 12px;font-size:12.5px;white-space:nowrap;
}
.tbtn:hover{background:#2C3841;border-color:#5E6D77}
.tbtn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.tbtn.danger{border-color:#7A4A3A;color:#EBCDC2}
.tbtn.danger:hover{background:#4A2E26;border-color:#A85D45}
.tbtn.danger.armed{background:var(--rust);border-color:var(--rust);color:#fff;font-weight:600}
.railtoggle{display:none}

/* ---------- shell ---------- */
.shell{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto}
.rail{
  width:var(--rail); flex:0 0 var(--rail); background:var(--paper);
  border-right:1px solid var(--rule); min-height:calc(100vh - 60px);
  position:sticky; top:60px; max-height:calc(100vh - 60px); overflow-y:auto;
}
.railhead{padding:18px 20px 12px;border-bottom:1px solid var(--rule)}
.railhead h2{margin:0 0 3px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);font-weight:700}
.railhead p{margin:0;font-size:12px;color:var(--slate)}
.grp{padding:14px 0 6px}
.grp h3{
  margin:0 0 6px;padding:0 20px;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--slate);font-weight:700;
}
.nav{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;
  padding:7px 20px 7px 17px;display:flex;gap:10px;align-items:flex-start;line-height:1.35}
.nav:hover{background:var(--surface)}
.nav:focus-visible{outline:2px solid var(--rust);outline-offset:-2px}
.nav[aria-current="true"]{background:var(--surface-2);border-left-color:var(--rust)}
.nav .id{font-family:var(--mono);font-size:10.5px;color:var(--mute);flex:0 0 46px;padding-top:2px;letter-spacing:.02em}
.nav[aria-current="true"] .id{color:var(--rust-ink)}
.nav .nm{font-size:13px;color:var(--ink-2);flex:1}
.nav[aria-current="true"] .nm{font-weight:600}
.dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:5px;border:1.5px solid var(--rule);background:transparent}
.dot.work{border-color:var(--amber);background:var(--amber-soft)}
.dot.done{border-color:var(--teal);background:var(--teal)}

/* ---------- main ---------- */
main{flex:1;min-width:0;padding:0 0 80px}
.stage{max-width:820px;margin:0 auto;padding:34px 32px 0}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.recid{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--rust-ink);background:var(--rust-soft);
  padding:3px 8px;border-radius:3px;font-weight:700}
.status{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
h1.sect{font-family:var(--serif);font-size:31px;line-height:1.2;margin:0 0 6px;letter-spacing:-.2px}
.lede{font-size:15px;color:var(--slate);margin:0 0 22px}
.hr{height:1px;background:var(--rule);margin:0 0 26px}
p{margin:0 0 14px}
strong{font-weight:700}
ul.pl{margin:0 0 16px;padding-left:0;list-style:none}
ul.pl li{position:relative;padding-left:20px;margin-bottom:9px}
ul.pl li::before{content:"";position:absolute;left:3px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--rust)}

.callout{background:var(--surface);border-radius:6px;padding:16px 18px;margin:0 0 20px;border:1px solid var(--rule)}
.callout.teal{background:var(--teal-soft);border-color:#CBDDDA}
.callout .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:7px}
.callout.teal .lab{color:var(--teal)}
.callout p:last-child{margin-bottom:0}

.stmt{background:var(--ink);color:#fff;border-radius:6px;padding:20px 22px;margin:0 0 20px}
.stmt b{display:block;font-family:var(--serif);font-size:19px;line-height:1.35;font-weight:700}
.stmt span{display:block;margin-top:9px;font-size:13.5px;color:#B4C0C7}

.cards{display:grid;gap:12px;margin:0 0 20px}
.cards.c2{grid-template-columns:1fr 1fr}
.cards.c3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.card h4{margin:0 0 6px;font-size:14px;font-weight:700}
.card p{margin:0;font-size:13.5px;color:var(--ink-2)}

.steps{margin:0 0 20px;display:grid;gap:8px}
.step{display:flex;gap:12px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:11px 14px}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--rust);color:#fff;
  font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step.tl .n{background:var(--teal)}
.step .tx b{display:block;font-size:14px;margin-bottom:2px}
.step .tx span{font-size:13.5px;color:var(--ink-2)}

.tw{overflow-x:auto;margin:0 0 20px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
thead th{background:var(--ink);color:#fff;text-align:left;padding:9px 12px;font-size:12px;font-weight:700;letter-spacing:.02em}
tbody td{padding:9px 12px;border-top:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
tbody tr:nth-child(even) td{background:#FAFBFB}
td.k{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}

/* ---------- knowledge check ---------- */
.check{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--rust);border-radius:6px;padding:18px 20px;margin:26px 0 0}
.check .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:8px}
.check .q{font-size:15.5px;font-weight:600;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--rule);border-radius:5px;margin-bottom:7px;cursor:pointer;background:var(--paper);font-size:14px}
.opt:hover{background:var(--surface)}
.opt input{margin:3px 0 0;accent-color:var(--rust);flex:0 0 auto}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt.wrong{border-color:var(--alert);background:var(--alert-soft)}
.opt.locked{cursor:default}
.fb{margin-top:11px;padding:12px 14px;border-radius:5px;font-size:14px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--teal-soft);border:1px solid #CBDDDA}
.fb.no{background:var(--alert-soft);border:1px solid #E8CFCF}
.fb b{display:block;margin-bottom:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.fb.ok b{color:var(--teal)} .fb.no b{color:var(--alert)}

/* ---------- exercises ---------- */
.exwrap{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;margin:0 0 18px}
.exwrap h4{margin:0 0 8px;font-family:var(--serif);font-size:18px}
.scen{background:var(--surface);border-radius:5px;padding:13px 15px;font-size:14px;margin-bottom:16px}
.part{margin-bottom:16px}
.part label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
textarea{width:100%;border:1px solid var(--rule);border-radius:5px;padding:10px 12px;font-size:14px;
  line-height:1.55;resize:vertical;min-height:76px;background:var(--paper)}
textarea:focus{outline:2px solid var(--rust);outline-offset:0;border-color:var(--rust)}
.count{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:4px;text-align:right}

/* ---------- buttons / footer nav ---------- */
.pager{display:flex;justify-content:space-between;gap:12px;margin:32px 0 0;padding-top:22px;border-top:1px solid var(--rule)}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:5px;padding:10px 18px;font-size:14px;font-weight:600}
.btn:hover{background:var(--surface)}
.btn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.btn.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.pri:hover{background:var(--rust-ink)}
.btn.gh{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}

/* ---------- start + submit ---------- */
.hero{background:var(--ink);color:#fff;border-radius:8px;padding:34px 34px 30px;margin-bottom:26px}
.hero .kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust-soft);margin-bottom:12px}
.hero h1{font-family:var(--serif);font-size:35px;line-height:1.15;margin:0 0 6px}
  .hero .subtitle{font-family:var(--serif);font-size:19px;line-height:1.3;color:#C9D3D9;margin:0 0 10px}
  .hero .scale{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rust-soft);margin:0 0 14px}
.hero p{color:#B4C0C7;margin:0;font-size:15px;max-width:60ch}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 22px;font-size:14px}
.meta dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);padding-top:3px}
.meta dd{margin:0}
.transmit{border:1px solid var(--rule);border-radius:6px;background:var(--paper);overflow:hidden;margin-bottom:22px}
.transmit .hd{background:var(--surface-2);padding:12px 18px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.transmit .hd b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.transmit .hd span{font-family:var(--mono);font-size:11px;color:var(--slate)}
.transmit .bd{padding:18px}
.scorebox{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.scorebox .big{font-family:var(--serif);font-size:42px;font-weight:700;line-height:1}
.scorebox .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate)}
.gaps{margin-top:14px}
.gaps li{font-size:13.5px}
.note{font-size:13px;color:var(--slate);margin-top:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:5px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.warn{background:var(--amber-soft);border:1px solid #E4D3AE;border-radius:5px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.setup{font-size:13px;color:var(--slate);border-top:1px solid var(--rule);margin-top:26px;padding-top:16px}
.setup code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:3px}

.fadein{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:760px){
  .top{padding:0 12px;gap:8px}
  .brand{display:none}
  .lng{display:none}
  .who{flex:1;min-width:0}
  .who label{display:none}
  .who input{width:100%;min-width:0}
}
@media(max-width:900px){
  .cards.c3,.cards.c2{grid-template-columns:1fr}
  .rail{position:fixed;top:60px;left:0;bottom:0;z-index:35;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0);max-height:none}
  .rail.open{transform:none;box-shadow:2px 0 24px rgba(0,0,0,.25)}
  .railtoggle{display:inline-block}
  .stage{padding:26px 18px 0}
  .who input{width:120px}
  h1.sect{font-size:26px}
  .hero{padding:26px 22px}
  .hero h1{font-size:28px}
}
</style>
</head>
<body>

<header class="top">
  <button class="tbtn railtoggle" id="railToggle" aria-label="Show section register">Sections</button>
  <div class="brand">
    <b>Configuration Item and CM Supplier Flowdown Training</b>
    <span id="brandSub">Interactive modules</span>
  </div>
  <div class="spacer"></div>
  <div class="who">
    <label for="who">Trainee</label>
    <input id="who" type="text" placeholder="Your name" autocomplete="name">
  </div>
  <button class="tbtn" id="btnSave">Save<span class="lng"> progress</span></button>
  <button class="tbtn" id="btnLoad">Resume</button>
  <button class="tbtn danger" id="btnClear" title="Erase every answer, check, and the trainee name">Clear<span class="lng"> all</span></button>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Section register"></nav>
  <main><div class="stage" id="stage"></div></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ==========================================================================
   TRAINER SETUP: edit this block, save the file, then share it.
   Nothing else in this file needs changing.
   ========================================================================== */
var CONFIG = {
  companyName:   "[Company]",
  trainerName:   "your trainer",
  trainerEmail:  "",            // e.g. "cm.lead@company.com": enables the Email results button
  submitEndpoint:""             // optional: a URL that accepts a JSON POST (Power Automate, Forms webhook, etc.)
};

/* ==========================================================================
   CONTENT
   ========================================================================== */
var P = function(t){return {t:"p", x:t};};
var L = function(a){return {t:"list", x:a};};
var C = function(lab,lines,tone){return {t:"callout", lab:lab, x:lines, tone:tone||"rust"};};
var S = function(b,sub){return {t:"stmt", x:b, sub:sub||""};};
var CARDS = function(items,cols){return {t:"cards", x:items, cols:cols||3};};
var TABLE = function(head,rows){return {t:"table", head:head, x:rows};};
var STEPS = function(items,tone){return {t:"steps", x:items, tone:tone||""};};

var MODULES = [
{
 id:"M1", label:"Module 1", title:"Foundations", sub:"What Configuration Management is, what a CI is, how it is defined and identified, and how configuration control reaches suppliers",
 sections:[
 {id:"M1-01", title:"What Configuration Management is", body:[
    P("Configuration Management keeps three descriptions of a product consistent with one another. Everything else in the discipline exists to protect that consistency."),
    CARDS([
      {h:"As required", b:"What the product is contractually and functionally obliged to be. Specifications, requirements, interface definitions."},
      {h:"As designed", b:"What the released design says the product is. Drawings, models, software design documentation, the technical data package."},
      {h:"As built / as maintained", b:"What the physical article actually is, unit by unit. Build records, serial and lot records, repair and retrofit records."}]),
    P("All three descriptions are written down. That is why the middle one is named for the design and not for the paperwork. **As designed** means the released design definition at its current approved revision. It is a specific thing you can go and retrieve."),
    S("When the three agree, the product is under configuration control. When they diverge, nobody can say with evidence what they actually have."),
    C("Why this matters more on safety-significant products", [
      "On a product line where failure can injure or kill, \u201cwhat exactly is in this unit?\u201d is not an administrative question. It determines whether a hazard control is present, whether a life-limited part is within life, and whether a fleet-wide inspection can be scoped.",
      "**Configuration divergence on a safety-significant product is a latent safety problem wearing a paperwork costume.**"])
  ],
  check:{q:"A supplier builds ten units to the released drawing, then quietly improves a bracket on the last three. The units work fine. What has gone wrong in configuration terms?",
   o:[
     "Nothing, because the units meet their performance requirements",
     "As-built has diverged from as-designed, so nobody can now say what any given unit contains",
     "Only a quality problem: the parts still passed inspection",
     "Nothing, provided the change is documented at the next revision"],
   a:1, why:"Performance is not the test. The three descriptions have diverged: the released design says one thing and three physical articles say another. Until that is reconciled, the configuration of every delivered unit is in question, not just the three."}},

 {id:"M1-02", title:"The five CM functions", body:[
    P("CM is conventionally divided into five functions. Learn what each one answers. Modules 1 to 3 of this course live inside the second one. Modules 4 to 7 reach across four of them."),
    TABLE(["Function", "The question it answers"], [
      ["Planning and management", "How will CM be performed here, by whom, with what tools, and how will we know it is working?"],
      ["Configuration identification", "What are the things we are managing, what defines each one, and what is each one called?"],
      ["Change management", "How does a change to a defined thing get proposed, evaluated, approved and incorporated?"],
      ["Status accounting", "What is the current and historical status of every defined thing and every change to it?"],
      ["Verification and audit", "Can we demonstrate, with evidence, that the product meets requirements and matches its documentation?"]]),
    P("The five functions are not five steps in a sequence. They run at the same time and they repeat for the life of the program. Here is how they sit together:"),
    L([
      "**Planning and management sets the frame, and it does not stop.** It produces the program CM plan. It names the authorities, selects the tools, sets the staffing, and defines the measures. It owns tailoring, and it owns the safety disposition gate. Identification work runs under the plan that planning and management wrote, so identification does not come before it.",
      "**Identification defines the objects.** It answers what the managed things are, what defines each one, and what each one is called. That is the whole of Modules 1 to 3.",
      "**Change management, status accounting, and verification and audit all act on those objects.** Change management changes a defined thing. Status accounting indexes defined things. Audit compares a defined thing against its documentation.",
      "**Supplier flowdown is not a sixth function.** What gets flowed to a supplier is identification, change management, status accounting, and audit requirements. Flowdown is owned under planning and management, which documents the method in the program CM plan. That is Modules 4 to 7."]),
    S("Identification is not first in time. It is first in dependency.",
      "Change management needs something to change against. Status accounting needs an index. Audit needs both sides of the comparison. Identification supplies all three."),
    P("A missing CI is a change stream nobody controls, a status accounting blind spot, and an audit finding found years later, at the highest possible cost. Time spent getting identification right is the cheapest time in the discipline.")
  ],
  check:{q:"A new program is standing up. A CM engineer proposes to begin screening CI candidates before the program CM plan exists, on the grounds that identification comes first. What is wrong with that reasoning?",
   o:[
     "Nothing. Identification is the first function, and the other four depend on it",
     "Planning and management sets the process, the authorities and the resources that identification work runs under, so identification does not come before it. The functions run concurrently, and identification is first in dependency rather than first in time",
     "Screening cannot begin until the Acquirer supplies a candidate list",
     "Screening cannot begin until the functional baseline is established"],
   a:1, why:"The five functions overlap in time. Planning and management writes the plan that says how identification will be performed, by whom, and in what tool, and it keeps running for the life of the program. What is true about identification is that three of the other four functions act on its outputs: change management needs something to change against, status accounting needs an index, and audit needs both sides of the comparison. That is a dependency claim, not a schedule claim. The Acquirer may recommend candidates but bounds nothing, and baselines are an output of identification rather than a precondition for it."}},
 {id:"M1-03", title:"The words you will meet", body:[
    P("A short detour into vocabulary before the machinery starts. These terms run through the rest of the training and through every document you will touch. Guessing at them is how work gets misclassified."),
    C("Two conventions this training uses, and uses without exception", [
      "**Configuration item is shortened to CI.** Wherever this training means a configuration item, it writes CI. So CI always means a configuration item.",
      "**The word item on its own never means a CI.** It is reserved for the things that qualify it, and each of those is always qualified. A **procured item** is the article your company accepts on a line of the acceptance record. A **vendor item** is a commercial or catalog article bought to the vendor's own part number. A **catalog item** and a **commercial item** are the same kind of article. An **end item** is the assembled product. An **action item** is a finding's closure record. A **line item** is a line on a contract. An **open item** is one that is not yet closed.",
      "Read those two rules together and a sentence like **a vendor item is not a CI** says exactly what it means. Converting it to CI would invert it.",
      "Where a sentence means a part rather than a CI, this training writes **part**. Where it means something being screened before the gates have run, it writes **candidate**."]),
    P("The rest of the vocabulary is really a set of statements about **who owns the design, and how much of it you are being shown.**"),
    TABLE(["Term", "What it means"], [
      ["Acquirer and Supplier", "The customer who buys the product and controls what they choose to control, and the organization that designs, builds and delivers it. Your company is the Supplier here, and becomes the Acquirer in turn to its own sub-suppliers, which is the whole premise of Modules 4 to 7"],
      ["Design activity", "The organization responsible for the design of an item. Its CAGE code goes on the item, its parts, its documentation and its media, which is what makes a part number unambiguous, since a part number is only unique within the activity that assigned it"],
      ["Technical data package", "The collected design definition sufficient to build the item: drawings and models, associated lists, specifications, and the process requirements that go with them"],
      ["Performance specification", "States requirements as **required results, with criteria for verifying compliance, but without stating the methods** for achieving them. It defines the functional requirements, the environment the item must operate in, and its interface and interchangeability characteristics"],
      ["Detail specification", "States **design** requirements: materials to be used, how a requirement is to be achieved. A specification containing both performance and detail requirements is still a detail specification"],
      ["System specification, item specification", "The top-level specification for the whole system or end item, versus the specification for one CI. The first sits in the functional documentation; the second in the allocated"],
      ["Source control drawing", "Covers a commercial or vendor-developed item used in a **critical application.** It gives the engineering description, qualification requirements and acceptance criteria, and it carries a list of approved sources with the vendor\u2019s own identification for items qualified for that use. The vendor owns the internal design; the drawing controls the item\u2019s characteristics and who may supply it"],
      ["Vendor item control drawing", "Covers a catalog item bought to the vendor\u2019s own part number, where that kind of source qualification is not being imposed. Design authority stays wholly with the vendor, and the flowdown is mostly notification"],
      ["Altered item drawing", "Documents a purchased item that is permanently altered before it is installed, including a one-time programmable device burned with code, which is why it appears in the firmware rules"],
      ["Contract data requirements", "The list on the contract stating which data products are delivered, in what form, and when. A requirement with no data requirement behind it produces nothing you can ask for"]]),
    S("Read a drawing type as an answer to the design authority question, never as a filing detail.",
      "Source control drawing: they design the internals, you control the characteristics and the sources. Vendor item control drawing: they design it, they own it, you buy it. A technical data package you issued: you designed it, they build it. Those three sentences drive completely different CM obligations.")
  ],
  check:{q:"A supplier designs the internals of an actuator for a critical application. Your company sets its performance, interface and qualification requirements and maintains the list of sources approved to supply it. Which artifact controls that arrangement?",
   o:[
     "A vendor item control drawing",
     "A source control drawing",
     "A technical data package issued to the supplier",
     "A detail specification"],
   a:1, why:"The approved-sources list plus qualification and acceptance criteria for an item used in a critical application is exactly what a source control drawing does. A vendor item control drawing would mean buying a catalog item to the vendor\u2019s number with no such control; a technical data package would mean your company held the design; a detail specification would tell them how to build it, which is the opposite of what is happening here."}},
 {id:"M1-04", title:"What is a Configuration Item?", body:[
    P("A Configuration Item is the thing configuration management has decided to manage separately. Before we identify it, baseline it, or flow requirements to a supplier against it, we need to know what the thing is."),
    C("Configuration Item (CI)", [
      "Any hardware, software, firmware, or aggregation thereof that satisfies a system end-use function and is designated for separate configuration management. Designation includes establishing the CI\u2019s requirements and verifying that its configuration meets those requirements and that its configuration documentation accurately describes its configuration.",
      "Read it in two halves. The first sentence says what qualifies. The second says what designating one obliges you to do.",
      "EIA-649-1A, Configuration Management Requirements for Defense Contracts, states:",
      "'The Supplier shall identify as a Configuration Item any item that satisfies a system end use function and designates it for separate CM because the item meets or impacts one or more of the following:",
      "a. An item critical to the functioning of the system.",
      "b. An item whose failure might result in serious injury, loss of life or loss of primary system capability.",
      "c. An item whose technology is complex, not well known, and critical to meeting acquisition, operational or supportability goals of the program.",
      "d. Is under control as designated by the Acquirer.",
      "e. Requires separate type designation, versions, or nomenclatures.",
      "f. Is critical or high risk and failure would have significant financial impact.",
      "g. Requires any one or more of the following logistics elements:",
      "   1. Supply support Allowance Parts List (APL)",
      "   2. Supply support Allowance Equipage List (AEL)",
      "   3. Supply support Allowance Component List (ACL)",
      "   4. Test equipment (e.g., General Purpose, Special Purpose, or Built-in)",
      "   5. Technical manuals",
      "   6. Planned Maintenance System (PMS) Maintenance Index Pages (MIP) and Maintenance Requirement Cards (MRC)",
      "   7. Danger or Caution Tag Out requirements'",
      "In this training you will learn about how to screen items against these conditions to identify CIs.",
      "Hold three things for now. A CI is a thing, not a function. It does a job the system needs. Somebody decided to manage it separately, and recorded that decision. Module 2 takes the definition apart and turns it into gates and criteria."], "teal"),
    S("A CI is a thing, not a function.",
      "It satisfies a system end-use function, it is designated for separate configuration management, and that designation creates obligations for its requirements, configuration verification, and configuration documentation." )
  ],
  check:{q:"Which statement best describes a Configuration Item?",
   o:[
     "Any function the system must perform, whether or not hardware or software is separately controlled",
     "Any hardware, software, firmware, or aggregation thereof that satisfies a system end-use function and is designated for separate configuration management",
     "Any part that receives a unique part number",
     "Any item that is serialized"],
   a:1, why:"The definition is specific. A CI is hardware, software, firmware, or an aggregation thereof that satisfies a system end-use function and is designated for separate configuration management. A function is not itself a CI, and serialization does not mean the item is a CI."}},
 {id:"M1-05", title:"Baselines", body:[
    P("A baseline is an agreed, fixed reference point: the approved configuration documentation for a CI at a defined moment, from which changes are managed by formal action."),
    STEPS([
      {h:"Functional: FBL", b:"System-level performance requirements and verification method for the system or top-level item. Typically established at the system requirements or functional review."},
      {h:"Allocated: ABL", b:"Requirements allocated down to each CI, with interfaces and verification, in item performance specifications. Typically at preliminary design review, per CI."},
      {h:"Product: PBL", b:"PBL: The detailed design definition. The documentation describing the CI as built. The product baseline has two states. The **initial product baseline** is established at completion of critical design review. The **formalized product baseline** is established no later than first production unit delivery or physical audit completion. Module 7 covers which event formalizes it for which CI."}], "tl"),
    P("Once documentation is baselined, changes to it are processed through formal change action rather than by editing the document. That is the hinge between identification and change management. Baselined interface requirements are no exception: controlling them is mandatory for safety.")
  ],
  check:{q:"What changes about a document the moment it is baselined?",
   o:[
     "It becomes read-only in the document system",
     "It can no longer be revised at all",
     "It is delivered to the Acquirer",
     "Changes to it are processed through formal change action rather than by editing it"],
   a:3, why:"A baseline is a reference point, not a lock. The document still changes, but through a controlled, recorded change action, so that every version has a traceable approval behind it."}},

 {id:"M1-06", title:"The three documentation sets", body:[
    P("A baseline is a moment. The **configuration documentation** is what the baseline is made of, and each baseline has its own set, with its own job. Naming them precisely matters, because the audits, the change function and the whole supplier flowdown all cite one set or another."),
    TABLE(["Documentation set", "The question it answers", "What it documents"], [
      ["Functional", "What must the system do, and how will we know it did?", "The system\u2019s functional, performance, interoperability and interface requirements, together with the verifications required to demonstrate those requirements were achieved. It documents the functional baseline, and is typically made up of the contract together with the system or end-item level specification"],
      ["Allocated", "What must this CI do, given what the system must do?", "The CI\u2019s functional, performance and interoperability requirements **allocated down** from the system or a higher-level CI; its interface requirements with the CIs it interfaces to; and the verifications required to demonstrate achievement. It documents the allocated baseline, CI by CI"],
      ["Product", "What is this CI in detail, and what has to be true before we accept one?", "The CI\u2019s detailed design: the physical form, fit and function characteristics, plus the functional and performance requirements selected for production, qualification and acceptance test. It documents the product baseline"]]),
    S("All three carry verification, not just requirements.",
      "Each set describes what is required **and** how achievement is demonstrated. A requirement documented with no stated means of verifying it is a requirement nobody has yet committed to being able to check, and it will be found at the functional audit, which is precisely a walk from requirement to verification evidence."),
    P("The product set is the largest, because it has to be sufficient to build the item, accept it, and support it. Alongside the detailed design it carries:"),
    L([
      "The verifications necessary to accept deliveries: first article and acceptance inspection provisions, including the form, fit, function and quality assurance provisions required to accept the item.",
      "The design of any special tooling, software, equipment and facilities required to manufacture, operate, maintain, calibrate or inspect items in the design.",
      "The design of any special packaging parts required to package the CI.",
      "Any unique process specifications required to manufacture, operate, maintain or calibrate items in the design.",
      "Identification of any commercial hardware or software used in the detailed design.",
      "Where the contract requires it, the technical data giving instructions for installation, operation, maintenance, training and support."]),
    C("The scaling rule", [
      "The design information in the product set can be **as simple as identifying a specific part number, or as complex as full design disclosure.** It scales with the production and procurement strategy, which is the same decision you meet again as documentation determination, where the type follows item maturity, ownership and control level.",
      "For a privately developed CI the obligation is narrow but firm: the product set must at least carry the verification provisions required to accept deliveries. **You may not own the design. You still have to be able to say what an acceptable article looks like.**"]),
    S("A baseline plus its approved changes is the current approved configuration.",
      "The baseline alone is a photograph of a moment that has already passed. What anyone actually builds, tests or audits against is the baseline plus everything approved since."),
    P("Two rules hold the sets together. **Each succeeding baseline traces to its predecessor**, with a detailed extension at each step: system requirements to allocated requirements to detailed design. A product baseline that cannot be traced back to the requirements it satisfies is a design nobody can defend. And **each set identifies any specialized software and the operating environment used to author it**: the same logic that puts the build toolchain under identification. A definition you cannot reopen is a definition you cannot maintain."),
    P("When a change is approved, maintain the documentation by creating a **new revision.** The revision provides traceability by detailing the conditions before and after the change, and it identifies the change as the revision authority. Interface information is incorporated into all three sets as each is developed, in the applicable specifications directly, or through referenced interface documentation.")
  ],
  check:{q:"A colleague says verification requirements belong with the product documentation, since that is where testing gets defined. Where do verifications actually appear?",
   o:[
     "In the product set only: the earlier sets carry requirements, and verification comes later",
     "In all three sets, doing different jobs: demonstrating system requirements, demonstrating the requirements allocated to each CI, and accepting deliveries of a produced article",
     "In the test plans, which sit outside configuration documentation entirely",
     "In the functional set only, since verification is a system-level concern"],
   a:1, why:"Every set pairs requirements with the means of demonstrating them. The functional set carries the verifications for system requirements, the allocated set those for the requirements allocated to a CI, and the product set the first article and acceptance provisions needed to take delivery of an article. Test plans and procedures implement those verification requirements: they do not replace them."}},
 {id:"M1-07", title:"Hardware identifiers", body:[
    P("Hardware identifiers answer different questions. Do not treat them as a checklist that applies in full to every item. Hold on to the question rather than the name and the identifiers stay apart."),
    P("The hardware identity model begins with four questions. The first three identify the design and configuration; the fourth is conditional and is handled in detail in the next section."),
    TABLE(["The question", "The identifier that answers it", "It changes when…", "It is never…"], [
      ["Whose design definition is this?", "Enterprise identifier: the design activity CAGE code", "The design activity changes. Not otherwise", "Omitted. A part number without one is not unique"],
      ["Which managed function is this, and where is its boundary?", "CI identifier", "The management need changes: a new function is designated as a CI, or a CI is split or consolidated", "Assigned to solve a part-numbering problem"],
      ["Which design definition is this built to, and is it interchangeable with that other one?", "Part or identifying number (PIN)", "A modification creates a non-interchangeable condition in form, fit or function", "Changed for a purely administrative reason"]]),
    C("CI identifier and PIN are deliberately different", [
      "The **CI identifier** answers: **What managed function is this, and where is its boundary?** Only a CI has a managed boundary.",
      "The **PIN** answers: **Which design definition is this built to, and is it interchangeable with that other one?** The PIN changes when a modification creates a non-interchangeable condition.",
      "One CI can carry several PINs as variants. One PIN can appear under two different CIs. Both are normal, correct outcomes."]),
    C("CAGE", [
      "CAGE is the Commercial and Government Entity code of the design activity. Combined with the PIN, it makes the item/configuration identification unambiguous because a part number is only unique within the activity that assigned it."]),
    S("Configuration identity is not product-unit identity.",
      "The CI identifier tells you which managed object you have. The PIN tells you which configuration you have. Whether you also need to distinguish individual articles or production populations is a separate product-unit-record decision."),
    P("Serial, lot and batch numbers are introduced here only as the fourth question: **Which physical article or production population must be distinguished?** The next section decides whether the answer is serial, lot/batch, or neither.")
  ],
  check:{q:"A modification makes a hardware configuration non-interchangeable with the previous configuration. Which identifier changes because of that condition?",
   o:[
     "The serial number",
     "The CI identifier",
     "The PIN",
     "The CAGE code"],
   a:2, why:"The PIN identifies the design definition/configuration and changes when a modification creates a non-interchangeable condition. The serial number stays with the individual article, the CI identifier identifies the managed object, and the CAGE code identifies the design activity."}},

 {id:"M1-08", title:"Product-unit record structure", body:[
    P("A PIN tells you which configuration an item is built to. It does not tell you which individual article or production population you are looking at. This section is the test that decides whether the item needs a serial number, lot/batch record, or no independent product-unit record."),
    S("Ask what the approved basis for the item\u2019s continued service depends on.",
      "That one question sorts every item. Apply it to the CI and to each of its component parts. One CI may contain parts of more than one product unit record structure, and that is normal rather than a defect in the assessment."),
    TABLE(["What the approved basis depends on", "The product unit record", "What it looks like"], [
      ["What happened to this individual article", "**Serial number**", "Accumulated cycles or operating hours against an approved life limit, inspection history, or back-to-birth records. Remaining life is a per-unit quantity, so the unit has to be individually identifiable"],
      ["Only that the item was made correctly by an approved source", "**Lot or batch number**", "Lot or batch acceptance is sufficient. Add a date code where a shelf-life, cure-date or storage-age limit applies. Serialization here adds cost without adding assurance, and is a contract choice rather than a technical requirement"],
      ["Material and process provenance", "**Lot or batch at heat level**", "This runs underneath whichever of the above applies, not instead of it. A serialized fracture-critical part still requires its heat and lot chain"],
      ["Configuration identity alone", "**No physical unit identifier**", "Some software and complex electronic hardware carry identity on the loadable part number and the baseline. Do not record these as serialization obligations"],
      ["Nothing at item level", "**No independent unit identifier**", "The item is controlled within its parent CI\u2019s configuration documentation"]]),
    C("The product unit record does not tell you whether an item is critical, and criticality does not tell you the product unit record", [
      "Three separate determinations meet here. Whether the item is a CI. Whether the item is safety-critical. What product unit record it needs. Each has its own test. Run each one, because none of them answers either of the others. The safety-critical determination is the one Module 2 turns into a formal screen, and it is answered against the safety management system rather than against anything on the shop floor.",
      "**Going forward, from criticality to the record.** A critical item does not automatically get a serial number. Most critical items do carry a product unit record, and the test above decides which kind. A part whose approved basis for continued service is a per-unit life clock is serialized. A part accepted on lot conformance to an approved source is lot or batch controlled. **Lot control is not the weak version of serialization.** It is the right answer where the approved basis is conformance to an approved source rather than the history of one article. A nuclear safety-related component accepted under commercial grade dedication is exactly that case, and its failure would be catastrophic. Some critical items carry no product unit record at all, where the hazard is mitigated by design rather than by a per-unit or per-lot control.",
      "**Going backward, from the record to criticality. This is the direction that costs more.** An item carrying a serial number is not thereby critical, and is not thereby a CI. Item unique identification serializes on serially managed, mission essential or controlled inventory status, or on unit acquisition cost. It never looks at criticality. Counterfeit avoidance drives traceability to the original component manufacturer and never looks at criticality either.",
      "**So you cannot read the safety-critical answer off the product unit record, in either direction.** A blank serial field is not evidence the item is not critical. A populated one is not evidence that it is. Run the safety-critical question against the safety management system every time, and let the product unit record-structure test answer its own question.",
      "**What this does not say.** It does not say critical items go unserialized. Most carry a product unit record and many are serialized. It says the record follows the test, not the label."]),
    S("Two clocks, one phrase.",
      "An item life-limited by cycles or operating hours is serialized, because remaining life is a per-unit quantity. An item life-limited by shelf life, cure date or storage age is lot-controlled with a date code, because the limit attaches to the manufacturing lot rather than to the individual unit. The same two words, life limited, produce opposite product unit record structures. Verify which clock is running before you assign anything."),
    P("Four further requirements impose a product unit record on their own, regardless of criticality or CI status. Each is checked separately for every item, because each of them can serialize an item that the test above would not have."),
    L([
      "**Item unique identification.** Triggers on serially managed, mission essential or controlled inventory status, or on unit acquisition cost. It does **not** trigger on criticality, so an item with no criticality designation at all can still be serialized by it.",
      "**Airworthiness limitation marking.** Triggers where a replacement time, inspection interval or related procedure appears in the airworthiness limitations section or the instructions for continued airworthiness. Work from what the limitations section actually contains, not from a criticality label.",
      "**Commercial grade dedication.** Accepts a commercial item against identified critical characteristics on a lot basis.",
      "**Counterfeit avoidance.** Drives traceability to the original component manufacturer rather than to product unit identity. This one is frequently mistaken for a serialization requirement and is not one."]),
    S("Run the test, then run the four drivers.",
      "The test tells you what the item needs. The drivers tell you what somebody else already requires. The answer is the union of the two, and it is recorded per item, not inherited from the CI.")
  ],
  check:{q:"A supplier delivers a connector backshell that arrives serialized. They tell you the serial number establishes that the item is safety-critical, so the safety-critical question is answered. Are they right?",
   o:[
     "Yes. Suppliers serialize on criticality, so the serial number is the evidence",
     "Yes, provided the serial number appears in the technical data package",
     "No. Item unique identification serializes on inventory status and acquisition cost and never looks at criticality. The safety-critical answer still has to come from the safety management system",
     "No. The item must first be designated a CI before the safety-critical question can be answered"],
   a:2, why:"This is the backward direction, and it is the expensive one. A serial number is evidence that something required a product unit record. It is not evidence of what required it. Item unique identification triggers on serially managed, mission essential or controlled inventory status, or on unit acquisition cost, and a low-criticality item can be serialized on cost alone. The reverse error is just as common: a blank serial field is not evidence an item is not critical, because a critical item may be lot-controlled or carry no product unit record at all. The last option inverts the order. The safety-critical question is part of how you decide whether the item is a CI, so it cannot wait until after."}},
 {id:"M1-09", title:"Software identifiers", body:[
    P("Software needs its own identity model because software changes without necessarily changing the physical article that loads it."),
    P("Software asks two primary questions: which software CI is this, and which version is it?"),
    TABLE(["The question", "The identifier that answers it", "The rule"], [
      ["Which software CI is this?", "Software CI identifier", "Every software CI gets one, by the same rule that gives every hardware CI a CI identifier"],
      ["Which version of it is this?", "Version identifier", "Every version is identified. Software changes too easily for the CI identifier alone to say what you have"]]),
    P("Software normally does not receive a physical serial number merely because it is software. Its identity is carried through its software CI identifier, version, and the applicable configuration/baseline records."),
    P("Embedded code is where the hardware and software identity models meet. The control arrangement determines whether the code and device share one configuration representation or have separate identities."),
    CARDS([
      {h:"Embedded, controlled with its device", b:"Where code and the hardware device it lives in are controlled together on a single altered-item drawing, one PIN represents the device **with the code embedded.** The software medium is labeled separately, and the device is marked accordingly. One identity, deliberately: they change together."},
      {h:"Controlled separately", b:"Where the code is managed in its own right, the device carries its PIN and serial, and the code is its own software CI with its own identifier and version identifiers. Two identities, deliberately: they change independently, and each needs its own change and status thread."}], 2),
    S("The control arrangement determines the identity arrangement.",
      "Do not infer separate software identity merely because code exists. Ask whether the code is controlled with the device or in its own right, then apply the corresponding identification model.")
  ],
  check:{q:"Hardware and embedded code are controlled separately. Which identity set is appropriate?",
   o:[
     "Only the hardware PIN; software needs no independent identity",
     "Hardware PIN and serial, plus a software CI identifier and software version",
     "One serial number for the hardware and software together",
     "A new CAGE code for every software version"],
   a:1, why:"When code is managed separately, the device retains its PIN and applicable product-unit identity, while the code has its own software CI identifier and version. The two identities allow their change and status threads to remain independent."}},
 {id:"M1-10", title:"Document identifiers", body:[
    P("Configuration documentation is identified in its own right. The document identifier tells you which document you are looking at; it does not replace the identifier of the configuration the document defines."),
    TABLE(["The question", "The identifier that answers it", "The rule"], [
      ["Whose definition is this?", "Enterprise identifier: the design activity CAGE code", "A document number is only unique within the activity that assigned it, exactly as a part number is"],
      ["Which document is this?", "Document identifier", "Every item of configuration documentation is uniquely identified, so it can be referenced precisely and retrieved"],
      ["Which version of it is this?", "Revision or version identifier", "Every version of every representation is separately identified. A reference without one points at a moving target"]]),
    P("Keep the two identities separate. A drawing/document may define a configuration identified by a CAGE and PIN, while the drawing itself has its own document identifier and revision. The document identity tells you which definition you are reading; the hardware identity tells you which configuration the definition applies to."),
    S("A document identifier identifies the document.",
      "It does not become the CI identifier, PIN, serial number, or lot number simply because the document defines one of those things." )
  ],
  check:{q:"Two released revisions of the same configuration document are being compared. Which identifier distinguishes the specific version being used?",
   o:[
     "The CI identifier",
     "The PIN",
     "The revision or version identifier",
     "The serial number"],
   a:2, why:"The document identifier identifies which document it is. The revision or version identifier identifies which released version of that document is being used. CI and PIN identify the configuration, not the document revision."}},

 {id:"M1-11", title:"Process ownership: who owns what", body:[
    P("Four processes govern this work. Each one owns something. Each one defers to the others for everything it does not own. Knowing which is which saves a great deal of time."),
    TABLE(["Process", "Owns", "Answers"], [
      ["CI identification", "What a CI is, the CI structure, the interface register, identifiers and documentation sets", "Is this a CI? At what level? What documentation defines it? Which boundaries exist?"],
      ["Configuration audit", "The two audits, audit designation, the readiness checklists and the two check sets", "Does this CI get an audit? Which one? What has to be true first? What is examined?"],
      ["Sub-supplier CM flowdown", "The nine work types and their audit roles, the requirement sets, the standing conditional audit clause, effectiveness determinations", "What does this supplier owe? What is their audit role? How do we know their CM works?"],
      ["Safety management system", "Hazard analysis, risk controls, and which CM requirements are mandatory for safety", "Which requirements are mandatory for safety, and what happens if one is not performed?"]]),
    C("Three rules that follow from this", [
      "**Each process references the others by plain name, not by number.** Document numbers change. Names do not. You will see the audit designation assessment, not an appendix letter.",
      "**Where two processes cover the same ground, the owner governs.** The audit process restates the supplier work types and their audit roles. The flowdown process owns them, so the flowdown process wins.",
      "**Definitions are used as written.** A term defined in the process that owns it is carried word for word everywhere else, with the plain explanation underneath rather than instead."]),
    S("If you do not know which process answers your question, the question is usually about ownership rather than about the answer.",
      "Find the owner first. The answer is normally already written, and arguing it from scratch is how two processes end up disagreeing.")
  ],
  check:{q:"The configuration audit process and the sub-supplier CM flowdown process both describe the supplier work types and their audit roles. The two descriptions no longer match. Which one governs, and what happens to the other?",
   o:[
     "The audit process, because the question is about audits",
     "The flowdown process, because it owns the work types and their audit roles. The audit process only restates them, so the restatement is what gets corrected",
     "Whichever process was revised most recently",
     "Neither. Raise it to the program CM plan and let the plan settle it"],
   a:1, why:"Where two processes cover the same ground, the owner governs. The flowdown process owns the work types and their audit roles, so the conflict resolves in its favor and the restatement is brought back into line rather than argued with. Recency is not the test, because a recently revised restatement is still a restatement. The program CM plan records how CM is performed on one program and does not arbitrate between enterprise processes. The habit this section is really teaching is the one it closes on: when you do not know which process answers a question, the question is usually about ownership rather than about the answer."}},

 {id:"M1-12", title:"Why CI identification and CM flowdown belong together", body:[
    P("You have the definition of a CI now. This is where it starts earning its keep."),
    P("This course teaches two things. Modules 1 to 3 are about identifying CIs. Modules 4 to 7 are about flowing configuration management requirements to suppliers. On a course outline they look like two subjects. They are not."),
    S("A supplier flowdown is a set of CI decisions written into a contract.",
      "Almost every question the flowdown modules ask you to answer turns on a fact the identification modules produce. If the CI facts are missing, the flowdown still gets written. It just gets written wrong, and the error is discovered at delivery."),
    P("Here is where the dependency actually bites:"),
    L([
      "**What you are buying.** The first question in any flowdown is whether the procured item is a CI, contains one, or is a part inside somebody else\u2019s CI. That answer comes from CI screening. Get it wrong and every requirement downstream is aimed at the wrong thing.",
      "**What goes in the statement of work.** CI identifiers are cited in it. So are the **part attribute designations**: safety-critical, life-limited and special handling. Those are a separate decision from CI selection and they reach parts that are not CIs at all, so a buyer who only knows the CI answer still does not know what to cite.",
      "**Whether audits apply.** Audit designation attaches to certain CIs. A buyer who does not know whether the procured item is a CI designated for audit cannot tell whether audit obligations belong in the contract, and cannot price them.",
      "**What reconciliation means.** Reconciliation compares as-built configuration against released design for a CI. Without knowing which CI, there is nothing to compare against.",
      "**What comes back at receipt.** Traceability records are per unit, tied to the CI and its next higher assembly. A receiver who cannot answer \u201cwhich CI is this part of\u201d cannot check the record.",
      "**Sub-tier items.** An item a sub-supplier develops is a CI from your company\u2019s point of view. Recognizing that is a CI judgment, and it is what triggers recursive flowdown."]),
    C("The failure runs in both directions", [
      "Flowdown without CI knowledge produces contracts that impose the wrong requirements on the wrong items, and leave out the ones that mattered.",
      "CI work without flowdown knowledge produces designations nobody can support. Designate a CI at a level your supplier cannot report against, and you have created an obligation that will be missed every month for the life of the program.",
      "**This is why these are one course and not two.** Take the flowdown modules without the identification modules and you will write plausible contracts that buy the wrong things."])
  ],
  check:{q:"A buyer classifies a procurement correctly by work type, negotiates it well, and releases it. Nobody involved knew that the procured assembly is a Configuration Item designated for audit. What is the most likely consequence?",
   o:[
     "None of substance, provided the work type classification was right",
     "The CI identifiers, the audit provisions and the reconciliation requirements are all missing or aimed at nothing, because each of them depends on knowing which CI is being bought",
     "The supplier will identify the gap and raise it during negotiation",
     "The gap is corrected automatically at first article inspection"],
   a:1, why:"Work type tells you what the supplier does. It does not tell you what the item is. The requirements that depend on CI identity are precisely the ones that go missing: which CI the identifiers cite, whether audit obligations apply, what the as-built gets reconciled against, and what traceability records must contain. Suppliers price what they are asked for, so nobody raises the omission."}},

 {id:"M1-13", title:"Requirements mandatory for safety", body:[
    P("Some CM requirements are not the contract\u2019s to give away. On safety-significant product lines a defined set of roughly forty-four discrete requirements is performed regardless of what the contract flows down. The set is called requirements mandatory for safety. This section is where that set comes from. The next section is what a program does when it wants to skip one."),
    P("The set is not a list someone thought prudent. Every requirement on it traces to one of sixteen barriers. Every barrier is anchored to a documented aerospace event in which that barrier\u2019s failure killed people or destroyed the product. The set is the deduplicated list of requirements those sixteen barriers rest on."),
    P("The obligation reaches you down two separate pathways:"),
    CARDS([
      {h:"The contract pathway", b:"Binds where clauses are flowed. If the contract invokes a CM requirement, it is contractually obligated; if the contract is silent, it is not. This pathway is real, and it is the only one many engineers are taught to see."},
      {h:"The safety pathway", b:"The organization adopted a safety management system, which names specific hazards: inaccurate build data, unmanaged change, non-conformance, interface failures, and requires them controlled. Where a CM requirement is the control for a named hazard, the activity is obligated regardless of the contract. The only open question is which label the organization puts on it."}], 2),
    S("Omitting a barrier because the contract is silent is a catastrophic-or-severe risk-acceptance decision: made by omission, at the wrong altitude.",
      "Somebody accepts that risk either way. The gate in the next section exists so it is accepted knowingly, by the person whose signature the severity actually requires."),
    P("The sixteen barriers fall into four clusters, and the shape of this course follows them:"),
    L([
      "**Hazard identification and critical-item recognition**: declaring, at CM level, which items can kill, so that everything downstream treats them accordingly.",
      "**Change discipline and impact assessment**: classifying every change, assessing its full impact, and routing safety-affecting changes to the right approval authority.",
      "**As-designed-to-as-built reconciliation**: keeping the record of what was actually built, unit by unit, true for the life of the product.",
      "**Supply chain, interfaces, and verification**: holding the disciplines together across organizational boundaries, where they are weakest."]),
    P("Three of the anchor events, briefly:"),
    CARDS([
      {h:"Alaska Airlines 261: 2000", b:"A horizontal stabilizer jackscrew assembly whose criticality was under-recognized, and whose as-maintained condition drifted over years of service. 88 dead. The barrier: formally identify as critical any item whose failure can cause loss of life, so the system has a structural defense against under-recognized criticality."},
      {h:"Challenger: 1986", b:"A criticality reclassification that stale paperwork failed to propagate to the people making launch decisions, and a waiver approved through an abbreviated process. 7 dead. The barrier: change classification discipline, and approval authority matched to what the change actually touches."},
      {h:"Mars Climate Orbiter: 1999", b:"Two teams, one interface, two unit systems, no controlled interface definition catching the mismatch. A $327M spacecraft flown into the atmosphere. The barrier: interface requirements identified, documented, and controlled across every boundary."}]),
    P("Across the sixteen documented events the fatality count exceeds 880, and thirteen of the sixteen barriers are anchored at the catastrophic level. The barriers are not theoretical, and the requirement set built on them is not bureaucracy: it is the accumulated accident record, converted into requirements.")
  ],
  check:{q:"A CM requirement is not flowed down by the contract. It is also the control for a hazard the safety management system names. What is its status on a safety-significant product line?",
   o:[
     "Not obligated. The contract defines what is performed",
     "Obligated through the safety pathway. The contract pathway is silent, and the safety pathway binds anyway",
     "Obligated only if the Acquirer agrees to fund it",
     "Obligated only after the hazard is re-assessed for this program"],
   a:1, why:"Two pathways run in parallel. The contract pathway binds where clauses are flowed. The safety pathway binds where a CM requirement is the control for a hazard the safety management system names, and that pathway does not run through the contract at all. Contract silence removes the contractual obligation. It does not remove the hazard. The Acquirer cannot waive an obligation that was never theirs, and the severity behind the barrier is fixed rather than re-rated program by program."}},

 {id:"M1-14", title:"The safety disposition gate", body:[
    P("The previous section established that the safety pathway binds. This section is what happens when a program wants to not perform one of these requirements."),
    S("Contract silence removes the contractual obligation. It does not remove the hazard the requirement controls.",
      "So the question is never whether the requirement is obligated. The question is which door the program walks through, and who signs."),
    P("These requirements enter the process at exactly one point. That point is tailoring, the moment a program decides which CM requirements it will and will not perform. It re-enters at every CM plan revision. When a program proposes not to perform a requirement, the gate runs:"),
    STEPS([
      {h:"Step 1: the safety check", b:"Is the requirement mandatory for safety? If no, normal tailoring applies and the program proceeds at its discretion. If yes, it cannot be dropped silently: continue."},
      {h:"Step 2: choose a door", b:"Exactly three dispositions exist. **Perform** the requirement. **Replace** it with a documented equivalent control, validated independently by CM and Safety Assurance against the hazard it controls, not by the program that proposed it. Or **risk-accept** its absence formally, at the authority the safety management system names. **Catastrophic and severe both route to the accountable executive. Neither routes lower.**"},
      {h:"Step 3: set the health check", b:"For performed and equivalent items, record how the barrier\u2019s continued effectiveness will be monitored over the program life. A barrier must be present and kept effective: a degraded barrier is a finding, not a pass."}]),
    S("There is no fourth door.",
      "Silent omission is the failure mode the gate exists to close. Because risk acceptance is visible, routes upward, and cannot be scored down, the expected default for most of these requirements is \u201cperform.\u201d"),
    C("Severity is looked up, not re-rated", [
      "Each of these requirements carries a severity assigned by the barrier safety case, and that assignment is fixed. At tailoring it is **looked up, never re-assessed.** This removes the one incentive that reliably corrupts these decisions: rating a barrier\u2019s absence low so the acceptance stays at a comfortable altitude.",
      "The program does not get to decide how dangerous the barrier\u2019s absence would be. That question was answered when the barrier was established, by people with no tailoring decision in front of them."]),
    P("Every disposition lands in a per-program compliance record: one structured, queryable row per safety-mandatory requirement, carrying the disposition, the evidence or risk-acceptance reference, the health check method and schedule, and the sign-off. The record is queryable on purpose: the coverage measures are computed from it, and **records that cannot be queried cannot be measured.**"),
    C("How coverage is measured", [
      "Two numbers, reported together and never combined. A severity-weighted coverage percentage gives the trend and rewards closing the deadliest gaps first. Alongside it, a plain **count** of open top-band items, target zero, never averaged into anything.",
      "The count exists because a single open catastrophic barrier must not be able to hide behind a 96% number. And the share of coverage achieved by risk acceptance rather than performance is reported separately, so a high coverage figure is never misread as a safe portfolio."], "teal")
  ],
  check:{q:"A program proposes not to perform a requirement mandatory for safety, pointing out that the contract does not flow it down. What are its options?",
   o:[
     "Drop it with a recorded rationale: the contract governs what is performed",
     "Perform it, replace it with an independently validated equivalent control, or obtain formal risk acceptance at the severity-matched authority: contract silence changes nothing",
     "Obtain Acquirer approval to omit it",
     "Re-rate the severity for this program and tailor accordingly"],
   a:1, why:"These requirements are obligated through the safety pathway, so a silent contract is beside the point. The three doors are exhaustive. The severity is pre-anchored and cannot be re-rated, and catastrophic and severe both route to the accountable executive. The Acquirer has no standing in it: the obligation was never theirs to waive. Neither CM nor the program manager can sign this one off alone."}}, ],
 exercises:[
 {id:"M1-E1", title:"Exercise 1: Identifiers",
  scen:"Unit serial 0047 of a designated CI is modified in service. The modification changes the mounting flange pattern, so the item can no longer be installed in place of an unmodified unit.",
  parts:[
   {id:"a", q:"Does the PIN change? Does the serial number? Does the CI identifier? Give the reason for each."},
   {id:"b", q:"Name three records that must be updated as a result."}
  ]},
 {id:"M1-E2", title:"Exercise 2: Identifiers under a firmware change",
  scen:"A designated CI is a controller with embedded firmware. The hardware device and its code are controlled together on a single altered-item drawing. A defect is corrected in the code; the hardware is untouched, and the corrected units cannot be installed alongside uncorrected ones in the same system.",
  parts:[
   {id:"a", q:"Under this control arrangement, how many part numbers represent the device, and what does the part number now stand for?"},
   {id:"b", q:"What happens to the part number, and what happens to the serial numbers of units that are reworked to the new code?"},
   {id:"c", q:"The program is considering controlling the code separately from the device on future builds. What would change about the identifiers, and what would you gain and lose?"},
   {id:"d", q:"Whichever arrangement is used, what identification does every version of the code itself require?"}
  ]},
 {id:"M1-E3", title:"Exercise 3: The three documentation sets",
  scen:"An avionics processing unit is a designated CI on a performance-based contract, approaching preliminary design review. It contains a commercially procured processor module. Accepting a delivered unit requires a special calibration fixture that does not exist yet. The unit is life-limited.",
  parts:[
   {id:"a", q:"Which requirements belong in the allocated documentation for this CI, and which stay at system level in the functional documentation? Give one concrete example of each."},
   {id:"b", q:"The calibration fixture is needed to inspect the item at acceptance. Where is its design documented, and under which baseline?"},
   {id:"c", q:"The processor module is commercial and the supplier will not release its internals. What must the product documentation still say about it?"},
   {id:"d", q:"The contract is performance-based and requires no design disclosure. What does that change about the product documentation, and what does it not change?"},
   {id:"e", q:"Eight months after the product baseline is established, a change is approved. What happens to the documentation, and what must the new revision be able to show?"},
   {id:"f", q:"Where does verification appear across the three sets? Name what each set\u2019s verification content is for."}
  ]},
 {id:"M1-E4", title:"Exercise 4: The safety disposition gate",
  scen:"A program is tailoring its CM requirements at the start of a safety-significant development. It proposes not to perform a requirement that turns out to be mandatory for safety, on the grounds that the contract does not flow it down and the schedule is tight. The item\u2019s pre-anchored severity is catastrophic.",
  parts:[
   {id:"a", q:"Walk the gate. What is the first thing you establish, and what are the program\u2019s options once you have established it?"},
   {id:"b", q:"The program offers an alternative control it says achieves the same thing. Who decides whether that is true, and against what?"},
   {id:"c", q:"The alternative is not accepted, and the program still wants to proceed. Who signs, and at what level? What would change if the severity had been severe rather than catastrophic?"},
   {id:"d", q:"A colleague suggests re-rating the severity for this program, arguing the design makes the hazard less likely here. How do you answer?"},
   {id:"e", q:"The requirement is performed after all. What still has to be recorded about that decision, and what has to be recorded about keeping the barrier effective for the rest of the program?"}
  ]}
 ]
},
{
 id:"M2", label:"Module 2", title:"Selecting Configuration Items", sub:"Where candidates come from, what CM reads to nominate them, and the gates and criteria that decide",
 sections:[
 {id:"M2-01", title:"What a Configuration Item is", body:[
    P("Module 1 introduced the definition. Here it is again, in full, because every section of this module is a way of applying it. Use it as written."),
    C("Configuration Item (CI)", [
      "Any hardware, software, firmware, or aggregation thereof that satisfies a system end-use function and is designated for separate configuration management. Designation includes establishing the CI\u2019s requirements and verifying that its configuration meets those requirements and that its configuration documentation accurately describes its configuration."]),
    P("Three parts of the first sentence carry weight. Take them one at a time."),
    L([
      "**Any hardware, software, firmware, or aggregation thereof.** A CI is a thing. It is not a function, a task, a failure mode, a feature or a location. **Aggregation** matters: a CI can be a single part or an assembly of thousands, and the word is what allows a CI to sit at any level of the product structure.",
      "**Satisfies a system end-use function.** This is the gate. The candidate has to do a job the system needs. Raw material does not. A bulk commodity does not. A structural element with no defined functional role does not. Nothing that fails here reaches the criteria.",
      "**Is designated for separate configuration management.** This is the screen. Designation is a decision a person makes and records. Nothing becomes a CI by being important, by being expensive, or by being obvious to everyone on the program."]),
    P("The second sentence is the part people skip. It says what designation actually obliges. Three things, for the life of the item:"),
    L([
      "Establish the CI\u2019s requirements.",
      "Verify that the CI\u2019s configuration meets those requirements.",
      "Verify that the CI\u2019s configuration documentation accurately describes its configuration."]),
    S("Designation is not a filing act. It is a commitment.",
      "Those three obligations run for as long as the item exists. That is why over-designation is expensive rather than merely cautious, and it is why the screen in this module exists at all."),
    S("Items that are not CIs are not uncontrolled. They are controlled within their parent CI\u2019s configuration documentation.",
      "The question is never \u201ccontrolled or not.\u201d It is \u201ccontrolled at what level, with what independence.\u201d"),
    C("What the rest of this module does", [
      "**Sections M2-02 to M2-07 are about finding candidates.** Where they come from, and how CM reads specifications, FMECAs, hazard analyses and engineering drawings to nominate them.",
      "**Sections M2-08 to M2-15 are about deciding.** Three qualifying gates, then a seven-criteria screen, then the part designations that answer parts of the screen for you.",
      "Nomination and screening are separate steps, and this module keeps them separate on purpose. A candidate you never wrote down cannot be rejected on the record."])
  ],
  check:{q:"A program lead says a bracket is obviously a CI, because it is critical to structural integrity and everybody on the program knows it matters. What is missing from that statement?",
   o:[
     "Nothing. Criticality is sufficient, and the screen exists to confirm it",
     "Designation. A CI is designated for separate configuration management on the record, and designation commits the program to establishing the item\u2019s requirements, verifying its configuration against them, and verifying its documentation describes it",
     "A part number. Nothing can be designated before it has one",
     "Acquirer approval. Only the Acquirer designates CIs"],
