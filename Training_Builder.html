<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Builder</title>
<style>
:root{
  color-scheme:light;
  --ink:#1E262E; --ink-2:#2C3841; --slate:#5C6D78; --mute:#8998A2;
  --paper:#FFFFFF; --surface:#F4F6F7; --surface-2:#EDF0F1; --rule:#D6DCDF;
  --rust:#A8481F; --rust-soft:#F2E4DD; --rust-ink:#7E340F;
  --teal:#1F5F5B; --teal-soft:#DFEAE8;
  --amber:#9A6508; --amber-soft:#F6ECD8;
  --alert:#8E2F2F; --alert-soft:#F4E2E2;
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--surface);font-size:14px;line-height:1.5;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- top bar ---------- */
.top{flex:0 0 56px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #000;z-index:20}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;margin-right:6px}
.brand b{font-family:var(--serif);font-size:16px;white-space:nowrap}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#93A2AB;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.spacer{flex:1}
.tbtn{background:transparent;border:1px solid #46545F;color:#DCE3E7;border-radius:4px;padding:6px 11px;font-size:12.5px;white-space:nowrap}
.tbtn:hover{background:#2C3841;border-color:#5E6D77}
.tbtn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.tbtn.pri{background:var(--rust);border-color:var(--rust);color:#fff;font-weight:600}
.tbtn.pri:hover{background:var(--rust-ink)}
.tbtn[disabled]{opacity:.35;cursor:default}
.tbtn .badge{display:inline-block;min-width:17px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--alert);color:#fff;font-size:11px;font-weight:700;text-align:center}
.tbtn .badge.ok{background:var(--teal)}
.sep{width:1px;height:26px;background:#3D4B55;margin:0 2px}

/* ---------- workspace ---------- */
.work{flex:1;min-height:0;display:grid;grid-template-columns:290px minmax(440px,1fr) minmax(380px,1fr)}
body.nopv .work{grid-template-columns:290px 1fr}
body.nopv .preview{display:none}
.outline{background:var(--paper);border-right:1px solid var(--rule);overflow-y:auto;padding-bottom:40px}
.editor{overflow-y:auto;min-width:0}
.preview{border-left:1px solid var(--rule);display:flex;flex-direction:column;min-width:0;background:var(--surface-2)}
.pvbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--rule);background:var(--paper)}
.pvbar b{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust);flex:1}
.pvbar label{font-size:12px;color:var(--slate);display:flex;align-items:center;gap:5px}
.preview iframe{flex:1;width:100%;border:0;background:#fff}

/* ---------- outline ---------- */
.oh{padding:14px 16px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);font-weight:700}
.oitem{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:6px 12px 6px 13px;line-height:1.3}
.oitem:hover{background:var(--surface)}
.oitem.on{background:var(--surface-2);border-left-color:var(--rust)}
.oitem .id{font-family:var(--mono);font-size:10.5px;color:var(--mute);flex:0 0 50px;padding-top:1px}
.oitem.on .id{color:var(--rust-ink)}
.oitem .nm{flex:1;font-size:13px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis}
.oitem.on .nm{font-weight:600}
.oitem .ct{font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.oitem.mod{padding-top:9px;padding-bottom:9px;border-top:1px solid var(--rule);margin-top:6px}
.oitem.mod .nm{font-weight:700;color:var(--ink)}
.oitem.sub{padding-left:26px}
.oitem .warnDot{width:7px;height:7px;border-radius:50%;background:var(--alert);flex:0 0 7px;margin-top:5px}
.oadd{display:block;margin:4px 12px 4px 26px;background:none;border:1px dashed var(--rule);color:var(--slate);border-radius:4px;padding:4px 8px;font-size:12px;text-align:left;width:calc(100% - 38px)}
.oadd:hover{border-color:var(--rust);color:var(--rust-ink)}
.oadd.big{margin:14px 12px;width:calc(100% - 24px);padding:8px;text-align:center;font-weight:600}

/* ---------- editor ---------- */
.ed{max-width:900px;margin:0 auto;padding:26px 28px 120px}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.recid{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--rust-ink);background:var(--rust-soft);padding:3px 8px;border-radius:3px;font-weight:700}
.status{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
h1.et{font-family:var(--serif);font-size:27px;line-height:1.2;margin:0 0 6px}
.lede{color:var(--slate);margin:0 0 16px;font-size:14px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:5px;padding:7px 13px;font-size:13px;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.pri:hover{background:var(--rust-ink)}
.btn.sm{padding:4px 9px;font-size:12px;font-weight:600}
.btn.dan{color:var(--alert)}
.btn.dan.armed{background:var(--alert);border-color:var(--alert);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:7px;margin:0 0 18px}
.panel>.ph{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--surface-2);border-radius:7px 7px 0 0}
.panel>.ph b{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);flex:1}
.panel>.pb{padding:14px 16px}
.fld{margin:0 0 13px}
.fld:last-child{margin-bottom:0}
.fld>label,.fld>.lb{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.fld .help{font-size:12px;color:var(--slate);margin-top:3px}
.fld input[type=text],.fld input[type=email],.fld input[type=url],.fld input[type=number],.fld input[type=date],.fld textarea,.fld select,.cell{
  width:100%;border:1px solid var(--rule);border-radius:5px;padding:7px 9px;background:#fff;font-size:13.5px;line-height:1.45}
.fld textarea,.cell{resize:vertical;min-height:38px}
.fld input:focus,.fld textarea:focus,.fld select:focus,.cell:focus{outline:2px solid var(--rust);outline-offset:0;border-color:var(--rust)}
.mono{font-family:var(--mono)!important;font-size:12.5px!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.rowk{display:grid;grid-template-columns:150px 1fr;gap:12px}
.ck{display:flex;align-items:center;gap:8px;font-size:13px}
.ck input{accent-color:var(--rust);width:16px;height:16px}

/* blocks */
.blk{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--mute);border-radius:6px;margin:0 0 12px}
.blk.focus{border-left-color:var(--rust)}
.blk .bh{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--rule);background:var(--surface)}
.blk .bh .ty{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate);font-weight:700;flex:1}
.ib{border:1px solid transparent;background:none;border-radius:4px;width:28px;height:26px;font-size:13px;color:var(--slate);display:inline-flex;align-items:center;justify-content:center;padding:0}
.ib:hover{background:var(--surface-2);border-color:var(--rule);color:var(--ink)}
.ib.x:hover{color:var(--alert);border-color:#E8CFCF;background:var(--alert-soft)}
.ib[disabled]{opacity:.3;cursor:default}
.blk .bb{padding:12px}
.palette{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border:1px dashed #AEB9BF;border-radius:6px;background:transparent;margin:6px 0 0}
.palette .pl{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate);width:100%;margin-bottom:2px}
.palette button{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:5px 10px;font-size:12.5px}
.palette button:hover{border-color:var(--rust);color:var(--rust-ink);background:var(--rust-soft)}
.ins{display:flex;justify-content:center;margin:-6px 0 6px;opacity:0;transition:.12s}
.ins:hover,.ins:focus-within{opacity:1}
.ins button{border:1px dashed var(--rule);background:var(--paper);border-radius:10px;padding:0 10px;font-size:11px;color:var(--slate);line-height:18px}
.rl{border:1px solid var(--rule);border-radius:6px;background:var(--surface);padding:8px;margin:0 0 8px}
.ri{display:flex;gap:8px;align-items:flex-start;background:var(--paper);border:1px solid var(--rule);border-radius:5px;padding:8px;margin:0 0 6px}
.ri .rb{flex:1;min-width:0}
.ri .rc{display:flex;flex-direction:column;gap:2px}
.ri .rn{font-family:var(--mono);font-size:11px;color:var(--mute);padding-top:7px;min-width:18px;text-align:right}
.addrow{border:1px dashed #AEB9BF;background:var(--paper);border-radius:4px;padding:5px 10px;font-size:12.5px;color:var(--slate)}
.addrow:hover{border-color:var(--rust);color:var(--rust-ink)}
.tgrid{overflow-x:auto}
.tgrid table{border-collapse:collapse;width:100%}
.tgrid td{padding:3px;vertical-align:top}
.tgrid td.ctl{width:34px;text-align:center}
.tgrid .cell{min-height:34px;font-size:13px;padding:5px 7px}
.tgrid thead .cell{font-weight:700;background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{font-family:var(--mono);font-size:11.5px;border:1px solid var(--rule);background:#fff;border-radius:4px;padding:4px 9px;font-weight:700}
.chipb:hover{border-color:var(--rust)}
.chipb.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chipb.none.on{background:var(--ink-2);border-color:var(--ink-2)}
.opt{display:flex;gap:8px;align-items:flex-start;margin:0 0 7px;padding:7px;border:1px solid var(--rule);border-radius:5px;background:#fff}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt .rad{display:flex;flex-direction:column;align-items:center;gap:1px;padding-top:6px;min-width:52px}
.opt .rad input{accent-color:var(--teal);width:16px;height:16px;margin:0}
.opt .rad span{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.opt.right .rad span{color:var(--teal);font-weight:700}
.opt textarea{flex:1;border:1px solid var(--rule);border-radius:5px;padding:7px 9px;background:#fff;font-size:13.5px;line-height:1.45;resize:vertical;min-height:38px}
.opt textarea:focus{outline:2px solid var(--rust);outline-offset:0;border-color:var(--rust)}
.thumb{max-width:220px;max-height:140px;border:1px solid var(--rule);border-radius:5px;display:block;margin:0 0 8px;background:#fff}
.hint{font-size:12.5px;color:var(--slate);background:var(--surface-2);border-radius:5px;padding:8px 11px;margin:0 0 16px}
.hint code,.kbd{font-family:var(--mono);font-size:11.5px;background:#fff;border:1px solid var(--rule);border-radius:3px;padding:0 4px}
.warnbox{background:var(--amber-soft);border:1px solid #E4D3AE;border-radius:5px;padding:10px 13px;font-size:13px;margin:0 0 14px}
.errbox{background:var(--alert-soft);border:1px solid #E8CFCF;border-radius:5px;padding:10px 13px;font-size:13px;margin:0 0 14px}
.okbox{background:var(--teal-soft);border:1px solid #CBDDDA;border-radius:5px;padding:10px 13px;font-size:13px;margin:0 0 14px}
.fmtbar{display:flex;gap:4px;align-items:center}
.fmtbar button{width:28px;height:26px;border:1px solid #46545F;background:transparent;color:#DCE3E7;border-radius:4px;padding:0}
.fmtbar button:hover{background:#2C3841}
.dec-ctl{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
.dec-l{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--slate);font-weight:600}
.dec-l select{border:1px solid var(--rule);border-radius:4px;padding:3px 5px;font-size:12.5px;max-width:220px;background:#fff}
.dec-l.ck input{width:15px;height:15px;accent-color:var(--rust)}
.mini{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin:14px 0 6px;font-weight:700}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,26,31,.55);display:none;align-items:flex-start;justify-content:center;z-index:80;padding:60px 16px;overflow-y:auto}
.modal.show{display:flex}
.mbox{background:var(--paper);border-radius:8px;max-width:720px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mbox .mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--rule)}
.mbox .mh h2{margin:0;font-family:var(--serif);font-size:20px;flex:1}
.mbox .mb{padding:16px 18px 20px}
.issue{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--rule);border-radius:5px;margin:0 0 6px;cursor:pointer;background:#fff;width:100%;text-align:left}
.issue:hover{background:var(--surface)}
.issue .lv{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:3px;flex:0 0 auto}
.issue .lv.err{background:var(--alert-soft);color:var(--alert)}
.issue .lv.warn{background:var(--amber-soft);color:var(--amber)}
.issue .lv.info{background:var(--teal-soft);color:var(--teal)}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:#fff;border-radius:6px;padding:12px 14px;margin:0 0 8px}
.choice:hover{border-color:var(--rust);background:var(--rust-soft)}
.choice b{display:block;font-size:14.5px;margin-bottom:2px}
.choice span{font-size:13px;color:var(--slate)}
.dist{display:flex;gap:6px;align-items:flex-end;height:60px;margin:6px 0}
.dist div{flex:1;background:var(--teal-soft);border:1px solid #CBDDDA;border-radius:3px 3px 0 0;position:relative;min-height:3px}
.dist div span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:11px;color:var(--teal)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:5px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.drop{position:fixed;inset:0;background:rgba(168,72,31,.12);border:3px dashed var(--rust);display:none;align-items:center;justify-content:center;z-index:70;font-family:var(--serif);font-size:24px;color:var(--rust-ink)}
.drop.show{display:flex}
body.resmode #bCmp{display:none}
@media(max-width:1180px){ .work{grid-template-columns:250px minmax(400px,1fr) minmax(320px,.8fr)} .lng{display:none} }
@media(max-width:980px){ body:not(.pvforce) .work{grid-template-columns:230px 1fr} body:not(.pvforce) .preview{display:none} .brand span{display:none} }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><b>Training Builder</b><span id="docName">untitled</span></div>
  <button class="tbtn" id="bNew" title="Start a new training">New</button>
  <button class="tbtn" id="bOpen" title="Open a training .html file or a draft .json file">Open…</button>
  <button class="tbtn edonly" id="bDraft" title="Download the work in progress as a draft file">Save draft</button>
  <div class="sep edonly"></div>
  <button class="tbtn edonly" id="bUndo" title="Undo (Ctrl+Z)">↶<span class="lng"> Undo</span></button>
  <button class="tbtn edonly" id="bRedo" title="Redo (Ctrl+Y)">↷<span class="lng"> Redo</span></button>
  <div class="sep edonly"></div>
  <div class="fmtbar edonly" title="Formatting for the text box you are typing in">
    <button id="fB" title="Bold (Ctrl+B)"><b>B</b></button>
    <button id="fI" title="Italic (Ctrl+I)"><i>I</i></button>
  </div>
  <div class="spacer"></div>
  <button class="tbtn" id="bCmp" title="Compare this training with an older revision and draft the revision log">Compare…</button>
  <button class="tbtn" id="bRes" title="Load trainee files, see scores, grade written answers, and sign off">Results</button>
  <button class="tbtn edonly" id="bPrint" title="Make a printable handout or a trainer answer key">Print…</button>
  <button class="tbtn edonly" id="bHealth" title="Check the training for problems">Health check<span class="badge ok" id="hBadge">0</span></button>
  <button class="tbtn edonly" id="bPv" title="Show or hide the live preview">Preview</button>
  <button class="tbtn pri edonly" id="bExport" title="Download the finished training as one .html file">Export training</button>
  <input type="file" id="fileIn" accept=".html,.htm,.json,text/html,application/json" hidden>
  <input type="file" id="imgIn" accept="image/*" hidden>
  <input type="file" id="cmpIn" accept=".html,.htm,.json,text/html,application/json" hidden>
  <input type="file" id="resIn" accept=".json,.html,.htm,application/json,text/html" multiple hidden>
</header>

<div class="work">
  <nav class="outline" id="outline" aria-label="Course outline"></nav>
  <main class="editor" id="editor"></main>
  <aside class="preview" id="preview">
    <div class="pvbar"><b>Live preview</b>
      <label><input type="checkbox" id="pvTrainer"> Trainer view</label>
      <button class="btn sm" id="pvTab" title="Open the full training in a new tab">Open in tab</button>
    </div>
    <iframe id="pvFrame" title="Live preview of the training"></iframe>
  </aside>
</div>
<section class="results" id="results" aria-label="Results"></section>
<section class="compare" id="compare" aria-label="Revision comparison"></section>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="mbox"><div class="mh"><h2 id="mTitle"></h2><button class="ib x" id="mClose" aria-label="Close">✕</button></div><div class="mb" id="mBody"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="drop" id="drop">Drop files here</div>

<script type="text/plain" id="tplCss">:root{
  --ink:#1E262E; --ink-2:#2C3841; --slate:#5C6D78; --mute:#8998A2;
  --paper:#FFFFFF; --surface:#F4F6F7; --surface-2:#EDF0F1; --rule:#D6DCDF;
  --rust:#A8481F; --rust-soft:#F2E4DD; --rust-ink:#7E340F;
  --teal:#1F5F5B; --teal-soft:#DFEAE8;
  --amber:#9A6508; --amber-soft:#F6ECD8;
  --alert:#8E2F2F; --alert-soft:#F4E2E2;
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --rail:290px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--surface);
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- header ---------- */
.top{
  position:sticky; top:0; z-index:40; background:var(--ink); color:#fff;
  display:flex; align-items:center; gap:16px; padding:0 20px; height:60px;
  border-bottom:1px solid #000;
}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#93A2AB}
.top .spacer{flex:1}
.who{display:flex;align-items:center;gap:8px}
.who label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#93A2AB}
.who input{
  background:#2C3841;border:1px solid #3D4B55;color:#fff;border-radius:4px;
  padding:6px 10px;font-size:13px;width:180px;
}
.who input:focus{outline:2px solid var(--rust);outline-offset:1px}
.tbtn{
  background:transparent;border:1px solid #46545F;color:#DCE3E7;border-radius:4px;
  padding:7px 12px;font-size:12.5px;white-space:nowrap;
}
.tbtn:hover{background:#2C3841;border-color:#5E6D77}
.tbtn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.tbtn.danger{border-color:#7A4A3A;color:#EBCDC2}
.tbtn.danger:hover{background:#4A2E26;border-color:#A85D45}
.tbtn.danger.armed{background:var(--rust);border-color:var(--rust);color:#fff;font-weight:600}
.railtoggle{display:none}

/* ---------- shell ---------- */
.shell{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto}
.rail{
  width:var(--rail); flex:0 0 var(--rail); background:var(--paper);
  border-right:1px solid var(--rule); min-height:calc(100vh - 60px);
  position:sticky; top:60px; max-height:calc(100vh - 60px); overflow-y:auto;
}
.railhead{padding:18px 20px 12px;border-bottom:1px solid var(--rule)}
.railhead h2{margin:0 0 3px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);font-weight:700}
.railhead p{margin:0;font-size:12px;color:var(--slate)}
.grp{padding:14px 0 6px}
.grp h3{
  margin:0 0 6px;padding:0 20px;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--slate);font-weight:700;
}
.nav{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;
  padding:7px 20px 7px 17px;display:flex;gap:10px;align-items:flex-start;line-height:1.35}
.nav:hover{background:var(--surface)}
.nav:focus-visible{outline:2px solid var(--rust);outline-offset:-2px}
.nav[aria-current="true"]{background:var(--surface-2);border-left-color:var(--rust)}
.nav .id{font-family:var(--mono);font-size:10.5px;color:var(--mute);flex:0 0 46px;padding-top:2px;letter-spacing:.02em}
.nav[aria-current="true"] .id{color:var(--rust-ink)}
.nav .nm{font-size:13px;color:var(--ink-2);flex:1}
.nav[aria-current="true"] .nm{font-weight:600}
.dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:5px;border:1.5px solid var(--rule);background:transparent}
.dot.work{border-color:var(--amber);background:var(--amber-soft)}
.dot.done{border-color:var(--teal);background:var(--teal)}

/* ---------- main ---------- */
main{flex:1;min-width:0;padding:0 0 80px}
.stage{max-width:820px;margin:0 auto;padding:34px 32px 0}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.recid{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--rust-ink);background:var(--rust-soft);
  padding:3px 8px;border-radius:3px;font-weight:700}
.status{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
h1.sect{font-family:var(--serif);font-size:31px;line-height:1.2;margin:0 0 6px;letter-spacing:-.2px}
.lede{font-size:15px;color:var(--slate);margin:0 0 22px}
.hr{height:1px;background:var(--rule);margin:0 0 26px}
p{margin:0 0 14px}
strong{font-weight:700}
ul.pl{margin:0 0 16px;padding-left:0;list-style:none}
ul.pl li{position:relative;padding-left:20px;margin-bottom:9px}
ul.pl li::before{content:"";position:absolute;left:3px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--rust)}

.callout{background:var(--surface);border-radius:6px;padding:16px 18px;margin:0 0 20px;border:1px solid var(--rule)}
.callout.teal{background:var(--teal-soft);border-color:#CBDDDA}
.callout .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:7px}
.callout.teal .lab{color:var(--teal)}
.callout.bg{background:transparent;border:1px dashed #AEB9BF;font-size:14.5px;color:var(--ink-2)}
.callout.bg .lab{color:var(--slate)}
.grader{margin-top:8px;background:var(--amber-soft);border:1px solid #E4D3AE;border-radius:5px;padding:10px 13px;font-size:13.5px}
.grader b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:4px}
.callout p:last-child{margin-bottom:0}

.stmt{background:var(--ink);color:#fff;border-radius:6px;padding:20px 22px;margin:0 0 20px}
.stmt b{display:block;font-family:var(--serif);font-size:19px;line-height:1.35;font-weight:700}
.stmt span{display:block;margin-top:9px;font-size:13.5px;color:#B4C0C7}

.cards{display:grid;gap:12px;margin:0 0 20px}
.cards.c2{grid-template-columns:1fr 1fr}
.cards.c3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.card h4{margin:0 0 6px;font-size:14px;font-weight:700}
.card p{margin:0;font-size:13.5px;color:var(--ink-2)}

.steps{margin:0 0 20px;display:grid;gap:8px}
.step{display:flex;gap:12px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:11px 14px}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--rust);color:#fff;
  font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step.tl .n{background:var(--teal)}
.step .tx b{display:block;font-size:14px;margin-bottom:2px}
.step .tx span{font-size:13.5px;color:var(--ink-2)}

.tw{overflow-x:auto;margin:0 0 20px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
thead th{background:var(--ink);color:#fff;text-align:left;padding:9px 12px;font-size:12px;font-weight:700;letter-spacing:.02em}
tbody td{padding:9px 12px;border-top:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
tbody tr:nth-child(even) td{background:#FAFBFB}
td.k{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}

/* ---------- knowledge check ---------- */
.check{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--rust);border-radius:6px;padding:18px 20px;margin:26px 0 0}
.check .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:8px}
.check .q{font-size:15.5px;font-weight:600;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--rule);border-radius:5px;margin-bottom:7px;cursor:pointer;background:var(--paper);font-size:14px}
.opt:hover{background:var(--surface)}
.opt input{margin:3px 0 0;accent-color:var(--rust);flex:0 0 auto}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt.wrong{border-color:var(--alert);background:var(--alert-soft)}
.opt.locked{cursor:default}
.fb{margin-top:11px;padding:12px 14px;border-radius:5px;font-size:14px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--teal-soft);border:1px solid #CBDDDA}
.fb.no{background:var(--alert-soft);border:1px solid #E8CFCF}
.fb b{display:block;margin-bottom:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.fb.ok b{color:var(--teal)} .fb.no b{color:var(--alert)}

/* ---------- exercises ---------- */
.exwrap{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;margin:0 0 18px}
.exwrap h4{margin:0 0 8px;font-family:var(--serif);font-size:18px}
.scen{background:var(--surface);border-radius:5px;padding:13px 15px;font-size:14px;margin-bottom:16px}
.part{margin-bottom:16px}
.part label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
textarea{width:100%;border:1px solid var(--rule);border-radius:5px;padding:10px 12px;font-size:14px;
  line-height:1.55;resize:vertical;min-height:76px;background:var(--paper)}
textarea:focus{outline:2px solid var(--rust);outline-offset:0;border-color:var(--rust)}
.count{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:4px;text-align:right}

/* ---------- buttons / footer nav ---------- */
.pager{display:flex;justify-content:space-between;gap:12px;margin:32px 0 0;padding-top:22px;border-top:1px solid var(--rule)}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:5px;padding:10px 18px;font-size:14px;font-weight:600}
.btn:hover{background:var(--surface)}
.btn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.btn.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.pri:hover{background:var(--rust-ink)}
.btn.gh{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}

/* ---------- start + submit ---------- */
.hero{background:var(--ink);color:#fff;border-radius:8px;padding:34px 34px 30px;margin-bottom:26px}
.hero .kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust-soft);margin-bottom:12px}
.hero h1{font-family:var(--serif);font-size:35px;line-height:1.15;margin:0 0 6px}
  .hero .subtitle{font-family:var(--serif);font-size:19px;line-height:1.3;color:#C9D3D9;margin:0 0 10px}
  .hero .scale{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rust-soft);margin:0 0 14px}
.hero p{color:#B4C0C7;margin:0;font-size:15px;max-width:60ch}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 22px;font-size:14px}
.meta dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);padding-top:3px}
.meta dd{margin:0}
.transmit{border:1px solid var(--rule);border-radius:6px;background:var(--paper);overflow:hidden;margin-bottom:22px}
.transmit .hd{background:var(--surface-2);padding:12px 18px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.transmit .hd b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.transmit .hd span{font-family:var(--mono);font-size:11px;color:var(--slate)}
.transmit .bd{padding:18px}
.scorebox{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.scorebox .big{font-family:var(--serif);font-size:42px;font-weight:700;line-height:1}
.scorebox .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate)}
.gaps{margin-top:14px}
.gaps li{font-size:13.5px}
.note{font-size:13px;color:var(--slate);margin-top:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:5px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.warn{background:var(--amber-soft);border:1px solid #E4D3AE;border-radius:5px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.setup{font-size:13px;color:var(--slate);border-top:1px solid var(--rule);margin-top:26px;padding-top:16px}
.setup code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:3px}

.fadein{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:760px){
  .top{padding:0 12px;gap:8px}
  .brand{display:none}
  .lng{display:none}
  .who{flex:1;min-width:0}
  .who label{display:none}
  .who input{width:100%;min-width:0}
}
@media(max-width:900px){
  .cards.c3,.cards.c2{grid-template-columns:1fr}
  .rail{position:fixed;top:60px;left:0;bottom:0;z-index:35;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0);max-height:none}
  .rail.open{transform:none;box-shadow:2px 0 24px rgba(0,0,0,.25)}
  .railtoggle{display:inline-block}
  .stage{padding:26px 18px 0}
  .who input{width:120px}
  h1.sect{font-size:26px}
  .hero{padding:26px 22px}
  .hero h1{font-size:28px}
}

/* ---------- part note text ---------- */
.pnote{display:flex;gap:11px;align-items:flex-start;background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--teal);
  border-radius:5px;padding:10px 14px;margin:0 0 12px;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.pnote .pc{flex:0 0 auto;min-width:44px;text-align:center;background:var(--ink);color:#fff;font-weight:700;border-radius:3px;padding:1px 7px;font-size:11.5px;letter-spacing:.04em;margin-top:1px}

/* ---------- product tree ---------- */
.tree{border:1px solid var(--rule);border-radius:6px;background:var(--paper);margin:0 0 20px;overflow:hidden}
.trow{display:flex;gap:12px;align-items:flex-start;padding:9px 14px;border-top:1px solid var(--rule);font-size:13.5px}
.trow:first-child{border-top:0}
.trow .tn{flex:1;min-width:0;color:var(--ink-2)}
.trow .tn b{color:var(--ink)}
.trow .tn i{display:block;font-style:normal;font-size:12.5px;color:var(--slate);margin-top:2px}
.trow .tc{flex:0 0 auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:45%}
.chip{font-family:var(--mono);font-size:11px;font-weight:700;border-radius:3px;padding:1px 6px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--rule)}
.chip.none{font-weight:400;color:var(--mute)}
.tbar{font-family:var(--mono);color:var(--mute);white-space:pre}

/* ---------- parts-list drill ---------- */
.dline{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--rust);border-radius:6px;margin:0 0 18px;overflow:hidden}
.dline .hd{background:var(--surface-2);padding:9px 16px;border-bottom:1px solid var(--rule);display:flex;gap:8px 18px;flex-wrap:wrap;
  font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.dline .hd span b{color:var(--slate);font-weight:400;letter-spacing:.08em;text-transform:uppercase;font-size:10px;margin-right:6px}
.dline .bd{padding:14px 16px 16px}
.dline .nm{font-family:var(--mono);font-size:14px;font-weight:700;margin:0 0 10px;letter-spacing:.02em}
.codes{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 0}
.code{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);border-radius:4px;padding:6px 11px;
  font-family:var(--mono);font-size:12.5px;font-weight:700;cursor:pointer;background:var(--paper);user-select:none}
.code:hover{background:var(--surface)}
.code input{accent-color:var(--rust);margin:0}
.code.none{font-weight:400}
.code.locked{cursor:default}
.code.locked:hover{background:inherit}
.code.right{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.code.wrong{border-color:var(--alert);background:var(--alert-soft);color:var(--alert);text-decoration:line-through}
.code.missed{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);border-style:dashed}
.legend{font-size:12.5px;color:var(--slate);margin:10px 0 0;display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;border:1px solid}
.legend .lr{background:var(--teal-soft);border-color:var(--teal)}
.legend .lw{background:var(--alert-soft);border-color:var(--alert)}
.legend .lm{background:var(--amber-soft);border-color:var(--amber);border-style:dashed}

/* ---------- builder additions: extra block types ---------- */
h2.sub2{font-family:var(--serif);font-size:21px;line-height:1.3;margin:26px 0 10px}
ol.ol{margin:0 0 16px;padding-left:22px}
ol.ol li{margin-bottom:8px;padding-left:4px}
ol.ol li::marker{color:var(--rust);font-family:var(--mono);font-size:13px;font-weight:700}
.callout.amb{background:var(--amber-soft);border-color:#E4D3AE}
.callout.amb .lab{color:var(--amber)}
.fig{margin:0 0 20px;text-align:center}
.fig img{max-width:100%;height:auto;border:1px solid var(--rule);border-radius:6px;background:#fff}
.fig figcaption{font-size:13px;color:var(--slate);margin-top:7px}

/* ---------- markings: banners and notice blocks ---------- */
.chrome{position:sticky;top:0;z-index:40}
.chrome .top{position:relative;top:auto}
.mk{font-family:var(--sans);font-weight:700;font-size:12.5px;letter-spacing:.05em;text-align:center;padding:4px 14px;line-height:1.35}
#mkBot{position:fixed;left:0;right:0;bottom:0;z-index:45}
.rail{top:var(--chh,60px);max-height:calc(100vh - var(--chh,60px) - var(--mkb,0px));min-height:calc(100vh - var(--chh,60px) - var(--mkb,0px))}
body{padding-bottom:var(--mkb,0px)}
.toast{bottom:calc(26px + var(--mkb,0px))}
.mkblock{border-radius:6px;padding:12px 16px;margin:0 0 20px;font-size:13px;line-height:1.5;border:1px solid rgba(0,0,0,.08)}
.mkblock.mkbtm{margin-top:26px}
@media(max-width:900px){ .rail{top:var(--chh,60px);bottom:var(--mkb,0px);max-height:none;min-height:0} }
@media print{ .mk,.mkblock{-webkit-print-color-adjust:exact;print-color-adjust:exact} #mkBot{position:static} .chrome{position:static} }

/* ---------- choose-all-that-apply checks ---------- */
.check .multi{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin:-6px 0 10px}
.opt.missed{border-color:var(--amber);background:var(--amber-soft);border-style:dashed}

/* ---------- glossary ---------- */
.gl{border-bottom:1.5px dotted var(--teal);cursor:help}
.stmt .gl,.hero .gl{border-bottom-color:#9FC3BE}
.gl:hover{background:var(--teal-soft)}
.stmt .gl:hover,.hero .gl:hover{background:rgba(255,255,255,.12)}
.gl:focus-visible{outline:2px solid var(--rust);outline-offset:1px;border-radius:2px}
#glTip{position:fixed;z-index:95;max-width:360px;background:var(--ink);color:#fff;border-radius:6px;padding:11px 14px;font-size:13.5px;line-height:1.5;box-shadow:0 8px 28px rgba(0,0,0,.28);display:none}
#glTip b{display:block;font-family:var(--serif);font-size:15px;margin-bottom:2px}
#glTip .al{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:#93A2AB;margin-bottom:5px}
#glTip strong{color:#fff}
#glTip .glgo{margin-top:8px;background:none;border:0;padding:0;color:var(--rust-soft);font-size:12.5px;text-decoration:underline;cursor:pointer}
.glidx{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px}
.glidx a{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--rust-ink);background:var(--rust-soft);border-radius:3px;padding:3px 8px;text-decoration:none}
.gldl{margin:0 0 10px}
.gldl dt{font-weight:700;font-size:15px;margin:14px 0 3px}
.gldl dt span{display:block;font-weight:400;font-family:var(--mono);font-size:11px;color:var(--slate);letter-spacing:.03em;margin-top:1px}

function pageIndex(){

    if(VIEW.page==="submit"&&p.k==="submit") return i;
    if(VIEW.page==="gloss"&&p.k==="gloss") return i;
    if(VIEW.page==="trainer"&&p.k==="trainer") return i;
    if(p.k==="sect"&&VIEW.page==="s:"+p.id) return i;
    if(VIEW.page==="d:"+p.grp&&p.k==="drill") return i;

/* ---- completion status ---- */
function sectStatus(id){
  if(STATE.checks[id]) return "done";
  if(STATE.seen[id]) return "work";
  return "";
}
function drillStatus(modId){
  var m=mod(modId), n=0;
  (m.drill||[]).forEach(function(d){ if(STATE.drills[d.id]) n++; });
  if(n===0) return "";
  return n===m.drill.length ? "done" : "work";
}
function exStatus(modId){
  var m = mod(modId), total=0, filled=0;
  m.exercises.forEach(function(x){ x.parts.forEach(function(p){
    total++; var v=STATE.answers[x.id+"."+p.id]; if(v&&v.trim().length>0) filled++;
  });});
  if(filled===0) return "";
  return filled===total ? "done" : "work";
}
function mod(id){ for(var i=0;i<MODULES.length;i++) if(MODULES[i].id===id) return MODULES[i]; return null; }
function hasCheck(s){ return !!(s.check && s.check.q && ((s.check.o && s.check.o.length>1) || (s.check.dec && s.check.dec.blocks && s.check.dec.blocks.length>1))); }

function counts(){
  var totalChecks=0, answered=0, right=0;
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    if(!hasCheck(s)) return;
    totalChecks++;
    var c=STATE.checks[s.id];
    if(c){ answered++; if(c.first===true) right++; }
  });});
  var totalDrill=0, drilled=0, drillRight=0;
  MODULES.forEach(function(m){ (m.drill||[]).forEach(function(d){
    totalDrill++;
    var r=STATE.drills[d.id];
    if(r){ drilled++; if(r.first===true) drillRight++; }
  });});
  var totalParts=0, filledParts=0;
  MODULES.forEach(function(m){ m.exercises.forEach(function(x){ x.parts.forEach(function(p){
    totalParts++; var v=STATE.answers[x.id+"."+p.id]; if(v&&v.trim().length>0) filledParts++;
  });});});
  return {totalChecks:totalChecks, answered:answered, right:right,
          totalDrill:totalDrill, drilled:drilled, drillRight:drillRight,
          totalParts:totalParts, filledParts:filledParts};
}

function drawRail(){
  var c=counts();

  if(c.totalDrill) bits.push(c.drilled+" of "+c.totalDrill+" drill lines done");
  if(c.totalParts) bits.push(c.filledParts+" of "+c.totalParts+" exercise answers written");
  var h="<div class='railhead'><h2>Section register</h2><p>"+bits.join(" · ")+"</p></div>";
  h+="<div class='grp'>"+navBtn(PAGES[0])+"</div>";

    h+="<div class='grp'><h3>"+esc(m.label)+": "+esc(m.title)+"</h3>";

  h+="<div class='grp'>";

function navBtn(p){

   ========================================================================== */
var GLRE=null, GLCS={}, GLCI={};
function reEsc(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function glKeys(g){ return [g.t].concat(g.alt||[]).map(function(k){ return String(k||"").trim(); }).filter(Boolean); }
function glIsCS(k){ return /[A-Z]/.test(k) && !/[a-z]/.test(k); }
(function glBuild(){
  var keys=[];
  GL.forEach(function(g,i){ glKeys(g).forEach(function(k){ if(glIsCS(k)) GLCS[k]=i; else GLCI[k.toLowerCase()]=i; keys.push(k); }); });
  keys.sort(function(a,b){ return b.length-a.length; });
  if(keys.length){ try{ GLRE=new RegExp("(?<![A-Za-z0-9])("+keys.map(reEsc).join("|")+")(?:e?s)?(?![A-Za-z0-9])","gi"); }catch(e){ GLRE=null; } }
})();
function glFind(txt){ if(Object.prototype.hasOwnProperty.call(GLCS,txt)) return GLCS[txt]; var l=txt.toLowerCase(); if(Object.prototype.hasOwnProperty.call(GLCI,l)) return GLCI[l]; return -1; }
function glSkip(el){
  if(/^(H1|TEXTAREA|INPUT|BUTTON|SCRIPT|STYLE|SELECT|CODE)$/.test(el.tagName)) return true;
  var c=el.classList; if(!c) return false;
  if(c.contains("gl")||c.contains("kick")||c.contains("scale")||c.contains("eyebrow")||c.contains("pager")||c.contains("pnote")||c.contains("codes")||c.contains("mkblock")||c.contains("transmit")||c.contains("legend")) return true;
  if(!GLO.inChecks && c.contains("check")) return true;
  return false;
}
function glApply(root){
  if(!GLRE) return;
  var used={}, nodes=[];
  var tw=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  var n; while((n=tw.nextNode())){
    var p=n.parentNode, skip=false;
    while(p && p!==root){ if(p.nodeType===1 && glSkip(p)){ skip=true; break; } p=p.parentNode; }
    if(!skip && /[A-Za-z]/.test(n.nodeValue)) nodes.push(n);
  }
  nodes.forEach(function(node){
    var t=node.nodeValue, last=0, frag=null, m;
    GLRE.lastIndex=0;
    while((m=GLRE.exec(t))){
      var gi=glFind(m[1]);
      if(gi<0) continue;
      if(GLO.firstOnly!==false){ if(used[gi]) continue; used[gi]=1; }
      if(!frag) frag=document.createDocumentFragment();
      if(m.index>last) frag.appendChild(document.createTextNode(t.slice(last,m.index)));
      var sp=document.createElement("span"); sp.className="gl"; sp.setAttribute("data-g",gi); sp.setAttribute("tabindex","0");
      sp.textContent=m[0]; frag.appendChild(sp);
      last=m.index+m[0].length;
    }
    if(frag){ if(last<t.length) frag.appendChild(document.createTextNode(t.slice(last))); node.parentNode.replaceChild(frag,node); }
  });
}
function glStrings(o, out){
  if(typeof o==="string") out.push(o);
  else if(Array.isArray(o)) o.forEach(function(v){ glStrings(v,out); });
  else if(o && typeof o==="object") for(var k in o){ if(k!=="t"&&k!=="tone"&&k!=="src"&&k!=="cols"&&k!=="id") glStrings(o[k],out); }
  return out;
}
function glWhere(gi){
  var g=GL[gi], ks=glKeys(g), out=[];

  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    var txt=glStrings([s.title, s.lede||"", s.body], []).join("\n"), mm, hit=false;
    re.lastIndex=0; while((mm=re.exec(txt))){ if(glFind(mm[1])===gi){ hit=true; break; } }
    if(hit) out.push(s);
  });});

}

function glInit(){
  var tip=document.createElement("div"); tip.id="glTip"; tip.setAttribute("role","tooltip"); document.body.appendChild(tip);
  var cur=null, hideT, shownAt=0;
  function show(el){
    var gi=+el.getAttribute("data-g"); clearTimeout(hideT);

      (GLO.page!==false && gi>=0 ? "<button type='button' class='glgo'>Open the glossary →</button>" : "");

    var r=el.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight, vw=window.innerWidth, vh=window.innerHeight;

  document.addEventListener("click", function(e){
    var el=e.target.closest && e.target.closest(".gl");
    if(el){ if(cur===el && tip.style.display==="block" && Date.now()-shownAt>400){ tip.style.display="none"; cur=null; } else show(el); return; }
    if(e.target.closest && e.target.closest(".glgo")){ tip.style.display="none"; go("gloss"); return; }

    if(!(e.target.closest && e.target.closest("#glTip"))){ tip.style.display="none"; cur=null; }
  });

    if(e.key==="Escape"){ tip.style.display="none"; cur=null; }
    if((e.key==="Enter"||e.key===" ") && e.target.classList && e.target.classList.contains("gl")){ e.preventDefault(); show(e.target); }
  });

/* ---- decomposition checks ---------------------------------------------------
   A tree of plain labelled boxes, top block first. Three modes:
     build  - place each block under its parent (decoys go in the bin)
     errors - the tree is shown with mistakes; click every block that is wrong
     label  - the tree is shown; pick the right label for each block
   It is right only when every block is right.
   ---------------------------------------------------------------------------- */
var DEC_TMP = {};
var DEC_NONE = -9, DEC_BIN = -2;
function isDec(s){ return !!(s.check && s.check.dec); }
function decAll(d){ return d.blocks.map(function(b,i){ return {n:b.n, p:(i===0?-1:+b.p), given:!!b.given, lab:b.lab, shown:b.shown, decoy:false}; })
  .concat(d.mode==="label" ? [] : (d.decoys||[]).map(function(x){ return {n:x.n, p:DEC_BIN, decoy:true, shown:x.shown}; })); }
function decTree(all, parentOf, box){
  function kids(j){ var k=[]; for(var i=0;i<all.length;i++) if(i!==j && parentOf(i)===j) k.push(i); return k; }
  function node(i, seen){
    if(seen[i]) return ""; seen[i]=1;
    var k=kids(i);
    return "<li>"+box(i)+(k.length?"<ul>"+k.map(function(c){ return node(c, seen); }).join("")+"</ul>":"")+"</li>";
  }
  return "<div class='dtree'><ul>"+node(0,{})+"</ul></div>";
}
function decBoxHtml(txt, cls, extra, attrs){ return "<div class='db"+(cls?" "+cls:"")+"'"+(attrs||"")+"><span class='dn'>"+fmt(txt)+"</span>"+(extra||"")+"</div>"; }
function decInDesc(arr, i, j){ // is j a descendant of i under arrangement arr?
  var guard=0; while(j>0 && guard++<50){ if(arr[j]===i) return true; j=arr[j]; if(j<0) return false; } return false;
}
function decErrors(all){ var e=[]; all.forEach(function(b,i){ if(i===0) return; if(b.decoy) e.push(i); else if(b.shown!=null && b.shown!=="" && +b.shown!==b.p) e.push(i); }); return e; }
function decShownParent(b){ return b.decoy ? (b.shown!=null && b.shown!=="" ? +b.shown : null) : (b.shown!=null && b.shown!=="" ? +b.shown : b.p); }
function decInit(s, all){
  var d=s.check.dec, n=all.length;
  if(d.mode==="build"){ var a=all.map(function(b,i){ return i===0 ? -1 : (b.given ? b.p : DEC_NONE); }); return a; }
  if(d.mode==="errors") return [];
  return all.map(function(b,i){ return b.given ? +b.lab : -1; });
}
function decMovable(s, all){
  var idx=[]; all.forEach(function(b,i){ if(i>0 && !b.given) idx.push(i); });
  var ord=(PER_TRAINEE ? orderFor(s.id+"#dec", idx.length) : optionOrder(s.id+"#dec", idx.length));
  return ord.map(function(k){ return idx[k]; });
}
function decHtml(s){
  var c=s.check, d=c.dec, all=decAll(d), rec=STATE.checks[s.id], locked=!!rec, id=s.id;
  var arr = locked ? rec.picks : (DEC_TMP[id] || (DEC_TMP[id]=decInit(s, all)));
  var h="<div class='check dec' data-check='"+esc(id)+"'><div class='lab'>Check yourself</div><div class='q'>"+fmt(c.q)+"</div>";
  if(d.mode==="build"){
    var hasDecoys=all.some(function(b){ return b.decoy; });
    var inTree=function(i){ if(i===0) return true; var g=0, j=i; while(g++<50){ var p=arr[j]; if(p===0) return true; if(p==null||p<0) return false; j=p; } return false; };
    if(!locked){
      h+="<div class='multi'>Place every block under its parent. Drag a block onto a box, or use the lists below."+(hasDecoys?" Blocks that do not belong go in the bin.":"")+"</div>";
      h+=decTree(all, function(i){ return (i>0 && inTree(i)) ? arr[i] : null; }, function(i){
        var b=all[i], mv=(i>0 && !b.given);
        return decBoxHtml(b.n, (i===0?"root":"")+(b.given&&i>0?" given":"")+(mv?" mv":""), "", " data-dec='"+esc(id)+"' data-bi='"+i+"'"+(mv?" draggable='true'":""));
      });
      var loose=decMovable(s, all).filter(function(i){ return arr[i]===DEC_NONE || (arr[i]>=0 && !inTree(i)); });
      h+="<div class='dtray' data-dec='"+esc(id)+"' data-drop='tray'><span class='dtl'>Not placed yet</span>"+(loose.length ? loose.map(function(i){ return "<span class='dchip' draggable='true' data-dec='"+esc(id)+"' data-bi='"+i+"'>"+fmt(all[i].n)+"</span>"; }).join("") : "<span class='dnone'>Every block is placed.</span>")+"</div>";
      if(hasDecoys){ var binned=decMovable(s, all).filter(function(i){ return arr[i]===DEC_BIN; });
        h+="<div class='dbin' data-dec='"+esc(id)+"' data-drop='bin'><span class='dtl'>🗑 "+esc(d.bin||"Not part of this product")+"</span>"+binned.map(function(i){ return "<span class='dchip' draggable='true' data-dec='"+esc(id)+"' data-bi='"+i+"'>"+fmt(all[i].n)+"</span>"; }).join("")+"</div>"; }
      h+="<details class='dlist'><summary>Place blocks with lists instead of dragging</summary><div class='dgrid'>";
      decMovable(s, all).forEach(function(i){
        var opts="<option value='"+DEC_NONE+"'>— not placed —</option>";
        all.forEach(function(b,j){ if(j===i || !inTree(j) || decInDesc(arr, i, j)) return; opts+="<option value='"+j+"'"+(arr[i]===j?" selected":"")+">under "+esc(plain(b.n))+"</option>"; });
        if(hasDecoys) opts+="<option value='"+DEC_BIN+"'"+(arr[i]===DEC_BIN?" selected":"")+">"+esc(d.bin||"Not part of this product")+"</option>";
        h+="<label><span>"+fmt(all[i].n)+"</span><select data-dsel='"+esc(id)+"' data-bi='"+i+"'>"+opts.replace("value='"+DEC_NONE+"'>","value='"+DEC_NONE+"'"+(arr[i]===DEC_NONE?" selected":"")+">")+"</select></label>";
      });
      h+="</div></details>";
    } else {
      var right=function(i){ return arr[i]===all[i].p; };
      h+="<div class='multi'>Your decomposition</div>";
      h+=decTree(all, function(i){ return (i>0 && arr[i]>=0) ? arr[i] : null; }, function(i){
        var b=all[i]; if(i===0 || b.given) return decBoxHtml(b.n, (i===0?"root":"given"));
        return decBoxHtml(b.n, right(i)?"right":"wrong", "<span class='dm'>"+(right(i)?"✓":"✗")+"</span>");
      });
      var binned2=all.map(function(b,i){ return i; }).filter(function(i){ return arr[i]===DEC_BIN; });
      if(binned2.length) h+="<div class='dbin locked'><span class='dtl'>🗑 "+esc(d.bin||"Not part of this product")+"</span>"+binned2.map(function(i){ return "<span class='dchip "+(right(i)?"right":"wrong")+"'>"+fmt(all[i].n)+" "+(right(i)?"✓":"✗")+"</span>"; }).join("")+"</div>";
    }
  } else if(d.mode==="errors"){
    var errs=decErrors(all), flagged=arr||[];
    h+="<div class='multi'>"+(locked?"Your answer":"This decomposition has mistakes. Click every block that is wrong, then check.")+"</div>";
    h+=decTree(all, function(i){ return i===0 ? null : decShownParent(all[i]); }, function(i){
      var b=all[i], f=flagged.indexOf(i)>=0, e=errs.indexOf(i)>=0;
      if(i===0) return decBoxHtml(b.n, "root");
      if(!locked) return "<button type='button' class='db flag"+(f?" on":"")+"' data-dflag='"+esc(id)+"' data-bi='"+i+"' aria-pressed='"+(f?"true":"false")+"'><span class='dn'>"+fmt(b.n)+"</span>"+(f?"<span class='dm'>⚑</span>":"")+"</button>";
      var cls = f&&e ? "right" : (!f&&e ? "missed" : (f&&!e ? "wrong" : ""));
      return decBoxHtml(b.n, cls, cls ? "<span class='dm'>"+(cls==="right"?"⚑ ✓":(cls==="missed"?"missed":"⚑ ✗"))+"</span>" : "");
    });
    if(locked) h+="<div class='legend'><span><i class='lr'></i>mistake found</span><span><i class='lm'></i>mistake missed</span><span><i class='lw'></i>was not a mistake</span></div>";
  } else {
    var labs=d.labels||[];
    h+="<div class='multi'>"+(locked?"Your labels":"Choose the right label for each block.")+"</div>";
    h+=decTree(all, function(i){ return i===0 ? null : all[i].p; }, function(i){
      var b=all[i];
      if(b.given) return decBoxHtml(b.n, (i===0?"root ":"")+"given", "<span class='dlab'>"+esc(labs[+b.lab]||"")+"</span>");
      if(!locked){
        var o="<option value='-1'>— label —</option>"+labs.map(function(l,k){ return "<option value='"+k+"'"+(arr[i]===k?" selected":"")+">"+esc(l)+"</option>"; }).join("");
        return decBoxHtml(b.n, (i===0?"root":""), "<select class='dls' data-dlab='"+esc(id)+"' data-bi='"+i+"'>"+o+"</select>");
      }
      var ok=arr[i]===+b.lab;

function decRefresh(id){

function decSet(id, i, p){
  var arr=DEC_TMP[id]; if(!arr) return;
  arr[i]=p;
  if(p<0){ // take its children off the tree too
    var changed=true; while(changed){ changed=false; for(var k=0;k<arr.length;k++){ if(arr[k]>=0 && arr[arr[k]]!=null && (arr[arr[k]]===DEC_NONE||arr[arr[k]]===DEC_BIN) && arr[k]!==0){ arr[k]=DEC_NONE; changed=true; } } }
  }
  decRefresh(id);
}
function wireDec(root){

      var again=document.querySelector("[data-dflag='"+id+"'][data-bi='"+i+"']"); if(again) again.focus(); });
  });
  Array.prototype.forEach.call(root.querySelectorAll("[data-dreset]"), function(b){

  });
  var dragging=null;

    el.addEventListener("dragstart", function(e){ dragging={id:el.getAttribute("data-dec"), i:+el.getAttribute("data-bi")}; el.classList.add("drag"); try{ e.dataTransfer.setData("text/plain",""); e.dataTransfer.effectAllowed="move"; }catch(x){} e.stopPropagation(); });
    el.addEventListener("dragend", function(){ el.classList.remove("drag"); dragging=null; });
  });
  Array.prototype.forEach.call(root.querySelectorAll(".dec .db[data-bi], .dec [data-drop]"), function(t){
    t.addEventListener("dragover", function(e){ if(!dragging || dragging.id!==t.getAttribute("data-dec")) return;
      var to=t.getAttribute("data-drop") ? t.getAttribute("data-drop") : +t.getAttribute("data-bi");
      if(to===dragging.i || (typeof to==="number" && decInDesc(DEC_TMP[dragging.id], dragging.i, to))) return;
      e.preventDefault(); t.classList.add("over"); });
    t.addEventListener("dragleave", function(){ t.classList.remove("over"); });
    t.addEventListener("drop", function(e){ e.preventDefault(); t.classList.remove("over"); if(!dragging) return;
      var d=t.getAttribute("data-drop"), p = d==="tray" ? DEC_NONE : (d==="bin" ? DEC_BIN : +t.getAttribute("data-bi"));
      var g=dragging; dragging=null; decSet(g.id, g.i, p); });
  });
}
function gradeDec(sec){
  var id=sec.id, d=sec.check.dec, all=decAll(d), arr=DEC_TMP[id]||decInit(sec, all), ok=true;
  if(d.mode==="build"){
    var missing=decMovable(sec, all).filter(function(i){ return arr[i]===DEC_NONE; });
    if(missing.length){ toast("Place every block first"+(all.some(function(b){ return b.decoy; })?", or put it in the bin":"")+". "+missing.length+" still to go."); return; }
    all.forEach(function(b,i){ if(i>0 && arr[i]!==b.p) ok=false; });
  } else if(d.mode==="errors"){
    if(!arr.length){ toast("Click at least one block you think is wrong."); return; }
    ok=sameSet(arr, decErrors(all));
  } else {
    var un=all.filter(function(b,i){ return !b.given && arr[i]<0; }).length;
    if(un){ toast("Choose a label for every block. "+un+" still to go."); return; }
    all.forEach(function(b,i){ if(arr[i]!==+b.lab) ok=false; });
  }
  STATE.checks[id]={ first:ok, picks:arr.slice(), at:new Date().toISOString() };
  delete DEC_TMP[id];
  autosave(); draw();
  var el=document.querySelector("[data-check='"+id+"']"); if(el) el.scrollIntoView({block:"center", behavior:"smooth"});
}

function isMulti(s){ return Array.isArray(s.check.a); }
function isOrder(s){ return s.check.order===true; }
/* ---- put-in-order checks ---------------------------------------------------
   The items are authored in the right order. They are shown shuffled (never
   already in order), and the trainee moves them with the arrow buttons or by
   dragging. It is right only when every item is in its place.
   ---------------------------------------------------------------------------- */
var ORD_TMP = {};   // the arrangement on screen before Check answer
function startOrder(s){
  var n=s.check.o.length;
  var a=(PER_TRAINEE ? orderFor(s.id, n) : optionOrder(s.id, n)).slice();
  var ident=true; for(var i=0;i<n;i++) if(a[i]!==i) ident=false;
  if(ident && n>1) a.push(a.shift());
  return a;
}
function orderHtml(s){
  var rec=STATE.checks[s.id], locked=!!rec, c=s.check;
  var arr = locked ? (rec.picks && rec.picks.length===c.o.length ? rec.picks : null) : (ORD_TMP[s.id] || (ORD_TMP[s.id]=startOrder(s)));
  var h="<div class='check' data-check='"+esc(s.id)+"'><div class='lab'>Check yourself</div><div class='q'>"+fmt(c.q)+"</div>";
  h+="<div class='multi'>"+(locked?"Your order":"Put these in order. Use the arrows, or drag an item.")+"</div>";
  if(c.top) h+="<div class='ordend'>▲ "+fmt(c.top)+"</div>";
  if(arr){
    h+="<ol class='ordl"+(locked?" locked":"")+"' data-ord='"+esc(s.id)+"'>";
    arr.forEach(function(i,pos){
      var cls = locked ? (i===pos ? " right" : " wrong") : "";
      h+="<li class='oi"+cls+"'"+(locked?"":" draggable='true'")+" data-i='"+i+"'><span class='on'>"+(pos+1)+"</span><span class='ot'>"+fmt(c.o[i])+"</span>"+
        (locked ? "<span class='om'>"+(i===pos?"✓":"✗")+"</span>" :
         "<span class='oc'><button type='button' class='ob' data-mv='-1' aria-label='Move up'"+(pos===0?" disabled":"")+">↑</button><button type='button' class='ob' data-mv='1' aria-label='Move down'"+(pos===arr.length-1?" disabled":"")+">↓</button></span>")+"</li>";
    });
    h+="</ol>";
  } else h+="<p class='note'>Answered. The order you gave is not in this file.</p>";
  if(c.bottom) h+="<div class='ordend'>▼ "+fmt(c.bottom)+"</div>";
  h+="<div class='btnrow' style='margin-top:12px;margin-bottom:0'>"+(locked?"":"<button class='btn pri' data-ckgo='"+esc(s.id)+"'>Check answer</button>")+"</div>";
  if(locked){
    var ok=rec.first===true, inPlace=0; if(arr) arr.forEach(function(i,p){ if(i===p) inPlace++; });
    h+="<div class='fb show "+(ok?"ok":"no")+"'><b>"+(ok?"Correct":"Not quite"+(arr?" · "+inPlace+" of "+c.o.length+" in the right place":""))+"</b>"+
      (ok?"":"<div class='ordright'>The right order:<ol>"+c.o.map(function(t){ return "<li>"+fmt(t)+"</li>"; }).join("")+"</ol></div>")+fmt(c.why)+"</div>";
  } else h+="<div class='fb' data-fb='"+esc(s.id)+"'></div>";
  return h+"</div>";
}
function wireOrder(){
  Array.prototype.forEach.call(document.querySelectorAll("ol.ordl:not(.locked)"), function(ol){
    var id=ol.getAttribute("data-ord");
    function save(){ ORD_TMP[id]=Array.prototype.map.call(ol.children, function(li){ return +li.getAttribute("data-i"); }); renumber(); }
    function renumber(){ var n=ol.children.length; Array.prototype.forEach.call(ol.children, function(li,p){ li.querySelector(".on").textContent=p+1;
      var bs=li.querySelectorAll(".ob"); bs[0].disabled=(p===0); bs[1].disabled=(p===n-1); }); }
    ol.addEventListener("click", function(e){
      var b=e.target.closest(".ob"); if(!b) return;
      var li=b.closest("li"), d=+b.getAttribute("data-mv");
      if(d<0 && li.previousElementSibling) ol.insertBefore(li, li.previousElementSibling);
      else if(d>0 && li.nextElementSibling) ol.insertBefore(li.nextElementSibling, li);
      save(); var again=li.querySelector(".ob[data-mv='"+d+"']"); if(again && !again.disabled) again.focus(); else b.focus();
      li.classList.add("moved"); setTimeout(function(){ li.classList.remove("moved"); }, 250);
    });
    var drag=null;
    ol.addEventListener("dragstart", function(e){ drag=e.target.closest("li"); if(!drag) return; drag.classList.add("drag"); try{ e.dataTransfer.setData("text/plain",""); e.dataTransfer.effectAllowed="move"; }catch(x){} });
    ol.addEventListener("dragend", function(){ if(drag) drag.classList.remove("drag"); drag=null; save(); });
    ol.addEventListener("dragover", function(e){
      if(!drag) return; e.preventDefault();
      var li=e.target.closest("li"); if(!li || li===drag || li.parentNode!==ol) return;
      var r=li.getBoundingClientRect();
      if(e.clientY < r.top + r.height/2) ol.insertBefore(drag, li); else ol.insertBefore(drag, li.nextElementSibling);
    });
    ol.addEventListener("drop", function(e){ e.preventDefault(); save(); });
  });
}
function checkHtml(s){

    var o=s.check.o[i];

  h+="<div class='btnrow' style='margin-top:12px;margin-bottom:0'>"+
     (locked?"":"<button class='btn pri' data-ckgo='"+esc(s.id)+"'>Check answer</button>")+"</div>";

/* ---- pick-the-codes drill --------------------------------------------------
   Each drill line is one item. The trainee ticks every code the line takes, or
   the "none" choice. Grading is an exact match of the set: one missing code or
   one extra code is wrong. The first attempt is the one that counts.
   ---------------------------------------------------------------------------- */
var CODES = DRILL.codes||[];
function sameSet(a,b){
  if(a.length!==b.length) return false;
  for(var i=0;i<a.length;i++) if(b.indexOf(a[i])<0) return false;
  return true;
}

function gapList(){
  var gaps=[];
  MODULES.forEach(function(m){
    m.sections.forEach(function(s){
      if(!hasCheck(s)) return;
      var r=STATE.checks[s.id];
      if(!r) gaps.push([s.id, plain(s.title), "not attempted"]);
      else if(r.first!==true) gaps.push([s.id, plain(s.title), "wrong on first attempt"]);
    });
    (m.drill||[]).forEach(function(d){
      var r=STATE.drills[d.id];
      if(!r) gaps.push([d.id, "Drill: "+d.nm, "not attempted"]);
      else if(r.first!==true) gaps.push([d.id, "Drill: "+d.nm, "picked "+pickText(r.picks)+", should be "+ansText(d.a)]);
    });
  });

function grade(id){
  var sec=null;
  MODULES.forEach(function(m){ m.sections.forEach(function(s){ if(s.id===id) sec=s; }); });
  if(!sec) return;
  var picks=[];
  if(isDec(sec)){ gradeDec(sec); return; }
  if(isOrder(sec)){
    picks=(ORD_TMP[id]||startOrder(sec)).slice();
    var okO=true; picks.forEach(function(v,p){ if(v!==p) okO=false; });
    STATE.checks[id]={ first:okO, picks:picks, at:new Date().toISOString() };
    delete ORD_TMP[id];
    autosave(); draw();
    var elO=document.querySelector("[data-check='"+id+"']"); if(elO) elO.scrollIntoView({block:"center", behavior:"smooth"});
    return;
  }
  Array.prototype.forEach.call(document.querySelectorAll("input[name]"), function(r){ if(r.checked && r.name==="ck_"+id) picks.push(parseInt(r.value,10)); });
  if(!picks.length){ toast(isMulti(sec) ? "Tick at least one answer first." : "Choose an answer first."); return; }
  var ok = isMulti(sec) ? sameSet(picks, sec.check.a) : (picks[0]===sec.check.a);
  STATE.checks[id]={ first:ok, picks:picks, at:new Date().toISOString() };
  autosave(); draw();
  var el=document.querySelector("[data-check='"+id+"']");
  if(el) el.scrollIntoView({block:"center", behavior:"smooth"});
}

function download(name, text, type){
  try{
    var b=new Blob([text],{type:type||"text/plain;charset=utf-8"});
    var u=URL.createObjectURL(b);
    var a=document.createElement("a");
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); },600);
    return true;
  }catch(e){ return false; }
}

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v==null || v===false) continue;
    if(k==="class") e.className = v;
    else if(k==="text") e.textContent = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if(k==="value") e.value = v;
    else if(k==="checked") e.checked = !!v;
    else e.setAttribute(k, v===true ? "" : v);
  }
  kids.flat(Infinity).forEach(c=>{ if(c==null||c===false) return; e.appendChild(typeof c==="string"||typeof c==="number" ? document.createTextNode(String(c)) : c); });
  return e;
}

/* ---- answer-position balancing: the same shuffle the course uses ---- */
function optionOrder(id, n, salt){
  let h = 2166136261;
  for(let i=0;i<id.length;i++){ h = Math.imul(h ^ id.charCodeAt(i), 16777619); }
  let a = (h ^ salt) >>> 0;
  function rnd(){ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0); }
  const idx=[]; for(let k=0;k<n;k++) idx.push(k);
  for(let j=n-1;j>0;j--){ const r=rnd()%(j+1); const t2=idx[j]; idx[j]=idx[r]; idx[r]=t2; }
  return idx;
}
function positions(mods, salt){
  const out=[];
  mods.forEach(m=>m.sections.forEach(s=>{ if(s.check && !Array.isArray(s.check.a) && !s.check.order && !s.check.dec){ out.push(optionOrder(s.id, s.check.o.length, salt).indexOf(s.check.a)); } }));
  return out;
}
function dist(pos){ const d=[0,0,0,0,0,0]; pos.forEach(p=>d[p]++); return d; }
function saltScore(mods, salt){
  const pos=positions(mods, salt); if(!pos.length) return 0;
  const d=dist(pos).slice(0,4); const nOpts=Math.min(4, Math.max(...pos)+1);
  const used=d.slice(0,Math.max(nOpts,2));
  let s=(Math.max(...used)-Math.min(...used))*10;
  for(let i=2;i<pos.length;i++) if(pos[i]===pos[i-1]&&pos[i]===pos[i-2]) s+=3;
  return s;
}
function bestSalt(mods){
  let best=0, bs=Infinity;
  for(let s=0;s<4000;s++){ const sc=saltScore(mods,s); if(sc<bs){ bs=sc; best=s; if(sc===0) break; } }
  return best;
}

function htmlToMd(el){

  c.querySelectorAll("em,i").forEach(n=>n.replaceWith("*"+n.textContent+"*"));

}
function mainScript(text){
  const re=/<script>([\s\S]*?)<\/script>/gi; let m, best="";
  while((m=re.exec(text))) if(m[1].length>best.length) best=m[1];
  return best;
}
function funcSrc(src, name){

    p.notes = Object.keys(d.NOTES||{}).map(k=>({k:k, t:d.NOTES[k]}));

  const c = p.course;

  if(/function\s+orderFor\s*\(/.test(src) && /Math\.random/.test(funcSrc(src,"orderFor"))) c.shuffle = "trainee";
  const rp = src.match(/return "([A-Za-z0-9]+)-"\+d\.getFullYear/); if(rp) c.recordPrefix = rp[1];
  const sk = src.match(/"([A-Za-z0-9_]+)_state"/); c.storeKey = sk ? sk[1] : (c.fileStem||"").toLowerCase().replace(/[^a-z0-9]+/g,"_");
  const codes = src.match(/var\s+CODES\s*=\s*(\[[^\]]*\])/);
  if(codes){ try{ p.drill.codes = JSON.parse(codes[1]); }catch(e){} }

  const tr = p.config.trainerName;
  const untok = s => (tr && tr.length>2) ? s.split(tr).join("{trainer}") : s;
  const helpers = "\nvar AUTOSAVE=true;var NUMWORDS=['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve'];"+
    "function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}"+
    "function fmt(s){return esc(s).replace(/\\*\\*([^*]+)\\*\\*/g,'<strong>$1</strong>').replace(/\\*([^*]+)\\*/g,'<em>$1</em>');}"+
    "var STATE={checks:{},drills:{},answers:{},seen:{}};function drillHtml(){return '';}\n";
  const doc = s => new DOMParser().parseFromString("<div id='r'>"+s+"</div>","text/html");

  // start page
  try{
    const vs = funcSrc(src, "viewStart");
    if(vs){
      const html = new Function(pre+helpers+vs+"\nreturn viewStart();")();
      const r = doc(html);
      const kick = r.querySelector(".hero .kick");
      if(kick){ const t=kick.textContent; const i=t.indexOf(" · "); c.kicker = i>=0 ? t.slice(i+3).trim() : ""; }
      const h1 = r.querySelector(".hero h1"); if(h1) c.heroTitle = htmlToMd(h1);
      const sub = r.querySelector(".hero .subtitle"); c.subtitle = sub ? htmlToMd(sub) : "";
      const ps = [...r.querySelectorAll(".hero p")].filter(x=>!x.classList.contains("subtitle")&&!x.classList.contains("scale"));
      c.intro = ps.length ? untok(htmlToMd(ps[ps.length-1])) : "";
      const labels = p.modules.map(m=>m.label);
      const dts=[...r.querySelectorAll("dl.meta dt")];
      c.meta = dts.filter(dt=>labels.indexOf(dt.textContent.trim())<0).map(dt=>({k:dt.textContent.trim(), v:untok(htmlToMd(dt.nextElementSibling))}));
      const kept = [...r.querySelectorAll("#r > .callout")].find(x=>{ const l=x.querySelector(".lab"); return l && /How your work is kept/i.test(l.textContent); });
      if(kept) c.keptExtra = [...kept.querySelectorAll("p")].slice(1).map(q=>untok(htmlToMd(q)));
      c.callouts = [...r.querySelectorAll("#r > .callout")].filter(x=>{ const l=x.querySelector(".lab"); return !(l && /How your work is kept/i.test(l.textContent)); })
        .map(x=>({tone: x.classList.contains("teal")?"teal":(x.classList.contains("bg")?"bg":"rust"), lab:(x.querySelector(".lab")||{}).textContent||"", x:[...x.querySelectorAll("p")].map(q=>untok(htmlToMd(q)))}));
      const notes = r.querySelectorAll("#r > p.note"); c.closing = notes.length ? untok(htmlToMd(notes[notes.length-1])) : "";
    }
  }catch(e){ console.warn("start page", e); }
  if(!c.heroTitle) c.heroTitle = c.title;

  // exercise instructions
  try{
    const ve = funcSrc(src, "viewExercises");
    if(ve){
      const html = new Function(pre+helpers+"var TRAINER=false;function wordCount(){return '';}"+ve+"\nreturn viewExercises({id:'M',label:'',title:'',exercises:[]});")();
      const r = doc(html);
      c.exIntro = [...r.querySelectorAll("#r > p")].filter(x=>!x.classList.contains("note")).map(x=>untok(htmlToMd(x)));
    }
  }catch(e){ console.warn("exercises", e); }

  // drill page
  try{
    const vd = funcSrc(src, "viewDrill");
    if(vd){
      const html = new Function(pre+helpers+vd+"\nreturn viewDrill({id:'M',label:'',title:'@@',drill:[]});")();
      const r = doc(html);

      const lede = r.querySelector(".lede"); if(lede) p.drill.lede = htmlToMd(lede);
      const co = r.querySelector(".callout");
      if(co){ p.drill.assumptionsLab = (co.querySelector(".lab")||{}).textContent||""; p.drill.assumptions = [...co.querySelectorAll("p")].map(q=>htmlToMd(q)); }
      const hd = funcSrc(src,"drillHtml");
      const lb = hd.match(/<b>Line<\/b>[\s\S]*?<b>([^<]+)<\/b>[\s\S]*?<b>([^<]+)<\/b>/); if(lb){ p.drill.labels = {line:"Line", find:lb[1], pn:lb[2]}; }
      const tk = hd.match(/·\s*([^:"]+?):\s*"\+\(d\.a\.length/); if(tk) p.drill.takesLabel = tk[1].trim();
    }
  }catch(e){ console.warn("drill", e); }
  return {p:p, kind:"legacy"};
}

/* ==========================================================================
   STATE CHANGES, UNDO, AUTOSAVE, PREVIEW
   ========================================================================== */
function snapshot(){ return JSON.stringify(P); }
function commit(structural){
  // called after every change
  DIRTY = true;
  clearTimeout(commit.t);
  const push = ()=>{
    const s = snapshot();
    if(s!==lastSnap){ UNDO.push(lastSnap); if(UNDO.length>150) UNDO.shift(); REDO=[]; lastSnap=s; updUndo(); }
    persist();
  };
  if(structural){ push(); renderOutline(); renderEditor(); }
  else { commit.t = setTimeout(()=>{ push(); renderOutline(); }, 700); }
  schedulePreview();
  scheduleHealth();
}
function flushPending(){
  if(commit.t){ clearTimeout(commit.t); commit.t=null; const s=snapshot(); if(s!==lastSnap){ UNDO.push(lastSnap); REDO=[]; lastSnap=s; } }
}
function undo(){
  flushPending();
  if(!UNDO.length) return;
  REDO.push(lastSnap); lastSnap = UNDO.pop(); P = JSON.parse(lastSnap);
  fixSel(); renderAll(); persist(); toast("Undone.");
}
function redo(){
  if(!REDO.length) return;
  UNDO.push(lastSnap); lastSnap = REDO.pop(); P = JSON.parse(lastSnap);
  fixSel(); renderAll(); persist(); toast("Redone.");
}
function updUndo(){ $("bUndo").disabled = !UNDO.length; $("bRedo").disabled = !REDO.length; }
function fixSel(){
  if(SEL.mi!=null && !P.modules[SEL.mi]) SEL={k:"course"};
  else if(SEL.k==="sect" && !P.modules[SEL.mi].sections[SEL.si]) SEL={k:"mod", mi:SEL.mi};
}
let storeOK = true;
function persist(){
  clearTimeout(persist.t);
  persist.t = setTimeout(()=>{
    try{ localStorage.setItem(STORE, snapshot()); storeOK=true; }
    catch(e){ if(storeOK) toast("This browser could not keep an automatic copy (too large or blocked). Use Save draft to keep your work."); storeOK=false; }
  }, 400);
}
function loadProject(p, name){
  P = p; normalizeModules(P.modules);
  const b = blankProject().course;
  if(!P.course.markings) P.course.markings = b.markings;
  if(!P.course.markings.items) P.course.markings.items = [];
  if(!P.glossary) P.glossary = [];
  P.course.glossOpts = Object.assign({}, b.glossOpts, P.course.glossOpts||{});
  P.course.grading = Object.assign({}, b.grading, P.course.grading||{});
  if(typeof RES!=="undefined") RES = null;
  UNDO=[]; REDO=[]; lastSnap = snapshot(); updUndo();
  SEL = {k:"course"}; DIRTY=false;
  if(name) P._file = name;
  renderAll(); persist();
  if(document.body.classList.contains("resmode") && typeof renderResults==="function") renderResults();
  if(document.body.classList.contains("cmpmode") && typeof exitCompare==="function") exitCompare();
}

/* ---- preview ---- */
function pageFor(sel){
  if(sel.k==="sect") return "s:"+P.modules[sel.mi].sections[sel.si].id;
  if(sel.k==="drill") return "d:"+P.modules[sel.mi].id;
  if(sel.k==="ex") return "x:"+P.modules[sel.mi].id;
  if(sel.k==="mod"){ const m=P.modules[sel.mi]; return m.sections[0] ? "s:"+m.sections[0].id : "start"; }
  if(sel.k==="rules"||sel.k==="revs") return "trainer";
  return "start";
}
let pvPage = null;
function schedulePreview(now){
  if(document.body.classList.contains("nopv")) return;
  clearTimeout(schedulePreview.t);
  schedulePreview.t = setTimeout(renderPreview, now ? 10 : 900);
}
function renderPreview(){
  const f=$("pvFrame"); const page=pageFor(SEL);

  pvPage=page;

  f.onload = ()=>{ try{ if(y) f.contentWindow.scrollTo(0,y); }catch(e){} };
  try{ f.srcdoc = buildTraining(P, {preview:true, page:page, trainer:trainer}); }
  catch(e){ f.srcdoc = "<p style='font-family:sans-serif;padding:20px'>Preview failed: "+escHtml(e.message)+"</p>"; }
}

function newRevision(){
  const r = P.config.contentRev||"A";
  let n = r;
  if(/^[A-Y]$/i.test(r)) n = String.fromCharCode(r.toUpperCase().charCodeAt(0)+1);
  else if(/^\d+$/.test(r)) n = String(+r+1);
  else n = r+"1";
  P.config.contentRev = n;
  P.revisions.unshift({rev:n, date:today(), items:[""]});
  commit(true); toast("Now revision "+n+". A new entry is at the top of the revision log.");
}

function nextId(prefix, existing, width){
  let n=1; const set=new Set(existing);
  while(set.has(prefix+(width?String(n).padStart(width,"0"):n))) n++;
  return prefix+(width?String(n).padStart(width,"0"):n);
}
function allIds(){ const a=[]; P.modules.forEach(m=>{ a.push(m.id); m.sections.forEach(s=>a.push(s.id)); m.drill.forEach(d=>a.push(d.id)); m.exercises.forEach(x=>a.push(x.id)); }); return a; }
function addModule(){
  const id = nextId("M", P.modules.map(m=>m.id));
  const n = P.modules.length+1;
  const m = newModule(n); m.id=id; m.label="Module "+n; m.sections[0].id=id+"-01";
  P.modules.push(m); SEL={k:"mod", mi:P.modules.length-1}; commit(true);
}
function duplicateModule(mi){
  const m = clone(P.modules[mi]); const id = nextId("M", P.modules.map(x=>x.id));
  const re = new RegExp("^"+P.modules[mi].id.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  m.id=id; m.label=m.label+" (copy)";
  m.sections.forEach(s=>s.id=s.id.replace(re,id)); m.drill.forEach(d=>d.id=d.id.replace(re,id)); m.exercises.forEach(x=>x.id=x.id.replace(re,id));
  P.modules.splice(mi+1,0,m); SEL={k:"mod",mi:mi+1}; commit(true);
}
function addSection(mi, at){
  const m=P.modules[mi];
  const id = nextId(m.id+"-", allIds(), 2);
  const s = newSection(m.id, 1); s.id=id;
  if(at==null) at=m.sections.length;
  m.sections.splice(at,0,s); SEL={k:"sect", mi, si:at}; commit(true);
}

function blockCard(arr, i){
  const b=arr[i];

  card.addEventListener("focusin", ()=>card.classList.add("focus"));
  card.addEventListener("focusout", ()=>card.classList.remove("focus"));
  const typeSel = ["p","h","list","olist"].indexOf(b.t)>=0 ? h("select",{class:"btn sm",style:"padding:2px 6px;font-size:11.5px", title:"Change type", onchange:e=>{ convertText(b, e.target.value); commit(true); }},
    [["p","Paragraph"],["h","Sub-heading"],["list","Bullet list"],["olist","Numbered list"]].map(([v,t])=>h("option",{value:v,selected:v===b.t?"selected":null},t))) : null;
  card.appendChild(h("div",{class:"bh"}, h("span",{class:"ty"}, (BLOCKS[b.t]||{name:b.t}).name), typeSel, mover(arr,i),
    h("button",{class:"ib", title:"Duplicate", onclick:()=>{ arr.splice(i+1,0,clone(b)); commit(true); }}, "⧉"), delBtn(arr,i,"block")));
  card.appendChild(h("div",{class:"bb"}, blockBody(b)));

function convertText(b, to){
  const from=b.t;
  const asText = (from==="list"||from==="olist") ? (b.x||[]).join("\n") : String(b.x||"");

  b.x = (to==="list"||to==="olist") ? asText.split("\n") : asText.replace(/\n/g," ");

function blockBody(b){
  switch(b.t){
