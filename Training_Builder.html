/* ==========================================================================
   HEALTH CHECK
   ========================================================================== */
let HEALTH = [];
function scheduleHealth(){ clearTimeout(scheduleHealth.t); scheduleHealth.t=setTimeout(()=>{ HEALTH=lint(); updBadge(); }, 600); }
function updBadge(){
  const e=HEALTH.filter(i=>i.lvl==="err").length, wn=HEALTH.filter(i=>i.lvl==="warn").length;
  const b=$("hBadge"); b.textContent = e||wn; b.className="badge"+(e?"":" ok"); b.style.background = e?"":(wn?"var(--amber)":"");
  b.title = e+" problems, "+wn+" warnings";
}
function lint(){
  const out=[], add=(lvl,msg,sel)=>out.push({lvl,msg,sel});
  const seen={}, dupe=(id,what,sel)=>{ if(!id){ add("err", what+" has no ID.", sel); return; } if(/['"<>\s]/.test(id)) add("err", what+" ID “"+id+"” contains spaces or quote marks. Use letters, numbers, and dashes.", sel); if(seen[id]) add("err", "ID “"+id+"” is used twice ("+seen[id]+" and "+what+"). Every ID must be unique.", sel); else seen[id]=what; };
  const known = new Set(P.rules.map(r=>r.k)), used=new Set();
  if(!P.course.title.trim()) add("err","The course has no title.",{k:"course"});
  if(!P.config.trainerEmail && !P.config.submitEndpoint) add("warn","No trainer email is set, so trainees can only download or copy their record.",{k:"course"});
  if(P.config.trainerView) add("warn","Trainer view is switched on. Trainees will see grading notes. Switch it off before sending the training out.",{k:"course"});
  P.modules.forEach((m,mi)=>{
    dupe(m.id, m.label||"a module", {k:"mod",mi});
    if(!m.sections.length) add("warn", m.label+" has no sections.", {k:"mod",mi});
    m.sections.forEach((s,si)=>{
      const sel={k:"sect",mi,si};
      dupe(s.id, "section “"+s.title+"”", sel);
      if(!String(s.title||"").trim()) add("err", s.id+" has no title.", sel);
      if(!s.body.some(b=>!isEmptyBlock(b))) add("warn", s.id+" has no content yet.", sel);
      s.body.forEach(b=>{ if(b.t==="img" && !b.src) add("warn", s.id+" has an image block with no image.", sel); });
      const c=s.check;
      if(!c || c._off || !String(c.q||"").trim()){ if(!(c&&c._off)) add("warn", s.id+" has no check question. It will not count toward the score.", sel); }
      else{
        if(c.dec){
          const d=c.dec, B=d.blocks||[];
          if(B.some(b=>!String(b.n||"").trim())) add("err", s.id+": a block in the decomposition has no name.", sel);
          if(B.length<3) add("warn", s.id+": a decomposition with fewer than three blocks is too easy to guess.", sel);
          if(d.mode==="build" && !B.some((b,i)=>i>0 && !b.given)) add("err", s.id+": every block is marked Given, so there is nothing to place.", sel);
          if(d.mode==="errors"){ const n=B.filter((b,i)=>i>0 && b.shown!==""&&b.shown!=null && +b.shown!==b.p).length + (d.decoys||[]).filter(x=>String(x.n||"").trim()).length;
            if(!n) add("err", s.id+": Find the mistakes has no mistakes. Set “Shown under” on a block, or add a decoy.", sel); }
          if(d.mode==="label"){ const L=nonEmpty(d.labels);
            if(L.length<2) add("err", s.id+": Label the blocks needs at least two labels.", sel);
            if(B.some(b=>b.lab===""||b.lab==null||+b.lab>=L.length)) add("err", s.id+": every block needs its right label chosen.", sel);
            if(!B.some(b=>!b.given)) add("err", s.id+": every block is marked Given, so there is nothing to label.", sel); }
          if(!String(c.why||"").trim()) add("warn", s.id+": the check has no explanation.", sel);
        } else {
        const filled=c.o.filter(o=>String(o).trim());
        if(filled.length<2) add("err", s.id+": the check needs at least two options.", sel);
        if(c.order===true){
          const low=filled.map(x=>String(x).trim().toLowerCase());
          if(new Set(low).size<low.length) add("warn", s.id+": two items have the same text, so the order between them cannot be told apart.", sel);
          if(filled.length===2) add("warn", s.id+": a put-in-order question with two items is a coin toss. Three or more work better.", sel);
        } else if(Array.isArray(c.a)){
          if(!c.a.length) add("err", s.id+": no option is ticked as right. Tick at least one.", sel);
          else if(c.a.some(i=>!String(c.o[i]||"").trim())) add("err", s.id+": an option ticked as right is blank.", sel);
          else if(c.a.length===filled.length) add("warn", s.id+": every option is ticked as right, so ticking everything always scores.", sel);
        } else if(!String(c.o[c.a]||"").trim()) add("err", s.id+": the option marked correct is blank.", sel);
        if(filled.length<c.o.length && filled.length>=2) add("warn", s.id+": a blank check option will be left out.", sel);
        if(!String(c.why||"").trim()) add("warn", s.id+": the check has no explanation.", sel);
        }
      }
      (s.gov||[]).forEach(g=>{ used.add(g); if(!known.has(g)) add("warn", s.id+" is tagged with rule “"+g+"”, which is not in the source map.", sel); });
    });
    m.drill.forEach(d=>{
      const sel={k:"drill",mi};
      dupe(d.id, "drill line "+d.id, sel);
      if(!String(d.nm||"").trim()) add("warn", d.id+" has no item name.", sel);
      d.a.forEach(x=>{ if(P.drill.codes.indexOf(x)<0) add("err", d.id+" expects “"+x+"”, which is not in the drill code list.", sel); });
      if(!String(d.why||"").trim()) add("warn", d.id+" has no explanation.", sel);
      if(!d.a.length && P.drill.noneLabel==="") add("err", d.id+" has no correct codes, and the “nothing applies” choice is switched off.", sel);
    });
    if(m.drill.length && !P.drill.codes.length) add("err", m.label+" has drill lines but no drill codes are set up.", {k:"drillset"});
    m.exercises.forEach(x=>{
      const sel={k:"ex",mi};
      dupe(x.id, "exercise “"+x.title+"”", sel);
      const ps={};
      x.parts.forEach(pt=>{ if(ps[pt.id]) add("err", x.id+": question part “"+pt.id+"” is used twice.", sel); ps[pt.id]=1; if(!String(pt.q||"").trim()) add("warn", x.id+" part "+pt.id+" has no question, so it will be left out.", sel); });
    });
  });
  const gseen={};
  (P.glossary||[]).forEach((g,i)=>{ const t=String(g.t||"").trim();
    if(!t){ if(String(g.d||"").trim()) add("warn","Glossary entry "+(i+1)+" has a definition but no term.",{k:"gloss"}); return; }
    if(!String(g.d||"").trim()) add("warn","Glossary term “"+t+"” has no definition yet, so it is left out.",{k:"gloss"});
    const k=t.toLowerCase(); if(gseen[k]) add("err","Glossary term “"+t+"” is listed twice.",{k:"gloss"}); gseen[k]=1; });
  (P.course.markings.items||[]).forEach((m,i)=>{ if(!String(m.text||"").trim()) add("warn","Marking "+(i+1)+" has no text, so it will be left out.",{k:"marks"}); if(/\[[^\]]+\]/.test(m.text||"")) add("warn","Marking "+(i+1)+" still has a [placeholder] in it.",{k:"marks"}); });
  P.rules.forEach(r=>{ if(!used.has(r.k)) add("info", "Rule “"+r.k+"” is not used by any section.", {k:"rules"}); });
  const kk={}; P.rules.forEach(r=>{ if(kk[r.k]) add("err","Rule key “"+r.k+"” is listed twice.",{k:"rules"}); kk[r.k]=1; });
  return out;
}
function showHealth(){
  HEALTH=lint(); updBadge(); renderOutline();
  const e=HEALTH.filter(i=>i.lvl==="err"), wn=HEALTH.filter(i=>i.lvl==="warn"), inf=HEALTH.filter(i=>i.lvl==="info");
  const body=[];
  let nS=0,nC=0,nD=0,nX=0; P.modules.forEach(m=>{ nS+=m.sections.length; nC+=m.sections.filter(s=>s.check&&!s.check._off&&String(s.check.q).trim()).length; nD+=m.drill.length; nX+=m.exercises.length; });
  body.push(h("p",{style:"margin:0 0 12px;font-size:13.5px"}, P.modules.length+" modules · "+nS+" sections · "+nC+" checks · "+nD+" drill lines · "+nX+" exercises"));
  if(!HEALTH.length) body.push(h("div",{class:"okbox"},"No problems found."));
  else if(!e.length) body.push(h("div",{class:"okbox"},"No problems that would stop the training working. Warnings are worth a look."));
  else body.push(h("div",{class:"errbox"}, e.length+" problem"+(e.length===1?"":"s")+" to fix. Click one to go to it."));
  e.concat(wn, inf).forEach(i=>body.push(h("button",{class:"issue", onclick:()=>{ closeModal(); select(i.sel); }}, h("span",{class:"lv "+i.lvl}, i.lvl==="err"?"Problem":(i.lvl==="warn"?"Warning":"Note")), h("span",null,i.msg))));
  openModal("Health check", body);
}

function openFile(file){
  const r=new FileReader();
  r.onload=()=>{
    const text=String(r.result);
    try{
      if(/\.json$/i.test(file.name) || /^\s*\{/.test(text)){
        const p=JSON.parse(text); if(!p.modules) throw new Error("That .json file is not a Training Builder draft.");
        const b=blankProject(); for(const k in b) if(p[k]===undefined) p[k]=b[k];
        loadProject(p, file.name); toast("Draft opened: "+file.name);
      }else{
        const res=importTraining(text);
        loadProject(res.p, file.name);
        toast(res.kind==="legacy" ? "Opened "+file.name+". Its content, start page, and settings came across. Check the Start page and Course settings once." : "Opened "+file.name+".");

  };
  r.readAsText(file);
}
function printDialog(){

  const save=(mode)=>{ download(stemOf(P)+"_Rev"+(P.config.contentRev||"")+(mode==="key"?"_answer_key":"_handout")+".html", buildTraining(P,{print:mode}), "text/html;charset=utf-8"); toast("Downloaded. Open it in a browser and use Print, or Save as PDF."); };
  openModal("Printable versions", [
    e.length ? h("div",{class:"warnbox"}, "The Health check found "+e.length+" problem"+(e.length===1?"":"s")+". The printout may be incomplete until "+(e.length===1?"it is":"they are")+" fixed.") : null,
    h("div",{class:"choice",style:"cursor:default"}, h("b",null,"Trainee handout"), h("span",null,"The whole course on paper: every section, every check with tick boxes, drill lines, and ruled lines for the written exercises. No answers."),
      h("div",{class:"acts",style:"margin:10px 0 0"}, h("button",{class:"btn pri sm", onclick:()=>{ closeModal(); open("handout"); }}, "Open print view"), h("button",{class:"btn sm", onclick:()=>{ closeModal(); save("handout"); }}, "Download"))),
    h("div",{class:"choice",style:"cursor:default"}, h("b",null,"Trainer answer key"), h("span",null,"The same pages with the right answers marked, every explanation, the drill answers, the grading notes for the written exercises, and the revision history. Marked “do not give to trainees”."),
      h("div",{class:"acts",style:"margin:10px 0 0"}, h("button",{class:"btn pri sm", onclick:()=>{ closeModal(); open("key"); }}, "Open print view"), h("button",{class:"btn sm", onclick:()=>{ closeModal(); save("key"); }}, "Download"))),

  ]);

function wrapSel(mark){
  const el = (document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName)) ? document.activeElement : lastField;
  if(!el || !el.isConnected || el.type==="number" || el.type==="date" || el.type==="checkbox") { toast("Click into a text box and select some words first."); return; }
  const a=el.selectionStart, b=el.selectionEnd, v=el.value;
  let s=a, e=b; while(s<e && v[s]===" ") s++; while(e>s && v[e-1]===" ") e--;
  const inner=v.slice(s,e);
  let nv, ns, ne;
  if(v.slice(s-mark.length,s)===mark && v.slice(e,e+mark.length)===mark && !(mark==="*" && v.slice(s-2,s)==="**" && v.slice(e,e+2)==="**" )){ nv=v.slice(0,s-mark.length)+inner+v.slice(e+mark.length); ns=s-mark.length; ne=ns+inner.length; }
  else { nv=v.slice(0,s)+mark+(inner||"text")+mark+v.slice(e); ns=s+mark.length; ne=ns+(inner||"text").length; }
  el.value=nv; el.focus(); el.setSelectionRange(ns,ne);
  el.dispatchEvent(new Event("input",{bubbles:true}));
}

$("mClose").onclick=closeModal;
$("modal").addEventListener("click", e=>{ if(e.target.id==="modal") closeModal(); });
document.addEventListener("keydown", e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(e.key==="Escape") closeModal();
  if(mod && !e.shiftKey && e.key.toLowerCase()==="z"){ const t=document.activeElement; if(t&&/TEXTAREA|INPUT/.test(t.tagName)&&commit.t) return; e.preventDefault(); undo(); }
  else if(mod && (e.key.toLowerCase()==="y" || (e.shiftKey && e.key.toLowerCase()==="z"))){ e.preventDefault(); redo(); }
  else if(mod && e.key.toLowerCase()==="b" && /TEXTAREA|INPUT/.test((document.activeElement||{}).tagName||"")){ e.preventDefault(); wrapSel("**"); }
  else if(mod && e.key.toLowerCase()==="i" && /TEXTAREA|INPUT/.test((document.activeElement||{}).tagName||"")){ e.preventDefault(); wrapSel("*"); }
  else if(mod && e.key.toLowerCase()==="s"){ e.preventDefault(); $("bDraft").click(); }
});
let dragN=0;
window.addEventListener("dragenter", e=>{ if(e.dataTransfer && [...e.dataTransfer.types].indexOf("Files")>=0){ dragN++; $("drop").classList.add("show"); } });
window.addEventListener("dragleave", ()=>{ dragN=Math.max(0,dragN-1); if(!dragN) $("drop").classList.remove("show"); });
window.addEventListener("dragover", e=>e.preventDefault());
window.addEventListener("drop", e=>{ e.preventDefault(); dragN=0; $("drop").classList.remove("show");
  const fs=[...e.dataTransfer.files].filter(f=>/\.(html?|json)$/i.test(f.name)); if(!fs.length) return;
  if(document.body.classList.contains("resmode")) resAddFiles(fs); else if(document.body.classList.contains("cmpmode")) loadCompareFile(fs[0]); else openFile(fs[0]); });
window.addEventListener("beforeunload", e=>{ if(DIRTY && !storeOK){ e.preventDefault(); e.returnValue=""; } });

/* ---- start ---- */
(function boot(){
  if(window.innerWidth<=980) document.body.classList.add("nopv");
  let p=null;
  try{ const raw=localStorage.getItem(STORE); if(raw) p=JSON.parse(raw); }catch(e){ storeOK=false; }
  if(p && p.modules){ loadProject(p); DIRTY=false; toast("Welcome back. Your last training is open."); }
  else { loadProject(starterProject()); setTimeout(()=>toast("A starter example is open. Use Open… to load an existing training, or New to start fresh."), 300); }
})();

/* ---------- storage ---------- */
function resKey(){ return "trainingBuilder_results_"+String(P.course.storeKey||stemOf(P)).toLowerCase(); }
function resLoad(){
  try{ const raw=localStorage.getItem(resKey()); if(raw){ const o=JSON.parse(raw); if(o && o.trainees) return o; } }catch(e){}
  return {kind:"gradebook", v:1, trainees:[]};
}
let resStoreWarned=false;
function resSave(){
  clearTimeout(resSave.t);
  resSave.t=setTimeout(()=>{
    try{ localStorage.setItem(resKey(), JSON.stringify(RES)); }
    catch(e){ if(!resStoreWarned) toast("This browser could not keep an automatic copy of the results. Use Save gradebook to keep your grading."); resStoreWarned=true; }
  }, 300);
}
function ensureRes(){ if(!RES) RES=resLoad(); return RES; }

/* ---------- course index ---------- */
function plainT(s){ return mkTok(String(s||"")).replace(/\*\*/g,"").replace(/\*([^*]+)\*/g,"$1"); }
function cidx(){
  const mods=cleanModules(P.modules), checks=[], drills=[], parts=[], ex=[];
  mods.forEach(m=>{
    m.sections.forEach(s=>{ if(s.check) checks.push({id:s.id, m:m, title:s.title, q:s.check.q, o:s.check.o, a:s.check.a, why:s.check.why, order:s.check.order===true, dec:s.check.dec||null}); });
    m.drill.forEach(d=>drills.push({id:d.id, m:m, d:d}));
    m.exercises.forEach(x=>{ ex.push({m:m, x:x}); x.parts.forEach(pt=>parts.push({key:x.id+"."+pt.id, m:m, x:x, pt:pt})); });
  });
  return {mods, checks, drills, parts, ex};
}
/* decomposition helpers */
function decAllR(d){ return d.blocks.map((b,i)=>({n:plainT(b.n), p:i===0?-1:+b.p, given:!!b.given, lab:b.lab, shown:b.shown, decoy:false}))
  .concat(d.mode==="label"?[]:(d.decoys||[]).map(x=>({n:plainT(x.n), p:-2, decoy:true, shown:x.shown}))); }
function decErrs(all){ return all.map((b,i)=>i).filter(i=>i>0 && (all[i].decoy || (all[i].shown!=null && all[i].shown!=="" && +all[i].shown!==all[i].p))); }
function decWrong(c, picks){ // indices of blocks the trainee got wrong
  const d=c.dec, all=decAllR(d), p=picks||[];
  if(d.mode==="build") return all.map((b,i)=>i).filter(i=>i>0 && !all[i].given && p[i]!==all[i].p);
  if(d.mode==="errors"){ const E=decErrs(all); return all.map((b,i)=>i).filter(i=>i>0 && ((E.indexOf(i)>=0)!==(p.indexOf(i)>=0))); }
  return all.map((b,i)=>i).filter(i=>!all[i].given && p[i]!==+all[i].lab);
}
function decRightText(c){
  const d=c.dec, all=decAllR(d);
  const path=i=>{ const r=[]; let g=0; while(i>=0 && g++<20){ r.unshift(all[i].n); i=all[i].p; } return r.join(" › "); };
  if(d.mode==="errors") return "Mistakes: "+decErrs(all).map(i=>all[i].n).join("; ");
  if(d.mode==="label") return all.map(b=>b.n+": "+((d.labels||[])[+b.lab]||"")).join("; ");
  return all.map((b,i)=>i).filter(i=>i>0).map(i=>all[i].decoy ? all[i].n+" › "+(d.bin||"not part of this product") : path(i)).join("; ");
}
function decPickedText(c, picks){
  const d=c.dec, all=decAllR(d), p=picks||[];
  if(!p.length) return "(not in the file)";
  if(d.mode==="errors"){ return "Flagged: "+(p.map(i=>all[i]&&all[i].n).filter(Boolean).join("; ")||"nothing"); }
  const W=decWrong(c,p); if(!W.length) return "all right";
  if(d.mode==="label") return W.map(i=>all[i].n+": "+((d.labels||[])[p[i]]||"no label")+" (right: "+((d.labels||[])[+all[i].lab]||"")+")").join("; ");
  const nm=j=> j===-2 ? (d.bin||"the bin") : (j===-9||j==null ? "not placed" : (all[j]?all[j].n:"?"));
  return W.map(i=>all[i].n+" under "+nm(p[i])+" (right: "+nm(all[i].p)+")").join("; ");
}
function rightSet(c){ return c.order ? c.o.map((_,i)=>i) : (Array.isArray(c.a) ? c.a : [c.a]); }
function optText(c, idxs){ if(c.dec) return decRightText(c); return (idxs||[]).filter(i=>c.o[i]!=null).map(i=>plainT(c.o[i])).join(c.order ? " → " : "; "); }
function pickedText(c, r){ if(c.dec) return decPickedText(c, r&&r.picks); const p=(r&&r.picks)||[]; return p.length ? optText(c,p) : "(not in the file)"; }
function grading(){ return Object.assign({passPct:80, drillPct:"", exAll:true, cert:true}, P.course.grading||{}); }
function pctOf(a,b){ return b ? Math.round(100*a/b) : 0; }
function ansOf(t,key){ return String((t.data.answers||{})[key]||"").trim(); }
function gradeOf(t,key){ return (t.grades[key]||{}).g||""; }

function tstats(t, C){
  const d=t.data;
  let cR=0,cA=0; C.checks.forEach(c=>{ const r=(d.checks||{})[c.id]; if(r){ cA++; if(r.first===true) cR++; } });
  let dR=0,dA=0; C.drills.forEach(x=>{ const r=(d.drills||{})[x.id]; if(r){ dA++; if(r.first===true) dR++; } });
  let w=0,ok=0,rw=0,ug=0; C.parts.forEach(p=>{ const v=ansOf(t,p.key), g=gradeOf(t,p.key); if(v) w++; if(g==="ok") ok++; else if(g==="rework") rw++; else if(v) ug++; });
  const nC=C.checks.length, nD=C.drills.length, nP=C.parts.length, G=grading();
  const cp=pctOf(cR,nC), dp=pctOf(dR,nD);
  const crit=[];
  if(nC) crit.push({t:"Section checks right first time: "+cR+" of "+nC+" ("+cp+"%). Pass mark "+(+G.passPct||0)+"%.", ok: cp>=(+G.passPct||0)});
  if(nD && G.drillPct!=="" && G.drillPct!=null) crit.push({t:"Drill lines right first time: "+dR+" of "+nD+" ("+dp+"%). Pass mark "+(+G.drillPct)+"%.", ok: dp>=(+G.drillPct)});
  if(nP && G.exAll) crit.push({t:"Written answers graded acceptable: "+ok+" of "+nP+".", ok: ok===nP});
  const meets = crit.every(c=>c.ok);
  const known=new Set(C.checks.map(c=>c.id).concat(C.drills.map(x=>x.id), C.parts.map(p=>p.key)));
  const unknown = Object.keys(d.checks||{}).concat(Object.keys(d.drills||{}), Object.keys(d.answers||{}).filter(k=>String(d.answers[k]||"").trim())).filter(k=>!known.has(k));
  const so=t.signoff||{};
  let st, cls;
  if(so.decision==="complete"){ st="Signed off"; cls="done"; }
  else if(so.decision==="rework"){ st="Rework requested"; cls="rework"; }
  else if(cA<nC || w<nP || dA<nD){ st="Incomplete"; cls="inc"; }
  else if(ug>0){ st="Needs grading"; cls="grade"; }
  else if(meets){ st="Ready to sign off"; cls="ready"; }
  else { st="Below pass mark"; cls="below"; }
  if(so.decision!=="complete" && so.decision!=="rework" && cls==="inc" && ug>0){ st="Needs grading"; cls="grade"; }
  return {cR,cA,nC,cp, dR,dA,nD,dp, w,ok,rw,ug,nP, crit, meets, unknown, st, cls};
}
function statusChip(s){ return h("span",{class:"st "+s.cls}, s.st); }
function pbar(p, lo){ const c = p<(lo||60) ? "lo" : (p<80 ? "mid" : ""); return h("div",{class:"bar"}, h("i",{class:c, style:"width:"+p+"%"})); }
function tdate(t){ const d=t.data; return d.saved || t.completed || d.started || ""; }
function fmtDate(s){ if(!s) return ""; const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s)); const d = m ? new Date(+m[1],+m[2]-1,+m[3]) : new Date(s); return isNaN(d) ? String(s) : d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}); }

/* ---------- loading trainee files ---------- */
function normName(s){ return String(s||"").trim().toLowerCase().replace(/\s+/g," "); }
function addTrainee(entry, report){
  ensureRes();
  const key = normName(entry.name) || ("file:"+entry.file);
  const ex = RES.trainees.find(t=>t.key===key);
  if(ex){
    const a=new Date(tdate(ex)||0), b=new Date(tdate(entry)||0);
    if(b>=a){ ex.data=entry.data; ex.file=entry.file; ex.kind=entry.kind; ex.completed=entry.completed||ex.completed; ex.loaded=new Date().toISOString(); report.updated.push(entry.name||entry.file); }
    else report.older.push(entry.name||entry.file);
    return;
  }
  RES.trainees.push({key, name:entry.name||"", file:entry.file, kind:entry.kind, completed:entry.completed||"", loaded:new Date().toISOString(),
    data:entry.data, grades:{}, comment:"", signoff:{}});
  report.added.push(entry.name||entry.file);
}
function cleanState(o){
  const d={checks:o.checks||{}, drills:o.drills||{}, answers:o.answers||{}, seen:o.seen||{}};
  ["started","saved","order"].forEach(k=>{ if(o[k]!==undefined) d[k]=o[k]; });
  return d;
}
function nodeText(el){ if(!el) return ""; const c=el.cloneNode(true); c.querySelectorAll("br").forEach(b=>b.replaceWith("\n")); return c.textContent; }
function parseRecordDoc(doc, C){
  const data={checks:{}, drills:{}, answers:{}, seen:{}};
  let name="", completed="";
  doc.querySelectorAll("table.meta tr").forEach(tr=>{
    const k=(tr.querySelector("th")||{}).textContent, v=((tr.querySelector("td")||{}).textContent||"").trim();
    if(/trainee/i.test(k||"")) name = /not entered/i.test(v) ? "" : v;
    if(/completed/i.test(k||"")) completed=v;
  });
  const checkIds=new Set(C.checks.map(c=>c.id)), drillIds=new Set(C.drills.map(x=>x.id));
  const none=String(P.drill.noneLabel||"no code").toLowerCase();
  doc.querySelectorAll("table:not(.meta) tbody tr").forEach(tr=>{
    const k=tr.querySelector("td.k"); if(!k) return;
    const id=k.textContent.trim(), cls=tr.className.trim();
    if(cls==="na") return;
    if(checkIds.has(id)) data.checks[id]={first:cls==="ok", picks:[]};
    else if(drillIds.has(id)){
      const tds=tr.querySelectorAll("td"); const txt=(tds[2]&&tds[2].textContent.trim())||"";
      const picks = (!txt || txt.toLowerCase()===none || /^no code$/i.test(txt)) ? ["NONE"] : txt.split(/,\s*/);
      data.drills[id]={first:cls==="ok", picks:picks};
    }
  });
  doc.querySelectorAll(".ex").forEach(exd=>{
    const title=((exd.querySelector("h3")||{}).textContent||"").trim();
    const E=C.ex.find(e=>plainT(e.x.title).trim()===title);
    if(!E) return;
    exd.querySelectorAll("p.q").forEach(q=>{
      const pid=q.textContent.split(")")[0].trim();
      let a=q.nextElementSibling; if(!a || !a.classList.contains("a")) return;
      if(!a.classList.contains("empty")) data.answers[E.x.id+"."+pid]=nodeText(a).trim();
    });
  });
  return {name, data, completed};
}
function readFileText(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result)); r.onerror=rej; r.readAsText(f); }); }
async function resAddFiles(files){
  ensureRes();
  const C=cidx(), report={added:[],updated:[],older:[],bad:[],gb:0};
  for(const f of files){
    try{
      const text=await readFileText(f);
      if(/\.json$/i.test(f.name) || /^\s*[\[{]/.test(text)){
        const o=JSON.parse(text);
        if(o && o.kind==="gradebook" && o.trainees){ mergeGradebook(o, report); continue; }
        if(o && o.kind==="training-record" && o.state){ addTrainee({name:o.state.name, file:f.name, kind:"record", completed:o.completed, data:cleanState(o.state)}, report); continue; }
        if(o && o.checks && o.answers){ addTrainee({name:o.name, file:f.name, kind:o.record?"sent":"progress", completed:o.completed||"", data:cleanState(o)}, report); continue; }
        if(o && o.modules && o.course){ report.bad.push(f.name+" is a Training Builder draft. Use Open… to edit it."); continue; }
        report.bad.push(f.name+" is not a trainee file."); continue;
      }
      const doc=new DOMParser().parseFromString(text,"text/html");
      const emb=doc.getElementById("training-record-data");
      if(emb){ const o=JSON.parse(emb.textContent); addTrainee({name:o.state.name, file:f.name, kind:"record", completed:o.completed, data:cleanState(o.state)}, report); continue; }
      if(/training record/i.test((doc.querySelector("h1")||{}).textContent||"") && doc.querySelector("table.meta")){
        const r=parseRecordDoc(doc, C);
        addTrainee({name:r.name, file:f.name, kind:"record", completed:r.completed, data:r.data}, report); continue;
      }
      if(/var\s+MODULES\s*=/.test(text)){ report.bad.push(f.name+" is a training, not a trainee file. Use Open… to load a training."); continue; }
      report.bad.push(f.name+" is not a trainee file.");
    }catch(e){ console.error(e); report.bad.push(f.name+": could not be read ("+(e.message||e)+")."); }
  }
  resSave(); renderResults();
  const bits=[];
  if(report.added.length) bits.push(report.added.length+" added");
  if(report.updated.length) bits.push(report.updated.length+" updated with a newer file");
  if(report.older.length) bits.push(report.older.length+" skipped (older than the one already loaded)");
  if(report.gb) bits.push("gradebook merged");
  if(report.bad.length) openModal("Some files were not loaded", [h("div",{class:"warnbox"}, bits.join(", ")||"Nothing loaded."), h("ul",null, report.bad.map(b=>h("li",{style:"font-size:13px;margin-bottom:4px"},b)))]);
  else toast(bits.join(", ")+".");
}
function mergeGradebook(o, report){
  o.trainees.forEach(t=>{
    const ex=RES.trainees.find(x=>x.key===t.key);
    if(!ex){ RES.trainees.push(t); report.added.push(t.name||t.file); }
    else { Object.assign(ex, t); report.updated.push(t.name||t.file); }
  });
  report.gb++;
}

/* ---------- mode switch ---------- */
function setResMode(on){
  flushPending();
  document.body.classList.toggle("resmode", on);
  $("bRes").textContent = on ? "← Back to editing" : "Results";
  if(on){ ensureRes(); renderResults(); }
}

/* ---------- rendering ---------- */
function markStrip(){
  const items=(P.course.markings.items||[]).filter(m=>String(m.text||"").trim() && (m.kind||"banner")==="banner");
  if(!items.length) return null;
  return h("div",{class:"rstrip"}, items.map(m=>{ const c=mkCol(m); return h("div",{class:"mk", style:"background:"+c.bg+";color:"+c.fg}, mkTok(m.text)); }));
}
function renderResults(){
  ensureRes();
  const box=$("results"); const scN=(box.querySelector(".rnav")||{}).scrollTop||0, scM=(box.querySelector(".rmain")||{}).scrollTop||0;
  box.innerHTML="";
  const C=cidx();
  const nav=h("nav",{class:"rnav"}), main=h("div",{class:"rmain"});
  box.append(nav, main);
  // nav
  const sel=o=>{ RSEL=o; renderResults(); $("results").querySelector(".rmain").scrollTop=0; };
  const item=(o, id, nm, extra)=>h("button",{class:"oitem"+((RSEL.k===o.k && RSEL.i===o.i)?" on":""), onclick:()=>sel(o)}, h("span",{class:"id"},id), h("span",{class:"nm"},nm), extra||null);
  nav.appendChild(h("div",{class:"oh"},"Results"));
  nav.appendChild(item({k:"roster"},"▦","All trainees", h("span",{class:"ct"}, RES.trainees.length)));
  nav.appendChild(item({k:"items"},"?","Question analysis"));
  nav.appendChild(h("div",{class:"oh"},"Trainees"));
  const order=RES.trainees.map((t,i)=>({t,i})).sort((a,b)=>(a.t.name||a.t.file).localeCompare(b.t.name||b.t.file));
  order.forEach(({t,i})=>{ const s=tstats(t,C); nav.appendChild(item({k:"t",i}, "", t.name||t.file, h("span",{class:"st "+s.cls, style:"font-size:9px;padding:1px 5px"}, s.st))); });
  nav.appendChild(h("button",{class:"oadd big", onclick:()=>$("resIn").click()}, "+ Add trainee files"));
  nav.scrollTop=scN;
  // main
  const w=h("div",{class:"ed"}); const strip=markStrip(); if(strip) main.appendChild(strip); main.appendChild(w);
  if(RSEL.k==="t" && !RES.trainees[RSEL.i]) RSEL={k:"roster"};
  if(RSEL.k==="roster") viewRoster(w,C);
  else if(RSEL.k==="items") viewItems(w,C);
  else viewTrainee(w,C,RES.trainees[RSEL.i],RSEL.i);
  main.scrollTop=scM;
}
function resActions(){
  return h("div",{class:"acts"},
    h("button",{class:"btn pri", onclick:()=>$("resIn").click()}, "Add trainee files…"),

function viewRoster(w,C){
  const G=grading();
  w.append(...head(null, "Results · Rev "+(P.config.contentRev||"?"), "Results: "+(P.course.title||"")));
  w.appendChild(resActions());
  if(!RES.trainees.length){
    w.appendChild(h("div",{class:"dropzone"}, h("b",null,"Drop trainee files here"),
      "Progress files (.json) from Save progress, downloaded training records (.html), or a saved gradebook. You can drop many at once. ",
      "Files from this training and from your earlier hand-built trainings both work."));
  }
  const S=RES.trainees.map((t,i)=>({t,i,s:tstats(t,C)}));
  if(S.length){
    const avg=Math.round(S.reduce((a,x)=>a+x.s.cp,0)/S.length);
    w.appendChild(h("div",{class:"tiles"},
      h("div",{class:"tile"}, h("div",{class:"big"}, String(S.length)), h("div",{class:"lab"},"Trainees")),
      h("div",{class:"tile"}, h("div",{class:"big"}, avg+"%"), h("div",{class:"lab"},"Average checks right first time")),
      h("div",{class:"tile"}, h("div",{class:"big"}, String(S.filter(x=>x.s.cls==="grade").length)), h("div",{class:"lab"},"Need grading")),
      h("div",{class:"tile"}, h("div",{class:"big"}, S.filter(x=>x.s.cls==="done").length+" / "+S.length), h("div",{class:"lab"},"Signed off"))));

/* ---------- question analysis ---------- */
function itemData(C){
  const T=RES.trainees;
  const checks=C.checks.map(c=>{
    const nOpt = c.dec ? decAllR(c.dec).length : c.o.length;
    let att=0, right=0; const picks=new Array(nOpt).fill(0), wrongPicks=new Array(nOpt).fill(0); let unknownPick=0;
    T.forEach(t=>{ const r=(t.data.checks||{})[c.id]; if(!r) return; att++; if(r.first===true) right++;
      const ps=r.picks||[]; if(!ps.length){ if(r.first!==true) unknownPick++; return; }
      if(c.dec){ const W=decWrong(c, ps); W.forEach(i=>wrongPicks[i]++); for(let i=0;i<nOpt;i++) if(W.indexOf(i)<0) picks[i]++; return; }
      if(c.order){ ps.forEach((it,pos)=>{ if(picks[it]!=null && it===pos) picks[it]++; if(wrongPicks[it]!=null && it!==pos) wrongPicks[it]++; }); return; }
      const R=rightSet(c); ps.forEach(p=>{ if(picks[p]!=null){ picks[p]++; if(R.indexOf(p)<0) wrongPicks[p]++; } }); });
    let wi=-1, wn=0; wrongPicks.forEach((n,i)=>{ if(n>wn){ wn=n; wi=i; } });
    return {c, att, right, pct:att?Math.round(100*right/att):null, picks, wi, wn, unknownPick};
  });
  const drills=C.drills.map(x=>{
    let att=0,right=0; const wrong={};
    T.forEach(t=>{ const r=(t.data.drills||{})[x.id]; if(!r) return; att++; if(r.first===true) right++; else { const k=(r.picks||[]).join(", ")||"?"; wrong[k]=(wrong[k]||0)+1; } });
    const top=Object.entries(wrong).sort((a,b)=>b[1]-a[1])[0];
    return {x, att, right, pct:att?Math.round(100*right/att):null, top};
  });
  const parts=C.parts.map(p=>{ let w=0,ok=0,rw=0; T.forEach(t=>{ if(ansOf(t,p.key)) w++; const g=gradeOf(t,p.key); if(g==="ok") ok++; if(g==="rework") rw++; }); return {p,w,ok,rw}; });
  return {checks, drills, parts};
}

/* ---------- Excel export (a real .xlsx, written without any library) ---------- */
function crc32(buf){
  let t=crc32.t; if(!t){ t=crc32.t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } }
  let c=0xFFFFFFFF; for(let i=0;i<buf.length;i++) c=t[(c^buf[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0;
}
function zipStore(files){ // files: [{name, data:Uint8Array}]
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const u16=n=>[n&255,(n>>>8)&255], u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  files.forEach(f=>{
    const nm=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
    parts.push(lh, nm, f.data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]), nm);
    off += lh.length+nm.length+sz;
  });
  const cdSize=central.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  return new Blob([...parts, ...central, end], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function xesc(s){ return String(s==null?"":s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function colName(i){ let s=""; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
function sheetXml(sh, hdrText, ftrText){
  // sh: {rows:[[...]], head: index of header row, widths:[...]}
  const rowsXml=sh.rows.map((r,ri)=>"<row r='"+(ri+1)+"'>"+r.map((v,ci)=>{
    const ref=colName(ci)+(ri+1), st = ri===sh.head ? " s='1'" : (ri<sh.head ? " s='3'" : " s='2'");
    if(v==null || v==="") return "";
    if(typeof v==="number" && isFinite(v)) return "<c r='"+ref+"'"+st+"><v>"+v+"</v></c>";
    let t=String(v); if(t.length>32000) t=t.slice(0,32000)+"…";
    return "<c r='"+ref+"'"+st+" t='inlineStr'><is><t xml:space='preserve'>"+xesc(t)+"</t></is></c>";
  }).join("")+"</row>").join("");
  const n=Math.max(1,...sh.rows.map(r=>r.length));
  const cols="<cols>"+(sh.widths||[]).map((w,i)=>"<col min='"+(i+1)+"' max='"+(i+1)+"' width='"+w+"' customWidth='1'/>").join("")+"</cols>";
  const pane = sh.head>=0 ? "<sheetViews><sheetView workbookViewId='0'><pane ySplit='"+(sh.head+1)+"' topLeftCell='A"+(sh.head+2)+"' activePane='bottomLeft' state='frozen'/></sheetView></sheetViews>" : "";
  const af = sh.head>=0 && sh.rows.length>sh.head+1 ? "<autoFilter ref='A"+(sh.head+1)+":"+colName(n-1)+sh.rows.length+"'/>" : "";
  const hf = (hdrText||ftrText) ? "<headerFooter>"+(hdrText?"<oddHeader>&amp;C&amp;\"-,Bold\""+xesc(hdrText.replace(/&/g,"&&"))+"</oddHeader>":"")+(ftrText?"<oddFooter>&amp;C&amp;\"-,Bold\""+xesc(ftrText.replace(/&/g,"&&"))+"</oddFooter>":"")+"</headerFooter>" : "";
  return "<?xml version='1.0' encoding='UTF-8' standalone='yes'?><worksheet xmlns='http://schemas.openxmlformats.org/spreadsheetml/2006/main' xmlns:r='http://schemas.openxmlformats.org/officeDocument/2006/relationships'>"+
    pane+(sh.widths?cols:"")+"<sheetData>"+rowsXml+"</sheetData>"+af+"<pageMargins left='0.5' right='0.5' top='0.75' bottom='0.75' header='0.3' footer='0.3'/>"+hf+"</worksheet>";
}
function buildXlsx(sheets, marks){
  const enc=new TextEncoder(), f=[];
  const top=marks.top.join(" // ").slice(0,240), bot=marks.bottom.join(" // ").slice(0,240);
  f.push({name:"[Content_Types].xml", x:"<?xml version='1.0' encoding='UTF-8' standalone='yes'?><Types xmlns='http://schemas.openxmlformats.org/package/2006/content-types'><Default Extension='rels' ContentType='application/vnd.openxmlformats-package.relationships+xml'/><Default Extension='xml' ContentType='application/xml'/><Override PartName='/xl/workbook.xml' ContentType='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml'/><Override PartName='/xl/styles.xml' ContentType='application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml'/>"+
    sheets.map((s,i)=>"<Override PartName='/xl/worksheets/sheet"+(i+1)+".xml' ContentType='application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml'/>").join("")+"</Types>"});
  f.push({name:"_rels/.rels", x:"<?xml version='1.0' encoding='UTF-8' standalone='yes'?><Relationships xmlns='http://schemas.openxmlformats.org/package/2006/relationships'><Relationship Id='rId1' Type='http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument' Target='xl/workbook.xml'/></Relationships>"});
  f.push({name:"xl/workbook.xml", x:"<?xml version='1.0' encoding='UTF-8' standalone='yes'?><workbook xmlns='http://schemas.openxmlformats.org/spreadsheetml/2006/main' xmlns:r='http://schemas.openxmlformats.org/officeDocument/2006/relationships'><sheets>"+
    sheets.map((s,i)=>"<sheet name='"+xesc(s.name.replace(/[\[\]:*?\/\\]/g,"").slice(0,31))+"' sheetId='"+(i+1)+"' r:id='rId"+(i+1)+"'/>").join("")+"</sheets>"+
    "<definedNames>"+sheets.map((s,i)=>s.head>=0&&s.rows.length>s.head+1?"<definedName name='_xlnm._FilterDatabase' localSheetId='"+i+"' hidden='1'>'"+xesc(s.name.slice(0,31))+"'!$A$"+(s.head+1)+":$"+colName(Math.max(...s.rows.map(r=>r.length))-1)+"$"+s.rows.length+"</definedName>":"").join("")+"</definedNames></workbook>"});
  f.push({name:"xl/_rels/workbook.xml.rels", x:"<?xml version='1.0' encoding='UTF-8' standalone='yes'?><Relationships xmlns='http://schemas.openxmlformats.org/package/2006/relationships'>"+
    sheets.map((s,i)=>"<Relationship Id='rId"+(i+1)+"' Type='http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet' Target='worksheets/sheet"+(i+1)+".xml'/>").join("")+
    "<Relationship Id='rId"+(sheets.length+1)+"' Type='http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles' Target='styles.xml'/></Relationships>"});
  f.push({name:"xl/styles.xml", x:"<?xml version='1.0' encoding='UTF-8' standalone='yes'?><styleSheet xmlns='http://schemas.openxmlformats.org/spreadsheetml/2006/main'>"+
    "<fonts count='3'><font><sz val='11'/><name val='Calibri'/></font><font><b/><sz val='11'/><color rgb='FFFFFFFF'/><name val='Calibri'/></font><font><b/><sz val='11'/><name val='Calibri'/></font></fonts>"+
    "<fills count='3'><fill><patternFill patternType='none'/></fill><fill><patternFill patternType='gray125'/></fill><fill><patternFill patternType='solid'><fgColor rgb='FF1E262E'/><bgColor indexed='64'/></patternFill></fill></fills>"+
    "<borders count='1'><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count='1'><xf numFmtId='0' fontId='0' fillId='0' borderId='0'/></cellStyleXfs>"+
    "<cellXfs count='4'><xf numFmtId='0' fontId='0' fillId='0' borderId='0' xfId='0'/><xf numFmtId='0' fontId='1' fillId='2' borderId='0' xfId='0' applyFont='1' applyFill='1'/>"+
    "<xf numFmtId='0' fontId='0' fillId='0' borderId='0' xfId='0' applyAlignment='1'><alignment vertical='top' wrapText='1'/></xf><xf numFmtId='0' fontId='2' fillId='0' borderId='0' xfId='0' applyFont='1'/></cellXfs>"+
    "<cellStyles count='1'><cellStyle name='Normal' xfId='0' builtinId='0'/></cellStyles></styleSheet>"});
  sheets.forEach((s,i)=>f.push({name:"xl/worksheets/sheet"+(i+1)+".xml", x:sheetXml(s, top, bot)}));
  return zipStore(f.map(x=>({name:x.name, data:enc.encode(x.x)})));
}
function exportXlsx(){
  const C=cidx(), T=RES.trainees, G=grading();
  const marks=(P.course.markings.items||[]).filter(m=>String(m.text||"").trim());
  const mtop=marks.filter(m=>m.where==="top"||m.where==="both"||!m.where).map(m=>mkTok(m.text).replace(/\n/g," ")),
        mbot=marks.filter(m=>m.where==="bottom"||m.where==="both").map(m=>mkTok(m.text).replace(/\n/g," "));
  const pre=()=>{ const r=mtop.map(t=>[t]); r.push([P.course.title+" · Rev "+(P.config.contentRev||"")+" · exported "+new Date().toLocaleString()]); r.push([]); return r; };
  const sheets=[];
  // Roster
  let rows=pre(); let head=rows.length;
  rows.push(["Trainee","Status","Checks right first time","Checks total","Checks %","Drill right first time","Drill total","Drill %","Written answers","Written total","Acceptable","Needs rework","Not graded","Meets pass criteria","Reviewed by","Review date","Decision","Source file","Submitted"]);
  T.forEach(t=>{ const s=tstats(t,C), so=t.signoff||{};
    rows.push([t.name||"", s.st, s.cR, s.nC, s.cp, C.drills.length?s.dR:"", C.drills.length?s.nD:"", C.drills.length?s.dp:"", s.w, s.nP, s.ok, s.rw, s.nP-s.ok-s.rw, s.meets?"Yes":"No", so.by||"", so.date||"", so.decision==="complete"?"Complete":(so.decision==="rework"?"Rework required":""), t.file, fmtDate(tdate(t))]); });
  sheets.push({name:"Roster", rows, head, widths:[26,18,12,10,9,12,10,9,12,12,11,12,11,12,20,12,16,34,14]});
  // Check results matrix
  rows=pre(); head=rows.length;
  rows.push(["Trainee"].concat(C.checks.map(c=>c.id)).concat(C.drills.map(x=>x.id)));
  T.forEach(t=>rows.push([t.name||t.file].concat(C.checks.map(c=>{ const r=(t.data.checks||{})[c.id]; return !r?"":(r.first===true?"✓":"✗"); })).concat(C.drills.map(x=>{ const r=(t.data.drills||{})[x.id]; return !r?"":(r.first===true?"✓":"✗"); }))));
  sheets.push({name:"Check results", rows, head, widths:[26].concat(new Array(C.checks.length+C.drills.length).fill(9))});
  // Question analysis
  const D=itemData(C);
  rows=pre(); head=rows.length;
  rows.push(["ID","Module","Title","Question","Answered","Right first time","% right first time","Correct answer","Most common wrong answer","Times picked"]);
  D.checks.forEach(r=>rows.push([r.c.id, r.c.m.label, plainT(r.c.title), plainT(r.c.q), r.att, r.right, r.pct==null?"":r.pct, optText(r.c, rightSet(r.c)), r.wi>=0?plainT(r.c.o[r.wi]):"", r.wi>=0?r.wn:""]));
  D.drills.forEach(r=>rows.push([r.x.id, r.x.m.label, r.x.d.nm, "Drill line", r.att, r.right, r.pct==null?"":r.pct, r.x.d.a.join(", ")||(P.drill.noneLabel||"none"), r.top?(r.top[0]==="NONE"?(P.drill.noneLabel||"none"):r.top[0]):"", r.top?r.top[1]:""]));
  sheets.push({name:"Question analysis", rows, head, widths:[10,11,34,60,10,14,12,40,40,11]});
  // Written answers
  if(C.parts.length){
    rows=pre(); head=rows.length;
    rows.push(["Trainee","Exercise","Part","Question","Answer","Grade","Comment"]);
    T.forEach(t=>C.parts.forEach(p=>{ const g=t.grades[p.key]||{}; rows.push([t.name||t.file, plainT(p.x.title), p.pt.id, plainT(p.pt.q), ansOf(t,p.key), g.g==="ok"?"Acceptable":(g.g==="rework"?"Needs rework":""), g.c||""]); }));
    sheets.push({name:"Written answers", rows, head, widths:[22,30,6,50,70,14,40]});
  }
  if(mbot.length) sheets.forEach(s=>{ s.rows.push([]); mbot.forEach(t=>s.rows.push([t])); });
  const blob=buildXlsx(sheets, {top:mtop, bottom:mbot});
  const u=URL.createObjectURL(blob), a=document.createElement("a"); a.href=u; a.download=stemOf(P)+"-results-"+today()+".xlsx"; document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(u); }, 800);
  toast("Excel workbook downloaded: roster, check results, question analysis"+(C.parts.length?", written answers":"")+".");
}

/* ---------- word diff ---------- */
function lcsPairs(a, b, eq){
  const n=a.length, m=b.length;
  if(n*m > 4e6) return null;
  const W=m+1, L=new Uint32Array((n+1)*(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    L[i*W+j] = eq(a[i],b[j]) ? L[(i+1)*W+j+1]+1 : Math.max(L[(i+1)*W+j], L[i*W+j+1]);
  const out=[]; let i=0,j=0;
  while(i<n && j<m){ if(eq(a[i],b[j])){ out.push([i,j]); i++; j++; } else if(L[(i+1)*W+j] >= L[i*W+j+1]) i++; else j++; }
  return out;
}
function wordDiffHtml(a, b){
  a=String(a||""); b=String(b||"");
  const ta=a.split(/(\s+)/), tb=b.split(/(\s+)/);
  const pairs=lcsPairs(ta, tb, (x,y)=>x===y);
  if(!pairs) return "<del>"+escHtml(a)+"</del> <ins>"+escHtml(b)+"</ins>";
  let h2="", i=0, j=0;
  const flush=(ai,bj)=>{ const d=ta.slice(i,ai).join(""), s=tb.slice(j,bj).join(""); if(d) h2+="<del>"+escHtml(d)+"</del>"; if(s) h2+="<ins>"+escHtml(s)+"</ins>"; };
  pairs.forEach(([pi,pj])=>{ flush(pi,pj); h2+=escHtml(ta[pi]); i=pi+1; j=pj+1; });
  flush(ta.length, tb.length);
  return h2;
}

/* ---------- block text ---------- */
function blockText(b){
  const t=b.t;
  if(t==="p"||t==="note") return String(b.x||"");
  if(t==="h") return String(b.x||"");
  if(t==="list"||t==="olist") return (b.x||[]).map((x,i)=>(t==="olist"?(i+1)+". ":"• ")+x).join("\n");
  if(t==="callout") return (b.lab?b.lab+"\n":"")+(b.x||[]).join("\n");
  if(t==="stmt") return String(b.x||"")+(b.sub?"\n"+b.sub:"");
  if(t==="cards"||t==="steps") return (b.x||[]).map((c,i)=>(t==="steps"?(i+1)+". ":"")+c.h+": "+c.b).join("\n");
  if(t==="table") return (b.head||[]).join(" | ")+"\n"+(b.x||[]).map(r=>r.join(" | ")).join("\n");
  if(t==="tree") return (b.x||[]).map(r=>"  ".repeat(+r[0]||0)+r[1]+((r[2]||[]).length?" ["+r[2].join(", ")+"]":"")+(r[3]?" — "+r[3]:"")).join("\n");
  if(t==="img") return "Image"+(b.cap?": "+b.cap:"")+" #"+String(b.src||"").length+":"+crc32(new TextEncoder().encode(String(b.src||"").slice(0,20000)));
  return JSON.stringify(b);
}
function blockName(b){
  const n=(BLOCKS[b.t]||{name:b.t}).name;
  if(b.t==="callout") return b.tone==="bg" ? "Background box" : "Callout box";
  return n;
}
function blockKey(b){ return b.t+"|"+(b.tone||"")+"|"+(b.cols||"")+"|"+blockText(b); }
function showText(b){ return b.t==="img" ? ("Image"+(b.cap?": "+b.cap:"")) : blockText(b); }

function lineDiffHtml(a, b){
  const la=String(a).split("\n"), lb=String(b).split("\n");
  const pairs=lcsPairs(la, lb, (x,y)=>x===y)||[];
  let h2="", i=0, j=0;
  const flush=(ai,bj)=>{ la.slice(i,ai).forEach(x=>h2+="<del>"+escHtml(x)+"</del>\n"); lb.slice(j,bj).forEach(x=>h2+="<ins>"+escHtml(x)+"</ins>\n"); };
  pairs.forEach(([pi,pj])=>{ flush(pi,pj); h2+=escHtml(la[pi])+"\n"; i=pi+1; j=pj+1; });
  flush(la.length, lb.length);
  return h2.replace(/\n$/,"");
}
function similarity(a, b){
  const ta=String(a).split(/\s+/).filter(Boolean), tb=String(b).split(/\s+/).filter(Boolean);
  if(!ta.length || !tb.length) return 0;
  const p=lcsPairs(ta, tb, (x,y)=>x===y); if(!p) return 0;
  return p.length/Math.max(ta.length, tb.length);
}
function dtHtml(f){
  if(f.a==null) return "<div class='dt ad'>"+escHtml(f.b)+"</div>";
  if(f.b==null) return "<div class='dt rm'>"+escHtml(f.a)+"</div>";
  if(f.lines) return "<div class='dt'>"+lineDiffHtml(f.a, f.b)+"</div>";
  if(!String(f.a).trim()) return "<div class='dt ad'>"+escHtml(f.b)+"</div>";
  if(!String(f.b).trim()) return "<div class='dt rm'>"+escHtml(f.a)+"</div>";
  if(similarity(f.a, f.b) < 0.4)
    return "<div class='dt rm'><span class='fl' style='display:block'>Before</span>"+escHtml(f.a)+"</div><div class='dt ad' style='margin-top:4px'><span class='fl' style='display:block'>After</span>"+escHtml(f.b)+"</div>";
  return "<div class='dt'>"+wordDiffHtml(f.a, f.b)+"</div>";
}
function fcHtml(f){ return "<div class='fc'><div class='fl'>"+escHtml(f.label)+"</div>"+dtHtml(f)+"</div>"; }
const BADGE={add:"Added", rem:"Removed", chg:"Changed", mov:"Moved"};
function card(id, title, st, body, extra){
  return "<div class='ci "+st+"' id='cmp-"+escHtml(id)+"'><div class='ch'><span class='cid'>"+escHtml(id)+"</span><span class='ct'>"+escHtml(title)+"</span>"+
    (extra||"")+"<span class='bdg "+st+"'>"+BADGE[st]+"</span></div>"+(body?"<div class='bd'>"+body+"</div>":"")+"</div>";
}
function reportHtml(D, A, B, fileName){
  const revA=A.config.contentRev||"?", revB=B.config.contentRev||"?";
  let h2="";
  const n=D.n, tot=n.add+n.rem+n.chg+n.mov+D.course.length+D.rules.length+D.marks.length+D.gloss.length;
  h2+="<div class='sumt'><div><b>"+n.add+"</b><span>Added</span></div><div><b>"+n.rem+"</b><span>Removed</span></div><div><b>"+n.chg+"</b><span>Changed</span></div><div><b>"+n.mov+"</b><span>Moved only</span></div><div><b>"+(D.course.length+D.rules.length+D.marks.length+D.gloss.length)+"</b><span>Settings, rules, glossary, markings</span></div></div>";
  if(!tot) h2+="<p class='none'>No differences found. The two versions have the same content.</p>";
  if(D.impact.length) h2+="<div class='imp'><div class='fl' style='color:var(--amber)'>What this means for trainees</div><ul>"+D.impact.map(x=>"<li>"+escHtml(x)+"</li>").join("")+"</ul></div>";
  if(D.course.length){ h2+="<h2 id='cmp-course'>Course settings and start page</h2>"; h2+=card("SETTINGS","Course settings","chg", D.course.map(fcHtml).join("")); }
  if(D.rules.length){ h2+="<h2 id='cmp-rules'>Source map (rules)</h2>";
    D.rules.forEach(r=>{ h2+=card(r.k, r.st==="rem"?r.a:r.b, r.st, r.st==="chg" ? fcHtml({label:"Rule", a:r.a, b:r.b}) : ""); }); }
  if(D.gloss.length){ h2+="<h2 id='cmp-gloss'>Glossary</h2>";
    D.gloss.forEach(g=>{ h2+=card("TERM", g.t, g.st, g.st==="chg" ? g.f.map(fcHtml).join("") : fcHtml(g.st==="add"?{label:"Definition", b:g.b}:{label:"Definition", a:g.a})); }); }
  if(D.marks.length){ h2+="<h2 id='cmp-marks'>Markings</h2>"; D.marks.forEach((m,i)=>{ h2+=card("MARK", m.st==="add"?m.b:m.a, m.st, ""); }); }
  const modsB=projView(B).mods, modsA=projView(A).mods;
  const allMods=modsB.map(m=>m.id).concat(modsA.filter(m=>!modsB.some(x=>x.id===m.id)).map(m=>m.id));
  allMods.forEach(mid=>{
    const mB=modsB.find(m=>m.id===mid), mA=modsA.find(m=>m.id===mid), M=mB||mA;
    const md=D.modules.find(x=>x.id===mid);
    const secs=D.secs.filter(x=>x.mod===mid), drs=D.drills.filter(x=>x.mod===mid), exs=D.exs.filter(x=>x.mod===mid);
    if(!md && !secs.length && !drs.length && !exs.length) return;
    h2+="<h2 id='cmp-"+escHtml(mid)+"'>"+escHtml(M.label)+": "+escHtml(plainT(M.title))+"</h2>";
    if(md){
      if(md.st==="chg") h2+=card(mid, "Module details", "chg", md.f.map(fcHtml).join(""));
      else h2+=card(mid, md.st==="add" ? "New module: "+M.title : "Module removed: "+M.title, md.st, "");
    }
    secs.forEach(x=>{
      let body="";
      if(x.st==="add") body="<div class='fl'>New section</div><div class='dt ad'>"+escHtml(x.s.body.map(b=>blockName(b)+": "+showText(b).slice(0,220)+(showText(b).length>220?"…":"")).join("\n"))+(x.s.check?"\n\nCheck: "+escHtml(x.s.check.q):"")+"</div>";
      else if(x.st==="rem") body="";
      else {
        if(x.moved) body+="<div class='fc'><div class='fl'>Position</div><div class='dt'>"+escHtml(x.moved)+"</div></div>";
        (x.f||[]).forEach(f=>body+=fcHtml(f));
        (x.bl||[]).forEach(bk=>{
          if(bk.st==="chg") body+=fcHtml({lines: /\n/.test(showText(bk.a)) && /\n/.test(showText(bk.b)) && ["list","olist","cards","steps","table","tree"].indexOf(bk.b.t)>=0, label:(blockName(bk.a)===blockName(bk.b)?blockName(bk.b):blockName(bk.a)+" → "+blockName(bk.b))+": changed", a:showText(bk.a), b:showText(bk.b)});
          else if(bk.st==="add") body+=fcHtml({label:blockName(bk.b)+": added", b:showText(bk.b)});
          else body+=fcHtml({label:blockName(bk.a)+": removed", a:showText(bk.a)});
        });
        (x.cf||[]).forEach(f=>body+=fcHtml(f));
      }
      const extra = x.moved && x.st==="chg" ? "<span class='bdg mov'>Moved</span>" : "";
      h2+=card(x.id, plainT(x.s.title), x.st, body, extra);
    });
    drs.forEach(x=>{ h2+=card(x.id, (B.drill.title||"Drill")+": "+x.d.nm, x.st, x.st==="chg" ? x.f.map(fcHtml).join("") : ""); });
    exs.forEach(x=>{ h2+=card(x.id, plainT(x.x.title), x.st, x.st==="chg" ? x.f.map(f=>fcHtml(f.part==="add"?{label:f.label,b:f.b}:(f.part==="rem"?{label:f.label,a:f.a}:f))).join("") : ""); });
  });
  return h2;
}

/* ---------- revision log draft ---------- */
function draftLog(D){
  const L=[];
  if(D.course.length) L.push("Course settings changed: "+D.course.map(f=>f.label.replace(/^Start page: /,"start page ")).join("; ")+".");
  if(D.rules.length){ const g=st=>D.rules.filter(r=>r.st===st).map(r=>r.k);
    const p=[]; if(g("add").length) p.push("added "+g("add").join(", ")); if(g("rem").length) p.push("removed "+g("rem").join(", ")); if(g("chg").length) p.push("reworded "+g("chg").join(", "));
    L.push("Source map: "+p.join("; ")+"."); }
  if(D.gloss.length){ const g=st=>D.gloss.filter(x=>x.st===st).map(x=>x.t);
    const p=[]; if(g("add").length) p.push("added "+g("add").join(", ")); if(g("rem").length) p.push("removed "+g("rem").join(", ")); if(g("chg").length) p.push("revised "+g("chg").join(", "));
    L.push("Glossary: "+p.join("; ")+"."); }
  if(D.marks.length) L.push("Markings: "+D.marks.map(m=>(m.st==="add"?"added ":"removed ")+"“"+(m.b||m.a).split("\n")[0].slice(0,60)+"”").join("; ")+".");
  D.modules.forEach(m=>{ if(m.st==="add") L.push(m.id+" added: "+plainT(m.m.title)+"."); else if(m.st==="rem") L.push(m.id+" removed: "+plainT(m.m.title)+"."); else L.push(m.id+": "+m.f.map(f=>f.label.toLowerCase()).join(" and ")+" changed."); });
  D.secs.forEach(x=>{
    const t=plainT(x.s.title);
    if(x.st==="add"){ L.push(x.id+" added: "+t+"."); return; }
    if(x.st==="rem"){ L.push(x.id+" removed: "+t+"."); return; }
    const w=[];
    (x.f||[]).forEach(f=>w.push(f.label==="Title" ? "retitled" : (f.label==="Rules tagged" ? "rule tags changed" : f.label.toLowerCase()+" changed")));
    const nb=(x.bl||[]).length; if(nb) w.push("content revised ("+nb+" block"+(nb===1?"":"s")+")");
    (x.cf||[]).forEach(f=>{ const m={"Check question":"check question reworded","Options":"check options changed","Right answer":"right answer changed","Explanation":"check explanation revised","Question type":"check changed to "+String(f.b).toLowerCase(),"Check added":"check added","Check removed":"check removed"}[f.label]; if(m) w.push(m); });
    if(x.moved) w.push(x.moved.charAt(0).toLowerCase()+x.moved.slice(1));
    L.push(x.id+" ("+t+"): "+w.join("; ")+".");
  });
  D.drills.forEach(x=>{ if(x.st==="add") L.push(x.id+" drill line added: "+x.d.nm+"."); else if(x.st==="rem") L.push(x.id+" drill line removed: "+x.d.nm+"."); else L.push(x.id+" drill line: "+x.f.map(f=>f.label.toLowerCase()+" changed").join("; ")+"."); });
  D.exs.forEach(x=>{ const t=plainT(x.x.title); if(x.st==="add") L.push(x.id+" added: "+t+"."); else if(x.st==="rem") L.push(x.id+" removed: "+t+"."); else L.push(x.id+": "+x.f.map(f=>f.label.charAt(0).toLowerCase()+f.label.slice(1)+(f.part?"":" changed")).join("; ")+"."); });
  return L;
}

/* ---------- UI ---------- */
function startCompare(){
  flushPending();
  openModal("Compare with an older revision", [
    h("p",{style:"margin:0 0 12px;font-size:14px"}, "Pick the older version of this training: its exported .html file, or a draft .json. The builder compares it with the version open now (Rev "+(P.config.contentRev||"?")+") and lists every change. Nothing in either file is changed."),
    h("div",{class:"acts"}, h("button",{class:"btn pri", onclick:()=>{ closeModal(); $("cmpIn").click(); }}, "Choose the older version…"))
  ]);
}
async function loadCompareFile(f){
  try{
    const text=await readFileText(f);
    let base;
    if(/\.json$/i.test(f.name) || /^\s*\{/.test(text)){ base=JSON.parse(text); if(!base.modules) throw new Error("That .json file is not a Training Builder draft."); const b=blankProject(); for(const k in b) if(base[k]===undefined) base[k]=b[k]; }
    else base=importTraining(text).p;
    const bc=blankProject().course; if(!base.course.markings) base.course.markings=bc.markings; base.course.grading=Object.assign({}, bc.grading, base.course.grading||{});
    normalizeModules(base.modules);
    CMP={base, file:f.name};
    document.body.classList.remove("resmode"); $("bRes").textContent="Results";
    document.body.classList.add("cmpmode"); $("bCmp").textContent="← Back to editing";
    renderCompare();
  }catch(e){ console.error(e); openModal("Could not compare", [h("div",{class:"errbox"}, e.message||String(e))]); }
}
function exitCompare(){ document.body.classList.remove("cmpmode"); $("bCmp").textContent="Compare…"; }

  if(D.rules.length) nav.appendChild(h("button",{class:"oitem", onclick:()=>go("rules")}, h("span",{class:"id"},"§"), h("span",{class:"nm"},"Source map"), h("span",{class:"ct"},D.rules.length)));

  mods.forEach(m=>{ const c=D.secs.filter(x=>x.mod===m.id).length+D.drills.filter(x=>x.mod===m.id).length+D.exs.filter(x=>x.mod===m.id).length+(D.modules.some(x=>x.id===m.id)?1:0);
    nav.appendChild(h("button",{class:"oitem", disabled:c?null:"disabled", style:c?"":"opacity:.45", onclick:()=>go(m.id)}, h("span",{class:"id"},m.id), h("span",{class:"nm"},plainT(m.title)), h("span",{class:"ct"}, c?String(c):"—"))); });
  const w=h("div",{class:"ed"}); const strip=markStrip(); if(strip) main.appendChild(strip); main.appendChild(w);

  if((A.config.contentRev||"")===(B.config.contentRev||"")) w.appendChild(h("div",{class:"warnbox"}, "Both versions say Rev "+(B.config.contentRev||"?")+". If this is a new revision, start one under Course settings (Start a new revision) before adding to the revision log."));
  w.appendChild(h("div",{class:"acts"},
    h("button",{class:"btn pri", onclick:()=>logDialog(D)}, "Draft revision log entry…"),
    h("button",{class:"btn", onclick:()=>downloadReport(D)}, "Download report"),
    h("button",{class:"btn", onclick:()=>$("cmpIn").click()}, "Compare with a different file…"),
    h("button",{class:"btn", onclick:exitCompare}, "Back to editing")));
  const rep=h("div",{class:"rep"}); rep.innerHTML=reportHtml(D, A, B, CMP.file); w.appendChild(rep);
}
function logDialog(D){
  const lines=draftLog(D), rev=P.config.contentRev||"";
  const ta=h("textarea",{rows:Math.min(16, Math.max(5, lines.length+1)), style:"width:100%;border:1px solid var(--rule);border-radius:5px;padding:8px 10px;font-size:13px;line-height:1.5"}); ta.value=lines.join("\n");
  const existing=P.revisions.find(r=>r.rev===rev);
  openModal("Draft revision log entry", [
    h("p",{style:"margin:0 0 10px;font-size:13.5px"}, "One line per change. Edit the wording, delete lines you do not want, or add your reason for the change. Each line becomes one bullet in the revision log."),
    ta,
    h("div",{class:"acts",style:"margin-top:12px"},
      h("button",{class:"btn pri", onclick:()=>{
        const items=ta.value.split("\n").map(s=>s.trim()).filter(Boolean);
        if(!items.length){ toast("Nothing to add."); return; }

  ]);

function downloadReport(D){
  const A=CMP.base, B=P;

  const md=(m,cls)=>{ const c=mkCol(m); return "<div class='"+cls+"' style='background:"+c.bg+";color:"+c.fg+"'>"+escHtml(mkTok(m.text)).replace(/\n/g,"<br>")+"</div>"; };
  const mk=pos=>marks.filter(m=>m.where===pos||m.where==="both"||(!m.where&&pos==="top")).map(m=>md(m, m.kind==="block"?"mkblock":"mk")).join("");
  const root=getComputedStyle(document.documentElement); const vars=["--ink","--ink-2","--slate","--mute","--paper","--surface","--surface-2","--rule","--rust","--rust-soft","--rust-ink","--teal","--teal-soft","--amber","--amber-soft","--alert","--alert-soft","--serif","--sans","--mono"].map(v=>v+":"+root.getPropertyValue(v)).join(";");
  const css=[...document.querySelectorAll("style")].map(s=>s.textContent).join("\n").match(/\.rep[^{]*\{[^}]*\}/g).join("\n");
  const html="<!DOCTYPE html><html><head><meta charset='utf-8'><title>Revision comparison: "+escHtml(B.course.title)+" Rev "+escHtml(A.config.contentRev)+" to Rev "+escHtml(B.config.contentRev)+"</title><style>:root{"+vars+"}"+
    "body{font-family:var(--sans);color:var(--ink);max-width:960px;margin:30px auto;padding:0 24px;line-height:1.5}h1{font-family:var(--serif);font-size:27px;margin:0 0 4px}.sub{color:var(--slate);font-size:13.5px;margin:0 0 20px}"+
    ".mk{font-weight:700;font-size:12.5px;letter-spacing:.05em;text-align:center;padding:4px 10px;margin:0 0 4px}.mkblock{font-size:12.5px;padding:10px 14px;border-radius:4px;margin:0 0 14px}"+
    "*{-webkit-print-color-adjust:exact;print-color-adjust:exact}@media print{body{margin:0}.ci{page-break-inside:avoid}}"+css+"</style></head><body>"+mk("top")+
    "<h1>"+escHtml(B.course.title)+": revision comparison</h1><div class='sub'>Rev "+escHtml(A.config.contentRev||"?")+" ("+escHtml(CMP.file)+") → Rev "+escHtml(B.config.contentRev||"?")+" · produced "+escHtml(new Date().toLocaleString())+". Deleted words are struck through in red; new words are underlined in green.</div>"+
    "<div class='rep'>"+reportHtml(D, A, B, CMP.file)+"</div><div style='margin-top:30px'>"+mk("bottom")+"</div></body></html>";
  download(stemOf(B)+"-Rev"+(A.config.contentRev||"")+"-to-Rev"+(B.config.contentRev||"")+"-changes.html", html, "text/html;charset=utf-8");

$("bCmp").onclick=()=>{ if(document.body.classList.contains("cmpmode")) exitCompare(); else startCompare(); };

<script>"use strict";
/* ==========================================================================
   GLOSSARY EDITOR: terms, definitions, where each is used, and a suggester
   that finds terms the content already defines or spells out.
   ========================================================================== */
let GL_FILTER = "";

function gKeys(g){ return [g.t].concat(String(g.alt||"").split(",")).map(x=>String(x||"").trim()).filter(Boolean); }
function gIsCS(k){ return /[A-Z]/.test(k) && !/[a-z]/.test(k); }
function gRegex(keys){
  const ks=keys.slice().sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  return new RegExp("(?<![A-Za-z0-9])("+ks.join("|")+")(?:e?s)?(?![A-Za-z0-9])","gi");
}
function gMatches(keys, txt){
  if(!keys.length) return false;
  const re=gRegex(keys); let m;
  while((m=re.exec(txt))){ const hit=m[1]; if(keys.some(k=> gIsCS(k) ? k===hit : k.toLowerCase()===hit.toLowerCase())) return true; }
  return false;
}
function gStrings(o, out){
  if(typeof o==="string") out.push(o);
  else if(Array.isArray(o)) o.forEach(v=>gStrings(v,out));
  else if(o && typeof o==="object") for(const k in o){ if(!/^(t|tone|src|cols|id|w|_q|_off)$/.test(k)) gStrings(o[k],out); }
  return out;
}
function gSectionTexts(){
  return cleanModules(P.modules).flatMap(m=>m.sections.map(s=>({id:s.id, txt:gStrings([s.title, s.lede||"", s.body], []).join("\n")})));
}
function gUsage(g, ST){ const keys=gKeys(g); return ST.filter(x=>gMatches(keys, x.txt)).map(x=>x.id); }

function edGlossary(w){
  const O=P.course.glossOpts;
  w.append(...head(null,"Glossary","Glossary","Define a term once. The training underlines it wherever it appears, and trainees point at it (or tap it) to read the definition. Every term also goes on a Glossary page."));
  w.appendChild(fmtHint());
  w.appendChild(panel("How terms are shown", [
    fCheck("Underline only the first use of a term on each page", O, "firstOnly", {help:"Leave this on to keep pages uncluttered. Turn it off to underline every use."}),
    fCheck("Also underline terms inside check questions and answers", O, "inChecks", {help:"Off by default, because a definition can give away a check answer."}),
    fCheck("Add a Glossary page to the course", O, "page")
  ]));
  const ST=gSectionTexts();
  const filt=h("input",{type:"text", placeholder:"Filter terms…", value:GL_FILTER, style:"border:1px solid var(--rule);border-radius:5px;padding:6px 9px;font-size:13px;width:220px",
    oninput:e=>{ GL_FILTER=e.target.value; applyFilter(); }});
  w.appendChild(h("div",{class:"acts"},
    h("button",{class:"btn pri", onclick:suggestTerms}, "Suggest terms from the content…"),
    h("button",{class:"btn", onclick:()=>{ P.glossary.sort((a,b)=>String(a.t).localeCompare(String(b.t),undefined,{sensitivity:"base"})); commit(true); }}, "Sort A–Z"),
    P.glossary.length>6 ? filt : null));
  if(!P.glossary.length) w.appendChild(h("div",{class:"hint"}, "No terms yet. Add them one at a time, or use ", h("b",null,"Suggest terms from the content"), " to find the acronyms and definitions your sections already contain."));
  const list = rows(P.glossary, g=>{
    const used=gUsage(g, ST);
    return [
      h("div",{class:"row2"}, fText("Term", g, "t", {ph:"e.g. FCA"}), fText("Also matches", g, "alt", {ph:"e.g. functional configuration audit, functional audit", help:"Other ways the term is written, separated by commas."})),
      fArea("Definition", g, "d", {rows:2}),
      h("div",{class:"help",style:"font-size:12px;color:"+(used.length?"var(--slate)":"var(--amber)")},
        used.length ? "Appears in "+used.length+" section"+(used.length===1?"":"s")+": "+used.slice(0,12).join(", ")+(used.length>12?"…":"") : "Not found in any section yet. It will still be on the Glossary page.",
        gIsCS(String(g.t||"").trim()) ? "  ·  All capitals, so it matches only in capitals." : "")
    ];
  }, ()=>({t:"", alt:"", d:""}), "Add term", {num:false});
  w.appendChild(list);
  function applyFilter(){
    const q=GL_FILTER.trim().toLowerCase(); const items=list.querySelectorAll(":scope > .ri");
    P.glossary.forEach((g,i)=>{ const el=items[i]; if(!el) return; el.style.display = !q || (String(g.t)+" "+String(g.alt)+" "+String(g.d)).toLowerCase().indexOf(q)>=0 ? "" : "none"; });
  }
  applyFilter();
}

/* ---------- suggester ---------- */
const SMALL=new Set(["of","and","for","the","to","in","a","an","on","or","by","with","at"]);
function gCorpus(){
  const out=[];
  cleanModules(P.modules).forEach(m=>{
    m.sections.forEach(s=>{
      (s.body||[]).forEach(b=>{ if(b.t==="note") return; gStrings(b,[]).forEach(t=>out.push({id:s.id, t})); });
      [s.title, s.lede||""].forEach(t=>out.push({id:s.id, t}));
      if(s.check) [s.check.q, ...s.check.o, s.check.why].forEach(t=>out.push({id:s.id, t}));
    });
    m.drill.forEach(d=>[...d.facts, d.why].forEach(t=>out.push({id:d.id, t})));
    m.exercises.forEach(x=>[x.scen, ...x.parts.map(p=>p.q)].forEach(t=>out.push({id:x.id, t})));
  });
  return out.filter(x=>x.t && String(x.t).trim());
}
function initials(words){ return words.filter(w=>!SMALL.has(w.toLowerCase())).map(w=>w.charAt(0).toUpperCase()).join(""); }
function suggestTerms(){
  flushPending();
  const C=gCorpus(), have=new Set();
  P.glossary.forEach(g=>gKeys(g).forEach(k=>have.add(k.toLowerCase())));
  const cand={};   // key: term lower
  const add=(term, alt, def, src, why)=>{
    term=term.trim(); if(!term || term.length<2 || have.has(term.toLowerCase())) return;
    const k=term.toLowerCase(); const c=cand[k]||(cand[k]={t:term, alt:new Set(), d:"", src:[], why:new Set(), n:0});
    if(alt && alt.toLowerCase()!==k) c.alt.add(alt.trim());
    if(def && (!c.d || c.dsrc!=="defined")){ c.d=def; c.dsrc=why; }
    if(src && c.src.indexOf(src)<0) c.src.push(src);
    c.why.add(why);
  };
  // 1) sentences that define a bold term: "A **Configuration Item (CI)** is a …", "**Life status** means …"
  const BADNEXT=/^(first|second|third|fourth|fifth|last|next|same|only|other)\b/i;
  C.forEach(({id,t})=>{
    String(t).split(/(?<=[.!?])\s+(?=[A-Z*“"])/).forEach(sen=>{
      sen=sen.trim();
      const m=/^(?:(An?|The)\s+)?\*\*([^*]{2,80})\*\*,?\s+(is|are|means|refers to)\s+(.*)$/.exec(sen);
      if(!m) return;
      const art=m[1], verb=m[3], rest=m[4];
      if(verb==="is"||verb==="are"){
        const nx=/^(?:(?:a|an|the|any|one)\s+|[“"])(.*)$/i.exec(rest);
        if(!nx) return;                                   // "is assigned", "is Module 2", "is not …"
        if(BADNEXT.test(nx[1])) return;                   // "is the first", "is the same"
        if(rest.split(/\s+/).length<5) return;           // too short to be a definition
        if(art && art.toLowerCase()==="the" && !/^(a|an|any|one|[“"])/i.test(rest)) return;
      } else if(rest.split(/\s+/).length<4) return;
      const bold=m[2].trim().replace(/^(?:an?|the)\s+/i,""), p=/^(.*?)\s*\(([^)]{2,12})\)$/.exec(bold);
      if(p && /^[A-Za-z0-9&/-]+$/.test(p[2])) add(p[2], p[1], sen, id, "defined");
      else add(bold, "", sen, id, "defined");
    });
  });
  // 2) spelled-out acronyms: "Item Unique Identification (IUID)"
  C.forEach(({id,t})=>{
    const txt=String(t).replace(/\*\*/g,"").replace(/\*/g,"");
    const re=/\(([A-Z][A-Za-z0-9&/-]{1,10})\)/g; let m;
    while((m=re.exec(txt))){
      const acr=m[1], letters=acr.replace(/[^A-Za-z]/g,"").toUpperCase();
      if(letters.length<2 || /^[A-Z][a-z]+$/.test(acr)) continue;
      const before=txt.slice(Math.max(0,m.index-160), m.index).trim().split(/\s+/).filter(Boolean).map(w=>w.replace(/[^A-Za-z0-9’'-]/g,"")).filter(Boolean);
      let best=null;
      for(let n=1;n<=Math.min(before.length, letters.length+4);n++){
        const ws=before.slice(-n);
        if(SMALL.has(ws[0].toLowerCase())) continue;
        const ini=initials(ws), all=ws.map(w=>w.charAt(0).toUpperCase()).join("");
        if(ini===letters || all===letters){ best=ws; break; }
      }
      if(!best){
        // looser: every main word's initial appears, in order, in the acronym, and the first letters agree
        for(let n=Math.min(before.length, letters.length+3); n>=2 && !best; n--){
          const ws=before.slice(-n); if(SMALL.has(ws[0].toLowerCase())) continue;
          const ini=initials(ws); if(ini.charAt(0)!==letters.charAt(0) || ini.length<2) continue;
          let k=0; for(const ch of letters){ if(ch===ini.charAt(k)) k++; }
          if(k===ini.length && ini.length>=Math.ceil(letters.length/2)) best=ws;
        }
      }
      if(best){ const exp=best.join(" "); add(acr, exp, exp.charAt(0).toUpperCase()+exp.slice(1)+".", id, "spelled out"); }
    }
  });
  // 3) acronyms used often but never spelled out
  const freq={}, where={};
  C.forEach(({id,t})=>{
    const plainT2=String(t).replace(/\*\*/g,"");
    const letters=plainT2.replace(/[^A-Za-z]/g,""); const up=letters.replace(/[^A-Z]/g,"").length;
    if(letters.length>20 && up/letters.length>0.6) return;   // shouted text, e.g. note wording
    (plainT2.match(/(?<![A-Za-z0-9-])[A-Z][A-Z0-9&]{1,5}(?![A-Za-z0-9-])/g)||[]).forEach(w=>{
      if(/^[A-Z]{1,2}\d+$/.test(w) || (w.replace(/[^A-Z]/g,"").length<2)) return;   /* skip IDs like M2, WT01, S3 */
      freq[w]=(freq[w]||0)+1; (where[w]=where[w]||new Set()).add(id); });
  });
  const skip=new Set(["II","III","IV","VI","VII","VIII","IX","XI","XII","OK","US","USA","AND","OR","THE","NOT","NO","YES","TO","OF","IN","IS","IT","AM","PM","ID","ANY","ALL","ONLY","MUST","SHALL","WILL","NONE","NEW","OLD","ONE","TWO","SEE","NOTE","WARNING","CAUTION","ON","OFF","IF","AS","AT","BY","BE","DO"]);
  const ids=new Set(); P.modules.forEach(m=>{ ids.add(m.id); m.sections.forEach(x=>ids.add(x.id)); });
  Object.keys(freq).forEach(w=>{ if(freq[w]>=3 && !skip.has(w) && !ids.has(w) && !cand[w.toLowerCase()]) { add(w, "", "", [...where[w]][0], "used "+freq[w]+" times"); cand[w.toLowerCase()].n=freq[w]; } });

  const list=Object.values(cand).sort((a,b)=> (b.d?1:0)-(a.d?1:0) || a.t.localeCompare(b.t));
  if(!list.length){ openModal("Suggest terms", [h("div",{class:"okbox"}, "No new terms found. Everything the content defines or spells out is already in the glossary.")]); return; }
  // single everyday words ("Approved", "Hosting") would underline ordinary uses too, so they start unticked
  const everyday=c=>!gIsCS(c.t) && !/\s/.test(c.t) && !c.alt.size;
  const pick=new Set(list.filter(c=>c.d && !everyday(c)).map(c=>c.t.toLowerCase()));
  const body=h("div");
  const rowsEl=list.map(c=>{
    const k=c.t.toLowerCase();
    return h("label",{class:"ri", style:"cursor:pointer;align-items:flex-start"},
      h("input",{type:"checkbox", checked:pick.has(k), style:"margin-top:3px;accent-color:var(--rust);width:16px;height:16px", onchange:e=>{ if(e.target.checked) pick.add(k); else pick.delete(k); }}),
      h("div",{class:"rb"},
        h("div",null, h("b",null,c.t), c.alt.size ? h("span",{style:"color:var(--slate);font-size:12.5px"}, "  ·  "+[...c.alt].join(", ")) : null),
        everyday(c) && c.d ? h("div",{style:"font-size:12px;color:var(--amber);margin-top:2px"}, "A single everyday word: every use of it would be underlined. Tick it only if that is what you want.") : null,
        c.d ? h("div",{style:"font-size:13px;margin-top:2px"}, c.d.replace(/\*\*/g,"")) : h("div",{style:"font-size:12.5px;color:var(--amber);margin-top:2px"}, "No definition found. You will need to write one."),
        h("div",{style:"font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:3px"}, [...c.why].join(" · ")+" · "+c.src.slice(0,4).join(", ")+(c.src.length>4?"…":""))));
  });
  body.append(
    h("p",{style:"margin:0 0 10px;font-size:13.5px"}, list.length+" possible terms. Ones that come with a definition are ticked. Definitions are taken from your own sections; review each one after adding."),
    h("div",{class:"acts"}, h("button",{class:"btn sm", onclick:()=>{ list.forEach(c=>pick.add(c.t.toLowerCase())); body.querySelectorAll("input[type=checkbox]").forEach(x=>x.checked=true); }}, "Tick all"),
      h("button",{class:"btn sm", onclick:()=>{ pick.clear(); body.querySelectorAll("input[type=checkbox]").forEach(x=>x.checked=false); }}, "Untick all")),
    h("div",{class:"rl",style:"max-height:52vh;overflow-y:auto"}, rowsEl),
    h("div",{class:"acts",style:"margin-top:12px"}, h("button",{class:"btn pri", onclick:()=>{
      const add2=list.filter(c=>pick.has(c.t.toLowerCase()));
      add2.forEach(c=>P.glossary.push({t:c.t, alt:[...c.alt].join(", "), d:c.d}));
      P.glossary.sort((a,b)=>String(a.t).localeCompare(String(b.t),undefined,{sensitivity:"base"}));
      closeModal(); SEL={k:"gloss"}; commit(true);
      const blank=add2.filter(c=>!c.d).length;
      toast(add2.length+" term"+(add2.length===1?"":"s")+" added."+(blank?" "+blank+" still need a definition (see Health check).":""));
    }}, "Add ticked terms")));
  openModal("Suggest terms from the content", body);
}
</script>
