<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI Index Builder</title>
<style>
:root{
  --ink:#1E262E; --ink-2:#2C3841; --slate:#5C6D78; --mute:#8998A2;
  --paper:#FFFFFF; --surface:#F4F6F7; --surface-2:#EDF0F1; --rule:#D6DCDF;
  --rust:#A8481F; --rust-soft:#F2E4DD; --rust-ink:#7E340F;
  --teal:#1F5F5B; --teal-soft:#DFEAE8;
  --amber:#9A6508; --amber-soft:#F6ECD8;
  --alert:#8E2F2F; --alert-soft:#F4E2E2;
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--surface);font-size:14px;line-height:1.5;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
.top{background:var(--ink);color:#fff;padding:11px 18px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.top b{font-family:var(--serif);font-size:16px}
.top span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#93A2AB}
.bar{background:var(--paper);border-bottom:1px solid var(--rule);padding:8px 18px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:4px;padding:7px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible,.lnk:focus-visible,.nav button:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.btn.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.pri:hover{background:var(--rust-ink)}
.btn.gh{background:transparent;color:var(--slate)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.sep{width:1px;height:22px;background:var(--rule);margin:0 4px}
#msg{font-size:12px;color:var(--slate);flex:1;min-width:160px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:3px;border:1px solid var(--rule);background:var(--surface-2);color:var(--slate);white-space:nowrap}
.chip.bad{background:var(--alert-soft);color:var(--alert);border-color:#E0BFBF}
.chip.hold{background:var(--amber-soft);color:var(--amber);border-color:#E4D3AF}
.chip.ok{background:var(--teal-soft);color:var(--teal);border-color:#BFD6D2}
button.chip{cursor:pointer}

.main{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr)}
.main.l-below{grid-template-columns:200px minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.main.l-below .pv{grid-column:1/-1}
.main.l-editor{grid-template-columns:200px minmax(0,1fr)}
.main.l-editor .pv{display:none}
.main.l-preview{grid-template-columns:minmax(0,1fr)}
.main.l-preview .nav,.main.l-preview .ed{display:none}
.nav{background:var(--paper);border-right:1px solid var(--rule);overflow:auto;padding:12px 0}
.nav .h{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);font-weight:700;padding:10px 16px 4px}
.nav button{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:none;text-align:left;padding:7px 16px;font-size:13px;color:var(--ink-2);border-left:3px solid transparent}
.nav button:hover{background:var(--surface)}
.nav button.on{background:var(--rust-soft);border-left-color:var(--rust);color:var(--rust-ink);font-weight:600}
.nav .n{font-family:var(--mono);font-size:10px;color:var(--mute)}
.nav .n.e{color:var(--alert);font-weight:700}
.ed{overflow:auto;padding:18px 22px 60px}
.pv{display:flex;flex-direction:column;border-left:1px solid var(--rule);background:#E6EAEC;min-height:0}
.pvbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 10px;background:var(--paper);border-bottom:1px solid var(--rule);font-size:12px}
.pvbar label{display:flex;gap:5px;align-items:center;color:var(--ink-2)}
.pvbar select{padding:3px 5px;border:1px solid var(--rule);border-radius:3px;background:var(--paper)}
.pvbar .lab{margin:0}
.pvwrap{flex:1;min-height:0;display:flex;justify-content:center;overflow:auto}
.pvwrap iframe{border:0;background:#fff;width:100%;height:100%}
.pvwrap.phone{padding:14px 0}
.pvwrap.phone iframe{width:390px;height:100%;border:1px solid var(--rule);border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}

h1{font-family:var(--serif);font-size:24px;font-weight:400;margin:0 0 4px;line-height:1.2}
.lede{font-size:13.5px;color:var(--slate);margin:0 0 16px;max-width:76ch}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:8px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;margin:0 0 14px}
.card.sel{border-left:3px solid var(--rust)}
.small{font-size:12.5px;color:var(--slate);max-width:80ch;margin:0}
.small+.small{margin-top:6px}
.hl{border:0;background:none;padding:0;font-size:12.5px;font-weight:600;color:var(--rust-ink);text-decoration:underline;text-underline-offset:3px;margin-left:6px}
.lnk{border:0;background:none;padding:2px 0;font-size:12.5px;font-weight:600;color:var(--slate);text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--rust)}
.lnk.del{color:var(--alert)}
.lnk[disabled]{color:var(--mute);text-decoration:none;cursor:not-allowed}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fg .w{grid-column:1/-1}
.fld label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700;margin-bottom:4px}
.fld input:not([type=checkbox]):not([type=color]),.fld select,.fld textarea,table.t input:not([type=checkbox]),table.t select{width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);line-height:1.4}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,table.t input:focus,table.t select:focus{outline:2px solid var(--rust);outline-offset:1px}
.fld .help{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.45}
.ck{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer}
.fld label.ck{font-family:var(--sans);font-size:13px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink-2);margin-bottom:0}
.ck input{margin:0;accent-color:var(--rust)}
.ro{font-family:var(--mono);font-size:12px;padding:6px 8px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;color:var(--slate)}

.crow{display:grid;grid-template-columns:52px 1fr 110px 150px 90px auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--surface-2);cursor:pointer;font-size:13px}
.crow:hover{background:var(--surface)}
.crow.open{background:var(--rust-soft)}
.crow .ttl{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .k{font-family:var(--mono);font-size:10.5px;color:var(--mute);font-weight:400;margin-left:6px}
.crow .m{font-size:12px;color:var(--slate);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv{display:flex;gap:2px}
.mv button{border:1px solid var(--rule);background:var(--paper);border-radius:3px;width:22px;height:22px;font-size:10px;color:var(--slate);padding:0}
.mv button:hover{border-color:var(--slate)}
.mv button[disabled]{opacity:.3;cursor:default}
.bd{font-family:var(--mono);font-size:9px;letter-spacing:.05em;font-weight:700;padding:1px 5px;border-radius:3px;border:1px solid var(--rule);color:var(--slate);background:var(--surface-2);white-space:nowrap}
.bd.core{background:var(--ink-2);color:#fff;border-color:var(--ink-2)}
.bd.bi{background:var(--teal-soft);color:var(--teal);border-color:#BFD6D2}
.bd.cu{background:var(--rust-soft);color:var(--rust-ink);border-color:#E3CCC2}
.bd.req{background:var(--amber-soft);color:var(--amber);border-color:#E4D3AF}
.cedit{padding:14px 12px 16px;border-top:1px solid var(--rule);background:#FCFCFC}
.note{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:9px 12px;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.note.warn{background:var(--amber-soft);border-color:#E4D3AF}
.note.err{background:var(--alert-soft);border-color:#E0BFBF;color:var(--alert)}
.addrow{display:grid;grid-template-columns:1fr 160px 200px auto;gap:8px;align-items:end;margin-top:12px;padding-top:12px;border-top:1px dashed var(--rule)}

table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate);font-weight:700;padding:7px 6px;border-bottom:2px solid var(--rule);background:var(--surface-2);white-space:nowrap}
table.t td{padding:5px 6px;border-top:1px solid var(--surface-2);vertical-align:middle}
table.t td.k{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--rust-ink);white-space:nowrap}
table.t td.mm{font-size:11.5px;color:var(--slate)}
table.t tr.off td{opacity:.55}
.sev{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap}
.sev.error{background:var(--alert-soft);color:var(--alert)}
.sev.warn{background:var(--amber-soft);color:var(--amber)}
.sev.info{background:var(--surface-2);color:var(--slate)}
.sentence{font-family:var(--serif);font-size:15px;color:var(--ink-2);background:var(--surface);border-left:3px solid var(--rust);padding:8px 12px;margin:10px 0 0}
.rulegrid{display:grid;grid-template-columns:70px 170px 1fr;gap:8px;align-items:center;margin-top:8px}
.rulegrid .lw{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);font-weight:700}
.rulegrid select,.rulegrid input{width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.swatch{display:inline-block;width:28px;height:28px;border-radius:4px;border:1px solid var(--rule);vertical-align:middle}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:10px 12px}
.stat .v{font-family:var(--serif);font-size:24px}
.stat .t{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700}

/* help panel */
.help-ov{position:fixed;inset:0;background:rgba(20,26,31,.35);z-index:50;display:none}
.help-ov.on{display:block}
.helpp{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--paper);z-index:51;box-shadow:-4px 0 20px rgba(0,0,0,.15);display:none;flex-direction:column}
.helpp.on{display:flex}
.helpp .hh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.helpp .hh b{font-family:var(--serif);font-size:18px;font-weight:400;flex:1}
.helpp .hs{padding:10px 16px;border-bottom:1px solid var(--rule)}
.helpp .hs input{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:4px}
.helpp .hb{flex:1;overflow:auto;display:grid;grid-template-columns:170px 1fr}
.helpp .ht{border-right:1px solid var(--rule);padding:8px 0;overflow:auto}
.helpp .ht button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 14px;font-size:12.5px;color:var(--ink-2);border-left:3px solid transparent}
.helpp .ht button.on{background:var(--rust-soft);border-left-color:var(--rust);color:var(--rust-ink);font-weight:600}
.helpp .hc{padding:14px 18px 40px;overflow:auto}
.helpp .hc h2{font-family:var(--serif);font-size:20px;font-weight:400;margin:0 0 10px}
.helpp .hc p{font-size:13.5px;color:var(--ink-2);margin:0 0 10px;max-width:62ch}
.helpp .hc ul{margin:0 0 10px;padding-left:18px}
.helpp .hc li{font-size:13.5px;color:var(--ink-2);margin-bottom:6px}
.helpp .hc .ex{background:var(--surface);border-left:3px solid var(--rust);padding:8px 12px;font-size:13px;margin:0 0 10px}
mark{background:#FBE9A6;padding:0 1px}
@media(max-width:1100px){
  .main{grid-template-columns:170px minmax(0,1fr)}
  .main .pv{grid-column:1/-1;min-height:70vh}
  .crow{grid-template-columns:52px 1fr 90px auto}
  .crow .hide-s{display:none}
}
@media(max-width:700px){
  .main,.main.l-editor{grid-template-columns:1fr}
  .nav{display:flex;overflow:auto;padding:0;border-right:0;border-bottom:1px solid var(--rule)}
  .nav .h{display:none}
  .nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;width:auto}
  .nav button.on{border-bottom-color:var(--rust)}
  .fg,.stats,.addrow{grid-template-columns:1fr}
  .helpp .hb{grid-template-columns:1fr}
  .helpp .ht{display:none}
}
</style>
</head>
<body>
<div class="top"><b>CI Index Builder</b><span>Configuration Management &middot; Tool builder &middot; Rev C draft</span></div>
<div class="bar">
  <button class="btn pri" data-act="save">Save build</button>
  <button class="btn" data-act="open">Open build</button>
  <button class="btn pri" data-act="export">Export tool</button>
  <span class="sep"></span>
  <button class="btn" data-act="undo" id="b-undo" title="Undo">Undo</button>
  <button class="btn" data-act="redo" id="b-redo" title="Redo">Redo</button>
  <button class="btn gh" data-act="reset">Start over</button>
  <span class="sep"></span>
  <button class="btn" data-act="help">Help</button>
  <span id="vchip"></span>
  <span class="chip ok" id="dirty">Saved</span>
  <span id="msg" role="status" aria-live="polite"></span>
</div>
<input type="file" id="f-open" accept=".json,.html,.htm,application/json,text/html" style="display:none">

<div class="main" id="main">
  <nav class="nav" id="nav" aria-label="Builder sections"></nav>
  <div class="ed" id="ed"></div>
  <div class="pv" id="pv">
    <div class="pvbar">
      <span class="lab">Preview</span>
      <button class="btn sm" data-act="pv-refresh">Refresh</button>
      <label><input type="checkbox" id="pv-auto" checked> Auto</label>
      <label><input type="checkbox" id="pv-keep" checked> Keep my entries</label>
      <label>Start from <select id="pv-mode"><option value="examples">Example rows</option><option value="empty">Empty index</option></select></label>
      <label>Width <select id="pv-width"><option value="full">Full</option><option value="phone">Phone</option></select></label>
      <label>Layout <select id="pv-layout"><option value="side">Side by side</option><option value="below">Preview below</option><option value="editor">Editor only</option><option value="preview">Preview only</option></select></label>
      <button class="btn sm gh" data-act="pv-pop">Pop out</button>
    </div>
    <div class="pvwrap" id="pvwrap"><iframe id="pvf" title="Tool preview" sandbox="allow-scripts allow-modals allow-downloads allow-forms allow-popups"></iframe></div>
  </div>
</div>

<div class="help-ov" id="help-ov" data-act="help-close"></div>
<aside class="helpp" id="helpp" aria-label="Help">
  <div class="hh"><b>Help</b><button class="btn sm gh" data-act="help-close">Close</button></div>
  <div class="hs"><input id="help-q" placeholder="Search help" aria-label="Search help"></div>
  <div class="hb"><div class="ht" id="help-toc"></div><div class="hc" id="help-body"></div></div>
</aside>

<script>

rkest for established. Blank is empty track.\n   No status colors. A planned baseline is normal, not a finding. */\nvar BC={est:['Established','#2B3D4C'],within:['Within parent baseline','#4D6474'],plan:['Planned','#748B99'],other:['Other entry','#9AADB9'],blank:['Blank','']};\nfunction stackBar(rows,k){\n  var c={est:0,within:0,plan:0,other:0,blank:0,na:0};\n  rows.forEach(function(r){ c[baseClass(r[k])]++; });\n  var tot=rows.length-c.na||1, h='\u003cdiv class=\"sbar stk\">';\n  ['est','within','plan','other'].forEach(function(x){ if(c[x]) h+='\u003cspan style=\"width:'+(100*c[x]/tot)+'%;background:'+BC[x][1]+'\" title=\"'+BC[x][0]+': '+c[x]+'\">\u003c/span>'; });\n  h+='\u003c/div>\u003cdiv class=\"small\" style=\"font-size:11.5px\">'+['est','within','plan','other','blank'].filter(function(x){ return c[x]; }).map(function(x){ return '\u003cspan class=\"sw\" style=\"background:'+(BC[x][1]||'var(--surface-2)')+(BC[x][1]?'':';box-shadow:inset 0 0 0 1px var(--mute)')+'\">\u003c/span>'+c[x]+' '+BC[x][0].toLowerCase(); }).join(' &middot; ')+'\u003c/div>';\n  return h;\n}\nfunction acnBar(rows){\n  var cnt=[0,0,0,0,0,0,0,0], nr=0, bl=0, tot=rows.length||1;\n  rows.forEach(function(r){ var c=acnCat(r.acnLvl); if(/^lvl/.test(c)) cnt[+c.slice(3)]++; else if(c==='notreq') nr++; else bl++; });\n  var parts=[]; for(var i=7;i>=0;i--) if(cnt[i]) parts.push(['Level '+i,cnt[i],ACR[i]]);\n  if(nr) parts.push(['not required',nr,ACN_NR]);\n  var h='\u003cdiv class=\"sbar stk\">'+parts.map(function(p){ return '\u003cspan style=\"width:'+(100*p[1]/tot)+'%;background:'+p[2]+'\" title=\"'+p[0]+': '+p[1]+'\">\u003c/span>'; }).join('')+'\u003c/div>';\n  if(bl) parts.push(['not answered',bl,'']);\n  return h+'\u003cdiv class=\"small\" style=\"font-size:11.5px\">'+parts.map(function(p){ return '\u003cspan class=\"sw\" style=\"background:'+(p[2]||'var(--surface-2)')+(p[2]?'':';box-shadow:inset 0 0 0 1px var(--mute)')+'\">\u003c/span>'+p[1]+' '+p[0]; }).join(' &middot; ')+'\u003c/div>';\n}\nfunction barRows(pairs,total){\n  return pairs.map(function(p){ return '\u003cdiv class=\"brow\">\u003cspan>'+esc(p[0])+'\u003c/span>\u003cdiv class=\"sbar\" style=\"margin:0\">\u003cspan style=\"width:'+(total?100*p[1]/total:0)+'%;background:'+(p[2]||'var(--slate)')+'\">\u003c/span>\u003c/div>\u003cspan class=\"n\">'+p[1]+'\u003c/span>\u003c/div>'; }).join('');\n}\nfunction overviewHTML(){\n  var lv=S.cis.filter(live), ng=lv.filter(function(r){ return !isGFE(r); });\n  var prop=lv.filter(function(r){ return r.status===ST.proposed; });\n  var cb=ng.filter(function(r){ return r.critB==='Y'; }).length, sci=ng.filter(function(r){ return r.sci==='Y'; }).length;\n  var c1=ng.filter(function(r){ return (r.src||[]).some(isC1); }).length;\n  var csi=ng.filter(function(r){ return (r.src||[]).some(function(s){ return isRole(s,'csi'); }); }).length;\n  var fmh=has('fmeca')?ng.filter(fmHigh).length:0;\n  var h='\u003cdiv class=\"tiles\">'+\n    '\u003cdiv class=\"tile\">\u003cdiv class=\"t\">Live CIs\u003c/div>\u003cdiv class=\"v\">'+lv.length+'\u003c/div>\u003cdiv class=\"s\">'+(S.cis.length-lv.length)+' retired rows kept for traceability\u003c/div>\u003c/div>'+\n    '\u003cdiv class=\"tile'+(prop.length?' amb':'')+'\">\u003cdiv class=\"t\">Awaiting concurrence\u003c/div>\u003cdiv class=\"v\">'+prop.length+'\u003c/div>\u003cdiv class=\"s\">'+esc(ST.proposed||'Proposed')+' until the Acquirer concurs\u003c/div>\u003c/div>'+\n    (has('critB')?'\u003cdiv class=\"tile\">\u003cdiv class=\"t\">Criterion (b) met\u003c/div>\u003cdiv class=\"v\">'+cb+'\u003c/div>\u003cdiv class=\"s\">'+(has('sci')?sci+' SCI &middot; ':'')+c1+' C-1 &middot; '+csi+' critical safety item'+(has('fmeca')?' &middot; '+fmh+'&nbsp;FMECA&nbsp;I&nbsp;or&nbsp;II':'')+'\u003c/div>\u003c/div>':'\u003cdiv class=\"tile\">\u003cdiv class=\"t\">Variant rows\u003c/div>\u003cdiv class=\"v\">'+S.vars.length+'\u003c/div>\u003cdiv class=\"s\">PN Variants\u003c/div>\u003c/div>')+\n    '\u003cdiv class=\"tile'+(CNT.flag?' alert':CNT.review?' amb':'')+'\">\u003cdiv class=\"t\">Findings\u003c/div>\u003cdiv class=\"v\">'+CNT.flag+'\u003c/div>\u003cdiv class=\"s\">flags &middot; '+CNT.review+' to review &middot; '+CNT.note+' notes\u003c/div>\u003c/div>'+\n  '\u003c/div>';\n\n  var todo=[];\n  if(CNT.flag) todo.push(['flag','Resolve '+CNT.flag+' flag'+(CNT.flag>1?'s':'')+'. A flag marks a cell the workbook would highlight, or a record that disagrees with itself.',tabOn('checks')?'\u003cbutton class=\"lnk\" data-tab=\"checks\">Open checks\u003c/button>':'']);\n  if(T.unplaced.length) todo.push(['flag',T.unplaced.length+' row'+(T.unplaced.length>1?'s are':' is')+' not placed in the hierarchy. Fix the Parent CI ID.','\u003cbutton class=\"lnk\" data-tab=\"tree\">Open hierarchy\u003c/button>']);\n  if(prop.length) todo.push(['review','Submit '+prop.length+' '+esc(ST.proposed)+' CI'+(prop.length>1?'s':'')+' for Acquirer concurrence: '+prop.slice(0,8).map(function(r){ return '\u003cbutton class=\"cibtn\" data-goto=\"'+r.uid+'\">'+esc(r.id||'?')+'\u003c/button>'; }).join(', ')+(prop.length>8?', and '+(prop.length-8)+' more':'')+'.'+(FEAT.sheets.queue?' The Excel export carries them on a Concurrence Queue sheet.':''),'']);\n  if(has('selRef')){ var noSel=ng.filter(function(r){ return !tr(r.selRef); });\n    if(noSel.length) todo.push(['review',noSel.length+' live CI'+(noSel.length>1?'s carry':' carries')+' no '+esc(hd('selRef'))+'. The rationale lives on the CI selection criteria checklist.','']); }\n  if(CNT.review) todo.push(['review','Review '+CNT.review+' item'+(CNT.review>1?'s':'')+'. A review item is a likely gap. It may have a good answer.',tabOn('checks')?'\u003cbutton class=\"lnk\" data-tab=\"checks\">Open checks\u003c/button>':'']);\n  if(S.dirty) todo.push(['note','You have unsaved changes. Save the index to a file.','\u003cbutton class=\"lnk\" data-act=\"save\">Save now\u003c/button>']);\n  if(!todo.length) todo.push(['note','No flags and no review items. Save the index and export it for the CSA system.','']);\n\n  h+='\u003cdiv class=\"cols2\">\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">What needs attention\u003c/div>\u003cul class=\"todo\">'+\n    todo.map(function(t){ return '\u003cli>\u003cspan class=\"sev '+t[0]+'\">'+t[0]+'\u003c/span>\u003cspan>'+t[1]+' '+t[2]+'\u003c/span>\u003c/li>'; }).join('')+'\u003c/ul>\u003c/div>';\n\n  var bl=['abl','ipbl','fpbl'].filter(has);\n  h+='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Baselines and clearance across live CIs\u003c/div>'+\n    (bl.length?bl.map(function(k,i){ return '\u003cdiv class=\"small\" style=\"margin:'+(i?10:6)+'px 0 0\">\u003cb>'+esc(hd(k).replace(/ Status\\/Date$/,''))+'\u003c/b>\u003c/div>'+stackBar(ng,k); }).join(''):'\u003cp class=\"small\">This build carries no baseline columns.\u003c/p>')+\n    (has('fbl')?'\u003cp class=\"small\" style=\"margin-top:10px\">GFE rows and N/A entries are left out. The FBL is a system-level baseline on the top-level CI. It reads '+esc(val(T.roots[0]||{},'fbl')||'blank')+'.\u003c/p>':'')+(has('acnLvl')?'\u003cdiv class=\"small\" style=\"margin:12px 0 0\">\u003cb>ACN level\u003c/b>\u003c/div>'+acnBar(ng):'')+'\u003c/div>\u003c/div>';\n\n  /* Count bars take one neutral color. The row label names each category, so color adds nothing.\n     Red, amber, and teal already mean flag, review, and done in this tool. */\n  var comp='';\n  if(has('tier')) comp+=barRows(LISTS.tier.map(function(t){ return [t,lv.filter(function(r){ return r.tier===t; }).length]; }),lv.length)+'\u003cdiv style=\"height:8px\">\u003c/div>';\n  if(has('type')) comp+=barRows(LISTS.type.map(function(t){ return [t,lv.filter(function(r){ return r.type===t; }).length]; }),lv.length);\n  var recK=[['ser','Serialization = Y'],['lot','Lot/Batch = Y'],['iuid','IUID Required = Y'],['sh','Special Handling = Y']].filter(function(x){ return has(x[0]); });\n  var rec=recK.map(function(x){ return [x[1],ng.filter(function(r){ return r[x[0]]==='Y'; }).length]; });\n  if(has('life')) rec.push(['Life clock set',ng.filter(function(r){ return r.life&&r.life!==LIFE.none; }).length]);\n  h+='\u003cdiv class=\"cols2\">\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Composition\u003c/div>'+(comp||'\u003cp class=\"small\">No tier or type columns in this build.\u003c/p>')+'\u003c/div>'+\n     '\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Product unit records\u003c/div>'+(rec.length?barRows(rec,ng.length)+'\u003cp class=\"small\" style=\"margin-top:10px\">Counts the Y answers only. The product definition data defines each obligation.\u003c/p>':'\u003cp class=\"small\">No unit record columns in this build.\u003c/p>')+'\u003c/div>\u003c/div>';\n  return h;\n}\n\n/* ===================================================================\n   Hierarchy view\n   =================================================================== */\nfunction treeViewHTML(){\n  return '\u003cdiv class=\"split\">\u003cdiv class=\"treebox\">\u003cdiv class=\"treehead\">'+\n    '\u003cbutton class=\"lnk\" data-act=\"expand\">Expand all\u003c/button>\u003cbutton class=\"lnk\" data-act=\"collapse\">Collapse all\u003c/button>'+\n    '\u003clabel>\u003cinput type=\"checkbox\" data-opt=\"showRet\"'+(S.showRet?' checked':'')+'> Show retired\u003c/label>\u003c/div>'+\n    '\u003cdiv id=\"treelist\">'+treeListHTML()+'\u003c/div>\u003c/div>'+\n    '\u003cdiv id=\"detail\">'+detailHTML(cur())+'\u003c/div>\u003c/div>';\n}\nfunction badges(r){\n  var b='';\n  if(r.type) b+='\u003cspan class=\"bd\">'+esc(abbr('type',r.type))+'\u003c/span>';\n  if(r.tier) b+='\u003cspan class=\"bd'+(isGFE(r)?' g':'')+'\" title=\"'+esc(r.tier)+'\">'+esc(abbr('tier',r.tier))+'\u003c/span>';\n  if(r.critB==='Y') b+='\u003cspan class=\"bd b\" title=\"Criterion (b) met\">(b)\u003c/span>';\n  if(r.status===ST.proposed) b+='\u003cspan class=\"bd p\">PROP\u003c/span>';\n  else if(!live(r)) b+='\u003cspan class=\"bd\">'+(r.status===ST.dedes?'DE-DES':isSup(r)?'SUPER':'RET')+'\u003c/span>';\n  var c=rowCounts(r.uid);\n  if(c.f) b+='\u003cspan class=\"dot f\" title=\"'+c.f+' flag(s)\">'+c.f+'\u003c/span>';\n  else if(c.r) b+='\u003cspan class=\"dot r\" title=\"'+c.r+' to review\">'+c.r+'\u003c/span>';\n  return b;\n}\nfunction nodeHTML(r,d,unp){\n  var kids=(T.kids[r.uid]||[]).filter(function(k){ return S.showRet||live(k); });\n  var open=!S.col[r.uid];\n  var tw=kids.length?'\u003cbutton class=\"tw\" data-tog=\"'+r.uid+'\" aria-label=\"'+(open?'Collapse':'Expand')+'\">'+(open?'▾':'▸')+'\u003c/button>':'\u003cspan class=\"tw leaf\">▸\u003c/span>';\n  var g=''; for(var i=0;i\u003cd;i++) g+='\u003cspan class=\"guide\" style=\"left:'+(16+i*18)+'px\">\u003c/span>';\n  var h='\u003cdiv class=\"tn'+(S.sel===r.uid?' sel':'')+(live(r)?'':' ret')+'\" tabindex=\"0\" data-sel=\"'+r.uid+'\" style=\"padding-left:'+(8+d*18)+'px\">'+g+tw+\n    '\u003cspan class=\"tid\">'+esc(r.id||'(no ID)')+'\u003c/span>\u003cspan class=\"tname\" title=\"'+esc(r.name)+'\">'+esc(r.name||'(unnamed)')+'\u003c/span>'+badges(r)+'\u003c/div>';\n  if(open&&!unp) kids.forEach(function(k){ h+=nodeHTML(k,d+1); });\n  return h;\n}\nfunction treeListHTML(){\n  var h='';\n  T.roots.forEach(function(r){ if(S.showRet||live(r)) h+=nodeHTML(r,0); });\n  if(T.unplaced.length){\n    h+='\u003cdiv class=\"tsec\">Not placed in the hierarchy\u003c/div>';\n    T.unplaced.forEach(function(r){ h+=nodeHTML(r,0,true); });\n  }\n  return h||'\u003cp class=\"small\" style=\"padding:12px\">No rows to show.\u003c/p>';\n}\nfunction chipsFor(r){\n  var c=rowCounts(r.uid), lvl=T.lvl[r.uid];\n  return '\u003cdiv class=\"dchips\">'+\n    '\u003cspan class=\"chip'+(r.status===ST.active?' ok':r.status===ST.proposed?' hold':'')+'\">'+esc(r.status||'No status')+'\u003c/span>'+\n    (r.tier?'\u003cspan class=\"chip\">'+esc(r.tier)+'\u003c/span>':'')+\n    (r.type?'\u003cspan class=\"chip\">'+esc(r.type)+'\u003c/span>':'')+\n    '\u003cspan class=\"chip\">Level '+(lvl==null?'unknown':lvl)+'\u003c/span>'+\n    (r.critB==='Y'?'\u003cspan class=\"chip on\">Criterion (b .map(function(c,i){ return '\u003ctd class=\"'+(i?'m':'k')+'\">'+esc(v[c.k])+'\u003c/td>'; }).join('')+'\u003c/tr>'; }).join('')+'\u003c/tbody>\u003c/table>';\n  return h+'\u003cdiv class=\"btnrow\" style=\"margin-top:10px\">\u003cbutton class=\"btn sm\" data-act=\"var-add-ci\">Add a variant for this CI\u003c/button>\u003cbutton class=\"lnk\" data-tab=\"variants\">Open the PN Variants tab\u003c/button>\u003c/div>\u003c/div>';\n}\n\n/* ===================================================================\n   Table view\n   =================================================================== */\nfunction tableViewHTML(){\n  var f=S.filt;\n  return '\u003cdiv class=\"filters\">'+\n    '\u003cdiv class=\"fld\" style=\"flex:1;min-width:220px\">\u003clabel for=\"q\">Search\u003c/label>\u003cinput id=\"q\" data-filt=\"q\" value=\"'+esc(f.q)+'\" placeholder=\"CI ID, name, PIN, or any value\">\u003c/div>'+\n    (has('status')?'\u003cdiv class=\"fld\">\u003clabel for=\"fs\">Status\u003c/label>\u003cselect id=\"fs\" data-filt=\"status\">'+optList(LISTS.status,f.status,'Any status')+'\u003c/select>\u003c/div>':'')+\n    (has('tier')?'\u003cdiv class=\"fld\">\u003clabel for=\"ft\">'+esc(hd('tier'))+'\u003c/label>\u003cselect id=\"ft\" data-filt=\"tier\">'+optList(LISTS.tier,f.tier,'Any')+'\u003c/select>\u003c/div>':'')+\n    '\u003clabel class=\"ck\">\u003cinput type=\"checkbox\" data-filt=\"only\"'+(f.only?' checked':'')+'> Rows with findings only\u003c/label>'+\n    '\u003c/div>\u003cdiv id=\"gridbox\">'+gridHTML()+'\u003c/div>'+\n    '\u003cp class=\"small\" style=\"margin-top:10px\">Read only. Click a row to edit it in the hierarchy. Shaded cells carry a finding. Hover a cell to read it.\u003c/p>';\n}\nfunction gridHTML(){\n  var f=S.filt, q=f.q.toLowerCase();\n  var rows=exportOrder().filter(function(r){\n    if(f.status&&r.status!==f.status) return false;\n    if(f.tier&&r.tier!==f.tier) return false;\n    if(f.only&&!(FI[r.uid]&&FI[r.uid].all.some(function(x){ return x.sev!=='note'; }))) return false;\n    if(q&&!COLS.some(function(c){ return c.kind!=='level'&&val(r,c.k).toLowerCase().indexOf(q)>=0; })) return false;\n    return true;\n  });\n  var idI=COLS.indexOf(COL.id);\n  var h='\u003cdiv class=\"gridwrap\">\u003ctable class=\"g\">\u003cthead>\u003ctr>'+COLS.map(function(c,i){ return '\u003cth class=\"'+(c.kind==='level'?'s0':c.k==='id'?'s1':'')+'\" title=\"'+esc(c.h)+'\">'+esc(c.h)+'\u003c/th>'; }).join('')+'\u003c/tr>\u003c/thead>\u003ctbody>';\n  rows.forEach(function(r){\n    var lvl=T.lvl[r.uid];\n    h+='\u003ctr data-goto=\"'+r.uid+'\" class=\"'+(live(r)?'':'ret')+'\">';\n    COLS.forEach(function(c){\n      var v=c.kind==='level'?(lvl==null?'?':lvl):c.k==='name'?' '.repeat(2*(lvl||0))+val(r,'name'):val(r,c.k);\n      var dv=c.k==='eff'&&!tr(r.eff); if(dv) v=effDerived(r);\n      var l=(FI[r.uid]&&(c.k==='id'?(FI[r.uid].k.id||[]).concat(FI[r.uid].all.filter(function(x){ return !x.k; })):FI[r.uid].k[c.k]))||[];\n      var w=worst(l), tt=l.length?l.map(function(x){ return x.rule+'. '+x.m; }).join('\\n'):String(v)+(dv?' (derived)':'');\n      var sc=(c.kind==='level'?'s0 ':c.k==='id'?'s1 ':'')+(dv?'dv ':'');\n      h+='\u003ctd class=\"'+sc+(w==='flag'||w==='review'?'x-'+w:'')+'\" title=\"'+esc(tt)+'\">'+esc(v)+'\u003c/td>';\n    });\n    h+='\u003c/tr>';\n  });\n  h+='\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"small\" style=\"margin-top:6px\">'+rows.length+' of '+S.cis.length+' rows shown.\u003c/p>';\n  return h;\n}\n\n/* ===================================================================\n   PN Variants view\n   =================================================================== */\nfunction vmsgHTML(v){ var o=FV[v.uid]; if(!o) return ''; return o.all.map(function(f){ return '\u003cdiv class=\"sev '+f.sev+'\" style=\"display:block;white-space:normal;margin-bottom:3px;letter-spacing:0;text-transform:none;font-family:var(--sans);font-size:11.5px;font-weight:600\">'+f.rule+'. '+esc(f.m)+'\u003c/div>'; }).join(''); }\nfunction variantsHTML(){\n  var ids=exportOrder().filter(function(r){ return r.id; });\n  var h='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">PN Variants\u003c/div>'+\n    '\u003cp class=\"small\">One row per variant, keyed by CI ID. This sheet records the variant mapping for a one-CI, multiple-PIN-variant verdict from the same-CI decision aid. Record the per-variant interface callout, recording flags, and effectivity. A CI with variant rows leaves its own Effectivity blank, and its row shows See PN Variants. A variant of a CSCI or Firmware CI names its own SVD and its revision. Variants share the CI’s Product Unit Record Requirement Source. Where a variant’s source differs, say so in that variant’s Notes.\u003c/p>'+\n    '\u003cp class=\"small\" style=\"margin-top:6px\">Software variants go here too. For a software CI, enter the version identifier in place of the PIN, and the build or load in place of the variant. Use this only for concurrent builds or loads fielded at the same time. Successive versions go in the software version identifier records.\u003c/p>\u003c/div>';\n  h+='\u003cdiv class=\"gridwrap\" style=\"max-height:none\">\u003ctable class=\"dt\">\u003cthead>\u003ctr>'+VCOLS.map(function(c){ return '\u003cth title=\"'+esc(c.help||'')+'\">'+esc(c.h)+'\u003c/th>'; }).join('')+'\u003cth>Findings\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>';\n  if(!S.vars.length) h+='\u003ctr>\u003ctd colspan=\"'+(VCOLS.length+2)+'\" class=\"m\">No variant rows.\u003c/td>\u003c/tr>';\n  S.vars.forEach(function(v){\n    h+='\u003ctr>';\n    VCOLS.forEach(function(c){\n      var w=worst(FV[v.uid]&&FV[v.uid].k[c.k]), cls=(w==='flag'||w==='review')?' class=\"x-'+w+'\"':'';\n      var ctl;\n      if(c.k==='ciId'){\n        var o='\u003coption value=\"\">Pick a CI\u003c/option>', seen=!v.ciId;\n        ids.forEach(function(r){ if(r.id===v.ciId) seen=true; o+='\u003coption value=\"'+esc(r.id)+'\"'+(r.id===v.ciId?' selected':'')+'>'+esc(r.id)+'\u003c/option>'; });\n        if(!seen) o+='\u003coption selected value=\"'+esc(v.ciId)+'\">'+esc(v.ciId)+' (not found)\u003c/option>';\n        ctl='\u003cselect data-vf=\"ciId\" data-vu=\"'+v.uid+'\" aria-label=\"CI ID\">'+o+'\u003c/select>';\n      } else if(c.kind==='yn'){\n        ctl='\u003cselect data-vf=\"'+c.k+'\" data-vu=\"'+v.uid+'\" aria-label=\"'+esc(c.h)+'\">'+optList(LISTS.yn,v[c.k])+'\u003c/select>';\n      } else if(c.kind==='enum'){\n        ctl='\u003cselect data-vf=\"'+c.k+'\" data-vu=\"'+v.uid+'\" aria-label=\"'+esc(c.h)+'\">'+optList(LISTS[c.list],v[c.k])+'\u003c/select>';\n      } else ctl='\u003cinput data-vf=\"'+c.k+'\" data-vu=\"'+v.uid+'\" value=\"'+esc(v[c.k])+'\" aria-label=\"'+esc(c.h)+'\">';\n      h+='\u003ctd id=\"vc-'+v.uid+'-'+c.k+'\"'+cls+' style=\"min-width:'+(c.kind==='yn'?70:c.kind==='long'?200:110)+'px\">'+ctl+'\u003c/td>';\n    });\n    h+='\u003ctd id=\"vm-'+v.uid+'\" style=\"min-width:220px\">'+vmsgHTML(v)+'\u003c/td>\u003ctd>\u003cbutton class=\"lnk\" data-vdel=\"'+v.uid+'\">Remove\u003c/button>\u003c/td>\u003c/tr>';\n  });\n  h+='\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"btnrow\">\u003cbutton class=\"btn\" data-act=\"var-add\">Add a variant row\u003c/button>\u003c/div>';\n  return h;\n}\n\n/* ===================================================================\n   Checks view\n   =================================================================== */\nfunction allRuleIds(){ return Object.keys(RULES).concat(Object.keys(CUST)); }\nfunction checksHTML(){\n  var sv=S.csev;\n  var list=F.filter(function(f){ return !sv||f.sev===sv; });\n  var h=heldHTML()+'\u003cdiv class=\"filters\" style=\"align-items:center\">'+\n    ['','flag','review','note'].map(function(s){ var n=s?CNT[s]:F.length;\n      return '\u003cbutton class=\"btn sm'+(sv===s?' pri':'')+'\" data-csev=\"'+s+'\">'+(s?s.charAt(0).toUpperCase()+s.slice(1)+'s':'All')+' ('+n+')\u003c/button>'; }).join('')+\n    '\u003cspan class=\"small\">A flag marks a cell the workbook would highlight, or a record that disagrees with itself. A review item is a likely gap. A note is a reminder. Checks never block entry.\u003c/span>\u003c/div>';\n  if(!list.length) h+='\u003cdiv class=\"sect\">\u003cp class=\"small\">Nothing to show. '+(F.length?'Pick another filter.':'Every check passes.')+'\u003c/p>\u003c/div>';\n  else{\n    h+='\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>Severity\u003c/th>\u003cth>Rule\u003c/th>\u003cth>CI\u003c/th>\u003cth>Column\u003c/th>\u003cth>Finding\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>';\n    list.forEach(function(f){\n      var r=f.uid&&T.byUid[f.uid], v=f.vuid&&S.vars.filter(function(x){ return x.uid===f.vuid; })[0];\n      var ci=r?'\u003cbutton class=\"cibtn\" data-goto=\"'+r.uid+'\">'+esc(r.id||'(no ID)')+'\u003c/button>':(v?'\u003cbutton class=\"cibtn\" data-tab=\"variants\">Variant row\u003c/button>':'');\n      var col=f.k?(f.vuid?'PN Variants: '+VC(f.k):hd(f.k)):'';\n      h+='\u003ctr>\u003ctd>\u003cspan class=\"sev '+f.sev+'\">'+f.sev+'\u003c/span>\u003c/td>\u003ctd class=\"k\">'+f.rule+'\u003c/td>\u003ctd>'+ci+'\u003c/td>\u003ctd class=\"m\">'+esc(col)+'\u003c/td>\u003ctd>'+esc(f.m)+'\u003c/td>\u003c/tr>';\n    });\n    h+='\u003c/tbody>\u003c/table>';\n  }\n  h+='\u003ch2 style=\"font-family:var(--serif);font-weight:400;font-size:19px;margin:30px 0 10px\">Rule catalog\u003c/h2>'+\n    '\u003cp class=\"small\" style=\"margin-bottom:10px\">Every check this build runs, and the part of the template or the process it comes from. GFE rows are thin, so the safety, recording, baseline, and model checks skip them. Retired rows skip them too. A rule that needs a column this build does not carry is listed as inactive.\u003c/p>'+\n    '\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>Rule\u003c/th>\u003cth>Severity\u003c/th>\u003cth>Area\u003c/th>\u003cth>What it checks\u003c/th>\u003cth>Basis\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    allRuleIds().map(function(k){ var x=ruleInfo(k), on=ruleOn(k); return '\u003ctr'+(on?'':' style=\"opacity:.5\"')+'>\u003ctd class=\"k\">'+k+'\u003c/td>\u003ctd>'+(on?'\u003cspan class=\"sev '+x.sev+'\">'+x.sev+'\u003c/span>':'\u003cspan class=\"sev note\">off\u003c/span>')+'\u003c/td>\u003ctd class=\"m\">'+esc(x.area)+'\u003c/td>\u003ctd>'+esc(x.what)+'\u003c/td>\u003ctd class=\"m\">'+esc(x.basis)+'\u003c/td>\u003c/tr>'; }).join('')+\n    (COLS.some(function(c){ return c.req; })?'\u003ctr>\u003ctd class=\"k\">RQ\u003c/td>\u003ctd>\u003cspan class=\"sev review\">per column\u003c/span>\u003c/td>\u003ctd class=\"m\">Required\u003c/td>\u003ctd>Required columns: '+esc(COLS.filter(function(c){ return c.req; }).map(function(c){ return c.h; }).join(', '))+'.\u003c/td>\u003ctd class=\"m\">Build settings\u003c/td>\u003c/tr>':'')+\n    '\u003c/tbody>\u003c/table>';\n  return h;\n}\n\n/* ===================================================================\n   Structural floor\n   The part of the interface register's structural floor that the CI\n   index can predict. Sibling CIs are not paired: interfaces reach the\n   register from Systems Engineering's interface sources.\n   =================================================================== */\nfunction deriveFloor(){\n  var out=[], lv=S.cis.filter(function(r){ return live(r)&&r.id&&T.unplaced.indexOf(r)\u003c0; });\n  lv.forEach(function(r){ var p=parentOf(r); if(p&&live(p)&&p.tier&&r.tier&&p.tier!==r.tier) out.push({basis:'Parent and child, different control tiers',a:p,b:r,need:'At least one Mapped row joining the two CIs'}); });\n  lv.forEach(function(r){ if(isGFE(r)) out.push({basis:'GFE CI',a:r,b:null,need:'At least one Mapped row naming this CI'}); });\n  return out;\n}\nfunction floorHTML(){\n  var b=deriveFloor(), pc=b.filter(function(x){ return x.b; }).length, g=b.length-pc;\n  var h='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Structural floor\u003c/div>'+\n    '\u003cp class=\"small\">Systems Engineering identifies interfaces and defines them in its interface sources. CM maps each one to the CIs it joins on the interface register. The register is the record. This list is the part of the structural floor the CI index can predict: each parent and child in different control tiers, and each GFE CI. Each one needs at least one Mapped row on the interface register. External items named in the system specification or the contract complete the floor. They are not in the index, so check them on the register directly.\u003c/p>'+\n    '\u003cp class=\"small\" style=\"margin-top:8px\">An entry with no Mapped row is a floor gap, and a floor gap is a coverage exception. Systems Engineering dispositions it. Where Systems Engineering confirms that no interface exists, record that confirmation on the coverage log. Nothing is signed in advance. Sibling CIs are not paired here. An interface between siblings, or between CIs in different branches, reaches the register from the interface sources.\u003c/p>\u003c/div>';\n  h+='\u003cp class=\"small\" style=\"margin:0 0 8px\">\u003cb>'+b.length+'\u003c/b> floor entr'+(b.length===1?'y':'ies')+' across live CIs: '+pc+' parent-and-child pair'+(pc===1?'':'s')+' and '+g+' GFE CI'+(g===1?'':'s')+'.'+(FEAT.sheets.bound?' The Excel export carries them on a Structural Floor sheet.':'')+'\u003c/p>';\n  if(!b.length) return h;\n  h+='\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>Basis\u003c/th>\u003cth>CI\u003c/th>\u003cth>Other CI\u003c/th>\u003cth>The register needs\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    b.map(function(x,i){ return '\u003ctr>\u003ctd class=\"m\">'+(i+1)+'\u003c/td>\u003ctd>'+esc(x.basis)+'\u003c/td>'+\n      '\u003ctd>\u003cbutton class=\"cibtn\" data-goto=\"'+x.a.uid+'\">'+esc(x.a.id)+'\u003c/button> \u003cspan class=\"m\">'+esc(x.a.name)+'\u003c/span>\u003c/td>'+\n      '\u003ctd>'+(x.b?'\u003cbutton class=\"cibtn\" data-goto=\"'+x.b.uid+'\">'+esc(x.b.id)+'\u003c/button> \u003cspan class=\"m\">'+esc(x.b.name)+'\u003c/span>':'\u003cspan class=\"m\">Any CI or external item\u003c/span>')+'\u003c/td>'+\n      '\u003ctd>'+esc(x.need)+'\u003c/td>\u003c/tr>'; }).join('')+'\u003c/tbody>\u003c/table>';\n  return h;\n}\n\n/* ===================================================================\n   Edit log and comparison\n   =================================================================== */\nfunction logHTML(){\n  var h='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Compare with a saved index\u003c/div>'+\n    '\u003cp class=\"small\">Open an earlier saved file. The tool lists every CI added, removed, or changed since then, field by field. Use it to prepare a CSA report or to check a resubmittal.\u003c/p>'+\n    '\u003cdiv class=\"btnrow\">\u003cbutton class=\"btn\" data-act=\"cmp-open\">Compare with a saved file\u003c/button>'+(S.cmp?'\u003cbutton class=\"btn gh\" data-act=\"cmp-clear\">Clear the comparison\u003c/button>':'')+'\u003c/div>'+\n    (S.cmp?cmpHTML():'')+'\u003c/div>';\n  h+='\u003cdiv class=\"sect\">\u003cdiv class=\"lab\">Edit log\u003c/div>\u003cp class=\"small\">Every change made in this tool, with who and when. Saved with the index file.'+(FEAT.sheets.log?' Exported to Excel on an Edit Log sheet.':'')+'\u003c/p>'+\n    '\u003cdiv class=\"filters\" style=\"margin-top:10px\">\u003cdiv class=\"fld\" style=\"min-width:260px\">\u003clabel for=\"lq\">Filter\u003c/label>\u003cinput id=\"lq\" data-lq=\"1\" value=\"'+esc(S.logq)+'\" placeholder=\"CI ID, column, or name\">\u003c/div>\u003c/div>\u003cdiv id=\"logbox\">'+logTable()+'\u003c/div>\u003c/div>';\n  return h;\n}\nfunction logTable(){\n  var q=S.logq.toLowerCase();\n  var L=S.log.slice().reverse().filter(function(e){ return !q||[e.ci,e.f,e.who,e.act,e.from,e.to].join(' ').toLowerCase().indexOf(q)>=0; });\n  if(!L.length) return '\u003cp class=\"small\">No entries.\u003c/p>';\n  return '\u003ctable class=\"dt\">\u003cthead>\u003ctr>\u003cth>When\u003c/th>\u003cth>Who\u003c/th>\u003cth>Action\u003c/th>\u003cth>CI\u003c/th>\u003cth>Column\u003c/th>\u003cth>From\u003c/th>\u003cth>To\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    L.slice(0,500).map(function(e){ return '\u003ctr>\u003ctd class=\"m\" style=\"white-space:nowrap\">'+esc(e.t)+'\u003c/td>\u003ctd class=\"m\">'+esc(e.who)+'\u003c/td>\u003ctd>'+esc(e.act)+'\u003c/td>\u003ctd class=\"k\">'+esc(e.ci)+'\u003c/td>\u003ctd class=\"m\">'+esc(e.f)+'\u003c/td>\u003ctd class=\"m\">'+esc(e.from)+'\u003c/td>\u003ctd>'+esc(e.to)+'\u003c/td>\u003c/tr>'; }).join('')+\n    '\u003c/tbody>\u003c/table>'+(L.length>500?'\u003cp class=\"small\">Showing the latest 500 of '+L.length+'. The saved file carries every entry.\u003c/p>':'');\n}\nfunction diffIndex(old){\n  var out=[], om={}, nm={};\n  (old.cis||[]).forEach(function(r){ if(r.id) om[r.id]=r; });\n  S.cis.forEach(function(r){ if(r.id) nm[r.id]=r; });\n  Object.keys(nm).forEach(function(id){\n    var n=nm[id], o=om[id];\n    if(!o){ out.push({ci:id,ch:'Added',f:'',from:'',to:n.name}); return; }\n    COLS.forEach(function(c){ if(c.kind==='level'||c.k==='id') return; var a=val(o,c.k), b=val(n,c.k); if(a!==b) out.push({ci:id,ch:'Changed',f:c.h,from:a,to:b}); });\n  });\n  Object.keys(om).forEach(function(id){ if(!nm[id]) out.push({ci:id,ch:'Removed',f:'',from:om[id].name,to:''}); });\n  function vk(v){ return tr(v.ciId)+' | '+tr(v.pin); }\n  var ov={}, nv={};\n  (old.vars||[]).forEach(function(v){ ov[vk(v)]=v; }); S.vars.forEach(function(v){ nv[vk(v)]=v; });\n  Object.keys(nv).forEach(function(k){ var n=nv[k], o=ov[k];\n    if(!o){ out.push({ci:tr(n.ciId),ch:'Variant added',f:VC('pin'),from:'',to:n.pin}); return; }\n    VCOLS.forEach(function(c){ if(tr(o[c.k])!==tr(n[c.k])) out.push({ci:tr(n.ciId),ch:'Variant changed',f:n.pin+': '+c.h,from:tr(o[c.k]),to:tr(n[c.k])}); });\n  });\n  Object.keys(ov).forEach(function(k){ if(!nv[k]) out.push({ci:tr(ov[k].ciId),ch:'Variant removed',f:VC('pin'),from:ov[k].pin,to:''}); });\n  return out;\n}\nfunction cmpHTML(){\n  var d=diffIndex(S.cmp.data);\n  var h='\u003cp class=\"small\"  '\u003ctr>\u003ctd>'+esc(s[0])+'\u003c/td>\u003ctd class=\"m\">'+s[1]+'\u003c/td>\u003ctd>'+(s[2]?'\u003cspan class=\"sev flag\">Yes\u003c/span>':'\u003cspan class=\"m\">No\u003c/span>')+'\u003c/td>\u003c/tr>'; }).join('')+'\u003c/tbody>\u003c/table>';\n  var b=C.build||{};\n  h+='\u003ch3>About this build\u003c/h3>\u003cp class=\"small\">'+esc(b.name||'')+', revision '+esc(b.rev||'')+'. Engine revision '+ENGINE_REV+'. Edit the build in the CI Index Builder.\u003c/p>';\n  if(b.changes&&b.changes.length) h+='\u003ctable class=\"dt chg\" style=\"margin-top:8px\">\u003cthead>\u003ctr>\u003cth>Rev\u003c/th>\u003cth>Date\u003c/th>\u003cth>By\u003c/th>\u003cth>Change\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>'+\n    b.changes.map(function(c){ return '\u003ctr>\u003ctd class=\"k\">'+esc(c.rev)+'\u003c/td>\u003ctd class=\"m\">'+esc(c.date)+'\u003c/td>\u003ctd class=\"m\">'+esc(c.by)+'\u003c/td>\u003ctd>'+esc(c.text)+'\u003c/td>\u003c/tr>'; }).join('')+'\u003c/tbody>\u003c/table>';\n  return h+'\u003c/div>';\n}\n\n/* ===================================================================\n   Excel columns. What the import reads, the header it accepts, the\n   minimum to load, and the stage at which each column falls due.\n   =================================================================== */\nvar STAGES=C.stages||[], HELD=[];\nfunction stageIdx(k){ for(var i=0;i\u003cSTAGES.length;i++) if(STAGES[i].k===k) return i; return -1; }\nfunction stageName(k){ var i=stageIdx(k); return i>=0?STAGES[i].name:'Any time'; }\nfunction colStage(k){ return COL[k]&&COL[k].stage?stageIdx(COL[k].stage):-1; }\nfunction notDue(k){ if(!S.meta.stage) return false; var cur=stageIdx(S.meta.stage); return cur>=0&&colStage(k)>cur; }\n/* rules that fire because a cell is blank, and the column they name */\nvar BLANKR={ST1:'id',ST5:'parent',ST7:'tier',CO1:'status',CO5:'selRef',SA1:'critB',SA7:'sci',SA5:'sciRef',SA11:'fmeca',SA9:'fmecaRef',AC3:'acnLvl',AC1:'acnRef',RV1:'specRev',RV2:'scdRev',RV3:'vicdRe ction(r){ return !isGFE(r); }), o={n:lv.length,ng:ng.length,f:{}};\n  COLS.forEach(function(c){ if(c.kind==='level') return; var base=c.core?lv:ng; o.f[c.k]={n:base.filter(function(r){ return !!val(r,c.k); }).length,of:base.length}; });\n  return o;\n}\nfunction heldHTML(){\n  if(!HELD.length) return '';\n  var by={}; HELD.forEach(function(h){ by[h.k]=(by[h.k]||0)+1; });\n  return '\u003cdiv class=\"heldbox\">\u003cb>'+HELD.length+' blank-entry hint'+(HELD.length===1?' is':'s are')+' held.\u003c/b> Index stage reads '+esc(stageName(S.meta.stage))+'. These columns fall due at a later stage: '+\n    Object.keys(by).map(function(k){ return esc(hd(k))+' ('+by[k]+')'; }).join(', ')+'. Set Index stage to a later stage, or to All columns due, to see them. Hints that compare two filled cells are never held.\u003c/div>';\n}\nfunction minLoadHTML(){\n  var hk=headerKeys().map(function(k){ var c=COL[k]; return '\u003cb>'+esc(c.h)+'\u003c/b>'+((c.alias||[]).length?' (or '+c.alias.map(esc).join(', ')+')':''); });\n  return '\u003cdiv class=\"lab\">Minimum to load\u003c/div>\u003col class=\"minlist\">'+\n    '\u003cli>\u003cb>A save file\u003c/b> from this tool opens by key. Nothing else is needed.\u003c/li>'+\n    '\u003cli>\u003cb>An Excel workbook\u003c/b> needs a sheet named \u003cb>CI Index\u003c/b>.\u003c/li>'+\n    '\u003cli>Within its first 15 rows, that sheet needs a header row with '+hk.join(' or ')+'. Header matching ignores case, spaces, and punctuation. Older headers listed under Also accepts work too.\u003c/li>'+\n    '\u003cli>Every row below the header with at least one filled cell loads. A row with no CI ID still loads. ST1 flags it.\u003c/li>'+\n    (FEAT.tabs.variants?'\u003cli>A \u003cb>PN Variants\u003c/b> sheet is optional. When present, it needs a header row with \u003cb>'+esc(VC('pin'))+'\u003c/b>.\u003c/li>':'')+'\u003c/ol>'+\n    '\u003cp class=\"small\">That is all the import requires. Every other column is optional. A missing column loads as blank. A b  id=\"dgview\">\u003cdiv class=\"dgbar\" role=\"toolbar\" aria-label=\"Diagram view\">'+\n    '\u003cbutton class=\"btn sm dgzb\" data-act=\"dg-zout\" aria-label=\"Zoom out\" title=\"Zoom out. Key: minus\">\\u2212\u003c/button>'+\n    '\u003cinput type=\"range\" id=\"dg-zs\" min=\"0\" max=\"100\" step=\"0.5\" value=\"'+dgZ2S(s.zoom||1)+'\" aria-label=\"Zoom\" title=\"Drag to zoom\">'+\n    '\u003cbutton class=\"btn sm dgzb\" data-act=\"dg-zin\" aria-label=\"Zoom in\" title=\"Zoom in. Key: plus\">+\u003c/button>'+\n    '\u003cspan id=\"dg-zl\" class=\"dgzl\" aria-live=\"polite\">'+dgZoomTxt()+'\u003c/span>\u003cspan class=\"dgsep\" aria-hidden=\"true\">\u003c/span>'+\n    '\u003cbutton class=\"btn sm\" data-act=\"dg-fit\" title=\"Show the whole diagram. Key: F\">Fit all\u003c/button>'+\n    '\u003cbutton class=\"btn sm\" data-act=\"dg-fitw\" title=\"Fit the width. Key: W\">Fit width\u003c/button>'+\n    '\u003cbutton class=\"btn sm\" data-act=\"dg-100\" title=\"True size. Key: 0\">100%\u003c/button>\u003cspan class=\"dgsep\" aria-hidden=\"true\">\u003c/span>'+\n    '\u003cbutton class=\"btn sm'+(s.max?' pri':'')+'\" data-act=\"dg-max\" aria-pressed=\"'+!!s.max+'\" title=\"'+(s.max?'Return to the page. Key: Esc':'Fill the window with the diagram')+'\">'+(s.max?'Exit full window':'Full window')+'\u003c/button>'+\n    '\u003cspan class=\"dghint\">Scroll or drag to move. Ctrl + scroll, or pinch, to zoom.\u003c/span>\u003c/div>'+\n    '\u003cdiv class=\"dgwrap\" id=\"dgwrap\" tabindex=\"0\" role=\"region\" aria-label=\"Block diagram canvas. Arrow keys scroll. Plus and minus zoom.\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"'+n2(L.w*(s.zoom||1))+'\" height=\"'+n2(L.h*(s.zoom||1))+'\" viewBox=\"0 0 '+n2(L.w)+' '+n2(L.h)+'\" font-family=\"Arial, Helvetica, Liberation Sans, sans-serif\" role=\"img\" aria-label=\"Block diagram, '+L.boxes.length+' CIs\">'+dgSvgOps(ops)+'\u003c/svg>\u003c/div>';\n  var it=dgLegendItems(L,s,c,cut.length?[[cut[0].hid+' below','CIs below this block are hidden. Click its circle to show them.']]:[]);\n  h+='\u003cdiv class=\"dglegend\">'+it.map(function(i){ return '\u003cspan>'+dgSwatchHTML(i,c)+esc(i.lab)+'\u003c/span>'; }).join('')+\n    '\u003cspan class=\"small\" style=\"max-width:none\">Click a block to open it on the Hierarchy tab. Click the circle at the edge of a block to collapse or expand its branch.\u003c/span>\u003c/div>\u003c/div>';\n  return h+dgHelpHTML(c);\n}\nfunction dgHelpHTML(c){\n  var w=dgCfg().words, tiers=[['acq',TIER.acq,'darker gray'],['co',TIER.co,'light gray'],['gfe',TIER.gfe,'warm tint']].filter(function(t){ return t[1]; });\n  function p(t){ return '\u003cp>'+md(t)+'\u003c/p>'; }\n  return '\u003cdetails class=\"dghelp\">\u003csummary>How to read and export this diagram\u003c/summary>\u003cdiv class=\"dghelpb\">'+\n    '\u003ch3>What it shows\u003c/h3>'+\n    p('The diagram draws the CI hierarchy. Each block is one live CI. A line joins each CI to its parent, as **Parent CI ID** records it. EIA-649-1A asks the Supplier to establish a Configuration Item structure and hierarchy. This diagram draws that hierarchy straight from the index.')+\n    p('Retired CIs do not appear. A CI the hierarchy cannot place does not appear either. The note above the diagram counts them, and the Checks tab names them.')+\n    p('The diagram follows Parent CI ID, not NH PIN. The two can differ. A CI can sit under a parent CI and still install into an assembly that is not a CI, such as an equipment rack. Turn on the NH PIN and Qty field to see the installation on each block.')+\n    '\u003ch3>Layouts\u003c/h3>\u003cul>'+\n    '\u003cli>\u003cb>Top-down, stacked.\u003c/b> Children with no children of their own stack in columns under their parent. Children with their own children spread across. Use it for a parent with dozens of children. Rows per stack sets the column height.\u003c/li>'+\n    '\u003cli>\u003cb>Top-down tree.\u003c/b> Every child spreads across under its parent. It reads like a classic tree. It grows wide fast.\u003c/li>'+\n    '\u003cli>\u003cb>Left to right.\u003c/b> The top-level CI sits at the left. Each level is a column. Siblings stack down the page. It handles the most CIs.\u003c/li>\u003c/ul>'+\n    '\u003ch3>Block fields\u003c/h3>'+\n    p('Every block shows the CI ID and the name. The chips add fields. Each field adds one line to every block, so all blocks stay the same size. A long value ends in an ellipsis. Hover over a block to read its full name.')+\n    '\u003ch3>Box styles\u003c/h3>\u003cul>'+\n    (has('tier')?'\u003cli>\u003cb>Shade by control tier.\u003c/b> The fill shows who controls the CI’s specification. '+tiers.map(function(t){ return esc(t[1])+' takes the '+t[2]+'.'; }).join(' ')+' A white block has no control tier recorded.\u003c/li>':'')+\n    (has('status')?'\u003cli>\u003cb>Dashed border.\u003c/b> '+esc(w.proposed)+' The CI reads '+esc(ST.proposed||'Proposed')+' until the Acquirer concurs.\u003c/li>':'')+\n    (has('notdec')?'\u003cli>\u003cb>Double border.\u003c/b> '+esc(w.notdec)+' The CI reads Y for Not Decomposed. The company buys it as a unit and does not break it into further CIs.\u003c/li>':'')+\n    (has('tier')?'\u003cli>\u003cb>Diamond before the CI ID.\u003c/b> '+esc(w.boundary)+' The Structural floor tab lists the same pairs. Each pair needs at least one Mapped row on the interface register.\u003c/li>':'')+\n    '\u003c/ul>'+p('**Plain** turns every box style off in one click. The blocks turn white with a thin border, and the legend drops away. Press Plain again to bring back the styles you had.')+\n    p('The tool keeps red, amber, and teal for flags, review items, and done. The diagram does not use them. Findings stay on the Checks tab.')+\n    '\u003ch3>Moving around\u003c/h3>'+\n    p('Pick a branch to draw one CI and everything below it. Pick levels to stop the drawing at a depth. A tag on a cut-off block counts the CIs below it. Click the circle at the edge of a block to collapse or expand its branch. Click a block to open it on the Hierarchy tab.')+\n    p('The toolbar above the diagram sets the zoom. Drag the slider, or press the minus and plus buttons. **Fit all** shows the whole diagram. **Fit width** fills the width. **100%** shows true size. The text redraws at every zoom, so it stays sharp.')+\n    '\u003cul>\u003cli>\u003cb>Move.\u003c/b> Use the scroll bars. Or scroll the wheel, and hold Shift to scroll sideways. Or drag the diagram with the mouse.\u003c/li>'+\n    '\u003cli>\u003cb>Zoom at the pointer.\u003c/b> Hold Ctrl, or Command on a Mac, and scroll. A trackpad pinch works too.\u003c/li>'+\n    '\u003cli>\u003cb>Keys.\u003c/b> Click the diagram first. The arrow keys scroll. Plus and minus zoom. 0 shows true size. F fits all. W fits the width.\u003c/li>'+\n    '\u003cli>\u003cb>Full window.\u003c/b> The diagram fills the browser window. Press Esc or Exit full window to return.\u003c/li>\u003c/ul>'+\n    p('A large index opens at true size, centered on the top-level CI. A small one opens fitted to the width.')+\n    '\u003ch3>Exports\u003c/h3>'+\n    p('Pick a format and a scope. The **current view** exports what is on screen. It keeps the branch, the levels, and the collapsed blocks. The **paged set** exports the whole branch. Page 1 is the overview. Each block with more below gets its own page, and a tag on the block names that page. That page shows a matching From page tag. **Levels per page** sets how deep each page goes. Auto picks the most levels that still print at a readable size. In the stacked layout, a page may use shorter stack columns to fit its shape.')+\n    p('Every export carries a title block. It shows the program, the index document number, the revision, the index stage, the date, and the page. Fill in the Index card first. Each page also carries a legend for the styles it uses.')+\n    '\u003cul>\u003cli>\u003cb>PDF\u003c/b> prints at the page size you pick. Text and lines stay sharp at any zoom.\u003c/li>'+\n    '\u003cli>\u003cb>PowerPoint\u003c/b> writes one widescreen slide per page. Each block is a native shape with editable text. Each line is a connector glued to its two blocks. Move a block, and its lines follow. Page tags are grouped with their blocks. Other presentation apps may redraw the elbows their own way.\u003c/li>'+\n    '\u003cli>\u003cb>SVG\u003c/b> keeps vector quality for drawings and web pages.\u003c/li>'+\n    '\u003cli>\u003cb>PNG\u003c/b> gives a picture for email and chat. A very large picture renders smaller to stay inside browser limits.\u003c/li>\u003c/ul>'+\n    p('A paged set in SVG or PNG downloads as one ZIP file, with one file per page.')+\n    '\u003ch3>Settings\u003c/h3>'+\n    p('The build sets the starting layout, fields, styles, and export choices. Change any of them here. Your changes save with the index file. **Reset to build defaults** returns to the build’s settings.')+\n    '\u003c/div>\u003c/details>';\n}\n/* \u003cDIAGRAM */\n\n\n/* ===================================================================\n   Actions\n   =================================================================== */\nfunction nextId(extra){\n  var max=0, pre='CI-', w=4, taken={};\n  S.cis.forEach(function(r){ if(r.id) taken[r.id]=1; var m=/^(.*?)(\\d+)$/.exec(r.id||''); if(m){ var n=parseInt(m[2],10); if(n>=max){ max=n; pre=m[1]; w=m[2].length; } } });\n  (extra||[]).forEach(function(x){ taken[x]=1; });\n  var n=max+1, s;\n  do{ s=pre+String(n).padStart(w,'0'); n++; } while(taken[s]);\n  return s;\n}\nfunction copyRow(r){ var n=JSON.parse(JSON.stringify(r)); n.uid=uid(); n.src=(r.src||[]).slice(); return n; }\nfunction expandTo(r){ ancestors(r).forEach(function(a){ delete S.col[a.uid]; }); }\nfunction addRow(r,how){\n  S.cis.push(r); logEdit(r.id,null,'',r.name||r.id,how||'Add');\n  buildTree(); expandTo(r); S.sel=r.uid; S.panel=null; S.tab='tree'; dirty(); render();\n  var n=$('f-name'); if(n) n.focus();\n}\nfunction newRow(p){\n  var r=blankRow(); r.id=nextId(); r.sta
