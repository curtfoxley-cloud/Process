or('[data-act=dg-max]'); if(S.dg.max&&w) w.focus({preventScroll:true}); else if(b) b.focus({preventScroll:true}); })(); break;\n    case 'dg-100': dgZoomAt(1); break;\n    case 'dg-exp': S.dg.exp=!S.dg.exp; dgRerender(); break;\n    case 'dg-plain': dgPlain(); dgRerender(); break;\n    case 'dg-export': if(!S.cis.length){ msg('The index is empty. There is nothing to export.'); break; } dgExportRun(); break;\n    case 'dg-expand': S.dg.col={}; S.dg.open={}; S.dg.depth=0; S.dg.zoom=0; render(); break;\n    case 'dg-collapse': (function(){ var R=dgRoots(); S.dg.open={}; S.dg.col={}; S.cis.forEach(function(x){ if(live(x)&&liveKids(x).length&&R.roots.indexOf(x)\u003c0) S.dg.col[x.uid]=true; }); })(); S.dg.zoom=0; render(); break;\n    case 'dg-reset': var kz=S.dg.exp, km=S.dg.max; S.dg=dgDefaults(); S.dg.exp=kz; S.dg.max=km; render(); msg('The block diagram is back to the build defaults.'); break;\n  }\n});\ndocument.addEventListener('keydown',function(e){\n  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('tn')){ e.preventDefault(); e.target.click(); }\n});\ndocument.addEventListener('focusin',function(e){ var t=e.target; if(t.dataset&&(t.dataset.f||t.dataset.vf)) S.focusVal=t.value; });\ndocument.addEventListener('input',function(e){\n  var t=e.target, d=t.dataset; if(!d) return;\n  if(d.m){ var om=S.meta[d.m]; S.meta[d.m]=t.value; if(d.m!=='who') dirty(); if(d.m==='stage'){ logEdit('',null,stageName(om)||'All columns due',t.value?stageName(t.value):'All columns due','Index stage'); render(); } return; }\n  if(d.icd!=null){ var ri=cur(); if(!ri) return; var ed=icdEditOf(ri), itm=ed.items[+d.icd]; if(!itm) return; itm[d.icdp]=t.value; itm.ed=true; ri.icd=icdJoin(ed.items);\n    var rc=$('icdrec'); if(rc) rc.innerHTML='\u003cb>Recorded as\u003c/b> '+(tr(ri.icd)?esc(ri.icd):'\u003cspan style=\"color:var(--mute)\">Blank\u003c/span>'); dirty(); sched(); return; }\n  if(d.f&&t.tagName!=='SELECT'){ var r=cur(); if(!r) return; r[d.f]=d.f==='name'?t.value.replace(/^\\s+/,''):t.value; dirty(); sched(); return; }\n  if(d.vf&&t.tagName!=='SELECT'){ var v=S.vars.filter(function(x){ return x.uid===d.vu; })[0]; if(!v) return; v[d.vf]=t.value; dirty(); sched(); return; }\n  if(d.filt==='q'){ S.filt.q=t.value; $('gridbox').innerHTML=gridHTML(); return; }\n  if(d.lq){ S.logq=t.value; $('logbox').innerHTML=logTable(); return; }\n  if(d.sp!=null){ S.sp[+d.sp][d.spk]=t.value; return; }\n  if(d.cn){ S.cons[d.cn]=t.value; return; }\n});\ndocument.addEventListener('change',function(e){\n  var t=e.target, d=t.dataset; if(!d) return;\n  if(d.f){\n    var r=cur(); if(!r) return;\n    if(t.tagName==='SELECT'){ var o=r[d.f]; r[d.f]=t.value; logEdit(r.id,d.f,o,t.value); dirty(); render(); return; }\n    var from=S.focusVal, to=r[d.f]=tr(r[d.f]);\n    if(from!=null&&tr(from)!==to){ logEdit(d.f==='id'?to:r.id,d.f,tr(from),to); if(d.f==='id') renameId(r,tr(from),to); }\n    S.focusVal=t.value; sched(); return;\n  }\n  if(d.icd!=null){ var rj=cur(); if(!rj||!S.icdEdit||S.icdEdit.uid!==rj.uid) return; if(S.icdEdit.last!==tr(rj.icd)){ logEdit(rj.id,'icd',S.icdEdit.last,tr(rj.icd)); S.icdEdit.last=tr(rj.icd); } return; }\n  if(d.vf){\n    var v=S.vars.filter(function(x){ return x.uid===d.vu; })[0]; if(!v) return;\n    if(t.tagName==='SELECT'){ var ov=v[d.vf]; v[d.vf]=t.value; logEdit(v.ciId,null,ov,t.value,'Variant '+VC(d.vf)); dirty(); render(); return; }\n    var vf=S.focusVal; v[d.vf]=tr(v[d.vf]);\n    if(vf!=null&&tr(vf)!==v[d.vf]) logEdit(v.ciId,null,tr(vf),v[d.vf],'Variant '+VC(d.vf));\n    S.focusVal=t.value; return;\n  }\n  if(d.filt&&d.filt!=='q'){ S.filt[d.filt]=t.type==='checkbox'?t.checked:t.value; $('gridbox').innerHTML=gridHTML(); return; }\n  if(d.opt){ S[d.opt]=t.checked; $('treelist').innerHTML=treeListHTML(); return; }\n  if(d.mf){ S.mf[d.mf]=t.value; render(); return; }\n  if(d.dg){ var dk=d.dg; S.dg[dk]=(dk==='depth'||dk==='rows')?(+t.value||0):t.value; if(['branch','depth','layout','width','rows'].indexOf(dk)>=0){ S.dg.zoom=0; if(dk==='branch'){ S.dg.col={}; S.dg.open={}; } } dgRerender(); return; }\n  if(d.cpick){ S.cons.pick[d.cpick]=t.checked; return; }\n});\n$('f-json').addEventListener('change',function(e){\n  var f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;\n  if(S.dirty&&!confirm('You have unsaved changes. Open '+f.name+' anyway?')) return;\n  readJSON(f,function(o){\n    var other=o.build&&o.build.name&&o.build.name!==C.build.name;\n    loadData(o,null); var moved=NORM_LOG.length; clean(); render();\n    msg('Opened '+f.name+(o.saved?', saved '+o.saved:'')+'. '+S.cis.length+' CI rows, '+S.vars.length+' variant rows, '+S.log.length+' log entries.'+(other?' It was saved by the build \"'+o.build.name+'\". Columns this build does not carry were dropped.':''));\n    if(moved){ normReport('Converted on load'); dirty(); render(); }\n  });\n});\n$('f-xlsx').addEventListener('change',function(e){ var f=e.target.files&&e.target.files[0]; e.target.value=''; if(f) doImport(f); });\n$('f-cmp').addEventListener('change',function(e){\n  var f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;\n  readJSON(f,function(o){ S.cmp={name:f.name,data:{cis:(o.cis||[]).map(normRow),vars:(o.vars||[]).map(normVar),saved:o.saved}}; render(); msg('Comparing with '+f.name+'.'); });\n});\nwindow.addEventListener('beforeunload',function(e){ if(S.dirty&&!PREVIEW){ e.preventDefault(); e.returnValue=''; } });\n\n/* Builder preview link. The builder asks for the working data before it reloads the preview. */\nwindow.addEventListener('message',function(e){\n  if(!PREVIEW||!e.data||e.data.ciReq!=='snapshot') return;\n  var r=cur();\n  parent.postMessage({ciSnap:snapshot(),tab:S.tab,sel:r?r.id:'',sy:window.scrollY},'*');\n});\n\n/* SC columns get their own datalists */\n$('dls').innerHTML=COLS.filter(function(c){ return c.sug&&c.sug.length&&!c.pins; }).map(function(c){ return '\u003cdatalist id=\"dl-'+c.k+'\">'+c.sug.map(function(s){ return '\u003coption value=\"'+esc(s)+'\">\u003c/option>'; }).join('')+'\u003c/datalist>'; }).join('');\napplyText();\nif(PREVIEW){\n  if(PREVIEW.data) loadData(PREVIEW.data,null);\n  else if(PREVIEW.mode==='examples'&&hasEx()) loadData({meta:{prog:'Example program'},cis:C.examples.cis,vars:C.examples.vars||[]},null);\n  if(PREVIEW.tab) S.tab=PREVIEW.tab;\n  buildTree();\n  if(PREVIEW.sel&&T.ids[PREVIEW.sel]) S.sel=T.ids[PREVIEW.sel][0].uid;\n}\nrender();\nif(PREVIEW&&PREVIEW.sy) window.scrollTo(0,PREVIEW.sy);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";
var DEFAULT={"schema":1,"build":{"name":"CI Index","rev":"D","changes":[{"rev":"A","date":"2026-10-06","by":"CM","text":"First release. Implements the CI index template."},{"rev":"B","date":"2026-10-06","by":"CM","text":"Configuration moved into one build block. Editable in the CI Index Builder."},{"rev":"C","date":"2026-10-07","by":"CM","text":"Implements the interface register redesign. The ICD column stays, and its help ties it to the ICD cross-check in the interface coverage check. The Boundaries tab is now Structural floor: each parent and child in different control tiers, and each GFE CI. Sibling pairs are no longer derived. Split and consolidate messages follow the re-mapping rules. Examples: CI-0021 is source-controlled under SCD-2230-001; CI-0031 added; ICD values list every ICD, IRS, and IDD on each CI’s mapped register rows."},{"rev":"D","date":"2026-10-08","by":"CM","text":"Added the Excel columns tab. It shows each column the import reads, the header and save file key it accepts, the minimum to load, the minimum entry for a new CI, what reads each column, and what a blank cell does. The import now finds the header row by CI ID or Parent CI ID. Added Index stage: blank-entry hints for columns that fall due at a later stage are held, so an index filled in stages stays readable. Hints that compare two filled cells always run. The Excel export adds a Column Map sheet and records the stage on the About sheet."},{"rev":"[next revision]","date":"2026-10-08","by":"CM","text":"SCD (optional) is now SCD or VICD (optional). It holds the drawing that controls a supplier-designed item procured as a unit: a source control drawing or a vendor item control drawing. Specification No. reads See SCD or See VICD. The import still reads the old header. The check on See SCD also covers See VICD. The header, the reference line, and the import note name the CI identification process and the template by plain name, with no revision letter or section. The external criticality designations are named in words, not by table number. C-1 stays as their tag."},{"rev":"[next revision]","date":"2026-10-14","by":"CM","text":"Added the Metrics tab. Coverage: traced to PIN and NH, SCI traced to its source, and model alignment covered. Each shows Recorded and Verified, and lists the CIs that fall short. Profile: criterion (b) met, traced to an ICD, and traced to an SCD or VICD. Filters by control tier and by branch apply to every metric. A metric whose columns fall due at a later index stage says so. Export metrics to PowerPoint writes a title slide, a summary slide, and one slide per metric. Each chart is a picture. The words stay editable. The builder turns each metric on or off, sets its order and words, and turns the export on or off."},{"rev":"[next revision]","date":"2026-10-19","by":"CM","text":"Added FMECA Severity (highest) and FMECA Ref to the Safety group, after SCI Source Ref. FMECA Severity takes Category I to IV or Not analyzed from a new FMECA Severity list. New checks: SA8 flags Category I or II without Criterion (b) Met = Y. SA9 flags a category with no FMECA entry cited. SA10 marks a FMECA Ref with no category. SA11 marks a live CI with no FMECA answer. The Criterion (b) met metric gains a FMECA I or II slice, and the Overview tile counts it. The Concurrence Queue sheet of the Excel export carries FMECA Severity. The FMECA checks read 2, Cat II, or Critical as Category II, so a workbook from another FMECA scheme still trips them. A value not on the list is still marked for review. The SCI help reads severity category, not criticality code. The Overview bars no longer use status colors. Count bars take one neutral color. Baseline bars take one hue from dark to light, with a swatch for each entry."},{"rev":"[next revision]","date":"2026-10-19","by":"CM","text":"Added ACN Ref and ACN Level in a new Qualification and clearance group, after Formalized PBL Status/Date. ACN is the Approval and Clearance Notice. ACN Level takes Level 0 to Level 7 or Not required from a new ACN Level list. New checks: AC1 and AC2 keep the reference and the level together. AC3 marks a live CI with no ACN answer. AC4 notes Levels 1, 2, and 4, which carry limitations. AC5 marks a formalized product baseline with an ACN below Level 5. PN Variants gains both columns, with VA7 and VA8. The Overview shows an ACN level bar, and a new ACN level metric profiles the index. Imports read 5, L5, or Level 5 as Level 5."},{"rev":"[next revision]","date":"2026-10-19","by":"CM","text":"SCD or VICD (optional), ICD (optional), and SSOW (optional) are now SCD or VICD, ICD, and SSOW. They stay optional: no check requires them, and each help text starts with Optional. The import still reads the old headers. The Excel import now converts an ACN Level entered as a number, such as 2, or as L2, Level 2, or ACN 2, to the full list label, on the CI Index and PN Variants sheets. The import message counts the conversions, and the edit log records each one. In the Excel export, ACN Level keeps its dropdown but no longer warns when a number is typed."},{"rev":"[next revision]","date":"2026-10-19","by":"CM","text":"Document revisions. Spec Rev follows Specification No. SCD and VICD are now separate columns, each with a revision column: SCD Rev and VICD Rev. SVD Ref and SVD Rev name the Software Version Description of a CSCI or Firmware CI. SSOW Rev follows SSOW. ACN Rev follows ACN Ref. Each ICD entry carries its revision in the cell, written ICD-2200-210 Rev A. Effectivity follows Qty per NH. A blank shows the derived value: All units for a single-PIN CI, or See PN Variants where variant rows exist. The Table view and the Excel export show a derived value in gray italics, and the import reads it back as blank. PN Variants gains SVD Ref, SVD Rev, and ACN Rev. New checks: DO2 keeps SCD and VICD apart. RV1 to RV6 mark a document with no revision. RV7 marks a revision with no document. RV8 marks an ICD entry with no revision. SV1 and SV2 tie the SVD to software CIs. EF1 and EF2 keep the CI row and its variants from both claiming effectivity. VA9 to VA11 do the same work on PN Variants. DO1 now checks that See SCD and See VICD point to the matching column. A file with the old merged SCD or VICD column loads: a drawing whose number or Specification No. names a VICD moves to VICD, and the edit log records each move. The PIN help states the firmware rule. The Traced to an SCD or VICD metric reads the two columns."},{"rev":"[next revision]","date":"2026-10-19","by":"CM","text":"The ICD field in the detail panel is now a list. Each ICD gets a document box and a revision box, with Add ICD and Remove. The tool writes the cell as document Rev x, separated by semicolons, so the import and the interface register read it as before. An entry nobody edits keeps its exact text. The Excel export adds an ICD List sheet: one row per ICD, with CI ID, name, status, the ICD, and its revision. A missing revision is shaded for review. The import does not read the sheet. Turn it off under Excel sheets in the builder."},{"rev":"[next revision]","date":"2026-10-27","by":"CM","text":"Added the Block diagram tab. It draws the CI hierarchy from Parent CI ID, live CIs only. Three layouts: top-down stacked, top-down tree, and left to right. The stacked layout puts children with no children of their own in columns, so a parent with dozens of children stays narrow. Users pick a branch, the levels shown, the block width, the block fields, and the box styles. Box styles: shade by control tier, dashed border for Proposed, double border for Not Decomposed, and a diamond where the control tier differs from the parent CI. A Plain chip turns every box style off in one click, and a second press brings them back. The diagram sits in a canvas with scroll bars that always show. A toolbar zooms from 5 to 300 percent with a slider, Fit all, Fit width, and 100%. Ctrl with the wheel, a trackpad pinch, and the keyboard zoom too. Full window fills the browser window. A large index opens at true size, centered on the top-level CI. Blocks collapse and expand. A click opens the CI on the Hierarchy tab. Exports: PDF, PowerPoint, SVG, and PNG. Each exports the current view, or a paged set with an overview page and one page per branch, with page tags on cut-off blocks. Auto picks the levels per page. Every export carries a title block and a legend. PowerPoint uses native shapes with connectors glued to the blocks. A help panel on the tab explains each part. The builder sets the defaults, the exports, the scopes, the page size, and the legend words. Users override them, and the overrides save with the index file."},{"rev":"[next revision]","date":"2026-10-28","by":"CM","text":"Added Download Excel template. The button sits beside Import Excel workbook, on the empty index, and on the Excel columns tab. The template is a blank workbook in the layout the import reads. Its About sheet holds Program, Index document number, Revision, and Index stage, and the import copies them to the Index card. Its CI Index and PN Variants sheets hold the header rows, with dropdowns on coded columns and a note on each column. Headers in the accent color mark the minimum entry for a new CI. An Examples sheet, the Column Map, and the Lists sheet follow. The builder turns the button, the notes, the Examples sheet, and the Column Map on or off. A blank About cell on import now leaves the Index card as it is."}]},"text":{"title":"CI Index","top":"CI Index","sub":"Configuration Management · CI index template · Tool rev D draft","h1":"Configuration Item Index","lede":"One record per Configuration Item. The index flags what applies to each CI and points to the record that owns each answer. It does not copy content from those records. The tool checks every row as you work and shows what needs review.","foot":["**Reference.** The CI identification process. The CI index template.","This tool is a working aid. The index of record is maintained current in the CSA system for the program life.","Nothing is stored in the browser. Save the index to a file before you close the tab. The saved file keeps the edit log. An Excel export does not."],"stem":"CI-Index"},"theme":{"accent":"#A8481F","ink":"#1E262E"},"features":{"tabs":{"overview":true,"metrics":true,"table":true,"variants":true,"checks":true,"bound":true,"log":true,"ref":true,"colmap":true,"diagram":true},"actions":{"dup":true,"split":true,"cons":true,"dedes":true,"del":true},"sheets":{"about":true,"checks":true,"queue":true,"bound":true,"log":true,"colmap":true,"icd":true},"examples":true},"cols":[{"k":"level","h":"Level","kind":"level","w":6,"help":"Derived from Parent CI ID. 0 is the top-level CI.","group":"","wide":false,"core":true,"req":"","reqGFE":false,"alias":[]},{"k":"id","h":"CI ID","kind":"text","w":11,"help":"Program-unique identifier for the CI. It is not the PIN. Renaming a CI ID updates every parent, variant, and supersession reference to it.","group":"Identification","wide":false,"core":true,"req":"","reqGFE":false,"alias":[],"stage":"cand","reg":true,"blankNote":""},{"k":"parent","h":"Parent CI ID","kind":"parent","w":12,"help":"Every CI except the top-level CI names a parent that exists in the index. The tool derives Level and the name indentation from the parent, so the three forms of hierarchy always agree.","group":"Structure","wide":false,"core":true,"req":"","reqGFE":false,"alias":[],"stage":"cand","reg":true,"blankNote":""},{"k":"name","h":"CI Name / Nomenclature","kind":"text","w":36,"help":"Nomenclature for the CI. Enter it without indentation. The export indents it two spaces per level.","group":"Identification","wide":true,"core":true,"req":"","reqGFE":false,"alias":["CI Name","Nomenclature"],"stage":"cand","reg":true,"blankNote":""},{"k":"type","h":"CI Type","kind":"enum","w":9,"help":"HWCI, CSCI, or Firmware. Computer software is designated as CIs (CSCIs).","group":"Identification","wide":false,"core":false,"req":"","reqGFE":false,"list":"type","alias":[],"stage":"cand","reg":true,"blankNote":""},{"k":"tier","h":"Control Tier","kind":"enum","w":24,"help":"Who baselines and controls the CI’s specification. Acquirer-spec controlled: the CI has its own specification, which the Acquirer baselines and controls. Company-spec controlled: the CI sits below an Acquirer-spec controlled CI. The company baselines and controls its specification, where it has one. A change with Class I effect reaches the Acquirer through the parent CI’s baselines. GFE: government furnished and installed in the product structure. The Government holds its definition.","group":"Structure","wide":false,"core":false,"req":"","reqGFE":false,"list":"tier","alias":["Control"],"stage":"struct","reg":true,"blankNote":""},{"k":"oda","h":"Owning Design Activity","kind":"text","w":26,"help":"The design activity that owns the CI’s design.","group":"Identification","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"struct","reg":false,"blankNote":""},{"k":"cage","h":"CAGE","kind":"text","w":8,"help":"CAGE code of the design activity. CAGE and PIN together form the full identification.","group":"Identification","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"ident","reg":false,"blankNote":""},{"k":"pin","h":"PIN","kind":"text","w":16,"help":"Part or identifying number per design activity convention. PIN is not unique across rows. One PIN may map to more than one CI. One CI may carry several PIN variants. Keep the base or representative PIN here. For Firmware, where one altered item drawing controls both the device and its embedded code, record the part number of the device with the code.","group":"Identification","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"ident","reg":true,"blankNote":""},{"k":"nhpin","h":"NH PIN","kind":"text","w":16,"help":"PIN of the next higher assembly the CI installs into. Where the CI trees directly to the end item, enter the end item’s PIN. Enter N/A only where the CI has no higher assembly.","group":"Structure","wide":false,"core":false,"req":"","reqGFE":false,"pins":true,"alias":[],"stage":"ident","reg":false,"blankNote":""},{"k":"qty","h":"Qty per NH","kind":"text","w":8,"help":"Number of instances of this PIN in the next higher assembly, from that assembly’s parts list. Enter N/A where NH PIN is N/A. Above 1, run Decision Path B of the same-CI decision aid.","group":"Structure","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"ident","reg":false,"blankNote":""},{"k":"eff","h":"Effectivity","kind":"text","w":16,"help":"The units this CI’s PIN applies to. Leave it blank where the CI applies to every unit, and the tool shows All units. Where the CI has PN Variants rows, leave it blank too. Each variant row carries its own effectivity, and the tool shows See PN Variants. Type a value only where a single-PIN CI applies to some units, for example AV units 7+ after a block change.","group":"Identification","wide":false,"core":false,"req":"","reqGFE":false,"alias":["CI Effectivity","PIN Effectivity"],"stage":"ident","reg":false,"blankNote":"The tool shows All units, or See PN Variants where the CI has PN Variants rows. The Excel export writes that value in gray italics, and the import reads it back as blank."},{"k":"spec","h":"Specification No.","kind":"text","w":18,"help":"The CI’s specification. Where a source control drawing governs, write See SCD, and record the drawing in SCD. Where a vendor item control drawing governs, write See VICD, and record the drawing in VICD.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"struct","reg":false,"blankNote":""},{"k":"specRev","h":"Spec Rev","kind":"text","w":8,"help":"The current released revision of the specification. Take it from the release record. Update it at each re-release. Where Specification No. reads See SCD or See VICD, leave it blank. The drawing revision goes in SCD Rev or VICD Rev.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":["Specification Rev","Spec Revision","Specification Revision"],"stage":"struct","reg":false,"blankNote":""},{"k":"scd","h":"SCD","kind":"text","w":15,"help":"Optional. The source control drawing that controls a supplier-designed item procured as a unit. The supplier designs the internals. The company controls form, fit, function, interface, and qualification. The SCD identifies the approved sources, and only they may supply the item. Leave it blank where a VICD controls the item. Record one drawing, the SCD or the VICD, not both.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":["SCD (optional)","SCD or VICD (optional)","SCD or VICD"],"stage":"struct","reg":false,"blankNote":""},{"k":"scdRev","h":"SCD Rev","kind":"text","w":8,"help":"The current released revision of the SCD. Take it from the release record. Blank where SCD is blank.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":["SCD Revision"],"stage":"struct","reg":false,"blankNote":""},{"k":"vicd","h":"VICD","kind":"text","w":15,"help":"Optional. The vendor item control drawing that controls a vendor item procured as a unit. It identifies the vendor and the vendor item identification. It controls selection. The company holds no design authority over the item. Leave it blank where an SCD controls the item. Record one drawing, the SCD or the VICD, not both.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":["Vendor Item Control Drawing"],"stage":"struct","reg":false,"blankNote":""},{"k":"vicdRev","h":"VICD Rev","kind":"text","w":8,"help":"The current released revision of the VICD. Take it from the release record. Blank where VICD is blank.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":["VICD Revision"],"stage":"struct","reg":false,"blankNote":""},{"k":"svdRef","h":"SVD Ref","kind":"text","w":16,"help":"The Software Version Description for the current version of a CSCI or Firmware CI. Enter N/A where the contract calls for no SVD. Leave it blank on HWCI rows. Concurrent builds or loads name their own SVD on the PN Variants sheet.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":["SVD","SVD Reference","Software Version Description","Version Description Ref"],"stage":"prod","reg":false,"blankNote":""},{"k":"svdRev","h":"SVD Rev","kind":"text","w":8,"help":"The current released revision of that SVD. Blank where SVD Ref is blank or N/A.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":["SVD Revision"],"stage":"prod","reg":false,"blankNote":""},{"k":"icd","h":"ICD","kind":"text","w":28,"help":"Optional. The interface control documents that define this CI’s interfaces, including interface requirements specifications and interface design descriptions. In the tool, enter each ICD and its revision in the list. In Excel, write each entry as the document number, then Rev and the revision, for example ICD-2200-210 Rev A, and separate entries with semicolons. List every one on this CI’s mapped interface register rows. The ICD cross-check in the interface coverage check confirms that the index and the register agree, revisions included.","group":"Documentation pointers","wide":true,"core":false,"req":"","reqGFE":false,"alias":["ICD (optional)"],"stage":"struct","reg":true,"blankNote":""},{"k":"ssow","h":"SSOW","kind":"text","w":12,"help":"Optional. The supplier statement of work that flows CM requirements to the supplier. The classification log holds the work type and the designation authorship case.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":["SSOW (optional)"],"stage":"struct","reg":false,"blankNote":""},{"k":"ssowRev","h":"SSOW Rev","kind":"text","w":8,"help":"The current revision of the SSOW. Blank where SSOW is blank.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":["SSOW Revision"],"stage":"struct","reg":false,"blankNote":""},{"k":"mbse","h":"MBSE Element ID","kind":"text","w":14,"help":"The model element the CI resolves to, where MBSE is used.","group":"Model alignment","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"struct","reg":true,"blankNote":""},{"k":"ata","h":"ATA / SNS Ref","kind":"text","w":10,"help":"The ATA chapter or S1000D SNS reference.","group":"Model alignment","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"struct","reg":false,"blankNote":""},{"k":"mae","h":"Model Alignment Exception","kind":"long","w":36,"help":"Leave blank where the CI resolves to a model element. Where the CI structure departs from the model, record the reason Systems Engineering accepted.","group":"Model alignment","wide":true,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"struct","reg":true,"blankNote":""},{"k":"critB","h":"Criterion (b) Met (Y/N)","kind":"yn","w":11,"help":"Criterion (b): failure might result in serious injury, loss of life, or loss of primary system capability. Record the answer from the CI selection criteria checklist. A FMECA failure mode of Category I or II meets criterion (b). Before recording N, check the SCI sources, FMECA Severity, and the unit record sources. None of these checks catches every item whose loss is loss of primary system capability with no injury pathway. Find those items in the program’s own decomposition.","group":"Safety","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"sel","reg":true,"blankNote":""},{"k":"sci","h":"SCI (Y/N)","kind":"yn","w":8,"help":"Safety-Critical Item: a hardware or software item that has been determined through analysis to potentially contribute to a hazard with Catastrophic or Critical mishap potential, or that may be implemented to mitigate a hazard with Catastrophic or Critical mishap potential. Before recording N, examine the FMEA or FMECA, the SMS hazard log, and the system safety hazard analysis reports. A FMECA severity category classifies a failure mode, not an item. Trace it to the item that hosts the mode.","group":"Safety","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"sel","reg":true,"blankNote":""},{"k":"sciRef","h":"SCI Source Ref","kind":"text","w":22,"help":"The FMEA, FMECA, SMS hazard log entry, or system safety hazard analysis report that names the item. Blank where SCI = N.","group":"Safety","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"sel","reg":false,"blankNote":""},{"k":"fmeca","h":"FMECA Severity (highest)","kind":"enum","w":16,"help":"The highest severity category among the failure modes the FMECA records against this CI. Category I (catastrophic) or Category II (critical) meets criterion (b). Category III (marginal) or Category IV (minor) does not meet it on its own. Read the severity category, not the criticality number. Where the program’s FMECA uses another severity scheme, enter the category its ground rules map to. Not analyzed means the CI sits outside the FMECA. The FMECA keeps every failure mode. This index keeps the highest category and a pointer.","group":"Safety","wide":false,"core":false,"req":"","reqGFE":false,"list":"fmeca","alias":["FMECA Severity"],"stage":"sel","reg":false,"blankNote":""},{"k":"fmecaRef","h":"FMECA Ref","kind":"text","w":20,"help":"The FMECA and the failure mode entry that carries the highest category. For example: FMECA-2230 FM-03. Blank where FMECA Severity is blank or Not analyzed.","group":"Safety","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"sel","reg":false,"blankNote":""},{"k":"selRef","h":"Selection Assessment Ref","kind":"text","w":14,"help":"The completed CI selection criteria checklist. The rationale lives on that checklist, not in this index.","group":"Selection, concurrence, and status","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"sel","reg":false,"blankNote":""},{"k":"concur","h":"Acquirer Concurrence Ref/Date","kind":"text","w":24,"help":"The latest submittal and concurrence that cover this CI. Update it on resubmittal. GFE rows read N/A.","group":"Selection, concurrence, and status","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"sel","reg":false,"blankNote":""},{"k":"fbl","h":"FBL Status/Date","kind":"text","w":22,"help":"The FBL is a system-level baseline. Record it on the top-level CI only. Enter N/A (system-level baseline) on every other row.","group":"Baselines","wide":false,"core":false,"req":"","reqGFE":false,"sug":["N/A (system-level baseline)","Planned CDR","Planned PCA","Planned first production unit delivery","Internal, planned CDR","Established YYYY-MM-DD","Internal, YYYY-MM-DD"],"alias":[],"stage":"sel","reg":false,"blankNote":""},{"k":"abl","h":"ABL Status/Date","kind":"text","w":20,"help":"Status or establishment date. For example: Established 2026-03-14, Planned CDR, or Internal, 2026-04-10.","group":"Baselines","wide":false,"core":false,"req":"","reqGFE":false,"sug":["N/A (system-level baseline)","Planned CDR","Planned PCA","Planned first production unit delivery","Internal, planned CDR","Established YYYY-MM-DD","Internal, YYYY-MM-DD"],"alias":[],"stage":"struct","reg":false,"blankNote":""},{"k":"ipbl","h":"Initial PBL Status/Date","kind":"text","w":20,"help":"The initial product baseline is established at completion of CDR.","group":"Baselines","wide":false,"core":false,"req":"","reqGFE":false,"sug":["N/A (system-level baseline)","Planned CDR","Planned PCA","Planned first production unit delivery","Internal, planned CDR","Established YYYY-MM-DD","Internal, YYYY-MM-DD"],"alias":[],"stage":"ident","reg":false,"blankNote":""},{"k":"fpbl","h":"Formalized PBL Status/Date","kind":"text","w":22,"help":"Takes its event from the CI’s Audit Designation Assessment Record. For a CI designated for PCA, the event is PCA completion. Otherwise, it is no later than first production unit delivery.","group":"Baselines","wide":false,"core":false,"req":"","reqGFE":false,"sug":["N/A (system-level baseline)","Planned CDR","Planned PCA","Planned first production unit delivery","Internal, planned CDR","Established YYYY-MM-DD","Internal, YYYY-MM-DD"],"alias":[],"stage":"prod","reg":false,"blankNote":""},{"k":"acnRef","h":"ACN Ref","kind":"text","w":18,"help":"The Approval and Clearance Notice document number. ACN Rev holds its revision. Blank where ACN Level reads Not required.","group":"Qualification and clearance","wide":false,"core":false,"req":"","reqGFE":false,"alias":["ACN Ref.","ACN Reference","ACN No.","ACN Number"],"stage":"ident","reg":false,"blankNote":""},{"k":"acnRev","h":"ACN Rev","kind":"text","w":8,"help":"The revision of the current ACN. Blank where ACN Ref is blank.","group":"Qualification and clearance","wide":false,"core":false,"req":"","reqGFE":false,"alias":["ACN Revision"],"stage":"ident","reg":false,"blankNote":""},{"k":"acnLvl","h":"ACN Level","kind":"enum","list":"acn","w":24,"help":"The clearance level on the current ACN. Level 0 means no clearance, for shipping use only. Levels 1 to 7 are the seven clearance levels. Levels 1, 2, and 4 carry limitations, and the ACN Remarks state them. Do not copy the limitations here. Not required means the organization requires no ACN for this CI. An ACN is not a criticality designation. It does not decide whether an item is a CI. In Excel, the level number alone, such as 2, is enough. The import stores the full label.","group":"Qualification and clearance","wide":false,"core":false,"req":"","reqGFE":false,"alias":["ACN Clearance Level"],"stage":"ident","reg":false,"blankNote":""},{"k":"ser","h":"Serialization Recording Required (Y/N)","kind":"yn","w":13,"help":"Whether the product definition data requires serial number recording. Software CIs read N.","group":"Product unit records","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"ident","reg":false,"blankNote":""},{"k":"lot","h":"Lot/Batch Recording Required (Y/N)","kind":"yn","w":13,"help":"Whether the product definition data requires lot or batch recording. Both flags can be Y.","group":"Product unit records","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"ident","reg":false,"blankNote":""},{"k":"src","h":"Product Unit Record Requirement Source","kind":"src","w":40,"help":"Every source that drives serial or lot/batch recording. Sources stack. Name the designation, not only the mechanism. A critical safety item gets its serial number through IUID, so pick Critical safety item, and add IUID only where IUID also applies on its own. Leave blank where no unit record is required.","group":"Product unit records","wide":true,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"ident","reg":false,"blankNote":""},{"k":"life","h":"Life Clock","kind":"enum","w":13,"help":"The category of life limit only. The limit value stays in the product definition data. The recording flags come from the sources, not from the clock.","group":"Product unit records","wide":false,"core":false,"req":"","reqGFE":false,"list":"life","alias":[],"stage":"ident","reg":false,"blankNote":""},{"k":"sh","h":"Special Handling (Y/N)","kind":"yn","w":10,"help":"Y where the product definition data imposes controlled handling, packaging, or storage to keep the item conforming. Special handling is not a criticality designation and not a serialization driver.","group":"Product unit records","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"ident","reg":false,"blankNote":""},{"k":"iuid","h":"IUID Required (Y/N)","kind":"yn","w":10,"help":"Y where item unique identification applies to the CI. The identifier registers carry the unique item identifiers, not this index.","group":"Product unit records","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"ident","reg":false,"blankNote":""},{"k":"notdec","h":"Not Decomposed (supplier-designed unit)","kind":"yn","w":13,"help":"Y where the CI is a supplier-designed item procured as a unit, such as a vendor item or a supplier-designed assembly. The company does not decompose it into further CIs.","group":"Structure","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"sel","reg":false,"blankNote":""},{"k":"status","h":"Status","kind":"enum","w":14,"help":"A CI reads Proposed until the Acquirer concurs. Rows are not deleted once concurred. De-designate the CI, or supersede it by a split or a consolidation.","group":"Selection, concurrence, and status","wide":false,"core":true,"req":"","reqGFE":false,"list":"status","alias":[],"stage":"cand","reg":true,"blankNote":""},{"k":"sup","h":"Supersedes / Superseded By","kind":"text","w":18,"help":"For a split or a consolidation. The old row names the new CI IDs. Each new row names the old CI ID. Separate IDs with semicolons.","group":"Selection, concurrence, and status","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"","reg":false,"blankNote":""},{"k":"notes","h":"Notes","kind":"long","w":48,"help":"Short notes. Point to the owning record rather than copying its content.","group":"Notes","wide":true,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"","reg":false,"blankNote":""}],"groups":["Identification","Structure","Safety","Product unit records","Selection, concurrence, and status","Baselines","Qualification and clearance","Documentation pointers","Model alignment","Notes"],"vcols":[{"k":"ciId","h":"CI ID","kind":"text","w":11,"core":true,"help":""},{"k":"pin","h":"Variant PIN / Version Identifier","kind":"text","w":20,"core":true,"help":""},{"k":"svdRef","h":"SVD Ref","kind":"text","w":16,"core":false,"help":"The SVD for this version or load. Fill it where the CI is a CSCI or Firmware. Leave it blank on hardware variants."},{"k":"svdRev","h":"SVD Rev","kind":"text","w":8,"core":false,"help":"The revision of that SVD."},{"k":"desc","h":"Variant Description","kind":"long","w":34,"core":false,"help":""},{"k":"callout","h":"Interface Callout (spec/ICD ref)","kind":"text","w":28,"core":false,"help":""},{"k":"ser","h":"Serialization Recording Required (Y/N)","kind":"yn","w":13,"core":true,"help":""},{"k":"lot","h":"Lot/Batch Recording Required (Y/N)","kind":"yn","w":13,"core":true,"help":""},{"k":"eff","h":"Effectivity","kind":"text","w":16,"core":false,"help":"The units, lots, or end items this variant applies to."},{"k":"acnRef","h":"ACN Ref","kind":"text","w":16,"core":false,"help":"Only where this variant carries its own ACN. Blank means the variant shares the CI’s ACN. ACN Rev holds its revision."},{"k":"acnRev","h":"ACN Rev","kind":"text","w":8,"core":false,"help":"The revision of this variant’s own ACN. Blank where the variant shares the CI’s ACN."},{"k":"acnLvl","h":"ACN Level","kind":"enum","list":"acn","w":24,"core":false,"help":"The level on this variant’s own ACN. Blank means the variant shares the CI’s ACN. In Excel, the level number alone, such as 2, is enough."},{"k":"notes","h":"Notes","kind":"long","w":44,"core":false,"help":""}],"lists":{"type":{"name":"CI Type","core":true,"items":[{"v":"HWCI","ab":"HW"},{"v":"CSCI","ab":"CSCI","sw":true},{"v":"Firmware","ab":"FW"}]},"tier":{"name":"Control Tier","core":true,"items":[{"v":"Acquirer-spec controlled","ab":"ACQ","m":"acq"},{"v":"Company-spec controlled","ab":"CO","m":"co"},{"v":"GFE","ab":"GFE","m":"gfe"}]},"status":{"name":"Status","core":true,"items":[{"v":"Active","m":"active"},{"v":"Proposed","m":"proposed"},{"v":"De-designated","m":"dedes","ret":true},{"v":"Superseded (split)","m":"split","ret":true},{"v":"Superseded (consolidated)","m":"cons","ret":true}]},"life":{"name":"Life Clock","core":true,"items":[{"v":"Cycle/usage","m":"cycle"},{"v":"Age/shelf-life","m":"age"},{"v":"Both","m":"both"},{"v":"None","m":"none"}]},"fmeca":{"name":"FMECA Severity","core":true,"items":[{"v":"I (Catastrophic)","ab":"I","m":"cat1"},{"v":"II (Critical)","ab":"II","m":"cat2"},{"v":"III (Marginal)","ab":"III","m":"cat3"},{"v":"IV (Minor)","ab":"IV","m":"cat4"},{"v":"Not analyzed","ab":"NA","m":"na"}]},"acn":{"name":"ACN Level","core":true,"items":[{"v":"Level 0 (None)","ab":"L0","m":"lvl0"},{"v":"Level 1 (Limited Lab Clearance)","ab":"L1","m":"lvl1"},{"v":"Level 2 (Limited Operation, Non-Flight)","ab":"L2","m":"lvl2"},{"v":"Level 3 (Operation, Non-Flight)","ab":"L3","m":"lvl3"},{"v":"Level 4 (Limited Flight Clearance)","ab":"L4","m":"lvl4"},{"v":"Level 5 (Flight Clearance)","ab":"L5","m":"lvl5"},{"v":"Level 6 (Interim Approval)","ab":"L6","m":"lvl6"},{"v":"Level 7 (Final Approval)","ab":"L7","m":"lvl7"},{"v":"Not required","ab":"NR","m":"notreq"}]}},"sources":[{"name":"Cycle/usage-controlled life limit","d":"Serial","c1":false,"role":"cycle"},{"name":"ALI on a discrete part","d":"Serial","c1":false,"role":"cycle"},{"name":"Safe-life PSE","d":"Serial","c1":false,"role":"cycle"},{"name":"IUID","d":"Serial","c1":false,"role":"iuid"},{"name":"Physical parent of a serialized or lot-recorded item","d":"Serial","c1":false,"role":""},{"name":"Premium selection material","d":"Both","c1":false,"role":""},{"name":"Critical safety item","d":"Both","c1":true,"role":"csi"},{"name":"Fracture-critical traceable part","d":"Both","c1":true,"role":""},{"name":"Fracture-critical part","d":"Lot/batch","c1":true,"role":""},{"name":"Age/shelf-life-controlled life limit","d":"Lot/batch","c1":false,"role":"age"},{"name":"ALI expressed against a lot","d":"Lot/batch","c1":false,"role":""},{"name":"Special handling","d":"Lot/batch","c1":false,"role":"sh"},{"name":"Process and batch conditions","d":"Lot/batch","c1":false,"role":""},{"name":"Castings or alternative material design values","d":"Lot/batch","c1":false,"role":""},{"name":"Counterfeit avoidance","d":"Lot/batch","c1":false,"role":""},{"name":"Commercial grade dedication","d":"Lot/batch","c1":false,"role":""},{"name":"Other (state)","d":"Either","c1":false,"role":"other"}],"rules":{"ST1":{"on":true,"sev":"flag","area":"Structure","what":"Every row carries a CI ID.","basis":"Column notes, CI ID","needs":["id"]},"ST2":{"on":true,"sev":"flag","area":"Structure","what":"Each CI ID is unique.","basis":"Column notes, CI ID","needs":["id"]},"ST3":{"on":true,"sev":"flag","area":"Structure","what":"The Parent CI ID exists in the CI ID column.","basis":"How to use, hierarchy","needs":["parent"]},"ST4":{"on":true,"sev":"flag","area":"Structure","what":"The parent chain does not loop back on itself.","basis":"How to use, hierarchy","needs":["parent"]},"ST5":{"on":true,"sev":"flag","area":"Structure","what":"Only one live CI has no parent. That CI is the top-level CI.","basis":"How to use, hierarchy","needs":["parent"]},"ST6":{"on":true,"sev":"review","area":"Structure","what":"A live CI does not sit under a retired parent.","basis":"Process, splits and consolidations","needs":["parent","status"]},"ST7":{"on":true,"sev":"flag","area":"Structure","what":"Control Tier is recorded.","basis":"Process, CI structure and hierarchy","needs":["tier"]},"ST8":{"on":true,"sev":"flag","area":"Structure","what":"A Company-spec controlled CI sits below an Acquirer-spec controlled CI.","basis":"Definitions, Company-spec controlled CI","needs":["tier"]},"ST9":{"on":true,"sev":"flag","area":"Structure","what":"A supplier-designed unit marked Not Decomposed has no child CIs.","basis":"Process, supplier-designed items are not decomposed","needs":["notdec"]},"CO1":{"on":true,"sev":"flag","area":"Concurrence","what":"Status is recorded.","basis":"How to use, Status","needs":["status"]},"CO2":{"on":true,"sev":"flag","area":"Concurrence","what":"A CI reads Active only after the Acquirer concurs.","basis":"How to use; Process, Acquirer review and concurrence","needs":["status","concur"]},"CO3":{"on":true,"sev":"review","area":"Concurrence","what":"A recorded concurrence moves Status from Proposed to Active.","basis":"How to use, Status","needs":["status","concur"]},"CO4":{"on":true,"sev":"review","area":"Concurrence","what":"GFE rows read N/A for Acquirer concurrence.","basis":"How to use, Status","needs":["tier","concur"]},"CO5":{"on":true,"sev":"review","area":"Concurrence","what":"A live CI points to its CI selection criteria checklist.","basis":"Column notes, Selection Assessment Ref","needs":["selRef"]},"SA1":{"on":true,"sev":"flag","area":"Safety","what":"Criterion (b) is answered on every live CI except GFE.","basis":"How to use, Criterion (b) Met","needs":["critB"]},"SA2":{"on":true,"sev":"flag","area":"Safety","what":"SCI = Y requires Criterion (b) Met = Y.","basis":"Highlight checks, safety","needs":["sci","critB"]},"SA3":{"on":true,"sev":"flag","area":"Safety","what":"An external criticality designation (C-1) requires Criterion (b) Met = Y.","basis":"Highlight checks, safety; external criticality designations","needs":["src","critB"]},"SA4":{"on":true,"sev":"flag","area":"Safety","what":"A critical safety item with SCI = N goes to System Safety review.","basis":"Highlight checks, safety","needs":["src","sci"]},"SA5":{"on":true,"sev":"flag","area":"Safety","what":"SCI = Y names the record that names the item.","basis":"Column notes, SCI Source Ref","needs":["sci","sciRef"]},"SA6":{"on":true,"sev":"review","area":"Safety","what":"SCI Source Ref is blank where SCI = N.","basis":"Column notes, SCI Source Ref","needs":["sci","sciRef"]},"SA7":{"on":true,"sev":"review","area":"Safety","what":"SCI is answered on every live CI except GFE.","basis":"How to use, SCI","needs":["sci"]},"SA8":{"on":true,"sev":"flag","area":"Safety","what":"FMECA Severity I or II requires Criterion (b) Met = Y.","basis":"Highlight checks, safety; FMECA severity","needs":["fmeca","critB"]},"SA9":{"on":true,"sev":"flag","area":"Safety","what":"A recorded FMECA category names the FMECA entry.","basis":"Column notes, FMECA Ref","needs":["fmeca","fmecaRef"]},"SA10":{"on":true,"sev":"review","area":"Safety","what":"FMECA Ref is blank where FMECA Severity is blank or Not analyzed.","basis":"Column notes, FMECA Ref","needs":["fmeca","fmecaRef"]},"SA11":{"on":true,"sev":"review","area":"Safety","what":"FMECA Severity is answered on every live CI except GFE.","basis":"How to use, FMECA Severity","needs":["fmeca"]},"RE1":{"on":true,"sev":"flag","area":"Unit records","what":"Serialization = Y needs a source that drives serial recording.","basis":"Highlight checks, recording","needs":["ser","src"]},"RE2":{"on":true,"sev":"flag","area":"Unit records","what":"A source that drives serial recording needs Serialization = Y.","basis":"Highlight checks, recording","needs":["ser","src"]},"RE3":{"on":true,"sev":"flag","area":"Unit records","what":"Lot/Batch = Y needs a source that drives lot recording.","basis":"Highlight checks, recording","needs":["lot","src"]},"RE4":{"on":true,"sev":"flag","area":"Unit records","what":"A source that drives lot recording needs Lot/Batch = Y.","basis":"Highlight checks, recording","needs":["lot","src"]},"RE5":{"on":true,"sev":"flag","area":"Unit records","what":"Special Handling = Y needs the Special handling source.","basis":"Highlight checks, recording","needs":["sh","src"]},"RE6":{"on":true,"sev":"flag","area":"Unit records","what":"The Special handling source needs Special Handling = Y.","basis":"Highlight checks, recording","needs":["sh","src"]},"RE7":{"on":true,"sev":"flag","area":"Unit records","what":"IUID Required = Y needs IUID or Critical safety item as a source.","basis":"Highlight checks, recording","needs":["iuid","src"]},"RE8":{"on":true,"sev":"flag","area":"Unit records","what":"IUID or Critical safety item as a source needs IUID Required = Y.","basis":"Highlight checks, recording; Process, IUID","needs":["iuid","src"]},"RE9":{"on":true,"sev":"review","area":"Unit records","what":"Each source uses a spelling from the source list.","basis":"Lists sheet","needs":["src"]},"RE10":{"on":true,"sev":"flag","area":"Unit records","what":"Software CIs read N and N for the two recording flags.","basis":"Column notes, recording flags","needs":["type"]},"RE11":{"on":true,"sev":"note","area":"Unit records","what":"The life clock and the named sources tell the same story.","basis":"Process, two clocks, one phrase","needs":["life","src"]},"RE12":{"on":true,"sev":"review","area":"Unit records","what":"The recording flags and the life clock are answered.","basis":"How to use, recording flags","needs":[]},"BA1":{"on":true,"sev":"flag","area":"Baselines","what":"The top-level CI records the FBL.","basis":"How to use, baseline columns","needs":["fbl"]},"BA2":{"on":true,"sev":"flag","area":"Baselines","what":"Every other row reads N/A (system-level baseline) for the FBL.","basis":"How to use, baseline columns","needs":["fbl"]},"AC1":{"on":true,"sev":"flag","area":"Clearance","what":"ACN Level 0 to 7 requires ACN Ref.","basis":"Column notes, ACN Ref","needs":["acnLvl","acnRef"]},"AC2":{"on":true,"sev":"flag","area":"Clearance","what":"ACN Ref requires an ACN Level of 0 to 7.","basis":"Column notes, ACN Ref","needs":["acnLvl","acnRef"]},"AC3":{"on":true,"sev":"review","area":"Clearance","what":"ACN Level is answered on every live CI except GFE. Not required counts as an answer.","basis":"How to use, ACN","needs":["acnLvl"]},"AC4":{"on":true,"sev":"note","area":"Clearance","what":"Levels 1, 2, and 4 carry limitations. The ACN Remarks state them.","basis":"Column notes, ACN Level","needs":["acnLvl"]},"AC5":{"on":true,"sev":"review","area":"Clearance","what":"A formalized product baseline with an ACN below Level 5.","basis":"How to use, ACN","needs":["acnLvl","fpbl"]},"QT1":{"on":true,"sev":"review","area":"Quantity","what":"Qty per NH reads N/A where NH PIN is N/A.","basis":"Column notes, Qty per NH","needs":["nhpin","qty"]},"QT2":{"on":true,"sev":"review","area":"Quantity","what":"Qty per NH is recorded where NH PIN is recorded.","basis":"Column notes, Qty per NH","needs":["nhpin","qty"]},"QT3":{"on":true,"sev":"flag","area":"Quantity","what":"Qty per NH is a whole number CD, not both.","basis":"Column notes, SCD and VICD","needs":["scd","vicd"]},"RV1":{"on":true,"sev":"review","area":"Revisions","what":"A filled Specification No. needs Spec Rev.","basis":"Column notes, Spec Rev","needs":["spec","specRev"]},"RV2":{"on":true,"sev":"review","area":"Revisions","what":"A filled SCD needs SCD Rev.","basis":"Column notes, SCD Rev","needs":["scd","scdRev"]},"RV3":{"on":true,"sev":"review","area":"Revisions","what":"A filled VICD needs VICD Rev.","basis":"Column notes, VICD Rev","needs":["vicd","vicdRev"]},"RV4":{"on":true,"sev":"review","area":"Revisions","what":"A filled SVD Ref needs SVD Rev.","basis":"Column notes, SVD Rev","needs":["svdRef","svdRev"]},"RV5":{"on":true,"sev":"review","area":"Revisions","what":"A filled SSOW needs SSOW Rev.","basis":"Column notes, SSOW Rev","needs":["ssow","ssowRev"]},"RV6":{"on":true,"sev":"review","area":"Revisions","what":"A filled ACN Ref needs ACN Rev.","basis":"Column notes, ACN Rev","needs":["acnRef","acnRev"]},"RV7":{"on":true,"sev":"review","area":"Revisions","what":"A revision needs the document it belongs to. Spec Rev stays blank where Specification No. reads See SCD or See VICD.","basis":"Column notes, revision columns","needs":[]},"RV8":{"on":true,"sev":"review","area":"Revisions","what":"Each ICD entry carries its revision, written document Rev x.","basis":"Column notes, ICD","needs":["icd"]},"SV1":{"on":true,"sev":"review","area":"Software","what":"A CSCI or Firmware CI names its SVD, or N/A.","basis":"Column notes, SVD Ref","needs":["type","svdRef"]},"SV2":{"on":true,"sev":"note","area":"Software","what":"A HWCI carries no SVD Ref.","basis":"Column notes, SVD Ref","needs":["type","svdRef"]},"EF1":{"on":true,"sev":"review","area":"Effectivity","what":"A CI with PN Variants rows leaves Effectivity blank. Each variant carries its own.","basis":"Column notes, Effectivity","needs":["eff"]},"EF2":{"on":true,"sev":"review","area":"Effectivity","what":"See PN Variants needs PN Variants rows.","basis":"Column notes, Effectivity","needs":["eff"]},"VA1":{"on":true,"sev":"flag","area":"PN Variants","what":"Each variant row names a CI ID that exists.","basis":"How to use, PN Variants","needs":[]},"VA2":{"on":true,"sev":"review","area":"PN Variants","what":"A variant flag that differs from its CI says why in Notes.","basis":"How to use, PN Variants","needs":["ser","lot"]},"VA3":{"on":true,"sev":"flag","area":"PN Variants","what":"Software variants read N and N for the two recording flags.","basis":"Column notes, recording flags","needs":["type"]},"VA4":{"on":true,"sev":"flag","area":"PN Variants","what":"Each variant row carries a PIN or version identifier.","basis":"How to use, PN Variants","needs":[]},"VA5":{"on":true,"sev":"note","area":"PN Variants","what":"The CI row keeps the base or representative PIN.","basis":"How to use, PIN","needs":["pin"]},"VA6":{"on":true,"sev":"review","area":"PN Variants","what":"A CI with only one variant row is not a variant family.","basis":"Same-CI decision aid, verdicts","needs":[]},"VA7":{"on":true,"sev":"flag","area":"PN Variants","what":"A variant ACN Level 0 to 7 requires its ACN Ref.","basis":"How to use, PN Variants","needs":["acnLvl","acnRef"]},"VA8":{"on":true,"sev":"flag","area":"PN Variants","what":"A variant ACN Ref requires its ACN Level.","basis":"How to use, PN Variants","needs":["acnLvl","acnRef"]},"VA9":{"on":true,"sev":"review","area":"PN Variants","what":"A variant of a CSCI or Firmware CI names its SVD.","basis":"How to use, PN Variants","needs":[]},"VA10":{"on":true,"sev":"review","area":"PN Variants","what":"A variant SVD Ref or ACN Ref needs its revision.","basis":"How to use, PN Variants","needs":[]},"VA11":{"on":true,"sev":"review","area":"PN Variants","what":"A variant revision needs the document it belongs to.","basis":"How to use, PN Variants","needs":[]},"LS1":{"on":true,"sev":"review","area":"Lists","what":"A dropdown column holds a value from its list.","basis":"Lists sheet","needs":[]},"TY1":{"on":true,"sev":"review","area":"Format","what":"A number or date column holds a number or a date.","basis":"Build settings","needs":[]}},"custom":[],"reference":[{"title":"What this index is","kind":"list","items":["The index holds CIs, and only CIs. Customer equipment outside the product structure goes on the interface register only. CIs that exist only between a sub-supplier and the company stay out. End-item traceability is not an index topic.","The index is the hub for CI status. It flags what applies to each CI and points to the record that owns each answer. It does not copy content from those records.","Each column holds a fixed property of the CI. Timing lives in the baseline columns."]},{"title":"Definitions","kind":"list","items":["**Configuration Item (CI).** Any hardware, software, firmware, or aggregation thereof that satisfies a system end-use function and is designated for separate configuration management. Designation includes establishing the CI’s requirements and verifying that its configuration meets those requirements and that its configuration documentation accurately describes its configuration.","**Part or Identifying Number (PIN).** The identifier that, combined with the design activity CAGE code, uniquely identifies an item and its configuration. The PIN changes when a modification creates a non-interchangeable condition.","**Safety-Critical Item (SCI).** A hardware or software item that has been determined through analysis to potentially contribute to a hazard with Catastrophic or Critical mishap potential, or that may be implemented to mitigate a hazard with Catastrophic or Critical mishap potential.","**Severity Category.** A classification of a failure mode by its severity, the worst potential consequence of a failure, determined by the degree of injury, property damage, or system damage that could ultimately occur. Category I, Catastrophic: a failure which may cause death or weapon system loss (i.e., aircraft, tank, missile, ship, etc.). Category II, Critical: a failure which may cause severe injury, major property damage, or major system damage which will result in mission loss. Category III, Marginal: a failure which may cause minor injury, minor property damage, or minor system damage which will result in delay or loss of availability or mission degradation. Category IV, Minor: a failure not serious enough to cause injury, property damage, or system damage, but which will result in unscheduled maintenance or repair.","**Control Tier.** The record of who baselines and controls a CI’s specification. The three tiers are Acquirer-spec controlled, Company-spec controlled, and GFE.","**Product Definition Data (PDD).** The design data that defines an item’s physical and functional attributes: drawings, models, and associated lists such as parts lists.","**Source Control Drawing (SCD).** A drawing that provides an engineering description, qualification requirements, and acceptance criteria for a vendor-developed or commercial item procurable from a specialized segment of industry that provides the performance, installation, and interchangeability characteristics required for a critical application, and that identifies the approved sources. The company controls form, fit, function, interface, and qualification. The vendor holds the detailed design.","**Vendor Item Control Drawing (VICD).** A drawing that provides an engineering description and acceptance criteria sufficient to identify and select a vendor-developed or commercial item, and that identifies the vendor and the vendor item identification. It controls selection. It does not control the item, and the company holds no design authority over it.","**Software Version Description (SVD).** A document that identifies and describes a software version consisting of one or more CSCIs. It is used to release, track, and control software versions.","**Effectivity.** The units, lots, serial numbers, or end items to which a configuration applies.","**Approval and Clearance Notice (ACN).** A document that records the development or qualification status of an item and its use in its specified environments or applications. It records the limitations associated with a HWCI or CSCI as it moves through the component and platform qualification testing process. Seven clearance levels, Level 1 to Level 7, sit above Level 0, which provides no clearance. An ACN may or may not be required for each HWCI or CSCI, based on organization requirements."]},{"title":"","kind":"pull","items":["The safety-critical item is not the critical safety item. Different authority, different object, different obligation."]},{"title":"How the tool works","kind":"list","items":["**Hierarchy is entered once.** Pick the parent. The tool derives Level and the indented name. The three forms of hierarchy in the workbook can no longer disagree.","**Checks run as you type.** They mark a cell for review. They never block entry. The Checks tab lists every finding and the rule behind it.","**Sources drive the flags.** Pick each source that drives the unit record. The tool shows what the sources call for, and sets the four flags on request.","**Rows are retired, not deleted.** A CI the Acquirer has concurred in cannot be deleted. De-designate it, or split or consolidate it. The tool keeps the old row and writes the trace on both sides.","**Same PIN, another position.** Decision Path B can return separate CIs against one PIN. This action copies the row under a new CI ID. Key CSA on the CI and the installed position together.","**The index fills in stages.** A row needs one filled cell to import, and a CI needs only its ID, parent, name, type, and status to start. Set Index stage on the Index card. The tool then holds the blank-entry hints for columns that fall due at a later stage. The Excel columns tab shows what the import accepts and when each column falls due.","**Every pointer carries its revision.** Specification No., SCD, VICD, SVD Ref, SSOW, and ACN Ref each have a revision column beside them. An ICD entry carries its revision in the cell, written ICD-2200-210 Rev A. The release record is the source for each revision. In the detail panel, the ICD field is a list of document and revision boxes, and the tool writes the cell. The Excel export adds an ICD List sheet with one row per ICD, for reading and delivery.","**Effectivity is derived until you type it.** A single-PIN CI shows All units. A CI with PN Variants rows shows See PN Variants, and each variant row carries its own effectivity. Type a value only where a single-PIN CI applies to some units. The Table view and the Excel export show a derived value in gray italics.","**Save keeps everything.** The saved file holds the index, the variants, and the edit log. The Excel export is the exchange copy. Import reads a CI index template workbook or a prior export. It reads the CI Index and PN Variants sheets.","**Start from the Excel template.** Download Excel template gives a blank workbook in the layout the import reads. Coded columns carry dropdowns. Each column carries a note that shows when a cell is selected. The About sheet holds the Index card fields. Fill it in, save it, and import it.","**The structural floor.** The Structural floor tab lists each parent and child in different control tiers, and each GFE CI. Each needs at least one Mapped row on the interface register. The tool does not pair sibling CIs. Interfaces reach the register from Systems Engineering’s interface sources.","**Metrics show coverage and profile.** The Metrics tab reads the index as it stands. Coverage ratios should climb toward 100 percent. Each shows Recorded, where the cells are filled, and Verified, where the related checks pass too. Profile shares describe the index and have no target. Filter by control tier or by branch. Export metrics to PowerPoint writes one slide per metric, with each chart as a picture.","**The block diagram draws the CI hierarchy.** Each live CI is a block, joined to its parent by Parent CI ID. Pick a branch, the levels shown, a layout, the block fields, and the box styles. Export the current view, or a paged set with an overview page and one page per branch. Every export carries a title block. The PowerPoint export uses native shapes, with connectors glued to the blocks."]},{"title":"Rules carried from the template","kind":"list","items":["Every CI goes to the Acquirer for concurrence, including Company-spec controlled CIs. A CI reads Proposed until the Acquirer concurs. Enter the concurrence, then set Status to Active. GFE rows read N/A.","Criterion (b) Met is the umbrella safety column. Criterion (b) is mandatory for safety. Any external criticality designation (C-1) satisfies criterion (b) on its own. So does a FMECA failure mode of Category I or II, once traced to the item that hosts it. None of these sources catches every item whose loss is loss of primary system capability with no injury pathway. Find those items in the program’s own decomposition.","FMECA Severity records the highest severity category among the failure modes the FMECA records against the CI. FMECA Ref points to the entry. The FMECA keeps every failure mode. Read the severity category, not the criticality number. Not analyzed means the CI sits outside the FMECA.","Influencing parts fail criterion (b) by their own definition but qualify on criterion (a). See the criticality designations appendix.","The FBL is a system-level baseline. Record it on the top-level CI only. The initial product baseline is established at completion of CDR. The formalized PBL takes its event from the Audit Designation Assessment Record. This index does not record audit designation.","Do not copy handling instructions, IUID triggers, unique item identifiers, life limit values, date codes, or heat-lot details into this index.","Where MBSE is used, CI parent-child relationships mirror the model decomposition. A same-CI verdict that mismatches the model is not entered until Systems Engineering dispositions it.","ACN Ref, ACN Rev, and ACN Level point to the CI’s current ACN. Record the number, its revision, and the level, or Not required. Levels 1, 2, and 4 carry limitations, and the ACN Remarks state them. Do not copy them into this index. A formalized product baseline with an ACN below Level 5 is a review item. A variant with its own ACN records it on the PN Variants sheet. In Excel, the level number alone, such as 2, is enough. The import reads 2, L2, Level 2, or ACN 2 and stores Level 2 (Limited Operation, Non-Flight). The edit log records each conversion.","Record the current released revision of each document the index names. A document number without its revision does not say which version is current. Update the revision at each re-release. Spec Rev stays blank where Specification No. reads See SCD or See VICD.","An SCD and a VICD follow different source rules. An SCD identifies the approved sources, and only they may supply the item. A VICD identifies the vendor and its item, and it controls selection only. Record the drawing in its own column, and record one of the two, not both.","CSCI and Firmware rows name their SVD and its revision, or N/A where the contract calls for none. For Firmware controlled with its device on one altered item drawing, the PIN is the part number of the device with the code."]}],"examples":{"cis":[{"id":"CI-0001","parent":"","name":"Air Vehicle System","type":"HWCI","tier":"Acquirer-spec controlled","oda":"XYZ Aerostructures","cage":"1ABC2","pin":"AV-1000-001","nhpin":"N/A","qty":"N/A","eff":"","spec":"SS-1000","specRev":"D","scd":"","scdRev":"","vicd":"","vicdRev":"","svdRef":"","svdRev":"","icd":"ICD-1000-501 Rev C","ssow":"","ssowRev":"","mbse":"blk.AV","ata":"00","mae":"","critB":"Y","sci":"Y","sciRef":"SMS hazard log HL-001","fmeca":"I (Catastrophic)","fmecaRef":"FMECA-1000","selRef":"CISEL-0001","concur":"CIL-SUB-001 / 2025-08-29","fbl":"Established 2025-09-12","abl":"Established 2026-01-20","ipbl":"Pla n":"DB-3211-003","nhpin":"MLG-3210-001","qty":"1","spec":"None; defined by drawing DB-3211","scd":"","icd":"","ssow":"","mbse":"","ata":"32-10","mae":"Not modeled. Selected on criterion (b) as a safe-life principal structural element below the model's level of detail.","critB":"Y","sci":"N","sciRef":"","fmeca":"I (Catastrophic)","fmecaRef":"FMECA-3210","selRef":"CISEL-0061","concur":"","fbl":"N/A (system-level baseline)","abl":"Within CI-0060 ABL","ipbl":"Internal, planned CDR","fpbl":"Planned PCA","acnRef":"ACN-3211-001","acnLvl":"Level 1 (Limited Lab Clearance)","ser":"Y","lot":"N","src":"Safe-life PSE; Cycle/usage-controlled life limit","life":"Cycle/usage","sh":"N","iuid":"N","notdec":"N","status":"Proposed","sup":"","notes":"Safe-life PSE with an ALS replacement time. A critical item, not named individually on the SCI list: the hazard analysis names the structural integrity program as the control. Proposed until the Acquirer concurs. The FMECA rates fracture Category I, which meets criterion (b) on its own."}],"vars":[{"ciId":"CI-0021","pin":"ACT-2230-002","desc":"Elevator actuator, baseline build","callout":"SCD-2230-001 §3.3.1","ser":"Y","lot":"Y","eff":"AV units 1–12","acnRef":"","acnLvl":"","notes":"Base variant"},{"ciId":"CI-0021","pin":"ACT-2230-004","desc":"Elevator actuator, revised connector","callout":"SCD-2230-001 §3.3.2 (per-variant callout)","ser":"Y","lot":"Y","eff":"AV units 13+","acnRef":"ACN-2230-005","acnLvl":"Level 3 (Operation, Non-Flight)","notes":"Non-interchangeable connector; one CI; no separation trigger fired. Own ACN: cleared for ground test, flight clearance pending."}]})) cfg.examples=clone(d.examples);
    if(JSON.stringify(cfg.reference)===JSON.stringify([{"title":"What this index is","kind":"list","items":["The index holds CIs, and only CIs. Customer equipment outside the product structure goes on the interface register only. CIs that exist only between a sub-supplier and the company stay out. End-item traceability is not an index topic.","The index is the hub for CI status. It flags what applies to each CI and points to the record that owns each answer. It does not copy content from those records.","Each column holds a fixed property of the CI. Timing lives in the baseline columns."]},{"title":"Definitions","kind":"list","items":["**Configuration Item (CI).** Any hardware, software, firmware, or aggregation thereof that satisfies a system end-use function and is designated for separate configuration management. Designation includes establishing the CI’s requirements and verifying that its configuration meets those requirements and that its configuration documentation accurately describes its configuration.","**Part or Identifying Number (PIN).** The identifier that, combined with the design activity CAGE code, uniquely identifies an item and its configuration. The PIN changes when a modification creates a non-interchangeable condition.","**Safety-Critical Item (SCI).** A hardware or software item that has been determined through analysis to potentially contribute to a hazard with Catastrophic or Critical mishap potential, or that may be implemented to mitigate a hazard with Catastrophic or Critical mishap potential.","**Severity Category.** A classification of a failure mode by its severity, the worst potential consequence of a failure, determined by the degree of injury, property damage, or system damage that could ultimately occur. Category I, Catastrophic: a failure which may cause death or weapon system loss (i.e., aircraft, tank, missile, ship, etc.). Category II, Critical: a failure which may cause severe injury, major property damage, or major system damage which will result in mission loss. Category III, Marginal: a failure which may cause minor injury, minor property damage, or minor system damage which will result in delay or loss of availability or mission degradation. Category IV, Minor: a failure not serious enough to cause injury, property damage, or system damage, but which will result in unscheduled maintenance or repair.","**Control Tier.** The record of who baselines and controls a CI’s specification. The three tiers are Acquirer-spec controlled, Company-spec controlled, and GFE.","**Product Definition Data (PDD).** The design data that defines an item’s physical and functional attributes: drawings, models, and associated lists such as parts lists.","**Approval and Clearance Notice (ACN).** A document that records the development or qualification status of an item and its use in its specified environments or applications. It records the limitations associated with a HWCI or CSCI as it moves through the component and platform qualification testing process. Seven clearance levels, Level 1 to Level 7, sit above Level 0, which provides no clearance. An ACN may or may not be required for each HWCI or CSCI, based on organization requirements."]},{"title":"","kind":"pull","items":["The safety-critical item is not the critical safety item. Different authority, different object, different obligation."]},{"title":"How the tool works","kind":"list","items":["**Hierarchy is entered once.** Pick the parent. The tool derives Level and the indented name. The three forms of hierarchy in the workbook can no longer disagree.","**Checks run as you type.** They mark a cell for review. They never block entry. The Checks tab lists every finding and the rule behind it.","**Sources drive the flags.** Pick each source that drives the unit record. The tool shows what the sources call for, and sets the four flags on request.","**Rows are retired, not deleted.** A CI the Acquirer has concurred in cannot be deleted. De-designate it, or split or consolidate it. The tool keeps the old row and writes the trace on both sides.","**Same PIN, another position.** Decision Path B can return separate CIs against one PIN. This action copies the row under a new CI ID. Key CSA on the CI and the installed position together.","**The index fills in stages.** A row needs one filled cell to import, and a CI needs only its ID, parent, name, type, and status to start. Set Index stage on the Index card. The tool then holds the blank-entry hints for columns that fall due at a later stage. The Excel columns tab shows what the import accepts and when each column falls due.","**Save keeps everything.** The saved file holds the index, the variants, and the edit log. The Excel export is the exchange copy. Import reads a CI index template workbook or a prior export. It reads the CI Index and PN Variants sheets.","**The structural floor.** The Structural floor tab lists each parent and child in different control tiers, and each GFE CI. Each needs at least one Mapped row on the interface register. The tool does not pair sibling CIs. Interfaces reach the register from Systems Engineering’s interface sources.","**Metrics show coverage and profile.** The Metrics tab reads the index as it stands. Coverage ratios should climb toward 100 percent. Each shows Recorded, where the cells are filled, and Verified, where the related checks pass too. Profile shares describe the index and have no target. Filter by control tier or by branch. Export metrics to PowerPoint writes one slide per metric, with each chart as a picture."]},{"title":"Rules carried from the template","kind":"list","items":["Every CI goes to the Acquirer for concurrence, including Company-spec controlled CIs. A CI reads Proposed until the Acquirer concurs. Enter the concurrence, then set Status to Active. GFE rows read N/A.","Criterion (b) Met is the umbrella safety column. Criterion (b) is mandatory for safety. Any external criticality designation (C-1) satisfies criterion (b) on its own. So does a FMECA failure mode of Category I or II, once traced to the item that hosts it. None of these sources catches every item whose loss is loss of primary system capability with no injury pathway. Find those items in the program’s own decomposition.","FMECA Severity records the highest severity category among the failure modes the FMECA records against the CI. FMECA Ref points to the entry. The FMECA keeps every failure mode. Read the severity category, not the criticality number. Not analyzed means the CI sits outside the FMECA.","Influencing parts fail criterion (b) by their own definition but qualify on criterion (a). See the criticality designations appendix.","The FBL is a system-level baseline. Record it on the top-level CI only. The initial product baseline is established at completion of CDR. The formalized PBL takes its event from the Audit Designation Assessment Record. This index does not record audit designation.","Do not copy handling instructions, IUID triggers, unique item identifiers, life limit values, date codes, or heat-lot details into this index.","Where MBSE is used, CI parent-child relationships mirror the model decomposition. A same-CI verdict that mismatches the model is not entered until Systems Engineering dispositions it.","ACN Ref and ACN Level point to the CI’s current ACN. Record the level, or Not required. Levels 1, 2, and 4 carry limitations, and the ACN Remarks state them. Do not copy them into this index. A formalized product baseline with an ACN below Level 5 is a review item. A variant with its own ACN records it on the PN Variants sheet. In Excel, the level number alone, such as 2, is enough. The import reads 2, L2, Level 2, or ACN 2 and stores Level 2 (Limited Operation, Non-Flight). The edit log records each conversion."]}])) cfg.reference=clone(d.reference);
    (cfg.metrics&&cfg.metrics.items||[]).forEach(function(m){ if(m.k==='drw'&&m.note==="How much of the product the company buys under a controlling drawing, and whether each supplier-designed unit records its drawing.") m.note=d.metrics.items.filter(function(x){ return x.k==='drw'; })[0].note; });
    cfg.migr=(cfg.migr||[]).concat(['docrev']);
  }
  /* Excel template. Builds made before it existed gain its defaults, and the Reference tab gains its line once. */
  if(!cfg.template) cfg.template=clone(d.template);
  else Object.keys(d.template).forEach(function(k){ if(cfg.template[k]==null) cfg.template[k]=d.template[k]; });
  if((cfg.migr||[]).indexOf('tmpl')<0){
    var hw2=(cfg.reference||[]).filter(function(x){ return x.title==='How the tool works'&&x.kind==='list'; })[0];
    var tb=((d.reference.filter(function(x){ return x.title==='How the tool works'; })[0]||{}).items||[]).filter(function(x){ return /Excel template/.test(x); })[0];
    if(hw2&&tb&&!(hw2.items||[]).some(function(x){ return /Excel template/.test(x); })){ var si=-1; hw2.items.forEach(function(x,i){ if(/^\*\*Save keeps everything/.test(x)) si=i; }); if(si>=0) hw2.items.splice(si+1,0,tb); else hw2.items.push(tb); }
    cfg.migr=(cfg.migr||[]).concat(['tmpl']);
  }
  /* Block diagram. Builds made before it existed gain its defaults, and the Reference tab gains its line once. */
  if(!cfg.diagram) cfg.diagram=clone(d.diagram);
  else {
    ['title','layout','width','rows','depth','scope','page','perPage'].forEach(function(k){ if(cfg.diagram[k]==null) cfg.diagram[k]=d.diagram[k]; });
    ['fields','styles','exports','scopes','words'].forEach(function(g){ cfg.diagram[g]=cfg.diagram[g]||{}; Object.keys(d.diagram[g]).forEach(function(k){ if(cfg.diagram[g][k]==null) cfg.diagram[g][k]=d.diagram[g][k]; }); });
  }
  if((cfg.migr||[]).indexOf('diag')<0){
    var hw=(cfg.reference||[]).filter(function(x){ return x.title==='How the tool works'&&x.kind==='list'; })[0];
    var db=((d.reference.filter(function(x){ return x.title==='How the tool works'; })[0]||{}).items||[]).filter(function(x){ return /block diagram/i.test(x); })[0];
    if(hw&&db&&!(hw.items||[]).some(function(x){ return /block diagram/i.test(x); })) hw.items.push(db);
    cfg.migr=(cfg.migr||[]).concat(['diag']);
  }
  cfg.cols.forEach(function(c){ if(c.alias==null) c.alias=[]; });
  if(!cfg.stages) cfg.stages=clone(d.stages||[]);
  if(!cfg.metrics) cfg.metrics=clone(d.metrics);
  else { if(cfg.metrics.pptx==null) cfg.metrics.pptx=true; cfg.metrics.items=cfg.metrics.items||[]; d.metrics.items.forEach(function(x){ if(!cfg.metrics.items.some(function(y){ return y.k===x.k; })) cfg.metrics.items.push(clone(x)); }); }
  cfg.cols.forEach(function(c){ if(c.kind==='level') return; var dc=d.cols.filter(function(x){ return x.k===c.k; })[0]; if(c.stage==null) c.stage=dc&&dc.stage||''; if(c.reg==null) c.reg=!!(dc&&dc.reg); if(c.blankNote==null) c.blankNote=''; });
  return cfg;
}
