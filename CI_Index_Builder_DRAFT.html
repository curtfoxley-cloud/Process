function validate(){
  var c=C(), out=[];
  function E(sec,m){ out.push({sev:'error',sec:sec,m:m}); }
  function W(sec,m){ out.push({sev:'warn',sec:sec,m:m}); }
  function I(sec,m){ out.push({sev:'info',sec:sec,m:m}); }
  var hs={}, ks={};
  c.cols.forEach(function(x){
    if(!tr(x.h)) E('cols','A column has no header. Key: '+x.k+'.');
    var h=tr(x.h).toLowerCase(); if(h){ if(hs[h]) E('cols','Two columns share the header "'+x.h+'". Excel import matches on headers, so each must be unique.'); hs[h]=1; }
    if(ks[x.k]) E('cols','Two columns share the key '+x.k+'.'); ks[x.k]=1;
    if(x.kind==='enum'&&!c.lists[x.list]) E('cols',x.h+' is a dropdown with no list.');
    if(x.kind!=='level'&&x.group&&c.groups.indexOf(x.group)<0) W('cols',x.h+' sits in the group "'+x.group+'", which no longer exists. It will not show in the form.');
  });
  var vh={};
  c.vcols.forEach(function(x){ var h=tr(x.h).toLowerCase(); if(!h) E('vcols','A PN Variants column has no header.'); else if(vh[h]) E('vcols','Two PN Variants columns share the header "'+x.h+'".'); vh[h]=1;
    if(x.kind==='enum'&&!c.lists[x.list]) E('vcols',x.h+' is a dropdown with no list.'); });
  Object.keys(c.lists).forEach(function(n){
    var L=c.lists[n], seen={};
    if(!L.items.length&&usesList(n)) E('lists','The '+L.name+' list is empty, but a column uses it.');
    L.items.forEach(function(i){ var v=tr(i.v).toLowerCase(); if(!v) E('lists','The '+L.name+' list has a blank value.'); else if(seen[v]) E('lists','The '+L.name+' list holds "'+i.v+'" twice.'); seen[v]=1; });
  });
  var sn={};
  c.sources.forEach(function(s){ var v=tr(s.name).toLowerCase(); if(!v) E('sources','A source has no name.'); else if(sn[v]) E('sources','Two sources share the name "'+s.name+'".'); sn[v]=1; });
  if(colByK('src')&&!c.sources.some(function(s){ return s.role==='other'; })) W('sources','No source carries the Other role. Users have no way to record a source that is not on the list.');
  (c.custom||[]).forEach(function(r){
    if(r.ifOp!=='always'&&!colByK(r.ifCol)) E('custom',r.id+' reads a column that no longer exists.');
    if(!colByK(r.thenCol)) E('custom',r.id+' checks a column that no longer exists.');
    if(r.ifOp!=='always'&&!/blank/.test(r.ifOp)&&!tr(r.ifVal)) W('custom',r.id+' compares against a blank value.');
    if(!/blank/.test(r.thenOp)&&!tr(r.thenVal)) W('custom',r.id+' requires a blank comparison value.');
  });
  var off=Object.keys(c.rules).filter(function(k){ var r=c.rules[k]; return r.on&&r.needs.some(function(n){ return !colByK(n); }); });
  if(off.length) I('rules',off.length+' built-in rule'+(off.length>1?'s are':' is')+' off because a column is missing: '+off.join(', ')+'.');
  var sk={}; (c.stages||[]).forEach(function(x){ if(!tr(x.name)) E('stages','A stage has no name.'); sk[x.k]=1; });
  c.cols.forEach(function(x){ if(x.kind!=='level'&&x.stage&&!sk[x.stage]) W('cols',x.h+' falls due at a stage that no longer exists. It now reads Any time.'); });
  var first=(c.stages||[])[0]; if(first&&!c.cols.some(function(x){ return x.k==='id'&&x.stage===first.k; })) W('stages','CI ID does not fall due at the first stage. The minimum entry for a new CI should include it.');
  var mi=(c.metrics&&c.metrics.items)||[];
  if(c.features.tabs.metrics&&!mi.some(function(x){ return x.on; })) W('metrics','The Metrics tab is on, but every metric is off. The tab will be empty.');
  mi.forEach(function(x){ var d=MDEFB[x.k]; if(!d) return; if(!tr(x.title)) W('metrics','A metric has no title. The tool falls back to its default title.'); var miss=d.needs.filter(function(n){ return !colByK(n); }); if(x.on&&miss.length) I('metrics',(tr(x.title)||x.k)+' is off because a column is missing: '+miss.map(function(m){ return (DEFAULT.cols.filter(function(cc){ return cc.k===m; })[0]||{h:m}).h; }).join(', ')+'.'); });
  if(c.metrics&&c.metrics.pptx&&!c.features.tabs.metrics) I('metrics','Export metrics to PowerPoint sits on the Metrics tab. With the tab off, users cannot export metrics.');
  var tp=c.template||{};
  if(tp.on&&tp.examples&&!((c.examples||{}).cis||[]).length) I('features','The Excel template has no Examples sheet, because the build has no example rows.');
  if(tp.on&&tp.colmap&&!c.features.tabs.colmap) I('features','The Excel template has no Column Map sheet, because the Excel columns tab is off.');
  var dg=c.diagram||{};
  if(c.features.tabs.diagram){
    var dex=['pdf','pptx','svg','png'].filter(function(k){ return (dg.exports||{})[k]; }), dsc=['paged','view'].filter(function(k){ return (dg.scopes||{})[k]; });
    if(dex.length&&!dsc.length) E('diagram','Block diagram exports are on, but both export scopes are off. Turn on the paged set, the current view, or both.');
    if(dex.length&&dsc.length&&dsc.indexOf(dg.scope)<0) W('diagram','The default export scope is off. The tool starts users on the other scope.');
    if(!dex.length) I('diagram','Every block diagram export is off. Users can view the diagram but cannot export it.');
    if(!tr(dg.title)) W('diagram','The block diagram has no title. Exports fall back to CI Hierarchy Block Diagram.');
    var dmf=DGFB.filter(function(f){ return (dg.fields||{})[f[0]]&&!dgbHas(f); }), dms=DGSB.filter(function(f){ return (dg.styles||{})[f[0]]&&!dgbHas(f); });
    if(dmf.length) I('diagram','These default block fields stay hidden, because a column or tab is missing: '+dmf.map(function(f){ return f[1]; }).join(', ')+'.');
    if(dms.length) I('diagram','These default box styles stay off, because a column is missing: '+dms.map(function(f){ return f[1]; }).join(', ')+'.');
  }
  if(!tr(c.text.stem)) W('text','The file name stem is blank. Saved files will start with "CI-Index".');
  if(!tr(c.build.rev)) W('build','The build has no revision.');
  if(!c.build.changes||!c.build.changes.some(function(x){ return tr(x.rev)===tr(c.build.rev); })) W('build','No change log entry carries revision '+(c.build.rev||'(blank)')+'.');
  return out;
}
function usesList(n){ return C().cols.some(function(c){ return c.kind==='enum'&&c.list===n; })||C().vcols.some(function(c){ return c.kind==='enum'&&c.list===n; })||['type','tier','status','life'].indexOf(n)>=0; }
function vchip(){
  var v=validate(), e=v.filter(function(x){ return x.sev==='error'; }).length, w=v.filter(function(x){ return x.sev==='warn'; }).length;
  $('vchip').innerHTML='<button class="chip '+(e?'bad':w?'hold':'ok')+'" data-sec="build" title="Open the build check">'+(e?e+' error'+(e>1?'s':''):w?w+' warning'+(w>1?'s':''):'Build checks pass')+'</button>';
  return v;
}

function vOf(p){ var v=getP(B.cfg,p); return v==null?'':v; }
function inp(p,o){ o=o||{}; return '<input data-p="'+p+'"'+(o.t?' data-t="'+o.t+'"':'')+(o.type?' type="'+o.type+'"':'')+' value="'+esc(vOf(p))+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+(o.lab?' aria-label="'+esc(o.lab)+'"':'')+(o.id?' id="'+o.id+'"':'')+'>'; }
function ta(p,o){ o=o||{}; var v=vOf(p); if(o.lines) v=(v||[]).join('\n'); return '<textarea data-p="'+p+'"'+(o.lines?' data-t="lines"':'')+' rows="'+(o.rows||3)+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+(o.lab?' aria-label="'+esc(o.lab)+'"':'')+'>'+esc(v)+'</textarea>'; }
function chk(p,label,o){ o=o||{}; return '<label class="ck"><input type="checkbox" data-p="'+p+'" data-t="b"'+(vOf(p)?' checked':'')+(o.dis?' disabled':'')+'> '+label+'</label>'; }
function sel(p,opts,o){ o=o||{}; var v=vOf(p); return '<select data-p="'+p+'"'+(o.lab?' aria-label="'+esc(o.lab)+'"':'')+(o.dis?' disabled':'')+'>'+opts.map(function(x){ return '<option value="'+esc(x[0])+'"'+(String(x[0])===String(v)?' selected':'')+'>'+esc(x[1])+'</option>'; }).join('')+'</select>'; }
function fld(label,ctl,help,wide){ return '<div class="fld'+(wide?' w':'')+'"><label>'+esc(label)+'</label>'+ctl+(help?'<div class="help">'+help+'</div>':'')+'</div>'; }
function mv(kind,i,n){ return '<span class="mv"><button data-act="mv" data-kind="'+kind+'" data-i="'+i+'" data-d="-1" aria-label="Move up"'+(i===0?' disabled':'')+'>▲</button><button data-act="mv" data-kind="'+kind+'" data-i="'+i+'" data-d="1" aria-label="Move down"'+(i===n-1?' disabled':'')+'>▼</button></span>'; }
function head(t,lede,topic){ return '<h1>'+esc(t)+'</h1><p class="lede">'+lede+(topic?'<button class="hl" data-help="'+topic+'">Help</button>':'')+'</p>'; }
function listOpts(){ return Object.keys(C().lists).map(function(n){ return [n,C().lists[n].name]; }); }
function colOpts(withAlways){ var o=C().cols.filter(function(c){ return c.kind!=='level'; }).map(function(c){ return [c.k,c.h]; }); return withAlways?[['*','Any row']].concat(o):o; }
function rulesNeeding(k){ var r=C().rules; return Object.keys(r).filter(function(id){ return r[id].needs.indexOf(k)>=0; }); }

function secBuild(){
  var c=C(), v=validate();
  var act=Object.keys(c.rules).filter(function(k){ var r=c.rules[k]; return r.on&&r.needs.every(function(n){ return colByK(n); }); }).length;
  var h=head('Build and change log','A build is every setting of the tool. Name it, give it a revision, and log each change. The tool shows the name, the revision, and the log on its Reference tab.','build');
  h+='<div class="stats"><div class="stat"><div class="t">Columns</div><div class="v">'+c.cols.length+'</div></div><div class="stat"><div class="t">Lists</div><div class="v">'+Object.keys(c.lists).length+'</div></div><div class="stat"><div class="t">Active rules</div><div class="v">'+(act+(c.custom||[]).filter(function(x){ return x.on; }).length)+'</div></div><div class="stat"><div class="t">Example rows</div><div class="v">'+((c.examples&&c.examples.cis)||[]).length+'</div></div></div>';
  h+='<div class="card"><div class="lab">Identity</div><div class="fg">'+fld('Build name',inp('build.name'))+fld('Revision',inp('build.rev'))+'</div></div>';
  h+='<div class="card"><div class="lab">Build check</div>';
  if(!v.length) h+='<p class="small">Every check passes. The build is ready to export.</p>';
  else h+='<table class="t"><thead><tr><th>Severity</th><th>Section</th><th>Finding</th></tr></thead><tbody>'+v.map(function(x){ return '<tr><td><span class="sev '+x.sev+'">'+x.sev+'</span></td><td><button class="lnk" data-sec="'+x.sec+'">'+esc(secName(x.sec))+'</button></td><td>'+esc(x.m)+'</td></tr>'; }).join('')+'</tbody></table>'+
    '<p class="small" style="margin-top:8px">An error stops the export unless you choose to go on. A warning does not. Information is for awareness only.</p>';
  h+='</div>';
  h+='<div class="card"><div class="lab">Change log</div><table class="t"><thead><tr><th style="width:70px">Rev</th><th style="width:120px">Date</th><th style="width:120px">By</th><th>Change</th><th></th></tr></thead><tbody>'+
    (c.build.changes||[]).map(function(x,i){ return '<tr><td>'+inp('build.changes.'+i+'.rev',{lab:'Revision'})+'</td><td>'+inp('build.changes.'+i+'.date',{lab:'Date',ph:'YYYY-MM-DD'})+'</td><td>'+inp('build.changes.'+i+'.by',{lab:'By'})+'</td><td>'+inp('build.changes.'+i+'.text',{lab:'Change'})+'</td><td><button class="lnk del" data-act="del-chg" data-i="'+i+'">Remove</button></td></tr>'; }).join('')+
    '</tbody></table><div style="margin-top:10px"><button class="btn sm" data-act="add-chg">Add a change entry</button></div></div>';
  return h;
}

      fld('Interface register',chk(p+'reg','Read by the CI Interface Register'),'Shown on the Excel columns tab. Keep it in step with the register build.')+
      fld('Note when blank',inp(p+'blankNote',{ph:'Optional. Added to the Excel columns tab'}),'The tab lists the hints a blank cell raises. Add program guidance here.',true):'')+
    fld('Help text',ta(p+'help',{rows:3}),'Shows under the field in the form.',true)+
    ((c.kind==='text')?fld('Suggestions',ta(p+'sug',{lines:1,rows:3,ph:'One value per line'}),'Offered as the user types. Free entry still works.'+(c.k==='nhpin'||c.pins?'':''))+fld('PIN suggestions',chk(p+'pins','Also suggest the PINs already in the index')):'')+

/* ===================================================================
   Cascades keep references in step while you type
   =================================================================== */
function cascade(path,old,nw){
  var c=C(), m;
  if((m=/^groups\.(\d+)$/.exec(path))) c.cols.forEach(function(x){ if(x.group===old) x.group=nw; });
  if((m=/^lists\.([^.]+)\.items\.(\d+)\.v$/.exec(path))){
    var n=m[1], keys=c.cols.filter(function(x){ return x.kind==='enum'&&x.list===n; }).map(function(x){ return x.k; });
    var vk=c.vcols.filter(function(x){ return x.kind==='enum'&&x.list===n; }).map(function(x){ return x.k; });
    B.ren.push({keys:keys,vkeys:vk,old:old,nw:nw});
    (c.examples.cis||[]).forEach(function(r){ keys.forEach(function(k){ if(r[k]===old) r[k]=nw; }); });
    (c.examples.vars||[]).forEach(function(r){ vk.forEach(function(k){ if(r[k]===old) r[k]=nw; }); });
  }
  if((m=/^sources\.(\d+)\.name$/.exec(path))){
    B.ren.push({src:true,old:old,nw:nw});
    (c.examples.cis||[]).forEach(function(r){
      if(Array.isArray(r.src)) r.src=r.src.map(function(s){ return s===old?nw:s; });
      else if(typeof r.src==='string') r.src=r.src.split(';').map(function(s){ return s.trim()===old?nw:s.trim(); }).join('; ');
    });
  }
}
function readVal(t){
  var ty=t.dataset.t;
  if(ty==='b') return t.checked;
  if(ty==='n') return t.value===''?'':(+t.value||0);
  if(ty==='lines') return t.value.split('\n').map(function(x){ return x.replace(/\s+$/,''); }).filter(function(x){ return x.trim(); });
  return t.value;
}

var PT=null, PV={pending:null,timer:null};
function enc(o){ return JSON.stringify(o).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029'); }
function toolHTML(cfg,prv){
  var a=enc(cfg), b=prv?enc(prv):'null';
  return ENGINE.replace('/*CFG>*/null/*<CFG*/',function(){ return '/*CFG>*/'+a+'/*<CFG*/'; }).replace('/*PRV>*/null/*<PRV*/',function(){ return '/*PRV>*/'+b+'/*<PRV*/'; });
}
function schedPrev(){ if(!$('pv-auto').checked) return; clearTimeout(PT); PT=setTimeout(function(){ refreshPreview(); },700); }
function refreshPreview(fresh){
  var f=$('pvf');
  if(!fresh&&$('pv-keep').checked&&f.dataset.loaded){
    clearTimeout(PV.timer);
    PV.pending=true;
    try{ f.contentWindow.postMessage({ciReq:'snapshot'},'*'); }catch(e){}
    PV.timer=setTimeout(function(){ if(PV.pending){ PV.pending=null; loadPreview(null); } },500);
  } else loadPreview(null);
}
function applyRen(d){
  B.ren.forEach(function(x){
    (d.cis||[]).forEach(function(r){
      if(x.src){ if(Array.isArray(r.src)) r.src=r.src.map(function(s){ return s===x.old?x.nw:s; }); }
      else x.keys.forEach(function(k){ if(r[k]===x.old) r[k]=x.nw; });
    });
    if(!x.src) (d.vars||[]).forEach(function(v){ x.vkeys.forEach(function(k){ if(v[k]===x.old) v[k]=x.nw; }); });
  });
}
function loadPreview(snap){
  var prv={mode:$('pv-mode').value};
  if(snap) applyRen(snap.ciSnap);
  B.ren=[];
  if(snap){ prv.data=snap.ciSnap; prv.tab=snap.tab; prv.sel=snap.sel; prv.sy=snap.sy; }
  var f=$('pvf'); f.dataset.loaded='1';
  f.srcdoc=toolHTML(B.cfg,prv);
}
window.addEventListener('message',function(e){
  if(e.source!==$('pvf').contentWindow||!e.data||!e.data.ciSnap) return;
  B.snap=e.data;
  if(PV.pending){ PV.pending=null; clearTimeout(PV.timer); loadPreview(e.data); }
  if(B.wantEx){ B.wantEx=false; useSnapAsExamples(e.data.ciSnap); }

function dl(text,name,mime){
  var u=URL.createObjectURL(new Blob([text],{type:mime}));
  var a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(u); },4000);
}
function stemOf(){ return slug(C().text.stem)||'CI-Index'; }
function doSave(){
  dl(JSON.stringify({builder:BUILDER,rev:BUILDER_REV,saved:today(),config:B.cfg},null,1),stemOf()+'_Build_Rev'+slug(C().build.rev||'X')+'.json','application/json');
  clean(); msg('Build saved. Reopen it with Open build.');
}
function doExport(){
  var v=validate(), e=v.filter(function(x){ return x.sev==='error'; });
  if(e.length&&!confirm('The build has '+e.length+' error'+(e.length>1?'s':'')+'. The first: '+e[0].m+'\n\nExport the tool anyway?')){ B.sec='build'; renderAll(); return; }
  dl(toolHTML(B.cfg,null),stemOf()+'_Tool_Rev'+slug(C().build.rev||'X')+'.html','text/html');
  msg('Tool exported. Send the HTML file to users. It runs offline.');
}
function doOpen(file){
  var rd=new FileReader();
  rd.onload=function(){
    var t=rd.result, cfg=null;
    try{
      if(/\.html?$/i.test(file.name)||/^\s*</.test(t)){
        var m=/\/\*CFG>\*\/([\s\S]*?)\/\*<CFG\*\//.exec(t);
        if(!m||m[1]==='null') throw new Error('this HTML file carries no build. Open a tool exported by this builder');
        cfg=JSON.parse(m[1]);
      } else {
        var o=JSON.parse(t);
        if(o.builder===BUILDER) cfg=o.config;
        else if(o.cols&&o.lists) cfg=o;
        else if(o.tool==='ci-index') throw new Error('this is a saved index, not a build. Open it inside the tool');
        else throw new Error('this is not a CI Index build');
      }
      if(B.dirty&&!confirm('You have unsaved changes. Open '+file.name+' anyway?')) return;
      B.cfg=upgrade(cfg); B.undo=[]; B.redo=[]; B.open={}; clean(); renderAll(); refreshPreview(true);
      msg('Opened '+file.name+'. Build '+(cfg.build&&cfg.build.name||'')+', revision '+(cfg.build&&cfg.build.rev||'')+'.');
    }catch(err){ msg('Could not open that file: '+err.message+'.'); }
  };
  rd.readAsText(file);
}

    case 'undo': if(!B.undo.length) break; B.redo.push(JSON.stringify(B.cfg)); B.cfg=JSON.parse(B.undo.pop()); dirty(); renderAll(); schedPrev(); msg('Undone.'); break;
    case 'redo': if(!B.redo.length) break; B.undo.push(JSON.stringify(B.cfg)); B.cfg=JSON.parse(B.redo.pop()); dirty(); renderAll(); schedPrev(); msg('Redone.'); break;
    case 'reset': if(!confirm('Start over from the default build? Save first if you want to keep this one.')) break; pushUndo(); B.cfg=clone(DEFAULT); B.open={}; dirty(); renderAll(); refreshPreview(true); msg('Back to the default build. Undo brings your build back.'); break;
    case 'help': openHelp('start'); break;
    case 'help-close': closeHelp(); break;
    case 'pv-refresh': refreshPreview(); break;
    case 'pv-pop': var w=window.open(URL.createObjectURL(new Blob([toolHTML(B.cfg,{mode:$('pv-mode').value,data:B.snap?B.snap.ciSnap:null})],{type:'text/html'})),'_blank'); if(!w) msg('The browser blocked the new window. Allow pop-ups for this file.'); break;
    case 'mv':
      var kind=d.kind, dir=+d.d, arr=kind.indexOf('list:')===0?c.lists[kind.slice(5)].items:getP(c,kind), j=i+dir;
      if(j<0||j>=arr.length) break;
      change(function(){ var x=arr[i]; arr[i]=arr[j]; arr[j]=x; }); break;
    case 'add-col':
      var hh=tr($('nc-h').value); if(!hh){ msg('Name the new column first.'); $('nc-h').focus(); break; }
      if(c.cols.some(function(x){ return tr(x.h).toLowerCase()===hh.toLowerCase(); })){ msg('A column already carries that header.'); break; }
      var kd=$('nc-kind').value, k=uniqKey(keyFrom(hh),c.cols.map(function(x){ return x.k; }));
      var nc={k:k,h:hh,kind:kd,w:kd==='long'?36:16,help:'',group:$('nc-group').value,wide:kd==='long',core:false,req:'',reqGFE:false,alias:[],stage:'',reg:false,blankNote:''};
      if(kd==='enum'){ var ln=Object.keys(c.lists).filter(function(n){ return !c.lists[n].core; })[0]; nc.list=ln||'type'; }
      B.newc={h:'',kind:kd,group:nc.group};
      change(function(){ var at=c.cols.findIndex(function(x){ return x.k==='notes'; }); if(at<0) c.cols.push(nc); else c.cols.splice(at,0,nc); B.open['c:'+k]=true; });
      msg('Added '+hh+'. It sits before Notes. Move it with the arrows.'); break;
    case 'del-col':
      var col=colByK(d.k), rn=rulesNeeding(d.k), cr=(c.custom||[]).filter(function(r){ return r.ifCol===d.k||r.thenCol===d.k; });
      if(!confirm('Delete the column '+col.h+'?'+(rn.length?'\n\nThese built-in rules will turn off: '+rn.join(', ')+'.':'')+(cr.length?'\n\nThese custom rules read it and will show as errors: '+cr.map(function(r){ return r.id; }).join(', ')+'.':'')+'\n\nIndex files saved with this column keep their data. This build will not show it.')) break;
      change(function(){ c.cols=c.cols.filter(function(x){ return x.k!==d.k; }); }); msg('Deleted '+col.h+'. Undo brings it back.'); break;
    case 'add-stage': change(function(){ c.stages=c.stages||[]; var n=1; while(c.stages.some(function(x){ return x.k==='s'+n; })) n++; c.stages.push({k:'s'+n,name:'New stage',when:''}); }); break;
    case 'del-stage': var sk2=c.stages[i].k, used=c.cols.filter(function(x){ return x.stage===sk2; }).length; if(!confirm('Remove the stage '+c.stages[i].name+'?'+(used?' '+used+' column'+(used>1?'s':'')+' will read Any time.':''))) break;
      change(function(){ c.cols.forEach(function(x){ if(x.stage===sk2) x.stage=''; }); c.stages.splice(i,1); }); break;
    case 'add-group': change(function(){ var n='New group', s=n, x=2; while(c.groups.indexOf(s)>=0) s=n+' '+(x++); c.groups.push(s); }); break;
    case 'del-group': change(function(){ c.groups.splice(i,1); }); break;
    case 'add-vcol':
      var vh=tr($('nv-h').value); if(!vh){ msg('Name the new column first.'); break; }
      var vk=uniqKey(keyFrom(vh),c.vcols.map(function(x){ return x.k; }));
      change(function(){ var at=c.vcols.findIndex(function(x){ return x.k==='notes'; }); var nv={k:vk,h:vh,kind:$('nv-kind').value,w:16,core:false,help:''}; if(nv.kind==='enum') nv.list='type'; if(at<0) c.vcols.push(nv); else c.vcols.splice(at,0,nv); }); break;
    case 'del-vcol': if(confirm('Delete the PN Variants column '+c.vcols[i].h+'?')) change(function(){ c.vcols.splice(i,1); }); break;
    case 'add-item': change(function(){ c.lists[d.list].items.push({v:'New value'}); }); break;
    case 'del-item': change(function(){ c.lists[d.list].items.splice(i,1); }); break;
    case 'add-list':
      var nm=tr($('nl-name').value); if(!nm){ msg('Name the new list first.'); break; }
      var lk=uniqKey('l_'+(nm.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,20)),Object.keys(c.lists));
      change(function(){ c.lists[lk]={name:nm,core:false,items:[{v:'First value'}]}; }); msg('Added the list '+nm+'. Give a dropdown column this list on the columns page.'); break;
    case 'del-list': if(confirm('Delete the list '+c.lists[d.list].name+'?')) change(function(){ delete c.lists[d.list]; }); break;
    case 'add-src': change(function(){ c.sources.splice(Math.max(0,c.sources.length-1),0,{name:'New source',d:'Lot/batch',c1:false,role:''}); }); break;
    case 'del-src': if(confirm('Remove the source '+c.sources[i].name+'?')) change(function(){ c.sources.splice(i,1); }); break;
    case 'rules-all-on': change(function(){ Object.keys(c.rules).forEach(function(k){ c.rules[k].on=true; }); }); break;
    case 'rules-reset': if(confirm('Restore every built-in rule to its default severity and words?')) change(function(){ c.rules=clone(DEFAULT.rules); }); break;
    case 'add-cr':
      change(function(){ c.custom=c.custom||[]; var n=1; while(c.custom.some(function(r){ return r.id==='CR'+n; })) n++;
        c.custom.push({id:'CR'+n,on:true,sev:'review',scope:'live',skipGFE:true,ifCol:colByK('tier')?'tier':'*',ifOp:colByK('tier')?'is':'always',ifVal:colByK('tier')?(c.lists.tier.items[1]||{}).v||'':'',thenCol:colByK('ssow')?'ssow':'notes',thenOp:'notblank',thenVal:'',msg:'',basis:''}); }); break;
    case 'del-cr': if(confirm('Delete '+c.custom[i].id+'?')) change(function(){ c.custom.splice(i,1); }); break;
    case 'add-ref': change(function(){ c.reference.push({title:'New section',kind:'list',items:['First item.']}); }); break;
    case 'del-ref': if(confirm('Delete this section?')) change(function(){ c.reference.splice(i,1); }); break;
    case 'add-chg': change(function(){ c.build.changes=c.build.changes||[]; c.build.changes.push({rev:c.build.rev||'',date:today(),by:'',text:''}); }); break;
    case 'del-chg': change(function(){ c.build.changes.splice(i,1); }); break;
    case 'metrics-reset': if(confirm('Restore every metric to its default order, title, and words?')) change(function(){ c.metrics=clone(DEFAULT.metrics); }); break;
    case 'theme-reset': change(function(){ c.theme=clone(DEFAULT.theme); }); break;
    case 'ex-clear': if(confirm('Remove the example rows from the build?')) change(function(){ c.examples={cis:[],vars:[]}; }); break;
    case 'ex-default': change(function(){ c.examples=clone(DEFAULT.examples); }); msg('Restored the template example rows.'); break;
    case 'ex-preview': B.wantEx=true; try{ $('pvf').contentWindow.postMessage({ciReq:'snapshot'},'*'); }catch(err){ msg('The preview is not ready.'); } break;
  }
});
document.addEventListener('focusin',function(e){ var t=e.target; if(t.dataset&&t.dataset.p){ B.pend=JSON.stringify(B.cfg); B.lastVal=getP(B.cfg,t.dataset.p); B.focusVal=B.lastVal; } });
document.addEventListener('input',function(e){
  var t=e.target, p=t.dataset&&t.dataset.p;
  if(t.id==='help-q'){ renderHelp(); return; }
  if(t.id==='nc-h') { B.newc.h=t.value; return; }
  if(t.id==='nv-h') { B.newv.h=t.value; return; }
  if(!p) return;
  if(B.pend){ pushUndo(B.pend); B.pend=null; }
  var v=readVal(t), old=getP(B.cfg,p);
  setP(B.cfg,p,v);
  if(typeof v==='string') cascade(p,B.lastVal!=null?B.lastVal:old,v);
  B.lastVal=v;
  document.querySelectorAll('[data-mirror="'+p+'"]').forEach(function(m){ m.textContent=v; });
  document.querySelectorAll('[data-p="'+p+'"]').forEach(function(x){ if(x===t||x.type==='checkbox') return; if(x.type==='color'){ if(/^#[0-9a-f]{6}$/i.test(v)) x.value=v; } else if(x.tagName==='INPUT') x.value=v; });
  var m=/^custom\.(\d+)\./.exec(p); if(m){ var s=document.querySelector('[data-auto="'+m[1]+'"]'); if(s) s.textContent=autoMsg(C().custom[+m[1]]); }
  dirty(); schedPrev(); vchip(); renderNav();
});
document.addEventListener('change',function(e){
  var t=e.target, p=t.dataset&&t.dataset.p;
  if(t.id==='f-open'){ var f=t.files&&t.files[0]; t.value=''; if(f) doOpen(f); return; }
  if(t.id==='r-filt'){ B.rfilt=t.value; renderEd(); return; }
  if(t.id==='pv-mode'){ refreshPreview(true); return; }
  if(t.id==='pv-width'||t.id==='pv-layout'){ setLayout(); return; }
  if(t.id==='pv-auto'||t.id==='pv-keep') return;
  if(!p) return;
  var hm=/^(cols|vcols)\.(\d+)\.h$/.exec(p);
  if(hm&&hm[1]==='cols'&&B.focusVal&&tr(B.focusVal)!==tr(t.value)){
    var col=C().cols[+hm[2]]; col.alias=col.alias||[]; if(col.alias.indexOf(B.focusVal)<0) col.alias.push(B.focusVal);
    msg('Renamed. The old header "'+B.focusVal+'" is now an import alias.');
  }
  B.focusVal=getP(B.cfg,p);
  if(t.tagName==='SELECT'||t.type==='checkbox'||/\.kind$/.test(p)) renderAll();
});
window.addEventListener('beforeunload',function(e){ if(B.dirty){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeHelp(); });

/* ===================================================================
   Help
   =================================================================== */
var HELP=[
 {id:'start',t:'Start here',b:[
  'p:This builder changes the CI Index tool without code. You edit settings in forms. The preview runs the real tool with your settings.',
  'p:A build is the full set of settings: columns, lists, sources, rules, features, text, and theme. Save the build as a JSON file. Reopen it later and keep working.',
  'p:When the build is ready, export it. The export is one HTML file. It runs offline in any current browser, like the tool you have now.',
  'ex:Three steps. Edit a section. Watch the preview. Export the tool.',
  'p:Pick a section on the left. Each section has a Help link that opens its topic here.']},
 {id:'build',t:'Builds and change control',b:[
  'p:Give each build a name and a revision. The tool shows both on its Reference tab and on the About sheet of its Excel exports.',
  'p:Record each change in the change log. Say what changed and why. The log travels inside the tool.',
  'p:Treat a build like any controlled document. The build file is the source. The exported tool is the output. Keep them together.',
  'p:Saved index files carry the build name and revision. A tool opens index files saved by another build. It keeps the columns it knows. It drops the rest and says so.',
  'p:The build check lists errors, warnings, and information. An error stops the export unless you choose to go on.']},
 {id:'cols',t:'Columns',b:[
  'p:Each column is one property of a CI. The order on the page is the order in the table and the Excel export.',
  'ul:**Core columns** hold the hierarchy and status: Level, CI ID, Parent CI ID, CI Name, and Status. Rename them. Move them. You cannot delete them.|**Built-in columns** carry the template’s meaning. Rules read them. Rename, move, or delete them. Delete one, and the rules that need it turn off. The builder names those rules before you delete.|**Custom columns** are yours. Add as many as you need.',
  'p:Every column has a key. The key never changes. Saved index files store data by key, so renaming a header never loses data.',
  'p:Two kinds of built-in column work in pairs or derive a value. Each revision column pairs with the document column beside it by key: specRev with spec, scdRev with scd, vicdRev with vicd, svdRev with svdRef, ssowRev with ssow, and acnRev with acnRef. Rules RV1 to RV6 need both keys. Delete a document column, and delete its revision column too. Effectivity (eff) shows a derived value while blank: All units, or See PN Variants where the CI has variant rows.',
  'p:Renaming a header adds the old header to the import aliases. Workbooks with the old header still import.',
  'p:Mark a column as required to have the tool raise a review item or a flag when it is blank. Required checks skip GFE rows unless you say otherwise. They skip retired rows always.']},
 {id:'types',t:'Data types',b:[
  'ul:**Text.** One line, free entry. Add suggestions to offer common values.|**Long text.** Several lines. Good for notes and exceptions.|**Y/N.** Two buttons. The tool flags any other value.|**Dropdown list.** Values come from a list on the Lists page. The Excel export adds a dropdown to that column.|**Number.** The tool flags anything that is not a number, except N/A.|**Date.** Enter as YYYY-MM-DD. The tool flags any other form.',
  'p:Three types belong to core and built-in columns only: the derived level, the parent picker, and the source picker. Their type is fixed.',
  'p:Changing a type does not change data already saved. Check the preview after a change.']},
 {id:'groups',t:'Form groups',b:[
  'p:The Hierarchy tab shows one card per group. Each card holds the columns assigned to it, in column order.',
  'p:Set a column to Not in the form to keep it in the table and the export only.',
  'p:Renaming a group moves its columns with it. Remove a group only when it is empty.']},
 {id:'lists',t:'Lists and meanings',b:[
  'p:A list feeds the dropdown columns. Each value is one choice.',
  'p:Some values carry a meaning the rules depend on. Active and Proposed drive the concurrence checks. The three control tiers drive the structure checks. The retired statuses drive retirement. The FMECA severity categories drive the FMECA checks: Category I and II meet criterion (b). The ACN levels drive the ACN checks: Levels 1, 2, and 4 carry limitations, and Not required exempts a CI. The Excel import reads a bare level number, such as 2, as the full ACN label. Rename these values freely. You cannot remove them. The meaning stays with the value.',
  'p:Mark a CI type as Software. Software CIs read N and N for the recording flags.',
  'p:Mark a status as Retired. Retired rows stay in the index for traceability. Most checks skip them.',
  'p:The short tag is the badge in the hierarchy tree. Leave it blank, and the tool uses the first four letters.',
  'p:Renaming a value updates the example rows. It does not update index files saved earlier. The tool marks the old value for review on those rows.',
  'p:Add your own lists for custom dropdown columns.']},
 {id:'sources',t:'Unit record sources',b:[
  'p:The sources feed the unit record picker on each CI. Each source says what it drives: serial recording, lot or batch recording, both, or either.',
  'p:Mark a source C-1 when it is an external criticality designation. It then satisfies criterion (b) on its own. The safety check fires when Criterion (b) Met is not Y.',
  'p:A role tells the rules what a source means.',
  'ul:**Other.** Satisfies a Y flag but never demands one. One source should carry it.|**Critical safety item.** Drives the SCI check and IUID.|**IUID.** Drives IUID Required.|**Special handling.** Drives Special Handling.|**Cycle or usage life limit** and **Age or shelf-life limit.** Feed the life clock check.',
  'p:Keep the list in step with the recording sources table and the external criticality designations of the CI identification process.']},
 {id:'rules',t:'Built-in rules',b:[
  'p:The built-in rules come from the CI index template and the CI identification process. Each has an ID, an area, a severity, and a basis.',
  'ul:**Flag.** A disagreement. The record contradicts itself or the template.|**Review.** A likely gap. It may have a good answer.|**Note.** A reminder.',
  'p:Turn a rule off, or change its severity. Edit the words to match your program. The logic does not change. It lives in the engine.',
  'p:A rule that needs a deleted column shows as off. Restore the column, and the rule returns.',
  'p:No rule ever blocks entry. Checks mark cells. People decide.']},
 {id:'custom',t:'Custom rules',b:[
  'p:A custom rule reads like a sentence. Where one column meets a condition, another column must meet a condition.',
  'ex:Where Control Tier is Company-spec controlled, SSOW must not be blank.',
  'p:Pick Any row and Always to check a column on every row.',
  'p:Is one of takes a list of values separated by commas. Matching ignores case.',
  'p:The message is what the user sees. Leave it blank, and the tool uses the sentence.',
  'p:Scope sets the rows. Live rows only skips retired CIs. Skip GFE rows leaves thin GFE rows alone.',
  'p:Test each custom rule in the preview. Change a row until the rule fires, then change it back.']},
 {id:'stages',t:'Stages and Index stage',b:[
  'p:The CI Index is rarely filled in one sitting. Stages say when each column falls due. The defaults follow the CI identification guidance: Candidate, Selection through SFR, Structure through PDR, Identifiers and records through CDR, and Production.',
  'p:The user sets Index stage on the Index card. The tool then holds the blank-entry hints for columns that fall due at a later stage. The tally and the Checks tab count what is held.',
  'p:Only hints that fire because a cell is blank are held. A hint that compares two filled cells always runs. Example: SCI = Y with Criterion (b) Met = N is flagged at every stage.',
  'p:The columns of the first stage are the minimum entry for a new CI. The Excel columns tab lists them.',
  'p:Rename a stage freely. Its key never changes. Remove a stage, and its columns read Any time.']},
 {id:'colmap',t:'Excel columns tab',b:[
  'p:When the Excel template is on, the Excel columns tab offers it at the top. Users can start in Excel with every column in place.',
  'p:The Excel columns tab tells users what the import accepts. A workbook needs a sheet named CI Index and a header row with CI ID or Parent CI ID in its first 15 rows. Every row with one filled cell loads. Every other column is optional.',
  'p:For each column, the tab shows the header and the other headers accepted, the save file key, the stage it falls due, the rules that read it, and the hints a blank cell raises. The tab builds the last two from the rules, so they follow your rule settings.',
  'p:Add a Note when blank on a column to add program guidance. Mark the columns the CI Interface Register reads, so users know which columns feed it.',
  'p:The Excel export carries the same map on a Column Map sheet.']},
 {id:'metrics',t:'Metrics',b:[
  'p:The Metrics tab reads the index as it stands. It shows two panels. Coverage ratios should climb toward 100 percent. Profile shares describe the index and have no target.',
  'p:Each coverage ratio shows two numbers. Recorded means the cells are filled. Verified means the cells are filled and the related checks pass. The gap between the two is the work left. Each metric lists the CIs that fall short, and each CI ID opens the CI.',
  'ul:**Traced to PIN and NH.** Coverage. Each CI ties to a physical installation.|**SCI traced to its source.** Coverage. Each SCI cites the record that names it.|**Model alignment covered.** Coverage. Each CI resolves to a model element or records an accepted exception.|**Criterion (b) met.** Profile. Splits the Y answers by SCI, external designation, FMECA Category I or II, or none of these.|**Traced to an ICD.** Profile. Overall and by control tier.|**Traced to an SCD or VICD.** Profile, with a coverage check on supplier-designed units. It reads the SCD and VICD columns.|**ACN level.** Profile. The spread of ACN levels, with the CIs whose ACNs carry limitations.',
  'p:Users filter by control tier and by branch. Every metric follows the filters. A metric whose columns fall due at a later index stage says so, because it reads low until then.',
  'p:Turn each metric on or off, set its order, and edit its title and plain meaning. The logic lives in the engine. A metric that needs a deleted column turns off and names the column.',
  'p:Export metrics to PowerPoint writes a title slide, a summary slide, and one slide per metric. Each chart is a picture. The words stay editable text.']},
 {id:'diagram',t:'Block diagram',b:[
  'p:The Block diagram tab draws the CI hierarchy. Each live CI is a block. A line joins each CI to its parent, as Parent CI ID records it. Retired CIs stay off the diagram. So do CIs the hierarchy cannot place. The tab counts them.',
  'p:The build sets the defaults. Users change any setting on the tab. Their changes save with their index file. Only the settings that differ from the build save, so a new default still reaches every index that never changed it.',
  'ul:**Layout.** Top-down stacked, top-down tree, or left to right. Stacked puts children with no children of their own in columns under their parent, so a parent with dozens of children stays narrow.|**Block width and rows per stack.** The size of each block, and the height of each stack column.|**Levels shown.** How deep the drawing goes. A tag on a cut-off block counts the CIs below it.|**Block fields.** CI ID and name always show. Each field adds one line to every block, so all blocks stay the same size.|**Box styles.** A shade for each control tier. A dashed border for Proposed. A double border for Not Decomposed. A diamond where the control tier differs from the parent CI.',
  'p:The **Plain** chip on the tab turns every box style off in one click. A second press brings the styles back. To start every user on a plain diagram, uncheck all four default box styles.',
  'p:The tool keeps red, amber, and teal for flags, review items, and done. The diagram does not use them. The tier shades take their names from the Control Tier list. The other legend words are yours to edit.',
  'ul:**PDF.** Vector pages at the page size you set.|**PowerPoint.** One widescreen slide per page. Native shapes with editable text. Each connector glues to its two blocks and follows when a block moves.|**SVG.** A vector drawing for documents and web pages.|**PNG.** A picture for email and chat.',
  'p:Two export scopes exist. The current view exports what the user sees. The paged set exports the whole branch: an overview page, then one page per branch, with a page tag on each cut-off block. Turn either scope off. Levels per page sets the depth of each page. Auto picks the most levels that still print at about 55 percent of true size or more.',
  'ex:A 600-CI index on tabloid pages. Page 1 shows the top levels. Each subsystem with more below gets its own page. Its block on page 1 carries a tag such as Page 4.',
  'p:Every export carries a title block from the Index card: program, index document number, revision, index stage, date, and page. Each page carries a legend for the styles it uses.',
  'p:On the tab, the diagram sits in a canvas with scroll bars. A toolbar sets the zoom with a slider, Fit all, Fit width, and 100%. Full window fills the browser window. Users can also zoom with Ctrl and the wheel, or with a trackpad pinch. A large index opens at true size, centered on the top-level CI.',
  'p:The tab carries its own help panel. It explains the layouts, the fields, the box styles, the controls, and the exports to users.']},
 {id:'features',t:'Features and examples',b:[
  'p:Turn tabs, actions, and Excel sheets on or off. The Hierarchy tab is always on. It holds the editor. The Block diagram tab has its own page for its defaults.',
  'p:**Download Excel template** gives users a blank workbook in the layout the import reads. Users fill it in Excel and import it. The template follows this build: its columns, headers, lists, stages, and help text.',
  'ul:**About sheet.** Program, Index document number, Revision, and Index stage. The import copies them to the Index card. A blank cell leaves the Index card as it is.|**CI Index sheet.** The header row only. Headers in the accent color mark the minimum entry for a new CI, the columns of the first stage. Coded columns carry dropdowns.|**PN Variants sheet.** The header row only, when the PN Variants tab is on.|**Column notes.** Excel shows each column\u2019s note when a cell is selected. Each note comes from the column\u2019s help text and names the stage it falls due.|**Examples sheet.** The build\u2019s example rows. The import does not read it.|**Column Map and Lists.** The same sheets the Excel export carries.',
  'p:Change a column, a list, or a help text, and the next template follows. Tell users to download a new template after each build.',
  'p:Example rows let a new user see the tool working before entering real data. Replace them with a sample from your own program, or remove them.',
  'p:To make your own examples, type rows into the preview with Keep my entries on. Then press Use the preview’s current rows as the examples.']},
 {id:'text',t:'Text and the Reference tab',b:[
  'p:The text page sets the header, title, introduction, footer, and file names.',
  'p:Two asterisks on each side make a phrase bold: **like this**.',
  'p:The Reference tab is a list of sections. Each section is a bullet list, plain paragraphs, or a pull quote. Enter one item per line.',
  'p:Keep technical definitions word for word. Write the explanation around them in short sentences.']},
 {id:'theme',t:'Theme',b:[
  'p:The accent color marks buttons, flags, and selections. The ink color sets the header bar and table headings. The Excel header row uses the ink color too.',
  'p:Choose colors that read on a printed page. Red and amber already mean flag and review. Avoid them as the accent.']},
 {id:'preview',t:'Preview',b:[
  'p:The preview runs the real tool with the current build. It refreshes a moment after each change.',
  'ul:**Auto.** Refresh after each change. Turn it off for large edits, then press Refresh.|**Keep my entries.** Carry the rows you typed across refreshes.|**Start from.** Example rows or an empty index, used when nothing is kept.|**Width.** Full, or a phone at 390 pixels.|**Layout.** Side by side, preview below, editor only, or preview only.|**Pop out.** Opens the preview in its own window.',
  'p:Files saved from the preview come from the build under test. They are real files. Use them to test imports and exports.']},
 {id:'saving',t:'Saving, opening, and exporting',b:[
  'p:**Save build** writes a JSON file. It holds every setting. **Open build** reads it back.',
  'p:Open build also reads a tool HTML exported by this builder. Use that when the build file is lost. The tool carries its whole build inside it.',
  'p:**Export tool** writes the finished HTML. Send that file to users. It needs no install and no network.',
  'p:**Undo** and **Redo** step through your changes in this session. **Start over** returns to the default build. Undo brings your build back.',
  'p:Nothing is stored in the browser. Save the build before you close the tab.']},
 {id:'limits',t:'What the builder cannot change',b:[
  'ul:The logic of the built-in rules. You can turn them off, change their severity, and edit their words.|The logic of the metrics. You can turn them off, reorder them, and edit their words.|The logic of the block diagram. You can set its defaults, its exports, and its legend words.|The page layout and the tab set. You can hide tabs.|The hierarchy model. Every CI has one parent. One CI has no parent.|The Excel layout of the CI Index sheet. It follows the column order.',
  'p:For changes past these limits, the engine needs a code change. Bring the build file. It carries every setting, so nothing is retyped.']}
];
var HS={topic:'start'};
function mdh(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
function hitext(s,q){ var h=mdh(s); if(!q) return h; var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); return h.replace(/>([^<]+)</g,function(m,x){ return '>'+x.replace(re,'<mark>$1</mark>')+'<'; }).replace(/^([^<]+)/,function(m,x){ return x.replace(re,'<mark>$1</mark>'); }); }
function topicHTML(tp,q){
  return '<h2>'+esc(tp.t)+'</h2>'+tp.b.map(function(x){
    var k=x.slice(0,x.indexOf(':')), s=x.slice(x.indexOf(':')+1);
    if(k==='ul') return '<ul>'+s.split('|').map(function(y){ return '<li>'+hitext(y,q)+'</li>'; }).join('')+'</ul>';
    if(k==='ex') return '<div class="ex">'+hitext(s,q)+'</div>';
    return '<p>'+hitext(s,q)+'</p>';
  }).join('');
}
function renderHelp(){
  var q=tr($('help-q').value).toLowerCase();
  var list=HELP.filter(function(t){ return !q||(t.t+' '+t.b.join(' ')).toLowerCase().indexOf(q)>=0; });
  $('help-toc').innerHTML=list.map(function(t){ return '<button class="'+(t.id===HS.topic&&!q?'on':'')+'" data-htopic="'+t.id+'">'+esc(t.t)+'</button>'; }).join('')||'<p class="small" style="padding:10px 14px">No match.</p>';
  if(q) $('help-body').innerHTML=list.length?list.map(function(t){ return topicHTML(t,q); }).join('<hr style="border:0;border-top:1px solid var(--rule);margin:16px 0">'):'<p>No topic mentions "'+esc(q)+'".</p>';
  else $('help-body').innerHTML=topicHTML(HELP.filter(function(t){ return t.id===HS.topic; })[0]||HELP[0]);
}
function openHelp(id){ HS.topic=id||'start'; $('help-q').value=''; $('help-ov').classList.add('on'); $('helpp').classList.add('on'); renderHelp(); $('help-body').scrollTop=0; }
function closeHelp(){ $('help-ov').classList.remove('on'); $('helpp').classList.remove('on'); }
document.addEventListener('click',function(e){ var t=e.target.closest('[data-htopic]'); if(t){ HS.topic=t.dataset.htopic; $('help-q').value=''; renderHelp(); $('help-body').scrollTop=0; } });
$('help-ov').addEventListener('click',closeHelp);

/* ===================================================================
   Start
   =================================================================== */
B.cfg=upgrade(B.cfg);
renderAll(); setLayout(); refreshPreview(true);
</script>
