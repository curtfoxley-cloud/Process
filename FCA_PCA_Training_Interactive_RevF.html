<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configuration Audits: Interactive Training</title>
<style>
:root{
  --ink:#1E262E; --ink-2:#2C3841; --slate:#5C6D78; --mute:#8998A2;
  --paper:#FFFFFF; --surface:#F4F6F7; --surface-2:#EDF0F1; --rule:#D6DCDF;
  --rust:#A8481F; --rust-soft:#F2E4DD; --rust-ink:#7E340F;
  --teal:#1F5F5B; --teal-soft:#DFEAE8;
  --amber:#9A6508; --amber-soft:#F6ECD8;
  --alert:#8E2F2F; --alert-soft:#F4E2E2;
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --rail:290px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--surface);
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- header ---------- */
.top{
  position:sticky; top:0; z-index:40; background:var(--ink); color:#fff;
  display:flex; align-items:center; gap:16px; padding:0 20px; height:60px;
  border-bottom:1px solid #000;
}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#93A2AB}
.top .spacer{flex:1}
.who{display:flex;align-items:center;gap:8px}
.who label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#93A2AB}
.who input{
  background:#2C3841;border:1px solid #3D4B55;color:#fff;border-radius:4px;
  padding:6px 10px;font-size:13px;width:180px;
}
.who input:focus{outline:2px solid var(--rust);outline-offset:1px}
.tbtn{
  background:transparent;border:1px solid #46545F;color:#DCE3E7;border-radius:4px;
  padding:7px 12px;font-size:12.5px;white-space:nowrap;
}
.tbtn:hover{background:#2C3841;border-color:#5E6D77}
.tbtn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.tbtn.danger{border-color:#7A4A3A;color:#EBCDC2}
.tbtn.danger:hover{background:#4A2E26;border-color:#A85D45}
.tbtn.danger.armed{background:var(--rust);border-color:var(--rust);color:#fff;font-weight:600}
.railtoggle{display:none}

/* ---------- shell ---------- */
.shell{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto}
.rail{
  width:var(--rail); flex:0 0 var(--rail); background:var(--paper);
  border-right:1px solid var(--rule); min-height:calc(100vh - 60px);
  position:sticky; top:60px; max-height:calc(100vh - 60px); overflow-y:auto;
}
.railhead{padding:18px 20px 12px;border-bottom:1px solid var(--rule)}
.railhead h2{margin:0 0 3px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);font-weight:700}
.railhead p{margin:0;font-size:12px;color:var(--slate)}
.grp{padding:14px 0 6px}
.grp h3{
  margin:0 0 6px;padding:0 20px;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--slate);font-weight:700;
}
.nav{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;
  padding:7px 20px 7px 17px;display:flex;gap:10px;align-items:flex-start;line-height:1.35}
.nav:hover{background:var(--surface)}
.nav:focus-visible{outline:2px solid var(--rust);outline-offset:-2px}
.nav[aria-current="true"]{background:var(--surface-2);border-left-color:var(--rust)}
.nav .id{font-family:var(--mono);font-size:10.5px;color:var(--mute);flex:0 0 46px;padding-top:2px;letter-spacing:.02em}
.nav[aria-current="true"] .id{color:var(--rust-ink)}
.nav .nm{font-size:13px;color:var(--ink-2);flex:1}
.nav[aria-current="true"] .nm{font-weight:600}
.dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:5px;border:1.5px solid var(--rule);background:transparent}
.dot.work{border-color:var(--amber);background:var(--amber-soft)}
.dot.done{border-color:var(--teal);background:var(--teal)}

/* ---------- main ---------- */
main{flex:1;min-width:0;padding:0 0 80px}
.stage{max-width:820px;margin:0 auto;padding:34px 32px 0}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.recid{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--rust-ink);background:var(--rust-soft);
  padding:3px 8px;border-radius:3px;font-weight:700}
.status{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
h1.sect{font-family:var(--serif);font-size:31px;line-height:1.2;margin:0 0 6px;letter-spacing:-.2px}
.lede{font-size:15px;color:var(--slate);margin:0 0 22px}
.hr{height:1px;background:var(--rule);margin:0 0 26px}
p{margin:0 0 14px}
strong{font-weight:700}
ul.pl{margin:0 0 16px;padding-left:0;list-style:none}
ul.pl li{position:relative;padding-left:20px;margin-bottom:9px}
ul.pl li::before{content:"";position:absolute;left:3px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--rust)}

.callout{background:var(--surface);border-radius:6px;padding:16px 18px;margin:0 0 20px;border:1px solid var(--rule)}
.callout.teal{background:var(--teal-soft);border-color:#CBDDDA}
.callout .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:7px}
.callout.teal .lab{color:var(--teal)}
.callout p:last-child{margin-bottom:0}

.stmt{background:var(--ink);color:#fff;border-radius:6px;padding:20px 22px;margin:0 0 20px}
.stmt b{display:block;font-family:var(--serif);font-size:19px;line-height:1.35;font-weight:700}
.stmt span{display:block;margin-top:9px;font-size:13.5px;color:#B4C0C7}

.cards{display:grid;gap:12px;margin:0 0 20px}
.cards.c2{grid-template-columns:1fr 1fr}
.cards.c3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.card h4{margin:0 0 6px;font-size:14px;font-weight:700}
.card p{margin:0;font-size:13.5px;color:var(--ink-2)}

.steps{margin:0 0 20px;display:grid;gap:8px}
.step{display:flex;gap:12px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:11px 14px}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--rust);color:#fff;
  font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step.tl .n{background:var(--teal)}
.step .tx b{display:block;font-size:14px;margin-bottom:2px}
.step .tx span{font-size:13.5px;color:var(--ink-2)}

.tw{overflow-x:auto;margin:0 0 20px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
thead th{background:var(--ink);color:#fff;text-align:left;padding:9px 12px;font-size:12px;font-weight:700;letter-spacing:.02em}
tbody td{padding:9px 12px;border-top:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
tbody tr:nth-child(even) td{background:#FAFBFB}
td.k{font-family:var(--mono);font-size:12px;color:var(--rust-ink);white-space:nowrap}

/* ---------- knowledge check ---------- */
.check{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--rust);border-radius:6px;padding:18px 20px;margin:26px 0 0}
.check .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:8px}
.check .q{font-size:15.5px;font-weight:600;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--rule);border-radius:5px;margin-bottom:7px;cursor:pointer;background:var(--paper);font-size:14px}
.opt:hover{background:var(--surface)}
.opt input{margin:3px 0 0;accent-color:var(--rust);flex:0 0 auto}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt.wrong{border-color:var(--alert);background:var(--alert-soft)}
.opt.locked{cursor:default}
.fb{margin-top:11px;padding:12px 14px;border-radius:5px;font-size:14px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--teal-soft);border:1px solid #CBDDDA}
.fb.no{background:var(--alert-soft);border:1px solid #E8CFCF}
.fb b{display:block;margin-bottom:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.fb.ok b{color:var(--teal)} .fb.no b{color:var(--alert)}

/* ---------- exercises ---------- */
.exwrap{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;margin:0 0 18px}
.exwrap h4{margin:0 0 8px;font-family:var(--serif);font-size:18px}
.scen{background:var(--surface);border-radius:5px;padding:13px 15px;font-size:14px;margin-bottom:16px}
.part{margin-bottom:16px}
.part label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
textarea{width:100%;border:1px solid var(--rule);border-radius:5px;padding:10px 12px;font-size:14px;
  line-height:1.55;resize:vertical;min-height:76px;background:var(--paper)}
textarea:focus{outline:2px solid var(--rust);outline-offset:0;border-color:var(--rust)}
.count{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:4px;text-align:right}

/* ---------- buttons / footer nav ---------- */
.pager{display:flex;justify-content:space-between;gap:12px;margin:32px 0 0;padding-top:22px;border-top:1px solid var(--rule)}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:5px;padding:10px 18px;font-size:14px;font-weight:600}
.btn:hover{background:var(--surface)}
.btn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.btn.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.pri:hover{background:var(--rust-ink)}
.btn.gh{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}

/* ---------- start + submit ---------- */
.hero{background:var(--ink);color:#fff;border-radius:8px;padding:34px 34px 30px;margin-bottom:26px}
.hero .kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust-soft);margin-bottom:12px}
.hero h1{font-family:var(--serif);font-size:35px;line-height:1.15;margin:0 0 6px}
  .hero .subtitle{font-family:var(--serif);font-size:19px;line-height:1.3;color:#C9D3D9;margin:0 0 10px}
  .hero .scale{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rust-soft);margin:0 0 14px}
.hero p{color:#B4C0C7;margin:0;font-size:15px;max-width:60ch}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 22px;font-size:14px}
.meta dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);padding-top:3px}
.meta dd{margin:0}
.transmit{border:1px solid var(--rule);border-radius:6px;background:var(--paper);overflow:hidden;margin-bottom:22px}
.transmit .hd{background:var(--surface-2);padding:12px 18px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.transmit .hd b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.transmit .hd span{font-family:var(--mono);font-size:11px;color:var(--slate)}
.transmit .bd{padding:18px}
.scorebox{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.scorebox .big{font-family:var(--serif);font-size:42px;font-weight:700;line-height:1}
.scorebox .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate)}
.gaps{margin-top:14px}
.gaps li{font-size:13.5px}
.note{font-size:13px;color:var(--slate);margin-top:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:5px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.warn{background:var(--amber-soft);border:1px solid #E4D3AE;border-radius:5px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.setup{font-size:13px;color:var(--slate);border-top:1px solid var(--rule);margin-top:26px;padding-top:16px}
.setup code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:3px}

.fadein{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:760px){
  .top{padding:0 12px;gap:8px}
  .brand{display:none}
  .lng{display:none}
  .who{flex:1;min-width:0}
  .who label{display:none}
  .who input{width:100%;min-width:0}
}
@media(max-width:900px){
  .cards.c3,.cards.c2{grid-template-columns:1fr}
  .rail{position:fixed;top:60px;left:0;bottom:0;z-index:35;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0);max-height:none}
  .rail.open{transform:none;box-shadow:2px 0 24px rgba(0,0,0,.25)}
  .railtoggle{display:inline-block}
  .stage{padding:26px 18px 0}
  .who input{width:120px}
  h1.sect{font-size:26px}
  .hero{padding:26px 22px}
  .hero h1{font-size:28px}
}
</style>
</head>
<body>

<header class="top">
  <button class="tbtn railtoggle" id="railToggle" aria-label="Show section register">Sections</button>
  <div class="brand">
    <b>Configuration Audits : Functional and Physical</b>
    <span id="brandSub">Interactive modules</span>
  </div>
  <div class="spacer"></div>
  <div class="who">
    <label for="who">Trainee</label>
    <input id="who" type="text" placeholder="Your name" autocomplete="name">
  </div>
  <button class="tbtn" id="btnSave">Save<span class="lng"> progress</span></button>
  <button class="tbtn" id="btnLoad">Resume</button>
  <button class="tbtn danger" id="btnClear" title="Erase every answer, check, and the trainee name">Clear<span class="lng"> all</span></button>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Section register"></nav>
  <main><div class="stage" id="stage"></div></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ==========================================================================
   TRAINER SETUP: edit this block, save the file, then share it.
   Nothing else in this file needs changing.
   ========================================================================== */
var CONFIG = {
  companyName:   "[Company]",
  trainerName:   "your CM trainer",
  trainerEmail:  "",            // e.g. "cm.lead@company.com" (enables the Email results button)
  submitEndpoint:""             // optional: a URL that accepts a JSON POST (Power Automate, Forms webhook, etc.)
};

/* ==========================================================================
   CONTENT
   ========================================================================== */
var P = function(t){return {t:"p", x:t};};
var L = function(a){return {t:"list", x:a};};
var C = function(lab,lines,tone){return {t:"callout", lab:lab, x:lines, tone:tone||"rust"};};
var S = function(b,sub){return {t:"stmt", x:b, sub:sub||""};};
var CARDS = function(items,cols){return {t:"cards", x:items, cols:cols||3};};
var TABLE = function(head,rows,opt){var o={t:"table", head:head, x:rows}; if(opt&&opt.nokey) o.nokey=true; return o;};
var STEPS = function(items,tone){return {t:"steps", x:items, tone:tone||""};};

var MODULES = [
{
 id:"A1", label:"Module 1", title:"What a configuration audit is",
 sub:"The two audits, what each one formalizes, and how a configuration item (CI) earns one.",
 sections:[

  {id:"A1-01", title:"The two audits", body:[
    P("Two questions get asked about every product before anyone can honestly say it is finished. The first is whether the design does what it was required to do, and whether that can be proved from evidence rather than asserted from confidence. The second is whether the article on the bench is actually the article the drawings and the code describe."),
    P("These are different questions. They are answered by different people, from different evidence, at different moments. Each has its own formal audit."),
    CARDS([
      {h:"The functional configuration audit", b:"Does the CI do what it was required to do, and can you prove it? A formal verification of the CI's tested performance against its approved functional and allocated documentation. It also confirms that specifications and interfaces are accurately and adequately defined, and that the change control system genuinely controls how documentation is processed and released."},
      {h:"The physical configuration audit", b:"Is the thing you built the thing the documentation describes? A formal examination of the as-built, or as-coded, configuration of a validated CI against its product documentation, confirming that documentation is a clear, complete and accurate representation of what was actually produced."}
    ],2),
    P("Both are defined in **EIA-649-1A**, the configuration management standard the organization's process is built on. In conversation you will hear both shortened to three letters. This training uses the words, because the words carry the meaning and the letters do not."),
    C("What each audit cannot tell you",[
      "A successful functional audit says nothing about whether *this unit* was built to the drawings. A design can be fully proven and the article in front of you still wrong.",
      "A successful physical audit says nothing about whether the design was ever proven correct. A unit can match its documentation perfectly and the documentation still describe something that does not meet its requirements.",
      "Neither audit covers the other's ground. That is why there are two."
    ]),
    S("The functional audit asks whether the design was proven. The physical audit asks whether this unit is that design.",
      "Nearly everything else in this training follows from keeping those two questions apart."),
    C("Where this applies",[
      "The organization's process covers hardware CIs, software CIs and firmware, at lower-tier incremental levels and at the system level, and it applies to audits held at the organization's own facilities and at sub-supplier facilities alike.",
      "Where a contract imposes differing requirements, the contract governs, and the deviation is recorded in the program configuration management plan. Silence in a contract is not the same as a differing requirement. A point section 2 of this module returns to."
    ],"teal")
  ], check:{
    q:"A production unit passes every acceptance test it is given. Months later a customer finds that one installed connector is a different part from the one on the released drawing. Which audit exists to catch that, and why?",
    o:["The functional audit, because an incorrect part is a performance question",
       "Neither. Acceptance testing already demonstrated that the unit performs as required",
       "The functional audit, because the drawing is part of the approved documentation",
       "The physical audit, which compares the built article against the product documentation"],
    a:3,
    why:"Passing tests tells you the unit performs. It does not tell you the unit matches its documentation, and those are two separate claims. The functional audit is tempting here because a wrong part sounds like it must affect performance, but that audit works from test evidence against requirements, not from hardware against drawings. Comparing the built article to the product documentation is exactly and only what the physical audit does."
  }},

  {id:"A1-02", title:"Why these audits are not optional here", body:[
    P("Most configuration management requirements arrive through the contract. A subset of them arrives twice, through the contract and, independently, through the organization's safety management system, because those requirements act as barriers to severe safety events."),
    P("That subset is the **set of requirements mandatory for safety.** On safety-significant product lines, requirements mandatory for safety are performed regardless of what the contract flows down. Several of them are audit requirements:"),
    L([
      "Conducting the functional audit to verify the CI meets its performance requirements against the approved functional and allocated documentation.",
      "Documenting every functional-audit non-compliance and providing it to the Acquirer.",
      
      "Providing the requirements-to-test traceability matrix, in which each requirement maps to a test step. It is reconciled against the allocation matrix so that every allocated requirement is accounted for.",
      "Conducting the physical audit to verify the product documentation is consistent with the validated CI.",
      "Confirming the CI against the approved parts selection list and verifying that the proper parts are actually installed.",
      "Documenting every physical-audit non-compliance and providing it to the Acquirer.",
      "Identifying the differences between the production unit and the unit used at the functional audit."
    ]),
    P("That list is not assembled here. It is the set of entries in the enterprise register of safety-mandatory CM requirements that this process performs, and the register is what decides membership. Nothing gets added to the list locally, and nothing gets dropped from it locally."),
    P("The requirements allocation matrix is worth a word, because it sits next to that list without being on it. It is an entry criterion for the functional audit and the traceability matrix is reconciled against it. It is not itself an entry in the register. Providing the requirements-to-test traceability matrix is."),
    P("Each of those is anchored to events that have already happened, investigated and on the record."),
    TABLE(["Anchor event","What it demonstrates"],[
      ["Alaska Airlines 1282, 2024","A door plug was installed without all four retention bolts. The as-built configuration diverged from the approved configuration, and no record flagged it. This is the class of physical non-conformance the physical audit exists to catch before delivery."],
      ["KC-46 tanker deliveries, 2019 to 2022","Tools, rags and debris repeatedly found inside delivered aircraft, and repeated quality escapes between development articles, early production articles and full-rate production. Deliveries were halted more than once and rework ran to hundreds of millions. The second pattern is what the production-unit versus functional-audit-unit difference requirement exists to detect."],
      ["Software-controlled flight systems","Systems whose behavior in edge conditions was not fully verified against requirements have contributed to multiple high-consequence events. Confirming that every requirement maps to a test step that passed is the functional audit's specific contribution."]
    ]),
    P("Because these are mandatory for safety, a proposal not to perform one is not a tailoring decision the program makes on its own. It goes through the **safety disposition gate**. The gate has exactly three doors. Perform it. Replace it with a documented equivalent control, where independent safety assurance validates that the control addresses the same hazard. Or formally accept the risk, at the authority matching the severity already recorded for that requirement. A vice-president for severe, the chief executive for catastrophic. The severity is looked up, not re-argued at the gate."),
    S("A barrier is not removed by deciding it is unnecessary. It is removed by someone accepting in writing, at the severity it carries, what happens when it is absent.",
      "There is no fourth door, and silent omission is the failure the gate exists to close.")
  ], check:{
    q:"A contract is silent on the physical audit, and the program proposes to skip it on a safety-significant product line. What does the organization's process require next?",
    o:["Nothing further. The contract governs, so the audit is not required on this program at all",
       "The proposal goes to the safety disposition gate, which offers three doors and no fourth",
       "The program manager records the decision in the audit plan and the program proceeds",
       "The audit is skipped now and picked up at the next contract modification, if one ever comes"],
    a:1,
    why:"Leaning on the silent contract is tempting because it is half true. Where a contract imposes a differing requirement, the contract does govern, and the deviation is recorded in the program plan. But silence is not a differing requirement, and the obligation arrives through the safety management system as well as the contract. Recording a decision in a plan is not one of the three doors. It documents the choice without anyone accepting the consequence."
  }},

  {id:"A1-03", title:"The words you will meet", body:[
    P("Audits are described in a vocabulary that is precise and almost never explained. Learn these now and the rest of the training reads normally."),
    C("Two shorthands, used throughout",[
      "**Configuration item is shortened to CI.** Wherever this training means a configuration item, it says CI.",
      "**The word item is reserved for the other things that carry it**, and each of those is always qualified: a **child item** is a part inside a CI; an **end item** is the assembled product; a **vendor item** is a commercial or catalog article; an **action item** is a finding\u2019s closure record; a **plan item** is an entry on a certification plan.",
      "So CI always means a configuration item, and item on its own never does.",
      "The two audits keep their full names. FCA and PCA are common in conversation and the letters hide the difference this training exists to teach."
    ]),
    TABLE(["Term","What it means"],[
      ["The Acquirer","The customer buying the product. The Acquirer approves baselines, co-chairs audits, jointly selects the unit examined at the physical audit, and dispositions audit results."],
      ["The Supplier","The organization delivering under the contract. To your customer, that is your company. To your own suppliers, your company is the Acquirer. The roles are positions in a chain, not fixed identities."],
      ["Design activity","The organization holding design authority for a CI and owning its documentation. It may be your company, a supplier, or the customer."],
      ["Configuration baseline","An agreed-to definition of the attributes of a product at a point in time, identifying a known configuration to which changes are addressed. Baseline types are functional, allocated, and product. In plain terms: a baseline plus its approved changes is the currently approved configuration. Defined by the CI identification process."],
      ["Functional documentation","One of the three parts of **configuration documentation**, which is technical documentation whose primary purpose is to identify and define a product's performance, functional, and physical attributes. The functional part carries the system-level performance requirements and how they will be verified. It answers: what must the system as a whole do? Defined by the CI identification process."],
      ["Allocated documentation","The second part of configuration documentation. Those requirements divided up and assigned to each CI, together with its interfaces. It answers: what must this CI do, given what the system must do? Defined by the CI identification process."],
      ["Product documentation","The third part of configuration documentation. The released design: drawings, models, source code, detail specifications, acceptance requirements. It answers: how is this CI actually made, and how is a unit accepted? Defined by the CI identification process."],
      ["Status accounting","The record system holding, for every CI and every unit, what the approved configuration is and what was actually built, changed or repaired. It is also where the as-designed to as-built reconciliation is performed, at scale, on records."],
      ["Technical data package","The released product documentation delivered to whoever must build, inspect or support the CI. A delivery of product documentation, not a fourth kind of requirement."],
      ["Performance specification","States what a CI must achieve and leaves the design open."],
      ["Detail specification","States how the CI is built. Materials, dimensions, processes."],
      ["Developmental configuration","A supplier's own evolving design description before it is baselined for the customer. It matters most for software, where the working library is the design."],
      ["As-designed configuration","The configuration defined by the released design at a stated revision, including approved changes at their stated effectivity. In plain terms: what the released documentation says the CI is. Defined by the sub-supplier CM flow-down process."],
      ["As-built configuration","The configuration actually manufactured and assembled in a specific delivered unit or lot, evidenced by closed work orders, dispositioned nonconformance records, and part traceability records. In plain terms: what a particular unit physically is, as produced. Defined by the sub-supplier CM flow-down process."],
      ["As-maintained configuration","What that unit is now, after repair, retrofit and service life."],
      ["Effectivity","The point at which an approved change takes effect, stated as a unit, lot, line number, or date. It answers which unit is the first to carry the change. Defined by the sub-supplier CM flow-down process."]
    ]),
    S("A baseline plus its approved changes is the currently approved configuration. Every audit is a comparison against that.",
      "When someone asks what an audit is checking against, this is the answer, whichever audit they mean.")
  ], check:{
    q:"Requirements for a system have been agreed, then divided up so that each CI carries its own share plus its defined interfaces. Which documentation set has just been described, and which audit works against it?",
    o:["Product documentation, which the physical audit works against",
       "Allocated documentation, which the functional audit works against",
       "Functional documentation, which the physical audit works against",
       "The technical data package, which both audits work against"],
    a:1,
    why:"Requirements divided up and assigned to individual CIs with their interfaces is the allocated set; the system-level statement above it is the functional set. The functional audit works against both. Product documentation is the released design, drawings, models, code, and that is what the physical audit compares hardware against. The technical data package is a delivery of product documentation, which is why it is not a separate answer."
  }},

  {id:"A1-04", title:"What a CI is, and why only some are audited", body:[
    P("This training has been saying *CI*. It is time to be precise about what one is, because two separate narrowings sit between everything in the product and everything that gets audited. People collapse them constantly. The most common form of that mistake is believing that every CI receives a functional and physical audit. **It does not.** Most CIs are never formally audited. Being a CI and being audited are two different decisions, made by two different screens, at two different times, against different criteria."),
    P("A **CI** is any hardware, software, firmware, or aggregation thereof that satisfies a system end-use function and is designated for separate configuration management. Designation includes establishing the CI\u2019s requirements and verifying that its configuration meets those requirements and that its configuration documentation accurately describes its configuration."),
    P("Read that second sentence again, because the two audits are inside it. Verifying that the configuration meets its requirements is the functional audit. Verifying that the documentation accurately describes the configuration is the physical audit. They are not activities bolted onto configuration management. They are part of what designating something as a CI means."),
    P("In plain terms: a CI gets its own documentation, its own identifier, its own baselines and its own change control. Everything else in the product is managed inside the documentation of the CI it belongs to."),
    P("Three gates decide whether a candidate can be screened at all. All three must be passed before the selection criteria are run."),
    L([
      "**Item gate.** The candidate has to be an item, rather than a function, a task, a failure mode, a feature or a location. A candidate that is not an item cannot be designated as a CI. It is a signal that candidates worth screening sit nearby, so ask for the things that implement it and screen those.",
      "**End-use function gate.** The candidate has to satisfy a system end-use function. Raw material, a bulk commodity, a purely structural element with no defined functional role: none of these is a CI, and each is controlled within its parent CI\u2019s configuration documentation.",
      "**Supplier-designed parent gate.** The candidate must not be a child of a commercial off-the-shelf, catalog or vendor item procured inseparable from that parent. Where it is, screen the procured parent CI instead. Do not decompose a supplier-designed CI to run this screen."
    ]),
    P("Then the selection criteria. A candidate that passes all three gates is designated as a CI if it meets or affects any one of these:"),
    L([
      "It is **critical to the functioning** of the system.",
      "Its **failure might cause serious injury, loss of life, or loss of primary system capability.**",
      "Its **technology is complex and not well understood**, and is critical to the acquisition, operational or supportability goals of the program.",
      "It is **under control as designated by the Acquirer.**",
      "It requires **separate type designation, versions or nomenclature.**",
      "It is **critical or high risk** and its failure would have significant financial impact.",
      "It requires **logistics elements**. Provisioning lists, test equipment, technical manuals, tag-out procedures."
    ]),
    P("Software is designated as CIs in its own right. Select at the level where things are specified, contracted, accepted and supported. Designate too high and you lose visibility of what is changing. Designate too low and the change traffic becomes unmanageable. Some CIs are controlled by the Acquirer, specified, baselined and controlled by them, and below that level the Supplier decides what to manage internally and how."),
    P("The third gate needs a word of its own, because it decides how a whole class of CIs gets audited. A supplier-designed CI procured as a unit is a CI at the level you procure it. You do not decompose it."),
    L([
      "**Not decomposing is not the same as not controlling.** Part attributes still apply inside the CI. Safety-critical, life-limited and special-handling designations still reach the parts within it.",
      "**The CI can still be designated for audit.** A procured engine, or a catalog power supply, can be designated for a physical audit at the level you buy it. The supplier\u2019s audit role then follows from the type of work that supplier performs.",
      "**Interfaces at its boundary are still registered.** The boundary between the procured CI and what it connects to is a boundary in your CI structure, and it carries defining documentation like any other.",
      "**The supplier still holds its own internal structure.** They manage what is inside the CI. You manage the CI and its boundary."
    ]),
    P("Now the funnel, which is the point of this section."),
    STEPS([
      {h:"Everything in the product",b:"Parts, materials, processes, software, documentation. All of it is made, inspected and controlled. Most of it is not separately managed."},
      {h:"CIs",b:"The subset selected against the criteria above. Each carries its own documentation, identifier, baselines and change control. A program may have hundreds."},
      {h:"CIs designated for audit",b:"A much smaller subset again, chosen by the designation assessment covered later in this module. A program with hundreds of CIs may audit a handful."}
    ]),
    S("Being a CI decides what is managed separately. Audit designation decides which of those CIs get a discrete validation event.",
      "Two different questions, answered by two different assessments, each with its own record."),
    C("The two errors this produces",[
      "**“It is a CI, so it will be audited.”** No. Most CIs are never audited, and nothing is wrong with that.",
      "**“It is not being audited, so it is not really controlled.”** Also no. CIs carry documentation, identifiers, baselines and change control whether or not an audit ever visits them.",
      "Both errors come from treating one selection as if it were the other."
    ])
  ], check:{
    q:"A program has two hundred and forty CIs. Eleven are designated for audit. A new engineer concludes that the other two hundred and twenty-nine are not really under configuration control. What is wrong with that conclusion?",
    o:["Being a CI is what gives it documentation, an identifier, baselines and change control",
       "Nothing at all. Audit designation is what puts something under configuration control here",
       "The other CIs are controlled only where the Acquirer has designated them as Acquirer-controlled",
       "The conclusion holds for hardware but not for software, which is always audited"],
    a:0,
    why:"The two selections are being collapsed into one. Selection as a CI is what puts something under separate management, and it has already happened for all two hundred and forty. Acquirer control is a third and different distinction. It decides who baselines and controls the CI, not whether it is controlled at all."
  }},

  {id:"A1-05", title:"Audit designation: how a CI earns an audit", body:[
    P("Some CIs are audited because a contract says so. The rest are assessed, CI by CI, against a four-part question set. Complete the assessment at initial audit planning, again at every revision of the program configuration management plan, and again on any trigger event."),
    STEPS([
      {h:"Part A. Mandatory designation for audit",b:"Is the CI named in the contract, the statement of work or the configuration management plan as requiring an audit? Is it an Acquirer-controlled CI whose product baseline the Acquirer will formalize at physical audit completion, which requires a physical audit, because that audit is the formalizing event? Any yes designates the CI for audit, to the scope the contract sets. **The assessment then continues anyway**, because the remaining parts can widen that scope: adding a delta audit of open scope, or pulling an increment earlier."},
      {h:"Part B. Safety criticality",b:"Does the CI implement or host a hazard risk control recorded in the hazard log? Was it selected because its failure might cause serious injury, loss of life or loss of primary system capability? Does its credible failure consequence sit in the top two severity bands, using the pre-anchored severity where one is recorded? Is it safety-critical software, or firmware embedded in a safety-critical device? Is it a single point of failure for a safety-related function? **Any yes designates the CI for audit.** There is no threshold to count against and no concurrence route around it. A proposal not to perform an audit a CI is designated for goes to the safety disposition gate, like every other requirement mandatory for safety."},
      {h:"Part C. Risk factors",b:"New or novel design rather than proven heritage. Substantive design change since the last audit. New or changed manufacturing source, process, facility or tooling. A sub-supplier building the CI, or a critical component of it, determined less than effective under the sub-supplier CM flowdown process. New or changed sub-tier supplier for the CI or its critical components. A history of escapes, non-conformances, foreign-object findings or subcontractor disclosures. Findings of work performed not to approved data, or of inaccurate, incomplete or ambiguous manufacturing data. Reconciliation health anomalies. Aging differences between as-designed and as-built, an unincorporated-change backlog, serial or effectivity discrepancies. Never audited, or a prior audit with an open delta or unresolved actions. **Two or more designate the CI for audit. One is recorded and monitored.**"},
      {h:"Part D. Reassessment triggers",b:"Re-run the assessment on any of: substantive design, process, facility, tooling or supplier change; a new escape or safety event traceable to the CI; a reconciliation anomaly; a hazard log revision that adds a risk control to the CI; a revision of the configuration management plan; and an effectiveness determination of less than effective for a supplier building the CI. Module 7 returns to that last one, because it is the trigger that arrives from outside the program."}
    ]),
    P("The disposition is more granular than yes or no. It records which audits apply, functional, physical, both, and separately whether a delta audit of open scope is required. Where the audit will be initiated internally rather than chaired by the Acquirer, that is recorded too."),
    P("The assessment carries a written rationale. Configuration management and Systems Engineering sign it. **System Safety signs whenever any safety question was answered yes**, not only when the CI is being left undesignated. Complete and retain an assessment for **every CI evaluated, designated for audit or not**, for the life of the program."),
    C("Three mistakes people make with this",[
      "Stopping at Part A when the answer there is yes. Contract designation for audit sets a minimum on scope, not a ceiling.",
      "Treating a single risk factor as nothing. One factor is recorded and monitored precisely so that the second one changes the answer instead of arriving unnoticed.",
      "Not recording an assessment for CIs that were not designated for audit. The undesignated assessments are the ones that show the judgment was made rather than skipped."
    ])
  ], check:{
    q:"A CI is not named in any contract document and answers no to every safety question. Its design is new rather than proven heritage, and it will be built at a facility that has never produced it before. Nothing else applies. What is the outcome?",
    o:["Not designated for audit. Every one of the safety questions here was answered no",
       "Designated. Two risk factors are present, and two or more designate the CI",
       "Recorded and monitored on the assessment form, but not designated for audit",
       "Designated by Part B, because a new design built at a new facility raises a safety question"],
    a:1,
    why:"Recorded-and-monitored is the tempting answer because it is the correct handling of *one* risk factor, but there are two here: new design, and a new manufacturing facility. Two or more designate the CI for audit. Part B designates a CI for audit outright, without counting, but every safety question here was answered no. Part B never engages. Part C produces this answer, and it produces it by counting."
  }},

  {id:"A1-06", title:"Being a CI is not the same as being audited", body:[
    P("This is the single most common misunderstanding about configuration audits. It appears in two opposite forms, depending on who is holding it."),
    CARDS([
      {h:"Heard from audit teams", b:"\u201cIt is a CI, so it needs an FCA and a PCA.\u201d This is wrong. The CI selection criteria and the audit designation assessment are two different screens. Passing the first says the CI is managed separately. It says nothing about whether the CI is audited."},
      {h:"Heard from supplier management teams", b:"\u201cThis supplier designs and builds under a source control drawing, so they conduct audits.\u201d Also wrong. Work type never decides whether an audit happens. It decides only what part the supplier plays if one does."}
    ],2),
    C("Two screens, two questions, in this order",[
      "**The CI selection criteria ask: should this CI be managed separately?** They run at identification and re-run when the facts move. A yes means the CI gets its own specification, identifier, baseline, and change control. Nothing in that screen mentions audits.",
      "**The audit designation assessment asks: should this CI receive a formal audit?** It runs on CIs, not on everything. Parts A and B can designate a CI for audit on their own. Part C designates a CI for audit on two or more risk factors, and a single factor is recorded and monitored. Part D re-runs the whole assessment when the facts change.",
      "**Only the second screen produces an audit.** A CI that fails the first screen is not a CI and can never be audited, because audits are audits of CIs. A CI that passes the first and fails the second is a CI that is not audited, and that is the normal case."
    ]),
    S("Most CIs are never audited, and that is the design working.",
      "Audits are expensive, disruptive, and slow. Designating everything would consume the budget that makes designation for audit meaningful, and it would tell you nothing about which CIs actually carry risk. If every CI were audited, designation for audit would not be a selection at all."),
    P("What an undesignated CI still gets is substantial, and this is where the audit team error does real harm. It still has its own specification, its own baselines, its own change control, and its own status accounting. It is still covered by the as-designed to as-built reconciliation that runs continuously at scale. The verification machinery does not switch off. The audit is a periodic check on that machinery, not a replacement for it. **An undesignated CI is not an unverified CI.**"),
    C("What each screen does not do",[
      "The CI selection criteria do not designate anything for audit. There is no criterion in that list about audits.",
      "The audit designation assessment does not decide what is a CI. It runs on CIs that are already CIs.",
      "A supplier work type does not designate anything for audit either. It is not a screen at all. It describes what the supplier does, and it becomes relevant only after designation for audit has already happened."
    ])
  ], check:{
    q:"A program has 140 CIs. The audit designation assessment has been run on all of them, and eleven are designated for audit. A new engineer asks why the other 129 are not being audited. What is the correct answer?",
    o:["Designation is a separate and narrower screen. Those 129 were assessed and did not meet it",
       "They will be audited later, once the schedule allows for them",
       "They are exempt because they sit at lower tiers of the product structure beneath the system",
       "The assessment was run incorrectly, because every CI requires a functional and physical audit"],
    a:0,
    why:"Audits are selected, not universal. The 129 undesignated CIs are neither unmanaged nor unverified. They carry their own baselines, change control, and status accounting, and they sit inside the at-scale reconciliation. What they do not carry is a formal audit event. The recorded assessment for each of them is what proves the decision was made rather than skipped."
  }},

  {id:"A1-07", title:"Answering the assessment: evidence, not opinion", body:[
    P("The assessment is only as good as the answers put into it, and every question has a place its answer comes from. An assessment completed from memory in a meeting is a set of opinions with signatures on it."),
    P("Configuration management answers every question. It answers them by reading documentation. Each row below names the documentation set the answer is derived from, and the function that owns and maintains it. **The owning function supplies the documentation. It does not supply the answer.** Where the documentation is clear, configuration management reads the answer out of it and records the source. Where the documentation is unclear, silent on the item, or in question, configuration management marks the answer open and escalates to that function for input."),
    S("Read the FMECA first. Call RM&SH second.",
      "Configuration management opens the failure modes, effects and criticality analysis to see whether the item is associated with a safety-related function. If the analysis answers, that is the answer, and the analysis is the source. If the analysis is unclear, RM&SH is who you ask. That order is the whole model, and it holds for all sixteen questions."),
    TABLE(["What the question asks","Documentation the answer is derived from","Function that owns that documentation"],[
      ["Named in the contract, statement of work or plan","The contract file and the program configuration management plan","Contracts and configuration management"],
      ["Acquirer-controlled, with the Acquirer formalizing the product baseline at audit completion","The item index and its control designations","Configuration management"],
      ["Implements or hosts a hazard risk control","The hazard log, and the analyses behind it","System Safety"],
      ["Selected because failure might cause serious injury, loss of life or loss of primary system capability","The CI's selection record. The criteria assessment that made it a CI","Configuration management, with System Safety"],
      ["Credible failure consequence in the top two severity bands","The pre-anchored severity where one is recorded; otherwise the program risk matrix","System Safety"],
      ["Safety-critical software, or firmware in a safety-critical device","The software criticality assessment","Software engineering with System Safety"],
      ["Single point of failure for a safety-related function","The failure modes, effects and criticality analysis and the single point failure identification","RM&SH"],
      ["New or novel design rather than proven heritage","Design history, the released design definition, and whatever fielded evidence the heritage claim actually rests on. On a certificated program, also the certification basis, the previously approved data and the certification credit position","Systems Engineering and Design Engineering jointly. Airworthiness and Certification as well, where the program has a certification basis"],
      ["Substantive design change since the last audit","Change records against the CI since the last audit date. On a certificated program, the change classification","Configuration management, with Systems Engineering and Design Engineering, and Airworthiness and Certification where the program has a certification basis"],
      ["New or changed manufacturing source, process, facility or tooling","Process and tooling change records; the procurement record where the source moved","Manufacturing and supply chain"],
      ["New or changed sub-tier supplier for the CI or its critical components","Procurement records and the supplier classification log","Supply chain with configuration management"],
      ["History of escapes, non-conformances, foreign-object findings or subcontractor disclosures","Quality and safety data for the CI **and for its production line**","Quality Assurance"],
      ["Findings of work not to approved data, or inaccurate or incomplete manufacturing data","Quality findings against the CI or the line","Quality Assurance"],
      ["Reconciliation health anomalies","Status accounting indicators: aging as-designed to as-built differences, unincorporated-change backlog, serial and effectivity discrepancies","Configuration management"],
      ["Never audited, or a prior audit with an open delta or unresolved actions","Audit records and the prior minutes","Configuration management"],
      ["A sub-supplier building the CI, or a critical component of it, determined less than effective","The effectiveness determination record for that supplier","Configuration management"]
    ]),
    P("Read the middle column as the documents to pull before the assessment meeting. Read the right column as the people to call when a document does not settle the question. Neither column is a list of people who answer for you. Most of these answers take a day to obtain and five minutes to guess."),
    C("The answer that costs the most",[
      "**A \u201cno\u201d that means \u201cnobody checked\u201d.** It is indistinguishable, on the form, from a no that somebody established. Both are a blank space where a hazard could have been.",
      "\u201cI do not know yet\u201d is a legitimate interim state. Mark the answer open, name the function that owns the documentation as its owner, give it a date, and do not sign the assessment until it resolves. What is not legitimate is converting it silently into a no because the meeting needs to finish.",
      "The same applies to a heritage claim. **Proven heritage is a claim about evidence**, and the evidence is the fielded history of that design in that application. A design that is unchanged but has never flown in this environment is not heritage; it is a new application of an old drawing. Three functions hold that evidence between them. Systems Engineering and Design Engineering hold the design history and the released design definition. On a program with a certification basis, Airworthiness and Certification holds the certification basis, the previously approved data and the certification credit position, and a heritage claim has to survive that test as well as the service history one."
    ]),
    S("A no that means nobody checked is the most expensive answer on the form.",
      "It reads exactly like a no that somebody established, and only one of them is true.")
  ], check:{
    q:"At an assessment meeting, the question about escape and non-conformance history is answered no. Asked how that was established, the assessor says they have not seen anything come across their desk about this CI. What is the correct handling?",
    o:["Accept the no. The assessor is the person closest to the CI and sees what comes in",
       "Treat it as unresolved. The answer comes from quality and safety data nobody has read yet",
       "Record it as a yes, since the absence of evidence cannot be relied upon here",
       "Record the no and note the basis in the rationale, which is what that field is for"],
    a:1,
    why:"Recording the no with its weak basis in the rationale is the tempting answer, because it looks honest and it does leave a trace. But the rationale field explains a determination; it does not substitute for making one, and downstream nobody re-reads it. Flipping to yes is equally wrong. It invents a finding. The answer is that this question has not yet been answered. Configuration management still answers it, by reading the quality and safety data. Quality Assurance owns that data and is who you escalate to if reading it does not settle the question."
  }},

  {id:"A1-08", title:"Which audit: functional, physical, or both", body:[
    P("A CI has a new machining source and an escape history on its production line. No requirement has changed. No design change has been released. Its design was verified two years ago at a functional audit that closed clean. That CI needs a physical audit. A functional audit would re-prove a design nobody has questioned, at the cost of the audit that would have caught the real risk."),
    P("Designation answers whether a CI gets an audit. **Scope answers which one.** Those are two separate reads of the same assessment, and the second one is read from where the factors sit."),
    C("Start from what each audit asks",[
      "The functional audit asks whether the design was proven against its requirements. Doubt about requirements, verification evidence, or the configuration that was tested points here.",
      "The physical audit asks whether this unit is that design. Doubt about manufacture, about records, or about as-designed to as-built agreement points here.",
      "A factor is not a vote. It is evidence about one of those two questions. Read which question it touches, and the scope follows."
    ]),
    TABLE(["Where the factor sits","Audits it points to","Why"],[
      ["Named in the contract, statement of work or plan","As the contract names, and no less","Part A is settled by reading the contract. The contract can name a functional audit, a physical audit, or both. The assessment can widen that scope. It can never narrow it."],
      ["Acquirer-controlled CI whose product baseline the Acquirer formalizes at audit completion","Physical audit at minimum","The physical audit is the formalizing event for the product baseline. No other event reaches it."],
      ["Any safety question answered yes","Both","A safety yes designates the CI for audit and sets the scope at both. A hazard risk control has to be proven in the design and confirmed in the article. Those are two different assurances, and one audit produces each."],
      ["New or novel design rather than proven heritage","Functional audit","The doubt is whether the design meets its requirements. That is the functional audit question, and nothing about manufacture is in question yet."],
      ["Substantive design change since the last audit","Functional audit, and a physical audit where the change reached the article or the code","A change to requirements or design reopens verification. A change embodied in hardware or software also reopens the as-built comparison."],
      ["New or changed manufacturing source, process, facility or tooling","Physical audit","The design did not move. What moved is how the article is made, so what is in question is whether the article coming off the new process is the design."],
      ["New or changed sub-tier supplier, or a sub-supplier determined less than effective","Physical audit","Same reason. The design did not move. The way the article is made and recorded did."],
      ["History of escapes, non-conformances, foreign-object findings or subcontractor disclosures","Physical audit","Escapes are evidence about manufacture and inspection. They say nothing about whether the requirements were verified."],
      ["Findings of work not to approved data, or inaccurate or incomplete manufacturing data","Physical audit","The gap is between the design data and what was built or instructed. That is exactly what the physical examination compares."],
      ["Reconciliation health anomalies","Physical audit","A reconciliation anomaly is direct evidence about the as-designed to as-built machinery for this CI."],
      ["Never audited","Both","Nothing has been established on either question. There is no evidence on which to narrow the scope."],
      ["Prior audit with an open delta or unresolved actions","A delta audit of the open scope, of whichever type left it open","The delta audit covers what was open and nothing else. A functional audit left open on testing produces a delta functional audit, not a new pair."]
    ]),
    C("One rule constrains every answer",[
      "**The physical audit needs the functional audit complete, or running concurrently.** The physical audit examines the as-built configuration of a *validated* CI, and validation is what the functional audit produces.",
      "So a physical audit on its own is legitimate only where the CI is already validated. A completed prior functional audit, an earlier increment, or an Acquirer-accepted equivalent.",
      "Where a CI has never been validated and the assessment points to a physical audit, the CI gets both. The physical audit does not go first."
    ]),
    C("The three outcomes, stated plainly",[
      "**Both.** The contract names both. Or any safety question was answered yes. Or the CI has never been audited. Or the factors sit on both questions.",
      "**Functional audit only.** The doubt is about the design and its verification, and nothing points at manufacture, sources or records.",
      "**Physical audit only.** The doubt is about manufacture or records, and the CI is already validated by a completed functional audit. Where it is not, the answer is both."
    ],"teal"),
    P("Record the scope on the assessment with the same rationale the designation carries. The disposition states which audits apply, functional, physical, or both, and separately whether a delta audit of open scope is required. An assessment that records a yes and leaves the scope blank hands the argument to whoever is standing there two weeks before the audit."),
    S("Designation says yes. Scope says which one. Both come out of the same assessment.",
      "Reading only the first one is how a program runs the audit it can schedule instead of the audit the evidence asked for.")
  ], check:{
    q:"A CI received a functional audit three years ago and it closed clean. Since then its supplier moved final assembly to a new facility, and reconciliation now shows an unincorporated-change backlog against the CI. No requirement has changed and no design change has been released. What scope does the assessment designate?",
    o:["A functional audit and a physical audit, because two risk factors designate the CI for audit",
       "A physical audit and a delta functional audit, because three years have passed since verification",
       "A physical audit. Both factors sit on the as-built question, and the CI is already validated",
       "Neither. The prior functional audit covers the CI and no design change has been released"],
    a:2,
    why:"Calling for both audits gets designation right and then stops. Two factors do designate the CI for audit, and scope is the second read. A new facility and a reconciliation backlog are both evidence about how the article is made and recorded. Neither one reopens the question of whether the design meets its requirements. The completed functional audit also satisfies the prerequisite, so the physical audit can run on its own rather than dragging a functional audit along with it. Elapsed time is not a factor on the assessment, and a clean prior audit is not a reason to skip this one."
  }},

  {id:"A1-09", title:"Worked examples: designation for audit", body:[
    P("Designation is a judgment, and judgments are learned from cases rather than from rules. Work through these before the exercises."),
    TABLE(["Candidate CI","Outcome","Reasoning"],[
      ["Flight-control actuator, named in the statement of work as requiring both audits","Designated. Both audits","Contract designation is decided at Part A. The assessment continues anyway and reveals the actuator hosts a hazard risk control and its supplier is new to the program. Contract scope is the starting point, not the answer."],
      ["Mounting bracket. One risk factor: A new machining source. Nothing else","Not designated for audit. Recorded and monitored","A single risk factor sits below the threshold. It is recorded so that if a second appears, a design change, an escape, a reconciliation anomaly, the CI is reassessed against two factors rather than starting from zero."],
      ["Power supply that acquires a hazard risk control when the hazard log is revised mid-program","Reassess immediately. Designated","The hazard log revision is itself a trigger, so the assessment re-runs without waiting for the next planning cycle. Hosting a hazard risk control is a safety yes, and a safety yes designates the CI for audit. The CI moves from undesignated to designated on the day that revision lands, with no further judgment required."],
      ["Cable assembly, never audited, showing an unincorporated-change backlog in reconciliation","Designated","Two risk factors: never audited, and a reconciliation health anomaly. The second matters more than its weight suggests. A reconciliation anomaly is direct evidence that the at-scale machinery may not be working for this CI, which is the condition audits exist to detect."],
      ["CI the Acquirer controls, whose product baseline the Acquirer will formalize at audit completion","Designated. Physical audit at minimum","For this CI the audit is the formalizing event, and no other event reaches it. Designation here is not a risk judgment at all; it follows from what the physical audit does."]
    ]),
    P("Two arguments you will actually have, walked out loud:"),
    C("\u201cWe do not think this one needs an audit. It is a mature design and the program is tight.\u201d",[
      "First question: does it implement or host a hazard risk control? If yes, the argument is no longer configuration management's to settle, and it is not System Safety's to settle either. A safety yes designates the CI for audit. Setting that audit aside is a safety disposition gate decision, taken at the authority the recorded severity sets.",
      "That is not bureaucracy. It puts the decision in front of the function that owns the hazard, rather than the function that owns the schedule.",
      "**CM answers the safety questions from the hazard log and the safety analyses, and escalates to System Safety where those are unclear. What nobody in this conversation can do is approve the omission. That decision belongs to the gate.**"
    ]),
    C("\u201cIt is already designated for audit by contract, so we can stop assessing it.\u201d",[
      "The contract sets the scope you owe. The assessment can widen it. An open delta from a previous audit, a new sub-tier source, a substantive design change since the last audit.",
      "Stopping at Part A is how a program ends up conducting exactly the audit it agreed to two years ago on a CI that has changed materially since."
    ],"teal")
  ], check:{
    q:"A supplier argues that a CI with a single risk factor, a new manufacturing source, should be left alone, because one factor is below the designation threshold for audit. They are right about the threshold. What still has to happen?",
    o:["The factor is recorded and monitored, and the assessment is retained for the undesignated CI",
       "Nothing further. One factor is below the threshold, so the assessment closes",
       "The CI is designated for audit anyway, because a source change always designates one",
       "System Safety must sign the assessment before the CI can be left undesignated"],
    a:0,
    why:"Being right about the threshold is not the same as being finished. The record is the point: a single factor is written down and watched, and the assessment is retained for CIs that were not designated for audit, so the next factor lands on top of a documented one rather than in an empty file. System Safety signs the assessment wherever a *safety* question was answered yes. None was answered yes here, so that signature is not in play either."
  }},

  {id:"A1-10", title:"More worked examples: the calls people get wrong", body:[
    P("A second set, chosen because each one is regularly decided the wrong way. Cover the middle column and commit to an answer before reading across."),
    TABLE(["Situation","Outcome","Reasoning"],[
      ["Design unchanged from a fielded product, but new tooling and a new sub-tier source for a critical component","Designated","Two risk factors. Heritage is not a shield: it speaks to the design, and both factors here are about how the CI is now made. The most common error is treating a heritage design as answering the whole assessment."],
      ["Designated by contract for a functional audit only. Assessment finds an unincorporated-change backlog and no physical audit ever performed","Designated, with scope expanded beyond the contract","Contract designation for audit set the scope at a functional audit. The assessment adds a physical audit, or at minimum a delta audit of open scope, and the expansion is recorded with its rationale. This is exactly what continuing past the mandatory part is for."],
      ["Safety-critical software hosted in a CI the Acquirer does not control","Designated","Safety-critical software is designated for audit. Safety criticality does not depend on who controls the CI. Acquirer control makes a physical audit mandatory for a separate reason, and the absence of Acquirer control removes that reason and nothing else."],
      ["Only factor is that the CI has never been audited","Recorded and monitored","One factor. Worth saying plainly because \u201cnever audited\u201d feels like it should be decisive on its own, and it is not. It is one of nine."],
      ["Two factors, one of which is a facility change made three years ago with a successful audit since","Recorded and monitored, not designated for audit","Count factors as they stand now. An audit performed since the change is what closes that factor. That is what the audit was for. Counting historical factors that have already been discharged inflates every assessment and makes the threshold meaningless."],
      ["No escapes against this CI, but two safety-relevant escapes on the production line it shares with another CI","Recorded and monitored","The history question covers the CI **or its production line.** A shared line with escapes is evidence about the process this CI goes through. Reading the question as CI-only is the single most common way a genuine factor is missed."],
      ["Three factors present, but the program is in its final delivery lot and production ends in four months","Designated","The assessment has no \u201ctoo late\u201d answer. The disposition can be proportionate. A delta audit of open scope rather than a full pair of audits, but the decision not to perform an audit the CI is designated for is a safety disposition gate decision, not a scheduling one."],
      ["The thing being assessed turns out not to be a CI at all","The assessment does not apply","It is controlled within its parent's documentation, and the real question is whether the parent is designated for audit. Assessing a non-CI wastes effort and, worse, produces a record implying it was separately managed when it was not."]
    ]),
    C("\u201cIt is a heritage design, so the risk factors do not really apply.\u201d",[
      "Heritage answers one question: is the design new or novel. It says nothing about tooling, sources, facilities, sub-tiers, escape history or reconciliation health.",
      "Ask what has actually stayed the same. In most cases the drawing stayed the same and everything that turns the drawing into hardware moved."
    ]),
    C("\u201cWe will designate it for audit next cycle if the second factor appears.\u201d",[
      "That is the correct handling for one factor, and only if the first factor was genuinely recorded, so the second one lands on top of a documented one.",
      "Where it goes wrong is when nothing was written down. The second factor then arrives at an assessment that starts from zero, is scored as a single factor, and the CI is monitored again.",
      "**Two consecutive single-factor assessments with no record between them is how a CI is never designated for audit.**"
    ],"teal")
  ], check:{
    q:"A CI has no escapes recorded against it. It is built on a line that has had two safety-relevant escapes in the past year, both on a different CI. The assessor answers the escape and non-conformance history question no. Is that answer correct?",
    o:["Yes. The escapes are recorded against a different CI, so they are not history against this one",
       "Yes, unless the two CIs happen to share a common part number or a common source of material",
       "No. Any escape anywhere at the site is a factor for every CI built there",
       "No. The question covers the CI or its production line, and this line has recorded escapes"],
    a:3,
    why:"The escapes really are against a different CI, which is what makes a no feel safe. But the question was written to cover the production line precisely because escapes are usually evidence about a process rather than about a part. Counting every escape anywhere at the site overshoots in the other direction. The line the CI is built on is the scope, not the whole site."
  }},

  {id:"A1-11", title:"Prerequisites, and why the order is not a convention", body:[
    P("Each audit has a prerequisite, and in both cases the reason is structural rather than administrative."),
    STEPS([
      {h:"The functional audit needs approved baselines",b:"The functional and allocated documentation for the CI or system must have been approved by the Acquirer before the audit. The audit compares tested performance against approved documentation. If the documentation is not approved, there is nothing stable to compare against. You would be auditing against a draft that can move underneath the finding."},
      {h:"The functional audit also needs the requirements allocation matrix",b:"An allocation matrix states which requirements are allocated to this CI. It is what sets the scope of the audit. The traceability matrix, which maps each requirement to its verification, is then checked against the allocation matrix rather than against itself. Without that check the audit can only verify the requirements somebody chose to list, and a requirement allocated to the CI but never carried into its specification stays invisible. That is the most consequential finding a functional audit can produce, and it is only reachable if the allocation matrix is in the room."},
      {h:"The physical audit needs the functional audit complete, or running concurrently",b:"The physical audit examines the as-built configuration of a *validated* CI. Validation is what the functional audit produces. Run the physical audit first and you are confirming, carefully and expensively, that a unit faithfully reproduces a design nobody has yet proven meets its requirements."},
      {h:"The physical audit needs the reconciliation report for the specific unit",b:"The primary input is the as-designed to as-built reconciliation report for the audit unit, with its nonconformance records and their dispositions. The audit does not perform the reconciliation. That already ran at scale through the status accounting system. The audit checks whether the machinery produced the right answer for this unit. A delta the audit finds that the report missed is therefore a finding against the reconciliation process, not only against the unit."},
      {h:"The physical audit needs the unit closed out, on three counts",b:"No open work orders against the unit. No open nonconformance records, meaning every one has been dispositioned by the required authority. And no open dispositions, meaning every disposition has been carried out and verified. The third is the one people miss: a unit can show every nonconformance dispositioned and still have rework in the queue. Until all three are true the as-built configuration is not final, and any reconciliation drawn from it is provisional. Any one of them open is a stop condition, and the audit is rescheduled rather than run with the CI carried as an action."}
    ]),
    P("Combining the two into a single event is permitted, but only where there is high confidence that the requirements of both will be satisfied within the same timeline. Combination is a scheduling decision made from evidence of readiness, not a way to make two problems into one."),
    P("Two words in these prerequisites do more work than they look. **Approved** means the Acquirer has accepted the functional and allocated documentation for this CI, not that it is released internally, and not that it is in review. **Concurrent** means the functional audit is genuinely underway and its verification evidence is being presented alongside the physical examination. It does not mean the two audits appear in the same quarter of the schedule."),
    C("The mistake this rule exists to prevent",[
      "Hardware finishes early and testing slips. The temptation is to run the physical audit now, on the argument that the unit will not change and the audit work will not be wasted.",
      "It does not work. If the design later fails verification, the physical audit examined a unit built to documentation that was about to change, and the audit has to be redone. The saving was borrowed, at interest."
    ]),
    S("The physical audit examines a validated CI, and validation is what the functional audit produces.",
      "That single sentence is the whole reason for the order.")
  ], check:{
    q:"Hardware for a CI is finished and the test program has slipped by three months. The program proposes to run the physical audit now and the functional audit later, to protect the schedule. What is wrong with that?",
    o:["Nothing, provided both audits are complete before the first delivery to the customer",
       "The physical audit examines a validated CI, and nothing is validated until the functional audit runs",
       "Nothing, provided the Acquirer approves the sequence in the audit plan",
       "The physical audit cannot begin, because the product documentation for this CI has not been released yet"],
    a:1,
    why:"Acquirer approval is genuinely required for the plan and schedule, which is what makes that answer tempting, but approval does not make an out-of-order audit meaningful, and no approval creates a validated CI where none exists. The product documentation is usually released well before this point, so that is not the obstacle either. The obstacle is that the physical audit has nothing to examine yet."
  }},

  {id:"A1-12", title:"Audits validate the machinery; they do not replace it", body:[
    P("Configuration verification runs continuously, and it is much bigger than the audits. It is embedded in ordinary work across engineering, test, manufacturing and quality."),
    L([
      "**Functional verification** happens through the test program. Analyses, inspections, tests and demonstrations against requirements, every day, on everything.",
      "**Physical verification** happens through inspection and process control, on every unit, not on a sample.",
      "**As-designed to as-built reconciliation** happens at scale, on data for all CIs, through the status accounting system."
    ]),
    P("Against that, an audit is small and deliberate: a discrete validation conducted on CIs designated for audit and, for the physical audit, on one representative unit and an agreed sample of documentation. Its purpose is to confirm that the machinery above is actually working, and to establish baselines. It is explicitly not the intent of an audit to verify every change individually."),
    C("What the physical audit is actually testing",[
      "Look closely at the third of those activities. The reconciliation compares what the approved configuration says the unit should be against what the **build records** say the unit is. Both sides of that comparison are records.",
      "A reconciliation can therefore come out clean while the hardware is wrong, because nothing in it ever touched the hardware. It inherits every error that reached the build record.",
      "**The physical audit is the point at which that comparison is tested against the article itself.** The reconciliation report for the audit unit is not evidence the audit accepts. It is the claim the audit is checking."
    ],"teal"),
