    P("Two records that look similar on the page and mean opposite things. Learn the difference once and check 11, variances against the audited unit, and check 12, deficiency reports against requirements, become easy."),
    TABLE(["","Deficiency report","Variance: deviation or waiver"],[
      ["What it records","A requirement that was not met when it was supposed to be","A departure from a requirement, agreed in advance"],
      ["When it arises","When something failed","Before the departure happens, or before delivery"],
      ["Who decides","The program, through its corrective action process","The Acquirer, who approves or refuses"],
      ["Effect on the audit","The requirement is not verified until the deficiency is closed","The requirement is knowingly not met, with approval on record"],
      ["Which check","12","11"]
    ]),
    P("**A deficiency report is a failure found.** It has a number, and that number is what carries it into the traceability matrix. Without the number in the matrix, the deficiency lives only in the test report, and the matrix is what gets summarized for the audit."),
    P("**A variance is a departure agreed.** A deviation is agreed before the departure occurs. A waiver is agreed after a nonconforming condition exists and before the CI is accepted. Both are legitimate instruments and both make the CI not meet a requirement on purpose."),
    C("Why check 11, variances against the audited unit, is performed in full",[
      "A variance that the audit does not carry produces an audit record stating an achievement that was not achieved.",
      "The error always runs toward the flattering answer, because a missing variance makes the CI look better than it is.",
      "There is no sampling position that protects against that. Either the variance listing is complete, or the record is wrong in a direction nobody checks."
    ]),
    S("A deficiency says we failed and are fixing it. A variance says we will not meet this, and you agreed.",
      "A CI can be audited with both. It cannot be audited with either one invisible."),
    P("When you read a variance listing, check three things. The requirement it departs from, named. The approving authority, named. And the boundary: which units, which effectivity, and until when. A variance with no boundary is a permanent change that was never processed as one.")
  ], check:{
    q:"A recurring nonconformance has been covered by four successive waivers over eighteen months, each approved, each for the next lot. The requirement has never been met. What is the audit position?",
    o:["Pass. Each waiver is approved and appears on the variance listing",
       "A finding. A departure that recurs and is permanently acceptable should be a change",
       "A finding against the approving authority for approving the same departure four times",
       "Pass, but record an observation against the recurrence"],
    a:1,
    why:"Each waiver is individually legitimate and the pattern is not. A variance is an exception. Four in a row against the same requirement is not an exception, it is the design, and the configuration documentation does not say so. That is a finding against configuration management rather than against the CI or the approver, and it is exactly the case the physical audit check on variances also reaches."
  }},

  {id:"A3-05", title:"Conducting the functional audit", body:[
    P("The audit opens with a design-team briefing for each CI being audited. Its required content tells you something about the culture the format is trying to enforce:"),
    L([
      "An overview of the CI.",
      "Test results and findings.",
      "**Requirements not met, with proposed remedies.**",
      "Change proposals incorporated, tested and proposed.",
      "The overall test effort, including its problem areas."
    ]),
    P("Opening with what failed is built into the format. A briefing that reaches the third bullet and finds nothing to say has either an unusually clean program or a briefing problem, and the audit will establish which."),
    P("Then the systematic walk. For each requirement, or for an agreed sample, the audit verifies the documentation flow: **baseline requirement specification, to test plan, to test procedure, to test report**, or to the analysis, inspection or demonstration record standing in place of a test. Interface requirements are verified as part of that same flow rather than separately."),
    C("Sampling has one hard limit",[
      "Where sampling is agreed, requirements that verify hazard risk controls and other safety-critical requirements are **in the sample. They are not sampled out.**",
      "This is the rule that a compressed schedule attacks first, because sampling is legitimate and the safety requirements are usually the most expensive ones to walk."
    ]),
    P("Where verification depends on integrated testing not yet performed, partial completion is acknowledged. Open requirements become action items and close through a delta audit."),
    S("Every non-compliance is documented and provided to the Acquirer for action.",
      "And a CI failing quality requirements is analyzed for cause and corrected before re-verification, not simply retested until it passes."),
    P("The walk is not left to judgment. The functional audit has a check set of twenty checks, in five groups, and the audit team records every one as pass, finding, or not applicable. A check that does not apply is recorded as not applicable. It is never left blank."),
    P("The next four sections take the five groups in order. The first group is the audit. The other four protect it."),
    TABLE(["Group","Checks","What it establishes"],[
      ["The verification chain","1 to 5","That every requirement was verified, by a stated method, with an unbroken evidence trail, against the right configuration"],
      ["Completeness","6 to 9","That the audit knows what was tested, what was tested without data, and what has not been tested yet"],
      ["Change and variance","10 to 12","That nothing verified has since been changed, and that known departures and known failures are visible"],
      ["Software","13 to 17","The five examinations that have no hardware equivalent"],
      ["Carry-forward and closure","18 to 20","That prior findings closed, that reprocurement data exists, and that open verification is carried rather than dropped"]
    ])
  ], check:{
    q:"Sampling has been agreed for a functional audit because the requirement set is large. The proposed sample excludes six requirements that verify hazard risk controls, on the grounds that those were already examined thoroughly during qualification. How do you answer?",
    o:["Accept it. Sampling is agreed, and re-walking work already done adds nothing",
       "Safety-critical requirements and hazard risk control requirements are not sampled out",
       "Accept it if the qualification evidence is attached to the minutes instead",
       "Reject the sampling arrangement entirely and walk every allocated requirement"],
    a:1,
    why:"The reasoning offered is genuinely sensible about effort, and that is what makes it dangerous: the requirements most worth re-walking are exactly the ones most expensive to re-walk. Sampling itself is legitimate and agreed, so rejecting it wholesale overcorrects. What is not available is a sample that omits the hazard-control requirements."
  }},

  {id:"A3-06", title:"The verification chain: checks 1 to 5", body:[
    P("This group is the audit itself. The handbook puts it in one sentence: the functional audit confirms the baseline performance and interface requirements were achieved, and it does this by reconciling the documentation that exists for each requirement."),
    P("Five checks take that sentence apart."),
    TABLE(["Check","What is compared","What a finding looks like"],[
      ["1. Requirement allocation to the CI [in full]","Every requirement in the performance and verification sections of the governing specification that this CI is accountable for, against the approved requirements allocation matrix","A specification requirement with no allocation row. An allocation matrix that does not reconcile against the specification it came from"],
      ["2. Requirement to verification method [in full]","Every allocated requirement against its stated method: test, analysis, inspection or demonstration","A requirement with no method. A method that cannot produce evidence for that requirement, such as inspection assigned to a performance requirement"],
      ["3. The documentation flow [sampled; in full for requirements verifying hazard risk controls]","For each requirement: specification, to test plan, to test procedure, to test report. Where the method is not test, the chain runs to the analysis, inspection or demonstration record instead","A break at any link. A plan with no procedure. A procedure with no report. A report recording a result without naming the requirement it closes"],
      ["4. Interface requirements in that flow [sampled; in full for interfaces carrying hazard risk controls]","Interface requirements through the same chain, against the controlling interface document at its controlling revision","An interface requirement absent from the allocation matrix. Verification performed against an interface revision that is not the one under control"],
      ["5. Test configuration provenance [in full]","The configuration under test against the configuration being formally accepted or released for production","Test results drawn from a build or software version that is not the one being accepted, with no rationale establishing that the earlier result still holds"]
    ]),
    C("Why check 1, requirement allocation, comes first",[
      "The allocation matrix is the denominator.",
      "Without it, verified all requirements is a claim with nothing behind it, because nobody has agreed what all means.",
      "That is why the matrix is an entry criterion and not an audit product. An audit that has to build its own population has already lost the argument about what was in it."
    ]),
    P("**Check 2, requirement to verification method, catches a failure that is silent by design.** A requirement with no stated verification method never appears in a test report, never appears in a deficiency report, and never appears on the list of things not yet done. Nothing looks for it, because nothing was ever told to. It is not found by working harder. It is found by checking that every allocated requirement carries a method."),
    S("The most common defect in check 3, the documentation flow, is a test report that records a pass and never names the requirement it closes.",
      "The test ran. The result is real. Nobody can say what it verified."),
    P("**Check 4, interface requirements in that flow, exists because of behavior, not technology.** An interface belongs to two CIs. Each owner treats it as the other side\u2019s problem, so it is dropped by omission rather than by failure. Omission raises nothing. That is why the standards call interface requirements out separately instead of letting them ride along in check 3, the documentation flow.")
  ], check:{
    q:"A functional audit samples 60 of 240 allocated requirements. Every sampled requirement traces cleanly from specification to report. The audit team proposes to record checks 1 through 5, the verification chain, as pass. What is wrong with that?",
    o:["Nothing. The sample was clean, and the sampling was agreed with the Acquirer in advance",
       "The sample was too small for a requirement set of that size",
       "The team should have sampled the interface requirements separately from the rest",
       "Checks 1, 2 and 5 are performed in full and cannot be satisfied by a sample"],
    a:3,
    why:"Checks 1, 2 and 5 are each about whether something was omitted, and a sample cannot find an omission. Check 1, requirement allocation, asks whether every requirement reached the matrix. Check 2, requirement to verification method, asks whether every allocated requirement carries a method. Check 5, test configuration provenance, asks whether the test data came from the right configuration. A clean sample of 60 says nothing about the 180 that were not looked at, and the whole point of these three checks is the requirement nobody has thought about. Sample size is not the issue and the interface requirements are covered by check 4, interface requirements in that flow, which is sampled."
  }},

{id:"A3-07", title:"Completeness: checks 6 to 9", body:[
    P("Three lists, and the standards ask for them separately. The separation is the point."),
    TABLE(["Check","What is compared","What a finding looks like"],[
      ["6. Tests accomplished with recorded data [sampled]","The complete list of successful tests during which pre-acceptance data were recorded, against the data itself","A test on the list whose data cannot be retrieved. Data that does not support the result asserted"],
      ["7. Tests accomplished without recorded data [sampled]","The complete list of successful tests for which detailed data were not recorded","A test presented as recorded-data that is not. The two lists overlapping, which means nobody separated them"],
      ["8. Tests required and not yet performed [in full]","The complete list of required tests not yet run, each with its plan and the milestone at which it completes","An unverified requirement that appears on none of the three lists"],
      ["9. Analyses, inspections and demonstrations [sampled; in full for safety-related requirements]","The documented result for every requirement closed by a method other than test, against the requirement and the audited configuration","An analysis whose inputs or assumptions do not match the configuration being accepted. A demonstration record that does not say what was demonstrated, to whom, and against what"]
    ]),
    P("**Check 6, tests accomplished with recorded data, and check 7, tests accomplished without recorded data, look like one list split for no reason.** They are not. A test with recorded data can be re-examined. A test without recorded data rests on a signature. Both can be entirely legitimate, and the audit team has to know which results are which, because a dispute two years from now cannot be settled by re-reading a record that does not exist."),
    S("A functional audit may proceed with open verification. It may not proceed with open verification that nobody named.",
      "Check 8, tests required and not yet performed, is what turns an open item into a tracked CI."),
    P("The handbook gives the case directly. A durability life test is still running when everything else is complete. Conducting the audit and carrying the open requirement as an action item is a legitimate call. What is not legitimate is the requirement that appears on no list at all, because that one closes by silence."),
    C("Where check 9, analyses, inspections and demonstrations, usually breaks",[
      "Not everything is testable, and requirements closed by analysis are where unexamined assumptions live.",
      "An analysis closing a requirement has to state its assumptions and its inputs, and those inputs have to be the configuration being accepted.",
      "An analysis run against the design as it stood at critical design review, closing a requirement on a CI changed twice since, is a finding. It is also a finding that reads as a pass until somebody checks the date."
    ])
  ], check:{
    q:"A CI has 180 allocated requirements. The audit finds 140 on the recorded-data list, 22 on the no-recorded-data list, and 14 on the not-yet-performed list. What does the audit team do next?",
    o:["Reconcile the three lists against the allocation matrix and account for the missing four",
       "Record checks 6 through 8, the three test lists, as pass. The lists account for it",
       "Raise a finding on the 22 requirements without recorded data",
       "Defer the audit until the 14 outstanding tests are complete"],
    a:0,
    why:"140 plus 22 plus 14 is 176, and the matrix holds 180. Four requirements appear on no list. That is exactly the failure check 8, tests required and not yet performed, exists to catch, and it is invisible unless somebody adds up. The 22 without recorded data are not a finding in themselves, they are a category the standards ask to be tracked separately. Deferring for the 14 is not required, because an audit may proceed with open verification that has been named and planned."
  }},

{id:"A3-08", title:"Change and variance: checks 10 to 12", body:[
    P("This group protects the verification chain from three things that happen after a requirement is verified, or alongside it, and that quietly make the verification untrue."),
    TABLE(["Check","What is compared","What a finding looks like"],[
      ["10. Engineering changes incorporated and tested [in full]","The account of changes incorporated and tested, and separately of changes approved and not yet incorporated, against the verified requirements","An approved change affecting a verified requirement, with no re-verification and no recorded rationale for why the earlier result still holds"],
      ["11. Variances against the audited unit [in full]","The current listing of deviations and waivers requested of or approved by the Acquirer, against the requirements they affect","A variance affecting an audited requirement that the audit did not carry. A variance carried with no approving authority recorded"],
      ["12. Deficiency reports against requirements [sampled]","Each deficiency identified by report number against the requirement it affects, carried in the traceability matrix","A deficiency in a test report with no matrix entry. A requirement recorded as verified with an open deficiency against it"]
    ]),
    S("A requirement verified against a design that has since changed is not verified.",
      "Check 10, engineering changes incorporated and tested, is the only place the change record and the verification record are made to agree."),
    P("**Check 11, variances against the audited unit, protects the record in the direction nobody looks.** A variance is a departure from a requirement that both parties agreed to accept in advance. It is a legitimate instrument. What it does is make the CI not meet a requirement, on purpose, with approval. If the variance is not visible at the audit, the audit record states an achievement that was not achieved, and the error runs toward the flattering answer."),
    C("Why check 12, deficiency reports against requirements, exists at all",[
      "A test report and a traceability matrix are maintained by different people at different times.",
      "A known failure recorded in a test report, with no deficiency report number carried into the matrix, disappears the moment the matrix is summarized.",
      "Nobody suppresses it. The matrix simply never knew about it."
    ])
  ], check:{
    q:"A requirement was verified by test eight months ago and the report is clean. Since then an approved change modified the assembly that requirement depends on. The change was incorporated and the CI passed its acceptance test. Is check 10, engineering changes incorporated and tested, satisfied?",
    o:["Yes. The change was incorporated correctly, and the CI passed its acceptance testing afterwards",
       "Yes, provided the change was classified as a minor change",
       "No. Any approved change invalidates the whole functional audit",
       "No. Acceptance testing is not requirement verification, and the requirement is not verified"],
    a:3,
    why:"An acceptance test confirms a unit conforms to its accepted definition. It does not verify that a performance requirement is still met by a changed design. Check 10, engineering changes incorporated and tested, asks for one of two things: re-verification, or a recorded rationale establishing why the earlier result still holds. Either is acceptable. Neither is the same as noting that the unit passed acceptance. Change classification does not decide it, and one change does not invalidate the audit."
  }},

  {id:"A3-09", title:"Software in the functional audit: checks 13 to 17", body:[
    P("A software CI gets checks 1 through 12 like any other CI. It then gets five more that have no hardware equivalent."),
    TABLE(["Check","What is compared","What a finding looks like"],[
      ["13. Software product documentation [in full, for each software CI audited]","Every document that composes or describes the contents or use of the software product, being the software product specification, the user manual and the version description document, for format and completeness","A document describing behavior the software does not have. A required document absent or incomplete at the audited version"],
      ["14. Database characteristics, storage allocation, timing and sequencing [in full, for each software CI audited]","Database characteristics, storage allocation data, and timing and sequencing characteristics, against the specified requirements","Any of the four unverified against the specification, or verified against a version other than the one audited. These are the properties that pass every functional test and fail in service, under load or at a boundary"],
      ["15. Developmental configuration change records [in full, for each software CI audited]","The records of what changed in the developmental configuration, meaning the working design description before it was baselined, and under what control","A change to the developmental configuration with no record. Records that cannot establish the content of the audited version"],
      ["16. Software library version listing [in full, for each software CI audited]","The listing of every version held in the software library, developmental and non-developmental alike","A non-developmental version in use with no library entry. A listed version with no change record"],
      ["17. Internal configuration management and software quality audit findings [in full, for each software CI audited]","The findings of the supplier\u2019s own configuration management and software quality assurance audits of the software CI","An open internal finding against configuration control or software quality for the audited CI"]
    ]),
    P("Check 16, the software library version listing, deserves a moment. It lists every version held, including versions the organization did not write. Non-developmental means acquired rather than written here. Acquired libraries, vendor components, generated code and test harnesses all end up in a working environment, and each has a version, a source and a license position that somebody assumed rather than recorded. The audit asks for the listing precisely because a working software CI is almost never made only of what the team wrote."),
    P("**Check 17, internal configuration management and software quality audit findings, is the one to read twice.** These are the supplier\u2019s own audits of their own control, and the functional audit rests on evidence those processes produced. An open internal finding against configuration control is not a paperwork CI. It is grounds to widen the sample under checks 3, 4 and 12, the documentation flow, interface requirements and deficiency reports, because the process that generated the evidence is one the supplier already knows is not working."),
    S("For a software CI the standard is stated flatly: every requirement has a related test step, and that test passes.",
      "Not most requirements. Not the requirements that were testable within the schedule."),
    C("What that sentence rules out",[
      "A requirement covered by a test that was written but never run.",
      "A requirement covered by a test that runs and fails, with the failure carried as a known issue.",
      "A requirement covered by inspection of the code because writing a test was impractical. Unless the analysis, inspection or demonstration record is the agreed verification method and is cross-referenced as such.",
      "Each of these is a normal, defensible engineering position during development. None of them satisfies the audit."
    ])
  ], check:{
    q:"At a software functional audit, forty of the CI's requirements map to test steps that pass. Three map to test steps that run and fail, carried as known issues with agreed workarounds documented in the release notes. What is the audit position?",
    o:["Acceptable. The failures are known, documented and worked around",
       "Acceptable if the workarounds are approved by the Acquirer during the audit itself",
       "The three are non-compliances. The standard is a passing test",
       "The whole CI fails the audit and must be re-presented once all tests pass"],
    a:2,
    why:"Known issues with documented workarounds are a legitimate way to run a development program, and that is why this looks acceptable. The information is all present and nobody is hiding anything. But documented is not the same as verified, and the audit standard is that the test passes. Failing the whole CI overstates it: partial completion, recorded action items and a delta audit are the built-in mechanism."
  }},

{id:"A3-10", title:"Carry-forward and closure: checks 18 to 20", body:[
    P("The last group is about what the audit inherits and what it hands on. All three checks are performed in full, because all three are about something being dropped."),
    TABLE(["Check","What is compared","What a finding looks like"],[
      ["18. Prior review and lower-level audit closure [in full]","Design review minutes, configuration management assessments, and the minutes of lower-level functional audits, against the current audit record","An open finding from a prior review or a lower-level audit with no entry in the current minutes and no closure evidence"],
      ["19. Provisioning drawing sample [sampled]","Drawings of the CI\u2019s parts that will be provisioned, against the test data essential to the design and leading to manufacture","A provisioned part whose drawing neither carries nor references the design-critical test data"],
      ["20. Partial completion recorded, not assumed [in full]","The audit record against the open items, where verification can complete only after system integration and test","An audit recorded as complete where contingent verification existed. Contingent CIs with no delta audit planned and no carry-forward"]
    ]),
    P("**Check 18, prior review and lower-level audit closure, is the one that keeps an incremental program honest.** Functional audits run bottom-up: CIs, then subsystems, then the system. Open action items from lower-level audits are carried into the higher-level minutes. Without this check, nobody decides to drop a CI. The next audit simply does not ask about it, and it closes by silence."),
    P("**Check 19, the provisioning drawing sample, is the odd one, and it is worth knowing why it is here.** It is the only place a functional audit touches manufacturing data. The question it asks is about ten years from now: could somebody buy this part again, from the drawing alone, and get the part that was verified? It sits in the functional audit because the knowledge being protected is verification knowledge, and this is the last moment it is all in one room."),
    S("A CI recorded as audited, where a third of its requirements were contingent on integration testing nobody tracked, is worse than one recorded as incomplete.",
      "Check 20, partial completion recorded rather than assumed, exists because the risk is never the partial completion. It is the partial completion that was never written down."),
    C("What check 20, partial completion recorded rather than assumed, asks for",[
      "That the partial completion is stated in the minutes rather than implied by their silence.",
      "That each contingent requirement is named.",
      "That each one has a route to closure: a delta audit, or carry-forward into the final system-level audit.",
      "A functional audit that closes with contingent verification and no route is not a partial audit. It is an audit that ended."
    ])
  ], check:{
    q:"A subsystem functional audit closed last year with two open action items against a lower-level CI. Both action items were subsequently fixed and the fixes were verified in a delta audit. The system-level functional audit convenes. What does check 18, prior review and lower-level audit closure, require?",
    o:["Nothing further. The action items were all closed and verified before this audit convened",
       "The two CIs are re-verified at system level to confirm the fixes",
       "The delta audit minutes and closure evidence are examined and recorded in the minutes",
       "The subsystem audit is re-run, because it should not have closed with open action items"],
    a:2,
    why:"Closure is a claim until the evidence for it is examined and recorded. Check 18, prior review and lower-level audit closure, asks the system-level audit to look at the delta audit minutes, confirm the fixes were verified, and record the closure in its own minutes. That is what stops a closure that happened in a conversation from being taken as a closure that happened on the record. Re-verifying at system level duplicates work already done, and closing with named open items is a legitimate way to run a subsystem audit."
  }},

{id:"A3-11", title:"Worked example: one requirement through the functional audit", body:[
    P("One requirement, followed from the allocation matrix to the report. The CI is a fuel shutoff valve. The requirement is a closing time."),
    TABLE(["Stage","Document","What it says"],[
      ["Requirement","System specification, section 3, revision C","The fuel shutoff valve shall close within 400 milliseconds of command"],
      ["Allocation","Requirements allocation matrix, revision C","Requirement 3.4.7 allocated to the valve. Verification method: test"],
      ["Plan","Valve test plan, revision B","Closing time verified by bench test at ambient and at minimum operating temperature"],
      ["Procedure","VTP-114, revision D","Command applied, closure detected by position switch, time recorded. Pass at 400 milliseconds or less"],
      ["Report","VTR-114-02, dated 14 March","Valve P/N 88231-3, S/N 0007. Three runs at ambient: 318, 322, 316 milliseconds. Pass"]
    ]),
    P("Read it as the audit team would, one check at a time."),
    STEPS([
      {h:"Check 1. Requirement allocation",b:"Requirement 3.4.7 is in the specification and in the matrix, allocated to this CI. Pass."},
      {h:"Check 2. Requirement to verification method",b:"The matrix states test. Pass."},
      {h:"Check 3. The documentation flow",b:"Specification to plan to procedure to report, unbroken. The report names the requirement. Pass so far."},
      {h:"Check 5. Test configuration provenance",b:"The report names part number 88231-3. The CI being accepted is 88231-5. Two changes were incorporated after the test. **Finding.**"},
      {h:"Back to check 3, the documentation flow",b:"The plan requires bench test at ambient **and at minimum operating temperature**. The report records three runs at ambient and none cold. The cold case appears on no list. **Finding.**"}
    ]),
    C("Two findings, and neither one is a failed test",[
      "Every number in the report passes comfortably. 318 milliseconds against a 400 millisecond requirement is not a marginal result.",
      "The first finding is that the result belongs to a configuration the customer is not accepting.",
      "The second is that half the verification the plan called for was never done, and nothing recorded that it was outstanding.",
      "An audit that reads only the numbers finds nothing here."
    ], "amber"),
    P("**What closes each one.** The provenance finding closes either by re-running the test on the accepted configuration, or by a recorded engineering rationale establishing that the two changes cannot affect closing time. The coverage finding closes by running the cold case, or by carrying it as a named open item with a plan, which is what check 8, tests required and not yet performed, would have wanted in the first place."),
    S("The functional audit does not ask whether the CI is good. It asks whether the evidence says so, about this configuration, for this requirement.",
      "Both findings here are about the connection between documents. Neither is about the valve.")
  ], check:{
    q:"The supplier proposes to close the provenance finding by noting that changes incorporated after the test were to the valve body casting and mounting flange, neither of which affects the actuator. Is that acceptable?",
    o:["No. The test must be re-run on the configuration actually being accepted",
       "Yes, if the rationale is recorded and signed by the design authority",
       "Yes. The engineering judgment is obviously correct here, and it does not need to be written down",
       "No, unless the Acquirer agrees to a variance covering the difference"],
    a:1,
    why:"Check 5, test configuration provenance, and check 10, engineering changes incorporated and tested, both accept a recorded rationale in place of re-verification. What they do not accept is the rationale existing only in the room. It has to be written, signed by someone with design authority for the CI, and carried with the audit record so that the next person to ask can find the answer. Re-running is one valid route and it is not the only one. A variance is for a requirement not met, and here the requirement is met."
  }}

 ],
 exercises:[

  {id:"A3-E1", title:"Exercise 1: A functional audit with a third of the test program incomplete",
   scen:"You arrive at a functional audit. The design-team briefing is polished and reports no requirements unmet. Working through the traceability matrix, you find that sixty-eight of two hundred and ten requirements have no test report reference. Of those, forty are marked as verified by analysis with an analysis record referenced, twenty-two are marked \u201cscheduled\u201d with no plan attached, and six are blank. Four of the six blanks are requirements that verify hazard risk controls. The program proposes to certify the audit and address the remainder informally.",
   parts:[
     {id:"a", q:"Categorize the sixty-eight and say which are acceptable as they stand, which are findings, and which are something worse."},
     {id:"b", q:"The opening briefing reported no requirements unmet. What does that tell you, given what you found in the matrix?"},
     {id:"c", q:"The four blanks that verify hazard risk controls: what is their status, and what does their presence in this list suggest about how the sample or the schedule was managed?"},
     {id:"d", q:"Can this audit be certified as the program proposes? Set out what is actually available and how the open scope should be handled."},
     {id:"e", q:"For the twenty-two marked \u201cscheduled\u201d, what exactly should the package have contained, and who owed it?"},
     {id:"f", q:"Name one fact you would need before you could decide whether the forty analysis-verified requirements are genuinely satisfied, and say who you would ask for it."}
   ]},

{id:"A3-E2", title:"Exercise 2: The broken chain",
   scen:"You are auditing a hydraulic pressure requirement. The requirements allocation matrix, revision D, allocates requirement 3.6.2 to the CI: the unit shall maintain 3000 psi plus or minus 50 psi under the duty cycle of Annex B. Verification method: test. The test procedure, HTP-220 revision C, gives steps, expected values and tolerances, and a clear pass criterion. The test report, HTR-220-04, records the item under test as unit S/N 0011, references procedure HTP-220 revision B, and records a clean pass at 2988 psi. The report does not name a requirement. The unit being accepted is S/N 0014, built to the same part number and revision as S/N 0011.",
   parts:[
     {id:"a", q:"Work checks 1 through 5, the verification chain, against this evidence and record each as pass, finding, or not applicable. Say which check each defect belongs to."},
     {id:"b", q:"The report references procedure revision B and the package contains revision C. What do you need to establish before you know whether this matters?"},
     {id:"c", q:"The report names no requirement. The supplier says it obviously covers 3.6.2 because it is the only pressure test on the CI. Answer that."},
     {id:"d", q:"The tested unit is S/N 0011 and the accepted unit is S/N 0014, same part number and revision. Does check 5, test configuration provenance, produce a finding there? Set out the reasoning rather than the verdict."},
     {id:"e", q:"Write the strongest of your findings in full, using the three statements: the requirement, the objective evidence, and the non-conformance."},
     {id:"f", q:"For the defect you consider most serious, say what would close it and who owes the closure."}
   ]},

{id:"A3-E3", title:"Exercise 3: The requirement on no list",
   scen:"A CI has 212 allocated requirements. At the functional audit the supplier presents three lists. Tests accomplished with recorded data: 166. Tests accomplished without recorded data: 19. Tests required and not yet performed: 21, each with a plan and a milestone. Analyses, inspections and demonstrations: 4, each with a record. The traceability matrix shows every requirement as either verified or scheduled, with no blanks. The supplier proposes to record checks 6 through 9, the completeness checks, as pass and to carry the 21 outstanding tests as action items.",
   parts:[
     {id:"a", q:"Reconcile the lists against the allocation matrix. State what you find and show the arithmetic."},
     {id:"b", q:"The matrix shows no blanks. Explain how a requirement can be on no list while the matrix looks complete."},
     {id:"c", q:"Which of checks 6 through 9, the completeness checks, is performed in full, and why does that matter to what you just found?"},
     {id:"d", q:"The 19 without recorded data are challenged by a member of the audit team as inherently unacceptable. Answer that, and say what the standards actually ask for."},
     {id:"e", q:"The supplier proposes to carry the 21 outstanding tests as action items. Is that acceptable, and what has to be true for it to be?"},
     {id:"f", q:"Two of the requirements you identified in part a verify hazard risk controls. What changes, and what does not?"}
   ]}

 ]
},
{
 id:"A4", label:"Module 4", title:"The physical audit",
 sub:"Reading the evidence, conducting the audit, and the eighteen checks.",
 sections:[

{id:"A4-01", title:"How to read an engineering drawing", body:[
    P("A physical audit compares an article against documents. Seven sections cover the documents. Start with the drawing, because five of the eighteen checks run through it."),
    P("An auditor reads a drawing\u2019s text far more than its geometry. The geometry is the designer\u2019s work. The text is where configuration lives."),
    TABLE(["Where to look","What it carries","Why the audit needs it"],[
      ["Title block","Part number, drawing number, title, CAGE code, scale, sheet count","Identity. It is also where the drawing number and the part number turn out not to be the same thing"],
      ["Revision block","Revision letter, description of each change, authorizing change number, date","The governing revision. A part number does not carry a revision. The product definition data does"],
      ["Notes and flagnotes","General notes applying to the whole drawing, and flagnotes applying to a called-out feature","Process requirements, material calls, marking, and the traceability requirement, which is very often a note"],
      ["Zones","Grid references down the margins","How a finding is located precisely enough for somebody else to find it again"],
      ["Next assembly","Where this part is used","Check 16, next higher assembly traceability. It is the upward half of the reconciliation"],
      ["Associated lists","Parts list, wiring list, data list, referenced by number","Check 3, as-designed to as-built child item reconciliation. The parts list is a separate document and it is part of the definition"],
      ["Unless otherwise specified","A block of default tolerances and finishes","What applies wherever the drawing is silent. Silence is not absence"]
    ]),
    C("The distinction that causes the most confusion",[
      "**The part number identifies the part. The drawing revision identifies the definition of it.**",
      "A change that produces a non-interchangeable part produces a new part number.",
      "A change that does not produces a new revision against the same part number.",
      "So an article marked 88231-3 tells you what it is and does not tell you which definition it was built to. That is why check 1, physical item to product definition data, compares the article against the governing revision and not against the part number."
    ]),
    P("**Where model-based definition applies, the model is the authority and the drawing may be a view of it.** The same reading applies and the places change. Attributes live in the model, notes live in annotation planes, and the revision is on the model rather than on a sheet. Ask which is the authority before you audit either."),
    S("Read the title block for identity, the revision block for definition, and the notes for everything that will actually produce a finding.",
      "The geometry is rarely the problem. The note somebody did not read usually is.")
  ], check:{
    q:"An article is marked with part number 88231-3. The as-built record says 88231-3. The drawing in the data package is 88231 revision F. The change board approved revision G four months ago, effective from the unit being audited. What does check 1, physical item to product definition data, record?",
    o:["Pass. The part numbers agree across the article, the as-built record and the drawing",
       "Pass. A revision change does not change the part number itself",
       "A finding against the as-built record, for not carrying a revision alongside the part number",
       "A finding. The governing revision for this unit is G and the article was built to F"],
    a:3,
    why:"Agreeing part numbers establish identity and nothing else. Revision G is the governing definition at this unit\u2019s effectivity, so the article and the data package are both against a superseded definition. It is true that a revision change does not change the part number, and that is exactly why matching part numbers cannot be used as evidence of conformity. The as-built record is not the defect."
  }},

{id:"A4-02", title:"How to read a parts list and an Engineering Bill of Materials", body:[
    P("The parts list is the as-designed side of the reconciliation. Five of the columns matter to the audit, and two of them are routinely skimmed."),
    TABLE(["Column","What it carries","Audit use"],[
      ["Find number","The part\u2019s reference on the drawing face","Locates the part on the drawing. It is not the part number"],
      ["Part number","The part identity","Element 1 of the reconciliation"],
      ["Next higher part number","The assembly this part installs into","Element 2. It is where a part present at the wrong parent is caught"],
      ["Quantity per","How many are used at this level","Element 3. Present is not the same as present four times"],
      ["Traceability requirement","Serial, lot or batch, usually carried as a note or a coded column","Element 4. It says what the build record has to capture"],
      ["Life limit notation","Shelf-life, or usage and cycle","Element 5. It says which of the two clocks applies"]
    ]),
    P("Three requirements are stated on the parts list and carried up into the Engineering Bill of Materials. A life limit. Serialization recording required. Lot or batch recording required. The parts list states the requirement. The build records hold the capture. The reconciliation compares the two, so a requirement the parts list never stated is a capture nobody was ever going to make."),
    C("Two clocks, one phrase",[
      "**Life limited** means two different things, and they produce opposite record structures.",
      "A part life-limited by cycles or operating hours is serialized. Remaining life is a per-unit quantity, so the unit has to be individually identifiable. The build record carries life consumed at delivery.",
      "A part life-limited by shelf life, cure date or storage age is lot controlled with a date code. The limit attaches to the manufacturing lot, not to the individual unit. The build record carries the date code with cure or expiry evidence.",
      "The parts list says whether a part has a life limit and **which kind**. It does not say how much life remains, and it is not supposed to. Nothing else in the package states which clock applies.",
      "Lot control is not a lesser form of control. A part of catastrophic hazard severity may be legitimately lot controlled. Verify which clock applies before raising a finding about a missing serial number or a missing consumed-life record.",
      "Some software and complex electronic hardware carry identity on the loadable part number and the baseline, and carry no physical unit identifier at all. Record that check as not applicable rather than as a finding."
    ],"amber"),
    P("**The Engineering Bill of Materials is the same information arranged by level.** The Engineering Bill of Materials (EBOM) is an aggregation of the product's parts lists. It is the As-Designed dataset. Indentation shows the parent and child relationship, so the next higher part number is implied by position rather than stated in a column. Read it the same way and watch the indent depth, because a part shown at the wrong level is the same defect as a wrong next higher part number."),
    P("**A parts list is not a bill of materials.** A parts list is part of the product definition and it changes by engineering change. Other bills of materials exist and they are built for other purposes. The Manufacturing Bill of Materials (MBOM) is an aggregation of the As-Planned dataset. It is a restructuring of the EBOM that carries the planning content the EBOM does not. The As-Built Bill of Materials (ABOM) is an aggregation of the As-Built dataset, and is comprised of closed build records associated with embodiment."),
    P("Know which one you are holding. The audit reconciles the As-Designed dataset against the As-Built dataset, which means the parts list and the EBOM against the closed build records and the ABOM. It does not reconcile against the MBOM. Planning content in the MBOM is not product definition, and a difference between the MBOM and the EBOM is not by itself a finding against the unit."),
    S("Every element of the reconciliation is a column on this document.",
      "If you can read a parts list properly, the reconciliation report becomes a comparison rather than a mystery.")
  ], check:{
    q:"A parts list line carries a shelf-life notation against an adhesive. The build record shows the adhesive was installed, with a lot number, and no date code. The auditor raises a finding that a life-limited part has no consumed-life record. Is the finding correct?",
    o:["Yes. A life-limited part with no consumed-life record on it is a finding",
       "Partly. A shelf-life part needs a date code with cure or expiry evidence",
       "No. Lot control is sufficient for adhesives of this kind",
       "No. The parts list notation is advisory rather than binding"],
    a:1,
    why:"There is a real defect and the auditor named the wrong one. Consumed life belongs to the usage and cycle clock, on a serialized part. A shelf-life part is lot controlled and needs a date code with cure or expiry evidence, which is missing here. Stating the finding against the wrong clock invites a supplier to answer that the part is not serialized and was never meant to be, and the actual defect then survives the exchange."
  }},

{id:"A4-03", title:"How to read an as-designed to as-built reconciliation report", body:[
    P("This is the primary input to the physical audit. The audit does not perform the reconciliation. It verifies that the reconciliation produced the right answer for this unit."),
    P("Five elements, two sides."),
    TABLE(["Element","As-designed, from the parts list","As-built, from the build records"],[
      ["1","Part number","Part number"],
      ["2","Next higher part number","Next higher part number"],
      ["3","Quantity","Quantity"],
      ["4","Traceability requirement: serial, lot or batch","Traceability actually captured"],
      ["5","Life limit notation and its type","Life limit information actually captured"]
    ]),
    P("The as-built side comes from the completed and closed build records, meaning the work orders and the non-conformance record dispositions. If those are not closed, the as-built side is provisional and the reconciliation is provisional with it."),
    C("Six findings this comparison produces",[
      "A part on the as-designed data with **no entry** in the build record.",
      "A **quantity** that does not agree.",
      "A part recorded under a **different next higher part number**.",
      "A part required to be **serialized and captured only by lot**.",
      "A part noted life limited with **no matching life record, or a record on the wrong clock**.",
      "A **life record in the build system against a part the design does not note as life limited**, which usually means the design changed and the production system did not hear about it."
    ]),
    S("Absence in the record is itself the finding.",
      "It is not resolved by inspecting the article and concluding the part must be present. The article is not the evidence. The record is."),
    P("**Read the open items before you read the deltas.** A reconciliation report with open deltas is telling you the unit is not closed out, which is an entry criterion rather than a finding. A reconciliation report with no open deltas, on a unit that later turns out to have one, is a finding against the reconciliation process and not merely against the unit."),
    P("That distinction matters more than it looks. A delta the audit finds that the report did not means the reconciliation missed it, and the reconciliation runs on every unit. One missed delta on the audited unit is a question about every unit the same process cleared.")
  ], check:{
    q:"The reconciliation report for the audited unit shows no deltas. During the examination the audit team finds a bracket installed under a different next higher assembly than the parts list shows. What is the finding written against?",
    o:["The unit itself, for a bracket fitted under the wrong next higher assembly during build",
       "The parts list, for an ambiguous next higher part number",
       "The installer, for not following the work order as written",
       "The reconciliation process, because a delta existed and the report did not show it"],
    a:3,
    why:"The unit has a real defect and that is the smaller half of it. The reconciliation was supposed to compare next higher part numbers and report this. It did not, which means either the comparison does not include element 2 or it was not run properly. That process clears every unit, so one missed delta on the audited unit raises a question about the population. Writing the finding against the bracket fixes one bracket."
  }},

{id:"A4-04", title:"How to read a non-conformance record and its disposition", body:[
    P("A non-conformance record says something did not conform. Its disposition says what was decided about it. Those are two different things, and the gap between them is where the third closeout condition lives."),
    TABLE(["Disposition","What it means","What the record then has to show"],[
      ["Use as is","The condition is accepted without rework","The approving authority, and the technical basis. On a safety-related characteristic this is the one to read hardest"],
      ["Rework","The CI is brought into full conformance with the design","The rework instruction, and a sign-off that it was performed and verified"],
      ["Repair","The CI is brought into a serviceable condition that is not full conformance","An approved repair scheme, and the same sign-off. A repair is a permanent departure from the design"],
      ["Scrap","The CI is removed and replaced","Evidence the replacement was installed and recorded"],
      ["Return to vendor","The CI goes back to its supplier","Evidence of what replaced it, and where the replacement came from"]
    ]),
    C("Dispositioned is not accomplished",[
      "A non-conformance record can be signed, approved, and fully dispositioned, and the work can still be sitting in a queue.",
      "The closeout criterion has three conditions. No open work orders. No open non-conformance records. And **no open dispositions**.",
      "The third is the one people miss, because the paperwork looks finished. The board met. The decision is recorded. Somebody signed it.",
      "Read past the disposition line to the sign-off that says the decision was carried out and verified."
    ], "amber"),
    P("**A review board record is worth reading for who was in the room.** A use-as-is on a safety-related characteristic needs the authority that can accept it. A board that dispositioned it without that authority present has produced a decision, not an acceptance."),
    P("**Watch for the repeat.** The same non-conformance, on the same characteristic, across successive units, is a process telling you something. Each record may be correctly dispositioned. The pattern is a finding that no single record contains."),
    S("Three states, not two: raised, dispositioned, accomplished.",
      "A unit is closed out when all three are true for every record against it.")
  ], check:{
    q:"A unit has eleven non-conformance records. All eleven are dispositioned and signed by the correct authority. Nine show rework accomplished and verified. Two show rework instructions issued, with no accomplishment sign-off. Does the unit meet the physical audit entry criteria?",
    o:["Yes. All eleven are dispositioned and no records remain open",
       "No. Two dispositions are open, so closeout is not met",
       "Yes, provided the two outstanding ones are classified minor",
       "No, and the audit should raise a finding against the two open non-conformance records"],
    a:1,
    why:"Two dispositions are decided and not accomplished, so the unit fails the third closeout condition and the entry criteria are not met. That makes it a readiness question rather than a finding: the audit should not convene on this unit until the rework is accomplished and verified, or the unit is exchanged for one that is closed. Severity does not change it, and raising it as a finding treats an entry failure as an audit result."
  }},

{id:"A4-05", title:"How to read a material and process certification", body:[
    P("A physical audit cannot verify material by inspection. Titanium and aluminum look alike under paint. What the audit verifies is a chain of three links, and its findings are breaks in that chain."),
    STEPS([
      {h:"Link one. The design calls the material",b:"The drawing or the parts list names the material specification, and the process specification for any special process: heat treat, plating, coating, non-destructive inspection."},
      {h:"Link two. The build record says what was used",b:"The work order or traveler records the material actually drawn, by heat number, lot number or batch number, and records the special processes performed."},
      {h:"Link three. The certificate says what it was",b:"A certificate of conformance or a material test report, traceable to that heat or lot number, stating the material meets the called specification."}
    ]),
    TABLE(["Certificate type","What it asserts","What to check"],[
      ["Certificate of conformance","The supplier states the CI meets the specification","Who signed, the specification named and its revision, and the lot or heat it covers"],
      ["Material test report","Actual test results for the heat or lot","That the results are against the specification called, and that the heat number matches the build record"],
      ["Special process certificate","A process was performed to a specification by an approved source","Source approval status at the date performed, not at the date audited"]
    ]),
    C("Where the chain breaks",[
      "A certificate that covers a different heat number than the build record shows.",
      "A certificate against a superseded specification revision.",
      "A special process performed by a source whose approval had lapsed at the time, and has since been restored.",
      "A build record that names no heat or lot at all, which breaks link two and makes link three unusable."
    ]),
    S("This is the check the wear strip case turns on.",
      "A replacement part made of the wrong metal, installed and certified by nobody, is a break at link two that nothing downstream can find."),
    P("**Material substitutions are where this check earns its cost.** A substitution can be entirely legitimate, approved and recorded. What the audit is looking for is the substitution that happened at the bench, under shortage pressure, where somebody found a part that fitted.")
  ], check:{
    q:"A special process certificate shows a coating applied on 4 March by an approved source. The approved source list shows that source was suspended from 1 February to 20 March and reinstated afterward. The coating is on the audited unit. What is the finding?",
    o:["None. The source is approved now and was reinstated on 20 March",
       "A finding against the approved source list, which was out of date at the time",
       "The source was not approved on 4 March, so the coating carries no valid certification",
       "None, provided the coating passes its inspection on the unit"],
    a:2,
    why:"Source approval is read at the date the work was performed, not at the date of the audit. A suspended source was not approved on 4 March, so the certificate covers work done outside the approval and link three does not close. Later reinstatement does not reach backward. Inspection of the coating is not a substitute, because the whole point of source approval is that the process cannot be verified by looking at the result."
  }},

{id:"A4-06", title:"How to read a traveler and a buy-off", body:[
    P("The traveler is the unit\u2019s build history. It records what operations were performed, in what order, and who accepted each one."),
    TABLE(["What to look at","What it tells you","What a finding looks like"],[
      ["The operation list","What the plan said to do","Operations out of sequence with no recorded authority"],
      ["Sign-offs","Who performed each operation and who accepted it","A missing buy-off on an operation the article clearly received"],
      ["Stamp or badge","The identity accepting the work","A stamp applied by someone without the authority to apply it"],
      ["Inspection points","Where verification was required before the next step","A mandatory inspection point passed with no record, on an operation that later work covers up"],
      ["Calibration references","The equipment used, and its calibration status at the time","Equipment out of calibration at the date of use, found by comparing two dates"],
      ["Attached records","Non-conformance records, deviations run, rework instructions","A traveler that references a record the package does not contain"]
    ]),
    C("The buy-off that matters most",[
      "A **mandatory inspection point** exists because the next operation makes the previous one invisible.",
      "Sealant before a closure panel. A torque before a cover. A weld before paint.",
      "Once the next operation is performed, no inspection can recover the evidence. The buy-off is the only record that will ever exist.",
      "A missing buy-off at a mandatory inspection point is not a paperwork finding. It is a permanent loss of evidence."
    ], "amber"),
    P("**Stamp authority is worth checking rather than assuming.** A stamp is an identity, and identities are assigned, transferred and revoked. A buy-off stamped by an identity that was not authorized for that operation at that date is the same defect as no buy-off at all, and it looks exactly like a complete record."),
    S("The traveler answers what was done and who accepted it.",
      "Where it cannot answer, the article often cannot be made to answer either.")
  ], check:{
    q:"A traveler shows a torque operation signed off by an inspector, followed by installation of a cover that makes the fastener inaccessible. The inspector\u2019s stamp was issued for structural inspection and the operation is classified as a mechanical systems inspection. What is the audit position?",
    o:["A finding. The buy-off lacked the authority for that operation",
       "Pass. The operation was inspected and signed before the cover went on",
       "A finding, closed by re-inspecting the fastener after cover removal",
       "Pass, if the inspector is qualified for both structural and mechanical systems work"],
    a:0,
    why:"A stamp carries a defined authority and this one did not cover the operation, so the buy-off is not valid. It is also at a mandatory inspection point, because the cover makes the fastener inaccessible, and that means the record is the only evidence that will ever exist. Re-inspection is not available. Whether the inspector could have been qualified is beside the point, because what was issued is what they were authorized to accept."
  }},

{id:"A4-07", title:"How to read a Version Description Document", body:[
    P("For software, the Version Description Document is the equivalent of the parts list. It states what this delivery actually is."),
    TABLE(["What it carries","Why the audit needs it"],[
      ["Version identifier and build number","Identity. This is what is compared against the loaded software"],
      ["Media and part number","The deliverable, and its identity in the product structure"],
      ["Build environment","Compiler, version, and build settings. A build is not reproducible without them"],
      ["Component inventory","Every module and library included, developmental and non-developmental"],
      ["Checksums or hashes","What a read-back is compared against"],
      ["Open problem reports","What is known to be wrong in this version"],
      ["Changes since the previous version","What moved, and under which change authority"]
    ]),
    C("Why the build environment is on the list",[
      "The same source code, compiled with a different compiler version or different optimization settings, produces a different executable.",
      "A version description that names the source and not the environment describes something that cannot be rebuilt.",
      "The physical audit asks the same question of software as of hardware: is the thing you delivered the thing the documentation describes. It answers it by building the software in front of witnesses."
    ]),
    P("**The checksum is compared against the article, not against a drawing.** A checksum transcribed into a drawing and never read back from the device proves that somebody typed a number. Check 8, embedded software and firmware load, asks for a read-back from the loaded device, compared against the version description."),
    P("**Non-developmental content is where unrecorded material hides.** Acquired libraries, vendor components, generated code and test harnesses all end up in a delivery, each with a version and a source that somebody assumed rather than recorded. The component inventory is what makes them visible."),
    S("A Version Description Document that cannot be used to rebuild the delivery is not a version description.",
      "It is a label.")
  ], check:{
    q:"The Version Description Document names the source repository and commit, the component inventory, and a checksum. It does not name the compiler version or the build settings. The witnessed build produces an executable whose checksum does not match. What does this tell you?",
    o:["The delivered software is not the software described, so the finding is the delivery",
       "The version description is incomplete, so nobody can establish which of the two is correct",
       "The build was performed incorrectly by the audit team on the day",
       "The checksum in the version description was transcribed wrongly"],
    a:1,
    why:"A mismatch is a fact and it does not say which side is wrong. Without the compiler version and the build settings, the build just witnessed may differ from the build that produced the delivery for a reason nobody can now identify. The finding is that the version description cannot support a rebuild, which is what makes the mismatch unresolvable. Any of the other explanations may also be true, and none of them can be established from what is on the page."
  }},

  {id:"A4-08", title:"Conducting the physical audit", body:[
    P("Two objectives are easy to miss, and both sit beside the obvious one. The physical audit verifies two further things. First, that **anything redesigned after the functional audit still meets the performance specification.** Second, that the **acceptance testing requirements in the documentation are adequate to accept production units.** The second is a check on the acceptance criteria themselves, not on one unit's acceptance results."),
    P("Then the examination."),
    STEPS([
      {h:"Reconcile the CI to its documentation",b:"CI to drawings, to associated lists, to parts list, with effectivity and next assembly, and with the accuracy of notes, references and referenced released documents checked rather than assumed."},
      {h:"Review the agreed sample",b:"The sampled drawings and model data against the matching manufacturing instructions, confirming that the instructions reflect the design detail and incorporate the authorized changes. This is where documentation that is correct at the top and wrong at the bench is found."},
      {h:"Confirm the parts, then look at the parts",b:"Confirm compatibility with the approved parts selection list, and then **physically examine the CI to confirm the proper parts are actually installed.** The parts, not the records about the parts."},
      {h:"Verify change incorporation and reconcile the delta",b:"Confirm approved changes are incorporated, using status accounting reports and selective review, and reconcile and correct any difference between as-designed and as-built data for the unit. The reconciliation report for this unit arrives as a claim, not as evidence: the examination is what establishes whether it was right."},
      {h:"Identify and certify unit differences",b:"Between this unit and the unit used at the functional audit, with the certification that the differences do not degrade functional characteristics."},
      {h:"Review the awkward records",b:"Completed shortage lists and undocumented design changes; confirm no unapproved changes exist in the technical documentation and that every approved change is in the hardware."}
    ]),
    P("Those six steps are the shape of the examination. The next two sections give its content. The checks the audit team performs, what each compares against what, and what a finding looks like in each."),
    S("A record can agree perfectly with the design while the hardware does not. That gap is the entire reason this audit exists.",
      "Which is why the step is examine the CI, and not review the record of the CI."),
    C("The anchor, stated plainly",[
      "A door plug left an assembly line without all four retention bolts, and the as-built record did not show it. Every paper check that existed agreed with every other paper check.",
      "The examination of the physical article is the step that is not reducible to a record, and it is the step under most pressure whenever a schedule is tight."
    ])
  ], check:{
    q:"At a physical audit, the parts list, the as-built record and the status accounting report all agree that the correct connector is fitted. The audit team is offered those three records in place of opening the unit, since three independent records already agree. What is the objection?",
    o:["There is none. Three independent records agreeing beats one visual inspection",
       "All three are records. The audit requires the CI to be examined",
       "The records are only acceptable if the Acquirer's representative countersigns them",
       "Two records would be insufficient, but three is the accepted threshold"],
    a:1,
    why:"Three agreeing records feel like independent confirmation, and that is the exact reasoning the requirement was written against: records can be consistent with each other and jointly wrong about the hardware, because they often derive from a common source. The physical examination is the only step that is not a record, which is why it is specified separately and why it survives schedule pressure badly."
  }},

  {id:"A4-09", title:"What the physical examination compares: part one", body:[
    P("The previous section described the shape of the examination. This section and the next give it its content: the checks the audit team performs on every CI designated for the physical audit."),
    P("Checks 2 and 3 both depend on knowing which life limit clock a part runs on, and on knowing whether the part was required to be serialized or lot controlled. The parts list states all three. The section on reading a parts list covers them. Read that before you read these checks, because a finding written against the wrong clock does not survive the exchange with the supplier."),
    P("There is one failure this check set exists to prevent, and it is worth naming before the checks themselves. A team under time pressure will reduce the examination to the comparison that is easiest to make: the part number on the product definition data against the part number on the article. That comparison establishes **identity.** It says the article is nominally the thing the data names. It says nothing about whether the article conforms to what that data requires."),
    S("Matching part numbers establishes identity. Every other check exists because identity is not conformity.",
      "An article can carry the right part number and be wrong in a dozen recorded ways."),
    P("The checks group by what is being compared. Part one covers the first group; the rest follow in the next section."),
    TABLE(["Check","What is compared","What a finding looks like"],[
      ["1. Physical item to product definition data [in full]","The article against the correct revision of its product definition data for its effectivity. Note that a part number does not itself carry a revision. The data defining the part does, and a change requiring a different part produces a different part number","The article does not conform to the governing revision; or the governing revision cannot be established from the article and its records without inference"],
      ["2. Serialization and traceability [in full]","Serial, batch, lot and heat numbers physically on the article, against the traceability requirements **and** against the as-built records. Which identifier applies follows the record structure of the part, not its hazard severity. A serial number applies where the approved basis for continued service depends on what happened to that individual unit. A lot or batch number applies, with a date code where a shelf-life or cure limit applies, where lot acceptance is sufficient. Identifiers are never re-used and never revised, and a modified unit keeps its original unit identifier even though the part number changes","Any of the three sources disagreeing. Two of three agreeing is a finding, not a pass. A part on a per-unit life clock delivered with no consumed-life record, which can then never be scheduled for removal. A unit identifier that traces to a superseded part number is not by itself a finding, because a modified unit keeps its original identifier"],
      ["3. As-designed to as-built child item reconciliation [sampled; in full for safety-related CIs]","Every child item on the as-designed data, against the completed and closed build records. Work orders and non-conformance record dispositions","A child item on the as-designed data with no entry in the build record. Treat absence in the record as the finding; do not resolve it by looking at the article and concluding the part must be there"],
      ["4. Engineering change commitment incorporation [in full, for all applicable approved changes]","All approved change commitments applicable at the milestone and effectivity, and any temporary redlines or flight changes, against the physical unit","An approved change not incorporated; a change incorporated that was not approved; a temporary marking whose status nobody can establish"],
      ["5. Non-conformance records and variances [in full]","Every non-conformance raised against the unit, against the adjudication its classification requires","Adjudication by an authority below the classification; an unresolved non-conformance open against the CI at audit"],
      ["6. Interface and workmanship [sampled]","Dimensions, critical interfaces, connector pin assignments, harness routing, bonding, surface finishes, coatings and torque stripe application, against the engineering data","A non-conforming feature, or a conforming feature whose inspection record disagrees with the article, which is evidence about the inspection system rather than about the part"],
      ["7. Nameplate, marking and tagging [in full]","Part markings, serial plates, warning labels and unique identification, against the marking instructions in the product definition data","Inaccuracy, and equally: illegibility, impermanence, or the correct marking in the wrong location"],
      ["8. Embedded software and firmware load [in full]","The load, version, part number and checksum in each programmable device, against the version description produced by the witnessed build, not against a value transcribed into a drawing","A checksum matching a drawing but not the version description; a device that cannot be read back and has no witnessed load record"],
      ["9. Build traveler and quality buy-off [sampled]","The traveler, inspection logs and test records, against the operations the data requires","A missing or invalid buy-off; a stamp applied without the authority to apply it"]
    ]),
    C("How much of each",[
      "The depth of each check is fixed by the check set and shown in brackets beside its name. Some run in full. Others run against a sample, and the approved audit plan sets the sample size.",
      "The plan sets sizes, because sizes belong to the CI rather than to a general rule. The plan does not decide which checks run in full. That is already decided.",
      "One rule is fixed and not tailorable: **features implementing or protecting hazard risk controls, and safety-critical characteristics, are in the sample. They are never sampled out.**",
      "None of this makes the physical audit a re-inspection. It samples in order to judge whether inspection and process control worked."
    ])
  ], check:{
    q:"An audit team reports that the CI passed the examination: every part number on the article matched the part number on the product definition data, and nothing else was examined. What has actually been established?",
    o:["Only that the article is nominally the CI the data names. Identity, not conformity",
       "That the article conforms to its product definition data in every respect",
       "That the article conforms, provided the data was at the current revision",
       "Nothing at all, since part number comparison has no value on its own"],
    a:0,
    why:"Adding revision currency to the comparison is the closest miss and worth sitting with: it makes a better identity check, and it is still an identity check. Conformity is established by the other comparisons in the set. Traceability, child item reconciliation, change incorporation, materials, instructions. Part number matching is not worthless either; it is simply the first check and not the set."
  }},

  {id:"A4-10", title:"What the physical examination compares: part two", body:[
    P("The remaining checks. Several of these are the ones most often absent from a physical audit that otherwise looks thorough. Two of them are mandatory for safety: identifying the differences between the physical audit unit and the functional audit unit, and verifying the installed parts against the approved parts selection list. Both are marked in the table. Neither is tailorable, and neither is sampled out."),
    TABLE(["Check","What is compared","What a finding looks like"],[
      ["10. Functional audit unit to physical audit unit differences [in full]","The unit being audited against the unit or units used for functional verification, with certification that the differences do not degrade functional characteristics","Any unidentified difference. Identification alone is not sufficient. The certification is the deliverable. This is mandatory for safety"],
      ["11. Manufacturing instructions to product definition data [sampled]","The sampled product definition data, against the manufacturing and work instructions actually used to build this unit","An instruction reflecting a superseded revision, or omitting design detail. The build record and buy-off check asks whether the traveler was followed. This asks whether the traveler was **right**"],
      ["12. Zone foreign object debris, where the CI is embodied [in full, for all closed areas]","The zone or area in which the CI is embodied, against its closeout records. Where the CI is embodied at the time of the audit","An area closed with no recorded closeout inspection. Where the CI is not embodied, the check is recorded as not applicable rather than omitted"],
      ["13. Part approval, clearance and qualification records [sampled]","The part types installed, against their approval, clearance and qualification records and the approved parts selection list","A part matching the drawing that was never approved for use; a part de-listed after the data was released, through obsolescence, source disqualification or counterfeit alert. Verifying installed parts against the approved parts selection list is mandatory for safety"],
      ["14. Part certification status and plan status [in full]","The certification status of the CI and its parts, and the status of the certification plan items applicable at this milestone","An open plan item nobody can identify, or a certification credit resting on a superseded configuration. An open item at this milestone is not automatically a finding"],
      ["15. Material and process conformance [sampled; in full for safety-related CIs]","Three links: the material specification in the product definition data, against the material note on the as-built record, against the **material certification for the heat or lot number.** Special processes carry process certification in place of the material certificate","A break anywhere in the chain. A two-link check catches a build record that disagrees with the design; only the third link catches a build record that faithfully records what was ordered when what was delivered differed"],
