      ["Data package index","An inventory of every artifact assembled, **with its revision at the time of the audit.**"],
      ["Audit minutes","The required content, including the traceability and test matrix for the functional audit. Delivered within sixty days of completion or per contract."],
      ["Finding records","Each with its classification, closure plan, responsible party, suspense date and closure evidence."],
      ["Summary and final reports","The consolidated summary, and the detailed final report issued after the Acquirer verifies completed CIs."],
      ["Certification forms","Joint certifications for each audit, and the baseline certifications."],
      ["Status accounting entries","Scheduled and actual dates, results per CI, and the product baseline formalization entry."]
    ]),
    P("Now the part that outlives the audit."),
    P("Audit findings are evidence about the **configuration management process**, not only about the CI. A finding that manufacturing instructions lag approved changes is not a fact about one part; it is a measurement of how change propagation performs on that line. A finding that a build cannot be reproduced is not a fact about one software release; it is a measurement of how the toolchain is controlled."),
    S("A systematic finding should change how the process runs. Repeat findings across audit cycles are the signal that it did not.",
      "The second audit that finds the first audit's problem is telling you about the organization, not the CI."),
    C("What to do with a finding once it is closed",[
      "Ask what the finding measured. Then ask whether that measurement should have shown up somewhere before an audit found it. In reconciliation health, in escape history, in a designation assessment.",
      "If the answer is that nothing would have shown it, the process has a blind spot and the finding just mapped it.",
      "**That is what a good audit changes.** Anything less and the audit was an inspection of one unit that happened to be expensive."
    ],"teal")
  ], check:{
    q:"A physical audit finds that manufacturing instructions for three parts lag approved changes. The findings are closed correctly: instructions corrected, closure evidenced, certification completed. Two years later the next audit on the same line finds the same pattern on different parts. What does the second audit tell you?",
    o:["That the first audit's findings were closed incorrectly after all",
       "That the sampling in the first audit was too narrow to find the full extent of it at the time",
       "That the line requires more frequent audits than it is getting",
       "That the finding was treated as a fact about three parts, not as a measurement of the line"],
    a:3,
    why:"The first audit's CIs really were closed correctly, which is what makes this uncomfortable: nothing was done wrong in the closure. What was missed is that a systematic finding is a measurement of a process, and correcting the three instances left the propagation mechanism exactly as it was. More frequent audits would find it again more often, which is detection, not correction."
  }}

 ],
 exercises:[

  {id:"A6-E1", title:"Exercise 1: Classifying a mixed set",
   scen:"A physical audit produces six findings. (1) One installed fastener is not on the approved parts selection list; it was substituted during a shortage with verbal supervisor approval. (2) Twenty-three drawings in the sample carry the same misspelled material name, with the correct specification number cited in each case. (3) The as-built record for the audit unit omits two of the changes that are physically present in the hardware. (4) First article data for a newly sourced bushing is missing two dimensional results. (5) A work instruction reflects a superseded drawing revision; investigation shows change notices reach the shop through an unmonitored shared folder. (6) The operation and support manual references an obsolete part number in one table.",
   parts:[
     {id:"a", q:"Classify each of the six and give the reasoning that produced the classification, not just the verdict."},
     {id:"b", q:"Two of these look like the same finding at different scales but are classified differently. Identify them and explain the difference."},
     {id:"c", q:"Which single finding would worry you most about the organization rather than about this unit, and why?"},
     {id:"d", q:"For finding 3, what does it tell you about the reconciliation activity, and what would you expect to see if you looked at other units from the same line?"},
     {id:"e", q:"Write the four required elements for finding 5 as you would record them."},
     {id:"f", q:"For one of the six you would want a fact you do not have before finalizing the classification. Name the finding, the fact and who you would ask."}
   ]},

  {id:"A6-E2", title:"Exercise 2: May this audit be certified?",
   scen:"A functional audit concludes. Of the CI's requirements, all but seven are verified with traceable evidence. Four of the seven depend on integrated system testing scheduled in ten weeks. Two are verified by analyses that the Acquirer's engineer disputes as inadequate. One is a hazard-control requirement whose test was run and failed, with a design change now proposed. Three findings from the audit are open with agreed closure plans, owners and suspense dates. The program manager asks you to certify the audit as complete and successful so the program can report the milestone.",
   parts:[
     {id:"a", q:"Take the seven unverified requirements in three groups and say how each group is handled."},
     {id:"b", q:"Can this audit be certified complete and successful? State what certification is available and what it would say."},
     {id:"c", q:"What Acquirer dispositions are possible here, and which would you expect?"},
     {id:"d", q:"The hazard-control requirement failed its test. What happens to it, and what is not acceptable as a route to closure?"},
     {id:"e", q:"Two analyses are disputed. Is that a finding, a difference of engineering opinion, or something else? How is it recorded either way?"},
     {id:"f", q:"What is the consequence for the product baseline of everything you have just described?"}
   ]},

  {id:"A6-E3", title:"Exercise 3: A record set that will not survive",
   scen:"You are asked to review the record set from an audit conducted eighteen months ago on a CI now in production. You find: minutes listing documents by title and number with no revision levels; a finding log with five entries, three of which name a department rather than a person as responsible; no data package index; a summary report; a certification form recording the audit as complete and successful, signed by the Supplier's audit lead and program manager but with no Acquirer signature; and status accounting entries showing the audit date but no result. There is no record of any designation assessment for the CI.",
   parts:[
     {id:"a", q:"List what is missing or defective against the record set that should exist, and say what each gap costs the organization now."},
     {id:"b", q:"The certification says complete and successful but carries no Acquirer signature. What are the possible explanations, and how would you tell them apart?"},
     {id:"c", q:"Three findings name a department rather than a person. Why does that matter eighteen months later specifically?"},
     {id:"d", q:"There is no designation assessment. What does its absence prevent you from establishing?"},
     {id:"e", q:"What is the status of the product baseline for this CI, on this evidence?"},
     {id:"f", q:"You can fix some of this retrospectively and not all of it. Separate the two, and say what you would do about the part you cannot fix."}
   ]},

  {id:"A6-E4", title:"Exercise 4: One CI, end to end",
   scen:"A hydraulic manifold is procured for a safety-significant product line. At award it is not named in the contract as requiring an audit. It hosts a hazard risk control recorded in the hazard log. It is a new design. The supplier designs and builds it under your source control drawing and supplies its embedded control firmware. Eight months before first delivery you are asked to take the CI from designation for audit through to a closed audit record. Assume nothing has been done yet.",
   parts:[
     {id:"a", q:"Work the designation assessment and state the disposition, including who signs it and why."},
     {id:"b", q:"Plan the audits: which, in what order, where, and what would make a combined event defensible or indefensible here."},
     {id:"c", q:"Build the preparation outline: the entry criteria for each audit with providers, what must be true of the audit unit\u2019s build records before it convenes, and the three or four data package CIs you consider most at risk on this CI specifically."},
     {id:"d", q:"Describe what happens in the room for the physical audit, in the order it happens, and name the step that cannot be replaced by a record."},
     {id:"e", q:"The firmware build is attempted during the audit and fails. Walk the consequences through findings, certification, disposition and the product baseline."},
     {id:"f", q:"List the records that exist at the end, and say which of them a program two years from now will actually need."},
     {id:"g", q:"Name the one fact in this scenario you would most want confirmed before starting, who holds it, and what you would do if it did not arrive in time."}
   ]},

  {id:"A6-E5", title:"Exercise 5: Two teams, two wrong answers",
   scen:"Your program has 96 CIs. Fourteen of them are designated for audit. One supplier designs and builds four of the 96 under source control drawings, and one of those four is designated for audit. A second supplier plates parts that end up inside three CIs designated for audit. A third supplier builds a bracket to your released drawing; the bracket is controlled inside its parent CI drawing package and is not a CI in its own right.\n\nThe audit team has scheduled functional and physical audits for all 96 CIs and is asking why the budget will not cover it. The supplier management team has written full audit obligations into the source-control supplier statement of work for all four CIs, and has written audit obligations into the plating house statement of work as well.",
   parts:[
     {id:"a", q:"How many audits should be scheduled, and what is wrong with the audit team plan? What happens to the CIs that are not audited?"},
     {id:"b", q:"For the source-control supplier: what changes between the one CI designated for audit and the other three? Name the deliverables that move and the ones that do not."},
     {id:"c", q:"For the plating house: three CIs designated for audit contain their work. What audit obligations do they owe, and why?"},
     {id:"d", q:"For the bracket supplier: can any audit deliverable ever become due for that CI? Reason it out from what an audit is an audit of."},
     {id:"e", q:"Write the one sentence you would send to both teams that corrects both errors at once."}
   ]}

 ]
},
{
 id:"A7", label:"Module 7", title:"Audits at a supplier",
 sub:"Ceremony and substance, work types, and running an audit on another company\u2019s floor.",
 sections:[

  {id:"A7-01", title:"Ceremony and substance", body:[
    P("Not every audit is chaired by the Acquirer. Where an audit is initiated internally, because risk-based designation for audit, not the contract, put the CI on the list. The **ceremony** may be simplified: an internal co-chair, and internal certification in lieu of Acquirer participation."),
    P("The **substance** is performed in full. Specifically: the requirements-to-test reconciliation and its traceability matrix; the as-built examination including verification that the proper parts are installed; the identification and certification of differences between the production unit and the functional audit unit; and the documented non-compliances."),
    P("The distinction generalizes, and it is one of the most useful judgments in this training."),
    CARDS([
      {h:"Ceremony", b:"Who chairs. Who signs. How formal the setting is. Whether a record is a form or a section of the minutes. How a sample is drawn rather than checking exhaustively where sampling is agreed. These can be proportionate to the situation."},
      {h:"Substance", b:"Whether the comparison is actually made. Whether the article is actually examined. Whether the non-compliance is actually written down and provided. These do not scale with formality, because they are the audit."}
    ],2),
    S("Removing a verification because an automated system is asserted to prevent the failure is substance. That verification exists to test the assertion.",
      "The tool being trustworthy is the hypothesis, not the evidence."),
    P("A working test, when you are unsure which side of the line a proposal falls on: **if this is removed, does anyone still find out?** Simplifying who signs a certificate changes nothing about what would be discovered. Simplifying the form a finding is recorded on changes nothing about whether it is recorded. Removing the examination, the reconciliation or the documented non-compliance changes exactly one thing. Whether the organization learns what is true."),
    C("The argument you will hear, and the answer",[
      "\u201cOur toolchain enforces requirement-to-test linkage automatically, so the reconciliation is redundant.\u201d",
      "The reconciliation is how anyone finds out whether the toolchain does what it is believed to do. Every automated control has a configuration, and a control configured wrongly enforces nothing while reporting success.",
      "A proportionate response is to sample the reconciliation rather than walk every requirement, where sampling is agreed. That is ceremony. Removing it is not."
    ])
  ], check:{
    q:"An internally initiated physical audit is planned. The supplier proposes two simplifications: an internal co-chair and internal certification instead of Acquirer participation, and sampling the as-built examination rather than examining the unit, because their automated build-verification system would have flagged any discrepancy. Which is acceptable?",
    o:["Both. An internally initiated audit may be tailored by the supplier",
       "The chairing change only. Chairing and certification are ceremony. The examination is substance",
       "The sampling change only. Chairing is fixed, while examination method is at the auditor's discretion",
       "Neither. An internally initiated audit is conducted identically in every respect"],
    a:1,
    why:"The two proposals arrive together and sound like one request for proportionality, which is the difficulty. Who chairs and who signs are arrangements around the audit. Whether the article is examined is the audit. Refusing any tailoring at all overcorrects: the ceremony genuinely may be simplified, and pretending otherwise makes the distinction impossible to teach or to hold."
  }},

  {id:"A7-02", title:"Work types: how a supplier's audit role is decided", body:[
    P("When a CI is designated for audit and a supplier builds it, designs it, or writes its software, somebody has to say what that supplier is obliged to do. That obligation is not negotiated case by case. It is read off the **type of work** the supplier performs."),
    P("Work type is settled by two questions, asked in this order:"),
    STEPS([
      {h:"Who holds design authority for the CI?",b:"Your company, the supplier, or a vendor. This decides whether the supplier can change the design at all, and therefore whether they can be the activity that verifies it against requirements."},
      {h:"Who performs the build?",b:"Your company, the supplier, or nobody, because some procurements deliver a design or a process rather than an article. This decides whether there is anything at the supplier for a physical examination to examine."}
    ]),
    P("Those two answers produce the work type, and the work type produces the audit role."),
    TABLE(["ID","Type of work","Design authority and build","Audit role when the CI is designated for audit"],[
      ["WT01","Build-to-print","Your company designs. The supplier builds to the released data package.","Supports the physical audit on its build: facility access, as-built records, approved-parts evidence, and the manufacturing instructions actually used. No functional audit role, because the supplier holds no functional or allocated documentation to audit against"],
      ["WT02","Source-controlled design and build","The supplier designs the internals. Your company controls form, fit, function, interface, and qualification. The supplier builds.","Conducts the CI-level functional and physical audits at its own facility, substance in full"],
      ["WT03","Design agent","The supplier develops the design. Your company builds. The deliverable is the data package.","Data support: the technical data package and traceability matrix inputs. No physical examination role, because the build is not theirs"],
      ["WT04","Full CI design and build to company specification","The supplier holds design authority at its level and also builds the CI.","Conducts the CI-level functional and physical audits at its own facility, substance in full. The heaviest flowdown of any type"],
      ["WT05","Vendor item, commercial or catalog item","The vendor holds the design. Your company controls selection only.","Generally none. Version and media documentation and change or discontinuance notice still apply"],
      ["WT06","Software or firmware development","The supplier develops deliverable software or embedded code.","Conducts the software functional audit, and the witnessed build and installation verification against the version description"],
      ["WT07","Repair and overhaul","The supplier maintains fielded configuration.","Generally none, though the as-maintained records support audits of the parent CI"],
      ["WT08","Special process services","Process work only. There is no CI design.","None. Process change notification still applies"],
      ["WT09","Installation build to company-provisioned materiel","The supplier assembles a complete end item from materiel your company provides or directs. It holds no design authority.","Hosts the end-CI and system-level audit on its build. It provides the article, the facility, access including the installation zone, the zone closeout records, and the assembled evidence. It also provides data support to the end-CI functional audit. It does not conduct, because design authority sits with the company. Your company or the customer conducts."]
    ]),
    P("Four labels appear in that table, and three of them are obligation classes. A supplier **conducts**, **hosts**, or **supports**."),
    L([
      "**Conducting** an audit requires design authority. The supplier has to hold documentation of its own to verify the CI against.",
      "**Supporting** one means providing data and access for a build inside somebody else's audit.",
      "**Hosting** means providing the article, the facility and the evidence for an audit somebody else conducts on your floor. A WT09 supplier holds no design authority, so it cannot conduct. The system-level audit still has to happen where the end item is assembled, which is their floor.",
      "**Data support** is the fourth label and it is not a fourth class. It is the form support takes for a design agent who performs no build. They owe the data and nothing physical, because there is no build of their own to examine."
    ]),
    P("Two rules govern the edges of that table, and both are routinely missed."),
    L([
      "**Mixed work takes the most demanding role, per obligation.** A supplier who designs and builds a unit under a source control drawing *and* writes its embedded firmware holds two types. They conduct the CI-level audits **and** the software functional audit **and** the witnessed build. You do not pick the dominant type and apply it. That union runs across kinds of work **on one procured CI**. It does not run across two procured CIs delivered under one procurement. A supplier shipping a source-controlled assembly and a catalog power supply in the same crate has delivered two articles under two design authorities, and a reconciliation obligation that is real for the first has nothing to act on in the second.",
      "**No audit role never means no verification.** Reconciliation reports per delivery, part traceability records, first article inspection, status accounting and identification and marking all flow by work type regardless of whether any CI is ever designated for audit. A supplier with no audit role is still producing the reconciliation output that audits elsewhere sample."
    ]),
    S("The CI's designation for audit decides whether a supplier audit happens. The work type decides only what that supplier's part of it is.",
      "Two different questions. Answering the first with the second is how a CI designated for audit ends up with no supplier obligation attached to it.")
  ], check:{
    q:"A supplier designs and builds a pump under your source control drawing and also writes its embedded firmware. Your procurement lead classifies the engagement by its dominant activity, design and build, and sets the audit obligations from that alone. What has been lost?",
    o:["Nothing. Design and build is the more demanding type, so it covers the software work",
       "The software obligations. Mixed work takes the most demanding role",
       "Nothing, provided the firmware is delivered inside the pump rather than separately",
       "The physical audit obligation, which does not apply to suppliers writing software"],
    a:1,
    why:"Design and build genuinely is the heavier engagement overall, which is what makes dominant-type classification feel reasonable. But the rule is applied obligation by obligation, not engagement by engagement: nothing in the design-and-build role produces a witnessed rebuild against a version description. The software functional audit and the witnessed build and installation verification apply in addition to the CI-level audits. Where the firmware physically sits makes no difference to who is obliged to verify it."
  }},

  {id:"A7-03", title:"When a supplier audit becomes due", body:[
    P("Audit obligations attach to the designation of the CI for audit. They do not attach to a category of supplier, and they do not attach at a fixed moment. There are two ways they arrive."),
    CARDS([
      {h:"Designated at award", b:"The CI is already designated for audit when the work is placed. The audit requirements are imposed unconditionally in the statement of work and the audit deliverables are scheduled like any other deliverable."},
      {h:"Designated later", b:"The CI is not designated for audit at award and becomes designated for audit afterwards. This is the common case, and it is the one that goes wrong."}
    ],2),
    P("It goes wrong for a specific reason. **Awarding the work re-runs the designation assessment, and adds one risk factor to it.** A new or changed sub-tier supplier for a CI or its critical components is one of the eight risk factors. One factor on its own does not designate the CI for audit. Designation for audit follows where that factor combines with another one, or where a mandatory or safety criterion applies. Because the reassessment runs after award, placing a subcontract can therefore lead to the designation for audit that imposes audit obligations on that same subcontract. Obligations that did not exist when the statement of work was written a fortnight earlier."),
    S("Deciding audit applicability once, at proposal time, converts every later designation for audit into a contract change negotiated from the weakest position you will ever hold.",
      "The supplier has the work, you need the obligation, and price discovery happens at that moment."),
    P("The answer is a **standing conditional audit clause**. Every statement of work for a CI where designation for audit is possible carries conduct, host, or support obligations. Those obligations take effect if and when the CI is or becomes designated for audit. The audit deliverables are named as triggered CIs. It costs nothing to carry and it removes the negotiation entirely."),
    P("Beyond award, the assessment is re-run for the CIs a supplier builds on any of these:"),
    L([
      "A change of source, process, facility or tooling at that supplier.",
      "A safety-relevant escape traceable to their work.",
      "A reconciliation miss your company discovers in what they delivered.",
      "An adverse configuration audit result.",
      "A determination that the supplier's configuration management is ineffective. Ineffectiveness and escape history are themselves audit designation factors for the CIs they build."
    ]),
    P("When designation for audit does arrive, what becomes due depends on the role. A supplier who **conducts** owes the audit plan and agenda, the data package scoped to their audits, the minutes including the traceability matrix, and the finding records tracked to closure. Minutes within sixty days as anywhere else. A supplier who **supports** owes facility access, as-built records, approved-parts evidence and the manufacturing instructions actually used on the build."),
    C("One rule about how these are written",[
      "**A requirement cited without its deliverable is unenforceable at receipt and unverifiable at audit.** \u201cSupport configuration audits as required\u201d obliges nobody to produce anything on any date.",
      "Every audit obligation is cited with the thing that evidences it and the event that triggers it. That is what makes the conditional clause work rather than merely exist."
    ])
  ], check:{
    q:"A statement of work is being written for a machined housing. The CI is not designated for audit today, and the supplier is new to your company. The procurement lead proposes to leave audit requirements out and add them by contract change if designation for audit ever happens. How do you answer?",
    o:["Agree. Imposing audit obligations on an undesignated CI is unnecessary cost",
       "Agree, provided the classification log records that audit applicability was considered",
       "The statement of work carries a standing conditional audit clause from the start",
       "Impose the audit obligations unconditionally now, since designation is likely"],
    a:2,
    why:"Awarding to a new sub-tier source re-runs the designation assessment and adds a risk factor, so this award may be what designates the CI for audit. Recording that the question was considered is genuinely good practice and is why the classification log answer is tempting, but a record of a decision is not an obligation on the supplier. Imposing unconditionally overshoots: the obligations should attach to designation for audit, not to a guess about it. The conditional clause costs nothing while the CI stays undesignated and works instantly if that changes. Adding the obligation afterwards is negotiated from the weakest position."
  }},

  {id:"A7-04", title:"Worked examples: supplier roles and triggers", body:[
    P("Six procurements on one program. Decide the work type, the role and the trigger position for each before reading across."),
    TABLE(["Procurement","Role if the CI is designated for audit","Trigger position"],[
      ["Machine shop building housings to your released drawings","Supports the physical audit on its build","New source. The award itself is an audit designation trigger for the parent CI, so the statement of work carries the conditional clause even though nothing is designated for audit today"],
      ["Supplier designing and building a valve under your source control drawing, including its firmware","Conducts the CI-level functional and physical audits, plus the software functional audit and the witnessed build","Mixed work. Both roles apply. If designated for audit at award, the obligations are unconditional and the deliverables scheduled"],
      ["Design house producing the data package for a fitting your company manufactures","Data support: data package and traceability matrix inputs","No build at the supplier, so no physical examination role. Their traceability matrix inputs still feed your functional audit, and their release discipline is the product"],
      ["Catalog power supply bought to a vendor item control drawing","Generally none","Change or discontinuance notice still applies, and a vendor change to that vendor item is a trigger to reassess the parent"],
      ["Plating house anodizing to your process specification","None","Process change notification applies. A process change at this supplier re-runs the audit designation assessment for every CI that goes through it. That is usually more CIs than the buyer realizes"],
      ["Repair station overhauling fielded units","Generally none","As-maintained records support audits of the parent CI; retrofit incorporation and consumed life have to survive the overhaul"]
    ]),
    C("\u201cWe are only build-to-print, so audits do not apply to us.\u201d",[
      "Half right, and the half that is wrong is expensive. Build-to-print suppliers never *conduct* an audit. They do support the physical audit on their build, and support means unencumbered access to their floor, their as-built records, their evidence that the installed parts are the approved parts, and the manufacturing instructions their people actually used.",
      "A supplier discovering that obligation on the day, from a statement of work that never mentioned it, is entitled to be unhappy about it."
    ]),
    C("\u201cThe CI was not designated for audit, so we did not cite audit obligations.\u201d",[
      "This is the failure the conditional clause exists to prevent, and it usually surfaces the moment a source change or an escape re-runs the assessment.",
      "Ask the second question too: were the reconciliation report, the part traceability record and the first article requirements cited? Those flow by work type regardless of designation for audit, and a statement of work missing audit obligations is often missing those as well, which leaves nothing for an audit to sample even if one is later held.",
      "**No audit designation is not the same statement as no verification flowdown.**"
    ],"teal")
  ], check:{
    q:"Your company changes the anodizing process specification used by a plating house that has no audit role of any kind. What follows for audit designation?",
    o:["The process change is a designation trigger for the CIs that go through it",
       "Nothing. The plating house has no audit role, so no audit consequence arises",

var STATE = { name:"", started:new Date().toISOString(), checks:{}, answers:{}, seen:{}, order:{} };
var VIEW = { page:"start" };          // "start" | "s:<id>" | "x:<modId>" | "submit"
var PAGES = [];                        // flat ordered page list
var AUTOSAVE = false;

(function buildPages(){
  PAGES.push({k:"start", id:"START", nm:"Start here", grp:null});
  for(var i=0;i<MODULES.length;i++){
    var m=MODULES[i];
    for(var j=0;j<m.sections.length;j++){
      PAGES.push({k:"sect", id:m.sections[j].id, nm:m.sections[j].title, grp:m.id, mi:i, si:j});
    }
    PAGES.push({k:"ex", id:m.id+"-EX", nm:"Exercises", grp:m.id, mi:i});
  }
  PAGES.push({k:"submit", id:"RESULTS", nm:"Review and send", grp:null});
})();

/* ---- guarded browser storage: used only if the browser allows it ---- */
function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ window.localStorage.removeItem(k); return true; }catch(e){ return false; } }

/* ---- clear all: two-step arm so one stray click cannot wipe the record ---- */
var CLEAR_ARMED = false, clearT;
function clearLabel(){ return 'Clear<span class="lng"> all</span>'; }
function disarmClear(){
  CLEAR_ARMED = false;
  clearTimeout(clearT);
  var b = document.getElementById("btnClear");
  if(b){ b.innerHTML = clearLabel(); b.classList.remove("armed"); }
}
function armClear(){
  CLEAR_ARMED = true;
  var b = document.getElementById("btnClear");
  b.innerHTML = "Confirm clear";
  b.classList.add("armed");
  toast("This erases every answer and every check. Click Confirm clear to go ahead. The button resets itself in ten seconds.");
  clearTimeout(clearT);
  clearT = setTimeout(disarmClear, 10000);
}
function resetAll(){
  disarmClear();
  STATE = { name:"", started:new Date().toISOString(), checks:{}, answers:{}, seen:{}, order:{} };
  VIEW  = { page:"start" };
  lsDel("catrain_state");
  var w = document.getElementById("who");
  if(w) w.value = "";
  draw();
  window.scrollTo({top:0,behavior:"auto"});
  var r = document.getElementById("rail");
  if(r) r.classList.remove("open");
  toast("Cleared. Answers, checks, and the trainee name are gone. You are back at the start.");
}
(function detect(){ AUTOSAVE = lsSet("catrain_probe","1"); })();

function autosave(){
  if(!AUTOSAVE) return;
  lsSet("catrain_state", JSON.stringify(STATE));
}
function autoload(){
  if(!AUTOSAVE) return false;
  var raw = lsGet("catrain_state");
  if(!raw) return false;
  try{ var o=JSON.parse(raw); if(o && o.checks){ STATE=o; if(!STATE.order) STATE.order={}; return true; } }catch(e){}
  return false;
}

/* ==========================================================================
   RENDERING HELPERS
   ========================================================================== */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
}
function block(b){
  if(b.t==="p") return "<p>"+fmt(b.x)+"</p>";
  if(b.t==="list") return "<ul class='pl'>"+b.x.map(function(i){return "<li>"+fmt(i)+"</li>";}).join("")+"</ul>";
  if(b.t==="callout") return "<div class='callout "+(b.tone==="teal"?"teal":"")+"'>"+
      (b.lab?"<div class='lab'>"+esc(b.lab)+"</div>":"")+
      b.x.map(function(i){return "<p>"+fmt(i)+"</p>";}).join("")+"</div>";
  if(b.t==="stmt") return "<div class='stmt'><b>"+fmt(b.x)+"</b>"+(b.sub?"<span>"+fmt(b.sub)+"</span>":"")+"</div>";
  if(b.t==="cards") return "<div class='cards c"+b.cols+"'>"+b.x.map(function(c){
      return "<div class='card'><h4>"+fmt(c.h)+"</h4><p>"+fmt(c.b)+"</p></div>";}).join("")+"</div>";
  if(b.t==="steps") return "<div class='steps'>"+b.x.map(function(s,i){
      return "<div class='step "+(b.tone||"")+"'><div class='n'>"+(i+1)+"</div><div class='tx'><b>"+fmt(s.h)+"</b><span>"+fmt(s.b)+"</span></div></div>";}).join("")+"</div>";
  if(b.t==="table"){
    var th="<tr>"+b.head.map(function(h){return "<th>"+esc(h)+"</th>";}).join("")+"</tr>";
    var tb=b.x.map(function(r){
      return "<tr>"+r.map(function(c,ci){
        var k = (!b.nokey && ci===0 && String(c).length<=10) ? " class='k'" : "";
        return "<td"+k+">"+fmt(c)+"</td>";}).join("")+"</tr>";}).join("");
    return "<div class='tw'><table><thead>"+th+"</thead><tbody>"+tb+"</tbody></table></div>";
  }
  return "";
}
function pageIndex(){
  for(var i=0;i<PAGES.length;i++){
    var p=PAGES[i];
    if(VIEW.page==="start"&&p.k==="start") return i;
    if(VIEW.page==="submit"&&p.k==="submit") return i;
    if(VIEW.page==="s:"+p.id) return i;
    if(VIEW.page==="x:"+p.grp&&p.k==="ex") return i;
  }
  return 0;
}
function pageKey(p){
  if(p.k==="start") return "start";
  if(p.k==="submit") return "submit";
  if(p.k==="ex") return "x:"+p.grp;
  return "s:"+p.id;
}

/* ---- completion status ---- */
function sectStatus(id){
  if(STATE.checks[id]) return "done";
  if(STATE.seen[id]) return "work";
  return "";
}
function exStatus(modId){
  var m = mod(modId), total=0, filled=0;
  m.exercises.forEach(function(x){ x.parts.forEach(function(p){
    total++; var v=STATE.answers[x.id+"."+p.id]; if(v&&v.trim().length>0) filled++;
  });});
  if(filled===0) return "";
  return filled===total ? "done" : "work";
}
function mod(id){ for(var i=0;i<MODULES.length;i++) if(MODULES[i].id===id) return MODULES[i]; return null; }

function counts(){
  var totalChecks=0, answered=0, right=0;
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    totalChecks++;
    var c=STATE.checks[s.id];
    if(c){ answered++; if(c.first===true) right++; }
  });});
  var totalParts=0, filledParts=0;
  MODULES.forEach(function(m){ m.exercises.forEach(function(x){ x.parts.forEach(function(p){
    totalParts++; var v=STATE.answers[x.id+"."+p.id]; if(v&&v.trim().length>0) filledParts++;
  });});});
  return {totalChecks:totalChecks, answered:answered, right:right, totalParts:totalParts, filledParts:filledParts};
}

/* ==========================================================================
   RAIL
   ========================================================================== */
function drawRail(){
  var c=counts();
  var h="<div class='railhead'><h2>Section register</h2><p>"+c.answered+" of "+c.totalChecks+
        " sections released \u00b7 "+c.filledParts+" of "+c.totalParts+" exercise answers written</p></div>";
  h+="<div class='grp'>"+navBtn(PAGES[0])+"</div>";
  MODULES.forEach(function(m){
    h+="<div class='grp'><h3>"+esc(m.label)+": "+esc(m.title)+"</h3>";
    PAGES.forEach(function(p){ if(p.grp===m.id) h+=navBtn(p); });
    h+="</div>";
  });
  h+="<div class='grp'>"+navBtn(PAGES[PAGES.length-1])+"</div>";
  document.getElementById("rail").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll("#rail .nav"), function(b){
    b.addEventListener("click", function(){ go(b.getAttribute("data-k")); });
  });
}
function navBtn(p){
  var st = p.k==="sect" ? sectStatus(p.id) : (p.k==="ex" ? exStatus(p.grp) : "");
  var cur = pageKey(p)===VIEW.page;
  return "<button class='nav' data-k='"+pageKey(p)+"' aria-current='"+(cur?"true":"false")+"'>"+
    "<span class='dot "+st+"'></span><span class='id'>"+esc(p.id)+"</span><span class='nm'>"+esc(p.nm)+"</span></button>";
}

/* ==========================================================================
   PAGE RENDERERS
   ========================================================================== */
function go(key){
  VIEW.page=key;
  var p=PAGES[pageIndex()];
  if(p.k==="sect") STATE.seen[p.id]=true;
  autosave(); draw();
  window.scrollTo({top:0,behavior:"auto"});
  document.getElementById("rail").classList.remove("open");
}
function draw(){
  drawRail();
  var i=pageIndex(), p=PAGES[i], st=document.getElementById("stage");
  if(p.k==="start") st.innerHTML=viewStart();
  else if(p.k==="submit") st.innerHTML=viewSubmit();
  else if(p.k==="ex") st.innerHTML=viewExercises(mod(p.grp));
  else st.innerHTML=viewSection(MODULES[p.mi], MODULES[p.mi].sections[p.si], p);
  st.className="stage fadein";
  st.innerHTML += pager(i);
  wire(i,p);
}
function pager(i){
  var prev=i>0?PAGES[i-1]:null, next=i<PAGES.length-1?PAGES[i+1]:null;
  return "<div class='pager'>"+
   (prev?"<button class='btn gh' data-nav='"+pageKey(prev)+"'>\u2190 "+esc(prev.nm)+"</button>":"<span></span>")+
   (next?"<button class='btn pri' data-nav='"+pageKey(next)+"'>"+esc(next.nm)+" \u2192</button>":"<span></span>")+
   "</div>";
}

function viewStart(){
  var nS=0,nE=0; MODULES.forEach(function(m){nS+=m.sections.length; nE+=m.exercises.length;});
  var words=["","one","two","three","four","five","six","seven","eight"];
  var nM=MODULES.length, mw=(words[nM]||String(nM));
  var save = AUTOSAVE
    ? "Your work is saved in this browser as you go. To move between machines, or to keep a copy, use <strong>Save progress</strong> in the header. It downloads a small file you can reopen with <strong>Resume</strong>."
    : "This browser is not storing your work automatically. Use <strong>Save progress</strong> in the header before you close the tab. It downloads a small file, and <strong>Resume</strong> loads it back.";
  var h="<div class='hero'>"+
    "<div class='kick'>"+esc(CONFIG.companyName)+" \u00b7 Configuration management</div>"+
    "<h1>Configuration Audits</h1>"+
    "<p class='subtitle'>The functional and physical configuration audit: what each one asks, which items get one, and how an audit is prepared, run and closed.</p>"+

    "<p>This training teaches the functional and physical configuration audit from nothing: what each audit asks, how an item earns one, how an audit is prepared and run, and how it is closed. Work the sections in order. Each ends with a question that checks the point it was making. The answer options are shuffled for every trainee, so read them rather than comparing letters with a colleague. The exercises at the end of each module are written, not multiple choice. They are what "+esc(CONFIG.trainerName)+" will actually read.</p></div>"+
    "<dl class='meta'>";
  MODULES.forEach(function(m){
    h+="<dt>"+esc(m.label)+"</dt><dd>"+esc(m.title)+". "+esc(m.sub)+" "+
       m.sections.length+" sections, "+m.exercises.length+" exercises.</dd>";
  });
  h+="<dt>Who it is for</dt><dd>Anyone who will plan, prepare, support, attend or close a configuration audit. Configuration management, engineering, quality, manufacturing, and anyone managing a supplier who will be audited. No prior audit experience is assumed.</dd>"+
     "<dt>Prerequisites</dt><dd>None. Later modules assume earlier ones.</dd>"+

     "<div class='callout'><div class='lab'>How your work is kept</div><p>"+save+"</p>"+

function viewSection(m,s,p){
  var idx=m.sections.indexOf(s)+1;
  var st=sectStatus(s.id);
  var stl = st==="done" ? "Released" : (st==="work" ? "In work" : "Not started");
  var h="<div class='eyebrow'><span class='recid'>"+esc(s.id)+"</span>"+
        "<span class='status'>"+esc(m.label)+" \u00b7 section "+idx+" of "+m.sections.length+" \u00b7 "+stl+"</span></div>"+
        "<h1 class='sect'>"+esc(s.title)+"</h1><div class='hr'></div>";
  s.body.forEach(function(b){ h+=block(b); });
  h+=checkHtml(s);
  return h;
}
/* ---- option order ----------------------------------------------------------
   Each check shuffles its options once per trainee, then keeps that order for
   the rest of the session and through Save and Resume. The radio value stays
   the ORIGINAL index, so grading, saved answers and the training record never
   depend on the order the options were shown in.
   ------------------------------------------------------------------------- */
function orderFor(id, n){
  if(!STATE.order) STATE.order={};
  var cur=STATE.order[id];
  if(cur && cur.length===n) return cur;
  var a=[], i;
  for(i=0;i<n;i++) a.push(i);
  for(i=a.length-1;i>0;i--){
    var k=Math.floor(Math.random()*(i+1)), t=a[i];
    a[i]=a[k]; a[k]=t;
  }
  STATE.order[id]=a;
  autosave();
  return a;
}

function checkHtml(s){
  var rec=STATE.checks[s.id];
  var locked=!!rec;
  var h="<div class='check' data-check='"+esc(s.id)+"'><div class='lab'>Check yourself</div><div class='q'>"+fmt(s.check.q)+"</div>";
  orderFor(s.id, s.check.o.length).forEach(function(i){
    var o=s.check.o[i];
    var cls="opt"+(locked?" locked":"");
    if(locked){
      if(i===s.check.a) cls+=" right";
      else if(rec.picks && rec.picks.indexOf(i)>=0) cls+=" wrong";
    }
    h+="<label class='"+cls+"'><input type='radio' name='ck_"+esc(s.id)+"' value='"+i+"'"+
       (locked?" disabled":"")+(rec&&rec.picks&&rec.picks.indexOf(i)>=0?" checked":"")+"> <span>"+fmt(o)+"</span></label>";
  });
  h+="<div class='btnrow' style='margin-top:12px;margin-bottom:0'>"+
     (locked?"":"<button class='btn pri' data-ckgo='"+esc(s.id)+"'>Check answer</button>")+"</div>";
  var fb="";
  if(locked){
    var ok = rec.first===true;
    fb="<div class='fb show "+(ok?"ok":"no")+"'><b>"+(ok?"Correct":"Not quite")+"</b>"+fmt(s.check.why)+"</div>";
  }else{
    fb="<div class='fb' data-fb='"+esc(s.id)+"'></div>";
  }
  return h+fb+"</div>";
}

function viewExercises(m){
  var h="<div class='eyebrow'><span class='recid'>"+esc(m.id)+"-EX</span><span class='status'>"+esc(m.label)+" \u00b7 written exercises</span></div>"+
    "<h1 class='sect'>Exercises: "+esc(m.title)+"</h1><div class='hr'></div>"+
    "<p>Write your reasoning, not just your conclusion. The reasoning is what is being assessed, and several of these have more than one defensible answer. Where a question turns on a fact you have not been given, <strong>say so, and say what you would ask for and whom you would ask.</strong> Recognizing the missing fact is part of the exercise.</p>"+
    "<p class='note'>Answers save as you type. There is no word limit and no right length.</p>";
  m.exercises.forEach(function(x){
    h+="<div class='exwrap'><h4>"+esc(x.title)+"</h4><div class='scen'>"+fmt(x.scen)+"</div>";
    x.parts.forEach(function(pt){
      var key=x.id+"."+pt.id, v=STATE.answers[key]||"";
      h+="<div class='part'><label for='ta_"+esc(key)+"'>"+esc(pt.id)+".&nbsp; "+fmt(pt.q)+"</label>"+
         "<textarea id='ta_"+esc(key)+"' data-ans='"+esc(key)+"' rows='4' placeholder='Your answer'>"+esc(v)+"</textarea>"+
         "<div class='count' data-cnt='"+esc(key)+"'>"+wordCount(v)+"</div></div>";
    });
    h+="</div>";
  });
  return h;
}
function wordCount(v){
  var n=(v||"").trim(); n = n? n.split(/\s+/).length : 0;
  return n===0 ? "not started" : (n+" word"+(n===1?"":"s"));
}

function viewSubmit(){
  var c=counts();
  var pct = c.totalChecks ? Math.round(100*c.right/c.totalChecks) : 0;
  var gaps=[];
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    var r=STATE.checks[s.id];
    if(!r) gaps.push([s.id, s.title, "not attempted"]);
    else if(r.first!==true) gaps.push([s.id, s.title, "wrong on first attempt"]);
  });});
  var missing=[];
  MODULES.forEach(function(m){ m.exercises.forEach(function(x){ x.parts.forEach(function(pt){
    var v=STATE.answers[x.id+"."+pt.id];
    if(!v||!v.trim()) missing.push(x.id+"."+pt.id);
  });});});

  var h="<div class='eyebrow'><span class='recid'>RESULTS</span><span class='status'>Training record \u00b7 review and send</span></div>"+
    "<h1 class='sect'>Review and send</h1>"+
    "<p class='lede'>Check the record below, then send it to "+esc(CONFIG.trainerName)+". Nothing leaves this page until you choose one of the options.</p><div class='hr'></div>";

  if(!STATE.name || !STATE.name.trim()){
    h+="<div class='warn'>Add your name in the header before sending. The record needs to say whose it is.</div>";
  }
  if(missing.length){
    h+="<div class='warn'>"+missing.length+" exercise answer"+(missing.length===1?" is":"s are")+" still blank. You can send anyway, but "+esc(CONFIG.trainerName)+" will only see what you wrote.</div>";
  }

  h+="<div class='transmit'><div class='hd'><b>Training record</b><span>"+esc(recordNo())+"</span></div><div class='bd'>"+
     "<div class='scorebox'>"+
     "<div><div class='big'>"+c.right+" / "+c.totalChecks+"</div><div class='lab'>Section checks correct first time</div></div>"+
     "<div><div class='big'>"+pct+"%</div><div class='lab'>First-attempt score</div></div>"+
     "<div><div class='big'>"+c.filledParts+" / "+c.totalParts+"</div><div class='lab'>Exercise answers written</div></div>"+
     "</div>";
  if(gaps.length){
    h+="<div class='gaps'><p style='margin:14px 0 6px'><strong>Sections to revisit</strong> . These are what your trainer will focus the review session on:</p><ul class='pl'>"+
       gaps.map(function(g){return "<li><span style='font-family:var(--mono);font-size:12px'>"+esc(g[0])+"</span> &nbsp;"+esc(g[1])+" . "+esc(g[2])+"</li>";}).join("")+"</ul></div>";
  }else{
    h+="<p style='margin-top:14px'><strong>Every section check answered correctly on the first attempt.</strong></p>";
  }
  h+="</div></div>";

  h+="<h2 style='font-family:var(--serif);font-size:22px;margin:26px 0 10px'>Send it</h2>";
  h+="<div class='btnrow'>"+
     "<button class='btn pri' id='btnDownload'>Download the record</button>"+
     "<button class='btn' id='btnCopy'>Copy as text</button>"+
     (CONFIG.trainerEmail?"<button class='btn' id='btnMail'>Open an email to "+esc(CONFIG.trainerEmail)+"</button>":"")+
     (CONFIG.submitEndpoint?"<button class='btn' id='btnPost'>Send to trainer</button>":"")+
     "</div>";
  h+="<p class='note'><strong>Download the record</strong> gives you a single file to attach to an email. It opens in any browser and prints cleanly. "+
     "<strong>Copy as text</strong> puts everything on the clipboard for pasting into email or chat."+
     (CONFIG.trainerEmail?" <strong>Open an email</strong> starts a message with your answers in the body; long answers may be cut short by your mail program, so attach the downloaded file as well.":"")+"</p>";

  if(!CONFIG.trainerEmail && !CONFIG.submitEndpoint){
    h+="<div class='setup'><strong>Trainer setup not finished.</strong> No delivery address has been set, so the email option is hidden. "+
       "Open this file in a text editor, find <code>var CONFIG</code> near the top of the script, set <code>trainerEmail</code>, and save. "+
       "Everything else keeps working without it.</div>";
  }
  return h;
}
function recordNo(){
  var d=new Date();
  var pad=function(n){return n<10?"0"+n:""+n;};
  var initials=(STATE.name||"").trim().split(/\s+/).map(function(w){return w.charAt(0).toUpperCase();}).join("").slice(0,3)||"XXX";
  return "CAT-"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"-"+initials;
}

/* ==========================================================================
   WIRING
   ========================================================================== */
function wire(i,p){
  Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"), function(b){
    b.addEventListener("click", function(){ go(b.getAttribute("data-nav")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ckgo]"), function(b){
    b.addEventListener("click", function(){ grade(b.getAttribute("data-ckgo")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ans]"), function(t){
    t.addEventListener("input", function(){
      var k=t.getAttribute("data-ans");
      STATE.answers[k]=t.value;
      var c=document.querySelector("[data-cnt='"+k+"']");
      if(c) c.textContent=wordCount(t.value);
      clearTimeout(window.__sv); window.__sv=setTimeout(function(){ autosave(); drawRail(); },400);
    });
  });
  var bd=document.getElementById("btnDownload"); if(bd) bd.addEventListener("click", downloadRecord);
  var bc=document.getElementById("btnCopy");     if(bc) bc.addEventListener("click", copyRecord);
  var bm=document.getElementById("btnMail");     if(bm) bm.addEventListener("click", mailRecord);
  var bp=document.getElementById("btnPost");     if(bp) bp.addEventListener("click", postRecord);
}

function grade(id){
  var sec=null;
  MODULES.forEach(function(m){ m.sections.forEach(function(s){ if(s.id===id) sec=s; }); });
  if(!sec) return;
  var picked=document.querySelector("input[name='ck_"+id+"']:checked");
  if(!picked){ toast("Choose an answer first."); return; }
  var v=parseInt(picked.value,10);
  STATE.checks[id]={ first:(v===sec.check.a), picks:[v], at:new Date().toISOString() };
  autosave(); draw();
  var el=document.querySelector("[data-check='"+id+"']");
  if(el) el.scrollIntoView({block:"center", behavior:"smooth"});
}

/* ==========================================================================
   SAVE / RESUME / SEND
   ========================================================================== */
function download(name, text, type){
  try{
    var b=new Blob([text],{type:type||"text/plain;charset=utf-8"});
    var u=URL.createObjectURL(b);
    var a=document.createElement("a");
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); },600);
    return true;
  }catch(e){ return false; }
}
function slug(){ return (STATE.name||"unnamed").trim().replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"") || "unnamed"; }

function saveProgress(){
  STATE.saved=new Date().toISOString();
  var ok=download("audit-training-progress-"+slug()+".json", JSON.stringify(STATE,null,2), "application/json");
  toast(ok ? "Progress file downloaded. Reopen it with Resume." : "This browser blocked the download. Use Copy as text on the Review and send page instead.");
}
function loadProgress(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o || !o.checks || !o.answers) throw new Error("shape");
      STATE=o; if(!STATE.order) STATE.order={};
      document.getElementById("who").value=STATE.name||"";
      autosave(); go("start");
      toast("Progress restored.");
    }catch(e){ toast("That file is not a training progress file. Look for audit-training-progress-….json"); }
  };
  r.onerror=function(){ toast("The file could not be read. Try selecting it again."); };
  r.readAsText(file);
}

function recordLines(){
  var c=counts(), out=[];
  out.push("CONFIGURATION AUDITS. TRAINING RECORD");
  out.push("Record: "+recordNo());
  out.push("Trainee: "+(STATE.name||"(name not entered)"));
  out.push("Company: "+CONFIG.companyName);
  out.push("Completed: "+new Date().toLocaleString());
  out.push("");
  out.push("SCORE");
  out.push("  Section checks correct first time: "+c.right+" of "+c.totalChecks+"  ("+(c.totalChecks?Math.round(100*c.right/c.totalChecks):0)+"%)");
  out.push("  Exercise answers written: "+c.filledParts+" of "+c.totalParts);
  out.push("");
  out.push("SECTIONS TO REVISIT");
  var any=false;
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    var r=STATE.checks[s.id];
    if(!r){ out.push("  "+s.id+"  "+s.title+", not attempted"); any=true; }
    else if(r.first!==true){ out.push("  "+s.id+"  "+s.title+"  (wrong on first attempt)"); any=true; }
  });});
  if(!any) out.push("  None. Every check correct on the first attempt.");
  MODULES.forEach(function(m){
    out.push(""); out.push("=".repeat(60));
    out.push(m.label.toUpperCase()+": "+m.title.toUpperCase()+" . EXERCISE ANSWERS");
    out.push("=".repeat(60));
    m.exercises.forEach(function(x){
      out.push(""); out.push(x.title);
      out.push("Scenario: "+x.scen);
      x.parts.forEach(function(pt){
        var v=(STATE.answers[x.id+"."+pt.id]||"").trim();
        out.push("");
        out.push("  "+pt.id+") "+pt.q);
        out.push("     "+(v? v.split("\n").join("\n     ") : "(no answer written)"));
      });
    });
  });
  return out.join("\n");
}
function recordHtml(){
  var c=counts();
  var rows="";
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    var r=STATE.checks[s.id];
    var st = !r ? "Not attempted" : (r.first===true ? "Correct first time" : "Wrong first attempt");
    var cls = !r ? "na" : (r.first===true ? "ok" : "no");
    rows+="<tr class='"+cls+"'><td class='k'>"+esc(s.id)+"</td><td>"+esc(s.title)+"</td><td>"+st+"</td></tr>";
  });});
  var ex="";
  MODULES.forEach(function(m){
    ex+="<h2>"+esc(m.label)+": "+esc(m.title)+"</h2>";
    m.exercises.forEach(function(x){
      ex+="<div class='ex'><h3>"+esc(x.title)+"</h3><p class='sc'>"+esc(x.scen)+"</p>";
      x.parts.forEach(function(pt){
        var v=(STATE.answers[x.id+"."+pt.id]||"").trim();
        ex+="<p class='q'>"+esc(pt.id)+") "+esc(pt.q)+"</p><div class='a"+(v?"":" empty")+"'>"+
            (v?esc(v).split("\n").join("<br>"):"No answer written")+"</div>";
      });
      ex+="</div>";
    });
  });
  return "<!DOCTYPE html><html><head><meta charset='utf-8'><title>Configuration audit training record: "+esc(STATE.name||"unnamed")+"</title>"+
   "<style>body{font-family:Georgia,serif;max-width:820px;margin:36px auto;padding:0 24px;color:#1E262E;line-height:1.55}"+
   "h1{font-size:26px;margin:0 0 4px}.sub{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#5C6D78;letter-spacing:.06em}"+
   "table.meta{width:auto;margin:18px 0 26px;font-size:14px}table.meta th{background:none;color:#5C6D78;font-family:ui-monospace,Consolas,monospace;font-size:11px;text-transform:uppercase;text-align:left;padding:3px 18px 3px 0;white-space:nowrap;font-weight:normal;vertical-align:top}table.meta td{border:0;padding:3px 0}"+
   "table{border-collapse:collapse;width:100%;font-size:13.5px;margin-bottom:26px}"+
   "th{background:#1E262E;color:#fff;text-align:left;padding:7px 10px;font-size:12px}"+
   "td{padding:6px 10px;border-top:1px solid #D6DCDF;vertical-align:top}td.k{font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:nowrap;width:88px}th.r{width:150px}"+
   "tr.no td{background:#F4E2E2}tr.na td{background:#F6ECD8}"+
   "h2{font-size:19px;border-bottom:2px solid #1E262E;padding-bottom:5px;margin:32px 0 14px}"+
   ".ex{margin-bottom:26px}.ex h3{font-size:16px;margin:0 0 6px}"+
   ".sc{background:#F4F6F7;padding:10px 13px;border-radius:4px;font-size:13.5px;margin:0 0 12px}"+
   ".q{font-weight:bold;font-size:14px;margin:12px 0 5px}"+
   ".a{font-family:-apple-system,Segoe UI,Arial,sans-serif;font-size:14px;background:#fff;border-left:3px solid #A8481F;padding:8px 13px;white-space:normal}"+
   ".a.empty{color:#8998A2;border-left-color:#D6DCDF;font-style:italic}"+
   "@media print{body{margin:0}.ex{page-break-inside:avoid}}</style></head><body>"+
   "<h1>Configuration audits. Training record</h1>"+
   "<div class='sub'>"+esc(recordNo())+"</div>"+
   "<table class='meta'><tr><th>Trainee</th><td>"+esc(STATE.name||"(name not entered)")+"</td></tr>"+
   "<tr><th>Company</th><td>"+esc(CONFIG.companyName)+"</td></tr>"+
   "<tr><th>Completed</th><td>"+esc(new Date().toLocaleString())+"</td></tr>"+
   "<tr><th>Checks</th><td>"+c.right+" of "+c.totalChecks+" correct on the first attempt ("+(c.totalChecks?Math.round(100*c.right/c.totalChecks):0)+"%)</td></tr>"+
   "<tr><th>Exercises</th><td>"+c.filledParts+" of "+c.totalParts+" answers written</td></tr></table>"+
   "<h2>Section checks</h2><table><colgroup><col style='width:88px'><col><col style='width:150px'></colgroup><thead><tr><th>Section</th><th>Title</th><th class='r'>Result</th></tr></thead><tbody>"+rows+"</tbody></table>"+
   ex+"</body></html>";
}
function downloadRecord(){
  var ok=download("audit-training-record-"+slug()+".html", recordHtml(), "text/html;charset=utf-8");
  toast(ok ? "Record downloaded. Attach it to an email to "+CONFIG.trainerName+"." : "This browser blocked the download. Use Copy as text instead.");
}
function copyRecord(){
  var txt=recordLines();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast("Record copied. Paste it into an email or chat."); },
      function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  var t=document.createElement("textarea");
  t.value=txt; t.style.position="fixed"; t.style.opacity="0";
  document.body.appendChild(t); t.select();
  var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  document.body.removeChild(t);
  toast(ok ? "Record copied. Paste it into an email or chat." : "Copying is blocked here. Use Download the record instead.");
}
function mailRecord(){
  var subj="Configuration audit training record: "+(STATE.name||"unnamed")+" | "+recordNo();
  var body=recordLines();
  var url="mailto:"+encodeURIComponent(CONFIG.trainerEmail)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
  if(url.length>1900){
    var c=counts();
    var shortBody="Configuration audits. Training record\n"+recordNo()+
      "\nTrainee: "+(STATE.name||"(name not entered)")+
      "\nChecks: "+c.right+" of "+c.totalChecks+" correct first time"+
      "\nExercises: "+c.filledParts+" of "+c.totalParts+" answers written"+
      "\n\nThe full record, including all written answers, is attached.\n(If it is not attached yet: go back to the training, choose Download the record, and attach the file.)";
    url="mailto:"+encodeURIComponent(CONFIG.trainerEmail)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(shortBody);
    downloadRecord();
    toast("Answers are too long for an email body, so the record was downloaded. Attach it to the message.");
  }
  window.location.href=url;
}
function postRecord(){
  var b=document.getElementById("btnPost");
  b.disabled=true; b.textContent="Sending\u2026";
  var payload={ record:recordNo(), name:STATE.name||"", company:CONFIG.companyName,
    completed:new Date().toISOString(), score:counts(), checks:STATE.checks, answers:STATE.answers };
  fetch(CONFIG.submitEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
   .then(function(r){
      if(r.ok){ b.textContent="Sent"; toast("Sent to "+CONFIG.trainerName+"."); }
      else{ b.disabled=false; b.textContent="Send to trainer"; toast("The server refused it ("+r.status+"). Download the record and email it instead."); }
   })
   .catch(function(){
      b.disabled=false; b.textContent="Send to trainer";
      toast("Could not reach the server. Download the record and email it instead.");
   });
}

   ========================================================================== */
var toastT;
function toast(m){
  var t=document.getElementById("toast");
  t.textContent=m; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("show"); },4200);
}

document.getElementById("who").addEventListener("input", function(e){
  STATE.name=e.target.value; autosave();
});
document.getElementById("btnSave").addEventListener("click", saveProgress);
document.getElementById("btnLoad").addEventListener("click", function(){ document.getElementById("fileIn").click(); });
document.getElementById("btnClear").addEventListener("click", function(){
  if(CLEAR_ARMED) resetAll(); else armClear();
});
document.getElementById("btnClear").addEventListener("blur", function(){ setTimeout(disarmClear, 200); });
document.getElementById("fileIn").addEventListener("change", function(e){
  if(e.target.files && e.target.files[0]) loadProgress(e.target.files[0]);
  e.target.value="";
});
document.getElementById("railToggle").addEventListener("click", function(e){
  e.stopPropagation();
  document.getElementById("rail").classList.toggle("open");
});
document.querySelector("main").addEventListener("click", function(){
  document.getElementById("rail").classList.remove("open");
});
document.addEventListener("keydown", function(e){
  if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  var i=pageIndex();
  if(e.key==="ArrowRight" && i<PAGES.length-1) go(pageKey(PAGES[i+1]));
  if(e.key==="ArrowLeft"  && i>0)              go(pageKey(PAGES[i-1]));
});

document.getElementById("brandSub").textContent = CONFIG.companyName + " \u00b7 interactive modules";
if(autoload()){ document.getElementById("who").value = STATE.name||""; }
draw();
