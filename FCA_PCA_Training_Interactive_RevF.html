      ["16. Next higher assembly traceability [in full]","The CI's traceability records, resolving upward to the next higher assembly","No upward link, leaving the question of where else articles from this lot went unanswerable. Where the next higher CI is a conceptual collector with no physical assembly above it, that fact and its rationale are recorded and the trace resolves to the highest physical installation"],
      ["17. Sub-supplier end item inspection and test [sampled]","Completion of inspection and test of sub-supplier end items at point of manufacture, traceable to the articles installed in this unit. First article inspection is re-accomplished on the process, source and tooling triggers the statement of work names, so the results on file have to be current for the configuration installed","An installed supplier CI with no supporting record; first article results present but incomplete for a newly sourced part; a source, process or tooling change with no re-accomplishment"],
      ["18. Spares and repair parts released before the physical audit [in full]","Spares and repair parts provisioned before the audit, against the configuration this audit is establishing","A pre-audit release built to a configuration the audit supersedes, with the difference neither identified nor dispositioned. Those articles are already in a store or in the field"]
    ]),
    P("One question comes up whenever a part designation is missing rather than wrong. Who owed it? Safety-critical, life-limited and special-handling designations follow one of three authorship cases, and the statement of work names the one that applies. **Company assigned**, where the company holds design authority and the part designations reach the supplier in the technical data. **Supplier proposed and company approved**, where the supplier holds design authority at its level. **Externally assigned**, where a customer or regulatory authority assigns it, in which case both parties record and flow the part designation and neither proposes nor approves it. Establish which case applies before writing the finding against anyone. Where the case was never stated, each party waits for the other, and that is the finding."),
    S("A physical audit cannot verify material by inspection. It verifies an evidence chain, and its findings are breaks in that chain.",
      "The same is true of certification, qualification and process conformance."),
    C("Three of these are anchored in events",[
      "**Check 10, functional audit unit to physical audit unit differences,** exists because of repeated escapes between development, early production and full-rate production articles on the tanker program. Delivery halts and rework in the hundreds of millions.",
      "**Check 12, zone foreign object debris,** exists because tools, rags and debris were repeatedly found inside delivered aircraft on the same program.",
      "**Check 15, material and process conformance,** exists because a replacement thrust reverser wear strip was made of a titanium alloy rather than the specified aluminum. Titanium is the harder metal. The strip fell onto a runway, a departing aircraft ran over it, and the tire burst. The resulting debris ruptured a fuel tank. One hundred and thirteen people died. The as-installed configuration no longer matched approved design, and no downstream party could detect the discrepancy from the records."
    ],"teal")
  ], check:{
    q:"A unit is built exactly as its work instructions require, every operation is stamped by an authorized inspector, and every part number matches. The work instructions were written against a revision of the design data that has since been superseded. Which check catches this?",
    o:["Check 1, physical item to product definition data, because the article does not match current data",
       "Check 9, build traveler and quality buy-off, because the build record is defective",
       "Check 5, non-conformance records and variances, because a departure from data is a non-conformance",
       "Check 11, manufacturing instructions to product definition data. Checks 1 and 9 both pass"],
    a:3,
    why:"Check 9, build traveler and quality buy-off, passes because the traveler was followed faithfully and stamped correctly. Nothing about it is defective. Check 1, physical item to product definition data, can pass too, where the superseded revision did not change the part number, which is common. Nothing has been raised as a non-conformance, so that check has nothing to adjudicate. The gap is between the design data and the instructions, and only a check that compares those two directly can see it."
  }},

  {id:"A4-11", title:"Examining an interface: a wire bundle and its ICD", body:[
    P("Interfaces are the least understood part of a physical audit. People examine the article against its own drawing, find it correct, and move on. That is not an interface examination, and it misses a whole class of defect."),
    S("A CI can be built exactly to its own drawing and still be wrong at the interface.",
      "Its drawing tells you what the CI is. The interface control document tells you what it must mate with. Those are different documents, maintained by different people, and they can drift apart. The ICD is the only document that spans both sides of the boundary, which is why an interface examination reads it rather than the CI drawing."),
    P("A wire bundle is the clearest case, because almost everything about a bundle is an interface. Take a bundle that connects a flight control computer to an actuator. The bundle has its own drawing showing wire runs, lengths, breakouts, and connector part numbers. The interface control document defines what the two ends must satisfy."),
    TABLE(["What you examine","What you compare it against","Why the bundle drawing alone will not catch it"],[
      ["Connector part number and variant at each end","ICD connector callout, including shell size, insert arrangement, and keying or clocking position","A bundle drawing can call out a connector that mates mechanically and is clocked to the wrong position. It fits, it locks, and the pin assignments rotate."],
      ["Pin-to-pin assignment","ICD pin table for each connector","The bundle drawing is internally consistent with itself. If the ICD was revised and the bundle drawing was not, both documents are correct on their own terms and disagree with each other."],
      ["Wire gauge and type per circuit","ICD conductor requirements, including current rating and any shielding or twisting requirement","A substitution made for availability can satisfy the bundle drawing note and violate a current or EMI requirement stated only in the ICD."],
      ["Shield termination","ICD grounding scheme","Terminating a shield at both ends when the ICD requires single-point grounding is invisible on the bundle drawing and creates a ground loop. This is a classic finding."],
      ["Backshell type, strain relief, and clamping","ICD environmental and vibration requirements","The bundle drawing may permit a backshell family. The ICD may require a specific type for the zone."],
      ["Separation and segregation from other bundles","ICD or installation requirement for routing class separation","Separation is a property of the installation, not of the bundle. Nothing on the bundle drawing can show it."],
      ["Bend radius and support spacing as installed","Installation data and the ICD","A bundle correct on the bench can be installed outside its minimum bend radius. Only examination of the installed article finds it."]
    ]),
    C("A worked failure",[
      "The bundle is presented for examination. It is built to bundle drawing revision C, and every wire is continuity tested and stamped. On its own terms it is perfect.",
      "The ICD is at revision E. Revision D moved two discrete signals from pins 14 and 15 to pins 22 and 23, to increase separation from a power circuit. That change was released against the ICD and against the actuator specification.",
      "The bundle drawing was never updated, because the change did not alter the bundle part number, the connector, or the wire count. Nothing in the bundle's own document set indicates a problem.",
      "**What finds it.** The interface examination, and nothing else. Continuity testing passes, because the wires are continuous to the pins the bundle drawing specifies. The reconciliation passes, because the as-built matches the released bundle drawing. Check 3, as-designed to as-built child item reconciliation, passes. Only comparing the article to the ICD reveals that two signals arrive at the wrong pins.",
      "**What the finding actually is.** Not a bad bundle. A change released on one side of an interface and not carried to the other. The bundle is a symptom. The finding belongs against the change incorporation process, and the first question afterward is how many other bundles were built to superseded pin assignments."
    ]),
    C("What to ask for before an interface examination",[
      "The ICD at its current revision, not the one bound into the data package six months ago.",
      "The revision history of the ICD, so you can see what changed and when. A recent revision is where you look first.",
      "The CI drawing for both sides of the boundary, not just the side you are auditing.",
      "The installation data, where the interface is only fully defined once the CI is installed.",
      "Any interface control working group minutes covering that boundary, where such a group exists."
    ]),
    S("The general rule, beyond wire bundles.",
      "Any interface examination compares the article to the document that governs the boundary, at the revision in force for that effectivity, and then checks that both sides were released against the same revision. Hydraulic and pneumatic connections, mounting patterns, thermal interfaces, and data buses all work the same way. The wire bundle is simply the case where the density of interface content is highest.")
  ], check:{
    q:"A wire bundle passes continuity test, matches its own drawing exactly, and its as-built reconciliation is clean. The auditor compares it to the interface control document and finds two signals on the wrong pins. What is the correct characterization of this finding?",
    o:["A workmanship defect against the bundle, corrected by rework",
       "A false finding, because the bundle matches its own released drawing in every particular",
       "A change incorporation failure. The ICD changed and the bundle drawing never followed",
       "A documentation error in the ICD, since the bundle was built correctly to its own drawing"],
    a:2,
    why:"The bundle is conforming to its own drawing, so this is not workmanship. It is also not a false finding, because the article does not satisfy the boundary it has to satisfy. The defect is upstream, in the process that should have carried an approved change from one side of an interface to the other. That is a control failure rather than a record error, which is why it drives an extent check across every unit built after the ICD revision."
  }},

  {id:"A4-12", title:"Software in the physical audit", body:[
    P("For a software CI, the physical audit asks the same question as for hardware. Is the thing you delivered the thing the documentation describes, and answers it by building the software in front of witnesses."),
    STEPS([
      {h:"Compare the code to the documentation",b:"Source listings against the released configuration documentation."},
      {h:"Verify the version description",b:"Including the **compiler, the compiler version and the compiler settings.** The toolchain is part of the configuration; the same source with a different compiler is not guaranteed to be the same product."},
      {h:"Build it during the audit",b:"The build is produced during the audit, installed on the target device, and verified against the version description, **witnessed by quality assurance** or the entity the Acquirer designates. Every update listed on the build's problem reports is confirmed applied."},
      {h:"Check the commercial software",b:"Documentation matching the versions actually delivered on the media, with adequate identification and marking of all deliverable media."}
    ]),
    P("Two details are easy to under-read. **Witnessed** means quality assurance, or the entity the Acquirer designates, is present while the build runs, not shown the result afterwards. **Media marking** is not housekeeping. It sits in the software conduct requirements rather than in the numbered check set, and it is the one people skip. Unmarked or ambiguously marked media is how the wrong version reaches a target months later. Nobody makes a mistake at the time."),
    S("The live rebuild is where toolchain identification either pays for itself or fails in public.",
      "If the recorded compiler version is gone, the failure happened months earlier. The audit is only where it becomes visible."),
    C("Why an archived binary is not a substitute",[
      "The usual proposal is to demonstrate the delivered binary from the archive rather than rebuild during the audit, on the grounds that the archived artifact is the one that shipped.",
      "It answers a different question. The archive shows what was produced. The rebuild shows that what was produced **can be reproduced from the recorded configuration**, which is the claim the product baseline actually rests on.",
      "An organization that cannot rebuild has a configuration it can ship but cannot maintain, patch or investigate."
    ])
  ], check:{
    q:"During a software physical audit, the build fails: the recorded compiler version was upgraded eight months ago and the original is no longer available anywhere. The supplier offers the archived delivered binary, which is verifiably the one that shipped. What is the significance?",
    o:["The CI cannot be shown to be reproducible from its recorded configuration",
       "Minor. The archived binary is the delivered product, so the delivery is verified",
       "A finding against the audit team for not staging the build environment earlier",
       "The build requirement can be waived where the delivered binary is verifiable"],
    a:0,
    why:"The archived binary genuinely is the delivered product, which is why calling this minor is tempting, but it evidences what was shipped, not that the recorded configuration reproduces it. Staging the build environment is part of preparation and its absence would be a real problem, yet here the environment could not be staged because the toolchain was not preserved. The audit is where a months-old control failure surfaces, not where it was caused."
  }},

  {id:"A4-13", title:"Worked example: one unit through the check set", body:[
    P("A CI designated for the physical audit is presented for it. It is an early production unit, embodied in the aircraft at the time of the audit. Its build records are closed. Three defects are present and one thing that looks like a defect is not. Work out which checks find what before reading the table."),
    L([
      "**Defect A.** A washer stack and lockwire on the as-designed data have no corresponding entry in the closed work orders. Visually the joint looks complete.",
      "**Defect B.** The unit was built to a work instruction written against a superseded revision of the design data. The revision did not change the part number. Every operation is stamped.",
      "**Defect C.** A bracket's heat number on the article matches the heat number on the as-built record. The material certificate for that heat is for a different alloy from the one the design data specifies.",
      "**Not a defect.** One certification plan item applicable to the CI is open at this milestone, identified, with its status recorded."
    ]),
    TABLE(["Check","Defect A","Defect B","Defect C"],[
      ["1. Physical item to product definition data","Passes. Part numbers agree","Passes. The revision did not change the part number","Passes"],
      ["2. Serialization and traceability","Passes. The unit's identifiers are correct","Passes","**Passes.** The heat number on the article and on the record agree"],
      ["3. As-designed to as-built child item reconciliation","**Finds it.** As-designed CIs with no build record entry","Passes","Passes"],
      ["6. Interface and workmanship","Passes. The joint appears complete","Passes","Passes"],
      ["9. Build traveler and quality buy-off","Passes. Every operation stamped by an authorized inspector","**Passes.** The traveler was followed faithfully","Passes"],
      ["11. Manufacturing instructions to product definition data","Passes","**Finds it.** Instructions built to a superseded revision","Passes"],
      ["15. Material and process conformance","Passes","Passes","**Finds it.** The third link, certificate against specification"]
    ]),
    P("Three observations from that table, in order of how uncomfortable they are."),
    L([
      "**Every defect passed most of the check set.** Not one of them was caught by more than a single check. A check set with any of these three removed delivers this unit.",
      "**Defect C passed check 2, serialization and traceability, cleanly**, because the numbers agreed with each other. Numbers matching numbers is the failure pattern the whole check set exists to break, and it recurs one level down inside a single check.",
      "**Defect A is the one people argue about.** The joint looks complete, so the temptation is to close the finding by inspecting the article. Resist it: the finding is that the build record does not account for an as-designed CI, and that is a statement about the record system, which serves every other unit on the line."
    ]),
    S("Each of these three defects was found by exactly one check. That is the argument for the whole set, made without a single appeal to thoroughness.",
      "A shortened check set is not a faster audit. It is a different audit, with defined blind spots."),
    C("The open certification CI",[
      "Not a finding at this milestone. It is identified, its status is recorded, and check 14, part certification status and plan status, is satisfied by knowing what it is and where it stands.",
      "It would be a finding if nobody could identify it, or if a certification credit for this CI rested on a configuration other than the one audited."
    ])
  ], check:{
    q:"In the worked example, defect C. The bracket whose heat number matches the record but whose material certificate is for a different alloy. Passed check 2, serialization and traceability. Why is that worth dwelling on?",
    o:["Because check 2, serialization and traceability, was performed incorrectly",
       "Because heat numbers should not be part of check 2, serialization and traceability",
       "Because material certificates should be verified before the audit rather than during the audit",
       "Because the check compared numbers against numbers and they agreed, as they were meant to"],
    a:3,
    why:"Check 2, serialization and traceability, was performed correctly and reached the right answer for what it compares: the number on the article and the number on the record do agree. That is precisely the discomfort. Consistency between two records is not conformity to a specification, and a check can be sound in itself while leaving exactly the gap the next check was written to close."
  }},

  {id:"A4-14", title:"Documentation that does not align: a gallery", body:[
    P("Most physical audit findings are not a wrong part. They are two documents that disagree, or a document that disagrees with the article. Learning to recognize the shapes is most of the skill. Each case below gives you the evidence as you would actually receive it."),
    TABLE(["What you are looking at","What is wrong","What it usually means"],[
      ["The parts list calls for bracket 4471-003. The as-built record shows 4471-003. The article carries a label reading 4471-003 Rev B. The parts list is at Rev C.",
       "Nothing yet. A part number does not carry a revision. The revision belongs to the drawing that defines the part.",
       "This is the most common false finding. Ask whether Rev C changed the part in a way that required a new part number. If it did and the number did not change, that is the finding, and it is against the change classification rather than the unit."],
      ["The traveler is complete and every operation is stamped. The traveler header cites work instruction sheet 12, revision F. The released manufacturing instruction is at revision H.",
       "The unit was built to superseded instructions. Every stamp is valid and the unit is still wrong.",
       "A release control failure. A fully stamped traveler built to a superseded revision passes check 9, build traveler and quality buy-off, and fails the audit. Ask how the shop received revision F after H was released."],
      ["The as-built lists a heat number for a machined fitting. The material certificate on file for that heat is for 7075-T73. The design data specifies 7050-T7451.",
       "The traceability chain is intact and points at the wrong material.",
       "The most serious shape in this table, because every identifier check passes. The heat number on the article matches the record, and the record matches a certificate. Only reading the certificate content catches it."],
      ["The as-built record lists 47 CIs. The as-designed parts list has 46. The extra CI is a shim.",
       "A part was installed that the design data does not call for.",
       "Either an undocumented change, or a shim added to correct a fit problem without a variance. Both are findings. Ask which, because the corrective actions are different."],
      ["Change 118 is approved with effectivity from unit 12. The unit under audit is unit 15. The as-built shows the pre-change configuration.",
       "A required change was not embodied.",
       "An embodiment failure. Ask immediately about units 12, 13, and 14, because the same gap probably covers them. This is where an extent check is mandatory rather than optional."],
      ["The loaded software reports part number 8802-11 with checksum A4F2. The version description for 8802-11 lists checksum 9C31.",
       "The load on the unit is not the load that was released under that part number.",
       "Either an unreleased build was loaded, or the version description does not describe the build it claims to. Both mean the software configuration identity is not trustworthy, and neither is fixed by reloading."],
      ["Everything agrees. Part numbers, revisions, heat numbers, certificates, traveler revisions, effectivity, and checksums all reconcile.",
       "Nothing.",
       "Record it and move on. Not every examination produces a finding, and a checklist that always finds something is not being applied honestly. The purpose of the check set is to be able to say what was verified, not to produce a quota."]
    ]),
    S("Two shapes are worth separating in your head.",
      "A record that contains an error is a record problem. A control that did not operate is a process problem. The material certificate case is a record that was never read. The effectivity case is a control that did not fire. The second kind travels to other units, and that is why it drives an extent check.")
  ], check:{
    q:"An auditor finds that a unit's traveler is fully stamped, correctly signed, and cites a work instruction revision that was superseded two months before the unit was built. Which check catches this, and what does the finding attach to?",
    o:["Check 9, build traveler and quality buy-off. The finding attaches to the inspector who stamped it",
       "Check 3, as-designed to as-built child item reconciliation. The finding attaches to the unit",
       "Check 11, manufacturing instructions to product definition data. It attaches to release control",
       "No check catches it, because the traveler itself is complete and correctly signed"],
    a:2,
    why:"Check 9, build traveler and quality buy-off, asks whether the traveler was completed. It was, so check 9 passes. Check 11, manufacturing instructions to product definition data, asks whether the instructions actually used matched the governing product definition data, and that is the one that finds this. The finding is not about the person who stamped it, because they stamped work performed to the instruction they were given. It is about how a superseded instruction remained in circulation."
  }}

 ],
 exercises:[

  {id:"A4-E1", title:"Exercise 1: The unit that is not the unit",
   scen:"A physical audit is convened on an early production article. The functional audit was conducted eight months earlier on a preproduction article. During the walk you establish that the production unit uses a different connector supplier, a bracket in a different material, and a revised harness routing introduced to ease assembly. The routing change went through as an approved change. The connector supplier change was handled as a purchasing action. The bracket material was changed by the supplier under their own internal process. The program has not identified any differences between the two units.",
   parts:[
     {id:"a", q:"Which entry or data package requirement has not been satisfied here, and what should have existed before the audit convened?"},
     {id:"b", q:"Take the three differences one at a time. What is the status of each, and which of the three worries you most?"},
     {id:"c", q:"What has to be produced, and by whom, before the difference in units can be accepted?"},
     {id:"d", q:"The program argues that the functional audit conclusions still hold because none of the three changes affects a tested function. Answer that argument using what this module says about transferring a functional conclusion to a production article."},
     {id:"e", q:"Which documented program failure is this pattern anchored to, and what did that pattern actually cost?"},
     {id:"f", q:"The bracket material change was made under the supplier's internal process. What does that suggest about something other than this unit, and what would you do about it?"}
   ]},

  {id:"A4-E2", title:"Exercise 2: A build that will not reproduce",
   scen:"A software CI reaches its physical audit. Source listings match the released documentation. The version description names a compiler and a version, but not the settings. On the audit day the build is attempted: it completes, but the resulting binary differs from the delivered one. Investigation during the audit establishes that two optimization settings differ from those used at release, and that nobody recorded them. The delivered binary is archived and verifiable. Quality assurance is present and witnessing.",
   parts:[
     {id:"a", q:"State what has and has not been demonstrated by the day's activity."},
     {id:"b", q:"The version description named the compiler and version but not the settings. Why does that specific omission matter, given that the source matched?"},
     {id:"c", q:"What does this mean for the product baseline, and what would you expect the disposition of the audit to turn on?"},
     {id:"d", q:"The supplier proposes to record the correct settings now, rebuild, and confirm a match. Is that closure? Explain what it does and does not resolve."},
     {id:"e", q:"Which earlier configuration management activity actually failed here, and roughly when?"},
     {id:"f", q:"What would you want to check about this supplier's other software deliveries, and what would you need in order to check it?"}
   ]},

  {id:"A4-E3", title:"Exercise 3: One unit, five defects",
   scen:"You are auditing an early production unit, embodied in the aircraft, build records closed. You establish the following. (1) A sealant listed on the as-designed data appears nowhere in the closed work orders; the joint looks correct. (2) The unit's serial number on the nameplate is correct but the plate is fitted in a location the marking instruction does not specify. (3) A connector's part number matches the drawing, but that connector type was de-listed nine months ago following a counterfeit alert. (4) An approved change commitment applicable at this effectivity is not incorporated, and a temporary redline covering the same area has no status anyone can establish. (5) The bracket heat numbers on the article and the as-built record agree; the material certificate for one heat is for a different alloy.",
   parts:[
     {id:"a", q:"For each of the five, name the check that finds it and say which checks it passes."},
     {id:"b", q:"Two of these five would survive an audit that compared part numbers only. Identify them and explain what that tells you about part number comparison."},
     {id:"c", q:"For finding 1, a colleague proposes closing it by inspecting the joint and confirming the sealant is present. Answer them."},
     {id:"d", q:"Three of these five were established from records rather than from looking at the article. Identify them, and say what that tells you about how much of a physical audit is a records exercise."},
     {id:"e", q:"Finding 5 passed the traceability check cleanly. Explain to the audit team why that check was performed correctly and still did not help."},
     {id:"f", q:"The CI is embodied at the time of the audit. Which check applies because of that, and what would you record if it were not embodied?"},
     {id:"g", q:"Which single finding would you escalate first, and on what basis, not which is most serious for this unit, but which tells you most about the line?"}
   ]},

{id:"A4-E4", title:"Exercise 4: The parts list against the build record",
   scen:"You are reconciling one assembly on the audited unit. The parts list, PL-44120 revision H, shows five lines.\\n\\nLine 10: P/N 44121-1, next higher 44120-1, quantity 2, serial traceability.\\nLine 20: P/N 44122-3, next higher 44120-1, quantity 1, lot traceability, shelf-life limited.\\nLine 30: P/N 44123-1, next higher 44120-1, quantity 4, lot traceability.\\nLine 40: P/N 44124-2, next higher 44121-1, quantity 1, serial traceability, usage and cycle limited.\\nLine 50: P/N 44125-1, next higher 44120-1, quantity 1, no traceability requirement.\\n\\nThe build records for the unit show:\\n\\n44121-1, S/N A0031 and S/N A0044, installed to 44120-1.\\n44122-3, lot 7734, installed to 44120-1, no date code recorded.\\n44123-1, lot 2201, quantity 3, installed to 44120-1.\\n44124-2, S/N C0102, installed to 44120-1, life consumed at delivery 0 hours.\\n44125-1, no entry.\\n\\nThe reconciliation report for this unit shows no deltas.",
   parts:[
     {id:"a", q:"Compare the five elements line by line and list every delta you find. Name the element each one belongs to."},
     {id:"b", q:"Line 20 is shelf-life limited and the build record carries a lot number with no date code. State the finding precisely, and say why stating it as a missing consumed-life record would be wrong."},
     {id:"c", q:"Line 40 is installed to 44120-1 in the build record and to 44121-1 on the parts list. What kind of defect is this, and what could produce it?"},
     {id:"d", q:"Line 50 has no entry at all. The part is visible on the article. Answer the argument that this resolves the finding."},
     {id:"e", q:"The reconciliation report showed no deltas. Say what that fact means, separately from the deltas themselves, and who the finding is written against."},
     {id:"f", q:"Rank the deltas you found by consequence and justify the top one."}
   ]},

{id:"A4-E5", title:"Exercise 5: Dispositioned, not accomplished",
   scen:"The unit proposed for the physical audit carries nine non-conformance records. NCR 3301 through 3306 show rework accomplished and verified, with sign-offs. NCR 3307 shows use as is, approved by the material review board, on a surface finish characteristic not identified as safety related. NCR 3308 shows repair, with an approved repair scheme attached, rework instruction issued 11 days ago, and no accomplishment sign-off. NCR 3309 shows use as is on a fastener torque characteristic, approved by a board whose attendance list does not include the structures authority. Status accounting reports the unit as having no open non-conformance records. One work order remains open for a cosmetic touch-up.",
   parts:[
     {id:"a", q:"Apply the three closeout conditions to this unit and state which are met."},
     {id:"b", q:"Status accounting reports no open non-conformance records and you have found NCR 3308. Explain how both can be true, and what that tells you about the report."},
     {id:"c", q:"NCR 3309 is a use as is on a torque characteristic, approved by a board without the structures authority present. Is that an entry problem, a finding, or both? Justify it."},
     {id:"d", q:"The program argues that the open work order is cosmetic and should not block the audit. Answer that, and say what the criterion actually says."},
     {id:"e", q:"Decide whether the audit convenes on this unit. Set out what would have to change first, and who owes each CI."},
     {id:"f", q:"Six of the nine records are against the same characteristic across successive units. What does that change, and which check does it reach?"}
   ]}

 ]
},
{
 id:"A5", label:"Module 5", title:"The final system-level audit",
 sub:"What it is scoped to, and what it closes.",
 sections:[

  {id:"A5-01", title:"The final system-level audit: what it is scoped to", body:[
    P("Where the program audits in increments, a final system-level audit confirms that the system product baseline is correct. The system is itself a CI, normally the top one, and on an aircraft program that CI is the aircraft."),
    P("Which raises the question this section exists to answer. Audits are scoped to a subset of CIs, selected by designation for audit. So what is a *system-level* audit scoped to, when the system contains everything?"),
    C("A likely misinterpretation, and what it costs",[
      "The available wrong answer is that a system-level audit is an audit of the system, meaning everything in it. It produces two responses that look opposite and fail identically.",
      "**Attempting to audit the entire engineering bill of materials.** Unaffordable at any real program size, so it either collapses or completes as a paper exercise that examined nothing.",
      "**Sampling a percentage of the installation drawing set.** Statistically respectable and aimed at the wrong population. Structure and wiring dominate an installation drawing set by volume, so the sample lands there almost every time.",
      "The consequences are severe and they compound. **No CI designated for audit receives an audit at all**, including any CI that acquired a hazard risk control mid-program and was never validated. **Interfaces are examined as visible hardware rather than against their definitions**. Wires measured and placed without anyone interrogating which CIs they connect or what the interface document requires. **CIs that would newly designate for audit are never identified**, because the sweep that would find them was never run. And the system baseline is certified on evidence that never touched a CI designated for audit, which creates documented assurance that nothing supports. The most dangerous product an audit can generate."
    ]),
    S("A percentage of the wrong population is not a sample. It is a number.",
      "Scope is decided by what the population is, and only then by how much of it."),
    P("The final system-level audit has **two populations**, and neither of them is drawings."),
    STEPS([
      {h:"Child CIs not yet audited",b:"Swept against the audit designation criteria. CIs that now pass are audited as CIs, with their own entry criteria, data packages and lead times. A program accumulates reassessment triggers for years. Design changes, source moves, escapes, reconciliation anomalies, and hazard log revisions all count. So a CI that failed designation for audit at award may pass it comfortably by the time the system is complete."},
      {h:"Interfaces between CIs",b:"Audited against their interface control documents, at a common effectivity, with both sides' as-built compared to the definition. Prioritized where both sides are CIs designated for audit, where the interface carries a hazard risk control, or where the interface document changed after either side was audited. Each CI's own audit verified its side against its own data; nobody has yet verified that two audited CIs meet correctly. The population comes from the interface register, which the CI identification process maintains: one row per boundary in the CI structure, with the defining document and its revision, the controlling baseline and the control authority. A boundary carrying a signed no-interface determination is recorded as not applicable, never omitted. A boundary in the register with neither defining documentation nor a signed determination is a finding against interface coverage rather than against the article."}
    ]),
    P("Alongside those two, the audit confirms **baseline coherence**: that open action items and deltas from the earlier increments are closed, and that the effectivity is consistent across CIs audited months or years apart. Two audits can each be correct in isolation and describe configurations that were never approved to sit in the same aircraft."),
    P("Baseline coherence also covers the CI structure itself. Where a CI was split or consolidated between increments, confirm the new sibling boundaries appear in the interface register, and that boundaries made internal by a consolidation were dispositioned. A split creates boundaries that did not exist when the earlier increments were audited, so no earlier audit can have covered them."),
    C("The prohibition worth writing down",[
      "**The installation drawing set is not the audit population.** It is the means of locating what to examine.",
      "If a sample is being drawn from drawings rather than from CIs and interfaces, the audit is mis-scoped regardless of the percentage chosen.",
      "**On timing:** run the audit designation sweep at the plan revision before the final audit, not at its door. A CI newly designating for audit needs its own entry criteria, data package and lead time before the system audit can complete. Confirm the sweep again at entry. Finding something new at that point is a finding about how designation for audit was maintained, not merely a scheduling problem."
    ],"teal")
  ], check:{
    q:"A program proposes to scope its final system-level physical audit as a twenty percent sample of the aircraft's installation drawing set. What is the objection?",
    o:["Twenty percent is too small a sample for an audit of this significance",
       "The population is wrong. The audit is scoped to unaudited child items and to interfaces",
       "Installation drawings may only be sampled once every CI beneath them has been audited first",
       "The sample should be drawn from the engineering bill of materials, the complete population"],
    a:1,
    why:"Arguing about the percentage concedes the premise, which is why the sample-size answer is the most dangerous one here rather than merely wrong. A program that raises the figure to fifty percent has doubled the cost of examining the wrong things. The bill of materials is the same error at greater expense. What settles scope is which population the sample is drawn from, and only afterwards how much of it. Drawings locate what to examine. They are not what is examined."
  }},

  {id:"A5-02", title:"A final system-level audit, start to finish", body:[
    P("This narrative follows one system-level audit. It is written so you can see the sequence, the decisions, and where it goes wrong. The program is an aircraft. The audit is on the first production aircraft, tail 004, assembled by a supplier from materiel your company provides."),
    STEPS([
      {h:"Six months out: the audit designation sweep",b:"Somebody re-runs the audit designation assessment across every CI in the system, at the CM plan revision preceding the final system-level audit. Three CIs designate for audit that were not designated for audit before. Two moved a manufacturing source. One had a hazard log revision add a risk control to it. Each of those three now needs its own CI-level audit completed first, because the final system-level audit verifies that child CIs were audited and closed, not that they are audit-worthy."},
      {h:"Four months out: the two populations",b:"Scope is set against two populations, and neither one is the drawing set. The first is the set of child CIs, and the question for each is whether its audit is complete and its actions closed. The second is the set of interfaces between those CIs, and the question is whether both sides were released against the same ICD revision at a common effectivity."},
      {h:"Ten weeks out: entry conditions on the article",b:"Tail 004 is selected jointly. The supplier confirms three things for that specific aircraft: no open work orders, no open nonconformance records, and no open dispositions. The third one fails. Fourteen nonconformances are dispositioned as rework and the rework is not complete. The audit is rescheduled by five weeks rather than run with the CI carried as an action."},
      {h:"Five weeks out: the reconciliation report",b:"The as-designed to as-built reconciliation report for tail 004 arrives, with the nonconformance records and dispositions attached. This is the primary input. The audit does not perform the reconciliation. It checks whether the reconciliation that already ran at scale produced the right answer for this aircraft."},
      {h:"Audit week, day one: the child CI sweep",b:"Every child CI designated for audit is checked for a completed audit and closed actions. Two have open action items past suspense. Those become findings against the audit closure process, not against the aircraft."},
      {h:"Audit week, day two: interfaces at common effectivity",b:"This is where the final system-level audit earns its cost. Each boundary is checked to confirm both sides were released against the same ICD revision. One fails. The flight control computer was audited fourteen months ago against ICD revision D. The actuator was audited three months ago against revision E. Both audits were correct on their own day. The system was never verified against a single consistent set."},
      {h:"Audit week, day three: baseline coherence",b:"The question is whether the product baseline describes one aircraft or several partially overlapping ones. Increments audited months apart can each be correct and still describe configurations that never coexisted."},
      {h:"Closeout",b:"Findings are classified by whether they are isolated or produced by a mechanism. The interface revision mismatch is a mechanism finding. It travels to every aircraft built in that window, and the extent check is mandatory."}
    ]),
    C("What the final system-level audit found that no CI-level audit could have",[
      "Both CI audits passed. Neither was wrong. The defect existed only in the relationship between them, and only a system-level view sees a relationship.",
      "This is the entire argument for the final system-level audit. If audits are only ever conducted at CI level, interfaces are verified twice from two sides at two different times, and never once as a boundary.",
      "It is also why the timing rule exists. Running the audit designation sweep at the preceding CM plan revision is what surfaces the CIs whose facts moved since the last look."
    ]),
    S("Where this narrative most often goes wrong in practice.",
      "The entry conditions get waived. Somebody argues that fourteen open rework CIs are minor and the audit should proceed with them carried as actions. If it proceeds, the reconciliation is drawn from a configuration the aircraft does not yet have, and a clean result is recorded against an aircraft that will be different next week. Rescheduling five weeks is cheaper than a clean audit of the wrong configuration.")
  ], check:{
    q:"At the final system-level audit, the flight control computer was audited against ICD revision D and the actuator against revision E. Both CI audits were correct when conducted. What is the finding, and against what?",
    o:["A finding against whichever CI audit was conducted first, for working to a superseded revision",
       "No finding, since both audits were correct against the revision in force at the time",
       "A finding against baseline coherence and interface control. No common revision was used",
       "A finding against the supplier who assembled the aircraft from the two CIs"],
    a:2,
    why:"Neither CI audit was wrong. That is exactly what makes this a system-level finding rather than a CI-level one. The defect lives in the relationship between two correct audits conducted at different times, and only the final system-level audit looks at relationships. The assembling supplier hosted the audit and did not cause the mismatch, so the finding does not attach to them. The extent check covers every unit built in the window between the two revisions."
  }},

{id:"A5-03", title:"Worked example: a delta audit", body:[
    P("A delta audit closes what an earlier audit left open. It is named in Module 1 and used by the final system-level audit, and this is what one actually looks like."),
    P("The CI is an environmental control unit. Its functional audit convened in April with one requirement outstanding."),
    STEPS([
      {h:"April: the functional audit",b:"Every requirement verified except one. A durability life test is running and will not complete for eleven weeks. The audit proceeds. The open requirement is named, carried as an action item, and recorded as contingent in the minutes. Check 20, partial completion recorded rather than assumed, is satisfied because the partial completion is written down rather than implied."},
      {h:"June: the test fails",b:"At 780 hours of a 1000 hour test, a fan bearing degrades. The design is changed: a different bearing, and a revised lubrication interval in the maintenance data."},
      {h:"July: the test is re-run",b:"The durability test is re-run on the changed design and passes at 1000 hours."},
      {h:"August: the delta audit",b:"It convenes on the change and on nothing else."}
    ]),
    TABLE(["What the delta audit examines","Why"],[
      ["The re-run test, against the requirement","Check 3, the documentation flow. The chain is verified again for this one requirement"],
      ["The configuration the test ran against","Check 5, test configuration provenance. The bearing change has to be in the article that was tested"],
      ["The change itself, incorporated and approved","Check 10, engineering changes incorporated and tested. The change is the reason the delta exists"],
      ["Every other requirement the change could touch","Check 10 again. A bearing change reaches vibration, acoustic and power requirements verified in April"],
      ["The maintenance data change","Check 10, engineering changes incorporated and tested. The lubrication interval moved and the technical data has to move with it. No functional audit check covers maintenance data on its own, so the logistics elements are worked alongside the check set rather than inside it"],
      ["The April action item","Check 18, prior review and lower-level audit closure. It closes here, with evidence, and the closure is recorded"]
    ]),
    C("The one people get wrong",[
      "A delta audit is scoped to the delta. That is the whole idea, and it is also where it goes wrong.",
      "The fourth row above is the reason. A change made to close one requirement can invalidate others that were verified months earlier and were never in question.",
      "**Scoped to the delta means scoped to everything the delta touches, not to the requirement that prompted it.**",
      "Deciding what the change touches is engineering judgment, and it is recorded, signed, and auditable."
    ], "amber"),
    P("**What the delta audit produces.** Its results are either added to the original April minutes or supersede them. Either is acceptable and the choice is made once, on the program, and applied consistently. What is not acceptable is two sets of minutes that each describe a different configuration and neither of which says which one is current."),
    S("A delta audit is not a smaller audit. It is a full audit of a smaller scope.",
      "Every check that applies to what changed is performed at its full depth.")
  ], check:{
    q:"The delta audit team proposes to examine the re-run durability test and the change record, and nothing else, on the grounds that only one requirement was open. What is wrong with that scope?",
    o:["The change may reach requirements that were verified in April",
       "Nothing. A delta audit is scoped to the delta and nothing else",
       "The whole functional audit should be re-run from the beginning",
       "The delta audit should also cover the physical audit, because the bearing is a new part"],
    a:0,
    why:"The delta is the change, not the requirement that prompted it. A different bearing can reach vibration, acoustic and power requirements that were verified and closed in April, and check 10, engineering changes incorporated and tested, asks for re-verification or a recorded rationale wherever an approved change affects a verified requirement. Re-running the whole audit discards work that is still valid. The physical audit is a separate event with its own trigger."
  }}

 ],
 exercises:[

  {id:"A5-E1", title:"Exercise 1: Scoping a final system-level audit",
   scen:"A program has two hundred and forty CIs. Nineteen were designated for audit and audited incrementally over four years. The final system-level physical audit is eight months away. A draft plan proposes a twenty percent sample of the aircraft's installation drawing set, on the grounds that the system audit must cover the whole aircraft and a full sweep is unaffordable. Since the last audit designation review, three CIs have had substantive design changes, one has moved to a new manufacturing source, and a hazard log revision has added a risk control to a fourth. Two CIs audited three years apart interface with each other and their interface document has been revised twice since.",
   parts:[
     {id:"a", q:"State what is wrong with the draft plan, and be precise about whether the problem is the percentage or something else."},
     {id:"b", q:"Set out the two populations this audit is scoped to, and what belongs in each on these facts."},
     {id:"c", q:"Work the sweep. Which CIs would you expect to newly designate for audit, and on what factors?"},
     {id:"d", q:"For the two CIs whose interface document has been revised twice, say what is audited, against what, and why neither CI's own audit covered it."},
     {id:"e", q:"Eight months out. Build the timing: when does the sweep run, when must a CI newly designating for audit's audit happen, and what is your answer if the sweep is left until audit entry?"},
     {id:"f", q:"The program argues that the drawing sample at least covers structure and wiring, which the CI-level audits never looked at. Answer that argument."},
     {id:"g", q:"Name one fact you would need before you could finalize the scope, who holds it, and what you would do if it did not arrive."}
   ]}

 ]
},
{
 id:"A6", label:"Module 6", title:"Findings, closure and the record",
 sub:"Writing a finding, classifying it, and what the audit leaves behind.",
 sections:[

  {id:"A6-01", title:"Findings and action items", body:[
    P("Every discrepancy found during an audit becomes a written record. Not a conversation, not an understanding, not a note in someone's book. A written record with four required elements:"),
    L([
      "**The issue**. What was found, stated so that someone who was not present can understand it.",
      "**The agreed closure plan**. What will be done about it.",
      "**The responsible person**. A person, not a department.",
      "**The agreed suspense date**. When closure is due."
    ]),
    P("Record each discrepancy either as a separate finding record or in the body of the minutes. On defense programs the separate record is called a **Request for Action**, and RFA is the standard format. Whichever form you use, the content is the same. Which route is used depends on the contract. What does not vary is that the four elements are present and the record exists."),
    P("Each element earns its place. **A person** rather than a department. You cannot ask a department for a status, and a department does not inherit the context of what was found. Eighteen months later a named person can be traced through a leaver process. A department name resolves to nobody. **A suspense date** rather than an intention, because an undated commitment cannot become overdue, and a CI that cannot become overdue never surfaces on any report."),
    S("There is no such thing as a verbal finding.",
      "A discrepancy that both sides discussed and nobody wrote down did not happen, and will be re-argued as though it never did."),
    C("The practical machinery",[
      "**A scribe** is assigned before the audit begins, and finding forms are ready. An audit that starts without a scribe generates its findings in three different notebooks.",
      "**Daily minutes** carry the day's findings, and are reviewed jointly at the start of the next session, which is the moment a disagreement about what was found is cheapest to settle.",
      "**Side meetings** happen in every audit, and their conclusions are folded back into the official record by the co-chair rather than remaining with the people who attended."
    ]),
    P("The discipline sounds administrative and is not. The audit's entire value to the organization lies in what it can prove afterwards, to people who were not in the room. The Acquirer, a later program, an investigator. An unwritten finding has no value to any of them.")
  ], check:{
    q:"During a physical audit, an inspector and a supplier engineer agree in front of the audit team that a work instruction does not reflect the current drawing revision. The supplier commits to fixing it that week. Nobody records it, because it will be closed before the audit ends. What is wrong?",
    o:["Nothing at all, provided the correction is genuinely closed before the audit ends this week",
       "Nothing, provided the supplier's own quality system records it",
       "It should have been recorded only if the gap had turned out to be a systematic problem",
       "It should have been recorded as a finding, with a closure plan, owner and a date"],
    a:3,
    why:"Fast closure is genuinely good and is why this feels harmless. But the audit's output is its record: a finding closed during the audit still tells the Acquirer, and the next program, that the gap between instructions and drawings existed. Deciding whether it is systematic comes after recording it, not before. Classification is a judgment made on a written finding, not a filter applied to whether one gets written."
  }},

{id:"A6-02", title:"How to write a finding", body:[
    P("The last section covered what a finding is. This one covers how to write one. They are different skills and only one of them is usually taught."),
    P("A finding that survives has three statements, in this order."),
    STEPS([
      {h:"The requirement",b:"What was supposed to be true, cited to the document that says so, by number and revision. Not paraphrased. If you cannot cite it, you do not have a finding yet."},
      {h:"The objective evidence",b:"What you examined and what you observed. The document, the record, the article, identified precisely enough that somebody else can look at the same thing tomorrow."},
      {h:"The non-conformance",b:"The gap between the two, stated as a fact rather than as a conclusion about anyone."}
    ]),
    TABLE(["Weak","Why it fails","Stronger"],[
      ["Traceability is inadequate","No requirement cited, no evidence identified, and an adjective doing the work","Parts list PL-88231 revision F line 14 requires serial traceability for the actuator. Build record WO-4471 for S/N 0007 records a lot number only"],
      ["The build records are a mess","A judgment about the supplier, not a statement about the CI","Four of eleven non-conformance records against S/N 0007 show a disposition with no accomplishment sign-off: NCR 2211, 2214, 2219, 2231"],
      ["Wrong revision used","No statement of which revision governs or how that was established","The governing revision for this unit\u2019s effectivity is G per ECP 1104. Drawing 88231 revision F was released to the floor and used"]
    ]),
    C("Then the extent question",[
      "**Is this one instance, or is this the mechanism working as it does?**",
      "Ask what would have had to work for this not to happen, and whether that thing is working.",
      "One transcription slip is one slip. One instance produced by a control that is not operating will produce more, and the finding is against the control.",
      "The extent question is also what decides the class. It is the same question that separates major from minor."
    ]),
    P("**Write the finding against the thing that is wrong.** A missing part designation on a supplier CI may be a finding against the supplier, against the statement of work that never imposed it, or against the flowdown that never reached them. Establish who owed it before you write it against anyone, because a finding routed to the wrong owner comes back unclosed and costs a cycle."),
    P("**A finding needs an owner and a date when it is raised, not afterward.** The record carries the issue, the closure plan, the responsible person, and the agreed suspense date. A finding with three of the four is an observation about the future."),
    S("Write it so that someone who was not in the room can verify it, argue with it, or close it.",
      "That is the whole test. Everything else is style.")
  ], check:{
    q:"An auditor writes: \u201cMaterial certification traceability for the bracket is not adequately demonstrated.\u201d The supplier disputes it. What is the first problem with the finding?",
    o:["It is too harsh for what is probably just a paperwork issue",
       "It should have been classified before it was written down",
       "It cites no requirement and no evidence, so there is nothing to examine",
       "It should have been raised verbally with the supplier first"],
    a:2,
    why:"The dispute is not really about the bracket. Nobody can settle it, because the finding names no requirement to test it against and no record to look at. Rewritten with the drawing note that calls the material specification, the heat number on the build record, and the certificate that covers a different heat, the finding either holds or it does not, and both parties can see which. Severity and classification come after the finding is stated, and there is no such thing as a verbal finding."
  }},

    {id:"A6-03", title:"Major, minor and observation", body:[
    P("Findings are classified, and the classification decides how much attention the finding gets and how it is dispositioned. The line is drawn in a specific place, and it is not where most people first assume."),
    CARDS([
      {h:"Major", b:"Production definition documentation or design data incorrect or incomplete. Systematic breakdown of process control. Clear non-adherence to workmanship standards. Hardware or software not included in the build process. Non-adherence to specification, interface or statement-of-work requirements. First article data missing or incomplete."},
      {h:"Minor", b:"Non-systematic errors: typographical mistakes in production definition documentation, in process control records, or in workmanship standards documentation."},
      {h:"Observation", b:"A general query, or a process improvement recommendation, that meets neither set of criteria. General queries are simple in nature, and they are not cause for delay or for cessation of production of the CI."}
    ],3),
    P("There are three classes, not two. The third one earns its place: it is where a real observation goes so that it does not get inflated into a minor finding. An observation is still written up, still carried on a Request for Action, and the form carries all three classes side by side."),
    S("The line is systematic versus not systematic. It is not the number of instances found.",
      "One finding can be major. Fifty can be minor. Counting is not classifying."),
    P("The reason the line sits there is that classification is a statement about the **mechanism**, not about the damage. A single instance produced by a broken mechanism will produce more instances, and every one of them is still to come. Fifty instances produced by fifty independent slips are fifty slips. Annoying, worth correcting, not evidence that the process is out of control."),
    C("The two errors this produces",[
      "**Counting up to major.** A reviewer finds eleven typographical errors and classifies the finding as major because eleven feels serious. If each is an independent transcription slip, the mechanism is intact and the classification is wrong, and now the program is treating a proofreading problem as a process breakdown.",
      "**Counting down to minor.** A reviewer finds one instance of hardware installed that never entered the build process and classifies it as minor because it is one. That mechanism produced this instance and can produce others, and nobody yet knows how many it already has."
    ]),
    P("One caution on where these classes come from. The three classes and their criteria are in GEIA-HB-649A, which is guidance rather than a requirement, and this company has adopted them. EIA-649-1A does not classify audit findings at all. It does classify two other things, and the words look alike: engineering changes are major or minor, and requests for variance are critical, major or minor. Neither scheme belongs on a finding, and the variance scheme is the one that pulls people in, because it adds a critical class that audit findings do not have."),
    P("When you cannot tell which you are looking at, stop counting. Ask what would have had to work for this not to happen. Then ask whether that thing is working.")
  ], check:{
    q:"An audit finds a single instance of an assembly step performed without an approved work instruction, traced to a documented gap in how new steps are released to the floor. Separately it finds fourteen typographical errors across a set of drawings, each an independent transcription slip. How are these classified?",
    o:["Both major, because both concern production definition documentation",
       "The single instance is minor because it is only one. The fourteen are major by their number",
       "Both minor, because neither affected the delivered hardware's performance",
       "The single instance is major because the mechanism is systematic. The fourteen are minor"],
    a:3,
    why:"Classifying by count is the intuitive answer and it is exactly backwards: it draws the line at number when the line is drawn at mechanism. A documented gap in how instructions reach the floor will produce more instances, so one is enough. Fourteen independent slips are fourteen slips. Performance impact is not the classification test either, which is what makes the both-minor answer tempting."
  }},

  {id:"A6-04", title:"Worked examples: classifying findings", body:[
    P("Classification is learned from cases. Cover the verdict column and work each one before reading across."),
    TABLE(["Finding","Classification","Reasoning"],[
      ["A single connector installed on the audit unit is not on the approved parts selection list. It was substituted by a technician during a shortage, with a supervisor's verbal agreement.","Major","Hardware installed that did not go through the build process as approved. The mechanism. Informal substitution under shortage pressure with verbal approval. Is available to every technician on every shortage, so one instance describes a route, not an accident."],
      ["Nineteen drawings in a sampled set carry a misspelled material name in a note. The correct specification number is cited beside it in every case.","Minor","Non-systematic transcription errors in production definition documentation. Nineteen instances feel like a pattern, but nothing is misdirected: the governing reference is correct throughout. Correct them and move on."],
      ["Manufacturing instructions for one part reflect a superseded drawing revision. Investigation shows approved changes are not consistently reaching the release process.","Major","The instruction error is the symptom. The finding is the break between change approval and release, which is a systematic breakdown of process control, and every part released through that path is in question."],
      ["First article inspection data for a newly sourced detail part is incomplete: three dimensions were not recorded.","Major","First article data missing or incomplete is named as major on its own. The first article is the evidence that a new source can make the part at all; incomplete evidence for a new source is exactly the situation the classification exists for."],
      ["A drawing note references an internal procedure number that was renumbered last year. The procedure content is unchanged and the correct one is found immediately.","Minor","A stale reference with no effect on what gets built, and no evidence that references are systematically going stale. If the audit found that half the sampled drawings carried stale references, the verdict would change, not because of the count, but because that would evidence a mechanism."],
      ["An interface requirement in the statement of work is not reflected in the CI's specification. The CI was built to the specification.","Major","Non-adherence to statement-of-work and interface requirements. The CI conforms to a document that does not conform to what was required, which is a failure that no amount of downstream conformance detects."]
    ]),
    C("Two of these are counter-intuitive on purpose",[
      "The connector is **one instance and major.** The mechanism is what classified it.",
      "The nineteen drawings are **nineteen instances and minor.** The count did not classify them either.",
      "If you disagreed with either, re-read the reasoning column and check which question you were answering: how bad does it look, or what mechanism produced it."
    ],"teal")
  ], check:{
    q:"An audit finds that one sampled drawing references a superseded revision of an interface document. The audit team asks how changes reach drawings and learns that the propagation step depends on an engineer noticing an email. No other stale reference is found in the sample. How is this classified, and why?",
    o:["Major. Change propagation depends on someone noticing",
       "Minor. A single stale reference found across a whole sample, with no pattern behind it at all",
       "Minor now, becoming major if a second instance is found later",
       "It cannot be classified until the sample is extended to establish the rate"],
    a:0,
    why:"A rate of one in a sample genuinely looks minor, and that is the trap: the classification follows the mechanism, and the mechanism here is a propagation step with no control on it. Waiting to extend the sample sounds rigorous but postpones a judgment already available. The audit team learned how changes reach drawings, and that answer is the finding."
  }},

  {id:"A6-05", title:"The minutes", body:[
    P("The minutes are the audit. Everything else, the days of examination, the arguments, the agreements, exists afterwards only in the form the minutes gave it."),
    P("Required content:"),
    L([
      "**The audited CI**, identified.",
      "**Decisions and proceedings.**",
      "**Attendees.**",
      "**Action items.**",
      "**The complete list of documents, with the revision level each carried at the time of the audit.**",
      "**The complete list of specification requirements audited.**",
      "**Identification of everything examined**, documentation and physical products, by name, specification number, product identifiers, serial numbers, drawing and part numbers, and CAGE code."
    ]),
    P("Two of those CIs are more demanding than they read. The **complete list of specification requirements audited** does two things. It lets a reader tell a full walk from a sample. Where it was a sample, it says exactly which requirements were in it. The **identification of everything examined** goes down to unit identifiers, drawing and part numbers, and CAGE code. \u201cThe unit\u201d is not an identification. The whole value of the physical audit is that it examined one specific article. A record that does not say which article discards that value."),
    C("The revision levels are the part that decays",[
      "A minute recording that the drawing set was reviewed tells a reader almost nothing two years later, because the drawing set has moved.",
      "A minute recording which revision each document carried on the day tells them exactly what was examined, and lets them determine what has changed since.",
      "**Without revision levels, the minutes describe an event. With them, they describe a configuration.**"
    ]),
    P("Timing runs on three clocks. Daily minutes go to joint review at the start of the next session. Overall minutes reach the Acquirer before the audit team leaves the site. Finalized minutes are published and delivered within sixty days of audit completion, or per contract."),
    S("Minutes without revision levels record that an audit happened. Minutes with them record what it found.",
      "It is the difference between an event and evidence.")
  ], check:{
    q:"A set of audit minutes lists every document reviewed by title and number, records the attendees and the action items, and states that the documentation was found acceptable. Two years later a query arises about what was examined. What is missing, and what is the consequence?",
    o:["Nothing is missing. Titles and numbers identify the documents examined",
       "The complete list of requirements audited, which is optional but useful",
       "The revision level each document carried at the time, which fixes what was examined",
       "The serial numbers of the examined hardware, recorded separately in status accounting"],
    a:2,
    why:"Titles and numbers do identify the documents, which is why calling the minutes complete is tempting, but documents move, and an identifier alone points at whatever the current revision happens to be. The list of requirements audited and the identification of examined hardware are both required content, not optional and not delegated elsewhere; but the specific defect here is that the record cannot be tied to a configuration."
  }},

  {id:"A6-06", title:"Closure, certification and disposition", body:[
    P("An audit does not finish when everyone goes home. It finishes through a defined sequence, and three separate parties act in it."),
    STEPS([
      {h:"Action items tracked to closure",b:"Every finding is tracked, and the corrective action documentation is delivered to the Acquirer for review. Closure is evidenced, not asserted."},
      {h:"The summary report",b:"A consolidated report reflecting all action items and discrepancy information from the audit. The detailed final report is issued **after the Acquirer has verified the completed CIs**, so the final report describes verified closure rather than claimed closure."},
      {h:"Joint certification",b:"Signed jointly: the Supplier's audit lead and program manager, and the Acquirer's representatives. Results are recorded as **complete and successful** where nothing is open, or **conditional** where the resolutions are agreed but tasks remain."},
      {h:"Acquirer disposition",b:"The Acquirer dispositions the audit as **approval** where all findings are satisfactorily completed, **contingent approval** pending completion of action items, or **disapproval** where the audit was seriously inadequate."},
      {h:"Status accounting",b:"Scheduled and actual audit dates, accomplishments and results are recorded per CI in the status accounting system."}
    ],"tl"),
    P("Notice the asymmetry in the reporting. The consolidated summary can be issued on the strength of what the audit found; the detailed final report waits for the Acquirer to verify that the completed CIs really are complete. Closure is a claim made by the party that owed the action and confirmed by the party that raised it, which is why corrective action documentation is delivered rather than filed internally."),
    P("Where re-accomplishment of any inspection, test or audit activity is needed, the Acquirer or a designated representative is invited to witness it. Re-accomplishment under observation is not a mark of distrust; it is the same standard the original activity was held to, applied again."),
    P("Then the baseline point, which people get wrong constantly: **for a CI designated for the physical audit the product baseline is formalized after successful completion of the physical audit and approval of the product specification.** Not on the last day of the audit. Not when the audit team certifies. The audit is a necessary condition and the Acquirer performs the formalizing act."),
    S("Complete and successful means nothing is open. Conditional means the resolutions are agreed and the work is not done.",
      "Those are two different statements about the same audit, and only one of them can be true.")
  ], check:{
    q:"An audit closes with four action items open, all with agreed closure plans, owners and suspense dates. The program wants the audit certified complete and successful so that the product baseline can be established, arguing that the plans are agreed and closure is a formality. What is available?",
    o:["Certification as complete and successful, since every open item has an agreed plan",
       "No certification at all until all four action items are closed",
       "Certification as complete and successful, with the four items moved to the next audit",
       "Certification as conditional, with tasks not yet complete"],
    a:3,
    why:"Agreed plans are real progress, and that is why this argument gets made, but complete and successful is a statement that nothing is open, and four things are open. Conditional certification exists precisely for this situation, so refusing to certify at all overstates it. Transferring open items to a later audit does not close them; it moves them where they are harder to see."
  }},

  {id:"A6-07", title:"What the audit is required to produce", body:[
    P("The checks are not the deliverable. Nine things come out of an audit. A team that recognizes only the first four produces a record missing the parts an Acquirer and a later program rely on."),
    STEPS([
      {h:"Findings",b:"Every non-compliance identified by any check, documented by configuration management, provided to the Acquirer for action, and evaluated for the action it requires. Documenting each non-compliance and providing it is mandatory for safety in its own right. The same cluster as the obligation to conduct the audit at all."},
      {h:"Action items",b:"Each with its issue, agreed closure plan, responsible individual and agreed suspense date."},
      {h:"Minutes, as an evidence package",b:"Alongside proceedings, attendees and the identification of everything examined with revision levels: the complete product drawings and associated lists package with the manufacturing instruction sheets; completed inspection reports for the selected drawings and their associated instructions; records of the configuration baselines for comparison against the change control and release system, including interim releases of spares provisioned before the audit; confirmation that inspection and test of sub-supplier end items was completed at point of manufacture; and the parts selection list supporting the installed-parts examination."},
      {h:"Rectification records",b:"Evidence that findings and action items have been closed, with post-audit actions completed as assigned."},
      {h:"A configuration audit summary report",b:"Covering the applicable action items and the discrepancy information derived from the audit checklist package."},
      {h:"A detailed configuration audit summary report",b:"Prepared **only after successful verification that the completed action items are complete**, and then provided. The two reports are sequenced deliberately: the first states what was found, the second states what was verifiably closed."},
      {h:"An invitation to witness re-accomplishment",b:"Where any inspection, test or audit has to be re-accomplished, the Acquirer or a designated representative is invited to witness it."},
      {h:"A final system-level audit where increments were used",b:"Confirming that the system product baseline is correct."},
      {h:"The product baseline itself",b:"Formalized by the Acquirer on successful completion and approval of the product specification. It is the purpose of the audit, not a by-product of it."}
    ]),
    S("The first report states what was found. The second states what was verifiably closed. A single report issued on claimed closure collapses the distinction that matters.",
      "Which is why the detailed report waits for the Acquirer to verify, rather than for the program to assert."),
    C("The checklist package",[
      "The summary report requirement describes discrepancy information as deriving from the **audit checklist package.** The standard therefore presumes such a package exists.",
      "The physical audit check set taught in Module 4 is that package. Writing it down is not an addition to the process. It is producing the thing the reporting requirement already assumes."
    ],"teal")
  ], check:{
    q:"An audit closes. Findings were documented and provided, action items are tracked, minutes are issued, and a single summary report is prepared once the program confirms all action items are complete. What is missing?",
    o:["Nothing. All four outputs are present and the report covers closure",
       "The minutes should have been issued after the summary report, not before",
       "Two separate reports are required, not one combined report",
       "A second report is only required where the audit was certified conditional rather than complete"],
    a:2,
    why:"A single report issued on the program's own confirmation is the common shortcut, and it reads as complete because nothing in it is false. What it loses is the distinction between what the audit found and what was verifiably closed. The second report exists because verification of closure is the Acquirer's act, not the Supplier's assertion, and it is required regardless of how the audit was certified."
  }},

  {id:"A6-08", title:"The record set, and what a good audit changes", body:[
    P("Eight records come out of an audit program. Learning them gives you a filing system for everything in this training."),
    TABLE(["Record","What it carries"],[
      ["Designation assessments","For every CI evaluated, designated for audit or not, with rationale and signatures. Retained for the life of the program."],
      ["Audit plan and agenda","As approved by the Acquirer."],
