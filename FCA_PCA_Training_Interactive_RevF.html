    P("The proportions matter. A program may deliver forty units of a CI; the physical audit examines one. A drawing package may run to hundreds of sheets; the audit reviews an agreed sample against the manufacturing instructions. A requirement set may run to hundreds of entries; the functional audit may walk a sample of them. Every one of those numbers is chosen so that the audit can judge the process, and none of them is chosen so that the audit can find every defect."),
    S("An audit is a check on the verification system, not a substitute for it.",
      "It samples the output of a process in order to judge the process."),
    C("Two things this rules out",[
      "**\u201cWe will catch it at the audit\u201d is never a plan.** The audit sees one unit and an agreed sample. Anything the continuous machinery misses will probably still be missed, and if the audit does find it, the finding is about the machinery, not about that one part.",
      "**\u201cNot designated for audit\u201d never means \u201cnot verified.\u201d** Undesignated CIs are inspected, tested, controlled and reconciled exactly like everything else. Designation decides where the discrete validation events are placed, not where the discipline applies."
    ])
  ], check:{
    q:"A team decides not to reconcile a batch of change incorporations now, on the basis that the physical audit will pick up anything that went wrong. Why is that a mistake?",
    o:["Because the audit examines one unit and a sample. It cannot replace reconciliation",
       "Because the audit team is not qualified to perform reconciliation work on that batch",
       "Because reconciliation has to be complete before an audit can be scheduled, and none of it has been done",
       "Because audits only cover CIs that carry safety-critical functions"],
    a:0,
    why:"Making reconciliation a precondition for scheduling sounds like good discipline and is close to a real rule about audit readiness, but it is not the reason this reasoning fails. The reason is one of coverage: continuous reconciliation looks at everything, and the audit looks at one unit and a sample in order to judge whether that continuous work is sound. Substituting the sample for the population removes the very thing the sample was meant to test."
  }},

  {id:"A1-13", title:"Audit forms: incremental, delta, combined, and the final system-level audit", body:[
    P("Audits are sequenced bottom-up. Lower-level CIs are audited first, then subsystems, then the system."),
    STEPS([
      {h:"Incremental audits",b:"Each lower-level CI designated for audit is audited in its own right, as it becomes ready. This is how a large program audits anything at all. Waiting for the whole system to be finished would put every audit at the end, where there is no time left to act on findings."},
      {h:"The final system-level audit",b:"It confirms that all functional, allocated and product baseline requirements are satisfied, and that the system product baseline is correct. Open action items from the lower-level audits are carried into its minutes rather than quietly expiring with the audit that raised them. A system-level audit is not scoped to everything in the system. Reading it that way is an expensive mistake, and Module 5 covers what it is scoped to instead. The standards and many contracts call this concluding audit a capstone audit. This training uses final system-level audit throughout, so recognize the other word when you meet it."},
      {h:"The delta audit",b:"A follow-on audit covering the portion of configuration and verification data that was still open at the original audit. Most often testing that was not complete. Its results are added to, or supersede, the original minutes."},
      {h:"Combined events",b:"A functional and physical audit held as one event, where there is high confidence that both sets of requirements can be satisfied in one timeline."}
    ]),
    P("The delta audit deserves particular attention, because of what it makes possible. Verification of some requirements may depend on integrated system testing that has not yet happened. Without a delta mechanism, an audit facing that situation has two bad options: postpone everything, or certify a completeness that does not exist."),
    P("These forms interact. A delta audit on a lower-level CI may still be open when the final system-level audit convenes. Those open action items travel into its minutes. They are not treated as closed because the later audit is a bigger event. An audit higher up the structure inherits what was left open below it, in writing, and that inheritance is the whole point of sequencing bottom-up."),
    S("The delta audit is the mechanism that lets an audit tell the truth about what is not finished.",
      "Open requirements become action items and close through the delta once the outstanding testing passes."),
    C("Reading it the other way round",[
      "If a program is reluctant to plan a delta audit, ask why. The usual reason is that a delta makes the incompleteness visible in the record, and someone would prefer it stayed a footnote.",
      "That is the exact reason the mechanism exists."
    ])
  ], check:{
    q:"At a functional audit, verification of four requirements depends on integrated system testing that will not happen for two more months. The program wants the audit certified now. What is the correct handling?",
    o:["Acknowledge partial completion, record the four as action items, and close them by delta audit",
       "Certify the audit and note the four requirements informally in the minutes",
       "Postpone the whole audit until integrated system testing is complete",
       "Agree to sample those four requirements out of scope, since they cannot be verified yet"],
    a:0,
    why:"Postponing everything is the tempting honest-looking answer, and it is the one that wastes the readiness of everything else while pushing findings later, where there is less time to act on them. Sampling the four out is worse: it removes them from the record entirely rather than leaving them visible and owed. Partial completion with a planned delta is the mechanism built for exactly this, and it keeps the incompleteness in writing."
  }},

  {id:"A1-14", title:"What the physical audit formalizes", body:[
    P("The physical audit is not only a check. For a CI designated for a physical audit it is the event that turns an initial product baseline into a formalized one."),
    P("The **product baseline** has two states, and each has its own event. The **initial product baseline** is established at completion of critical design review. The **formalized product baseline** is established no later than first production unit delivery or physical audit completion. Both are product baselines. Only one of them is closed."),
    P("Which of those two closes it depends on one thing. For a CI designated for a physical audit, the audit is the formalizing event: on successful completion of the audit and approval of the product specification, the Acquirer formalizes the product baseline for that CI. For a CI not designated for a physical audit, the product baseline is formalized no later than first production unit delivery. From the moment it is formalized, every change to the CI runs through formal engineering change action against it."),
    P("Between the two events the CI carries its initial product baseline and not a formalized one. That is a real baseline and real control. Released drawings exist, and changes run against them. What the initial product baseline does not yet carry is the customer\u2019s acceptance of it as the definition of the CI. That is what the formalizing event adds."),
    C("What deferral actually costs",[
      "Programs defer the physical audit for understandable reasons: the unit is late, the customer is busy, the schedule is tight.",
      "Deferring it does not remove an activity from the program. The examination still has to happen, and the CI stays on its initial product baseline while it waits. Every unit built in the meantime is built against a product baseline the Acquirer has not yet formalized.",
      "**Skipping the audit does not save the work. It leaves the CI on a reference point the customer has never accepted.**"
    ]),
    P("What the formalized product baseline adds, over and above the initial one, is worth stating in plain terms:"),
    L([
      "**An agreed definition** of the CI that both parties have accepted, rather than a design set that one party released.",
      "**A reference point for change**: every later change is proposed, evaluated, approved and incorporated as formal change action against that definition.",
      "**A basis for everything downstream**. Spares, repair, retrofit, investigation. Each of those asks what the CI was supposed to be, and the product baseline is the answer."
    ]),
    S("Deferring the physical audit on a CI designated for that audit holds that CI on its initial product baseline.",
      "For that CI the audit is the formalizing event, not a report on it."),
    P("This is also why a CI the Acquirer controls always needs a physical audit. The Acquirer formalizes the product baseline for that CI at audit completion, so without the audit the formalizing event never arrives.")
  ], check:{
    q:"A program defers the physical audit indefinitely. Six months later a change is proposed to the CI. What is the practical consequence?",
    o:["None. Changes are processed against the released drawings whether or not an audit has happened",
       "The change cannot be processed at all until the deferred audit takes place",
       "The CI still carries its initial product baseline, so the change has no closed reference point",
       "The change can proceed but must be classified as a major change because of the deferral"],
    a:2,
    why:"Saying that nothing changes is tempting, because released drawings really do exist and really are controlled. Work does not stop. But a CI whose product baseline the Acquirer has not yet formalized is a CI still on its initial product baseline, and the audit that would formalize it is still owed. Work also does not halt waiting for the audit, which is why blocking the change overstates the effect."
  }},

{id:"A1-15", title:"The CM document set: who owns what", body:[
    P("Four processes govern this work. Each one owns something, and each one defers to the others for everything it does not own. Knowing which is which saves a great deal of time."),
    TABLE(["Process","Owns","Answers"],[
      ["CI identification","What is a CI, the CI structure, the interface register, identifiers and documentation sets","Is this a CI? At what level? What documentation defines it? Which boundaries exist?"],
      ["Configuration audit","The two audits, audit designation, the readiness checklists and the two check sets","Does this CI get an audit? Which one? What has to be true first? What is examined?"],
      ["Sub-supplier CM flowdown","The nine work types and their audit roles, the requirement sets, the standing conditional audit clause, effectiveness determinations","What does this supplier owe? What is their audit role? How do we know their CM works?"],
      ["Safety management system","Hazard analysis, risk controls, and the register of safety-mandatory CM requirements","Which requirements are mandatory for safety, and what happens if one is not performed?"]
    ]),
    C("Three rules that follow from this",[
      "**Each process references the others by plain name, not by number.** Document numbers change. Names do not.",
      "**Where two processes cover the same ground, the owner governs.** The audit process restates the supplier work type roles. The flowdown process owns them, so the flowdown process wins.",
      "**Definitions are used as written.** A term defined in the process that owns it is carried verbatim everywhere else, with the plain explanation underneath rather than instead."
    ]),
    P("**The register of safety-mandatory CM requirements is the one to know about.** It is an enterprise register, not a program document. Requirements that appear in it are performed regardless of what a contract flows down. No process adds to that list locally, and no process drops from it locally."),
    S("If you do not know which process answers your question, the question is usually about ownership rather than about the answer.",
      "Find the owner first. The answer is normally already written.")
  ], check:{
    q:"A buyer asks whether a procured engine assembly should be decomposed into lower-level CIs so each can be audited separately. Which process answers, and what does it say?",
    o:["The audit process. Anything designated for audit is audited at the level it was designated at",
       "The flowdown process, in which the supplier's work type decides the decomposition level used",
       "The safety management system, if the engine hosts a hazard risk control",
       "The CI identification process. A supplier-designed CI is a CI at the level you procure it"],
    a:3,
    why:"The question is about what a CI is and at what level, and that belongs to CI identification. Its answer is that a supplier-designed CI procured as a unit is a CI at the level you procure it. The audit process then decides whether that CI is designated for audit, and the flowdown process decides the supplier\u2019s role in it. Both of those are downstream of a question they do not own."
  }},

    {id:"A1-16", title:"Who does what", body:[
    P("Audits rarely fail because someone exercised judgment badly. They fail because something needed on the day had no owner, and everyone assumed it belonged to someone else. Read this as a handoff map."),
    TABLE(["Role","What they carry"],[
      ["Configuration management","Owns the audit process. Holds the change records for the CI, meaning the approved and outstanding engineering changes, the variances, and the effectivity of each. Runs the as-designed to as-built reconciliation at scale, and produces the reconciliation report for the audit unit before the audit convenes. Prepares the plan and agenda, coordinates Acquirer approval, assembles and controls the data package, records the minutes, documents each non-compliance as a finding and tracks it to closure, prepares the summary report, and records results in status accounting."],
      ["Audit co-chair","The Supplier's designated representative for the audit. Runs proceedings jointly with the Acquirer's co-chair, gives the opening briefing, folds side-meeting conclusions into the official record, and delivers the management out-brief."],
      ["Systems Engineering","The requirements allocation matrix, the requirements traceability matrix, specifications, interface documentation and analyses. Presents requirement-by-requirement verification evidence at the functional audit."],
      ["Design Engineering","Released drawings and models, parts lists and product specifications. Authors the technical content of each engineering change. Supports the as-designed to as-built reconciliation at the physical audit."],
      ["Test and Evaluation","Test plans, procedures and reports. Accounts for tests not yet performed and the plan to accomplish each of them."],
      ["Manufacturing","Manufacturing and work instructions, process records, facility and unit access, staging of the audit unit and its detail parts."],
      ["Quality Assurance","Quality records, first article results and acceptance test data. Witnesses the software build and installation check. Confirms that production processes match those used in development, or that the differences are documented."],
      ["Software engineering","Version descriptions including the build environment, library listings of every version held, and the build itself."],
      ["Logistics and support","Operation and support manuals."],
      ["System Safety","Signature on assessments where any safety question was answered yes. Disposition of any finding with a safety consequence, and routing of findings that affect hazard risk controls. Where a program proposes not to perform an audit a CI is designated for, System Safety takes it to the safety disposition gate rather than concurring in it."],
      ["RM&SH","The failure modes and criticality analysis, single point failure identification, and reliability history that feed the risk factors in the designation assessment."],
      ["Supplier Requirements Engineering","Authors the supplier statement of work and buys the audit obligations in it, including conduct, host and access rights, each cited with the verification method that evidences it. Arranges access and hosting where any part of the audit happens at a supplier facility. Cites the supplier audit plan as a deliverable and calls it. Identifies new or changed sources and sub-tier suppliers. Routes findings raised against a supplier and executes the contractual action."],
      ["Equipment Managers and Responsible Engineers","Confirm the technical basis for their CIs and that the data package is sufficient to audit them. Answer technical questions on their CIs during the audit. Own the corrective action for findings raised against them."],
      ["Sub-suppliers","**Applies only where a CI they build is designated for audit.** Participate in planning as well as conduct for audits of their CIs, prepare audit plans identifying their own requirements and responsibilities, and field people who can discuss the technical detail of what is presented. Their work type sets which of those parts they play."],
      ["The Acquirer","Approves the schedule, plan and agenda. Co-chairs proceedings. Jointly selects the unit examined at the physical audit. Dispositions the results, and formalizes the product baseline."]
    ],{nokey:true}),
    P("One row is conditional. Sub-suppliers carry nothing here unless a CI they build is designated for audit. Every other row carries its content on every audit."),
    S("Most audits that go badly do not fail on judgment. They fail on a handoff nobody owned.",
      "When you read this table, read the seams between rows, not the rows.")
  ], check:{
    q:"Two weeks before a functional audit, nobody has produced the list of tests not yet performed with the plan to accomplish each. Which function owns that deliverable?",
    o:["Test and Evaluation, who account for tests not performed and the plan to accomplish them",
       "Configuration management, because CM assembles the data package and controls what goes into it",
       "Systems Engineering, because it concerns verification of requirements",
       "The Acquirer, who decides which tests are required for the audit"],
    a:0,
    why:"Configuration management is the tempting answer because CM assembles the package and will certainly be the one chasing it, but assembling is not producing, and CM cannot write a test accomplishment plan. Systems Engineering owns the requirements and the traceability matrix; the account of what has and has not been tested, and how the gaps will be closed, sits with Test and Evaluation. Confusing chasing with owning is how a deliverable like this arrives unclaimed on the day."
  }},

{id:"A1-17", title:"Who to ask", body:[
    P("The previous section lists what each function does. This one runs the other way, because that is the direction a question actually arrives in."),
    TABLE(["The question you have","Who answers it"],[
      ["Is this item a CI, and at what level?","Configuration Management, from the CI Identification process"],
      ["Is this CI designated for audit?","Configuration Management, from the audit designation assessment"],
      ["Who holds design authority for this CI?","Systems Engineering and the Responsible Engineer. Not procurement, and not CM"],
      ["Which requirements does this CI have to meet?","Systems Engineering, from the requirements allocation matrix"],
      ["Is this requirement mandatory for safety?","System Safety, against the enterprise register"],
      ["Does this failure consequence sit in the top two severity bands?","System Safety, from the hazard log. Use the pre-anchored severity where one is recorded"],
      ["What are the failure modes and the criticality for this CI?","RM&SH"],
      ["What is this supplier\u2019s work type, and what is their audit role?","Supplier Requirements Engineering, from the statement of work and the flowdown matrix"],
      ["Did we buy the right to audit at their facility?","Supplier Requirements Engineering. Access is bought in the statement of work or it is a request"],
      ["Is this supplier\u2019s CM effective?","Configuration Management holds the evidence. The determining authority named in the CM plan decides"],
      ["What is the as-built configuration of this unit?","CM status accounting, from the reconciliation report"],
      ["Is this unit closed out?","CM status accounting, on all three conditions"],
      ["Who assigned this safety-critical or life-limited part designation?","One of three cases, stated in the statement of work. Establish which before writing a finding"],
      ["What does this drawing note mean?","Design Engineering, or the Responsible Engineer for the CI"],
      ["Can we ship with this open?","Quality and the approving authority for the disposition. Not the audit team"]
    ]),
    C("Two answers that are almost always wrong",[
      "**Ask CM.** CM records most of these answers and owns few of them. Asking CM to decide design authority, or criticality, or whether a requirement is mandatory for safety, produces a recorded answer with no authority behind it.",
      "**Ask whoever is in the room.** An answer given in a meeting and never written is not an answer. It is a thing somebody will remember differently in a year."
    ]),
    S("Most audit delays are not technical. They are a question sitting on the wrong desk.",
      "Getting it to the right one on the first try is worth more than any other habit on this list.")
  ], check:{
    q:"During a physical audit a supplier cannot produce a serialization record for a part, and says the part was never designated as requiring serial traceability. Who settles it?",
    o:["Configuration Management, working from the status accounting system for the unit",
       "The parts list, which states the traceability requirement",
       "Quality Assurance, working from the inspection records for the part",
       "The supplier, since they hold the build records for the unit"],
    a:1,
    why:"The question is what the design required, and the parts list states the traceability requirement for each line. So the argument is settled by reading the governing revision of the parts list, with the Responsible Engineer confirming which revision governs at this effectivity. Status accounting tells you what was captured, which is the other side of the comparison. Inspection records and build records tell you what happened, not what was required."
  }}

 ],
 exercises:[

  {id:"A1-E1", title:"Exercise 1: One CI, four years",
   scen:"An electro-mechanical latch assembly is procured at contract award. At award it is not named in any contract document as requiring an audit, its design is a proven heritage design, and the supplier has built it for a decade. Two years in, a hazard log revision records a hazard risk control that the latch implements. Six months after that, the supplier moves the latch's machining to a new sub-tier shop. A year later, reconciliation reports show an unincorporated-change backlog against the latch.",
   parts:[
     {id:"a", q:"At award, what is the designation-for-audit outcome, and what record is created?"},
     {id:"b", q:"The hazard log revision lands. What happens, when, and who has to sign what?"},
     {id:"c", q:"The new sub-tier shop appears. Which part of the assessment does that touch, and what is the outcome on its own?"},
     {id:"d", q:"The reconciliation backlog appears. Explain why this particular factor should worry you more than its arithmetic weight suggests."},
     {id:"e", q:"Across the four years, how many times should this CI have been assessed, and what triggered each one?"},
     {id:"f", q:"If the program had recorded nothing at award because the CI was not designated for audit, what would be missing now, and what would you have lost beyond the paperwork?"}
   ]},

  {id:"A1-E2", title:"Exercise 2: The argument you will actually have",
   scen:"A program manager asks you to leave a valve assembly undesignated. Their reasoning: the design is unchanged from a fielded product, the supplier is long-standing, the schedule is compressed, and an audit will cost six weeks that the program does not have. You establish that the valve hosts a hazard risk control recorded in the hazard log, and that the supplier has changed the heat-treat process for the valve body since the last build.",
   parts:[
     {id:"a", q:"Work the assessment and state the outcome, part by part."},
     {id:"b", q:"The program manager's arguments are all true. Which of them are relevant to the assessment, and which are not?"},
     {id:"c", q:"Can configuration management agree to leave this CI undesignated? Answer precisely, and say what would have to happen for the omission to be legitimate."},
     {id:"d", q:"Suppose the valve did not host a hazard risk control, and the heat-treat change were the only factor present. What is the outcome then, and what do you still write down?"},
     {id:"e", q:"Name one fact in this scenario you would want confirmed before signing anything, who you would ask, and what you would do if the answer did not arrive before the assessment was due."}
   ]},

  {id:"A1-E3", title:"Exercise 3: Reading a situation after the fact",
   scen:"You inherit a program. A CI was designated for both audits three years ago. The functional audit was conducted. The physical audit was scheduled twice and deferred both times. First because the representative unit was late, then because the customer's team was unavailable. Forty units have since been delivered. A field return arrives showing a fastener grade that does not match the released drawing. Nobody can say whether the other thirty-nine units are affected.",
   parts:[
     {id:"a", q:"What does the absence of a completed physical audit mean for the status of this CI's configuration? Be specific about what does and does not exist."},
     {id:"b", q:"The program argues that deferring the audit saved three years of effort. Answer that argument."},
     {id:"c", q:"Which continuous verification activities should have caught the fastener before a field return did, and what does it tell you that they did not?"},
     {id:"d", q:"Someone proposes that the physical audit, when it finally happens, will resolve the question of the other thirty-nine units. Is that right?"},
     {id:"e", q:"Re-run the designation assessment for this CI today. What is different from three years ago?"}
   ]},

  {id:"A1-E4", title:"Exercise 4: Five candidates",
   scen:"You are assessing five CIs on a safety-significant product line. (1) A structural fitting the Acquirer controls and whose product baseline the Acquirer will establish. (2) A commercial display unit bought to catalog, unchanged for years, with no safety function. (3) A firmware load embedded in a device that implements a hazard risk control. (4) A wiring harness with no safety function, whose only factor is that it has never been audited. (5) An actuator with a substantive design change since its last audit and a history of quality escapes on its production line.",
   parts:[
     {id:"a", q:"Give the designation-for-audit outcome for each of the five, with the reasoning that produced it."},
     {id:"b", q:"Two of these are designated for reasons that have nothing to do with risk factors. Which, and what does that tell you about how the assessment is structured?"},
     {id:"c", q:"For the CI you did not designate for audit, state exactly what is recorded and why the record matters."},
     {id:"d", q:"For CI 2, is it true that nothing about it is verified? Explain."},
     {id:"e", q:"For one of these five you do not have enough information to settle the disposition. Identify it, say what fact is missing, and name who you would ask."},
     {id:"f", q:"A colleague reads your assessment and says \u201cso anything that is a CI gets audited.\u201d Correct them using these five, and say what each of the two selections actually decides."}
   ]},

  {id:"A1-E5", title:"Exercise 5: Which audit would have caught it",
   scen:"Four defects reach a customer on different programs. (1) A unit meets every performance requirement, but an internal bracket is a different alloy from the one on the released drawing. (2) A software CI is built exactly to its released design, and in a rare combination of inputs it behaves in a way no requirement ever described. (3) A production unit differs from the unit used for functional verification in three respects, none of them recorded anywhere. (4) A unit matches its drawings, and the drawings themselves reference a superseded revision of an interface document.",
   parts:[
     {id:"a", q:"For each defect, say which audit is the one designed to catch it, and why the other would not."},
     {id:"b", q:"Two of these four are the same failure wearing different clothes. Which two, and what is the shared failure?"},
     {id:"c", q:"For defect 3, name the specific audit requirement that exists because of this pattern, and the documented program that anchors it."},
     {id:"d", q:"For defect 2, someone argues the functional audit could not have caught it because no requirement covered the behavior. Is that a defense or a finding?"},
     {id:"e", q:"Choose the defect you consider most likely to recur at this organization, and justify the choice using what you have been taught about why these audits are mandatory for safety."}
   ]},

  {id:"A1-E6", title:"Exercise 6: Assessing with the evidence you do not have",
   scen:"You are asked to complete audit designation assessments for three CIs by Friday. For the first, nobody can tell you whether it hosts a hazard risk control; the hazard log was revised last month and the revision has not been distributed. For the second, the design is described as heritage, but the heritage claim rests on a similar CI flown in a different thermal environment. For the third, the assessor has answered no to escape history on the basis that nothing has been raised with them, and no to reconciliation health because they do not have access to the indicators.",
   parts:[
     {id:"a", q:"For each of the three, say what the honest state of the answer is right now and what it is not."},
     {id:"b", q:"For each unresolved answer, name where it comes from and who holds it."},
     {id:"c", q:"Friday arrives and two answers are still outstanding. What do you do, and what do you refuse to do?"},
     {id:"d", q:"Take the heritage claim apart. What would have to be true for it to answer the question it is being used to answer?"},
     {id:"e", q:"The third assessor's two answers are both no. Explain, to someone who thinks you are being pedantic, why those two answers are worse than a yes would be."},
     {id:"f", q:"One of these three could be signed today with an honest disposition. Which, and what would the disposition say?"}
   ]},

  {id:"A1-E7", title:"Exercise 7: Scope, not just yes or no",
   scen:"A structural actuator is named in the statement of work as requiring a functional audit. Working the rest of the assessment you establish: it hosts a hazard risk control; its last audit was two years ago and closed with an open delta covering three requirements; a new sub-tier now supplies its bearings; the production line has a foreign-object finding from last quarter; and reconciliation indicators show an unincorporated-change backlog against it. The program reads the statement of work, notes that a functional audit is already planned, and considers the assessment closed.",
   parts:[
     {id:"a", q:"State everything wrong with treating the contract designation as the end of the assessment here."},
     {id:"b", q:"Work the full disposition. Name every audit or audit scope you would record, and the factor that produced each."},
     {id:"c", q:"An open delta from the previous audit is sitting in this assessment. What does it contribute, and what would you expect to have happened to it before now?"},
     {id:"d", q:"Who signs this assessment, and why is that set of signatures different from an assessment where every safety answer was no?"},
     {id:"e", q:"The program argues that expanding scope beyond the contract creates unfunded work. Answer that, and say what the correct route is if the expansion genuinely cannot be resourced."},
     {id:"f", q:"Six months later the bearing supplier is replaced again. What happens, and what is the shortest honest answer to \u201cwe just did this\u201d?"}
   ]}

 ]
},
{
 id:"A2", label:"Module 2", title:"Preparing for the audit",
 sub:"Planning, entry criteria, data packages, and the joint punch list.",
 sections:[

  {id:"A2-01", title:"Audit planning", body:[
    P("An audit is a scheduled event with a documented plan, agreed in advance with the Acquirer. The plan and agenda are prepared by configuration management and approved by the Acquirer, and they cover:"),
    L([
      "**Scope**, drawn from the contract, the statement of work and the specifications.",
      "**The CIs to be audited**, with their nomenclature, specification numbers and CI identifiers.",
      "**Location, dates and duration.**",
      "**The co-chairs**. One from each side.",
      "**Audit team composition, and each member's function.** Not a list of names: a list of names with what each person is there to do.",
      "**The documentation to be reviewed.**",
      "**A chronological schedule** of the proceedings.",
      "**Administrative and security requirements**. Site access, clearances, visit requests, network and projection needs."
    ]),
    P("Two scheduling rules have teeth."),
    STEPS([
      {h:"Hold the planning conference far enough ahead",b:"Normally thirty to sixty days, and the reason is symmetrical: **both** parties have to prepare. A planning conference held three weeks out produces an agenda that only one side has had time to resource."},
      {h:"Confirm the schedule against actual availability",b:"The audit date must be confirmed compatible with the real availability of the information and the contract articles. Released documentation, product specifications, quality records, manuals, drawings, reports, the hardware itself, and for software the interface and version documentation. An audit date set without that confirmation is a date that will move."}
    ]),
    P("The organization commits to providing specific things. These are the ones people forget to resource: the plan and agenda; conference facilities; all variances against the CI with their current status; the minutes of prior audits; and personnel from engineering, manufacturing and quality who can discuss the technical detail of what is presented."),
    C("Lead times are a constraint, not a preference",[
      "Entry criteria are typically worked from forty-five to sixty days before the audit date.",
      "Data package CIs are typically due around twenty-one days out.",
      "Logistics, facilities, clearances, staging, the scribe, sit inside the final two weeks.",
      "Work backwards from the audit date, not forwards from today. A CI with a sixty-day lead that surfaces at forty days is already late, and no amount of effort recovers it."
    ]),
    S("An audit date agreed without confirming that the evidence and the hardware will exist on that date is a placeholder, not a plan.",
      "The date will move. The only question is how late you find out.")
  ], check:{
    q:"An audit date is agreed with the Acquirer at a planning conference held five weeks out. Nobody has checked whether the released documentation, the quality records and the hardware will actually be available on that date. What is the defect here?",
    o:["The schedule was never confirmed against the actual availability of evidence and articles",
       "The planning conference was held too late. Sixty days is the minimum notice for an audit date",
       "The agenda has not yet been approved by the Acquirer's co-chair",
       "Nothing is wrong yet, because availability is confirmed later during the data package review"],
    a:0,
    why:"Five weeks sits inside the normal thirty-to-sixty day window, so the timing of the conference is not the fault, which is what makes the timing answer tempting. The missing step is the confirmation that the evidence and the articles will exist when the audit convenes. Skipping it is how a date gets agreed by two willing parties and then moves twice."
  }},

  {id:"A2-02", title:"Entry criteria: the functional audit", body:[
    P("Entry criteria are the conditions that must be satisfied before the audit convenes. They are not aspirations. For the functional audit there are seven."),
    STEPS([
      {h:"Baselines approved",b:"The functional and allocated documentation for the CI or system must be approved by the Acquirer. Without that, the audit has no fixed reference to verify against."},
      {h:"Designation confirmed and recorded",b:"The assessment that designated this CI for audit exists, is current, and is referenced. If the CI was designated for audit three years ago and never reassessed, the scope of what you are about to audit may be wrong."},
      {h:"Requirements Allocation Matrix approved and available",b:"The approved matrix for the CI, with the traceability matrix reconciled against it and every allocated requirement accounted for. This is the criterion the whole audit rests on. Without the matrix there is no agreed statement of which requirements the CI is accountable for, so there is nothing for the traceability matrix to be reconciled against."},
      {h:"Plan and agenda approved",b:"Approved by the Acquirer, with the audit team and the facilities confirmed."},
      {h:"Final draft product specification provided",b:"Provided to the Acquirer before the audit, as contracted. The audit produces the verified performance basis on which that specification is later approved."},
      {h:"Pre-audit submittals delivered",b:"The item and task lists, and the requirements traceability matrix with its test cross-references and deficiency report numbers. Delivered before the audit, not tabled on the day."},
      {h:"Test data from the right configuration",b:"The test evidence must come from verification of **the configuration being formally accepted or released for production**. A prototype or preproduction article, or the first production article if there is no other."}
    ]),
    P("Two of these deserve a second look. The second criterion is the one people treat as a formality, and it is not. Designation is reassessed at every plan revision and on any trigger event, so the assessment that put this CI on the audit list may be years old. Confirm it at entry. That is how you find out the CI has since acquired a hazard risk control, or moved its manufacturing source. Without that check you run an audit scoped to a CI that no longer exists in that form."),
    C("Why the last one carries so much weight",[
      "Test evidence from a superseded configuration proves something true about an article that is not the article being accepted.",
      "It is the easiest entry criterion to soften, because the data exists, it is real data, and someone worked hard to produce it. The reports look identical. Only the configuration they were run against is different.",
      "Where verification can only be completed after system integration and test, the final functional audit uses those results. That is the legitimate route, not reaching backwards for older data."
    ]),
    S("Test evidence from a superseded configuration proves nothing about the configuration being accepted.",
      "It is the most persuasive-looking wrong answer in the whole preparation set.")
  ], check:{
    q:"A test campaign was completed on an earlier build standard. Since then two approved changes have been incorporated, neither of which touches the tested functions. The program proposes to enter the functional audit using the earlier test reports. How do you answer?",
    o:["Accept it. The changes do not touch the tested functions, so the data still applies",
       "Accept it if the Acquirer agrees to it in writing before the audit convenes",
       "The criterion requires test data from the configuration being accepted, and this data is not it",
       "Reject it, because test data older than the current baseline is never usable at all"],
    a:2,
    why:"Accepting the earlier data is the reasonable-engineer answer, and that is exactly why it is dangerous: it substitutes a judgment about what the changes touched for evidence about the configuration being accepted. Rejecting all earlier data overcorrects. Earlier data is not worthless, and where verification genuinely completes only after integrated testing, those later results are used. What is not available is entering the audit as though the criterion were met."
  }},

  {id:"A2-03", title:"The functional audit data package", body:[
    P("The data package is what the audit reads. It is assembled and controlled by configuration management, and provided to the audit team before the audit rather than produced in the room."),
    TABLE(["Group","What it contains"],[
      ["Requirements","Specifications. Requirements, development, performance and interface. The requirements traceability matrix, and the verification cross-reference matrix aligned to it."],
      ["Verification evidence","Test plans, procedures and reports or results. Analyses. Demonstration records. Pre-production test results and qualification status."],
      ["The honest accounting","Three lists: tests accomplished; tests accomplished without recorded detail data; and tests not yet performed, each with the plan to accomplish it. Plus analyses or simulations standing in for requirements not fully verifiable by test."],
      ["Changes and variances","The current listing of every variance request, change proposal, specification change notice and revision notice against the CI, requested or approved. An account of which change proposals were incorporated, which were tested, and which are proposed. Variances applicable to the units used for the audit."],
      ["Software, where applicable","Database characteristics, storage allocation, timing and sequencing data against requirements. The software product documents. Product specification, user manual, version description. Developmental configuration change records. The library listing of every version held. Findings of internal configuration management and software quality audits."],
      ["Reviews and history","Preliminary and critical design review minutes with action item closure status. Minutes of previous lower-level audits with their open items. Supplier statement of work and purchase order where applicable, with quality and status accounting records."]
    ]),
    S("The three lists are the part people leave out, and they are the part that makes the package honest.",
      "Tests done, tests done without data, tests not done, with a plan for each of the last two."),
    C("What a missing accounting looks like in the room",[
      "A package arrives with a test report for every test that was performed. Nothing is missing on its face, because nothing that exists is absent.",
      "What is absent is the shape of what does not exist. The tests never run, and the tests run without recorded data. Those are the two categories an audit is specifically there to find, and they can only be found from a list that admits them."
    ])
  ], check:{
    q:"A functional audit package contains a test report for every test that was performed, all of them complete and signed. What is most likely still missing?",
    o:["The specifications themselves, which are usually assumed rather than provided in the package",
       "The design review minutes, which are optional for the functional audit",
       "Nothing at all. If every performed test is reported, then the verification evidence is complete",
       "The list of tests not yet performed, and the list of tests performed without recorded data"],
    a:3,
    why:"Calling the package complete is the trap, and it is a subtle one: reports on everything performed really can be complete, and still tell you nothing about what was never performed. The package is required to carry the shape of the gaps as well as the evidence of the work. Tests not yet done with a plan for each, and tests done without recorded data. Design review minutes are required too, so they are not optional."
  }},

  {id:"A2-04", title:"The requirements traceability matrix", body:[
    P("One artifact carries the functional audit, and it is worth a section of its own."),
    P("The traceability matrix cross-references **every requirement** to the test plan, the test procedure, the test program where automated equipment is used, and the test report that verifies it. Where a requirement is verified by analysis, inspection or demonstration rather than by test, that record is cross-referenced in place of the test. Each known deficiency is identified by its deficiency report number."),
    P("It is provided to the Acquirer before the audit, and it becomes part of the audit minutes."),
    C("Why it matters more than it looks",[
      "The matrix is what makes the audit checkable by someone who was not in the room. Without it, a functional audit is a series of conversations between people who already agree, and the record afterwards is a set of assertions.",
      "With it, anyone can pull a requirement at random two years later and walk the chain: requirement, plan, procedure, report, result.",
      "It is also mandatory for safety. Every requirement mapping to a test step that passed is one of the audit obligations that arrives through the safety management system, not only through the contract."
    ],"teal"),
    S("The traceability matrix is what converts an audit from a meeting into evidence.",
      "It is the one artifact a stranger can audit the audit with."),
    P("Two failure modes to recognize. The first is the blank cell: a requirement with no verification reference, left empty because it is verified by analysis and the column says test. The record for an analysis, inspection or demonstration goes in the cell. An empty cell reads as an unverified requirement, and at the audit it will be treated as one. The second is the matrix that maps requirements to *plans* but stops short of *results*: a chain that ends at intent rather than outcome verifies nothing.")
  ], check:{
    q:"In a traceability matrix, four requirements have blank verification cells. The engineer explains that those four are verified by analysis rather than by test, so there is no test reference to enter. What is the correct handling?",
    o:["Leave them blank and give the explanation verbally when the audit reaches them",
       "Enter the analysis records in the cells. A blank cell reads as an unverified requirement",
       "Remove those four requirements from the matrix, since the matrix cross-references tests",
       "Create test procedures for the four so the matrix can be completed consistently"],
    a:1,
    why:"The explanation is correct and the handling is wrong. Not every requirement is verified by test, and the matrix is built for that. The analysis, inspection or demonstration record occupies the cell. Leaving it blank with a verbal explanation defeats the entire purpose of an artifact designed to be readable by someone who was not present, and removing the requirements is worse: it hides them from the one document that is supposed to prove completeness."
  }},

  {id:"A2-05", title:"Entry criteria: the physical audit", body:[
    P("The physical audit has eight, and two of them are softened so routinely that they are worth learning as a pair."),
    STEPS([
      {h:"The functional audit complete or concurrent",b:"With its minutes available for the CI."},
      {h:"Designation confirmed and recorded",b:"As for the functional audit."},
      {h:"The reconciliation report available for this unit",b:"The as-designed to as-built reconciliation report for the specific unit being audited, including its non-conformance records and their dispositions. Not for the CI in general. For this unit."},
      {h:"The audit unit jointly selected with the Acquirer",b:"An early production-representative unit. Its serial numbers are identified, and the CI and its detail parts are isolated so they are available for examination rather than in a queue somewhere."},
      {h:"Plan and agenda approved",b:"With the audit team and facilities confirmed."},
      {h:"Unencumbered access arranged",b:"To inspection, fabrication, production, assembly and test areas, with the tools, inspection equipment and test software available."},
      {h:"Final draft detail specification available",b:"The product-level specification for the CI."},
      {h:"The audit unit's build records complete and closed",b:"Three conditions, and all three have to hold. No open work orders against the unit. No open non-conformance records, meaning every one has been dispositioned by the required authority. And no open dispositions, meaning every disposition has been carried out and verified. The third is the one people miss: a unit can show every non-conformance dispositioned and still have rework in the queue. Status accounting is what demonstrates all three, and it demonstrates them per unit, not for the CI in general."}
    ]),
    P("That last one follows directly from what the physical audit is for. An open work order is work still to be done to the article. An open non-conformance disposition is a decision still to be made about what the article *is*. While either is outstanding, the as-built configuration of the unit is not final. Any reconciliation drawn from it is provisional. The audit would be testing a comparison whose right-hand side can still move."),
    P("The word **isolated** in the third criterion is doing real work: the CI and its detail parts have to be available for examination on the day, with serial numbers identified in advance. That is a manufacturing action with its own lead time, not an administrative note. It does **not** mean the CI must be uninstalled. The audit may take place after the CI has been embodied in the aircraft, provided the CI is acceptable. Where it does, the access required extends to the installed CI and to the zone around it."),
    C("The two that get softened",[
      "**Joint selection.** If the Supplier chooses the unit alone, the Supplier has chosen the sample, and every conclusion drawn from it is a conclusion about a unit selected by the party being audited. The point is not suspicion; it is that a sample chosen by one side cannot support a joint finding.",
      "**Unencumbered access.** The frequent substitute is to bring parts and records to a conference room. That is a different audit. The physical audit reaches the floor deliberately. It examines the CI where it was built, with the instructions the builders actually used and the equipment they actually used."
    ]),
    S("A unit selected by the party being audited is not a sample. It is an exhibit.",
      "Joint selection is what makes the examination evidence about production rather than about one prepared article.")
  ], check:{
    q:"A supplier offers to have a completed unit ready in a conference room with its records, drawings and detail parts laid out, to save the audit team walking the line. They have picked a unit they know is clean. Which entry criteria has this arrangement failed?",
    o:["Joint selection of the audit unit, and unencumbered access to the fabrication and test areas",
       "None. The unit and its records are what the audit examines, and that can happen anywhere on site",
       "Only unencumbered access. A supplier may select the unit it presents",
       "Only joint selection of the audit unit. The location of the examination is a logistics matter"],
    a:0,
    why:"Both criteria have quietly gone. The unit was chosen by the party being audited, so it is an exhibit rather than a sample; and the examination has been moved off the floor, which removes the ability to see the instructions, the tooling and the process that produced it. Each softening sounds helpful on its own, which is precisely how both arrive together."
  }},

  {id:"A2-06", title:"The physical audit data package", body:[
    P("The physical audit package is heavier than the functional one, because it has to describe a specific unit as well as a design."),
    TABLE(["Group","What it contains"],[
      ["Design definition","Drawings and model data, parts lists and associated lists, and the drawing index with revision letters."],
      ["Manufacture","Manufacturing instruction sheets, work instructions, installation procedures and machine data for the parts the Acquirer identifies. The agreed drawing and instruction sample, selected per the approved plan."],
      ["Parts control","The approved parts selection list, and the approved nomenclature and nameplates. With it: the approval, clearance and qualification records for the part types installed, and the material and process certifications for the heat and lot numbers in the unit."],
      ["Acceptance evidence","The production acceptance test procedures and the associated test data for the audit unit."],
      ["Reconciliation","The as-designed to as-built reconciliation report for the audit unit, including its non-conformance records and their dispositions. This is the primary input to the physical audit. The audit does not perform the reconciliation. It verifies that the reconciliation already performed at scale produced the right answer for this unit."],
      ["Part traceability","For the audit unit: serial and lot records, life-limited designations with their limits and life consumed, safety-critical and special-handling designations, and traceability to the next higher assembly."],
      ["Changes and variances","Approved and outstanding changes; changes made during test; required changes not completed; shortage lists; the review of undocumented design changes; variances applicable to this unit."],
      ["Unit differences","Identification of the differences between the physical audit unit and the unit or units used at the functional audit, **with the certification basis that those differences do not degrade functional characteristics**."],
      ["Quality and support","Quality program findings and status, first article results, and the operation and support manuals. With them: confirmation that inspection and test of sub-supplier end items was completed at point of manufacture, and the release records for any spares or repair parts provisioned before the audit."],
      ["Software, where applicable","Source code with the released configuration documentation to compare it against; the version description including compiler, compiler version and settings; the interface documentation; the build environment staged in advance so that a build can actually be produced during the audit; and for commercial software, documentation matching the delivered versions with media identification and marking."]
    ]),
    P("The part traceability row repays attention. For a life-limited part it carries more than the identity of the part. It carries the limit and the life already consumed. A life-limited part with no consumed-life record cannot be scheduled for removal. That is true from the day it is installed. The same row carries the safety-critical and special-handling designations. It also carries the traceability upward to the next higher assembly. That is what makes a fleet-wide question answerable later: where else did parts from this lot go?"),
    S("The unit-difference identification is the row people skip, and it is the one anchored in a documented program failure.",
      "Development article and production article are not the same article until someone has written down how they differ and why it does not matter.")
  ], check:{
    q:"The physical audit unit is a production article. The functional audit was performed on a preproduction article. The program's position is that both were built to the same drawings, so no comparison is needed. What does the data package require?",
    o:["Nothing further, provided both articles were built to the same released drawings at the same revision",
       "A repeat of the functional audit on the production article before delivery",
       "Identification of the differences, and certification that they do not degrade function",
       "A variance covering the use of a preproduction article at the functional audit"],
    a:2,
    why:"Built to the same drawings is a claim about intent, not about articles. Tooling, process, source and workmanship all differ between a preproduction and a production build even when the drawings do not. The requirement is not to re-run the functional audit, which would be disproportionate; it is to identify the differences and certify that they do not degrade functional characteristics, so the functional conclusion can be transferred to the production article honestly."
  }},

  {id:"A2-07", title:"Preparation as a joint punch list", body:[
    P("Preparation is tracked on a working document with one row per required input. Each row is an entry criterion, a pre-audit submittal, or a data package CI, and each carries:"),
    L([
      "**A provider**. A named function, not \u201cthe program.\u201d",
      "**A due date**, derived by working backwards from the audit date using that CI's lead time.",
      "**A status.**",
      "**A location reference**. Document number, system link, or where the physical thing is, so that the audit team can find it rather than ask for it again."
    ]),
    P("Readiness is computed from status rather than judged. That matters more than it sounds: a percentage that someone calculates from rows is a fact, and a readiness that someone declares in a meeting is an opinion."),
    C("Rows that do not apply are marked, not deleted",[
      "Software rows on a hardware-only CI. Supplier rows where the supplier has no role in this audit.",
      "Mark them as not applicable and **keep them.** The record then shows that the CI was considered and ruled out, which is a different statement from the CI never having been on the list.",
      "Deleted rows are indistinguishable from rows nobody thought of."
    ]),
    P("The rule that governs the whole document is short: **all entry criteria complete before the audit convenes.** Data package CIs arriving late are a problem to manage. An entry criterion open on the day is a different kind of event. It means a precondition of the audit is not satisfied, and the correct response is a conversation about the schedule, not a footnote in the minutes."),
    P("Where a supplier conducts or supports the audit, the same tracker is shared with them as the joint punch list. Two organizations working from one list is the difference between coordinated preparation and two parallel guesses."),
    S("Readiness is computed from rows, not declared in a meeting.",
      "And an entry criterion open on the audit date is a schedule conversation, not a footnote.")
  ], check:{
    q:"Three days before a physical audit, the tracker shows every data package row complete. Status accounting reports that the audit unit still carries two open work orders and one non-conformance record awaiting disposition. The program proposes to convene as planned and close all three during the audit week. What is the correct handling?",
    o:["Treat it as a schedule conversation. Until the build records close, the as-built is not final",
       "Proceed. Closing them during the audit week means they close before the audit ends",
       "Proceed, and record the three open items in the minutes as constraints on the examination",
       "Mark the rows not applicable, since the work is in hand and will complete"],
    a:0,
    why:"Closing them during the week sounds efficient and is the answer most people give, but it means the article changes while it is being examined, and every reconciliation drawn from it before the closures is provisional. Recording them as constraints converts an unmet precondition into a note. The not-applicable status is for rows that genuinely do not apply, never for rows that apply and are not ready."
  }},

  {id:"A2-08", title:"What both audits require, whoever is running them", body:[
    P("A set of obligations applies to both audits and to every party running one. They are easy to lose in the gap between the two audit types, so learn them as a group."),
    L([
      "**Designate a co-chair** who runs proceedings jointly with the Acquirer's co-chair, gives the opening briefing, folds the conclusions of side meetings back into the official record, and delivers the management out-brief.",
      "**Provide the current listing** of every variance, change proposal, specification change notice and revision notice against the CI. Requested as well as approved.",
      "**Record significant questions and answers, action items, conclusions and recommended courses of action** in official minutes.",
      "**Ensure the people in the room can discuss technical detail**. Engineering, manufacturing and quality personnel who know the material, rather than presenters reading from it.",
      "**Verify that approved engineering changes and variance corrective actions were actually implemented**, confirming that the product and its configuration information still agree."
    ]),
    P("The last of those five is the one people read past. Approved changes and variance corrective actions are **verified as actually implemented**, not confirmed as approved, not confirmed as scheduled. An approved change that was never incorporated leaves the product and its configuration information disagreeing, and both sides of that disagreement look correct on their own paperwork. Checking implementation is how the disagreement becomes visible."),
    P("Then the minutes discipline during the audit, which is more demanding than most people expect. **Daily minutes are made available for joint review at the start of the next session, and the overall audit minutes are available to the Acquirer before the audit team departs.** Not a fortnight later."),
    P("Those two obligations sit alongside a third, later one: the **finalized** minutes are published and delivered no later than sixty days from completion of the audit, or per contract. The sixty-day rule governs the finished document. It does not govern the record made during the audit, and it is routinely quoted as though it did."),
    S("A finding that was obvious to everyone on the day becomes contested a week later. The same-day record is what stops that.",
      "Daily minutes reviewed jointly at the start of the next session; overall minutes before the team leaves the site."),
    C("Sub-suppliers whose CIs are being audited",[
      "They participate in planning as well as conduct, not just on the day.",
      "They prepare audit plans identifying their own requirements and responsibilities.",
      "They field personnel who can discuss the technical detail of what is presented. A supplier who sends people to read slides has not met the obligation, whatever the slides say."
    ])
  ], check:{
    q:"An audit runs for four days. The Supplier's team proposes to consolidate all the minutes afterwards and issue them within two weeks, so that the audit days themselves are not slowed by note-taking. What is wrong with that?",
    o:["Nothing, provided the two-week deadline is met and the minutes are complete when issued",
       "Nothing, provided the Acquirer's co-chair agrees to the arrangement",
       "Daily minutes must be reviewed jointly at the next session",
       "The minutes must be issued within sixty days, so two weeks is acceptable"],
    a:2,
    why:"The final publication deadline is a real and separate obligation, which is what makes the sixty-day answer persuasive, but it governs the finalized minutes, not the record during the audit. The daily discipline exists because memory diverges fast: a finding both sides accepted on Tuesday becomes two accounts by the following week, and there is nothing to arbitrate between them."
  }}

 ],
 exercises:[

  {id:"A2-E1", title:"Exercise 1: Building the preparation tracker",
   scen:"A CI designated for audit is a hardware assembly containing an embedded firmware load. Both audits are required and will be held eleven weeks from today at your facility. The functional audit unit will be a preproduction article; the physical audit unit has not yet been chosen. The firmware is developed by a supplier who will attend. Qualification testing is complete for all but the thermal requirements, which will be verified during integrated system testing in nine weeks.",
   parts:[
     {id:"a", q:"List the entry criteria for both audits and give each one a provider and a due date derived from the audit date. Say what you used to derive each date."},
     {id:"b", q:"Which rows on this tracker are not applicable, and how do you handle them? Explain what would be lost by handling them the other way."},
     {id:"c", q:"The thermal requirements will not be verified until nine weeks from now, two weeks before the audit. What does that mean for the functional audit, and what do you plan for now rather than later?"},
     {id:"d", q:"The physical audit unit has not been chosen. Who chooses it, when does that need to happen relative to the audit date, and what makes a choice acceptable?"},
     {id:"e", q:"The firmware supplier will attend. What of theirs goes on the tracker, and what do you need them to have staged before the audit week?"},
     {id:"f", q:"Two weeks out, readiness stands at ninety percent, with the shortfall entirely in data package rows. Two weeks later, readiness is ninety-five percent, with the shortfall entirely in entry criteria rows. Which situation is worse, and why?"},
     {id:"g", q:"What has to be true of the audit unit's build records before the audit convenes, who demonstrates it, and what would you do if that evidence arrived showing one non-conformance still open?"}
   ]},

  {id:"A2-E2", title:"Exercise 2: Readiness on the day",
   scen:"A combined functional and physical audit convenes on Monday. On Friday afternoon the tracker showed: all data package rows complete except the operation and support manuals; entry criteria complete except unencumbered access to the test area, which is under a facility reorganization, and the final draft detail specification, which is in review with an expected release on Tuesday. The Acquirer's team has already booked travel. The program proposes to start Monday and pick up the two open criteria as they land.",
   parts:[
     {id:"a", q:"Separate the three open items into the ones that are a management problem and the ones that are a precondition problem, and justify the split."},
     {id:"b", q:"What is the correct conversation to have on Friday afternoon, and with whom?"},
     {id:"c", q:"The Acquirer's travel is booked. How much weight does that carry in the decision, and why?"},
     {id:"d", q:"Suppose the audit proceeds anyway and the specification releases on Tuesday as expected. What is left wrong, even though nothing went visibly wrong?"},
     {id:"e", q:"This was a combined event. What does the combination assume about readiness, and does this situation meet that assumption?"},
     {id:"f", q:"Working backwards, at what point should each of these three CIs have been visible as at risk, and what would have made it visible?"}
   ]},

  {id:"A2-E3", title:"Exercise 3: An audit on an embodied CI",
   scen:"A CI designated for audit has been installed into the aircraft. Its work orders are closed and its non-conformance records are dispositioned and closed. The physical audit is six weeks away. The program assumes the audit cannot now proceed because the CI is no longer available as a standalone article, and proposes either to remove it for the audit or to defer the audit until the next unit is built.",
   parts:[
     {id:"a", q:"Is the program right that the audit cannot proceed? Answer precisely, using what the entry criteria actually require."},
     {id:"b", q:"Removing the CI for the audit is one of the two proposals. What does that do to the thing the audit is trying to establish?"},
     {id:"c", q:"What access has to be arranged for an audit on an embodied CI, and how is that different from an audit on a unit in final assembly?"},
     {id:"d", q:"One check applies to this audit specifically because the CI is embodied. Name it and say what would be recorded if the CI were not embodied."},
     {id:"e", q:"The build records are closed. Why does that matter more than whether the CI is installed?"},
     {id:"f", q:"Deferring to the next unit is the second proposal. What would that cost, and what would you have to check before it could even be considered?"}
   ]}

 ]
},
{
 id:"A3", label:"Module 3", title:"The functional audit",
 sub:"Reading the evidence, conducting the audit, and the twenty checks.",
 sections:[

{id:"A3-01", title:"How to read a test plan and a test procedure", body:[
    P("The functional audit compares documents. Four sections cover the ones you will be handed. This is the first pair, and people confuse them constantly."),
    TABLE(["","Test plan","Test procedure"],[
      ["Answers","What will be verified, by what approach, and against which requirements","How to run one verification, step by step"],
      ["Written for","The program","The person at the bench"],
      ["Names requirements","Yes. This is where the coverage argument lives","Sometimes. Often only by reference"],
      ["Carries pass criteria","In general terms","In exact terms, with values and tolerances"],
      ["Audit use","Coverage: is every requirement claimed by something","Repeatability: could someone else get this result"]
    ]),
    P("A test procedure has to be runnable by someone who did not write it. That is the test to apply when you read one. Setup and configuration under test. Equipment, with calibration status. The steps in order. The values expected, with tolerances. What to record. What counts as a pass."),
    C("The three defects you will meet most",[
      "**No configuration named.** The procedure says what to do and never says to what. The result then belongs to no version.",
      "**A pass criterion written as a judgment.** Verify performance is acceptable is not a criterion. It is an invitation to agree afterward.",
      "**Equipment with no calibration reference.** The measurement may be right. Nobody can show that it was."
    ]),
    P("Some programs let the procedure stand in for the plan, and the standards allow it. Where that is the arrangement, the configuration management plan says so, and the coverage argument has to live somewhere else, usually in the traceability matrix. Find out which arrangement you are auditing before you call a missing plan a finding."),
    S("Read the plan for coverage. Read the procedure for repeatability.",
      "A program can have excellent procedures and still have verified nothing, if no document claims which requirements they close.")
  ], check:{
    q:"A test procedure gives exact steps, exact expected values with tolerances, and a clear pass criterion. It does not name the configuration under test. The report says the test passed. What is the audit position?",
    o:["Pass. The procedure is repeatable and its criteria are exact",
       "Pass, provided the test report names the configuration tested",
       "A finding. No configuration named means no tie to the CI",
       "A finding against the test plan rather than against the test procedure itself"],
    a:2,
    why:"Repeatability is necessary and it is not sufficient. A result that names no configuration cannot be connected to the CI being accepted, which is what check 5, test configuration provenance, asks. If the report happens to name a configuration, that helps, and it still leaves the procedure able to be re-run against anything. The finding belongs where the defect is, which is the procedure."
  }},

{id:"A3-02", title:"How to read a test report", body:[
    P("The test report is the end of the chain and the document you will spend the most time in. Read it in this order."),
    STEPS([
      {h:"What was tested",b:"The CI, and the configuration: part number and revision, software version, serial number where one applies. If the report does not say, the result belongs to no version of anything."},
      {h:"Against what",b:"The procedure, by number and revision. A report that references a procedure revision that has since changed tells you the test may not be the test you think it was."},
      {h:"Which requirement it closes",b:"Named, by requirement identifier. This is the single most common omission in the whole functional audit."},
      {h:"What was recorded",b:"The data, or an explicit statement that detailed data were not recorded. Both are legitimate. Silence on the point is not."},
      {h:"What the result was",b:"Pass or fail against the stated criterion, not against a later opinion of whether the value was acceptable."},
      {h:"What was left open",b:"Deviations run during the test, steps not completed, anomalies observed and dispositioned. Each needs a deficiency report number if it affects a requirement."}
    ]),
    C("A report that records a pass and names no requirement",[
      "The test ran. The data is real. The engineering is probably fine.",
      "And the audit cannot record check 3, the documentation flow, as pass against it, because nothing connects the result to a requirement.",
      "This is not a technicality. In two years, when the requirement is challenged, the report will not be findable by anyone searching on the requirement, and nobody will remember."
    ], "amber"),
    P("**Watch for the retest that is not labeled as one.** A report covering a second run, after a first run failed, should say so and should reference the first. A clean report with no history reads as a first-time pass. The failure that preceded it is the more interesting fact."),
    S("A test report answers what, against what, for which requirement, with what recorded, and what was left open.",
      "Five questions. A report missing any of them is a finding against check 3, the documentation flow, whatever the data says.")
  ], check:{
    q:"A test report names the CI, the procedure and the requirement, and records a clean pass. In the anomalies section it notes that step 14 was run out of sequence at the operator's discretion, with no further comment. Is this a finding?",
    o:["Yes. A step run outside the procedure means the procedure was not the one executed",
       "No. The test passed, and the operator recorded the departure honestly",
       "No, provided the operator was qualified for the operation",
       "Yes, but against the procedure rather than against the report"],
    a:0,
    why:"Recording an anomaly is better than hiding one, and recording it is not the same as dispositioning it. A step run out of sequence means the test executed was not the test the procedure describes, so the result is against an undocumented procedure. Somebody with the authority to accept that has to say so, in writing, against that requirement. Operator qualification is not the question, and the defect is in what the report leaves unresolved."
  }},

{id:"A3-03", title:"How to read an analysis, inspection or demonstration record", body:[
    P("Not everything is testable. Structural margins, reliability predictions, maintainability, and most requirements about conditions you cannot create on demand are closed by analysis, inspection or demonstration. Check 9, analyses, inspections and demonstrations, covers all three, and each fails differently."),
    TABLE(["Method","What it produces","Where it breaks"],[
      ["Analysis","A calculation or model that predicts the CI meets the requirement","Assumptions and inputs. An analysis run against last year\u2019s design closes nothing about this year\u2019s CI"],
      ["Inspection","An examination confirming a characteristic is present and correct","What was inspected, by whom, against which drawing revision. Inspection records are often the thinnest evidence in the package"],
      ["Demonstration","An observed performance of a function under stated conditions","Who observed it, under what conditions, and against which requirement. A demonstration nobody recorded is a meeting"]
    ]),
    P("**Analysis is where most of the risk is, and it is not because analysis is weak.** It is because an analysis carries its assumptions inside it, and the assumptions are the part that goes stale. The CI changes. The loads change. The duty cycle changes. The analysis does not, because nothing tells it to."),
    C("What to check on an analysis record",[
      "The requirement it closes, named.",
      "The configuration it was run against: part number and revision, or software version.",
      "The assumptions, stated rather than implied.",
      "The inputs, and where each one came from.",
      "The date, against the date of the last approved change affecting the CI.",
      "The signature of someone with the authority to accept it."
    ]),
    S("An analysis closing a requirement on a configuration it was never run against is a finding that reads as a pass.",
      "The only way to see it is to compare two dates."),
    P("Demonstrations produce the weakest records of the three, and they produce them for a predictable reason. A demonstration is a live event, and live events feel self-evident to the people in the room. Six months later the record says the function was demonstrated, and nobody can say under what conditions, against which requirement, or who accepted it.")
  ], check:{
    q:"A structural margin requirement is closed by analysis. The analysis is thorough, signed, and names the requirement. It was run against the configuration at critical design review. Two approved changes have since modified the fitting the analysis covers. What do check 9, analyses, inspections and demonstrations, and check 10, engineering changes incorporated and tested, require?",
    o:["Nothing further. The analysis is thorough, signed, and names the requirement it closes",
       "A new test to replace the analysis for that requirement",
       "A variance covering the difference between the configuration analyzed and the current one",
       "Re-analysis against the current configuration, or a rationale that it still holds"],
    a:3,
    why:"This is the case check 9, analyses, inspections and demonstrations, and check 10, engineering changes incorporated and tested, both reach. The analysis is good work against a configuration the CI no longer has. Either it is re-run, or somebody records why the change does not affect the result. Both are legitimate and a signature on the old analysis is not. Replacing analysis with test is not required, and a variance is for a departure agreed in advance rather than for evidence that has gone stale."
  }},

{id:"A3-04", title:"How to read a deficiency report and a variance listing", body:[
