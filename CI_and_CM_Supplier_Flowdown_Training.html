<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configuration Item and CM Supplier Flowdown Training</title>
<style>
:root{
  --ink:#1E262E; --ink-2:#2C3841; --slate:#5C6D78; --mute:#8998A2;
  --paper:#FFFFFF; --surface:#F4F6F7; --surface-2:#EDF0F1; --rule:#D6DCDF;
  --rust:#A8481F; --rust-soft:#F2E4DD; --rust-ink:#7E340F;
  --teal:#1F5F5B; --teal-soft:#DFEAE8;
  --amber:#9A6508; --amber-soft:#F6ECD8;
  --alert:#8E2F2F; --alert-soft:#F4E2E2;
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --rail:290px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--surface);
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- header ---------- */
.top{
  position:sticky; top:0; z-index:40; background:var(--ink); color:#fff;
  display:flex; align-items:center; gap:16px; padding:0 20px; height:60px;
  border-bottom:1px solid #000;
}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#93A2AB}
.top .spacer{flex:1}
.who{display:flex;align-items:center;gap:8px}
.who label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#93A2AB}
.who input{
  background:#2C3841;border:1px solid #3D4B55;color:#fff;border-radius:4px;
  padding:6px 10px;font-size:13px;width:180px;
}
.who input:focus{outline:2px solid var(--rust);outline-offset:1px}
.tbtn{
  background:transparent;border:1px solid #46545F;color:#DCE3E7;border-radius:4px;
  padding:7px 12px;font-size:12.5px;white-space:nowrap;
}
.tbtn:hover{background:#2C3841;border-color:#5E6D77}
.tbtn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.railtoggle{display:none}

/* ---------- shell ---------- */
.shell{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto}
.rail{
  width:var(--rail); flex:0 0 var(--rail); background:var(--paper);
  border-right:1px solid var(--rule); min-height:calc(100vh - 60px);
  position:sticky; top:60px; max-height:calc(100vh - 60px); overflow-y:auto;
}
.railhead{padding:18px 20px 12px;border-bottom:1px solid var(--rule)}
.railhead h2{margin:0 0 3px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);font-weight:700}
.railhead p{margin:0;font-size:12px;color:var(--slate)}
.grp{padding:14px 0 6px}
.grp h3{
  margin:0 0 6px;padding:0 20px;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--slate);font-weight:700;
}
.nav{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;
  padding:7px 20px 7px 17px;display:flex;gap:10px;align-items:flex-start;line-height:1.35}
.nav:hover{background:var(--surface)}
.nav:focus-visible{outline:2px solid var(--rust);outline-offset:-2px}
.nav[aria-current="true"]{background:var(--surface-2);border-left-color:var(--rust)}
.nav .id{font-family:var(--mono);font-size:10.5px;color:var(--mute);flex:0 0 46px;padding-top:2px;letter-spacing:.02em}
.nav[aria-current="true"] .id{color:var(--rust-ink)}
.nav .nm{font-size:13px;color:var(--ink-2);flex:1}
.nav[aria-current="true"] .nm{font-weight:600}
.dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:5px;border:1.5px solid var(--rule);background:transparent}
.dot.work{border-color:var(--amber);background:var(--amber-soft)}
.dot.done{border-color:var(--teal);background:var(--teal)}

/* ---------- main ---------- */
main{flex:1;min-width:0;padding:0 0 80px}
.stage{max-width:820px;margin:0 auto;padding:34px 32px 0}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.recid{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--rust-ink);background:var(--rust-soft);
  padding:3px 8px;border-radius:3px;font-weight:700}
.status{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
h1.sect{font-family:var(--serif);font-size:31px;line-height:1.2;margin:0 0 6px;letter-spacing:-.2px}
.lede{font-size:15px;color:var(--slate);margin:0 0 22px}
.hr{height:1px;background:var(--rule);margin:0 0 26px}
p{margin:0 0 14px}
strong{font-weight:700}
ul.pl{margin:0 0 16px;padding-left:0;list-style:none}
ul.pl li{position:relative;padding-left:20px;margin-bottom:9px}
ul.pl li::before{content:"";position:absolute;left:3px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--rust)}

.callout{background:var(--surface);border-radius:6px;padding:16px 18px;margin:0 0 20px;border:1px solid var(--rule)}
.callout.teal{background:var(--teal-soft);border-color:#CBDDDA}
.callout .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:7px}
.callout.teal .lab{color:var(--teal)}
.callout p:last-child{margin-bottom:0}

.stmt{background:var(--ink);color:#fff;border-radius:6px;padding:20px 22px;margin:0 0 20px}
.stmt b{display:block;font-family:var(--serif);font-size:19px;line-height:1.35;font-weight:700}
.stmt span{display:block;margin-top:9px;font-size:13.5px;color:#B4C0C7}

.cards{display:grid;gap:12px;margin:0 0 20px}
.cards.c2{grid-template-columns:1fr 1fr}
.cards.c3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.card h4{margin:0 0 6px;font-size:14px;font-weight:700}
.card p{margin:0;font-size:13.5px;color:var(--ink-2)}

.steps{margin:0 0 20px;display:grid;gap:8px}
.step{display:flex;gap:12px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:11px 14px}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--rust);color:#fff;
  font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step.tl .n{background:var(--teal)}
.step .tx b{display:block;font-size:14px;margin-bottom:2px}
.step .tx span{font-size:13.5px;color:var(--ink-2)}

.tw{overflow-x:auto;margin:0 0 20px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
thead th{background:var(--ink);color:#fff;text-align:left;padding:9px 12px;font-size:12px;font-weight:700;letter-spacing:.02em}
tbody td{padding:9px 12px;border-top:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
tbody tr:nth-child(even) td{background:#FAFBFB}
td.k{font-family:var(--mono);font-size:12px;color:var(--rust-ink);white-space:nowrap}

/* ---------- knowledge check ---------- */
.check{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--rust);border-radius:6px;padding:18px 20px;margin:26px 0 0}
.check .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:8px}
.check .q{font-size:15.5px;font-weight:600;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--rule);border-radius:5px;margin-bottom:7px;cursor:pointer;background:var(--paper);font-size:14px}
.opt:hover{background:var(--surface)}
.opt input{margin:3px 0 0;accent-color:var(--rust);flex:0 0 auto}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt.wrong{border-color:var(--alert);background:var(--alert-soft)}
.opt.locked{cursor:default}
.fb{margin-top:11px;padding:12px 14px;border-radius:5px;font-size:14px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--teal-soft);border:1px solid #CBDDDA}
.fb.no{background:var(--alert-soft);border:1px solid #E8CFCF}
.fb b{display:block;margin-bottom:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.fb.ok b{color:var(--teal)} .fb.no b{color:var(--alert)}

/* ---------- exercises ---------- */
.exwrap{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;margin:0 0 18px}
.exwrap h4{margin:0 0 8px;font-family:var(--serif);font-size:18px}
.scen{background:var(--surface);border-radius:5px;padding:13px 15px;font-size:14px;margin-bottom:16px}
.part{margin-bottom:16px}
.part label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
textarea{width:100%;border:1px solid var(--rule);border-radius:5px;padding:10px 12px;font-size:14px;
  line-height:1.55;resize:vertical;min-height:76px;background:var(--paper)}
textarea:focus{outline:2px solid var(--rust);outline-offset:0;border-color:var(--rust)}
.count{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:4px;text-align:right}

/* ---------- buttons / footer nav ---------- */
.pager{display:flex;justify-content:space-between;gap:12px;margin:32px 0 0;padding-top:22px;border-top:1px solid var(--rule)}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:5px;padding:10px 18px;font-size:14px;font-weight:600}
.btn:hover{background:var(--surface)}
.btn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.btn.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.pri:hover{background:var(--rust-ink)}
.btn.gh{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}

/* ---------- start + submit ---------- */
.hero{background:var(--ink);color:#fff;border-radius:8px;padding:34px 34px 30px;margin-bottom:26px}
.hero .kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust-soft);margin-bottom:12px}
.hero h1{font-family:var(--serif);font-size:35px;line-height:1.15;margin:0 0 12px}
.hero p{color:#B4C0C7;margin:0;font-size:15px;max-width:60ch}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 22px;font-size:14px}
.meta dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);padding-top:3px}
.meta dd{margin:0}
.transmit{border:1px solid var(--rule);border-radius:6px;background:var(--paper);overflow:hidden;margin-bottom:22px}
.transmit .hd{background:var(--surface-2);padding:12px 18px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.transmit .hd b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.transmit .hd span{font-family:var(--mono);font-size:11px;color:var(--slate)}
.transmit .bd{padding:18px}
.scorebox{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.scorebox .big{font-family:var(--serif);font-size:42px;font-weight:700;line-height:1}
.scorebox .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate)}
.gaps{margin-top:14px}
.gaps li{font-size:13.5px}
.note{font-size:13px;color:var(--slate);margin-top:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:5px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.warn{background:var(--amber-soft);border:1px solid #E4D3AE;border-radius:5px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.setup{font-size:13px;color:var(--slate);border-top:1px solid var(--rule);margin-top:26px;padding-top:16px}
.setup code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:3px}

.fadein{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:760px){
  .top{padding:0 12px;gap:8px}
  .brand{display:none}
  .lng{display:none}
  .who{flex:1;min-width:0}
  .who label{display:none}
  .who input{width:100%;min-width:0}
}
@media(max-width:900px){
  .cards.c3,.cards.c2{grid-template-columns:1fr}
  .rail{position:fixed;top:60px;left:0;bottom:0;z-index:35;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0);max-height:none}
  .rail.open{transform:none;box-shadow:2px 0 24px rgba(0,0,0,.25)}
  .railtoggle{display:inline-block}
  .stage{padding:26px 18px 0}
  .who input{width:120px}
  h1.sect{font-size:26px}
  .hero{padding:26px 22px}
  .hero h1{font-size:28px}
}
</style>
</head>
<body>

<header class="top">
  <button class="tbtn railtoggle" id="railToggle" aria-label="Show section register">Sections</button>
  <div class="brand">
    <b>Configuration Item and CM Supplier Flowdown Training</b>
    <span id="brandSub">Interactive modules</span>
  </div>
  <div class="spacer"></div>
  <div class="who">
    <label for="who">Trainee</label>
    <input id="who" type="text" placeholder="Your name" autocomplete="name">
  </div>
  <button class="tbtn" id="btnSave">Save<span class="lng"> progress</span></button>
  <button class="tbtn" id="btnLoad">Resume</button>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Section register"></nav>
  <main><div class="stage" id="stage"></div></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ==========================================================================
   TRAINER SETUP: edit this block, save the file, then share it.
   Nothing else in this file needs changing.
   ========================================================================== */
var CONFIG = {
  companyName:   "[Company]",
  trainerName:   "your trainer",
  trainerEmail:  "",            // e.g. "cm.lead@company.com": enables the Email results button
  submitEndpoint:""             // optional: a URL that accepts a JSON POST (Power Automate, Forms webhook, etc.)
};

/* ==========================================================================
   CONTENT
   ========================================================================== */
var P = function(t){return {t:"p", x:t};};
var L = function(a){return {t:"list", x:a};};
var C = function(lab,lines,tone){return {t:"callout", lab:lab, x:lines, tone:tone||"rust"};};
var S = function(b,sub){return {t:"stmt", x:b, sub:sub||""};};
var CARDS = function(items,cols){return {t:"cards", x:items, cols:cols||3};};
var TABLE = function(head,rows){return {t:"table", head:head, x:rows};};
var STEPS = function(items,tone){return {t:"steps", x:items, tone:tone||""};};

var MODULES = [
{
 id:"M1", label:"Module 1", title:"Configuration Identification",
 sub:"Defining, selecting and identifying Configuration Items",
 sections:[
  {id:"M1-01", title:"What configuration management is", body:[
    P("Configuration management keeps three descriptions of a product consistent with one another. Everything else in the discipline exists to protect that consistency."),
    CARDS([
      {h:"As required", b:"What the product is contractually and functionally obliged to be. Specifications, requirements, interface definitions."},
      {h:"As documented", b:"What the released design says the product is. Drawings, models, software design documentation, the technical data package."},
      {h:"As built / as maintained", b:"What the physical article actually is, unit by unit. Build records, serial and lot records, repair and retrofit records."}
    ],3),
    S("When the three agree, the product is under configuration control. When they diverge, nobody can say with evidence what they actually have.",
      "A change gets built but never documented. A specification is revised but never flowed to the drawing. A unit is repaired to a scheme nobody approved."),
    C("Why this matters more on safety-significant products",[
      "On a product line where failure can injure or kill, \u201cwhat exactly is in this unit?\u201d is not an administrative question. It determines whether a hazard control is present, whether a life-limited part is within life, and whether a fleet-wide inspection can be scoped.",
      "**Configuration divergence on a safety-significant product is a latent safety problem wearing a paperwork costume.**"
    ])
  ], check:{
    q:"A supplier builds ten units to the released drawing, then quietly improves a bracket on the last three. The units work fine. What has gone wrong in configuration terms?",
    o:["Nothing, because the units meet their performance requirements",
       "As-built has diverged from as-documented, so nobody can now say what any given unit contains",
       "Only a quality problem: the parts still passed inspection",
       "Nothing, provided the change is documented at the next revision"],
    a:1,
    why:"Performance is not the test. The three descriptions have diverged: the documentation says one thing and three physical articles say another. Until that is reconciled, the configuration of every delivered unit is in question, not just the three."
  }},

  {id:"M1-02", title:"Why these two subjects are one course", body:[
    P("This course teaches two things. Module 1 is about identifying Configuration Items. Module 2 is about flowing configuration management requirements to suppliers. On a course outline they look like two subjects. They are not."),
    S("A supplier flowdown is a set of CI decisions written into a contract.",
      "Almost every question Module 2 asks you to answer turns on a fact that Module 1 produces. If the CI facts are missing, the flowdown still gets written. It just gets written wrong, and the error is discovered at delivery."),
    P("Here is where the dependency actually bites:"),
    L(["**What you are buying.** The first question in any flowdown is whether the procured item is a CI, contains one, or is a part inside somebody else\u2019s CI. That answer comes from CI screening. Get it wrong and every requirement downstream is aimed at the wrong thing.",
       "**What goes in the statement of work.** CI identifiers are cited in it. So are safety-critical, life-limited and special-handling designations. Those designations come out of CI screening and the safety linkage that goes with it.",
       "**Whether audits apply.** Audit designation attaches to CIs. A buyer who does not know whether the procured item is a designated CI cannot tell whether audit obligations belong in the contract, and cannot price them.",
       "**What reconciliation means.** Reconciliation compares as-built configuration against released design for a CI. Without knowing which CI, there is nothing to compare against.",
       "**What comes back at receipt.** Traceability records are per unit, tied to the CI and its next higher assembly. A receiver who cannot answer \u201cwhich CI is this part of\u201d cannot check the record.",
       "**Sub-tier items.** An item a sub-supplier develops is a CI from your company\u2019s point of view. Recognising that is a CI judgement, and it is what triggers recursive flowdown."]),
    C("The failure runs in both directions",[
      "Flowdown without CI knowledge produces contracts that impose the wrong requirements on the wrong items, and leave out the ones that mattered.",
      "CI work without flowdown knowledge produces designations nobody can support. Designate a CI at a level your supplier cannot report against, and you have created an obligation that will be missed every month for the life of the program.",
      "**This is why the two modules are one course.** Take Module 2 without Module 1 and you will write plausible contracts that buy the wrong things."
    ])
  ], check:{
    q:"A buyer classifies a procurement correctly by work type, negotiates it well, and releases it. Nobody involved knew that the procured assembly is a designated Configuration Item. What is the most likely consequence?",
    o:["None of substance, provided the work type classification was right",
       "The CI identifiers, the audit provisions and the reconciliation requirements are all missing or aimed at nothing, because each of them depends on knowing which CI is being bought",
       "The supplier will identify the gap and raise it during negotiation",
       "The gap is corrected automatically at first article inspection"],
    a:1,
    why:"Work type tells you what the supplier does. It does not tell you what the item is. The requirements that depend on CI identity are precisely the ones that go missing: which CI the identifiers cite, whether audit obligations apply, what the as-built gets reconciled against, and what traceability records must contain. Suppliers price what they are asked for, so nobody raises the omission."
  }},

  {id:"M1-03", title:"The five functions, and why identification is first", body:[
    P("CM is conventionally divided into five functions. This module lives entirely inside the second one."),
    TABLE(["Function","The question it answers"],[
      ["Planning and management","How will CM be performed here, by whom, with what tools, and how will we know it is working?"],
      ["Configuration identification","What are the things we are managing, what defines each one, and what is each one called?"],
      ["Change management","How does a change to a defined thing get proposed, evaluated, approved and incorporated?"],
      ["Status accounting","What is the current and historical status of every defined thing and every change to it?"],
      ["Verification and audit","Can we demonstrate, with evidence, that the product meets requirements and matches its documentation?"]
    ]),
    P("The other four all take identification as their input, and none can be scoped without it:"),
    L(["**Change management** changes *something*. If that something was never defined and baselined, there is nothing to change against.",
       "**Status accounting** reports the status of something, indexed by something. No identification, no index.",
       "**Verification and audit** compares product against documentation. Both sides of that comparison are outputs of identification.",
       "**Planning** allocates effort across a scope. Identification defines the scope."]),
    S("A missing CI is a change stream nobody controls, a status accounting blind spot, and an audit finding: found years later, at the highest possible cost.",
      "Time spent getting selection right is the cheapest time in the discipline.")
  ], check:{
    q:"Why is configuration identification performed before the other CM functions rather than alongside them?",
    o:["Because it is the least expensive function to perform",
       "Because contracts normally require it in that order",
       "Because the other four functions all take its outputs as their input and cannot be scoped without them",
       "Because it is the only function the Acquirer reviews"],
    a:2,
    why:"Identification defines the things everything else acts on. Change management needs something to change against; status accounting needs an index; audit needs both sides of the comparison. Errors in identification do not stay in identification."
  }},

  {id:"M1-04", title:"The CM floor", body:[
    P("Some CM requirements are not the contract\u2019s to give away. On safety-significant product lines, a defined set of roughly forty-four discrete requirements, called the CM floor, is performed regardless of what the contract flows down. Each one functions as a barrier to a catastrophic or severe safety outcome, and the safety management system the company has adopted obligates it through a pathway that does not run through the contract at all."),
    S("Contract silence removes the contractual obligation. It does not remove the hazard the requirement controls.",
      "The obligation arrives by a second route: the safety pathway, which binds whether or not the contract says a word. The next section explains why."),
    P("The floor enters at exactly one point. That point is tailoring, the moment a program decides which CM requirements it will and will not perform. It re-enters at every CM plan revision. When a program proposes not to perform a requirement, the gate runs:"),
    STEPS([
      {h:"Step 1: the floor check", b:"Is the requirement a floor item? If no, normal tailoring applies and the program proceeds at its discretion. If yes, it cannot be dropped silently: continue."},
      {h:"Step 2: choose a door", b:"Exactly three dispositions exist. **Perform** the requirement. **Replace** it with a documented equivalent control: validated independently by CM and Safety Assurance against the hazard it controls, not by the program that proposed it. Or **risk-accept** its absence formally, at the authority level the safety management system names for the severity: a vice president for a severe barrier, the chief executive for a catastrophic one."},
      {h:"Step 3: set the health check", b:"For performed and equivalent items, record how the barrier\u2019s continued effectiveness will be monitored over the program life. A barrier must be present and kept effective: a degraded barrier is a finding, not a pass."}
    ]),
    S("There is no fourth door.",
      "Silent omission is the failure mode the gate exists to close. Because risk acceptance is visible, routes upward, and cannot be scored down, the expected default for most floor items is \u201cperform.\u201d"),
    C("Severity is looked up, not re-rated",[
      "Each floor item carries a severity assigned by the barrier safety case and fixed at the register level. At tailoring it is **looked up, never re-assessed**. This removes the one incentive that reliably corrupts these decisions: rating a barrier\u2019s absence low so the acceptance stays at a comfortable altitude.",
      "The program does not get to decide how dangerous the barrier\u2019s absence would be. That question was answered when the barrier was established, by people with no tailoring decision in front of them."
    ]),
    P("Every disposition lands in a per-program compliance record: one structured, queryable row per floor item, carrying the disposition, the evidence or risk-acceptance reference, the health check method and schedule, and the sign-off. The record is queryable on purpose: the floor measures are computed from it, and **records that cannot be queried cannot be measured.**"),
    C("How floor coverage is measured",[
      "Two numbers, reported together and never combined. A severity-weighted coverage percentage gives the trend and rewards closing the deadliest gaps first. Alongside it, a plain **count** of open top-band items, target zero, never averaged into anything.",
      "The count exists because a single open catastrophic barrier must not be able to hide behind a 96% number. And the share of coverage achieved by risk acceptance rather than performance is reported separately, so a high coverage figure is never misread as a safe portfolio."
    ],"teal")
  ], check:{
    q:"A program proposes not to perform a floor requirement, pointing out that the contract does not flow it down. What are its options?",
    o:["Drop it with a recorded rationale: the contract governs what is performed",
       "Perform it, replace it with an independently validated equivalent control, or obtain formal risk acceptance at the severity-matched authority: contract silence changes nothing",
       "Obtain Acquirer approval to omit it",
       "Re-rate the severity for this program and tailor accordingly"],
    a:1,
    why:"Floor items are obligated through the safety pathway, so a silent contract is beside the point. The three doors are exhaustive, the severity is pre-anchored and cannot be re-rated, and the Acquirer has no standing in it: the obligation was never theirs to waive."
  }},

  {id:"M1-05", title:"Why the floor exists: the sixteen barriers", body:[
    P("The floor is not a list someone thought prudent. Every requirement on it traces to one of sixteen barriers, and every barrier is anchored to a documented aerospace event in which that barrier\u2019s failure killed people or destroyed the product. The floor is the deduplicated set of requirements those sixteen barriers rest on."),
    CARDS([
      {h:"The contract pathway", b:"Binds where clauses are flowed. If the contract invokes a CM requirement, it is contractually obligated; if the contract is silent, it is not. This pathway is real, and it is the only one many engineers are taught to see."},
      {h:"The safety pathway", b:"The organization adopted a safety management system, which names specific hazards: inaccurate build data, unmanaged change, non-conformance, interface failures, and requires them controlled. Where a CM requirement is the control for a named hazard, the activity is obligated regardless of the contract. The only open question is which label the organization puts on it."}
    ],2),
    S("Omitting a barrier because the contract is silent is a catastrophic-or-severe risk-acceptance decision: made by omission, at the wrong altitude.",
      "Somebody accepts that risk either way. The gate in the previous section exists so it is accepted knowingly, by the person whose signature the severity actually requires."),
    P("The sixteen barriers fall into four clusters, and the shape of Module 1 and Module 2 follows them:"),
    L(["**Hazard identification and critical-item recognition**: declaring, at CM level, which items can kill, so that everything downstream treats them accordingly.",
       "**Change discipline and impact assessment**: classifying every change, assessing its full impact, and routing safety-affecting changes to the right approval authority.",
       "**As-designed-to-as-built reconciliation**: keeping the record of what was actually built, unit by unit, true for the life of the product.",
       "**Supply chain, interfaces, and verification**: holding the disciplines together across organizational boundaries, where they are weakest."]),
    P("Three of the anchor events, briefly:"),
    CARDS([
      {h:"Alaska Airlines 261: 2000", b:"A horizontal stabilizer jackscrew assembly whose criticality was under-recognized, and whose as-maintained condition drifted over years of service. 88 dead. The barrier: formally identify as critical any item whose failure can cause loss of life, so the system has a structural defense against under-recognized criticality."},
      {h:"Challenger: 1986", b:"A criticality reclassification that stale paperwork failed to propagate to the people making launch decisions, and a waiver approved through an abbreviated process. 7 dead. The barrier: change classification discipline, and approval authority matched to what the change actually touches."},
      {h:"Mars Climate Orbiter: 1999", b:"Two teams, one interface, two unit systems, no controlled interface definition catching the mismatch. A $327M spacecraft flown into the atmosphere. The barrier: interface requirements identified, documented, and controlled across every boundary."}
    ],3),
    P("Across the sixteen documented events the fatality count exceeds 880, and thirteen of the sixteen barriers are anchored at the catastrophic level. The barriers are not theoretical, and the floor built on them is not bureaucracy: it is the accumulated accident record, converted into requirements.")
  ], check:{
    q:"Who has the authority to decide that a barrier requirement will not be performed on a safety-significant product line?",
    o:["The CM lead, provided the rationale is recorded",
       "The program manager, where the contract does not flow the requirement down",
       "No one: floor requirements can never be omitted",
       "Only the named risk-acceptance authority for the barrier\u2019s severity, through the floor gate, after independent validation"],
    a:3,
    why:"Not CM, not contracts, not the program: the decision is a risk acceptance at the barrier\u2019s pre-anchored severity, and it belongs to whoever the safety management system names for that severity. \u201cNever\u201d is also wrong: the gate exists precisely so the decision can be made: visibly, at the right altitude: rather than by omission."
  }},

  {id:"M1-06", title:"The words you will meet", body:[
    P("A short detour into vocabulary before the machinery starts. These terms run through the rest of the training and through every document you will touch. Guessing at them is how work gets misclassified, and every one of them is really a statement about **who owns the design, and how much of it you are being shown.**"),
    TABLE(["Term","What it means"],[
      ["Acquirer and Supplier","The customer who buys the product and controls what they choose to control, and the organisation that designs, builds and delivers it. Your company is the Supplier here, and becomes the Acquirer in turn to its own sub-suppliers, which is the whole premise of Module 2"],
      ["Design activity","The organisation responsible for the design of an item. Its enterprise code goes on the item, its parts, its documentation and its media, which is what makes a part number unambiguous, since a part number is only unique within the activity that assigned it"],
      ["Technical data package","The collected design definition sufficient to build the item: drawings and models, associated lists, specifications, and the process requirements that go with them"],
      ["Performance specification","States requirements as **required results, with criteria for verifying compliance, but without stating the methods** for achieving them. It defines the functional requirements, the environment the item must operate in, and its interface and interchangeability characteristics"],
      ["Detail specification","States **design** requirements: materials to be used, how a requirement is to be achieved. A specification containing both performance and detail requirements is still a detail specification"],
      ["System specification, item specification","The top-level specification for the whole system or end item, versus the specification for one CI. The first sits in the functional documentation; the second in the allocated"],
      ["Source control drawing","Covers a commercial or vendor-developed item used in a **critical application**. It gives the engineering description, qualification requirements and acceptance criteria, and it carries a list of approved sources with the vendor\u2019s own identification for items qualified for that use. The vendor owns the internal design; the drawing controls the item\u2019s characteristics and who may supply it"],
      ["Vendor item control drawing","Covers a catalog item bought to the vendor\u2019s own part number, where that kind of source qualification is not being imposed. Design authority stays wholly with the vendor, and the flowdown is mostly notification"],
      ["Altered item drawing","Documents a purchased item that is permanently altered before it is installed, including a one-time programmable device burned with code, which is why it appears in the firmware rules"],
      ["Contract data requirements","The list on the contract stating which data products are delivered, in what form, and when. A requirement with no data requirement behind it produces nothing you can ask for"]
    ]),
    S("Read a drawing type as an answer to the design authority question, never as a filing detail.",
      "Source control drawing: they design the internals, you control the characteristics and the sources. Vendor item control drawing: they design it, they own it, you buy it. A technical data package you issued: you designed it, they build it. Those three sentences drive completely different CM obligations.")
  ], check:{
    q:"A supplier designs the internals of an actuator for a critical application. Your company sets its performance, interface and qualification requirements and maintains the list of sources approved to supply it. Which artifact controls that arrangement?",
    o:["A vendor item control drawing",
       "A source control drawing",
       "A technical data package issued to the supplier",
       "A detail specification"],
    a:1,
    why:"The approved-sources list plus qualification and acceptance criteria for an item used in a critical application is exactly what a source control drawing does. A vendor item control drawing would mean buying a catalog item to the vendor\u2019s number with no such control; a technical data package would mean your company held the design; a detail specification would tell them how to build it, which is the opposite of what is happening here."
  }},

  {id:"M1-07", title:"Three identifiers, three different questions", body:[
    P("Conflating these is the most common newcomer error, and it produces the most durable damage. Keep them separate from day one."),
    TABLE(["Identifier","Answers","Changes when\u2026","Never"],[
      ["CI identifier","Which managed function is this, and what is the boundary of its configuration control?","The management need changes: a new function is designated, or a CI is split or consolidated","Assigned to solve a part-numbering problem"],
      ["Part or identifying number (PIN)","Which design definition is this built to? Is it interchangeable with that other one?","A modification creates a non-interchangeable condition in form, fit or function","Changed for a purely administrative reason"],
      ["Unit identifier (serial, lot, batch)","Which physical article is this, out of all the ones we built?","Never: it identifies one article for life","Revised or re-used, even through a PIN change"]
    ]),
    S("The CI identifier and the PIN are deliberately decoupled.",
      "One CI can carry several PINs as variants. One PIN can appear under two different CIs. Both are normal, correct outcomes.")
  ], check:{
    q:"Unit serial 0047 is modified in service. The change alters the mounting flange pattern, so the modified unit can no longer replace an unmodified one. Which identifiers change?",
    o:["The PIN and the serial number",
       "The PIN only",
       "The CI identifier and the PIN",
       "All three"],
    a:1,
    why:"A non-interchangeable condition in form and fit is exactly what a PIN change signals. The serial number identifies one physical article for life and is retained through a PIN change. The CI identifier does not move: the item still performs the same managed function within the same boundary."
  }},

  {id:"M1-08", title:"The full identifier scheme", body:[
    P("The three identifiers of the previous section sit inside a five-class scheme, applied to every CI, its component parts, and its configuration documentation. Nothing gets an identity by accident, and nothing that needs one goes without."),
    TABLE(["Class","Assigned to","The rule"],[
      ["Enterprise","Items, parts, documentation, software media, products","The design activity\u2019s enterprise code, affixed to everything it designs. Answers \u201cwhose design definition is this?\u201d, and makes every other identifier unambiguous, because a part number is only unique within the enterprise that assigned it"],
      ["Product: the PIN","All CIs, parts, assemblies, units, and sets","The same as, or containing, the design document number, so the identifier and the definition cannot drift apart. Changes when a modification creates a non-interchangeable condition"],
      ["Unit: serial number","Individual articles that must be distinguished from one another","Identifies one physical article for life"],
      ["Group: lot or batch number","Groups of articles produced together, where unit-level distinction is not required","Identifies the group for life, on the same terms as a serial"],
      ["Document","Every item of configuration documentation","Uniquely identified so it can be referenced precisely and retrieved: every version of every representation"]
    ]),
    S("Serial and lot numbers are unique, consecutive, and non-duplicating against a non-changing product-tracking base identifier, and once assigned, never revised and never re-used.",
      "A modified unit keeps its original unit identifier through a PIN change. That is what preserves the thread back to the original configuration: the article\u2019s history stays attached to the article."),
    P("Software and firmware follow the same logic with two wrinkles. Every software CI gets a unique identifier **and a version identifier for every version**: software changes too easily for the item identifier alone to say what you have. And embedded code splits two ways:"),
    CARDS([
      {h:"Embedded, controlled with its device", b:"Where code and the hardware device it lives in are controlled together on a single altered-item drawing, one PIN represents the device **with the code embedded**. The software medium is labeled separately, and the device is marked accordingly. One identity, deliberately: they change together."},
      {h:"Controlled separately", b:"Where the code is managed in its own right, the device carries its PIN and serial, and the code is its own software CI with its own identifier and version identifiers. Two identities, deliberately: they change independently, and each needs its own change and status thread."}
    ],2),
    P("Two further rules complete the scheme. Nomenclature is revised when a non-interchangeable condition requires it: a name that no longer distinguishes non-interchangeable things has stopped doing its job. And unique item identification marking is applied where the contract requires it.")
  ], check:{
    q:"Unit serial 0031 is scrapped during production after a machining error. The planner proposes assigning 0031 to the replacement article so the delivery sequence stays tidy.",
    o:["Acceptable: the original unit no longer exists, so no ambiguity can arise",
       "Acceptable if the scrap record notes the re-assignment",
       "Not acceptable: unit identifiers are never re-used; the scrapped article\u2019s history, including its scrap disposition, must stay unambiguously attached to 0031 for life",
       "Acceptable for lot numbers but not serial numbers"],
    a:2,
    why:"Never revised, never re-used, with no exception for scrapped units. The moment two articles have ever answered to one serial, every record against that serial becomes a question instead of an answer. The replacement takes the next number in sequence; the tidy delivery list is not a configuration record."
  }},

  {id:"M1-09", title:"Baselines", body:[
    P("A baseline is an agreed, fixed reference point: the approved configuration documentation for a CI at a defined moment, from which changes are managed by formal action."),
    STEPS([
      {h:"Functional: FBL","b":"System-level performance requirements and verification method for the system or top-level item. Typically established at the system requirements or functional review."},
      {h:"Allocated: ABL", b:"Requirements allocated down to each CI, with interfaces and verification, in item performance specifications. Typically at preliminary design review, per CI."},
      {h:"Product: PBL", b:"The detailed design definition: the documentation describing the item as built. Typically at critical design review and configuration audit, per CI."}
    ],"tl"),
    P("Once documentation is baselined, changes to it are processed through formal change action rather than by editing the document. That is the hinge between identification and change management. Baselined interface requirements are no exception: controlling them is a CM floor obligation.")
  ], check:{
    q:"What changes about a document the moment it is baselined?",
    o:["It becomes read-only in the document system",
       "It can no longer be revised at all",
       "It is delivered to the Acquirer",
       "Changes to it are processed through formal change action rather than by editing it"],
    a:3,
    why:"A baseline is a reference point, not a lock. The document still changes, but through a controlled, recorded change action, so that every version has a traceable approval behind it."
  }},

  {id:"M1-10", title:"The three documentation sets", body:[
    P("A baseline is a moment. The **configuration documentation** is what the baseline is made of, and each baseline has its own set, with its own job. Naming them precisely matters, because the audits, the change function and the whole supplier flowdown all cite one set or another."),
    TABLE(["Documentation set","The question it answers","What it documents"],[
      ["Functional","What must the system do, and how will we know it did?","The system\u2019s functional, performance, interoperability and interface requirements, together with the verifications required to demonstrate those requirements were achieved. It documents the functional baseline, and is typically made up of the contract together with the system or end-item level specification"],
      ["Allocated","What must this CI do, given what the system must do?","The CI\u2019s functional, performance and interoperability requirements **allocated down** from the system or a higher-level CI; its interface requirements with the CIs it interfaces to; and the verifications required to demonstrate achievement. It documents the allocated baseline, CI by CI"],
      ["Product","What is this CI in detail, and what has to be true before we accept one?","The CI\u2019s detailed design: the physical form, fit and function characteristics, plus the functional and performance requirements selected for production, qualification and acceptance test. It documents the product baseline"]
    ]),
    S("All three carry verification, not just requirements.",
      "Each set describes what is required **and** how achievement is demonstrated. A requirement documented with no stated means of verifying it is a requirement nobody has yet committed to being able to check, and it will be found at the functional audit, which is precisely a walk from requirement to verification evidence."),
    P("The product set is the largest, because it has to be sufficient to build the item, accept it, and support it. Alongside the detailed design it carries:"),
    L(["The verifications necessary to accept deliveries: first article and acceptance inspection provisions, including the form, fit, function and quality assurance provisions required to accept the item.",
       "The design of any special tooling, software, equipment and facilities required to manufacture, operate, maintain, calibrate or inspect items in the design.",
       "The design of any special packaging parts required to package the CI.",
       "Any unique process specifications required to manufacture, operate, maintain or calibrate items in the design.",
       "Identification of any commercial hardware or software used in the detailed design.",
       "Where the contract requires it, the technical data giving instructions for installation, operation, maintenance, training and support."]),
    C("The scaling rule",[
      "The design information in the product set can be **as simple as identifying a specific part number, or as complex as full design disclosure.** It scales with the production and procurement strategy, which is the same decision you meet again as documentation determination, where the type follows item maturity, ownership and control level.",
      "For a privately developed CI the obligation is narrow but firm: the product set must at least carry the verification provisions required to accept deliveries. **You may not own the design. You still have to be able to say what an acceptable article looks like.**"
    ]),
    S("A baseline plus its approved changes is the current approved configuration.",
      "The baseline alone is a photograph of a moment that has already passed. What anyone actually builds, tests or audits against is the baseline plus everything approved since."),
    P("Two rules hold the sets together. **Each succeeding baseline traces to its predecessor**, with a detailed extension at each step: system requirements to allocated requirements to detailed design. A product baseline that cannot be traced back to the requirements it satisfies is a design nobody can defend. And **each set identifies any specialised software and the operating environment used to author it**: the same logic that puts the build toolchain under identification. A definition you cannot reopen is a definition you cannot maintain."),
    P("When a change is approved, the documentation is maintained by creating a **new revision**. The revision provides traceability by detailing the conditions before and after the change, and it identifies the change as the revision authority. Interface information is incorporated into all three sets as each is developed, in the applicable specifications directly, or through referenced interface documentation.")
  ], check:{
    q:"A colleague says verification requirements belong with the product documentation, since that is where testing gets defined. Where do verifications actually appear?",
    o:["In the product set only: the earlier sets carry requirements, and verification comes later",
       "In all three sets, doing different jobs: demonstrating system requirements, demonstrating the requirements allocated to each CI, and accepting deliveries of a produced article",
       "In the test plans, which sit outside configuration documentation entirely",
       "In the functional set only, since verification is a system-level concern"],
    a:1,
    why:"Every set pairs requirements with the means of demonstrating them. The functional set carries the verifications for system requirements, the allocated set those for the requirements allocated to a CI, and the product set the first article and acceptance provisions needed to take delivery of an article. Test plans and procedures implement those verification requirements: they do not replace them."
  }},

  {id:"M1-11", title:"Where candidates come from", body:[
    P("Everything that follows screens a **candidate list**. That list is not CM\u2019s private product, and it does not assemble itself."),
    CARDS([
      {h:"Who nominates", b:"Systems Engineering, Design Engineering, Logistics and CM jointly. Each sees candidates the others do not: Logistics knows what will need provisioning and a technical manual; Design knows what is novel; Systems Engineering knows what carries a function; CM knows what will need its own change stream."},
      {h:"Who is responsible", b:"Either the Acquirer or the Supplier may make initial top-level recommendations. But the **Supplier is responsible for the comprehensive recommendation.** An Acquirer list is a starting point, never a completed one, and \u201cthey didn\u2019t ask for it\u201d is not a defence for an item nobody considered."}
    ],2),
    P("The method is top-down decomposition of the product structure. The top tier of candidates normally corresponds to the contract line items and the work breakdown structure: that is where the money and the deliverables are, so it is where separate management is nearly always warranted. Lower-level candidates are nominated wherever separate management looks warranted, and settled by the screen rather than by argument."),
    P("Gather these before you start: the product structure and the architecture model; the contract, its statement of work and its data requirements, including any Acquirer-directed designations; the hazard analyses and safety-critical item lists; and the supportability planning products."),
    S("Items flagged safety-critical by hazard analysis go into the candidate set and are screened. They are not filtered out beforehand.",
      "Screening produces a record with a rationale. Filtering produces nothing at all, and a safety-critical item that was never a candidate has no assessment, no rationale, and nothing for System Safety to concur with."),
    C("Candidates are cheap. Missing candidates are not.",[
      "Over-nominating costs one assessment row and a recorded \u201cno.\u201d An item that was never nominated is never screened, never rejected on the record, and invisible at every review that follows, because reviews look at what was considered, and it was not.",
      "**When you are unsure whether something is a candidate, it is a candidate.** The screen exists to say no."
    ])
  ], check:{
    q:"The Acquirer provides a list of top-level items they expect to be designated. What is your company\u2019s position on the candidate list?",
    o:["The Acquirer\u2019s list defines the candidate set; adding to it invites unnecessary scope",
       "The list is a starting point: the Supplier remains responsible for the comprehensive recommendation, nominating below and beyond it as separate management is warranted",
       "The list is advisory only and carries no designation weight",
       "The list is adopted for Acquirer-controlled CIs, and no further candidates are considered"],
    a:1,
    why:"Either side may recommend at the top, but responsibility for a complete recommendation sits with the Supplier. The Acquirer\u2019s designations do bind: an item they designate meets a criterion by that fact alone, but their list bounds nothing. Everything below it still has to be decomposed, nominated and screened."
  }},

  {id:"M1-12", title:"What makes something a Configuration Item", body:[
    P("A Configuration Item is an item, or aggregation of items, that **satisfies a system end-use function** and is **designated for separate configuration management**. Both halves carry weight."),
    STEPS([
      {h:"Step 1: the end-use function gate", b:"Does the item satisfy a system end-use function? If NO: not a CI candidate. Record the rationale, identify the parent CI whose documentation controls it, and stop. Raw materials, bulk commodities and purely structural elements with no defined functional role fail here."},
      {h:"Step 2: the criteria screen", b:"Designate as a CI if the item meets or impacts one or more of seven criteria, plus the software rule. One YES is sufficient."}
    ]),
    S("Items that are not CIs are not uncontrolled: they are controlled within their parent CI\u2019s configuration documentation.",
      "The question is never \u201ccontrolled or not.\u201d It is \u201ccontrolled at what level, with what independence.\u201d"),
    C("Record the rationale for every candidate",[
      "Record the assessment and reasoning for **every candidate**, whether designated or not. This is the step new engineers skip most often, and the one that costs most later.",
      "A list of selected CIs shows an outcome. A candidate list showing what was considered and rejected, and why, shows that judgement was exercised. When the Acquirer asks why a particular assembly is not a CI, \u201cit isn\u2019t on the list\u201d is not an answer."
    ])
  ], check:{
    q:"A titanium billet, specified by material standard, is the stock from which several structural fittings are machined. How is it treated?",
    o:["Designated as a CI because it is critical to structural integrity",
       "Fails the end-use function gate; controlled within the parent CI\u2019s documentation via the material specification",
       "Designated as a CI only if it is sole-source",
       "Left outside configuration control entirely"],
    a:1,
    why:"Raw material satisfies no system end-use function of its own, so it never reaches the criteria screen. It is still controlled, by the material specification called out on the drawings of the parts made from it, inside the parent CI\u2019s documentation."
  }},

  {id:"M1-13", title:"The criteria screen", body:[
    P("One YES is sufficient. Four is not four times as designated, but listing all four is worth doing, because each is an independent reason the designation survives if one fact later changes."),
    TABLE(["The screen","What it asks","What it looks like in practice"],[
      ["System-functioning screen","Is the item critical to the functioning of the system?","The system cannot perform its mission without it. Not \u201cuseful\u201d: necessary"],
      ["Safety-critical screen","Might its failure cause serious injury, loss of life, or loss of primary system capability?","Screen every safety-critical item here. This screen is a CM floor requirement"],
      ["Technology screen","Is it complex or not-well-known technology that program goals depend on?","Novel, immature or specialised technology the program depends on"],
      ["Acquirer-designation screen","Has the Acquirer designated it for control?","The customer said so. Designation is theirs to make, not yours to predict"],
      ["Separate-identity screen","Does it need separate type designation, versions or nomenclature?","The item needs its own formal name, model number or version identity"],
      ["Risk-and-cost screen","Is it critical or high risk, where failure would have significant financial impact?","Long lead, sole source, high value, or a failure that stops a line"],
      ["Logistics screen","Does it require one or more logistics elements?","Provisioning lists, dedicated test equipment, technical manuals, maintenance documentation, tag-out"],
      ["The software rule","Is the item computer software?","Designate it as a software CI. A rule, not a judgement"]
    ]),
    P("Name the screens rather than lettering them. \u201cIt meets the logistics screen and the safety-critical screen\u201d tells a reader what you found. \u201cIt meets (b) and (g)\u201d makes them go and look it up, and lettering differs between programs and standards."),
    P("Programs may add a supplemental screen: independent end-use function, separate change effectivity address, commonality across systems, interfaces with an existing CI, interchangeability level, separate delivery or installation, separate performance and test requirements, independent testability, configurable state, new or modified design. Check what your program has adopted before you start screening.")
  ], check:{
    q:"A valve is sole-source with a fourteen-month lead time, and the Acquirer has expressed no view on it. Which screen does the lead time engage?",
    o:["The Acquirer-designation screen, since they will probably want it designated",
       "The technology screen",
       "The risk-and-cost screen: critical or high risk, where failure would have significant financial impact",
       "None; lead time is a procurement matter, not a CI screen"],
    a:2,
    why:"Sole source with a long lead is exactly the risk-and-cost screen: a failure or an uncontrolled change stops the line for over a year. The Acquirer-designation screen applies only where the Acquirer has actually designated the item: predicting what they will want is not the same as designation."
  }},

  {id:"M1-14", title:"Three standing rules", body:[
    CARDS([
      {h:"Software", b:"Computer software is designated as a software CI. Product-unique identifiers also go to elements of the software development environment that form part of the system: compilers, linkers, loaders, developmental libraries, configuration settings, automation scripts. If the build cannot be reproduced without it, it needs an identity."},
      {h:"Safety linkage", b:"Any item identified as safety-critical under the safety management system is screened against the safety-critical screen, and usually the system-functioning screen too. If a safety-critical item is NOT designated a CI, the rationale requires System Safety concurrence. A CM engineer does not make that call alone."},
      {h:"The CM floor", b:"The safety-critical screen is a floor requirement. On safety-significant product lines it is performed regardless of what the contract flows down. Any proposal not to perform it goes through the CM floor gate and is recorded, never quietly dropped."}
    ],3),
    C("The consequence to hold on to",[
      "Three years from now, a field failure requires you to rebuild the delivered software load and compare it byte-for-byte against what is in the unit. If the compiler version, build settings and library state were never identified, and the toolchain has since been upgraded: the load cannot be reproduced.",
      "That means the product baseline cannot be demonstrated, which means the physical configuration audit for that CI was never actually satisfiable."
    ],"teal")
  ], check:{
    q:"A program proposes not to designate a safety-critical actuator as a CI, arguing it is adequately controlled within its parent assembly. What is required?",
    o:["Nothing. CM may record the rationale and move on",
       "Acquirer approval only",
       "System Safety concurrence on the rationale, with the proposal dispositioned through the CM floor gate and recorded",
       "A design change to remove the safety criticality"],
    a:2,
    why:"The safety-critical screen is a CM floor requirement, so a proposal not to perform it goes through the floor gate and is recorded. And a safety-critical item not designated a CI needs System Safety concurrence on the rationale. CM does not make that call alone."
  }},

  {id:"M1-15", title:"Designations that answer the safety-critical screen for you", body:[
    P("CM teams and safety teams often talk past each other. CM asks: what are the safety-critical parts? Safety asks back: what types of critical parts do you mean? Both questions are fair. Neither can be answered as asked. This section and the next three give you the vocabulary that fixes the exchange."),
    P("Start with the easiest case. Some designations land directly on a part. Their own definitions state a consequence that meets the safety-critical screen. When one of these lands on an item, the screening question is already answered."),
    TABLE(["Designation","Where you will meet it","Why it always meets the safety-critical screen"],[
      ["A critical safety item, assigned by the customer\u2019s engineering authority","Military aviation programs. A legacy version of the label appears on older drawings","Its definition is the safety-critical screen in different words. Failure could cause loss of the aircraft, serious injury, or loss of life"],
      ["A safety-critical **item** from the system safety analysis","Any program running a formal system safety program","It names hardware or software that analysis found could contribute to a catastrophic or critical mishap"],
      ["A fracture critical part, and its traceable subclass","Military airframe structure, under the structures control plan","Failure by cracking would cause loss of the aircraft"],
      ["A fracture critical engine component","Military engines. The basis usually arrives through the statement of work","Same consequence. Failure would be catastrophic"],
      ["An engine life-limited part","Civil engine certification, FAA environment","This population is defined by hazardous failure consequence. The life limit is how that consequence is managed"],
      ["Engine, propeller, and auxiliary power unit critical parts","Civil certification, EASA environment","Primary failure is likely to produce a hazardous effect"],
      ["A rotorcraft critical part","Civil rotorcraft certification","Failure could have a catastrophic effect on the rotorcraft"],
      ["Fracture critical hardware, per the fracture control board","Spaceflight programs","Failure from a crack would produce a catastrophic hazard"]
    ]),
    S("When one of these lands on an item, the safety-critical screen is met. CM records the designation. CM does not re-determine it.",
      "The consequence judgement was made by qualified people. It was accepted by an authority. Your job is to record it, cite the designation as the basis, and keep screening, because the other criteria still matter. A customer-assigned designation also engages the Acquirer-designation screen. Sustainment reach usually engages the logistics screen. List every screen that applies."),
    C("The \u201cit is just a bolt\u201d escape hatch, closed",[
      "These designations often land on small parts. A fitting. A bushing. A fastener. An assessor may argue the part fails the end-use function gate. That argument rejects the part at step one: before the safety criterion is ever reached.",
      "The rule: **a designation from the table above satisfies the gate.** The designation is evidence that the part performs a function with system-level consequence. An assessor who still concludes the part fails the gate needs System Safety concurrence in writing. That decision goes through the floor gate, on the same terms as any other non-designation of a safety-critical item."
    ]),
    P("One caution before moving on. This table under-catches. The safety-critical screen also covers loss of primary system capability. No designation scheme keys on lost capability without an injury pathway. Items in that class appear on no safety list. They come from your own decomposition, or they come from nowhere.")
  ], check:{
    q:"A customer-assigned critical safety designation lands on a small structural fitting. An assessor argues the fitting fails the end-use function gate: it is \u201cjust a fitting.\u201d What does the process require?",
    o:["Nothing further: the gate is step one, and an item that fails it never reaches the criteria",
       "The designation satisfies the gate. Failing it anyway requires System Safety concurrence in writing, and the decision goes through the floor gate",
       "The fitting is screened as a normal candidate, with the designation counting as one criterion among seven",
       "The designation is returned to the customer for clarification"],
    a:1,
    why:"The designation is evidence of a function with system-level consequence, so the gate is satisfied. Failing the part at the gate is the one move that skips the safety criterion entirely, which is exactly why that move is not free. A written safety concurrence and a floor gate disposition make the decision visible, at the right altitude."
  }},

  {id:"M1-16", title:"When the safety designation is not a part classification", body:[
    P("Not every safety label lands on a part. Many land on something else. A function. A maintenance task. A failure mode. A development assurance level. A feature on a drawing. A location on the airframe. None of these is an item. So none of them can be a CI. And none of them designates anything on its own."),
    P("But each one is a signal. It tells you that parts worth screening exist nearby. Your job is to get from the label to the parts. **You do not work that out yourself. You ask.** Identifying the hardware behind a function is engineering analysis. A good guess is still a guess, and a guess misses the parts you did not think of."),
    TABLE(["The label","What it is attached to","What you ask for"],[
      ["A safety-critical **function** from the system safety analysis","A function","The items that implement the function"],
      ["A maintenance task created to catch a hidden failure","A task","The items whose hidden failure the task exists to detect"],
      ["A failure-mode criticality code","A failure mode","The hardware in which that failure mode lives. Note: a redundant configuration with the same end consequence carries the same code: redundancy does not relieve the screen"],
      ["A development assurance level","A function, or a development baseline","Nothing, on its own. A top-level function can be built from parts that do not meet the safety-critical screen. Software is a CI by rule regardless of level"],
      ["A published airworthiness limitation","Sometimes a part. Sometimes an inspection task on a zone","Which one it is. A limitation attaching to a discrete part sends you to that part. A zonal inspection task names no item: control lives in the parent CI\u2019s documentation"],
      ["A critical or key characteristic","A feature or process parameter","Screen the **parent part**. Also ask why it was flagged: the quality-system term covers producibility and fit as well as safety"],
      ["A principal structural element","A location, tracked by tail number and position","The detail parts at that location, screened on their own merits"]
    ]),
    S("Ask for the parts behind the mitigations, not only the parts behind the hazards.",
      "A hazard log read only for causes returns the parts that can start an accident. It does not return a cargo fire suppression bottle, a crew oxygen system, or an ejection seat component. Those items protect people during an accident that something else caused. Ask for them by name: the items implementing protective functions and hazard mitigations."),
    C("Do protective items pass the safety-critical screen?",[
      "This needs a straight answer, because the screen asks whether the item\u2019s own failure might cause serious injury, loss of life, or loss of primary system capability. A fire bottle that fails does not start the fire. On its own failure consequence, it does not pass.",
      "**But you do not make that determination.** If the safety analysis names the item as a safety-critical item, or as implementing a hazard control, then it passes the safety-critical screen and you record it on that basis. That is one of the populations from the previous section.",
      "**If the safety analysis does not name it, the item still gets screened against everything else, and protective equipment very often passes.** Scheduled replacement, provisioning, a technical manual, dedicated test equipment: that is the logistics screen. Its own type designation or version identity: that is the separate-identity screen. Ask the safety question, then run the rest of the screen regardless of the answer.",
      "And if it is designated on none of them, it is not uncontrolled. It is controlled within its parent CI\u2019s configuration documentation, and the assessment names that parent."
    ],"teal"),
    C("The exchange runs both ways",[
      "CM asks for the parts behind the labels. CM also sends something back. Two lists. The first is the current CI list, with its safety-critical flags and hazard references. The second is every item that carried a safety designation and was **not** designated a CI, with the rationale for each.",
      "The second list is not a courtesy. It is the population System Safety has to concur on. Without it, the interface fails quietly, one undesignated item at a time."
    ],"teal")
  ], check:{
    q:"The system safety analysis names \u201cautomatic ground collision avoidance\u201d as a safety-critical function. What does CM do with that?",
    o:["Designate the function as a CI, since the analysis is authoritative",
       "Nothing: functions are outside CM\u2019s scope",
       "Ask the safety and engineering teams to name the items that implement the function, then screen those items",
       "Screen the flight control computer, since that is where such functions usually live"],
    a:2,
    why:"A function is not an item, so it cannot be designated. But it is a strong signal. The correct move is a named request: which items implement this function? Guessing at the hardware is doing engineering that belongs to another team, even when the guess is a good one. And it misses the items you did not think of."
  }},

  {id:"M1-17", title:"Life-limited parts", body:[
    P("Many aerospace parts carry a life limit. A compressor disc is limited by engine cycles. A landing gear component is limited by landing cycles or flight hours. An elastomeric seal is limited by cure date. A sealant or adhesive is limited by shelf life. The word is the same in all four cases. The reasons are not."),
    S("A life limit is a maintenance control. It is not a CI designator, and it does not satisfy the safety-critical screen by itself.",
      "A limit tells you the item degrades, and it tells you how continued service is assured. It tells you nothing about what happens if the item fails. Those are different questions, and only the second one is what the safety-critical screen asks."),
    P("So a life limit never designates anything on its own. What it does is tell you to run the screen properly. A life-limited item is designated when it passes a screen, and there are two ways that happens."),
    CARDS([
      {h:"It performs a safety-critical function", b:"Some life-limited parts are limited **because** their failure would be severe. An engine life-limited part is the clearest case, and that population appears in the designation table two sections back. A landing gear safe-life component is another. In these cases a consequence determination already exists somewhere. Follow the limit back to it, and screen on that determination rather than on the limit."},
      {h:"It passes some other screen", b:"A life limit almost always brings scheduled replacement, provisioning, and a maintenance procedure. That is the logistics screen, and it is met regardless of whether anything about the item is safety-critical. Life-limited items also frequently carry their own version identity or type designation, which is the separate-identity screen."}
    ],2),
    P("And a life-limited item can pass neither. That is a legitimate outcome, recorded like any other, with the parent CI whose documentation controls the item."),
    TABLE(["Life-limited item","Why the limit exists","Where it lands"],[
      ["Engine compressor disc, limited by cycles","Failure would be hazardous. The limit is how that consequence is managed","Passes the safety-critical screen through its designation. Also the logistics screen"],
      ["Main landing gear cylinder, safe-life limited","Structural failure consequence drives the limit","Follow the limit to the consequence determination and screen on that. Logistics applies too"],
      ["Hydraulic system seal, limited by cure date","The material ages in storage. Nothing about the consequence of a single seal failing","Fails the safety-critical screen. Usually controlled within the parent CI\u2019s documentation"],
      ["Structural sealant, limited by shelf life","Shelf life of the material as supplied","Fails the safety-critical screen. Normally a specification callout, not a CI"],
      ["Emergency battery, limited by service life","Capacity degrades with age. Its protective role is a separate question from its limit","Ask the safety team about the protective function. Screen the rest regardless, where logistics usually applies"]
    ]),
    C("Screen the item, not the label",[
      "The word \u201clife-limited\u201d sorts limits, not items. Two items carrying the same label can land in completely different places, and one item can have more than one reason for its limit.",
      "**An aircraft lithium main battery is the example worth remembering.** It has a service life limit, which suggests a routine replacement item. It can also fail in a way that starts a fire, which is a hazard the battery itself causes. The limit tells you nothing about that. The screen does."
    ])
  ], check:{
    q:"A hydraulic seal carries a cure-date shelf life. Does the life limit make it a Configuration Item?",
    o:["Yes. A life limit is a form of criticality designation",
       "Yes, because life-limited items always require tracking",
       "No. The limit is a maintenance control and designates nothing. Screen the seal on consequence and on the other screens, and record where it is controlled if it is not designated",
       "No, and no further screening is needed once the limit is identified"],
    a:2,
    why:"The limit says the material ages in storage. It says nothing about what happens if the seal fails, which is what the safety-critical screen asks. A seal like this usually fails every screen and is controlled within its parent CI\u2019s documentation. But that is a screening outcome you record, not something the life limit decided for you. The last option makes the opposite error: the limit ends no assessment either."
  }},

  {id:"M1-18", title:"Critical influencing parts", body:[
    P("This one is narrow, and it comes almost entirely from engines. It is worth a section because it is the case that defeats a careless screen."),
    P("The approved life of an engine life-limited part, a compressor disc for example, is calculated from a model. That model assumes things about the disc\u2019s working environment: the loads on it, the temperatures it sees, how it is clamped and spaced. Other parts set those conditions. A spacer, an air seal, a tie bolt. In engine work these are called **critical influencing parts**."),
    P("An influencing part carries no life limit of its own. Its own failure is not hazardous. What it does is hold up the assumptions behind somebody else\u2019s stamped life."),
    S("Change an influencing part, and the life stamped on the disc may no longer be valid.",
      "The disc has not changed. Its paperwork has not changed. The calculation behind its life has, and nobody was told. The part keeps flying inside a limit that was computed for conditions that no longer apply."),
    P("Against the screens, an influencing part behaves in a way that catches people out:"),
    L(["**It fails the safety-critical screen**, by its own definition. Its own failure has no hazardous effect, so citing that screen would be wrong.",
       "**It can pass the system-functioning screen**, where the life basis of a safety-critical part depends on its configuration. A change to it needs its own effectivity address, because somebody has to be able to ask which discs were assembled with which spacer.",
       "**CM does not identify influencing parts.** That is lifing analysis. It belongs to propulsion, or to the engine manufacturer. CM asks, per life-limited part, whether influencing parts exist for its life basis, and screens whatever comes back."]),
    C("If the engine is a commercial or vendor-controlled item, stop",[
      "CM does not decompose a commercial or vendor-controlled item into smaller CIs. Where the engine is procured as a catalog or vendor-controlled item, **the engine is the CI.** Its internal parts are not CIs, and its critical influencing parts are not CIs either.",
      "They are controlled inside the engine\u2019s own documentation, under the vendor\u2019s design authority. Your question is no longer a selection question. It becomes a flowdown question: does the vendor notify you when they change one, and what does your change process do with that notice? That is what the change and discontinuance notification requirement in Module 2 exists for.",
      "**The influencing part becomes a CI candidate only where your company holds design authority over the engine or the module containing it**, or where the part is separately procured and managed at your level."
    ]),
    P("The general lesson outlives the engine case. Run every screen, not just the one that brought the candidate to your attention. An influencing part screened against the safety-critical screen alone gives you a clean no, and the no is correct. Stopping there is the mistake.")
  ], check:{
    q:"An engine is procured as a vendor-controlled catalog item. The manufacturer identifies two critical influencing parts for the fan disc life model. Do you designate them as Configuration Items?",
    o:["Yes. Anything affecting a life-limited part is designated",
       "Yes, but at a lower level than the engine",
