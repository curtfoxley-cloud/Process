       "No. The engine is the CI, and a commercial or vendor-controlled item is not decomposed into smaller CIs. The influencing parts are controlled inside the engine\u2019s documentation, and your control is the vendor\u2019s change notification",
       "No, and the manufacturer\u2019s information can be disregarded"],
    a:2,
    why:"Decomposing a vendor-controlled item into CIs claims a level of control your company does not hold and cannot exercise. The engine is the CI. What the influencing-part information changes is your flowdown: you need to know when the vendor changes one, which makes the change and discontinuance notification requirement load-bearing rather than routine. Disregarding the information is the other error, because it is exactly what tells you which notices matter."
  }},

  {id:"M1-19", title:"Worked examples: is it a CI?", body:[
    P("Two steps, in order, every time: the end-use function gate, then the criteria screen. Most of the difficulty in practice is not the rule. It is being honest about which step an item actually fails."),
    TABLE(["Candidate item","How it screens","Verdict"],[
      ["Hydraulic reservoir assembly storing and conditioning fluid for the flight control system","Passes the gate: it performs a defined system function. Meets the system-functioning screen: the system cannot operate without it. Also the logistics screen: provisioning and maintenance documentation","**CI.** Designate, and list both criteria"],
      ["A structural fastener, one of eleven thousand, called out by specification on the assembly drawing","Fails the gate: no system end-use function of its own","**Not a CI.** Controlled by the specification called out in the parent CI\u2019s documentation"],
      ["The operational flight program running on the flight control computer","Computer software. A rule, not a judgement: it does not need a criterion","**CI.** Designate as a software CI"],
      ["Cabin sidewall trim panel: cosmetic, no load path, no functional role","Fails the gate","**Not a CI.** Controlled within the parent CI\u2019s documentation"],
      ["A commercially procured inertial measurement unit embedded in the navigation subsystem","Passes the gate. Meets the system-functioning screen, the separate-identity screen: it carries its own version identity, and the logistics screen","**CI.** Who designed it and who owns it are not criteria"],
      ["Landing gear uplock actuator whose failure can prevent gear extension","Passes the gate. Meets the safety-critical screen squarely, and almost certainly the system-functioning screen","**CI.** And the safety-critical screen is a floor requirement: non-designation would need System Safety concurrence and a floor gate disposition"],
      ["Ground support test set delivered under the contract, with its own type designation and technical manual","Passes the gate: support equipment performs a defined function for the system. Meets the separate-identity and logistics screens","**CI.** Support equipment is screened on the same terms as flight hardware"],
      ["A wiring harness between two CIs, procured to a company drawing","Passes the gate: it carries defined signal and power interfaces. Whether to designate turns on the screens: separate provisioning and maintenance action? Long lead or sole source?","**Judgement.** Screen it honestly and record the rationale either way"],
      ["A drag brace fitting carrying a customer-assigned critical safety designation","The designation satisfies the gate and answers the safety-critical screen. The customer assignment also meets the Acquirer-designation screen, and sustainment reach brings the logistics screen","**CI.** CM records the designation: it does not re-determine it, and lists every screen that applies"],
      ["A cargo fire suppression bottle with a shelf-life limit, on no critical-parts list","The limit answers nothing. Whether its protective function is safety-critical is a safety determination, so ask. Then screen the rest regardless, where the logistics screen usually applies","**Ask, then screen.** Designate on whichever screens it passes, and name the parent if it passes none"],
      ["A spacer that sets the boundary conditions in a life-limited disc\u2019s approved life model","Fails the safety-critical screen by its own definition: no hazardous failure of its own. Passes the system-functioning screen: the disc\u2019s stamped life depends on this part\u2019s configuration","**CI on system functioning.** And a decision not to designate still gets System Safety visibility"]
    ]),
    P("Two worked questions, walked the way you should walk them out loud:"),
    STEPS([
      {h:"A valve the Acquirer has placed on their designated CI list, which your team thinks is too small to warrant it", b:"Gate: it performs a defined function, so it passes. Screen: the Acquirer-designation screen is met the moment the Acquirer designates it. Nothing else needs to apply. **Designate.** The judgement about whether it \u2018warrants\u2019 designation is not yours to make for an Acquirer-controlled item: final designation authority there rests with them. Record the Acquirer-designation screen as the basis and move on."},
      {h:"A battery pack that is not critical to the mission, is not safety-critical, and is neither novel nor high value, but requires danger tag-out and a dedicated maintenance procedure", b:"Gate: passes. Screen: system functioning, no. Safety-critical, no. Technology, no. Risk-and-cost, no. Logistics, **yes**: it requires logistics elements. **Designate.** One YES is sufficient, and the logistics screen is the one newcomers most often forget to look at, because it has nothing to do with how impressive the item is."}
    ]),
    C("Two errors to watch for in yourself",[
      "**Failing an item at the gate because you would rather not designate it.** The gate asks one question: does this satisfy a system end-use function, and \u201cthat would be inconvenient\u201d is not an answer to it. If an item passes the gate and no criterion applies, say exactly that. The screen is where a defensible no comes from.",
      "**Passing an item at the screen because it feels important.** Importance is not a criterion. Name the criterion, or do not designate."
    ])
  ], check:{
    q:"A program declines to designate an item, reasoning that it is a commercial part bought to a vendor\u2019s part number and that the company holds no design authority over it. Is the reasoning sound?",
    o:["Yes: items the company does not design are controlled by the vendor rather than designated",
       "Yes, provided the vendor is a qualified source",
       "No: design ownership is not among the criteria; the item is screened on the same terms as anything else",
       "No: commercial items are always designated"],
    a:2,
    why:"The gate asks about end-use function and the screen runs the seven questions. Neither asks who drew it. A commercial item can easily meet the separate-identity screen for its own version identity, the logistics screen for provisioning, or the risk-and-cost screen where it is sole-source, and buying it rather than designing it changes none of that. \u201cAlways designated\u201d is equally wrong: it still has to meet something."
  }},

  {id:"M1-20", title:"The selection assessment record", body:[
    P("You have now been told several times to record the rationale for every candidate. Here is the artifact that instruction refers to. One assessment per candidate, and it is short."),
    TABLE(["What it carries","Why that field is there"],[
      ["The candidate item, and the part or model reference it is known by today","So the assessment can be found again by someone who knows the item under a different name than you did"],
      ["The assessor and the date","So a later reader knows who judged it and what was known at the time. Assessments made before a hazard analysis existed read differently from ones made after"],
      ["The end-use function gate result","The two steps are separate, and a reader needs to know which step an item failed. Failing the gate and failing the screen are different facts about an item"],
      ["Each criterion, with a yes or no and the rationale for that answer","Not just the ones that were met. A recorded \u201cno\u201d against the logistics criterion is a claim someone made and can be challenged"],
      ["The software rule where it applies, and the safety linkage","Including System Safety concurrence where a safety-critical item is not designated: the concurrence lives with the assessment, not in somebody\u2019s inbox"],
      ["The disposition, and where the parent\u2019s documentation controls the item if it is not designated","A rejected candidate is not released into the wild. The assessment names what does control it"]
    ]),
    S("A \u201cno\u201d with a reason is a decision. A \u201cno\u201d with no record is indistinguishable from never having looked.",
      "This is the difference the Acquirer is testing when they ask why a particular assembly is not a CI, and the answer they are hoping not to hear is that it simply is not on the list."),
    P("Assessments are retained for the program life alongside the rest of the identification records, and they are **re-run on trigger rather than replaced.** Design evolution, a new hazard analysis, an Acquirer designation, a change in the supportability strategy, each re-opens the question for the affected candidates. The retained record is what the next assessment starts from, so the work is a re-evaluation rather than a fresh guess by whoever holds the job that year."),
    C("What a usable rationale looks like",[
      "**Weak:** \u201cN/A.\u201d \u201cNot required.\u201d \u201cToo small.\u201d None of these can be checked, and none tells the next person anything.",
      "**Usable:** \u201cNot designated. Fails the end-use function gate, no independent function; controlled by the material specification called out on the parent CI\u2019s drawings.\u201d \u201cDesignated. Safety-critical screen, hazard analysis rates failure as capable of causing loss of primary system capability; also logistics screen, dedicated depot test set and technical manual.\u201d"
    ])
  ], check:{
    q:"Why does the assessment record carry the assessor and date, and why is it retained rather than overwritten when the assessment is re-run on trigger?",
    o:["For audit traceability only: the content of a superseded assessment has no further use",
       "Because personnel changes require reassignment of the record",
       "Because a later reader needs to know what was known at the time, and because the retained assessment is what the re-run starts from rather than a fresh guess",
       "Because the Acquirer requires a complete revision history of every selection decision"],
    a:2,
    why:"Selection is iterative, so assessments accumulate rather than replace one another. Knowing an item was screened before the hazard analysis existed explains an answer that would otherwise look careless, and the previous rationale is the most useful input the next assessor has."
  }},

  {id:"M1-21", title:"Dividing software into CIs", body:[
    P("That software is designated as a CI is a rule. **How much software constitutes one CI is a judgement**: and the training so far has given you no way to make it, because every worked example has been hardware."),
    P("A software CI is an aggregate of software that satisfies an end-use function and is designated for purposes of specification, interfacing, qualification testing and configuration management. It is composed of one or more software units: source code, object code, control code, control data, or a collection of these. Read that definition closely and the questions fall out of it, and they are the familiar ones:"),
    L(["Does this aggregate satisfy an **end-use function** of its own, or is it a part of something else\u2019s function?",
       "Will it be **specified** separately: does it get its own requirements document?",
       "Does it have **interfaces** of its own that need defining and controlling?",
       "Will it be **qualification tested** as a unit, against its own requirements?",
       "Does it need its own **version identity and change effectivity**: will it be re-versioned and fielded on its own schedule?"]),
    CARDS([
      {h:"Divided too coarsely", b:"One software CI for an entire load. Every correction to any part re-versions the whole thing, so the version identifier stops telling anyone what actually changed. The qualification scope for a display string change is the entire load. And the effectivity address is shared, so nothing can be fielded independently of anything else."},
      {h:"Divided too finely", b:"Dozens of software CIs, each carrying a specification, a version identity, a qualification basis and its own interfaces. The integration burden is real and the version matrix, which build of each is compatible with which build of the others: becomes a management product in its own right."}
    ],2),
    S("The same failure directions as hardware, for the same reason: the CI is the unit of separate management, and separate management has a cost in both directions.",
      "If a piece of software will be specified, tested, versioned and fielded on its own, it is its own CI. If it travels with its neighbours in all four, it is a unit within theirs."),
    P("Two rules sit alongside the judgement. **Elements of the software development environment that form part of the system get product-unique identifiers**: compilers, linkers, loaders, developmental libraries, configuration settings, automation scripts. They are identified not because they satisfy an end-use function but because the build cannot be reproduced without them. And **firmware follows the arrangement, not the technology:** where the code and its device are controlled together on a single altered item drawing, one part number represents the device with the code in it; where they are controlled separately, the code is its own software CI with its own version identifiers.")
  ], check:{
    q:"A flight display application and the control laws it renders are written by one team, run on one processor, and are loaded as a single image. Each is separately specified, separately qualification tested against its own requirements, and re-versioned on its own schedule. One software CI or two?",
    o:["One: they share a processor and are delivered as a single load",
       "One, with the control laws recorded as a unit within it",
       "Two: separate specification, separate qualification and separate version and effectivity needs are exactly what designates separately",
       "Two, but only if the control laws are safety-critical"],
    a:2,
    why:"Sharing a processor and a load image is a packaging fact, not a management one, in the same way that sharing an interface control document does not make two hardware items one CI. Separate specification, separate qualification basis and independent re-versioning are three of the questions that define a software CI, and here all three point the same way."
  }},

  {id:"M1-22", title:"Selecting at the right level", body:[
    P("Select CIs at the level optimum for **both acquisition and support**: the level at which items are specified, contracted, accepted, and at which logistics organises and reports maintenance and modification actions. Both failure directions are real and both are expensive."),
    CARDS([
      {h:"Over-designation", b:"Hundreds of CIs at fastener and bracket level. Every trivial change becomes formal change traffic against its own CI. Board time consumed by triviality, real changes queued behind noise, status accounting nobody reads. Control degrades because there is too much of it."},
      {h:"Under-designation", b:"Whole subsystems buried inside one CI. Changes to distinct functions share one effectivity address, so they cannot be cut in independently. Hazard traceability stops above the item that causes the hazard. Logistics cannot report maintenance at the level it is performed."}
    ],2),
    C("A useful test when you are unsure",[
      "**Will a change to this item routinely need to be dispositioned, tracked and cut into service independently of its neighbours?**",
      "If yes, it needs its own effectivity address, one of the main reasons separate CIs exist. If changes will normally travel with the parent, it does not."
    ])
  ], check:{
    q:"A program has 340 CIs, most at individual bracket and connector level. What is the practical consequence?",
    o:["Excellent visibility and control, at some administrative cost",
       "Unmanageable change traffic, with real changes queued behind trivial ones: control degrades because there is too much of it",
       "A compliance finding, but no operational effect",
       "Reduced audit scope, since each CI is small"],
    a:1,
    why:"Over-designation is not over-control; it is a different kind of loss of control. Board time goes to triviality, status accounting stops being read, and genuine changes wait behind noise."
  }},

  {id:"M1-23", title:"The CI structure", body:[
    P("Selection produces a set of CIs. Structure puts them in an order, and the order does real work, because it is what defines the parents, the boundaries and the reporting lines everything downstream uses."),
    P("A product structure is built by decomposing the system into its levels of assembly. The conventional five, top to bottom:"),
    STEPS([
      {h:"System or end item", b:"The final combination of end products, component parts, software and materials, ready for its intended use."},
      {h:"Subsystem", b:"A combination of assemblies performing an operational function within the system: a major subdivision of it."},
      {h:"Assembly", b:"Parts or subassemblies joined to perform a specific function, and capable of disassembly."},
      {h:"Subassembly", b:"Two or more parts forming a portion of an assembly, replaceable as a whole but with individually replaceable parts."},
      {h:"Part", b:"One piece, or pieces joined so that they are not normally taken apart without destroying their designed use."}
    ],"tl"),
    S("CIs may be designated at any level of assembly.",
      "The levels describe the product. They do not tell you where the CIs go: that is the selection judgement of the previous section. What they give you is a shared vocabulary for arguing about it."),
    P("For each CI, record its parent, its children, and the owning design activity. Then two designations that decide who is in charge of what:"),
    CARDS([
      {h:"Acquirer-controlled", b:"The CIs the Acquirer specifies, baselines and controls. Their designation is the Acquirer\u2019s to make, their product baseline is the Acquirer\u2019s to establish, and changes to them run to the Acquirer\u2019s approval authority."},
      {h:"Supplier-controlled", b:"Below the Acquirer-controlled level, **the Supplier determines** which items to place under internal configuration management and what documentation types to use. This is not a gap in control: it is control exercised by your company, on its own authority, against the same criteria."},
      {h:"Sub-tier developed", b:"An item developed by a sub-supplier is a CI **from your company\u2019s point of view**, and equivalent CM requirements are flowed down to the organisation that builds it. That sentence is the entire premise of Module 2."}
    ],3),
    P("Each CI also carries a **type**: hardware, software, or firmware. The first two are what they sound like. Firmware is the case where code and the device it lives in are managed as one thing, and it is worth flagging in the index precisely because it is the type people forget has two natures."),
    C("Where everything that is not a CI lives",[
      "Every part sits somewhere in the product structure. Not everything in the product structure is a CI, and the items that are not are controlled within their parent CI\u2019s configuration documentation.",
      "**Which is why a rejected candidate has to name its parent.** \u201cNot a CI\u201d is only half an answer. The other half is which CI\u2019s documentation controls it, and an assessment that stops at the first half has left the item genuinely uncontrolled rather than controlled elsewhere."
    ])
  ], check:{
    q:"An assembly sits two levels below the lowest Acquirer-controlled CI. Who decides whether it is placed under configuration management, and against what?",
    o:["Nobody: below the Acquirer-controlled level, items are controlled only by the drawings that define them",
       "The Acquirer, since all designation authority is theirs",
       "The Supplier, applying the same criteria and determining the documentation types to use",
       "The sub-supplier who builds it, under their own CM system"],
    a:2,
    why:"Below the Acquirer-controlled level the Supplier determines which items to place under internal configuration management and what documentation types apply. The authority changes hands; the criteria and the discipline do not. And where the item is developed by a sub-supplier, it is a CI from your company\u2019s point of view with equivalent requirements flowed down, not a matter left to their own system."
  }},

  {id:"M1-24", title:"The nine activities", body:[
    P("The process is **iterative, not sequential-once**. Selection begins early, typically before or at the system functional and requirements reviews, and is revisited as the design matures and at every baseline establishment."),
    TABLE(["#","Activity","Principal output"],[
      ["1","Candidate CI identification","Candidate list; the decomposition basis for the CI structure"],
      ["2","Application of selection criteria","Assessments with rationale for every candidate; selected-CI determinations"],
      ["3","CI structure and hierarchy","Parent/child and owning design activity; Acquirer- vs Supplier-controlled designation"],
      ["4","Interface identification and recording","Interface register; coverage verification; signed no-interface determinations"],
      ["5","Acquirer review and concurrence","Submittal; concurrence or direction records; concurred CI list"],
      ["6","Identifier assignment","PINs, unit identifiers, nomenclature, software versions, document identifiers"],
      ["7","Configuration documentation determination","Documentation type recorded against each CI"],
      ["8","Baseline establishment","FBL, ABL, PBL per CI with approved change status"],
      ["9","Maintenance and iteration","Updated index, register and submittals; status accounting records of every change"]
    ]),
    C("Where modelling is used, the CI structure mirrors the model",[
      "The CI hierarchy and the architecture model are **two views of one decomposition, and shall not diverge.** Preferred schemes are the ATA chapter scheme or the S1000D standard numbering system, in SysML or UAF conventions. Where no model exists, the CI structure follows the engineering product structure.",
      "This is not a formality. A CI structure that has drifted from the model means two authoritative decompositions of one product, and the moment they disagree, nobody can say which is right."
    ],"teal"),
    P("**Re-evaluate on trigger:** design evolution introducing new items, functions or interfaces; changes to the architecture decomposition; new or revised hazard analyses; changes to supportability strategy or procurement decisions; contract changes including Acquirer designation or de-designation; and non-interchangeable modifications requiring a PIN change.")
  ], check:{
    q:"A program\u2019s CI index is organised by the contract work breakdown structure, while its architecture model decomposes the system by ATA chapter. What is the problem?",
    o:["None: the two serve different purposes and may legitimately differ",
       "The WBS is the wrong basis for any CI structure",
       "Two authoritative decompositions of one product exist; when they disagree, nobody can say which is right",
       "The model should be rebuilt to match the contract"],
    a:2,
    why:"Where modelling is used the CI structure mirrors the model: they are two views of one decomposition. Divergence makes every subsequent structural decision contestable. The fix is realignment by CM and Systems Engineering jointly, not a unilateral change to either."
  }},

  {id:"M1-25", title:"When the work happens", body:[
    P("The activities are iterative, but they are not evenly spread across a program. Each has a normal moment, and each has something that must already exist by the time it arrives."),
    STEPS([
      {h:"System requirements and functional reviews", b:"Candidate identification and the first pass of selection. The **functional baseline** is established at or after the system functional review, documented by the functional configuration documentation. The proposed CI list goes to the Acquirer for review and concurrence around here, and interface coverage is verified at that submittal."},
      {h:"Preliminary design review, per CI", b:"The **allocated baseline** for a CI is established at or after its preliminary design review. Which means the allocated documentation for that CI: its allocated requirements, its interfaces with the CIs it touches, and its verifications: must exist and be approved by then. A CI still under debate at its own preliminary design review has a baseline problem, not a paperwork problem."},
      {h:"Critical design review", b:"The **product baseline** is initially established at completion of critical design review, on the released detailed design definition."},
      {h:"First production unit delivery, or physical configuration audit", b:"The product baseline is formalised no later than this point, and where the Acquirer establishes it, they do so on successful completion of the physical audit and approval of the product specification."},
      {h:"Throughout, and afterwards", b:"Re-evaluation on every trigger. Resubmittal to the Acquirer on every iteration. Interface coverage verified at CI-list submittal, at each technical review, and before each baseline establishment. Identification does not finish; it is maintained."}
    ],"tl"),
    S("Selection that starts at critical design review is not selection.",
      "It is documentation of whatever happened to be built. By then the structure, the interfaces, the effectivity addresses and the audit scope have all been decided by default, and every one of them will be expensive to undo."),
    C("What is fixed and what is not",[
      "These are the normal points, and a contract can move them. What does not move is the **dependency order**: you cannot allocate requirements to a CI you have not selected, cannot baseline documentation that has not been released, and cannot audit against a baseline that was never established.",
      "So when a program compresses its schedule, the question to ask is not which review slipped. It is which dependency the compression assumes away."
    ])
  ], check:{
    q:"A CI is approaching its preliminary design review. What must exist and be approved by that point?",
    o:["Its detailed design definition, since the product baseline follows immediately",
       "Its allocated configuration documentation: the requirements allocated to it, its interface requirements, and its verifications, because the allocated baseline is established at or after that review",
       "Only the system specification; CI-level documentation follows critical design review",
       "Its selection assessment, and nothing further until critical design review"],
    a:1,
    why:"The allocated baseline is established at or after a CI\u2019s preliminary design review, and a baseline is made of its documentation, so the allocated set has to be there and approved. The detailed design belongs to critical design review and the product baseline; the selection assessment should have been done considerably earlier."
  }},

  {id:"M1-26", title:"Where the model is the decomposition", body:[
    P("On a program using model-based systems engineering, the CI structure does not get to be its own idea. The CI parent-and-child hierarchy mirrors the decomposition method of the architecture model, because the two are one decomposition seen twice."),
    CARDS([
      {h:"The preferred schemes", b:"Decomposition by ATA chapter, or by the standard numbering system used across the technical data suite, implemented in the program\u2019s modelling conventions. Each CI carries the corresponding chapter or numbering reference as an attribute in the index, so the CI structure and the technical data agree about where an item sits."},
      {h:"When the model uses something else", b:"Functional thread, zonal, work-breakdown-based: the CI structure mirrors **that** method. The rule is not \u201cuse the preferred scheme.\u201d It is \u201cdo not maintain a second, independent decomposition.\u201d Record the mapping convention, and note any contract-driven exception: an Acquirer-directed CI level, say: explicitly in the index."},
      {h:"When there is no model", b:"The CI structure follows the engineering product structure, the bill of material hierarchy. There is still exactly one decomposition. It simply lives somewhere other than a model."}
    ],3),
    P("Alignment is not a one-time reconciliation you perform and then trust. Four practices keep it true:"),
    L(["**Cross-reference in both directions.** The model element identifier recorded against the CI in the index, and the CI identifier carried as a property of the model element. A one-directional link rots silently: you discover it when something at the far end has already been deleted or renamed.",
       "**Treat model decomposition changes as triggers.** A change to how the model decomposes the system re-opens CI structure selection. Once the structure is baselined, structural changes are processed through formal change action like anything else.",
       "**Verify alignment at each technical review and before each baseline establishment.** Every Acquirer-controlled CI resolves to a model element, and every model element at the CI-designation level has actually been screened against the criteria, not assumed to have been.",
       "**Run the interface check both ways.** Every interface element in the model resolves to a register row, and every register row to a model element."]),
    S("A verdict that does not match the model is held, not recorded.",
      "Where a same-CI-or-separate decision disagrees with the model, it goes to Systems Engineering for model disposition before it enters the index. Recording it anyway is exactly how two decompositions begin to drift, one entry at a time, each perfectly defensible on its own."),
    C("Why this is a CM problem, not a modelling preference",[
      "Two authoritative decompositions of one product is not an untidiness. Every structural question afterwards, which CI is the parent, which pair of items forms a boundary, which effectivity address a change belongs to: now has two answers and no principled way to choose between them.",
      "**And the fix is never unilateral.** CM does not re-cut the model, and Systems Engineering does not re-cut the CI index. Realignment is done jointly and recorded, because whichever one you quietly edited, you have just created the divergence you were trying to close."
    ],"teal")
  ], check:{
    q:"A program\u2019s architecture model decomposes the system by functional thread rather than by either preferred scheme. What does the CI structure do?",
    o:["Follows a preferred scheme, since that is the standard the technical data uses",
       "Mirrors the functional thread decomposition, with the mapping convention recorded: the obligation is one decomposition, not one particular scheme",
       "Follows the engineering product structure instead, as a neutral basis both sides can accept",
       "Is held until the model is rebuilt to a preferred scheme"],
    a:1,
    why:"The preference is real but it is a preference. The obligation is that the CI structure and the model remain one decomposition. Mirroring a non-preferred scheme satisfies it; building a preferred-scheme CI structure alongside a functional-thread model creates precisely the divergence the rule exists to prevent. The product structure is the fallback for programs with no model at all, not a neutral third option."
  }},

  {id:"M1-27", title:"Interfaces: coverage, not content", body:[
    P("This is where CM engineers most often misunderstand their own role."),
    CARDS([
      {h:"Systems Engineering does", b:"Identifies internal interface requirements between CIs and external interfaces with other systems, facilities and support equipment. Signs the no-interface determinations. Verifies technical adequacy through the technical review process."},
      {h:"CM does", b:"Records the identification in the register. Verifies coverage. Controls the interface documentation products: identifiers, release, inclusion in the documentation determination. Confirms a representative is designated where an interface control working group exists."}
    ],2),
    P("The CI structure defines a **finite** set of boundaries: every pair of interfacing sibling CIs, every boundary to an external system, and every boundary between Acquirer-controlled and Supplier-controlled levels. Because the set is finite, coverage is checkable, which is the whole reason the register is keyed to the structure."),
    S("Where a boundary has no interface, the register records an explicit no-interface determination signed by Systems Engineering.",
      "A blank cell is indistinguishable from an oversight. A signed determination is a decision with an owner."),
    P("Verify coverage at three points: at CI-list submittal for Acquirer concurrence, at each technical review, and before each baseline establishment. Where modelling is used, add the two-way check that every model interface element resolves to a register row and every row to a model element."),
    C("The interface control working group",[
      "Where an interface crosses organisations: between two suppliers, or between the system and another system: the Acquirer may run a working group to control it. Where one exists, a representative is provided, and the representative is **empowered to commit** your company to specific interface actions and agreements.",
      "The role carries real obligations: provide the agreed draft interface documentation the specified period before the meeting; update, release, control and re-release the interface documentation reflecting the group\u2019s decisions; and distribute the released documentation to the other participants. CM confirms the representative is designated and records which interfaces are working-group controlled.",
      "**A representative who cannot commit is an observer**: and the group will settle the interface without your company\u2019s position in it."
    ],"teal")
  ], check:{
    q:"Systems Engineering asks you to confirm that the interface requirements between two CIs are technically adequate. What do you do?",
    o:["Confirm it, since CM maintains the interface register",
       "Decline, and offer instead the coverage status, the documentation identified against that boundary, and its controlling baseline",
       "Confirm it after reviewing the interface control document",
       "Refer them to the Acquirer"],
    a:1,
    why:"CM verifies coverage, not adequacy. Accepting would put CM outside its competence and, worse, create a record suggesting interface content had been reviewed when it had not. Offer what CM actually holds."
  }},

  {id:"M1-28", title:"Determining the documentation, and the records you keep", body:[
    P("For each CI, determine the documentation that defines its performance, functional, and physical attributes: interfaces included. This is not a filing decision. The documentation type follows three facts about the item: its maturity, who owns the design, and the level at which it is controlled."),
    CARDS([
      {h:"Performance specifications", b:"For Acquirer-controlled items on performance-based contracts: what the item must do and how that is verified, leaving the design solution to the Supplier."},
      {h:"Detail definition", b:"Detail specifications, drawings, and models where design disclosure is required: the full description of the design solution itself."},
      {h:"Commercial and privately developed items", b:"Commercial item descriptions or form-fit-function data: enough definition to procure, apply, and replace the item without owning its design."}
    ],3),
    P("The interface information identified against each boundary is incorporated into the determined documentation, in the applicable specifications directly, or through referenced interface documentation. An interface defined nowhere in the documentation set is an interface the baseline does not control."),
    P("The whole identification effort then lives in two records, and their structure is where most of this module\u2019s rules become visible. A well-formed CI index row carries:"),
    L(["The hierarchy level, the CI identifier, and the parent: the structure, expressed consistently three ways.",
       "Nomenclature, the CI type: hardware, software, or firmware, and the Acquirer- or Supplier-control designation.",
       "The owning design activity and its enterprise code, the PIN, and the specification reference.",
       "The safety-critical flag with its hazard reference: the product-level binding of the hazard log.",
       "Baseline status per baseline, audit designation status, and the item\u2019s status."]),
    S("De-designated rows are retained, never deleted, and where one CI carries several part-number variants, the CI-to-PIN variant mapping is recorded in full.",
      "An index that shows only the current answer cannot show that judgement was exercised. And every change and record made under the old designation still points at that identifier: delete the row and they point at nothing."),
    P("The interface register is the second record, and its one structural decision does most of the work: **rows are boundaries, not documents.** Each row carries the boundary type: internal CI-to-CI, external, or a control-level boundary between Acquirer- and Supplier-controlled tiers, and then either the defining documentation with its revision, or the signed no-interface determination. Then: the controlling baseline: system-boundary interfaces belong to the functional baseline through the system specification, CI-to-CI interfaces to the allocated baseline through the item specifications: the control authority, the safety-related flag with its hazard control reference, variant applicability per part-number variant, and, where modelling is used, the model element identifier."),
    C("Why boundaries and not documents",[
      "One interface control document may appear on several boundary rows, and one boundary may cite several documents. A register keyed to documents can list everything it has and still not show what is missing. The boundary set is finite and derived from the CI structure, so a boundary-keyed register can be checked for coverage, which is the register\u2019s whole point."
    ],"teal")
  ], check:{
    q:"A CI is de-designated after the Acquirer concurs it no longer warrants separate control. What happens to its row in the CI index?",
    o:["Deleted: the index reflects the current CI set",
       "Moved to an archive file outside the index",
       "Retained, with the status changed to de-designated",
       "Retained only if the CI was safety-critical"],
    a:2,
    why:"Designation history is part of the traceability record. Changes, status entries, and audit results made while the item was a CI all reference that identifier: deleting or exporting the row orphans them. The status field exists precisely so the index can hold the full history and still answer \u201cwhat is a CI today?\u201d with a filter."
  }},

  {id:"M1-29", title:"Acquirer concurrence", body:[
    S("Potential CIs must be selected AND submitted for Acquirer review and selection concurrence.",
      "A program that has selected excellent CIs and never submitted them is non-compliant."),
    P("Read the underlying requirement carefully: it requires potential CIs to be selected **and submitted** for Acquirer review and concurrence. Selection alone does not satisfy it."),
    L(["**Submit** the proposed CI list: candidates, selection results and rationale, for Acquirer review and concurrence.",
       "**Resubmit** when the design evolves, when new candidates emerge, and when designated CIs are proposed for de-designation.",
       "**Remember** that final designation authority for Acquirer-controlled CIs rests with the Acquirer. Selection is iterative, so concurrence is too."]),
    P("Below the Acquirer-controlled level, the Supplier determines which items to place under internal configuration management and what documentation types to use. Subcontractor-developed items are CIs from the Supplier\u2019s point of view, and equivalent CM requirements are flowed to the subcontractor, which is where Module 2 begins.")
  ], check:{
    q:"A program has applied the criteria carefully, recorded rationale for every candidate, and produced a well-structured CI index. It has never submitted the list to the Acquirer. Where does it stand?",
    o:["Compliant, since the requirement is about selection quality",
       "Compliant, provided the list is delivered at the next design review",
       "Non-compliant: the requirement is to select AND submit for review and concurrence",
       "Compliant for Supplier-controlled CIs only"],
    a:2,
    why:"Selection alone does not satisfy the requirement. Treat submittal as part of selection rather than a follow-on task, and resubmit on every iteration, because designation authority for Acquirer-controlled CIs is not yours."
  }},

  {id:"M1-30", title:"Same CI or separate CIs: the principle", body:[
    P("Two or more items carry different part numbers and look closely related: same function, same subsystem, same vendor. Do they share one CI identifier with part-number variants, or get designated separately? This is the most common judgement call you will be asked to make."),
    S("The CI identifier follows function and the management need for separate control. The PIN follows form, fit and function.",
      "They answer different questions and are decoupled on purpose."),
    CARDS([
      {h:"Multiple PINs under one CI", b:"Variants of one managed function that are not interchangeable with each other: different interface details, say, but share one specification basis, one verification basis, and common change effectivity. Example: three variants of one valve, tabulated in a single specification, changed as a family."},
      {h:"One PIN under multiple CIs", b:"The same physical item instantiated in subsystems performing distinct functions. Example: one antenna part number installed once in the UHF subsystem and once in MIDS JTRS, one PIN, two CIs. Each satisfies a different end-use function, sits in a different branch of the hierarchy, and needs its own effectivity address, hazard traceability and logistics reporting."}
    ],2),
    C("The thing to remember",[
      "Neither \u201cthey have different part numbers\u201d nor \u201cthey are the same part number\u201d decides the CI question. **Do not designate CIs to solve a part-numbering problem**: the PINs already capture non-interchangeability."
    ])
  ], check:{
    q:"One cooling fan part number is installed in the mission computer for processor thermal management, and in the environmental control unit as part of cabin air recirculation. How many CIs and how many PINs?",
    o:["One CI, one PIN: it is the same hardware",
       "Two CIs, two PINs: records should match",
       "Two CIs, one PIN: different end-use functions, different branches, different effectivity addresses; but one design definition",
       "One CI, two PINs: the installations differ"],
    a:2,
    why:"Different end-use functions and different parents drive separate CIs, and the two installations need independent effectivity addresses. Nothing about that creates a non-interchangeable condition, so the PIN does not split. Creating a second part number to \u201cmake the records match\u201d is designating identity to solve a bookkeeping discomfort."
  }},

  {id:"M1-31", title:"The gates, and four cautions", body:[
    P("Apply the gates in order, comparing the candidate items against each other. Any single separation trigger is sufficient: the gates are a logical OR."),
    TABLE(["Gate","Question","Trigger \u2192 result"],[
      ["G0","Does each item satisfy a system end-use function?","NO \u2192 not CI candidates. Control within the parent CI. Stop"],
      ["G1","Do the items warrant CI designation at all?","NO \u2192 parts, not CIs. The PINs already capture the differences. Stop"],
      ["G2","Same end-use function?","NO \u2192 separate CIs"],
      ["G3","Same parent in the CI hierarchy? (answer from the model where used)","NO \u2192 separate CIs"],
      ["G4","Is ANY of the items safety-critical?","YES \u2192 separate CIs"],
      ["G5","Can one specification define performance AND interfaces for all variants?","NO \u2192 separate CIs"],
      ["G6","Same verification requirements and verification plan?","NO \u2192 separate CIs"],
      ["G7","Will changes routinely need a separate effectivity address?","YES \u2192 separate CIs"],
      ["G8","Does Acquirer direction, nomenclature or logistics force separation?","YES \u2192 separate. NO \u2192 one CI, multiple PN variants"],
      ["G9 / G10","Where modelling is used: does the verdict match the model?","NO \u2192 hold and route to Systems Engineering. YES \u2192 record"]
    ]),
    CARDS([
      {h:"G4: safety separates on ANY item, not all", b:"A safety-critical variant sharing a CI with a non-critical one either forces the whole CI to inherit safety obligations, or blurs hazard-to-CI traceability. Both are worse than a second CI number. If all are safety-critical, they are also separated, each needs distinct hazard traceability."},
      {h:"G5: the ICD caution", b:"Appearing on the same interface control document is NOT evidence of a common interface. If the document distinctly calls out separate interfaces for each item, analyse it. Distinct callouts usually mean different mating definitions and different interface change traffic."},
      {h:"G6: verification is usually the deciding fact", b:"One qualification and acceptance basis must cover all variants. If the verification picture is unknown, which is common early on, obtain it before deciding. Deciding without it means deciding twice."},
      {h:"G7: effectivity is the day-to-day discriminator", b:"If a change to one variant must routinely be dispositioned, tracked and cut in independently, each variant needs its own effectivity address. If changes travel across the family, one CI suffices."}
    ],2),
    C("Recording a separate-CI verdict",[
      "Splitting a CI creates new boundaries, and they do not register themselves. On any separate-CI verdict, verify that **every pairwise boundary between the new sibling CIs** appears in the interface register or carries a signed no-interface determination."
    ])
  ], check:{
    q:"Three relays share a function and a parent, none is safety-critical, and their interfaces are described as \u201cslightly different.\u201d Verification requirements have not yet been established. What is the correct next step?",
    o:["Designate one CI with three part-number variants: nothing has triggered separation",
       "Designate three separate CIs, because the interfaces differ",
       "Obtain the verification answer before deciding; it is the open deciding fact, and analyse whether one specification can define interfaces for all three",
       "Escalate to the Acquirer for direction"],
    a:2,
    why:"G6 is frequently where the decision actually turns, and G5\u2019s ICD caution applies squarely to \u201cslightly different interfaces.\u201d Recognising that you cannot yet decide, and naming the fact you need: is the correct answer here."
  }}
,

  {id:"M1-32", title:"Worked examples: same CI or separate?", body:[
    P("Three walks through the gates. Notice in each how few gates actually do any work: the verdict nearly always turns on one, and your job is to find which."),
    STEPS([
      {h:"Two fuel pump variants, one safety-critical", b:"Same end-use function, same parent, and one specification could comfortably define both. Same verification basis. But hazard analysis classifies failure of the high-pressure variant as capable of causing loss of primary system capability, and the low-pressure variant\u2019s as not. **G4 triggers on ANY item being safety-critical, not all of them. Separate CIs.** Sharing one identifier would either force the non-critical variant to inherit the safety obligations, or blur hazard-to-CI traceability. Both are worse than a second CI number."},
      {h:"Two power distribution unit variants differing in input voltage", b:"Same function, same parent, neither safety-critical. One tabulated specification defines performance and interfaces for both. One qualification and acceptance basis covers both. Changes travel across the family and cut in together. Nothing triggers. **One CI, two part-number variants**: with the variant mapping recorded and the interface callouts tabulated per variant."},
      {h:"One antenna part number installed in two subsystems", b:"The reverse case, and the one that trips people. The same physical item is installed once in the communications subsystem and once in the navigation subsystem. G2 asks about end-use function, and these differ, so they separate. G3 asks about parents, and these differ too. **Two CIs, one part number.** Nothing here creates a non-interchangeable condition, so the part number does not split. Two CI identifiers, one design definition, and no second part number invented to make the records look symmetrical."}
    ],"tl"),
    P("Five shorter ones, with the gate that decides each:"),
    TABLE(["Scenario","Decides at","Verdict"],[
      ["Two display unit variants; the Acquirer directs that one carry its own nomenclature","G8","Separate CIs: external direction forces it"],
      ["Three cable assembly variants; a change to one is routinely dispositioned and cut in on its own schedule","G7","Separate CIs, each needs its own effectivity address"],
      ["Two valve variants, alike in every respect, but the qualification basis for the second has not been established","G6","Decide nothing yet. Obtain the verification answer: deciding without it means deciding twice"],
      ["Two connector variants appearing on one interface control document, with distinct callouts for each","G5","Analyse the callouts. Distinct callouts usually mean different mating definitions and separate interface change traffic, which separates"],
      ["Two brackets with different part numbers; neither meets any criterion on the screen","G1","Parts, not CIs. The part numbers already capture the difference: do not designate CIs to solve a part-numbering problem"]
    ]),
    C("What each verdict obliges you to record",[
      "**Separate CIs:** each gets its own hierarchy position, documentation determination, effectivity address and baseline management, and every pairwise boundary between the new siblings appears in the interface register or carries a signed no-interface determination.",
      "**One CI, multiple variants:** the variant mapping goes in the index, and the specification is tabulated by variant including per-variant interface callouts.",
      "**Either way:** submit for Acquirer concurrence, record the verdict with the gate that drove it, and re-run the assessment on trigger, including a variant later diverging in specification, verification, effectivity or safety classification."
    ])
  ], check:{
    q:"Which situation produces two CI identifiers but only one part number?",
    o:["Two variants of one managed function that are not interchangeable with each other",
       "The same physical item instantiated in two subsystems that perform distinct end-use functions",
       "An item whose nomenclature the Acquirer directs be split",
       "Two items with the same function whose verification bases differ"],
    a:1,
    why:"Different end-use functions and different parents drive separate CI identifiers, but nothing about installing one item in two places creates a non-interchangeable condition, so the part number does not split. The first option is the mirror image: one CI carrying several part-number variants. The identifiers are decoupled on purpose, and they move for different reasons."
  }}
,

  {id:"M1-33", title:"De-designation, splits and consolidations", body:[
    P("A CI structure is not a ratchet. Three mid-life changes have mechanics worth knowing before you meet one, because each touches identifiers, boundaries and records at the same time."),
    CARDS([
      {h:"De-designation", b:"An item stops being separately managed. For an Acquirer-controlled CI the designation was theirs, so the de-designation is theirs too: proposed, submitted and concurred like any other selection change. The item does not become uncontrolled: it returns to control within its parent CI\u2019s documentation, and **the parent has to be named.** The index row is retained with the status changed, never deleted."},
      {h:"Split", b:"One CI becomes two or more. CI identifiers change, because the management need changed. Part numbers do not move unless the split created a non-interchangeable condition, and unit identifiers never move at all. Every pairwise boundary between the new siblings appears in the interface register or carries a signed no-interface determination, and each new CI needs its own documentation determination, effectivity address and baseline management."},
      {h:"Consolidation", b:"Several CIs become one. The part-number variants come with it, and the variant mapping is recorded against the surviving CI. Boundaries that used to be interfaces between the old CIs become internal to the new one: those register rows are dispositioned, with the reason recorded, rather than quietly abandoned."}
    ],3),
    S("Identifiers move for management reasons. Part numbers move for interchangeability reasons. Unit identifiers never move at all.",
      "Three restructurings, one rule, and it is the same rule you met in the very first identifier section. Everything here is that principle applied while the program is running."),
    P("All three are selection changes, and they are treated as such: assessed against the criteria with the rationale recorded, submitted for Acquirer concurrence where the CIs are Acquirer-controlled, recorded in status accounting, and followed by a fresh interface coverage check. None of the three is a records-tidying exercise that CM performs alone."),
    C("Why the retained row matters more than it looks",[
      "Every change, every status entry, every audit result and every delivered unit\u2019s record made while the item was a CI still references that identifier. Delete the row and all of them point at nothing.",
      "**The index answers two different questions:** what is a CI today, and what was a CI when this record was written. A status field answers both. A deletion answers only the first, and silently corrupts the second."
    ])
  ], check:{
    q:"A program proposes to de-designate an Acquirer-controlled CI that no longer warrants separate management. Who decides, and what happens to the item?",
    o:["CM decides, records the rationale, and the item is controlled by its own drawings thereafter",
       "The program decides; the Acquirer is notified at the next review",
       "The Acquirer decides, since the designation was theirs, and the item returns to control within its parent CI\u2019s documentation, with the parent named and the index row retained",
       "The item cannot be de-designated once a baseline has been established against it"],
    a:2,
    why:"Designation authority for Acquirer-controlled CIs rests with the Acquirer, and so does the authority to remove it: the proposal is submitted and concurred like any other selection change. And de-designation moves an item to a different level of control rather than out of control: the parent whose documentation now governs it must be identified, exactly as it would be for a candidate rejected at the end-use gate."
  }}
 ],
 exercises:[
  {id:"M1-E1", title:"Exercise 1. The end-use gate",
   scen:"Screen each item against the end-use function gate only. State pass or fail, and if it fails, say where the item is controlled instead.",
   parts:[
     {id:"a", q:"A titanium alloy billet, specified by material standard, from which structural fittings are machined."},
     {id:"b", q:"A structural bracket that carries no load-path requirement of its own, but positions a safety-critical sensor to its specified alignment."},
     {id:"c", q:"The compiler used to build the flight software."}
   ]},
  {id:"M1-E2", title:"Exercise 2. The criteria screen",
   scen:"A cabin pressure control valve is a candidate CI. It is procured from a single qualified source with a fourteen-month lead time. Hazard analysis classifies its failure as capable of causing loss of primary system capability. It requires a dedicated test set for depot maintenance and will appear in the technical manuals. The Acquirer has expressed no view.",
   parts:[

   ]},
  {id:"M1-E4", title:"Exercise 4, One part number, two places",
   scen:"A cooling fan assembly, one part number, is installed inside the mission computer (processor temperature) and inside the environmental control unit (cabin air recirculation). The installations are on different branches of the CI hierarchy, maintenance is planned separately, and a bearing-life change would be cut in on different schedules.",

  {id:"M1-E5", title:"Exercise 5: Interface register coverage",
   scen:"A CI has just been split into two sibling CIs. Before the split, the parent had documented interfaces to three external systems and to two sibling CIs.",
   parts:[
     {id:"a", q:"List every boundary that must now appear in the interface register."},

  {id:"M1-E6", title:"Exercise 6: Identifiers",

   parts:[

  {id:"M1-E7", title:"Exercise 7. The floor gate",
   scen:"A program is tailoring its CM requirements at the start of a safety-significant development. It proposes not to perform a requirement that turns out to be a floor item, on the grounds that the contract does not flow it down and the schedule is tight. The item\u2019s pre-anchored severity is catastrophic.",
   parts:[
     {id:"a", q:"Walk the gate. What is the first thing you establish, and what are the program\u2019s options once you have established it?"},
     {id:"b", q:"The program offers an alternative control it says achieves the same thing. Who decides whether that is true, and against what?"},
     {id:"c", q:"The alternative is not accepted, and the program still wants to proceed. Who signs, and at what level? What would change if the severity had been severe rather than catastrophic?"},
     {id:"d", q:"A colleague suggests re-rating the severity for this program, arguing the design makes the hazard less likely here. How do you answer?"},
     {id:"e", q:"The requirement is performed after all. What still has to be recorded, and why does it matter that the record is queryable?"}
   ]},
  {id:"M1-E8", title:"Exercise 8: Identifiers under a firmware change",
   scen:"A designated CI is a controller with embedded firmware. The hardware device and its code are controlled together on a single altered-item drawing. A defect is corrected in the code; the hardware is untouched, and the corrected units cannot be installed alongside uncorrected ones in the same system.",

     {id:"a", q:"Under this control arrangement, how many part numbers represent the device, and what does the part number now stand for?"},
     {id:"b", q:"What happens to the part number, and what happens to the serial numbers of units that are reworked to the new code?"},
     {id:"c", q:"The program is considering controlling the code separately from the device on future builds. What would change about the identifiers, and what would you gain and lose?"},
     {id:"d", q:"Whichever arrangement is used, what identification does every version of the code itself require?"}
   ]},
  {id:"M1-E9", title:"Exercise 9. The three documentation sets",
   scen:"An avionics processing unit is a designated CI on a performance-based contract, approaching preliminary design review. It contains a commercially procured processor module. Accepting a delivered unit requires a special calibration fixture that does not exist yet. The unit is life-limited.",
   parts:[
     {id:"a", q:"Which requirements belong in the allocated documentation for this CI, and which stay at system level in the functional documentation? Give one concrete example of each."},
     {id:"b", q:"The calibration fixture is needed to inspect the item at acceptance. Where is its design documented, and under which baseline?"},
     {id:"c", q:"The processor module is commercial and the supplier will not release its internals. What must the product documentation still say about it?"},
     {id:"d", q:"The contract is performance-based and requires no design disclosure. What does that change about the product documentation, and what does it not change?"},
     {id:"e", q:"Eight months after the product baseline is established, a change is approved. What happens to the documentation, and what must the new revision be able to show?"},
     {id:"f", q:"Where does verification appear across the three sets? Name what each set\u2019s verification content is for."}
   ]},
  {id:"M1-E10", title:"Exercise 10: Reading an index and a register",
   scen:"You are handed the identification records for a subsystem you have never seen. The index shows: a level-2 subsystem CI, Acquirer-controlled, safety-critical flag set with a hazard reference, product baseline planned; beneath it three level-3 CIs, two Supplier-controlled and one Acquirer-controlled; one of the three is a software CI with no allocated baseline date recorded; one carries three part-number variants on the variant sheet; and one row is marked de-designated with its status changed but its baseline dates still populated. The register carries five boundary rows for these CIs, one of which is a signed no-interface determination, and two of which cite the same interface control document with different variant applicability.",
   parts:[
     {id:"a", q:"How many CIs are actively designated here, and how do you know without counting rows?"},
     {id:"b", q:"The software CI has no allocated baseline date. Name two different things that could mean, and say what you would look at to tell them apart."},
     {id:"c", q:"Two register rows cite the same interface control document. Is that an error? Explain what the register is keyed to and why that answers the question."},
     {id:"d", q:"The de-designated row still shows baseline dates. Should those be cleared? Why or why not?"},
     {id:"e", q:"Is the register\u2019s coverage complete for these four CIs? State how you would check, and what number of boundary rows you would expect to find."},
     {id:"f", q:"The parent CI is flagged safety-critical but one child is not. What would you want to confirm about that, and with whom?"}
   ]},
  {id:"M1-E11", title:"Exercise 11: Translating safety evidence",
   scen:"You are the CM engineer on a military transport program derived from a civil type, so both a military system safety population and civil airworthiness limitations exist. In one week, the following crosses your desk. (1) The customer\u2019s engineering authority issues a critical safety item designation for a flap track fitting. (2) The system safety analysis names \u201ccargo fire suppression\u201d as a safety-critical function. (3) The airworthiness limitations list a corrosion inspection task for a wing zone. (4) The maintenance program shows a shelf-life limit on the cargo compartment fire suppression bottles. (5) The engine overhaul manual identifies two influencing parts for the fan disc life model. (6) A drawing arrives with a key characteristic flagged on a bracket hole pattern.",
   parts:[
     {id:"a", q:"For each of the six, name what the evidence is attached to: an item, a function, a task, a location or zone, or a feature."},
     {id:"b", q:"Which of the six answer the safety-critical screen on their own? For those, what does CM record?"},
     {id:"c", q:"For the fire suppression function and for the bottles themselves, write the exact request you would send to the safety team."},
     {id:"d", q:"The flap track fitting is small, and a colleague argues it fails the end-use function gate. Respond."},
     {id:"e", q:"The two influencing parts: which screen do they pass, and why not the safety-critical screen?"},
     {id:"f", q:"The wing zone inspection task and the bracket key characteristic: what do you screen in each case, and where does control live if no CI is designated?"},

  {id:"M1-E12", title:"Exercise 12: Reading a situation",
   scen:"You join a program at preliminary design review. You find: a CI index with 340 entries, most at bracket and connector level; no candidate list; an interface register with 61 rows, 22 blank in the \u201cdefining documentation\u201d column; and a model that decomposes the system by ATA chapter while the CI index is organised by the contract work breakdown structure.",

  {id:"M1-E13", title:"Exercise 13: Building a structure from scratch",
   scen:"A new program will deliver a podded surveillance radar carried on a transport aircraft. It comprises: an antenna assembly with a positioner; a transmitter unit; a receiver and signal processing unit running two software applications, the signal processing chain and an operator display, on separate processors; a power conditioning unit bought as a catalog item to a vendor\u2019s part number; a liquid cooling unit procured to your source control drawing from one qualified vendor with an eleven-month lead time; interconnecting cable assemblies; and the pod structure with its radome. Hazard analysis identifies the pod attachment fittings as safety-critical: failure could release the pod in flight. The system interfaces to the aircraft mission computer and to aircraft power. The contract line items are the radar system and a separate spares package. No architecture model exists yet.",

{
 id:"M2", label:"Module 2", title:"Sub-Supplier CM Flowdown",
 sub:"Imposing CM requirements on the supply chain, and proving they work",
 sections:[
  {id:"M2-01", title:"Why flowdown exists", body:[
    P("Performing configuration management includes responsibility for the CM performance of the supply chain. The governing obligation: **flow to sub-suppliers the same CM requirements imposed on the company, or suitable tailorings of them.**"),
    P("Two words do most of the work. *Same* sets the default: the starting point is everything, not nothing. *Suitable* permits reduction, but suitability has to be established and recorded."),
    S("A barrier that exists at this tier and not at the tier that performs the work is not a barrier.",
      "If your company controls change and records as-built configuration, but the supplier who actually builds the item does neither, the control does not exist where the risk is. The paperwork is at one address and the hazard is at another."),
    CARDS([
      {h:"Not a sixth CM function", b:"The requirements flowed are identification, change, status accounting and audit requirements: the same four you already know. This process governs how they are selected, imposed and verified at the supplier tier."},
      {h:"Every tier, every procurement", b:"Design, build, software or firmware development, repair or overhaul, special processes, or catalog items incorporated into the product. A supplier with sub-tiers of its own flows the same obligation downward."},
      {h:"The floor flows too", b:"Floor requirements flow to every tier. A supplier-tier proposal to tailor or omit one is dispositioned through the floor gate and recorded: performed, replaced by a documented equivalent control, or risk-accepted at the named authority. Never silently dropped."}
    ],3)
  ], check:{
    q:"What is the default position when deciding what CM requirements to flow to a sub-supplier?",
    o:["Flow the minimum the contract explicitly requires",
       "Flow everything imposed on the company, then reduce only where suitability is established and recorded",
       "Flow whatever the supplier\u2019s quality system already covers",
       "Flow requirements proportionate to the value of the purchase order"],
    a:1,
    why:"\u201cSame requirements, or suitable tailorings\u201d sets the default at everything. Reduction is permitted but must be earned: suitability has to be established and recorded, never assumed."
  }},

  {id:"M2-02", title:"Two questions drive everything", body:[
    CARDS([
      {h:"1. Who holds design authority?", b:"The company, the supplier, the vendor, or split, with the company controlling form, fit, function, interface and qualification while the supplier owns the internals. This determines whether the supplier can change anything, which decides whether change control applies."},
      {h:"2. Who performs the build?", b:"The company, the supplier, or nobody: a process-only service. This determines whether there is an as-built configuration to reconcile, which decides whether the whole traceability and reconciliation apparatus applies."}
    ],2),
    P("Item type, whether hardware, software, commercial item or service, is a modifier on the answer rather than a third question."),
    S("Every other requirement in the matrix follows from those two facts.",
      "Which is why classification is performed before derivation, and why a procurement whose classification cannot be determined is not released until it can.")
  ], check:{
    q:"Why are design authority and who-performs-the-build the two questions that drive classification?",
    o:["Because they are the two facts most reliably stated in a purchase order",
       "Because they determine price and schedule risk",
       "Because they determine whether change control applies and whether there is an as-built configuration to reconcile",
       "Because the Acquirer requires both to be recorded"],
    a:2,
    why:"They determine what can go wrong. Design authority decides whether the supplier can change anything. Who builds decides whether there is an as-built to reconcile against released design."
  }},

  {id:"M2-03", title:"The eight work types", body:[
    TABLE(["Work type","What it is","Design authority","Build by"],[
      ["Build-to-print","The company designs; the supplier manufactures to the released technical data package","Company","Supplier"],
      ["Source-controlled design and build","The supplier designs the internals under a company source control drawing","Supplier (internals); company (form, fit, function, interface, qualification)","Supplier"],
      ["Design agent","The supplier develops the design; the deliverable is the technical data package","Supplier develops; company owns","Company"],
      ["Full CI development","The supplier develops a CI to company specification and holds design authority at its level: the heaviest flowdown","Supplier","Supplier"],
      ["Catalog item","A commercial item controlled through a vendor item control drawing; flowdown is mostly notification","Vendor","Vendor"],
      ["Software and firmware development","Usually combined with source-controlled or full-development work rather than standing alone","Supplier, per specification","Supplier"],
      ["Repair and overhaul","As-maintained records, retrofit, and life retention through part-number changes","Company; supplier where delegated","Supplier"],
      ["Special process services","Process only: process specification control and change notification","Company (process specification)","Not applicable"]
    ]),
    P("Typical examples: machined parts to released drawings (build-to-print); source-controlled valves, actuators and power supplies (source-controlled design and build); design houses producing drawings and models (design agent); major subsystem development subcontracts (full CI development); catalog connectors and commercial computing (catalog item); operational flight program subcontracts and embedded firmware (software and firmware); depot and OEM repair stations (repair and overhaul); heat treat, coating, plating and non-destructive inspection (special process services).")
  ], check:{
    q:"A supplier develops and builds an actuator under your source control drawing. You control form, fit, function, interface and qualification; they are the design activity for the internals. Which work type?",
    o:["Build-to-print","Source-controlled design and build","Design agent","Full CI development"],
    a:1,
    why:"Split design authority with the supplier building is source-controlled design and build. Build-to-print puts no design authority at the supplier at all; the design agent type has the company performing the build; full CI development has the supplier holding design authority against a company specification, with the company baselining at allocated level."
  }},

  {id:"M2-04", title:"Mixed classification, and the record", body:[
    P("Where a supplier performs more than one type of work under a single procurement, **record every applicable type, not only the dominant one.** Mixed classifications are ordinary for suppliers who both develop and build, or who build hardware and develop its embedded software."),
    C("The case people miss",[
      "A hardware procurement quietly acquires firmware, nobody re-classifies, and the entire software CM requirement set: version identification, library control, build reproducibility: is never imposed.",
      "When the build cannot be reproduced three years later, that is where it started. **One missing letter in one classification field.**"
    ]),
    S("Tailoring without a recorded classification is omission, not tailoring.",
      "A reduced requirement set with no record of the reasoning is indistinguishable from having forgotten."),
    S("A procurement whose classification cannot be determined is not released until it can.",
      "If you cannot answer who holds design authority and who builds, nobody has defined the procurement well enough to buy against it."),
    P("CM performs classification at statement-of-work development, before release, and records it on the classification log with classifier and date. **That record is the documented tailoring rationale the flowdown obligation requires.**")
  ], check:{
    q:"A source-controlled actuator contains the supplier\u2019s own embedded firmware. The engineer classifies it as source-controlled design and build only. What is the practical consequence?",
    o:["None: source-controlled design and build is the dominant work type and governs",
       "The software CM requirement set is never imposed: version identification, library control and build reproducibility records",
       "The supplier will be over-burdened with unnecessary requirements",
       "Only the audit requirements are affected"],
    a:1,
    why:"Mixed classifications take the union, not the dominant type. Leaving the software and firmware work type off means that requirement set never reaches the statement of work, and the failure surfaces years later when the delivered load cannot be rebuilt."
  }},

  {id:"M2-05", title:"The transaction flow", body:[
    P("Flowdown is transaction-driven: it executes for every procurement, and re-executes whenever the facts change."),
    STEPS([
      {h:"Classify", b:"Work type or types recorded on the classification log, with classifier and date."},
      {h:"Derive", b:"Read the requirement set from the matrix columns. Identify conditionals and floor-tagged rows."},
      {h:"Resolve conditionals", b:"Each resolved against its stated condition, with the basis recorded. Determine audit designation status."},
      {h:"Cite in the statement of work", b:"Every requirement with its deliverable. Standing conditional audit clause where designation is possible."},
      {h:"CM review and signature", b:"Prior to release, recorded on the classification log."},
      {h:"Maintain the classification", b:"Re-run on trigger. Classification is dated, not permanent."},
      {h:"Accrue evidence", b:"Log every deliverable at receipt and every finding or escape as it occurs."},
      {h:"Determine effectiveness", b:"Against the requirement set actually imposed. Record rationale, date and next-due date."},
      {h:"Act on the determination", b:"Actions from the ladder, with owner and due date, tracked to closure."}
    ],"tl"),
    C("Re-classification triggers",[
      "**Scope change, including scope that grows from build into any element of design authority**: the common and easily missed one, because it silently makes change control applicable.",
      "Work type change, including added software or firmware. Audit designation change. Source change: new supplier, facility or sub-tier. Revision of the floor register or the requirement matrix. An effectiveness determination of less than effective."
    ])
  ], check:{
    q:"A build-to-print procurement grows in scope: the supplier will now propose minor design improvements for company approval. Why does this matter to flowdown?",
    o:["It does not: the company still owns the design",
       "It changes the price, so the statement of work is reissued anyway",
       "Design authority has partly moved, which silently makes change control applicable: re-classify and update the derived requirement set",
       "It only affects first article inspection"],
    a:2,
    why:"Scope growing from build into any element of design authority is a named re-classification trigger, and the most commonly missed one. Once the supplier can propose changes, an entire requirement set becomes applicable that a build-to-print classification never imposed."
  }},

  {id:"M2-06", title:"Who does what", body:[
    P("Flowdown is not a CM activity with an audience. It is a chain of handoffs, and nearly every failure in this module is a handoff that did not happen, not a judgement that went wrong."),
    TABLE(["Function","What they own in this process"],[
      ["Configuration Management","Owns the process. Classifies each procurement and records it; derives the requirement set and its deliverables; resolves conditionals; drafts or reviews the CM content of the statement of work and signs it before release; maintains the classification through its triggers; logs deliverable receipts and findings; makes or recommends effectiveness determinations; tracks actions to closure"],
      ["Subcontracts and supply chain","Routes **every** statement of work through CM before release; incorporates the cited requirements and deliverables; administers notice periods and delivery terms; notifies CM of scope changes, source changes and award actions; executes the contractual actions arising from a determination"],
