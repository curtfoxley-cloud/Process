<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Part Note Codes and Traceability</title>
<style>:root{
  --ink:#1E262E; --ink-2:#2C3841; --slate:#5C6D78; --mute:#8998A2;
  --paper:#FFFFFF; --surface:#F4F6F7; --surface-2:#EDF0F1; --rule:#D6DCDF;
  --rust:#A8481F; --rust-soft:#F2E4DD; --rust-ink:#7E340F;
  --teal:#1F5F5B; --teal-soft:#DFEAE8;
  --amber:#9A6508; --amber-soft:#F6ECD8;
  --alert:#8E2F2F; --alert-soft:#F4E2E2;
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --rail:290px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--surface);
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- header ---------- */
.top{
  position:sticky; top:0; z-index:40; background:var(--ink); color:#fff;
  display:flex; align-items:center; gap:16px; padding:0 20px; height:60px;
  border-bottom:1px solid #000;
}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#93A2AB}
.top .spacer{flex:1}
.who{display:flex;align-items:center;gap:8px}
.who label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#93A2AB}
.who input{
  background:#2C3841;border:1px solid #3D4B55;color:#fff;border-radius:4px;
  padding:6px 10px;font-size:13px;width:180px;
}
.who input:focus{outline:2px solid var(--rust);outline-offset:1px}
.tbtn{
  background:transparent;border:1px solid #46545F;color:#DCE3E7;border-radius:4px;
  padding:7px 12px;font-size:12.5px;white-space:nowrap;
}
.tbtn:hover{background:#2C3841;border-color:#5E6D77}
.tbtn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.tbtn.danger{border-color:#7A4A3A;color:#EBCDC2}
.tbtn.danger:hover{background:#4A2E26;border-color:#A85D45}
.tbtn.danger.armed{background:var(--rust);border-color:var(--rust);color:#fff;font-weight:600}
.railtoggle{display:none}

/* ---------- shell ---------- */
.shell{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto}
.rail{
  width:var(--rail); flex:0 0 var(--rail); background:var(--paper);
  border-right:1px solid var(--rule); min-height:calc(100vh - 60px);
  position:sticky; top:60px; max-height:calc(100vh - 60px); overflow-y:auto;
}
.railhead{padding:18px 20px 12px;border-bottom:1px solid var(--rule)}
.railhead h2{margin:0 0 3px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);font-weight:700}
.railhead p{margin:0;font-size:12px;color:var(--slate)}
.grp{padding:14px 0 6px}
.grp h3{
  margin:0 0 6px;padding:0 20px;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--slate);font-weight:700;
}
.nav{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;
  padding:7px 20px 7px 17px;display:flex;gap:10px;align-items:flex-start;line-height:1.35}
.nav:hover{background:var(--surface)}
.nav:focus-visible{outline:2px solid var(--rust);outline-offset:-2px}
.nav[aria-current="true"]{background:var(--surface-2);border-left-color:var(--rust)}
.nav .id{font-family:var(--mono);font-size:10.5px;color:var(--mute);flex:0 0 46px;padding-top:2px;letter-spacing:.02em}
.nav[aria-current="true"] .id{color:var(--rust-ink)}
.nav .nm{font-size:13px;color:var(--ink-2);flex:1}
.nav[aria-current="true"] .nm{font-weight:600}
.dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:5px;border:1.5px solid var(--rule);background:transparent}
.dot.work{border-color:var(--amber);background:var(--amber-soft)}
.dot.done{border-color:var(--teal);background:var(--teal)}

/* ---------- main ---------- */
main{flex:1;min-width:0;padding:0 0 80px}
.stage{max-width:820px;margin:0 auto;padding:34px 32px 0}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.recid{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--rust-ink);background:var(--rust-soft);
  padding:3px 8px;border-radius:3px;font-weight:700}
.status{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
h1.sect{font-family:var(--serif);font-size:31px;line-height:1.2;margin:0 0 6px;letter-spacing:-.2px}
.lede{font-size:15px;color:var(--slate);margin:0 0 22px}
.hr{height:1px;background:var(--rule);margin:0 0 26px}
p{margin:0 0 14px}
strong{font-weight:700}
ul.pl{margin:0 0 16px;padding-left:0;list-style:none}
ul.pl li{position:relative;padding-left:20px;margin-bottom:9px}
ul.pl li::before{content:"";position:absolute;left:3px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--rust)}

.callout{background:var(--surface);border-radius:6px;padding:16px 18px;margin:0 0 20px;border:1px solid var(--rule)}
.callout.teal{background:var(--teal-soft);border-color:#CBDDDA}
.callout .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:7px}
.callout.teal .lab{color:var(--teal)}
.callout.bg{background:transparent;border:1px dashed #AEB9BF;font-size:14.5px;color:var(--ink-2)}
.callout.bg .lab{color:var(--slate)}
.grader{margin-top:8px;background:var(--amber-soft);border:1px solid #E4D3AE;border-radius:5px;padding:10px 13px;font-size:13.5px}
.grader>b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:4px}
.callout p:last-child{margin-bottom:0}

.stmt{background:var(--ink);color:#fff;border-radius:6px;padding:20px 22px;margin:0 0 20px}
.stmt>b{display:block;font-family:var(--serif);font-size:19px;line-height:1.35;font-weight:700}
.stmt>span{display:block;margin-top:9px;font-size:13.5px;color:#B4C0C7}

.cards{display:grid;gap:12px;margin:0 0 20px}
.cards.c2{grid-template-columns:1fr 1fr}
.cards.c3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.card h4{margin:0 0 6px;font-size:14px;font-weight:700}
.card p{margin:0;font-size:13.5px;color:var(--ink-2)}

.steps{margin:0 0 20px;display:grid;gap:8px}
.step{display:flex;gap:12px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:11px 14px}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--rust);color:#fff;
  font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step.tl .n{background:var(--teal)}
.step .tx>b{display:block;font-size:14px;margin-bottom:2px}
.step .tx span{font-size:13.5px;color:var(--ink-2)}

.tw{overflow-x:auto;margin:0 0 20px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
thead th{background:var(--ink);color:#fff;text-align:left;padding:9px 12px;font-size:12px;font-weight:700;letter-spacing:.02em}
tbody td{padding:9px 12px;border-top:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
tbody tr:nth-child(even) td{background:#FAFBFB}
td.k{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}

/* ---------- knowledge check ---------- */
.check{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--rust);border-radius:6px;padding:18px 20px;margin:26px 0 0}
.check .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:8px}
.check .q{font-size:15.5px;font-weight:600;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--rule);border-radius:5px;margin-bottom:7px;cursor:pointer;background:var(--paper);font-size:14px}
.opt:hover{background:var(--surface)}
.opt input{margin:3px 0 0;accent-color:var(--rust);flex:0 0 auto}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt.wrong{border-color:var(--alert);background:var(--alert-soft)}
.opt.locked{cursor:default}
.fb{margin-top:11px;padding:12px 14px;border-radius:5px;font-size:14px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--teal-soft);border:1px solid #CBDDDA}
.fb.no{background:var(--alert-soft);border:1px solid #E8CFCF}
.fb>b{display:block;margin-bottom:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.fb.ok b{color:var(--teal)} .fb.no b{color:var(--alert)}

/* ---------- exercises ---------- */
.exwrap{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;margin:0 0 18px}
.exwrap h4{margin:0 0 8px;font-family:var(--serif);font-size:18px}
.scen{background:var(--surface);border-radius:5px;padding:13px 15px;font-size:14px;margin-bottom:16px}
.part{margin-bottom:16px}
.part label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
textarea{width:100%;border:1px solid var(--rule);border-radius:5px;padding:10px 12px;font-size:14px;
  line-height:1.55;resize:vertical;min-height:76px;background:var(--paper)}
textarea:focus{outline:2px solid var(--rust);outline-offset:0;border-color:var(--rust)}
.count{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:4px;text-align:right}

/* ---------- buttons / footer nav ---------- */
.pager{display:flex;justify-content:space-between;gap:12px;margin:32px 0 0;padding-top:22px;border-top:1px solid var(--rule)}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:5px;padding:10px 18px;font-size:14px;font-weight:600}
.btn:hover{background:var(--surface)}
.btn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.btn.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.pri:hover{background:var(--rust-ink)}
.btn.gh{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}

/* ---------- start + submit ---------- */
.hero{background:var(--ink);color:#fff;border-radius:8px;padding:34px 34px 30px;margin-bottom:26px}
.hero .kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust-soft);margin-bottom:12px}
.hero h1{font-family:var(--serif);font-size:35px;line-height:1.15;margin:0 0 6px}
  .hero .subtitle{font-family:var(--serif);font-size:19px;line-height:1.3;color:#C9D3D9;margin:0 0 10px}
  .hero .scale{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rust-soft);margin:0 0 14px}
.hero p{color:#B4C0C7;margin:0;font-size:15px;max-width:60ch}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 22px;font-size:14px}
.meta dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);padding-top:3px}
.meta dd{margin:0}
.transmit{border:1px solid var(--rule);border-radius:6px;background:var(--paper);overflow:hidden;margin-bottom:22px}
.transmit .hd{background:var(--surface-2);padding:12px 18px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.transmit .hd b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.transmit .hd span{font-family:var(--mono);font-size:11px;color:var(--slate)}
.transmit .bd{padding:18px}
.scorebox{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.scorebox .big{font-family:var(--serif);font-size:42px;font-weight:700;line-height:1}
.scorebox .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate)}
.gaps{margin-top:14px}
.gaps li{font-size:13.5px}
.note{font-size:13px;color:var(--slate);margin-top:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:5px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.warn{background:var(--amber-soft);border:1px solid #E4D3AE;border-radius:5px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.setup{font-size:13px;color:var(--slate);border-top:1px solid var(--rule);margin-top:26px;padding-top:16px}
.setup code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:3px}

.fadein{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:760px){
  .top{padding:0 12px;gap:8px}
  .brand{display:none}
  .lng{display:none}
  .who{flex:1;min-width:0}
  .who label{display:none}
  .top .who input{width:100%;min-width:90px}
  .tbtn{padding:7px 10px}
}
@media(max-width:440px){
  .top{flex-wrap:wrap;height:auto;padding:8px 12px;row-gap:8px}
  .who{order:9;flex:1 0 100%}
  .top .spacer{display:none}
  .top .tbtn{flex:1 1 auto}
  .top .who input{width:100%}
}
@media(max-width:900px){
  .cards.c3,.cards.c2{grid-template-columns:1fr}
  .rail{position:fixed;top:60px;left:0;bottom:0;z-index:35;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0);max-height:none}
  .rail.open{transform:none;box-shadow:2px 0 24px rgba(0,0,0,.25)}
  .railtoggle{display:inline-block}
  .stage{padding:26px 18px 0}
  .who input{width:120px}
  h1.sect{font-size:26px}
  .hero{padding:26px 22px}
  .hero h1{font-size:28px}
}

/* ---------- part note text ---------- */
.pnote{display:flex;gap:11px;align-items:flex-start;background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--teal);
  border-radius:5px;padding:10px 14px;margin:0 0 12px;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.pnote .pc{flex:0 0 auto;min-width:44px;text-align:center;background:var(--ink);color:#fff;font-weight:700;border-radius:3px;padding:1px 7px;font-size:11.5px;letter-spacing:.04em;margin-top:1px}

/* ---------- product tree ---------- */
.tree{border:1px solid var(--rule);border-radius:6px;background:var(--paper);margin:0 0 20px;overflow:hidden}
.trow{display:flex;gap:12px;align-items:flex-start;padding:9px 14px;border-top:1px solid var(--rule);font-size:13.5px}
.trow:first-child{border-top:0}
.trow .tn{flex:1;min-width:0;color:var(--ink-2)}
.trow .tn b{color:var(--ink)}
.trow .tn>i{display:block;font-style:normal;font-size:12.5px;color:var(--slate);margin-top:2px}
.trow .tc{flex:0 0 auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:45%}
.chip{font-family:var(--mono);font-size:11px;font-weight:700;border-radius:3px;padding:1px 6px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--rule)}
.chip.none{font-weight:400;color:var(--mute)}
.tbar{font-family:var(--mono);color:var(--mute);white-space:pre}

/* ---------- parts-list drill ---------- */
.dline{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--rust);border-radius:6px;margin:0 0 18px;overflow:hidden}
.dline .hd{background:var(--surface-2);padding:9px 16px;border-bottom:1px solid var(--rule);display:flex;gap:8px 18px;flex-wrap:wrap;
  font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.dline .hd span b{color:var(--slate);font-weight:400;letter-spacing:.08em;text-transform:uppercase;font-size:10px;margin-right:6px}
.dline .bd{padding:14px 16px 16px}
.dline .nm{font-family:var(--mono);font-size:14px;font-weight:700;margin:0 0 10px;letter-spacing:.02em}
.codes{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 0}
.code{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);border-radius:4px;padding:6px 11px;
  font-family:var(--mono);font-size:12.5px;font-weight:700;cursor:pointer;background:var(--paper);user-select:none}
.code:hover{background:var(--surface)}
.code input{accent-color:var(--rust);margin:0}
.code.none{font-weight:400}
.code.locked{cursor:default}
.code.locked:hover{background:inherit}
.code.right{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.code.wrong{border-color:var(--alert);background:var(--alert-soft);color:var(--alert);text-decoration:line-through}
.code.missed{border-color:var(--amber);background:var(--amber-soft);color:var(--amber);border-style:dashed}
.legend{font-size:12.5px;color:var(--slate);margin:10px 0 0;display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;border:1px solid}
.legend .lr{background:var(--teal-soft);border-color:var(--teal)}
.legend .lw{background:var(--alert-soft);border-color:var(--alert)}
.legend .lm{background:var(--amber-soft);border-color:var(--amber);border-style:dashed}

/* ---------- builder additions: extra block types ---------- */
h2.sub2{font-family:var(--serif);font-size:21px;line-height:1.3;margin:26px 0 10px}
ol.ol{margin:0 0 16px;padding-left:22px}
ol.ol li{margin-bottom:8px;padding-left:4px}
ol.ol li::marker{color:var(--rust);font-family:var(--mono);font-size:13px;font-weight:700}
.callout.amb{background:var(--amber-soft);border-color:#E4D3AE}
.callout.amb .lab{color:var(--amber)}
.fig{margin:0 0 20px;text-align:center}
.fig img{max-width:100%;height:auto;border:1px solid var(--rule);border-radius:6px;background:#fff}
.fig figcaption{font-size:13px;color:var(--slate);margin-top:7px}

/* ---------- markings: banners and notice blocks ---------- */
.chrome{position:sticky;top:0;z-index:40}
.chrome .top{position:relative;top:auto}
.mk{font-family:var(--sans);font-weight:700;font-size:12.5px;letter-spacing:.05em;text-align:center;padding:4px 14px;line-height:1.35}
#mkBot{position:fixed;left:0;right:0;bottom:0;z-index:45}
.rail{top:var(--chh,60px);max-height:calc(100vh - var(--chh,60px) - var(--mkb,0px));min-height:calc(100vh - var(--chh,60px) - var(--mkb,0px))}
body{padding-bottom:var(--mkb,0px)}
.toast{bottom:calc(26px + var(--mkb,0px))}
.mkblock{border-radius:6px;padding:12px 16px;margin:0 0 20px;font-size:13px;line-height:1.5;border:1px solid rgba(0,0,0,.08)}
.mkblock.mkbtm{margin-top:26px}
@media(max-width:900px){ .rail{top:var(--chh,60px);bottom:var(--mkb,0px);max-height:none;min-height:0} }
@media print{ .mk,.mkblock{-webkit-print-color-adjust:exact;print-color-adjust:exact} #mkBot{position:static} .chrome{position:static} }

/* ---------- choose-all-that-apply checks ---------- */
.check .multi{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin:-6px 0 10px}
.opt.missed{border-color:var(--amber);background:var(--amber-soft);border-style:dashed}

/* ---------- glossary ---------- */
.gl{border-bottom:1.5px dotted var(--teal);cursor:help}
.stmt .gl,.hero .gl{border-bottom-color:#9FC3BE}
.gl:hover{background:var(--teal-soft)}
.stmt .gl:hover,.hero .gl:hover{background:rgba(255,255,255,.12)}
.gl:focus-visible{outline:2px solid var(--rust);outline-offset:1px;border-radius:2px}
#glTip{position:fixed;z-index:95;max-width:360px;background:var(--ink);color:#fff;border-radius:6px;padding:11px 14px;font-size:13.5px;line-height:1.5;box-shadow:0 8px 28px rgba(0,0,0,.28);display:none}

   {
    "id": "M1-E1",
    "title": "Exercise 1: The case for the records",
    "scen": "A program manager proposes to drop lot/batch recording on hydraulic O-rings to save cost. The argument: O-rings are cheap, and they are replaced at every overhaul anyway. The hydraulic assemblies would stay serialized.",
    "parts": [
     {
      "id": "a",
      "q": "Describe a concrete failure that lot/batch records on the O-rings would let the program contain. Then explain what happens to the containment if the records are gone.",
      "key": "**Required.** A specific failure tied to one lot. For example, the supplier reports a compound defect in one O-ring batch, and those seals may leak. With lot records, the program lists the assemblies that received that lot, then the airplanes that carry them. Without the records, nobody can tell which assemblies hold the bad lot. Containment widens to every assembly, and every airplane, in the effectivity range. **Also credit.** Any lot-level failure: wrong material, a lapsed shelf life, contamination, or a counterfeit source. **Common wrong answer.** \"Replace them at the next overhaul.\" That waits for the overhaul and leaves the leak risk in service until then."
     },
     {
      "id": "b",
      "q": "The manager says the serialized assemblies are enough. What do the assembly serial numbers give you on their own, and what do they lose without the O-ring lot records?",
      "key": "**Required.** The assembly serial numbers say which assembly is which and where each one is installed. They say nothing about which O-ring lot went into which assembly. Without the lot records, a suspect lot cannot be matched to any assembly. The serial number answers \"which unit.\" It cannot answer \"which group.\" **Also credit.** Citing EIA-649-1A: a unit identifier and a group identifier answer different questions, and neither substitutes for the other. **Common wrong answer.** \"The assembly serial number covers everything inside it.\" It covers location, not the lot."
     },
     {
      "id": "c",
      "q": "Explain the role of the assembly's serial number in making the O-ring lot records useful.",
      "key": "**Required.** A lot/batch number alone does not establish location. Fifty O-rings from one lot can go into fifty assemblies. The assembly serial number is the location. The lot record attaches to it, so a suspect lot leads to specific assemblies. That is why the parent of a LOT item is serialized. **Also credit.** Naming TR as the code that directs the record linking each O-ring lot to its assembly. **Common wrong answer.** Treating the two records as alternatives, so that one of them can go."
     },
     {

      "x": [

  "exercises": [
   {
    "id": "M5-E1",
    "title": "Exercise 1: The electronics buy",
    "scen": "A program's contract includes DFARS 252.246-7007 and 252.246-7008. A circuit card assembly uses microcircuits, ceramic capacitors, film resistors, and tantalum capacitors with a shelf-life limit. One microcircuit is obsolete and unavailable from the original manufacturer or its authorized distributors. The buyer finds stock at an independent distributor.",
    "parts": [
     {
      "id": "a",
      "q": "Which items on the card fall under the counterfeit avoidance clauses? Explain using the definition.",
      "key": "**Required.** All four: the microcircuits, the ceramic capacitors, the film resistors, and the tantalum capacitors. The DFARS 252.246-7007 definition covers integrated circuits and discrete electronic components, including capacitors and resistors. **Also credit.** Noting that the definition also names circuit assemblies, so the card itself is an electronic part if the program buys it. **Common wrong answer.** Microcircuits only."
     },
     {
      "id": "b",
      "q": "Which codes do the ceramic capacitors take, and which do the tantalum capacitors take? Explain the difference.",
      "key": "**Required.** Ceramic capacitors: LOT, long text. Tantalum capacitors: LL with the age and shelf-life text, and LOT, long text. One LOT covers both the counterfeit avoidance source and the shelf-life source. The shelf life adds LL. **Common wrong answer.** SER for counterfeit control. Two LOT codes on the tantalum capacitors."
     },
     {
      "id": "c",
      "q": "What must happen before the obsolete microcircuit can be bought from the independent distributor, and who carries the responsibility?",
      "key": "**Required.** DFARS 252.246-7008 sets the sourcing order. The original manufacturer and its authorized suppliers come first. The part is not available there, so the contractor may buy from a contractor-approved supplier. The independent distributor must be one. The contractor then carries the responsibility for authenticity. It must inspect, test, and authenticate the part under the applicable industry standards, such as SAE AS5553. **Also credit.** Naming SAE AS6081 for distributors. Noting that the lot and source record still applies. **Common wrong answer.** \"The distributor carries the responsibility.\" Or \"The clause bans independent distributors.\""
     },
     {
      "id": "d",
      "q": "A colleague suggests serializing each microcircuit at receiving to satisfy the clause. Answer them.",
      "key": "**Required.** A serial number applied at receiving answers \"which unit\" after the part arrives. The clause asks \"which source.\" The serial number says nothing about where the part came from. The clause needs the lot and source chain back to the original manufacturer. **Common wrong answer.** Agreeing, because a serial number \"adds traceability.\""
     },
     {
      "id": "e",
      "q": "Which codes does the circuit card assembly take, and why? Could it take any code beyond the ones its children drive? Say what fact would decide it.",
      "key": "**Required.** SER and TR, short texts, because the card is the physical parent of LOT items. A strong answer adds that the card itself may also take LOT, because codes stack. It names what would decide it: ESD sensitivity or other special handling (SH and LOT, M5-06); a batch-controlled process such as conformal coat cure or lot-based acceptance testing (M5-03); or a bought card, since the DFARS definition names circuit assemblies (M5-04). **Also credit.** Flagging that the scenario does not give those facts, rather than assuming them. **Common wrong answer.** TR only, or no code, because the card \"has no requirement of its own.\""
     }
    ]
   },
   {
    "id": "M5-E2",
    "title": "Exercise 2: Handling notes on a parts list",
    "scen": "An avionics installation parts list includes five items. A fragile optical sensor, bought off the shelf. An electrostatic discharge sensitive circuit card. A thruster cartridge for an emergency release. A beryllium copper spring. A sealed source in a smoke detector. Radiation Health Protection has identified the sealed source as radioactive beyond tolerable limits. The existing note on the card reads: SH – SPECIAL HANDLING REQUIRED – ESD SENSITIVE.",
    "parts": [
     {
      "id": "a",
      "q": "Write the SH note for the fragile optical sensor. Explain what makes it actionable.",
      "key": "**Required.** An SH note that states a control a technician can follow. For example: SH – SPECIAL HANDLING REQUIRED – THESE PARTS ARE EXTREMELY FRAGILE. DO NOT DROP OR JAR. PROVIDE 1/8-INCH POLYURETHANE FOAM UNDER THEIR CONTAINER ON THE BENCH OR WHEN STORING OR SHIPPING. Or a note that references the specification holding the control. It is actionable because it says what to do, not only what the hazard is. The sensor also takes LOT, long text. **Also credit.** Noting that an off-the-shelf item is not exempt. The parts list must state its special requirement. **Common wrong answer.** \"HANDLE WITH CARE\" or \"SEE VENDOR.\""
     },
     {
      "id": "b",
      "q": "What is wrong with the existing note on the circuit card, and what would you write instead?",
      "key": "**Required.** The note names the hazard but states no control and references no specification. The build environment has nothing to follow. An SH note must state the handling, packaging, or environmental control required, or reference the specification that contains it. Full credit for a rewrite that does either, such as the course's ESD example citing ANSI/ESD S20.20. The card also takes LOT with the long text. **Also credit.** Noting the cancellation of MIL-STD-1686. It is Background only, so do not require it. **Common wrong answer.** Adding words about care or caution without a control or a specification."
     },
     {
      "id": "c",
      "q": "Which of these items need a note or reference on higher-level drawings? Explain the rule for each.",
      "key": "**Required.** Thruster cartridge: explosive material. Its note, or a reference to it, goes on the drawing picture sheet and on every higher-level drawing. Sealed source: radioactive material. Its note goes on the lowest-level drawing that calls for it. Higher-level drawings carry it only when Radiation Health Protection requests it. The sensor, the card, and the spring: no rule puts their notes on higher-level drawings. **Also credit.** Noting that the SER and TR cascade is a separate rule, and it still applies to each item's physical parent. **Common wrong answer.** Treating radioactive material like explosive material. Putting the beryllium note on higher-level drawings."

     }
    ]

    "title": "Exercise 1: Three critical words",
    "scen": "A new program has three items under review. A landing gear drag brace that the design control activity has designated a Critical Safety Item. A wing attach fitting that is single load path and a safety-of-flight structural component. An avionics power supply that the hazard analysis identifies as a Safety-Critical Item. The contract includes DFARS 252.211-7003. A colleague proposes to treat all three the same way, because “they are all critical.”",

      "id": "a",
      "q": "Give the codes for each item and name the authority that drives each one.",
      "key": "**Required.** Drag brace: CSI, SER, LOT, and IUID. The design control activity designates it, under DFARS. Wing attach fitting: FC, SER, and LOT. It is a Fracture-Critical Traceable Part under MIL-STD-1530D. Power supply: no code on the Safety-Critical Item basis. MIL-STD-882E system safety analysis drives design and process controls, not marking. Each physical parent of the brace and the fitting takes SER and TR. **Also credit.** Flagging that the fitting or the power supply could take IUID under DFARS 252.211-7003 if its value or another category applies. The scenario does not say. **Common wrong answer.** CSI on all three."
     },
     {
      "id": "b",
      "q": "Explain to the colleague why the three items are coded differently.",
      "key": "**Required.** The three words come from three authorities. Critical Safety Item comes from statute and DFARS, and the design control activity designates it. Fracture-Critical Traceable Part comes from MIL-STD-1530D fracture control. Safety-Critical Item comes from MIL-STD-882E hazard analysis. MIL-STD-882E states that its definition is independent of the Critical Safety Item definition. Different authorities drive different codes. The word \"critical\" alone sets nothing. **Common wrong answer.** Ranking the three by severity instead of naming the authority behind each."

      "q": "The drag brace's physical parent takes SER and TR. It takes none of CSI, LOT, IUID, or LL. Explain why SER and TR cascade and the others stay on the brace.",
      "key": "**Required.** The cascade moves only SER and TR. A serial or lot on a child is useless without an identified parent, so every physical parent below the end item takes SER and TR. CSI and LL are condition codes. They describe the item they sit on. LOT records the brace's own heat and lot. The parent is identified by its serial number instead. IUID goes only on items that hold an IUID requirement and on the parent items the contract names. **Also credit.** Noting that the parent would take IUID if the contract named it a parent item. **Common wrong answer.** \"The parent inherits everything critical below it.\""
     }

/* ---- option order ----------------------------------------------------------
   Options are authored in a fixed order, with the correct one at check.a. They
   are DISPLAYED in a shuffled order, so the position of the correct answer
   carries no information. The shuffle is deterministic, seeded from the section
   id, so a trainee sees the same order every time. OPTION_SALT is chosen by the
   Training Builder so the correct answer lands evenly across the positions.
   ---------------------------------------------------------------------------- */
if(typeof OPTION_SALT==="undefined") var OPTION_SALT = 0;
function optionOrder(id, n){
  var h = 2166136261;                            // FNV-1a over the section id
  for(var i=0;i<id.length;i++){ h = Math.imul(h ^ id.charCodeAt(i), 16777619); }
  var a = (h ^ OPTION_SALT) >>> 0;
  function rnd(){                                // mulberry32
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a>>>15), 1 | a);
    t = (t + Math.imul(t ^ (t>>>7), 61 | t)) ^ t;
    return ((t ^ (t>>>14)) >>> 0);
  }
  var idx=[]; for(var k=0;k<n;k++) idx.push(k);
  for(var j=n-1;j>0;j--){                        // Fisher-Yates, seeded
    var r = rnd() % (j+1);
    var t2 = idx[j]; idx[j]=idx[r]; idx[r]=t2;
  }
  return idx;
}
/* Per-trainee order: shuffled once for each trainee, then kept in their
   progress (STATE.order) so it survives Save and Resume. */
function orderFor(id, n){
  if(!STATE.order) STATE.order={};
  var cur=STATE.order[id];
  if(cur && cur.length===n) return cur;
  var a=[], i;
  for(i=0;i<n;i++) a.push(i);
  for(i=a.length-1;i>0;i--){ var k=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[k]; a[k]=t; }
  STATE.order[id]=a;
  autosave();
  return a;
}

}

  var m = mod(modId), total=0, filled=0;

  });});

  if(/^(H1|TEXTAREA|INPUT|BUTTON|SCRIPT|STYLE|SELECT|CODE)$/.test(el.tagName)) return true;
  var c=el.classList; if(!c) return false;
  if(c.contains("gl")||c.contains("kick")||c.contains("scale")||c.contains("eyebrow")||c.contains("pager")||c.contains("pnote")||c.contains("codes")||c.contains("mkblock")||c.contains("transmit")||c.contains("legend")) return true;

function glApply(root){
  if(!GLRE) return;

      if(!frag) frag=document.createDocumentFragment();

function glInit(){

/* ---- decomposition checks ---------------------------------------------------
   A tree of plain labelled boxes, top block first. Three modes:
     build  - place each block under its parent (decoys go in the bin)
     errors - the tree is shown with mistakes; click every block that is wrong
     label  - the tree is shown; pick the right label for each block
   It is right only when every block is right.
   ---------------------------------------------------------------------------- */
var DEC_TMP = {};
var DEC_NONE = -9, DEC_BIN = -2;
function isDec(s){ return !!(s.check && s.check.dec); }
function decAll(d){ return d.blocks.map(function(b,i){ return {n:b.n, p:(i===0?-1:+b.p), given:!!b.given, lab:b.lab, shown:b.shown, decoy:false}; })
  .concat(d.mode==="label" ? [] : (d.decoys||[]).map(function(x){ return {n:x.n, p:DEC_BIN, decoy:true, shown:x.shown}; })); }
function decTree(all, parentOf, box){
  function kids(j){ var k=[]; for(var i=0;i<all.length;i++) if(i!==j && parentOf(i)===j) k.push(i); return k; }
  function node(i, seen){
    if(seen[i]) return ""; seen[i]=1;
    var k=kids(i);
    return "<li>"+box(i)+(k.length?"<ul>"+k.map(function(c){ return node(c, seen); }).join("")+"</ul>":"")+"</li>";
  }
  return "<div class='dtree'><ul>"+node(0,{})+"</ul></div>";
}
function decBoxHtml(txt, cls, extra, attrs){ return "<div class='db"+(cls?" "+cls:"")+"'"+(attrs||"")+"><span class='dn'>"+fmt(txt)+"</span>"+(extra||"")+"</div>"; }
function decInDesc(arr, i, j){ // is j a descendant of i under arrangement arr?
  var guard=0; while(j>0 && guard++<50){ if(arr[j]===i) return true; j=arr[j]; if(j<0) return false; } return false;
}
function decErrors(all){ var e=[]; all.forEach(function(b,i){ if(i===0) return; if(b.decoy) e.push(i); else if(b.shown!=null && b.shown!=="" && +b.shown!==b.p) e.push(i); }); return e; }
function decShownParent(b){ return b.decoy ? (b.shown!=null && b.shown!=="" ? +b.shown : null) : (b.shown!=null && b.shown!=="" ? +b.shown : b.p); }
function decInit(s, all){
  var d=s.check.dec, n=all.length;
  if(d.mode==="build"){ var a=all.map(function(b,i){ return i===0 ? -1 : (b.given ? b.p : DEC_NONE); }); return a; }
  if(d.mode==="errors") return [];
  return all.map(function(b,i){ return b.given ? +b.lab : -1; });
}
function decMovable(s, all){
  var idx=[]; all.forEach(function(b,i){ if(i>0 && !b.given) idx.push(i); });
  var ord=(PER_TRAINEE ? orderFor(s.id+"#dec", idx.length) : optionOrder(s.id+"#dec", idx.length));
  return ord.map(function(k){ return idx[k]; });
}
function decHtml(s){
  var c=s.check, d=c.dec, all=decAll(d), rec=STATE.checks[s.id], locked=!!rec, id=s.id;
  var arr = locked ? rec.picks : (DEC_TMP[id] || (DEC_TMP[id]=decInit(s, all)));
  var h="<div class='check dec' data-check='"+esc(id)+"'><div class='lab'>Check yourself</div><div class='q'>"+fmt(c.q)+"</div>";
  if(d.mode==="build"){
    var hasDecoys=all.some(function(b){ return b.decoy; });
    var inTree=function(i){ if(i===0) return true; var g=0, j=i; while(g++<50){ var p=arr[j]; if(p===0) return true; if(p==null||p<0) return false; j=p; } return false; };
    if(!locked){
      h+="<div class='multi'>Place every block under its parent. Drag a block onto a box, or use the lists below."+(hasDecoys?" Blocks that do not belong go in the bin.":"")+"</div>";
      h+=decTree(all, function(i){ return (i>0 && inTree(i)) ? arr[i] : null; }, function(i){
        var b=all[i], mv=(i>0 && !b.given);
        return decBoxHtml(b.n, (i===0?"root":"")+(b.given&&i>0?" given":"")+(mv?" mv":""), "", " data-dec='"+esc(id)+"' data-bi='"+i+"'"+(mv?" draggable='true'":""));
      });
      var loose=decMovable(s, all).filter(function(i){ return arr[i]===DEC_NONE || (arr[i]>=0 && !inTree(i)); });
      h+="<div class='dtray' data-dec='"+esc(id)+"' data-drop='tray'><span class='dtl'>Not placed yet</span>"+(loose.length ? loose.map(function(i){ return "<span class='dchip' draggable='true' data-dec='"+esc(id)+"' data-bi='"+i+"'>"+fmt(all[i].n)+"</span>"; }).join("") : "<span class='dnone'>Every block is placed.</span>")+"</div>";
      if(hasDecoys){ var binned=decMovable(s, all).filter(function(i){ return arr[i]===DEC_BIN; });
        h+="<div class='dbin' data-dec='"+esc(id)+"' data-drop='bin'><span class='dtl'>🗑 "+esc(d.bin||"Not part of this product")+"</span>"+binned.map(function(i){ return "<span class='dchip' draggable='true' data-dec='"+esc(id)+"' data-bi='"+i+"'>"+fmt(all[i].n)+"</span>"; }).join("")+"</div>"; }
      h+="<details class='dlist'><summary>Place blocks with lists instead of dragging</summary><div class='dgrid'>";
      decMovable(s, all).forEach(function(i){
        var opts="<option value='"+DEC_NONE+"'>Not placed</option>";
        all.forEach(function(b,j){ if(j===i || !inTree(j) || decInDesc(arr, i, j)) return; opts+="<option value='"+j+"'"+(arr[i]===j?" selected":"")+">under "+esc(plain(b.n))+"</option>"; });
        if(hasDecoys) opts+="<option value='"+DEC_BIN+"'"+(arr[i]===DEC_BIN?" selected":"")+">"+esc(d.bin||"Not part of this product")+"</option>";
        h+="<label><span>"+fmt(all[i].n)+"</span><select data-dsel='"+esc(id)+"' data-bi='"+i+"'>"+opts.replace("value='"+DEC_NONE+"'>","value='"+DEC_NONE+"'"+(arr[i]===DEC_NONE?" selected":"")+">")+"</select></label>";
      });
      h+="</div></details>";
    } else {
      var right=function(i){ return arr[i]===all[i].p; };
      h+="<div class='multi'>Your decomposition</div>";
      h+=decTree(all, function(i){ return (i>0 && arr[i]>=0) ? arr[i] : null; }, function(i){
        var b=all[i]; if(i===0 || b.given) return decBoxHtml(b.n, (i===0?"root":"given"));
        return decBoxHtml(b.n, right(i)?"right":"wrong", "<span class='dm'>"+(right(i)?"✓":"✗")+"</span>");
      });
      var binned2=all.map(function(b,i){ return i; }).filter(function(i){ return arr[i]===DEC_BIN; });
      if(binned2.length) h+="<div class='dbin locked'><span class='dtl'>🗑 "+esc(d.bin||"Not part of this product")+"</span>"+binned2.map(function(i){ return "<span class='dchip "+(right(i)?"right":"wrong")+"'>"+fmt(all[i].n)+" "+(right(i)?"✓":"✗")+"</span>"; }).join("")+"</div>";
    }
  } else if(d.mode==="errors"){
    var errs=decErrors(all), flagged=arr||[];
    h+="<div class='multi'>"+(locked?"Your answer":"This decomposition has mistakes. Click every block that is wrong, then check.")+"</div>";
    h+=decTree(all, function(i){ return i===0 ? null : decShownParent(all[i]); }, function(i){
      var b=all[i], f=flagged.indexOf(i)>=0, e=errs.indexOf(i)>=0;
      if(i===0) return decBoxHtml(b.n, "root");
      if(!locked) return "<button type='button' class='db flag"+(f?" on":"")+"' data-dflag='"+esc(id)+"' data-bi='"+i+"' aria-pressed='"+(f?"true":"false")+"'><span class='dn'>"+fmt(b.n)+"</span>"+(f?"<span class='dm'>⚑</span>":"")+"</button>";
      var cls = f&&e ? "right" : (!f&&e ? "missed" : (f&&!e ? "wrong" : ""));
      return decBoxHtml(b.n, cls, cls ? "<span class='dm'>"+(cls==="right"?"⚑ ✓":(cls==="missed"?"missed":"⚑ ✗"))+"</span>" : "");
    });
    if(locked) h+="<div class='legend'><span><i class='lr'></i>mistake found</span><span><i class='lm'></i>mistake missed</span><span><i class='lw'></i>was not a mistake</span></div>";
  } else {
    var labs=d.labels||[];
    h+="<div class='multi'>"+(locked?"Your labels":"Choose the right label for each block.")+"</div>";
    h+=decTree(all, function(i){ return i===0 ? null : all[i].p; }, function(i){
      var b=all[i];
      if(b.given) return decBoxHtml(b.n, (i===0?"root ":"")+"given", "<span class='dlab'>"+esc(labs[+b.lab]||"")+"</span>");
      if(!locked){
        var o="<option value='-1'>Choose a label</option>"+labs.map(function(l,k){ return "<option value='"+k+"'"+(arr[i]===k?" selected":"")+">"+esc(l)+"</option>"; }).join("");
        return decBoxHtml(b.n, (i===0?"root":""), "<select class='dls' data-dlab='"+esc(id)+"' data-bi='"+i+"'>"+o+"</select>");
      }
      var ok=arr[i]===+b.lab;
      return decBoxHtml(b.n, (ok?"right":"wrong"), "<span class='dlab'>"+esc(labs[arr[i]]||"no label")+" "+(ok?"✓":"✗")+"</span>"+(ok?"":"<span class='dfix'>Right: "+esc(labs[+b.lab]||"")+"</span>"));
    });
  }
  h+="<div class='btnrow' style='margin-top:12px;margin-bottom:0'>"+(locked?"":"<button class='btn pri' data-ckgo='"+esc(id)+"'>Check answer</button><button class='btn gh' data-dreset='"+esc(id)+"'>Start over</button>")+"</div>";
  if(locked){
    var ok=rec.first===true;
    var showRight = !ok && d.mode!=="label";
    h+="<div class='fb show "+(ok?"ok":"no")+"'><b>"+(ok?"Correct":"Not quite")+"</b>"+
      (showRight ? "<div class='ordright'>The right decomposition:</div>"+decTree(all, function(i){ return (i>0 && !all[i].decoy) ? all[i].p : null; }, function(i){ return decBoxHtml(all[i].n, i===0?"root":""); })+
        (all.some(function(b){ return b.decoy; }) ? "<div class='ordright'>Not part of this product: "+all.filter(function(b){ return b.decoy; }).map(function(b){ return fmt(b.n); }).join(", ")+"</div>" : "") : "")+
      fmt(c.why)+"</div>";
  } else h+="<div class='fb' data-fb='"+esc(id)+"'></div>";
  return h+"</div>";
}

  var wrap=document.createElement("div"); wrap.innerHTML=decHtml(sec); var nu=wrap.firstChild;

function decSet(id, i, p){
  var arr=DEC_TMP[id]; if(!arr) return;
  arr[i]=p;

function gradeDec(sec){

function isMulti(s){ return Array.isArray(s.check.a); }

/* ---- put-in-order checks ---------------------------------------------------
   The items are authored in the right order. They are shown shuffled (never
   already in order), and the trainee moves them with the arrow buttons or by
   dragging. It is right only when every item is in its place.
   ---------------------------------------------------------------------------- */
var ORD_TMP = {};   // the arrangement on screen before Check answer
function startOrder(s){
  var n=s.check.o.length;

  var ident=true; for(var i=0;i<n;i++) if(a[i]!==i) ident=false;
  if(ident && n>1) a.push(a.shift());
  return a;
}
function orderHtml(s){

         "<span class='oc'><button type='button' class='ob' data-mv='-1' aria-label='Move up'"+(pos===0?" disabled":"")+">↑</button><button type='button' class='ob' data-mv='1' aria-label='Move down'"+(pos===arr.length-1?" disabled":"")+">↓</button></span>")+"</li>";
    });
    h+="</ol>";

  if(c.bottom) h+="<div class='ordend'>▼ "+fmt(c.bottom)+"</div>";

    h+="<div class='fb show "+(ok?"ok":"no")+"'><b>"+(ok?"Correct":"Not quite"+(arr?" · "+inPlace+" of "+c.o.length+" in the right place":""))+"</b>"+
      (ok?"":"<div class='ordright'>The right order:<ol>"+c.o.map(function(t){ return "<li>"+fmt(t)+"</li>"; }).join("")+"</ol></div>")+fmt(c.why)+"</div>";
  } else h+="<div class='fb' data-fb='"+esc(s.id)+"'></div>";

}
function wireOrder(){
  Array.prototype.forEach.call(document.querySelectorAll("ol.ordl:not(.locked)"), function(ol){
    var id=ol.getAttribute("data-ord");
    function save(){ ORD_TMP[id]=Array.prototype.map.call(ol.children, function(li){ return +li.getAttribute("data-i"); }); renumber(); }
    function renumber(){ var n=ol.children.length; Array.prototype.forEach.call(ol.children, function(li,p){ li.querySelector(".on").textContent=p+1;
      var bs=li.querySelectorAll(".ob"); bs[0].disabled=(p===0); bs[1].disabled=(p===n-1); }); }
    ol.addEventListener("click", function(e){
      var b=e.target.closest(".ob"); if(!b) return;
      var li=b.closest("li"), d=+b.getAttribute("data-mv");
      if(d<0 && li.previousElementSibling) ol.insertBefore(li, li.previousElementSibling);
      else if(d>0 && li.nextElementSibling) ol.insertBefore(li.nextElementSibling, li);
      save(); var again=li.querySelector(".ob[data-mv='"+d+"']"); if(again && !again.disabled) again.focus(); else b.focus();
      li.classList.add("moved"); setTimeout(function(){ li.classList.remove("moved"); }, 250);
    });
    var drag=null;
    ol.addEventListener("dragstart", function(e){ drag=e.target.closest("li"); if(!drag) return; drag.classList.add("drag"); try{ e.dataTransfer.setData("text/plain",""); e.dataTransfer.effectAllowed="move"; }catch(x){} });
    ol.addEventListener("dragend", function(){ if(drag) drag.classList.remove("drag"); drag=null; save(); });
    ol.addEventListener("dragover", function(e){
      if(!drag) return; e.preventDefault();
      var li=e.target.closest("li"); if(!li || li===drag || li.parentNode!==ol) return;
      var r=li.getBoundingClientRect();
      if(e.clientY < r.top + r.height/2) ol.insertBefore(drag, li); else ol.insertBefore(drag, li.nextElementSibling);
    });
    ol.addEventListener("drop", function(e){ e.preventDefault(); save(); });
  });
}
function checkHtml(s){

    h+="<div class='gaps'><p style='margin:14px 0 6px'><strong>Items to revisit.</strong> These are what your trainer will focus the review session on:</p><ul class='pl'>"+
       gaps.map(function(g){return "<li><span style='font-family:var(--mono);font-size:12px'>"+esc(g[0])+"</span> &nbsp;"+esc(g[1])+": "+esc(g[2])+"</li>";}).join("")+"</ul></div>";
  }else{
    h+="<p style='margin-top:14px'><strong>Every item answered correctly on the first attempt.</strong></p>";
  }
  h+="</div></div>";

  h+="<h2 style='font-family:var(--serif);font-size:22px;margin:26px 0 10px'>Send it</h2>";
  if(typeof navigator!=="undefined" && navigator.onLine===false)
    h+="<div class='warn'><strong>This computer is offline.</strong> Everything in the training still works. <strong>Download the record</strong> now and send the file when you are connected, or hand it over on a USB drive or shared folder."+
       (CONFIG.submitEndpoint?" <strong>Send to trainer</strong> needs a connection.":"")+(CONFIG.trainerEmail?" <strong>Open an email</strong> needs a mail program on this computer.":"")+"</div>";
  h+="<div class='btnrow'>"+
     "<button class='btn pri' id='btnDownload'>Download the record</button>"+
     "<button class='btn' id='btnCopy'>Copy as text</button>"+
     (CONFIG.trainerEmail?"<button class='btn' id='btnMail'>Open an email to "+esc(CONFIG.trainerEmail)+"</button>":"")+
     (CONFIG.submitEndpoint?"<button class='btn' id='btnPost'>Send to trainer</button>":"")+
     "</div>";
  h+="<p class='note'><strong>Download the record</strong> gives you a single file to attach to an email. It opens in any browser and prints cleanly. "+
     "<strong>Copy as text</strong> puts everything on the clipboard for pasting into email or chat."+
     (CONFIG.trainerEmail?" <strong>Open an email</strong> starts a message with your answers in the body. Long answers may be cut short by your mail program, so attach the downloaded file as well.":"")+"</p>";

  if(!CONFIG.trainerEmail && !CONFIG.submitEndpoint){
    h+="<div class='setup'><strong>Trainer setup not finished.</strong> No delivery address has been set, so the email option is hidden. "+
       "Open this file in the Training Builder, set the trainer email under Course settings, and export it again. "+
       "Everything else keeps working without it.</div>";
  }
  return h;
}
function recordNo(){
  var d=new Date();
  var pad=function(n){return n<10?"0"+n:""+n;};
  var initials=(STATE.name||"").trim().split(/\s+/).map(function(w){return w.charAt(0).toUpperCase();}).join("").slice(0,3)||"XXX";
  return (COURSE.recordPrefix||"TRN")+"-"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"-"+initials;
}

function wire(i,p){
  wireOrder(); wireDec();
  Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"), function(b){
    b.addEventListener("click", function(){ go(b.getAttribute("data-nav")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ckgo]"), function(b){
    b.addEventListener("click", function(){ grade(b.getAttribute("data-ckgo")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-dgo]"), function(b){
    b.addEventListener("click", function(){ gradeDrill(b.getAttribute("data-dgo")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("input[data-dcode]"), function(inp){
    inp.addEventListener("change", function(){
      if(!inp.checked) return;
      var id=inp.getAttribute("data-dcode");
      Array.prototype.forEach.call(document.querySelectorAll("input[data-dcode]"), function(o){
        if(o===inp || o.getAttribute("data-dcode")!==id) return;
        if(inp.value==="NONE" || o.value==="NONE") o.checked=false;
      });
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ans]"), function(t){
    t.addEventListener("input", function(){
      var k=t.getAttribute("data-ans");
      STATE.answers[k]=t.value;
      var c=document.querySelector("[data-cnt='"+k+"']");
      if(c) c.textContent=wordCount(t.value);
      clearTimeout(window.__sv); window.__sv=setTimeout(function(){ autosave(); drawRail(); },400);
    });
  });
  var bpc=document.getElementById("btnPrintCopy"); if(bpc) bpc.addEventListener("click", function(){ printDoc("handout", true); });
  var bd=document.getElementById("btnDownload"); if(bd) bd.addEventListener("click", downloadRecord);
  var bc=document.getElementById("btnCopy");     if(bc) bc.addEventListener("click", copyRecord);
  var bm=document.getElementById("btnMail");     if(bm) bm.addEventListener("click", mailRecord);
  var bp=document.getElementById("btnPost");     if(bp) bp.addEventListener("click", postRecord);
}

function grade(id){
  var sec=null;
  MODULES.forEach(function(m){ m.sections.forEach(function(s){ if(s.id===id) sec=s; }); });
  if(!sec) return;
  var picks=[];
  if(isDec(sec)){ gradeDec(sec); return; }
  if(isOrder(sec)){
    picks=(ORD_TMP[id]||startOrder(sec)).slice();
    var okO=true; picks.forEach(function(v,p){ if(v!==p) okO=false; });
    STATE.checks[id]={ first:okO, picks:picks, at:new Date().toISOString() };
    delete ORD_TMP[id];
    autosave(); draw();
    var elO=document.querySelector("[data-check='"+id+"']"); if(elO) elO.scrollIntoView({block:"center", behavior:"smooth"});
    return;
  }
  Array.prototype.forEach.call(document.querySelectorAll("input[name]"), function(r){ if(r.checked && r.name==="ck_"+id) picks.push(parseInt(r.value,10)); });
  if(!picks.length){ toast(isMulti(sec) ? "Tick at least one answer first." : "Choose an answer first."); return; }
  var ok = isMulti(sec) ? sameSet(picks, sec.check.a) : (picks[0]===sec.check.a);
  STATE.checks[id]={ first:ok, picks:picks, at:new Date().toISOString() };
  autosave(); draw();
  var el=document.querySelector("[data-check='"+id+"']");
  if(el) el.scrollIntoView({block:"center", behavior:"smooth"});
}

function download(name, text, type){
  try{
    var b=new Blob([text],{type:type||"text/plain;charset=utf-8"});
    var u=URL.createObjectURL(b);
    var a=document.createElement("a");
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); },600);
    return true;
  }catch(e){ return false; }
}
function slug(){ return (STATE.name||"unnamed").trim().replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"") || "unnamed"; }
var STEM = COURSE.fileStem || "Training";
var PSTEM = COURSE.progressStem || STEM;
function saveProgress(){
  STATE.saved=new Date().toISOString();
  var out=STATE;
  if(MK.length && MKCFG.inJson!==false){ out={markings:mkTexts()}; for(var k in STATE) if(k!=="markings") out[k]=STATE[k]; }
  var ok=download(PSTEM+"-progress-"+slug()+".json", JSON.stringify(out,null,2), "application/json");
  toast(ok ? "Progress file downloaded. Reopen it with Resume." : "This browser blocked the download. Use Copy as text on the Review and send page instead.");
}
function loadProgress(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o || !o.checks || !o.answers) throw new Error("shape");
      delete o.markings; STATE=normalize(o); document.getElementById("who").value=STATE.name||"";
      autosave(); go("start");
      toast("Progress restored.");
    }catch(e){ toast("That file is not a training progress file. Look for "+PSTEM+"-progress-….json"); }
  };
  r.onerror=function(){ toast("The file could not be read. Try selecting it again."); };
  r.readAsText(file);
}
var RTITLE = COURSE.recordTitle || COURSE.title || "Training";
function recordLines(){
  var c=counts(), out=[];
  mkTexts("top").forEach(function(t){ out.push(t); }); if(MK.length) out.push("");
  out.push(RTITLE.toUpperCase()+": TRAINING RECORD");
  out.push("Record: "+recordNo());
  out.push("Trainee: "+(STATE.name||"(name not entered)"));
  out.push("Company: "+CONFIG.companyName);
  out.push("Completed: "+new Date().toLocaleString());
  out.push("");
  out.push("SCORE");
  out.push("  Section checks correct first time: "+c.right+" of "+c.totalChecks+"  ("+(c.totalChecks?Math.round(100*c.right/c.totalChecks):0)+"%)");
  if(c.totalDrill) out.push("  Drill lines right first time: "+c.drillRight+" of "+c.totalDrill);
  out.push("  Exercise answers written: "+c.filledParts+" of "+c.totalParts);
  out.push("");
  out.push("ITEMS TO REVISIT");
  var gaps=gapList();
  if(!gaps.length) out.push("  None: every item correct on the first attempt.");
  gaps.forEach(function(g){ out.push("  "+g[0]+"  "+g[1]+": "+g[2]); });
  MODULES.forEach(function(m){
    if(!m.exercises.length) return;
    out.push(""); out.push("=".repeat(60));
    out.push(m.label.toUpperCase()+": "+plain(m.title).toUpperCase()+": EXERCISE ANSWERS");
    out.push("=".repeat(60));
    m.exercises.forEach(function(x){
      out.push(""); out.push(plain(x.title));
      if(x.scen) out.push("Scenario: "+plain(x.scen));
      x.parts.forEach(function(pt){
        var v=(STATE.answers[x.id+"."+pt.id]||"").trim();
        out.push("");
        out.push("  "+pt.id+") "+plain(pt.q));
        out.push("     "+(v? v.split("\n").join("\n     ") : "(no answer written)"));
      });
    });
  });
  if(MK.length){ out.push(""); mkTexts("bottom").forEach(function(t){ out.push(t); }); }
  return out.join("\n");
}

   "h1{font-size:26px;margin:0 0 4px}.sub{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#5C6D78;letter-spacing:.06em}"+
   "table.meta{width:auto;margin:18px 0 26px;font-size:14px}table.meta th{background:none;color:#5C6D78;font-family:ui-monospace,Consolas,monospace;font-size:11px;text-transform:uppercase;text-align:left;padding:3px 18px 3px 0;white-space:nowrap;font-weight:normal;vertical-align:top}table.meta td{border:0;padding:3px 0}"+

   "td{padding:6px 10px;border-top:1px solid #D6DCDF;vertical-align:top}td.k{font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:nowrap;width:88px}th.r{width:150px}"+
   "tr.no td{background:#F4E2E2}tr.na td{background:#F6ECD8}"+

function recMarks(pos){
  var h="";
  mkPick(pos,"banner").forEach(function(m){ h+=mkDiv(m,"mk"); });
  MK.filter(function(m){ return m.kind==="block" && (m.where===pos||m.where==="both"||(!m.where&&pos==="top")); }).forEach(function(m){ h+=mkDiv(m,"mkblock"); });
  return h;
}
function downloadRecord(){
  var ok=download(STEM+"-record-"+slug()+".html", recordHtml(), "text/html;charset=utf-8");
  toast(ok ? "Record downloaded. Attach it to an email to "+CONFIG.trainerName+"." : "This browser blocked the download. Use Copy as text instead.");
}
function copyRecord(){
  var txt=recordLines();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast("Record copied. Paste it into an email or chat."); },
      function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  var t=document.createElement("textarea");
  t.value=txt; t.style.position="fixed"; t.style.opacity="0";
  document.body.appendChild(t); t.select();
  var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  document.body.removeChild(t);
  toast(ok ? "Record copied. Paste it into an email or chat." : "Copying is blocked here. Use Download the record instead.");
}
function mailRecord(){
  var subj=(COURSE.shortName||RTITLE)+" record: "+(STATE.name||"unnamed")+": "+recordNo();
  var body=recordLines();
  var url="mailto:"+encodeURIComponent(CONFIG.trainerEmail)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
  if(url.length>1900){
    var c=counts();
    var shortBody=RTITLE+": training record\n"+recordNo()+
      "\nTrainee: "+(STATE.name||"(name not entered)")+
      "\nChecks: "+c.right+" of "+c.totalChecks+" correct first time"+
      (c.totalDrill?"\nDrill: "+c.drillRight+" of "+c.totalDrill+" lines right first time":"")+
      "\nExercises: "+c.filledParts+" of "+c.totalParts+" answers written"+
      "\n\nThe full record, including all written answers, is attached.\n(If it is not attached yet: go back to the training, choose Download the record, and attach the file.)";
    url="mailto:"+encodeURIComponent(CONFIG.trainerEmail)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(shortBody);
    downloadRecord();
    toast("Answers are too long for an email body, so the record was downloaded. Attach it to the message.");
  }
  window.location.href=url;
}
function postRecord(){
  var b=document.getElementById("btnPost");
  b.disabled=true; b.textContent="Sending…";
  var payload={ record:recordNo(), name:STATE.name||"", company:CONFIG.companyName,
    completed:new Date().toISOString(), score:counts(), checks:STATE.checks, drills:STATE.drills, answers:STATE.answers,
    course:COURSE.title, rev:CONFIG.contentRev };
  if(MK.length) payload.markings=mkTexts();
  fetch(CONFIG.submitEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
   .then(function(r){
      if(r.ok){ b.textContent="Sent"; toast("Sent to "+CONFIG.trainerName+"."); }
      else{ b.disabled=false; b.textContent="Send to trainer"; toast("The server refused it ("+r.status+"). Download the record and email it instead."); }
   })
   .catch(function(){
      b.disabled=false; b.textContent="Send to trainer";
      toast("Could not reach the server. Download the record and email it instead.");
   });
}
