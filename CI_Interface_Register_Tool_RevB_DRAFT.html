<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI Interface Register</title>
<style>
:root{
  --ink:#1E262E; --ink-2:#2C3841; --slate:#5C6D78; --mute:#8998A2;
  --paper:#FFFFFF; --surface:#F4F6F7; --surface-2:#EDF0F1; --rule:#D6DCDF;
  --rust:#A8481F; --rust-soft:#F2E4DD; --rust-ink:#7E340F;
  --teal:#1F5F5B; --teal-soft:#DFEAE8;
  --amber:#9A6508; --amber-soft:#F6ECD8;
  --alert:#8E2F2F; --alert-soft:#F4E2E2;
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--surface);font-size:15px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;color:inherit}
.top{background:var(--ink);color:#fff;padding:13px 20px}
.top b{font-family:var(--serif);font-size:16px;display:block;line-height:1.2}
.top span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#93A2AB}
.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 70px}
h1{font-family:var(--serif);font-size:27px;font-weight:400;margin:0 0 6px;line-height:1.2}
.lede{font-size:14px;color:var(--slate);margin:0 0 20px;max-width:72ch}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:8px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:16px 18px;margin:0 0 18px}
.card p{margin:0;font-size:13.5px;color:var(--ink-2)}
.card p+p{margin-top:9px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fld label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);line-height:1.45}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--rust);outline-offset:1px}
.small{font-size:12.5px;color:var(--slate);max-width:78ch}
.pull{font-family:var(--serif);font-size:15px;font-style:italic;color:var(--ink-2);border-left:3px solid var(--rust);padding-left:12px;margin:14px 0;max-width:66ch}

/* action bar */
.bar{position:sticky;top:0;z-index:30;background:var(--surface);padding:10px 0;margin:0 0 6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--rule)}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:4px;padding:8px 14px;font-size:13px;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.btn.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.pri:hover{background:var(--rust-ink)}
.btn.gh{background:transparent;color:var(--slate)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
#msg{font-size:12.5px;color:var(--slate);flex:1;min-width:200px}
.dirty{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:3px 7px;border-radius:3px}
.dirty.y{background:var(--amber-soft);color:var(--amber);border:1px solid #E4D3AF}
.dirty.n{background:var(--teal-soft);color:var(--teal);border:1px solid #BFD6D2}

.tally{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:12px 0 12px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:3px 9px;border-radius:3px;border:1px solid var(--rule);background:var(--surface-2);color:var(--slate);white-space:nowrap}
.chip.on{background:var(--rust-soft);color:var(--rust-ink);border-color:#E3CCC2}
.chip.hold{background:var(--amber-soft);color:var(--amber);border-color:#E4D3AF}
.chip.bad{background:var(--alert-soft);color:var(--alert);border-color:#E0BFBF}
.chip.ok{background:var(--teal-soft);color:var(--teal);border-color:#BFD6D2}
.chip.count{background:none;border-color:transparent;color:var(--mute)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--ink-2);margin:0 0 18px;flex-wrap:wrap}
.tab{border:0;background:none;padding:9px 13px 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--slate);border-radius:4px 4px 0 0}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab.on{background:var(--ink-2);color:#fff}
.tab .n{display:inline-block;margin-left:6px;padding:0 5px;border-radius:3px;background:var(--alert);color:#fff;font-size:9.5px;letter-spacing:0}
.tab .n.r{background:var(--amber)}
.tab:focus-visible{outline:2px solid var(--rust);outline-offset:2px}

/* hierarchy */
.split{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
.treebox{background:var(--paper);border:1px solid var(--rule);border-radius:6px;position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto}
.treehead{padding:9px 12px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:var(--paper);z-index:2}
.treehead label{font-size:12px;color:var(--slate);display:flex;gap:5px;align-items:center}
.tsec{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--alert);font-weight:700;padding:10px 12px 4px;border-top:1px solid var(--rule)}
.tn{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 0;border-left:3px solid transparent;cursor:pointer;font-size:13px;position:relative}
.tn:hover{background:var(--surface)}
.tn:focus-visible{outline:2px solid var(--rust);outline-offset:-2px}
.tn.sel{background:var(--rust-soft);border-left-color:var(--rust)}
.tn.ret .tname,.tn.ret .tid{opacity:.5;text-decoration:line-through}
.tw{width:18px;border:0;background:none;color:var(--mute);font-size:10px;padding:0;flex:none;line-height:1}
.tw.leaf{visibility:hidden}
.tid{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--rust-ink);flex:none}
.tname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bd{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;font-weight:700;padding:1px 4px;border-radius:3px;border:1px solid var(--rule);color:var(--slate);background:var(--surface-2);flex:none}
.bd.b{background:var(--rust-soft);color:var(--rust-ink);border-color:#E3CCC2}
.bd.p{background:var(--amber-soft);color:var(--amber);border-color:#E4D3AF}
.bd.g{background:var(--teal-soft);color:var(--teal);border-color:#BFD6D2}
.dot{min-width:17px;height:17px;border-radius:9px;font-size:10px;font-weight:700;color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;flex:none}
.dot.f{background:var(--alert)}
.dot.r{background:var(--amber)}
.guide{position:absolute;top:0;bottom:0;width:1px;background:var(--rule)}

.sect{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:15px 17px;margin:0 0 14px}
.sect.hd{border-left:3px solid var(--rust)}
.dh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dh h2{font-family:var(--serif);font-size:23px;font-weight:400;margin:0;line-height:1.2}
.dh .cid{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--rust-ink)}
.dchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.path{font-size:12px;color:var(--mute);margin-top:6px}
.path button{border:0;background:none;padding:0;color:var(--slate);font-size:12px;text-decoration:underline;text-underline-offset:2px}
.acts{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 0;padding-top:10px;border-top:1px solid var(--surface-2)}
.lnk{border:0;background:none;padding:2px 0;font-size:13px;font-weight:600;color:var(--slate);text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--rust)}
.lnk[disabled]{color:var(--mute);text-decoration:none;cursor:not-allowed}
.lnk:focus-visible{outline:2px solid var(--rust);outline-offset:2px;border-radius:3px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fgrid .wide{grid-column:1/-1}
.help{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.45}
.fm div{font-size:12px;padding:4px 8px;border-radius:3px;margin-top:5px;line-height:1.4}
.fm .flag,.fl .flag{background:var(--alert-soft);color:var(--alert)}
.fm .review,.fl .review{background:var(--amber-soft);color:var(--amber)}
.fm .note,.fl .note{background:var(--surface-2);color:var(--slate)}
.fld .x-flag{border-color:var(--alert)!important;background:#FBF4F4}
.fld .x-review{border-color:var(--amber)!important;background:#FCF8EF}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 16px;font-weight:700;font-size:13px;color:var(--slate)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--ink-2);color:#fff}
.seg button:focus-visible{outline:2px solid var(--rust);outline-offset:-2px}
.srcg{margin-bottom:8px}
.srcg .gl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700;margin:6px 0 4px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;padding:2px;border-radius:5px}
.sc{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:5px 9px;font-size:12.5px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.sc:hover{border-color:var(--slate)}
.sc.on{border-color:var(--rust);background:var(--rust-soft);color:var(--rust-ink);font-weight:600}
.sc .c1{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--alert);letter-spacing:.04em}
.sc.off{border-style:dashed;border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.srcs-wrap{border:1px solid transparent;padding:4px 6px}
.rec{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.rec b{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.impl{margin-top:10px;background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:10px 12px;font-size:12.5px;color:var(--ink-2)}
.impl .ok{color:var(--teal);font-weight:700}
.impl .no{color:var(--alert);font-weight:700}
.impl table{border-collapse:collapse;margin:6px 0 8px}
.impl td{padding:2px 14px 2px 0;font-size:12.5px}
.fl{margin-top:12px}
.fl .it{display:flex;gap:9px;align-items:baseline;padding:6px 9px;border-radius:4px;margin-bottom:4px;font-size:12.5px}
.fl .it .r{font-family:var(--mono);font-size:10px;font-weight:700;flex:none;min-width:30px}
.fl .it .c{font-family:var(--mono);font-size:10px;flex:none;opacity:.8}
.panel{margin-top:12px;background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:12px 14px}
.panel p{margin:0 0 9px;font-size:12.5px;color:var(--ink-2)}
.panel .row2{display:grid;grid-template-columns:160px 1fr;gap:8px;margin-bottom:6px}
.panel input[type=text]{padding:6px 8px;border:1px solid var(--rule);border-radius:4px;width:100%}
.cklist{max-height:200px;overflow:auto;border:1px solid var(--rule);border-radius:4px;background:var(--paper);padding:6px 8px;margin-bottom:9px}
.cklist label{display:flex;gap:7px;font-size:12.5px;padding:2px 0;align-items:center}

/* tables */
.gridwrap{overflow:auto;max-height:72vh;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
table.g{border-collapse:separate;border-spacing:0;font-size:12px}
table.g th{position:sticky;top:0;background:var(--ink-2);color:#fff;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;text-align:left;padding:7px 8px;vertical-align:bottom;z-index:2;min-width:70px;max-width:180px;white-space:normal;line-height:1.3}
table.g td{padding:5px 8px;border-bottom:1px solid var(--rule);border-right:1px solid var(--surface-2);vertical-align:top;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;background:var(--paper);cursor:pointer}
table.g th.s0,table.g td.s0{position:sticky;left:0;z-index:1;min-width:44px;width:44px}
table.g th.s1,table.g td.s1{position:sticky;left:44px;z-index:1;min-width:84px;border-right:2px solid var(--rule)}
table.g th.s0,table.g th.s1{z-index:3}
table.g td.s1{font-family:var(--mono);font-weight:700;color:var(--rust-ink)}
table.g tr:hover td{background:var(--surface)}
table.g td.x-flag{background:var(--alert-soft)!important;color:var(--alert)}
table.g td.x-review{background:var(--amber-soft)!important}
table.g tr.ret td{color:var(--mute)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.filters .fld{min-width:160px}
.filters label.ck{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2);padding-bottom:8px}
table.dt{border-collapse:collapse;width:100%;font-size:13px;background:var(--paper)}
table.dt th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--rule);background:var(--surface-2)}
table.dt td{padding:7px 10px;border-top:1px solid var(--rule);color:var(--ink-2);vertical-align:top}
table.dt td.k{font-family:var(--mono);font-size:12px;color:var(--rust-ink);font-weight:700;white-space:nowrap}
table.dt td.m{font-size:12px;color:var(--slate)}
table.dt input,table.dt select{width:100%;padding:5px 7px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);font-size:12.5px}
table.dt input:focus,table.dt select:focus{outline:2px solid var(--rust);outline-offset:1px}
table.dt td.x-flag input,table.dt td.x-flag select{border-color:var(--alert);background:#FBF4F4}
table.dt td.x-review input,table.dt td.x-review select{border-color:var(--amber);background:#FCF8EF}
.sev{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap}
.sev.flag{background:var(--alert-soft);color:var(--alert)}
.sev.review{background:var(--amber-soft);color:var(--amber)}
.sev.note{background:var(--surface-2);color:var(--slate)}
.cibtn{border:0;background:none;padding:0;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--rust-ink);text-decoration:underline;text-underline-offset:2px}

/* overview */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.tile{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.tile .v{font-family:var(--serif);font-size:32px;line-height:1.1}
.tile .t{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700;margin-bottom:4px}
.tile .s{font-size:12px;color:var(--mute);margin-top:4px}
.tile.alert{border-left:3px solid var(--alert)}
.tile.amb{border-left:3px solid var(--amber)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.todo{margin:0;padding:0;list-style:none}
.todo li{padding:9px 0;border-top:1px solid var(--surface-2);font-size:13.5px;color:var(--ink-2);display:flex;gap:10px;align-items:baseline}
.todo li:first-child{border-top:0}
.todo li .sev{flex:none}
.sbar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--surface-2);margin:4px 0 2px}
.sbar span{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--slate);margin:8px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.brow{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-2);margin:6px 0}
.brow .n{text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--slate)}
.empty{text-align:center;padding:40px 20px}
.empty h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 6px}
.empty .btnrow{justify-content:center}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px}
.ref h3{font-family:var(--serif);font-size:18px;font-weight:400;margin:22px 0 8px}
.ref ul{margin:0;padding-left:18px}
.ref li{font-size:13px;color:var(--ink-2);margin-bottom:6px;max-width:84ch}
.ref li b{color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.foot{font-size:12.5px;color:var(--slate);border-top:1px solid var(--rule);padding-top:14px;margin-top:30px}
.foot p{margin:0 0 7px}

@media(max-width:980px){
  .split{grid-template-columns:1fr}
  .treebox{position:static;max-height:46vh}
  .tiles,.grid4{grid-template-columns:1fr 1fr}
  .cols2{grid-template-columns:1fr}
}
@media(max-width:640px){
  .fgrid,.tiles,.grid4{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .top,.bar,.tabs,.acts,.treehead,.btnrow{display:none}
  body{background:#fff;font-size:11pt}
  .treebox{position:static;max-height:none;overflow:visible}
  .gridwrap{max-height:none;overflow:visible}
}
</style>
<style>
.prevbar{background:var(--amber-soft);color:var(--amber);border-bottom:1px solid #E4D3AF;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:6px 20px}
.ref .chg td{font-size:12.5px}
</style>
<style>
/* register additions */
.ixline{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ixline .small{flex:1;min-width:240px}
.hintck{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2);margin-left:4px}
.hintck input{accent-color:var(--rust)}
body.nohints .x-flag,body.nohints .x-review{background:inherit!important;border-color:var(--rule)!important;color:inherit!important}
body.nohints table.g td.x-flag,body.nohints table.g td.x-review{background:var(--paper)!important}
body.nohints .fm,body.nohints .dot{display:none!important}
.rl-sides{font-family:var(--mono);font-size:10.5px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tn .tid{min-width:62px}
.resolve{font-size:12px;margin-top:5px;padding:4px 8px;border-radius:3px;background:var(--surface-2);color:var(--slate)}
.resolve.ci{background:var(--teal-soft);color:var(--teal)}
.resolve.ext,.resolve.shared{background:var(--surface-2);color:var(--ink-2)}
.resolve.unk{background:var(--amber-soft);color:var(--amber)}
.sugg{margin-top:12px;background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--teal);border-radius:5px;padding:9px 12px;font-size:12.5px;color:var(--ink-2)}
.refchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.rc{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:3px;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2)}
.rc.ok{border-color:#BFD6D2;background:var(--teal-soft);color:var(--teal)}
.rc.stale{border-color:#E4D3AF;background:var(--amber-soft);color:var(--amber)}
.rc.unl{border-style:dashed;color:var(--slate)}
.rc.norev{border-color:#E4D3AF;color:var(--amber)}
.addsrc{display:flex;gap:6px;margin-top:6px;align-items:center}
.addsrc select{padding:5px 7px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);font-size:12.5px;max-width:100%}
.pill{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:10px;border:1px solid var(--rule);background:var(--surface-2);color:var(--slate);white-space:nowrap}
.pill.ok{background:var(--teal-soft);color:var(--teal);border-color:#BFD6D2}
.pill.bad{background:var(--alert-soft);color:var(--alert);border-color:#E0BFBF}
.pill.hold{background:var(--amber-soft);color:var(--amber);border-color:#E4D3AF}
.pill.off{background:transparent;color:var(--mute);border-style:dashed}
.kv{display:grid;grid-template-columns:170px 1fr;gap:4px 12px;font-size:13px;margin:8px 0 0}
.kv dt{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);font-weight:700;padding-top:2px}
.kv dd{margin:0;color:var(--ink-2)}
.steps .step{display:grid;grid-template-columns:210px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--surface-2)}
.steps .step:first-child{border-top:0}
.steps .sn{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--rust-ink);font-weight:700}
.steps .st{font-family:var(--serif);font-size:16px;color:var(--ink);margin:2px 0 6px}
.steps ul{margin:6px 0 0;padding-left:18px}
.steps li{font-size:12.5px;color:var(--ink-2);margin-bottom:3px}
.steps .why{font-size:12.5px;color:var(--slate)}
.covform{display:grid;grid-template-columns:200px 1fr 130px 1fr;gap:10px}
.covform .wide{grid-column:1/-1}
.stale{background:var(--amber-soft);color:var(--amber);border:1px solid #E4D3AF;border-radius:5px;padding:8px 12px;font-size:12.5px;margin:0 0 12px}
.diff{font-size:12.5px;color:var(--ink-2);margin:8px 0 0}
.diff b{font-family:var(--mono);font-size:11px}
td.over{color:var(--alert);font-weight:700}
table.dt textarea{width:100%;padding:5px 7px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);font-size:12.5px;font-family:inherit;resize:vertical;min-height:34px}
table.dt td.x-flag textarea{border-color:var(--alert);background:#FBF4F4}
table.dt td.x-review textarea{border-color:var(--amber);background:#FCF8EF}
tr.cleared td{opacity:.6}
/* CI Index column map */
.ixpanel{margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.minlist{margin:0 0 8px;padding-left:20px;font-size:13px;color:var(--ink-2)}
.minlist li{margin-bottom:4px}
.ixpanel code,.ixmap code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:0 4px;border-radius:3px}
table.ixmap td{font-size:12.5px}
.nebox{margin-top:8px;background:var(--amber-soft);border:1px solid #E4D3AF;border-radius:5px;padding:8px 12px;font-size:12.5px;color:var(--ink-2)}
.nebox ul{margin:6px 0 0}
/* matrix */
.mapbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.mapbar label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.nxwrap{overflow:auto;max-height:72vh;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
table.nx{border-collapse:separate;border-spacing:0;font-size:11.5px}
table.nx th{position:sticky;background:var(--paper);font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink-2)}
table.nx thead th{top:0;z-index:2;vertical-align:bottom;padding:6px 2px 6px;border-bottom:2px solid var(--ink-2);text-align:center;cursor:default}
table.nx thead th .vt{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;display:inline-block;max-height:190px;overflow:hidden;text-overflow:ellipsis}
table.nx tbody th{left:0;z-index:1;text-align:left;padding:3px 10px 3px 6px;white-space:nowrap;border-right:2px solid var(--ink-2);max-width:300px;overflow:hidden;text-overflow:ellipsis}
table.nx tbody th .nm{font-family:var(--sans);font-weight:400;color:var(--slate);margin-left:6px}
table.nx thead th.corner{left:0;z-index:3;text-align:left;font-family:var(--sans);font-weight:400;color:var(--mute);padding:6px}
table.nx td{width:30px;min-width:30px;height:25px;text-align:center;border-right:1px solid var(--surface-2);border-bottom:1px solid var(--surface-2);font-family:var(--mono);font-weight:700;font-size:11px;padding:0}
table.nx td.hit{cursor:pointer}
table.nx td.c-diag{background:var(--surface-2);color:var(--slate)}
table.nx td.c-map{background:var(--teal-soft);color:var(--teal)}
table.nx td.c-safe{background:var(--rust-soft);color:var(--rust-ink)}
table.nx td.c-unm{background:var(--alert-soft);color:var(--alert)}
table.nx td.c-ret{color:var(--mute);background:repeating-linear-gradient(45deg,var(--paper),var(--paper) 3px,var(--surface-2) 3px,var(--surface-2) 6px)}
table.nx td.c-gap{box-shadow:inset 0 0 0 2px var(--alert);color:var(--alert)}
table.nx td.c-sel{box-shadow:inset 0 0 0 2px var(--ink)}
table.nx th.lane{background:var(--surface)}
table.nx th.gap,table.nx th.gap .vt{color:var(--alert)}
table.nx tr.hl th,table.nx th.hl{background:var(--rust-soft)}
.swatch{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:5px;border:1px solid var(--rule)}
/* diagram */
.dgwrap{overflow:auto;border:1px solid var(--rule);border-radius:6px;background:var(--paper);max-height:76vh;position:relative}
.dgwrap svg{display:block}
.dgwrap svg text{font-family:var(--sans)}
.dgwrap .nd{cursor:pointer}
.dgwrap .eg{cursor:pointer}
.dgwrap .eg:hover path{stroke-opacity:1}
.zoom{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--paper)}
.zoom button{border:0;background:transparent;padding:5px 11px;font-weight:700;color:var(--slate)}
.zoom button+button{border-left:1px solid var(--rule)}
.detailbox{margin-top:14px}
@media(max-width:980px){ .covform{grid-template-columns:1fr 1fr} .steps .step{grid-template-columns:1fr} .kv{grid-template-columns:1fr} }
@media(max-width:640px){ .covform{grid-template-columns:1fr} }
</style>
</head>

ne appears on at least one active row.","basis":"Coverage checks, Step 1","revs":true,"unlisted":true},"S2":{"on":true,"mode":"exception","name":"Landing","what":"Every active row is Mapped or Internal. An Unmapped row is an exception.","basis":"Coverage checks, Step 2"},"S3":{"on":true,"mode":"exception","name":"CI coverage","what":"Every CI in the CI index that is not de-designated or superseded appears on at least one Mapped row.","basis":"Coverage checks, Step 3"},"S4":{"on":true,"mode":"exception","name":"Structural floor","what":"Each parent and child in different control tiers shares a Mapped row. Each GFE CI appears on a Mapped row. Each named external item appears on an External row.","basis":"Coverage checks, Step 4","pc":true,"gfe":true,"ext":true},"S5":{"on":true,"mode":"exception","name":"Incorporation","what":"Every Mapped row names an Invoking Specification.","basis":"Coverage checks, Step 5"},"S6":{"on":true,"mode":"exception","name":"ICD cross-check","what":"Each ICD on a CI’s index row appears on a register row for that CI. Each ICD, IRS, and IDD on a Mapped row appears on the index row of each side CI.","basis":"Coverage checks, Step 6"},"S7":{"on":true,"mode":"exception","name":"Safety cross-check","what":"Each safety-related row has a side CI with Criterion (b) Met = Y. Each SCI with no SCI child CI has a safety-related row.","basis":"Coverage checks, Step 7"},"MA":{"on":true,"mode":"finding","name":"Model alignment","what":"A Mapped row between two modeled CIs cites an MBSE Interface Element ID, unless a side CI carries a model alignment exception.","basis":"Coverage checks, Model alignment"}},"rules":{"ID1":{"on":true,"sev":"flag","area":"Identification","what":"Every row carries an Interface ID.","basis":"Column notes, Interface ID","needs":["id"]},"ID2":{"on":true,"sev":"flag","area":"Identification","what":"Each Interface ID is unique.","basis":"Column notes, Interface ID","needs":["id"]},"MS1":{"on":true,"sev":"flag","area":"Completeness","what":"Every row has a Mapping Status.","basis":"How to use, completeness checks","needs":["map"]},"MS2":{"on":true,"sev":"flag","area":"Completeness","what":"Every row names an interface source.","basis":"How to use, completeness checks","needs":["src"]},"MS3":{"on":true,"sev":"flag","area":"Completeness","what":"A Mapped row has a Boundary Type.","basis":"How to use, completeness checks","needs":["map","bnd"]},"MS4":{"on":true,"sev":"flag","area":"Completeness","what":"A Mapped row names its Invoking Specification.","basis":"How to use, completeness checks","needs":["map","inv"]},"MS5":{"on":true,"sev":"flag","area":"Completeness","what":"Internal and Unmapped rows leave Boundary Type blank.","basis":"How to use, completeness checks","needs":["map","bnd"]},"MS6":{"on":true,"sev":"review","area":"Completeness","what":"An active Unmapped row stays highlighted until it is dispositioned.","basis":"How to use, completeness checks","needs":["map"]},"MS7":{"on":true,"sev":"flag","area":"Completeness","what":"Safety-Related = Y needs a Hazard Control Ref.","basis":"How to use, completeness checks","needs":["safe","haz"]},"MS8":{"on":true,"sev":"flag","area":"Completeness","what":"Allocated to Supplier = Y needs an SSOW.","basis":"How to use, completeness checks","needs":["alloc","ssow"]},"MS9":{"on":true,"sev":"flag","area":"Completeness","what":"Row Status = Superseded needs Superseded By.","basis":"How to use, completeness checks","needs":["rstat","supby"]},"SD1":{"on":true,"sev":"review","area":"Sides","what":"Side A and Side B are both filled.","basis":"Column notes, Side A and Side B","needs":["a","b"]},"SD2":{"on":true,"sev":"flag","area":"Sides","what":"An Internal row names the same CI on both sides.","basis":"Column notes, Side A and Side B","needs":["map","a","b"]},"SD3":{"on":true,"sev":"review","area":"Sides","what":"A Mapped row with the same CI on both sides reads Internal.","basis":"How to use, Mapping Status","needs":["map","a","b"]},"IX1":{"on":true,"sev":"review","area":"CI Index","what":"Side A is a CI in the CI Index snapshot.","basis":"Column notes, Side A and Side B","needs":["a"],"ix":true},"IX2":{"on":true,"sev":"review","area":"CI Index","what":"Both sides of a Same-Tier or Control-Level row are CIs in the snapshot.","basis":"Column notes, Boundary Type","needs":["bnd","a","b"],"ix":true},"IX3":{"on":true,"sev":"review","area":"CI Index","what":"Side B of an External or Shared row is not a CI.","basis":"Column notes, Boundary Type","needs":["bnd","b"],"ix":true},"IX4":{"on":true,"sev":"review","area":"CI Index","what":"Boundary Type agrees with the control tiers of the two CIs.","basis":"Column notes, Boundary Type","needs":["map","bnd","a","b"],"ix":true},"IX5":{"on":true,"sev":"review","area":"CI Index","what":"An active row does not land on a de-designated or superseded CI.","basis":"How to use, splits and consolidations","needs":["a","b","rstat"],"ix":true},"IX6":{"on":true,"sev":"review","area":"CI Index","what":"A safety-related row has a side CI with Criterion (b) Met = Y.","basis":"Coverage checks, Step 7","needs":["safe","a","b"],"ix":true},"SR1":{"on":true,"sev":"review","area":"Sources","what":"Each interface source carries its revision, as document §x Rev y.","basis":"Column notes, ICD(s) and Other Interface Sources","needs":["src"]},"SR2":{"on":true,"sev":"review","area":"Sources","what":"Each cited revision matches the revision on the source list.","basis":"Coverage checks, Step 1","needs":["src"]},"SR3":{"on":true,"sev":"note","area":"Sources","what":"Each cited source is on the source list.","basis":"Coverage checks, Step 1","needs":["src"]},"CT1":{"on":true,"sev":"review","area":"Control","what":"A Mapped row records its Controlling Baseline and Control Authority.","basis":"Column notes, Controlling Baseline and Control Authority","needs":["map","base","auth"]},"CT2":{"on":true,"sev":"review","area":"Control","what":"SSOW stays blank unless Allocated to Supplier = Y.","basis":"Column notes, SSOW","needs":["alloc","ssow"]},"CT3":{"on":true,"sev":"review","area":"Control","what":"Hazard Control Ref stays blank unless Safety-Related = Y.","basis":"How to use, safety-related interfaces","needs":["safe","haz"]},"CT4":{"on":true,"sev":"review","area":"Control","what":"Variant Applicability is recorded.","basis":"How to use, Variant Applicability","needs":["var"]},"SU1":{"on":true,"sev":"flag","area":"Supersession","what":"Every ID in Superseded By exists on the register.","basis":"How to use, never delete a row","needs":["supby"]},"SU2":{"on":true,"sev":"review","area":"Supersession","what":"A row that names Superseded By reads Superseded.","basis":"Column notes, Row Status","needs":["rstat","supby"]},"SL1":{"on":true,"sev":"flag","area":"Source list","what":"Each source document number is unique.","basis":"Coverage checks, Step 1","needs":[]},"SL2":{"on":true,"sev":"review","area":"Source list","what":"A released source records its revision.","basis":"Coverage checks, Step 1","needs":[]},"SL3":{"on":true,"sev":"review","area":"Source list","what":"A source carries a type from the source type list.","basis":"Build settings, source types","needs":[]},"EX1":{"on":true,"sev":"review","area":"Exceptions","what":"An open exception names an owner and a due date.","basis":"Coverage checks: give every exception an owner and a due date","needs":[]},"EX2":{"on":true,"sev":"flag","area":"Exceptions","what":"An open exception is not past its due date.","basis":"Coverage checks: give every exception an owner and a due date","needs":[]},"EX3":{"on":true,"sev":"review","area":"Exceptions","what":"A dispositioned exception records its disposition.","basis":"Process, coverage exception dispositions","needs":[]},"LS1":{"on":true,"sev":"review","area":"Lists","what":"A dropdown column holds a value from its list.","basis":"Lists sheet","needs":[]},"TY1":{"on":true,"sev":"review","area":"Format","what":"A number or date column holds a number or a date.","basis":"Build settings","needs":[]}},"custom":[],"idx":{"fields":[{"k":"id","h":"CI ID","alias":[],"use":"Every check that reads the index. Side A and Side B match on it.","blank":"The row is skipped. CI ID is the only entry the register requires."},{"k":"parent","h":"Parent CI ID","alias":[],"use":"Step 4 parent and child pairs. Step 7 SCI child test. The hierarchy in By CI, the matrix, and the diagram.","blank":"The CI is treated as top level. No parent and child pair is checked for it."},{"k":"name","h":"CI Name / Nomenclature","alias":["CI Name"],"use":"Labels in By CI, the row form, the matrix, and the diagram.","blank":"The CI shows by ID only. No check reads the name."},{"k":"type","h":"CI Type","alias":[],"use":"Shown in By CI.","blank":"No effect on any check."},{"k":"tier","h":"Control Tier","alias":["Control"],"use":"Step 4 parent and child pairs and GFE CIs. Hint IX4. The suggested boundary type.","blank":"Step 4 lists each pair with this CI as not evaluated. The suggestion cannot tell Same-Tier from Control-Level."},{"k":"pin","h":"PIN","alias":[],"use":"Kept in the snapshot for reference.","blank":"No effect on any check."},{"k":"icd","h":"ICD (optional)","alias":["ICD"],"use":"Step 6 ICD cross-check, in both directions.","blank":"Step 6 has nothing to check from the index side. A Mapped row on this CI that cites an ICD, IRS, or IDD is listed as not evaluated, or raised as an exception if the build says so."},{"k":"mbse","h":"MBSE Element ID","alias":[],"use":"Model alignment report. A CI with a model element counts as modeled.","blank":"The CI counts as not modeled. Rows on it raise no model alignment finding."},{"k":"mae","h":"Model Alignment Exception","alias":[],"use":"Model alignment report. Rows on this CI are exempt.","blank":"No exemption."},{"k":"critB","h":"Criterion (b) Met (Y/N)","alias":[],"use":"Step 7. A safety-related row needs a side CI with Y. Hint IX6.","blank":"A safety-related row whose side CIs all leave it blank is listed as not evaluated, or raised as an exception if the build says so."},{"k":"sci","h":"SCI (Y/N)","alias":[],"use":"Step 7. An SCI with no SCI child needs a safety-related row.","blank":"The CI counts as not SCI. Step 7 does not check it, and it does not count as an SCI child. The coverage results count these CIs."},{"k":"status","h":"Status","alias":[],"use":"Steps 3, 4, 6, and 7 skip de-designated and superseded CIs. Hint IX5.","blank":"The CI counts as live, so every step checks it."}],"sheets":["CI Index","CI Index Snapshot"],"tiers":{"acq":"Acquirer-spec controlled","co":"Company-spec controlled","gfe":"GFE"},"retired":["De-designated","Superseded (split)","Superseded (consolidated)"],"yes":"Y","staleDays":30,"blankNotEval":true},"owners":["Systems Engineering","System Safety","CM","Supplier Requirements Engineering","Human Factors"],"instr":[{"title":"","kind":"para","items":["Rev C DRAFT. Per the interface identification, verification, and recording section and the records and outputs section of the CI Identification Process. Maintained current in the CSA system. Interface requirement identification is mandatory for safety. Systems Engineering’s interface sources are the evidence that it was performed. The register and the Coverage Log are CM’s evidence that every identified interface was mapped to the CI structure, incorporated into the configuration documentation, and placed under configuration control."]},{"title":"What this register is","kind":"list","items":["The register maps interfaces to the CI structure. Systems Engineering identifies and defines each interface in an interface source. CM maps it to the CIs it joins. The register records the mapping.","The register points to the interface sources. It does not copy interface content, and it does not repeat Systems Engineering’s work. The ICDs, specifications, drawings, and model hold the content. The register is not an interface diagram.","A row records the interface between two sides. It is not scoped to a document. One ICD often defines several interfaces between several CIs, so it appears on every row it defines. One interface defined in several sources lists every source on its row.","Each column holds a fixed property of the row. Coverage check results are events, so they go on the Coverage Log."]},{"title":"How to use","kind":"list","items":["Enter data only on the ‘Interface Register’ and ‘Coverage Log’ sheets, below the header row. The ‘By CI’ sheet is a read-only view. Type a CI ID in its yellow cell to list every row that CI appears on.","Systems Engineering identifies and defines interfaces in the interface sources the CM plan names. CM maps each interface as its source is released or revised. Human Factors identifies human system interfaces. Each one is defined in the interface source for the interface it sits on, or in the specification of the CI the person operates or maintains. It takes no row of its own. System Safety identifies interfaces that carry a hazard risk control. Supplier Requirements Engineering confirms which supplier holds an interface under contract.","Interface sources: interface control documents, interface requirements specifications, and interface design descriptions; the interface sections of specifications, source control drawings, and drawings; and, where MBSE is used, interface elements between model elements at the CI-designation level. The CM plan names the sources for the program.","One row per interface between two sides. The two sides are two CIs, a CI and an external item, or a CI and a shared interface. A pair of sides takes more than one row only where its variants carry distinct interface callouts, or where its interfaces sit under different control authorities.","A shared interface, such as a data bus defined by one ICD, takes one row per participating CI. Side B names the shared interface. A ten-terminal bus takes ten rows, not forty-five.","Mapping Status. Mapped: the interface joins two CIs, a CI and an external item, or a CI and a shared interface. Internal: the interface lies within one CI. Record it, so a later split can re-map it. Unmapped: a side resolves to no CI and no named external item. The row is a coverage exception until it is dispositioned.","External items include other systems, facilities, support equipment, and existing customer items the work installs into or connects to. Customer test equipment the work must interface with is External too. CIs that exist only between a sub-supplier and the company have no rows here.","Variant Applicability identifies which PIN variants of a CI a row applies to: ‘All’, specific variant PINs, or ‘N/A’. Where one ICD carries distinct callouts for different variants, use one row per callout. Appearing on the same ICD is not evidence of a common interface.","Never delete a row. A split re-maps every row that landed on the old CI. Set the old row to Superseded and enter the re-mapped Interface IDs in Superseded By. Re-map the old CI’s Internal rows too. A consolidation puts the interfaces between the old CIs inside one CI. Supersede each such row with an Internal row and say why in Notes. Set Row Status = Retired where the interface source no longer defines the interface.","Safety-related interfaces, those that carry or bound a hazard risk control, get Safety-Related = Y and the hazard control reference.","Interface requirements flow into the configuration documentation and are controlled once baselined. Changes to a baselined interface go through formal change action. Both are mandatory for safety. Invoking Specification shows where the flow happens.","Completeness checks highlight a cell for review. They do not block entry. Every row needs a Mapping Status and an interface source. Mapped needs Boundary Type and Invoking Specification. Internal and Unmapped leave Boundary Type blank. An active Unmapped row stays highlighted until it is dispositioned. Safety-Related = Y needs Hazard Control Ref. Allocated to Supplier = Y needs SSOW. Row Status = Superseded needs Superseded By."]},{"title":"Coverage checks","kind":"list","items":["Run a coverage check at CI-list submittal for Acquirer concurrence, at each technical review, and before each baseline is established. Record each check as one row on the Coverage Log. Give every exception an owner and a due date.","Step 1, source coverage. Every released interface source the CM plan names is mapped. Each interface it defines has a row. An interface with no row is an exception.","Step 2, landing. Every row is Mapped or Internal. An Unmapped row is an exception.","Step 3, CI coverage. Every CI in the CI index that is not de-designated or superseded appears on at least one Mapped row. A CI that no interface lands on is an exception.","Step 4, structural floor. CM checks three facts from the CI index and the contract alone. Each parent and child in different control tiers shares a Mapped row. Each GFE CI appears on a Mapped row. Each external item named in the system specification or the contract appears on an External row. A floor gap is an exception. Where Systems Engineering confirms that no interface exists, record that confirmation as the disposition. Nothing is signed in advance.","Step 5, incorporation. Every Mapped row names an Invoking Specification. A released interface that no specification invokes is an exception. Incorporation is mandatory for safety.","Step 6, ICD cross-check. Where a CI’s index row lists ICDs, each one appears in ICD(s) and Other Interface Sources on at least one row for that CI. Each ICD, IRS, and IDD on a Mapped row appears in the ICD column of each side CI’s index row. External items and shared interfaces are exempt. Specifications, source control drawings, and drawings are not checked.","Step 7, safety cross-check. A row with Safety-Related = Y has at least one side CI with Criterion (b) Met = Y in the CI index. A CI with SCI = Y and no SCI child CI has at least one Safety-Related row, unless System Safety records that none of its interfaces carries or bounds a hazard risk control. Cite that record with the exception.","Model alignment. Where MBSE is used, a Mapped row between two modeled CIs that cites no MBSE Interface Element ID goes to Systems Engineering as a model alignment finding. The exception is a side CI that carries a Model Alignment Exception in the CI index. CM reports the finding. CM does not correct the model.","The check verifies coverage, not technical content. Systems Engineering and the technical review process verify technical adequacy. No register finds an interface that nobody identified. That stays with Systems Engineering, through the model and the technical reviews."]},{"title":"Sheets the tool adds","kind":"list","items":["The CI Interface Register tool wrote this workbook. Its first five sheets follow the template. The sheets after Lists come from the tool.","Sources lists each interface source the CM plan names, with its type, revision, and release status. Coverage Step 1 reads it.","External Items lists each external item named in the system specification or the contract. The structural floor reads it.","Exceptions holds one row per coverage exception, with its owner, due date, action, disposition, and state. The Coverage Log Disposition cell is built from it.","Checks lists every completeness finding, its rule, and its cell. A cell shaded red carries a flag. A cell shaded amber carries a review item.","CI Index Snapshot holds the CI Index data the coverage check used. The CI Index stays the record.","CI Index Column Map lists each CI Index column the register reads, the header it accepts, what reads it, and what a blank cell does. CI ID is the only column a row needs to load."]}],"reference":[{"title":"What this register is","kind":"list","items":["The register maps interfaces to the CI structure. Systems Engineering identifies and defines each interface in an interface source. CM maps it to the CIs it joins. The register records the mapping.","The register points to the interface sources. It does not copy interface content, and it does not repeat Systems Engineering’s work. The ICDs, specifications, drawings, and model hold the content. The register is not an interface diagram.","A row records the interface between two sides. It is not scoped to a document. One ICD often defines several interfaces between several CIs, so it appears on every row it defines. One interface defined in several sources lists every source on its row.","Each column holds a fixed property of the row. Coverage check results are events, so they go on the Coverage Log."]},{"title":"Definitions","kind":"list","items":["**Interface.** The functional and physical characteristics at a common boundary. (EIA-649-1A)","**Interface source.** An artifact in which Systems Engineering identifies and defines interfaces, and which the program CMP names as an interface source. Interface sources include interface control documents, interface requirements specifications, interface design descriptions, the interface sections of specifications, source control drawings, and drawings, and, where MBSE is used, interface elements between model elements at the CI-designation level. One interface source may define interfaces between several pairs of items. One interface may be defined in several interface sources. (CI Identification Process)","**Interface control documentation (ICD).** Interface control drawings, requirements, or other descriptive products, which define, describe, and/or depict physical, functional, and test interface of related or co-functioning Configuration Items. (EIA-649-1A)","**Interface control working group (ICWG).** For programs, which encompass a system, Configuration Item or a Computer software Configuration item (CSCI) design cycle, an ICWG is established to control interface activity among the Acquirer, Supplier(s), or other agencies including documentation of interface agreements and resolution of interface problems. (EIA-649-1A)","**Control Tier.** The record of who baselines and controls a CI’s specification. The three tiers are Acquirer-spec controlled, Company-spec controlled, and GFE. (CI Identification Process)"]},{"title":"","kind":"pull","items":["CM owns coverage. Systems Engineering owns content."]},{"title":"How the tool works","kind":"list","items":["**Enter what you have.** Partial rows are normal. Hints shade a cell for review. They never block entry. Turn them off with Show hints.","**The coverage check runs when you press the button.** Nothing runs on its own. Run it as often as you like. Record it only at the events the process names: CI-list submittal, each technical review, and before each baseline.","**Exceptions carry forward.** Recording a check writes each exception once. The next check finds the same gap and updates it. It does not open a second one. An exception the next check no longer finds is marked Cleared.","**The CI Index is a reference, not a gate.** Load a CI Index save file or Excel export as a snapshot. Steps 3, 4, 6, and 7 and the model alignment report read it. Without it, those steps read Not run. Everything else works.","**The index can be partial.** A row needs only a CI ID to load. A blank cell never stops the load. The coverage check lists what it could not evaluate, so a gap in the index shows as a gap, not as a pass. The column map below says what each column feeds.","**The source list feeds Step 1.** List each interface source the CM plan names, with its revision and release status. The tool flags rows that cite an older revision. Seed the list from the rows already entered.","**Views.** By CI lists every row on one CI. The interface map shows an N-squared matrix and a node-and-line diagram. Sources shows the impact of a source revision on rows and CIs.","**Rows are retired or superseded, not deleted.** A row counted by a recorded coverage check cannot be deleted. The split and consolidation guides re-map rows and write the Superseded By trace.","**Save keeps everything.** The saved file holds the register, the Coverage Log, the exceptions, the source list, the CI Index snapshot, and the edit log. The Excel export follows the template, with the By CI sheet live. Import reads the template or a prior export."]}],"examples":{"rows":[{"id":"IF-0001","map":"Mapped","bnd":"External","a":"CI-0001","b":"Ground Support System (customer equipment)","src":"ICD-1000-501 Rev C","inv":"SS-1000","base":"FBL","auth":"CCB + ICWG","alloc":"N","ssow":"","mbse":"if.AV-GSS","var":"All","safe":"N","haz":"","rstat":"Active","supby":"","notes":"System-boundary data link. The structural floor names the Ground Support System as an external item. Control Authority records the ICWG control."},{"id":"IF-0002","map":"Mapped","bnd":"Same-Tier","a":"CI-0013","b":"CI-0014","src":"IRS-2210-101 Rev B; IDD-2211-001 Rev A","inv":"PS-2210; SRS-2211","base":"ABL","auth":"Program CCB","alloc":"N","ssow":"","mbse":"if.FCC-OFP","var":"All","safe":"Y","haz":"HL-015-C2","rstat":"Active","supby":"","notes":"FCC to OFP execution interface. A hosted CSCI and its host. One interface defined in two sources, so one row lists both. Hosts a hazard control."},{"id":"IF-0003","map":"Mapped","bnd":"Control-Level","a":"CI-0013","b":"CI-0021","src":"ICD-2200-210 §4.1 Rev A","inv":"PS-2210; SCD-2230-001","base":"ABL","auth":"Program CCB","alloc":"N","ssow":"","mbse":"if.FCC-ACT","var":"ACT-2230-002 only","safe":"Y","haz":"HL-014-C1","rstat":"Active","supby":"","notes":"Baseline-connector variant; see IF-0006. The company fixed the interface in ICD-2200-210, and SCD-2230-001 invokes it. ACME consumes the definition, so the interface is not allocated."},{"id":"IF-0006","map":"Mapped","bnd":"Control-Level","a":"CI-0013","b":"CI-0021","src":"ICD-2200-210 §4.2 Rev A","inv":"PS-2210; SCD-2230-001","base":"ABL","auth":"Program CCB","alloc":"N","ssow":"","mbse":"if.FCC-ACT2","var":"ACT-2230-004 only","safe":"Y","haz":"HL-014-C1","rstat":"Active","supby":"","notes":"Revised-connector variant. A distinct callout on the same ICD, so it takes its own row."},{"id":"IF-0004","map":"Mapped","bnd":"Control-Level","a":"CI-0012","b":"CI-0021","src":"SCD-2230-001 Rev A","inv":"PS-2200","base":"ABL","auth":"Program CCB","alloc":"N","ssow":"","mbse":"if.FCS-ACT","var":"All","safe":"N","haz":"","rstat":"Active","supby":"","notes":"Parent and child in different control tiers: part of the structural floor. The SCD fixes the actuator’s form, fit, function, and interface."},{"id":"IF-0009","map":"Mapped","bnd":"Same-Tier","a":"CI-0013","b":"CI-0030","src":"ICD-2210-310 Rev A","inv":"PS-2210; PS-3100","base":"ABL","auth":"Program CCB","alloc":"N","ssow":"","mbse":"if.FCC-MC","var":"All","safe":"N","haz":"","rstat":"Active","supby":"","notes":"CIs in different branches. ICD-2210-310 defines the interface, so CM maps it like any other. It lands at the flight control computer, not at its parent."},{"id":"IF-0010","map":"Mapped","bnd":"Control-Level","a":"CI-0053","b":"CI-0054","src":"ICD-G-4000 Rev C (Government)","inv":"PS-2320","base":"ABL","auth":"ICWG","alloc":"N","ssow":"","mbse":"if.ANT-MJT","var":"All","safe":"N","haz":"","rstat":"Active","supby":"","notes":"Company CI to GFE. The Government holds the terminal definition and the ICD. The ICWG controls the interface."},{"id":"IF-0011","map":"Mapped","bnd":"Control-Level","a":"CI-0050","b":"CI-0051","src":"SCD-2390-001 Rev B","inv":"PS-2310","base":"ABL","auth":"Program CCB","alloc":"N","ssow":"","mbse":"if.VHF-ANT","var":"All","safe":"N","haz":"","rstat":"Active","supby":"","notes":"SCD-2390-001 defines two interfaces: this one and IF-0013. One source, two rows. The company fixed the interface, so BRAVO consumes it and the interface is not allocated."},{"id":"IF-0013","map":"Mapped","bnd":"Control-Level","a":"CI-0052","b":"CI-0053","src":"SCD-2390-001 Rev B","inv":"PS-2320","base":"ABL","auth":"Program CCB","alloc":"N","ssow":"","mbse":"if.MIDS-ANT","var":"All","safe":"N","haz":"","rstat":"Active","supby":"","notes":"The same function worst(list){ if(!list||!list.length) return ''; if(list.some(function(f){ return f.sev==='flag'; })) return 'flag'; if(list.some(function(f){ return f.sev==='review'; })) return 'review'; return 'note'; }

  f.ciNot=stepCell(st.S3,st.S3&&joinItems(st.S3));
  f.floor=stepCell(st.S4,st.S4&&(joinItems(st.S4)+(st.S4.part?' ('+st.S4.part.replace(/\.$/,'')+')':'')));
  f.uninv=stepCell(st.S5,st.S5&&joinItems(st.S5));
  f.icd=stepCell(st.S6,st.S6&&(st.S6.items.length?plural(st.S6.items.length,'exception')+': '+joinItems(st.S6):'Pass'));
  f.safety=stepCell(st.S7,st.S7&&joinItems(st.S7));
  f.model=stepCell(st.MA,st.MA&&(joinItems(st.MA)+(st.MA.note?'. '+st.MA.note:'')));
  var sc=cov.scopeN+' document'+(cov.scopeN===1?'':'s');
  if(cov.mbse) sc+='; model interface elements at the CI-designation level';
  f.scope=sc;
  f.steps={}; STEP_IDS.forEach(function(id){ var s=st[id]; f.steps[id]=!s||!s.on?'off':!s.ran?'notrun':s.items.length?String(s.items.length):'pass'; });
  return f;
}
function nextCheckId(){ var mx=0, pre='CC-', w=3; S.checks.forEach(function(c){ var m=/^(.*?)(\d+)$/.exec(c.checkId||''); if(m){ var n=+m[2]; if(n>=mx){ mx=n; pre=m[1]; w=m[2].length; } } }); return pre+String(mx+1).padStart(w,'0'); }
function nextExcId(){ var mx=0; S.exc.forEach(function(e){ var m=/(\d+)$/.exec(e.id||''); if(m) mx=Math.max(mx,+m[1]); }); return 'EX-'+String(mx+1).padStart(3,'0'); }
function recordCoverage(){

  var rec={checkId:id, evType:cf.evType||'', event:tr(cf.event), date:tr(cf.date)||today(), scope:tr(cf.scope)||f.scope,
    nMap:f.nMap, nInt:f.nInt, nUnm:f.nUnm, ciNot:f.ciNot, floor:f.floor, uninv:f.uninv, icd:f.icd, safety:f.safety, model:f.model,
    disp:'', status:'', by:tr(cf.by)||S.meta.who||'', steps:f.steps, rows:S.rows.filter(active).map(function(r){ return tr(r.id); }).filter(Boolean), at:stamp()};
  S.checks.push(rec);

  found.forEach(function(x){
    seenK[x.key]=1;
    var e=excFor(x.key);
    if(e){
      if(e.state===XS.clear){ e.reBy=id; e.reFrom=e.clearedBy; e.state=XS.open; e.clearedBy=''; nRe++; logEdit(e.id,'state',XS.clear,XS.open,'Reopened by '+id); }

function undoLastCheck(){

    if(e.reBy===id){ e.state=XS.clear; e.clearedBy=e.reFrom||''; e.reBy=''; e.reFrom=''; }

function excLine(e){

function mapRows(){ return S.rows.filter(function(r){ return S.mopt.ret||active(r); }); }
function mapNodes(){
  var out=[], seen={};
  if(IX.on) IX.order.forEach(function(c){ if(S.mopt.ret||ixLive(c)){ seen[c.id]=1; out.push({id:c.id,name:c.name||'',lvl:IX.lvl[c.id]||0,c:c}); } });
  var extra=[];
  mapRows().forEach(function(r){ [tr(r.a),tr(r.b)].forEach(function(x,i){ if(x&&!seen[x]&&(i===0||sideKind(x)==='ci')){ seen[x]=1; extra.push(x); } }); });
  extra.sort().forEach(function(x){ out.push({id:x,name:'',lvl:0,c:null,stray:IX.on}); });
  return out;
}
function laneKind(b){ var k=sideKind(b); return k==='ci'?null:k; }
function mapModel(){
  var nodes=mapNodes(), isNode={}; nodes.forEach(function(n){ isNode[n.id]=n; });
  var lanes=[], laneBy={};
  function lane(kind,name){ var k=kind+':'+norm(stripParen(name)||name); if(!laneBy[k]){ laneBy[k]={key:'L:'+k,kind:kind,name:tr(name),rows:[]}; lanes.push(laneBy[k]); } return laneBy[k]; }
  S.ext.forEach(function(x){ if(tr(x.name)) lane('ext',x.name); });
  var cells={};
  function pk(x,y){ return x<y?x+'|'+y:y+'|'+x; }
  function addCell(k,r){ (cells[k]=cells[k]||[]).push(r); }
  mapRows().forEach(function(r){
    var a=tr(r.a), b=tr(r.b); if(!a) return;
    if(!b){ return; }
    if(a===b){ addCell(a+'|'+a,r); return; }
    if(isNode[b]&&isNode[a]&&!(r.bnd===BT.ext||r.bnd===BT.shared)){ addCell(pk(a,b),r); return; }
    var kind=r.map===MS.unmapped?'unk':r.bnd===BT.shared?'shared':r.bnd===BT.ext?'ext':(laneKind(b)||'unk');
    var em=kind==='ext'?extMatch(b):null, L=lane(kind,em?em.name:b);
    L.rows.push(r); addCell(a+'|'+L.key,r);
  });
  var req={}, gaps={};

function diffReg(old){

  Object.keys(nm).forEach(function(id){ var n=nm[id], o=om[id];
    if(!o){ out.push({item:id,ch:'Row added',f:'',from:'',to:tr(n.a)+' / '+tr(n.b)}); return; }
    COLS.forEach(function(c){ if(c.k==='id') return; var a=tr(o[c.k]), b=tr(n[c.k]); if(a!==b) out.push({item:id,ch:'Row changed',f:c.h,from:a,to:b}); }); });
  Object.keys(om).forEach(function(id){ if(!nm[id]) out.push({item:id,ch:'Row removed',f:'',from:tr(om[id].a)+' / '+tr(om[id].b),to:''}); });
  var os={}, ns={}; (old.sources||[]).forEach(function(s){ os[dkey(s.doc)]=s; }); S.sources.forEach(function(s){ ns[dkey(s.doc)]=s; });
  Object.keys(ns).forEach(function(k){ var n=ns[k], o=os[k]; if(!k) return;

function nextIfId(extra){
  var max=0, pre='IF-', w=4, taken={};
  S.rows.forEach(function(r){ var id=tr(r.id); if(id) taken[id]=1; var m=/^(.*?)(\d+)$/.exec(id); if(m){ var n=parseInt(m[2],10); if(n>=max){ max=n; pre=m[1]; w=m[2].length; } } });
  (extra||[]).forEach(function(x){ taken[x]=1; });
  var n=max+1, s; do{ s=pre+String(n).padStart(w,'0'); n++; } while(taken[s]);
  return s;
}
function copyRow(r){ var n=JSON.parse(JSON.stringify(r)); n.uid=uid(); return n; }
function newRow(a,b){

function bndFor(n){ var s=suggest(n); return s&&s.map===MS.mapped?s.bnd:n.bnd; }
function applySplit(){
  var w=S.wiz, old=w.ci, ids=w.news.map(tr).filter(Boolean);
  if(ids.length<2){ msg('Name at least two new CIs.'); return; }
  if(ids.some(function(x,i){ return ids.indexOf(x)!==i||x===old; })){ msg('Each new CI ID must be different, and different from '+old+'.'); return; }
  var rows=rowsOn(old).filter(active), made=0, sup=0, taken=[];
  rows.forEach(function(r){
    var t=w.map[r.uid]; if(!t) return;
    var outs=[];
    if(r.map===MS.internal){
      var n=copyRow(r); if(t.indexOf('~')>0){ var p=t.split('~'); n.a=p[0]; n.b=p[1]; n.map=MS.mapped; n.bnd=''; n.bnd=bndFor(n); } else { n.a=t; n.b=t; }
      outs.push(n);
    } else {
      (t==='*'?ids:[t]).forEach(function(x){ var n=copyRow(r); if(tr(n.a)===old) n.a=x; if(tr(n.b)===old) n.b=x; if(isMapped(n)) n.bnd=bndFor(n); outs.push(n); });
    }
    outs.forEach(function(n){ n.id=nextIfId(taken); taken.push(n.id); n.rstat=RS.active; n.supby=''; n.notes='Re-mapped from '+r.id+' after the split of '+old+'.'+(tr(r.notes)?' '+tr(r.notes):''); S.rows.push(n); made++; logEdit(n.id,null,r.id,tr(n.a)+' / '+tr(n.b),'Add (split of '+old+')'); });
    var os=r.rstat; r.rstat=RS.sup; r.supby=outs.map(function(n){ return n.id; }).join('; '); sup++;
    logEdit(r.id,'rstat',os,r.rstat,'Split of '+old); logEdit(r.id,'supby','',r.supby,'Split of '+old);
  });
  if(!sup){ msg('Pick where at least one row goes.'); return; }
  S.wiz=null; S.byci=ids[0]; dirty(); render();
  msg('Superseded '+plural(sup,'row')+' and wrote '+plural(made,'new row')+'. Ask Systems Engineering whether '+ids.join(' and ')+' exchange anything no interface source yet defines. A gap found that way gets a new or revised source, and then a row.');
}
function applyCons(){
  var w=S.wiz, olds=[w.ci].concat(Object.keys(w.pick).filter(function(k){ return w.pick[k]; })), nid=tr(w.nid);
  if(olds.length<2){ msg('Pick at least one CI to consolidate with '+w.ci+'.'); return; }
  if(!nid||olds.indexOf(nid)>=0){ msg('Name a new CI ID that differs from the old ones.'); return; }
  var inSet=function(x){ return olds.indexOf(tr(x))>=0; }, made=0, sup=0, taken=[];
  S.rows.filter(function(r){ return active(r)&&(inSet(r.a)||inSet(r.b)); }).forEach(function(r){
    var n=copyRow(r), why;
    if(inSet(r.a)&&inSet(r.b)){
      n.a=nid; n.b=nid; n.map=MS.internal; n.bnd=''; n.inv=''; n.base=''; n.auth=''; n.alloc=has('alloc')?'N':''; n.ssow='';
      why=r.map===MS.internal?'Internal on '+tr(r.a)+', now internal to '+nid+'.':'Consolidation of '+olds.join(', ')+' into '+nid+'. The interface between '+tr(r.a)+' and '+tr(r.b)+' now lies within one CI.';
    } else {
      if(inSet(n.a)) n.a=nid; if(inSet(n.b)) n.b=nid; if(isMapped(n)) n.bnd=bndFor(n);
      why='Re-mapped from '+r.id+' after the consolidation of '+olds.join(', ')+' into '+nid+'.';
    }
    n.id=nextIfId(taken); taken.push(n.id); n.rstat=RS.active; n.supby=''; n.notes=why+(tr(r.notes)?' '+tr(r.notes):'');
    S.rows.push(n); made++; logEdit(n.id,null,r.id,tr(n.a)+' / '+tr(n.b),'Add (consolidation into '+nid+')');
    var os=r.rstat; r.rstat=RS.sup; r.supby=n.id; sup++;
    logEdit(r.id,'rstat',os,r.rstat,'Consolidation into '+nid); logEdit(r.id,'supby','',r.supby,'Consolidation into '+nid);
  });
  S.wiz=null; S.byci=nid; dirty(); render();
  msg('Superseded '+plural(sup,'row')+' and wrote '+plural(made,'new row')+' on '+nid+'. Each row between the old CIs is now Internal, with the reason in Notes.');
}

function blankSrc(){ return {uid:uid(),doc:'',title:'',type:'',rev:'',rel:'',date:'',notes:''}; }
function seedSources(){
  var have={}, add=[], revs={};
  S.sources.forEach(function(s){ have[dkey(s.doc)]=1; });
  S.rows.filter(active).forEach(function(r){ refs(r.src).forEach(function(e){ var k=dkey(e.doc); if(!k||have[k]) return; revs[k]=revs[k]||{doc:e.doc,c:{}}; if(e.rev) revs[k].c[e.rev]=(revs[k].c[e.rev]||0)+1; }); });
  Object.keys(revs).forEach(function(k){
    var x=revs[k], rv=Object.keys(x.c).sort(function(a,b){ return (x.c[b]-x.c[a])||(a<b?1:-1); })[0]||'';
    var s=blankSrc(); s.doc=x.doc; s.type=guessType(x.doc); s.rev=rv; s.rel=REL||''; s.notes='Seeded from the register rows. Confirm against the release record.';
    add.push(s);
  });
  add.sort(function(a,b){ return a.doc<b.doc?-1:1; });
  S.sources=S.sources.concat(add);
  if(add.length) logEdit('',null,'',plural(add.length,'source'),'Seed the source list');
  return add.length;
}
function updateCitations(doc){
  var s=srcOf(doc); if(!s||!tr(s.rev)) return 0;
  var k=dkey(doc), n=0;
  S.rows.filter(active).forEach(function(r){
    var es=String(r.src||'').split(';').map(tr).filter(Boolean), ch=false;
    es=es.map(function(e){ var p=parseRef(e); if(dkey(p.doc)!==k||!p.rev||p.rev.toUpperCase()===tr(s.rev).toUpperCase()) return e; ch=true; n++; return e.replace(/\bRev\.?\s+[A-Za-z0-9][A-Za-z0-9.\-]*/i,'Rev '+tr(s.rev)); });
    if(ch){ var o=r.src; r.src=es.join('; '); logEdit(r.id,'src',o,r.src,'Update citation to '+doc+' Rev '+s.rev); }
  });
  return n;

  }
  if(d.xt){ var it=S.ext[+d.xi]; if(it){ var ox2=S.focusVal; it[d.xt]=tr(it[d.xt]); if(ox2!=null&&tr(ox2)!==it[d.xt]) logEdit(it.name,'External item '+d.xt,tr(ox2),it[d.xt]); S.focusVal=t.value; } return; }
  if(d.lf){ var rc=S.checks.filter(function(c){ return c.checkId===d.li; })[0]; if(!rc) return; var ol=rc[d.lf]; rc[d.lf]=tr(t.value); logEdit(rc.checkId,'Coverage Log '+lh(d.lf),S.focusVal!=null&&t.tagName!=='SELECT'?S.focusVal:ol,rc[d.lf]); dirty(); return; }
  if(d.cf&&t.tagName==='SELECT'){ S.cform[d.cf]=t.value; return; }
  if(d.filt&&d.filt!=='q'){ S.filt[d.filt]=t.type==='checkbox'?t.checked:t.value; $('gridbox').innerHTML=gridHTML(); return; }
  if(d.rmap){ S.rmap=t.value; $('rlist').innerHTML=rowListHTML(); return; }
  if(d.opt){ S[d.opt]=t.checked; $('rlist').innerHTML=rowListHTML(); return; }
  if(d.mopt){ S.mopt[d.mopt]=t.checked; render(); return; }
  if(d.byci){ S.byci=t.value; S.wiz=null; render(); return; }
  if(d.impsel){ S.srcSel=t.value; render(); return; }
  if(d.xf==='state'){ S.xf.state=t.value; render(); return; }
  if(d.wt&&S.wiz){ S.wiz.map[d.wt]=t.value; return; }
  if(d.wp&&S.wiz){ S.wiz.pick[d.wp]=t.checked; return; }
});
$('f-json').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  if(S.dirty&&!confirm('You have unsaved changes. Open '+f.name+' anyway?')) return;
  readJSON(f,function(o){
    var other=o.build&&o.build.name&&o.build.name!==C.build.name;
    loadData(o,null); clean(); render();
    msg('Opened '+f.name+(o.saved?', saved '+o.saved:'')+'. '+plural(S.rows.length,'row')+', '+plural(S.checks.length,'coverage check')+', '+plural(S.exc.length,'exception')+', '+plural(S.log.length,'log entry','log entries')+'.'+(other?' It was saved by the build "'+o.build.name+'". Columns this build does not carry were dropped.':''));
  });
});
$('f-xlsx').addEventListener('change',function(e){ var f=e.target.files&&e.target.files[0]; e.target.value=''; if(f) doImport(f); });
$('f-idx').addEventListener('change',function(e){ var f=e.target.files&&e.target.files[0]; e.target.value=''; if(f) loadIdxFile(f); });
$('f-cmp').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  readJSON(f,function(o){ S.cmp={name:f.name,data:{rows:(o.rows||[]).map(normRow),sources:(o.sources||[]).map(normSrc),checks:o.checks||[],saved:o.saved}}; render(); msg('Comparing with '+f.name+'.'); });
});
window.addEventListener('beforeunload',function(e){ if(S.dirty&&!PREVIEW){ e.preventDefault(); e.returnValue=''; } });

/* Builder preview link. The builder asks for the working data before it reloads the preview. */
window.addEventListener('message',function(e){
  if(!PREVIEW||!e.data||e.data.irReq!=='snapshot') return;
  var r=cur();
  parent.postMessage({irSnap:snapshot(),tab:S.tab,sel:r?r.id:'',sy:window.scrollY},'*');
});

theme();
if(PREVIEW){
  if(PREVIEW.data) loadData(PREVIEW.data,null);
  else if(PREVIEW.mode==='examples'&&hasEx()) loadExamples();
  if(PREVIEW.tab) S.tab=PREVIEW.tab;
  if(PREVIEW.sel){ var pr=rowById(PREVIEW.sel); if(pr) S.sel=pr.uid; }
}
render();
if(PREVIEW&&PREVIEW.sy) window.scrollTo(0,PREVIEW.sy);

</script>
