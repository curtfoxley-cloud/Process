<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool Builder</title>
<style>
:root{
  --ink:#1E262E; --ink-2:#2C3841; --slate:#5C6D78; --mute:#8998A2;
  --paper:#FFFFFF; --surface:#F4F6F7; --surface-2:#EDF0F1; --rule:#D6DCDF;
  --rust:#A8481F; --rust-soft:#F2E4DD; --rust-ink:#7E340F;
  --amber:#9A6508; --amber-soft:#F6ECD8;
  --alert:#8E2F2F; --alert-soft:#F4E2E2;
  --teal:#1F5F5B; --teal-soft:#DFEAE8;
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--surface);font-size:14px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;font-size:13.5px;color:inherit}
:focus-visible{outline:2px solid var(--rust);outline-offset:2px}

/* ---- top bar ---- */
.bb{background:var(--ink);color:#fff;padding:9px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;flex:none}
.brand{margin-right:auto;min-width:0}
.brand b{font-family:var(--serif);font-size:16px;font-weight:400;display:block;line-height:1.2}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#93A2AB}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tb button{background:transparent;border:1px solid #47565F;color:#E9EEF0;border-radius:4px;padding:6px 11px;font-size:12.5px;font-weight:600}
.tb button:hover{background:#2C3841;border-color:#6A7B85}
.tb button.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.tb button.pri:hover{background:var(--rust-ink)}
.tb button[disabled]{opacity:.4;cursor:default}
.tb .sep{width:1px;height:22px;background:#47565F;margin:0 2px}
.menu{position:relative}
.menu .pop{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:60;background:var(--paper);color:var(--ink);
  border:1px solid var(--rule);border-radius:6px;box-shadow:0 8px 24px rgba(30,38,46,.18);min-width:290px;padding:6px}
.menu.open .pop{display:block}
.pop button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:9px 11px;border-radius:4px;font-size:13px;font-weight:400}
.pop button b{display:block;font-weight:600}
.pop button span{color:var(--slate);font-size:12px}
.pop button:hover{background:var(--surface)}

/* ---- banner ---- */
.banner{flex:none;background:var(--amber-soft);border-bottom:1px solid #E4D3AF;padding:8px 16px;font-size:13px;display:none;gap:10px;align-items:center;flex-wrap:wrap}
.banner.on{display:flex}
.banner.good{background:var(--teal-soft);border-color:#BFD5D2}
.banner.bad{background:var(--alert-soft);border-color:#E0BFBF}
.banner button{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:4px 10px;font-size:12.5px;font-weight:600}
.banner .x{margin-left:auto;border:0;background:none;font-size:16px;color:var(--slate)}

/* ---- layout ---- */
.layout{flex:1;display:grid;grid-template-columns:210px minmax(380px,1fr) minmax(380px,1.05fr);min-height:0}
.side{border-right:1px solid var(--rule);background:var(--paper);overflow-y:auto;padding:12px 8px}
.side .lab{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);font-weight:700;margin:4px 8px 6px}
.side button.sec{display:flex;width:100%;text-align:left;border:0;background:none;padding:7px 9px;border-radius:4px;font-size:13px;color:var(--ink-2);gap:8px;align-items:baseline}
.side button.sec:hover{background:var(--surface)}
.side button.sec.on{background:var(--rust-soft);color:var(--rust-ink);font-weight:600}
.side button.sec .n{font-family:var(--mono);font-size:10px;color:var(--mute);min-width:16px}
.side button.sec .bad{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--alert);font-weight:700}
.probs{margin:16px 6px 0;border-top:1px solid var(--rule);padding-top:12px}
.probs .ok{font-size:12px;color:var(--teal)}
.probs ul{margin:4px 0 0;padding:0;list-style:none}
.probs li{font-size:12px;color:var(--alert);margin-bottom:6px;cursor:pointer;line-height:1.4}
.probs li:hover{text-decoration:underline}

.editor{overflow-y:auto;padding:20px 22px 80px;min-width:0}
.editor h2{font-family:var(--serif);font-size:23px;font-weight:400;margin:0 0 4px}
.editor .intro{color:var(--slate);font-size:13.5px;margin:0 0 18px;max-width:68ch}
.editor .intro p{margin:0 0 7px}

.f{margin:0 0 14px}
.f>label,.f .flab{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700;margin-bottom:4px}
.f input[type=text],.f input[type=number],.f textarea,.f select{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.f textarea{resize:vertical;line-height:1.5;min-height:38px}
.f input:focus,.f textarea:focus,.f select:focus{outline:2px solid var(--rust);outline-offset:0;border-color:var(--rust)}
.f .help{font-size:12px;color:var(--slate);margin-top:4px;line-height:1.45}
.f .help code,.intro code,.help code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:0 4px;border-radius:3px}
.f.ck{display:flex;gap:8px;align-items:flex-start}
.f.ck input{margin:3px 0 0;accent-color:var(--rust)}
.f.ck label{font-family:inherit;font-size:13.5px;letter-spacing:0;text-transform:none;color:var(--ink-2);font-weight:400;margin:0;cursor:pointer}
.f.ck .help{margin-top:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grp{border:1px solid var(--rule);border-radius:6px;padding:12px 14px 2px;margin:0 0 16px;background:var(--paper)}
.grp>.gt{font-family:var(--serif);font-size:15px;margin:0 0 10px;color:var(--ink)}
.grp>.gh{font-size:12px;color:var(--slate);margin:-6px 0 10px}
.alt{border-left:3px solid var(--teal);padding-left:10px}
.alt>label{color:var(--teal)!important}
.multi{display:flex;gap:14px;flex-wrap:wrap}
.multi label{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.multi input{accent-color:var(--rust)}

/* ---- lists ---- */
.lst{margin:0 0 16px}
.lst>.lh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.lst>.lh .flab{margin:0;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700}
.lst>.lh .cnt{font-family:var(--mono);font-size:10px;color:var(--mute)}
.lst>.help{font-size:12px;color:var(--slate);margin:-2px 0 8px}
.add{border:1px dashed var(--mute);background:var(--paper);color:var(--slate);border-radius:4px;padding:6px 12px;font-size:12.5px;font-weight:600}
.add:hover{border-color:var(--rust);color:var(--rust-ink)}
.it{background:var(--paper);border:1px solid var(--rule);border-radius:6px;margin-bottom:6px}
.it.open{border-color:#C9D1D5;box-shadow:0 1px 4px rgba(30,38,46,.06)}
.it>.ih{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;cursor:pointer;min-height:36px}
.it>.ih .tw{font-size:10px;color:var(--mute);width:12px;flex:none;transition:transform .12s}
.it.open>.ih .tw{transform:rotate(90deg)}
.it>.ih .sm{flex:1;min-width:0;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it>.ih .sm b{font-family:var(--mono);font-size:11.5px;color:var(--rust-ink);margin-right:6px}
.it>.ih .ib{border:1px solid transparent;background:none;color:var(--mute);border-radius:3px;width:26px;height:26px;padding:0;font-size:13px;line-height:1;flex:none}
.it>.ih .ib:hover{border-color:var(--rule);color:var(--ink);background:var(--surface)}
.it>.ih .ib.del:hover{color:var(--alert);border-color:#E0BFBF;background:var(--alert-soft)}
.it>.ib2{display:none;padding:10px 12px 2px;border-top:1px solid var(--surface-2)}
.it.open>.ib2{display:block}
.it .it{background:var(--surface)}
.it .it .it{background:var(--paper)}
.it.flash{animation:fl 1s ease}
@keyframes fl{0%{background:var(--rust-soft)}100%{}}

/* ---- conditions ---- */
.cond{border:1px solid var(--rule);border-radius:6px;padding:8px 10px;background:var(--surface)}
.it .it .cond{background:var(--paper)}
.cond .always{font-size:12.5px;color:var(--slate);font-style:italic;margin:2px 0 6px}
.cg{border-left:3px solid var(--slate);padding:2px 0 2px 9px;margin:4px 0}
.cg .cgh{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:4px}
.cr{display:flex;gap:5px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.cr select,.cr input{padding:5px 6px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);font-size:12.5px;max-width:100%}
.f .cr select,.f .cr input{width:auto}
.cr select.subj{flex:1 1 150px;min-width:0}
.cr select.op{flex:0 0 auto}
.cr .val{flex:0 1 130px;min-width:64px}
.cr .miss{border-color:var(--alert);background:var(--alert-soft)}
.cr .rm{border:0;background:none;color:var(--mute);font-size:15px;padding:0 4px}
.cr .rm:hover{color:var(--alert)}
.cor{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin:6px 0}
.cbtn{border:0;background:none;color:var(--rust-ink);font-weight:600;font-size:12.5px;padding:2px 0;margin-right:14px;text-decoration:underline;text-underline-offset:3px}

/* ---- labels table ---- */
.lbl{display:grid;grid-template-columns:minmax(150px,34%) 1fr;gap:6px 12px;align-items:start}
.lbl .k{font-size:12.5px;color:var(--ink-2);padding-top:7px}
.lbl .k small{display:block;font-family:var(--mono);font-size:10px;color:var(--mute)}
.lbl textarea{width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);resize:vertical;min-height:34px}

/* ---- preview ---- */
.preview{border-left:1px solid var(--rule);display:flex;flex-direction:column;min-width:0;background:#E3E8EA}
.pvbar{display:flex;gap:8px;align-items:center;padding:7px 12px;background:var(--paper);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.pvbar .t{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate);font-weight:700;margin-right:auto}
.pvbar button{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink-2)}
.pvbar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pvwrap{flex:1;min-height:0;display:flex;justify-content:center;overflow:auto}
.pvwrap iframe{border:0;background:var(--surface);width:100%;height:100%;display:block}
.pvwrap.phone{padding:14px 0}
.pvwrap.phone iframe{width:390px;height:auto;min-height:calc(100% - 0px);border-radius:14px;box-shadow:0 4px 20px rgba(30,38,46,.2)}

/* ---- record preview ---- */
.preview{position:relative;min-height:0;overflow:hidden}
.layout{grid-template-rows:minmax(0,1fr)}
.pvrec{display:none;flex:0 0 42%;min-height:0;flex-direction:column;border-top:3px solid var(--ink-2);background:var(--paper)}
.preview.rec .pvrec{display:flex}
.pvrh{display:flex;gap:10px;align-items:baseline;padding:7px 12px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.pvrh .t{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate);font-weight:700}
#pvrs{font-size:12px;color:var(--slate)}
#pvrt{flex:1;margin:0;overflow:auto;padding:10px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.pvbar button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---- help page ---- */
.help{position:fixed;inset:0;z-index:80;background:var(--surface);display:none;flex-direction:column}
.help.on{display:flex}
.hp-top{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--ink);color:#fff;flex-wrap:wrap}
.hp-top b{font-family:var(--serif);font-weight:400;font-size:17px;margin-right:auto}
.hp-top input{padding:6px 10px;border-radius:4px;border:1px solid #47565F;background:#2C3841;color:#fff;min-width:200px}
.hp-top input::placeholder{color:#93A2AB}
.hp-top button{background:transparent;border:1px solid #47565F;color:#E9EEF0;border-radius:4px;padding:6px 12px;font-size:12.5px;font-weight:600}
.hp-top button.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.hp-main{flex:1;min-height:0;display:grid;grid-template-columns:250px 1fr}
.hp-toc{overflow-y:auto;background:var(--paper);border-right:1px solid var(--rule);padding:14px 10px}
.hp-toc a{display:block;padding:6px 9px;border-radius:4px;color:var(--ink-2);text-decoration:none;font-size:13px}
.hp-toc a:hover{background:var(--surface)}
.hp-body{overflow-y:auto;padding:24px 32px 120px}
.hp-sec{max-width:760px;margin:0 0 30px;scroll-margin-top:16px}
.hp-sec h3{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.hp-sec h4{font-family:var(--serif);font-weight:400;font-size:16px;margin:18px 0 6px;color:var(--ink)}
.hp-sec p,.hp-sec li{font-size:14px;color:var(--ink-2);line-height:1.6}
.hp-sec p{margin:0 0 9px}
.hp-sec ul,.hp-sec ol{margin:0 0 10px;padding-left:22px}
.hp-sec li{margin-bottom:5px}
.hp-sec code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:0 4px;border-radius:3px}
.hp-task{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:12px 16px;margin:0 0 12px}
.hp-task h4{margin:0 0 6px}
.hp-task ol{margin-bottom:4px}
.hp-note{font-size:13px!important;color:var(--slate)!important;border-left:3px solid var(--teal);padding-left:9px;margin:6px 0 2px!important}
.hp-t{border-collapse:collapse;margin:4px 0 12px;font-size:13.5px;width:100%}
.hp-t th{text-align:left;background:var(--surface-2);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);padding:6px 9px}
.hp-t td{border-top:1px solid var(--rule);padding:7px 9px;vertical-align:top;color:var(--ink-2)}
.hp-ex{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;margin:0 0 12px;font-size:13px}
.hp-ex .cg div{padding:2px 0}
.hp-go{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--rust-ink)}
.hp-none{padding:24px 32px;color:var(--slate);grid-column:2;grid-row:1;margin:0}
@media(max-width:760px){.hp-none{grid-column:1;grid-row:2}}
.hp-steps li{margin-bottom:8px}
.start-cta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--rust-soft);border:1px solid #E3CCC2;border-radius:6px;padding:12px 16px;margin:0 0 14px}
.start-cta p{margin:0;flex:1;min-width:220px;font-size:13.5px;color:var(--ink-2)}
.start-cta button{border:1px solid var(--rust);background:var(--rust);color:#fff;border-radius:4px;padding:8px 14px;font-weight:600}
@media(max-width:760px){
  .hp-main{grid-template-columns:1fr}
  .hp-toc{display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--rule);padding:8px}
  .hp-toc a{white-space:nowrap;flex:none}
  .hp-body{padding:16px 16px 80px}
  .hp-top input{min-width:0;flex:1}
  .hp-top b{flex-basis:100%;font-size:15px}
}
@media print{
  body{overflow:visible;display:block;height:auto}
  body.printing>*:not(#help){display:none!important}
  body.printing .help{position:static;display:block}
  body.printing .hp-top,body.printing .hp-toc,body.printing .hp-go{display:none}
  body.printing .hp-main{display:block}
  body.printing .hp-body{overflow:visible;padding:0}
  body.printing .hp-sec{display:block!important;break-inside:auto}
}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:5px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:90;display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:none;border:0;color:#F2C4AE;font-weight:700;text-decoration:underline;padding:0}

.mtabs{display:none}
.help-card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;margin:0 0 14px;font-size:13.5px;color:var(--ink-2)}
.help-card h3{font-family:var(--serif);font-weight:400;font-size:16px;margin:0 0 6px}
.help-card p{margin:0 0 8px}
.help-card ul,.help-card ol{margin:0 0 8px;padding-left:20px}
.help-card li{margin-bottom:4px}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--paper)}

@media(max-width:1180px){
  .layout{grid-template-columns:180px 1fr 1fr}
}
@media(max-width:960px){
  body{overflow:auto}
  .layout{display:block}
  .side{border-right:0;border-bottom:1px solid var(--rule);padding:8px}
  .side .secs{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
  .side .lab{display:none}
  .side button.sec{white-space:nowrap;width:auto;flex:none}
  .probs{margin:8px 4px 0}
  .mtabs{display:flex;gap:0;background:var(--paper);border-bottom:1px solid var(--rule)}
  .mtabs button{flex:1;border:0;background:none;padding:10px;font-weight:600;color:var(--slate);border-bottom:3px solid transparent}
  .mtabs button.on{color:var(--rust-ink);border-bottom-color:var(--rust)}
  body.m-edit .preview{display:none}
  body.m-prev .editor{display:none}
  body.m-prev .side{display:none}
  .preview{border-left:0;height:calc(100vh - 110px)}
  .editor{padding:16px 14px 60px}
  .row2{grid-template-columns:1fr}
}

</style>
</head>
<body>
<header class="bb">
  <div class="brand"><b id="brand-t">Tool Builder</b><span id="brand-s"></span></div>
  <div class="tb">
    <div class="menu" id="newmenu">
      <button id="newbtn" aria-haspopup="true">New</button>
      <div class="pop" role="menu">
        <button id="new-start" role="menuitem"><b>Start from the current tool</b><span>A copy of the Rev D tool this builder came with.</span></button>
        <button id="new-blank" role="menuitem"><b>Start from a blank tool</b><span>The same parts, with placeholder content.</span></button>
      </div>
    </div>
    <button id="openbtn" title="Open a saved project, or a tool this builder exported">Open</button>
    <input type="file" id="openfile" accept=".json,.html,.htm,application/json,text/html" style="display:none">
    <button id="saveproj" title="Save your work to a file you can open later">Save project</button>
    <span class="sep"></span>
    <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl+Y)">Redo</button>
    <span class="sep"></span>
    <button id="helpbtn" title="Open the help page">Help</button>
    <button id="export" class="pri" title="Download the finished tool as one HTML file">Export tool</button>
  </div>
</header>
<div class="banner" id="banner" role="status"></div>
<div class="mtabs"><button id="mt-edit" class="on">Edit</button><button id="mt-prev">Preview</button></div>
<main class="layout">
  <nav class="side" aria-label="Builder sections">
    <div class="lab">Sections</div>
    <div class="secs" id="secs"></div>
    <div class="probs" id="probs"></div>
  </nav>
  <section class="editor" id="editor" aria-label="Editor"></section>
  <section class="preview" aria-label="Live preview">
    <div class="pvbar">
      <span class="t">Live preview</span>
      <button id="pv-desk" class="on">Desktop</button>
      <button id="pv-phone">Phone</button>
      <button id="pv-rec" title="Show the text the tool will record for these answers" aria-pressed="false">Record</button>
      <button id="pv-reset" title="Clear the answers in the preview">Clear answers</button>
      <button id="pv-open" title="Open the preview in its own tab">Open in tab</button>
    </div>
    <div class="pvwrap" id="pvwrap"></div>
    <div class="pvrec" id="pvrec" aria-label="Record preview">
      <div class="pvrh"><span class="t">Record preview</span><span id="pvrs"></span></div>
      <pre id="pvrt"></pre>
    </div>
  </section>
</main>

    if(kind==='answer') return renameRefs(d,'a:'+old,'a:'+nw);
    if(kind==='col'){
      var rows={}; asArr((d.screen||{}).rows).forEach(function(r){rows['a:'+r.id]=1;});
      return renameRefs(d,'cnt:'+old,'cnt:'+nw,function(s){return !!rows[s];},old,nw,['hitValue']);
    }
    if(kind==='opt'){
      var g=asArr((d.gates||{}).items).filter(function(x){return asArr(x.opts).indexOf(obj)>=0;})[0];
      return g?renameRefs(d,null,null,'a:'+g.id,old,nw):0;
    }
    if(kind==='verdict') return renameRefs(d,null,null,'verdict',old,nw,['verdict']);
    if(kind==='field') return renameRefs(d,null,null,null,old,nw,['nameField','dateField','authorField']);
    return 0;
  },
  validate:function(d){
    var out=[], subs=FAMILY.subjects(d,'warn');
    var ids=asArr((d.gates||{}).items).map(function(g){return {id:g.id};}).concat(asArr((d.screen||{}).rows));
    dupes(ids,'id','question','gates',out);
    dupes(asArr((d.meta||{}).fields),'id','header field','meta',out);
    dupes(asArr(d.verdicts),'key','verdict','verdicts',out);
    var vk={}; asArr(d.verdicts).forEach(function(v){vk[v.key]=1;});
    asArr(d.rules).forEach(function(r,i){
      if(!vk[r.verdict]) out.push({sec:'rules',msg:'Rule '+(i+1)+' points at verdict "'+(r.verdict||'')+'", which does not exist.'});
      checkCond(r.when,FAMILY.subjects(d,''),'Rule '+(i+1),'rules',out);
    });
    if(asArr(d.rules).length && asArr(asArr(d.rules)[asArr(d.rules).length-1].when).length)
      out.push({sec:'rules',msg:'The last rule has conditions. Some answers may match no rule. Add a fallback rule with no conditions at the end.'});
    if(!asArr(d.rules).length) out.push({sec:'rules',msg:'No rules yet. The tool cannot pick a verdict.'});
    asArr(d.warnings).forEach(function(w,i){ checkCond(w.when,subs,'Warning '+(i+1),'warnings',out); });
    var res=asArr(d.results);
    asArr(d.verdicts).forEach(function(v){ if(v.result&&res.indexOf(v.result)<0) out.push({sec:'verdicts',msg:'Verdict '+v.key+' records result "'+v.result+'", which is not in the result list.'}); });
    var fid={}; asArr((d.meta||{}).fields).forEach(function(f){fid[f.id]=1;});
    ['nameField','dateField','authorField'].forEach(function(k){ var v=(d.meta||{})[k]; if(v&&!fid[v]) out.push({sec:'meta',msg:'The '+k.replace('Field',' field')+' points at "'+v+'", which is not a header field.'}); });
    var cols={}; asArr((d.screen||{}).cols).forEach(function(c){cols[c.v]=1;});
    if(asArr((d.screen||{}).rows).length&&!cols[(d.screen||{}).hitValue]) out.push({sec:'screen',msg:'The highlighted answer is not one of the answer columns.'});
    return out;
  },

/* ================= Tool Builder core. Shared by the three builders. =================
   FAMILY   : the builder description (sections, subjects, rename, validate, blank)
   STARTER  : the definition that reproduces the current tool
   PARTS    : {css, runtime, engine} for the generated tool
*/
var DEF=clone(STARTER);
var CUR='start';
var OPEN=new WeakSet();
var DIRTY=false, HIST=[], HPOS=-1, commitT=null, pvT=null, lastPvState=null;
var LSKEY=null;

function clone(o){return JSON.parse(JSON.stringify(o));}
function $(id){return document.getElementById(id);}
function el(tag,attrs,kids){
  var e=document.createElement(tag);
  if(attrs) for(var k in attrs){
    var v=attrs[k];
    if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='text') e.textContent=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else if(k==='value') e.value=v;
    else if(k==='checked') e.checked=!!v;
    else e.setAttribute(k,v===true?'':v);
  }
  (kids||[]).forEach(function(c){ if(c==null) return; e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}
function escH(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function asArr(x){return Array.isArray(x)?x:[];}
function opts(o,item){ return typeof o==='function'?o(DEF,item):(o||[]); }
function slugF(s){return String(s||'tool').replace(/[^A-Za-z0-9._-]+/g,'-').replace(/^-|-$/g,'').slice(0,80)||'tool';}

/* ---------------- history and autosave ---------------- */
function snapshot(){ return JSON.stringify(DEF); }
function pushHist(){
  var s=snapshot();
  if(HPOS>=0&&HIST[HPOS]===s) return;
  HIST=HIST.slice(0,HPOS+1); HIST.push(s); if(HIST.length>150) HIST.shift(); HPOS=HIST.length-1;
  undoState();
  if(LSKEY){ try{ localStorage.setItem(LSKEY,JSON.stringify({saved:new Date().toISOString(),def:DEF})); }catch(e){} }
}
function commit(now){
  DIRTY=true;
  clearTimeout(commitT);
  if(now) pushHist(); else commitT=setTimeout(pushHist,500);
  schedulePreview(); checkProblems();
}
function undoState(){ $('undo').disabled=HPOS<=0; $('redo').disabled=HPOS>=HIST.length-1; }
function undo(){ DIRTY=true; clearTimeout(commitT); pushHist(); if(HPOS<=0) return; HPOS--; DEF=JSON.parse(HIST[HPOS]); afterLoad(); undoState(); toast('Undone.'); }
function redo(){ DIRTY=true; if(HPOS>=HIST.length-1) return; HPOS++; DEF=JSON.parse(HIST[HPOS]); afterLoad(); undoState(); toast('Redone.'); }
function afterLoad(){
  OPEN=new WeakSet();
  if(LSKEY){ try{ localStorage.setItem(LSKEY,JSON.stringify({saved:new Date().toISOString(),def:DEF})); }catch(e){} }
  renderNav(); renderSection(); schedulePreview(true); checkProblems();
}
function loadDef(d,msg){
  DEF=d; HIST=[]; HPOS=-1; pushHist(); afterLoad(); if(msg) banner(msg,'good');
}

/* ---------------- banners and toasts ---------------- */
function banner(html,kind,buttons){
  var b=$('banner'); b.className='banner on '+(kind||''); b.innerHTML='';
  b.appendChild(el('span',{html:html}));
  (buttons||[]).forEach(function(x){ b.appendChild(el('button',{text:x[0],onclick:function(){ x[1](); }})); });
  b.appendChild(el('button',{class:'x',title:'Dismiss','aria-label':'Dismiss',text:'×',onclick:function(){b.className='banner';}}));
}
function hideBanner(){ $('banner').className='banner'; }
var toastT=null;
function toast(msg,undoBtn){
  var t=$('toast'); t.innerHTML=''; t.appendChild(el('span',{text:msg}));
  if(undoBtn) t.appendChild(el('button',{text:'Undo',onclick:function(){undo();t.className='toast';}}));
  t.className='toast on'; clearTimeout(toastT); toastT=setTimeout(function(){t.className='toast';},undoBtn?5000:2200);
}

/* ---------------- navigation ---------------- */
function renderNav(){
  var probs=problems(), bySec={};
  probs.forEach(function(p){bySec[p.sec]=(bySec[p.sec]||0)+1;});
  var box=$('secs'); box.innerHTML='';
  FAMILY.sections.forEach(function(s,i){
    box.appendChild(el('button',{class:'sec'+(s.id===CUR?' on':''),onclick:function(){go(s.id);}},[
      el('span',{class:'n',text:i?String(i):'•'}), el('span',{text:s.title}),
      bySec[s.id]?el('span',{class:'bad',text:'!'+bySec[s.id]}):null
    ]));
  });
}
function go(id,focusItem){
  CUR=id; renderNav(); renderSection(focusItem);
  $('editor').scrollTop=0;
  document.body.classList.add('m-edit'); document.body.classList.remove('m-prev');
  syncMtabs();
}
function section(){ return FAMILY.sections.filter(function(s){return s.id===CUR;})[0]||FAMILY.sections[0]; }
function renderSection(){
  var s=section(), ed=$('editor'); ed.innerHTML='';
  ed.appendChild(el('h2',{text:s.title}));
  if(s.id==='start') ed.appendChild(el('div',{class:'start-cta'},[
    el('p',{html:'<b>New here?</b> The help page walks through the screen, the first ten minutes, and the common tasks. The live preview sits to the right'+(window.innerWidth<=960?', behind the <b>Preview</b> tab':'')+'.'}),
    el('button',{text:'Open the help page',onclick:function(){openHelp();}})]));
  if(s.intro) ed.appendChild(el('div',{class:'intro',html:s.intro}));
  if(s.html) ed.appendChild(el('div',{html:typeof s.html==='function'?s.html():s.html}));
  renderFields(ed,s.fields||[],DEF);
}

/* ---------------- field rendering ---------------- */
function getK(obj,k){ if(!k) return obj; var p=k.split('.'),o=obj; for(var i=0;i<p.length;i++){ if(o==null) return undefined; o=o[p[i]]; } return o; }
function setK(obj,k,v){ var p=k.split('.'),o=obj; for(var i=0;i<p.length-1;i++){ if(o[p[i]]==null||typeof o[p[i]]!=='object') o[p[i]]={}; o=o[p[i]]; } o[p[p.length-1]]=v; }
function helpEl(h){ return h?el('div',{class:'help',html:h}):null; }
var ALT_HELP='Used when the <b>Alternate wording</b> condition holds. Leave blank to keep the normal text.';
function autosize(t){ t.style.height='auto'; t.style.height=Math.min(Math.max(t.scrollHeight+2,38),420)+'px'; }

function renderFields(host,fields,obj,ctx){
  fields.forEach(function(f){
    if(f.show && !f.show(obj,DEF)) return;
    var n=FIELD[f.t]; if(!n){ host.appendChild(el('div',{text:'Unknown field '+f.t})); return; }
    host.appendChild(n(f,obj,ctx||{}));
  });
}
var FIELD={};
FIELD.info=function(f){ return el('div',{class:'help-card',html:typeof f.html==='function'?f.html(DEF):f.html}); };
FIELD.row=function(f,obj,ctx){ var d=el('div',{class:'row2'}); renderFields(d,f.fields,obj,ctx); return d; };
FIELD.group=function(f,obj,ctx){
  var d=el('div',{class:'grp'},[el('div',{class:'gt',text:f.label}),f.help?el('div',{class:'gh',html:f.help}):null]);
  renderFields(d,f.fields,f.k?ensureObj(obj,f.k):obj,ctx); return d;
};
FIELD.obj=function(f,obj,ctx){ var d=el('div'); renderFields(d,f.fields,ensureObj(obj,f.k),ctx); return d; };
function ensureObj(obj,k){ var v=getK(obj,k); if(v==null||typeof v!=='object'){ v={}; setK(obj,k,v);} return v; }
FIELD.text=function(f,obj){
  var id='f'+Math.random().toString(36).slice(2,9), v=getK(obj,f.k);
  var inp=el('input',{type:'text',id:id,value:v==null?'':String(v),placeholder:f.ph||null,spellcheck:f.code?'false':null});
  if(f.code) inp.style.fontFamily='var(--mono)';
  var before=null;
  inp.addEventListener('focus',function(){before=inp.value;});
  inp.addEventListener('input',function(){ setK(obj,f.k,inp.value); if(f.onInput) f.onInput(obj); commit(); });
  inp.addEventListener('change',function(){
    if(f.kind && before!==null && before!==inp.value && before!==''){
      var n=FAMILY.rename(DEF,f.kind,before,inp.value,obj);
      if(n) toast('Updated '+n+' reference'+(n>1?'s':'')+' to the new name.');
      commit(true); renderNav();
      var st=$('editor').scrollTop; renderSection(); $('editor').scrollTop=st;
    } else if(f.kind){ commit(true); renderNav(); }
    before=inp.value;
  });
  return el('div',{class:'f'+(f.alt?' alt':'')},[el('label',{for:id,text:f.label}),inp,helpEl(f.help||(f.alt?ALT_HELP:''))]);
};
FIELD.num=function(f,obj){
  var id='f'+Math.random().toString(36).slice(2,9), v=getK(obj,f.k);
  var inp=el('input',{type:'number',id:id,value:v==null?'':String(v),min:f.min!=null?f.min:null});
  inp.addEventListener('input',function(){ setK(obj,f.k,inp.value===''?'':+inp.value); commit(); });
  return el('div',{class:'f'},[el('label',{for:id,text:f.label}),inp,helpEl(f.help)]);
};
FIELD.area=function(f,obj){
  var id='f'+Math.random().toString(36).slice(2,9), v=getK(obj,f.k);
  if(Array.isArray(v)) v=v.join('\n');
  var t=el('textarea',{id:id,rows:f.rows||2,placeholder:f.ph||null});
  t.value=v==null?'':String(v);
  t.addEventListener('input',function(){
    var x=t.value; if(f.arr) x=x.split(/\r?\n/).map(function(s){return s.trim();}).filter(Boolean);
    setK(obj,f.k,x); autosize(t); commit();
  });
  setTimeout(function(){autosize(t);},0);
  return el('div',{class:'f'+(f.alt?' alt':'')},[el('label',{for:id,text:f.label}),t,helpEl(f.help||(f.alt?ALT_HELP:''))]);
};
FIELD.check=function(f,obj){
  var id='f'+Math.random().toString(36).slice(2,9);
  var c=el('input',{type:'checkbox',id:id,checked:!!getK(obj,f.k)});
  c.addEventListener('change',function(){ setK(obj,f.k,c.checked); commit(true); if(f.rerender) renderSection(); });
  return el('div',{class:'f ck'},[c,el('div',{},[el('label',{for:id,text:f.label}),helpEl(f.help)])]);
};
FIELD.select=function(f,obj){
  var id='f'+Math.random().toString(36).slice(2,9), v=getK(obj,f.k); if(v==null) v='';
  var o=opts(f.opts,obj), s=el('select',{id:id}), found=false;
  o.forEach(function(x){ var val=Array.isArray(x)?x[0]:x, lab=Array.isArray(x)?x[1]:x;
    if(String(val)===String(v)) found=true;
    s.appendChild(el('option',{value:val,text:lab})); });
  if(!found){ s.insertBefore(el('option',{value:v,text:v===''?'(choose)':'(missing) '+v}),s.firstChild); }
  s.value=v;
  s.addEventListener('change',function(){ setK(obj,f.k,s.value); commit(true); if(f.rerender) renderSection(); });
  return el('div',{class:'f'},[el('label',{for:id,text:f.label}),s,helpEl(f.help)]);
};
FIELD.multi=function(f,obj){
  var v=asArr(getK(obj,f.k)), box=el('div',{class:'multi'});
  opts(f.opts,obj).forEach(function(x){
    var val=Array.isArray(x)?x[0]:x, lab=Array.isArray(x)?x[1]:x;
    var c=el('input',{type:'checkbox',checked:v.indexOf(val)>=0});
    c.addEventListener('change',function(){
      var cur=asArr(getK(obj,f.k)).filter(function(y){return y!==val;});
      if(c.checked) cur.push(val);
      setK(obj,f.k,cur); commit(true);
    });
    box.appendChild(el('label',{},[c,lab]));
  });
  return el('div',{class:'f'},[el('span',{class:'flab',text:f.label}),box,helpEl(f.help)]);
};
FIELD.labels=function(f,obj){
  var d=ensureObj(obj,f.k), g=el('div',{class:'lbl'});
  var seen={};
  f.spec.forEach(function(s){
    seen[s[0]]=1;
    var t=el('textarea',{rows:1}); t.value=d[s[0]]==null?'':d[s[0]];
    t.addEventListener('input',function(){ d[s[0]]=t.value; autosize(t); commit(); });
    setTimeout(function(){autosize(t);},0);
    g.appendChild(el('div',{class:'k'},[s[1],el('small',{text:s[0]})])); g.appendChild(t);
  });
  Object.keys(d).forEach(function(k){
    if(seen[k]) return;
    var t=el('textarea',{rows:1}); t.value=d[k];
    t.addEventListener('input',function(){ d[k]=t.value; autosize(t); commit(); });
    g.appendChild(el('div',{class:'k'},[k])); g.appendChild(t);
  });
  return el('div',{class:'f'},[f.label?el('span',{class:'flab',text:f.label}):null,g,helpEl(f.help)]);
};

/* lists of objects */
FIELD.list=function(f,obj,ctx){
  var list=getK(obj,f.k); if(!Array.isArray(list)){ list=[]; setK(obj,f.k,list); }
  var wrap=el('div',{class:'lst'});
  var cnt=el('span',{class:'cnt',text:String(list.length)});
  wrap.appendChild(el('div',{class:'lh'},[el('span',{class:'flab',text:f.label}),cnt]));
  if(f.help) wrap.appendChild(el('div',{class:'help',html:f.help}));
  var body=el('div'); wrap.appendChild(body);
  function draw(){
    body.innerHTML=''; cnt.textContent=String(list.length);
    list.forEach(function(item,i){
      var isObj=item&&typeof item==='object';
      var sm=el('span',{class:'sm'});
      function sum(){ var s=f.sum?f.sum(item,i,DEF):(isObj?JSON.stringify(item).slice(0,80):String(item));
        if(Array.isArray(s)){ sm.innerHTML='<b>'+escH(s[0])+'</b>'+escH(s[1]); } else sm.textContent=s||'(empty)'; }
      sum();
      var it=el('div',{class:'it'+(OPEN.has(item)?' open':'')});
      function btn(txt,title,fn,cls){ return el('button',{class:'ib'+(cls?' '+cls:''),title:title,'aria-label':title,text:txt,onclick:function(e){e.stopPropagation();fn();}}); }
      var head=el('div',{class:'ih',onclick:function(){ if(OPEN.has(item)) OPEN.delete(item); else OPEN.add(item); it.classList.toggle('open'); if(it.classList.contains('open')&&!bodyBuilt){buildBody();} }},[
        el('span',{class:'tw',text:'▶'}), sm,
        btn('↑','Move up',function(){ if(i>0){ list.splice(i-1,0,list.splice(i,1)[0]); commit(true); draw(); } }),
        btn('↓','Move down',function(){ if(i<list.length-1){ list.splice(i+1,0,list.splice(i,1)[0]); commit(true); draw(); } }),
        btn('⧉','Duplicate',function(){ var c=clone(item); if(f.onDup) f.onDup(c,list,DEF); list.splice(i+1,0,c); OPEN.add(c); commit(true); draw(); }),
        btn('✕','Delete',function(){ list.splice(i,1); commit(true); draw(); toast('Deleted.',true); },'del')
      ]);
      it.appendChild(head);
      var ib=el('div',{class:'ib2'}), bodyBuilt=false;
      function buildBody(){ bodyBuilt=true; ib.innerHTML='';
        if(isObj) renderFields(ib,f.item,item,ctx);
        it.addEventListener('input',function(){sum();});
        it.addEventListener('change',function(){sum();});
      }
      if(OPEN.has(item)) buildBody();
      it.appendChild(ib);
      body.appendChild(it);
    });
  }
  draw();
  wrap.appendChild(el('button',{class:'add',text:'+ '+(f.addLabel||'Add'),onclick:function(){
    var n=f.add?f.add(DEF,list):{}; list.push(n); OPEN.add(n); commit(true); draw();
    var last=body.lastChild; if(last){ last.classList.add('flash'); var i=last.querySelector('input,textarea'); if(i) i.focus(); }
  }}));
  return wrap;
};

/* conditions */
var OPS={
  choice:[['is','is'],['not','is not'],['set','is answered'],['unset','is not answered']],
  number:[['gte','is at least'],['lte','is at most'],['eq','is exactly']],
  verdict:[['is','is'],['not','is not'],['set','has a result'],['unset','has no result']]
};
FIELD.cond=function(f,obj){
  var wrap=el('div',{class:'f'});
  wrap.appendChild(el('span',{class:'flab',text:f.label||'Applies when'}));
  var box=el('div',{class:'cond'}); wrap.appendChild(box);
  if(f.help) wrap.appendChild(helpEl(f.help));
  function C(){ var c=getK(obj,f.k); if(!Array.isArray(c)){ c=[]; setK(obj,f.k,c);} return c; }
  var SUB=FAMILY.subjects(DEF,f.ctx||'', obj);
  var SMAP={}; SUB.forEach(function(s){SMAP[s.id]=s;});
  function draw(){
    box.innerHTML='';
    var c=C();
    if(!c.length) box.appendChild(el('div',{class:'always',text:f.emptyText||'Always applies. Add a condition to narrow it.'}));
    c.forEach(function(g,gi){
      if(gi) box.appendChild(el('div',{class:'cor',text:'or'}));
      var gd=el('div',{class:'cg'},[el('div',{class:'cgh',text:'All of these are true'})]);
      g.forEach(function(r,ri){
        var s=SMAP[r.s];
        var ss=el('select',{class:'subj'+(s?'':' miss'),'aria-label':'Subject'});
        var groups={};
        SUB.forEach(function(x){ var gname=x.group||'Answers';
          if(!groups[gname]){ groups[gname]=el('optgroup',{label:gname}); ss.appendChild(groups[gname]); }
          groups[gname].appendChild(el('option',{value:x.id,text:x.label})); });
        if(!s) ss.insertBefore(el('option',{value:r.s,text:'(missing) '+r.s}),ss.firstChild);
        ss.value=r.s;
        ss.addEventListener('change',function(){ r.s=ss.value; var ns=SMAP[r.s]; fixRow(r,ns); commit(true); draw(); });
        var kind=s?s.kind:'choice';
        var os=el('select',{class:'op','aria-label':'Test'});
        (OPS[kind]||OPS.choice).forEach(function(o){ os.appendChild(el('option',{value:o[0],text:o[1]})); });
        if(!(OPS[kind]||OPS.choice).some(function(o){return o[0]===r.o;})) os.insertBefore(el('option',{value:r.o,text:r.o}),os.firstChild);
        os.value=r.o;
        os.addEventListener('change',function(){ r.o=os.value; commit(true); draw(); });
        var val=null;
        if(r.o!=='set'&&r.o!=='unset'){
          if(kind==='number'){
            val=el('input',{type:'number',class:'val',value:r.v,'aria-label':'Value'});
            val.addEventListener('input',function(){ r.v=val.value; commit(); });
          } else {
            val=el('select',{class:'val','aria-label':'Value'});
            var vs=s?s.values||[]:[], ok=false;
            vs.forEach(function(x){ if(String(x[0])===String(r.v)) ok=true; val.appendChild(el('option',{value:x[0],text:x[1]})); });
            if(!ok){ val.insertBefore(el('option',{value:r.v,text:r.v===''?'(choose)':'(missing) '+r.v}),val.firstChild); val.classList.add(r.v===''?'x':'miss'); }
            val.value=r.v;
            val.addEventListener('change',function(){ r.v=val.value; commit(true); draw(); });
          }
        }
        var rm=el('button',{class:'rm',title:'Remove this condition','aria-label':'Remove this condition',text:'✕',onclick:function(){
          g.splice(ri,1); if(!g.length) c.splice(gi,1); commit(true); draw(); }});
        gd.appendChild(el('div',{class:'cr'},[ss,os,val,rm]));
      });
      gd.appendChild(el('button',{class:'cbtn',text:'+ And',onclick:function(){ g.push(newRow()); commit(true); draw(); }}));
      box.appendChild(gd);
    });
    box.appendChild(el('div',{},[
      el('button',{class:'cbtn',text:c.length?'+ Or another set':'+ Add a condition',onclick:function(){ c.push([newRow()]); commit(true); draw(); }})
    ]));
  }
  function newRow(){ var s=SUB[0]||{id:'',kind:'choice',values:[]}; var r={s:s.id,o:'',v:''}; fixRow(r,s); return r; }
  function fixRow(r,s){
    var kind=s?s.kind:'choice', ops=OPS[kind]||OPS.choice;
    if(!ops.some(function(o){return o[0]===r.o;})) r.o=ops[0][0];
    if(kind==='number'){ if(r.v===''||isNaN(+r.v)) r.v='1'; }
    else { var vs=(s&&s.values)||[]; if(!vs.some(function(x){return String(x[0])===String(r.v);})) r.v=vs.length?vs[0][0]:''; }
  }
  draw();
  return wrap;
};

/* a condition in a few words, for list summaries */
function condText(c,ctx){
  c=asArr(c); if(!c.length) return 'always';
  var m={}; FAMILY.subjects(DEF,ctx||'warn').forEach(function(s){m[s.id]=s;});
  var OPW={is:'=',not:'\u2260',gte:'\u2265',lte:'\u2264',eq:'=',set:'answered',unset:'unanswered'};
  return c.map(function(g){ return asArr(g).map(function(r){
    var s=m[r.s], nm=r.s.indexOf('a:')===0?r.s.slice(2):(s?s.short||s.label:r.s);
    if(r.o==='set'||r.o==='unset') return nm+' '+OPW[r.o];
    return nm+' '+(OPW[r.o]||r.o)+' '+r.v; }).join(' and '); }).join('  or  ');
}

/* ---------------- problems ---------------- */
function problems(){ try{ return FAMILY.validate(DEF)||[]; }catch(e){ return [{sec:'start',msg:'Check failed: '+e.message}]; } }
var probT=null;
function checkProblems(){ clearTimeout(probT); probT=setTimeout(drawProblems,300); }
function drawProblems(){
  var p=problems(), box=$('probs'); box.innerHTML='';
  box.appendChild(el('div',{class:'lab',text:'Checks'}));
  if(!p.length) box.appendChild(el('div',{class:'ok',text:'No problems found.'}));
  else {
    var ul=el('ul'); p.slice(0,30).forEach(function(x){
      var sec=FAMILY.sections.filter(function(s){return s.id===x.sec;})[0];
      ul.appendChild(el('li',{text:(sec?sec.title+': ':'')+x.msg,onclick:function(){go(x.sec);}})); });
    box.appendChild(ul);
  }
  renderNav();
}
/* shared checks every builder uses */
function checkCond(c,subs,where,sec,out){
  var m={}; subs.forEach(function(s){m[s.id]=s;});
  asArr(c).forEach(function(g){ asArr(g).forEach(function(r){
    var s=m[r.s];
    if(!s){ out.push({sec:sec,msg:where+' tests '+r.s+', which no longer exists.'}); return; }
    if(s.kind!=='number'&&r.o!=='set'&&r.o!=='unset'&&!(s.values||[]).some(function(x){return String(x[0])===String(r.v);}))
      out.push({sec:sec,msg:where+' tests '+s.label+' for "'+r.v+'", which is not one of its answers.'});
  });});
}
function dupes(list,key,what,sec,out){
  var seen={}; asArr(list).forEach(function(x){ var k=x[key]; if(!k) out.push({sec:sec,msg:'A '+what+' has no ID.'}); else if(seen[k]) out.push({sec:sec,msg:'Two '+what+'s share the ID '+k+'.'}); seen[k]=1; });
}
/* renames a reference everywhere in the definition. Returns the count. */
function renameRefs(def,subjectOld,subjectNew,valueSubject,valOld,valNew,fieldNames){
  var n=0;
  (function walk(o){
    if(Array.isArray(o)){ o.forEach(walk); return; }
    if(!o||typeof o!=='object') return;
    if(typeof o.s==='string'&&typeof o.o==='string'){
      if(subjectOld&&o.s===subjectOld){ o.s=subjectNew; n++; }
      if(valueSubject&&(o.s===valueSubject||(typeof valueSubject==='function'&&valueSubject(o.s)))&&o.v===valOld){ o.v=valNew; n++; }
      return;
    }
    (fieldNames||[]).forEach(function(f){ if(o[f]===valOld&&valOld!==undefined){ o[f]=valNew; n++; } });
    for(var k in o) walk(o[k]);
  })(def);
  return n;
}

/* ---------------- preview ---------------- */
function buildHTML(preview){ return assembleTool(PARTS,DEF,preview); }
function schedulePreview(now){ clearTimeout(pvT); pvT=setTimeout(drawPreview,now?0:380); }
function drawPreview(){
  var host=$('pvwrap'), old=host.querySelector('iframe'), st=null, sy=0;
  if(old){ try{ var w=old.contentWindow; if(w.__getState) st=w.__getState(); sy=w.scrollY||0; }catch(e){} }
  if(st===null) st=lastPvState;
  var f=el('iframe',{title:'Live preview of the tool'});
  f.addEventListener('load',function(){
    try{
      var w=f.contentWindow;
      if(st&&w.__setState) w.__setState(st);
      w.scrollTo(0,sy);
      lastPvState=null;
    }catch(e){}
  });
  f.srcdoc=buildHTML(true);
  if(old) host.replaceChild(f,old); else host.appendChild(f);
}
var recT=null;
function recOn(){ return $('pv-rec').getAttribute('aria-pressed')==='true'; }
function drawRecord(){
  if(!recOn()) return;
  var f=$('pvwrap').querySelector('iframe'), out=null;
  try{ var w=f&&f.contentWindow; if(w&&w.__recordText) out=w.__recordText(); }catch(e){}
  if(!out){ $('pvrs').textContent='Loading the preview.'; return; }
  $('pvrs').textContent=out.note||'';
  if($('pvrt').textContent!==out.text) $('pvrt').textContent=out.text;
}
function toggleRecord(){
  var on=!recOn(); $('pv-rec').setAttribute('aria-pressed',on?'true':'false');
  document.querySelector('.preview').classList.toggle('rec',on);
  clearInterval(recT); if(on){ drawRecord(); recT=setInterval(drawRecord,600); }
}
function restartPreview(){ lastPvState=null; var old=$('pvwrap').querySelector('iframe'); if(old) old.remove(); drawPreview(); }

/* ---------------- files ---------------- */
function download(name,text,mime){
  var u=URL.createObjectURL(new Blob([text],{type:mime}));
  var a=el('a',{href:u,download:name}); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(u);},4000);
}
function exportName(){ var t=DEF.tool||{}; return slugF(t.exportName||t.pageTitle||t.barTitle); }
function doExport(){
  var p=problems();
  download(exportName()+'.html',buildHTML(false),'text/html');
  DIRTY=false;
  toast(p.length?'Tool exported. '+p.length+' check'+(p.length>1?'s':'')+' still open.':'Tool exported.');
}
function doSaveProject(){
  download(exportName()+'.tool-project.json',JSON.stringify({toolBuilderProject:FAMILY.id,saved:new Date().toISOString(),def:DEF},null,1),'application/json');
  DIRTY=false; toast('Project saved.');
}
function readDefFrom(text,name){
  var d=null;
  if(/^\s*</.test(text)){
    var m=/<script type="application\/json" id="tool-def">([\s\S]*?)<\/script>/.exec(text);
    if(!m) throw new Error('This page was not made by a Tool Builder. The built-in starter already matches the original tool. Use New, then Start from the current tool.');
    d=JSON.parse(m[1]);
  } else {
    var o=JSON.parse(text);
    d=o&&o.def?o.def:o;
  }
  if(!d||typeof d!=='object'||!d.builder) throw new Error('No tool definition found in '+name+'.');
  if(d.builder!==FAMILY.id) throw new Error('This file belongs to the '+(FAMILY.others[d.builder]||d.builder)+'. Open it there.');
  return d;
}
function doOpen(ev){
  var f=ev.target.files&&ev.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{ var d=readDefFrom(r.result,f.name); loadDef(d,'Opened <b>'+escH(f.name)+'</b>. Edits now apply to this tool.'); go('start'); }
    catch(e){ banner(escH(e.message),'bad'); }
  };
  r.readAsText(f); ev.target.value='';
}
function newFrom(kind){
  closeMenus();
  var cur=snapshot();
  loadDef(clone(kind==='blank'?FAMILY.blank:STARTER), kind==='blank'?'Started a blank tool. Your previous work is one Undo away.':'Started from the current tool. Your previous work is one Undo away.');
  HIST.unshift(cur); HPOS=HIST.length-1; undoState();
  go('start');
}
function closeMenus(){ document.querySelectorAll('.menu.open').forEach(function(m){m.classList.remove('open');}); }
function syncMtabs(){
  var e=document.body.classList.contains('m-prev');
  $('mt-edit').className=e?'':'on'; $('mt-prev').className=e?'on':'';
}

/* ---------------- start up ---------------- */
function boot(){
  document.title=FAMILY.name;
  $('brand-t').textContent=FAMILY.name;
  $('brand-s').textContent=FAMILY.sub;
  $('undo').addEventListener('click',undo); $('redo').addEventListener('click',redo);
  $('export').addEventListener('click',doExport);
  $('saveproj').addEventListener('click',doSaveProject);
  $('openbtn').addEventListener('click',function(){$('openfile').click();});
  $('openfile').addEventListener('change',doOpen);
  $('newbtn').addEventListener('click',function(e){ e.stopPropagation(); $('newmenu').classList.toggle('open'); });
  $('new-start').addEventListener('click',function(){newFrom('start');});
  $('new-blank').addEventListener('click',function(){newFrom('blank');});
  document.addEventListener('click',function(e){ if(!e.target.closest('.menu')) closeMenus(); });
  $('pv-desk').addEventListener('click',function(){ $('pvwrap').className='pvwrap'; this.className='on'; $('pv-phone').className=''; });
  $('pv-phone').addEventListener('click',function(){ $('pvwrap').className='pvwrap phone'; this.className='on'; $('pv-desk').className=''; });
  $('pv-rec').addEventListener('click',toggleRecord);
  $('helpbtn').addEventListener('click',function(){openHelp();});
  $('hp-close').addEventListener('click',closeHelp);
  $('hp-q').addEventListener('input',function(){filterHelp(this.value);});
  $('hp-print').addEventListener('click',function(){ filterHelp(''); document.body.classList.add('printing'); window.print(); setTimeout(function(){document.body.classList.remove('printing');},500); });
  $('pv-reset').addEventListener('click',function(){ restartPreview(); toast('Preview answers cleared.'); });
  $('pv-open').addEventListener('click',function(){
    var w=window.open('','_blank'); if(!w){ toast('The browser blocked the new tab.'); return; }
    w.document.open(); w.document.write(buildHTML(true)); w.document.close();
  });
  $('mt-edit').addEventListener('click',function(){ document.body.classList.add('m-edit'); document.body.classList.remove('m-prev'); syncMtabs(); });
  $('mt-prev').addEventListener('click',function(){ document.body.classList.add('m-prev'); document.body.classList.remove('m-edit'); syncMtabs(); schedulePreview(true); });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&$('help').classList.contains('on')){ closeHelp(); return; }
    var mod=e.ctrlKey||e.metaKey;
    if(mod&&!e.shiftKey&&e.key.toLowerCase()==='z'&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){ e.preventDefault(); undo(); }
    if(mod&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){ e.preventDefault(); redo(); }
    if(mod&&e.key.toLowerCase()==='s'){ e.preventDefault(); doSaveProject(); }
  });
  document.body.classList.add('m-edit');
  pushHist(); renderNav(); renderSection(); drawPreview(); drawProblems();
  /* offer to restore the last session on this computer */
  try{
    var raw=localStorage.getItem('toolbuilder:'+FAMILY.id+':last');
    if(raw){
      var o=JSON.parse(raw);
      if(o&&o.def&&JSON.stringify(o.def)!==JSON.stringify(STARTER)){
        var when=new Date(o.saved);
        banner('Your last session in this builder was kept on this computer ('+escH(when.toLocaleString())+').','',
          [['Restore it',function(){ loadDef(o.def,'Last session restored.'); }],['Keep the starter',hideBanner]]);
      }
    }
  }catch(e){}
  /* from now on, keep this session for next time */
  LSKEY='toolbuilder:'+FAMILY.id+':last';
}
window.addEventListener('beforeunload',function(e){
  if(DIRTY){ e.preventDefault(); e.returnValue=''; }
});
boot();
