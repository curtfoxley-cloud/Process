<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI Index</title>
<style>
:root{
  --ink:#1E262E; --ink-2:#2C3841; --slate:#5C6D78; --mute:#8998A2;
  --paper:#FFFFFF; --surface:#F4F6F7; --surface-2:#EDF0F1; --rule:#D6DCDF;
  --rust:#A8481F; --rust-soft:#F2E4DD; --rust-ink:#7E340F;
  --teal:#1F5F5B; --teal-soft:#DFEAE8;
  --amber:#9A6508; --amber-soft:#F6ECD8;
  --alert:#8E2F2F; --alert-soft:#F4E2E2;
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--surface);font-size:15px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;color:inherit}
.top{background:var(--ink);color:#fff;padding:13px 20px}
.top b{font-family:var(--serif);font-size:16px;display:block;line-height:1.2}
.top span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#93A2AB}
.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 70px}
h1{font-family:var(--serif);font-size:27px;font-weight:400;margin:0 0 6px;line-height:1.2}
.lede{font-size:14px;color:var(--slate);margin:0 0 20px;max-width:72ch}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:8px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:16px 18px;margin:0 0 18px}
.card p{margin:0;font-size:13.5px;color:var(--ink-2)}
.card p+p{margin-top:9px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fld label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);line-height:1.45}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--rust);outline-offset:1px}
.small{font-size:12.5px;color:var(--slate);max-width:78ch}
.pull{font-family:var(--serif);font-size:15px;font-style:italic;color:var(--ink-2);border-left:3px solid var(--rust);padding-left:12px;margin:14px 0;max-width:66ch}

/* action bar */
.bar{position:sticky;top:0;z-index:30;background:var(--surface);padding:10px 0;margin:0 0 6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--rule)}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:4px;padding:8px 14px;font-size:13px;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.btn.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.pri:hover{background:var(--rust-ink)}
.btn.gh{background:transparent;color:var(--slate)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
#msg{font-size:12.5px;color:var(--slate);flex:1;min-width:200px}
.dirty{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:3px 7px;border-radius:3px}
.dirty.y{background:var(--amber-soft);color:var(--amber);border:1px solid #E4D3AF}
.dirty.n{background:var(--teal-soft);color:var(--teal);border:1px solid #BFD6D2}

.tally{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:12px 0 12px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:3px 9px;border-radius:3px;border:1px solid var(--rule);background:var(--surface-2);color:var(--slate);white-space:nowrap}
.chip.on{background:var(--rust-soft);color:var(--rust-ink);border-color:#E3CCC2}
.chip.hold{background:var(--amber-soft);color:var(--amber);border-color:#E4D3AF}
.chip.bad{background:var(--alert-soft);color:var(--alert);border-color:#E0BFBF}
.chip.ok{background:var(--teal-soft);color:var(--teal);border-color:#BFD6D2}
.chip.count{background:none;border-color:transparent;color:var(--mute)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--ink-2);margin:0 0 18px;flex-wrap:wrap}
.tab{border:0;background:none;padding:9px 13px 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--slate);border-radius:4px 4px 0 0}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab.on{background:var(--ink-2);color:#fff}
.tab .n{display:inline-block;margin-left:6px;padding:0 5px;border-radius:3px;background:var(--alert);color:#fff;font-size:9.5px;letter-spacing:0}
.tab .n.r{background:var(--amber)}
.tab:focus-visible{outline:2px solid var(--rust);outline-offset:2px}

/* hierarchy */
.split{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
.treebox{background:var(--paper);border:1px solid var(--rule);border-radius:6px;position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto}
.treehead{padding:9px 12px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:var(--paper);z-index:2}
.treehead label{font-size:12px;color:var(--slate);display:flex;gap:5px;align-items:center}
.tsec{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--alert);font-weight:700;padding:10px 12px 4px;border-top:1px solid var(--rule)}
.tn{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 0;border-left:3px solid transparent;cursor:pointer;font-size:13px;position:relative}
.tn:hover{background:var(--surface)}
.tn:focus-visible{outline:2px solid var(--rust);outline-offset:-2px}
.tn.sel{background:var(--rust-soft);border-left-color:var(--rust)}
.tn.ret .tname,.tn.ret .tid{opacity:.5;text-decoration:line-through}
.tw{width:18px;border:0;background:none;color:var(--mute);font-size:10px;padding:0;flex:none;line-height:1}
.tw.leaf{visibility:hidden}
.tid{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--rust-ink);flex:none}
.tname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bd{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;font-weight:700;padding:1px 4px;border-radius:3px;border:1px solid var(--rule);color:var(--slate);background:var(--surface-2);flex:none}
.bd.b{background:var(--rust-soft);color:var(--rust-ink);border-color:#E3CCC2}
.bd.p{background:var(--amber-soft);color:var(--amber);border-color:#E4D3AF}
.bd.g{background:var(--teal-soft);color:var(--teal);border-color:#BFD6D2}
.dot{min-width:17px;height:17px;border-radius:9px;font-size:10px;font-weight:700;color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;flex:none}
.dot.f{background:var(--alert)}
.dot.r{background:var(--amber)}
.guide{position:absolute;top:0;bottom:0;width:1px;background:var(--rule)}

.sect{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:15px 17px;margin:0 0 14px}
.sect.hd{border-left:3px solid var(--rust)}
.dh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dh h2{font-family:var(--serif);font-size:23px;font-weight:400;margin:0;line-height:1.2}
.dh .cid{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--rust-ink)}
.dchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.path{font-size:12px;color:var(--mute);margin-top:6px}
.path button{border:0;background:none;padding:0;color:var(--slate);font-size:12px;text-decoration:underline;text-underline-offset:2px}
.acts{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 0;padding-top:10px;border-top:1px solid var(--surface-2)}
.lnk{border:0;background:none;padding:2px 0;font-size:13px;font-weight:600;color:var(--slate);text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--rust)}
.lnk[disabled]{color:var(--mute);text-decoration:none;cursor:not-allowed}
.lnk:focus-visible{outline:2px solid var(--rust);outline-offset:2px;border-radius:3px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fgrid .wide{grid-column:1/-1}
.help{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.45}
.fm div{font-size:12px;padding:4px 8px;border-radius:3px;margin-top:5px;line-height:1.4}
.fm .flag,.fl .flag{background:var(--alert-soft);color:var(--alert)}
.fm .review,.fl .review{background:var(--amber-soft);color:var(--amber)}
.fm .note,.fl .note{background:var(--surface-2);color:var(--slate)}
.fld .x-flag{border-color:var(--alert)!important;background:#FBF4F4}
.fld .x-review{border-color:var(--amber)!important;background:#FCF8EF}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 16px;font-weight:700;font-size:13px;color:var(--slate)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--ink-2);color:#fff}
.seg button:focus-visible{outline:2px solid var(--rust);outline-offset:-2px}
.srcg{margin-bottom:8px}
.srcg .gl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700;margin:6px 0 4px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;padding:2px;border-radius:5px}
.sc{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:5px 9px;font-size:12.5px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.sc:hover{border-color:var(--slate)}
.sc.on{border-color:var(--rust);background:var(--rust-soft);color:var(--rust-ink);font-weight:600}
.sc .c1{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--alert);letter-spacing:.04em}
.sc.off{border-style:dashed;border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.srcs-wrap{border:1px solid transparent;padding:4px 6px}
.rec{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.rec b{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.impl{margin-top:10px;background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:10px 12px;font-size:12.5px;color:var(--ink-2)}
.impl .ok{color:var(--teal);font-weight:700}
.impl .no{color:var(--alert);font-weight:700}
.impl table{border-collapse:collapse;margin:6px 0 8px}
.impl td{padding:2px 14px 2px 0;font-size:12.5px}
.fl{margin-top:12px}
.fl .it{display:flex;gap:9px;align-items:baseline;padding:6px 9px;border-radius:4px;margin-bottom:4px;font-size:12.5px}
.fl .it .r{font-family:var(--mono);font-size:10px;font-weight:700;flex:none;min-width:30px}
.fl .it .c{font-family:var(--mono);font-size:10px;flex:none;opacity:.8}
.panel{margin-top:12px;background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:12px 14px}
.panel p{margin:0 0 9px;font-size:12.5px;color:var(--ink-2)}
.panel .row2{display:grid;grid-template-columns:160px 1fr;gap:8px;margin-bottom:6px}
.panel input[type=text]{padding:6px 8px;border:1px solid var(--rule);border-radius:4px;width:100%}
.cklist{max-height:200px;overflow:auto;border:1px solid var(--rule);border-radius:4px;background:var(--paper);padding:6px 8px;margin-bottom:9px}
.cklist label{display:flex;gap:7px;font-size:12.5px;padding:2px 0;align-items:center}

/* tables */
.gridwrap{overflow:auto;max-height:72vh;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
table.g{border-collapse:separate;border-spacing:0;font-size:12px}
table.g th{position:sticky;top:0;background:var(--ink-2);color:#fff;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;text-align:left;padding:7px 8px;vertical-align:bottom;z-index:2;min-width:70px;max-width:180px;white-space:normal;line-height:1.3}
table.g td{padding:5px 8px;border-bottom:1px solid var(--rule);border-right:1px solid var(--surface-2);vertical-align:top;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;background:var(--paper);cursor:pointer}
table.g th.s0,table.g td.s0{position:sticky;left:0;z-index:1;min-width:44px;width:44px}
table.g th.s1,table.g td.s1{position:sticky;left:44px;z-index:1;min-width:84px;border-right:2px solid var(--rule)}
table.g th.s0,table.g th.s1{z-index:3}
table.g td.s1{font-family:var(--mono);font-weight:700;color:var(--rust-ink)}
table.g tr:hover td{background:var(--surface)}
table.g td.x-flag{background:var(--alert-soft)!important;color:var(--alert)}
table.g td.x-review{background:var(--amber-soft)!important}
table.g tr.ret td{color:var(--mute)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.filters .fld{min-width:160px}
.filters label.ck{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2);padding-bottom:8px}
table.dt{border-collapse:collapse;width:100%;font-size:13px;background:var(--paper)}
table.dt th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--rule);background:var(--surface-2)}
table.dt td{padding:7px 10px;border-top:1px solid var(--rule);color:var(--ink-2);vertical-align:top}
table.dt td.k{font-family:var(--mono);font-size:12px;color:var(--rust-ink);font-weight:700;white-space:nowrap}
table.dt td.m{font-size:12px;color:var(--slate)}
table.dt input,table.dt select{width:100%;padding:5px 7px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);font-size:12.5px}
table.dt input:focus,table.dt select:focus{outline:2px solid var(--rust);outline-offset:1px}
table.dt td.x-flag input,table.dt td.x-flag select{border-color:var(--alert);background:#FBF4F4}
table.dt td.x-review input,table.dt td.x-review select{border-color:var(--amber);background:#FCF8EF}
.sev{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap}
.sev.flag{background:var(--alert-soft);color:var(--alert)}
.sev.review{background:var(--amber-soft);color:var(--amber)}
.sev.note{background:var(--surface-2);color:var(--slate)}
.cibtn{border:0;background:none;padding:0;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--rust-ink);text-decoration:underline;text-underline-offset:2px}

/* overview */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.tile{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.tile .v{font-family:var(--serif);font-size:32px;line-height:1.1}
.tile .t{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700;margin-bottom:4px}
.tile .s{font-size:12px;color:var(--mute);margin-top:4px}
.tile.alert{border-left:3px solid var(--alert)}
.tile.amb{border-left:3px solid var(--amber)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.todo{margin:0;padding:0;list-style:none}
.todo li{padding:9px 0;border-top:1px solid var(--surface-2);font-size:13.5px;color:var(--ink-2);display:flex;gap:10px;align-items:baseline}
.todo li:first-child{border-top:0}
.todo li .sev{flex:none}
.sbar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--surface-2);margin:4px 0 2px}
.sbar span{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--slate);margin:8px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.brow{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-2);margin:6px 0}
.brow .n{text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--slate)}
.empty{text-align:center;padding:40px 20px}
.empty h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 6px}
.empty .btnrow{justify-content:center}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px}
.ref h3{font-family:var(--serif);font-size:18px;font-weight:400;margin:22px 0 8px}
.ref ul{margin:0;padding-left:18px}
.ref li{font-size:13px;color:var(--ink-2);margin-bottom:6px;max-width:84ch}
.ref li b{color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.foot{font-size:12.5px;color:var(--slate);border-top:1px solid var(--rule);padding-top:14px;margin-top:30px}
.foot p{margin:0 0 7px}

@media(max-width:980px){
  .split{grid-template-columns:1fr}
  .treebox{position:static;max-height:46vh}
  .tiles,.grid4{grid-template-columns:1fr 1fr}
  .cols2{grid-template-columns:1fr}
}
@media(max-width:640px){
  .fgrid,.tiles,.grid4{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .top,.bar,.tabs,.acts,.treehead,.btnrow{display:none}
  body{background:#fff;font-size:11pt}
  .treebox{position:static;max-height:none;overflow:visible}
  .gridwrap{max-height:none;overflow:visible}
}
</style>
<style>
.prevbar{background:var(--amber-soft);color:var(--amber);border-bottom:1px solid #E4D3AF;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:6px 20px}
.ref .chg td{font-size:12.5px}
</style>
</head>
<body>
<div class="prevbar" id="prevbar" style="display:none">Preview. Files you save here come from the build under test.</div>
<div class="top"><b id="t-top">CI Index</b><span id="t-sub"></span></div>
<div class="wrap">
<h1 id="t-h1"></h1>
<p class="lede" id="t-lede"></p>

<div class="card">
  <div class="lab">Index</div>
  <div class="grid4">
    <div class="fld"><label for="m-prog">Program</label><input id="m-prog" data-m="prog"></div>
    <div class="fld"><label for="m-doc">Index document number</label><input id="m-doc" data-m="doc"></div>
    <div class="fld"><label for="m-rev">Revision</label><input id="m-rev" data-m="rev"></div>
    <div class="fld"><label for="m-who">Your name, for the edit log</label><input id="m-who" data-m="who"></div>
  </div>
</div>

<div class="bar" id="bar">
  <button class="btn pri" data-act="save">Save index</button>
  <button class="btn" data-act="open">Open saved index</button>
  <button class="btn" data-act="xlsx">Export to Excel</button>
  <button class="btn" data-act="import">Import Excel workbook</button>
  <button class="btn gh" data-act="clear">Clear</button>
  <span class="dirty n" id="dirty">Saved</span>
  <span id="msg" role="status" aria-live="polite"></span>
</div>
<input type="file" id="f-json" accept="application/json,.json" style="display:none">
<input type="file" id="f-xlsx" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none">
<input type="file" id="f-cmp" accept="application/json,.json" style="display:none">

<div class="tally" id="tally"></div>
<div class="tabs" id="tabs" role="tablist"></div>
<div id="view"></div>
<div id="dls"></div>
<datalist id="dl-pin"></datalist>

<div class="foot" id="t-foot"></div>
</div>

<script>
/* ===================================================================
   Build block. The CI Index Builder writes this. Everything the tool
   shows and checks reads from it.
   =================================================================== */

e index is the hub for CI status. It flags what applies to each CI and points to the record that owns each answer. It does not copy content from those records.", "Each column holds a fixed property of the CI. Timing lives in the baseline columns."]}, {"title": "Definitions", "kind": "list", "items": ["**Configuration Item (CI).** Any hardware, software, firmware, or aggregation thereof that satisfies a system end-use function and is designated for separate configuration management. Designation includes establishing the CI’s requirements and verifying that its configuration meets those requirements and that its configuration documentation accurately describes its configuration.", "**Part or Identifying Number (PIN).** The identifier that, combined with the design activity CAGE code, uniquely identifies an item and its configuration. The PIN changes when a modification creates a non-interchangeable condition.", "**Safety-Critical Item (SCI).** A hardware or software item that has been determined through analysis to potentially contribute to a hazard with Catastrophic or Critical mishap potential, or that may be implemented to mitigate a hazard with Catastrophic or Critical mishap potential.", "**Control Tier.** The record of who baselines and controls a CI’s specification. The three tiers are Acquirer-spec controlled, Company-spec controlled, and GFE.", "**Product Definition Data (PDD).** The design data that defines an item’s physical and functional attributes: drawings, models, and associated lists such as parts lists."]}, {"title": "", "kind": "pull", "items": ["The safety-critical item is not the critical safety item. Different authority, different object, different obligation."]}, {"title": "How the tool works", "kind": "list", "items": ["**Hierarchy is entered once.** Pick the parent. The tool derives Level and the indented name. The three forms of hierarchy in the workbook can no longer disagree.", "**Checks run as you type.** They mark a cell for review. They never block entry. The Checks tab lists every finding and the rule behind it.", "**Sources drive the flags.** Pick each source that drives the unit record. The tool shows what the sources call for, and sets the four flags on request.", "**Rows are retired, not deleted.** A CI the Acquirer has concurred in cannot be deleted. De-designate it, or split or consolidate it. The tool keeps the old row and writes the trace on both sides.", "**Same PIN, another position.** Decision Path B can return separate CIs against one PIN. This action copies the row under a new CI ID. Key CSA on the CI and the installed position together.", "**Save keeps everything.** The saved file holds the index, the variants, and the edit log. The Excel export is the exchange copy. Import reads a Rev C workbook or a prior export. It reads the CI Index and PN Variants sheets."]}, {"title": "Rules carried from the template", "kind": "list", "items": ["Every CI goes to the Acquirer for concurrence, including Company-spec controlled CIs. A CI reads Proposed until the Acquirer concurs. Enter the concurrence, then set Status to Active. GFE rows read N/A.", "Criterion (b) Met is the umbrella safety column. Criterion (b) is mandatory for safety. Any condition in Table C-1 satisfies criterion (b) on its own. Neither the SCI sources nor Table C-1 catch an item whose loss is loss of primary system capability with no injury pathway. Find those items in the program’s own decomposition.", "Influencing parts fail criterion (b) by their own definition but qualify on criterion (a). See the criticality designations appendix.", "The FBL is a system-level baseline. Record it on the top-level CI only. The initial product baseline is established at completion of CDR. The formalized PBL takes its event from the Audit Designation Assessment Record. This index does not record audit designation.", "Do not copy handling instructions, IUID triggers, unique item identifiers, life limit values, date codes, or heat-lot details into this index.", "Where MBSE is used, CI parent-child relationships mirror the model decomposition. A same-CI verdict that mismatches the model is not entered until Systems Engineering dispositions it."]}], "examples": {"cis": [{"id": "CI-0001", "parent": "", "name": "Air Vehicle System", "type": "HWCI", "tier": "Acquirer-spec controlled", "oda": "XYZ Aerostructures", "cage": "1ABC2", "pin": "AV-1000-001", "nhpin": "N/A", "qty": "N/A", "spec": "SS-1000", "scd": "", "icd": "ICD-1000-501", "ssow": "", "mbse": "blk.AV", "ata": "00", "mae": "", "critB": "Y", "sci": "Y", "sciRef": "SMS hazard log HL-001", "selRef": "CISEL-0001", "concur": "CIL-SUB-001 / 2025-08-29", "fbl": "Established 2025-09-12", "abl": "Established 2026-01-20", "ipbl": "Planned CDR", "fpbl": "Planned PCA", "ser": "Y", "lot": "N", "src": "IUID; Cycle/usage-controlled life limit", "life": "Cycle/usage", "sh": "N", "iuid": "Y", "notdec": "N", "status": "Active", "sup": "", "notes": "Top-level CI; capstone audits apply"}, {"id": "CI-0012", "parent": "CI-0001", "name": "Flight Control System", "type": "HWCI", "tier": "Acquirer-spec controlled", "oda": "XYZ Flight Controls", "cage": "1ABC2", "pin": "FCS-2200-001", "nhpin": "AV-1000-001", "qty": "1", "spec": "PS-2200", "scd": "", "icd": "", "ssow": "", "mbse": "blk.FCS", "ata": "27", "mae": "", "critB": "Y", "sci": "Y", "sciRef": "SMS hazard log HL-014", "selRef": "CISEL-0012", "concur": "CIL-SUB-001 / 2025-08-29", "fbl": "N/A (system-level baseline)", "abl": "Established 2026-02-02", "ipbl": "Planned CDR", "fpbl": "Planned PCA", "ser": "N", "lot": "N", "src": "", "life": "None", "sh": "N", "iuid": "N", "notdec": "N", "status": "Active", "sup": "", "notes": "Implements hazard controls HL-014/-015"}, {"id": "CI-0013", "parent": "CI-0012", "name": "Flight Control Computer", "type": "HWCI", "tier": "Acquirer-spec controlled", "oda": "XYZ Flight Controls", "cage": "1ABC2", "pin": "FCC-2210-003", "nhpin": "RK-2205-001", "qty": "1", "spec": "PS-2210", "scd": "", var LISTS={yn:['Y','N']}, LITEMS={};
Object.keys(C.lists).forEach(function(n){ LITEMS[n]=C.lists[n].items; LISTS[n]=C.lists[n].items.map(function(i){ return i.v; }); });
function lab(n,m){ var it=(LITEMS[n]||[]).filter(function(i){ return i.m===m; })[0]; return it?it.v:null; }
function abbr(n,v){ var it=(LITEMS[n]||[]).filter(function(i){ return i.v===v; })[0]; return it&&it.ab?it.ab:String(v||'').slice(0,4).toUpperCase(); }
var ST={active:lab('status','active'),proposed:lab('status','proposed'),dedes:lab('status','dedes'),split:lab('status','split'),cons:lab('status','cons')};
var RET={}; (LITEMS.status||[]).forEach(function(i){ if(i.ret) RET[i.v]=1; });
var TIER={acq:lab('tier','acq'),co:lab('tier','co'),gfe:lab('tier','gfe')};
var SWT={}; (LITEMS.type||[]).forEach(function(i){ if(i.sw) SWT[i.v]=1; });
var LIFE={cycle:lab('life','cycle'),age:lab('life','age'),both:lab('life','both'),none:lab('life','none')};

var SRC={}; SRC_LIST.forEach(function(s){ SRC[s[0].toLowerCase()]={name:s[0],d:s[1],c1:!!s[2],role:s[3]}; });
function srcInfo(s){ return SRC[String(s||'').trim().toLowerCase()]; }
function canon(s){ var i=srcInfo(s); return i?i.name:String(s||'').trim(); }
function drivesSerial(s){ var i=srcInfo(s); return !!i&&(i.d==='Serial'||i.d==='Both'); }
function drivesLot(s){ var i=srcInfo(s); return !!i&&(i.d==='Lot/batch'||i.d==='Both'); }
function isC1(s){ var i=srcInfo(s); return !!i&&i.c1; }
function isRole(s,role){ var i=srcInfo(s); return !!i&&i.role===role; }

var OPS={is:'is',isnot:'is not',blank:'is blank',notblank:'is not blank',contains:'contains',notcontains:'does not contain',oneof:'is one of',always:'always'};
var THENW={notblank:'must not be blank',blank:'must be blank',is:'must be',isnot:'must not be',contains:'must contain',notcontains:'must not contain',oneof:'must be one of'};
var RULES=C.rules, CUST={};
(C.custom||[]).forEach(function(c){ CUST[c.id]={on:c.on,sev:c.sev,area:'Custom',what:c.what||autoWhat(c),basis:c.basis||'Build settings',needs:[c.ifCol,c.thenCol].filter(function(k){ return k&&k!=='*'; })}; });
var RQ={on:true,sev:'review',area:'Required',what:'A column the build marks as required is filled.',basis:'Build settings',needs:[]};
function ruleInfo(id){ return RULES[id]||CUST[id]||(id==='RQ'?RQ:null); }
function ruleOn(id){ var r=ruleInfo(id); return !!r&&!!r.on&&(r.needs||[]).every(has); }
var FEAT=C.features;
function autoWhat(c){
  var h=function(k){ return (C.cols.filter(function(x){ return x.k===k; })[0]||{}).h||k; };
  return (c.ifOp==='always'?'':'Where '+h(c.ifCol)+' '+OPS[c.ifOp]+(/blank|always/.test(c.ifOp)?'':' '+c.ifVal)+', ')+h(c.thenCol)+' '+THENW[c.thenOp]+(/blank/.test(c.thenOp)?'':' '+c.thenVal)+'.';
}

    tab:'overview', sel:null, col:{}, showRet:true,
    filt:{q:'',status:'',tier:'',only:false}, csev:'', logq:'',
    panel:null, sp:[{id:'',name:''},{id:'',name:''}], cons:{pick:{},id:'',name:''},
    dirty:false, focusVal:null };
}
var F=[], FI={}, FV={}, T=null, CNT={flag:0,review:0,note:0};
var $=function(id){ return document.getElementById(id); };
var UIDN=0;
function uid(){ UIDN++; return 'u'+Date.now().toString(36)+UIDN.toString(36); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
function tr(s){ return String(s==null?'':s).trim(); }
function isNA(v){ return /^n\/?a\b/i.test(tr(v)); }
function splitIds(s){ return String(s||'').split(/[;,]/).map(tr).filter(Boolean); }
function live(r){ return !RET[r.status]; }
function isGFE(r){ return !!TIER.gfe&&r.tier===TIER.gfe; }
function isSW(r){ return !!SWT[r.type]; }
function isSup(r){ return r.status&&(r.status===ST.split||r.status===ST.cons); }
function pad(n){ return String(n).padStart(2,'0'); }
function today(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function stamp(){ var d=new Date(); return today()+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function slug(s){ return String(s||'program').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'program'; }
function stem(){ return slug(C.text.stem||'CI-Index'); }
function srcText(r){ return (r.src||[]).join('; '); }

function blankRow(){ var r={uid:uid(),src:[]}; COLS.forEach(function(c){ if(c.kind!=='level'&&c.k!=='src') r[c.k]=''; }); return r; }

function hex(h){ h=String(h||'').replace('#',''); if(h.length===3) h=h.split('').map(function(c){ return c+c; }).join(''); var n=parseInt(h,16); return isNaN(n)?null:[(n>>16)&255,(n>>8)&255,n&255]; }
function mix(a,b,t){ return '#'+a.map(function(x,i){ return Math.round(x+(b[i]-x)*t).toString(16).padStart(2,'0'); }).join(''); }
function applyText(){
  var th=C.theme||{}, a=hex(th.accent), k=hex(th.ink), css=':root{';
  if(a) css+='--rust:'+mix(a,a,0)+';--rust-ink:'+mix(a,[0,0,0],0.25)+';--rust-soft:'+mix(a,[255,255,255],0.85)+';';
  if(k) css+='--ink:'+mix(k,k,0)+';--ink-2:'+mix(k,[255,255,255],0.08)+';';

  if(PREVIEW) $('prevbar').style.display='block';

/* ===================================================================
   Hierarchy
   =================================================================== */
function buildTree(){
  var ids={}, kids={}, roots=[], byUid={};
  S.cis.forEach(function(r){ byUid[r.uid]=r; if(r.id) (ids[r.id]=ids[r.id]||[]).push(r); });
  S.cis.forEach(function(r){
    if(!r.parent) roots.push(r);
    else if(ids[r.parent]&&ids[r.parent][0]!==r){ var p=ids[r.parent][0]; (kids[p.uid]=kids[p.uid]||[]).push(r); }
  });
  var order=[], lvl={}, seen={};
  function walk(r,d){ if(seen[r.uid]) return; seen[r.uid]=1; lvl[r.uid]=d; order.push(r); (kids[r.uid]||[]).forEach(function(c){ walk(c,d+1); }); }
  roots.forEach(function(r){ walk(r,0); });
  var unplaced=S.cis.filter(function(r){ return !seen[r.uid]; });
  var cyc={}, orphan={};
  unplaced.forEach(function(r){
    if(r.parent&&!ids[r.parent]) { orphan[r.uid]=1; return; }
    if(r.parent===r.id){ cyc[r.uid]=1; return; }
    var x=r, hop={}, n=0;
    while(x&&x.parent&&ids[x.parent]&&n<10000){ if(hop[x.uid]){ cyc[r.uid]=1; break; } hop[x.uid]=1; x=ids[x.parent][0]; n++; }
  });
  T={ids:ids,kids:kids,roots:roots,order:order,lvl:lvl,unplaced:unplaced,cyc:cyc,orphan:orphan,byUid:byUid};
  return T;
}
function parentOf(r){ return r.parent&&T.ids[r.parent]?T.ids[r.parent][0]:null; }
function ancestors(r){ var a=[], x=parentOf(r), n=0; while(x&&n<500){ if(x===r||a.indexOf(x)>=0) break; a.push(x); x=parentOf(x); n++; } return a; }
function descendants(r){ var out=[], st=(T.kids[r.uid]||[]).slice(); while(st.length){ var x=st.shift(); if(out.indexOf(x)>=0) continue; out.push(x); st=st.concat(T.kids[x.uid]||[]); } return out; }
function liveKids(r){ return (T.kids[r.uid]||[]).filter(live); }
function exportOrder(){ return T.order.concat(T.unplaced); }

/* ===================================================================
   Checks
   =================================================================== */
function cond(v,op,x){
  v=tr(v).toLowerCase(); var s=String(x==null?'':x).trim().toLowerCase();
  switch(op){
    case 'always': return true;
    case 'is': return v===s;
    case 'isnot': return v!==s;
    case 'blank': return !v;
    case 'notblank': return !!v;
    case 'contains': return v.indexOf(s)>=0;
    case 'notcontains': return v.indexOf(s)<0;
    case 'oneof': return s.split(',').map(function(y){ return y.trim(); }).indexOf(v)>=0;
  }
  return false;
}
function runChecks(){
  buildTree();
  F=[]; FI={}; FV={}; CNT={flag:0,review:0,note:0};
  function add(rule,r,k,m,v,sev){
    if(!sev){ if(!ruleOn(rule)) return; sev=ruleInfo(rule).sev; }
    var f={rule:rule,sev:sev,uid:r?r.uid:null,vuid:v?v.uid:null,k:k||null,m:m};
    F.push(f); CNT[f.sev]++;
    if(r){ var o=FI[r.uid]=FI[r.uid]||{all:[],k:{}}; o.all.push(f); if(k) (o.k[k]=o.k[k]||[]).push(f); }
    if(v){ var p=FV[v.uid]=FV[v.uid]||{all:[],k:{}}; p.all.push(f); if(k) (p.k[k]=p.k[k]||[]).push(f); }
  }
  var usesMBSE=has('mbse')&&S.cis.some(function(r){ return tr(r.mbse); });
  var liveRoots=T.roots.filter(live);
  var srcRole=function(src,role){ return src.filter(function(s){ return isRole(s,role); }).map(canon); };

  S.cis.forEach(function(r){
    var L=live(r), G=isGFE(r), src=r.src||[], par=parentOf(r);
    var hasOther=srcRole(src,'other').length>0;

    /* columns: required, list, and format */
    COLS.forEach(function(c){
      if(c.kind==='level') return;
      var v=val(r,c.k);
      if(c.req&&L&&!v&&!(G&&!c.reqGFE)) add('RQ',r,c.k,hd(c.k)+' is required, and it is blank.',null,c.req);
      if(c.kind==='enum'&&v&&LISTS[c.list]&&LISTS[c.list].indexOf(v)<0) add('LS1',r,c.k,'"'+v+'" is not on the '+(C.lists[c.list]?C.lists[c.list].name:c.list)+' list.');
      if(c.kind==='yn'&&v&&v!=='Y'&&v!=='N') add('LS1',r,c.k,hd(c.k)+' reads "'+v+'". Enter Y or N.');
      if(c.kind==='number'&&v&&isNaN(+v)&&!isNA(v)) add('TY1',r,c.k,hd(c.k)+' reads "'+v+'". Enter a number.');
      if(c.kind==='date'&&v&&!/^\d{4}-\d{2}-\d{2}$/.test(v)) add('TY1',r,c.k,hd(c.k)+' reads "'+v+'". Enter a date as YYYY-MM-DD.');
    });

    /* custom rules */
    (C.custom||[]).forEach(function(c){
      if(!ruleOn(c.id)) return;
      if(c.scope!=='all'&&!L) return;
      if(c.skipGFE&&G) return;
      if(!cond(c.ifCol==='*'?'':val(r,c.ifCol),c.ifOp,c.ifVal)) return;
      if(cond(val(r,c.thenCol),c.thenOp,c.thenVal)) return;
      add(c.id,r,c.thenCol,c.msg||CUST[c.id].what,null,c.sev);
    });

    /* structure */
    if(!tr(r.id)) add('ST1',r,'id','CI ID is blank. Every CI needs a program-unique identifier.');
    else if(T.ids[r.id].length>1) add('ST2',r,'id','CI ID '+r.id+' appears on '+T.ids[r.id].length+' rows. Each CI ID must be unique.');
    if(r.parent&&T.orphan[r.uid]) add('ST3',r,'parent','Parent CI ID '+r.parent+' does not exist in the index.');
    if(T.cyc[r.uid]) add('ST4',r,'parent','The parent chain loops back to this CI. Break the loop.');
    if(!r.parent&&L&&liveRoots.length>1&&liveRoots[0]!==r) add('ST5',r,'parent','A second CI has no parent. Only the top-level CI ('+(liveRoots[0].id||'unnamed')+') has no parent.');
    if(L&&par&&!live(par)) add('ST6',r,'parent','The parent CI '+par.id+' reads '+par.status+'. Reparent this CI or retire it.');
    if(!tr(r.tier)) add('ST7',r,'tier',hd('tier')+' is blank.');
    if(TIER.co&&r.tier===TIER.co&&!ancestors(r).some(function(a){ return a.tier===TIER.acq; }))
      add('ST8',r,'tier','A '+TIER.co+' CI sits below an '+TIER.acq+' CI. No ancestor of this CI is '+TIER.acq+'.');
    if(r.notdec==='Y'&&liveKids(r).length) add('ST9',r,'notdec','This CI is a supplier-designed unit, yet it has child CIs. Do not decompose a supplier-designed item to identify customer-facing CIs.');

    /* status and concurrence */
    if(!tr(r.status)) add('CO1',r,'status','Status is blank.');
    if(!G){
      if(r.status===ST.active&&!tr(r.concur)) add('CO2',r,'concur','Status reads '+ST.active+', but no Acquirer concurrence is recorded. A CI reads '+ST.proposed+' until the Acquirer concurs.');
      if(r.status===ST.proposed&&tr(r.concur)&&!isNA(r.concur)) add('CO3',r,'status','An Acquirer concurrence is recorded. Set Status to '+ST.active+'.');
      if(L&&!tr(r.selRef)) add('CO5',r,'selRef','No CI selection criteria checklist is referenced.');
    } else if(tr(r.concur)&&!isNA(r.concur)) add('CO4',r,'concur','GFE rows read N/A for Acquirer concurrence.');

    if(/see\s+scd/i.test(r.spec||'')&&!tr(r.scd)) add('DO1',r,'scd',hd('spec')+' reads See SCD, but no SCD is recorded.');

    /* supersession */
    var sup=splitIds(r.sup);
    if(isSup(r)&&!sup.length) add('SU1',r,'sup','A superseded row names the new CI ID or IDs.');
    sup.forEach(function(id){
      if(!T.ids[id]) { add('SU2',r,'sup',id+' does not exist in the index.'); return; }
      var t=T.ids[id][0];
      if(splitIds(t.sup).indexOf(r.id)<0) add('SU3',r,'sup',id+' does not name '+(r.id||'this CI')+' in '+hd('sup')+'. Record the trace on both rows.');
    });

    if(G){
      var thin=['spec','scd','ssow','mae','critB','sci','sciRef','selRef','fbl','abl','ipbl','fpbl','ser','lot','life','sh','iuid','notdec'].filter(function(k){ return has(k)&&tr(r[k]); });
      if(has('src')&&src.length) thin.push('src');
      if(thin.length) add('GF1',r,null,'A GFE row is thin. These columns usually stay blank: '+thin.map(hd).join(', ')+'.');
    }
    if(G||!L) return;

    /* safety */
    var c1=src.filter(isC1).map(canon), csi=srcRole(src,'csi');
    if(!r.critB) add('SA1',r,'critB','Criterion (b) is not answered. Record the answer from the CI selection criteria checklist.');
    if(!r.sci) add('SA7',r,'sci','SCI is not answered.');
    if(r.sci==='Y'&&r.critB!=='Y') add('SA2',r,'critB','SCI = Y, so '+hd('critB')+' should read Y. A safety-critical item satisfies criterion (b).');
    if(c1.length&&r.critB!=='Y') add('SA3',r,'critB',c1.join(' and ')+' meets criterion (b) on its own (Table C-1). '+hd('critB')+' should read Y.');
    if(csi.length&&r.sci!=='Y') add('SA4',r,'sci',csi[0]+' is a source, but SCI is not Y. A critical safety item is expected on the SCI list. Its absence is a gap for System Safety to resolve.');
    if(r.sci==='Y'&&!tr(r.sciRef)) add('SA5',r,'sciRef','SCI = Y, but no record that names the item is cited.');
    if(r.sci==='N'&&tr(r.sciRef)) add('SA6',r,'sciRef','SCI = N, so '+hd('sciRef')+' stays blank.');

    /* recording */
    var serS=src.filter(drivesSerial).map(canon), lotS=src.filter(drivesLot).map(canon);
    var shS=srcRole(src,'sh'), iuS=srcRole(src,'iuid').concat(csi);
    if(r.ser==='Y'&&!serS.length&&!hasOther) add('RE1',r,'ser','Serialization = Y, but no source that drives serial recording is named.');
    if(serS.length&&r.ser!=='Y') add('RE2',r,'ser',serS.join('; ')+' drives serial recording. Serialization should read Y.');
    if(r.lot==='Y'&&!lotS.length&&!hasOther) add('RE3',r,'lot','Lot/Batch = Y, but no source that drives lot or batch recording is named.');
    if(lotS.length&&r.lot!=='Y') add('RE4',r,'lot',lotS.join('; ')+' drives lot or batch recording. Lot/Batch should read Y.');
    if(r.sh==='Y'&&!shS.length&&!hasOther) add('RE5',r,'sh','Special Handling = Y needs a special handling source.');
    if(shS.length&&r.sh!=='Y') add('RE6',r,'sh',shS[0]+' is a source. Special Handling should read Y.');
    if(r.iuid==='Y'&&!iuS.length&&!hasOther) add('RE7',r,'iuid','IUID Required = Y needs an IUID or critical safety item source.');
    if(iuS.length&&r.iuid!=='Y') add('RE8',r,'iuid',iuS.join(' and ')+' brings item unique identification. IUID Required should read Y.');
    src.forEach(function(s){ if(!srcInfo(s)) add('RE9',r,'src','"'+s+'" is not on the source list. Use a listed spelling, or pick an Other source and say what it is in Notes.'); });
    if(isSW(r)&&(r.ser==='Y'||r.lot==='Y')) add('RE10',r,r.ser==='Y'?'ser':'lot','Software CIs read N and N. Their identity sits on the loadable part number and the baseline.');
    var cyS=srcRole(src,'cycle').length>0, agS=srcRole(src,'age').length>0;
    if(LIFE.cycle&&(r.life===LIFE.cycle||r.life===LIFE.both)&&!cyS) add('RE11',r,'life','The life clock reads '+r.life+', but no cycle, ALI, or safe-life source is named. Confirm which source drives the record.');
    if(LIFE.age&&(r.life===LIFE.age||r.life===LIFE.both)&&!agS) add('RE11',r,'life','The life clock reads '+r.life+', but no age or shelf-life source is named. Confirm which source drives the record.');
    if((r.life===LIFE.none||!r.life)&&has('life')&&(cyS||agS)) add('RE11',r,'life','A life-limit source is named, but the life clock reads '+(r.life||'blank')+'.');
    var blank=['ser','lot','iuid','sh','life'].filter(function(k){ return has(k)&&!r[k]; });
    if(blank.length) add('RE12',r,blank[0],'Not answered: '+blank.map(hd).join(', ')+'.');

    /* baselines */
    if(!r.parent){ if(!tr(r.fbl)||isNA(r.fbl)) add('BA1',r,'fbl','The FBL is a system-level baseline. Record it on the top-level CI.'); }
    else if(tr(r.fbl)!==FBL_NA) add('BA2',r,'fbl','Enter '+FBL_NA+' on every row except the top-level CI.');

    /* model */
    if(usesMBSE&&!tr(r.mbse)&&!tr(r.mae)) add('MO1',r,'mbse','No model element and no model alignment exception. Where the CI departs from the model, record the reason Systems Engineering accepted.');
    if(tr(r.mbse)&&tr(r.mae)) add('MO2',r,'mae','The CI resolves to model element '+r.mbse+'. Leave '+hd('mae')+' blank, or clear the element ID.');
  });

  /* quantity per next higher assembly */
  var groups={};
  S.cis.forEach(function(r){
    if(!live(r)) return;
    var nh=tr(r.nhpin), q=tr(r.qty);
    if(isNA(nh)&&q&&!isNA(q)) add('QT1',r,'qty','NH PIN is N/A, so Qty per NH reads N/A.');
    if(nh&&!isNA(nh)&&!q) add('QT2',r,'qty','Qty per NH is blank. Take it from the next higher assembly’s parts list.');
    if(q&&!isNA(q)&&!/^[1-9]\d*$/.test(q)) add('QT3',r,'qty','Qty per NH reads "'+q+'". Enter a whole number of 1 or more, or N/A.');
    if(tr(r.pin)&&nh&&!isNA(nh)) { var key=tr(r.pin)+'\u0001'+nh; (groups[key]=groups[key]||[]).push(r); }
  });
  Object.keys(groups).forEach(function(key){
    var g=groups[key], qs={};
    g.forEach(function(r){ if(/^[1-9]\d*$/.test(tr(r.qty))) qs[tr(r.qty)]=1; });
    var ql=Object.keys(qs), pin=tr(g[0].pin), nh=tr(g[0].nhpin);
    if(ql.length>1){ g.forEach(function(r){ add('QT4',r,'qty','Rows sharing PIN '+pin+' and NH PIN '+nh+' carry different Qty per NH values ('+ql.join(', ')+').'); }); return; }
    if(!ql.length) return;
    var q=+ql[0], n=g.length, ids=g.map(function(r){ return r.id; }).join(', ');
    if(n!==1&&n!==q) g.forEach(function(r){ add('QT5',r,'qty',n+' rows share PIN '+pin+' and NH PIN '+nh+' ('+ids+'). Qty per NH is '+q+'. '+(q===1?'One row should carry this PIN and NH PIN.':'The count should be 1, where one CI covers every instance, or '+q+', where each instance is its own CI.')); });
    else if(q>1) g.forEach(function(r){ add('QT6',r,'qty','Qty per NH is '+q+' and '+(n===1?'one CI covers every instance':'each instance is its own CI ('+ids+')')+'. Confirm Decision Path B of the same-CI decision aid has been run.'); });
  });

  /* PN Variants */
  if(FEAT.tabs.variants){
    var vByCi={};
    S.vars.forEach(function(v){
      var c=tr(v.ciId), r=c&&T.ids[c]?T.ids[c][0]:null;
      if(!c) add('VA1',null,'ciId','The variant row names no CI ID.',v);
      else if(!r) add('VA1',null,'ciId','CI '+c+' does not exist in the index.',v);
      if(!tr(v.pin)) add('VA4',r,'pin','A variant row carries no PIN or version identifier.',v);
      if(r){
        (vByCi[r.uid]=vByCi[r.uid]||[]).push(v);
        if(isSW(r)&&(v.ser==='Y'||v.lot==='Y')) add('VA3',r,v.ser==='Y'?'ser':'lot','Software variants read N and N.',v);
        else ['ser','lot'].forEach(function(k){
          if(v[k]&&r[k]&&v[k]!==r[k]&&!tr(v.notes)) add('VA2',r,k,'Variant '+(v.pin||'')+' reads '+VC(k)+' = '+v[k]+', but CI '+r.id+' reads '+r[k]+'. Variants share the CI’s source. Where this variant’s source differs, say so in its Notes.',v);
        });
      }
    });
    Object.keys(vByCi).forEach(function(u){
      var r=T.byUid[u], vs=vByCi[u];
      if(vs.length===1) add('VA6',r,null,'CI '+r.id+' has one PN Variants row. The sheet records a one-CI, multiple-PIN-variant verdict. One row is not a family.',vs[0]);
      if(!isSW(r)&&tr(r.pin)&&!vs.some(function(v){ return tr(v.pin)===tr(r.pin); }))
        add('VA5',r,'pin','The CI row PIN '+r.pin+' does not appear among its variants. Keep the base or representative PIN on the CI row.');
    });
  }

  var ordIdx={}; exportOrder().forEach(function(r,i){ ordIdx[r.uid]=i; });
  var SV={flag:0,review:1,note:2};

      out.push({basis:'Sibling CIs',ctx:p,a:g[i],b:g[j],ctl:(g[i].tier&&g[j].tier&&g[i].tier!==g[j].tier)?'Y':'N'});

}

function unzip(buf){

}

}

    if(t.tagName==='SELECT'){ var o=r[d.f]; r[d.f]=t.value; logEdit(r.id,d.f,o,t.value); dirty(); render(); return; }
    var from=S.focusVal, to=r[d.f]=tr(r[d.f]);
    if(from!=null&&tr(from)!==to){ logEdit(d.f==='id'?to:r.id,d.f,tr(from),to); if(d.f==='id') renameId(r,tr(from),to); }
    S.focusVal=t.value; sched(); return;
  }
  if(d.vf){
    var v=S.vars.filter(function(x){ return x.uid===d.vu; })[0]; if(!v) return;
    if(t.tagName==='SELECT'){ var ov=v[d.vf]; v[d.vf]=t.value; logEdit(v.ciId,null,ov,t.value,'Variant '+VC(d.vf)); dirty(); render(); return; }
    var vf=S.focusVal; v[d.vf]=tr(v[d.vf]);
    if(vf!=null&&tr(vf)!==v[d.vf]) logEdit(v.ciId,null,tr(vf),v[d.vf],'Variant '+VC(d.vf));
    S.focusVal=t.value; return;
  }
  if(d.filt&&d.filt!=='q'){ S.filt[d.filt]=t.type==='checkbox'?t.checked:t.value; $('gridbox').innerHTML=gridHTML(); return; }
  if(d.opt){ S[d.opt]=t.checked; $('treelist').innerHTML=treeListHTML(); return; }
  if(d.cpick){ S.cons.pick[d.cpick]=t.checked; return; }
});
$('f-json').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  if(S.dirty&&!confirm('You have unsaved changes. Open '+f.name+' anyway?')) return;
  readJSON(f,function(o){
    var other=o.build&&o.build.name&&o.build.name!==C.build.name;
    loadData(o,null); clean(); render();
    msg('Opened '+f.name+(o.saved?', saved '+o.saved:'')+'. '+S.cis.length+' CI rows, '+S.vars.length+' variant rows, '+S.log.length+' log entries.'+(other?' It was saved by the build "'+o.build.name+'". Columns this build does not carry were dropped.':''));
  });
});
$('f-xlsx').addEventListener('change',function(e){ var f=e.target.files&&e.target.files[0]; e.target.value=''; if(f) doImport(f); });
$('f-cmp').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  readJSON(f,function(o){ S.cmp={name:f.name,data:{cis:(o.cis||[]).map(normRow),vars:(o.vars||[]).map(normVar),saved:o.saved}}; render(); msg('Comparing with '+f.name+'.'); });
});
window.addEventListener('beforeunload',function(e){ if(S.dirty&&!PREVIEW){ e.preventDefault(); e.returnValue=''; } });

/* Builder preview link. The builder asks for the working data before it reloads the preview. */
window.addEventListener('message',function(e){
  if(!PREVIEW||!e.data||e.data.ciReq!=='snapshot') return;
  var r=cur();
  parent.postMessage({ciSnap:snapshot(),tab:S.tab,sel:r?r.id:'',sy:window.scrollY},'*');
});

/* SC columns get their own datalists */
$('dls').innerHTML=COLS.filter(function(c){ return c.sug&&c.sug.length&&!c.pins; }).map(function(c){ return '<datalist id="dl-'+c.k+'">'+c.sug.map(function(s){ return '<option value="'+esc(s)+'"></option>'; }).join('')+'</datalist>'; }).join('');
applyText();
if(PREVIEW){
  if(PREVIEW.data) loadData(PREVIEW.data,null);
  else if(PREVIEW.mode==='examples'&&hasEx()) loadData({meta:{prog:'Example program'},cis:C.examples.cis,vars:C.examples.vars||[]},null);
  if(PREVIEW.tab) S.tab=PREVIEW.tab;
  buildTree();
  if(PREVIEW.sel&&T.ids[PREVIEW.sel]) S.sel=T.ids[PREVIEW.sel][0].uid;
}
render();
if(PREVIEW&&PREVIEW.sy) window.scrollTo(0,PREVIEW.sy);
</script>
