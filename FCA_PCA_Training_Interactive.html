   scen:"A structural actuator is named in the statement of work as requiring a functional audit. Working the rest of the assessment you establish: it hosts a hazard risk control; its last audit was two years ago and closed with an open delta covering three requirements; a new sub-tier now supplies its bearings; the production line has a foreign-object finding from last quarter; and reconciliation indicators show an unincorporated-change backlog against it. The programme reads the statement of work, notes that a functional audit is already planned, and considers the assessment closed.",
   parts:[
     {id:"a", q:"State everything wrong with treating the contract designation as the end of the assessment here."},
     {id:"b", q:"Work the full disposition. Name every audit or audit scope you would record, and the factor that produced each."},
     {id:"c", q:"An open delta from the previous audit is sitting in this assessment. What does it contribute, and what would you expect to have happened to it before now?"},
     {id:"d", q:"Who signs this assessment, and why is that set of signatures different from an assessment where every safety answer was no?"},
     {id:"e", q:"The programme argues that expanding scope beyond the contract creates unfunded work. Answer that, and say what the correct route is if the expansion genuinely cannot be resourced."},
     {id:"f", q:"Six months later the bearing supplier is replaced again. What happens, and what is the shortest honest answer to \u201cwe just did this\u201d?"}
   ]}

 ]
},
{
 id:"A2", label:"Module 2", title:"Preparing and conducting",
 sub:"Planning, entry criteria, data packages, and what actually happens in the room.",
 sections:[

  {id:"A2-01", title:"Audit planning", body:[
    P("An audit is a scheduled event with a documented plan, agreed in advance with the Acquirer. The plan and agenda are prepared by configuration management and approved by the Acquirer, and they cover:"),
    L([
      "**Scope**, drawn from the contract, the statement of work and the specifications.",
      "**The items to be audited**, with their nomenclature, specification numbers and item identifiers.",
      "**Location, dates and duration.**",
      "**The co-chairs** \u2014 one from each side.",
      "**Audit team composition, and each member's function.** Not a list of names: a list of names with what each person is there to do.",
      "**The documentation to be reviewed.**",
      "**A chronological schedule** of the proceedings.",
      "**Administrative and security requirements** \u2014 site access, clearances, visit requests, network and projection needs."
    ]),
    P("Two scheduling rules have teeth."),
    STEPS([
      {h:"Hold the planning conference far enough ahead",b:"Normally thirty to sixty days, and the reason is symmetrical: **both** parties have to prepare. A planning conference held three weeks out produces an agenda that only one side has had time to resource."},
      {h:"Confirm the schedule against actual availability",b:"The audit date must be confirmed compatible with the real availability of the information and the contract articles \u2014 released documentation, product specifications, quality records, manuals, drawings, reports, the hardware itself, and for software the interface and version documentation. An audit date set without that confirmation is a date that will move."}
    ]),
    P("The organisation also commits to providing specific things, and it is worth knowing them because they are what people forget to resource: the plan and agenda; conference facilities; all variances against the item with their current status; the minutes of prior audits; and personnel from engineering, manufacturing and quality who can discuss the technical detail of what is presented."),
    C("Lead times are a constraint, not a preference",[
      "Entry criteria are typically worked from forty-five to sixty days before the audit date.",
      "Data package items are typically due around twenty-one days out.",
      "Logistics \u2014 facilities, clearances, staging, the scribe \u2014 sit inside the final two weeks.",
      "Work backwards from the audit date, not forwards from today. An item with a sixty-day lead that surfaces at forty days is already late, and no amount of effort recovers it."
    ]),
    S("An audit date agreed without confirming that the evidence and the hardware will exist on that date is a placeholder, not a plan.",
      "The date will move. The only question is how late you find out.")
  ], check:{
    q:"An audit date is agreed with the Acquirer at a planning conference held five weeks out. Nobody has checked whether the released documentation, the quality records and the hardware will actually be available on that date. What is the defect here?",
    o:["The planning conference was too late \u2014 sixty days is the minimum",
       "The schedule was never confirmed compatible with the actual availability of the information and contract articles, which is a required step, not a courtesy",
       "The agenda has not yet been approved by the Acquirer",
       "Nothing is wrong yet; availability is checked as part of the data package review"],
    a:1,
    why:"Five weeks sits inside the normal thirty-to-sixty day window, so the timing of the conference is not the fault \u2014 which is what makes the first option tempting. The missing step is the confirmation that the evidence and the articles will exist when the audit convenes. Skipping it is how a date gets agreed by two willing parties and then moves twice."
  }},

  {id:"A2-02", title:"Entry criteria \u2014 the functional audit", body:[
    P("Entry criteria are the conditions that must be satisfied before the audit convenes. They are not aspirations. For the functional audit there are five."),
    STEPS([
      {h:"Baselines approved",b:"The functional and allocated documentation for the item or system must be approved by the Acquirer. Without that, the audit has no fixed reference to verify against."},
      {h:"Designation confirmed and recorded",b:"The assessment that designated this item exists, is current, and is referenced. If the item was designated three years ago and never reassessed, the scope of what you are about to audit may be wrong."},
      {h:"Plan and agenda approved",b:"Approved by the Acquirer, with the audit team and the facilities confirmed."},
      {h:"Final draft product specification provided",b:"Provided to the Acquirer before the audit, as contracted. The audit produces the verified performance basis on which that specification is later approved."},
      {h:"Test data from the right configuration",b:"The test evidence must come from verification of **the configuration being formally accepted or released for production** \u2014 a prototype or preproduction article, or the first production article if there is no other."}
    ]),
    P("The second criterion is the one people treat as a formality, and it is not. Designation is reassessed at every plan revision and on any trigger event, so the assessment that put this item on the audit list may be years old. Confirming it at entry is how you discover that the item has since acquired a hazard risk control, or changed its manufacturing source \u2014 and that the audit you are about to run is scoped to an item that no longer exists in that form."),
    C("Why the last one carries so much weight",[
      "Test evidence from a superseded configuration proves something true about an article that is not the article being accepted.",
      "It is the easiest entry criterion to soften, because the data exists, it is real data, and someone worked hard to produce it. The reports look identical. Only the configuration they were run against is different.",
      "Where verification can only be completed after system integration and test, the final functional audit uses those results \u2014 that is the legitimate route, not reaching backwards for older data."
    ]),
    S("Test evidence from a superseded configuration proves nothing about the configuration being accepted.",
      "It is the most persuasive-looking wrong answer in the whole preparation set.")
  ], check:{
    q:"A test campaign was completed on an earlier build standard. Since then two approved changes have been incorporated, neither of which touches the tested functions. The programme proposes to enter the functional audit using the earlier test reports. How do you answer?",
    o:["Accept it \u2014 the changes do not touch the tested functions, so the data still applies",
       "The entry criterion requires test data from the configuration being formally accepted or released; the earlier data does not satisfy it, and the argument that the changes are unrelated is the assessment the audit exists to make rather than assume",
       "Accept it if the Acquirer agrees in writing",
       "Reject it, because test data older than the current baseline is never usable in any form"],
    a:1,
    why:"The first option is the reasonable-engineer answer, and that is exactly why it is dangerous: it substitutes a judgement about what the changes touched for evidence about the configuration being accepted. The last option overcorrects \u2014 earlier data is not worthless, and where verification genuinely completes only after integrated testing, those later results are used. What is not available is entering the audit as though the criterion were met."
  }},

  {id:"A2-03", title:"Entry criteria \u2014 the physical audit", body:[
    P("The physical audit has six, and two of them are softened so routinely that they are worth learning as a pair."),
    STEPS([
      {h:"The functional audit complete or concurrent",b:"With its minutes available for the item."},
      {h:"Designation confirmed and recorded",b:"As for the functional audit."},
      {h:"The audit unit jointly selected with the Acquirer",b:"An early production-representative unit. Its serial numbers are identified, and the item and its detail parts are isolated so they are available for examination rather than in a queue somewhere."},
      {h:"Plan and agenda approved",b:"With the audit team and facilities confirmed."},
      {h:"Unencumbered access arranged",b:"To inspection, fabrication, production, assembly and test areas \u2014 with the tools, inspection equipment and test software available."},
      {h:"Final draft detail specification available",b:"The product-level specification for the item."},
      {h:"The audit unit's build records complete and closed",b:"Every work order against the unit closed, and every non-conformance record raised against it dispositioned and closed. Status accounting is what demonstrates this, and it demonstrates it per unit \u2014 not for the item in general."}
    ]),
    P("That last one follows directly from what the physical audit is for. An open work order is work still to be done to the article. An open non-conformance disposition is a decision still to be made about what the article *is*. While either is outstanding, the as-built configuration of the unit is not final, the reconciliation drawn from it is provisional, and the audit would be testing a comparison whose right-hand side can still move."),
    P("The word **isolated** in the third criterion is doing real work. Detail parts that have already been installed into a higher assembly cannot be examined. Parts sitting in a queue elsewhere in the building cannot be examined on the day. Isolating the item and its detail parts, and identifying the serial numbers in advance, is what makes the examination possible at all \u2014 and it is a manufacturing action with its own lead time, not an administrative note."),
    C("The two that get softened",[
      "**Joint selection.** If the Supplier chooses the unit alone, the Supplier has chosen the sample, and every conclusion drawn from it is a conclusion about a unit selected by the party being audited. The point is not suspicion; it is that a sample chosen by one side cannot support a joint finding.",
      "**Unencumbered access.** The frequent substitute is to bring parts and records to a conference room. That is a different audit. The physical audit reaches the floor deliberately \u2014 it examines the item where it was built, with the instructions the builders actually used and the equipment they actually used."
    ]),
    S("A unit selected by the party being audited is not a sample. It is an exhibit.",
      "Joint selection is what makes the examination evidence about production rather than about one prepared article.")
  ], check:{
    q:"A supplier offers to have a completed unit ready in a conference room with its records, drawings and detail parts laid out, to save the audit team walking the line. They have picked a unit they know is clean. Which entry criteria has this arrangement failed?",
    o:["None \u2014 the unit and the records are what the audit examines",
       "Joint selection of the audit unit, and unencumbered access to the fabrication, assembly and test areas",
       "Only unencumbered access; a supplier may select the unit",
       "Only joint selection; the location of the examination is a logistics matter"],
    a:1,
    why:"Both criteria have quietly gone. The unit was chosen by the party being audited, so it is an exhibit rather than a sample; and the examination has been moved off the floor, which removes the ability to see the instructions, the tooling and the process that produced it. Each softening sounds helpful on its own, which is precisely how both arrive together."
  }},

  {id:"A2-04", title:"The functional audit data package", body:[
    P("The data package is what the audit reads. It is assembled and controlled by configuration management, and provided to the audit team before the audit rather than produced in the room."),
    TABLE(["Group","What it contains"],[
      ["Requirements","Specifications \u2014 requirements, development, performance and interface. The requirements traceability matrix, and the verification cross-reference matrix aligned to it."],
      ["Verification evidence","Test plans, procedures and reports or results. Analyses. Demonstration records. Pre-production test results and qualification status."],
      ["The honest accounting","Three lists: tests accomplished; tests accomplished without recorded detail data; and tests not yet performed, each with the plan to accomplish it. Plus analyses or simulations standing in for requirements not fully verifiable by test."],
      ["Changes and variances","The current listing of every variance request, change proposal, specification change notice and revision notice against the item, requested or approved. An account of which change proposals were incorporated, which were tested, and which are proposed. Variances applicable to the units used for the audit."],
      ["Software, where applicable","Database characteristics, storage allocation, timing and sequencing data against requirements. The software product documents \u2014 product specification, user manual, version description. Developmental configuration change records. The library listing of every version held. Findings of internal configuration management and software quality audits."],
      ["Reviews and history","Preliminary and critical design review minutes with action item closure status. Minutes of previous lower-level audits with their open items. Supplier statement of work and purchase order where applicable, with quality and status accounting records."]
    ]),
    S("The three lists are the part people leave out, and they are the part that makes the package honest.",
      "Tests done, tests done without data, tests not done \u2014 with a plan for each of the last two."),
    C("What a missing accounting looks like in the room",[
      "A package arrives with a test report for every test that was performed. Nothing is missing on its face, because nothing that exists is absent.",
      "What is absent is the shape of what does not exist \u2014 the tests never run, and the tests run without recorded data. Those are the two categories an audit is specifically there to find, and they can only be found from a list that admits them."
    ])
  ], check:{
    q:"A functional audit package contains a test report for every test that was performed, all of them complete and signed. What is most likely still missing?",
    o:["The specifications, which are usually assumed rather than provided",
       "The lists of tests not yet performed with the plan to accomplish each, and of tests performed without recorded detail data",
       "The design review minutes, which are optional for the functional audit",
       "Nothing \u2014 if every performed test is reported, the verification evidence is complete"],
    a:1,
    why:"The fourth option is the trap and it is a subtle one: reports on everything performed really can be complete, and still tell you nothing about what was never performed. The package is required to carry the shape of the gaps as well as the evidence of the work \u2014 tests not yet done with a plan for each, and tests done without recorded data. Design review minutes are required too, so they are not optional."
  }},

  {id:"A2-05", title:"The requirements traceability matrix", body:[
    P("One artifact carries the functional audit, and it is worth a section of its own."),
    P("The traceability matrix cross-references **every requirement** to the test plan, the test procedure, the test programme where automated equipment is used, and the test report that verifies it. Where a requirement is verified by analysis, inspection or demonstration rather than by test, that record is cross-referenced in place of the test. Each known deficiency is identified by its deficiency report number."),
    P("It is provided to the Acquirer before the audit, and it becomes part of the audit minutes."),
    C("Why it matters more than it looks",[
      "The matrix is what makes the audit checkable by someone who was not in the room. Without it, a functional audit is a series of conversations between people who already agree, and the record afterwards is a set of assertions.",
      "With it, anyone can pull a requirement at random two years later and walk the chain: requirement, plan, procedure, report, result.",
      "It is also a floor requirement \u2014 every requirement mapping to a test step that passed is one of the audit obligations that arrives through the safety management system, not only through the contract."
    ],"teal"),
    S("The traceability matrix is what converts an audit from a meeting into evidence.",
      "It is the one artifact a stranger can audit the audit with."),
    P("Two failure modes to recognise. The first is the blank cell: a requirement with no verification reference, left empty because it is verified by analysis and the column says test. The record for an analysis, inspection or demonstration goes in the cell \u2014 an empty cell reads as an unverified requirement, and at the audit it will be treated as one. The second is the matrix that maps requirements to *plans* but stops short of *results*: a chain that ends at intent rather than outcome verifies nothing.")
  ], check:{
    q:"In a traceability matrix, four requirements have blank verification cells. The engineer explains that those four are verified by analysis rather than by test, so there is no test reference to enter. What is the correct handling?",
    o:["Leave them blank and note the explanation verbally at the audit",
       "Enter the analysis records in the cells \u2014 an analysis, inspection or demonstration record stands in place of the test reference, and a blank cell reads as an unverified requirement",
       "Remove those four requirements from the matrix, since the matrix cross-references tests",
       "Create test procedures for the four so the matrix can be completed consistently"],
    a:1,
    why:"The explanation is correct and the handling is wrong. Not every requirement is verified by test, and the matrix is built for that \u2014 the analysis, inspection or demonstration record occupies the cell. Leaving it blank with a verbal explanation defeats the entire purpose of an artifact designed to be readable by someone who was not present, and removing the requirements is worse: it hides them from the one document that is supposed to prove completeness."
  }},

  {id:"A2-06", title:"The physical audit data package", body:[
    P("The physical audit package is heavier than the functional one, because it has to describe a specific unit as well as a design."),
    TABLE(["Group","What it contains"],[
      ["Design definition","Drawings and model data, parts lists and associated lists, and the drawing index with revision letters."],
      ["Manufacture","Manufacturing instruction sheets, work instructions, installation procedures and machine data for the parts the Acquirer identifies. The agreed drawing and instruction sample, selected per the approved plan."],
      ["Parts control","The approved parts selection list, and the approved nomenclature and nameplates."],
      ["Acceptance evidence","The production acceptance test procedures and the associated test data for the audit unit."],
      ["Reconciliation","The as-designed to as-built reconciliation report for the audit unit, with the change-incorporation reports from status accounting, and the closure status of the unit's work orders and non-conformance records."],
      ["Part traceability","For the audit unit: serial and lot records, life-limited designations with their limits and life consumed, safety-critical and special-handling designations, and traceability to the next higher assembly."],
      ["Changes and variances","Approved and outstanding changes; changes made during test; required changes not completed; shortage lists; the review of undocumented design changes; variances applicable to this unit."],
      ["Unit differences","Identification of the differences between the physical audit unit and the unit or units used at the functional audit, **with the certification basis that those differences do not degrade functional characteristics**."],
      ["Quality and support","Quality programme findings and status, first article results, and the operation and support manuals."],
      ["Software, where applicable","Source code with the released configuration documentation to compare it against; the version description including compiler, compiler version and settings; the interface documentation; the build environment staged in advance so that a build can actually be produced during the audit; and for commercial software, documentation matching the delivered versions with media identification and marking."]
    ]),
    P("The part traceability row repays attention. For a life-limited part it carries not only the identity of the part but its limit and the life already consumed \u2014 because a life-limited part with no consumed-life record is, from the day it is installed, a part nobody can schedule the removal of. The same row carries the safety-critical and special-handling designations, and the traceability upward to the next higher assembly, which is what makes a fleet-wide question answerable later: where else did parts from this lot go?"),
    S("The unit-difference identification is the row people skip, and it is the one anchored in a documented programme failure.",
      "Development article and production article are not the same article until someone has written down how they differ and why it does not matter.")
  ], check:{
    q:"The physical audit unit is a production article. The functional audit was performed on a preproduction article. The programme's position is that both were built to the same drawings, so no comparison is needed. What does the data package require?",
    o:["Nothing further, provided both were built to the same released drawings",
       "Identification of the differences between the two units, together with the certification basis that those differences do not degrade functional characteristics",
       "A repeat of the functional audit on the production article",
       "A variance covering the use of a preproduction article at the functional audit"],
    a:1,
    why:"Built to the same drawings is a claim about intent, not about articles \u2014 tooling, process, source and workmanship all differ between a preproduction and a production build even when the drawings do not. The requirement is not to re-run the functional audit, which would be disproportionate; it is to identify the differences and certify that they do not degrade functional characteristics, so the functional conclusion can be transferred to the production article honestly."
  }},

  {id:"A2-07", title:"Preparation as a joint punch list", body:[
    P("Preparation is tracked on a working document with one row per required input. Each row is an entry criterion, a pre-audit submittal, or a data package item, and each carries:"),
    L([
      "**A provider** \u2014 a named function, not \u201cthe programme.\u201d",
      "**A due date**, derived by working backwards from the audit date using that item's lead time.",
      "**A status.**",
      "**A location reference** \u2014 document number, system link, or where the physical thing is \u2014 so that the audit team can find it rather than ask for it again."
    ]),
    P("Readiness is computed from status rather than judged. That matters more than it sounds: a percentage that someone calculates from rows is a fact, and a readiness that someone declares in a meeting is an opinion."),
    C("Rows that do not apply are marked, not deleted",[
      "Software rows on a hardware-only item. Supplier rows where the supplier has no role in this audit.",
      "Mark them as not applicable and **keep them**. The record then shows that the item was considered and ruled out, which is a different statement from the item never having been on the list.",
      "Deleted rows are indistinguishable from rows nobody thought of."
    ]),
    P("The rule that governs the whole document is short: **all entry criteria complete before the audit convenes.** Data package items arriving late are a problem to manage. An entry criterion open on the day is a different kind of event \u2014 it means a precondition of the audit is not satisfied, and the correct response is a conversation about the schedule, not a footnote in the minutes."),
    P("Where a supplier conducts or supports the audit, the same tracker is shared with them as the joint punch list. Two organisations working from one list is the difference between coordinated preparation and two parallel guesses."),
    S("Readiness is computed from rows, not declared in a meeting.",
      "And an entry criterion open on the audit date is a schedule conversation, not a footnote.")
  ], check:{
    q:"Three days before a physical audit, the tracker shows every data package row complete. Status accounting reports that the audit unit still carries two open work orders and one non-conformance record awaiting disposition. The programme proposes to convene as planned and close all three during the audit week. What is the correct handling?",
    o:["Proceed \u2014 closing them during the audit week means they will be closed before the audit ends",
       "Treat it as a schedule conversation now: until the build records are closed the unit's as-built configuration is not final, so the reconciliation the audit is there to test can still move",
       "Proceed, and record the three open items in the minutes as constraints on the examination",
       "Mark the rows not applicable, since the work is in hand and will complete"],
    a:1,
    why:"Closing them during the week sounds efficient and is the answer most people give, but it means the article changes while it is being examined \u2014 and every reconciliation drawn from it before the closures is provisional. Recording them as constraints converts an unmet precondition into a note. The not-applicable status is for rows that genuinely do not apply, never for rows that apply and are not ready."
  }},

  {id:"A2-08", title:"What both audits require, whoever is running them", body:[
    P("A set of obligations applies to both audits and to every party running one. They are easy to lose in the gap between the two audit types, so learn them as a group."),
    L([
      "**Designate a co-chair** who runs proceedings jointly with the Acquirer's co-chair, gives the opening briefing, folds the conclusions of side meetings back into the official record, and delivers the management out-brief.",
      "**Provide the current listing** of every variance, change proposal, specification change notice and revision notice against the item \u2014 requested as well as approved.",
      "**Record significant questions and answers, action items, conclusions and recommended courses of action** in official minutes.",
      "**Ensure the people in the room can discuss technical detail** \u2014 engineering, manufacturing and quality personnel who know the material, rather than presenters reading from it.",
      "**Verify that approved engineering changes and variance corrective actions were actually implemented**, confirming that the product and its configuration information still agree."
    ]),
    P("The last of those five is the one people read past. Approved changes and variance corrective actions are **verified as actually implemented** \u2014 not confirmed as approved, not confirmed as scheduled. An approved change that was never incorporated leaves the product and its configuration information disagreeing, and both sides of that disagreement look correct on their own paperwork. Checking implementation is how the disagreement becomes visible."),
    P("Then the minutes discipline during the audit, which is more demanding than most people expect. **Daily minutes are made available for joint review at the start of the next session, and the overall audit minutes are available to the Acquirer before the audit team departs.** Not a fortnight later."),
    P("Those two obligations sit alongside a third, later one: the **finalised** minutes are published and delivered no later than sixty days from completion of the audit, or per contract. The sixty-day rule governs the finished document. It does not govern the record made during the audit, and it is routinely quoted as though it did."),
    S("A finding that was obvious to everyone on the day becomes contested a week later. The same-day record is what stops that.",
      "Daily minutes reviewed jointly at the start of the next session; overall minutes before the team leaves the site."),
    C("Sub-suppliers whose items are being audited",[
      "They participate in planning as well as conduct \u2014 not just on the day.",
      "They prepare audit plans identifying their own requirements and responsibilities.",
      "They field personnel who can discuss the technical detail of what is presented. A supplier who sends people to read slides has not met the obligation, whatever the slides say."
    ])
  ], check:{
    q:"An audit runs for four days. The Supplier's team proposes to consolidate all the minutes afterwards and issue them within two weeks, so that the audit days themselves are not slowed by note-taking. What is wrong with that?",
    o:["Nothing, provided the two-week deadline is met",
       "Daily minutes must be available for joint review at the start of the next session, and the overall minutes before the audit team departs \u2014 the record is what keeps a same-day finding from being re-argued later",
       "Nothing, provided the Acquirer's co-chair agrees to the arrangement",
       "The minutes must be issued within sixty days, so two weeks is acceptable"],
    a:1,
    why:"The final publication deadline is a real and separate obligation, which is what makes the last option persuasive \u2014 but it governs the finalised minutes, not the record during the audit. The daily discipline exists because memory diverges fast: a finding both sides accepted on Tuesday becomes two accounts by the following week, and there is nothing to arbitrate between them."
  }},

  {id:"A2-09", title:"Conducting the functional audit", body:[
    P("The audit opens with a design-team briefing for each item being audited. Its required content tells you something about the culture the format is trying to enforce:"),
    L([
      "An overview of the item.",
      "Test results and findings.",
      "**Requirements not met, with proposed remedies.**",
      "Change proposals incorporated, tested and proposed.",
      "The overall test effort, including its problem areas."
    ]),
    P("Opening with what failed is built into the format. A briefing that reaches the third bullet and finds nothing to say has either an unusually clean programme or a briefing problem, and the audit will establish which."),
    P("Then the systematic walk. For each requirement, or for an agreed sample, the audit verifies the documentation flow: **baseline requirement specification, to test plan, to test procedure, to test report** \u2014 or to the analysis, inspection or demonstration record standing in place of a test. Interface requirements are verified as part of that same flow rather than separately."),
    C("Sampling has one hard limit",[
      "Where sampling is agreed, requirements that verify hazard risk controls and other safety-critical requirements are **in the sample. They are not sampled out.**",
      "This is the rule that a compressed schedule attacks first, because sampling is legitimate and the safety requirements are usually the most expensive ones to walk."
    ]),
    P("The audit also reviews: the complete list of tests accomplished, tests without recorded data, and tests not yet performed with the plan for each; approved changes and the account of what was incorporated and tested; the design review minutes, confirming findings were incorporated and action items closed; and the lower-level audit minutes with their open items."),
    P("Where verification depends on integrated testing not yet performed, partial completion is acknowledged. Open requirements become action items and close through a delta audit."),
    S("Every non-compliance is documented and provided to the Acquirer for action.",
      "And an item failing quality requirements is analysed for cause and corrected before re-verification \u2014 not simply retested until it passes.")
  ], check:{
    q:"Sampling has been agreed for a functional audit because the requirement set is large. The proposed sample excludes six requirements that verify hazard risk controls, on the grounds that those were already examined thoroughly during qualification. How do you answer?",
    o:["Accept it \u2014 sampling is agreed, and duplicated effort adds nothing",
       "Safety-critical requirements and those verifying hazard risk controls are included in the sample and are not sampled out, whatever was examined elsewhere",
       "Accept it if the qualification evidence is attached to the minutes instead",
       "Reject the sampling arrangement entirely and walk every requirement"],
    a:1,
    why:"The reasoning offered is genuinely sensible about effort, and that is what makes it dangerous: the requirements most worth re-walking are exactly the ones most expensive to re-walk. Sampling itself is legitimate and agreed, so rejecting it wholesale overcorrects. What is not available is a sample that omits the hazard-control requirements."
  }},

  {id:"A2-10", title:"Software in the functional audit", body:[
    P("Software items get everything above, plus a set of examinations that have no hardware equivalent."),
    L([
      "**Database characteristics, storage allocation, timing and sequencing** examined against the requirements. These are the properties that pass every functional test and fail in service, under load or at a boundary.",
      "**The product documents** \u2014 product specification, user manual, version description \u2014 checked for format and completeness.",
      "**Developmental configuration change records**: what changed in the working design description before it was baselined, and under what control.",
      "**The library listing of every version held**, developmental and non-developmental alike. Non-developmental means acquired rather than written here \u2014 and it is where unrecorded content usually hides.",
      "**Findings of internal configuration management and software quality audits.** The organisation's own audits of itself are evidence, and their findings are read at the functional audit rather than filed."
    ]),
    P("The library listing deserves a moment. It lists every version held \u2014 including versions the organisation did not write. Acquired libraries, vendor components, generated code and test harnesses all end up in a working environment, and each has a version, a source and a licence position that somebody assumed rather than recorded. The audit asks for the listing precisely because a working software item is almost never made only of what the team wrote."),
    S("For a software item the standard is stated flatly: every requirement has a related test step, and that test passes.",
      "Not most requirements. Not the requirements that were testable within the schedule."),
    C("What that sentence rules out",[
      "A requirement covered by a test that was written but never run.",
      "A requirement covered by a test that runs and fails, with the failure carried as a known issue.",
      "A requirement covered by inspection of the code because writing a test was impractical \u2014 unless the analysis, inspection or demonstration record is the agreed verification method and is cross-referenced as such.",
      "Each of these is a normal, defensible engineering position during development. None of them satisfies the audit."
    ])
  ], check:{
    q:"At a software functional audit, forty of the item's requirements map to test steps that pass. Three map to test steps that run and fail, carried as known issues with agreed workarounds documented in the release notes. What is the audit position?",
    o:["Acceptable \u2014 the failures are known, documented and worked around",
       "The three are non-compliances: the standard is that every requirement has a related test step and that test passes, so they are documented, provided to the Acquirer, and closed through action items or a delta audit",
       "Acceptable if the workarounds are approved by the Acquirer during the audit",
       "The whole item fails the audit and must be re-presented once all tests pass"],
    a:1,
    why:"Known issues with documented workarounds are a legitimate way to run a development programme, and that is why this looks acceptable \u2014 the information is all present and nobody is hiding anything. But documented is not the same as verified, and the audit standard is that the test passes. Failing the whole item overstates it: partial completion, recorded action items and a delta audit are the built-in mechanism."
  }},

  {id:"A2-11", title:"Conducting the physical audit", body:[
    P("Two objectives are easy to miss, and both sit beside the obvious one. The physical audit also verifies that **anything redesigned after the functional audit still meets the performance specification**, and confirms that the **acceptance testing requirements in the documentation are actually adequate to accept production units.** The second is a check on the acceptance criteria themselves, not on one unit's acceptance results."),
    P("Then the examination."),
    STEPS([
      {h:"Reconcile the item to its documentation",b:"Item to drawings, to associated lists, to parts list \u2014 with effectivity and next assembly, and with the accuracy of notes, references and referenced released documents checked rather than assumed."},
      {h:"Review the agreed sample",b:"The sampled drawings and model data against the matching manufacturing instructions, confirming that the instructions reflect the design detail and incorporate the authorised changes. This is where documentation that is correct at the top and wrong at the bench is found."},
      {h:"Confirm the parts, then look at the parts",b:"Confirm compatibility with the approved parts selection list \u2014 and then **physically examine the item to confirm the proper parts are actually installed.** The parts, not the records about the parts."},
      {h:"Verify change incorporation and reconcile the delta",b:"Confirm approved changes are incorporated, using status accounting reports and selective review, and reconcile and correct any difference between as-designed and as-built data for the unit. The reconciliation report for this unit arrives as a claim, not as evidence: the examination is what establishes whether it was right."},
      {h:"Identify and certify unit differences",b:"Between this unit and the unit used at the functional audit, with the certification that the differences do not degrade functional characteristics."},
      {h:"Review the awkward records",b:"Completed shortage lists and undocumented design changes; confirm no unapproved changes exist in the technical documentation and that every approved change is in the hardware."}
    ]),
    S("A record can agree perfectly with the design while the hardware does not. That gap is the entire reason this audit exists.",
      "Which is why the step is examine the item, and not review the record of the item."),
    C("The anchor, stated plainly",[
      "A door plug left an assembly line without all four retention bolts, and the as-built record did not show it. Every paper check that existed agreed with every other paper check.",
      "The examination of the physical article is the step that is not reducible to a record, and it is the step under most pressure whenever a schedule is tight."
    ])
  ], check:{
    q:"At a physical audit, the parts list, the as-built record and the status accounting report all agree that the correct connector is fitted. The audit team is offered those three records in place of opening the unit, since three independent records already agree. What is the objection?",
    o:["There is none \u2014 three independent records agreeing is stronger evidence than one visual inspection",
       "All three are records, and the audit requires the item itself to be examined to confirm the proper parts are actually installed",
       "The records are only acceptable if the Acquirer's representative countersigns them",
       "Two records would be insufficient, but three is the accepted threshold"],
    a:1,
    why:"Three agreeing records feel like independent confirmation, and that is the exact reasoning the requirement was written against: records can be consistent with each other and jointly wrong about the hardware, because they often derive from a common source. The physical examination is the only step that is not a record, which is why it is specified separately and why it survives schedule pressure badly."
  }},

  {id:"A2-12", title:"Software in the physical audit", body:[
    P("For a software item, the physical audit asks the same question as for hardware \u2014 is the thing you delivered the thing the documentation describes \u2014 and answers it by building the software in front of witnesses."),
    STEPS([
      {h:"Compare the code to the documentation",b:"Source listings against the released configuration documentation."},
      {h:"Verify the version description",b:"Including the **compiler, the compiler version and the compiler settings.** The toolchain is part of the configuration; the same source with a different compiler is not guaranteed to be the same product."},
      {h:"Build it during the audit",b:"The build is produced during the audit, installed on the target device, and verified against the version description, **witnessed by quality assurance** or the entity the Acquirer designates. Every update listed on the build's problem reports is confirmed applied."},
      {h:"Check the commercial software",b:"Documentation matching the versions actually delivered on the media, with adequate identification and marking of all deliverable media."}
    ]),
    P("Two details are easy to under-read. **Witnessed** means quality assurance, or the entity the Acquirer designates, is present while the build runs \u2014 not shown the result afterwards. And the media identification and marking check is not housekeeping: unmarked or ambiguously marked deliverable media is how the wrong version reaches a target, months later, entirely without anybody making a mistake at the time."),
    S("The live rebuild is where toolchain identification either pays for itself or fails in public.",
      "If the recorded compiler version is gone, the failure happened months earlier \u2014 the audit is only where it becomes visible."),
    C("Why an archived binary is not a substitute",[
      "The usual proposal is to demonstrate the delivered binary from the archive rather than rebuild during the audit, on the grounds that the archived artifact is the one that shipped.",
      "It answers a different question. The archive shows what was produced. The rebuild shows that what was produced **can be reproduced from the recorded configuration** \u2014 which is the claim the product baseline actually rests on.",
      "An organisation that cannot rebuild has a configuration it can ship but cannot maintain, patch or investigate."
    ])
  ], check:{
    q:"During a software physical audit, the build fails: the recorded compiler version was upgraded eight months ago and the original is no longer available anywhere. The supplier offers the archived delivered binary, which is verifiably the one that shipped. What is the significance?",
    o:["Minor \u2014 the archived binary is the delivered product, so the delivery is verified either way",
       "The item cannot be shown to be reproducible from its recorded configuration, which is what the physical audit is verifying \u2014 and the underlying failure is a configuration control failure that happened eight months ago",
       "It is a finding against the audit team for not staging the build environment earlier",
       "The build requirement can be waived where the delivered binary is verifiable"],
    a:1,
    why:"The archived binary genuinely is the delivered product, which is why the first option is tempting \u2014 but it evidences what was shipped, not that the recorded configuration reproduces it. Staging the build environment is part of preparation and its absence would be a real problem, yet here the environment could not be staged because the toolchain was not preserved. The audit is where a months-old control failure surfaces, not where it was caused."
  }}

 ],
 exercises:[

  {id:"A2-E1", title:"Exercise 1 \u2014 Building the preparation tracker",
   scen:"A designated item is a hardware assembly containing an embedded firmware load. Both audits are required and will be held eleven weeks from today at your facility. The functional audit unit will be a preproduction article; the physical audit unit has not yet been chosen. The firmware is developed by a supplier who will attend. Qualification testing is complete for all but the thermal requirements, which will be verified during integrated system testing in nine weeks.",
   parts:[
     {id:"a", q:"List the entry criteria for both audits and give each one a provider and a due date derived from the audit date. Say what you used to derive each date."},
     {id:"b", q:"Which rows on this tracker are not applicable, and how do you handle them? Explain what would be lost by handling them the other way."},
     {id:"c", q:"The thermal requirements will not be verified until nine weeks from now, two weeks before the audit. What does that mean for the functional audit, and what do you plan for now rather than later?"},
     {id:"d", q:"The physical audit unit has not been chosen. Who chooses it, when does that need to happen relative to the audit date, and what makes a choice acceptable?"},
     {id:"e", q:"The firmware supplier will attend. What of theirs goes on the tracker, and what do you need them to have staged before the audit week?"},
     {id:"f", q:"Two weeks out, readiness stands at ninety percent, with the shortfall entirely in data package rows. Two weeks later, readiness is ninety-five percent, with the shortfall entirely in entry criteria rows. Which situation is worse, and why?"},
     {id:"g", q:"What has to be true of the audit unit's build records before the audit convenes, who demonstrates it, and what would you do if that evidence arrived showing one non-conformance still open?"}
   ]},

  {id:"A2-E2", title:"Exercise 2 \u2014 A functional audit with a third of the test programme incomplete",
   scen:"You arrive at a functional audit. The design-team briefing is polished and reports no requirements unmet. Working through the traceability matrix, you find that sixty-eight of two hundred and ten requirements have no test report reference. Of those, forty are marked as verified by analysis with an analysis record referenced, twenty-two are marked \u201cscheduled\u201d with no plan attached, and six are blank. Four of the six blanks are requirements that verify hazard risk controls. The programme proposes to certify the audit and address the remainder informally.",
   parts:[
     {id:"a", q:"Categorise the sixty-eight and say which are acceptable as they stand, which are findings, and which are something worse."},
     {id:"b", q:"The opening briefing reported no requirements unmet. What does that tell you, given what you found in the matrix?"},
     {id:"c", q:"The four blanks that verify hazard risk controls: what is their status, and what does their presence in this list suggest about how the sample or the schedule was managed?"},
     {id:"d", q:"Can this audit be certified as the programme proposes? Set out what is actually available and how the open scope should be handled."},
     {id:"e", q:"For the twenty-two marked \u201cscheduled\u201d, what exactly should the package have contained, and who owed it?"},
     {id:"f", q:"Name one fact you would need before you could decide whether the forty analysis-verified requirements are genuinely satisfied, and say who you would ask for it."}
   ]},

  {id:"A2-E3", title:"Exercise 3 \u2014 The unit that is not the unit",
   scen:"A physical audit is convened on an early production article. The functional audit was conducted eight months earlier on a preproduction article. During the walk you establish that the production unit uses a different connector supplier, a bracket in a different material, and a revised harness routing introduced to ease assembly. The routing change went through as an approved change. The connector supplier change was handled as a purchasing action. The bracket material was changed by the supplier under their own internal process. The programme has not identified any differences between the two units.",
   parts:[
     {id:"a", q:"Which entry or data package requirement has not been satisfied here, and what should have existed before the audit convened?"},
     {id:"b", q:"Take the three differences one at a time. What is the status of each, and which of the three worries you most?"},
     {id:"c", q:"What has to be produced, and by whom, before the difference in units can be accepted?"},
     {id:"d", q:"The programme argues that the functional audit conclusions still hold because none of the three changes affects a tested function. Answer that argument using what this module says about transferring a functional conclusion to a production article."},
     {id:"e", q:"Which documented programme failure is this pattern anchored to, and what did that pattern actually cost?"},
     {id:"f", q:"The bracket material change was made under the supplier's internal process. What does that suggest about something other than this unit, and what would you do about it?"}
   ]},

  {id:"A2-E4", title:"Exercise 4 \u2014 A build that will not reproduce",
   scen:"A software item reaches its physical audit. Source listings match the released documentation. The version description names a compiler and a version, but not the settings. On the audit day the build is attempted: it completes, but the resulting binary differs from the delivered one. Investigation during the audit establishes that two optimisation settings differ from those used at release, and that nobody recorded them. The delivered binary is archived and verifiable. Quality assurance is present and witnessing.",
   parts:[
     {id:"a", q:"State what has and has not been demonstrated by the day's activity."},
     {id:"b", q:"The version description named the compiler and version but not the settings. Why does that specific omission matter, given that the source matched?"},
     {id:"c", q:"What does this mean for the product baseline, and what would you expect the disposition of the audit to turn on?"},
     {id:"d", q:"The supplier proposes to record the correct settings now, rebuild, and confirm a match. Is that closure? Explain what it does and does not resolve."},
     {id:"e", q:"Which earlier configuration management activity actually failed here, and roughly when?"},
     {id:"f", q:"What would you want to check about this supplier's other software deliveries, and what would you need in order to check it?"}
   ]},

  {id:"A2-E5", title:"Exercise 5 \u2014 Readiness on the day",
   scen:"A combined functional and physical audit convenes on Monday. On Friday afternoon the tracker showed: all data package rows complete except the operation and support manuals; entry criteria complete except unencumbered access to the test area, which is under a facility reorganisation, and the final draft detail specification, which is in review with an expected release on Tuesday. The Acquirer's team has already booked travel. The programme proposes to start Monday and pick up the two open criteria as they land.",
   parts:[
     {id:"a", q:"Separate the three open items into the ones that are a management problem and the ones that are a precondition problem, and justify the split."},
     {id:"b", q:"What is the correct conversation to have on Friday afternoon, and with whom?"},
     {id:"c", q:"The Acquirer's travel is booked. How much weight does that carry in the decision, and why?"},

   ]}

 ]
