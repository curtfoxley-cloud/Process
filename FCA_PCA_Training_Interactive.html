{
 id:"A3", label:"Module 3", title:"Findings, closure and the record",
 sub:"What comes out of an audit, how it is classified, and when it is finished.",
 sections:[

  {id:"A3-01", title:"Findings and action items", body:[
    P("Every discrepancy found during an audit becomes a written record. Not a conversation, not an understanding, not a note in someone's book. A written record with four required elements:"),
    L([
      "**The issue** \u2014 what was found, stated so that someone who was not present can understand it.",
      "**The agreed closure plan** \u2014 what will be done about it.",
      "**The responsible person** \u2014 a person, not a department.",
      "**The agreed suspense date** \u2014 when closure is due."
    ]),
    P("Discrepancies are recorded either as separate finding records \u2014 the standard form on defence programmes \u2014 or in the body of the minutes. Which route is used depends on the contract. What does not vary is that the four elements are present and the record exists."),
    P("Each element earns its place. **A person** rather than a department, because a department cannot be asked for a status and cannot inherit the context of what was found; eighteen months later a named person can be traced through a leaver process, and a department name resolves to nobody. **A suspense date** rather than an intention, because an undated commitment cannot become overdue, and an item that cannot become overdue never surfaces on any report."),
    S("There is no such thing as a verbal finding.",
      "A discrepancy that both sides discussed and nobody wrote down did not happen, and will be re-argued as though it never did."),
    C("The practical machinery",[
      "**A scribe** is assigned before the audit begins, and finding forms are ready. An audit that starts without a scribe generates its findings in three different notebooks.",
      "**Daily minutes** carry the day's findings, and are reviewed jointly at the start of the next session \u2014 which is the moment a disagreement about what was found is cheapest to settle.",
      "**Side meetings** happen in every audit, and their conclusions are folded back into the official record by the co-chair rather than remaining with the people who attended."
    ]),
    P("The discipline sounds administrative and is not. The audit's entire value to the organisation lies in what it can prove afterwards, to people who were not in the room \u2014 the Acquirer, a later programme, an investigator. An unwritten finding has no value to any of them.")
  ], check:{
    q:"During a physical audit, an inspector and a supplier engineer agree in front of the audit team that a work instruction does not reflect the current drawing revision. The supplier commits to fixing it that week. Nobody records it, because it will be closed before the audit ends. What is wrong?",
    o:["Nothing, provided it is genuinely closed before the audit ends",
       "It should have been recorded as a finding with an issue, a closure plan, a responsible person and a suspense date \u2014 including the evidence of closure if it does close during the audit",
       "Nothing, provided the supplier's own quality system records it",
       "It should have been recorded only if it turned out to be a systematic problem"],
    a:1,
    why:"Fast closure is genuinely good and is why this feels harmless. But the audit's output is its record: a finding closed during the audit still tells the Acquirer, and the next programme, that the gap between instructions and drawings existed. Deciding whether it is systematic comes after recording it, not before \u2014 classification is a judgement made on a written finding, not a filter applied to whether one gets written."
  }},

  {id:"A3-02", title:"Major versus minor", body:[
    P("Findings are classified, and the classification decides how much attention the finding gets and how it is dispositioned. The line is drawn in a specific place, and it is not where most people first assume."),
    CARDS([
      {h:"Major", b:"Production definition documentation or design data incorrect or incomplete. Systematic breakdown of process control. Clear non-adherence to workmanship standards. Hardware or software not included in the build process. Non-adherence to specification, interface or statement-of-work requirements. First article data missing or incomplete."},
      {h:"Minor", b:"Non-systematic errors: typographical mistakes in production definition documentation, in process control records, or in workmanship standards documentation."}
    ],2),
    S("The line is systematic versus not systematic. It is not the number of instances found.",
      "One finding can be major. Fifty can be minor. Counting is not classifying."),
    P("The reason the line sits there is that classification is a statement about the **mechanism**, not about the damage. A single instance produced by a broken mechanism will produce more instances, and every one of them is still to come. Fifty instances produced by fifty independent slips are fifty slips \u2014 annoying, worth correcting, not evidence that the process is out of control."),
    C("The two errors this produces",[
      "**Counting up to major.** A reviewer finds eleven typographical errors and classifies the finding as major because eleven feels serious. If each is an independent transcription slip, the mechanism is intact and the classification is wrong \u2014 and now the programme is treating a proofreading problem as a process breakdown.",
      "**Counting down to minor.** A reviewer finds one instance of hardware installed that never entered the build process and classifies it as minor because it is one. That mechanism produced this instance and can produce others, and nobody yet knows how many it already has."
    ]),
    P("When you cannot tell which you are looking at, the question to ask is not how many, but: what would have had to work for this not to happen, and is that thing working?")
  ], check:{
    q:"An audit finds a single instance of an assembly step performed without an approved work instruction, traced to a documented gap in how new steps are released to the floor. Separately it finds fourteen typographical errors across a set of drawings, each an independent transcription slip. How are these classified?",
    o:["Both major, because both concern production definition documentation",
       "The single instance is major because the mechanism is systematic; the fourteen are minor because they are not",
       "The single instance is minor because it is one instance; the fourteen are major because of their number",
       "Both minor, because neither affected the delivered hardware's performance"],
    a:1,
    why:"The third option is the intuitive one and it is exactly backwards: it classifies by count when the line is drawn at mechanism. A documented gap in how instructions reach the floor will produce more instances, so one is enough. Fourteen independent slips are fourteen slips. Performance impact is not the classification test either, which is what makes the last option tempting."
  }},

  {id:"A3-03", title:"Worked examples \u2014 classifying findings", body:[
    P("Classification is learned from cases. Cover the verdict column and work each one before reading across."),
    TABLE(["Finding","Classification","Reasoning"],[
      ["A single connector installed on the audit unit is not on the approved parts selection list. It was substituted by a technician during a shortage, with a supervisor's verbal agreement.","Major","Hardware installed that did not go through the build process as approved. The mechanism \u2014 informal substitution under shortage pressure with verbal approval \u2014 is available to every technician on every shortage, so one instance describes a route, not an accident."],
      ["Nineteen drawings in a sampled set carry a misspelled material name in a note. The correct specification number is cited beside it in every case.","Minor","Non-systematic transcription errors in production definition documentation. Nineteen instances feel like a pattern, but nothing is misdirected: the governing reference is correct throughout. Correct them and move on."],
      ["Manufacturing instructions for one part reflect a superseded drawing revision. Investigation shows approved changes are not consistently reaching the release process.","Major","The instruction error is the symptom. The finding is the break between change approval and release, which is a systematic breakdown of process control, and every part released through that path is in question."],
      ["First article inspection data for a newly sourced detail part is incomplete: three dimensions were not recorded.","Major","First article data missing or incomplete is named as major on its own. The first article is the evidence that a new source can make the part at all; incomplete evidence for a new source is exactly the situation the classification exists for."],
      ["A drawing note references an internal procedure number that was renumbered last year. The procedure content is unchanged and the correct one is found immediately.","Minor","A stale reference with no effect on what gets built, and no evidence that references are systematically going stale. If the audit found that half the sampled drawings carried stale references, the verdict would change \u2014 not because of the count, but because that would evidence a mechanism."],
      ["An interface requirement in the statement of work is not reflected in the item's specification. The item was built to the specification.","Major","Non-adherence to statement-of-work and interface requirements. The item conforms to a document that does not conform to what was required, which is a failure that no amount of downstream conformance detects."]
    ]),
    C("Two of these are counter-intuitive on purpose",[
      "The connector is **one instance and major.** The mechanism is what classified it.",
      "The nineteen drawings are **nineteen instances and minor.** The count did not classify them either.",
      "If you disagreed with either, re-read the reasoning column and check which question you were answering: how bad does it look, or what mechanism produced it."
    ],"teal")
  ], check:{
    q:"An audit finds that one sampled drawing references a superseded revision of an interface document. The audit team asks how changes reach drawings and learns that the propagation step depends on an engineer noticing an email. No other stale reference is found in the sample. How is this classified, and why?",
    o:["Minor \u2014 a single stale reference found in a whole sample, with no pattern",
       "Major \u2014 the mechanism that carries changes onto drawings depends on someone noticing, which is a systematic weakness in process control, and the sample size is not what settles it",
       "Minor now, becoming major if a second instance is found later",
       "It cannot be classified until the sample is extended to establish the rate"],
    a:1,
    why:"A rate of one in a sample genuinely looks minor, and that is the trap: the classification follows the mechanism, and the mechanism here is a propagation step with no control on it. Waiting to extend the sample sounds rigorous but postpones a judgement already available \u2014 the audit team learned how changes reach drawings, and that answer is the finding."
  }},

  {id:"A3-04", title:"The minutes", body:[
    P("The minutes are the audit. Everything else \u2014 the days of examination, the arguments, the agreements \u2014 exists afterwards only in the form the minutes gave it."),
    P("Required content:"),
    L([
      "**The audited item**, identified.",
      "**Decisions and proceedings.**",
      "**Attendees.**",
      "**Action items.**",
      "**The complete list of documents, with the revision level each carried at the time of the audit.**",
      "**The complete list of specification requirements audited.**",
      "**Identification of everything examined** \u2014 documentation and physical products \u2014 by name, specification number, product identifiers, serial numbers, drawing and part numbers, and enterprise code."
    ]),
    P("Two of those items are more demanding than they read. The **complete list of specification requirements audited** is what lets a reader tell the difference between a full walk and a sample \u2014 and, where it was a sample, exactly which requirements were in it. The **identification of everything examined** goes down to serial numbers, drawing and part numbers and enterprise code, because \u201cthe unit\u201d is not an identification: the whole value of the physical audit is that it examined one specific article, and a record that does not say which article discards that value."),
    C("The revision levels are the part that decays",[
      "A minute recording that the drawing set was reviewed tells a reader almost nothing two years later, because the drawing set has moved.",
      "A minute recording which revision each document carried on the day tells them exactly what was examined, and lets them determine what has changed since.",
      "**Without revision levels, the minutes describe an event. With them, they describe a configuration.**"
    ]),
    P("On timing: daily minutes are available for joint review at the start of the next session, the overall minutes are available to the Acquirer before the audit team departs, and the finalised minutes are published and delivered no later than sixty days from audit completion, or per contract."),
    S("Minutes without revision levels record that an audit happened. Minutes with them record what it found.",
      "It is the difference between an event and evidence.")
  ], check:{
    q:"A set of audit minutes lists every document reviewed by title and number, records the attendees and the action items, and states that the documentation was found acceptable. Two years later a query arises about what was examined. What is missing, and what is the consequence?",
    o:["Nothing is missing \u2014 titles and numbers identify the documents examined",
       "The revision level each document carried at the time of the audit; without it, nobody can tell whether what is in the system now is what was examined then",
       "The complete list of requirements audited, which is optional but useful",
       "The serial numbers of the examined hardware, which are recorded separately in status accounting"],
    a:1,
    why:"Titles and numbers identify the documents, which is why the first option is tempting \u2014 but documents move, and an identifier alone points at whatever the current revision happens to be. The list of requirements audited and the identification of examined hardware are both required content, not optional and not delegated elsewhere; but the specific defect here is that the record cannot be tied to a configuration."
  }},

  {id:"A3-05", title:"Closure, certification and disposition", body:[
    P("An audit does not finish when everyone goes home. It finishes through a defined sequence, and three separate parties act in it."),
    STEPS([
      {h:"Action items tracked to closure",b:"Every finding is tracked, and the corrective action documentation is delivered to the Acquirer for review. Closure is evidenced, not asserted."},
      {h:"The summary report",b:"A consolidated report reflecting all action items and discrepancy information from the audit. The detailed final report is issued **after the Acquirer has verified the completed items** \u2014 so the final report describes verified closure rather than claimed closure."},
      {h:"Joint certification",b:"Signed jointly: the Supplier's audit lead and programme manager, and the Acquirer's representatives. Results are recorded as **complete and successful** where nothing is open, or **conditional** where the resolutions are agreed but tasks remain."},
      {h:"Acquirer disposition",b:"The Acquirer dispositions the audit as **approval** where all findings are satisfactorily completed, **contingent approval** pending completion of action items, or **disapproval** where the audit was seriously inadequate."},
      {h:"Status accounting",b:"Scheduled and actual audit dates, accomplishments and results are recorded per item in the status accounting system."}
    ],"tl"),
    P("Notice the asymmetry in the reporting. The consolidated summary can be issued on the strength of what the audit found; the detailed final report waits for the Acquirer to verify that the completed items really are complete. Closure is a claim made by the party that owed the action and confirmed by the party that raised it \u2014 which is why corrective action documentation is delivered rather than filed internally."),
    P("Where re-accomplishment of any inspection, test or audit activity is needed, the Acquirer or a designated representative is invited to witness it. Re-accomplishment under observation is not a mark of distrust; it is the same standard the original activity was held to, applied again."),
    P("Then the baseline point, which people get wrong constantly: **the product baseline is established after successful completion of the physical audit and approval of the product specification.** Not on the last day of the audit. Not when the audit team certifies. The audit is a necessary condition and the Acquirer performs the establishing act."),
    S("Complete and successful means nothing is open. Conditional means the resolutions are agreed and the work is not done.",
      "Those are two different statements about the same audit, and only one of them can be true.")
  ], check:{
    q:"An audit closes with four action items open, all with agreed closure plans, owners and suspense dates. The programme wants the audit certified complete and successful so that the product baseline can be established, arguing that the plans are agreed and closure is a formality. What is available?",
    o:["Certification as complete and successful, since every open item has an agreed plan",
       "Certification as conditional \u2014 resolutions agreed, tasks not yet complete \u2014 with the Acquirer's disposition and the product baseline following from what is actually closed",
       "No certification at all until all four items are closed",
       "Certification as complete and successful, with the four items transferred to the next audit"],
    a:1,
    why:"Agreed plans are real progress, and that is why this argument gets made \u2014 but complete and successful is a statement that nothing is open, and four things are open. Conditional certification exists precisely for this situation, so refusing to certify at all overstates it. Transferring open items to a later audit does not close them; it moves them where they are harder to see."
  }},

  {id:"A3-06", title:"Ceremony and substance", body:[
    P("Not every audit is chaired by the Acquirer. Where an audit is initiated internally \u2014 because risk-based designation, not the contract, put the item on the list \u2014 the **ceremony** may be simplified: an internal co-chair, and internal certification in lieu of Acquirer participation."),
    P("The **substance** is performed in full. Specifically: the requirements-to-test reconciliation and its traceability matrix; the as-built examination including verification that the proper parts are installed; the identification and certification of differences between the production unit and the functional audit unit; and the documented non-compliances."),
    P("The distinction generalises, and it is one of the most useful judgements in this training."),
    CARDS([
      {h:"Ceremony", b:"Who chairs. Who signs. How formal the setting is. Whether a record is a form or a section of the minutes. How a sample is drawn rather than checking exhaustively where sampling is agreed. These can be proportionate to the situation."},
      {h:"Substance", b:"Whether the comparison is actually made. Whether the article is actually examined. Whether the non-compliance is actually written down and provided. These do not scale with formality, because they are the audit."}
    ],2),
    S("Removing a verification because an automated system is asserted to prevent the failure is substance \u2014 that verification exists to test the assertion.",
      "The tool being trustworthy is the hypothesis, not the evidence."),
    P("A working test, when you are unsure which side of the line a proposal falls on: **if this is removed, does anyone still find out?** Simplifying who signs a certificate changes nothing about what would be discovered. Simplifying the form a finding is recorded on changes nothing about whether it is recorded. Removing the examination, the reconciliation or the documented non-compliance changes exactly one thing \u2014 whether the organisation learns what is true."),
    C("The argument you will hear, and the answer",[
      "\u201cOur toolchain enforces requirement-to-test linkage automatically, so the reconciliation is redundant.\u201d",
      "The reconciliation is how anyone finds out whether the toolchain does what it is believed to do. Every automated control has a configuration, and a control configured wrongly enforces nothing while reporting success.",
      "A proportionate response is to sample the reconciliation rather than walk every requirement, where sampling is agreed \u2014 that is ceremony. Removing it is not."
    ])
  ], check:{
    q:"An internally initiated physical audit is planned. The supplier proposes two simplifications: an internal co-chair and internal certification instead of Acquirer participation, and sampling the as-built examination rather than examining the unit, because their automated build-verification system would have flagged any discrepancy. Which is acceptable?",
    o:["Both \u2014 an internally initiated audit may be tailored",
       "The first only. The internal chair and certification are ceremony; removing the physical examination because a system is asserted to prevent the failure is substance, and that examination exists to test the assertion",
       "The second only. Chairing arrangements are fixed, while examination methods are at the auditor's discretion",
       "Neither \u2014 an internally initiated audit is conducted identically to an Acquirer-chaired one in every respect"],
    a:1,
    why:"The two proposals arrive together and sound like one request for proportionality, which is the difficulty. Who chairs and who signs are arrangements around the audit. Whether the article is examined is the audit. The last option overcorrects: the ceremony genuinely may be simplified, and pretending otherwise makes the distinction impossible to teach or to hold."
  }},

  {id:"A3-07", title:"Work types: how a supplier's audit role is decided", body:[
    P("When an item is designated for audit and a supplier builds it, designs it, or writes its software, somebody has to say what that supplier is obliged to do. That obligation is not negotiated case by case. It is read off the **type of work** the supplier performs."),
    P("Work type is settled by two questions, asked in this order:"),
    STEPS([
      {h:"Who holds design authority for the item?",b:"Your company, the supplier, or a vendor. This decides whether the supplier can change the design at all, and therefore whether they can be the activity that verifies it against requirements."},
      {h:"Who performs the build?",b:"Your company, the supplier, or nobody \u2014 because some procurements deliver a design or a process rather than an article. This decides whether there is anything at the supplier for a physical examination to examine."}
    ]),
    P("Those two answers produce the work type, and the work type produces the audit role."),
    TABLE(["Type of work","Design authority / build","Audit role when the item is designated"],[
      ["Build-to-print","Your company designs; the supplier builds to the released data package","Supports the physical audit on its build: facility access, as-built records, approved-parts evidence, and the manufacturing instructions actually used"],
      ["Design and build under a source control drawing","Supplier designs the internals, your company controls form, fit, function, interface and qualification; supplier builds","Conducts the item-level functional and physical audits at its own facility, substance in full"],
      ["Design agent","Supplier develops the design; your company builds. The deliverable is the data package","Data support: the technical data package and traceability matrix inputs. No physical examination role, because the build is not theirs"],
      ["Full item development to specification","Supplier holds design authority at its level and builds","Conducts the item-level functional and physical audits at its own facility, substance in full. The heaviest flowdown of any type"],
      ["Software or firmware development","Supplier develops deliverable software or embedded code","Conducts the software functional audit, and the witnessed build and installation verification against the version description"],
      ["Commercial or catalogue item","Vendor holds the design; your company controls selection","Generally none. Version and media documentation and change or discontinuance notice still apply"],
      ["Repair and overhaul","Supplier maintains fielded configuration","Generally none, though the as-maintained records support audits of the parent item"],
      ["Special process services","Process-only work; no item design","None. Process change notification still applies"]
    ]),
    P("Two rules govern the edges of that table, and both are routinely missed."),
    L([
      "**Mixed work takes the most demanding role, per obligation.** A supplier who designs and builds a unit under a source control drawing *and* writes its embedded firmware holds two types. They conduct the item-level audits **and** the software functional audit **and** the witnessed build. You do not pick the dominant type and apply it.",
      "**No audit role never means no verification.** Reconciliation reports per delivery, part traceability records, first article inspection, status accounting and identification and marking all flow by work type regardless of whether any item is ever designated. A supplier with no audit role is still producing the reconciliation output that audits elsewhere sample."
    ]),
    S("The item's designation decides whether a supplier audit happens. The work type decides only what that supplier's part of it is.",
      "Two different questions. Answering the first with the second is how a designated item ends up with no supplier obligation attached to it.")
  ], check:{
    q:"A supplier designs and builds a pump under your source control drawing and also writes its embedded firmware. Your procurement lead classifies the engagement by its dominant activity \u2014 design and build \u2014 and sets the audit obligations from that alone. What has been lost?",
    o:["Nothing \u2014 design and build is the more demanding of the two types, so it covers the software work",
       "The software obligations: mixed work takes the most demanding role per obligation, so the software functional audit and the witnessed build and installation verification apply in addition to the item-level audits",
       "Nothing, provided the firmware is delivered inside the pump rather than separately",
       "The physical audit obligation, which does not apply to suppliers writing software"],
    a:1,
    why:"Design and build genuinely is the heavier engagement overall, which is what makes dominant-type classification feel reasonable. But the rule is applied obligation by obligation, not engagement by engagement: nothing in the design-and-build role produces a witnessed rebuild against a version description. Where the firmware physically sits makes no difference to who is obliged to verify it."
  }},

  {id:"A3-08", title:"When a supplier audit becomes due", body:[
    P("Audit obligations attach to the designation of the item. They do not attach to a category of supplier, and they do not attach at a fixed moment. There are two ways they arrive."),
    CARDS([
      {h:"Designated at award", b:"The item is already designated when the work is placed. The audit requirements are imposed unconditionally in the statement of work and the audit deliverables are scheduled like any other deliverable."},
      {h:"Designated later", b:"The item is not designated at award and becomes designated afterwards. This is the common case, and it is the one that goes wrong."}
    ],2),
    P("It goes wrong for a specific reason: **awarding the work is itself a designation trigger.** A new or changed sub-tier supplier for an item or its critical components is one of the risk factors. Placing a subcontract can therefore create the designation that imposes audit obligations on that same subcontract \u2014 obligations that did not exist when the statement of work was written a fortnight earlier."),
    S("Deciding audit applicability once, at proposal time, converts every later designation into a contract change negotiated from the weakest position you will ever hold.",
      "The supplier has the work, you need the obligation, and price discovery happens at that moment."),
    P("The answer is a **standing conditional audit clause**: every statement of work for an item where designation is possible carries conduct or support obligations that take effect if and when the item is or becomes designated, with the audit deliverables named as triggered items. It costs nothing to carry and it removes the negotiation entirely."),
    P("Beyond award, the assessment is re-run for the items a supplier builds on any of these:"),
    L([
      "A change of source, process, facility or tooling at that supplier.",
      "A safety-relevant escape traceable to their work.",
      "A reconciliation miss your company discovers in what they delivered.",
      "An adverse configuration audit result.",
      "A determination that the supplier's configuration management is ineffective \u2014 ineffectiveness and escape history are themselves designation factors for the items they build."
    ]),
    P("When designation does arrive, what becomes due depends on the role. A supplier who **conducts** owes the audit plan and agenda, the data package scoped to their audits, the minutes including the traceability matrix, and the finding records tracked to closure \u2014 minutes within sixty days as anywhere else. A supplier who **supports** owes facility access, as-built records, approved-parts evidence and the manufacturing instructions actually used on the build."),
    C("One rule about how these are written",[
      "**A requirement cited without its deliverable is unenforceable at receipt and unverifiable at audit.** \u201cSupport configuration audits as required\u201d obliges nobody to produce anything on any date.",
      "Every audit obligation is cited with the thing that evidences it and the event that triggers it. That is what makes the conditional clause work rather than merely exist."
    ])
  ], check:{
    q:"A statement of work is being written for a machined housing. The item is not designated for audit today, and the supplier is new to your company. The procurement lead proposes to leave audit requirements out and add them by contract change if designation ever happens. How do you answer?",
    o:["Agree \u2014 imposing audit obligations on an undesignated item is unnecessary cost",
       "The statement of work carries a standing conditional audit clause, because a new sub-tier source is itself a designation trigger \u2014 this award may create the designation, and adding the obligation afterwards is negotiated from the weakest position",
       "Agree, provided the classification log records that audit applicability was considered",
       "Impose the audit obligations unconditionally now, since designation is likely"],
    a:1,
    why:"Recording that the question was considered is genuinely good practice and is why the third option is tempting \u2014 but a record of a decision is not an obligation on the supplier. Imposing unconditionally overshoots: the obligations should attach to designation, not to a guess about it. The conditional clause costs nothing while the item stays undesignated and works instantly if that changes, including if this award is what changes it."
  }},

  {id:"A3-09", title:"Worked examples \u2014 supplier roles and triggers", body:[
    P("Six procurements on one programme. Decide the work type, the role and the trigger position for each before reading across."),
    TABLE(["Procurement","Role if the item is designated","Trigger position"],[
      ["Machine shop building housings to your released drawings","Supports the physical audit on its build","New source. The award itself is a designation trigger for the parent item, so the statement of work carries the conditional clause even though nothing is designated today"],
      ["Supplier designing and building a valve under your source control drawing, including its firmware","Conducts the item-level functional and physical audits, plus the software functional audit and the witnessed build","Mixed work. Both roles apply. If designated at award, the obligations are unconditional and the deliverables scheduled"],
      ["Design house producing the data package for a fitting your company manufactures","Data support: data package and traceability matrix inputs","No build at the supplier, so no physical examination role. Their traceability matrix inputs still feed your functional audit, and their release discipline is the product"],
      ["Catalogue power supply bought to a vendor item control drawing","Generally none","Change or discontinuance notice still applies, and a vendor change to the item is a trigger to reassess the parent"],
      ["Plating house anodising to your process specification","None","Process change notification applies. A process change at this supplier is a designation trigger for every item that goes through it \u2014 which is usually more items than the buyer realises"],
      ["Repair station overhauling fielded units","Generally none","As-maintained records support audits of the parent item; retrofit incorporation and consumed life have to survive the overhaul"]
    ]),
    C("\u201cWe are only build-to-print, so audits do not apply to us.\u201d",[
      "Half right, and the half that is wrong is expensive. Build-to-print suppliers never *conduct* an audit. They do support the physical audit on their build, and support means unencumbered access to their floor, their as-built records, their evidence that the installed parts are the approved parts, and the manufacturing instructions their people actually used.",
      "A supplier discovering that obligation on the day, from a statement of work that never mentioned it, is entitled to be unhappy about it."
    ]),
    C("\u201cThe item was not designated, so we did not cite audit obligations.\u201d",[
      "This is the failure the conditional clause exists to prevent, and it usually surfaces the moment a source change or an escape re-runs the assessment.",
      "Ask the second question too: were the reconciliation report, the part traceability record and the first article requirements cited? Those flow by work type regardless of designation, and a statement of work missing audit obligations is often missing those as well \u2014 which leaves nothing for an audit to sample even if one is later held.",
      "**No audit designation is not the same statement as no verification flowdown.**"
    ],"teal")
  ], check:{
    q:"Your company changes the anodising process specification used by a plating house that has no audit role of any kind. What follows for audit designation?",
    o:["Nothing \u2014 the plating house has no audit role, so no audit consequence arises",
       "The process change is a designation trigger for the items that go through that process, so their assessments are re-run \u2014 the supplier's own lack of an audit role is irrelevant to that",
       "The plating house must now support the physical audit on the parts it processes",
       "Only items already designated need reassessment, to see whether their scope should expand"],
    a:1,
    why:"The supplier having no audit role is true and is exactly the distraction: roles attach to suppliers, triggers attach to items. A changed process is a changed process for every item that passes through it. The last option is the near-miss \u2014 reassessment is not restricted to items already designated, since the whole point of a trigger is that it can designate something that was not."
  }},

  {id:"A3-10", title:"Running the audit at a supplier's facility", body:[
    P("Where a supplier conducts the audit, the audit happens at their site, on their floor, with their people. Your company does not become a spectator."),
    L([
      "**Participate in planning, not just conduct.** Suppliers whose items are being audited prepare audit plans identifying their own requirements and responsibilities, and those plans are agreed rather than received.",
      "**Share the preparation tracker as the joint punch list.** One list with providers and dates across two organisations, rather than two lists that meet on the audit date.",
      "**Unencumbered access applies at their facility too**, and it is arranged through the subcontract rather than requested at the gate. Access that was never bought is access that can be declined.",
      "**Their people must be able to discuss technical detail.** A supplier who fields presenters reading slides has not met the obligation, however good the slides are.",
      "**Recursion downward.** Their own sub-tiers receive the requirements too, and their product data comes back with traceability to the next higher assembly."
    ]),
    P("Where the audit is initiated internally rather than chaired by the Acquirer, the ceremony may be simplified at the supplier exactly as it may at your own facility \u2014 internal co-chair, internal certification. The substance is performed in full: the requirements-to-test reconciliation and its traceability matrix, the as-built examination with approved-parts verification, the unit-difference certification, and the documented non-compliances."),
    P("Then the part people forget: **what comes back, and what you do with it.** The plan and agenda, the data package scoped to their role, the minutes with the traceability matrix, the finding records with closure evidence. Check the receipt against what was actually cited in the statement of work \u2014 not against what you assumed it said."),
    S("Findings from a supplier's audit are evidence about that supplier's configuration management, not only about the item they built.",
      "They feed the effectiveness determination, and they re-run the designation assessment for everything else that supplier builds for you."),
    C("The loop, closed",[
      "An adverse audit result is a trigger for an effectiveness determination. A determination of ineffectiveness is a designation factor for the supplier's other items. Those items are reassessed, and some of them will now designate.",
      "That is the mechanism working as intended: one audit at one supplier changes what gets audited across their whole scope of supply, without anybody having to argue about it from scratch."
    ])
  ], check:{
    q:"A supplier conducts the physical audit on their designated item. Findings include a systematic break between change approval and the release of manufacturing instructions. The item's findings are closed and certified. That supplier builds four other items for you, none designated. What follows?",
    o:["Nothing further \u2014 the findings were closed and certified on the item they were raised against",
       "The adverse result triggers an effectiveness determination, and supplier ineffectiveness and escape history are designation factors, so the assessments for the other four items are re-run",
       "The other four items are designated automatically, since the finding was systematic",
       "The other four are monitored, but reassessment waits for the next configuration management plan revision"],
    a:1,
    why:"Closing the findings correctly on the audited item is necessary and is what makes the first answer feel complete. But a systematic finding is a measurement of that supplier's process, and the process is the same one building the other four. Reassessment is not automatic designation \u2014 it re-runs the assessment, which may or may not designate \u2014 and it does not wait for the next plan revision, because an adverse audit result is a trigger in its own right."
  }},

  {id:"A3-11", title:"The record set, and what a good audit changes", body:[
    P("Eight records come out of an audit programme. Learning them gives you a filing system for everything in this training."),
    TABLE(["Record","What it carries"],[
      ["Designation assessments","For every item evaluated, designated or not, with rationale and signatures. Retained for the life of the programme."],
      ["Audit plan and agenda","As approved by the Acquirer."],
      ["Data package index","An inventory of every artifact assembled, **with its revision at the time of the audit.**"],
      ["Audit minutes","The required content, including the traceability and test matrix for the functional audit. Delivered within sixty days of completion or per contract."],
      ["Finding records","Each with its classification, closure plan, responsible party, suspense date and closure evidence."],
      ["Summary and final reports","The consolidated summary, and the detailed final report issued after the Acquirer verifies completed items."],
      ["Certification forms","Joint certifications for each audit, and the baseline certifications."],
      ["Status accounting entries","Scheduled and actual dates, results per item, and the product baseline establishment entry."]
    ]),
    P("Now the part that outlives the audit."),
    P("Audit findings are evidence about the **configuration management process**, not only about the item. A finding that manufacturing instructions lag approved changes is not a fact about one part; it is a measurement of how change propagation performs on that line. A finding that a build cannot be reproduced is not a fact about one software release; it is a measurement of how the toolchain is controlled."),
    S("A systematic finding should change how the process runs. Repeat findings across audit cycles are the signal that it did not.",
      "The second audit that finds the first audit's problem is telling you about the organisation, not the item."),
    C("What to do with a finding once it is closed",[
      "Ask what the finding measured. Then ask whether that measurement should have shown up somewhere before an audit found it \u2014 in reconciliation health, in escape history, in a designation assessment.",
      "If the answer is that nothing would have shown it, the process has a blind spot and the finding just mapped it.",
      "**That is what a good audit changes.** Anything less and the audit was an inspection of one unit that happened to be expensive."
    ],"teal")
  ], check:{
    q:"A physical audit finds that manufacturing instructions for three parts lag approved changes. The findings are closed correctly: instructions corrected, closure evidenced, certification completed. Two years later the next audit on the same line finds the same pattern on different parts. What does the second audit tell you?",
    o:["That the first audit's findings were closed incorrectly",
       "That the finding was treated as a fact about those three parts rather than as a measurement of how change propagation performs on that line \u2014 the mechanism was never changed",
       "That the sampling in the first audit was too narrow to find the full extent",
       "That the line requires more frequent audits"],
    a:1,
    why:"The first audit's items really were closed correctly, which is what makes this uncomfortable: nothing was done wrong in the closure. What was missed is that a systematic finding is a measurement of a process, and correcting the three instances left the propagation mechanism exactly as it was. More frequent audits would find it again more often, which is detection, not correction."
  }}

 exercises:[

  {id:"A3-E1", title:"Exercise 1 \u2014 Classifying a mixed set",

  {id:"A3-E2", title:"Exercise 2 \u2014 May this audit be certified?",

  {id:"A3-E3", title:"Exercise 3 \u2014 Ceremony, substance and a persuasive supplier",

  {id:"A3-E4", title:"Exercise 4 \u2014 A record set that will not survive",

  {id:"A3-E5", title:"Exercise 5 \u2014 Audit roles across a supply chain",
   scen:"Four suppliers hold work on a designated item or its components. A machine shop builds a housing to your released drawing package. A supplier designs and builds a valve assembly under your source control drawing, including its embedded firmware. An engineering firm produced the technical data package for a structural fitting that your company manufactures. A plating house anodises parts to your process specification. The parent item has just been designated for both audits, and one of the four subcontracts was placed only last month.",

/* ==========================================================================
   STATE
   ========================================================================== */
var STATE = { name:"", started:new Date().toISOString(), checks:{}, answers:{}, seen:{} };
var VIEW = { page:"start" };          // "start" | "s:<id>" | "x:<modId>" | "submit"
var PAGES = [];                        // flat ordered page list
var AUTOSAVE = false;

(function buildPages(){
  PAGES.push({k:"start", id:"START", nm:"Start here", grp:null});
  for(var i=0;i<MODULES.length;i++){
    var m=MODULES[i];
    for(var j=0;j<m.sections.length;j++){
      PAGES.push({k:"sect", id:m.sections[j].id, nm:m.sections[j].title, grp:m.id, mi:i, si:j});
    }
    PAGES.push({k:"ex", id:m.id+"-EX", nm:"Exercises", grp:m.id, mi:i});
  }
  PAGES.push({k:"submit", id:"RESULTS", nm:"Review and send", grp:null});
})();

/* ---- guarded browser storage: used only if the browser allows it ---- */
function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); return true; }catch(e){ return false; } }
(function detect(){ AUTOSAVE = lsSet("catrain_probe","1"); })();

function autosave(){
  if(!AUTOSAVE) return;
  lsSet("catrain_state", JSON.stringify(STATE));
}
function autoload(){
  if(!AUTOSAVE) return false;
  var raw = lsGet("catrain_state");
  if(!raw) return false;
  try{ var o=JSON.parse(raw); if(o && o.checks){ STATE=o; return true; } }catch(e){}
  return false;
}

/* ==========================================================================
   RENDERING HELPERS
   ========================================================================== */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
}
function block(b){
  if(b.t==="p") return "<p>"+fmt(b.x)+"</p>";
  if(b.t==="list") return "<ul class='pl'>"+b.x.map(function(i){return "<li>"+fmt(i)+"</li>";}).join("")+"</ul>";
  if(b.t==="callout") return "<div class='callout "+(b.tone==="teal"?"teal":"")+"'>"+
      (b.lab?"<div class='lab'>"+esc(b.lab)+"</div>":"")+
      b.x.map(function(i){return "<p>"+fmt(i)+"</p>";}).join("")+"</div>";
  if(b.t==="stmt") return "<div class='stmt'><b>"+fmt(b.x)+"</b>"+(b.sub?"<span>"+fmt(b.sub)+"</span>":"")+"</div>";
  if(b.t==="cards") return "<div class='cards c"+b.cols+"'>"+b.x.map(function(c){
      return "<div class='card'><h4>"+fmt(c.h)+"</h4><p>"+fmt(c.b)+"</p></div>";}).join("")+"</div>";
  if(b.t==="steps") return "<div class='steps'>"+b.x.map(function(s,i){
      return "<div class='step "+(b.tone||"")+"'><div class='n'>"+(i+1)+"</div><div class='tx'><b>"+fmt(s.h)+"</b><span>"+fmt(s.b)+"</span></div></div>";}).join("")+"</div>";
  if(b.t==="table"){
    var th="<tr>"+b.head.map(function(h){return "<th>"+esc(h)+"</th>";}).join("")+"</tr>";
    var tb=b.x.map(function(r){
      return "<tr>"+r.map(function(c,ci){
        var k = (ci===0 && String(c).length<=10) ? " class='k'" : "";
        return "<td"+k+">"+fmt(c)+"</td>";}).join("")+"</tr>";}).join("");
    return "<div class='tw'><table><thead>"+th+"</thead><tbody>"+tb+"</tbody></table></div>";
  }
  return "";
}
function pageIndex(){
  for(var i=0;i<PAGES.length;i++){
    var p=PAGES[i];
    if(VIEW.page==="start"&&p.k==="start") return i;
    if(VIEW.page==="submit"&&p.k==="submit") return i;
    if(VIEW.page==="s:"+p.id) return i;
    if(VIEW.page==="x:"+p.grp&&p.k==="ex") return i;
  }
  return 0;
}
function pageKey(p){
  if(p.k==="start") return "start";
  if(p.k==="submit") return "submit";
  if(p.k==="ex") return "x:"+p.grp;
  return "s:"+p.id;
}

/* ---- completion status ---- */
function sectStatus(id){
  if(STATE.checks[id]) return "done";
  if(STATE.seen[id]) return "work";
  return "";
}
function exStatus(modId){
  var m = mod(modId), total=0, filled=0;
  m.exercises.forEach(function(x){ x.parts.forEach(function(p){
    total++; var v=STATE.answers[x.id+"."+p.id]; if(v&&v.trim().length>0) filled++;
  });});
  if(filled===0) return "";
  return filled===total ? "done" : "work";
}
function mod(id){ for(var i=0;i<MODULES.length;i++) if(MODULES[i].id===id) return MODULES[i]; return null; }

function counts(){
  var totalChecks=0, answered=0, right=0;
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    totalChecks++;
    var c=STATE.checks[s.id];
    if(c){ answered++; if(c.first===true) right++; }
  });});
  var totalParts=0, filledParts=0;
  MODULES.forEach(function(m){ m.exercises.forEach(function(x){ x.parts.forEach(function(p){
    totalParts++; var v=STATE.answers[x.id+"."+p.id]; if(v&&v.trim().length>0) filledParts++;
  });});});
  return {totalChecks:totalChecks, answered:answered, right:right, totalParts:totalParts, filledParts:filledParts};
}

/* ==========================================================================
   RAIL
   ========================================================================== */
function drawRail(){
  var c=counts();
  var h="<div class='railhead'><h2>Section register</h2><p>"+c.answered+" of "+c.totalChecks+
        " sections released \u00b7 "+c.filledParts+" of "+c.totalParts+" exercise answers written</p></div>";
  h+="<div class='grp'>"+navBtn(PAGES[0])+"</div>";
  MODULES.forEach(function(m){
    h+="<div class='grp'><h3>"+esc(m.label)+" \u2014 "+esc(m.title)+"</h3>";
    PAGES.forEach(function(p){ if(p.grp===m.id) h+=navBtn(p); });
    h+="</div>";
  });
  h+="<div class='grp'>"+navBtn(PAGES[PAGES.length-1])+"</div>";
  document.getElementById("rail").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll("#rail .nav"), function(b){
    b.addEventListener("click", function(){ go(b.getAttribute("data-k")); });
  });
}
function navBtn(p){
  var st = p.k==="sect" ? sectStatus(p.id) : (p.k==="ex" ? exStatus(p.grp) : "");
  var cur = pageKey(p)===VIEW.page;
  return "<button class='nav' data-k='"+pageKey(p)+"' aria-current='"+(cur?"true":"false")+"'>"+
    "<span class='dot "+st+"'></span><span class='id'>"+esc(p.id)+"</span><span class='nm'>"+esc(p.nm)+"</span></button>";
}

/* ==========================================================================
   PAGE RENDERERS
   ========================================================================== */
function go(key){
  VIEW.page=key;
  var p=PAGES[pageIndex()];
  if(p.k==="sect") STATE.seen[p.id]=true;
  autosave(); draw();
  window.scrollTo({top:0,behavior:"auto"});
  document.getElementById("rail").classList.remove("open");
}
function draw(){
  drawRail();
  var i=pageIndex(), p=PAGES[i], st=document.getElementById("stage");
  if(p.k==="start") st.innerHTML=viewStart();
  else if(p.k==="submit") st.innerHTML=viewSubmit();
  else if(p.k==="ex") st.innerHTML=viewExercises(mod(p.grp));
  else st.innerHTML=viewSection(MODULES[p.mi], MODULES[p.mi].sections[p.si], p);
  st.className="stage fadein";
  st.innerHTML += pager(i);
  wire(i,p);
}
function pager(i){
  var prev=i>0?PAGES[i-1]:null, next=i<PAGES.length-1?PAGES[i+1]:null;
  return "<div class='pager'>"+
   (prev?"<button class='btn gh' data-nav='"+pageKey(prev)+"'>\u2190 "+esc(prev.nm)+"</button>":"<span></span>")+
   (next?"<button class='btn pri' data-nav='"+pageKey(next)+"'>"+esc(next.nm)+" \u2192</button>":"<span></span>")+
   "</div>";
}

function viewStart(){
  var nS=0,nE=0; MODULES.forEach(function(m){nS+=m.sections.length; nE+=m.exercises.length;});
  var words=["","one","two","three","four","five","six","seven","eight"];
  var nM=MODULES.length, mw=(words[nM]||String(nM));
  var save = AUTOSAVE
    ? "Your work is saved in this browser as you go. To move between machines, or to keep a copy, use <strong>Save progress</strong> in the header \u2014 it downloads a small file you can reopen with <strong>Resume</strong>."
    : "This browser is not storing your work automatically. Use <strong>Save progress</strong> in the header before you close the tab \u2014 it downloads a small file, and <strong>Resume</strong> loads it back.";
  var h="<div class='hero'>"+
    "<div class='kick'>Configuration audits \u00b7 "+esc(CONFIG.companyName)+"</div>"+
    "<h1>"+mw.charAt(0).toUpperCase()+mw.slice(1)+" modules, "+nS+" sections, "+nE+" exercises</h1>"+
    "<p>This training teaches the functional and physical configuration audit from nothing: what each audit asks, how an item earns one, how an audit is prepared and run, and how it is closed. Work the sections in order. Each ends with a question that checks the point it was making. The exercises at the end of each module are written, not multiple choice \u2014 they are what "+esc(CONFIG.trainerName)+" will actually read.</p></div>"+
    "<dl class='meta'>";
  MODULES.forEach(function(m){
    h+="<dt>"+esc(m.label)+"</dt><dd>"+esc(m.title)+" \u2014 "+esc(m.sub)+" "+
       m.sections.length+" sections, "+m.exercises.length+" exercises.</dd>";
  });
  h+="<dt>Who it is for</dt><dd>Anyone who will plan, prepare, support, attend or close a configuration audit \u2014 configuration management, engineering, quality, manufacturing, and anyone managing a supplier who will be audited. No prior audit experience is assumed.</dd>"+
     "<dt>Prerequisites</dt><dd>None. Later modules assume earlier ones.</dd>"+
     "<dt>Time</dt><dd>Allow around two hours per module, plus the exercises. Very few people do this in one sitting, and it is not designed to be.</dd></dl>"+
     "<div class='callout'><div class='lab'>How your work is kept</div><p>"+save+"</p>"+
     "<p><strong>Nothing is transmitted anywhere</strong> while you work. Your answers stay on this machine until you reach <strong>Review and send</strong> and choose, yourself, to download, copy or send them.</p></div>"+
     "<div class='callout teal'><div class='lab'>Where are the document numbers?</div>"+
     "<p>This training teaches the rules themselves rather than pointing you at documents. Where you see \u201cthe audit preparation tracker\u201d or \u201cthe designation assessment,\u201d your trainer will show you where the current versions live \u2014 titles and numbers change; the obligations do not.</p></div>"+
     "<p class='note'>Enter your name in the header before you begin \u2014 it goes on the record you send.</p>";
  return h;
}

function viewSection(m,s,p){
  var idx=m.sections.indexOf(s)+1;
  var st=sectStatus(s.id);
  var stl = st==="done" ? "Released" : (st==="work" ? "In work" : "Not started");
  var h="<div class='eyebrow'><span class='recid'>"+esc(s.id)+"</span>"+
        "<span class='status'>"+esc(m.label)+" \u00b7 section "+idx+" of "+m.sections.length+" \u00b7 "+stl+"</span></div>"+
        "<h1 class='sect'>"+esc(s.title)+"</h1><div class='hr'></div>";
  s.body.forEach(function(b){ h+=block(b); });
  h+=checkHtml(s);
  return h;
}
function checkHtml(s){
  var rec=STATE.checks[s.id];
  var locked=!!rec;
  var h="<div class='check' data-check='"+esc(s.id)+"'><div class='lab'>Check yourself</div><div class='q'>"+fmt(s.check.q)+"</div>";
  s.check.o.forEach(function(o,i){
    var cls="opt"+(locked?" locked":"");
    if(locked){
      if(i===s.check.a) cls+=" right";
      else if(rec.picks && rec.picks.indexOf(i)>=0) cls+=" wrong";
    }
    h+="<label class='"+cls+"'><input type='radio' name='ck_"+esc(s.id)+"' value='"+i+"'"+
       (locked?" disabled":"")+(rec&&rec.picks&&rec.picks.indexOf(i)>=0?" checked":"")+"> <span>"+fmt(o)+"</span></label>";
  });
  h+="<div class='btnrow' style='margin-top:12px;margin-bottom:0'>"+
     (locked?"":"<button class='btn pri' data-ckgo='"+esc(s.id)+"'>Check answer</button>")+"</div>";
  var fb="";
  if(locked){
    var ok = rec.first===true;
    fb="<div class='fb show "+(ok?"ok":"no")+"'><b>"+(ok?"Correct":"Not quite")+"</b>"+fmt(s.check.why)+"</div>";
  }else{
    fb="<div class='fb' data-fb='"+esc(s.id)+"'></div>";
  }
  return h+fb+"</div>";
}

function viewExercises(m){
  var h="<div class='eyebrow'><span class='recid'>"+esc(m.id)+"-EX</span><span class='status'>"+esc(m.label)+" \u00b7 written exercises</span></div>"+
    "<h1 class='sect'>Exercises \u2014 "+esc(m.title)+"</h1><div class='hr'></div>"+
    "<p>Write your reasoning, not just your conclusion \u2014 the reasoning is what is being assessed, and several of these have more than one defensible answer. Where a question turns on a fact you have not been given, <strong>say so, and say what you would ask for and whom you would ask.</strong> Recognising the missing fact is part of the exercise.</p>"+
    "<p class='note'>Answers save as you type. There is no word limit and no right length.</p>";
  m.exercises.forEach(function(x){
    h+="<div class='exwrap'><h4>"+esc(x.title)+"</h4><div class='scen'>"+fmt(x.scen)+"</div>";
    x.parts.forEach(function(pt){
      var key=x.id+"."+pt.id, v=STATE.answers[key]||"";
      h+="<div class='part'><label for='ta_"+esc(key)+"'>"+esc(pt.id)+".&nbsp; "+fmt(pt.q)+"</label>"+
         "<textarea id='ta_"+esc(key)+"' data-ans='"+esc(key)+"' rows='4' placeholder='Your answer'>"+esc(v)+"</textarea>"+
         "<div class='count' data-cnt='"+esc(key)+"'>"+wordCount(v)+"</div></div>";
    });
    h+="</div>";
  });
  return h;
}
function wordCount(v){
  var n=(v||"").trim(); n = n? n.split(/\s+/).length : 0;
  return n===0 ? "not started" : (n+" word"+(n===1?"":"s"));
}

function viewSubmit(){
  var c=counts();
  var pct = c.totalChecks ? Math.round(100*c.right/c.totalChecks) : 0;
  var gaps=[];
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    var r=STATE.checks[s.id];
    if(!r) gaps.push([s.id, s.title, "not attempted"]);
    else if(r.first!==true) gaps.push([s.id, s.title, "wrong on first attempt"]);
  });});
  var missing=[];
  MODULES.forEach(function(m){ m.exercises.forEach(function(x){ x.parts.forEach(function(pt){
    var v=STATE.answers[x.id+"."+pt.id];
    if(!v||!v.trim()) missing.push(x.id+"."+pt.id);
  });});});

  var h="<div class='eyebrow'><span class='recid'>RESULTS</span><span class='status'>Training record \u00b7 review and send</span></div>"+
    "<h1 class='sect'>Review and send</h1>"+
    "<p class='lede'>Check the record below, then send it to "+esc(CONFIG.trainerName)+". Nothing leaves this page until you choose one of the options.</p><div class='hr'></div>";

  if(!STATE.name || !STATE.name.trim()){
    h+="<div class='warn'>Add your name in the header before sending \u2014 the record needs to say whose it is.</div>";
  }
  if(missing.length){
    h+="<div class='warn'>"+missing.length+" exercise answer"+(missing.length===1?" is":"s are")+" still blank. You can send anyway, but "+esc(CONFIG.trainerName)+" will only see what you wrote.</div>";
  }

  h+="<div class='transmit'><div class='hd'><b>Training record</b><span>"+esc(recordNo())+"</span></div><div class='bd'>"+
     "<div class='scorebox'>"+
     "<div><div class='big'>"+c.right+" / "+c.totalChecks+"</div><div class='lab'>Section checks correct first time</div></div>"+
     "<div><div class='big'>"+pct+"%</div><div class='lab'>First-attempt score</div></div>"+
     "<div><div class='big'>"+c.filledParts+" / "+c.totalParts+"</div><div class='lab'>Exercise answers written</div></div>"+
     "</div>";
  if(gaps.length){
    h+="<div class='gaps'><p style='margin:14px 0 6px'><strong>Sections to revisit</strong> \u2014 these are what your trainer will focus the review session on:</p><ul class='pl'>"+
       gaps.map(function(g){return "<li><span style='font-family:var(--mono);font-size:12px'>"+esc(g[0])+"</span> &nbsp;"+esc(g[1])+" \u2014 "+esc(g[2])+"</li>";}).join("")+"</ul></div>";
  }else{
    h+="<p style='margin-top:14px'><strong>Every section check answered correctly on the first attempt.</strong></p>";
  }
  h+="</div></div>";

  h+="<h2 style='font-family:var(--serif);font-size:22px;margin:26px 0 10px'>Send it</h2>";
  h+="<div class='btnrow'>"+
     "<button class='btn pri' id='btnDownload'>Download the record</button>"+
     "<button class='btn' id='btnCopy'>Copy as text</button>"+
     (CONFIG.trainerEmail?"<button class='btn' id='btnMail'>Open an email to "+esc(CONFIG.trainerEmail)+"</button>":"")+
     (CONFIG.submitEndpoint?"<button class='btn' id='btnPost'>Send to trainer</button>":"")+
     "</div>";
  h+="<p class='note'><strong>Download the record</strong> gives you a single file to attach to an email \u2014 it opens in any browser and prints cleanly. "+
     "<strong>Copy as text</strong> puts everything on the clipboard for pasting into email or chat."+
     (CONFIG.trainerEmail?" <strong>Open an email</strong> starts a message with your answers in the body; long answers may be cut short by your mail program, so attach the downloaded file as well.":"")+"</p>";

  if(!CONFIG.trainerEmail && !CONFIG.submitEndpoint){
    h+="<div class='setup'><strong>Trainer setup not finished.</strong> No delivery address has been set, so the email option is hidden. "+
       "Open this file in a text editor, find <code>var CONFIG</code> near the top of the script, set <code>trainerEmail</code>, and save. "+
       "Everything else keeps working without it.</div>";
  }
  return h;
}
function recordNo(){
  var d=new Date();
  var pad=function(n){return n<10?"0"+n:""+n;};
  var initials=(STATE.name||"").trim().split(/\s+/).map(function(w){return w.charAt(0).toUpperCase();}).join("").slice(0,3)||"XXX";
  return "CAT-"+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"-"+initials;
}

/* ==========================================================================
   WIRING
   ========================================================================== */
function wire(i,p){
  Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"), function(b){
    b.addEventListener("click", function(){ go(b.getAttribute("data-nav")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ckgo]"), function(b){
    b.addEventListener("click", function(){ grade(b.getAttribute("data-ckgo")); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-ans]"), function(t){
    t.addEventListener("input", function(){
      var k=t.getAttribute("data-ans");
      STATE.answers[k]=t.value;
      var c=document.querySelector("[data-cnt='"+k+"']");
      if(c) c.textContent=wordCount(t.value);
      clearTimeout(window.__sv); window.__sv=setTimeout(function(){ autosave(); drawRail(); },400);
    });
  });
  var bd=document.getElementById("btnDownload"); if(bd) bd.addEventListener("click", downloadRecord);
  var bc=document.getElementById("btnCopy");     if(bc) bc.addEventListener("click", copyRecord);
  var bm=document.getElementById("btnMail");     if(bm) bm.addEventListener("click", mailRecord);
  var bp=document.getElementById("btnPost");     if(bp) bp.addEventListener("click", postRecord);
}

function grade(id){
  var sec=null;
  MODULES.forEach(function(m){ m.sections.forEach(function(s){ if(s.id===id) sec=s; }); });
  if(!sec) return;
  var picked=document.querySelector("input[name='ck_"+id+"']:checked");
  if(!picked){ toast("Choose an answer first."); return; }
  var v=parseInt(picked.value,10);
  STATE.checks[id]={ first:(v===sec.check.a), picks:[v], at:new Date().toISOString() };
  autosave(); draw();
  var el=document.querySelector("[data-check='"+id+"']");
  if(el) el.scrollIntoView({block:"center", behavior:"smooth"});
}

/* ==========================================================================
   SAVE / RESUME / SEND
   ========================================================================== */
function download(name, text, type){
  try{
    var b=new Blob([text],{type:type||"text/plain;charset=utf-8"});
    var u=URL.createObjectURL(b);
    var a=document.createElement("a");
    a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); },600);
    return true;
  }catch(e){ return false; }
}
function slug(){ return (STATE.name||"unnamed").trim().replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"") || "unnamed"; }

function saveProgress(){
  STATE.saved=new Date().toISOString();
  var ok=download("audit-training-progress-"+slug()+".json", JSON.stringify(STATE,null,2), "application/json");
  toast(ok ? "Progress file downloaded. Reopen it with Resume." : "This browser blocked the download. Use Copy as text on the Review and send page instead.");
}
function loadProgress(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o || !o.checks || !o.answers) throw new Error("shape");
      STATE=o; document.getElementById("who").value=STATE.name||"";
      autosave(); go("start");
      toast("Progress restored.");
    }catch(e){ toast("That file is not a training progress file. Look for audit-training-progress-….json"); }
  };
  r.onerror=function(){ toast("The file could not be read. Try selecting it again."); };
  r.readAsText(file);
}

function recordLines(){
  var c=counts(), out=[];
  out.push("CONFIGURATION AUDITS \u2014 TRAINING RECORD");
  out.push("Record: "+recordNo());
  out.push("Trainee: "+(STATE.name||"(name not entered)"));
  out.push("Company: "+CONFIG.companyName);
  out.push("Completed: "+new Date().toLocaleString());
  out.push("");
  out.push("SCORE");
  out.push("  Section checks correct first time: "+c.right+" of "+c.totalChecks+"  ("+(c.totalChecks?Math.round(100*c.right/c.totalChecks):0)+"%)");
  out.push("  Exercise answers written: "+c.filledParts+" of "+c.totalParts);
  out.push("");
  out.push("SECTIONS TO REVISIT");
  var any=false;
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    var r=STATE.checks[s.id];
    if(!r){ out.push("  "+s.id+"  "+s.title+" \u2014 not attempted"); any=true; }
    else if(r.first!==true){ out.push("  "+s.id+"  "+s.title+" \u2014 wrong on first attempt"); any=true; }
  });});
  if(!any) out.push("  None \u2014 every check correct on the first attempt.");
  MODULES.forEach(function(m){
    out.push(""); out.push("=".repeat(60));
    out.push(m.label.toUpperCase()+" \u2014 "+m.title.toUpperCase()+" \u2014 EXERCISE ANSWERS");
    out.push("=".repeat(60));
    m.exercises.forEach(function(x){
      out.push(""); out.push(x.title);
      out.push("Scenario: "+x.scen);
      x.parts.forEach(function(pt){
        var v=(STATE.answers[x.id+"."+pt.id]||"").trim();
        out.push("");
        out.push("  "+pt.id+") "+pt.q);
        out.push("     "+(v? v.split("\n").join("\n     ") : "(no answer written)"));
      });
    });
  });
  return out.join("\n");
}
function recordHtml(){
  var c=counts();
  var rows="";
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    var r=STATE.checks[s.id];
    var st = !r ? "Not attempted" : (r.first===true ? "Correct first time" : "Wrong first attempt");
    var cls = !r ? "na" : (r.first===true ? "ok" : "no");
    rows+="<tr class='"+cls+"'><td class='k'>"+esc(s.id)+"</td><td>"+esc(s.title)+"</td><td>"+st+"</td></tr>";
  });});
  var ex="";
  MODULES.forEach(function(m){
    ex+="<h2>"+esc(m.label)+" \u2014 "+esc(m.title)+"</h2>";
    m.exercises.forEach(function(x){
      ex+="<div class='ex'><h3>"+esc(x.title)+"</h3><p class='sc'>"+esc(x.scen)+"</p>";
      x.parts.forEach(function(pt){
        var v=(STATE.answers[x.id+"."+pt.id]||"").trim();
        ex+="<p class='q'>"+esc(pt.id)+") "+esc(pt.q)+"</p><div class='a"+(v?"":" empty")+"'>"+
            (v?esc(v).split("\n").join("<br>"):"No answer written")+"</div>";
      });
      ex+="</div>";
    });
  });
  return "<!DOCTYPE html><html><head><meta charset='utf-8'><title>Configuration audit training record \u2014 "+esc(STATE.name||"unnamed")+"</title>"+
   "<style>body{font-family:Georgia,serif;max-width:820px;margin:36px auto;padding:0 24px;color:#1E262E;line-height:1.55}"+
   "h1{font-size:26px;margin:0 0 4px}.sub{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#5C6D78;letter-spacing:.06em}"+
   "table.meta{width:auto;margin:18px 0 26px;font-size:14px}table.meta th{background:none;color:#5C6D78;font-family:ui-monospace,Consolas,monospace;font-size:11px;text-transform:uppercase;text-align:left;padding:3px 18px 3px 0;white-space:nowrap;font-weight:normal;vertical-align:top}table.meta td{border:0;padding:3px 0}"+
   "table{border-collapse:collapse;width:100%;font-size:13.5px;margin-bottom:26px}"+
   "th{background:#1E262E;color:#fff;text-align:left;padding:7px 10px;font-size:12px}"+
   "td{padding:6px 10px;border-top:1px solid #D6DCDF;vertical-align:top}td.k{font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:nowrap;width:88px}th.r{width:150px}"+
   "tr.no td{background:#F4E2E2}tr.na td{background:#F6ECD8}"+
   "h2{font-size:19px;border-bottom:2px solid #1E262E;padding-bottom:5px;margin:32px 0 14px}"+
   ".ex{margin-bottom:26px}.ex h3{font-size:16px;margin:0 0 6px}"+
   ".sc{background:#F4F6F7;padding:10px 13px;border-radius:4px;font-size:13.5px;margin:0 0 12px}"+
   ".q{font-weight:bold;font-size:14px;margin:12px 0 5px}"+
   ".a{font-family:-apple-system,Segoe UI,Arial,sans-serif;font-size:14px;background:#fff;border-left:3px solid #A8481F;padding:8px 13px;white-space:normal}"+
   ".a.empty{color:#8998A2;border-left-color:#D6DCDF;font-style:italic}"+
   "@media print{body{margin:0}.ex{page-break-inside:avoid}}</style></head><body>"+
   "<h1>Configuration audits \u2014 training record</h1>"+
   "<div class='sub'>"+esc(recordNo())+"</div>"+
   "<table class='meta'><tr><th>Trainee</th><td>"+esc(STATE.name||"(name not entered)")+"</td></tr>"+
   "<tr><th>Company</th><td>"+esc(CONFIG.companyName)+"</td></tr>"+
   "<tr><th>Completed</th><td>"+esc(new Date().toLocaleString())+"</td></tr>"+
   "<tr><th>Checks</th><td>"+c.right+" of "+c.totalChecks+" correct on the first attempt ("+(c.totalChecks?Math.round(100*c.right/c.totalChecks):0)+"%)</td></tr>"+
   "<tr><th>Exercises</th><td>"+c.filledParts+" of "+c.totalParts+" answers written</td></tr></table>"+
   "<h2>Section checks</h2><table><colgroup><col style='width:88px'><col><col style='width:150px'></colgroup><thead><tr><th>Section</th><th>Title</th><th class='r'>Result</th></tr></thead><tbody>"+rows+"</tbody></table>"+
   ex+"</body></html>";
}
function downloadRecord(){
  var ok=download("audit-training-record-"+slug()+".html", recordHtml(), "text/html;charset=utf-8");
  toast(ok ? "Record downloaded. Attach it to an email to "+CONFIG.trainerName+"." : "This browser blocked the download. Use Copy as text instead.");
}
function copyRecord(){
  var txt=recordLines();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast("Record copied. Paste it into an email or chat."); },
      function(){ fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  var t=document.createElement("textarea");
  t.value=txt; t.style.position="fixed"; t.style.opacity="0";
  document.body.appendChild(t); t.select();
  var ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  document.body.removeChild(t);
  toast(ok ? "Record copied. Paste it into an email or chat." : "Copying is blocked here. Use Download the record instead.");
}
function mailRecord(){
  var subj="Configuration audit training record \u2014 "+(STATE.name||"unnamed")+" \u2014 "+recordNo();
  var body=recordLines();
  var url="mailto:"+encodeURIComponent(CONFIG.trainerEmail)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
  if(url.length>1900){
    var c=counts();
    var shortBody="Configuration audits \u2014 training record\n"+recordNo()+
      "\nTrainee: "+(STATE.name||"(name not entered)")+
      "\nChecks: "+c.right+" of "+c.totalChecks+" correct first time"+
      "\nExercises: "+c.filledParts+" of "+c.totalParts+" answers written"+
      "\n\nThe full record, including all written answers, is attached.\n(If it is not attached yet: go back to the training, choose Download the record, and attach the file.)";
    url="mailto:"+encodeURIComponent(CONFIG.trainerEmail)+"?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(shortBody);
    downloadRecord();
    toast("Answers are too long for an email body, so the record was downloaded \u2014 attach it to the message.");
  }
  window.location.href=url;
}
function postRecord(){
  var b=document.getElementById("btnPost");
  b.disabled=true; b.textContent="Sending\u2026";
  var payload={ record:recordNo(), name:STATE.name||"", company:CONFIG.companyName,
    completed:new Date().toISOString(), score:counts(), checks:STATE.checks, answers:STATE.answers };
  fetch(CONFIG.submitEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
   .then(function(r){
      if(r.ok){ b.textContent="Sent"; toast("Sent to "+CONFIG.trainerName+"."); }
      else{ b.disabled=false; b.textContent="Send to trainer"; toast("The server refused it ("+r.status+"). Download the record and email it instead."); }
   })
   .catch(function(){
      b.disabled=false; b.textContent="Send to trainer";
      toast("Could not reach the server. Download the record and email it instead.");
   });
}

var toastT;
function toast(m){
  var t=document.getElementById("toast");
  t.textContent=m; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove("show"); },4200);
}

document.getElementById("who").addEventListener("input", function(e){
  STATE.name=e.target.value; autosave();
});
document.getElementById("btnSave").addEventListener("click", saveProgress);
document.getElementById("btnLoad").addEventListener("click", function(){ document.getElementById("fileIn").click(); });
document.getElementById("fileIn").addEventListener("change", function(e){
  if(e.target.files && e.target.files[0]) loadProgress(e.target.files[0]);
  e.target.value="";
});
document.getElementById("railToggle").addEventListener("click", function(e){
  e.stopPropagation();
  document.getElementById("rail").classList.toggle("open");
});
document.querySelector("main").addEventListener("click", function(){
  document.getElementById("rail").classList.remove("open");
});
document.addEventListener("keydown", function(e){
  if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  var i=pageIndex();
  if(e.key==="ArrowRight" && i<PAGES.length-1) go(pageKey(PAGES[i+1]));
  if(e.key==="ArrowLeft"  && i>0)              go(pageKey(PAGES[i-1]));
});

document.getElementById("brandSub").textContent = CONFIG.companyName + " \u00b7 interactive modules";
if(autoload()){ document.getElementById("who").value = STATE.name||""; }
draw();
