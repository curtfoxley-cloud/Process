<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configuration Audits — Interactive Training</title>
<style>
:root{
  --ink:#1E262E; --ink-2:#2C3841; --slate:#5C6D78; --mute:#8998A2;
  --paper:#FFFFFF; --surface:#F4F6F7; --surface-2:#EDF0F1; --rule:#D6DCDF;
  --rust:#A8481F; --rust-soft:#F2E4DD; --rust-ink:#7E340F;
  --teal:#1F5F5B; --teal-soft:#DFEAE8;
  --amber:#9A6508; --amber-soft:#F6ECD8;
  --alert:#8E2F2F; --alert-soft:#F4E2E2;
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --rail:290px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--surface);
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- header ---------- */
.top{
  position:sticky; top:0; z-index:40; background:var(--ink); color:#fff;
  display:flex; align-items:center; gap:16px; padding:0 20px; height:60px;
  border-bottom:1px solid #000;
}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#93A2AB}
.top .spacer{flex:1}
.who{display:flex;align-items:center;gap:8px}
.who label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#93A2AB}
.who input{
  background:#2C3841;border:1px solid #3D4B55;color:#fff;border-radius:4px;
  padding:6px 10px;font-size:13px;width:180px;
}
.who input:focus{outline:2px solid var(--rust);outline-offset:1px}
.tbtn{
  background:transparent;border:1px solid #46545F;color:#DCE3E7;border-radius:4px;
  padding:7px 12px;font-size:12.5px;white-space:nowrap;
}
.tbtn:hover{background:#2C3841;border-color:#5E6D77}
.tbtn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.railtoggle{display:none}

/* ---------- shell ---------- */
.shell{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto}
.rail{
  width:var(--rail); flex:0 0 var(--rail); background:var(--paper);
  border-right:1px solid var(--rule); min-height:calc(100vh - 60px);
  position:sticky; top:60px; max-height:calc(100vh - 60px); overflow-y:auto;
}
.railhead{padding:18px 20px 12px;border-bottom:1px solid var(--rule)}
.railhead h2{margin:0 0 3px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);font-weight:700}
.railhead p{margin:0;font-size:12px;color:var(--slate)}
.grp{padding:14px 0 6px}
.grp h3{
  margin:0 0 6px;padding:0 20px;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--slate);font-weight:700;
}
.nav{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;
  padding:7px 20px 7px 17px;display:flex;gap:10px;align-items:flex-start;line-height:1.35}
.nav:hover{background:var(--surface)}
.nav:focus-visible{outline:2px solid var(--rust);outline-offset:-2px}
.nav[aria-current="true"]{background:var(--surface-2);border-left-color:var(--rust)}
.nav .id{font-family:var(--mono);font-size:10.5px;color:var(--mute);flex:0 0 46px;padding-top:2px;letter-spacing:.02em}
.nav[aria-current="true"] .id{color:var(--rust-ink)}
.nav .nm{font-size:13px;color:var(--ink-2);flex:1}
.nav[aria-current="true"] .nm{font-weight:600}
.dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:5px;border:1.5px solid var(--rule);background:transparent}
.dot.work{border-color:var(--amber);background:var(--amber-soft)}
.dot.done{border-color:var(--teal);background:var(--teal)}

/* ---------- main ---------- */
main{flex:1;min-width:0;padding:0 0 80px}
.stage{max-width:820px;margin:0 auto;padding:34px 32px 0}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.recid{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--rust-ink);background:var(--rust-soft);
  padding:3px 8px;border-radius:3px;font-weight:700}
.status{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
h1.sect{font-family:var(--serif);font-size:31px;line-height:1.2;margin:0 0 6px;letter-spacing:-.2px}
.lede{font-size:15px;color:var(--slate);margin:0 0 22px}
.hr{height:1px;background:var(--rule);margin:0 0 26px}
p{margin:0 0 14px}
strong{font-weight:700}
ul.pl{margin:0 0 16px;padding-left:0;list-style:none}
ul.pl li{position:relative;padding-left:20px;margin-bottom:9px}
ul.pl li::before{content:"";position:absolute;left:3px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--rust)}

.callout{background:var(--surface);border-radius:6px;padding:16px 18px;margin:0 0 20px;border:1px solid var(--rule)}
.callout.teal{background:var(--teal-soft);border-color:#CBDDDA}
.callout .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:7px}
.callout.teal .lab{color:var(--teal)}
.callout p:last-child{margin-bottom:0}

.stmt{background:var(--ink);color:#fff;border-radius:6px;padding:20px 22px;margin:0 0 20px}
.stmt b{display:block;font-family:var(--serif);font-size:19px;line-height:1.35;font-weight:700}
.stmt span{display:block;margin-top:9px;font-size:13.5px;color:#B4C0C7}

.cards{display:grid;gap:12px;margin:0 0 20px}
.cards.c2{grid-template-columns:1fr 1fr}
.cards.c3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.card h4{margin:0 0 6px;font-size:14px;font-weight:700}
.card p{margin:0;font-size:13.5px;color:var(--ink-2)}

.steps{margin:0 0 20px;display:grid;gap:8px}
.step{display:flex;gap:12px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:11px 14px}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--rust);color:#fff;
  font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step.tl .n{background:var(--teal)}
.step .tx b{display:block;font-size:14px;margin-bottom:2px}
.step .tx span{font-size:13.5px;color:var(--ink-2)}

.tw{overflow-x:auto;margin:0 0 20px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
thead th{background:var(--ink);color:#fff;text-align:left;padding:9px 12px;font-size:12px;font-weight:700;letter-spacing:.02em}
tbody td{padding:9px 12px;border-top:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
tbody tr:nth-child(even) td{background:#FAFBFB}
td.k{font-family:var(--mono);font-size:12px;color:var(--rust-ink);white-space:nowrap}

/* ---------- knowledge check ---------- */
.check{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--rust);border-radius:6px;padding:18px 20px;margin:26px 0 0}
.check .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:8px}
.check .q{font-size:15.5px;font-weight:600;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--rule);border-radius:5px;margin-bottom:7px;cursor:pointer;background:var(--paper);font-size:14px}
.opt:hover{background:var(--surface)}
.opt input{margin:3px 0 0;accent-color:var(--rust);flex:0 0 auto}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt.wrong{border-color:var(--alert);background:var(--alert-soft)}
.opt.locked{cursor:default}
.fb{margin-top:11px;padding:12px 14px;border-radius:5px;font-size:14px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--teal-soft);border:1px solid #CBDDDA}
.fb.no{background:var(--alert-soft);border:1px solid #E8CFCF}
.fb b{display:block;margin-bottom:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.fb.ok b{color:var(--teal)} .fb.no b{color:var(--alert)}

/* ---------- exercises ---------- */
.exwrap{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;margin:0 0 18px}
.exwrap h4{margin:0 0 8px;font-family:var(--serif);font-size:18px}
.scen{background:var(--surface);border-radius:5px;padding:13px 15px;font-size:14px;margin-bottom:16px}
.part{margin-bottom:16px}
.part label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
textarea{width:100%;border:1px solid var(--rule);border-radius:5px;padding:10px 12px;font-size:14px;
  line-height:1.55;resize:vertical;min-height:76px;background:var(--paper)}
textarea:focus{outline:2px solid var(--rust);outline-offset:0;border-color:var(--rust)}
.count{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:4px;text-align:right}

/* ---------- buttons / footer nav ---------- */
.pager{display:flex;justify-content:space-between;gap:12px;margin:32px 0 0;padding-top:22px;border-top:1px solid var(--rule)}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:5px;padding:10px 18px;font-size:14px;font-weight:600}
.btn:hover{background:var(--surface)}
.btn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.btn.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.pri:hover{background:var(--rust-ink)}
.btn.gh{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}

/* ---------- start + submit ---------- */
.hero{background:var(--ink);color:#fff;border-radius:8px;padding:34px 34px 30px;margin-bottom:26px}
.hero .kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust-soft);margin-bottom:12px}
.hero h1{font-family:var(--serif);font-size:35px;line-height:1.15;margin:0 0 12px}
.hero p{color:#B4C0C7;margin:0;font-size:15px;max-width:60ch}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 22px;font-size:14px}
.meta dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);padding-top:3px}
.meta dd{margin:0}
.transmit{border:1px solid var(--rule);border-radius:6px;background:var(--paper);overflow:hidden;margin-bottom:22px}
.transmit .hd{background:var(--surface-2);padding:12px 18px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.transmit .hd b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.transmit .hd span{font-family:var(--mono);font-size:11px;color:var(--slate)}
.transmit .bd{padding:18px}
.scorebox{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.scorebox .big{font-family:var(--serif);font-size:42px;font-weight:700;line-height:1}
.scorebox .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate)}
.gaps{margin-top:14px}
.gaps li{font-size:13.5px}
.note{font-size:13px;color:var(--slate);margin-top:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:5px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.warn{background:var(--amber-soft);border:1px solid #E4D3AE;border-radius:5px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.setup{font-size:13px;color:var(--slate);border-top:1px solid var(--rule);margin-top:26px;padding-top:16px}
.setup code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:3px}

.fadein{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:760px){
  .top{padding:0 12px;gap:8px}
  .brand{display:none}
  .lng{display:none}
  .who{flex:1;min-width:0}
  .who label{display:none}
  .who input{width:100%;min-width:0}
}
@media(max-width:900px){
  .cards.c3,.cards.c2{grid-template-columns:1fr}
  .rail{position:fixed;top:60px;left:0;bottom:0;z-index:35;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0);max-height:none}
  .rail.open{transform:none;box-shadow:2px 0 24px rgba(0,0,0,.25)}
  .railtoggle{display:inline-block}
  .stage{padding:26px 18px 0}
  .who input{width:120px}
  h1.sect{font-size:26px}
  .hero{padding:26px 22px}
  .hero h1{font-size:28px}
}
</style>
</head>
<body>

<header class="top">
  <button class="tbtn railtoggle" id="railToggle" aria-label="Show section register">Sections</button>
  <div class="brand">
    <b>Configuration Audits &mdash; Functional and Physical</b>
    <span id="brandSub">Interactive modules</span>
  </div>
  <div class="spacer"></div>
  <div class="who">
    <label for="who">Trainee</label>
    <input id="who" type="text" placeholder="Your name" autocomplete="name">
  </div>
  <button class="tbtn" id="btnSave">Save<span class="lng"> progress</span></button>
  <button class="tbtn" id="btnLoad">Resume</button>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Section register"></nav>
  <main><div class="stage" id="stage"></div></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ==========================================================================
   TRAINER SETUP — edit this block, save the file, then share it.
   Nothing else in this file needs changing.
   ========================================================================== */
var CONFIG = {
  companyName:   "[Company]",
  trainerName:   "your CM trainer",
  trainerEmail:  "",            // e.g. "cm.lead@company.com" — enables the Email results button
  submitEndpoint:""             // optional: a URL that accepts a JSON POST (Power Automate, Forms webhook, etc.)
};

/* ==========================================================================
   CONTENT
   ========================================================================== */
var P = function(t){return {t:"p", x:t};};
var L = function(a){return {t:"list", x:a};};
var C = function(lab,lines,tone){return {t:"callout", lab:lab, x:lines, tone:tone||"rust"};};
var S = function(b,sub){return {t:"stmt", x:b, sub:sub||""};};
var CARDS = function(items,cols){return {t:"cards", x:items, cols:cols||3};};
var TABLE = function(head,rows){return {t:"table", head:head, x:rows};};
var STEPS = function(items,tone){return {t:"steps", x:items, tone:tone||""};};

var MODULES = [
{
 id:"A1", label:"Module 1", title:"What a configuration audit is",
 sub:"The two audits, what each establishes, and how an item earns one.",
 sections:[

  {id:"A1-01", title:"The two audits", body:[
    P("Two questions get asked about every product before anyone can honestly say it is finished. The first is whether the design does what it was required to do, and whether that can be proved from evidence rather than asserted from confidence. The second is whether the article on the bench is actually the article the drawings and the code describe."),
    P("These are different questions. They are answered by different people, from different evidence, at different moments. Each has its own formal audit."),
    CARDS([
      {h:"The functional configuration audit", b:"Does the item do what it was required to do, and can you prove it? A formal verification of the item's tested performance against its approved functional and allocated documentation. It also confirms that specifications and interfaces are accurately and adequately defined, and that the change control system genuinely controls how documentation is processed and released."},
      {h:"The physical configuration audit", b:"Is the thing you built the thing the documentation describes? A formal examination of the as-built \u2014 or as-coded \u2014 configuration of a validated item against its product documentation, confirming that documentation is a clear, complete and accurate representation of what was actually produced."}
    ],2),
    P("Both are defined in **EIA-649-1A**, the configuration management standard the organisation's process is built on. In conversation you will hear both shortened to three letters. This training uses the words, because the words carry the meaning and the letters do not."),
    C("What each audit cannot tell you",[
      "A successful functional audit says nothing about whether *this unit* was built to the drawings. A design can be fully proven and the article in front of you still wrong.",
      "A successful physical audit says nothing about whether the design was ever proven correct. A unit can match its documentation perfectly and the documentation still describe something that does not meet its requirements.",
      "Neither audit covers the other's ground. That is why there are two."
    ]),
    S("The functional audit asks whether the design was proven. The physical audit asks whether this unit is that design.",
      "Nearly everything else in this training follows from keeping those two questions apart."),
    C("Where this applies",[
      "The organisation's process covers hardware items, software items and firmware, at lower-tier incremental levels and at the system level, and it applies to audits held at the organisation's own facilities and at sub-supplier facilities alike.",
      "Where a contract imposes differing requirements, the contract governs, and the deviation is recorded in the programme configuration management plan. Silence in a contract is not the same as a differing requirement \u2014 a point section 8 of this module returns to."
    ],"teal")
  ], check:{
    q:"A production unit passes every acceptance test it is given. Months later a customer finds that one installed connector is a different part from the one on the released drawing. Which audit exists to catch that, and why?",
    o:["The functional audit, because an incorrect part is a performance question",
       "The physical audit, because it compares what was actually built against the product documentation",
       "Neither \u2014 acceptance testing already demonstrated that the unit works",
       "The functional audit, because the released drawing is part of the approved documentation"],
    a:1,
    why:"Passing tests tells you the unit performs. It does not tell you the unit matches its documentation, and those are two separate claims. The functional audit is tempting here because a wrong part sounds like it must affect performance \u2014 but that audit works from test evidence against requirements, not from hardware against drawings. Comparing the built article to the product documentation is exactly and only what the physical audit does."
  }},

  {id:"A1-02", title:"What a configuration item is, and why only some are audited", body:[
    P("This training has been saying *item*. It is time to be precise about what one is, because two separate narrowings sit between \u201ceverything in the product\u201d and \u201ceverything that gets audited,\u201d and people collapse them constantly."),
    P("A **configuration item** is something selected for separate management. It gets its own documentation, its own identifier, its own baselines and its own change control. Everything else in the product is managed inside the documentation of the configuration item it belongs to."),
    P("Two tests decide it. First, an end-use function gate: an item with no end-use function \u2014 raw material, bulk commodity, a purely structural element with no defined functional role \u2014 is not a configuration item, and is controlled within its parent. Then the selection criteria. An item is designated a configuration item if it meets or affects any one of these:"),
    L([
      "It is **critical to the functioning** of the system.",
      "Its **failure might cause serious injury, loss of life, or loss of primary system capability.**",
      "Its **technology is complex and not well understood**, and is critical to the acquisition, operational or supportability goals of the programme.",
      "It is **under control as designated by the Acquirer.**",
      "It requires **separate type designation, versions or nomenclature.**",
      "It is **critical or high risk** and its failure would have significant financial impact.",
      "It requires **logistics elements** \u2014 provisioning lists, test equipment, technical manuals, tag-out procedures."
    ]),
    P("Software is designated as configuration items in its own right. Selection is made at the level where items are specified, contracted, accepted and supported: designate too high and you lose visibility of what is changing; designate too low and the change traffic becomes unmanageable. Some configuration items are controlled by the Acquirer \u2014 specified, baselined and controlled by them \u2014 and below that level the Supplier decides what to manage internally and how."),
    P("Now the funnel, which is the point of this section."),
    STEPS([
      {h:"Everything in the product",b:"Parts, materials, processes, software, documentation. All of it is made, inspected and controlled. Most of it is not separately managed."},
      {h:"Configuration items",b:"The subset selected against the criteria above. Each carries its own documentation, identifier, baselines and change control. A programme may have hundreds."},
      {h:"Configuration items designated for audit",b:"A much smaller subset again, chosen by the designation assessment covered later in this module. A programme with hundreds of configuration items may audit a handful."}
    ]),
    S("Being a configuration item decides what is managed separately. Audit designation decides which of those get a discrete validation event.",
      "Two different questions, answered by two different assessments, each with its own record."),
    C("The two errors this produces",[
      "**“It is a configuration item, so it will be audited.”** No. Most configuration items are never audited, and nothing is wrong with that.",
      "**“It is not being audited, so it is not really controlled.”** Also no. Configuration items carry documentation, identifiers, baselines and change control whether or not an audit ever visits them.",
      "Both errors come from treating one selection as if it were the other."
    ])
  ], check:{
    q:"A programme has two hundred and forty configuration items. Eleven are designated for audit. A new engineer concludes that the other two hundred and twenty-nine are not really under configuration control. What is wrong with that conclusion?",
    o:["Nothing \u2014 audit designation is what places an item under configuration control",
       "Being a configuration item is what gives an item its own documentation, identifier, baselines and change control; audit designation decides only which of them receive a discrete validation event",
       "The other items are controlled only where the Acquirer has designated them as Acquirer-controlled",
       "The conclusion holds for hardware but not for software, which is always audited"],
    a:1,
    why:"The two selections are being collapsed into one. Selection as a configuration item is what puts an item under separate management, and it has already happened for all two hundred and forty. Acquirer control is a third and different distinction \u2014 it decides who baselines and controls the item, not whether it is controlled at all."
  }},

  {id:"A1-03", title:"The words you will meet", body:[
    P("Audits are described in a vocabulary that is precise and almost never explained. Learn these now and the rest of the training reads normally."),
    TABLE(["Term","What it means"],[
      ["The Acquirer","The customer buying the product. The Acquirer approves baselines, co-chairs audits, jointly selects the unit examined at the physical audit, and dispositions audit results."],
      ["The Supplier","The organisation delivering under the contract. To your customer, that is your company. To your own suppliers, your company is the Acquirer \u2014 the roles are positions in a chain, not fixed identities."],
      ["Design activity","The organisation holding design authority for an item and owning its documentation. It may be your company, a supplier, or the customer."],
      ["Configuration baseline","An agreed definition of a product's attributes at a point in time: a known configuration that changes are addressed to. A baseline plus its approved changes is the currently approved configuration."],
      ["Functional documentation","The system-level performance requirements and how they will be verified. It answers: what must the system as a whole do?"],
      ["Allocated documentation","Those requirements divided up and assigned to each item, together with its interfaces. It answers: what must this item do, given what the system must do?"],
      ["Product documentation","The released design \u2014 drawings, models, source code, detail specifications, acceptance requirements. It answers: how is this item actually made, and how is a unit accepted?"],
      ["Status accounting","The record system holding, for every configuration item and every unit, what the approved configuration is and what was actually built, changed or repaired. It is also where the as-designed to as-built reconciliation is performed, at scale, on records."],
      ["Technical data package","The released product documentation delivered to whoever must build, inspect or support the item. A delivery of product documentation, not a fourth kind of requirement."],
      ["Performance specification","States what an item must achieve and leaves the design open."],
      ["Detail specification","States how the item is built \u2014 materials, dimensions, processes."],
      ["Developmental configuration","A supplier's own evolving design description before it is baselined for the customer. It matters most for software, where the working library is the design."],
      ["As-designed configuration","What the released documentation says the item is."],
      ["As-built configuration","What a particular unit physically is, as produced."],
      ["As-maintained configuration","What that unit is now, after repair, retrofit and service life."]
    ]),
    S("A baseline plus its approved changes is the currently approved configuration. Every audit is a comparison against that.",
      "When someone asks what an audit is checking against, this is the answer, whichever audit they mean.")
  ], check:{
    q:"Requirements for a system have been agreed, then divided up so that each item carries its own share plus its defined interfaces. Which documentation set has just been described, and which audit works against it?",
    o:["Product documentation, used by the physical audit",
       "Allocated documentation, used together with the functional documentation by the functional audit",
       "Functional documentation, used by the physical audit",
       "The technical data package, used equally by both audits"],
    a:1,
    why:"Requirements divided up and assigned to individual items with their interfaces is the allocated set; the system-level statement above it is the functional set. The functional audit works against both. Product documentation is the released design \u2014 drawings, models, code \u2014 and that is what the physical audit compares hardware against. The technical data package is a delivery of product documentation, which is why it is not a separate answer."
  }},

  {id:"A1-04", title:"Prerequisites, and why the order is not a convention", body:[
    P("Each audit has a prerequisite, and in both cases the reason is structural rather than administrative."),
    STEPS([
      {h:"The functional audit needs approved baselines",b:"The functional and allocated documentation for the item or system must have been approved by the Acquirer before the audit. The audit compares tested performance against approved documentation. If the documentation is not approved, there is nothing stable to compare against \u2014 you would be auditing against a draft that can move underneath the finding."},
      {h:"The physical audit needs the functional audit complete, or running concurrently",b:"The physical audit examines the as-built configuration of a *validated* item. Validation is what the functional audit produces. Run the physical audit first and you are confirming, carefully and expensively, that a unit faithfully reproduces a design nobody has yet proven meets its requirements."}
    ]),
    P("Combining the two into a single event is permitted, but only where there is high confidence that the requirements of both will be satisfied within the same timeline. Combination is a scheduling decision made from evidence of readiness, not a way to make two problems into one."),
    P("Two words in these prerequisites do more work than they look. **Approved** means the Acquirer has accepted the functional and allocated documentation for this item \u2014 not that it is released internally, and not that it is in review. **Concurrent** means the functional audit is genuinely underway and its verification evidence is being presented alongside the physical examination. It does not mean the two audits appear in the same quarter of the schedule."),
    C("The mistake this rule exists to prevent",[
      "Hardware finishes early and testing slips. The temptation is to run the physical audit now, on the argument that the unit will not change and the audit work will not be wasted.",
      "It does not work. If the design later fails verification, the physical audit examined a unit built to documentation that was about to change \u2014 and the audit has to be redone. The saving was borrowed, at interest."
    ]),
    S("The physical audit examines a validated item, and validation is what the functional audit produces.",
      "That single sentence is the whole reason for the order.")
  ], check:{
    q:"Hardware for an item is finished and the test programme has slipped by three months. The programme proposes to run the physical audit now and the functional audit later, to protect the schedule. What is wrong with that?",
    o:["Nothing, provided both audits are complete before the first delivery",
       "The physical audit examines a validated item, and until the functional audit is complete or running concurrently there is nothing validated to examine",
       "Nothing, provided the Acquirer approves the sequence in the audit plan",
       "The physical audit cannot begin because the product documentation has not been released"],
    a:1,
    why:"Acquirer approval is genuinely required for the plan and schedule, which is what makes the third option tempting \u2014 but approval does not make an out-of-order audit meaningful, and no approval creates a validated item where none exists. The product documentation is usually released well before this point, so that is not the obstacle either. The obstacle is that the physical audit has nothing to examine yet."
  }},

  {id:"A1-05", title:"What the physical audit establishes", body:[
    P("The physical audit is not only a check. It is an event that causes something to exist."),
    P("On successful completion of the physical audit, and approval of the product specification, the Acquirer establishes the **product baseline** for the item. From that moment every subsequent change to the item runs through formal engineering change action against that baseline."),
    P("Before that moment there is no product baseline. Released drawings exist, and they are controlled \u2014 but a released design set the customer has not accepted as the definition of the item is not a baseline, and changes to it are not being measured against an agreed reference point."),
    C("What deferral actually costs",[
      "Programmes defer the physical audit for understandable reasons: the unit is late, the customer is busy, the schedule is tight.",
      "Deferring it does not remove an activity from the programme. The examination still has to happen eventually, and everything built in the meantime is built against a design definition that no one has yet agreed is the definition.",
      "**Skipping the audit does not save the work. It removes the reference point.**"
    ]),
    P("What the product baseline gives the programme is worth stating in plain terms:"),
    L([
      "**An agreed definition** of the item that both parties have accepted, rather than a design set that one party released.",
      "**A reference point for change**: every later change is proposed, evaluated, approved and incorporated as formal change action against that definition.",
      "**A basis for everything downstream** \u2014 spares, repair, retrofit, investigation. Each of those asks what the item was supposed to be, and the product baseline is the answer."
    ]),
    S("Deferring the physical audit defers the existence of the thing every later change is measured against.",
      "The audit is the establishing event for the product baseline, not a report on it."),
    P("This is also why items the Acquirer controls \u2014 the ones whose product baseline the Acquirer will establish \u2014 always need a physical audit. There is no other event that establishes it.")
  ], check:{
    q:"A programme defers the physical audit indefinitely. Six months later a change is proposed to the item. What is the practical consequence?",
    o:["None. Changes are processed against the released drawings whether or not an audit has happened",
       "The item has no established product baseline, so the change is not being measured against an agreed reference point \u2014 and the audit work has been deferred, not avoided",
       "The change cannot be processed at all until the audit takes place",
       "The change can proceed but must be classified as a major change"],
    a:1,
    why:"The first option is tempting because released drawings really do exist and really are controlled \u2014 work does not stop. But a released design set the Acquirer has not accepted as the definition of the item is not a product baseline, and the audit that would establish it is still owed. Work also does not halt waiting for the audit, which is why the third option overstates the effect."
  }},

  {id:"A1-06", title:"Audits validate the machinery; they do not replace it", body:[
    P("Configuration verification runs continuously, and it is much bigger than the audits. It is embedded in ordinary work across engineering, test, manufacturing and quality."),
    L([
      "**Functional verification** happens through the test programme \u2014 analyses, inspections, tests and demonstrations against requirements, every day, on everything.",
      "**Physical verification** happens through inspection and process control, on every unit, not on a sample.",
      "**As-designed to as-built reconciliation** happens at scale, on data for all items, through the status accounting system."
    ]),
    P("Against that, an audit is small and deliberate: a discrete validation conducted on designated items and, for the physical audit, on one representative unit and an agreed sample of documentation. Its purpose is to confirm that the machinery above is actually working, and to establish baselines. It is explicitly not the intent of an audit to verify every change individually."),
    C("What the physical audit is actually testing",[
      "Look closely at the third of those activities. The reconciliation compares what the approved configuration says the unit should be against what the **build records** say the unit is. Both sides of that comparison are records.",
      "A reconciliation can therefore come out clean while the hardware is wrong, because nothing in it ever touched the hardware. It inherits every error that reached the build record.",
      "**The physical audit is the point at which that comparison is tested against the article itself.** The reconciliation report for the audit unit is not evidence the audit accepts \u2014 it is the claim the audit is checking."
    ],"teal"),
    P("The proportions matter. A programme may deliver forty units of an item; the physical audit examines one. A drawing package may run to hundreds of sheets; the audit reviews an agreed sample against the manufacturing instructions. A requirement set may run to hundreds of entries; the functional audit may walk a sample of them. Every one of those numbers is chosen so that the audit can judge the process \u2014 and none of them is chosen so that the audit can find every defect."),
    S("An audit is a check on the verification system, not a substitute for it.",
      "It samples the output of a process in order to judge the process."),
    C("Two things this rules out",[
      "**\u201cWe will catch it at the audit\u201d is never a plan.** The audit sees one unit and an agreed sample. Anything the continuous machinery misses will probably still be missed \u2014 and if the audit does find it, the finding is about the machinery, not about that one part.",
      "**\u201cNot designated for audit\u201d never means \u201cnot verified.\u201d** Undesignated items are inspected, tested, controlled and reconciled exactly like everything else. Designation decides where the discrete validation events are placed, not where the discipline applies."
    ])
  ], check:{
    q:"A team decides not to reconcile a batch of change incorporations now, on the basis that the physical audit will pick up anything that went wrong. Why is that a mistake?",
    o:["Because the audit team is not qualified to perform reconciliation",
       "Because the audit examines one representative unit and an agreed sample \u2014 it validates that reconciliation is working, and cannot stand in for reconciliation nobody performed",
       "Because reconciliation has to be complete before an audit can be scheduled at all",
       "Because audits only cover items that carry safety-critical functions"],
    a:1,
    why:"The third option sounds like good discipline and is close to a real rule about audit readiness, but it is not the reason this reasoning fails. The reason is one of coverage: continuous reconciliation looks at everything, and the audit looks at one unit and a sample in order to judge whether that continuous work is sound. Substituting the sample for the population removes the very thing the sample was meant to test."
  }},

  {id:"A1-07", title:"Incremental, capstone, delta and combined audits", body:[
    P("Audits are sequenced bottom-up. Lower-level items are audited first, then subsystems, then the system."),
    STEPS([
      {h:"Incremental audits",b:"Each designated lower-level item is audited in its own right, as it becomes ready. This is how a large programme audits anything at all \u2014 waiting for the whole system to be finished would put every audit at the end, where there is no time left to act on findings."},
      {h:"The capstone audit",b:"A final system-level audit confirms that all functional, allocated and product baseline requirements are satisfied. Open action items from the lower-level audits are carried into its minutes rather than quietly expiring with the audit that raised them."},
      {h:"The delta audit",b:"A follow-on audit covering the portion of configuration and verification data that was still open at the original audit \u2014 most often testing that was not complete. Its results are added to, or supersede, the original minutes."},
      {h:"Combined events",b:"A functional and physical audit held as one event, where there is high confidence that both sets of requirements can be satisfied in one timeline."}
    ]),
    P("The delta audit deserves particular attention, because of what it makes possible. Verification of some requirements may depend on integrated system testing that has not yet happened. Without a delta mechanism, an audit facing that situation has two bad options: postpone everything, or certify a completeness that does not exist."),
    P("These forms interact. A delta audit on a lower-level item may still be open when the system-level capstone convenes; the open action items travel into the capstone minutes rather than being treated as closed because the capstone is a bigger event. An audit higher up the structure inherits what was left open below it, in writing, and that inheritance is the whole point of sequencing bottom-up."),
    S("The delta audit is the mechanism that lets an audit tell the truth about what is not finished.",
      "Open requirements become action items and close through the delta once the outstanding testing passes."),
    C("Reading it the other way round",[
      "If a programme is reluctant to plan a delta audit, ask why. The usual reason is that a delta makes the incompleteness visible in the record, and someone would prefer it stayed a footnote.",
      "That is the exact reason the mechanism exists."
    ])
  ], check:{
    q:"At a functional audit, verification of four requirements depends on integrated system testing that will not happen for two more months. The programme wants the audit certified now. What is the correct handling?",
    o:["Certify the audit and note the four requirements informally in the minutes",
       "Acknowledge partial completion, record the four as action items, and close them through a delta audit once the outstanding testing passes",
       "Postpone the whole audit until integrated testing is complete",
       "Agree to sample those four requirements out of scope, since they cannot be verified yet"],
    a:1,
    why:"Postponing everything is the tempting honest-looking answer, and it is the one that wastes the readiness of everything else while pushing findings later, where there is less time to act on them. Sampling the four out is worse: it removes them from the record entirely rather than leaving them visible and owed. Partial completion with a planned delta is the mechanism built for exactly this, and it keeps the incompleteness in writing."
  }},

  {id:"A1-08", title:"Why these audits are not optional here", body:[
    P("Most configuration management requirements arrive through the contract. A subset of them arrives twice \u2014 through the contract and, independently, through the organisation's safety management system, because those requirements act as barriers to severe safety events."),
    P("That subset is the **configuration management floor**. On safety-significant product lines, floor requirements are performed regardless of what the contract flows down. Several of them are audit requirements:"),
    L([
      "Conducting the functional audit to verify the item meets its performance requirements against the approved functional and allocated documentation.",
      "Documenting every functional-audit non-compliance and providing it to the Acquirer.",
      "Providing the requirements-to-test traceability matrix, in which each requirement maps to a test step.",
      "Conducting the physical audit to verify the product documentation is consistent with the validated item.",
      "Confirming the item against the approved parts selection list and verifying that the proper parts are actually installed.",
      "Documenting every physical-audit non-compliance and providing it to the Acquirer.",
      "Identifying the differences between the production unit and the unit used at the functional audit."
    ]),
    P("Each of those is anchored to events that have already happened, investigated and on the record."),
    TABLE(["Anchor event","What it demonstrates"],[
      ["Alaska Airlines 1282, 2024","A door plug was installed without all four retention bolts. The as-built configuration diverged from the approved configuration, and no record flagged it. This is the class of physical non-conformance the physical audit exists to catch before delivery."],
      ["KC-46 tanker deliveries, 2019 to 2022","Tools, rags and debris repeatedly found inside delivered aircraft, and repeated quality escapes between development articles, early production articles and full-rate production. Deliveries were halted more than once and rework ran to hundreds of millions. The second pattern is what the production-unit versus functional-audit-unit difference requirement exists to detect."],
      ["Software-controlled flight systems","Systems whose behaviour in edge conditions was not fully verified against requirements have contributed to multiple high-consequence events. Confirming that every requirement maps to a test step that passed is the functional audit's specific contribution."]
    ]),
    P("Because these are floor requirements, a proposal not to perform one is not a tailoring decision the programme makes on its own. It goes through the **floor gate**, which has exactly three doors: perform it; replace it with a documented equivalent control that independent safety assurance validates as controlling the same hazard; or formally accept the risk, at the authority matching the severity already recorded for that requirement \u2014 a vice-president for severe, the chief executive for catastrophic. The severity is looked up, not re-argued at the gate."),
    S("A barrier is not removed by deciding it is unnecessary. It is removed by someone accepting in writing, at the severity it carries, what happens when it is absent.",
      "There is no fourth door, and silent omission is the failure the gate exists to close.")
  ], check:{
    q:"A contract is silent on the physical audit, and the programme proposes to skip it on a safety-significant product line. What does the organisation's process require next?",
    o:["Nothing further \u2014 the contract governs, so the audit is not required",
       "The proposal goes through the floor gate: perform it, replace it with a validated equivalent control, or formally accept the risk at the authority matching the recorded severity",
       "The programme manager records the decision in the audit plan and proceeds",
       "The audit is skipped now and picked up at the next contract modification"],
    a:1,
    why:"The first option is tempting because it is half-true: where a contract imposes a differing requirement, the contract does govern, and the deviation is recorded in the programme plan. But silence is not a differing requirement, and the floor obligation arrives through the safety management system as well as the contract. Recording a decision in a plan is not one of the three doors \u2014 it documents the choice without anyone accepting the consequence."
  }},

  {id:"A1-09", title:"Audit designation: how an item earns an audit", body:[
    P("Some items are audited because a contract says so. The rest are assessed, item by item, against a four-part question set. The assessment is completed at initial audit planning, again at every revision of the programme configuration management plan, and again on any trigger event."),
    STEPS([
      {h:"Part A \u2014 mandatory designation",b:"Is the item named in the contract, the statement of work or the configuration management plan as requiring an audit? Is it an Acquirer-controlled item whose product baseline the Acquirer will establish \u2014 which requires a physical audit, because that audit is the establishing event? Any yes designates the item, to the scope the contract sets. **The assessment then continues anyway**, because the remaining parts can widen that scope: adding a delta audit of open scope, or pulling an increment earlier."},
      {h:"Part B \u2014 safety criticality",b:"Does the item implement or host a hazard risk control recorded in the hazard log? Was it selected because its failure might cause serious injury, loss of life or loss of primary system capability? Does its credible failure consequence sit in the top two severity bands \u2014 using the pre-anchored severity where one is recorded? Is it safety-critical software, or firmware embedded in a safety-critical device? Is it a single point of failure for a safety-related function? **Any yes creates presumptive designation**, and leaving such an item undesignated requires documented System Safety concurrence."},
      {h:"Part C \u2014 risk factors",b:"New or novel design rather than proven heritage. Substantive design change since the last audit. New or changed manufacturing source, process, facility or tooling. New or changed sub-tier supplier for the item or its critical components. A history of escapes, non-conformances, foreign-object findings or subcontractor disclosures. Findings of work performed not to approved data, or of inaccurate, incomplete or ambiguous manufacturing data. Reconciliation health anomalies \u2014 ageing differences between as-designed and as-built, an unincorporated-change backlog, serial or effectivity discrepancies. Never audited, or a prior audit with an open delta or unresolved actions. **Two or more designate. One is recorded and monitored.**"},
      {h:"Part D \u2014 reassessment triggers",b:"Re-run the assessment on any of: substantive design, process, facility, tooling or supplier change; a new escape or safety event traceable to the item; a reconciliation anomaly; a hazard log revision that adds a risk control to the item; a revision of the configuration management plan."}
    ]),
    P("The disposition is more granular than yes or no. It records which audits apply \u2014 functional, physical, both \u2014 and separately whether a delta audit of open scope is required. Where the audit will be initiated internally rather than chaired by the Acquirer, that is recorded too."),
    P("The assessment carries a written rationale and is signed by configuration management and Systems Engineering, **with System Safety signature required whenever any safety question was answered yes** \u2014 not only when the item is being left undesignated. Assessments are completed and retained for **every item evaluated, designated or not**, for the life of the programme."),
    C("Three mistakes people make with this",[
      "Stopping at Part A when the answer there is yes. Contract designation sets a floor on scope, not a ceiling.",
      "Treating a single risk factor as nothing. One factor is recorded and monitored precisely so that the second one changes the answer instead of arriving unnoticed.",
      "Not recording an assessment for items that were not designated. The undesignated assessments are the ones that show the judgement was made rather than skipped."
    ])
  ], check:{
    q:"An item is not named in any contract document and answers no to every safety question. Its design is new rather than proven heritage, and it will be built at a facility that has never produced it before. Nothing else applies. What is the outcome?",
    o:["Not designated \u2014 every safety question was answered no",
       "Designated \u2014 two risk factors are present, and two or more designate",
       "Recorded and monitored, but not designated",
       "Presumptively designated, subject to System Safety concurrence"],
    a:1,
    why:"Recorded-and-monitored is the tempting answer because it is the correct handling of *one* risk factor \u2014 but there are two here: new design, and a new manufacturing facility. Two or more designate. Presumptive designation belongs to the safety part of the assessment, and all of those answers were no, so System Safety concurrence is not what is in play."
  }},

  {id:"A1-10", title:"Answering the assessment: evidence, not opinion", body:[
    P("The assessment is only as good as the answers put into it, and every question has a place its answer comes from. An assessment completed from memory in a meeting is a set of opinions with signatures on it."),
    TABLE(["What the question asks","Where the answer comes from","Who holds it"],[
      ["Named in the contract, statement of work or plan","The contract file and the programme configuration management plan","Contracts and configuration management"],
      ["Acquirer-controlled, with the Acquirer establishing the product baseline","The item index and its control designations","Configuration management"],
      ["Implements or hosts a hazard risk control","The hazard log, and the analyses behind it","System Safety"],
      ["Selected because failure might cause serious injury, loss of life or loss of primary system capability","The item's selection record \u2014 the criteria assessment that made it a configuration item","Configuration management, with System Safety"],
      ["Credible failure consequence in the top two severity bands","The pre-anchored severity where one is recorded; otherwise the programme risk matrix","System Safety"],
      ["Safety-critical software, or firmware in a safety-critical device","The software criticality assessment","Software engineering with System Safety"],
      ["Single point of failure for a safety-related function","Failure analyses","Systems Engineering"],
      ["New or novel design rather than proven heritage","Design history and whatever evidence the heritage claim actually rests on","Design Engineering"],
      ["Substantive design change since the last audit","Change records against the item since the last audit date","Configuration management"],
      ["New or changed manufacturing source, process, facility or tooling","Process and tooling change records; the procurement record where the source moved","Manufacturing and supply chain"],
      ["New or changed sub-tier supplier for the item or its critical components","Procurement records and the supplier classification log","Supply chain with configuration management"],
      ["History of escapes, non-conformances, foreign-object findings or subcontractor disclosures","Quality and safety data for the item **and for its production line**","Quality Assurance"],
      ["Findings of work not to approved data, or inaccurate or incomplete manufacturing data","Quality findings against the item or the line","Quality Assurance"],
      ["Reconciliation health anomalies","Status accounting indicators: ageing as-designed to as-built differences, unincorporated-change backlog, serial and effectivity discrepancies","Configuration management"],
      ["Never audited, or a prior audit with an open delta or unresolved actions","Audit records and the prior minutes","Configuration management"]
    ]),
    P("Read that table as a list of people to talk to before the assessment meeting, not during it. Most of these answers take a day to obtain and five minutes to guess."),
    C("The answer that costs the most",[
      "**A \u201cno\u201d that means \u201cnobody checked\u201d.** It is indistinguishable, on the form, from a no that somebody established. Both are a blank space where a hazard could have been.",
      "\u201cI do not know yet\u201d is a legitimate interim state \u2014 provided it carries an owner and a date, and the assessment is not signed until it resolves. What is not legitimate is converting it silently into a no because the meeting needs to finish.",
      "The same applies to a heritage claim. **Proven heritage is a claim about evidence**, and the evidence is the fielded history of that design in that application. A design that is unchanged but has never flown in this environment is not heritage; it is a new application of an old drawing."
    ]),
    S("A no that means nobody checked is the most expensive answer on the form.",
      "It reads exactly like a no that somebody established, and only one of them is true.")
  ], check:{
    q:"At an assessment meeting, the question about escape and non-conformance history is answered no. Asked how that was established, the assessor says they have not seen anything come across their desk about this item. What is the correct handling?",
    o:["Accept the no \u2014 the assessor is the person closest to the item",
       "Treat it as unresolved: the answer comes from quality and safety data for the item and its production line, held by Quality Assurance, and until that has been looked at the answer is not yet a no",
       "Record it as a yes, since the absence of evidence cannot be relied upon",
       "Record the no and note the basis in the rationale, which is what the rationale field is for"],
    a:1,
    why:"Recording the no with its weak basis in the rationale is the tempting answer, because it looks honest and it does leave a trace. But the rationale field explains a determination; it does not substitute for making one, and downstream nobody re-reads it. Flipping to yes is equally wrong \u2014 it invents a finding. The answer is that this question has not yet been answered, and it has a named owner who can answer it."
  }},

  {id:"A1-11", title:"Worked examples \u2014 designation", body:[
    P("Designation is a judgement, and judgements are learned from cases rather than from rules. Work through these before the exercises."),
    TABLE(["Candidate item","Outcome","Reasoning"],[
      ["Flight-control actuator, named in the statement of work as requiring both audits","Designated \u2014 both audits","Contract designation is decided at Part A. The assessment continues anyway: the actuator hosts a hazard risk control and its supplier is new to the programme, which may add a delta audit of open scope or pull its increment earlier. Contract scope is the starting point, not the answer."],
      ["Mounting bracket. One risk factor \u2014 a new machining source. Nothing else","Not designated \u2014 recorded and monitored","A single risk factor sits below the threshold. It is recorded so that if a second appears \u2014 a design change, an escape, a reconciliation anomaly \u2014 the item is reassessed against two factors rather than starting from zero."],
      ["Power supply that acquires a hazard risk control when the hazard log is revised mid-programme","Reassess immediately; presumptive designation","The hazard log revision is itself a trigger, so the assessment re-runs without waiting for the next planning cycle. Hosting a hazard risk control is a safety yes, which makes designation presumptive; leaving it undesignated would need documented System Safety concurrence."],
      ["Cable assembly, never audited, showing an unincorporated-change backlog in reconciliation","Designated","Two risk factors: never audited, and a reconciliation health anomaly. The second matters more than its weight suggests \u2014 a reconciliation anomaly is direct evidence that the at-scale machinery may not be working for this item, which is the condition audits exist to detect."],
      ["Item the Acquirer controls, whose product baseline the Acquirer will establish","Designated \u2014 physical audit at minimum","No other event establishes the product baseline. Designation here is not a risk judgement at all; it follows from what the physical audit does."]
    ]),
    P("Two arguments you will actually have, walked out loud:"),
    C("\u201cWe do not think this one needs an audit \u2014 it is a mature design and the programme is tight.\u201d",[
      "First question: does it implement or host a hazard risk control? If yes, the argument is no longer configuration management's to settle. A safety yes makes designation presumptive, and omission requires documented System Safety concurrence.",
      "That is not bureaucracy. It puts the decision in front of the function that owns the hazard, rather than the function that owns the schedule.",
      "**CM can raise the question. CM cannot answer it alone.**"
    ]),
    C("\u201cIt is already designated by contract, so we can stop assessing it.\u201d",[
      "The contract sets the scope you owe. The assessment can widen it \u2014 an open delta from a previous audit, a new sub-tier source, a substantive design change since the last audit.",
      "Stopping at Part A is how a programme ends up conducting exactly the audit it agreed to two years ago on an item that has changed materially since."
    ],"teal")
  ], check:{
    q:"A supplier argues that an item with a single risk factor \u2014 a new manufacturing source \u2014 should be left alone, because one factor is below the designation threshold. They are right about the threshold. What still has to happen?",
    o:["Nothing further. One factor is below the threshold",
       "The factor is recorded and monitored, and the assessment is retained even though the item is not designated, so that a second factor changes the answer",
       "The item is designated anyway, because a manufacturing source change always designates",
       "System Safety must concur before the item can be left undesignated"],
    a:1,
    why:"Being right about the threshold is not the same as being finished. The record is the point: a single factor is written down and watched, and the assessment is retained for items that were not designated, so the next factor lands on top of a documented one rather than in an empty file. System Safety concurrence is required for omissions where a *safety* question was answered yes, which is not this case."
  }},

  {id:"A1-12", title:"More worked examples \u2014 the calls people get wrong", body:[
    P("A second set, chosen because each one is regularly decided the wrong way. Cover the middle column and commit to an answer before reading across."),
    TABLE(["Situation","Outcome","Reasoning"],[
      ["Design unchanged from a fielded product, but new tooling and a new sub-tier source for a critical component","Designated","Two risk factors. Heritage is not a shield: it speaks to the design, and both factors here are about how the item is now made. The most common error is treating a heritage design as answering the whole assessment."],
      ["Designated by contract for a functional audit only. Assessment finds an unincorporated-change backlog and no physical audit ever performed","Designated, with scope expanded beyond the contract","Contract designation set the scope at a functional audit. The assessment adds a physical audit, or at minimum a delta audit of open scope, and the expansion is recorded with its rationale. This is exactly what continuing past the mandatory part is for."],
      ["Safety-critical software hosted in an item the Acquirer does not control","Presumptive designation","Safety criticality does not depend on who controls the item. Acquirer control makes a physical audit mandatory for a different reason; its absence removes that reason and nothing else. Omission still requires documented System Safety concurrence."],
      ["Only factor is that the item has never been audited","Recorded and monitored","One factor. Worth saying plainly because \u201cnever audited\u201d feels like it should be decisive on its own, and it is not \u2014 it is one of eight."],
      ["Two factors, one of which is a facility change made three years ago with a successful audit since","Recorded and monitored, not designated","Count factors as they stand now. An audit performed since the change is what closes that factor \u2014 that is what the audit was for. Counting historical factors that have already been discharged inflates every assessment and makes the threshold meaningless."],
      ["No escapes against this item, but two safety-relevant escapes on the production line it shares with another item","Factor present","The history question covers the item **or its production line**. A shared line with escapes is evidence about the process this item goes through. Reading the question as item-only is the single most common way a genuine factor is missed."],
      ["Three factors present, but the programme is in its final delivery lot and production ends in four months","Designated","The assessment has no \u201ctoo late\u201d answer. The disposition can be proportionate \u2014 a delta audit of open scope rather than a full pair of audits \u2014 but the decision not to perform a designated audit is a floor gate decision, not a scheduling one."],
      ["The thing being assessed turns out not to be a configuration item at all","The assessment does not apply","It is controlled within its parent's documentation, and the real question is whether the parent is designated. Assessing a non-configuration item wastes effort and, worse, produces a record implying it was separately managed when it was not."]
    ]),
    C("\u201cIt is a heritage design, so the risk factors do not really apply.\u201d",[
      "Heritage answers one question: is the design new or novel. It says nothing about tooling, sources, facilities, sub-tiers, escape history or reconciliation health.",
      "Ask what has actually stayed the same. In most cases the drawing stayed the same and everything that turns the drawing into hardware moved."
    ]),
    C("\u201cWe will designate it next cycle if the second factor appears.\u201d",[
      "That is the correct handling for one factor \u2014 and only if the first factor was genuinely recorded, so the second one lands on top of a documented one.",
      "Where it goes wrong is when nothing was written down. The second factor then arrives at an assessment that starts from zero, is scored as a single factor, and the item is monitored again.",
      "**Two consecutive single-factor assessments with no record between them is how an item is never designated.**"
    ],"teal")
  ], check:{
    q:"An item has no escapes recorded against it. It is built on a line that has had two safety-relevant escapes in the past year, both on a different item. The assessor records the history question as no. Is that right?",
    o:["Yes \u2014 the escapes are against a different item, so they are not history against this one",
       "No \u2014 the question covers the item or its production line, and a line with recorded escapes is a factor for everything that goes through it",
       "Yes, unless the two items share a common part number",
       "No \u2014 any escape anywhere at the site is a factor for every item built there"],
    a:1,
    why:"The escapes really are against a different item, which is what makes the first answer feel safe. But the question was written to cover the production line precisely because escapes are usually evidence about a process rather than about a part. The last option overshoots in the other direction: the line the item is built on is the scope, not the whole site."
  }},

  {id:"A1-13", title:"Who does what", body:[
    P("Audits rarely fail because someone exercised judgement badly. They fail because something needed on the day had no owner, and everyone assumed it belonged to someone else. Read this as a handoff map."),
    TABLE(["Role","What they carry"],[
      ["Configuration management","Owns the audit process. Prepares the plan and agenda, coordinates Acquirer approval, assembles and controls the data package, records the minutes, documents each non-compliance as a finding and tracks it to closure, prepares the summary report, and records results in status accounting."],
      ["Audit co-chair","The Supplier's designated representative for the audit. Runs proceedings jointly with the Acquirer's co-chair, gives the opening briefing, folds side-meeting conclusions into the official record, and delivers the management out-brief."],
      ["Systems Engineering","The requirements traceability matrix, specifications, interface documentation and analyses. Presents requirement-by-requirement verification evidence at the functional audit."],
      ["Design Engineering","Released drawings and models, parts lists, product specifications and change records. Supports the as-designed to as-built reconciliation at the physical audit."],
      ["Test and Evaluation","Test plans, procedures and reports. Accounts for tests not yet performed and the plan to accomplish each of them."],
      ["Manufacturing","Manufacturing and work instructions, process records, facility and unit access, staging of the audit unit and its detail parts."],
      ["Quality Assurance","Quality records, first article results and acceptance test data. Witnesses the software build and installation check. Confirms that production processes match those used in development, or that the differences are documented."],
      ["Software engineering","Version descriptions including the build environment, library listings of every version held, and the build itself."],
      ["Logistics and support","Operation and support manuals."],
      ["System Safety","Concurrence where a safety-significant item is proposed for omission from audit, signature on assessments where any safety question was answered yes, and routing of findings that affect hazard risk controls."],
      ["Sub-suppliers","Participate in planning as well as conduct for audits of their items, prepare audit plans identifying their own requirements and responsibilities, and field people who can discuss the technical detail of what is presented."],
      ["The Acquirer","Approves the schedule, plan and agenda. Co-chairs proceedings. Jointly selects the unit examined at the physical audit. Dispositions the results, and establishes the product baseline."]
    ]),
    S("Most audits that go badly do not fail on judgement. They fail on a handoff nobody owned.",
      "When you read this table, read the seams between rows, not the rows.")
  ], check:{
    q:"Two weeks before a functional audit, nobody has produced the list of tests not yet performed with the plan to accomplish each. Whose item is that?",
    o:["Configuration management, because CM assembles and controls the data package",
       "Test and Evaluation, who account for tests not yet performed and the plan to accomplish them",
       "Systems Engineering, because it concerns verification of requirements",
       "The Acquirer, who decides which tests are required"],
    a:1,
    why:"Configuration management is the tempting answer because CM assembles the package and will certainly be the one chasing it \u2014 but assembling is not producing, and CM cannot write a test accomplishment plan. Systems Engineering owns the requirements and the traceability matrix; the account of what has and has not been tested, and how the gaps will be closed, sits with Test and Evaluation. Confusing chasing with owning is how items like this arrive unclaimed on the day."
  }}

 ],
 exercises:[

  {id:"A1-E1", title:"Exercise 1 \u2014 One item, four years",
   scen:"An electro-mechanical latch assembly is procured at contract award. At award it is not named in any contract document as requiring an audit, its design is a proven heritage design, and the supplier has built it for a decade. Two years in, a hazard log revision records a hazard risk control that the latch implements. Six months after that, the supplier moves the latch's machining to a new sub-tier shop. A year later, reconciliation reports show an unincorporated-change backlog against the latch.",
   parts:[
     {id:"a", q:"At award, what is the designation outcome, and what record is created?"},
     {id:"b", q:"The hazard log revision lands. What happens, when, and who has to sign what?"},
     {id:"c", q:"The new sub-tier shop appears. Which part of the assessment does that touch, and what is the outcome on its own?"},
     {id:"d", q:"The reconciliation backlog appears. Explain why this particular factor should worry you more than its arithmetic weight suggests."},
     {id:"e", q:"Across the four years, how many times should this item have been assessed, and what triggered each one?"},
     {id:"f", q:"If the programme had recorded nothing at award because the item was not designated, what would be missing now \u2014 and what would you have lost beyond the paperwork?"}
   ]},

  {id:"A1-E2", title:"Exercise 2 \u2014 The argument you will actually have",
   scen:"A programme manager asks you to leave a valve assembly undesignated. Their reasoning: the design is unchanged from a fielded product, the supplier is long-standing, the schedule is compressed, and an audit will cost six weeks that the programme does not have. You establish that the valve hosts a hazard risk control recorded in the hazard log, and that the supplier has changed the heat-treat process for the valve body since the last build.",
   parts:[
     {id:"a", q:"Work the assessment and state the outcome, part by part."},
     {id:"b", q:"The programme manager's arguments are all true. Which of them are relevant to the assessment, and which are not?"},
     {id:"c", q:"Can configuration management agree to leave this item undesignated? Answer precisely, and say what would have to happen for the omission to be legitimate."},
     {id:"d", q:"Suppose the valve did not host a hazard risk control, and the heat-treat change were the only factor present. What is the outcome then, and what do you still write down?"},
     {id:"e", q:"Name one fact in this scenario you would want confirmed before signing anything, who you would ask, and what you would do if the answer did not arrive before the assessment was due."}
   ]},

  {id:"A1-E3", title:"Exercise 3 \u2014 Reading a situation after the fact",
   scen:"You inherit a programme. An item was designated for both audits three years ago. The functional audit was conducted. The physical audit was scheduled twice and deferred both times \u2014 first because the representative unit was late, then because the customer's team was unavailable. Forty units have since been delivered. A field return arrives showing a fastener grade that does not match the released drawing. Nobody can say whether the other thirty-nine units are affected.",
   parts:[
     {id:"a", q:"What does the absence of a completed physical audit mean for the status of this item's configuration? Be specific about what does and does not exist."},
     {id:"b", q:"The programme argues that deferring the audit saved three years of effort. Answer that argument."},
     {id:"c", q:"Which continuous verification activities should have caught the fastener before a field return did, and what does it tell you that they did not?"},
     {id:"d", q:"Someone proposes that the physical audit, when it finally happens, will resolve the question of the other thirty-nine units. Is that right?"},
     {id:"e", q:"Re-run the designation assessment for this item today. What is different from three years ago?"}
   ]},

  {id:"A1-E4", title:"Exercise 4 \u2014 Five candidates",
   scen:"You are assessing five items on a safety-significant product line. (1) A structural fitting the Acquirer controls and whose product baseline the Acquirer will establish. (2) A commercial display unit bought to catalogue, unchanged for years, with no safety function. (3) A firmware load embedded in a device that implements a hazard risk control. (4) A wiring harness with no safety function, whose only factor is that it has never been audited. (5) An actuator with a substantive design change since its last audit and a history of quality escapes on its production line.",
   parts:[
     {id:"a", q:"Give the designation outcome for each of the five, with the reasoning that produced it."},
     {id:"b", q:"Two of these are designated for reasons that have nothing to do with risk factors. Which, and what does that tell you about how the assessment is structured?"},
     {id:"c", q:"For the item you did not designate, state exactly what is recorded and why the record matters."},
     {id:"d", q:"For item 2, is it true that nothing about it is verified? Explain."},
     {id:"e", q:"For one of these five you do not have enough information to settle the disposition. Identify it, say what fact is missing, and name who you would ask."},
     {id:"f", q:"A colleague reads your assessment and says \u201cso anything that is a configuration item gets audited.\u201d Correct them using these five, and say what each of the two selections actually decides."}
   ]},

  {id:"A1-E5", title:"Exercise 5 \u2014 Which audit would have caught it",
   scen:"Four defects reach a customer on different programmes. (1) A unit meets every performance requirement, but an internal bracket is a different alloy from the one on the released drawing. (2) A software item is built exactly to its released design, and in a rare combination of inputs it behaves in a way no requirement ever described. (3) A production unit differs from the unit used for functional verification in three respects, none of them recorded anywhere. (4) A unit matches its drawings, and the drawings themselves reference a superseded revision of an interface document.",
   parts:[
     {id:"a", q:"For each defect, say which audit is the one designed to catch it, and why the other would not."},
     {id:"b", q:"Two of these four are the same failure wearing different clothes. Which two, and what is the shared failure?"},
     {id:"c", q:"For defect 3, name the specific audit requirement that exists because of this pattern, and the documented programme that anchors it."},
     {id:"d", q:"For defect 2, someone argues the functional audit could not have caught it because no requirement covered the behaviour. Is that a defence or a finding?"},
     {id:"e", q:"Choose the defect you consider most likely to recur at this organisation, and justify the choice using what you have been taught about why these audits sit on the floor."}
   ]},
  {id:"A1-E6", title:"Exercise 6 \u2014 Assessing with the evidence you do not have",
   scen:"You are asked to complete designation assessments for three items by Friday. For the first, nobody can tell you whether it hosts a hazard risk control; the hazard log was revised last month and the revision has not been distributed. For the second, the design is described as heritage, but the heritage claim rests on a similar item flown in a different thermal environment. For the third, the assessor has answered no to escape history on the basis that nothing has been raised with them, and no to reconciliation health because they do not have access to the indicators.",
   parts:[
     {id:"a", q:"For each of the three, say what the honest state of the answer is right now and what it is not."},
     {id:"b", q:"For each unresolved answer, name where it comes from and who holds it."},
     {id:"c", q:"Friday arrives and two answers are still outstanding. What do you do, and what do you refuse to do?"},
     {id:"d", q:"Take the heritage claim apart. What would have to be true for it to answer the question it is being used to answer?"},
     {id:"e", q:"The third assessor's two answers are both no. Explain, to someone who thinks you are being pedantic, why those two answers are worse than a yes would be."},
     {id:"f", q:"One of these three could be signed today with an honest disposition. Which, and what would the disposition say?"}
   ]},
  {id:"A1-E7", title:"Exercise 7 \u2014 Scope, not just yes or no",
