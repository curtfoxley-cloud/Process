<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool Builder</title>
<style>
:root{
  --ink:#1E262E; --ink-2:#2C3841; --slate:#5C6D78; --mute:#8998A2;
  --paper:#FFFFFF; --surface:#F4F6F7; --surface-2:#EDF0F1; --rule:#D6DCDF;
  --rust:#A8481F; --rust-soft:#F2E4DD; --rust-ink:#7E340F;
  --amber:#9A6508; --amber-soft:#F6ECD8;
  --alert:#8E2F2F; --alert-soft:#F4E2E2;
  --teal:#1F5F5B; --teal-soft:#DFEAE8;
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--surface);font-size:14px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;font-size:13.5px;color:inherit}
:focus-visible{outline:2px solid var(--rust);outline-offset:2px}

/* ---- top bar ---- */
.bb{background:var(--ink);color:#fff;padding:9px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;flex:none}
.brand{margin-right:auto;min-width:0}
.brand b{font-family:var(--serif);font-size:16px;font-weight:400;display:block;line-height:1.2}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#93A2AB}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tb button{background:transparent;border:1px solid #47565F;color:#E9EEF0;border-radius:4px;padding:6px 11px;font-size:12.5px;font-weight:600}
.tb button:hover{background:#2C3841;border-color:#6A7B85}
.tb button.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.tb button.pri:hover{background:var(--rust-ink)}
.tb button[disabled]{opacity:.4;cursor:default}
.tb .sep{width:1px;height:22px;background:#47565F;margin:0 2px}
.menu{position:relative}
.menu .pop{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:60;background:var(--paper);color:var(--ink);
  border:1px solid var(--rule);border-radius:6px;box-shadow:0 8px 24px rgba(30,38,46,.18);min-width:290px;padding:6px}
.menu.open .pop{display:block}
.pop button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:9px 11px;border-radius:4px;font-size:13px;font-weight:400}
.pop button b{display:block;font-weight:600}
.pop button span{color:var(--slate);font-size:12px}
.pop button:hover{background:var(--surface)}

/* ---- banner ---- */
.banner{flex:none;background:var(--amber-soft);border-bottom:1px solid #E4D3AF;padding:8px 16px;font-size:13px;display:none;gap:10px;align-items:center;flex-wrap:wrap}
.banner.on{display:flex}
.banner.good{background:var(--teal-soft);border-color:#BFD5D2}
.banner.bad{background:var(--alert-soft);border-color:#E0BFBF}
.banner button{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:4px 10px;font-size:12.5px;font-weight:600}
.banner .x{margin-left:auto;border:0;background:none;font-size:16px;color:var(--slate)}

/* ---- layout ---- */
.layout{flex:1;display:grid;grid-template-columns:210px minmax(380px,1fr) minmax(380px,1.05fr);min-height:0}
.side{border-right:1px solid var(--rule);background:var(--paper);overflow-y:auto;padding:12px 8px}
.side .lab{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);font-weight:700;margin:4px 8px 6px}
.side button.sec{display:flex;width:100%;text-align:left;border:0;background:none;padding:7px 9px;border-radius:4px;font-size:13px;color:var(--ink-2);gap:8px;align-items:baseline}
.side button.sec:hover{background:var(--surface)}
.side button.sec.on{background:var(--rust-soft);color:var(--rust-ink);font-weight:600}
.side button.sec .n{font-family:var(--mono);font-size:10px;color:var(--mute);min-width:16px}
.side button.sec .bad{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--alert);font-weight:700}
.probs{margin:16px 6px 0;border-top:1px solid var(--rule);padding-top:12px}
.probs .ok{font-size:12px;color:var(--teal)}
.probs ul{margin:4px 0 0;padding:0;list-style:none}
.probs li{font-size:12px;color:var(--alert);margin-bottom:6px;cursor:pointer;line-height:1.4}
.probs li:hover{text-decoration:underline}

.editor{overflow-y:auto;padding:20px 22px 80px;min-width:0}
.editor h2{font-family:var(--serif);font-size:23px;font-weight:400;margin:0 0 4px}
.editor .intro{color:var(--slate);font-size:13.5px;margin:0 0 18px;max-width:68ch}
.editor .intro p{margin:0 0 7px}

.f{margin:0 0 14px}
.f>label,.f .flab{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700;margin-bottom:4px}
.f input[type=text],.f input[type=number],.f textarea,.f select{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:4px;background:var(--paper)}
.f textarea{resize:vertical;line-height:1.5;min-height:38px}
.f input:focus,.f textarea:focus,.f select:focus{outline:2px solid var(--rust);outline-offset:0;border-color:var(--rust)}
.f .help{font-size:12px;color:var(--slate);margin-top:4px;line-height:1.45}
.f .help code,.intro code,.help code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:0 4px;border-radius:3px}
.f.ck{display:flex;gap:8px;align-items:flex-start}
.f.ck input{margin:3px 0 0;accent-color:var(--rust)}
.f.ck label{font-family:inherit;font-size:13.5px;letter-spacing:0;text-transform:none;color:var(--ink-2);font-weight:400;margin:0;cursor:pointer}
.f.ck .help{margin-top:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grp{border:1px solid var(--rule);border-radius:6px;padding:12px 14px 2px;margin:0 0 16px;background:var(--paper)}
.grp>.gt{font-family:var(--serif);font-size:15px;margin:0 0 10px;color:var(--ink)}
.grp>.gh{font-size:12px;color:var(--slate);margin:-6px 0 10px}
.alt{border-left:3px solid var(--teal);padding-left:10px}
.alt>label{color:var(--teal)!important}
.multi{display:flex;gap:14px;flex-wrap:wrap}
.multi label{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.multi input{accent-color:var(--rust)}

/* ---- lists ---- */
.lst{margin:0 0 16px}
.lst>.lh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.lst>.lh .flab{margin:0;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700}
.lst>.lh .cnt{font-family:var(--mono);font-size:10px;color:var(--mute)}
.lst>.help{font-size:12px;color:var(--slate);margin:-2px 0 8px}
.add{border:1px dashed var(--mute);background:var(--paper);color:var(--slate);border-radius:4px;padding:6px 12px;font-size:12.5px;font-weight:600}
.add:hover{border-color:var(--rust);color:var(--rust-ink)}
.it{background:var(--paper);border:1px solid var(--rule);border-radius:6px;margin-bottom:6px}
.it.open{border-color:#C9D1D5;box-shadow:0 1px 4px rgba(30,38,46,.06)}
.it>.ih{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;cursor:pointer;min-height:36px}
.it>.ih .tw{font-size:10px;color:var(--mute);width:12px;flex:none;transition:transform .12s}
.it.open>.ih .tw{transform:rotate(90deg)}
.it>.ih .sm{flex:1;min-width:0;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it>.ih .sm b{font-family:var(--mono);font-size:11.5px;color:var(--rust-ink);margin-right:6px}
.it>.ih .ib{border:1px solid transparent;background:none;color:var(--mute);border-radius:3px;width:26px;height:26px;padding:0;font-size:13px;line-height:1;flex:none}
.it>.ih .ib:hover{border-color:var(--rule);color:var(--ink);background:var(--surface)}
.it>.ih .ib.del:hover{color:var(--alert);border-color:#E0BFBF;background:var(--alert-soft)}
.it>.ib2{display:none;padding:10px 12px 2px;border-top:1px solid var(--surface-2)}
.it.open>.ib2{display:block}
.it .it{background:var(--surface)}
.it .it .it{background:var(--paper)}
.it.flash{animation:fl 1s ease}
@keyframes fl{0%{background:var(--rust-soft)}100%{}}

/* ---- conditions ---- */
.cond{border:1px solid var(--rule);border-radius:6px;padding:8px 10px;background:var(--surface)}
.it .it .cond{background:var(--paper)}
.cond .always{font-size:12.5px;color:var(--slate);font-style:italic;margin:2px 0 6px}
.cg{border-left:3px solid var(--slate);padding:2px 0 2px 9px;margin:4px 0}
.cg .cgh{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:4px}
.cr{display:flex;gap:5px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.cr select,.cr input{padding:5px 6px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);font-size:12.5px;max-width:100%}
.f .cr select,.f .cr input{width:auto}
.cr select.subj{flex:1 1 150px;min-width:0}
.cr select.op{flex:0 0 auto}
.cr .val{flex:0 1 130px;min-width:64px}
.cr .miss{border-color:var(--alert);background:var(--alert-soft)}
.cr .rm{border:0;background:none;color:var(--mute);font-size:15px;padding:0 4px}
.cr .rm:hover{color:var(--alert)}
.cor{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin:6px 0}
.cbtn{border:0;background:none;color:var(--rust-ink);font-weight:600;font-size:12.5px;padding:2px 0;margin-right:14px;text-decoration:underline;text-underline-offset:3px}

/* ---- labels table ---- */
.lbl{display:grid;grid-template-columns:minmax(150px,34%) 1fr;gap:6px 12px;align-items:start}
.lbl .k{font-size:12.5px;color:var(--ink-2);padding-top:7px}
.lbl .k small{display:block;font-family:var(--mono);font-size:10px;color:var(--mute)}
.lbl textarea{width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);resize:vertical;min-height:34px}

/* ---- preview ---- */
.preview{border-left:1px solid var(--rule);display:flex;flex-direction:column;min-width:0;background:#E3E8EA}
.pvbar{display:flex;gap:8px;align-items:center;padding:7px 12px;background:var(--paper);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.pvbar .t{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate);font-weight:700;margin-right:auto}
.pvbar button{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink-2)}
.pvbar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pvwrap{flex:1;min-height:0;display:flex;justify-content:center;overflow:auto}
.pvwrap iframe{border:0;background:var(--surface);width:100%;height:100%;display:block}
.pvwrap.phone{padding:14px 0}
.pvwrap.phone iframe{width:390px;height:auto;min-height:calc(100% - 0px);border-radius:14px;box-shadow:0 4px 20px rgba(30,38,46,.2)}

/* ---- record preview ---- */
.preview{position:relative;min-height:0;overflow:hidden}
.layout{grid-template-rows:minmax(0,1fr)}
.pvrec{display:none;flex:0 0 42%;min-height:0;flex-direction:column;border-top:3px solid var(--ink-2);background:var(--paper)}
.preview.rec .pvrec{display:flex}
.pvrh{display:flex;gap:10px;align-items:baseline;padding:7px 12px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.pvrh .t{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate);font-weight:700}
#pvrs{font-size:12px;color:var(--slate)}
#pvrt{flex:1;margin:0;overflow:auto;padding:10px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.pvbar button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---- help page ---- */
.help{position:fixed;inset:0;z-index:80;background:var(--surface);display:none;flex-direction:column}
.help.on{display:flex}
.hp-top{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--ink);color:#fff;flex-wrap:wrap}
.hp-top b{font-family:var(--serif);font-weight:400;font-size:17px;margin-right:auto}
.hp-top input{padding:6px 10px;border-radius:4px;border:1px solid #47565F;background:#2C3841;color:#fff;min-width:200px}
.hp-top input::placeholder{color:#93A2AB}
.hp-top button{background:transparent;border:1px solid #47565F;color:#E9EEF0;border-radius:4px;padding:6px 12px;font-size:12.5px;font-weight:600}
.hp-top button.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.hp-main{flex:1;min-height:0;display:grid;grid-template-columns:250px 1fr}
.hp-toc{overflow-y:auto;background:var(--paper);border-right:1px solid var(--rule);padding:14px 10px}
.hp-toc a{display:block;padding:6px 9px;border-radius:4px;color:var(--ink-2);text-decoration:none;font-size:13px}
.hp-toc a:hover{background:var(--surface)}
.hp-body{overflow-y:auto;padding:24px 32px 120px}
.hp-sec{max-width:760px;margin:0 0 30px;scroll-margin-top:16px}
.hp-sec h3{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.hp-sec h4{font-family:var(--serif);font-weight:400;font-size:16px;margin:18px 0 6px;color:var(--ink)}
.hp-sec p,.hp-sec li{font-size:14px;color:var(--ink-2);line-height:1.6}
.hp-sec p{margin:0 0 9px}
.hp-sec ul,.hp-sec ol{margin:0 0 10px;padding-left:22px}
.hp-sec li{margin-bottom:5px}
.hp-sec code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:0 4px;border-radius:3px}
.hp-task{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:12px 16px;margin:0 0 12px}
.hp-task h4{margin:0 0 6px}
.hp-task ol{margin-bottom:4px}
.hp-note{font-size:13px!important;color:var(--slate)!important;border-left:3px solid var(--teal);padding-left:9px;margin:6px 0 2px!important}
.hp-t{border-collapse:collapse;margin:4px 0 12px;font-size:13.5px;width:100%}
.hp-t th{text-align:left;background:var(--surface-2);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);padding:6px 9px}
.hp-t td{border-top:1px solid var(--rule);padding:7px 9px;vertical-align:top;color:var(--ink-2)}
.hp-ex{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:10px 12px;margin:0 0 12px;font-size:13px}
.hp-ex .cg div{padding:2px 0}
.hp-go{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--rust-ink)}
.hp-none{padding:24px 32px;color:var(--slate);grid-column:2;grid-row:1;margin:0}
@media(max-width:760px){.hp-none{grid-column:1;grid-row:2}}
.hp-steps li{margin-bottom:8px}
.start-cta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--rust-soft);border:1px solid #E3CCC2;border-radius:6px;padding:12px 16px;margin:0 0 14px}
.start-cta p{margin:0;flex:1;min-width:220px;font-size:13.5px;color:var(--ink-2)}
.start-cta button{border:1px solid var(--rust);background:var(--rust);color:#fff;border-radius:4px;padding:8px 14px;font-weight:600}
@media(max-width:760px){
  .hp-main{grid-template-columns:1fr}
  .hp-toc{display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--rule);padding:8px}
  .hp-toc a{white-space:nowrap;flex:none}
  .hp-body{padding:16px 16px 80px}
  .hp-top input{min-width:0;flex:1}
  .hp-top b{flex-basis:100%;font-size:15px}
}
@media print{
  body{overflow:visible;display:block;height:auto}
  body.printing>*:not(#help){display:none!important}
  body.printing .help{position:static;display:block}
  body.printing .hp-top,body.printing .hp-toc,body.printing .hp-go{display:none}
  body.printing .hp-main{display:block}
  body.printing .hp-body{overflow:visible;padding:0}
  body.printing .hp-sec{display:block!important;break-inside:auto}
}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:5px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s;z-index:90;display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:none;border:0;color:#F2C4AE;font-weight:700;text-decoration:underline;padding:0}

.mtabs{display:none}
.help-card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;margin:0 0 14px;font-size:13.5px;color:var(--ink-2)}
.help-card h3{font-family:var(--serif);font-weight:400;font-size:16px;margin:0 0 6px}
.help-card p{margin:0 0 8px}
.help-card ul,.help-card ol{margin:0 0 8px;padding-left:20px}
.help-card li{margin-bottom:4px}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--paper)}

@media(max-width:1180px){
  .layout{grid-template-columns:180px 1fr 1fr}
}
@media(max-width:960px){
  body{overflow:auto}
  .layout{display:block}
  .side{border-right:0;border-bottom:1px solid var(--rule);padding:8px}
  .side .secs{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
  .side .lab{display:none}
  .side button.sec{white-space:nowrap;width:auto;flex:none}
  .probs{margin:8px 4px 0}
  .mtabs{display:flex;gap:0;background:var(--paper);border-bottom:1px solid var(--rule)}
  .mtabs button{flex:1;border:0;background:none;padding:10px;font-weight:600;color:var(--slate);border-bottom:3px solid transparent}
  .mtabs button.on{color:var(--rust-ink);border-bottom-color:var(--rust)}
  body.m-edit .preview{display:none}
  body.m-prev .editor{display:none}
  body.m-prev .side{display:none}
  .preview{border-left:0;height:calc(100vh - 110px)}
  .editor{padding:16px 14px 60px}
  .row2{grid-template-columns:1fr}
}

</style>
</head>
<body>
<header class="bb">
  <div class="brand"><b id="brand-t">Tool Builder</b><span id="brand-s"></span></div>
  <div class="tb">
    <div class="menu" id="newmenu">
      <button id="newbtn" aria-haspopup="true">New</button>
      <div class="pop" role="menu">
        <button id="new-start" role="menuitem"><b>Start from the current tool</b><span>A copy of the Rev D tool this builder came with.</span></button>
        <button id="new-blank" role="menuitem"><b>Start from a blank tool</b><span>The same parts, with placeholder content.</span></button>
      </div>
    </div>
    <button id="openbtn" title="Open a saved project, or a tool this builder exported">Open</button>
    <input type="file" id="openfile" accept=".json,.html,.htm,application/json,text/html" style="display:none">
    <button id="saveproj" title="Save your work to a file you can open later">Save project</button>
    <span class="sep"></span>
    <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl+Y)">Redo</button>
    <span class="sep"></span>
    <button id="helpbtn" title="Open the help page">Help</button>
    <button id="export" class="pri" title="Download the finished tool as one HTML file">Export tool</button>
  </div>
</header>
<div class="banner" id="banner" role="status"></div>
<div class="mtabs"><button id="mt-edit" class="on">Edit</button><button id="mt-prev">Preview</button></div>
<main class="layout">
  <nav class="side" aria-label="Builder sections">
    <div class="lab">Sections</div>
    <div class="secs" id="secs"></div>
    <div class="probs" id="probs"></div>
  </nav>
  <section class="editor" id="editor" aria-label="Editor"></section>
  <section class="preview" aria-label="Live preview">
    <div class="pvbar">
      <span class="t">Live preview</span>
      <button id="pv-desk" class="on">Desktop</button>
      <button id="pv-phone">Phone</button>
      <button id="pv-rec" title="Show the text the tool will record for these answers" aria-pressed="false">Record</button>
      <button id="pv-reset" title="Clear the answers in the preview">Clear answers</button>
      <button id="pv-open" title="Open the preview in its own tab">Open in tab</button>
    </div>
    <div class="pvwrap" id="pvwrap"></div>
    <div class="pvrec" id="pvrec" aria-label="Record preview">
      <div class="pvrh"><span class="t">Record preview</span><span id="pvrs"></span></div>
      <pre id="pvrt"></pre>
    </div>
  </section>
</main>

var STARTER={"builder":"audit","version":1,"tool":{"id":"fca-pca-ci-selection","rev":"D","build":"2026-09-14","exportName":"fca-pca-ci-selection-tool_RevD_DRAFT","pageTitle":"FCA/PCA CI Selection","barTitle":"FCA/PCA CI Selection","barSub":"Configuration Management · Rev D draft","h1":"Designate this CI for audit?","lede":"CM answers every question here. CM answers from documentation. Where the documentation is unclear, the answer is open and CM escalates to the function that owns it.","docTitle":"FCA/PCA CI Selection Checklist","docSub":"Audit designation assessment. Complete one checklist per CI.","textTitle":"FCA/PCA CI SELECTION CHECKLIST","fileStem":"FCA-PCA-CI-Selection"},"meta":{"label":"Candidate CI","fields":[{"id":"ci","label":"CI"},{"id":"id","label":"CI identifier"},{"id":"prog","label":"Program"},{"id":"assessor","label":"Assessor and date"}],"nameField":"ci","authorField":"assessor","nameMsg":"Name the CI first."},"cards":[{"label":"How to answer","paras":"Read the documentation first. Each question names the documentation set the answer is derived from, and the function that owns it. The owning function supplies the documentation. It does not supply the answer.\nAn answer that has not been established from its source is not a NO. Mark it open, name the owner, set a date, and escalate. The assessment is not signed until every open answer resolves."},{"label":"When to run this assessment","paras":"Complete one assessment per CI at initial audit planning, at each CM-plan revision, and on any reassessment trigger. The reassessment triggers are a substantive design, process, facility, tooling, or supplier change, which is a safety management system management-of-change trigger; a new quality escape or safety event traceable to the CI; a CSA reconciliation anomaly; a hazard log revision adding a risk control to the CI; and a sub-supplier effectiveness determination of less than effective for a supplier building the CI. Record the result and rationale for every CI evaluated, designated for audit or not. Attach it to the Audit Designation Assessment Record."}],"answers":{"yes":"Yes","no":"No","open":"Open, not established"},"parts":[{"id":"a","name":"Part A · Mandatory designation","docName":"Part A. Mandatory designation","chip":"Part A: {yes} yes","threshold":1,"note":"Any yes designates the CI. Part B and Part C still run. They tell you whether the scope should grow.","lock":"designate","safety":false,"lockNote":"**Designation is mandatory here.** A Part A criterion was answered yes, so the contract, SOW, or CMP requires the audit. DO NOT DESIGNATE is not available. Revise the Part A answer if it was recorded in error.","blockNo":"A Part A criterion is yes. Designation is mandatory and cannot be dispositioned otherwise here.","blockType":""},{"id":"b","name":"Part B · Safety criticality","docName":"Part B. Safety criticality","chip":"Part B: {yes} yes","threshold":1,"note":"Any yes designates the CI for audit, for both an FCA and a PCA. There is no concurrence route around it.","lock":"both","safety":true,"lockNote":"**This disposition is set by the answers.** A Part B safety criterion was answered yes, so the CI is designated for both audits. DO NOT DESIGNATE is not available here and neither is a narrower scope. A proposal not to conduct one of these audits is dispositioned through the safety disposition gate, outside this assessment. Revise the Part B answer if it was recorded in error.","blockNo":"A Part B safety criterion is yes. The CI is designated for both audits and cannot be dispositioned otherwise here.","blockType":"A Part B safety criterion is yes. The audit type is both."},{"id":"c","name":"Part C · Risk factors","docName":"Part C. Risk factors","chip":"Part C: {yes} of {total} yes, {th} designate","threshold":2,"note":"Two yes answers designate the CI. One yes is recorded and monitored.","lock":"none","safety":false,"lockNote":"","blockNo":"","blockType":""}],"questions":[{"id":"A1","part":"a","tag":"A1 · Contract","text":"Is the CI identified in the contract, SOW, or CMP as requiring an FCA, a PCA, or both?","why":"Contract designation is the first source of audit designation. If the CI is contractually called out, designation for audit is mandatory. The remaining parts still run. They determine whether risk factors expand the audit scope.","doc":"The contract file, the SOW, and the program CMP","own":"Contracts","short":"Called out in the contract, SOW, or CMP as requiring an FCA, a PCA, or both","scopeTag":"","scopeText":"","scopePoint":""},{"id":"A2","part":"a","tag":"A2 · Baseline","text":"Is the CI an Acquirer-controlled CI whose product baseline the Acquirer will formalize at PCA completion?","why":"PCA completion is the event that formalizes the Product Baseline. For this CI the audit is the formalizing event, and no other event reaches it. Designation here is not a risk judgment.","doc":"The item index and its control designations","own":"CM, with Contracts","short":"Acquirer-controlled CI whose product baseline is formalized at PCA completion","scopeTag":"pca","scopeText":"Acquirer formalizes the product baseline at PCA completion","scopePoint":""},{"id":"B1","part":"b","tag":"B1 · Hazard controls","text":"Does the CI implement or host one or more hazard risk controls recorded in the safety management system hazard log?","why":"A CI carrying a hazard risk control is designated for audit, for both audits. Read the hazard log for controls allocated to this CI or to functions it hosts.","doc":"The safety management system hazard log, and the analyses behind it","own":"System Safety","short":"Implements or hosts hazard risk controls recorded in the hazard log","scopeTag":"both","scopeText":"","scopePoint":""},{"id":"B2","part":"b","tag":"B2 · Criterion (b)","text":"Is the CI a criterion-(b) CI, where failure might result in serious injury, loss of life, or loss of primary system capability?","why":"Criterion (b) of the CI identification process selection criteria. The answer is already recorded on the screen that made the item a CI. Consider both direct failure modes and cascading effects.","doc":"The CI selection record, criterion (b) of the CI Selection Criteria Checklist","own":"CM, with System Safety","short":"Criterion-(b) CI. Failure might cause serious injury, loss of life, or loss of primary capability","scopeTag":"both","scopeText":"","scopePoint":""},{"id":"B3","part":"b","tag":"B3 · Severity","text":"Is the severity of the CI’s credible failure consequence in the highest two severity categories of the program safety risk matrix?","why":"For example, catastrophic or hazardous, at matrix levels 4 and 5. Use the pre-anchored severity where the register of safety-mandatory CM requirements records one.","doc":"The program safety risk matrix, and the pre-anchored severity in the register of safety-mandatory CM requirements","own":"System Safety","short":"Credible failure consequence in the highest two severity categories, levels 4 and 5","scopeTag":"both","scopeText":"","scopePoint":""},{"id":"B4","part":"b","tag":"B4 · Software and firmware","text":"Is the CI safety-critical software, or firmware embedded in a safety-critical device?","why":"Includes CSCIs performing safety functions. Includes firmware whose host device is safety-critical, regardless of the firmware’s own function.","doc":"The software criticality assessment","own":"Software Engineering, with System Safety","short":"Safety-critical software, or firmware in a safety-critical device","scopeTag":"both","scopeText":"","scopePoint":""},{"id":"B5","part":"b","tag":"B5 · Single point of failure","text":"Is the CI a single-point-of-failure item for a safety-related function?","why":"No redundancy or alternate means exists. Failure of this one item defeats the safety-related function. Read the FMECA to see whether the item is associated with a safety-related function. If the FMECA is unclear, ask RM&SH.","doc":"The FMECA and the single point failure identification","own":"RM&SH","short":"Single point of failure for a safety-related function","scopeTag":"both","scopeText":"","scopePoint":""},{"id":"C1","part":"c","tag":"C1 · Design maturity","text":"Is the design new or novel rather than proven heritage?","why":"First-of-type, new technology, or unproven margins. Proven heritage is a claim about evidence, and the evidence is the fielded history of that design in that application. A design that is unchanged but has never flown in this environment is not heritage. It is a new application of an old drawing. Where the program has a certification basis, test the heritage claim against certification credit as well as against service history.","doc":"Design history, the released design definition, and the fielded evidence the heritage claim rests on. Where the program has a certification basis, also the certification basis, the previously approved data, and the certification credit position","own":"Systems Engineering and Design Engineering. Airworthiness and Certification where the program has a certification basis","short":"New or novel design rather than proven heritage","scopeTag":"fca","scopeText":"New or novel design rather than proven heritage","scopePoint":""},{"id":"C2","part":"c","tag":"C2 · Design change","text":"Has the CI undergone substantive design change since its last audit?","why":"A substantive design change is a safety management system management-of-change trigger. It is a reassessment trigger in its own right. Where the program has a certification basis, the change classification is the sharper test of substantive than the change count is.","doc":"The change records CM holds against the CI since the last audit date. Where the program has a certification basis, also the change classification","own":"CM holds the change records. Systems Engineering and Design Engineering for the technical content of each change. Airworthiness and Certification where the program has a certification basis","short":"Substantive design change since the last audit","scopeTag":"fca","scopeText":"Substantive design change since the last audit","scopePoint":""},{"id":"C3","part":"c","tag":"C3 · Manufacturing change","text":"Is there a new or changed manufacturing source, process, facility, or tooling for the CI?","why":"Transferred lines, new facilities, altered processes, and replacement tooling can break the as-designed to as-built correspondence that audits exist to verify.","doc":"Process and tooling change records, and the procurement record where the source moved","own":"Manufacturing, with Supplier Requirements Engineering","short":"New or changed manufacturing source, process, facility, or tooling","scopeTag":"pca","scopeText":"New or changed manufacturing source, process, facility, or tooling","scopePoint":""},{"id":"C4","part":"c","tag":"C4 · Sub-tier supplier","text":"Is there a new or changed sub-tier supplier for the CI or its critical components?","why":"Includes second-source qualification. Includes supplier substitutions at any tier feeding critical components.","doc":"Procurement records and the supplier classification log","own":"Supplier Requirements Engineering","short":"New or changed sub-tier supplier for the CI or its critical components","scopeTag":"pca","scopeText":"New or changed sub-tier supplier","scopePoint":""},{"id":"C5","part":"c","tag":"C5 · Quality history","text":"Does the CI or its production line have a history of quality escapes, nonconformances, FOD findings, or subcontractor disclosures?","why":"These are safety management system safety data sources. Read the data for the production line as well as for the CI. Findings against the line count even where they are not attributed to this specific CI.","doc":"Quality and safety data for the CI and for its production line","own":"Quality Assurance","short":"History of quality escapes, nonconformances, FOD findings, or subcontractor disclosures","scopeTag":"pca","scopeText":"Escape, nonconformance, FOD, or subcontractor disclosure history","scopePoint":""},{"id":"C6","part":"c","tag":"C6 · Work and data findings","text":"Have findings of work performed not in accordance with approved data, or of inaccurate, incomplete, or ambiguous manufacturing data, been recorded against the CI?","why":"These are safety management system safety data. The findings indicate that the released data, or its execution, cannot be relied on without audit verification.","doc":"Quality findings against the CI or its production line","own":"Quality Assurance","short":"Findings of work not per approved data, or of inaccurate, incomplete, or ambiguous manufacturing data","scopeTag":"pca","scopeText":"Findings of work not per approved data, or of defective manufacturing data","scopePoint":""},{"id":"C7","part":"c","tag":"C7 · CSA health","text":"Do CSA reconciliation health indicators show anomalies for the CI?","why":"As-designed to as-built delta aging, unincorporated-change backlog, or serial and effectivity discrepancies. These indicate that at-scale reconciliation may not be functioning for this CI. That is the condition audits exist to detect.","doc":"CSA reconciliation health indicators","own":"CM","short":"CSA reconciliation anomalies: delta aging, change backlog, or serial and effectivity discrepancies","scopeTag":"pca","scopeText":"CSA reconciliation health anomalies","scopePoint":""},{"id":"C8","part":"c","tag":"C8 · Audit history","text":"Has the CI never received an FCA or PCA, or does a prior audit have an open delta or unresolved action items?","why":"A never-audited CI has no verified baseline correspondence. An open delta or an unresolved RFA means the prior audit scope was never closed.","doc":"Audit records and the prior audit minutes","own":"CM","short":"Never audited, or a prior audit has an open delta or unresolved action items","scopeTag":"delta","scopeText":"Never audited, or a prior audit left an open delta","scopePoint":""},{"id":"C9","part":"c","tag":"C9 · Sub-supplier effectiveness","text":"Has a sub-supplier building this CI, or a critical component of it, been determined less than effective under the sub-supplier CM flowdown process?","why":"A determination of less than effective means the supplier CM process is not meeting the requirements imposed on it.","doc":"The supplier evaluation record maintained under the sub-supplier CM flowdown process","own":"CM","short":"Sub-supplier determined less than effective under the CM flowdown process","scopeTag":"pca","scopeText":"Sub-supplier determined less than effective","scopePoint":""}],"openVerdict":{"lab":"Not complete · {n} open","title":"Open answers remain","desc":"This assessment has {n} answer{s} that have not been established from a source. An answer that has not been established is not a NO. Escalate each one to the function that owns the documentation. The assessment is not signed until every open answer resolves.","tableTitle":"Open answers, escalate each one","next":"Escalate each open answer to the named owner\nRecord the source relied on once the answer is established\nDo not sign the assessment while any answer is open"},"verdicts":[{"key":"mandatory-safety","when":[[{"s":"yes:a","o":"gte","v":"1"},{"s":"yes:b","o":"gte","v":"1"}]],"lab":"Designate · Contract and safety","cls":"on","designating":true,"title":"Mandatory designation","desc":"Part A criteria are met. Designate this CI per the contract scope. A Part B safety criterion is also met, and that designates the CI for both an FCA and a PCA regardless of what the contract names. Contract scope is a minimum, not a ceiling, and the expansion is recorded with its rationale.","desc2":"","tables":[{"part":"a","label":"Part A, mandatory criteria met"},{"part":"b","label":"Part B, safety factors triggered"},{"part":"c","label":"Part C, risk factors triggered"}],"next":"Record the assessment and the source relied on for every answer, and attach it to the Audit Designation Assessment Record\nMark the Disposition block per contract scope. A Part B yes designates both audits, so the scope cannot be less than both\nIf the Acquirer will formalize the product baseline under A2, schedule the PCA as the formalizing event\nEnter the CI in the audit plan and data package. Carry the nomenclature, the specification numbers, and the CI identifiers\nObtain CM and Systems Engineering signature\nRe-run this checklist on any reassessment trigger and at each CM-plan revision","rat":"Designated. Part A applies.\n{met:a}\nA Part B safety criterion also applies, which designates both an FCA and a PCA regardless of contract scope.\n{met:b}\n{met:c}\n{scope}"},{"key":"mandatory-risk","when":[[{"s":"yes:a","o":"gte","v":"1"},{"s":"yes:c","o":"gte","v":"1"}]],"lab":"Designate · Contract scope","cls":"on","designating":true,"title":"Mandatory designation","desc":"Part A criteria are met. Designate this CI per the contract scope. Risk factors were also triggered. Assess whether they expand the audit scope, for example a delta audit of open scope or an earlier increment. Contract designation sets a minimum on scope, not a ceiling.","desc2":"","tables":[{"part":"a","label":"Part A, mandatory criteria met"},{"part":"b","label":"Part B, safety factors triggered"},{"part":"c","label":"Part C, risk factors triggered"}],"next":"Record the assessment and the source relied on for every answer, and attach it to the Audit Designation Assessment Record\nMark the Disposition block per contract scope, and evaluate scope expansion against the triggered risk factors\nIf the Acquirer will formalize the product baseline under A2, schedule the PCA as the formalizing event\nEnter the CI in the audit plan and data package. Carry the nomenclature, the specification numbers, and the CI identifiers\nObtain CM and Systems Engineering signature\nRe-run this checklist on any reassessment trigger and at each CM-plan revision","rat":"Designated. Part A applies.\n{met:a}\nRisk factors were also triggered. Assess scope expansion.\n{met:b}\n{met:c}\n{scope}"},{"key":"mandatory","when":[[{"s":"yes:a","o":"gte","v":"1"}]],"lab":"Designate · Contract scope","cls":"on","designating":true,"title":"Mandatory designation","desc":"Part A criteria are met. Designate this CI per the contract scope. No additional risk factors were triggered. The contractually defined audit scope applies.","desc2":"","tables":[{"part":"a","label":"Part A, mandatory criteria met"},{"part":"b","label":"Part B, safety factors triggered"},{"part":"c","label":"Part C, risk factors triggered"}],"next":"Record the assessment and the source relied on for every answer, and attach it to the Audit Designation Assessment Record\nMark the Disposition block per contract scope\nIf the Acquirer will formalize the product baseline under A2, schedule the PCA as the formalizing event\nEnter the CI in the audit plan and data package. Carry the nomenclature, the specification numbers, and the CI identifiers\nObtain CM and Systems Engineering signature\nRe-run this checklist on any reassessment trigger and at each CM-plan revision","rat":"Designated. Part A applies.\n{met:a}\n{met:b}\n{met:c}\n{scope}"},{"key":"safety","when":[[{"s":"yes:b","o":"gte","v":"1"}]],"lab":"Designate · Safety criticality","cls":"on","designating":true,"title":"Designate for both audits","desc":"One or more Part B safety-criticality criteria are met. The CI is designated for audit, for both an FCA and a PCA. There is no risk factor threshold to reach and no concurrence route by which that designation is set aside.","desc2":"Conducting the FCA and conducting the PCA are entries in the register of safety-mandatory CM requirements. A proposal not to conduct an audit this CI is designated for goes to the safety disposition gate: performed, replaced with an independently validated equivalent control, or formally risk-accepted at the authority matching the recorded severity. System Safety signs this assessment. System Safety does not concur in the omission.","tables":[{"part":"b","label":"Part B, safety factors triggered"},{"part":"c","label":"Part C, risk factors triggered"}],"next":"Record the assessment and the source relied on for every answer, and attach it to the Audit Designation Assessment Record\nMark the Disposition block. The audit type is both, and it is set for you\nIf the audit is internally initiated, tailor the ceremony and not the substance. Perform the safety-mandatory reconciliation, the traceability matrix, and the as-built examination in full\nRoute any findings affecting hazard risk controls per the safety management system standard\nObtain CM and Systems Engineering signature\nRe-run this checklist on any reassessment trigger and at each CM-plan revision","rat":"Designated for both an FCA and a PCA. Part B applies. A safety criticality criterion designates the CI for audit; the designation is not subject to concurrence.\n{met:b}\n{met:c}\n{scope}"},{"key":"risk","when":[[{"s":"yes:c","o":"gte","v":"2"}]],"lab":"Designate · Risk based","cls":"on","designating":true,"title":"Designate for FCA or PCA","desc":"Two or more Part C risk factors are met, {yes:c} of {total:c}. Designate the CI for audit, or document the rationale for not designating and have CM and Systems Engineering sign it.","desc2":"","tables":[{"part":"c","label":"Part C, risk factors triggered"}],"next":"Record the assessment and the source relied on for every answer, and attach it to the Audit Designation Assessment Record\nMark the Disposition block. Read the recommended scope above and select FCA, PCA, both, or a delta audit of open scope\nIf electing not to designate despite the triggered factors, document the rationale in the Disposition block and obtain CM and Systems Engineering signature\nIf the audit is internally initiated, tailor the ceremony and not the substance. Perform the safety-mandatory reconciliation, the traceability matrix, and the as-built examination in full\nRe-run this checklist on any reassessment trigger and at each CM-plan revision","rat":"Designated. {yes:c} Part C risk factors apply, and two or more designate the CI.\n{met:b}\n{met:c}\n{scope}"},{"key":"below","when":[[{"s":"yes:c","o":"gte","v":"1"}]],"lab":"Below threshold · Record and monitor","cls":"on hold","designating":false,"title":"Designation not required","desc":"Only one Part C risk factor is met. That is below the two-factor designation threshold, and no Part A or Part B criteria were triggered. Designation is not required.","desc2":"Record the triggered factor and monitor it. That is the point of recording it. A second factor at any reassessment trigger then lands on a documented first factor rather than in an empty file.","tables":[{"part":"c","label":"Part C, risk factor triggered"}],"next":"Record the assessment and the rationale on the checklist. This is required for every CI evaluated, designated or not\nMark the Disposition block: DO NOT DESIGNATE\nMonitor the triggered factor. Re-run this checklist on any reassessment trigger\nObtain CM and Systems Engineering signature","rat":"Not designated. One Part C risk factor applies, which is below the two-factor threshold. The factor is recorded and monitored.\n{met:b}\n{met:c}"},{"key":"none","when":[],"lab":"Do not designate","cls":"","designating":false,"title":"No audit designation","desc":"No Part A, Part B, or Part C criteria are met. The CI is not designated for FCA or PCA at this time. Record the assessment anyway. The process requires a documented rationale for every CI evaluated, designated or not.","desc2":"A CI not designated for audit is not an unverified CI. It retains its baselines, its change control, its status accounting, and its coverage by the as-designed to as-built reconciliation performed at scale. The audit is a periodic check on that machinery rather than a substitute for it.","tables":[],"next":"Record the assessment and the rationale on the checklist and attach it to the Audit Designation Assessment Record\nMark the Disposition block: DO NOT DESIGNATE\nRe-run this checklist on any reassessment trigger: a design, process, facility, tooling, or supplier change, a quality escape or safety event, a CSA anomaly, or a hazard log revision adding a risk control to the CI\nObtain CM and Systems Engineering signature","rat":"Not designated. No Part A, Part B, or Part C criterion applies.\n{met:b}\n{met:c}"}],"scope":{"labels":{"both":"FCA and PCA","fca":"FCA only","pca":"PCA only","none":"Set by contract scope"},"rules":[{"when":[[{"s":"yes:b","o":"gte","v":"1"}]],"type":"both","locked":true,"why":"Any Part B yes designates the CI for both audits. A hazard risk control is verified in the design by the FCA and confirmed in the article by the PCA. Both assurances are required, and neither substitutes for the other."},{"when":[[{"s":"a:A1","o":"is","v":"yes"},{"s":"a:A2","o":"is","v":"yes"}]],"type":"","locked":false,"why":"Part A sets the scope. Designate for the audits the contract, SOW, or CMP names. A2 is also yes, so the scope is a PCA at minimum: successful PCA completion is the event that formalizes the product baseline, and no other event reaches it. Contract scope is a minimum, not a ceiling: the risk factors below may expand it, and the expansion is recorded with its rationale."},{"when":[[{"s":"a:A1","o":"is","v":"yes"},{"s":"tag:fca","o":"gte","v":"1"}],[{"s":"a:A1","o":"is","v":"yes"},{"s":"tag:pca","o":"gte","v":"1"}],[{"s":"a:A1","o":"is","v":"yes"},{"s":"tag:delta","o":"gte","v":"1"}]],"type":"","locked":false,"why":"Part A sets the scope. Designate for the audits the contract, SOW, or CMP names. Contract scope is a minimum, not a ceiling: the risk factors below may expand it, and the expansion is recorded with its rationale."},{"when":[[{"s":"a:A1","o":"is","v":"yes"}]],"type":"","locked":false,"why":"Part A sets the scope. Designate for the audits the contract, SOW, or CMP names. Contract scope is a minimum, not a ceiling. No risk factor was triggered that would expand it."},{"when":[[{"s":"a:A2","o":"is","v":"yes"},{"s":"tag:fca","o":"gte","v":"1"}],[{"s":"a:A2","o":"is","v":"yes"},{"s":"tag:delta","o":"gte","v":"1"}]],"type":"pca","locked":false,"why":"A2 is yes. Successful PCA completion is the event that formalizes the product baseline, and no other event reaches it, so the scope is a PCA at minimum. Designation here is not a risk judgment. It follows from what the PCA does. Factors bearing on verification were also triggered, so assess whether an FCA belongs in the scope as well."},{"when":[[{"s":"a:A2","o":"is","v":"yes"}]],"type":"pca","locked":false,"why":"A2 is yes. Successful PCA completion is the event that formalizes the product baseline, and no other event reaches it, so the scope is a PCA at minimum. Designation here is not a risk judgment. It follows from what the PCA does."},{"when":[[{"s":"tag:delta","o":"gte","v":"1"}]],"type":"both","locked":false,"why":"C8 was answered yes. Where the CI has never been audited, neither question has been established for it and there is no evidence on which to narrow the scope, so designate both. Where the only C8 condition is an open delta or an unresolved action from a prior audit, the scope is a delta audit of that open scope, of the audit type that left it open."},{"when":[[{"s":"tag:fca","o":"gte","v":"1"},{"s":"tag:pca","o":"gte","v":"1"}]],"type":"both","locked":false,"why":"Factors sit on both questions. The design factors reopen verification and the production factors reopen the as-built comparison."},{"when":[[{"s":"tag:pca","o":"gte","v":"1"}]],"type":"pca","locked":false,"why":"Every factor triggered bears on how the article is produced or recorded. Nothing reopens the question of whether the design meets its requirements. Valid as a PCA on its own only where the CI is already validated by a completed FCA, by an earlier increment, or by an Acquirer-accepted equivalent. Where it is not, designate both."},{"when":[[{"s":"tag:fca","o":"gte","v":"1"},{"s":"a:C2","o":"is","v":"yes"}]],"type":"fca","locked":false,"why":"Every factor triggered bears on whether the design meets its requirements. Nothing points at manufacture, sources, or records. Where the design change is embodied in the article or the code, add a PCA, because an embodied change also reopens the as-built comparison."},{"when":[[{"s":"tag:fca","o":"gte","v":"1"}]],"type":"fca","locked":false,"why":"Every factor triggered bears on whether the design meets its requirements. Nothing points at manufacture, sources, or records."}]},"safetyBanner":{"title":"System Safety signature required.","text":"{n} safety question{s} {were} answered yes. System Safety signs this assessment. The designation itself is not open to concurrence: a Part B yes designates the CI for both audits, and a proposal not to conduct one of them goes to the safety disposition gate."},"sigs":[{"name":"CM","filled":true,"note":"","noteSafety":"","textNote":"","textNoteSafety":""},{"name":"Systems Engineering","filled":false,"note":"","noteSafety":"","textNote":"","textNoteSafety":""},{"name":"System Safety","filled":false,"note":"Required if any safety criticality criterion is yes.","noteSafety":"Required. A safety question was answered yes. Signature confirms the technical basis, not the designation.","textNote":"required if any safety criterion is yes","textNoteSafety":"required, a safety question was answered yes; signature confirms the technical basis, not the designation"}],"labels":{"actNote":"A saved file spares you retyping. It is not the record, and it is not a tracked action. An open answer is an assigned action with an owner and a date, and it belongs in whatever tracks those.","openBox":"This answer is not established. Name the owner and a date. The assessment is not signed until it resolves.","deriveFrom":"Derive from","ifUnclear":"If unclear, ask","sourceLabel":"Source relied on","sourcePh":"Name the document, revision, or record that established this answer","nextHeading":"Recommended next steps","scopeHeading":"Recommended scope: {label}","scopeBasis":"Audit scope basis","dispLabel":"Disposition","desYes":"DESIGNATE","desNo":"DO NOT DESIGNATE","typeLabel":"Audit type","fca":"FCA","pca":"PCA","both":"Both","delta":"Delta audit of open scope","internal":"Internally initiated. Internal co-chair and certification","internalText":"internally initiated, internal co-chair and certification","internalNote":"Ceremony only. The safety-mandatory reconciliation, the traceability matrix, and the as-built examination are performed in full.","pcaOnlyNote":"A PCA on its own is valid only where the CI is already validated by a completed FCA. Where it is not, select Both.","typeMsg":"Select the audit type: FCA, PCA, or both.","cmDetLabel":"CM determination","cmLabel":"CM","dispSigLead":"The downloaded record carries signature blocks for Systems Engineering and for System Safety. Those functions sign the record itself.","dispSigYes":"**System Safety must sign this one.** {n} safety question{s} {were} answered yes.","dispSigNo":"System Safety signs only where a safety question is answered yes.","dispSigTail":"A concurrence signature confirms that the technical basis is sound. It does not make the determination. The determination is CM’s.","metLine":"Meets {id}: {text}","sourceIn":" Source: {x}","dlButton":"Download the assessment as Word","dlInterim":"Download the interim record","interimTitle":"INTERIM ASSESSMENT. NOT A DISPOSITION.","interimSub":"This is a working record of an assessment in progress. It carries no disposition and no signatures. Do not file it as the Audit Designation Assessment Record.","interimEnd":"No disposition is recorded. The assessment is not complete and is not signed.","interimTail":"Reopen the saved assessment file to continue. Attach the completed checklist to the Audit Designation Assessment Record once every answer is established.","openDocHeading":"Open answers. Escalate each one.","docIntro":"CM answers every question. CM derives each answer from the documentation set named for it, and records the source relied on. An answer that has not been established from its source is not a NO.","reassessHeading":"Part D. Reassessment triggers","reassessText":"Re-run this checklist for the CI upon any of the following. A substantive design, process, facility, tooling, or supplier change, which is a safety management system management-of-change trigger. A new quality escape or safety event traceable to the CI. A CSA reconciliation anomaly. A hazard log revision adding a risk control to the CI. A CM-plan revision. A sub-supplier effectiveness determination of less than effective for a supplier building the CI.","docSafetyPara":"A safety question was answered yes. The CI is designated for both an FCA and a PCA, and that designation is not subject to concurrence. System Safety signs this assessment. A proposal not to conduct an audit the CI is designated for is dispositioned through the safety disposition gate.","sigHeading":"Signatures","sigIntro":"A concurrence signature confirms that the technical basis is sound. It does not make the determination. The determination is CM’s.","docClosing":"Attach this completed checklist to the Audit Designation Assessment Record. Retained for the program life, for every CI evaluated, designated for audit or not.","textClosing":"Attach to the Audit Designation Assessment Record. Retained for the program life.","oldRevMsg":"written by rev {rev} of this tool. Rev D makes a Part B yes an absolute designation for both audits. Check the answers and the disposition"},"notes":{"heading":"General Notes","paras":[{"style":"normal","text":"**CM answers. The functions supply.** CM derives every answer from a documentation set and records the source relied on. Systems Engineering and Design Engineering jointly supply the design history and the released design definition, and author the technical content of each engineering change. Airworthiness and Certification supplies the certification basis, the previously approved data, and the change classification where the program has a certification basis. System Safety supplies the hazard log, the safety analyses, and the severities. RM&SH owns and supplies the FMECA and the single point failure identification. Quality supplies the escape, nonconformance, and foreign object findings. Supplier Requirements Engineering supplies the procurement records and the supplier classification log. CM supplies the item index, the change records against the CI since its last audit, the CSA reconciliation indicators, the prior audit records, and the supplier effectiveness determinations."},{"style":"normal","text":"**Escalate on unclear documentation.** CM opens the FMECA to see whether the item is associated with a safety-related function. If the FMECA answers, that is the answer and the FMECA is the source. If the FMECA is unclear, CM asks RM&SH. That order holds for all sixteen questions."},{"style":"pull","text":"A no that means nobody checked is the most expensive answer on the form. It reads exactly like a no that somebody established, and only one of them is true."},{"style":"normal","text":"**Signatures confirm. They do not determine.** CM and Systems Engineering sign. System Safety signs whenever any safety question was answered yes. A concurrence signature confirms that the technical basis is sound. The determination is CM's."},{"style":"normal","text":"**Audit scope.** Designation says whether the CI is audited. Scope says which audit. Both are read from the same answers. The FCA asks whether the design was verified against its requirements. The PCA asks whether the unit conforms to its product definition. An answer that raises doubt about verification points to an FCA. An answer that raises doubt about manufacture, sources, or records points to a PCA. The tool recommends a scope from the answers. The recommendation is not a substitute for the contract, which sets a minimum that the assessment may expand and may not reduce."},{"style":"normal","text":"**A PCA on its own needs a completed FCA.** A PCA does not begin unless the corresponding FCA has been successfully completed or is being conducted concurrently, because the PCA examines the as-built configuration of a validated CI. Where the CI has never been validated and the answers point to a PCA, designate both."},{"style":"normal","text":"**Part A is contractual.** A contract, SOW, or CMP call-out makes designation mandatory. Part B and Part C still run. Contract designation sets a minimum on scope, not a ceiling. Stopping at Part A is the most common error on this assessment."},{"style":"normal","text":"**Part B is absolute.** Any yes in Part B designates the CI for audit, for both an FCA and a PCA. There is no risk factor threshold to reach and no concurrence route by which that designation is set aside. Conducting the FCA and conducting the PCA are themselves entries in the register of safety-mandatory CM requirements, so a proposal not to conduct an audit the CI is designated for goes to the safety disposition gate: performed, replaced with an independently validated equivalent control, or formally risk-accepted at the authority matching the recorded severity. System Safety signs the assessment. System Safety does not concur in the omission."},{"style":"normal","text":"**Part C is cumulative.** One risk factor is recorded and monitored. Two risk factors designate the CI, or the program documents the rationale and CM and Systems Engineering sign it."},{"style":"normal","text":"**Ceremony versus substance.** An internally initiated audit may tailor the ceremony. It may not tailor the substance. The safety-mandatory reconciliation, the traceability matrix, and the as-built examination are performed in full."},{"style":"normal","text":"**Glossary.** CSA is Configuration Status Accounting. PBL is the Product Baseline. FMECA is the Failure Modes, Effects, and Criticality Analysis. FOD is Foreign Object Debris. RFA is a Request for Action. CSCI is a Computer Software Configuration Item. RM&SH is Reliability, Maintainability, Safety, and Health."}]},"footer":{"paras":[{"text":"**Reference.** Configuration Audit Process (FCA/PCA), §5.2.1 Audit Designation, and Appendix C, the FCA/PCA CI Selection Checklist."},{"text":"This tool is a decision aid. It does not substitute for engineering judgment, the safety disposition gate, or contractual requirements."},{"text":"**Record the assessment for every CI evaluated, designated or not.** Attach the completed assessment to the Audit Designation Assessment Record. Retained for the program life."},{"text":"Nothing is saved here. Print or transcribe the result before you close the tab. Process document number and revision: `[to be assigned]`"}]}};
/* Builds a standalone tool file from its parts. Used by the builder and by the build script. */
function assembleTool(parts, def, preview){
  function safe(s){ return String(s).replace(/<\/(script)/gi,'<\\/$1').replace(/<!--/g,'<\\!--'); }
  var json=JSON.stringify(def,null,1).replace(/</g,'\\u003c');
  var t=(def.tool&&(def.tool.pageTitle||def.tool.barTitle))||'Tool';
  t=String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'+
    '<meta name="viewport" content="width=device-width, initial-scale=1">\n'+
    '<meta name="generator" content="Tool Builder: '+def.builder+'">\n'+
    '<title>'+t+'</title>\n<style>\n'+parts.css+'\n</style>\n</head>\n<body>\n<div id="app"></div>\n'+
    '<!-- The tool definition. The builder reads this block to reopen the tool for editing. -->\n'+
    '<script type="application/json" id="tool-def">\n'+json+'\n<\/script>\n'+
    (preview?'<script>window.TOOL_PREVIEW=1;<\/script>\n':'')+
    '<script>\n'+safe(parts.runtime)+'\n'+safe(parts.engine)+'\n<\/script>\n</body>\n</html>\n';
}
if(typeof module!=='undefined') module.exports={assembleTool:assembleTool};

/* ================= Tool Builder core. Shared by the three builders. =================
   FAMILY   : the builder description (sections, subjects, rename, validate, blank)
   STARTER  : the definition that reproduces the current tool
   PARTS    : {css, runtime, engine} for the generated tool
*/
var DEF=clone(STARTER);
var CUR='start';
var OPEN=new WeakSet();
var DIRTY=false, HIST=[], HPOS=-1, commitT=null, pvT=null, lastPvState=null;
var LSKEY=null;

function clone(o){return JSON.parse(JSON.stringify(o));}
function $(id){return document.getElementById(id);}
function el(tag,attrs,kids){
  var e=document.createElement(tag);
  if(attrs) for(var k in attrs){
    var v=attrs[k];
    if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='text') e.textContent=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else if(k==='value') e.value=v;
    else if(k==='checked') e.checked=!!v;
    else e.setAttribute(k,v===true?'':v);
  }
  (kids||[]).forEach(function(c){ if(c==null) return; e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}
function escH(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function asArr(x){return Array.isArray(x)?x:[];}
function opts(o,item){ return typeof o==='function'?o(DEF,item):(o||[]); }
function slugF(s){return String(s||'tool').replace(/[^A-Za-z0-9._-]+/g,'-').replace(/^-|-$/g,'').slice(0,80)||'tool';}

/* ---------------- history and autosave ---------------- */
function snapshot(){ return JSON.stringify(DEF); }
function pushHist(){
  var s=snapshot();
  if(HPOS>=0&&HIST[HPOS]===s) return;
  HIST=HIST.slice(0,HPOS+1); HIST.push(s); if(HIST.length>150) HIST.shift(); HPOS=HIST.length-1;
  undoState();
  if(LSKEY){ try{ localStorage.setItem(LSKEY,JSON.stringify({saved:new Date().toISOString(),def:DEF})); }catch(e){} }
}
function commit(now){
  DIRTY=true;
  clearTimeout(commitT);
  if(now) pushHist(); else commitT=setTimeout(pushHist,500);
  schedulePreview(); checkProblems();
}
function undoState(){ $('undo').disabled=HPOS<=0; $('redo').disabled=HPOS>=HIST.length-1; }
function undo(){ DIRTY=true; clearTimeout(commitT); pushHist(); if(HPOS<=0) return; HPOS--; DEF=JSON.parse(HIST[HPOS]); afterLoad(); undoState(); toast('Undone.'); }
function redo(){ DIRTY=true; if(HPOS>=HIST.length-1) return; HPOS++; DEF=JSON.parse(HIST[HPOS]); afterLoad(); undoState(); toast('Redone.'); }
function afterLoad(){
  OPEN=new WeakSet();
  if(LSKEY){ try{ localStorage.setItem(LSKEY,JSON.stringify({saved:new Date().toISOString(),def:DEF})); }catch(e){} }
  renderNav(); renderSection(); schedulePreview(true); checkProblems();
}
function loadDef(d,msg){
  DEF=d; HIST=[]; HPOS=-1; pushHist(); afterLoad(); if(msg) banner(msg,'good');
}

/* ---------------- banners and toasts ---------------- */
function banner(html,kind,buttons){

  (buttons||[]).forEach(function(x){ b.appendChild(el('button',{text:x[0],onclick:function(){ x[1](); }})); });
  b.appendChild(el('button',{class:'x',title:'Dismiss','aria-label':'Dismiss',text:'×',onclick:function(){b.className='banner';}}));
}
function hideBanner(){ $('banner').className='banner'; }
var toastT=null;
function toast(msg,undoBtn){
  var t=$('toast'); t.innerHTML=''; t.appendChild(el('span',{text:msg}));
  if(undoBtn) t.appendChild(el('button',{text:'Undo',onclick:function(){undo();t.className='toast';}}));
  t.className='toast on'; clearTimeout(toastT); toastT=setTimeout(function(){t.className='toast';},undoBtn?5000:2200);
}

/* ---------------- navigation ---------------- */
function renderNav(){
  var probs=problems(), bySec={};
  probs.forEach(function(p){bySec[p.sec]=(bySec[p.sec]||0)+1;});
  var box=$('secs'); box.innerHTML='';
  FAMILY.sections.forEach(function(s,i){
    box.appendChild(el('button',{class:'sec'+(s.id===CUR?' on':''),onclick:function(){go(s.id);}},[
      el('span',{class:'n',text:i?String(i):'•'}), el('span',{text:s.title}),
      bySec[s.id]?el('span',{class:'bad',text:'!'+bySec[s.id]}):null
    ]));
  });
}
function go(id,focusItem){
  CUR=id; renderNav(); renderSection(focusItem);

  syncMtabs();

function section(){ return FAMILY.sections.filter(function(s){return s.id===CUR;})[0]||FAMILY.sections[0]; }
function renderSection(){
  var s=section(), ed=$('editor'); ed.innerHTML='';
  ed.appendChild(el('h2',{text:s.title}));
  if(s.id==='start') ed.appendChild(el('div',{class:'start-cta'},[
    el('p',{html:'<b>New here?</b> The help page walks through the screen, the first ten minutes, and the common tasks. The live preview sits to the right'+(window.innerWidth<=960?', behind the <b>Preview</b> tab':'')+'.'}),
    el('button',{text:'Open the help page',onclick:function(){openHelp();}})]));

  if(s.html) ed.appendChild(el('div',{html:typeof s.html==='function'?s.html():s.html}));
  renderFields(ed,s.fields||[],DEF);

/* ---------------- field rendering ---------------- */
function getK(obj,k){ if(!k) return obj; var p=k.split('.'),o=obj; for(var i=0;i<p.length;i++){ if(o==null) return undefined; o=o[p[i]]; } return o; }
function setK(obj,k,v){ var p=k.split('.'),o=obj; for(var i=0;i<p.length-1;i++){ if(o[p[i]]==null||typeof o[p[i]]!=='object') o[p[i]]={}; o=o[p[i]]; } o[p[p.length-1]]=v; }
function helpEl(h){ return h?el('div',{class:'help',html:h}):null; }
var ALT_HELP='Used when the <b>Alternate wording</b> condition holds. Leave blank to keep the normal text.';
function autosize(t){ t.style.height='auto'; t.style.height=Math.min(Math.max(t.scrollHeight+2,38),420)+'px'; }

function renderFields(host,fields,obj,ctx){
  fields.forEach(function(f){
    if(f.show && !f.show(obj,DEF)) return;
    var n=FIELD[f.t]; if(!n){ host.appendChild(el('div',{text:'Unknown field '+f.t})); return; }
    host.appendChild(n(f,obj,ctx||{}));
  });
}
var FIELD={};
FIELD.info=function(f){ return el('div',{class:'help-card',html:typeof f.html==='function'?f.html(DEF):f.html}); };

FIELD.group=function(f,obj,ctx){

/* lists of objects */
FIELD.list=function(f,obj,ctx){
  var list=getK(obj,f.k); if(!Array.isArray(list)){ list=[]; setK(obj,f.k,list); }
  var wrap=el('div',{class:'lst'});
  var cnt=el('span',{class:'cnt',text:String(list.length)});
  wrap.appendChild(el('div',{class:'lh'},[el('span',{class:'flab',text:f.label}),cnt]));
  if(f.help) wrap.appendChild(el('div',{class:'help',html:f.help}));
  var body=el('div'); wrap.appendChild(body);
  function draw(){
    body.innerHTML=''; cnt.textContent=String(list.length);
    list.forEach(function(item,i){
      var isObj=item&&typeof item==='object';
      var sm=el('span',{class:'sm'});
      function sum(){ var s=f.sum?f.sum(item,i,DEF):(isObj?JSON.stringify(item).slice(0,80):String(item));
        if(Array.isArray(s)){ sm.innerHTML='<b>'+escH(s[0])+'</b>'+escH(s[1]); } else sm.textContent=s||'(empty)'; }
      sum();
      var it=el('div',{class:'it'+(OPEN.has(item)?' open':'')});
      function btn(txt,title,fn,cls){ return el('button',{class:'ib'+(cls?' '+cls:''),title:title,'aria-label':title,text:txt,onclick:function(e){e.stopPropagation();fn();}}); }
      var head=el('div',{class:'ih',onclick:function(){ if(OPEN.has(item)) OPEN.delete(item); else OPEN.add(item); it.classList.toggle('open'); if(it.classList.contains('open')&&!bodyBuilt){buildBody();} }},[
        el('span',{class:'tw',text:'▶'}), sm,
        btn('↑','Move up',function(){ if(i>0){ list.splice(i-1,0,list.splice(i,1)[0]); commit(true); draw(); } }),
        btn('↓','Move down',function(){ if(i<list.length-1){ list.splice(i+1,0,list.splice(i,1)[0]); commit(true); draw(); } }),
        btn('⧉','Duplicate',function(){ var c=clone(item); if(f.onDup) f.onDup(c,list,DEF); list.splice(i+1,0,c); OPEN.add(c); commit(true); draw(); }),
        btn('✕','Delete',function(){ list.splice(i,1); commit(true); draw(); toast('Deleted.',true); },'del')
      ]);
      it.appendChild(head);
      var ib=el('div',{class:'ib2'}), bodyBuilt=false;
      function buildBody(){ bodyBuilt=true; ib.innerHTML='';
        if(isObj) renderFields(ib,f.item,item,ctx);
        it.addEventListener('input',function(){sum();});
        it.addEventListener('change',function(){sum();});
      }
      if(OPEN.has(item)) buildBody();
      it.appendChild(ib);
      body.appendChild(it);
    });
  }
  draw();
  wrap.appendChild(el('button',{class:'add',text:'+ '+(f.addLabel||'Add'),onclick:function(){
    var n=f.add?f.add(DEF,list):{}; list.push(n); OPEN.add(n); commit(true); draw();
    var last=body.lastChild; if(last){ last.classList.add('flash'); var i=last.querySelector('input,textarea'); if(i) i.focus(); }
  }}));
  return wrap;
};

/* conditions */
var OPS={
  choice:[['is','is'],['not','is not'],['set','is answered'],['unset','is not answered']],
  number:[['gte','is at least'],['lte','is at most'],['eq','is exactly']],
  verdict:[['is','is'],['not','is not'],['set','has a result'],['unset','has no result']]
};
FIELD.cond=function(f,obj){
  var wrap=el('div',{class:'f'});
  wrap.appendChild(el('span',{class:'flab',text:f.label||'Applies when'}));
  var box=el('div',{class:'cond'}); wrap.appendChild(box);
  if(f.help) wrap.appendChild(helpEl(f.help));
  function C(){ var c=getK(obj,f.k); if(!Array.isArray(c)){ c=[]; setK(obj,f.k,c);} return c; }
  var SUB=FAMILY.subjects(DEF,f.ctx||'', obj);
  var SMAP={}; SUB.forEach(function(s){SMAP[s.id]=s;});
  function draw(){
    box.innerHTML='';
    var c=C();
    if(!c.length) box.appendChild(el('div',{class:'always',text:f.emptyText||'Always applies. Add a condition to narrow it.'}));
    c.forEach(function(g,gi){
      if(gi) box.appendChild(el('div',{class:'cor',text:'or'}));
      var gd=el('div',{class:'cg'},[el('div',{class:'cgh',text:'All of these are true'})]);
      g.forEach(function(r,ri){
        var s=SMAP[r.s];
        var ss=el('select',{class:'subj'+(s?'':' miss'),'aria-label':'Subject'});
        var groups={};
        SUB.forEach(function(x){ var gname=x.group||'Answers';
          if(!groups[gname]){ groups[gname]=el('optgroup',{label:gname}); ss.appendChild(groups[gname]); }
          groups[gname].appendChild(el('option',{value:x.id,text:x.label})); });
        if(!s) ss.insertBefore(el('option',{value:r.s,text:'(missing) '+r.s}),ss.firstChild);
        ss.value=r.s;
        ss.addEventListener('change',function(){ r.s=ss.value; var ns=SMAP[r.s]; fixRow(r,ns); commit(true); draw(); });
        var kind=s?s.kind:'choice';
        var os=el('select',{class:'op','aria-label':'Test'});
        (OPS[kind]||OPS.choice).forEach(function(o){ os.appendChild(el('option',{value:o[0],text:o[1]})); });
        if(!(OPS[kind]||OPS.choice).some(function(o){return o[0]===r.o;})) os.insertBefore(el('option',{value:r.o,text:r.o}),os.firstChild);
        os.value=r.o;
        os.addEventListener('change',function(){ r.o=os.value; commit(true); draw(); });
        var val=null;
        if(r.o!=='set'&&r.o!=='unset'){
          if(kind==='number'){
            val=el('input',{type:'number',class:'val',value:r.v,'aria-label':'Value'});
            val.addEventListener('input',function(){ r.v=val.value; commit(); });
          } else {
            val=el('select',{class:'val','aria-label':'Value'});
            var vs=s?s.values||[]:[], ok=false;
            vs.forEach(function(x){ if(String(x[0])===String(r.v)) ok=true; val.appendChild(el('option',{value:x[0],text:x[1]})); });
            if(!ok){ val.insertBefore(el('option',{value:r.v,text:r.v===''?'(choose)':'(missing) '+r.v}),val.firstChild); val.classList.add(r.v===''?'x':'miss'); }
            val.value=r.v;
            val.addEventListener('change',function(){ r.v=val.value; commit(true); draw(); });
          }
        }
        var rm=el('button',{class:'rm',title:'Remove this condition','aria-label':'Remove this condition',text:'✕',onclick:function(){
          g.splice(ri,1); if(!g.length) c.splice(gi,1); commit(true); draw(); }});
        gd.appendChild(el('div',{class:'cr'},[ss,os,val,rm]));
      });
      gd.appendChild(el('button',{class:'cbtn',text:'+ And',onclick:function(){ g.push(newRow()); commit(true); draw(); }}));
      box.appendChild(gd);
    });
    box.appendChild(el('div',{},[
      el('button',{class:'cbtn',text:c.length?'+ Or another set':'+ Add a condition',onclick:function(){ c.push([newRow()]); commit(true); draw(); }})
    ]));
  }
  function newRow(){ var s=SUB[0]||{id:'',kind:'choice',values:[]}; var r={s:s.id,o:'',v:''}; fixRow(r,s); return r; }
  function fixRow(r,s){
    var kind=s?s.kind:'choice', ops=OPS[kind]||OPS.choice;
    if(!ops.some(function(o){return o[0]===r.o;})) r.o=ops[0][0];
    if(kind==='number'){ if(r.v===''||isNaN(+r.v)) r.v='1'; }
    else { var vs=(s&&s.values)||[]; if(!vs.some(function(x){return String(x[0])===String(r.v);})) r.v=vs.length?vs[0][0]:''; }
  }
  draw();
  return wrap;
};

/* a condition in a few words, for list summaries */
function condText(c,ctx){
  c=asArr(c); if(!c.length) return 'always';
  var m={}; FAMILY.subjects(DEF,ctx||'warn').forEach(function(s){m[s.id]=s;});
  var OPW={is:'=',not:'\u2260',gte:'\u2265',lte:'\u2264',eq:'=',set:'answered',unset:'unanswered'};
  return c.map(function(g){ return asArr(g).map(function(r){
    var s=m[r.s], nm=r.s.indexOf('a:')===0?r.s.slice(2):(s?s.short||s.label:r.s);
    if(r.o==='set'||r.o==='unset') return nm+' '+OPW[r.o];
    return nm+' '+(OPW[r.o]||r.o)+' '+r.v; }).join(' and '); }).join('  or  ');
}

/* shared checks every builder uses */
function checkCond(c,subs,where,sec,out){
  var m={}; subs.forEach(function(s){m[s.id]=s;});
  asArr(c).forEach(function(g){ asArr(g).forEach(function(r){
    var s=m[r.s];
    if(!s){ out.push({sec:sec,msg:where+' tests '+r.s+', which no longer exists.'}); return; }
    if(s.kind!=='number'&&r.o!=='set'&&r.o!=='unset'&&!(s.values||[]).some(function(x){return String(x[0])===String(r.v);}))
      out.push({sec:sec,msg:where+' tests '+s.label+' for "'+r.v+'", which is not one of its answers.'});
  });});
}
function dupes(list,key,what,sec,out){
  var seen={}; asArr(list).forEach(function(x){ var k=x[key]; if(!k) out.push({sec:sec,msg:'A '+what+' has no ID.'}); else if(seen[k]) out.push({sec:sec,msg:'Two '+what+'s share the ID '+k+'.'}); seen[k]=1; });
}
/* renames a reference everywhere in the definition. Returns the count. */
function renameRefs(def,subjectOld,subjectNew,valueSubject,valOld,valNew,fieldNames){
  var n=0;
  (function walk(o){
    if(Array.isArray(o)){ o.forEach(walk); return; }
    if(!o||typeof o!=='object') return;
    if(typeof o.s==='string'&&typeof o.o==='string'){
      if(subjectOld&&o.s===subjectOld){ o.s=subjectNew; n++; }
      if(valueSubject&&(o.s===valueSubject||(typeof valueSubject==='function'&&valueSubject(o.s)))&&o.v===valOld){ o.v=valNew; n++; }
      return;
    }
    (fieldNames||[]).forEach(function(f){ if(o[f]===valOld&&valOld!==undefined){ o[f]=valNew; n++; } });
    for(var k in o) walk(o[k]);
  })(def);
  return n;
}

/* ---------------- preview ---------------- */
function buildHTML(preview){ return assembleTool(PARTS,DEF,preview); }
function schedulePreview(now){ clearTimeout(pvT); pvT=setTimeout(drawPreview,now?0:380); }
function drawPreview(){
  var host=$('pvwrap'), old=host.querySelector('iframe'), st=null, sy=0;
  if(old){ try{ var w=old.contentWindow; if(w.__getState) st=w.__getState(); sy=w.scrollY||0; }catch(e){} }
  if(st===null) st=lastPvState;
  var f=el('iframe',{title:'Live preview of the tool'});
  f.addEventListener('load',function(){
    try{
      var w=f.contentWindow;
      if(st&&w.__setState) w.__setState(st);
      w.scrollTo(0,sy);
      lastPvState=null;
    }catch(e){}
  });
  f.srcdoc=buildHTML(true);
  if(old) host.replaceChild(f,old); else host.appendChild(f);
}
var recT=null;
function recOn(){ return $('pv-rec').getAttribute('aria-pressed')==='true'; }
function drawRecord(){
  if(!recOn()) return;
  var f=$('pvwrap').querySelector('iframe'), out=null;
  try{ var w=f&&f.contentWindow; if(w&&w.__recordText) out=w.__recordText(); }catch(e){}
  if(!out){ $('pvrs').textContent='Loading the preview.'; return; }
  $('pvrs').textContent=out.note||'';
  if($('pvrt').textContent!==out.text) $('pvrt').textContent=out.text;
}
function toggleRecord(){
  var on=!recOn(); $('pv-rec').setAttribute('aria-pressed',on?'true':'false');
  document.querySelector('.preview').classList.toggle('rec',on);
  clearInterval(recT); if(on){ drawRecord(); recT=setInterval(drawRecord,600); }
}
function restartPreview(){ lastPvState=null; var old=$('pvwrap').querySelector('iframe'); if(old) old.remove(); drawPreview(); }

/* ---------------- files ---------------- */
function download(name,text,mime){
  var u=URL.createObjectURL(new Blob([text],{type:mime}));
  var a=el('a',{href:u,download:name}); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(u);},4000);
}
function exportName(){ var t=DEF.tool||{}; return slugF(t.exportName||t.pageTitle||t.barTitle); }
function doExport(){
  var p=problems();
  download(exportName()+'.html',buildHTML(false),'text/html');
  DIRTY=false;
  toast(p.length?'Tool exported. '+p.length+' check'+(p.length>1?'s':'')+' still open.':'Tool exported.');
}
function doSaveProject(){
  download(exportName()+'.tool-project.json',JSON.stringify({toolBuilderProject:FAMILY.id,saved:new Date().toISOString(),def:DEF},null,1),'application/json');
  DIRTY=false; toast('Project saved.');
}
function readDefFrom(text,name){
  var d=null;
  if(/^\s*</.test(text)){
    var m=/<script type="application\/json" id="tool-def">([\s\S]*?)<\/script>/.exec(text);
    if(!m) throw new Error('This page was not made by a Tool Builder. The built-in starter already matches the original tool. Use New, then Start from the current tool.');
    d=JSON.parse(m[1]);
  } else {
    var o=JSON.parse(text);
    d=o&&o.def?o.def:o;
  }
  if(!d||typeof d!=='object'||!d.builder) throw new Error('No tool definition found in '+name+'.');
  if(d.builder!==FAMILY.id) throw new Error('This file belongs to the '+(FAMILY.others[d.builder]||d.builder)+'. Open it there.');
  return d;
}
function doOpen(ev){
  var f=ev.target.files&&ev.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{ var d=readDefFrom(r.result,f.name); loadDef(d,'Opened <b>'+escH(f.name)+'</b>. Edits now apply to this tool.'); go('start'); }
    catch(e){ banner(escH(e.message),'bad'); }
  };
  r.readAsText(f); ev.target.value='';
}
function newFrom(kind){
  closeMenus();
  var cur=snapshot();
  loadDef(clone(kind==='blank'?FAMILY.blank:STARTER), kind==='blank'?'Started a blank tool. Your previous work is one Undo away.':'Started from the current tool. Your previous work is one Undo away.');
  HIST.unshift(cur); HPOS=HIST.length-1; undoState();
  go('start');
}
function closeMenus(){ document.querySelectorAll('.menu.open').forEach(function(m){m.classList.remove('open');}); }
function syncMtabs(){

  });
  $('mt-edit').addEventListener('click',function(){ document.body.classList.add('m-edit'); document.body.classList.remove('m-prev'); syncMtabs(); });
  $('mt-prev').addEventListener('click',function(){ document.body.classList.add('m-prev'); document.body.classList.remove('m-edit'); syncMtabs(); schedulePreview(true); });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&$('help').classList.contains('on')){ closeHelp(); return; }
    var mod=e.ctrlKey||e.metaKey;
    if(mod&&!e.shiftKey&&e.key.toLowerCase()==='z'&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){ e.preventDefault(); undo(); }
    if(mod&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){ e.preventDefault(); redo(); }
    if(mod&&e.key.toLowerCase()==='s'){ e.preventDefault(); doSaveProject(); }
  });
  document.body.classList.add('m-edit');
  pushHist(); renderNav(); renderSection(); drawPreview(); drawProblems();
  /* offer to restore the last session on this computer */
  try{
    var raw=localStorage.getItem('toolbuilder:'+FAMILY.id+':last');
    if(raw){
      var o=JSON.parse(raw);
      if(o&&o.def&&JSON.stringify(o.def)!==JSON.stringify(STARTER)){
        var when=new Date(o.saved);
        banner('Your last session in this builder was kept on this computer ('+escH(when.toLocaleString())+').','',
          [['Restore it',function(){ loadDef(o.def,'Last session restored.'); }],['Keep the starter',hideBanner]]);
      }
    }
  }catch(e){}
  /* from now on, keep this session for next time */
  LSKEY='toolbuilder:'+FAMILY.id+':last';
}
window.addEventListener('beforeunload',function(e){
  if(DIRTY){ e.preventDefault(); e.returnValue=''; }
});
boot();

</script>
