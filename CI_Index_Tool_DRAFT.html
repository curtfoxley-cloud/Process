<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CI Index</title>
<style>
:root{
  --ink:#1E262E; --ink-2:#2C3841; --slate:#5C6D78; --mute:#8998A2;
  --paper:#FFFFFF; --surface:#F4F6F7; --surface-2:#EDF0F1; --rule:#D6DCDF;
  --rust:#A8481F; --rust-soft:#F2E4DD; --rust-ink:#7E340F;
  --teal:#1F5F5B; --teal-soft:#DFEAE8;
  --amber:#9A6508; --amber-soft:#F6ECD8;
  --alert:#8E2F2F; --alert-soft:#F4E2E2;
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--surface);font-size:15px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;color:inherit}
.top{background:var(--ink);color:#fff;padding:13px 20px}
.top b{font-family:var(--serif);font-size:16px;display:block;line-height:1.2}
.top span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#93A2AB}
.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 70px}
h1{font-family:var(--serif);font-size:27px;font-weight:400;margin:0 0 6px;line-height:1.2}
.lede{font-size:14px;color:var(--slate);margin:0 0 20px;max-width:72ch}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:8px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:16px 18px;margin:0 0 18px}
.card p{margin:0;font-size:13.5px;color:var(--ink-2)}
.card p+p{margin-top:9px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fld label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);line-height:1.45}
.fld textarea{resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--rust);outline-offset:1px}
.small{font-size:12.5px;color:var(--slate);max-width:78ch}
.pull{font-family:var(--serif);font-size:15px;font-style:italic;color:var(--ink-2);border-left:3px solid var(--rust);padding-left:12px;margin:14px 0;max-width:66ch}

/* action bar */
.bar{position:sticky;top:0;z-index:30;background:var(--surface);padding:10px 0;margin:0 0 6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--rule)}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:4px;padding:8px 14px;font-size:13px;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.btn.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.pri:hover{background:var(--rust-ink)}
.btn.gh{background:transparent;color:var(--slate)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
#msg{font-size:12.5px;color:var(--slate);flex:1;min-width:200px}
.dirty{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:3px 7px;border-radius:3px}
.dirty.y{background:var(--amber-soft);color:var(--amber);border:1px solid #E4D3AF}
.dirty.n{background:var(--teal-soft);color:var(--teal);border:1px solid #BFD6D2}

.tally{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:12px 0 12px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:3px 9px;border-radius:3px;border:1px solid var(--rule);background:var(--surface-2);color:var(--slate);white-space:nowrap}
.chip.on{background:var(--rust-soft);color:var(--rust-ink);border-color:#E3CCC2}
.chip.hold{background:var(--amber-soft);color:var(--amber);border-color:#E4D3AF}
.chip.bad{background:var(--alert-soft);color:var(--alert);border-color:#E0BFBF}
.chip.ok{background:var(--teal-soft);color:var(--teal);border-color:#BFD6D2}
.chip.count{background:none;border-color:transparent;color:var(--mute)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--ink-2);margin:0 0 18px;flex-wrap:wrap}
.tab{border:0;background:none;padding:9px 13px 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--slate);border-radius:4px 4px 0 0}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab.on{background:var(--ink-2);color:#fff}
.tab .n{display:inline-block;margin-left:6px;padding:0 5px;border-radius:3px;background:var(--alert);color:#fff;font-size:9.5px;letter-spacing:0}
.tab .n.r{background:var(--amber)}
.tab:focus-visible{outline:2px solid var(--rust);outline-offset:2px}

/* hierarchy */
.split{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
.treebox{background:var(--paper);border:1px solid var(--rule);border-radius:6px;position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto}
.treehead{padding:9px 12px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:var(--paper);z-index:2}
.treehead label{font-size:12px;color:var(--slate);display:flex;gap:5px;align-items:center}
.tsec{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--alert);font-weight:700;padding:10px 12px 4px;border-top:1px solid var(--rule)}
.tn{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 0;border-left:3px solid transparent;cursor:pointer;font-size:13px;position:relative}
.tn:hover{background:var(--surface)}
.tn:focus-visible{outline:2px solid var(--rust);outline-offset:-2px}
.tn.sel{background:var(--rust-soft);border-left-color:var(--rust)}
.tn.ret .tname,.tn.ret .tid{opacity:.5;text-decoration:line-through}
.tw{width:18px;border:0;background:none;color:var(--mute);font-size:10px;padding:0;flex:none;line-height:1}
.tw.leaf{visibility:hidden}
.tid{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--rust-ink);flex:none}
.tname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bd{font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;font-weight:700;padding:1px 4px;border-radius:3px;border:1px solid var(--rule);color:var(--slate);background:var(--surface-2);flex:none}
.bd.b{background:var(--rust-soft);color:var(--rust-ink);border-color:#E3CCC2}
.bd.p{background:var(--amber-soft);color:var(--amber);border-color:#E4D3AF}
.bd.g{background:var(--teal-soft);color:var(--teal);border-color:#BFD6D2}
.dot{min-width:17px;height:17px;border-radius:9px;font-size:10px;font-weight:700;color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;flex:none}
.dot.f{background:var(--alert)}
.dot.r{background:var(--amber)}
.guide{position:absolute;top:0;bottom:0;width:1px;background:var(--rule)}

.sect{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:15px 17px;margin:0 0 14px}
.sect.hd{border-left:3px solid var(--rust)}
.dh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dh h2{font-family:var(--serif);font-size:23px;font-weight:400;margin:0;line-height:1.2}
.dh .cid{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--rust-ink)}
.dchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.path{font-size:12px;color:var(--mute);margin-top:6px}
.path button{border:0;background:none;padding:0;color:var(--slate);font-size:12px;text-decoration:underline;text-underline-offset:2px}
.acts{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 0;padding-top:10px;border-top:1px solid var(--surface-2)}
.lnk{border:0;background:none;padding:2px 0;font-size:13px;font-weight:600;color:var(--slate);text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--rust)}
.lnk[disabled]{color:var(--mute);text-decoration:none;cursor:not-allowed}
.lnk:focus-visible{outline:2px solid var(--rust);outline-offset:2px;border-radius:3px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fgrid .wide{grid-column:1/-1}
.help{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.45}
.fm div{font-size:12px;padding:4px 8px;border-radius:3px;margin-top:5px;line-height:1.4}
.fm .flag,.fl .flag{background:var(--alert-soft);color:var(--alert)}
.fm .review,.fl .review{background:var(--amber-soft);color:var(--amber)}
.fm .note,.fl .note{background:var(--surface-2);color:var(--slate)}
.fld .x-flag{border-color:var(--alert)!important;background:#FBF4F4}
.fld .x-review{border-color:var(--amber)!important;background:#FCF8EF}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 16px;font-weight:700;font-size:13px;color:var(--slate)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{background:var(--ink-2);color:#fff}
.seg button:focus-visible{outline:2px solid var(--rust);outline-offset:-2px}
.srcg{margin-bottom:8px}
.srcg .gl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700;margin:6px 0 4px}
.srcs{display:flex;flex-wrap:wrap;gap:6px;padding:2px;border-radius:5px}
.sc{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:5px 9px;font-size:12.5px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.sc:hover{border-color:var(--slate)}
.sc.on{border-color:var(--rust);background:var(--rust-soft);color:var(--rust-ink);font-weight:600}
.sc .c1{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--alert);letter-spacing:.04em}
.sc.off{border-style:dashed;border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.srcs-wrap{border:1px solid transparent;padding:4px 6px}
.rec{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.icdl{border:1px solid transparent;border-radius:5px;padding:4px 6px}
.icdr{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.icdr input{flex:1;min-width:0}
.icdr input.rv{flex:0 0 72px}
.rec b{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.impl{margin-top:10px;background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:10px 12px;font-size:12.5px;color:var(--ink-2)}
.impl .ok{color:var(--teal);font-weight:700}
.impl .no{color:var(--alert);font-weight:700}
.impl table{border-collapse:collapse;margin:6px 0 8px}
.impl td{padding:2px 14px 2px 0;font-size:12.5px}
.fl{margin-top:12px}
.fl .it{display:flex;gap:9px;align-items:baseline;padding:6px 9px;border-radius:4px;margin-bottom:4px;font-size:12.5px}
.fl .it .r{font-family:var(--mono);font-size:10px;font-weight:700;flex:none;min-width:30px}
.fl .it .c{font-family:var(--mono);font-size:10px;flex:none;opacity:.8}
.panel{margin-top:12px;background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:12px 14px}
.panel p{margin:0 0 9px;font-size:12.5px;color:var(--ink-2)}
.panel .row2{display:grid;grid-template-columns:160px 1fr;gap:8px;margin-bottom:6px}
.panel input[type=text]{padding:6px 8px;border:1px solid var(--rule);border-radius:4px;width:100%}
.cklist{max-height:200px;overflow:auto;border:1px solid var(--rule);border-radius:4px;background:var(--paper);padding:6px 8px;margin-bottom:9px}
.cklist label{display:flex;gap:7px;font-size:12.5px;padding:2px 0;align-items:center}

/* tables */
.gridwrap{overflow:auto;max-height:72vh;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
table.g{border-collapse:separate;border-spacing:0;font-size:12px}
table.g th{position:sticky;top:0;background:var(--ink-2);color:#fff;font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;text-align:left;padding:7px 8px;vertical-align:bottom;z-index:2;min-width:70px;max-width:180px;white-space:normal;line-height:1.3}
table.g td{padding:5px 8px;border-bottom:1px solid var(--rule);border-right:1px solid var(--surface-2);vertical-align:top;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;background:var(--paper);cursor:pointer}
table.g th.s0,table.g td.s0{position:sticky;left:0;z-index:1;min-width:44px;width:44px}
table.g th.s1,table.g td.s1{position:sticky;left:44px;z-index:1;min-width:84px;border-right:2px solid var(--rule)}
table.g th.s0,table.g th.s1{z-index:3}
table.g td.s1{font-family:var(--mono);font-weight:700;color:var(--rust-ink)}
table.g tr:hover td{background:var(--surface)}
table.g td.dv{color:var(--mute);font-style:italic}
table.g td.x-flag{background:var(--alert-soft)!important;color:var(--alert)}
table.g td.x-review{background:var(--amber-soft)!important}
table.g tr.ret td{color:var(--mute)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.filters .fld{min-width:160px}
.filters label.ck{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2);padding-bottom:8px}
table.dt{border-collapse:collapse;width:100%;font-size:13px;background:var(--paper)}
table.dt th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--rule);background:var(--surface-2)}
table.dt td{padding:7px 10px;border-top:1px solid var(--rule);color:var(--ink-2);vertical-align:top}
table.dt td.k{font-family:var(--mono);font-size:12px;color:var(--rust-ink);font-weight:700;white-space:nowrap}
table.dt td.m{font-size:12px;color:var(--slate)}
table.dt input,table.dt select{width:100%;padding:5px 7px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);font-size:12.5px}
table.dt input:focus,table.dt select:focus{outline:2px solid var(--rust);outline-offset:1px}
table.dt td.x-flag input,table.dt td.x-flag select{border-color:var(--alert);background:#FBF4F4}
table.dt td.x-review input,table.dt td.x-review select{border-color:var(--amber);background:#FCF8EF}
.sev{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:2px 6px;border-radius:3px;white-space:nowrap}
.sev.flag{background:var(--alert-soft);color:var(--alert)}
.sev.review{background:var(--amber-soft);color:var(--amber)}
.sev.note{background:var(--surface-2);color:var(--slate)}
.cibtn{border:0;background:none;padding:0;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--rust-ink);text-decoration:underline;text-underline-offset:2px}

/* overview */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.tile{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.tile .v{font-family:var(--serif);font-size:32px;line-height:1.1}
.tile .t{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate);font-weight:700;margin-bottom:4px}
.tile .s{font-size:12px;color:var(--mute);margin-top:4px}
.tile.alert{border-left:3px solid var(--alert)}
.tile.amb{border-left:3px solid var(--amber)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.todo{margin:0;padding:0;list-style:none}
.todo li{padding:9px 0;border-top:1px solid var(--surface-2);font-size:13.5px;color:var(--ink-2);display:flex;gap:10px;align-items:baseline}
.todo li:first-child{border-top:0}
.todo li .sev{flex:none}
.sbar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--surface-2);margin:4px 0 2px}
.sbar span{display:block;height:100%}
.sbar.stk span+span{box-shadow:inset 2px 0 0 var(--paper)}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 4px 0 0;vertical-align:-1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--slate);margin:8px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.brow{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-2);margin:6px 0}
.brow .n{text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--slate)}
.empty{text-align:center;padding:40px 20px}
.empty h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 6px}
.empty .btnrow{justify-content:center}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px}
.ref h3{font-family:var(--serif);font-size:18px;font-weight:400;margin:22px 0 8px}
.ref ul{margin:0;padding-left:18px}
.ref li{font-size:13px;color:var(--ink-2);margin-bottom:6px;max-width:84ch}
.ref li b{color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.foot{font-size:12.5px;color:var(--slate);border-top:1px solid var(--rule);padding-top:14px;margin-top:30px}
.foot p{margin:0 0 7px}

/* metrics */
.mpanel{margin:6px 0 10px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px;align-items:start}
.mcard{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:15px 17px;min-width:0}
.mtop{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.mt{font-family:var(--serif);font-size:19px;line-height:1.25;color:var(--ink)}
.mn{font-size:12.5px;color:var(--slate);margin-top:4px;max-width:56ch}
.mhero{text-align:right;flex:none;min-width:96px}
.mhero .v{font-size:34px;line-height:1.05;font-weight:600;color:var(--ink)}
.mhero .v2{font-size:22px;line-height:1.1;font-weight:600;color:var(--ink);margin-top:8px}
.mhero .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);font-weight:700}
.mtake{font-size:13.5px;color:var(--ink-2);margin:10px 0 0;font-weight:600}
.mdue{font-size:12px;color:var(--amber);margin:8px 0 0}
.mbars{margin-top:10px}
.mrow{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-2);margin:7px 0}
.mrow .ml{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mv{text-align:right;font-size:12px;color:var(--slate);white-space:nowrap}
.mbar{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden;background:#E6EAEC}
.mbar span{display:block;height:100%;min-width:0}
.mhead{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);font-weight:700;margin:12px 0 2px}
.mlines{margin:10px 0 0;padding-left:18px}
.mlines li{font-size:12.5px;color:var(--ink-2);margin-bottom:4px}
.mlist{margin-top:8px}
.mpop{font-size:11.5px;color:var(--mute);margin:10px 0 0}
@media(max-width:980px){ .mgrid{grid-template-columns:1fr} }
@media(max-width:640px){ .mrow{grid-template-columns:90px minmax(0,1fr) 86px} .mtop{flex-direction:column} .mhero{text-align:left} }

@media(max-width:980px){
  .split{grid-template-columns:1fr}
  .treebox{position:static;max-height:46vh}
  .tiles,.grid4{grid-template-columns:1fr 1fr}
  .cols2{grid-template-columns:1fr}
}
@media(max-width:640px){
  .fgrid,.tiles,.grid4{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .top,.bar,.tabs,.acts,.treehead,.btnrow{display:none}
  body{background:#fff;font-size:11pt}
  .treebox{position:static;max-height:none;overflow:visible}
  .gridwrap{max-height:none;overflow:visible}
}
</style>
<style>
.prevbar{background:var(--amber-soft);color:var(--amber);border-bottom:1px solid #E4D3AF;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:6px 20px}
.ref .chg td{font-size:12.5px}
.minlist{margin:0 0 8px;padding-left:20px;font-size:13px;color:var(--ink-2)}
.minlist li{margin-bottom:4px}
.cmap code,.sect code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);padding:0 4px;border-radius:3px}
.pill{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 7px;border-radius:10px;border:1px solid var(--rule);background:var(--surface-2);color:var(--slate);white-space:nowrap}
.pill.ok{background:var(--teal-soft);color:var(--teal);border-color:#BFD6D2}
.pill.bad{background:var(--alert-soft);color:var(--alert);border-color:#E0BFBF}
.pill.hold{background:var(--amber-soft);color:var(--amber);border-color:#E4D3AF}
.pill.off{background:transparent;color:var(--mute);border-style:dashed}
table.cmap td{font-size:12.5px}
table.cmap tr.notdue td{background:var(--surface)}
.heldbox{background:var(--surface-2);border:1px solid var(--rule);border-radius:5px;padding:9px 12px;font-size:12.5px;color:var(--ink-2);margin:0 0 12px}
.stagerow{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-top:12px}
.stagerow .fld{min-width:240px}

/* block diagram */
.dgctl{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;margin:0 0 12px}
.dgctl .filters{align-items:end}
.dgctl .fld{min-width:130px}
.dgrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.dgrow .gl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);font-weight:700;min-width:96px}
.dgrow .lnk{margin-right:12px}
.dgfixed{cursor:default;opacity:.8}
.dgzoom{display:flex;gap:4px;align-items:center;margin-bottom:2px}
.dgzoom span{font-family:var(--mono);font-size:11px;color:var(--slate);min-width:44px;text-align:center}
.dgfix{font-size:13px;color:var(--ink-2);padding:7px 0}
.dgexp{margin:0 0 12px}
.dgnote{font-size:12.5px;color:var(--slate);margin:0 0 8px}
.dgwrap{position:relative;overflow:auto;height:70vh;min-height:320px;border:1px solid var(--rule);border-radius:6px;background:#FFFFFF;cursor:grab;touch-action:pan-x pan-y}
.dgwrap.pan{cursor:grabbing;user-select:none}
.dgwrap svg{display:block}
.dgb{cursor:pointer}
.dgb:hover rect:first-of-type{stroke:var(--rust);stroke-width:2}
.dgt{cursor:pointer}
.dgt:hover circle{stroke:var(--rust);stroke-width:1.6}
.dglegend{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2);margin:10px 0 0}
.dglegend>span{display:inline-flex;gap:6px;align-items:center}
.dghelp{margin-top:16px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:12px 16px}
.dghelp summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink)}
.dghelp summary:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.dghelpb{max-width:84ch}
.dghelpb h3{font-family:var(--serif);font-size:17px;font-weight:400;margin:18px 0 6px}
.dghelpb p,.dghelpb li{font-size:13px;color:var(--ink-2);margin:0 0 8px}
.dghelpb ul{margin:0 0 8px;padding-left:18px}
@media print{ .dgctl,.dghelp,.dgexp{display:none} .dgwrap{height:auto;overflow:visible;border:0} }
</style>

<script>
/* ===================================================================
   Build block. The CI Index Builder writes this. Everything the tool
   shows and checks reads from it.
   =================================================================== */
var CONFIG=/*CFG>*/{"schema":1,"build":{"name":"CI Index","rev":"D","changes":[{"rev":"A","date":"2026-10-06","by":"CM","text":"First release. Implements the CI index template."},{"rev":"B","date":"2026-10-06","by":"CM","text":"Configuration moved into one build block. Editable in the CI Index Builder."},{"rev":"C","date":"2026-10-07","by":"CM","text":"Implements the interface register redesign. The ICD column stays, and its help ties it to the ICD cross-check in the interface coverage check. The Boundaries tab is now Structural floor: each parent and child in different control tiers, and each GFE CI. Sibling pairs are no longer derived. Split and consolidate messages follow the re-mapping rules. Examples: CI-0021 is source-controlled under SCD-2230-001; CI-0031 added; ICD values list every ICD, IRS, and IDD on each CI’s mapped register rows."},{"rev":"D","date":"2026-10-08","by":"CM","text":"Added the Excel columns tab. It shows each column the import reads, the header and save file key it accepts, the minimum to load, the minimum entry for a new CI, what reads each column, and what a blank cell does. The import now finds the header row by CI ID or Parent CI ID. Added Index stage: blank-entry hints for columns that fall due at a later stage are held, so an index filled in stages stays readable. Hints that compare two filled cells always run. The Excel export adds a Column Map sheet and records the stage on the About sheet."},{"rev":"[next revision]","date":"2026-10-08","by":"CM","text":"SCD (optional) is now SCD or VICD (optional). It holds the drawing that controls a supplier-designed item procured as a unit: a source control drawing or a vendor item control drawing. Specification No. reads See SCD or See VICD. The import still reads the old header. The check on See SCD also covers See VICD. The header, the reference line, and the import note name the CI identification process and the template by plain name, with no revision letter or section. The external criticality designations are named in words, not by table number. C-1 stays as their tag."},{"rev":"[next revision]","date":"2026-10-14","by":"CM","text":"Added the Metrics tab. Coverage: traced to PIN and NH, SCI traced to its source, and model alignment covered. Each shows Recorded and Verified, and lists the CIs that fall short. Profile: criterion (b) met, traced to an ICD, and traced to an SCD or VICD. Filters by control tier and by branch apply to every metric. A metric whose columns fall due at a later index stage says so. Export metrics to PowerPoint writes a title slide, a summary slide, and one slide per metric. Each chart is a picture. The words stay editable. The builder turns each metric on or off, sets its order and words, and turns the export on or off."},{"rev":"[next revision]","date":"2026-10-19","by":"CM","text":"Added FMECA Severity (highest) and FMECA Ref to the Safety group, after SCI Source Ref. FMECA Severity takes Category I to IV or Not analyzed from a new FMECA Severity list. New checks: SA8 flags Category I or II without Criterion (b) Met = Y. SA9 flags a category with no FMECA entry cited. SA10 marks a FMECA Ref with no category. SA11 marks a live CI with no FMECA answer. The Criterion (b) met metric gains a FMECA I or II slice, and the Overview tile counts it. The Concurrence Queue sheet of the Excel export carries FMECA Severity. The FMECA checks read 2, Cat II, or Critical as Category II, so a workbook from another FMECA scheme still trips them. A value not on the list is still marked for review. The SCI help reads severity category, not criticality code. The Overview bars no longer use status colors. Count bars take one neutral color. Baseline bars take one hue from dark to light, with a swatch for each entry."},{"rev":"[next revision]","date":"2026-10-19","by":"CM","text":"Added ACN Ref and ACN Level in a new Qualification and clearance group, after Formalized PBL Status/Date. ACN is the Approval and Clearance Notice. ACN Level takes Level 0 to Level 7 or Not required from a new ACN Level list. New checks: AC1 and AC2 keep the reference and the level together. AC3 marks a live CI with no ACN answer. AC4 notes Levels 1, 2, and 4, which carry limitations. AC5 marks a formalized product baseline with an ACN below Level 5. PN Variants gains both columns, with VA7 and VA8. The Overview shows an ACN level bar, and a new ACN level metric profiles the index. Imports read 5, L5, or Level 5 as Level 5."},{"rev":"[next revision]","date":"2026-10-19","by":"CM","text":"SCD or VICD (optional), ICD (optional), and SSOW (optional) are now SCD or VICD, ICD, and SSOW. They stay optional: no check requires them, and each help text starts with Optional. The import still reads the old headers. The Excel import now converts an ACN Level entered as a number, such as 2, or as L2, Level 2, or ACN 2, to the full list label, on the CI Index and PN Variants sheets. The import message counts the conversions, and the edit log records each one. In the Excel export, ACN Level keeps its dropdown but no longer warns when a number is typed."},{"rev":"[next revision]","date":"2026-10-19","by":"CM","text":"Document revisions. Spec Rev follows Specification No. SCD and VICD are now separate columns, each with a revision column: SCD Rev and VICD Rev. SVD Ref and SVD Rev name the Software Version Description of a CSCI or Firmware CI. SSOW Rev follows SSOW. ACN Rev follows ACN Ref. Each ICD entry carries its revision in the cell, written ICD-2200-210 Rev A. Effectivity follows Qty per NH. A blank shows the derived value: All units for a single-PIN CI, or See PN Variants where variant rows exist. The Table view and the Excel export show a derived value in gray italics, and the import reads it back as blank. PN Variants gains SVD Ref, SVD Rev, and ACN Rev. New checks: DO2 keeps SCD and VICD apart. RV1 to RV6 mark a document with no revision. RV7 marks a revision with no document. RV8 marks an ICD entry with no revision. SV1 and SV2 tie the SVD to software CIs. EF1 and EF2 keep the CI row and its variants from both claiming effectivity. VA9 to VA11 do the same work on PN Variants. DO1 now checks that See SCD and See VICD point to the matching column. A file with the old merged SCD or VICD column loads: a drawing whose number or Specification No. names a VICD moves to VICD, and the edit log records each move. The PIN help states the firmware rule. The Traced to an SCD or VICD metric reads the two columns."},{"rev":"[next revision]","date":"2026-10-19","by":"CM","text":"The ICD field in the detail panel is now a list. Each ICD gets a document box and a revision box, with Add ICD and Remove. The tool writes the cell as document Rev x, separated by semicolons, so the import and the interface register read it as before. An entry nobody edits keeps its exact text. The Excel export adds an ICD List sheet: one row per ICD, with CI ID, name, status, the ICD, and its revision. A missing revision is shaded for review. The import does not read the sheet. Turn it off under Excel sheets in the builder."},{"rev":"[next revision]","date":"2026-10-27","by":"CM","text":"Added the Block diagram tab. It draws the CI hierarchy from Parent CI ID, live CIs only. Three layouts: top-down stacked, top-down tree, and left to right. The stacked layout puts children with no children of their own in columns, so a parent with dozens of children stays narrow. Users pick a branch, the levels shown, the block width, the block fields, and the box styles. Box styles: shade by control tier, dashed border for Proposed, double border for Not Decomposed, and a diamond where the control tier differs from the parent CI. Blocks collapse and expand. A click opens the CI on the Hierarchy tab. Exports: PDF, PowerPoint, SVG, and PNG. Each exports the current view, or a paged set with an overview page and one page per branch, with page tags on cut-off blocks. Auto picks the levels per page. Every export carries a title block and a legend. PowerPoint uses native shapes with connectors glued to the blocks. A help panel on the tab explains each part. The builder sets the defaults, the exports, the scopes, the page size, and the legend words. Users override them, and the overrides save with the index file."}]},"text":{"title":"CI Index","top":"CI Index","sub":"Configuration Management · CI index template · Tool rev D draft","h1":"Configuration Item Index","lede":"One record per Configuration Item. The index flags what applies to each CI and points to the record that owns each answer. It does not copy content from those records. The tool checks every row as you work and shows what needs review.","foot":["**Reference.** The CI identification process. The CI index template.","This tool is a working aid. The index of record is maintained current in the CSA system for the program life.","Nothing is stored in the browser. Save the index to a file before you close the tab. The saved file keeps the edit log. An Excel export does not."],"stem":"CI-Index"},"theme":{"accent":"#A8481F","ink":"#1E262E"},"features":{"tabs":{"overview":true,"metrics":true,"table":true,"variants":true,"checks":true,"bound":true,"log":true,"ref":true,"colmap":true,"diagram":true},"actions":{"dup":true,"split":true,"cons":true,"dedes":true,"del":true},"sheets":{"about":true,"checks":true,"queue":true,"bound":true,"log":true,"colmap":true,"icd":true},"examples":true},"cols":[{"k":"level","h":"Level","kind":"level","w":6,"help":"Derived from Parent CI ID. 0 is the top-level CI.","group":"","wide":false,"core":true,"req":"","reqGFE":false,"alias":[]},{"k":"id","h":"CI ID","kind":"text","w":11,"help":"Program-unique identifier for the CI. It is not the PIN. Renaming a CI ID updates every parent, variant, and supersession reference to it.","group":"Identification","wide":false,"core":true,"req":"","reqGFE":false,"alias":[],"stage":"cand","reg":true,"blankNote":""},{"k":"parent","h":"Parent CI ID","kind":"parent","w":12,"help":"Every CI except the top-level CI names a parent that exists in the index. The tool derives Level and the name indentation from the parent, so the three forms of hierarchy always agree.","group":"Structure","wide":false,"core":true,"req":"","reqGFE":false,"alias":[],"stage":"cand","reg":true,"blankNote":""},{"k":"name","h":"CI Name / Nomenclature","kind":"text","w":36,"help":"Nomenclature for the CI. Enter it without indentation. The export indents it two spaces per level.","group":"Identification","wide":true,"core":true,"req":"","reqGFE":false,"alias":["CI Name","Nomenclature"],"stage":"cand","reg":true,"blankNote":""},{"k":"type","h":"CI Type","kind":"enum","w":9,"help":"HWCI, CSCI, or Firmware. Computer software is designated as CIs (CSCIs).","group":"Identification","wide":false,"core":false,"req":"","reqGFE":false,"list":"type","alias":[],"stage":"cand","reg":true,"blankNote":""},{"k":"tier","h":"Control Tier","kind":"enum","w":24,"help":"Who baselines and controls the CI’s specification. Acquirer-spec controlled: the CI has its own specification, which the Acquirer baselines and controls. Company-spec controlled: the CI sits below an Acquirer-spec controlled CI. The company baselines and controls its specification, where it has one. A change with Class I effect reaches the Acquirer through the parent CI’s baselines. GFE: government furnished and installed in the product structure. The Government holds its definition.","group":"Structure","wide":false,"core":false,"req":"","reqGFE":false,"list":"tier","alias":["Control"],"stage":"struct","reg":true,"blankNote":""},{"k":"oda","h":"Owning Design Activity","kind":"text","w":26,"help":"The design activity that owns the CI’s design.","group":"Identification","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"struct","reg":false,"blankNote":""},{"k":"cage","h":"CAGE","kind":"text","w":8,"help":"CAGE code of the design activity. CAGE and PIN together form the full identification.","group":"Identification","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"ident","reg":false,"blankNote":""},{"k":"pin","h":"PIN","kind":"text","w":16,"help":"Part or identifying number per design activity convention. PIN is not unique across rows. One PIN may map to more than one CI. One CI may carry several PIN variants. Keep the base or representative PIN here. For Firmware, where one altered item drawing controls both the device and its embedded code, record the part number of the device with the code.","group":"Identification","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"ident","reg":true,"blankNote":""},{"k":"nhpin","h":"NH PIN","kind":"text","w":16,"help":"PIN of the next higher assembly the CI installs into. Where the CI trees directly to the end item, enter the end item’s PIN. Enter N/A only where the CI has no higher assembly.","group":"Structure","wide":false,"core":false,"req":"","reqGFE":false,"pins":true,"alias":[],"stage":"ident","reg":false,"blankNote":""},{"k":"qty","h":"Qty per NH","kind":"text","w":8,"help":"Number of instances of this PIN in the next higher assembly, from that assembly’s parts list. Enter N/A where NH PIN is N/A. Above 1, run Decision Path B of the same-CI decision aid.","group":"Structure","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"ident","reg":false,"blankNote":""},{"k":"eff","h":"Effectivity","kind":"text","w":16,"help":"The units this CI’s PIN applies to. Leave it blank where the CI applies to every unit, and the tool shows All units. Where the CI has PN Variants rows, leave it blank too. Each variant row carries its own effectivity, and the tool shows See PN Variants. Type a value only where a single-PIN CI applies to some units, for example AV units 7+ after a block change.","group":"Identification","wide":false,"core":false,"req":"","reqGFE":false,"alias":["CI Effectivity","PIN Effectivity"],"stage":"ident","reg":false,"blankNote":"The tool shows All units, or See PN Variants where the CI has PN Variants rows. The Excel export writes that value in gray italics, and the import reads it back as blank."},{"k":"spec","h":"Specification No.","kind":"text","w":18,"help":"The CI’s specification. Where a source control drawing governs, write See SCD, and record the drawing in SCD. Where a vendor item control drawing governs, write See VICD, and record the drawing in VICD.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"struct","reg":false,"blankNote":""},{"k":"specRev","h":"Spec Rev","kind":"text","w":8,"help":"The current released revision of the specification. Take it from the release record. Update it at each re-release. Where Specification No. reads See SCD or See VICD, leave it blank. The drawing revision goes in SCD Rev or VICD Rev.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":["Specification Rev","Spec Revision","Specification Revision"],"stage":"struct","reg":false,"blankNote":""},{"k":"scd","h":"SCD","kind":"text","w":15,"help":"Optional. The source control drawing that controls a supplier-designed item procured as a unit. The supplier designs the internals. The company controls form, fit, function, interface, and qualification. The SCD identifies the approved sources, and only they may supply the item. Leave it blank where a VICD controls the item. Record one drawing, the SCD or the VICD, not both.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":["SCD (optional)","SCD or VICD (optional)","SCD or VICD"],"stage":"struct","reg":false,"blankNote":""},{"k":"scdRev","h":"SCD Rev","kind":"text","w":8,"help":"The current released revision of the SCD. Take it from the release record. Blank where SCD is blank.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":["SCD Revision"],"stage":"struct","reg":false,"blankNote":""},{"k":"vicd","h":"VICD","kind":"text","w":15,"help":"Optional. The vendor item control drawing that controls a vendor item procured as a unit. It identifies the vendor and the vendor item identification. It controls selection. The company holds no design authority over the item. Leave it blank where an SCD controls the item. Record one drawing, the SCD or the VICD, not both.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":["Vendor Item Control Drawing"],"stage":"struct","reg":false,"blankNote":""},{"k":"vicdRev","h":"VICD Rev","kind":"text","w":8,"help":"The current released revision of the VICD. Take it from the release record. Blank where VICD is blank.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":["VICD Revision"],"stage":"struct","reg":false,"blankNote":""},{"k":"svdRef","h":"SVD Ref","kind":"text","w":16,"help":"The Software Version Description for the current version of a CSCI or Firmware CI. Enter N/A where the contract calls for no SVD. Leave it blank on HWCI rows. Concurrent builds or loads name their own SVD on the PN Variants sheet.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":["SVD","SVD Reference","Software Version Description","Version Description Ref"],"stage":"prod","reg":false,"blankNote":""},{"k":"svdRev","h":"SVD Rev","kind":"text","w":8,"help":"The current released revision of that SVD. Blank where SVD Ref is blank or N/A.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":["SVD Revision"],"stage":"prod","reg":false,"blankNote":""},{"k":"icd","h":"ICD","kind":"text","w":28,"help":"Optional. The interface control documents that define this CI’s interfaces, including interface requirements specifications and interface design descriptions. In the tool, enter each ICD and its revision in the list. In Excel, write each entry as the document number, then Rev and the revision, for example ICD-2200-210 Rev A, and separate entries with semicolons. List every one on this CI’s mapped interface register rows. The ICD cross-check in the interface coverage check confirms that the index and the register agree, revisions included.","group":"Documentation pointers","wide":true,"core":false,"req":"","reqGFE":false,"alias":["ICD (optional)"],"stage":"struct","reg":true,"blankNote":""},{"k":"ssow","h":"SSOW","kind":"text","w":12,"help":"Optional. The supplier statement of work that flows CM requirements to the supplier. The classification log holds the work type and the designation authorship case.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":["SSOW (optional)"],"stage":"struct","reg":false,"blankNote":""},{"k":"ssowRev","h":"SSOW Rev","kind":"text","w":8,"help":"The current revision of the SSOW. Blank where SSOW is blank.","group":"Documentation pointers","wide":false,"core":false,"req":"","reqGFE":false,"alias":["SSOW Revision"],"stage":"struct","reg":false,"blankNote":""},{"k":"mbse","h":"MBSE Element ID","kind":"text","w":14,"help":"The model element the CI resolves to, where MBSE is used.","group":"Model alignment","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"struct","reg":true,"blankNote":""},{"k":"ata","h":"ATA / SNS Ref","kind":"text","w":10,"help":"The ATA chapter or S1000D SNS reference.","group":"Model alignment","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"struct","reg":false,"blankNote":""},{"k":"mae","h":"Model Alignment Exception","kind":"long","w":36,"help":"Leave blank where the CI resolves to a model element. Where the CI structure departs from the model, record the reason Systems Engineering accepted.","group":"Model alignment","wide":true,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"struct","reg":true,"blankNote":""},{"k":"critB","h":"Criterion (b) Met (Y/N)","kind":"yn","w":11,"help":"Criterion (b): failure might result in serious injury, loss of life, or loss of primary system capability. Record the answer from the CI selection criteria checklist. A FMECA failure mode of Category I or II meets criterion (b). Before recording N, check the SCI sources, FMECA Severity, and the unit record sources. None of these checks catches every item whose loss is loss of primary system capability with no injury pathway. Find those items in the program’s own decomposition.","group":"Safety","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"sel","reg":true,"blankNote":""},{"k":"sci","h":"SCI (Y/N)","kind":"yn","w":8,"help":"Safety-Critical Item: a hardware or software item that has been determined through analysis to potentially contribute to a hazard with Catastrophic or Critical mishap potential, or that may be implemented to mitigate a hazard with Catastrophic or Critical mishap potential. Before recording N, examine the FMEA or FMECA, the SMS hazard log, and the system safety hazard analysis reports. A FMECA severity category classifies a failure mode, not an item. Trace it to the item that hosts the mode.","group":"Safety","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"sel","reg":true,"blankNote":""},{"k":"sciRef","h":"SCI Source Ref","kind":"text","w":22,"help":"The FMEA, FMECA, SMS hazard log entry, or system safety hazard analysis report that names the item. Blank where SCI = N.","group":"Safety","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"sel","reg":false,"blankNote":""},{"k":"fmeca","h":"FMECA Severity (highest)","kind":"enum","w":16,"help":"The highest severity category among the failure modes the FMECA records against this CI. Category I (catastrophic) or Category II (critical) meets criterion (b). Category III (marginal) or Category IV (minor) does not meet it on its own. Read the severity category, not the criticality number. Where the program’s FMECA uses another severity scheme, enter the category its ground rules map to. Not analyzed means the CI sits outside the FMECA. The FMECA keeps every failure mode. This index keeps the highest category and a pointer.","group":"Safety","wide":false,"core":false,"req":"","reqGFE":false,"list":"fmeca","alias":["FMECA Severity"],"stage":"sel","reg":false,"blankNote":""},{"k":"fmecaRef","h":"FMECA Ref","kind":"text","w":20,"help":"The FMECA and the failure mode entry that carries the highest category. For example: FMECA-2230 FM-03. Blank where FMECA Severity is blank or Not analyzed.","group":"Safety","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"sel","reg":false,"blankNote":""},{"k":"selRef","h":"Selection Assessment Ref","kind":"text","w":14,"help":"The completed CI selection criteria checklist. The rationale lives on that checklist, not in this index.","group":"Selection, concurrence, and status","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"sel","reg":false,"blankNote":""},{"k":"concur","h":"Acquirer Concurrence Ref/Date","kind":"text","w":24,"help":"The latest submittal and concurrence that cover this CI. Update it on resubmittal. GFE rows read N/A.","group":"Selection, concurrence, and status","wide":false,"core":false,"req":"","reqGFE":false,"alias":[],"stage":"sel","reg":false,"blankNote":""},{"k":"fbl","h":"FBL Status/Date","kind":"text","w":22,"help":"The FBL is a system-level baseline. Record it on the top-level CI only. Enter N/A (system-level baseline) on every other row.","group":"Baselines","wide":false,"core":false,"req":"","reqGFE":false,"sug":["N/A (system-level baseline)","Planned CDR","Planned PCA","Planned first production unit delivery","Internal, planned CDR","Established YYYY-MM-DD","Internal, YYYY-MM-DD"],"alias":[],"stage":"sel","reg":false,"blankNote":""},{"k":"abl","h":"ABL Status/Date","kind":"text","w":20,"help":"Status or establishment date. For example: Established 2026-03-14, Planned CDR, or Internal, 2026-04-10.","group":"Baselines","wide":false,"core":false,"req":"","reqGFE":false,"sug":["N/A (system-level baseline)","Planned CDR","Planned PCA","Planned first production unit delivery","Internal, planned CDR","Established YYYY-MM-DD","Internal, YYYY-MM-DD"],"alias":[],"stage":"struct","reg":false,"blankNote":""},{"k":"ipbl","h":"Initial PBL Status/Date","kind":"text","w":20,"help":"The initial product baseline is established at completion of CDR.","group":"Baselines","wide":false,"core":false,"req":"","reqGFE":false,"sug":["N/A (system-level baseline)","Planned CDR","Planned PCA","Planned first production unit delivery","Internal, planned CDR","Established YYYY-MM-DD","Internal, YYYY-MM-DD"],"alias":[],"stage":"ident","reg":false,"blankNote":""},{"k":"fpbl","h":"Formalized PBL Status/Date","kind":"text","w":22,"help":"Takes its event from the CI’s Audit Designation Assessment Record. For a CI designated for PCA, the event is PCA completion. Otherwise, it is no later than first production unit delivery.","group":"Baselines","wide":false,"core":false,"req":"","reqGFE":false,"sug":["N/A (system-level baseline)","Planned CDR","Planned PCA","Planned first production unit delivery","Internal, planned CDR","Established YYYY-MM-DD","Internal, YYYY-MM-DD"],"alias":[],"stage":"prod","reg":false,"blankNote":""},{"k":"acnRef","h":"ACN Ref","kind":"text","w":18,"help":"The Approval and Clearance Notice document number. ACN Rev holds its revision. Blank where ACN Level reads Not required.","group":"Qualification and clearance","wide":false,"core":false,"req":"","reqGFE":false,"alias":["ACN Ref.","ACN Reference","ACN No.","ACN Number"],"stage":"ident","reg":false,"blankNote":""},{"k":"acnRev","h":"ACN Rev","kind":"text","w":8,"help":"The revision of the current ACN. Blank where ACN Ref is blank.","group":"Qualification and clearance","wide":false,"core":false,"req":"","reqGFE":false,"alias":["ACN Revision"],"stage":"ident","reg":false,"blankNote":""},{"k":"acnLvl","h":"ACN Level","kind":"enum","list":"acn","w":24,"help":"The clearance level on the current ACN. Level 0 means no clearance, for shippi s":["sup"]},"SU2":{"on":true,"sev":"flag","area":"Supersession","what":"Every ID named in Supersedes / Superseded By exists.","basis":"How to use, splits and consolidations","needs":["sup"]},"SU3":{"on":true,"sev":"flag","area":"Supersession","what":"The supersession trace is recorded on both rows.","basis":"How to use, splits and consolidations","needs":["sup"]},"GF1":{"on":true,"sev":"note","area":"GFE","what":"A GFE row is thin. Its other columns stay blank.","basis":"Column notes, Control Tier","needs":["tier"]},"DO1":{"on":true,"sev":"flag","area":"Documentation","what":"Specification No. reading See SCD or See VICD needs that drawing in its own column.","basis":"Column notes, SCD and VICD","needs":["spec","scd"]},"DO2":{"on":true,"sev":"flag","area":"Documentation","what":"A CI records an SCD or a VICD, not both.","basis":"Column notes, SCD and VICD","needs":["scd","vicd"]},"RV1":{"on":true,"sev":"review","area":"Revisions","what":"A filled Specification No. needs Spec Rev.","basis":"Column notes, Spec Rev","needs":["spec","specRev"]},"RV2":{"on":true,"sev":"review","area":"Revisions","what":"A filled SCD needs SCD Rev.","basis":"Column notes, SCD Rev","needs":["scd","scdRev"]},"RV3":{"on":true,"sev":"review","area":"Revisions","what":"A filled VICD needs VICD Rev.","basis":"Column notes, VICD Rev","needs":["vicd","vicdRev"]},"RV4":{"on":true,"sev":"review","area":"Revisions","what":"A filled SVD Ref needs SVD Rev.","basis":"Column notes, SVD Rev","needs":["svdRef","svdRev"]},"RV5":{"on":true,"sev":"review","area":"Revisions","what":"A filled SSOW needs SSOW Rev.","basis":"Column notes, SSOW Rev","needs":["ssow","ssowRev"]},"RV6":{"on":true,"sev":"review","area":"Revisions","what":"A filled ACN Ref needs ACN Rev.","basis":"Column notes, ACN Rev","needs":["acnRef","acnRev"]},"RV7":{"on":true,"sev":"review","area":"Revisions","what":"A revision needs the document it belongs to. Spec Rev stays blank where Specification No. reads See SCD or See VICD.","basis":"Column notes, revision columns","needs":[]},"RV8":{"on":true,"sev":"review","area":"Revisions","what":"Each ICD entry carries its revision, written document Rev x.","basis":"Column notes, ICD","needs":["icd"]},"SV1":{"on":true,"sev":"review","area":"Software","what":"A CSCI or Firmware CI names its SVD, or N/A.","basis":"Column notes, SVD Ref","needs":["type","svdRef"]},"SV2":{"on":true,"sev":"note","area":"Software","what":"A HWCI carries no SVD Ref.","basis":"Column notes, SVD Ref","needs":["type","svdRef"]},"EF1":{"on":true,"sev":"review","area":"Effectivity","what":"A CI with PN Variants rows leaves Effectivity blank. Each variant carries its own.","basis":"Column notes, Effectivity","needs":["eff"]},"EF2":{"on":true,"sev":"review","area":"Effectivity","what":"See PN Variants needs PN Variants rows.","basis":"Column notes, Effectivity","needs":["eff"]},"VA1":{"on":true,"sev":"flag","area":"PN Variants","what":"Each variant row names a CI ID that exists.","basis":"How to use, PN Variants","needs":[]},"VA2":{"on":true,"sev":"review","area":"PN Variants","what":"A variant flag that differs from its CI says why in Notes.","basis":"How to use, PN Variants","needs":["ser","lot"]},"VA3":{"on":true,"sev":"flag","area":"PN Variants","what":"Software variants read N and N for the two recording flags.","basis":"Column notes, recording flags","needs":["type"]},"VA4":{"on":true,"sev":"flag","area":"PN Variants","what":"Each variant row carries a PIN or version identifier.","basis":"How to use, PN Variants","needs":[]},"VA5":{"on":true,"sev":"note","area":"PN Variants","what":"The CI row keeps the base or representative PIN.","basis":"How to use, PIN","needs":["pin"]},"VA6":{"on":true,"sev":"review","area":"PN Variants","what":"A CI with only one variant row is not a variant family.","basis":"Same-CI decision aid, verdicts","needs":[]},"VA7":{"on":true,"sev":"flag","area":"PN Variants","what":"A variant ACN Level 0 to 7 requires its ACN Ref.","basis":"How to use, PN Variants","needs":["acnLvl","acnRef"]},"VA8":{"on":true,"sev":"flag","area":"PN Variants","what":"A variant ACN Ref requires its ACN Level.","basis":"How to use, PN Variants","needs":["acnLvl","acnRef"]},"VA9":{"on":true,"sev":"review","area":"PN Variants","what":"A variant of a CSCI or Firmware CI names its SVD.","basis":"How to use, PN Variants","needs":[]},"VA10":{"on":true,"sev":"review","area":"PN Variants","what":"A variant SVD Ref or ACN Ref needs its revision.","basis":"How to use, PN Variants","needs":[]},"VA11":{"on":true,"sev":"review","area":"PN Variants","what":"A variant revision needs the document it belongs to.","basis":"How to use, PN Variants","needs":[]},"LS1":{"on":true,"sev":"review","area":"Lists","what":"A dropdown column holds a value from its list.","basis":"Lists sheet","needs":[]},"TY1":{"on":true,"sev":"review","area":"Format","what":"A number or date column holds a number or a date.","basis":"Build settings","needs":[]}},"custom":[],"reference":[{"title":"What this index is","kind":"list","items":["The index holds CIs, and only CIs. Customer equipment outside the product structure goes on the interface register only. CIs that exist only between a sub-supplier and the company stay out. End-item traceability is not an index topic.","The index is the hub for CI status. It flags what applies to each CI and points to the record that owns each answer. It does not copy content from those records.","Each column holds a fixed property of the CI. Timing lives in the baseline columns."]},{"title":"Definitions","kind":"list","items":["**Configuration Item (CI).** Any hardware, software, firmware, or aggregation thereof that satisfies a system end-use function and is designated for separate configuration management. Designation includes establishing the CI’s requirements and verifying that its configuration meets those requirements and that its configuration documentation accurately describes its configuration.","**Part or Identifying Number (PIN).** The identifier that, combined with the design activity CAGE code, uniquely identifies an item and its configuration. The PIN changes when a modification creates a non-interchangeable condition.","**Safety-Critical Item (SCI).** A hardware or software item that has been determined through analysis to potentially contribute to a hazard with Catastrophic or Critical mishap potential, or that may be implemented to mitigate a hazard with Catastrophic or Critical mishap potential.","**Severity Category.** A classification of a failure mode by its severity, the worst potential consequence of a failure, determined by the degree of injury, property damage, or system damage that could ultimately occur. Category I, Catastrophic: a failure which may cause death or weapon system loss (i.e., aircraft, tank, missile, ship, etc.). Category II, Critical: a failure which may cause severe injury, major property damage, or major system damage which will result in mission loss. Category III, Marginal: a failure which may cause minor injury, minor property damage, or minor system damage which will result in delay or loss of availability or mission degradation. Category IV, Minor: a failure not serious enough to cause injury, property damage, or system damage, but which will result in unscheduled maintenance or repair.","**Control Tier.** The record of who baselines and controls a CI’s specification. The three tiers are Acquirer-spec controlled, Company-spec controlled, and GFE.","**Product Definition Data (PDD).** The design data that defines an item’s physical and functional attributes: drawings, models, and associated lists such as parts lists.","**Source Control Drawing (SCD).** A drawing that provides an engineering description, qualification requirements, and acceptance criteria for a vendor-developed or commercial item procurable from a specialized segment of industry that provides the performance, installation, and interchangeability characteristics required for a critical application, and that identifies the approved sources. The company controls form, fit, function, interface, and qualification. The vendor holds the detailed design.","**Vendor Item Control Drawing (VICD).** A drawing that provides an engineering description and acceptance criteria sufficient to identify and select a vendor-developed or commercial item, and that identifies the vendor and the vendor item identification. It controls selection. It does not control the item, and the company holds no design authority over it.","**Software Version Description (SVD).** A document that identifies and describes a software version consisting of one or more CSCIs. It is used to release, track, and control software versions.","**Effectivity.** The units, lots, serial numbers, or end items to which a configuration applies.","**Approval and Clearance Notice (ACN).** A document that records the development or qualification status of an item and its use in its specified environments or applications. It records the limitations associated with a HWCI or CSCI as it moves through the component and platform qualification testing process. Seven clearance levels, Level 1 to Level 7, sit above Level 0, which provides no clearance. An ACN may or may not be required for each HWCI or CSCI, based on organization requirements."]},{"title":"","kind":"pull","items":["The safety-critical item is not the critical safety item. Different authority, different object, different obligation."]},{"title":"How the tool works","kind":"list","items":["**Hierarchy is entered once.** Pick the parent. The tool derives Level and the indented name. The three forms of hierarchy in the workbook can no longer disagree.","**Checks run as you type.** They mark a cell for review. They never block entry. The Checks tab lists every finding and the rule behind it.","**Sources drive the flags.** Pick each source that drives the unit record. The tool shows what the sources call for, and sets the four flags on request.","**Rows are retired, not deleted.** A CI the Acquirer has concurred in cannot be deleted. De-designate it, or split or consolidate it. The tool keeps the old row and writes the trace on both sides.","**Same PIN, another position.** Decision Path B can return separate CIs against one PIN. This action copies the row under a new CI ID. Key CSA on the CI and the installed position together.","**The index fills in stages.** A row needs one filled cell to import, and a CI needs only its ID, parent, name, type, and status to start. Set Index stage on the Index card. The tool then holds the blank-entry hints for columns that fall due at a later stage. The Excel columns tab shows what the import accepts and when each column falls due.","**Every pointer carries its revision.** Specification No., SCD, VICD, SVD Ref, SSOW, and ACN Ref each have a revision column beside them. An ICD entry carries its revision in the cell, written ICD-2200-210 Rev A. The release record is the source for each revision. In the detail panel, the ICD field is a list of document and revision boxes, and the tool writes the cell. The Excel export adds an ICD List sheet with one row per ICD, for reading and delivery.","**Effectivity is derived until you type it.** A single-PIN CI shows All units. A CI with PN Variants rows shows See PN Variants, and each variant row carries its own effectivity. Type a value only where a single-PIN CI applies to some units. The Table view and the Excel export show a derived value in gray italics.","**Save keeps everything.** The saved file holds the index, the variants, and the edit log. The Excel export is the exchange copy. Import reads a CI index template workbook or a prior export. It reads the CI Index and PN Variants sheets.","**The structural floor.** The Structural floor tab lists each parent and child in different control tiers, and each GFE CI. Each needs at least one Mapped row on the interface register. The tool does not pair sibling CIs. Interfaces reach the register from Systems Engineering’s interface sources.","**Metrics show coverage and profile.** The Metrics tab reads the index as it stands. Coverage ratios should climb toward 100 percent. Each shows Recorded, where the cells are filled, and Verified, where the related checks pass too. Profile shares describe the index and have no target. Filter by control tier or by branch. Export metrics to PowerPoint writes one slide per metric, with each chart as a picture.","**The block diagram draws the CI hierarchy.** Each live CI is a block, joined to its parent by Parent CI ID. Pick a branch, the levels shown, a layout, the block fields, and the box styles. Export the current view, or a paged set with an overview page and one page per branch. Every export carries a title block. The PowerPoint export uses native shapes, with connectors glued to the blocks."]},{"title":"Rules carried from the template","kind":"list","items":["Every CI goes to the Acquirer for concurrence, including Company-spec controlled CIs. A CI reads Proposed until the Acquirer concurs. Enter the concurrence, then set Status to Active. GFE rows read N/A.","Criterion (b) Met is the umbrella safety column. Criterion (b) is mandatory for safety. Any external criticality designation (C-1) satisfies criterion (b) on its own. So does a FMECA failure mode of Category I or II, once traced to the item that hosts it. None of these sources catches every item whose loss is loss of primary system capability with no injury pathway. Find those items in the program’s own decomposition.","FMECA Severity records the highest severity category among the failure modes the FMECA records against the CI. FMECA Ref points to the entry. The FMECA keeps every failure mode. Read the severity category, not the criticality number. Not analyzed means the CI sits outside the FMECA.","Influencing parts fail criterion (b) by their own definition but qualify on criterion (a). See the criticality designations appendix.","The FBL is a system-level baseline. Record it on the top-level CI only. The initial product baseline is established at completion of CDR. The formalized PBL takes its event from the Audit Designation Assessment Record. This index does not record audit designation.","Do not copy handling instructions, IUID triggers, unique item identifiers, life limit values, date codes, or heat-lot details into this index.","Where MBSE is used, CI parent-child relationships mirror the model decomposition. A same-CI verdict that mismatches the model is not entered until Systems Engineering dispositions it.","ACN Ref, ACN Rev, and ACN Level point to the CI’s current ACN. Record the number, its revision, and the level, or Not required. Levels 1, 2, and 4 carry limitations, and the ACN Remarks state them. Do not copy them into this index. A formalized product baseline with an ACN below Level 5 is a review item. A variant with its own ACN records it on the PN Variants sheet. In Excel, the level number alone, such as 2, is enough. The import reads 2, L2, Level 2, or ACN 2 and stores Level 2 (Limited Operation, Non-Flight). The edit log records each conversion.","Record the current released revision of each document the index names. A document number without its revision does not say which version is current. Update the revision at each re-release. Spec Rev stays blank where Specification No. reads See SCD or See VICD.","An SCD and a VICD follow different source rules. An SCD identifies the approved sources, and only they may supply the item. A VICD identifies the vendor and its item, and it controls selection only. Record the drawing in its own column, and record one of the two, not both.","CSCI and Firmware rows name their SVD and its revision, or N/A where the contract calls for none. For Firmware controlled with its device on one altered item drawing, the PIN is the part number of the device with the code."]}],"examples":{"cis":[{"id":"CI-0001","parent":"","name":"Air Vehicle System","type":"HWCI","tier":"Acquirer-spec contr cd":"","vicdRev":"","svdRef":"","svdRev":"","icd":"ICD-2200-210 Rev A; ICD-2210-310 Rev A; IRS-2210-101 Rev B; IDD-2211-001 Rev A","ssow":"","ssowRev":"","mbse":"blk.FCC","ata":"27-10","mae":"","critB":"Y","sci":"Y","sciRef":"SSHA-2210; HL-015","fmeca":"I (Catastrophic)","fmecaRef":"FMECA-2210","selRef":"CISEL-0013","concur":"CIL-SUB-001 / 2025-08-29","fbl":"N/A (system-level baseline)","abl":"Established 2026-02-02","ipbl":"Planned CDR","fpbl":"Planned PCA","acnRef":"ACN-2210-003","acnRev":"C","acnLvl":"Level 5 (Flight Clearance)","ser":"Y","lot":"Y","src":"IUID; Special handling","life":"None","sh":"Y","iuid":"Y","notdec":"N","status":"Active","sup":"","notes":"NH PIN is the forward avionics rack, which is not a CI. The parent CI is the flight control system."},{"id":"CI-0014","parent":"CI-0013","name":"FCC Operational Flight Program","type":"CSCI","tier":"Acquirer-spec controlled","oda":"XYZ Software","cage":"1ABC2","pin":"OFP-2211-001","nhpin":"FCC-2210-003","qty":"1","eff":"","spec":"SRS-2211","specRev":"B","scd":"","scdRev":"","vicd":"","vicdRev":"","svdRef":"SVD-2211-001","svdRev":"C","icd":"IRS-2210-101 Rev B; IDD-2211-001 Rev A","ssow":"","ssowRev":"","mbse":"blk.OFP","ata":"27-10","mae":"","critB":"Y","sci":"Y","sciRef":"SSHA-2211; HL-015","fmeca":"Not analyzed","fmecaRef":"","selRef":"CISEL-0014","concur":"CIL-SUB-001 / 2025-08-29","fbl":"N/A (system-level baseline)","abl":"Established 2026-02-02","ipbl":"Planned CDR","fpbl":"Planned PCA","acnRef":"ACN-2211-006","acnRev":"A","acnLvl":"Level 4 (Limited Flight Clearance)","ser":"N","lot":"N","src":"","life":"None","sh":"N","iuid":"N","notdec":"N","status":"Active","sup":"","notes":"SCI software; version ID per SVD"},{"id":"CI-0021","parent":"CI-0012","name":"Actuator Assembly, Elevator","type":"HWCI","tier":"Company-spec controlled","oda":"ACME Actuation (SCD source)","cage":"9XYZ8","pin":"ACT-2230-002","nhpin":"FCS-2200-001","qty":"2","eff":"","spec":"See SCD","specRev":"","scd":"SCD-2230-001","scdRev":"A","vicd":"","vicdRev":"","svdRef":"","svdRev":"","icd":"ICD-2200-210 Rev A","ssow":"SSOW-114","ssowRev":"B","mbse":"blk.ACT-E","ata":"27-30","mae":"","critB":"Y","sci":"Y","sciRef":"FMECA-2230; HL-014","fmeca":"I (Catastrophic)","fmecaRef":"FMECA-2230 FM-03","selRef":"CISEL-0021","concur":"CIL-SUB-001 / 2025-08-29","fbl":"N/A (system-level baseline)","abl":"Internal, 2026-01-30","ipbl":"Internal, 2026-04-10","fpbl":"Planned PCA","acnRef":"ACN-2230-002","acnRev":"A","acnLvl":"Level 5 (Flight Clearance)","ser":"Y","lot":"Y","src":"Critical safety item; Cycle/usage-controlled life limit","life":"Cycle/usage","sh":"N","iuid":"Y","notdec":"Y","status":"Active","sup":"","notes":"Source-controlled (WT02 per SSOW-114): ACME designs the internals under SCD-2230-001, and the company controls form, fit, function, interface, and qualification. Customer-designated critical safety item: serial through IUID, lot through source traceability. Bounds hazard control HL-014-C1 (see IF-0003, IF-0006). Qty 2: left and right elevators, one CI."},{"id":"CI-0030","parent":"CI-0001","name":"Mission Computer","type":"HWCI","tier":"Acquirer-spec controlled","oda":"XYZ Mission Systems","cage":"1ABC2","pin":"MC-3100-001","nhpin":"RK-2205-001","qty":"1","eff":"","spec":"PS-3100","specRev":"B","scd":"","scdRev":"","vicd":"","vicdRev":"","svdRef":"","svdRev":"","icd":"ICD-2210-310 Rev A; ICD-4600-100 Rev A; IRS-3110-101 Rev A; IDD-3111-001 Rev A","ssow":"","ssowRev":"","mbse":"blk.MC","ata":"46","mae":"","critB":"Y","sci":"N","sciRef":"","fmeca":"III (Marginal)","fmecaRef":"FMECA-2400","selRef":"CISEL-0030","concur":"CIL-SUB-002 / 2026-01-15","fbl":"N/A (system-level baseline)","abl":"Established 2026-02-02","ipbl":"Planned CDR","fpbl":"Planned PCA","acnRef":"ACN-2400-001","acnRev":"A","acnLvl":"Level 3 (Operation, Non-Flight)","ser":"Y","lot":"Y","src":"IUID; Special handling","life":"None","sh":"Y","iuid":"Y","notdec":"N","status":"Active","sup":"","notes":"Criterion (b) met on loss of primary sys function hex(h){ h=String(h||'').replace('#',''); if(h.length===3) h=h.split('').map(function(c){ return c+c; }).join(''); var n=parseInt(h,16); return isNaN(n)?null:[(n>>16)&255,(n>>8)&255,n&255]; }
function mix(a,b,t){ return '#'+a.map(function(x,i){ return Math.round(x+(b[i]-x)*t).toString(16).padStart(2,'0'); }).join(''); }
function applyText(){
  var th=C.theme||{}, a=hex(th.accent), k=hex(th.ink), css=':root{';
  if(a) css+='--rust:'+mix(a,a,0)+';--rust-ink:'+mix(a,[0,0,0],0.25)+';--rust-soft:'+mix(a,[255,255,255],0.85)+';';
  if(k) css+='--ink:'+mix(k,k,0)+';--ink-2:'+mix(k,[255,255,255],0.08)+';';
  var st=document.createElement('style'); st.textContent=css+'}'; document.head.appendChild(st);
  var t=C.text||{};
