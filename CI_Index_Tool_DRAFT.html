  $('t-top').textContent=t.top||''; $('t-sub').textContent=t.sub||'';
  $('t-h1').textContent=t.h1||''; $('t-lede').textContent=t.lede||'';
  $('t-foot').innerHTML=(t.foot||[]).map(function(p){ return '<p>'+md(p)+'</p>'; }).join('');
  if(PREVIEW) $('prevbar').style.display='block';
}

/* ===================================================================
   Hierarchy
   =================================================================== */
function buildTree(){
  var ids={}, kids={}, roots=[], byUid={};
  S.cis.forEach(function(r){ byUid[r.uid]=r; if(r.id) (ids[r.id]=ids[r.id]||[]).push(r); });
  S.cis.forEach(function(r){
    if(!r.parent) roots.push(r);
    else if(ids[r.parent]&&ids[r.parent][0]!==r){ var p=ids[r.parent][0]; (kids[p.uid]=kids[p.uid]||[]).push(r); }
  });
  var order=[], lvl={}, seen={};
  function walk(r,d){ if(seen[r.uid]) return; seen[r.uid]=1; lvl[r.uid]=d; order.push(r); (kids[r.uid]||[]).forEach(function(c){ walk(c,d+1); }); }
  roots.forEach(function(r){ walk(r,0); });
  var unplaced=S.cis.filter(function(r){ return !seen[r.uid]; });
  var cyc={}, orphan={};
  unplaced.forEach(function(r){
    if(r.parent&&!ids[r.parent]) { orphan[r.uid]=1; return; }
    if(r.parent===r.id){ cyc[r.uid]=1; return; }
    var x=r, hop={}, n=0;
    while(x&&x.parent&&ids[x.parent]&&n<10000){ if(hop[x.uid]){ cyc[r.uid]=1; break; } hop[x.uid]=1; x=ids[x.parent][0]; n++; }
  });
  T={ids:ids,kids:kids,roots:roots,order:order,lvl:lvl,unplaced:unplaced,cyc:cyc,orphan:orphan,byUid:byUid};
  return T;
}
function parentOf(r){ return r.parent&&T.ids[r.parent]?T.ids[r.parent][0]:null; }
function ancestors(r){ var a=[], x=parentOf(r), n=0; while(x&&n<500){ if(x===r||a.indexOf(x)>=0) break; a.push(x); x=parentOf(x); n++; } return a; }
function descendants(r){ var out=[], st=(T.kids[r.uid]||[]).slice(); while(st.length){ var x=st.shift(); if(out.indexOf(x)>=0) continue; out.push(x); st=st.concat(T.kids[x.uid]||[]); } return out; }
function liveKids(r){ return (T.kids[r.uid]||[]).filter(live); }
function exportOrder(){ return T.order.concat(T.unplaced); }

/* ===================================================================
   Checks
   =================================================================== */
function cond(v,op,x){
  v=tr(v).toLowerCase(); var s=String(x==null?'':x).trim().toLowerCase();
  switch(op){
    case 'always': return true;
    case 'is': return v===s;
    case 'isnot': return v!==s;
    case 'blank': return !v;
    case 'notblank': return !!v;
    case 'contains': return v.indexOf(s)>=0;
    case 'notcontains': return v.indexOf(s)<0;
    case 'oneof': return s.split(',').map(function(y){ return y.trim(); }).indexOf(v)>=0;
  }
  return false;
}
function runChecks(){
  buildTree();
  F=[]; FI={}; FV={}; CNT={flag:0,review:0,note:0}; HELD=[];
  function add(rule,r,k,m,v,sev){
    if(!sev){ if(!ruleOn(rule)) return; sev=ruleInfo(rule).sev; }
    if(r&&!v&&heldBlank(rule,r,k)){ HELD.push({rule:rule,uid:r.uid,k:k}); return; }
    var f={rule:rule,sev:sev,uid:r?r.uid:null,vuid:v?v.uid:null,k:k||null,m:m};
    F.push(f); CNT[f.sev]++;
    if(r){ var o=FI[r.uid]=FI[r.uid]||{all:[],k:{}}; o.all.push(f); if(k) (o.k[k]=o.k[k]||[]).push(f); }
    if(v){ var p=FV[v.uid]=FV[v.uid]||{all:[],k:{}}; p.all.push(f); if(k) (p.k[k]=p.k[k]||[]).push(f); }
  }
  var usesMBSE=has('mbse')&&S.cis.some(function(r){ return tr(r.mbse); });
  var liveRoots=T.roots.filter(live);
  var srcRole=function(src,role){ return src.filter(function(s){ return isRole(s,role); }).map(canon); };

  S.cis.forEach(function(r){
    var L=live(r), G=isGFE(r), src=r.src||[], par=parentOf(r);
    var hasOther=srcRole(src,'other').length>0;

    /* columns: required, list, and format */
    COLS.forEach(function(c){
      if(c.kind==='level') return;
      var v=val(r,c.k);
      if(c.req&&L&&!v&&!(G&&!c.reqGFE)) add('RQ',r,c.k,hd(c.k)+' is required, and it is blank.',null,c.req);
      if(c.kind==='enum'&&v&&LISTS[c.list]&&LISTS[c.list].indexOf(v)<0) add('LS1',r,c.k,'"'+v+'" is not on the '+(C.lists[c.list]?C.lists[c.list].name:c.list)+' list.');
      if(c.kind==='yn'&&v&&v!=='Y'&&v!=='N') add('LS1',r,c.k,hd(c.k)+' reads "'+v+'". Enter Y or N.');
      if(c.kind==='number'&&v&&isNaN(+v)&&!isNA(v)) add('TY1',r,c.k,hd(c.k)+' reads "'+v+'". Enter a number.');
      if(c.kind==='date'&&v&&!/^\d{4}-\d{2}-\d{2}$/.test(v)) add('TY1',r,c.k,hd(c.k)+' reads "'+v+'". Enter a date as YYYY-MM-DD.');
    });

    /* custom rules */
    (C.custom||[]).forEach(function(c){
      if(!ruleOn(c.id)) return;
      if(c.scope!=='all'&&!L) return;
      if(c.skipGFE&&G) return;
      if(!cond(c.ifCol==='*'?'':val(r,c.ifCol),c.ifOp,c.ifVal)) return;
      if(cond(val(r,c.thenCol),c.thenOp,c.thenVal)) return;
      add(c.id,r,c.thenCol,c.msg||CUST[c.id].what,null,c.sev);
    });

    /* structure */
    if(!tr(r.id)) add('ST1',r,'id','CI ID is blank. Every CI needs a program-unique identifier.');
    else if(T.ids[r.id].length>1) add('ST2',r,'id','CI ID '+r.id+' appears on '+T.ids[r.id].length+' rows. Each CI ID must be unique.');
    if(r.parent&&T.orphan[r.uid]) add('ST3',r,'parent','Parent CI ID '+r.parent+' does not exist in the index.');
    if(T.cyc[r.uid]) add('ST4',r,'parent','The parent chain loops back to this CI. Break the loop.');
    if(!r.parent&&L&&liveRoots.length>1&&liveRoots[0]!==r) add('ST5',r,'parent','A second CI has no parent. Only the top-level CI ('+(liveRoots[0].id||'unnamed')+') has no parent.');
    if(L&&par&&!live(par)) add('ST6',r,'parent','The parent CI '+par.id+' reads '+par.status+'. Reparent this CI or retire it.');
    if(!tr(r.tier)) add('ST7',r,'tier',hd('tier')+' is blank.');
    if(TIER.co&&r.tier===TIER.co&&!ancestors(r).some(function(a){ return a.tier===TIER.acq; }))
      add('ST8',r,'tier','A '+TIER.co+' CI sits below an '+TIER.acq+' CI. No ancestor of this CI is '+TIER.acq+'.');
    if(r.notdec==='Y'&&liveKids(r).length) add('ST9',r,'notdec','This CI is a supplier-designed unit, yet it has child CIs. Do not decompose a supplier-designed item to identify customer-facing CIs.');

    /* status and concurrence */
    if(!tr(r.status)) add('CO1',r,'status','Status is blank.');
    if(!G){
      if(r.status===ST.active&&!tr(r.concur)) add('CO2',r,'concur','Status reads '+ST.active+', but no Acquirer concurrence is recorded. A CI reads '+ST.proposed+' until the Acquirer concurs.');
      if(r.status===ST.proposed&&tr(r.concur)&&!isNA(r.concur)) add('CO3',r,'status','An Acquirer concurrence is recorded. Set Status to '+ST.active+'.');
      if(L&&!tr(r.selRef)) add('CO5',r,'selRef','No CI selection criteria checklist is referenced.');
    } else if(tr(r.concur)&&!isNA(r.concur)) add('CO4',r,'concur','GFE rows read N/A for Acquirer concurrence.');

    var seeV=/see\s+vicd/i.test(r.spec||''), seeS=!seeV&&/see\s+scd/i.test(r.spec||''), vk=has('vicd')?'vicd':'scd';
    if(seeS&&!tr(r.scd)) add('DO1',r,'scd',hd('spec')+' reads See SCD, but no drawing is recorded in '+hd('scd')+'.'+(has('vicd')&&tr(r.vicd)?' The drawing sits in '+hd('vicd')+'. Move it, or change '+hd('spec')+' to See VICD.':''));
    if(seeV&&!tr(r[vk])) add('DO1',r,vk,hd('spec')+' reads See VICD, but no drawing is recorded in '+hd(vk)+'.'+(vk==='vicd'&&tr(r.scd)?' The drawing sits in '+hd('scd')+'. Move it, or change '+hd('spec')+' to See SCD.':''));
    if(has('vicd')&&!noDoc(r.scd)&&!noDoc(r.vicd)) add('DO2',r,'vicd','Both '+hd('scd')+' and '+hd('vicd')+' are filled. An item is source-controlled or vendor-item-controlled, not both. Record the one drawing that controls the CI.');
    if(L){
      REVP.forEach(function(p){
        if(!has(p[0])||!has(p[1])) return;
        var d=tr(r[p[0]]), x=tr(r[p[1]]), nd=noDoc(d);
        if(!nd&&!x) add(p[2],r,p[1],hd(p[0])+' reads '+d+', but '+hd(p[1])+' is blank. Record the current released revision.');
        if(nd&&x&&!isNA(x)){
          var see=p[0]==='spec'&&/^see\s+(scd|vicd)/i.test(d), dk=see&&/vicd/i.test(d)&&has('vicdRev')?'vicdRev':'scdRev';
          add('RV7',r,p[1],hd(p[1])+' reads '+x+', but '+(see?hd('spec')+' reads '+d+'. The drawing revision goes in '+hd(dk)+'.':hd(p[0])+' '+(d?'reads '+d:'is blank')+'. A revision needs the document it belongs to.'));
        }
      });
      if(has('icd')){ var nr=refs(r.icd).filter(function(x){ return !x.rev&&!isNA(x.doc); }).map(function(x){ return x.doc; });
        if(nr.length) add('RV8',r,'icd',nr.join(', ')+(nr.length>1?' carry':' carries')+' no revision. Write each entry as the document number, then Rev and the revision, such as '+nr[0]+' Rev B.'); }
    }

    /* supersession */
    var sup=splitIds(r.sup);
    if(isSup(r)&&!sup.length) add('SU1',r,'sup','A superseded row names the new CI ID or IDs.');
    sup.forEach(function(id){
      if(!T.ids[id]) { add('SU2',r,'sup',id+' does not exist in the index.'); return; }
      var t=T.ids[id][0];
      if(splitIds(t.sup).indexOf(r.id)<0) add('SU3',r,'sup',id+' does not name '+(r.id||'this CI')+' in '+hd('sup')+'. Record the trace on both rows.');
    });

    if(G){
      var thin=['spec','specRev','scd','scdRev','vicd','vicdRev','svdRef','svdRev','ssow','ssowRev','mae','critB','sci','sciRef','fmeca','fmecaRef','selRef','fbl','abl','ipbl','fpbl','acnRef','acnRev','acnLvl','eff','ser','lot','life','sh','iuid','notdec'].filter(function(k){ return has(k)&&tr(r[k]); });
      if(has('src')&&src.length) thin.push('src');
      if(thin.length) add('GF1',r,null,'A GFE row is thin. These columns usually stay blank: '+thin.map(hd).join(', ')+'.');
    }
    if(G||!L) return;

    /* safety */
    var c1=src.filter(isC1).map(canon), csi=srcRole(src,'csi');
    if(!r.critB) add('SA1',r,'critB','Criterion (b) is not answered. Record the answer from the CI selection criteria checklist.');
    if(!r.sci) add('SA7',r,'sci','SCI is not answered.');
    if(r.sci==='Y'&&r.critB!=='Y') add('SA2',r,'critB','SCI = Y, so '+hd('critB')+' should read Y. A safety-critical item satisfies criterion (b).');
    if(c1.length&&r.critB!=='Y') add('SA3',r,'critB',c1.join(' and ')+' meets criterion (b) on its own (C-1, an external criticality designation). '+hd('critB')+' should read Y.');
    if(csi.length&&r.sci!=='Y') add('SA4',r,'sci',csi[0]+' is a source, but SCI is not Y. A critical safety item is expected on the SCI list. Its absence is a gap for System Safety to resolve.');
    if(r.sci==='Y'&&!tr(r.sciRef)) add('SA5',r,'sciRef','SCI = Y, but no record that names the item is cited.');
    if(r.sci==='N'&&tr(r.sciRef)) add('SA6',r,'sciRef','SCI = N, so '+hd('sciRef')+' stays blank.');
    if(has('fmeca')){
      if(!tr(r.fmeca)) add('SA11',r,'fmeca',hd('fmeca')+' is not answered. Record the highest category the FMECA assigns to a failure mode this CI hosts, or '+(lab('fmeca','na')||'Not analyzed')+'.');
      if(fmHigh(r)&&r.critB!=='Y') add('SA8',r,'critB',hd('fmeca')+' reads '+tr(r.fmeca)+'. A FMECA failure mode of Category I or II meets criterion (b) once it is traced to the item that hosts it. '+hd('critB')+' should read Y.');
      if(fmRated(r)&&!tr(r.fmecaRef)) add('SA9',r,'fmecaRef',hd('fmeca')+' reads '+tr(r.fmeca)+', but no FMECA entry is cited.');
      if(!fmRated(r)&&tr(r.fmecaRef)) add('SA10',r,'fmecaRef',(tr(r.fmeca)?hd('fmeca')+' reads '+tr(r.fmeca):'No FMECA category is recorded')+', so '+hd('fmecaRef')+' stays blank.');
    }
    if(has('acnLvl')){
      var an=acnNum(r), ac=acnCat(r.acnLvl), av=tr(r.acnLvl);
      if(!av) add('AC3',r,'acnLvl',hd('acnLvl')+' is not answered. Pick the level on the current ACN, or '+(lab('acn','notreq')||'Not required')+'.');
      if(an>=0&&!tr(r.acnRef)) add('AC1',r,'acnRef',hd('acnLvl')+' reads '+av+', but no '+hd('acnRef')+' is recorded.');
      if(tr(r.acnRef)&&an<0) add('AC2',r,'acnLvl',hd('acnRef')+' reads '+tr(r.acnRef)+', but '+hd('acnLvl')+' '+(av?'reads '+av:'is blank')+'. Record the level on that ACN.');
      if(ACN_LIM[an]) add('AC4',r,'acnLvl',hd('acnLvl')+' reads '+av+'. This level carries limitations. The ACN Remarks state them. Point to the ACN. Do not copy the limitations here.');
      if(an>=0&&an<5&&has('fpbl')&&baseClass(r.fpbl)==='est') add('AC5',r,'acnLvl',hd('fpbl')+' reads '+tr(r.fpbl)+', but '+hd('acnLvl')+' reads '+av+'. A formalized product baseline normally follows flight clearance, Level 5. Confirm the ACN is current.');
    }

    /* software version description */
    if(has('svdRef')){
      if(hasCode(r)&&!tr(r.svdRef)) add('SV1',r,'svdRef',hd('type')+' reads '+r.type+', but no '+hd('svdRef')+' is named. Name the Software Version Description for the current version, or enter N/A where the contract calls for none.');
      if(r.type&&!hasCode(r)&&!noDoc(r.svdRef)) add('SV2',r,'svdRef',hd('type')+' reads '+r.type+', but '+hd('svdRef')+' reads '+tr(r.svdRef)+'. An SVD describes software. Confirm '+hd('type')+', or clear '+hd('svdRef')+'.');
    }
    /* effectivity */
    if(has('eff')&&FEAT.tabs.variants){
      var nv=varsOf(r).length, ev=tr(r.eff);
      if(nv&&ev&&effKey(ev)!==effKey(EFF_VAR)) add('EF1',r,'eff',hd('eff')+' reads '+ev+', but CI '+r.id+' has '+nv+' PN Variants row'+(nv>1?'s':'')+'. Each variant row carries its own effectivity. Clear the CI row, and the tool shows '+EFF_VAR+'.');
      if(!nv&&effKey(ev)===effKey(EFF_VAR)) add('EF2',r,'eff',hd('eff')+' reads '+EFF_VAR+', but the CI has no PN Variants rows. Clear it, and the tool shows '+EFF_ALL+'. Or enter the units this CI applies to.');
    }

    /* recording */
    var serS=src.filter(drivesSerial).map(canon), lotS=src.filter(drivesLot).map(canon);
    var shS=srcRole(src,'sh'), iuS=srcRole(src,'iuid').concat(csi);
    if(r.ser==='Y'&&!serS.length&&!hasOther) add('RE1',r,'ser','Serialization = Y, but no source that drives serial recording is named.');
    if(serS.length&&r.ser!=='Y') add('RE2',r,'ser',serS.join('; ')+' drives serial recording. Serialization should read Y.');
    if(r.lot==='Y'&&!lotS.length&&!hasOther) add('RE3',r,'lot','Lot/Batch = Y, but no source that drives lot or batch recording is named.');
    if(lotS.length&&r.lot!=='Y') add('RE4',r,'lot',lotS.join('; ')+' drives lot or batch recording. Lot/Batch should read Y.');
    if(r.sh==='Y'&&!shS.length&&!hasOther) add('RE5',r,'sh','Special Handling = Y needs a special handling source.');
    if(shS.length&&r.sh!=='Y') add('RE6',r,'sh',shS[0]+' is a source. Special Handling should read Y.');
    if(r.iuid==='Y'&&!iuS.length&&!hasOther) add('RE7',r,'iuid','IUID Required = Y needs an IUID or critical safety item source.');
    if(iuS.length&&r.iuid!=='Y') add('RE8',r,'iuid',iuS.join(' and ')+' brings item unique identification. IUID Required should read Y.');
    src.forEach(function(s){ if(!srcInfo(s)) add('RE9',r,'src','"'+s+'" is not on the source list. Use a listed spelling, or pick an Other source and say what it is in Notes.'); });
    if(isSW(r)&&(r.ser==='Y'||r.lot==='Y')) add('RE10',r,r.ser==='Y'?'ser':'lot','Software CIs read N and N. Their identity sits on the loadable part number and the baseline.');
    var cyS=srcRole(src,'cycle').length>0, agS=srcRole(src,'age').length>0;
    if(LIFE.cycle&&(r.life===LIFE.cycle||r.life===LIFE.both)&&!cyS) add('RE11',r,'life','The life clock reads '+r.life+', but no cycle, ALI, or safe-life source is named. Confirm which source drives the record.');
    if(LIFE.age&&(r.life===LIFE.age||r.life===LIFE.both)&&!agS) add('RE11',r,'life','The life clock reads '+r.life+', but no age or shelf-life source is named. Confirm which source drives the record.');
    if((r.life===LIFE.none||!r.life)&&has('life')&&(cyS||agS)) add('RE11',r,'life','A life-limit source is named, but the life clock reads '+(r.life||'blank')+'.');
    var blank=['ser','lot','iuid','sh','life'].filter(function(k){ return has(k)&&!r[k]; });
    blank.filter(notDue).forEach(function(k){ HELD.push({rule:'RE12',uid:r.uid,k:k}); });
    blank=blank.filter(function(k){ return !notDue(k); });
    if(blank.length) add('RE12',r,blank[0],'Not answered: '+blank.map(hd).join(', ')+'.');

    /* baselines */
    if(!r.parent){ if(!tr(r.fbl)||isNA(r.fbl)) add('BA1',r,'fbl','The FBL is a system-level baseline. Record it on the top-level CI.'); }
    else if(tr(r.fbl)!==FBL_NA) add('BA2',r,'fbl','Enter '+FBL_NA+' on every row except the top-level CI.');

    /* model */
    if(usesMBSE&&!tr(r.mbse)&&!tr(r.mae)) add('MO1',r,'mbse','No model element and no model alignment exception. Where the CI departs from the model, record the reason Systems Engineering accepted.');
    if(tr(r.mbse)&&tr(r.mae)) add('MO2',r,'mae','The CI resolves to model element '+r.mbse+'. Leave '+hd('mae')+' blank, or clear the element ID.');
  });

  /* quantity per next higher assembly */
  var groups={};
  S.cis.forEach(function(r){
    if(!live(r)) return;
    var nh=tr(r.nhpin), q=tr(r.qty);
    if(isNA(nh)&&q&&!isNA(q)) add('QT1',r,'qty','NH PIN is N/A, so Qty per NH reads N/A.');
    if(nh&&!isNA(nh)&&!q) add('QT2',r,'qty','Qty per NH is blank. Take it from the next higher assembly’s parts list.');
    if(q&&!isNA(q)&&!/^[1-9]\d*$/.test(q)) add('QT3',r,'qty','Qty per NH reads "'+q+'". Enter a whole number of 1 or more, or N/A.');
    if(tr(r.pin)&&nh&&!isNA(nh)) { var key=tr(r.pin)+'\u0001'+nh; (groups[key]=groups[key]||[]).push(r); }
  });
  Object.keys(groups).forEach(function(key){
    var g=groups[key], qs={};
    g.forEach(function(r){ if(/^[1-9]\d*$/.test(tr(r.qty))) qs[tr(r.qty)]=1; });
    var ql=Object.keys(qs), pin=tr(g[0].pin), nh=tr(g[0].nhpin);
    if(ql.length>1){ g.forEach(function(r){ add('QT4',r,'qty','Rows sharing PIN '+pin+' and NH PIN '+nh+' carry different Qty per NH values ('+ql.join(', ')+').'); }); return; }
    if(!ql.length) return;
    var q=+ql[0], n=g.length, ids=g.map(function(r){ return r.id; }).join(', ');
    if(n!==1&&n!==q) g.forEach(function(r){ add('QT5',r,'qty',n+' rows share PIN '+pin+' and NH PIN '+nh+' ('+ids+'). Qty per NH is '+q+'. '+(q===1?'One row should carry this PIN and NH PIN.':'The count should be 1, where one CI covers every instance, or '+q+', where each instance is its own CI.')); });
    else if(q>1) g.forEach(function(r){ add('QT6',r,'qty','Qty per NH is '+q+' and '+(n===1?'one CI covers every instance':'each instance is its own CI ('+ids+')')+'. Confirm Decision Path B of the same-CI decision aid has been run.'); });
  });

  /* PN Variants */
  if(FEAT.tabs.variants){
    var vByCi={};
    S.vars.forEach(function(v){
      var c=tr(v.ciId), r=c&&T.ids[c]?T.ids[c][0]:null;
      if(!c) add('VA1',null,'ciId','The variant row names no CI ID.',v);
      else if(!r) add('VA1',null,'ciId','CI '+c+' does not exist in the index.',v);
      if(!tr(v.pin)) add('VA4',r,'pin','A variant row carries no PIN or version identifier.',v);
      if(r){

        else ['ser','lot'].forEach(function(k){
          if(v[k]&&r[k]&&v[k]!==r[k]&&!tr(v.notes)) add('VA2',r,k,'Variant '+(v.pin||'')+' reads '+VC(k)+' = '+v[k]+', but CI '+r.id+' reads '+r[k]+'. Variants share the CI’s source. Where this variant’s source differs, say so in its Notes.',v);
        });

        [['svdRef','svdRev'],['acnRef','acnRev']].forEach(function(p){

  }

  var ordIdx={}; exportOrder().forEach(function(r,i){ ordIdx[r.uid]=i; });

}

function stackBar(rows,k){
  var c={est:0,within:0,plan:0,other:0,blank:0,na:0};
  rows.forEach(function(r){ c[baseClass(r[k])]++; });
  var tot=rows.length-c.na||1, h='<div class="sbar stk">';

  h+='</div><div class="small" style="font-size:11.5px">'+['est','within','plan','other','blank'].filter(function(x){ return c[x]; }).map(function(x){ return '<span class="sw" style="background:'+(BC[x][1]||'var(--surface-2)')+(BC[x][1]?'':';box-shadow:inset 0 0 0 1px var(--mute)')+'"></span>'+c[x]+' '+BC[x][0].toLowerCase(); }).join(' &middot; ')+'</div>';

  return h+'<div class="small" style="font-size:11.5px">'+parts.map(function(p){ return '<span class="sw" style="background:'+(p[2]||'var(--surface-2)')+(p[2]?'':';box-shadow:inset 0 0 0 1px var(--mute)')+'"></span>'+p[1]+' '+p[0]; }).join(' &middot; ')+'</div>';

function diffIndex(old){
  var out=[], om={}, nm={};

  Object.keys(nm).forEach(function(id){
    var n=nm[id], o=om[id];

    COLS.forEach(function(c){ if(c.kind==='level'||c.k==='id') return; var a=val(o,c.k), b=val(n,c.k); if(a!==b) out.push({ci:id,ch:'Changed',f:c.h,from:a,to:b}); });
  });
  Object.keys(om).forEach(function(id){ if(!nm[id]) out.push({ci:id,ch:'Removed',f:'',from:om[id].name,to:''}); });
  function vk(v){ return tr(v.ciId)+' | '+tr(v.pin); }
  var ov={}, nv={};
  (old.vars||[]).forEach(function(v){ ov[vk(v)]=v; }); S.vars.forEach(function(v){ nv[vk(v)]=v; });
  Object.keys(nv).forEach(function(k){ var n=nv[k], o=ov[k];
    if(!o){ out.push({ci:tr(n.ciId),ch:'Variant added',f:VC('pin'),from:'',to:n.pin}); return; }
    VCOLS.forEach(function(c){ if(tr(o[c.k])!==tr(n[c.k])) out.push({ci:tr(n.ciId),ch:'Variant changed',f:n.pin+': '+c.h,from:tr(o[c.k]),to:tr(n[c.k])}); });

  Object.keys(ov).forEach(function(k){ if(!nv[k]) out.push({ci:tr(ov[k].ciId),ch:'Variant removed',f:VC('pin'),from:ov[k].pin,to:''}); });
  return out;
}

var STAGES=C.stages||[], HELD=[];
function stageIdx(k){ for(var i=0;i<STAGES.length;i++) if(STAGES[i].k===k) return i; return -1; }
function stageName(k){ var i=stageIdx(k); return i>=0?STAGES[i].name:'Any time'; }
function colStage(k){ return COL[k]&&COL[k].stage?stageIdx(COL[k].stage):-1; }
function notDue(k){ if(!S.meta.stage) return false; var cur=stageIdx(S.meta.stage); return cur>=0&&colStage(k)>cur; }
/* rules that fire because a cell is blank, and the column they name */
var BLANKR={ST1:'id',ST5:'parent',ST7:'tier',CO1:'status',CO5:'selRef',SA1:'critB',SA7:'sci',SA5:'sciRef',SA11:'fmeca',SA9:'fmecaRef',AC3:'acnLvl',AC1:'acnRef',RV1:'specRev',RV2:'scdRev',RV3:'vicdRev',RV4:'svdRev',RV5:'ssowRev',RV6:'acnRev',SV1:'svdRef',BA1:'fbl',BA2:'fbl',QT2:'qty',MO1:'mbse'};
var BLANK_ONLY={BA2:1};
function heldBlank(rule,r,k){
  if(!S.meta.stage||!k||!notDue(k)) return false;
  if(BLANKR[rule]===k){ if(BLANK_ONLY[rule]&&tr(r[k])) return false; return true; }
  if(rule==='RQ') return true;
  var cu=(C.custom||[]).filter(function(c){ return c.id===rule; })[0];
  return !!cu&&cu.thenOp==='notblank'&&cu.thenCol===k;
}
function headerKeys(){ return ['id','parent'].filter(has); }
function blankEffect(c){
  var out=[], k=c.k;
  Object.keys(BLANKR).forEach(function(id){ if(BLANKR[id]!==k||!ruleOn(id)) return; var x=ruleInfo(id); out.push(id+' ('+x.sev+'): '+x.what); });
  if(['ser','lot','iuid','sh','life'].indexOf(k)>=0&&ruleOn('RE12')) out.push('RE12 ('+ruleInfo('RE12').sev+'): '+ruleInfo('RE12').what);
  if(c.req) out.push('RQ ('+c.req+'): the build marks this column required'+(c.reqGFE?', on GFE rows too':'')+'.');
  (C.custom||[]).forEach(function(cu){ if(cu.on&&cu.thenOp==='notblank'&&cu.thenCol===k) out.push(cu.id+' ('+cu.sev+'): '+(cu.what||autoWhat(cu))); });
  if(k==='parent') out.unshift('The CI becomes a top-level CI. Only one live CI may have no parent.');
  if(k==='id') out.unshift('The row still loads. Nothing can name it as a parent, a variant, or a register side until it has an ID.');
  var t=out.length?out.join(' '):k==='eff'?'No hint fires.':'No hint fires. The column stays blank.';
  if(c.blankNote) t+=' '+c.blankNote;
  return t;
}
function readers(c){
  var r=Object.keys(RULES).filter(function(id){ return (RULES[id].needs||[]).indexOf(c.k)>=0&&ruleOn(id); });
  var s=r.length?'Rules '+r.join(', ')+'.':'';
  if(c.k==='parent') s='Level, indentation, and the hierarchy. '+s;
  if(c.reg) s+=(s?' ':'')+'Also read by the CI Interface Register.';

}

/* the CIs in scope: live, then the tier and branch filters */

function mBase(m,pop,popLab){ return {k:m.k,title:m.title,note:m.note,panel:m.panel,pop:pop.length,popLab:popLab,bars:[],legend:[],lines:[],lists:[],hero:null,take:'',due:mStage(m),msg:''}; }

function mTrace(m,scope){
  var o=mBase(m,scope,'live CIs, GFE included');
  var groups={}, pins={};
  S.cis.forEach(function(r){ if(!live(r)) return; var p=tr(r.pin), nh=tr(r.nhpin); if(p) pins[p]=1; if(p&&nh&&!isNA(nh)){ var k=p+'\u0001'+nh; (groups[k]=groups[k]||[]).push(r); } });
  var rec=0, ver=0, inside=0, outside=0, top=0, fails=[], outs=[];
  scope.forEach(function(r){
    var p=tr(r.pin), nh=tr(r.nhpin), q=tr(r.qty), miss=[];
    if(!p) miss.push(hd('pin')); if(!nh) miss.push(hd('nhpin')); if(!q) miss.push(hd('qty'));
    if(miss.length){ fails.push({r:r,why:'Blank: '+miss.join(', ')+'.'}); return; }
    rec++;
    if(isNA(nh)){
      if(r.parent){ fails.push({r:r,why:'NH PIN reads N/A, but the CI has a parent. N/A applies only where the CI has no higher assembly.'}); return; }
      if(!isNA(q)){ fails.push({r:r,why:'NH PIN is N/A, so Qty per NH reads N/A.'}); return; }
      ver++; top++; return;
    }
    if(!/^[1-9]\d*$/.test(q)){ fails.push({r:r,why:'Qty per NH reads "'+q+'". Enter a whole number of 1 or more.'}); return; }
    var g=groups[p+'\u0001'+nh]||[r], qs={};
    g.forEach(function(x){ if(/^[1-9]\d*$/.test(tr(x.qty))) qs[tr(x.qty)]=1; });
    if(Object.keys(qs).length>1){ fails.push({r:r,why:'Rows sharing PIN '+p+' and NH PIN '+nh+' carry different Qty per NH values.'}); return; }
    if(g.length!==1&&g.length!==+q){ fails.push({r:r,why:g.length+' rows share PIN '+p+' and NH PIN '+nh+'. Qty per NH is '+q+'. The count should be 1 or '+q+'.'}); return; }
    ver++;

  });

    o.bars.push({head:'Verified CIs, by where the NH PIN points'});
    o.bars.push({lab:'Verified',tot:ver,txt:plural(ver,'CI'),segs:[{n:inside,col:MP.a,lab:'Inside the index'},{n:outside,col:MP.d,lab:'Outside the index'},{n:top,col:MP.c,lab:'Top-level CI, no higher assembly'}]});

  }
  o.lines.push('Recorded means PIN, NH PIN, and Qty per NH are filled. Verified means the quantity checks pass: rows sharing a PIN and NH PIN number 1, or equal Qty per NH.');

}

function mDrw(m,scope){

function mAcn(m,scope){
  var pop=scope.filter(function(r){ return !isGFE(r); });
  var o=mBase(m,pop,'live CIs, GFE left out');

    if(/^lvl/.test(c)){ var n=+c.slice(3); cnt[n]++;

      if(n<5&&has('fpbl')&&baseClass(r.fpbl)==='est') lag.push({r:r,why:hd('fpbl')+' reads '+tr(r.fpbl)+'. The ACN is at Level '+n+'.'}); }
    else if(c==='notreq') nr++;
    else if(!tr(r.acnLvl)){ un++; una.push({r:r,why:hd('acnLvl')+' is not answered.'}); }
    else { odd++; una.push({r:r,why:hd('acnLvl')+' reads "'+tr(r.acnLvl)+'". Pick a value from the list.'}); }
  });
  var N=pop.length, req=N-nr-un-odd, hi=cnt[5]+cnt[6]+cnt[7], segs=[];
  o.hero={v:pct(hi,req),l:'of ACN CIs at Level 5 or above'};
  for(var i=7;i>=0;i--) segs.push({n:cnt[i],col:ACR[i],lab:'Level '+i});
  segs.push({n:nr,col:ACN_NR,lab:'Not required'}); segs.push({n:un+odd,col:MP.none,lab:'Unanswered'});
  o.bars.push({lab:'Live CIs',tot:N,txt:plural(N,'CI'),segs:segs});
  o.legend=segs.filter(function(s){ return s.n; }).map(function(s){ return {col:s.col,lab:s.lab,n:s.n}; });
  o.lines.push('This is a profile. It has no target. The level rises as each CI moves through qualification and clearance testing.');
  o.lines.push('Levels 1, 2, and 4 carry limitations. The ACN Remarks state them. The index points to the ACN. It does not copy the limitations.');
  if(lim.length) o.lists.push({head:'Levels 1, 2, and 4: limitations in the ACN Remarks',items:lim,plain:true});
  if(lag.length) o.lists.push({head:'Formalized PBL with an ACN below Level 5',items:lag});
  o.lists.push({head:'Unanswered',items:una});
  o.take=req+' of '+N+' CIs require an ACN. '+hi+' of them '+(hi===1?'is':'are')+' at Level 5 or above ('+pct(hi,req)+').'+(nr?' '+plural(nr,'CI needs','CIs need')+' no ACN.':'');

}

  if(o.due) h+='<p class="mdue"><span class="pill hold">Falls due at '+esc(o.due)+'</span> The index stage is earlier, so this metric reads low until then.</p>';
  h+='<p class="mtake">'+esc(o.take)+'</p>';

function dgGeoV3(S,E,by){

/* ----- PNG. The SVG renders to a canvas. Size stays inside browser limits. ----- */
function dgPngScale(w,h){ return Math.max(0.05,Math.min(2,16000/Math.max(w,h),Math.sqrt(16e6/(w*h)))); }
function dgPng(svg,w,h,sc){
  return new Promise(function(res,rej){
    var img=new Image();
    img.onload=function(){ try{
      var cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(w*sc)); cv.height=Math.max(1,Math.round(h*sc));

    }catch(e){ rej(e); } };
    img.onerror=function(){ rej(new Error('the browser could not draw the picture')); };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}

  var pages=scope==='paged'?dgPaged(R,ps,c):dgViewPages(R,c);

  var uq={}; pages.forEach(function(p){ p.L.boxes.forEach(function(b){ uq[b.uid]=1; }); }); var nci=Object.keys(uq).length;

    :' The view prints at '+Math.round(minS*100)+' percent of true size. Use the paged set for readable pages, or pick a branch.';
  try{
    if(fmt==='pdf'){ dl(dgPDF(frames,title),base+'.pdf','application/pdf'); msg('PDF exported. '+what+'.'+warn); return; }
    if(fmt==='pptx'){ dl(buildPptx(pages.map(function(pg,i){ return dgSlide(frames[i],pg.L,pg,c); }),title),base+'.pptx','application/vnd.openxmlformats-officedocument.presentationml.presentation');

    function nm(i,ext){ return base+(svgs.length>1?'_p'+String(i+1).padStart(2,'0'):'')+'.'+ext; }
    if(fmt==='svg'){
      if(svgs.length===1) dl(svgs[0],nm(0,'svg'),'image/svg+xml');
      else dl(makeZip(svgs.map(function(t,i){ return {name:nm(i,'svg'),data:t}; })),base+'_SVG.zip','application/zip');

    }).catch(function(e){ msg('PNG export failed: '+e.message+'.'); });
  }catch(e){ msg('Export failed: '+e.message+'.'); }
}

function dgRerender(){ var w=$('dgwrap'), sl=w?w.scrollLeft:0, st=w?w.scrollTop:0; render(); var w2=$('dgwrap'); if(w2&&S.dg.zoom){ w2.scrollLeft=sl; w2.scrollTop=st; } }

  var z=Math.min(cw/DGLAST.w,both?ch/DGLAST.h:9,1); return Math.max(0.05,Math.round(z*1000)/1000); }

  var r=w.getBoundingClientRect(), px=ev?ev.clientX-r.left:w.clientWidth/2, py=ev?ev.clientY-r.top:w.clientHeight/2;

function nextId(extra){

  (extra||[]).forEach(function(x){ taken[x]=1; });

}

function unzip(buf){

function inflate(e){

  if(e.method!==8) return Promise.reject(new Error('unsupported compression'));
  if(typeof DecompressionStream==='undefined') return Promise.reject(new Error('this browser cannot read compressed workbooks. Use a current Edge, Chrome, Firefox, or Safari'));
  var s=new Blob([e.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Response(s).arrayBuffer().then(function(b){ return new Uint8Array(b); });
}
function readPart(z,name){ var e=z[name]; if(!e) return Promise.resolve(null); return inflate(e).then(function(b){ return new DOMParser().parseFromString(new TextDecoder().decode(b),'application/xml'); }); }
function tags(n,t){ return Array.prototype.slice.call(n.getElementsByTagNameNS('*',t)); }
function txt(n){ return tags(n,'t').map(function(t){ return t.textContent; }).join(''); }
function colIdx(ref){ var m=/^([A-Z]+)/.exec(ref||''), n=0; if(!m) return -1; for(var i=0;i<m[1].length;i++) n=n*26+(m[1].charCodeAt(i)-64); return n-1; }
function sheetRows(doc,ss){
  var out=[];
  tags(doc,'row').forEach(function(rw){
    var arr=[], ri=parseInt(rw.getAttribute('r'),10)-1;
    tags(rw,'c').forEach(function(c,j){
      var ci=c.getAttribute('r')?colIdx(c.getAttribute('r')):j, t=c.getAttribute('t'), v;
      var vn=tags(c,'v')[0];
      if(t==='s') v=ss[parseInt(vn&&vn.textContent,10)]||'';
      else if(t==='inlineStr') v=txt(c);
      else v=vn?vn.textContent:'';
      arr[ci]=v;
    });
    arr._r=isNaN(ri)?out.length+1:ri+1; out[isNaN(ri)?out.length:ri]=arr;
  });
  return out.filter(Boolean);
}
function normH(h){ return String(h||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function mapRows(rows,cols,must){
  var hi=-1, mu=(Array.isArray(must)?must:[must]).map(normH);
  for(var i=0;i<Math.min(rows.length,15);i++){ if((rows[i]||[]).some(function(c){ return mu.indexOf(normH(c))>=0; })){ hi=i; break; } }
  if(hi<0) return null;
  var hm={}; (rows[hi]||[]).forEach(function(h,j){ hm[normH(h)]=j; });
  var map=cols.map(function(c){ var j=hm[normH(c.h)]; if(j==null) (c.alias||[]).forEach(function(a){ if(j==null&&hm[normH(a)]!=null) j=hm[normH(a)]; }); return j; });
  var out=[];
  rows.slice(hi+1).forEach(function(r){
    if(!r) return;
    var o={}, any=false;
    cols.forEach(function(c,i){ var j=map[i]; var v=j==null?'':tr(r[j]); if(v) any=true; o[c.k]=v; });
    if(any) out.push(o);

}
function doImport(file){
  var rd=new FileReader();
  rd.onload=function(){
    var z; try{ z=unzip(rd.result); }catch(e){ msg('Could not read that workbook: '+e.message); return; }
    var ss=[], wb, names={};
    readPart(z,'xl/sharedStrings.xml').then(function(d){ if(d) ss=tags(d,'si').map(txt); return readPart(z,'xl/workbook.xml'); })
    .then(function(d){ wb=d; return readPart(z,'xl/_rels/workbook.xml.rels'); })
    .then(function(d){
      var rels={}; tags(d,'Relationship').forEach(function(r){ var t=r.getAttribute('Target'); rels[r.getAttribute('Id')]=t.charAt(0)==='/'?t.slice(1):'xl/'+t.replace(/^\.\//,''); });
      tags(wb,'sheet').forEach(function(s){ var id=s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||s.getAttribute('r:id'); names[s.getAttribute('name')]=rels[id]; });
      function find(n){ var k=Object.keys(names).filter(function(x){ return x.trim().toLowerCase()===n; })[0]; return k?names[k]:null; }
      var ciP=find('ci index'), vP=find('pn variants'), aP=find('about');
      if(!ciP) throw new Error('no sheet named CI Index. The Excel columns tab lists what the import accepts');
      return Promise.all([readPart(z,ciP),vP?readPart(z,vP):null,aP?readPart(z,aP):null]);
    })
    .then(function(docs){
      var hn=[]; headerKeys().forEach(function(k){ hn.push(COL[k].h); (COL[k].alias||[]).forEach(function(a){ hn.push(a); }); });
      var ci=mapRows(sheetRows(docs[0],ss),COLS,hn);
      if(!ci) throw new Error('the CI Index sheet has no header row with '+headerKeys().map(hd).join(' or ')+' in its first 15 rows. The Excel columns tab lists what the import accepts');
      var vv=docs[1]?mapRows(sheetRows(docs[1],ss),VCOLS,VC('pin')):null;
      var meta={prog:S.meta.prog,doc:S.meta.doc,rev:S.meta.rev,stage:S.meta.stage};
      if(docs[2]) sheetRows(docs[2],ss).forEach(function(r){ var k=normH(r[0]); if(k==='program') meta.prog=r[1]||''; if(k==='indexdocumentnumber') meta.doc=r[1]||''; if(k==='revision') meta.rev=r[1]||''; if(k==='indexstage'){ var sv=STAGES.filter(function(x){ return normH(x.name)===normH(r[1]); })[0]; meta.stage=sv?sv.k:''; } });
      if(S.cis.length&&!confirm('Replace the current index with '+ci.rows.length+' rows from '+file.name+'? Save first if you want to keep the current one.')) return;
      var keepLog=S.log;
      loadData({meta:meta,cis:ci.rows,vars:vv?vv.rows:[]},null);
      S.imp={file:file.name,at:stamp(),headerRow:ci.headerRow,rows:ci.rows.length,noId:ci.rows.filter(function(x){ return !x.id; }).length,missing:ci.missingKeys,vars:vv?vv.rows.length:null};
      S.log=keepLog; logEdit('',null,'','Imported '+ci.rows.length+' CI rows and '+(vv?vv.rows.length:0)+' variant rows from '+file.name,'Import');
      dirty(); render();
      msg('Imported '+ci.rows.length+' CI rows and '+(vv?vv.rows.length:0)+' variant rows. Level and indentation were recomputed from '+hd('parent')+'.'+(ci.missing.length?(ci.missing.length>6?' '+ci.missing.length+' columns not found':' Columns not found: '+ci.missing.join(', '))+'. They loaded as blank. The Excel columns tab lists them and shows the effect.':''));
      if(NORM_LOG.length) normReport('Converted on import');
    })
    .catch(function(e){ msg('Could not import that workbook: '+e.message+'.'); });
  };
  rd.readAsArrayBuffer(file);
}

  }
