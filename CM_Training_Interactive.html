{
 id:"M2", label:"Module 2", title:"Sub-Supplier CM Flowdown",
 sub:"Imposing CM requirements on the supply chain, and proving they work",
 sections:[
  {id:"M2-01", title:"Why flowdown exists", body:[
    P("Performing configuration management includes responsibility for the CM performance of the supply chain. The governing obligation: **flow to sub-suppliers the same CM requirements imposed on the company, or suitable tailorings of them.**"),
    P("Two words do most of the work. *Same* sets the default \u2014 the starting point is everything, not nothing. *Suitable* permits reduction, but suitability has to be established and recorded."),
    S("A barrier that exists at this tier and not at the tier that performs the work is not a barrier.",
      "If your company controls change and records as-built configuration, but the supplier who actually builds the item does neither, the control does not exist where the risk is. The paperwork is at one address and the hazard is at another."),
    CARDS([
      {h:"Not a sixth CM function", b:"The requirements flowed are identification, change, status accounting and audit requirements \u2014 the same four you already know. This process governs how they are selected, imposed and verified at the supplier tier."},
      {h:"Every tier, every procurement", b:"Design, build, software or firmware development, repair or overhaul, special processes, or catalog items incorporated into the product. A supplier with sub-tiers of its own flows the same obligation downward."},
      {h:"The floor flows too", b:"Floor requirements flow to every tier. A supplier-tier proposal to tailor or omit one is dispositioned through the floor gate and recorded \u2014 performed, replaced by a documented equivalent control, or risk-accepted at the named authority. Never silently dropped."}
    ],3)
  ], check:{
    q:"What is the default position when deciding what CM requirements to flow to a sub-supplier?",
    o:["Flow the minimum the contract explicitly requires",
       "Flow everything imposed on the company, then reduce only where suitability is established and recorded",
       "Flow whatever the supplier\u2019s quality system already covers",
       "Flow requirements proportionate to the value of the purchase order"],
    a:1,
    why:"\u201cSame requirements, or suitable tailorings\u201d sets the default at everything. Reduction is permitted but must be earned \u2014 suitability has to be established and recorded, never assumed."
  }},

  {id:"M2-02", title:"Two questions drive everything", body:[
    CARDS([
      {h:"1. Who holds design authority?", b:"The company, the supplier, the vendor \u2014 or split, with the company controlling form, fit, function, interface and qualification while the supplier owns the internals. This determines whether the supplier can change anything, which decides whether change control applies."},
      {h:"2. Who performs the build?", b:"The company, the supplier, or nobody \u2014 a process-only service. This determines whether there is an as-built configuration to reconcile, which decides whether the whole traceability and reconciliation apparatus applies."}
    ],2),
    P("Item type \u2014 hardware, software, commercial item, service \u2014 is a modifier on the answer, not a third question."),
    S("Every other requirement in the matrix follows from those two facts.",
      "Which is why classification is performed before derivation, and why a procurement whose classification cannot be determined is not released until it can.")
  ], check:{
    q:"Why are design authority and who-performs-the-build the two questions that drive classification?",
    o:["Because they are the two facts most reliably stated in a purchase order",
       "Because they determine price and schedule risk",
       "Because they determine whether change control applies and whether there is an as-built configuration to reconcile",
       "Because the Acquirer requires both to be recorded"],
    a:2,
    why:"They determine what can go wrong. Design authority decides whether the supplier can change anything. Who builds decides whether there is an as-built to reconcile against released design."
  }},

  {id:"M2-03", title:"The eight work types", body:[
    TABLE(["Work type","What it is","Design authority","Build by"],[
      ["Build-to-print","The company designs; the supplier manufactures to the released technical data package","Company","Supplier"],
      ["Source-controlled design and build","The supplier designs the internals under a company source control drawing","Supplier (internals); company (form, fit, function, interface, qualification)","Supplier"],
      ["Design agent","The supplier develops the design; the deliverable is the technical data package","Supplier develops; company owns","Company"],
      ["Full CI development","The supplier develops a CI to company specification and holds design authority at its level \u2014 the heaviest flowdown","Supplier","Supplier"],
      ["Catalog item","A commercial item controlled through a vendor item control drawing; flowdown is mostly notification","Vendor","Vendor"],
      ["Software and firmware development","Usually combined with source-controlled or full-development work rather than standing alone","Supplier, per specification","Supplier"],
      ["Repair and overhaul","As-maintained records, retrofit, and life retention through part-number changes","Company; supplier where delegated","Supplier"],
      ["Special process services","Process only \u2014 process specification control and change notification","Company (process specification)","Not applicable"]
    ]),
    P("Typical examples: machined parts to released drawings (build-to-print); source-controlled valves, actuators and power supplies (source-controlled design and build); design houses producing drawings and models (design agent); major subsystem development subcontracts (full CI development); catalog connectors and commercial computing (catalog item); operational flight program subcontracts and embedded firmware (software and firmware); depot and OEM repair stations (repair and overhaul); heat treat, coating, plating and non-destructive inspection (special process services).")
  ], check:{
    q:"A supplier develops and builds an actuator under your source control drawing. You control form, fit, function, interface and qualification; they are the design activity for the internals. Which work type?",
    o:["Build-to-print","Source-controlled design and build","Design agent","Full CI development"],
    a:1,
    why:"Split design authority with the supplier building is source-controlled design and build. Build-to-print puts no design authority at the supplier at all; the design agent type has the company performing the build; full CI development has the supplier holding design authority against a company specification, with the company baselining at allocated level."
  }},

  {id:"M2-04", title:"Mixed classification, and the record", body:[
    P("Where a supplier performs more than one type of work under a single procurement, **record every applicable type, not only the dominant one.** Mixed classifications are ordinary for suppliers who both develop and build, or who build hardware and develop its embedded software."),
    C("The case people miss",[
      "A hardware procurement quietly acquires firmware, nobody re-classifies, and the entire software CM requirement set \u2014 version identification, library control, build reproducibility \u2014 is never imposed.",
      "When the build cannot be reproduced three years later, that is where it started. **One missing letter in one classification field.**"
    ]),
    S("Tailoring without a recorded classification is omission, not tailoring.",
      "A reduced requirement set with no record of the reasoning is indistinguishable from having forgotten."),
    S("A procurement whose classification cannot be determined is not released until it can.",
      "If you cannot answer who holds design authority and who builds, nobody has defined the procurement well enough to buy against it."),
    P("CM performs classification at statement-of-work development, before release, and records it on the classification log with classifier and date. **That record is the documented tailoring rationale the flowdown obligation requires.**")
  ], check:{
    q:"A source-controlled actuator contains the supplier\u2019s own embedded firmware. The engineer classifies it as source-controlled design and build only. What is the practical consequence?",
    o:["None \u2014 source-controlled design and build is the dominant work type and governs",
       "The software CM requirement set is never imposed: version identification, library control and build reproducibility records",
       "The supplier will be over-burdened with unnecessary requirements",
       "Only the audit requirements are affected"],
    a:1,
    why:"Mixed classifications take the union, not the dominant type. Leaving the software and firmware work type off means that requirement set never reaches the statement of work \u2014 and the failure surfaces years later when the delivered load cannot be rebuilt."
  }},

  {id:"M2-05", title:"The transaction flow", body:[
    P("Flowdown is transaction-driven: it executes for every procurement, and re-executes whenever the facts change."),
    STEPS([
      {h:"Classify", b:"Work type or types recorded on the classification log, with classifier and date."},
      {h:"Derive", b:"Read the requirement set from the matrix columns. Identify conditionals and floor-tagged rows."},
      {h:"Resolve conditionals", b:"Each resolved against its stated condition, with the basis recorded. Determine audit designation status."},
      {h:"Cite in the statement of work", b:"Every requirement with its deliverable. Standing conditional audit clause where designation is possible."},
      {h:"CM review and signature", b:"Prior to release, recorded on the classification log."},
      {h:"Maintain the classification", b:"Re-run on trigger. Classification is dated, not permanent."},
      {h:"Accrue evidence", b:"Log every deliverable at receipt and every finding or escape as it occurs."},
      {h:"Determine effectiveness", b:"Against the requirement set actually imposed. Record rationale, date and next-due date."},
      {h:"Act on the determination", b:"Actions from the ladder, with owner and due date, tracked to closure."}
    ],"tl"),
    C("Re-classification triggers",[
      "**Scope change, including scope that grows from build into any element of design authority** \u2014 the common and easily missed one, because it silently makes change control applicable.",
      "Work type change, including added software or firmware. Audit designation change. Source change \u2014 new supplier, facility or sub-tier. Revision of the floor register or the requirement matrix. An effectiveness determination of less than effective."
    ])
  ], check:{
    q:"A build-to-print procurement grows in scope: the supplier will now propose minor design improvements for company approval. Why does this matter to flowdown?",
    o:["It does not \u2014 the company still owns the design",
       "It changes the price, so the statement of work is reissued anyway",
       "Design authority has partly moved, which silently makes change control applicable \u2014 re-classify and update the derived requirement set",
       "It only affects first article inspection"],
    a:2,
    why:"Scope growing from build into any element of design authority is a named re-classification trigger, and the most commonly missed one. Once the supplier can propose changes, an entire requirement set becomes applicable that a build-to-print classification never imposed."
  }},

  {id:"M2-06", title:"Reading the matrix", body:[
    TABLE(["Marking","Means","What you do"],[
      ["R","Required","Impose as written, with its defined data deliverable"],
      ["T","Tailored","Impose with the tailoring documented. What the tailoring is gets recorded, not assumed"],
      ["C","Conditional","Resolve against the stated condition before citation, and record the basis"],
      ["\u2014","Not applicable","Nothing to impose for this work type"]
    ]),
    L(["**Mixed work types: apply the most demanding cell for each row.** Wherever any applicable column requires a requirement, it is required. The union, never the intersection.",
       "**Floor-tagged rows are not silently dropped.** Where the program proposes not to impose one, the proposal goes through the floor gate and the disposition is referenced in the statement of work."]),
    S("A requirement is cited with its deliverable, or it is not cited.",
      "A clause imposing an obligation without identifying the data that evidences it is unenforceable at receipt and unverifiable at audit. You will have written a sentence that sounds like control and produces nothing you can check.")
  ], check:{
    q:"A row is marked T for one of a supplier\u2019s work types and R for the other. What is imposed?",
    o:["T \u2014 the more permissive marking, since one column allows tailoring",
       "R \u2014 the most demanding cell governs; wherever any applicable column requires it, it is required",
       "Whichever the dominant work type specifies",
       "Neither, until the conflict is escalated"],
    a:1,
    why:"Mixed classifications take the union. R is more demanding than T, so R governs \u2014 and the requirement is imposed as written, with its deliverable."
  }},

  {id:"M2-07", title:"What the matrix actually imposes", body:[
    P("The markings tell you *how much* of a requirement applies. This is *what* the requirements are. A derivation walks these families in order, and each one produces something you can ask for at receipt."),
    TABLE(["Requirement family","What is imposed","What it produces"],[
      ["CM program and planning","The supplier operates CM against the flowed requirement set, and addresses recursive flowdown to its own sub-tiers wherever they exist","A full CM plan for full-development and software work; a tailored plan, or a CM section within the quality plan, where the supplier designs internals, acts as design agent, or performs repair"],
      ["Working to released data","Work only to current released data, with no unauthorised departure from it. Data currency verified at receipt of every revision","No standing deliverable \u2014 evidenced through everything else, and by its absence when a departure surfaces"],
      ["Change control","Changes affecting the baseline, form-fit-function-interface, qualification or company-controlled documentation are proposed, not made","Change proposals carrying the need for the change, its full impact data, and a notice for every affected document"],
      ["Variance control","Any departure or nonconformance is variance-requested **before delivery**; a recurring variance found permanently acceptable converts to change action","Variance requests identifying affected units and lots by identifier, with cause, classification and recurrence status"],
      ["Process change notification","For processes identified as critical or special, and for frozen planning: no change without notice, within the agreed notice period, and no implementation before approval","Process change notifications, event-driven"],
      ["Identification and traceability","Enterprise code, part numbers, unit identifiers and nomenclature applied and recorded; unit identifiers never revised or re-used","The part traceability record, per delivered unit or lot"],
      ["Reconciliation","As-built reconciled against released design \u2014 or as-maintained against approved configuration, for repair work","Two deliverables, not one: the process documentation once and on revision, and the report per delivery or lot"],
      ["Status accounting","Configuration records kept timely, current, historically traceable and retrievable per the agreed data terms","Status accounting reports by item identifier, current and historical"],
      ["Software CM","Where deliverable software or embedded code exists: version identification, developmental library control, and the ability to reproduce a build","Version descriptions and build reproducibility records \u2014 compiler, settings, library and media identification, sufficient to rebuild"],
      ["Configuration audit","Conditional on the item\u2019s audit designation. Held open by the standing clause","The triggered audit deliverables, scoped to the supplier\u2019s role \u2014 conduct at their facility, or support with data and access"]
    ]),
    S("Which families produce nothing for a given supplier is itself an answer \u2014 and it comes from the two questions.",
      "No design authority, no change proposals. No build, no as-built to reconcile and no traceability record. The families that fall away should fall away for a reason you can state.")
  ], check:{
    q:"A design house develops the technical data package for a wing rib; your company manufactures it. Which family produces no deliverable, and why?",
    o:["Change control \u2014 the company owns the design",
       "Software CM \u2014 there is no software of any kind on a wing rib",
       "Reconciliation and traceability \u2014 the supplier builds nothing, so there is no as-built configuration at their end to reconcile or trace",
       "Status accounting \u2014 the supplier holds no configuration records"],
    a:2,
    why:"Who performs the build decides whether the reconciliation and traceability apparatus applies at all \u2014 and here nobody builds anything at the supplier, so there is no as-built to reconcile against and no delivered unit to trace. Change control does apply: they develop the design, so changes to it are proposed rather than made."
  }},

  {id:"M2-08", title:"What a configuration audit is", body:[
    P("Two audits. They are asked at different moments, about different questions, and almost everything else about them follows from knowing which question is on the table."),
    CARDS([
      {h:"Functional configuration audit", b:"**Does the item do what it was required to do, and can you prove it?** The formal audit that verifies the item\u2019s tested performance against its approved functional and allocated documentation. It also confirms that specifications and interfaces are accurately and adequately defined, and that the change control system genuinely controls the processing and release of documentation. Prerequisite: the Acquirer has already approved the functional and allocated baselines for the item."},
      {h:"Physical configuration audit", b:"**Is the thing you actually built the thing the documentation describes?** The formal examination of the as-built \u2014 or as-coded \u2014 configuration of a validated item against its product documentation, verifying that the documentation is a clear, complete and accurate representation of what physically exists. Prerequisite: the functional audit completed successfully, or running concurrently."}
    ],2),
    P("The order is not a convention. The physical audit examines a **validated** item, and validation is what the functional audit produces \u2014 so a physical audit cannot begin before its functional audit is complete or concurrent. The two may be run as one event where there is high confidence that both sets of requirements will be met within the same timeline."),
    S("Successful completion of the physical audit is the event that establishes the product baseline.",
      "Until it passes, there is no product baseline to change against. After it passes, every subsequent change is processed by formal engineering change action. Skipping it does not save an activity \u2014 it leaves the item with no reference point for everything measured against it afterwards."),
    P("Audits proceed bottom-up: lower-level items first, then subsystems, then the system level. Two variations are worth knowing by name, because you will hear both:"),
    CARDS([
      {h:"Incremental, and the capstone", b:"Audits conducted bottom-up in increments, concluding with a final system-level audit that confirms all functional, allocated and product baseline requirements are satisfied. Open action items from the lower-level audits are carried into the system-level minutes \u2014 they do not evaporate on the way up."},
      {h:"Delta audit", b:"A follow-on audit covering only the portion left open at the original \u2014 typically verification that could not be completed in time. Its results are added to, or supersede, the original minutes. This is the mechanism that lets an audit proceed honestly with known gaps instead of pretending they closed."}
    ],2),
    C("Audits do not do the verification. They test whether the verification works",[
      "Configuration verification is continuous and embedded: functional verification through the test program, physical verification through inspection and process control on every unit, and as-designed-to-as-built reconciliation run at scale across the data for all items.",
      "An audit is a discrete validation, on a designated item and a representative unit. Its purpose is to confirm that continuous machinery is working \u2014 not to replace it. It is not the intent of an audit to verify every change individually.",
      "**Which is why \u201cwe will catch it at the audit\u201d is never a plan, and why \u201cnot designated for audit\u201d never means \u201cno verification.\u201d**"
    ],"teal")
  ], check:{
    q:"Why can a physical configuration audit not begin before its functional audit is complete or running concurrently?",
    o:["Because contracts conventionally schedule them in that order",
       "Because the physical audit examines the as-built configuration of a **validated** item \u2014 and validation is what the functional audit produces",
       "Because the Acquirer will not attend two audits at once",
       "It can \u2014 the two are independent examinations and either may go first"],
    a:1,
    why:"The physical audit asks whether the documentation accurately describes what was built. That question only means something once the item has been shown to meet its requirements \u2014 otherwise you are confirming that the paperwork faithfully describes something nobody has established works."
  }},

  {id:"M2-09", title:"Inside a functional configuration audit", body:[
    P("At bottom the functional audit is one question, asked over and over: **for this requirement, where is the evidence it was met?**"),
    STEPS([
      {h:"The opening briefing", b:"The design team briefs each audited item: an overview, test results and findings, requirements not met with proposed remedies, changes incorporated, tested and proposed, and the overall test effort including its problem areas. Opening with what did not work is part of the format, not a failure of it."},
      {h:"The documentation flow, requirement by requirement", b:"For each requirement \u2014 or an agreed sample \u2014 walk the chain: the baseline requirement in the specification, to the test plan, to the test procedure, to the test report. Where a requirement is not verified by test, the analysis, inspection or demonstration record stands in the same position. Interface requirements are verified through this same flow."},
      {h:"Account for what has not been done", b:"Tests accomplished; tests performed without recorded detail data; tests not yet performed, each with the plan to accomplish it; and the analyses or simulations covering requirements not fully verifiable by test. An honest account of the gaps is an audit output in its own right."},
      {h:"Changes and prior findings", b:"Review all approved changes, with an account of those incorporated, those tested, and those proposed. Examine the earlier design review minutes to confirm their findings were incorporated and action items closed, and review lower-level audit minutes and their open items."}
    ],"tl"),
    P("Software is audited on the same logic with more surface: database characteristics, storage allocation, and timing and sequencing against requirements; every document describing the product checked for format and completeness; developmental configuration change records; the listing of every developmental and non-developmental version held in the library; and the findings of internal CM and software quality audits. For software the standard is stated flatly \u2014 **every requirement has a related test step, and that test passes.**"),
    P("One deliverable carries the whole audit: a traceability matrix covering all requirements, cross-referencing the test plans, procedures, test programs and reports, and identifying each known deficiency by its report number. It is provided before the audit and becomes part of the minutes. It is the artifact that makes the audit checkable by someone who was not in the room."),
    S("Where sampling is agreed, safety-critical requirements and those verifying hazard controls are included in the sample \u2014 never sampled out.",
      "Sampling is a concession to volume, not a lottery that safety requirements are allowed to lose. A sample that quietly excludes the requirements that matter most has inverted the purpose of sampling."),
    P("Where verification genuinely depends on integrated system testing that has not happened yet, partial completion may be acknowledged: the open requirements become action items, closed later by a delta audit once the outstanding testing passes.")
  ], check:{
    q:"A specification carries 1,900 requirements and the audit is agreed to proceed on a sample. How are the requirements that verify hazard controls treated?",
    o:["Sampled on the same basis as every other requirement, so the sample stays statistically valid",
       "Deferred to a delta audit, since safety verification usually completes late",
       "Included in the sample as a matter of rule \u2014 they are never sampled out",
       "Excluded, because System Safety verifies them separately"],
    a:2,
    why:"Sampling exists to make a large requirement set auditable in the time available. It is not a random draw, and the requirements whose failure hurts most are the ones the audit least affords to miss. They go in the sample by rule, and the remaining sample is drawn around them."
  }},

  {id:"M2-10", title:"Inside a physical configuration audit", body:[
    P("The physical audit takes one unit \u2014 an early production-representative unit, **selected jointly by the Acquirer and the Supplier**, not offered up by whoever is being audited \u2014 and asks whether the documentation describes it."),
    L(["**Reconcile the item to its documentation:** item, to drawings, to associated lists, to the parts list. Effectivity and next assembly. The accuracy of notes and references. The released documents those references point at.",
       "**Review a representative sample of drawings and model data with the matching manufacturing instructions**, confirming the instructions reflect the design detail and incorporate the authorised changes.",
       "**Confirm compatibility with the approved parts selection list, and examine the item to confirm the proper parts are actually installed.** Not the records about the parts \u2014 the parts.",
       "**Verify approved changes were incorporated**, and reconcile and correct any delta between as-designed and as-built data.",
       "**Identify the differences between this unit and the unit used at the functional audit**, and certify or demonstrate that those differences do not degrade functional characteristics.",
       "**Review shortage lists and undocumented design changes**, confirming no unapproved change exists in the documentation and every approved change is present in the hardware."]),
    P("For software, the as-coded configuration is examined against its documentation: source listings compared to the released documentation, and the version description verified \u2014 including the compiler, the compiler version, and the build settings. Then the part that surprises people:"),
    S("The build is produced during the audit, installed on the target, verified against its version description, and witnessed.",
      "Every software update listed on the build\u2019s problem reports is confirmed applied. This is the moment the toolchain identification pays for itself or fails in public: if the compiler version, settings and library state were never identified, the build cannot be reproduced and the audit cannot be satisfied."),
    P("For commercial software, the check is narrower but real: that the documentation supports the versions actually delivered on the media, and that identification and marking of every deliverable medium are adequate."),
    C("Why the examination is physical",[
      "A record can agree perfectly with the design while the hardware does not. That gap is the entire reason a physical audit exists, and it is not hypothetical: a door plug delivered with missing bolts, and tools and debris repeatedly found inside delivered aircraft, are precisely the class of non-conformance this examination is built to catch.",
      "**A parts list that matches the drawing proves the parts list. Only looking at the item proves the item.**"
    ])
  ], check:{
    q:"Why does the physical audit include a physical examination of installed parts, rather than a review of the parts records against the approved parts list?",
    o:["Because the records are frequently unavailable at the audit",
       "Because the Acquirer requires a demonstration of access to the facility",
       "Because the records can agree with the design while the hardware does not \u2014 and that divergence is the thing the audit exists to find",
       "Because the parts list is not a controlled document"],
    a:2,
    why:"Records comparing correctly to records tells you the paperwork is self-consistent. The failure mode that matters is as-built diverging from as-documented, and no amount of reading will surface it. Somebody has to look at the item."
  }},

  {id:"M2-11", title:"Findings, closure, and certification", body:[
    P("Nothing found at an audit exists until it is written down. Every discrepancy becomes an action item defining four things: the issue, the agreed closure plan, the responsible person, and the agreed suspense date. There is no such thing as a verbal finding."),
    TABLE(["Classification","What it covers"],[
      ["Major","Production definition documentation or design data incorrect or incomplete; a systematic breakdown of process control; clear non-adherence to workmanship standards; hardware or software not included in the build process; non-adherence to specification, interface or statement-of-work requirements; first article data missing or incomplete"],
      ["Minor","Non-systematic errors \u2014 a typographical mistake in production definition documentation, in a process control record, or in workmanship standards documentation"]
    ]),
    S("The line between major and minor is systematic versus not \u2014 not how many instances you found.",
      "One typo in one record is minor. The same error across eleven records because the process producing them is broken is major, and it would still be major if it had appeared only once."),
    P("The minutes are the audit\u2019s durable record, and their required content is specific: the audited item; the decisions and proceedings; the attendees; the action items; the complete list of documents **with their revision level at the time of audit**; the complete list of requirements audited; and identification of everything examined \u2014 by name, specification number, product identifiers, serial numbers, part numbers and enterprise code."),
    STEPS([
      {h:"Publish", b:"Finalised minutes delivered within sixty days of audit completion, or per contract."},
      {h:"Close", b:"Every action item tracked to closure, with the corrective action documentation delivered for review. A summary report reflects all action items and discrepancies; the detailed final report issues only after the Acquirer has verified the completed action items."},
      {h:"Certify", b:"Joint certification signatures \u2014 the audit lead, the program manager, and Acquirer representatives \u2014 recording the result as **complete and successful** where nothing is open, or **conditional** where resolutions are agreed but tasks are not yet finished."},
      {h:"Disposition", b:"The Acquirer dispositions the audit as **approval** where all action items are satisfactorily completed, **contingent approval** pending their completion, or **disapproval** where the result is seriously inadequate."},
      {h:"Record", b:"Scheduled and actual audit dates, accomplishments and results recorded in status accounting, per item audited."}
    ]),
    P("Note where the product baseline sits in that sequence. It is established by the Acquirer **after** successful completion of the physical audit and approval of the product specification \u2014 not on the day the audit ends.")
  ], check:{
    q:"A drawing reviewed at audit carries a superseded note. Investigation finds the same superseded note on eleven drawings, because change notices are not propagating through the release process. Major or minor?",
    o:["Minor \u2014 a note error is a documentation typo by definition",
       "Minor, but raised to major if it recurs at the next audit",
       "Major \u2014 it is a systematic breakdown of process control, and the count of affected drawings is not what makes it so",
       "Neither \u2014 it is a change management issue rather than an audit finding"],
    a:2,
    why:"The classification turns on systematic versus non-systematic, not on volume. A release process that fails to propagate change notices produces incorrect production definition documentation on purpose, so to speak \u2014 and would be a major finding on the strength of the mechanism even if it had surfaced on one drawing only."
  }},

  {id:"M2-12", title:"Audit designation: how a CI earns an audit", body:[
    P("Audit obligations hinge on whether a CI is designated for audit. Designation is not a matter of taste, and it is not decided by the supplier\u2019s work type \u2014 it is assessed per CI, and it arrives from two directions."),
    CARDS([
      {h:"Contract designation", b:"The CI is named in the contract, the statement of work, or the CM plan as requiring audit. This includes **every Acquirer-controlled CI whose product baseline the Acquirer will establish** \u2014 because the physical audit is the event that establishes it. There is no baseline without the audit."},
      {h:"Risk-based designation", b:"For every CI not designated by contract, the program assesses whether an audit is warranted \u2014 at initial audit planning, at each CM plan revision, and on any trigger event. Nothing is left undesignated merely because nobody named it."}
    ],2),
    P("A contract designation does not end the assessment. The risk factors below are still walked, because they can **expand** what the audit has to cover \u2014 adding a delta audit of open scope, or pulling an increment earlier than planned."),
    P("The risk-based assessment has a deliberate shape. It is not a scoring exercise where everything trades against everything:"),
    STEPS([
      {h:"Safety criteria \u2014 presumptive designation", b:"A CI that implements or hosts a hazard risk control, that was selected under the safety criterion, whose credible failure consequence sits in the top severity band, that is safety-critical software or firmware in a safety-critical device, or that is a single point of failure for a safety-related function, is **designated by presumption**. Omission requires System Safety concurrence in writing. CM cannot make that call alone."},
      {h:"Risk factors \u2014 two or more designates", b:"New or novel design rather than proven heritage; substantive design change since the last audit; new or changed manufacturing source, process, facility or tooling; a new or changed sub-tier supplier; a history of escapes, nonconformances or work performed not to approved data; status accounting reconciliation health showing delta aging, unincorporated-change backlog or effectivity discrepancies; and never having been audited, or a prior audit with open actions. **Two or more designates.** One is recorded and monitored."},
      {h:"Triggers \u2014 the assessment re-runs", b:"A substantive design, process, facility, tooling or supplier change; a new quality escape or safety event traceable to the CI; a reconciliation anomaly; a hazard log revision adding a risk control to the CI; a CM plan revision. Designation is a standing question, not an award-day answer."}
    ],"tl"),
    S("The assessment and its rationale are recorded for every CI evaluated \u2014 designated or not.",
      "The same principle as CI selection: a list of designated CIs shows an outcome. A record of what was assessed and why it was not designated shows that judgement was exercised, and gives the next assessment something to start from."),
    P("Designation decides **whether** an audit happens to an item. The supplier\u2019s work type decides **what their part in it is** \u2014 conducting the audit at their own facility for items they design and build, or supporting one with data, records and facility access where the design or the build sits with the company. Those are different obligations with different costs, and the next section is about buying both before you need them."),
    C("Ceremony may be tailored. Substance may not.",[
      "Where an audit is initiated internally rather than by the Acquirer, the **ceremony** may be simplified \u2014 an internal co-chair and internal certification in lieu of Acquirer participation. The **substance** is performed in full: the requirements-to-test reconciliation and its traceability matrix, the as-built examination with approved-parts verification, and the documented non-compliances.",
      "The distinction generalises, and it is worth carrying into every tailoring conversation you will have. Simplifying the format of a record, or sampling rather than checking exhaustively, is ceremony. **Removing a verification because an automated system is asserted to prevent the failure is substance \u2014 that verification exists to test the assertion.**"
    ],"teal")
  ], check:{
    q:"A CI is not contractually designated and hosts no hazard risk control. The assessment finds exactly one risk factor: a new sub-tier supplier. What follows?",
    o:["Designate for audit \u2014 any risk factor is sufficient",
       "Nothing; with no safety criterion met and only one factor, the CI is out of scope until the contract says otherwise",
       "Record the factor and the rationale for not designating, and monitor it \u2014 two or more factors designate, and the assessment re-runs on trigger",
       "Refer the question to the Acquirer, who owns designation"],
    a:2,
    why:"One factor does not designate; two or more do. But \u201cnot designated\u201d is a recorded decision with a rationale, not a silence \u2014 and the assessment re-runs on trigger, so a second factor arriving later changes the answer without anyone having to remember to ask."
  }},

  {id:"M2-13", title:"Conditionals, and the standing audit clause", body:[
    P("Resolve each conditional against its stated condition and record the basis. Software CM requirements are conditional on deliverable software or embedded code; process-change notification on identified critical or special processes; first article requirements on the applicable quality system criteria. Re-resolve any conditional when its condition changes."),
    P("Configuration audit obligations are conditional on the **CI\u2019s audit designation** \u2014 not on work type. Work type determines the supplier\u2019s *role* if the item is or becomes designated: conduct the audit at their facility, or support one with data and access."),
    S("Designation can arrive after award \u2014 introducing a new sub-supplier is itself a designation trigger.",
      "So the award can be the very event that causes the item to become designated."),
    CARDS([
      {h:"Standing conditional clause", b:"The clause takes effect on designation; triggered deliverables are scheduled. You notify the supplier and set dates. No commercial negotiation \u2014 the obligation was already bought. Cost: administrative."},
      {h:"Decided once, at award", b:"You have no clause when designation arrives. Obtaining audit support requires a contract modification, negotiated after the supplier holds the work and knows you need the access. Cost: commercial, schedule \u2014 or a designated CI you cannot audit."}
    ],2),
    C("The trap to name out loud",[
      "**\u201cNo audit designation\u201d does not mean \u201cno verification flowdown.\u201d** Never-designated CIs still carry the at-scale machinery \u2014 reconciliation, status accounting, part traceability and first article inspection \u2014 which apply by work type regardless of designation.",
      "Audit is a sampling event laid on top of continuous verification. Removing the sampling event does not remove the thing it samples."
    ])
  ], check:{
    q:"You are writing a statement of work for a supplier who will build a designated CI to print. At award, the CI is not designated for configuration audit. What do you cite?",
    o:["Nothing on audit; add it by modification if designation ever arrives",
       "Full audit conduct requirements, to be safe",
       "A standing conditional audit clause, with the audit deliverables cited as triggered items",
       "Audit requirements only if the Acquirer asks"],
    a:2,
    why:"Deciding audit applicability once, at award, converts every post-award designation into a contract modification negotiated from an unfavourable position. The standing clause costs nothing now and buys the obligation before you need it."
  }},

  {id:"M2-14", title:"Citing in the statement of work", body:[
    P("Each cited requirement identifies its data deliverable by reference to the deliverable definition \u2014 content, frequency or triggering event, and submittal terms. Beyond that, five things must be stated explicitly, because each is a known failure point."),
    STEPS([
      {h:"Designation authorship", b:"Who proposes and who approves safety-critical, life-limited and special-handling designations. Where the company holds design authority, designations are provided in the technical data and the supplier marks, records and reports against them. Where the supplier holds design authority, they propose them for company approval. Unstated, each party waits for the other."},
      {h:"Both reconciliation flowdowns", b:"The process documentation as capability evidence, submitted before reliance is placed on it, and the recurring report per delivery or lot."},
      {h:"Part traceability record content in full", b:"Including life limits and life consumed at delivery for life-limited items. This is the identifier vocabulary everything else is expressed in."},
      {h:"Recursive flowdown", b:"And the return of sub-tier product data with next-higher-assembly traceability, wherever sub-tiers exist."},
      {h:"Change and variance control", b:"Consistent with where design authority sits and who builds. A build-to-print supplier cannot propose changes; a design-authority supplier must."}
    ]),
    P("Where a floor requirement has been dispositioned other than by imposition, reference the recorded disposition. And define the **attestation scope of the CM signature once**, in the program CM plan: does it attest that CM review occurred, or that the flowdown content is adequate? Fixing it once prevents later disputes over what a past signature meant.")
  ], check:{
    q:"A statement of work is silent on who proposes safety-critical and life-limited designations. What typically happens?",
    o:["The supplier applies its own standard designations",
       "Each party waits for the other, and life-limited items ship with no assigned limit",
       "The Acquirer resolves it at first article",
       "Quality assurance assigns them at receiving inspection"],
    a:1,
    why:"Unstated, each party assumes the other owns it. The failure is silent until a life-limited part arrives with a blank consumed-life field \u2014 at which point it can never be accurately tracked again, because the count starts from an unknown."
  }},

  {id:"M2-15", title:"Two reconciliation deliverables, and the traceability record", body:[
    P("New engineers frequently treat the two reconciliation deliverables as one requirement. They are two, and imposing only one is a defined failure."),
    TABLE(["","Process documentation","Reconciliation report"],[
      ["What it is","The supplier\u2019s documented METHOD: data sources, comparison method, delta disposition, frequency, records produced","The recurring OUTPUT: as-built against released design revision, open deltas with disposition, changes incorporated with effectivity"],
      ["When","Once, plus on revision \u2014 before reliance is placed on it","Per delivery or lot"],
      ["What it proves","Capability: a method exists and covers all deliverable configurations at scale","Performance: the method is being run, and what it found"],
      ["If it is missing","Reports arrive by an unknown method. A number without a method","A method exists on paper and produces nothing. A method without evidence"]
    ]),
    C("The part traceability record",[
      "Defined once and referenced from several requirement rows, because it is the identifier vocabulary the rest of the flowdown speaks in. Per delivered unit or lot it records: serial numbers; lot or batch numbers; **life-limited designation with the assigned life limit and the life consumed at delivery**; safety-critical designation; special handling designations; and traceability to the next higher assembly.",
      "The field that goes missing most often is life consumed at delivery. A blank there on a life-limited item is not a clerical defect \u2014 it is an item that can never be accurately tracked for the rest of its service life."
    ])
  ], check:{
    q:"A supplier submits reconciliation reports per lot, but never submitted the reconciliation process documentation. What is the problem?",
    o:["None, provided the reports show no deltas",
       "The reports arrive by an unknown method \u2014 nobody can say what configurations the method covers or whether it works at scale",
       "Only a records retention issue",
       "The reports must be re-submitted in a different format"],
    a:1,
    why:"The process documentation is capability evidence, submitted before reliance is placed on it. Without it you have a number without a method \u2014 and no basis for believing a clean report means anything."
  }},

  {id:"M2-16", title:"Evidence accrues; it is not assembled", body:[
    P("A determination reconstructed from memory a week before it is due is not a determination."),
    L(["Log every supplier data deliverable on receipt, and score it at review \u2014 accepted first pass, accepted with comment, or rejected \u2014 with defect codes for anything less than first pass.",
       "Log every finding and escape as it occurs.",
       "Flag safety relevance on any finding affecting a hazard control, a safety-critical item or a life-limited item, and route it into the safety data stream."]),
    C("Effectiveness includes what a supplier FAILS to submit",[
      "These events look like nothing happening, which is exactly why they need logging as findings:",
      "\u2022 Post-delivery discovery of a departure that should have been variance-requested. \u2022 An unauthorised process change, found after the fact. \u2022 Traceability gaps found at receiving. \u2022 Reconciliation deltas the supplier\u2019s own report did not disclose. \u2022 Configuration-related nonconformances."
    ]),
    S("The strongest single indicator of an ineffective process: a delta discovered by company receiving that the supplier report cleared as no-delta.",
      "It means the detection mechanism itself does not work \u2014 so everything previously reported as clean is unevidenced."),
    P("Five records carry all of this, and they are standing records \u2014 open continuously, written to as events occur, never opened for the first time at determination:"),
    TABLE(["Record","What each row carries"],[
      ["The classification log","Supplier, item and scope, work types, item identifiers, audit designation status, whether the standing conditional clause is present, floor dispositions, and the classifier and CM signature with dates"],
      ["The deliverable receipt log","Every supplier data deliverable received: date, reviewer, the review result, and defect codes for anything short of first-pass acceptance"],
      ["The findings and escapes log","Findings, escapes and non-submittal events per supplier, with safety relevance flagged and the safety report reference where one was routed"],
      ["The effectiveness determination records","The determination, its rationale, the evidence relied on, the determining authority, the date, and the next-due date"],
      ["The actions log","Actions arising from determinations and findings, with owner, due date, status, and closure evidence including extent checks"]
    ]),
    S("These are kept as structured, queryable data \u2014 not as narrative documents.",
      "The performance measures are computed from them. **Records that cannot be queried cannot be measured** \u2014 and a supplier picture that has to be reconstructed by reading through prose is a picture nobody will produce often enough to act on.")
  ], check:{
    q:"Receiving finds a superseded bracket revision on two units. The supplier\u2019s reconciliation report for that lot stated no open deltas. Which is the more serious signal?",
    o:["The superseded bracket \u2014 it is the tangible hardware problem",
       "The clean reconciliation report \u2014 it means the detection mechanism itself does not work",
       "Neither is serious if the units are conforming in every other respect",
       "They are equally serious"],
    a:1,
    why:"A bracket on two units is one delivery that went wrong. A report that cleared it as no-delta means the control that should catch such things does not operate \u2014 which puts every previous clean report in question."
  }},

  {id:"M2-17", title:"The ten evidence streams", body:[
    P("Accrued evidence is read stream by stream. Each has a shape when it is working and a signal when it is not, and the failure signals are worth memorising \u2014 they are what you are actually looking for when a deliverable lands on your desk."),
    TABLE(["Evidence stream","What effective looks like","The failure signal"],[
      ["CM plan adequacy","The plan implements the imposed requirement set, including recursive sub-tier flowdown, and is kept current through revisions","A plan silent on sub-tier flowdown \u2014 or never revised as the scope grew"],
      ["Reconciliation process capability","A documented method, accepted, covering all deliverable configurations at scale","The method covers only sampled items \u2014 or reports keep arriving with no method on file at all"],
      ["Reconciliation reporting","Reports per delivery or lot; deltas dispositioned and aged within threshold; content expressed in traceability-record identifiers","A delta found by company receiving that the report cleared as no-delta. The strongest single indicator of an ineffective process"],
      ["Part traceability completeness","Records complete on first pass \u2014 life limit and life consumed, safety-critical and special-handling designations, next-higher-assembly traceability","A blank consumed-life field on a life-limited item; missing designations where the supplier holds design authority"],
      ["Change control discipline","Change proposals complete on first pass; no baseline-affecting change implemented without approval","Changes visible in delivered hardware or data that were never proposed"],
      ["Variance discipline","Departures variance-requested before delivery; recurring variances converted to change action","Post-delivery discovery of a departure that should have been variance-requested"],
      ["Process change notification","No unauthorised change to frozen or approved processes; notifications timely within the agreed notice period","A process, facility or tooling change discovered after the fact"],
      ["Status accounting currency","Records timely, current, historically traceable and retrievable per the agreed data terms","Records reconstructed on request rather than maintained"],
      ["Audit performance","Where designated: audits conducted or supported per role, substance in full, action items closed by their agreed dates","Substance tailored \u2014 verification steps omitted rather than ceremony simplified"],
      ["CM process audit findings","Findings closed by their suspense dates; no repeats","Repeat findings across audit cycles"]
    ]),
    S("A supplier is evaluated against the requirement set actually imposed on it \u2014 streams that were not imposed are not evaluated.",
      "A catalog vendor with no reconciliation requirement does not score badly on reconciliation. They score nothing on it, because nothing was asked. Grading a supplier against requirements you chose not to flow is grading your own classification, not their process.")
  ], check:{
    q:"A build-to-print supplier was never required to submit status accounting reports \u2014 the requirement was not imposed. At determination time, how is that stream treated?",
    o:["Scored as a deficiency, since the records are not available",
       "Scored as effective by default, since nothing went wrong",
       "Not evaluated \u2014 a supplier is evaluated against the requirement set actually imposed on it",
       "Scored against the standard applied to full-development suppliers, for comparability"],
    a:2,
    why:"Neither a deficiency nor a free pass. The stream is simply out of scope for that supplier. If the absence of those records is actually a problem, the fault is in what was flowed \u2014 which is a classification and derivation question to reopen, not something to hold against the supplier at determination."
  }},

  {id:"M2-18", title:"Three determinations", body:[
    P("Determine effectiveness over the rolling accrued evidence, **against the requirement set actually imposed on that supplier.** A supplier is evaluated on what was flowed to it, not against a uniform standard. Streams that were not imposed are not evaluated."),
    STEPS([
      {h:"Effective", b:"The imposed requirements are being met. Routine surveillance continues."},
      {h:"Conditionally effective", b:"Deficiencies exist, with credible correction underway. Actions from the ladder apply."},
      {h:"Ineffective", b:"Systemic failure to meet imposed requirements. Actions from the ladder apply, and escalate."}
    ]),
    C("The judgement that separates the three",[
      "**Isolated, non-systemic defects with credible correction** support Effective or Conditionally effective.",
      "**Evidence that a control did not operate** \u2014 rather than that a record contained an error \u2014 supports Conditionally effective at best, and Ineffective where the pattern recurs or the evidence is safety-relevant.",
      "A wrong entry on a form is a record defect. A departure that reached delivery without a variance request is a control that did not operate. They are not the same finding wearing different clothes."
    ],"teal"),
    P("Determinations run on a tiered cadence as a backstop \u2014 the cadence set by work type, because the exposure differs:"),
    L(["**Annually** for full-development and software work \u2014 the heaviest flowdown, the most to go wrong, and design authority sitting at the supplier.",
       "**Annually to every two years, by risk**, for build-to-print, source-controlled design-and-build, and repair work.",
       "**Event-driven** for catalog items and special-process services \u2014 there is no steady stream of configuration deliverables to read, so the events are what there is."]),
    P("The cadence is a backstop, never the mechanism. A determination also runs on any of these triggers: a rejection streak or sustained decline in first-pass acceptance; any safety-relevant escape; a reconciliation miss discovered by the company; an adverse configuration audit result; or a source, process or facility change.")
  ], check:{
    q:"Which finding indicates a control that did not operate, rather than a record defect?",
    o:["A transposed serial number on a traceability record",
       "A late submittal of a status accounting report",
       "A departure from released design discovered after delivery that should have been variance-requested",
       "A formatting non-compliance against the deliverable definition"],
    a:2,
    why:"The first, second and fourth are defects in records or timeliness. A departure reaching delivery without a variance request means the mechanism that should have stopped it never ran \u2014 which supports Conditionally effective at best."
  }},

  {id:"M2-19", title:"The actions ladder, and what follows", body:[
    P("A determination of less than effective is **an action-forcing event, not a filing event.** Select and record actions proportionate to the determination and to the safety relevance of the evidence."),
    STEPS([
      {h:"Increased surveillance", b:"And elevated deliverable review \u2014 full review rather than sampling."},
      {h:"Corrective action request", b:"Tracked to closure on the corrective artifact, not on an assertion of completion. Include an extent check across delivered units where the finding indicates a control failure rather than an isolated error."},
      {h:"Source inspection", b:"Or witness points at defined operations."},
      {h:"Delivery or payment holds", b:"Per the contract terms, administered by subcontracts."},
      {h:"Award restriction", b:"Restriction or suspension of new awards, and where warranted, disqualification."}
    ]),
    P("An **ineffective** determination \u2014 and a conditionally effective one founded on safety-relevant evidence \u2014 also requires four things beyond the ladder. These close loops that would otherwise stay open:"),
    TABLE(["Required action","What it protects against"],[
      ["Re-run the audit designation assessment for items that supplier builds","A product built by a process now known to be ineffective, never sampled by audit. Supplier ineffectiveness and escape history are designation factors"],
      ["Report into the safety data stream where evidence is safety-relevant","Configuration escapes on safety-significant product treated as a supply chain matter and never reaching the people who own the hazard analysis"],
      ["Review any floor equivalent control that relies on that supplier\u2019s process","An equivalent control resting on an ineffective process is no longer validated, and returns to the floor gate"],
      ["Re-assess classification and the derived requirement set","Requirements tailored on the assumption of a capable process. That assumption has just been disproved"]
    ])
  ], check:{
    q:"A supplier responds to a corrective action request by confirming in writing that the process has been fixed. What is needed before closure?",
    o:["Nothing further \u2014 the supplier owns their process",
       "A follow-up audit at the next scheduled interval",
       "The corrective artifact itself, plus an extent check across delivered units where a control failed",
       "Acquirer concurrence on the closure"],
    a:2,
    why:"Corrective actions close on the corrective artifact, not on an assertion of completion. Where the finding indicates a control failure rather than an isolated error, the extent check across already-delivered units is part of closure, not an optional extra."
  }},

  {id:"M2-20", title:"Recursion, and the floor at depth", body:[
    S("A tier that cannot be seen through is a tier that is not controlled.",
      "Wherever a supplier has sub-tiers, the comply-or-suitably-tailor obligation flows again \u2014 and sub-tier product data, part numbers and serial numbers, returns upward with traceability to next higher assemblies."),
    P("This is why the sub-supplier CM plan must address sub-tier flowdown, and why a plan silent on it is a **named failure signal** rather than a missing detail. Your company does not contract with the lower tiers \u2014 the supplier does. What you impose is the recursive obligation, and what you verify is that they have discharged it."),
    S("The safety floor does not dilute with depth.",
      "Tier three is not a place where the obligation becomes optional. Supplier-tier tailoring of a floor requirement goes through the floor gate, is evaluated independently where an equivalent control is proposed, and is recorded at the named authority level."),
    C("Common failure modes to recognise",[
      "Classifying by the dominant work type only. Tailoring without recording the classification. Citing a requirement without its deliverable. Deciding audit applicability once, at award. Reading \u201cno designation\u201d as \u201cno verification flowdown.\u201d Imposing the reconciliation report but not the method. Leaving designation authorship unstated. Assembling effectiveness evidence at review time. Treating a determination as a filing event. Closing a corrective action on an assertion. Letting the classification go stale."
    ])
  ], check:{
    q:"A supplier proposes not to flow a floor-tagged requirement to its own small machining sub-tier. What is the correct response?",
    o:["Accept it \u2014 proportionality is the point of tailoring",
       "Refuse it verbally and move on",
       "Route the proposal through the floor gate for disposition and record the outcome; the decision is not the supplier\u2019s and not yours alone",
       "Escalate to the Acquirer for direction"],
    a:2,
    why:"The size of the shop is not a disposition. The floor does not dilute with depth. Even a refusal is recorded through the gate, so that the next person can see the decision and its basis."
  }}
 ],
 exercises:[
  {id:"M2-E1", title:"Exercise 1 \u2014 Classify five procurements",
   scen:"For each, state the work type or types, and give the two answers that drove it \u2014 who holds design authority, and who performs the build.",
   parts:[
     {id:"a", q:"A machine shop produces a titanium fitting to your company\u2019s released drawing."},
     {id:"b", q:"A supplier develops and manufactures an electro-hydraulic actuator to your source control drawing. It contains a microcontroller running the supplier\u2019s own embedded firmware."},
     {id:"c", q:"An engineering services firm produces the drawing package for a wing rib; your company manufactures it."},
     {id:"d", q:"A heat-treat house processes forgings you supply, to your process specification. And: a vendor supplies a catalog connector to their own part number under your vendor item control drawing."}
   ]},
  {id:"M2-E2", title:"Exercise 2 \u2014 Derive from a mixed classification",
   scen:"Take the actuator above. The matrix marks the sub-supplier CM plan row T for the SCD work type and R for the software work type; the software CM row C for the SCD work type and R for the software work type; and the reconciliation report row R for both.",
   parts:[
     {id:"a", q:"What is imposed for each of the three rows, and why?"},
     {id:"b", q:"State the rule you applied, in one sentence."},
     {id:"c", q:"The engineer before you classified this as the SCD work type only. Name three specific requirements that would not have been imposed, and the consequence."}
   ]},
  {id:"M2-E3", title:"Exercise 3 \u2014 The audit clause",
   scen:"You are writing the statement of work for a new supplier who will build a designated CI to print. At award, the CI has NOT been designated for configuration audit.",
   parts:[
     {id:"a", q:"Do you cite audit requirements? Explain your reasoning, and say what the supplier\u2019s role would be if designation arrived."},
     {id:"b", q:"What is it about introducing this supplier that bears on the designation question?"},
     {id:"c", q:"Six months after award the CI is designated. What happens under the statement of work you would write, versus one that decided audit applicability at award?"},
     {id:"d", q:"The program manager argues that since the CI is not designated, no verification requirements need flow at all. How do you answer?"}
   ]},
  {id:"M2-E4", title:"Exercise 4 \u2014 Reading a delivery",
   scen:"Twelve life-limited actuators arrive from a source-controlled design-and-build supplier. Part traceability records are present for all twelve, with serial and lot numbers complete, but the life-consumed field is blank on all twelve. The reconciliation report for the lot states no open deltas. Receiving separately finds that two units carry a bracket to a revision superseded four months earlier.",
   parts:[
     {id:"a", q:"List each finding, classify each as a record defect or a control that did not operate, and say which evidence stream it belongs to."},
     {id:"b", q:"Which finding is the most serious signal about the supplier\u2019s CM process, and why?"},
     {id:"c", q:"Is any of this safety-relevant? What follows if it is?"},
     {id:"d", q:"What determination would you support on this evidence alone, and what would you want to see before making it?"}
   ]},
  {id:"M2-E5", title:"Exercise 5 \u2014 Acting on a determination",
   scen:"After a further two quarters of accrued evidence showing a declining first-pass acceptance rate, you record a determination of Ineffective on that supplier.",
   parts:[
     {id:"a", q:"Select actions from the ladder and justify the level you chose."},
     {id:"b", q:"One action is a corrective action request. What must be true before you close it?"},
     {id:"c", q:"Name the four downstream consequences an ineffective determination triggers beyond the ladder, and what each protects against."},
     {id:"d", q:"A requirement was tailored at award on the basis that the supplier had a mature process. What now?"}
   ]},
  {id:"M2-E6", title:"Exercise 6 \u2014 Recursion",
   scen:"The actuator supplier subcontracts machining of the housing to a shop of their own, and buys the position sensor from a catalog vendor.",
   parts:[
     {id:"a", q:"What obligation, if any, does your company have with respect to those two lower-tier sources?"},
     {id:"b", q:"What data must come back up, and in what form?"},
     {id:"c", q:"The supplier\u2019s CM plan describes internal change control thoroughly and does not mention sub-tier suppliers. What is your review finding, which evidence stream does it belong to, and why is it a failure signal rather than a missing detail?"}
   ]},
  {id:"M2-E7", title:"Exercise 7 \u2014 Audit designation over a program life",
   scen:"At award, a CI built by a source-controlled design-and-build supplier is not contractually designated for audit. It hosts no hazard risk control. The assessment finds one risk factor: the supplier is a new source. Eighteen months later a hazard log revision adds a risk control to the CI. Six months after that, the supplier introduces a new sub-tier for a critical component.",
   parts:[
     {id:"a", q:"What is the designation outcome at award, and what is recorded?"},
     {id:"b", q:"What does the hazard log revision do \u2014 both to the designation and to the question of who may decide it?"},
     {id:"c", q:"The new sub-tier arrives. Which two things does that single event set in motion?"},
     {id:"d", q:"What does the statement of work you wrote at award now allow you to do that a statement of work deciding audit applicability at award would not?"},
     {id:"e", q:"The audit is initiated internally rather than by the Acquirer. The supplier proposes to sample the as-built examination rather than perform it in full, and to skip the requirements-to-test reconciliation because their automated toolchain enforces it. Which proposal is acceptable, and why?"}
   ]},
  {id:"M2-E8", title:"Exercise 8 \u2014 Reading a physical audit",
   scen:"A designated item is built by a source-controlled design-and-build supplier, who conducts the physical audit at their own facility. The audited unit is agreed jointly. During the audit: the software build is attempted and fails, because the supplier upgraded their compiler eight months ago and the original version is gone; two drawings carry notes citing a superseded revision, which turns out to be because approved change notices are not reaching the release process; one installed connector is not on the approved parts selection list; and the audited unit carries a bracket in a different material from the unit used at the functional audit. The supplier proposes to certify the audit complete and successful, carrying all four as open action items.",
   parts:[
     {id:"a", q:"Classify each of the four findings, and say what makes each one what it is."},
     {id:"b", q:"The audited unit differs from the functional-audit unit. What has to happen before that difference is acceptable, and who is on the hook for it?"},
     {id:"c", q:"The build cannot be reproduced. What does that mean for the product baseline \u2014 and what earlier failure, in a different CM activity entirely, actually caused this?"},
     {id:"d", q:"Can the audit be certified complete and successful as the supplier proposes? Name the certification outcomes and the dispositions that are actually available here."},
     {id:"e", q:"What audit outputs do you expect to reach your company, and on what timing? What in the statement of work made them yours to expect?"},
     {id:"f", q:"Which of the four findings tells you something about the supplier\u2019s CM process rather than about this unit, and what would you do with that beyond the audit?"}
   ]},
  {id:"M2-E9", title:"Exercise 9 \u2014 Reading a situation",
   scen:"You inherit a supplier portfolio. You find: classification records for eleven of forty-three active statements of work; a receipt log last updated fourteen months ago; no findings log; three suppliers with determinations recorded as Effective, all dated the same day; and a fourth supplier with two safety-relevant escapes in the past year and no determination at all.",
   parts:[
     {id:"a", q:"Name each problem and say what it means for the determinations that exist."},
     {id:"b", q:"Which supplier do you address first, and why?"},
     {id:"c", q:"Which of these can CM fix alone, and which need another function to act?"},
     {id:"d", q:"Some statements of work were released without CM signature. Against what is that finding recorded, and why does it matter that it is recorded that way?"}
   ]}
 ]
}

var STATE = { name:"", started:new Date().toISOString(), checks:{}, answers:{}, seen:{} };
var VIEW = { page:"start" };          // "start" | "s:<id>" | "x:<modId>" | "submit"
var PAGES = [];                        // flat ordered page list
var AUTOSAVE = false;

(function buildPages(){
  PAGES.push({k:"start", id:"START", nm:"Start here", grp:null});
  for(var i=0;i<MODULES.length;i++){
    var m=MODULES[i];
    for(var j=0;j<m.sections.length;j++){
      PAGES.push({k:"sect", id:m.sections[j].id, nm:m.sections[j].title, grp:m.id, mi:i, si:j});
    }
    PAGES.push({k:"ex", id:m.id+"-EX", nm:"Exercises", grp:m.id, mi:i});
  }
  PAGES.push({k:"submit", id:"RESULTS", nm:"Review and send", grp:null});
})();

/* ---- guarded browser storage: used only if the browser allows it ---- */
function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); return true; }catch(e){ return false; } }
(function detect(){ AUTOSAVE = lsSet("cmtrain_probe","1"); })();

function autosave(){
  if(!AUTOSAVE) return;
  lsSet("cmtrain_state", JSON.stringify(STATE));
}
function autoload(){
  if(!AUTOSAVE) return false;
  var raw = lsGet("cmtrain_state");
  if(!raw) return false;
  try{ var o=JSON.parse(raw); if(o && o.checks){ STATE=o; return true; } }catch(e){}
  return false;
}

/* ==========================================================================
   RENDERING HELPERS
   ========================================================================== */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\*([^*]+)\*/g,"<em>$1</em>");
}
function block(b){
  if(b.t==="p") return "<p>"+fmt(b.x)+"</p>";
  if(b.t==="list") return "<ul class='pl'>"+b.x.map(function(i){return "<li>"+fmt(i)+"</li>";}).join("")+"</ul>";
  if(b.t==="callout") return "<div class='callout "+(b.tone==="teal"?"teal":"")+"'>"+
      (b.lab?"<div class='lab'>"+esc(b.lab)+"</div>":"")+
      b.x.map(function(i){return "<p>"+fmt(i)+"</p>";}).join("")+"</div>";
  if(b.t==="stmt") return "<div class='stmt'><b>"+fmt(b.x)+"</b>"+(b.sub?"<span>"+fmt(b.sub)+"</span>":"")+"</div>";
  if(b.t==="cards") return "<div class='cards c"+b.cols+"'>"+b.x.map(function(c){
      return "<div class='card'><h4>"+fmt(c.h)+"</h4><p>"+fmt(c.b)+"</p></div>";}).join("")+"</div>";
  if(b.t==="steps") return "<div class='steps'>"+b.x.map(function(s,i){
      return "<div class='step "+(b.tone||"")+"'><div class='n'>"+(i+1)+"</div><div class='tx'><b>"+fmt(s.h)+"</b><span>"+fmt(s.b)+"</span></div></div>";}).join("")+"</div>";
  if(b.t==="table"){
    var th="<tr>"+b.head.map(function(h){return "<th>"+esc(h)+"</th>";}).join("")+"</tr>";
    var tb=b.x.map(function(r){
      return "<tr>"+r.map(function(c,ci){
        var k = (ci===0 && String(c).length<=10) ? " class='k'" : "";
        return "<td"+k+">"+fmt(c)+"</td>";}).join("")+"</tr>";}).join("");
    return "<div class='tw'><table><thead>"+th+"</thead><tbody>"+tb+"</tbody></table></div>";
  }
  return "";
}
function pageIndex(){
  for(var i=0;i<PAGES.length;i++){
    var p=PAGES[i];
    if(VIEW.page==="start"&&p.k==="start") return i;
    if(VIEW.page==="submit"&&p.k==="submit") return i;
    if(VIEW.page==="s:"+p.id) return i;
    if(VIEW.page==="x:"+p.grp&&p.k==="ex") return i;
  }
  return 0;
}
function pageKey(p){
  if(p.k==="start") return "start";
  if(p.k==="submit") return "submit";
  if(p.k==="ex") return "x:"+p.grp;
  return "s:"+p.id;
}

/* ---- completion status ---- */
function sectStatus(id){
  if(STATE.checks[id]) return "done";
  if(STATE.seen[id]) return "work";
  return "";
}
function exStatus(modId){
  var m = mod(modId), total=0, filled=0;
  m.exercises.forEach(function(x){ x.parts.forEach(function(p){
    total++; var v=STATE.answers[x.id+"."+p.id]; if(v&&v.trim().length>0) filled++;
  });});
  if(filled===0) return "";
  return filled===total ? "done" : "work";
}
function mod(id){ for(var i=0;i<MODULES.length;i++) if(MODULES[i].id===id) return MODULES[i]; return null; }

function counts(){
  var totalChecks=0, answered=0, right=0;
  MODULES.forEach(function(m){ m.sections.forEach(function(s){
    totalChecks++;
    var c=STATE.checks[s.id];
    if(c){ answered++; if(c.first===true) right++; }
  });});
  var totalParts=0, filledParts=0;
  MODULES.forEach(function(m){ m.exercises.forEach(function(x){ x.parts.forEach(function(p){
    totalParts++; var v=STATE.answers[x.id+"."+p.id]; if(v&&v.trim().length>0) filledParts++;
  });});});
  return {totalChecks:totalChecks, answered:answered, right:right, totalParts:totalParts, filledParts:filledParts};
}

function drawRail(){
  var c=counts();
  var h="<div class='railhead'><h2>Section register</h2><p>"+c.answered+" of "+c.totalChecks+
        " sections released \u00b7 "+c.filledParts+" of "+c.totalParts+" exercise answers written</p></div>";
  h+="<div class='grp'>"+navBtn(PAGES[0])+"</div>";
  MODULES.forEach(function(m){
    h+="<div class='grp'><h3>"+esc(m.label)+" \u2014 "+esc(m.title)+"</h3>";
    PAGES.forEach(function(p){ if(p.grp===m.id) h+=navBtn(p); });
    h+="</div>";
  });
  h+="<div class='grp'>"+navBtn(PAGES[PAGES.length-1])+"</div>";
  document.getElementById("rail").innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll("#rail .nav"), function(b){
    b.addEventListener("click", function(){ go(b.getAttribute("data-k")); });
  });
}
function navBtn(p){
  var st = p.k==="sect" ? sectStatus(p.id) : (p.k==="ex" ? exStatus(p.grp) : "");
  var cur = pageKey(p)===VIEW.page;
  return "<button class='nav' data-k='"+pageKey(p)+"' aria-current='"+(cur?"true":"false")+"'>"+
    "<span class='dot "+st+"'></span><span class='id'>"+esc(p.id)+"</span><span class='nm'>"+esc(p.nm)+"</span></button>";
}

/* ==========================================================================

function go(key){
  VIEW.page=key;
  var p=PAGES[pageIndex()];
  if(p.k==="sect") STATE.seen[p.id]=true;
  autosave(); draw();
  window.scrollTo({top:0,behavior:"auto"});
  document.getElementById("rail").classList.remove("open");
}
function draw(){
  drawRail();
  var i=pageIndex(), p=PAGES[i], st=document.getElementById("stage");
  if(p.k==="start") st.innerHTML=viewStart();
  else if(p.k==="submit") st.innerHTML=viewSubmit();
  else if(p.k==="ex") st.innerHTML=viewExercises(mod(p.grp));
  else st.innerHTML=viewSection(MODULES[p.mi], MODULES[p.mi].sections[p.si], p);
  st.className="stage fadein";
  st.innerHTML += pager(i);
  wire(i,p);
}
function pager(i){

function viewSection(m,s,p){

function checkHtml(s){
  var rec=STATE.checks[s.id];

    var cls="opt"+(locked?" locked":"");

      if(i===s.check.a) cls+=" right";

    }
    h+="<label class='"+cls+"'><input type='radio' name='ck_"+esc(s.id)+"' value='"+i+"'"+
       (locked?" disabled":"")+(rec&&rec.picks&&rec.picks.indexOf(i)>=0?" checked":"")+"> <span>"+fmt(o)+"</span></label>";
  });

     (locked?"":"<button class='btn pri' data-ckgo='"+esc(s.id)+"'>Check answer</button>")+"</div>";

function recordNo(){

/* ==========================================================================
