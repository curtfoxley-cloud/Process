<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configuration Management Onboarding — Interactive Modules</title>
<style>
:root{
  --ink:#1E262E; --ink-2:#2C3841; --slate:#5C6D78; --mute:#8998A2;
  --paper:#FFFFFF; --surface:#F4F6F7; --surface-2:#EDF0F1; --rule:#D6DCDF;
  --rust:#A8481F; --rust-soft:#F2E4DD; --rust-ink:#7E340F;
  --teal:#1F5F5B; --teal-soft:#DFEAE8;
  --amber:#9A6508; --amber-soft:#F6ECD8;
  --alert:#8E2F2F; --alert-soft:#F4E2E2;
  --serif:Georgia,Cambria,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --rail:290px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--surface);
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- header ---------- */
.top{
  position:sticky; top:0; z-index:40; background:var(--ink); color:#fff;
  display:flex; align-items:center; gap:16px; padding:0 20px; height:60px;
  border-bottom:1px solid #000;
}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#93A2AB}
.top .spacer{flex:1}
.who{display:flex;align-items:center;gap:8px}
.who label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#93A2AB}
.who input{
  background:#2C3841;border:1px solid #3D4B55;color:#fff;border-radius:4px;
  padding:6px 10px;font-size:13px;width:180px;
}
.who input:focus{outline:2px solid var(--rust);outline-offset:1px}
.tbtn{
  background:transparent;border:1px solid #46545F;color:#DCE3E7;border-radius:4px;
  padding:7px 12px;font-size:12.5px;white-space:nowrap;
}
.tbtn:hover{background:#2C3841;border-color:#5E6D77}
.tbtn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.railtoggle{display:none}

/* ---------- shell ---------- */
.shell{display:flex;align-items:flex-start;max-width:1400px;margin:0 auto}
.rail{
  width:var(--rail); flex:0 0 var(--rail); background:var(--paper);
  border-right:1px solid var(--rule); min-height:calc(100vh - 60px);
  position:sticky; top:60px; max-height:calc(100vh - 60px); overflow-y:auto;
}
.railhead{padding:18px 20px 12px;border-bottom:1px solid var(--rule)}
.railhead h2{margin:0 0 3px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);font-weight:700}
.railhead p{margin:0;font-size:12px;color:var(--slate)}
.grp{padding:14px 0 6px}
.grp h3{
  margin:0 0 6px;padding:0 20px;font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--slate);font-weight:700;
}
.nav{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;
  padding:7px 20px 7px 17px;display:flex;gap:10px;align-items:flex-start;line-height:1.35}
.nav:hover{background:var(--surface)}
.nav:focus-visible{outline:2px solid var(--rust);outline-offset:-2px}
.nav[aria-current="true"]{background:var(--surface-2);border-left-color:var(--rust)}
.nav .id{font-family:var(--mono);font-size:10.5px;color:var(--mute);flex:0 0 46px;padding-top:2px;letter-spacing:.02em}
.nav[aria-current="true"] .id{color:var(--rust-ink)}
.nav .nm{font-size:13px;color:var(--ink-2);flex:1}
.nav[aria-current="true"] .nm{font-weight:600}
.dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:5px;border:1.5px solid var(--rule);background:transparent}
.dot.work{border-color:var(--amber);background:var(--amber-soft)}
.dot.done{border-color:var(--teal);background:var(--teal)}

/* ---------- main ---------- */
main{flex:1;min-width:0;padding:0 0 80px}
.stage{max-width:820px;margin:0 auto;padding:34px 32px 0}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.recid{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--rust-ink);background:var(--rust-soft);
  padding:3px 8px;border-radius:3px;font-weight:700}
.status{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
h1.sect{font-family:var(--serif);font-size:31px;line-height:1.2;margin:0 0 6px;letter-spacing:-.2px}
.lede{font-size:15px;color:var(--slate);margin:0 0 22px}
.hr{height:1px;background:var(--rule);margin:0 0 26px}
p{margin:0 0 14px}
strong{font-weight:700}
ul.pl{margin:0 0 16px;padding-left:0;list-style:none}
ul.pl li{position:relative;padding-left:20px;margin-bottom:9px}
ul.pl li::before{content:"";position:absolute;left:3px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--rust)}

.callout{background:var(--surface);border-radius:6px;padding:16px 18px;margin:0 0 20px;border:1px solid var(--rule)}
.callout.teal{background:var(--teal-soft);border-color:#CBDDDA}
.callout .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:7px}
.callout.teal .lab{color:var(--teal)}
.callout p:last-child{margin-bottom:0}

.stmt{background:var(--ink);color:#fff;border-radius:6px;padding:20px 22px;margin:0 0 20px}
.stmt b{display:block;font-family:var(--serif);font-size:19px;line-height:1.35;font-weight:700}
.stmt span{display:block;margin-top:9px;font-size:13.5px;color:#B4C0C7}

.cards{display:grid;gap:12px;margin:0 0 20px}
.cards.c2{grid-template-columns:1fr 1fr}
.cards.c3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.card h4{margin:0 0 6px;font-size:14px;font-weight:700}
.card p{margin:0;font-size:13.5px;color:var(--ink-2)}

.steps{margin:0 0 20px;display:grid;gap:8px}
.step{display:flex;gap:12px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:11px 14px}
.step .n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--rust);color:#fff;
  font-family:var(--mono);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.step.tl .n{background:var(--teal)}
.step .tx b{display:block;font-size:14px;margin-bottom:2px}
.step .tx span{font-size:13.5px;color:var(--ink-2)}

.tw{overflow-x:auto;margin:0 0 20px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
thead th{background:var(--ink);color:#fff;text-align:left;padding:9px 12px;font-size:12px;font-weight:700;letter-spacing:.02em}
tbody td{padding:9px 12px;border-top:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
tbody tr:nth-child(even) td{background:#FAFBFB}
td.k{font-family:var(--mono);font-size:12px;color:var(--rust-ink);white-space:nowrap}

/* ---------- knowledge check ---------- */
.check{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--rust);border-radius:6px;padding:18px 20px;margin:26px 0 0}
.check .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-ink);font-weight:700;margin-bottom:8px}
.check .q{font-size:15.5px;font-weight:600;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--rule);border-radius:5px;margin-bottom:7px;cursor:pointer;background:var(--paper);font-size:14px}
.opt:hover{background:var(--surface)}
.opt input{margin:3px 0 0;accent-color:var(--rust);flex:0 0 auto}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt.wrong{border-color:var(--alert);background:var(--alert-soft)}
.opt.locked{cursor:default}
.fb{margin-top:11px;padding:12px 14px;border-radius:5px;font-size:14px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--teal-soft);border:1px solid #CBDDDA}
.fb.no{background:var(--alert-soft);border:1px solid #E8CFCF}
.fb b{display:block;margin-bottom:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.fb.ok b{color:var(--teal)} .fb.no b{color:var(--alert)}

/* ---------- exercises ---------- */
.exwrap{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 20px;margin:0 0 18px}
.exwrap h4{margin:0 0 8px;font-family:var(--serif);font-size:18px}
.scen{background:var(--surface);border-radius:5px;padding:13px 15px;font-size:14px;margin-bottom:16px}
.part{margin-bottom:16px}
.part label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
textarea{width:100%;border:1px solid var(--rule);border-radius:5px;padding:10px 12px;font-size:14px;
  line-height:1.55;resize:vertical;min-height:76px;background:var(--paper)}
textarea:focus{outline:2px solid var(--rust);outline-offset:0;border-color:var(--rust)}
.count{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:4px;text-align:right}

/* ---------- buttons / footer nav ---------- */
.pager{display:flex;justify-content:space-between;gap:12px;margin:32px 0 0;padding-top:22px;border-top:1px solid var(--rule)}
.btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:5px;padding:10px 18px;font-size:14px;font-weight:600}
.btn:hover{background:var(--surface)}
.btn:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
.btn.pri{background:var(--rust);border-color:var(--rust);color:#fff}
.btn.pri:hover{background:var(--rust-ink)}
.btn.gh{background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}

/* ---------- start + submit ---------- */
.hero{background:var(--ink);color:#fff;border-radius:8px;padding:34px 34px 30px;margin-bottom:26px}
.hero .kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust-soft);margin-bottom:12px}
.hero h1{font-family:var(--serif);font-size:35px;line-height:1.15;margin:0 0 12px}
.hero p{color:#B4C0C7;margin:0;font-size:15px;max-width:60ch}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0 0 22px;font-size:14px}
.meta dt{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);padding-top:3px}
.meta dd{margin:0}
.transmit{border:1px solid var(--rule);border-radius:6px;background:var(--paper);overflow:hidden;margin-bottom:22px}
.transmit .hd{background:var(--surface-2);padding:12px 18px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.transmit .hd b{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.transmit .hd span{font-family:var(--mono);font-size:11px;color:var(--slate)}
.transmit .bd{padding:18px}
.scorebox{display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px}
.scorebox .big{font-family:var(--serif);font-size:42px;font-weight:700;line-height:1}
.scorebox .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate)}
.gaps{margin-top:14px}
.gaps li{font-size:13.5px}
.note{font-size:13px;color:var(--slate);margin-top:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:5px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.warn{background:var(--amber-soft);border:1px solid #E4D3AE;border-radius:5px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.setup{font-size:13px;color:var(--slate);border-top:1px solid var(--rule);margin-top:26px;padding-top:16px}
.setup code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:3px}

.fadein{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:760px){
  .top{padding:0 12px;gap:8px}
  .brand{display:none}
  .lng{display:none}
  .who{flex:1;min-width:0}
  .who label{display:none}
  .who input{width:100%;min-width:0}
}
@media(max-width:900px){
  .cards.c3,.cards.c2{grid-template-columns:1fr}
  .rail{position:fixed;top:60px;left:0;bottom:0;z-index:35;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 0 100vmax rgba(0,0,0,0);max-height:none}
  .rail.open{transform:none;box-shadow:2px 0 24px rgba(0,0,0,.25)}
  .railtoggle{display:inline-block}
  .stage{padding:26px 18px 0}
  .who input{width:120px}
  h1.sect{font-size:26px}
  .hero{padding:26px 22px}
  .hero h1{font-size:28px}
}
</style>
</head>
<body>

<header class="top">
  <button class="tbtn railtoggle" id="railToggle" aria-label="Show section register">Sections</button>
  <div class="brand">
    <b>Configuration Management Onboarding</b>
    <span id="brandSub">Interactive modules</span>
  </div>
  <div class="spacer"></div>
  <div class="who">
    <label for="who">Trainee</label>
    <input id="who" type="text" placeholder="Your name" autocomplete="name">
  </div>
  <button class="tbtn" id="btnSave">Save<span class="lng"> progress</span></button>
  <button class="tbtn" id="btnLoad">Resume</button>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Section register"></nav>
  <main><div class="stage" id="stage"></div></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ==========================================================================
   TRAINER SETUP — edit this block, save the file, then share it.
   Nothing else in this file needs changing.
   ========================================================================== */
var CONFIG = {
  companyName:   "[Company]",
  trainerName:   "your trainer",
  trainerEmail:  "",            // e.g. "cm.lead@company.com" — enables the Email results button
  submitEndpoint:""             // optional: a URL that accepts a JSON POST (Power Automate, Forms webhook, etc.)
};

/* ==========================================================================
   CONTENT
   ========================================================================== */
var P = function(t){return {t:"p", x:t};};
var L = function(a){return {t:"list", x:a};};
var C = function(lab,lines,tone){return {t:"callout", lab:lab, x:lines, tone:tone||"rust"};};
var S = function(b,sub){return {t:"stmt", x:b, sub:sub||""};};
var CARDS = function(items,cols){return {t:"cards", x:items, cols:cols||3};};
var TABLE = function(head,rows){return {t:"table", head:head, x:rows};};
var STEPS = function(items,tone){return {t:"steps", x:items, tone:tone||""};};

var MODULES = [
{
 id:"M1", label:"Module 1", title:"Configuration Identification",
 sub:"Defining, selecting and identifying Configuration Items",
 sections:[
  {id:"M1-01", title:"What configuration management is", body:[
    P("Configuration management keeps three descriptions of a product consistent with one another. Everything else in the discipline exists to protect that consistency."),
    CARDS([
      {h:"As required", b:"What the product is contractually and functionally obliged to be. Specifications, requirements, interface definitions."},
      {h:"As documented", b:"What the released design says the product is. Drawings, models, software design documentation, the technical data package."},
      {h:"As built / as maintained", b:"What the physical article actually is, unit by unit. Build records, serial and lot records, repair and retrofit records."}
    ],3),
    S("When the three agree, the product is under configuration control. When they diverge, nobody can say with evidence what they actually have.",
      "A change gets built but never documented. A specification is revised but never flowed to the drawing. A unit is repaired to a scheme nobody approved."),
    C("Why this matters more on safety-significant products",[
      "On a product line where failure can injure or kill, \u201cwhat exactly is in this unit?\u201d is not an administrative question. It determines whether a hazard control is present, whether a life-limited part is within life, and whether a fleet-wide inspection can be scoped.",
      "**Configuration divergence on a safety-significant product is a latent safety problem wearing a paperwork costume.**"
    ])
  ], check:{
    q:"A supplier builds ten units to the released drawing, then quietly improves a bracket on the last three. The units work fine. What has gone wrong in configuration terms?",
    o:["Nothing, because the units meet their performance requirements",
       "As-built has diverged from as-documented, so nobody can now say what any given unit contains",
       "Only a quality problem \u2014 the parts still passed inspection",
       "Nothing, provided the change is documented at the next revision"],
    a:1,
    why:"Performance is not the test. The three descriptions have diverged: the documentation says one thing and three physical articles say another. Until that is reconciled, the configuration of every delivered unit is in question \u2014 not just the three."
  }},

  {id:"M1-02", title:"The five functions, and why identification is first", body:[
    P("CM is conventionally divided into five functions. This module lives entirely inside the second one."),
    TABLE(["Function","The question it answers"],[
      ["Planning and management","How will CM be performed here, by whom, with what tools, and how will we know it is working?"],
      ["Configuration identification","What are the things we are managing, what defines each one, and what is each one called?"],
      ["Change management","How does a change to a defined thing get proposed, evaluated, approved and incorporated?"],
      ["Status accounting","What is the current and historical status of every defined thing and every change to it?"],
      ["Verification and audit","Can we demonstrate, with evidence, that the product meets requirements and matches its documentation?"]
    ]),
    P("The other four all take identification as their input, and none can be scoped without it:"),
    L(["**Change management** changes *something*. If that something was never defined and baselined, there is nothing to change against.",
       "**Status accounting** reports the status of something, indexed by something. No identification, no index.",
       "**Verification and audit** compares product against documentation. Both sides of that comparison are outputs of identification.",
       "**Planning** allocates effort across a scope. Identification defines the scope."]),
    S("A missing CI is a change stream nobody controls, a status accounting blind spot, and an audit finding \u2014 found years later, at the highest possible cost.",
      "Time spent getting selection right is the cheapest time in the discipline.")
  ], check:{
    q:"Why is configuration identification performed before the other CM functions rather than alongside them?",
    o:["Because it is the least expensive function to perform",
       "Because contracts normally require it in that order",
       "Because the other four functions all take its outputs as their input and cannot be scoped without them",
       "Because it is the only function the Acquirer reviews"],
    a:2,
    why:"Identification defines the things everything else acts on. Change management needs something to change against; status accounting needs an index; audit needs both sides of the comparison. Errors in identification do not stay in identification."
  }},

  {id:"M1-03", title:"The CM floor", body:[
    P("Some CM requirements are not the contract\u2019s to give away. On safety-significant product lines, a defined set of roughly forty-four discrete requirements \u2014 the CM floor \u2014 is performed regardless of what the contract flows down. Each one functions as a barrier to a catastrophic or severe safety outcome, and the safety management system the company has adopted obligates it through a pathway that does not run through the contract at all."),
    S("Contract silence removes the contractual obligation. It does not remove the hazard the requirement controls.",
      "The obligation arrives by a second route \u2014 the safety pathway \u2014 which binds whether or not the contract says a word. The next section explains why."),
    P("The floor enters at exactly one point: tailoring \u2014 the moment a program decides which CM requirements it will and will not perform \u2014 and it re-enters at every CM plan revision. When a program proposes not to perform a requirement, the gate runs:"),
    STEPS([
      {h:"Step 1 \u2014 the floor check", b:"Is the requirement a floor item? If no, normal tailoring applies and the program proceeds at its discretion. If yes, it cannot be dropped silently \u2014 continue."},
      {h:"Step 2 \u2014 choose a door", b:"Exactly three dispositions exist. **Perform** the requirement. **Replace** it with a documented equivalent control \u2014 validated independently by CM and Safety Assurance against the hazard it controls, not by the program that proposed it. Or **risk-accept** its absence formally, at the authority level the safety management system names for the severity: a vice president for a severe barrier, the chief executive for a catastrophic one."},
      {h:"Step 3 \u2014 set the health check", b:"For performed and equivalent items, record how the barrier\u2019s continued effectiveness will be monitored over the program life. A barrier must be present and kept effective \u2014 a degraded barrier is a finding, not a pass."}
    ]),
    S("There is no fourth door.",
      "Silent omission is the failure mode the gate exists to close. Because risk acceptance is visible, routes upward, and cannot be scored down, the expected default for most floor items is \u201cperform.\u201d"),
    C("Severity is looked up, not re-rated",[
      "Each floor item carries a severity assigned by the barrier safety case and fixed at the register level. At tailoring it is **looked up, never re-assessed**. This removes the one incentive that reliably corrupts these decisions: rating a barrier\u2019s absence low so the acceptance stays at a comfortable altitude.",
      "The program does not get to decide how dangerous the barrier\u2019s absence would be. That question was answered when the barrier was established, by people with no tailoring decision in front of them."
    ]),
    P("Every disposition lands in a per-program compliance record: one structured, queryable row per floor item, carrying the disposition, the evidence or risk-acceptance reference, the health check method and schedule, and the sign-off. The record is queryable on purpose \u2014 the floor measures are computed from it, and **records that cannot be queried cannot be measured.**"),
    C("How floor coverage is measured",[
      "Two numbers, reported together and never combined. A severity-weighted coverage percentage gives the trend and rewards closing the deadliest gaps first. Alongside it, a plain **count** of open top-band items \u2014 target zero, never averaged into anything.",
      "The count exists because a single open catastrophic barrier must not be able to hide behind a 96% number. And the share of coverage achieved by risk acceptance rather than performance is reported separately \u2014 so a high coverage figure is never misread as a safe portfolio."
    ],"teal")
  ], check:{
    q:"A program proposes not to perform a floor requirement, pointing out that the contract does not flow it down. What are its options?",
    o:["Drop it with a recorded rationale \u2014 the contract governs what is performed",
       "Perform it, replace it with an independently validated equivalent control, or obtain formal risk acceptance at the severity-matched authority \u2014 contract silence changes nothing",
       "Obtain Acquirer approval to omit it",
       "Re-rate the severity for this program and tailor accordingly"],
    a:1,
    why:"Floor items are obligated through the safety pathway, so a silent contract is beside the point. The three doors are exhaustive, the severity is pre-anchored and cannot be re-rated, and the Acquirer has no standing in it \u2014 the obligation was never theirs to waive."
  }},

  {id:"M1-04", title:"Why the floor exists: the sixteen barriers", body:[
    P("The floor is not a list someone thought prudent. Every requirement on it traces to one of sixteen barriers, and every barrier is anchored to a documented aerospace event in which that barrier\u2019s failure killed people or destroyed the product. The floor is the deduplicated set of requirements those sixteen barriers rest on."),
    CARDS([
      {h:"The contract pathway", b:"Binds where clauses are flowed. If the contract invokes a CM requirement, it is contractually obligated; if the contract is silent, it is not. This pathway is real, and it is the only one many engineers are taught to see."},
      {h:"The safety pathway", b:"The organization adopted a safety management system, which names specific hazards \u2014 inaccurate build data, unmanaged change, non-conformance, interface failures \u2014 and requires them controlled. Where a CM requirement is the control for a named hazard, the activity is obligated regardless of the contract. The only open question is which label the organization puts on it."}
    ],2),
    S("Omitting a barrier because the contract is silent is a catastrophic-or-severe risk-acceptance decision \u2014 made by omission, at the wrong altitude.",
      "Somebody accepts that risk either way. The gate in the previous section exists so it is accepted knowingly, by the person whose signature the severity actually requires."),
    P("The sixteen barriers fall into four clusters, and the shape of Module 1 and Module 2 follows them:"),
    L(["**Hazard identification and critical-item recognition** \u2014 declaring, at CM level, which items can kill, so that everything downstream treats them accordingly.",
       "**Change discipline and impact assessment** \u2014 classifying every change, assessing its full impact, and routing safety-affecting changes to the right approval authority.",
       "**As-designed-to-as-built reconciliation** \u2014 keeping the record of what was actually built, unit by unit, true for the life of the product.",
       "**Supply chain, interfaces, and verification** \u2014 holding the disciplines together across organizational boundaries, where they are weakest."]),
    P("Three of the anchor events, briefly:"),
    CARDS([
      {h:"Alaska Airlines 261 \u2014 2000", b:"A horizontal stabilizer jackscrew assembly whose criticality was under-recognized, and whose as-maintained condition drifted over years of service. 88 dead. The barrier: formally identify as critical any item whose failure can cause loss of life \u2014 so the system has a structural defense against under-recognized criticality."},
      {h:"Challenger \u2014 1986", b:"A criticality reclassification that stale paperwork failed to propagate to the people making launch decisions, and a waiver approved through an abbreviated process. 7 dead. The barrier: change classification discipline, and approval authority matched to what the change actually touches."},
      {h:"Mars Climate Orbiter \u2014 1999", b:"Two teams, one interface, two unit systems, no controlled interface definition catching the mismatch. A $327M spacecraft flown into the atmosphere. The barrier: interface requirements identified, documented, and controlled across every boundary."}
    ],3),
    P("Across the sixteen documented events the fatality count exceeds 880, and thirteen of the sixteen barriers are anchored at the catastrophic level. The barriers are not theoretical, and the floor built on them is not bureaucracy \u2014 it is the accumulated accident record, converted into requirements.")
  ], check:{
    q:"Who has the authority to decide that a barrier requirement will not be performed on a safety-significant product line?",
    o:["The CM lead, provided the rationale is recorded",
       "The program manager, where the contract does not flow the requirement down",
       "No one \u2014 floor requirements can never be omitted",
       "Only the named risk-acceptance authority for the barrier\u2019s severity, through the floor gate, after independent validation"],
    a:3,
    why:"Not CM, not contracts, not the program \u2014 the decision is a risk acceptance at the barrier\u2019s pre-anchored severity, and it belongs to whoever the safety management system names for that severity. \u201cNever\u201d is also wrong: the gate exists precisely so the decision can be made \u2014 visibly, at the right altitude \u2014 rather than by omission."
  }},

  {id:"M1-05", title:"The words you will meet", body:[
    P("A short detour into vocabulary before the machinery starts. These terms run through the rest of the training and through every document you will touch. Guessing at them is how work gets misclassified \u2014 and every one of them is really a statement about **who owns the design, and how much of it you are being shown.**"),
    TABLE(["Term","What it means"],[
      ["Acquirer and Supplier","The customer who buys the product and controls what they choose to control, and the organisation that designs, builds and delivers it. Your company is the Supplier here \u2014 and becomes the Acquirer in turn to its own sub-suppliers, which is the whole premise of Module 2"],
      ["Design activity","The organisation responsible for the design of an item. Its enterprise code goes on the item, its parts, its documentation and its media \u2014 which is what makes a part number unambiguous, since a part number is only unique within the activity that assigned it"],
      ["Technical data package","The collected design definition sufficient to build the item: drawings and models, associated lists, specifications, and the process requirements that go with them"],
      ["Performance specification","States requirements as **required results, with criteria for verifying compliance, but without stating the methods** for achieving them. It defines the functional requirements, the environment the item must operate in, and its interface and interchangeability characteristics"],
      ["Detail specification","States **design** requirements \u2014 materials to be used, how a requirement is to be achieved. A specification containing both performance and detail requirements is still a detail specification"],
      ["System specification, item specification","The top-level specification for the whole system or end item, versus the specification for one CI. The first sits in the functional documentation; the second in the allocated"],
      ["Source control drawing","Covers a commercial or vendor-developed item used in a **critical application**. It gives the engineering description, qualification requirements and acceptance criteria, and it carries a list of approved sources with the vendor\u2019s own identification for items qualified for that use. The vendor owns the internal design; the drawing controls the item\u2019s characteristics and who may supply it"],
      ["Vendor item control drawing","Covers a catalog item bought to the vendor\u2019s own part number, where that kind of source qualification is not being imposed. Design authority stays wholly with the vendor, and the flowdown is mostly notification"],
      ["Altered item drawing","Documents a purchased item that is permanently altered before it is installed \u2014 including a one-time programmable device burned with code, which is why it appears in the firmware rules"],
      ["Contract data requirements","The list on the contract stating which data products are delivered, in what form, and when. A requirement with no data requirement behind it produces nothing you can ask for"]
    ]),
    S("Read a drawing type as an answer to the design authority question, never as a filing detail.",
      "Source control drawing: they design the internals, you control the characteristics and the sources. Vendor item control drawing: they design it, they own it, you buy it. A technical data package you issued: you designed it, they build it. Those three sentences drive completely different CM obligations.")
  ], check:{
    q:"A supplier designs the internals of an actuator for a critical application. Your company sets its performance, interface and qualification requirements and maintains the list of sources approved to supply it. Which artifact controls that arrangement?",
    o:["A vendor item control drawing",
       "A source control drawing",
       "A technical data package issued to the supplier",
       "A detail specification"],
    a:1,
    why:"The approved-sources list plus qualification and acceptance criteria for an item used in a critical application is exactly what a source control drawing does. A vendor item control drawing would mean buying a catalog item to the vendor\u2019s number with no such control; a technical data package would mean your company held the design; a detail specification would tell them how to build it, which is the opposite of what is happening here."
  }},

  {id:"M1-06", title:"Three identifiers, three different questions", body:[
    P("Conflating these is the most common newcomer error, and it produces the most durable damage. Keep them separate from day one."),
    TABLE(["Identifier","Answers","Changes when\u2026","Never"],[
      ["CI identifier","Which managed function is this, and what is the boundary of its configuration control?","The management need changes \u2014 a new function is designated, or a CI is split or consolidated","Assigned to solve a part-numbering problem"],
      ["Part or identifying number (PIN)","Which design definition is this built to? Is it interchangeable with that other one?","A modification creates a non-interchangeable condition in form, fit or function","Changed for a purely administrative reason"],
      ["Unit identifier (serial, lot, batch)","Which physical article is this, out of all the ones we built?","Never \u2014 it identifies one article for life","Revised or re-used, even through a PIN change"]
    ]),
    S("The CI identifier and the PIN are deliberately decoupled.",
      "One CI can carry several PINs as variants. One PIN can appear under two different CIs. Both are normal, correct outcomes.")
  ], check:{
    q:"Unit serial 0047 is modified in service. The change alters the mounting flange pattern, so the modified unit can no longer replace an unmodified one. Which identifiers change?",
    o:["The PIN and the serial number",
       "The PIN only",
       "The CI identifier and the PIN",
       "All three"],
    a:1,
    why:"A non-interchangeable condition in form and fit is exactly what a PIN change signals. The serial number identifies one physical article for life and is retained through a PIN change. The CI identifier does not move \u2014 the item still performs the same managed function within the same boundary."
  }},

  {id:"M1-07", title:"The full identifier scheme", body:[
    P("The three identifiers of the previous section sit inside a five-class scheme, applied to every CI, its component parts, and its configuration documentation. Nothing gets an identity by accident, and nothing that needs one goes without."),
    TABLE(["Class","Assigned to","The rule"],[
      ["Enterprise","Items, parts, documentation, software media, products","The design activity\u2019s enterprise code, affixed to everything it designs. Answers \u201cwhose design definition is this?\u201d \u2014 and makes every other identifier unambiguous, because a part number is only unique within the enterprise that assigned it"],
      ["Product \u2014 the PIN","All CIs, parts, assemblies, units, and sets","The same as, or containing, the design document number \u2014 so the identifier and the definition cannot drift apart. Changes when a modification creates a non-interchangeable condition"],
      ["Unit \u2014 serial number","Individual articles that must be distinguished from one another","Identifies one physical article for life"],
      ["Group \u2014 lot or batch number","Groups of articles produced together, where unit-level distinction is not required","Identifies the group for life, on the same terms as a serial"],
      ["Document","Every item of configuration documentation","Uniquely identified so it can be referenced precisely and retrieved \u2014 every version of every representation"]
    ]),
    S("Serial and lot numbers are unique, consecutive, and non-duplicating against a non-changing product-tracking base identifier \u2014 and once assigned, never revised and never re-used.",
      "A modified unit keeps its original unit identifier through a PIN change. That is what preserves the thread back to the original configuration: the article\u2019s history stays attached to the article."),
    P("Software and firmware follow the same logic with two wrinkles. Every software CI gets a unique identifier **and a version identifier for every version** \u2014 software changes too easily for the item identifier alone to say what you have. And embedded code splits two ways:"),
    CARDS([
      {h:"Embedded, controlled with its device", b:"Where code and the hardware device it lives in are controlled together on a single altered-item drawing, one PIN represents the device **with the code embedded**. The software medium is labeled separately, and the device is marked accordingly. One identity, deliberately \u2014 they change together."},
      {h:"Controlled separately", b:"Where the code is managed in its own right, the device carries its PIN and serial, and the code is its own software CI with its own identifier and version identifiers. Two identities, deliberately \u2014 they change independently, and each needs its own change and status thread."}
    ],2),
    P("Two further rules complete the scheme. Nomenclature is revised when a non-interchangeable condition requires it \u2014 a name that no longer distinguishes non-interchangeable things has stopped doing its job. And unique item identification marking is applied where the contract requires it.")
  ], check:{
    q:"Unit serial 0031 is scrapped during production after a machining error. The planner proposes assigning 0031 to the replacement article so the delivery sequence stays tidy.",
    o:["Acceptable \u2014 the original unit no longer exists, so no ambiguity can arise",
       "Acceptable if the scrap record notes the re-assignment",
       "Not acceptable \u2014 unit identifiers are never re-used; the scrapped article\u2019s history, including its scrap disposition, must stay unambiguously attached to 0031 for life",
       "Acceptable for lot numbers but not serial numbers"],
    a:2,
    why:"Never revised, never re-used \u2014 with no exception for scrapped units. The moment two articles have ever answered to one serial, every record against that serial becomes a question instead of an answer. The replacement takes the next number in sequence; the tidy delivery list is not a configuration record."
  }},

  {id:"M1-08", title:"Baselines", body:[
    P("A baseline is an agreed, fixed reference point: the approved configuration documentation for a CI at a defined moment, from which changes are managed by formal action."),
    STEPS([
      {h:"Functional \u2014 FBL","b":"System-level performance requirements and verification method for the system or top-level item. Typically established at the system requirements or functional review."},
      {h:"Allocated \u2014 ABL", b:"Requirements allocated down to each CI, with interfaces and verification, in item performance specifications. Typically at preliminary design review, per CI."},
      {h:"Product \u2014 PBL", b:"The detailed design definition \u2014 the documentation describing the item as built. Typically at critical design review and configuration audit, per CI."}
    ],"tl"),
    P("Once documentation is baselined, changes to it are processed through formal change action rather than by editing the document. That is the hinge between identification and change management. Baselined interface requirements are no exception \u2014 controlling them is a CM floor obligation.")
  ], check:{
    q:"What changes about a document the moment it is baselined?",
    o:["It becomes read-only in the document system",
       "It can no longer be revised at all",
       "It is delivered to the Acquirer",
       "Changes to it are processed through formal change action rather than by editing it"],
    a:3,
    why:"A baseline is a reference point, not a lock. The document still changes \u2014 but through a controlled, recorded change action, so that every version has a traceable approval behind it."
  }},

  {id:"M1-09", title:"The three documentation sets", body:[
    P("A baseline is a moment. The **configuration documentation** is what the baseline is made of \u2014 and each baseline has its own set, with its own job. Naming them precisely matters, because the audits, the change function and the whole supplier flowdown all cite one set or another."),
    TABLE(["Documentation set","The question it answers","What it documents"],[
      ["Functional","What must the system do, and how will we know it did?","The system\u2019s functional, performance, interoperability and interface requirements, together with the verifications required to demonstrate those requirements were achieved. It documents the functional baseline, and is typically made up of the contract together with the system or end-item level specification"],
      ["Allocated","What must this CI do, given what the system must do?","The CI\u2019s functional, performance and interoperability requirements **allocated down** from the system or a higher-level CI; its interface requirements with the CIs it interfaces to; and the verifications required to demonstrate achievement. It documents the allocated baseline, CI by CI"],
      ["Product","What is this CI in detail \u2014 and what has to be true before we accept one?","The CI\u2019s detailed design: the physical form, fit and function characteristics, plus the functional and performance requirements selected for production, qualification and acceptance test. It documents the product baseline"]
    ]),
    S("All three carry verification, not just requirements.",
      "Each set describes what is required **and** how achievement is demonstrated. A requirement documented with no stated means of verifying it is a requirement nobody has yet committed to being able to check \u2014 and it will be found at the functional audit, which is precisely a walk from requirement to verification evidence."),
    P("The product set is the largest, because it has to be sufficient to build the item, accept it, and support it. Alongside the detailed design it carries:"),
    L(["The verifications necessary to accept deliveries \u2014 first article and acceptance inspection provisions, including the form, fit, function and quality assurance provisions required to accept the item.",
       "The design of any special tooling, software, equipment and facilities required to manufacture, operate, maintain, calibrate or inspect items in the design.",
       "The design of any special packaging parts required to package the CI.",
       "Any unique process specifications required to manufacture, operate, maintain or calibrate items in the design.",
       "Identification of any commercial hardware or software used in the detailed design.",
       "Where the contract requires it, the technical data giving instructions for installation, operation, maintenance, training and support."]),
    C("The scaling rule",[
      "The design information in the product set can be **as simple as identifying a specific part number, or as complex as full design disclosure.** It scales with the production and procurement strategy \u2014 which is the same decision you meet again as documentation determination, where the type follows item maturity, ownership and control level.",
      "For a privately developed CI the obligation is narrow but firm: the product set must at least carry the verification provisions required to accept deliveries. **You may not own the design. You still have to be able to say what an acceptable article looks like.**"
    ]),
    S("A baseline plus its approved changes is the current approved configuration.",
      "The baseline alone is a photograph of a moment that has already passed. What anyone actually builds, tests or audits against is the baseline plus everything approved since."),
    P("Two rules hold the sets together. **Each succeeding baseline traces to its predecessor**, with a detailed extension at each step \u2014 system requirements to allocated requirements to detailed design. A product baseline that cannot be traced back to the requirements it satisfies is a design nobody can defend. And **each set identifies any specialised software and the operating environment used to author it** \u2014 the same logic that puts the build toolchain under identification. A definition you cannot reopen is a definition you cannot maintain."),
    P("When a change is approved, the documentation is maintained by creating a **new revision**. The revision provides traceability by detailing the conditions before and after the change, and it identifies the change as the revision authority. Interface information is incorporated into all three sets as each is developed \u2014 in the applicable specifications directly, or through referenced interface documentation.")
  ], check:{
    q:"A colleague says verification requirements belong with the product documentation, since that is where testing gets defined. Where do verifications actually appear?",
    o:["In the product set only \u2014 the earlier sets carry requirements, and verification comes later",
       "In all three sets, doing different jobs: demonstrating system requirements, demonstrating the requirements allocated to each CI, and accepting deliveries of a produced article",
       "In the test plans, which sit outside configuration documentation entirely",
       "In the functional set only, since verification is a system-level concern"],
    a:1,
    why:"Every set pairs requirements with the means of demonstrating them. The functional set carries the verifications for system requirements, the allocated set those for the requirements allocated to a CI, and the product set the first article and acceptance provisions needed to take delivery of an article. Test plans and procedures implement those verification requirements \u2014 they do not replace them."
  }},

  {id:"M1-10", title:"Where candidates come from", body:[
    P("Everything that follows screens a **candidate list**. That list is not CM\u2019s private product, and it does not assemble itself."),
    CARDS([
      {h:"Who nominates", b:"Systems Engineering, Design Engineering, Logistics and CM jointly. Each sees candidates the others do not \u2014 Logistics knows what will need provisioning and a technical manual; Design knows what is novel; Systems Engineering knows what carries a function; CM knows what will need its own change stream."},
      {h:"Who is responsible", b:"Either the Acquirer or the Supplier may make initial top-level recommendations. But the **Supplier is responsible for the comprehensive recommendation.** An Acquirer list is a starting point, never a completed one, and \u201cthey didn\u2019t ask for it\u201d is not a defence for an item nobody considered."}
    ],2),
    P("The method is top-down decomposition of the product structure. The top tier of candidates normally corresponds to the contract line items and the work breakdown structure \u2014 that is where the money and the deliverables are, so it is where separate management is nearly always warranted. Lower-level candidates are nominated wherever separate management looks warranted, and settled by the screen rather than by argument."),
    P("Gather these before you start: the product structure and the architecture model; the contract, its statement of work and its data requirements, including any Acquirer-directed designations; the hazard analyses and safety-critical item lists; and the supportability planning products."),
    S("Items flagged safety-critical by hazard analysis go into the candidate set and are screened. They are not filtered out beforehand.",
      "Screening produces a record with a rationale. Filtering produces nothing at all \u2014 and a safety-critical item that was never a candidate has no assessment, no rationale, and nothing for System Safety to concur with."),
    C("Candidates are cheap. Missing candidates are not.",[
      "Over-nominating costs one assessment row and a recorded \u201cno.\u201d An item that was never nominated is never screened, never rejected on the record, and invisible at every review that follows \u2014 because reviews look at what was considered, and it was not.",
      "**When you are unsure whether something is a candidate, it is a candidate.** The screen exists to say no."
    ])
  ], check:{
    q:"The Acquirer provides a list of top-level items they expect to be designated. What is your company\u2019s position on the candidate list?",
    o:["The Acquirer\u2019s list defines the candidate set; adding to it invites unnecessary scope",
       "The list is a starting point \u2014 the Supplier remains responsible for the comprehensive recommendation, nominating below and beyond it as separate management is warranted",
       "The list is advisory only and carries no designation weight",
       "The list is adopted for Acquirer-controlled CIs, and no further candidates are considered"],
    a:1,
    why:"Either side may recommend at the top, but responsibility for a complete recommendation sits with the Supplier. The Acquirer\u2019s designations do bind \u2014 an item they designate meets a criterion by that fact alone \u2014 but their list bounds nothing. Everything below it still has to be decomposed, nominated and screened."
  }},

  {id:"M1-11", title:"What makes something a Configuration Item", body:[
    P("A Configuration Item is an item, or aggregation of items, that **satisfies a system end-use function** and is **designated for separate configuration management**. Both halves carry weight."),
    STEPS([
      {h:"Step 1 \u2014 the end-use function gate", b:"Does the item satisfy a system end-use function? If NO: not a CI candidate. Record the rationale, identify the parent CI whose documentation controls it, and stop. Raw materials, bulk commodities and purely structural elements with no defined functional role fail here."},
      {h:"Step 2 \u2014 the criteria screen", b:"Designate as a CI if the item meets or impacts one or more of seven criteria, plus the software rule. One YES is sufficient."}
    ]),
    S("Items that are not CIs are not uncontrolled \u2014 they are controlled within their parent CI\u2019s configuration documentation.",
      "The question is never \u201ccontrolled or not.\u201d It is \u201ccontrolled at what level, with what independence.\u201d"),
    C("Record the rationale for every candidate",[
      "Record the assessment and reasoning for **every candidate**, whether designated or not. This is the step new engineers skip most often, and the one that costs most later.",
      "A list of selected CIs shows an outcome. A candidate list showing what was considered and rejected, and why, shows that judgement was exercised. When the Acquirer asks why a particular assembly is not a CI, \u201cit isn\u2019t on the list\u201d is not an answer."
    ])
  ], check:{
    q:"A titanium billet, specified by material standard, is the stock from which several structural fittings are machined. How is it treated?",
    o:["Designated as a CI because it is critical to structural integrity",
       "Fails the end-use function gate; controlled within the parent CI\u2019s documentation via the material specification",
       "Designated as a CI only if it is sole-source",
       "Left outside configuration control entirely"],
    a:1,
    why:"Raw material satisfies no system end-use function of its own, so it never reaches the criteria screen. It is still controlled \u2014 by the material specification called out on the drawings of the parts made from it, inside the parent CI\u2019s documentation."
  }},

  {id:"M1-12", title:"The criteria screen", body:[
    P("One YES is sufficient. Four is not four times as designated \u2014 but listing all four is worth doing, because each is an independent reason the designation survives if one fact later changes."),
    TABLE(["Ref","Criterion","What it looks like in practice"],[
      ["(a)","Critical to the functioning of the system","The system cannot perform its mission without it. Not \u201cuseful\u201d \u2014 necessary"],
      ["(b)","Failure might cause serious injury, loss of life, or loss of primary system capability","Screen every safety-critical item here. This criterion is a CM floor requirement"],
      ["(c)","Complex or not well known technology, critical to program goals","Novel, immature or specialised technology the program depends on"],
      ["(d)","Under control as designated by the Acquirer","The customer said so. Designation is theirs to make \u2014 not yours to predict"],
      ["(e)","Requires separate type designation, versions or nomenclature","The item needs its own formal name, model number or version identity"],
      ["(f)","Critical or high risk; failure would have significant financial impact","Long lead, sole source, high value, or a failure that stops a line"],
      ["(g)","Requires one or more logistics elements","Provisioning lists, dedicated test equipment, technical manuals, maintenance documentation, tag-out"],
      ["SW","The item is computer software","Designate it as a software CI. A rule, not a judgement"]
    ]),
    P("Programs may add a supplemental screen \u2014 independent end-use function, separate change effectivity address, commonality across systems, interfaces with an existing CI, interchangeability level, separate delivery or installation, separate performance and test requirements, independent testability, configurable state, new or modified design. Check what your program has adopted before you start screening.")
  ], check:{
    q:"A valve is sole-source with a fourteen-month lead time, and the Acquirer has expressed no view on it. Which criterion does the lead time engage?",
    o:["(d) \u2014 under Acquirer control, since they will probably want it designated",
       "(c) \u2014 complex technology",
       "(f) \u2014 critical or high risk, where failure would have significant financial impact",
       "None; lead time is a procurement matter, not a CI criterion"],
    a:2,
    why:"Sole source with a long lead is exactly criterion (f): a failure or an uncontrolled change stops the line for over a year. Criterion (d) applies only where the Acquirer has actually designated the item \u2014 predicting what they will want is not the same as designation."
  }},

  {id:"M1-13", title:"Three standing rules", body:[
    CARDS([
      {h:"Software", b:"Computer software is designated as a software CI. Product-unique identifiers also go to elements of the software development environment that form part of the system \u2014 compilers, linkers, loaders, developmental libraries, configuration settings, automation scripts. If the build cannot be reproduced without it, it needs an identity."},
      {h:"Safety linkage", b:"Any item identified as safety-critical under the safety management system is screened against criterion (b), and usually (a). If a safety-critical item is NOT designated a CI, the rationale requires System Safety concurrence. A CM engineer does not make that call alone."},
      {h:"The CM floor", b:"Criterion (b) is a floor requirement. On safety-significant product lines it is performed regardless of what the contract flows down. Any proposal not to perform it goes through the CM floor gate and is recorded \u2014 never quietly dropped."}
    ],3),
    C("The consequence to hold on to",[
      "Three years from now, a field failure requires you to rebuild the delivered software load and compare it byte-for-byte against what is in the unit. If the compiler version, build settings and library state were never identified \u2014 and the toolchain has since been upgraded \u2014 the load cannot be reproduced.",
      "That means the product baseline cannot be demonstrated, which means the physical configuration audit for that CI was never actually satisfiable."
    ],"teal")
  ], check:{
    q:"A program proposes not to designate a safety-critical actuator as a CI, arguing it is adequately controlled within its parent assembly. What is required?",
    o:["Nothing \u2014 CM may record the rationale and move on",
       "Acquirer approval only",
       "System Safety concurrence on the rationale, with the proposal dispositioned through the CM floor gate and recorded",
       "A design change to remove the safety criticality"],
    a:2,
    why:"Criterion (b) is a CM floor requirement, so a proposal not to perform it goes through the floor gate and is recorded. And a safety-critical item not designated a CI needs System Safety concurrence on the rationale \u2014 CM does not make that call alone."
  }},

  {id:"M1-14", title:"Worked examples \u2014 is it a CI?", body:[
    P("Two steps, in order, every time: the end-use function gate, then the criteria screen. Most of the difficulty in practice is not the rule. It is being honest about which step an item actually fails."),
    TABLE(["Candidate item","How it screens","Verdict"],[
      ["Hydraulic reservoir assembly storing and conditioning fluid for the flight control system","Passes the gate \u2014 it performs a defined system function. Meets (a): the system cannot operate without it. Also (g): provisioning and maintenance documentation","**CI.** Designate, and list both criteria"],
      ["A structural fastener, one of eleven thousand, called out by specification on the assembly drawing","Fails the gate \u2014 no system end-use function of its own","**Not a CI.** Controlled by the specification called out in the parent CI\u2019s documentation"],
      ["The operational flight program running on the flight control computer","Computer software. A rule, not a judgement \u2014 it does not need a criterion","**CI.** Designate as a software CI"],
      ["Cabin sidewall trim panel \u2014 cosmetic, no load path, no functional role","Fails the gate","**Not a CI.** Controlled within the parent CI\u2019s documentation"],
      ["A commercially procured inertial measurement unit embedded in the navigation subsystem","Passes the gate. Meets (a), and (e) \u2014 it carries its own version identity \u2014 and (g)","**CI.** Who designed it and who owns it are not criteria"],
      ["Landing gear uplock actuator whose failure can prevent gear extension","Passes the gate. Meets (b) squarely, and almost certainly (a)","**CI.** And (b) is a floor requirement \u2014 non-designation would need System Safety concurrence and a floor gate disposition"],
      ["Ground support test set delivered under the contract, with its own type designation and technical manual","Passes the gate \u2014 support equipment performs a defined function for the system. Meets (e) and (g)","**CI.** Support equipment is screened on the same terms as flight hardware"],
      ["A wiring harness between two CIs, procured to a company drawing","Passes the gate \u2014 it carries defined signal and power interfaces. Whether to designate turns on the screen: separate provisioning and maintenance action (g)? Long lead or sole source (f)?","**Judgement.** Screen it honestly and record the rationale either way"]
    ]),
    P("Two worked questions, walked the way you should walk them out loud:"),
    STEPS([
      {h:"A valve the Acquirer has placed on their designated CI list \u2014 which your team thinks is too small to warrant it", b:"Gate: it performs a defined function, so it passes. Screen: criterion (d) is met the moment the Acquirer designates it. Nothing else needs to apply. **Designate.** The judgement about whether it \u2018warrants\u2019 designation is not yours to make for an Acquirer-controlled item \u2014 final designation authority there rests with them. Record the criterion as (d) and move on."},
      {h:"A battery pack that is not critical to the mission, is not safety-critical, and is neither novel nor high value \u2014 but requires danger tag-out and a dedicated maintenance procedure", b:"Gate: passes. Screen: (a) no. (b) no. (c) no. (f) no. (g) **yes** \u2014 it requires logistics elements. **Designate.** One YES is sufficient, and the logistics criterion is the one newcomers most often forget to look at, because it has nothing to do with how impressive the item is."}
    ]),
    C("Two errors to watch for in yourself",[
      "**Failing an item at the gate because you would rather not designate it.** The gate asks one question \u2014 does this satisfy a system end-use function \u2014 and \u201cthat would be inconvenient\u201d is not an answer to it. If an item passes the gate and no criterion applies, say exactly that. The screen is where a defensible no comes from.",
      "**Passing an item at the screen because it feels important.** Importance is not a criterion. Name the criterion, or do not designate."
    ])
  ], check:{
    q:"A program declines to designate an item, reasoning that it is a commercial part bought to a vendor\u2019s part number and that the company holds no design authority over it. Is the reasoning sound?",
    o:["Yes \u2014 items the company does not design are controlled by the vendor rather than designated",
       "Yes, provided the vendor is a qualified source",
       "No \u2014 design ownership is not among the criteria; the item is screened on the same terms as anything else",
       "No \u2014 commercial items are always designated"],
    a:2,
    why:"The gate asks about end-use function and the screen asks about the seven criteria. Neither asks who drew it. A commercial item can easily meet (e) for its own version identity, (g) for provisioning, or (f) where it is sole-source \u2014 and buying it rather than designing it changes none of that. \u201cAlways designated\u201d is equally wrong: it still has to meet something."
  }},

  {id:"M1-15", title:"The selection assessment record", body:[
    P("You have now been told several times to record the rationale for every candidate. Here is the artifact that instruction refers to. One assessment per candidate, and it is short."),
    TABLE(["What it carries","Why that field is there"],[
      ["The candidate item, and the part or model reference it is known by today","So the assessment can be found again by someone who knows the item under a different name than you did"],
      ["The assessor and the date","So a later reader knows who judged it and what was known at the time. Assessments made before a hazard analysis existed read differently from ones made after"],
      ["The end-use function gate result","The two steps are separate, and a reader needs to know which step an item failed. Failing the gate and failing the screen are different facts about an item"],
      ["Each criterion, with a yes or no and the rationale for that answer","Not just the ones that were met. A recorded \u201cno\u201d against the logistics criterion is a claim someone made and can be challenged"],
      ["The software rule where it applies, and the safety linkage","Including System Safety concurrence where a safety-critical item is not designated \u2014 the concurrence lives with the assessment, not in somebody\u2019s inbox"],
      ["The disposition, and where the parent\u2019s documentation controls the item if it is not designated","A rejected candidate is not released into the wild. The assessment names what does control it"]
    ]),
    S("A \u201cno\u201d with a reason is a decision. A \u201cno\u201d with no record is indistinguishable from never having looked.",
      "This is the difference the Acquirer is testing when they ask why a particular assembly is not a CI \u2014 and the answer they are hoping not to hear is that it simply is not on the list."),
    P("Assessments are retained for the program life alongside the rest of the identification records, and they are **re-run on trigger rather than replaced.** Design evolution, a new hazard analysis, an Acquirer designation, a change in the supportability strategy \u2014 each re-opens the question for the affected candidates. The retained record is what the next assessment starts from, so the work is a re-evaluation rather than a fresh guess by whoever holds the job that year."),
    C("What a usable rationale looks like",[
      "**Weak:** \u201cN/A.\u201d \u201cNot required.\u201d \u201cToo small.\u201d None of these can be checked, and none tells the next person anything.",
      "**Usable:** \u201cNot designated \u2014 fails the end-use function gate, no independent function; controlled by the material specification called out on the parent CI\u2019s drawings.\u201d \u201cDesignated \u2014 criterion (b), hazard analysis rates failure as capable of causing loss of primary system capability; also (g), dedicated depot test set and technical manual.\u201d"
    ])
  ], check:{
    q:"Why does the assessment record carry the assessor and date, and why is it retained rather than overwritten when the assessment is re-run on trigger?",
    o:["For audit traceability only \u2014 the content of a superseded assessment has no further use",
       "Because personnel changes require reassignment of the record",
       "Because a later reader needs to know what was known at the time, and because the retained assessment is what the re-run starts from rather than a fresh guess",
       "Because the Acquirer requires a complete revision history of every selection decision"],
    a:2,
    why:"Selection is iterative, so assessments accumulate rather than replace one another. Knowing an item was screened before the hazard analysis existed explains an answer that would otherwise look careless \u2014 and the previous rationale is the most useful input the next assessor has."
  }},

  {id:"M1-16", title:"Dividing software into CIs", body:[
    P("That software is designated as a CI is a rule. **How much software constitutes one CI is a judgement** \u2014 and the training so far has given you no way to make it, because every worked example has been hardware."),
    P("A software CI is an aggregate of software that satisfies an end-use function and is designated for purposes of specification, interfacing, qualification testing and configuration management. It is composed of one or more software units \u2014 source code, object code, control code, control data, or a collection of these. Read that definition closely and the questions fall out of it, and they are the familiar ones:"),
    L(["Does this aggregate satisfy an **end-use function** of its own, or is it a part of something else\u2019s function?",
       "Will it be **specified** separately \u2014 does it get its own requirements document?",
       "Does it have **interfaces** of its own that need defining and controlling?",
       "Will it be **qualification tested** as a unit, against its own requirements?",
       "Does it need its own **version identity and change effectivity** \u2014 will it be re-versioned and fielded on its own schedule?"]),
    CARDS([
      {h:"Divided too coarsely", b:"One software CI for an entire load. Every correction to any part re-versions the whole thing, so the version identifier stops telling anyone what actually changed. The qualification scope for a display string change is the entire load. And the effectivity address is shared, so nothing can be fielded independently of anything else."},
      {h:"Divided too finely", b:"Dozens of software CIs, each carrying a specification, a version identity, a qualification basis and its own interfaces. The integration burden is real and the version matrix \u2014 which build of each is compatible with which build of the others \u2014 becomes a management product in its own right."}
    ],2),
    S("The same failure directions as hardware, for the same reason: the CI is the unit of separate management, and separate management has a cost in both directions.",
      "If a piece of software will be specified, tested, versioned and fielded on its own, it is its own CI. If it travels with its neighbours in all four, it is a unit within theirs."),
    P("Two rules sit alongside the judgement. **Elements of the software development environment that form part of the system get product-unique identifiers** \u2014 compilers, linkers, loaders, developmental libraries, configuration settings, automation scripts. They are identified not because they satisfy an end-use function but because the build cannot be reproduced without them. And **firmware follows the arrangement, not the technology:** where the code and its device are controlled together on a single altered item drawing, one part number represents the device with the code in it; where they are controlled separately, the code is its own software CI with its own version identifiers.")
  ], check:{
    q:"A flight display application and the control laws it renders are written by one team, run on one processor, and are loaded as a single image. Each is separately specified, separately qualification tested against its own requirements, and re-versioned on its own schedule. One software CI or two?",
    o:["One \u2014 they share a processor and are delivered as a single load",
       "One, with the control laws recorded as a unit within it",
       "Two \u2014 separate specification, separate qualification and separate version and effectivity needs are exactly what designates separately",
       "Two, but only if the control laws are safety-critical"],
    a:2,
    why:"Sharing a processor and a load image is a packaging fact, not a management one \u2014 in the same way that sharing an interface control document does not make two hardware items one CI. Separate specification, separate qualification basis and independent re-versioning are three of the questions that define a software CI, and here all three point the same way."
  }},

  {id:"M1-17", title:"Selecting at the right level", body:[
    P("Select CIs at the level optimum for **both acquisition and support** \u2014 the level at which items are specified, contracted, accepted, and at which logistics organises and reports maintenance and modification actions. Both failure directions are real and both are expensive."),
    CARDS([
      {h:"Over-designation", b:"Hundreds of CIs at fastener and bracket level. Every trivial change becomes formal change traffic against its own CI. Board time consumed by triviality, real changes queued behind noise, status accounting nobody reads. Control degrades because there is too much of it."},
      {h:"Under-designation", b:"Whole subsystems buried inside one CI. Changes to distinct functions share one effectivity address, so they cannot be cut in independently. Hazard traceability stops above the item that causes the hazard. Logistics cannot report maintenance at the level it is performed."}
    ],2),
    C("A useful test when you are unsure",[
      "**Will a change to this item routinely need to be dispositioned, tracked and cut into service independently of its neighbours?**",
      "If yes, it needs its own effectivity address \u2014 one of the main reasons separate CIs exist. If changes will normally travel with the parent, it does not."
    ])
  ], check:{
    q:"A program has 340 CIs, most at individual bracket and connector level. What is the practical consequence?",
    o:["Excellent visibility and control, at some administrative cost",
       "Unmanageable change traffic, with real changes queued behind trivial ones \u2014 control degrades because there is too much of it",
       "A compliance finding, but no operational effect",
       "Reduced audit scope, since each CI is small"],
    a:1,
    why:"Over-designation is not over-control; it is a different kind of loss of control. Board time goes to triviality, status accounting stops being read, and genuine changes wait behind noise."
  }},

  {id:"M1-18", title:"The CI structure", body:[
    P("Selection produces a set of CIs. Structure puts them in an order \u2014 and the order does real work, because it is what defines the parents, the boundaries and the reporting lines everything downstream uses."),
    P("A product structure is built by decomposing the system into its levels of assembly. The conventional five, top to bottom:"),
    STEPS([
      {h:"System or end item", b:"The final combination of end products, component parts, software and materials, ready for its intended use."},
      {h:"Subsystem", b:"A combination of assemblies performing an operational function within the system \u2014 a major subdivision of it."},
      {h:"Assembly", b:"Parts or subassemblies joined to perform a specific function, and capable of disassembly."},
      {h:"Subassembly", b:"Two or more parts forming a portion of an assembly, replaceable as a whole but with individually replaceable parts."},
      {h:"Part", b:"One piece, or pieces joined so that they are not normally taken apart without destroying their designed use."}
    ],"tl"),
    S("CIs may be designated at any level of assembly.",
      "The levels describe the product. They do not tell you where the CIs go \u2014 that is the selection judgement of the previous section. What they give you is a shared vocabulary for arguing about it."),
    P("For each CI, record its parent, its children, and the owning design activity. Then two designations that decide who is in charge of what:"),
    CARDS([
      {h:"Acquirer-controlled", b:"The CIs the Acquirer specifies, baselines and controls. Their designation is the Acquirer\u2019s to make, their product baseline is the Acquirer\u2019s to establish, and changes to them run to the Acquirer\u2019s approval authority."},
      {h:"Supplier-controlled", b:"Below the Acquirer-controlled level, **the Supplier determines** which items to place under internal configuration management and what documentation types to use. This is not a gap in control \u2014 it is control exercised by your company, on its own authority, against the same criteria."},
      {h:"Sub-tier developed", b:"An item developed by a sub-supplier is a CI **from your company\u2019s point of view**, and equivalent CM requirements are flowed down to the organisation that builds it. That sentence is the entire premise of Module 2."}
    ],3),
    P("Each CI also carries a **type** \u2014 hardware, software, or firmware. The first two are what they sound like. Firmware is the case where code and the device it lives in are managed as one thing, and it is worth flagging in the index precisely because it is the type people forget has two natures."),
    C("Where everything that is not a CI lives",[
      "Every part sits somewhere in the product structure. Not everything in the product structure is a CI \u2014 and the items that are not are controlled within their parent CI\u2019s configuration documentation.",
      "**Which is why a rejected candidate has to name its parent.** \u201cNot a CI\u201d is only half an answer. The other half is which CI\u2019s documentation controls it, and an assessment that stops at the first half has left the item genuinely uncontrolled rather than controlled elsewhere."
    ])
  ], check:{
    q:"An assembly sits two levels below the lowest Acquirer-controlled CI. Who decides whether it is placed under configuration management, and against what?",
    o:["Nobody \u2014 below the Acquirer-controlled level, items are controlled only by the drawings that define them",
       "The Acquirer, since all designation authority is theirs",
       "The Supplier, applying the same criteria and determining the documentation types to use",
       "The sub-supplier who builds it, under their own CM system"],
    a:2,
    why:"Below the Acquirer-controlled level the Supplier determines which items to place under internal configuration management and what documentation types apply. The authority changes hands; the criteria and the discipline do not. And where the item is developed by a sub-supplier, it is a CI from your company\u2019s point of view with equivalent requirements flowed down \u2014 not a matter left to their own system."
  }},

  {id:"M1-19", title:"The nine activities", body:[
    P("The process is **iterative, not sequential-once**. Selection begins early \u2014 typically before or at the system functional and requirements reviews \u2014 and is revisited as the design matures and at every baseline establishment."),
    TABLE(["#","Activity","Principal output"],[
      ["1","Candidate CI identification","Candidate list; the decomposition basis for the CI structure"],
      ["2","Application of selection criteria","Assessments with rationale for every candidate; selected-CI determinations"],
      ["3","CI structure and hierarchy","Parent/child and owning design activity; Acquirer- vs Supplier-controlled designation"],
      ["4","Interface identification and recording","Interface register; coverage verification; signed no-interface determinations"],
      ["5","Acquirer review and concurrence","Submittal; concurrence or direction records; concurred CI list"],
      ["6","Identifier assignment","PINs, unit identifiers, nomenclature, software versions, document identifiers"],
      ["7","Configuration documentation determination","Documentation type recorded against each CI"],
      ["8","Baseline establishment","FBL, ABL, PBL per CI with approved change status"],
      ["9","Maintenance and iteration","Updated index, register and submittals; status accounting records of every change"]
    ]),
    C("Where modelling is used, the CI structure mirrors the model",[
      "The CI hierarchy and the architecture model are **two views of one decomposition, and shall not diverge.** Preferred schemes are the ATA chapter scheme or the S1000D standard numbering system, in SysML or UAF conventions. Where no model exists, the CI structure follows the engineering product structure.",
      "This is not a formality. A CI structure that has drifted from the model means two authoritative decompositions of one product \u2014 and the moment they disagree, nobody can say which is right."
    ],"teal"),
    P("**Re-evaluate on trigger:** design evolution introducing new items, functions or interfaces; changes to the architecture decomposition; new or revised hazard analyses; changes to supportability strategy or procurement decisions; contract changes including Acquirer designation or de-designation; and non-interchangeable modifications requiring a PIN change.")
  ], check:{
    q:"A program\u2019s CI index is organised by the contract work breakdown structure, while its architecture model decomposes the system by ATA chapter. What is the problem?",
    o:["None \u2014 the two serve different purposes and may legitimately differ",
       "The WBS is the wrong basis for any CI structure",
