       "Two authoritative decompositions of one product exist; when they disagree, nobody can say which is right",
       "The model should be rebuilt to match the contract"],
    a:2,
    why:"Where modelling is used the CI structure mirrors the model \u2014 they are two views of one decomposition. Divergence makes every subsequent structural decision contestable. The fix is realignment by CM and Systems Engineering jointly, not a unilateral change to either."
  }},

  {id:"M1-20", title:"When the work happens", body:[
    P("The activities are iterative, but they are not evenly spread across a program. Each has a normal moment, and each has something that must already exist by the time it arrives."),
    STEPS([
      {h:"System requirements and functional reviews", b:"Candidate identification and the first pass of selection. The **functional baseline** is established at or after the system functional review, documented by the functional configuration documentation. The proposed CI list goes to the Acquirer for review and concurrence around here \u2014 and interface coverage is verified at that submittal."},
      {h:"Preliminary design review, per CI", b:"The **allocated baseline** for a CI is established at or after its preliminary design review. Which means the allocated documentation for that CI \u2014 its allocated requirements, its interfaces with the CIs it touches, and its verifications \u2014 must exist and be approved by then. A CI still under debate at its own preliminary design review has a baseline problem, not a paperwork problem."},
      {h:"Critical design review", b:"The **product baseline** is initially established at completion of critical design review, on the released detailed design definition."},
      {h:"First production unit delivery, or physical configuration audit", b:"The product baseline is formalised no later than this point \u2014 and where the Acquirer establishes it, they do so on successful completion of the physical audit and approval of the product specification."},
      {h:"Throughout, and afterwards", b:"Re-evaluation on every trigger. Resubmittal to the Acquirer on every iteration. Interface coverage verified at CI-list submittal, at each technical review, and before each baseline establishment. Identification does not finish; it is maintained."}
    ],"tl"),
    S("Selection that starts at critical design review is not selection.",
      "It is documentation of whatever happened to be built. By then the structure, the interfaces, the effectivity addresses and the audit scope have all been decided by default \u2014 and every one of them will be expensive to undo."),
    C("What is fixed and what is not",[
      "These are the normal points, and a contract can move them. What does not move is the **dependency order**: you cannot allocate requirements to a CI you have not selected, cannot baseline documentation that has not been released, and cannot audit against a baseline that was never established.",
      "So when a program compresses its schedule, the question to ask is not which review slipped. It is which dependency the compression assumes away."
    ])
  ], check:{
    q:"A CI is approaching its preliminary design review. What must exist and be approved by that point?",
    o:["Its detailed design definition, since the product baseline follows immediately",
       "Its allocated configuration documentation \u2014 the requirements allocated to it, its interface requirements, and its verifications \u2014 because the allocated baseline is established at or after that review",
       "Only the system specification; CI-level documentation follows critical design review",
       "Its selection assessment, and nothing further until critical design review"],
    a:1,
    why:"The allocated baseline is established at or after a CI\u2019s preliminary design review, and a baseline is made of its documentation \u2014 so the allocated set has to be there and approved. The detailed design belongs to critical design review and the product baseline; the selection assessment should have been done considerably earlier."
  }},

  {id:"M1-21", title:"Where the model is the decomposition", body:[
    P("On a program using model-based systems engineering, the CI structure does not get to be its own idea. The CI parent-and-child hierarchy mirrors the decomposition method of the architecture model, because the two are one decomposition seen twice."),
    CARDS([
      {h:"The preferred schemes", b:"Decomposition by ATA chapter, or by the standard numbering system used across the technical data suite, implemented in the program\u2019s modelling conventions. Each CI carries the corresponding chapter or numbering reference as an attribute in the index \u2014 so the CI structure and the technical data agree about where an item sits."},
      {h:"When the model uses something else", b:"Functional thread, zonal, work-breakdown-based: the CI structure mirrors **that** method. The rule is not \u201cuse the preferred scheme.\u201d It is \u201cdo not maintain a second, independent decomposition.\u201d Record the mapping convention, and note any contract-driven exception \u2014 an Acquirer-directed CI level, say \u2014 explicitly in the index."},
      {h:"When there is no model", b:"The CI structure follows the engineering product structure, the bill of material hierarchy. There is still exactly one decomposition. It simply lives somewhere other than a model."}
    ],3),
    P("Alignment is not a one-time reconciliation you perform and then trust. Four practices keep it true:"),
    L(["**Cross-reference in both directions.** The model element identifier recorded against the CI in the index, and the CI identifier carried as a property of the model element. A one-directional link rots silently \u2014 you discover it when something at the far end has already been deleted or renamed.",
       "**Treat model decomposition changes as triggers.** A change to how the model decomposes the system re-opens CI structure selection. Once the structure is baselined, structural changes are processed through formal change action like anything else.",
       "**Verify alignment at each technical review and before each baseline establishment.** Every Acquirer-controlled CI resolves to a model element, and every model element at the CI-designation level has actually been screened against the criteria \u2014 not assumed to have been.",
       "**Run the interface check both ways.** Every interface element in the model resolves to a register row, and every register row to a model element."]),
    S("A verdict that does not match the model is held, not recorded.",
      "Where a same-CI-or-separate decision disagrees with the model, it goes to Systems Engineering for model disposition before it enters the index. Recording it anyway is exactly how two decompositions begin to drift \u2014 one entry at a time, each perfectly defensible on its own."),
    C("Why this is a CM problem, not a modelling preference",[
      "Two authoritative decompositions of one product is not an untidiness. Every structural question afterwards \u2014 which CI is the parent, which pair of items forms a boundary, which effectivity address a change belongs to \u2014 now has two answers and no principled way to choose between them.",
      "**And the fix is never unilateral.** CM does not re-cut the model, and Systems Engineering does not re-cut the CI index. Realignment is done jointly and recorded, because whichever one you quietly edited, you have just created the divergence you were trying to close."
    ],"teal")
  ], check:{
    q:"A program\u2019s architecture model decomposes the system by functional thread rather than by either preferred scheme. What does the CI structure do?",
    o:["Follows a preferred scheme, since that is the standard the technical data uses",
       "Mirrors the functional thread decomposition, with the mapping convention recorded \u2014 the obligation is one decomposition, not one particular scheme",
       "Follows the engineering product structure instead, as a neutral basis both sides can accept",
       "Is held until the model is rebuilt to a preferred scheme"],
    a:1,
    why:"The preference is real but it is a preference. The obligation is that the CI structure and the model remain one decomposition. Mirroring a non-preferred scheme satisfies it; building a preferred-scheme CI structure alongside a functional-thread model creates precisely the divergence the rule exists to prevent. The product structure is the fallback for programs with no model at all, not a neutral third option."
  }},

  {id:"M1-22", title:"Interfaces \u2014 coverage, not content", body:[
    P("This is where CM engineers most often misunderstand their own role."),
    CARDS([
      {h:"Systems Engineering does", b:"Identifies internal interface requirements between CIs and external interfaces with other systems, facilities and support equipment. Signs the no-interface determinations. Verifies technical adequacy through the technical review process."},
      {h:"CM does", b:"Records the identification in the register. Verifies coverage. Controls the interface documentation products \u2014 identifiers, release, inclusion in the documentation determination. Confirms a representative is designated where an interface control working group exists."}
    ],2),
    P("The CI structure defines a **finite** set of boundaries: every pair of interfacing sibling CIs, every boundary to an external system, and every boundary between Acquirer-controlled and Supplier-controlled levels. Because the set is finite, coverage is checkable \u2014 which is the whole reason the register is keyed to the structure."),
    S("Where a boundary has no interface, the register records an explicit no-interface determination signed by Systems Engineering.",
      "A blank cell is indistinguishable from an oversight. A signed determination is a decision with an owner."),
    P("Verify coverage at three points: at CI-list submittal for Acquirer concurrence, at each technical review, and before each baseline establishment. Where modelling is used, add the two-way check that every model interface element resolves to a register row and every row to a model element."),
    C("The interface control working group",[
      "Where an interface crosses organisations \u2014 between two suppliers, or between the system and another system \u2014 the Acquirer may run a working group to control it. Where one exists, a representative is provided, and the representative is **empowered to commit** your company to specific interface actions and agreements.",
      "The role carries real obligations: provide the agreed draft interface documentation the specified period before the meeting; update, release, control and re-release the interface documentation reflecting the group\u2019s decisions; and distribute the released documentation to the other participants. CM confirms the representative is designated and records which interfaces are working-group controlled.",
      "**A representative who cannot commit is an observer** \u2014 and the group will settle the interface without your company\u2019s position in it."
    ],"teal")
  ], check:{
    q:"Systems Engineering asks you to confirm that the interface requirements between two CIs are technically adequate. What do you do?",
    o:["Confirm it, since CM maintains the interface register",
       "Decline, and offer instead the coverage status, the documentation identified against that boundary, and its controlling baseline",
       "Confirm it after reviewing the interface control document",
       "Refer them to the Acquirer"],
    a:1,
    why:"CM verifies coverage, not adequacy. Accepting would put CM outside its competence and \u2014 worse \u2014 create a record suggesting interface content had been reviewed when it had not. Offer what CM actually holds."
  }},

  {id:"M1-23", title:"Determining the documentation, and the records you keep", body:[
    P("For each CI, determine the documentation that defines its performance, functional, and physical attributes \u2014 interfaces included. This is not a filing decision. The documentation type follows three facts about the item: its maturity, who owns the design, and the level at which it is controlled."),
    CARDS([
      {h:"Performance specifications", b:"For Acquirer-controlled items on performance-based contracts: what the item must do and how that is verified, leaving the design solution to the Supplier."},
      {h:"Detail definition", b:"Detail specifications, drawings, and models where design disclosure is required \u2014 the full description of the design solution itself."},
      {h:"Commercial and privately developed items", b:"Commercial item descriptions or form-fit-function data \u2014 enough definition to procure, apply, and replace the item without owning its design."}
    ],3),
    P("The interface information identified against each boundary is incorporated into the determined documentation \u2014 in the applicable specifications directly, or through referenced interface documentation. An interface defined nowhere in the documentation set is an interface the baseline does not control."),
    P("The whole identification effort then lives in two records \u2014 and their structure is where most of this module\u2019s rules become visible. A well-formed CI index row carries:"),
    L(["The hierarchy level, the CI identifier, and the parent \u2014 the structure, expressed consistently three ways.",
       "Nomenclature, the CI type \u2014 hardware, software, or firmware \u2014 and the Acquirer- or Supplier-control designation.",
       "The owning design activity and its enterprise code, the PIN, and the specification reference.",
       "The safety-critical flag with its hazard reference \u2014 the product-level binding of the hazard log.",
       "Baseline status per baseline, audit designation status, and the item\u2019s status."]),
    S("De-designated rows are retained, never deleted \u2014 and where one CI carries several part-number variants, the CI-to-PIN variant mapping is recorded in full.",
      "An index that shows only the current answer cannot show that judgement was exercised. And every change and record made under the old designation still points at that identifier \u2014 delete the row and they point at nothing."),
    P("The interface register is the second record, and its one structural decision does most of the work: **rows are boundaries, not documents.** Each row carries the boundary type \u2014 internal CI-to-CI, external, or a control-level boundary between Acquirer- and Supplier-controlled tiers \u2014 and then either the defining documentation with its revision, or the signed no-interface determination. Then: the controlling baseline \u2014 system-boundary interfaces belong to the functional baseline through the system specification, CI-to-CI interfaces to the allocated baseline through the item specifications \u2014 the control authority, the safety-related flag with its hazard control reference, variant applicability per part-number variant, and, where modelling is used, the model element identifier."),
    C("Why boundaries and not documents",[
      "One interface control document may appear on several boundary rows, and one boundary may cite several documents. A register keyed to documents can list everything it has and still not show what is missing. The boundary set is finite and derived from the CI structure \u2014 so a boundary-keyed register can be checked for coverage, which is the register\u2019s whole point."
    ],"teal")
  ], check:{
    q:"A CI is de-designated after the Acquirer concurs it no longer warrants separate control. What happens to its row in the CI index?",
    o:["Deleted \u2014 the index reflects the current CI set",
       "Moved to an archive file outside the index",
       "Retained, with the status changed to de-designated",
       "Retained only if the CI was safety-critical"],
    a:2,
    why:"Designation history is part of the traceability record. Changes, status entries, and audit results made while the item was a CI all reference that identifier \u2014 deleting or exporting the row orphans them. The status field exists precisely so the index can hold the full history and still answer \u201cwhat is a CI today?\u201d with a filter."
  }},

  {id:"M1-24", title:"Acquirer concurrence", body:[
    S("Potential CIs must be selected AND submitted for Acquirer review and selection concurrence.",
      "A program that has selected excellent CIs and never submitted them is non-compliant."),
    P("Read the underlying requirement carefully: it requires potential CIs to be selected **and submitted** for Acquirer review and concurrence. Selection alone does not satisfy it."),
    L(["**Submit** the proposed CI list \u2014 candidates, selection results and rationale \u2014 for Acquirer review and concurrence.",
       "**Resubmit** when the design evolves, when new candidates emerge, and when designated CIs are proposed for de-designation.",
       "**Remember** that final designation authority for Acquirer-controlled CIs rests with the Acquirer. Selection is iterative, so concurrence is too."]),
    P("Below the Acquirer-controlled level, the Supplier determines which items to place under internal configuration management and what documentation types to use. Subcontractor-developed items are CIs from the Supplier\u2019s point of view, and equivalent CM requirements are flowed to the subcontractor \u2014 which is where Module 2 begins.")
  ], check:{
    q:"A program has applied the criteria carefully, recorded rationale for every candidate, and produced a well-structured CI index. It has never submitted the list to the Acquirer. Where does it stand?",
    o:["Compliant, since the requirement is about selection quality",
       "Compliant, provided the list is delivered at the next design review",
       "Non-compliant \u2014 the requirement is to select AND submit for review and concurrence",
       "Compliant for Supplier-controlled CIs only"],
    a:2,
    why:"Selection alone does not satisfy the requirement. Treat submittal as part of selection rather than a follow-on task \u2014 and resubmit on every iteration, because designation authority for Acquirer-controlled CIs is not yours."
  }},

  {id:"M1-25", title:"Same CI or separate CIs \u2014 the principle", body:[
    P("Two or more items carry different part numbers and look closely related \u2014 same function, same subsystem, same vendor. Do they share one CI identifier with part-number variants, or get designated separately? This is the most common judgement call you will be asked to make."),
    S("The CI identifier follows function and the management need for separate control. The PIN follows form, fit and function.",
      "They answer different questions and are decoupled on purpose."),
    CARDS([
      {h:"Multiple PINs under one CI", b:"Variants of one managed function that are not interchangeable with each other \u2014 different interface details, say \u2014 but share one specification basis, one verification basis, and common change effectivity. Example: three variants of one valve, tabulated in a single specification, changed as a family."},
      {h:"One PIN under multiple CIs", b:"The same physical item instantiated in subsystems performing distinct functions. Example: one antenna part number installed once in the UHF subsystem and once in MIDS JTRS \u2014 one PIN, two CIs. Each satisfies a different end-use function, sits in a different branch of the hierarchy, and needs its own effectivity address, hazard traceability and logistics reporting."}
    ],2),
    C("The thing to remember",[
      "Neither \u201cthey have different part numbers\u201d nor \u201cthey are the same part number\u201d decides the CI question. **Do not designate CIs to solve a part-numbering problem** \u2014 the PINs already capture non-interchangeability."
    ])
  ], check:{
    q:"One cooling fan part number is installed in the mission computer for processor thermal management, and in the environmental control unit as part of cabin air recirculation. How many CIs and how many PINs?",
    o:["One CI, one PIN \u2014 it is the same hardware",
       "Two CIs, two PINs \u2014 records should match",
       "Two CIs, one PIN \u2014 different end-use functions, different branches, different effectivity addresses; but one design definition",
       "One CI, two PINs \u2014 the installations differ"],
    a:2,
    why:"Different end-use functions and different parents drive separate CIs, and the two installations need independent effectivity addresses. Nothing about that creates a non-interchangeable condition, so the PIN does not split. Creating a second part number to \u201cmake the records match\u201d is designating identity to solve a bookkeeping discomfort."
  }},

  {id:"M1-26", title:"The gates, and four cautions", body:[
    P("Apply the gates in order, comparing the candidate items against each other. Any single separation trigger is sufficient \u2014 the gates are a logical OR."),
    TABLE(["Gate","Question","Trigger \u2192 result"],[
      ["G0","Does each item satisfy a system end-use function?","NO \u2192 not CI candidates. Control within the parent CI. Stop"],
      ["G1","Do the items warrant CI designation at all?","NO \u2192 parts, not CIs. The PINs already capture the differences. Stop"],
      ["G2","Same end-use function?","NO \u2192 separate CIs"],
      ["G3","Same parent in the CI hierarchy? (answer from the model where used)","NO \u2192 separate CIs"],
      ["G4","Is ANY of the items safety-critical?","YES \u2192 separate CIs"],
      ["G5","Can one specification define performance AND interfaces for all variants?","NO \u2192 separate CIs"],
      ["G6","Same verification requirements and verification plan?","NO \u2192 separate CIs"],
      ["G7","Will changes routinely need a separate effectivity address?","YES \u2192 separate CIs"],
      ["G8","Does Acquirer direction, nomenclature or logistics force separation?","YES \u2192 separate. NO \u2192 one CI, multiple PN variants"],
      ["G9 / G10","Where modelling is used: does the verdict match the model?","NO \u2192 hold and route to Systems Engineering. YES \u2192 record"]
    ]),
    CARDS([
      {h:"G4 \u2014 safety separates on ANY item, not all", b:"A safety-critical variant sharing a CI with a non-critical one either forces the whole CI to inherit safety obligations, or blurs hazard-to-CI traceability. Both are worse than a second CI number. If all are safety-critical, they are also separated \u2014 each needs distinct hazard traceability."},
      {h:"G5 \u2014 the ICD caution", b:"Appearing on the same interface control document is NOT evidence of a common interface. If the document distinctly calls out separate interfaces for each item, analyse it. Distinct callouts usually mean different mating definitions and different interface change traffic."},
      {h:"G6 \u2014 verification is usually the deciding fact", b:"One qualification and acceptance basis must cover all variants. If the verification picture is unknown \u2014 common early \u2014 obtain it before deciding. Deciding without it means deciding twice."},
      {h:"G7 \u2014 effectivity is the day-to-day discriminator", b:"If a change to one variant must routinely be dispositioned, tracked and cut in independently, each variant needs its own effectivity address. If changes travel across the family, one CI suffices."}
    ],2),
    C("Recording a separate-CI verdict",[
      "Splitting a CI creates new boundaries, and they do not register themselves. On any separate-CI verdict, verify that **every pairwise boundary between the new sibling CIs** appears in the interface register or carries a signed no-interface determination."
    ])
  ], check:{
    q:"Three relays share a function and a parent, none is safety-critical, and their interfaces are described as \u201cslightly different.\u201d Verification requirements have not yet been established. What is the correct next step?",
    o:["Designate one CI with three part-number variants \u2014 nothing has triggered separation",
       "Designate three separate CIs, because the interfaces differ",
       "Obtain the verification answer before deciding; it is the open deciding fact, and analyse whether one specification can define interfaces for all three",
       "Escalate to the Acquirer for direction"],
    a:2,
    why:"G6 is frequently where the decision actually turns, and G5\u2019s ICD caution applies squarely to \u201cslightly different interfaces.\u201d Recognising that you cannot yet decide \u2014 and naming the fact you need \u2014 is the correct answer here."
  }}
,

  {id:"M1-27", title:"Worked examples \u2014 same CI or separate?", body:[
    P("Three walks through the gates. Notice in each how few gates actually do any work \u2014 the verdict nearly always turns on one, and your job is to find which."),
    STEPS([
      {h:"Two fuel pump variants, one safety-critical", b:"Same end-use function, same parent, and one specification could comfortably define both. Same verification basis. But hazard analysis classifies failure of the high-pressure variant as capable of causing loss of primary system capability, and the low-pressure variant\u2019s as not. **G4 triggers on ANY item being safety-critical, not all of them. Separate CIs.** Sharing one identifier would either force the non-critical variant to inherit the safety obligations, or blur hazard-to-CI traceability. Both are worse than a second CI number."},
      {h:"Two power distribution unit variants differing in input voltage", b:"Same function, same parent, neither safety-critical. One tabulated specification defines performance and interfaces for both. One qualification and acceptance basis covers both. Changes travel across the family and cut in together. Nothing triggers. **One CI, two part-number variants** \u2014 with the variant mapping recorded and the interface callouts tabulated per variant."},
      {h:"One antenna part number installed in two subsystems", b:"The reverse case, and the one that trips people. The same physical item is installed once in the communications subsystem and once in the navigation subsystem. G2: different end-use functions \u2014 separate. G3: different parents \u2014 separate again. **Two CIs, one part number.** Nothing here creates a non-interchangeable condition, so the part number does not split. Two CI identifiers, one design definition, and no second part number invented to make the records look symmetrical."}
    ],"tl"),
    P("Five shorter ones, with the gate that decides each:"),
    TABLE(["Scenario","Decides at","Verdict"],[
      ["Two display unit variants; the Acquirer directs that one carry its own nomenclature","G8","Separate CIs \u2014 external direction forces it"],
      ["Three cable assembly variants; a change to one is routinely dispositioned and cut in on its own schedule","G7","Separate CIs \u2014 each needs its own effectivity address"],
      ["Two valve variants, alike in every respect, but the qualification basis for the second has not been established","G6","Decide nothing yet. Obtain the verification answer \u2014 deciding without it means deciding twice"],
      ["Two connector variants appearing on one interface control document, with distinct callouts for each","G5","Analyse the callouts. Distinct callouts usually mean different mating definitions and separate interface change traffic \u2014 which separates"],
      ["Two brackets with different part numbers; neither meets any criterion on the screen","G1","Parts, not CIs. The part numbers already capture the difference \u2014 do not designate CIs to solve a part-numbering problem"]
    ]),
    C("What each verdict obliges you to record",[
      "**Separate CIs:** each gets its own hierarchy position, documentation determination, effectivity address and baseline management \u2014 and every pairwise boundary between the new siblings appears in the interface register or carries a signed no-interface determination.",
      "**One CI, multiple variants:** the variant mapping goes in the index, and the specification is tabulated by variant including per-variant interface callouts.",
      "**Either way:** submit for Acquirer concurrence, record the verdict with the gate that drove it, and re-run the assessment on trigger \u2014 including a variant later diverging in specification, verification, effectivity or safety classification."
    ])
  ], check:{
    q:"Which situation produces two CI identifiers but only one part number?",
    o:["Two variants of one managed function that are not interchangeable with each other",
       "The same physical item instantiated in two subsystems that perform distinct end-use functions",
       "An item whose nomenclature the Acquirer directs be split",
       "Two items with the same function whose verification bases differ"],
    a:1,
    why:"Different end-use functions and different parents drive separate CI identifiers, but nothing about installing one item in two places creates a non-interchangeable condition \u2014 so the part number does not split. The first option is the mirror image: one CI carrying several part-number variants. The identifiers are decoupled on purpose, and they move for different reasons."
  }}
,

  {id:"M1-28", title:"De-designation, splits and consolidations", body:[
    P("A CI structure is not a ratchet. Three mid-life changes have mechanics worth knowing before you meet one, because each touches identifiers, boundaries and records at the same time."),
    CARDS([
      {h:"De-designation", b:"An item stops being separately managed. For an Acquirer-controlled CI the designation was theirs, so the de-designation is theirs too \u2014 proposed, submitted and concurred like any other selection change. The item does not become uncontrolled: it returns to control within its parent CI\u2019s documentation, and **the parent has to be named.** The index row is retained with the status changed, never deleted."},
      {h:"Split", b:"One CI becomes two or more. CI identifiers change, because the management need changed. Part numbers do not move unless the split created a non-interchangeable condition, and unit identifiers never move at all. Every pairwise boundary between the new siblings appears in the interface register or carries a signed no-interface determination \u2014 and each new CI needs its own documentation determination, effectivity address and baseline management."},
      {h:"Consolidation", b:"Several CIs become one. The part-number variants come with it, and the variant mapping is recorded against the surviving CI. Boundaries that used to be interfaces between the old CIs become internal to the new one \u2014 those register rows are dispositioned, with the reason recorded, rather than quietly abandoned."}
    ],3),
    S("Identifiers move for management reasons. Part numbers move for interchangeability reasons. Unit identifiers never move at all.",
      "Three restructurings, one rule \u2014 and it is the same rule you met in the very first identifier section. Everything here is that principle applied while the program is running."),
    P("All three are selection changes, and they are treated as such: assessed against the criteria with the rationale recorded, submitted for Acquirer concurrence where the CIs are Acquirer-controlled, recorded in status accounting, and followed by a fresh interface coverage check. None of the three is a records-tidying exercise that CM performs alone."),
    C("Why the retained row matters more than it looks",[
      "Every change, every status entry, every audit result and every delivered unit\u2019s record made while the item was a CI still references that identifier. Delete the row and all of them point at nothing.",
      "**The index answers two different questions:** what is a CI today, and what was a CI when this record was written. A status field answers both. A deletion answers only the first, and silently corrupts the second."
    ])
  ], check:{
    q:"A program proposes to de-designate an Acquirer-controlled CI that no longer warrants separate management. Who decides, and what happens to the item?",
    o:["CM decides, records the rationale, and the item is controlled by its own drawings thereafter",
       "The program decides; the Acquirer is notified at the next review",
       "The Acquirer decides, since the designation was theirs \u2014 and the item returns to control within its parent CI\u2019s documentation, with the parent named and the index row retained",
       "The item cannot be de-designated once a baseline has been established against it"],
    a:2,
    why:"Designation authority for Acquirer-controlled CIs rests with the Acquirer, and so does the authority to remove it \u2014 the proposal is submitted and concurred like any other selection change. And de-designation moves an item to a different level of control rather than out of control: the parent whose documentation now governs it must be identified, exactly as it would be for a candidate rejected at the end-use gate."
  }}
 ],
 exercises:[
  {id:"M1-E1", title:"Exercise 1 \u2014 The end-use gate",
   scen:"Screen each item against the end-use function gate only. State pass or fail, and if it fails, say where the item is controlled instead.",
   parts:[
     {id:"a", q:"A titanium alloy billet, specified by material standard, from which structural fittings are machined."},
     {id:"b", q:"A structural bracket that carries no load-path requirement of its own, but positions a safety-critical sensor to its specified alignment."},
     {id:"c", q:"The compiler used to build the flight software."}
   ]},
  {id:"M1-E2", title:"Exercise 2 \u2014 The criteria screen",
   scen:"A cabin pressure control valve is a candidate CI. It is procured from a single qualified source with a fourteen-month lead time. Hazard analysis classifies its failure as capable of causing loss of primary system capability. It requires a dedicated test set for depot maintenance and will appear in the technical manuals. The Acquirer has expressed no view.",
   parts:[
     {id:"a", q:"Which criteria does it meet? List every one that applies, with a one-line justification each."},
     {id:"b", q:"How many criteria are needed to designate it? Why list more than one?"},

   scen:"Three relays carry different part numbers. Same end-use function, same sub-subsystem, same vendor, same maintenance requirements. None is safety-critical. Interfaces are \u201cslightly different.\u201d Verification requirements are not yet established. The program uses a model-based architecture.",
   parts:[

   ]},

   scen:"A cooling fan assembly, one part number, is installed inside the mission computer (processor temperature) and inside the environmental control unit (cabin air recirculation). The installations are on different branches of the CI hierarchy, maintenance is planned separately, and a bearing-life change would be cut in on different schedules.",
   parts:[

  {id:"M1-E5", title:"Exercise 5 \u2014 Interface register coverage",
   scen:"A CI has just been split into two sibling CIs. Before the split, the parent had documented interfaces to three external systems and to two sibling CIs.",
   parts:[

  {id:"M1-E6", title:"Exercise 6 \u2014 Identifiers",

  {id:"M1-E7", title:"Exercise 7 \u2014 The floor gate",
   scen:"A program is tailoring its CM requirements at the start of a safety-significant development. It proposes not to perform a requirement that turns out to be a floor item, on the grounds that the contract does not flow it down and the schedule is tight. The item\u2019s pre-anchored severity is catastrophic.",
   parts:[
     {id:"a", q:"Walk the gate. What is the first thing you establish, and what are the program\u2019s options once you have established it?"},

  {id:"M1-E8", title:"Exercise 8 \u2014 Identifiers under a firmware change",
   scen:"A designated CI is a controller with embedded firmware. The hardware device and its code are controlled together on a single altered-item drawing. A defect is corrected in the code; the hardware is untouched, and the corrected units cannot be installed alongside uncorrected ones in the same system.",

     {id:"b", q:"What happens to the part number, and what happens to the serial numbers of units that are reworked to the new code?"},
     {id:"c", q:"The program is considering controlling the code separately from the device on future builds. What would change about the identifiers, and what would you gain and lose?"},

  {id:"M1-E9", title:"Exercise 9 \u2014 The three documentation sets",
   scen:"An avionics processing unit is a designated CI on a performance-based contract, approaching preliminary design review. It contains a commercially procured processor module. Accepting a delivered unit requires a special calibration fixture that does not exist yet. The unit is life-limited.",
   parts:[
     {id:"a", q:"Which requirements belong in the allocated documentation for this CI, and which stay at system level in the functional documentation? Give one concrete example of each."},
     {id:"b", q:"The calibration fixture is needed to inspect the item at acceptance. Where is its design documented, and under which baseline?"},
     {id:"c", q:"The processor module is commercial and the supplier will not release its internals. What must the product documentation still say about it?"},
     {id:"d", q:"The contract is performance-based and requires no design disclosure. What does that change about the product documentation \u2014 and what does it not change?"},
     {id:"e", q:"Eight months after the product baseline is established, a change is approved. What happens to the documentation, and what must the new revision be able to show?"},
     {id:"f", q:"Where does verification appear across the three sets? Name what each set\u2019s verification content is for."}
   ]},
  {id:"M1-E10", title:"Exercise 10 \u2014 Reading an index and a register",
   scen:"You are handed the identification records for a subsystem you have never seen. The index shows: a level-2 subsystem CI, Acquirer-controlled, safety-critical flag set with a hazard reference, product baseline planned; beneath it three level-3 CIs, two Supplier-controlled and one Acquirer-controlled; one of the three is a software CI with no allocated baseline date recorded; one carries three part-number variants on the variant sheet; and one row is marked de-designated with its status changed but its baseline dates still populated. The register carries five boundary rows for these CIs, one of which is a signed no-interface determination, and two of which cite the same interface control document with different variant applicability.",
   parts:[
     {id:"a", q:"How many CIs are actively designated here, and how do you know without counting rows?"},
     {id:"b", q:"The software CI has no allocated baseline date. Name two different things that could mean, and say what you would look at to tell them apart."},
     {id:"c", q:"Two register rows cite the same interface control document. Is that an error? Explain what the register is keyed to and why that answers the question."},
     {id:"d", q:"The de-designated row still shows baseline dates. Should those be cleared? Why or why not?"},
     {id:"e", q:"Is the register\u2019s coverage complete for these four CIs? State how you would check, and what number of boundary rows you would expect to find."},
     {id:"f", q:"The parent CI is flagged safety-critical but one child is not. What would you want to confirm about that, and with whom?"}
   ]},
  {id:"M1-E11", title:"Exercise 11 \u2014 Reading a situation",
   scen:"You join a program at preliminary design review. You find: a CI index with 340 entries, most at bracket and connector level; no candidate list; an interface register with 61 rows, 22 blank in the \u201cdefining documentation\u201d column; and a model that decomposes the system by ATA chapter while the CI index is organised by the contract work breakdown structure.",
   parts:[

     {id:"b", q:"Which one would you address first, and why?"},

,
  {id:"M1-E12", title:"Exercise 12 \u2014 Building a structure from scratch",
   scen:"A new program will deliver a ground-based radar system. It comprises: an antenna assembly with a positioner; a transmitter cabinet; a receiver and signal processing cabinet running two software applications \u2014 the signal processing chain and an operator display \u2014 on separate processors; a power conditioning unit bought as a catalog item to a vendor\u2019s part number; a cooling skid procured to your source control drawing from one qualified vendor with an eleven-month lead time; interconnecting cable assemblies; and a transportable shelter housing the cabinets. Hazard analysis identifies the positioner drive as safety-critical: an uncommanded slew can strike personnel. The system interfaces to an external command network and to site power. The contract line items are the radar system and a separate spares package. No architecture model exists yet.",
   parts:[

     {id:"c", q:"Lay out the structure: levels, parents, and which CIs you would expect to be Acquirer-controlled. Say what basis you used for the decomposition, given that no model exists."},

     {id:"f", q:"Which of your verdicts would you expect to be challenged at Acquirer review, and what would you have ready?"},
