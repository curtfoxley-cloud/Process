<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CM Plan Builder</title>
<style>
:root{
  --ink:#16191d; --ink2:#4a5057; --line:#d8dbe0; --bg:#f4f5f7; --card:#fff;
  --accent:#1f4e79; --accent2:#e8eef5; --warn:#8a5a00; --ok:#1d6b3f;
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--accent);color:#fff;padding:14px 22px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px}
header .sub{font-size:13px;opacity:.85}
header .spacer{flex:1}
header button{font:inherit;font-size:13px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);padding:5px 11px;border-radius:4px;cursor:pointer}
header button:hover{background:rgba(255,255,255,.25)}
#layout{display:flex;align-items:flex-start;gap:0;max-width:1240px;margin:0 auto}
nav{width:250px;flex:none;padding:18px 12px 60px;position:sticky;top:0;max-height:100vh;overflow:auto}
nav a{display:block;padding:7px 10px;border-radius:5px;color:var(--ink2);text-decoration:none;font-size:13.5px;cursor:pointer;border-left:3px solid transparent}
nav a:hover{background:#e9ebef}
nav a.on{background:var(--accent2);color:var(--accent);font-weight:600;border-left-color:var(--accent)}
nav a .cnt{float:right;font-size:11.5px;color:#8a9099;font-weight:400}
main{flex:1;padding:18px 22px 90px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:18px 20px;margin-bottom:14px}
h2.step{font-size:19px;margin:2px 0 4px}
p.lead{color:var(--ink2);margin:0 0 16px;font-size:14px;max-width:70ch}
.q{margin-bottom:20px}
.q label.t{display:block;font-weight:600;font-size:14px;margin-bottom:3px}
.q .instr{font-size:12.5px;color:var(--ink2);margin-bottom:6px;max-width:80ch}
.q .cite{font-size:11.5px;color:#7a818a;margin-top:4px}
textarea,input[type=text],select{width:100%;font:inherit;font-size:14px;padding:8px 9px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--ink)}
textarea{min-height:82px;resize:vertical;line-height:1.45}
textarea:focus,input:focus,select:focus{outline:2px solid #a9c4de;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 .q{margin-bottom:0}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#eef0f3;color:var(--ink2);margin-left:6px;vertical-align:middle}
.pill.auto{background:#eaf3ea;color:var(--ok)}
.pill.edited{background:#fdf1de;color:var(--warn)}
.pill.clean{background:#eaf3ea;color:var(--ok)}
.pill.judgment{background:#fdf1de;color:var(--warn)}
.pill.conditional{background:#eef0f3}
button.mini{font:inherit;font-size:12px;padding:3px 9px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;color:var(--ink2)}
button.mini:hover{background:#f0f2f4}
table.rows{width:100%;border-collapse:collapse;font-size:13.5px}
table.rows th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink2);border-bottom:1px solid var(--line);padding:6px 6px}
table.rows td{border-bottom:1px solid #eceef1;padding:6px 6px;vertical-align:top}
table.rows textarea{min-height:54px}
.floorrow td{font-size:13px}
.floorrow .fid{font-weight:600;white-space:nowrap}
.req{color:var(--ink2);font-size:12.5px}
footer.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 22px;display:flex;gap:10px;align-items:center;z-index:5}
footer.bar .prog{flex:1;font-size:13px;color:var(--ink2)}
button.pri{font:inherit;background:var(--accent);color:#fff;border:0;padding:9px 18px;border-radius:5px;cursor:pointer;font-weight:600}
button.pri:hover{background:#173e60}
button.sec{font:inherit;background:#fff;color:var(--ink);border:1px solid var(--line);padding:9px 16px;border-radius:5px;cursor:pointer}
.note{background:#fbfaf5;border:1px solid #e6e0cd;border-radius:6px;padding:10px 12px;font-size:13px;color:#5c5340;margin-bottom:14px}
.bad{color:#8a2b2b}
ul.check{margin:6px 0 0 18px;padding:0;font-size:13.5px}
ul.check li{margin-bottom:3px}
.hidden{display:none}
.sev{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.sev.catastrophic{background:#f3dede;color:#8c2b2b}
.sev.severe{background:#f6eddb;color:#7a5a17}
tr.detail>td{background:#f7f9fc;border-top:none}
tr.floorrow.rowbad>td{box-shadow:inset 3px 0 0 #b23a3a}
label.conf{display:block;margin-top:6px;font-size:11px;color:#444;font-weight:600}
label.conf input{margin-right:5px}
</style>
</head>
<body>
<header>
  <h1>CM Plan Builder</h1>
  <span class="sub">Life Cycle Configuration Management Plan &mdash; template-driven</span>
  <span class="spacer"></span>
  <button onclick="saveJSON()">Save answers</button>
  <button onclick="document.getElementById('loadfile').click()">Load answers</button>
  <input id="loadfile" type="file" accept=".json" class="hidden" onchange="loadJSON(this)">
</header>
<div id="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<footer class="bar">
  <button class="sec" onclick="go(-1)">Back</button>
  <span class="prog" id="prog"></span>
  <button class="sec" onclick="showStep(STEPS.length-1)">Review &amp; generate</button>
  <button class="pri" onclick="go(1)">Next</button>
</footer>

const SCHEMA={"questions": [{"id": "q001", "kind": "body", "h1": "", "h2": "", "h3": "", "instruction": "Replace Organization with applicable office title", "sample": ""}, {"id": "q002", "kind": "body", "h1": "", "h2": "", "h3": "", "instruction": "Insert organizational logo", "sample": ""}, {"id": "q003", "kind": "body", "h1": "", "h2": "", "h3": "", "instruction": "Enter Release Date DD MMM YYYY>  \u2014 release date must be post approval date", "sample": ""}, {"id": "q004", "kind": "body", "h1": "", "h2": "", "h3": "", "instruction": "Enter Version.Revision number v##.##", "sample": ""}, {"id": "q005", "kind": "body", "h1": "", "h2": "", "h3": "", "instruction": "Insert the distribution and destruction statements applicable to your organization just above the footer. Select the distribution statement per your data-rights and classification rules.", "sample": ""}, {"id": "q006", "kind": "body", "h1": "Signature Page", "h2": "", "h3": "", "instruction": "Select a designated user from your organization that is jointly responsible to achieve consistent conformance and authorized to make CM business decisions, i.e. Project Manager, Systems Engineer, Deputy Program Manager", "sample": ""}, {"id": "q007", "kind": "body", "h1": "1.0 Executive Summary", "h2": "1.1 Introduction", "h3": "", "instruction": "Provide a general idea of what this document is about and include a brief overview of how the CMP relates to the program or project", "sample": "This Configuration Management Plan (CMP) specifies the requirements for performing CM in Program XYZ. It assigns responsibilities, defines roles, and promulgates the approach to satisfying the requirements of the Life Cycle CM Organizational Standard Process and other higher-level CM requirements, including the CM floor requirements in Section 7."}, {"id": "q008", "kind": "body", "h1": "1.0 Executive Summary", "h2": "1.2 Scope", "h3": "", "instruction": "Define the participants and stakeholders governed by this document", "sample": "The CMP is mandatory for use by all support personnel. Contractors/suppliers, whether industry or government, shall comply with the guidance set forth in this plan when delivering end-items or documents for inclusion into any programs, products, or platforms within the technical baseline. The requirements apply to all phases of the lifecycle including installation and disposal."}, {"id": "q009", "kind": "body", "h1": "1.0 Executive Summary", "h2": "1.3 Purpose", "h3": "", "instruction": "Define the desired results intended", "sample": "The purpose of the CMP is to describe how configuration management will be conducted throughout the project lifecycle: how CM is managed, roles and responsibilities, how configuration item (CI) changes are made, and how all aspects of CM are communicated to stakeholders."}, {"id": "q010", "kind": "body", "h1": "1.0 Executive Summary", "h2": "1.4 CM Floor Requirements Basis", "h3": "", "instruction": "State the safety-significant product lines to which the CM floor applies in your organization, and identify the authority that approves any documented equivalent control", "sample": ""}, {"id": "q011", "kind": "body", "h1": "1.0 Executive Summary", "h2": "1.4 CM Floor Requirements Basis", "h3": "", "instruction": "Identify where the floor disposition record is maintained, its owner, the health check cadence, and the authority that approves each documented equivalent control and each risk acceptance by severity.", "sample": ""}, {"id": "q012", "kind": "body", "h1": "2.0 Configuration Management Functions & Principles", "h2": "2.1 Configuration Management", "h3": "2.1.3 Activity", "instruction": "Provide an overview description of how Configuration Management relates to the program/project and how it will be implemented", "sample": "All five CM functions will be incorporated to ensure a standard approach is used to implement the CM process. This section provides overarching guidance for each CM function."}, {"id": "q013", "kind": "body", "h1": "2.0 Configuration Management Functions & Principles", "h2": "2.2 Configuration Management & Planning", "h3": "2.2.3 Activity", "instruction": "Provide an overview description of how Configuration Management & Planning relates to the program/project and how it will be implemented", "sample": "The CM process is documented throughout this plan. Continuous improvements are included as part of the periodic update cycle."}, {"id": "q014", "kind": "body", "h1": "2.0 Configuration Management Functions & Principles", "h2": "2.2 Configuration Management & Planning", "h3": "2.2.3 Activity", "instruction": "Describe the CM performance measurement methodology: which enterprise-standard measures are reported (these are mandatory and comparable across programs), which additional program-specific measures are selected, and for each measure the organization whose activity is measured, the numerator and denominator, the system the data is drawn from, the reporting frequency, and the threshold. Where a measure depends on a review or signature, state what that signature attests \u2014 that review occurred, or that content is adequate \u2014 before the measure is first reported. State how safety-floor coverage is measured and reported: a severity-weighted coverage percentage for trend, and an unweighted count of undispositioned top-band floor requirements as the safety-exposure measure with a target of zero. Report them together and never combine them; report separately the share of coverage achieved by risk acceptance rather than performance.", "sample": "Enterprise-standard CM measures are reported monthly per the organizational standard process. Floor coverage is reported as a weighted percentage together with the count of undispositioned top-band requirements; a nonzero count is reported as a finding regardless of the percentage."}, {"id": "q015", "kind": "body", "h1": "2.0 Configuration Management Functions & Principles", "h2": "2.3 Configuration Identification", "h3": "2.3.3 Activity", "instruction": "Provide an overview description of how Configuration Identification will be implemented, including CI selection, documentation typing, identifier issuance, baseline establishment, and CI hierarchy documentation", "sample": "This is a coordinated effort by the Program, Systems Engineers, ILS, CM Specialist, and the contractor/supplier(s). CI selection criteria are documented in Appendix B."}, {"id": "q016", "kind": "body", "h1": "2.0 Configuration Management Functions & Principles", "h2": "2.4 Configuration Control", "h3": "2.4.3 Activity", "instruction": "Provide an overview description of how Configuration Control will be implemented, including the CCB charter, change classification (Major/Class I vs Minor/Class II), ECP/NOR/variance processing, engineering release, and change verification", "sample": "A CCB Charter details the responsibilities, voting members, operating procedures and periodicity of the CCB. A Change Request is the vehicle for recording a recommended change against hardware configuration, software configuration, baseline content, and documentation."}, {"id": "q017", "kind": "body", "h1": "2.0 Configuration Management Functions & Principles", "h2": "2.5 Configuration Status Accounting", "h3": "2.5.3 Activity", "instruction": "Provide an overview description of how CSA will be implemented, including the CSA tool, baseline reports, CR logs, historical traceability, retrofit incorporation records, and sub-tier supplier data", "sample": "A CM tool facilitates the capture of data, documentation and configuration items and provides status reports. All items are linked to provide a relational view and support impact assessment."}, {"id": "q018", "kind": "body", "h1": "2.0 Configuration Management Functions & Principles", "h2": "2.5 Configuration Status Accounting", "h3": "2.5.3 Activity", "instruction": "Distinguish the system of record from analysis tooling. The system of record captures configuration information when it is created, keeps it current, stores and safeguards it, and makes it retrievable across the retention period and the full program history. Reconciliation, comparison, and verification tools operate on that information to compare, verify, and report; they do not satisfy the capture, currency, storage, retention, retrieval, or historical-traceability obligations. Name both, and state which system satisfies which obligation \u2014 F24 through F28 and F32 are record obligations, not analysis obligations.", "sample": ""}, {"id": "q019", "kind": "body", "h1": "2.0 Configuration Management Functions & Principles", "h2": "2.6 Configuration Verification & Audit", "h3": "2.6.3 Activity", "instruction": "Provide an overview description of how Verification & Audit will be implemented, including FCA, PCA, process assessments, and support to Acquirer audits", "sample": "An FCA will be performed between acquirer and supplier to validate that documentation meets approved functional requirements. A PCA will be performed to validate that the physical item meets the approved design requirements. A CM process assessment is performed after each major milestone."}, {"id": "q020", "kind": "body", "h1": "2.0 Configuration Management Functions & Principles", "h2": "2.7 Data & Document Management", "h3": "2.7.3 Activity", "instruction": "Provide an overview description of how Data & Document Management will be implemented, including metadata fields, entry patterns, standard titles, numbering schemes, version/revision schemes, and naming conventions (details in the Data and Document Management Conventions appendix)", "sample": "The data and document management conventions are used to identify data products and attributes so that requirements can be controlled. Refer to Appendix P."}, {"id": "q021", "kind": "body", "h1": "3.0 Configuration Management Paradigms", "h2": "3.1 Product \u2013 Platform", "h3": "", "instruction": "Describe the relationship and touch points between your product and applicable platforms: fielding coordination, configuration data transition, communication between product and platform stakeholders, and how their CM processes interface", "sample": ""}, {"id": "q022", "kind": "body", "h1": "3.0 Configuration Management Paradigms", "h2": "3.2 Acquirer \u2013 Supplier", "h3": "", "instruction": "Define the relationship between the acquirer, who monitors supplier performance under a contract or agreement, and the supplier, who accomplishes specific work and/or delivers required products or services. Address: joint Acquirer/Supplier CCB participation (F04), Acquirer concurrence on Minor/Class II classification (F05), flow-down of CM floor requirements to sub-suppliers with suitable tailoring (F40), support to Acquirer audits of Supplier and sub-supplier CM (F41), sub-tier supplier data reporting (F39), and ICWG representation where one exists (F38)", "sample": "All programs identify the level of CM control and/or visibility necessary to meet program needs and ensure effective management of baselines and baseline changes. Sub-supplier purchase orders impose the CM floor requirements of Section 7, tailored where documented and approved."}, {"id": "q023", "kind": "body", "h1": "3.0 Configuration Management Paradigms", "h2": "3.2 Acquirer \u2013 Supplier", "h3": "3.2.1 Sub-Supplier CM Requirements Flowdown Method", "instruction": "State the method by which CM requirements are selected for each procurement: classification of the work the supplier performs (who holds design authority, who performs the build, item type), derivation of the applicable requirement set and supplier data deliverables from that classification, and recording of the classification as the documented tailoring rationale required by F40. Identify where classifications are recorded, and who reviews and signs the supplier statement of work before release.", "sample": "Each procurement is classified by work type at statement-of-work development and recorded on the classification log; the requirement set and data deliverables are derived from that classification; CM signs the statement of work before release."}, {"id": "q024", "kind": "body", "h1": "3.0 Configuration Management Paradigms", "h2": "3.2 Acquirer \u2013 Supplier", "h3": "3.2.2 Sub-Supplier CM Effectiveness Determination and Actions", "instruction": "State the method used to determine whether each sub-supplier CM process is effective and the actions taken when it is not \u2014 a required CMP planning factor. Address: the evidence accrued (data deliverable review results with defect codes; findings, escapes, and non-submittal events); the determination cadence and the triggers that force an off-cycle determination; the determination levels and the determining authority; and the graduated actions applied, from increased surveillance through corrective action, source inspection, and award restriction. State the required downstream actions on a determination of less than effective: re-assessment of configuration audit designation for that supplier\u2019s items, reporting into the safety data stream where the evidence is safety-relevant, and revalidation of any documented equivalent control that depends on that supplier\u2019s process.", "sample": ""}, {"id": "q025", "kind": "body", "h1": "3.0 Configuration Management Paradigms", "h2": "3.2 Acquirer \u2013 Supplier", "h3": "3.2.3 Conditional Configuration Audit Obligations in Supplier Agreements", "instruction": "State that supplier statements of work for items where configuration audit designation is possible carry a standing conditional audit clause \u2014 obligations taking effect if and when the item is or becomes designated \u2014 with the audit data deliverables cited as triggered items, and that the supplier\u2019s audit role (conduct, support, or data support) follows the classification of the work performed. Audit ceremony may be tailored at the supplier tier; audit substance may not.", "sample": "Because awarding to a new source is itself a designation trigger, the conditional clause is included at award rather than negotiated after designation occurs."}, {"id": "q026", "kind": "body", "h1": "3.0 Configuration Management Paradigms", "h2": "3.3 Hardware \u2013 Software", "h3": "", "instruction": "Define the relationship between hardware and software requirements as it applies within your organization", "sample": ""}, {"id": "q027", "kind": "body", "h1": "3.0 Configuration Management Paradigms", "h2": "3.4 Acquisition \u2013 Operational", "h3": "", "instruction": "Define the relationship between acquisition and operational CM as it relates to your system and to your life cycle role", "sample": ""}, {"id": "q028", "kind": "body", "h1": "3.0 Configuration Management Paradigms", "h2": "3.5 Data \u2013 Document", "h3": "", "instruction": "Define the relationship between data and document management as it applies within your organization", "sample": ""}, {"id": "q029", "kind": "body", "h1": "3.0 Configuration Management Paradigms", "h2": "3.6 System of Systems (SOS) \u2013 Family of Systems (FOS)", "h3": "", "instruction": "Define the relationship of SOS and FOS as it applies within your organization, including joint CCB and interface working group participation (F38)", "sample": ""}, {"id": "q030", "kind": "body", "h1": "4.0 Organizational Roles & Responsibilities", "h2": "", "h3": "", "instruction": "Insert Organizational Chart here \u2014 Figure 4-1 Configuration Management Roles Alignment", "sample": ""}, {"id": "q031", "kind": "body", "h1": "4.0 Organizational Roles & Responsibilities", "h2": "4.1 Process Participants", "h3": "", "instruction": "Modify Table 4-1 roles and define responsibilities as they relate to CM activities within your organization", "sample": ""}, {"id": "q032", "kind": "body", "h1": "4.0 Organizational Roles & Responsibilities", "h2": "4.2 Process Stakeholders", "h3": "", "instruction": "Modify Table 4-2 as applicable for your organization", "sample": ""}, {"id": "q033", "kind": "body", "h1": "5.0 Product Configuration Management", "h2": "5.1 Material Solution Analysis CM Tasks", "h3": "", "instruction": "List each CM task for this phase with a one-sentence description", "sample": "Calculate CM personnel requirement\nIdentify contractual deliverable requirements\nCreate CM Training Plan"}, {"id": "q034", "kind": "body", "h1": "5.0 Product Configuration Management", "h2": "5.2 Material Solution Analysis CM Deliverables", "h3": "", "instruction": "List each CM deliverable for this phase with a one-sentence description", "sample": "CM personnel budget\nContract documentation (RFP, SOW, CDRL, DID)\nCM Training Plan"}, {"id": "q035", "kind": "body", "h1": "5.0 Product Configuration Management", "h2": "5.3 Technology & Maturation Risk Reduction CM Tasks", "h3": "", "instruction": "List each CM task for this phase with a one-sentence description", "sample": "Update functional baseline\nCapture all required information\nDistribute updated CMP"}, {"id": "q036", "kind": "body", "h1": "5.0 Product Configuration Management", "h2": "5.4 Technology & Maturation Risk Reduction CM Deliverables", "h3": "", "instruction": "List each CM deliverable for this phase with a one-sentence description", "sample": "Functional Baseline Report\nConfiguration Status Accounting Report\nAcquisition documentation"}, {"id": "q037", "kind": "body", "h1": "5.0 Product Configuration Management", "h2": "5.5 Engineering & Manufacturing CM Tasks", "h3": "", "instruction": "List each CM task for this phase with a one-sentence description", "sample": "Update change request process\nCreate allocated baseline\nConduct Functional Configuration Audit (F42\u2013F44)"}, {"id": "q038", "kind": "body", "h1": "5.0 Product Configuration Management", "h2": "5.6 Engineering & Manufacturing CM Deliverables", "h3": "", "instruction": "List each CM deliverable for this phase with a one-sentence description", "sample": "Change request process flow\nAllocated Baseline Report\nFunctional Configuration Audit Report including documented non-compliances provided to the Acquirer (F43)"}, {"id": "q039", "kind": "body", "h1": "5.0 Product Configuration Management", "h2": "5.7 Production & Development CM Tasks", "h3": "", "instruction": "List each CM task for this phase with a one-sentence description", "sample": "Conduct Physical Configuration Audit (F29\u2013F31)\nIdentify differences between production CI and the development CI used for FCA (F34)\nUpdate product baseline\nVerify CMP implementation"}, {"id": "q040", "kind": "body", "h1": "5.0 Product Configuration Management", "h2": "5.8 Production & Development CM Deliverables", "h3": "", "instruction": "List each CM deliverable for this phase with a one-sentence description", "sample": "Physical Configuration Audit Report including documented non-compliances provided to the Acquirer (F31)\nProduct Baseline Report\nProcess Audit Report"}, {"id": "q041", "kind": "body", "h1": "5.0 Product Configuration Management", "h2": "5.9 Operations & Support CM Tasks", "h3": "", "instruction": "List each CM task for this phase with a one-sentence description", "sample": "Create as-installed baseline\nDocument incorporation of retrofit changes to units identified for retrofit (F33)\nCapture CI disposal status\nUpdate the CMP"}, {"id": "q042", "kind": "body", "h1": "5.0 Product Configuration Management", "h2": "5.10 Operations & Support CM Deliverables", "h3": "", "instruction": "List each CM deliverable for this phase with a one-sentence description", "sample": "As-Installed Baseline Report\nBaseline report reflecting disposal status\nUpdated CMP"}, {"id": "q043", "kind": "body", "h1": "6.0 Platform Configuration Management", "h2": "6.1 Configuration Data Transition CM Tasks", "h3": "", "instruction": "List each CM task for this phase with a one-sentence description", "sample": "Collect planning and requirement documents\nCreate advanced coordinated fielding plan\nVerify data and document management information Management", "h2": "6.8 Installation Management CM Deliverables", "h3": "", "instruction": "List each CM deliverable for this phase with a one-sentence description", "sample": "Installation status records\nAs-installed discrepancy report"}, {"id": "q051", "kind": "body", "h1": "6.0 Platform Configuration Management", "h2": "6.9 Sustainment CM Tasks", "h3": "", "instruction": "List each CM task for this phase with a one-sentence description", "sample": "Monitor platform baseline\nParticipate in platform configuration audit\nReview platform CSA records"}, {"id": "q052", "kind": "body", "h1": "6.0 Platform Configuration Management", "h2": "6.10 Sustainment CM Deliverables", "h3": "", "instruction": "List each CM deliverable for this phase with a one-sentence description", "sample": "Platform baseline discrepancy report\nPlatform configuration audit report\nPlatform CSA records"}, {"id": "q053", "kind": "body", "h1": "6.0 Platform Configuration Management", "h2": "6.11 Disposal CM Tasks", "h3": "", "instruction": "List each CM task for this phase with a one-sentence description", "sample": "Create change request for end of life\nUpdate the platform baseline\nUpdate platform CSA records"}, {"id": "q054", "kind": "body", "h1": "6.0 Platform Configuration Management", "h2": "6.12 Disposal CM Deliverables", "h3": "", "instruction": "List each CM deliverable for this phase with a one-sentence description", "sample": "Alteration completion report\nPlatform baseline report\nPlatform CSA records"}, {"id": "q055", "kind": "body", "h1": "8.0 Appendices", "h2": "", "h3": "", "instruction": "Include each appendix listed; mark not-applicable appendices with rationale", "sample": ""}, {"id": "q056", "kind": "body", "h1": "9.0 References", "h2": "", "h3": "", "instruction": "List the specifications, standards, instructions and other publications invoked by this CMP; the entries below are the minimum set", "sample": ""}, {"id": "q057", "kind": "body", "h1": "9.0 References", "h2": "", "h3": "", "instruction": "Add the organizational CM process documents invoked by this CMP: CM planning and management; CI identification; configuration change management; configuration status accounting; configuration audit (FCA/PCA); and sub-supplier CM requirements flowdown and effectiveness. Where a CM function is not yet covered by its own process document, state the interim mechanism and the planned date in Section 2 for that function.", "sample": ""}, {"id": "q058", "kind": "body", "h1": "10.0 Glossary", "h2": "", "h3": "", "instruction": "Define acronyms and terms used in this CMP. Minimum set: ACD, CCB, CI, CMP, CSA, ECP, FCA, FCD, ICWG, NOR, PCA, PCD, PPSL, RFV", "sample": ""}, {"id": "F_F01", "kind": "floor", "floor": "F01", "clause": "3.2.1(2)(b)", "requirement": "Identify as a CI any item whose failure could cause serious injury, loss of life, or loss of primary system capability"}, {"id": "F_F02", "kind": "floor", "floor": "F02", "clause": "3.3.1.2(1)", "requirement": "Classify every engineering change as Major (Class I) or Minor (Class II)"}, {"id": "F_F03", "kind": "floor", "floor": "F03", "clause": "3.3.1.2(2)(e)(6)(a)", "requirement": "Treat changes affecting safety as Major (Class I)"}, {"id": "F_F04", "kind": "floor", "floor": "F04", "clause": "3.3(3)", "requirement": "Support a joint Acquirer/Supplier Configuration Control Board"}, {"id": "F_F05", "kind": "floor", "floor": "F05", "clause": "3.3.1.8.1(1)", "requirement": "Obtain Acquirer concurrence on Minor (Class II) classification"}, {"id": "F_F06", "kind": "floor", "floor": "F06", "clause": "3.3(1)", "requirement": "Apply configuration control to each CI, its components, and its documentation"}, {"id": "F_F07", "kind": "floor", "floor": "F07", "clause": "3.3(2)(c)", "requirement": "Document, evaluate, disposition, record in CSA, and report changes and variances"}, {"id": "F_F08", "kind": "floor", "floor": "F08", "clause": "3.3(2)(e)", "requirement": "Incorporate approved changes into all product configuration information and implement them"}, {"id": "F_F09", "kind": "floor", "floor": "F09", "clause": "3.3(2)(f)", "requirement": "Verify approved changes were incorporated"}, {"id": "F_F10", "kind": "floor", "floor": "F10", "clause": "3.3.1(1)", "requirement": "Use an ECP to document baseline changes and submit to the change approval authority"}, {"id": "F_F11", "kind": "floor", "floor": "F11", "clause": "3.3.1.1(1)(a)", "requirement": "Define the need for each change"}, {"id": "F_F12", "kind": "floor", "floor": "F12", "clause": "3.3.1.1(1)(e)", "requirement": "Incorporate the approved ECP into the configuration documentation"}, {"id": "F_F13", "kind": "floor", "floor": "F13", "clause": "3.3.1.1(1)(f)", "requirement": "Implement and update documentation via a documented engineering release system"}, {"id": "F_F14", "kind": "floor", "floor": "F14", "clause": "3.3.1.1(1)(g)", "requirement": "Record all changes in the CSA system"}, {"id": "F_F15", "kind": "floor", "floor": "F15", "clause": "3.3.1.1(1)(h)", "requirement": "Verify the approved change was implemented correctly"}, {"id": "F_F16", "kind": "floor", "floor": "F16", "clause": "3.3.1.4(1)", "requirement": "Support each ECP with data to evaluate the change and its full impacts"}, {"id": "F_F17", "kind": "floor", "floor": "F17", "clause": "3.3.1.4(3)", "requirement": "Include a summary of testing validating new concepts or technology"}, {"id": "F_F18", "kind": "floor", "floor": "F18", "clause": "3.3.2(1)", "requirement": "Obtain Acquirer approval for any non-conforming item via a Request for Variance"}, {"id": "F_F19", "kind": "floor", "floor": "F19", "clause": "3.3.2(2)", "requirement": "Submit an ECP when a variance is determined permanently acceptable (recurring-to-permanent)"}, {"id": "F_F20", "kind": "floor", "floor": "F20", "clause": "3.3.1.1(1)(c)", "requirement": "Prepare an ECP, NOR, and supporting technical data for the change"}, {"id": "F_F21", "kind": "floor", "floor": "F21", "clause": "3.3.4(1)", "requirement": "Submit a NOR for each document affected by an ECP"}, {"id": "F_F22", "kind": "floor", "floor": "F22", "clause": "3.3.4(2)", "requirement": "Provide all information needed to disposition each NOR"}, {"id": "F_F23", "kind": "floor", "floor": "F23", "clause": "3.2.3.3(1)", "requirement": "Create a new revision of approved documentation after change approval, with before/after traceability"}, {"id": "F_F24", "kind": "floor", "floor": "F24", "clause": "3.4(1)", "requirement": "Maintain CSA legitimacy by storing valid data"}, {"id": "F_F25", "kind": "floor", "floor": "F25", "clause": "3.4.1(2)", "requirement": "Capture, store, and maintain product configuration information"}, {"id": "F_F26", "kind": "floor", "floor": "F26", "clause": "3.4.1(3)(a)", "requirement": "Capture and maintain currently approved configuration information by each CI's identification number"}, {"id": "F_F27", "kind": "floor", "floor": "F27", "clause": "3.4.1(3)(c)", "requirement": "Store and manage all product configuration information"}, {"id": "F_F28", "kind": "floor", "floor": "F28", "clause": "3.4.1(4)(c)", "requirement": "Secure, safeguard, and retrieve recorded configuration information"}, {"id": "F_F29", "kind": "floor", "floor": "F29", "clause": "3.5.3(1)", "requirement": "Conduct the PCA to verify product configuration documentation is consistent with the validated CI"}, {"id": "F_F30", "kind": "floor", "floor": "F30", "clause": "3.5.3(2)", "requirement": "Confirm the CI against the PPSL and verify proper parts are installed"}, {"id": "F_F31", "kind": "floor", "floor": "F31", "clause": "3.5.3(4)", "requirement": "Document each PCA non-compliance and provide it to the Acquirer"}, {"id": "F_F32", "kind": "floor", "floor": "F32", "clause": "3.4.1(3)(b)", "requirement": "Capture and maintain all historical configuration information with traceability from contract award to present"}, {"id": "F_F33", "kind": "floor", "floor": "F33", "clause": "3.4.1(6)", "requirement": "Document the incorporation of all retrofit changes to units identified for retrofit"}, {"id": "F_F34", "kind": "floor", "floor": "F34", "clause": "3.5.3.1(1)(b)", "requirement": "Identify differences between the production CI and the development CI used for FCA"}, {"id": "F_F35", "kind": "floor", "floor": "F35", "clause": "3.2.5.1(1)", "requirement": "Identify internal and external interface requirements"}, {"id": "F_F36", "kind": "floor", "floor": "F36", "clause": "3.2.5.1(2)", "requirement": "Incorporate interface information into the FCD/ACD/PCD"}, {"id": "F_F37", "kind": "floor", "floor": "F37", "clause": "3.2.5.1(3)", "requirement": "Maintain configuration control of baselined interface requirements"}, {"id": "F_F38", "kind": "floor", "floor": "F38", "clause": "3.2.5.2(1)", "requirement": "Provide a representative to the Acquirer's ICWG where one exists"}, {"id": "F_F39", "kind": "floor", "floor": "F39", "clause": "3.4.1(3)(j)", "requirement": "Record and report sub-tier supplier data with traceability to the next higher assembly"}, {"id": "F_F40", "kind": "floor", "floor": "F40", "clause": "3.(2)", "requirement": "Require sub-suppliers to comply with or suitably tailor the same CM requirements imposed on the Supplier"}, {"id": "F_F41", "kind": "floor", "floor": "F41", "clause": "3.(4)", "requirement": "Support Acquirer audits of Supplier and sub-supplier CM"}, {"id": "F_F42", "kind": "floor", "floor": "F42", "clause": "3.5.2(2)", "requirement": "Conduct the FCA to verify the CI meets performance requirements per approved FCD/ACD"}, {"id": "F_F43", "kind": "floor", "floor": "F43", "clause": "3.5.2(3)", "requirement": "Document each FCA non-compliance and provide it to the Acquirer"}, {"id": "F_F44", "kind": "floor", "floor": "F44", "clause": "3.5.2.1(1)(c)", "requirement": "Provide a requirements-to-test traceability matrix (each requirement maps to a test step)"}], "rows": {"changerec": {"xml": "<w:tr xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/20       if(!st.validator.trim())m.push('validator');
    }
  }
  if(!st.signoff.trim())m.push('sign-off');
  return m;
}
function coverage(){
  let tot=0,cov=0,openTop=0,riskWt=0,catRisk=0,incomplete=0;
  QF.forEach(q=>{const f=q.floor,w=SEV_WT[sevOf(f)];tot+=w;
    if(isDisp(f)){cov+=w;if(S.floor[f].disp==='risk'){riskWt+=w;if(sevOf(f)==='Catastrophic')catRisk++;}}
    else openTop++;
    if(missingFields(f).length)incomplete++;});
  return {tot:tot,cov:cov,pct:tot?cov/tot:0,openTop:openTop,riskWt:riskWt,
          riskShare:cov?riskWt/cov:0,catRisk:catRisk,incomplete:incomplete};
}

           (st.hcNext.trim()?', next due '+st.hcNext.trim():'');
  const interim=st.interim.trim()?' Interim mechanism: '+st.interim.trim():'';

    return 'Performed. Implemented per '+sec+'; owned by '+owner+'; evidence: '+
      (st.evid.trim()||'[evidence reference]')+'. Barrier health check: '+hc+'.'+interim;

    return 'Replaced by a documented equivalent control. '+
      (st.text.trim()||'[Describe the equivalent control.]')+' Independently validated by '+
      (st.validator.trim()||'[validator]')+' ('+(st.valRef.trim()||'[validation reference]')+
      '); owned by '+owner+'. Barrier health check: '+hc+'.'+interim;

      (st.raRef.trim()||'[acceptance reference]')+', approved by '+

}

   '<div><b style="font-size:26px">'+(cv.riskShare*100).toFixed(0)+'%</b><div class="cite">of coverage by risk acceptance<br>rather than performance</div></div>'+
   '<div><b style="font-size:26px" class="'+(cv.catRisk?'bad':'')+'">'+cv.catRisk+'</b><div class="cite">catastrophic requirements<br>risk-accepted</div></div>'+
   '</div>'+
   '<div style="margin-top:12px;padding:10px;border-radius:6px;background:'+(gate?'#e8f2e8':'#f7e3e3')+'"><b>'+
   (gate?'GATE PASS \u2014 every floor requirement is dispositioned and confirmed.'
        :'GATE FAIL \u2014 '+cv.openTop+' floor requirement(s) are open or unconfirmed. Coverage is not a substitute.')+
   '</b></div></div>';

 h+='<div class="card"><label class="t">Checks</label><ul class="check">';
 h+='<li>'+(missG.length?'<span class="bad">Profile fields empty ('+missG.length+'):</span> '+esc(missG.join('; ')):'Program profile complete')+'</li>';
 h+='<li>'+(missC.length?'<span class="bad">Cover fields empty ('+missC.length+'):</span> '+esc(missC.join('; ')):'Cover and signature fields complete')+'</li>';
 h+='<li>'+(blanks.length?blanks.length+' narrative paragraph(s) left blank &mdash; those paragraphs will be omitted':'All narrative items have content')+'</li>';
 h+='<li>'+(undisp.length?'<span class="bad">'+undisp.length+' floor requirement(s) open or unconfirmed: '+undisp.map(q=>q.floor).join(', ')+'</span>':'All 44 floor requirements dispositioned and confirmed')+'</li>';
 h+='<li>'+(incomplete.length?'<span class="bad">'+incomplete.length+' row(s) missing disposition-record fields: '+incomplete.map(q=>q.floor).join(', ')+'</span>':'Disposition record complete on every row')+'</li>';
 h+='<li>'+(risk.length?risk.length+' requirement(s) covered by risk acceptance: '+risk.map(q=>q.floor+' ('+sevOf(q.floor).charAt(0)+')').join(', '):'No requirements covered by risk acceptance')+'</li>';
 h+='</ul></div>';

 h+='<div class="note"><b>The plan is not the record.</b> Export the disposition record as structured data and load it into the compliance matrix &mdash; a disposition kept only as narrative inside the plan cannot be queried, and the coverage measures above cannot be recomputed from it.</div>';
 h+='<div class="card"><label class="t">Disposition record export</label><div style="margin-top:8px">'+
    '<button class="sec" onclick="exportFloorCSV()">Export disposition record (.csv)</button> '+
    '<button class="sec" onclick="exportFloorJSON()">Export disposition record + measures (.json)</button></div></div>';
 h+='<div class="note">After opening the document in Word: update the table of contents (Ctrl+A, F9), insert the organizational chart in Section 4, and confirm no blue or red instruction text remains.</div>';
 h+='<div class="card"><button class="pri" onclick="generate()">Generate .docx</button> <button class="sec" onclick="saveJSON()">Save answers as JSON</button><div class="cite" id="genmsg" style="margin-top:10px"></div></div>';
 main().appendChild(el('<div>'+h+'</div>'));
}

/* ------------------------------------------------------------- save/load */
function saveJSON(){
 const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
 dl(blob,(S.g.program||'CMP').replace(/[^\w-]+/g,'_')+'_cmp_answers.json');
}
function loadJSON(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);Object.assign(S.g,o.g||{});S.a=o.a||{};S.touched=o.touched||{};
  if(o.rows)S.rows=o.rows;if(o.floor)Object.keys(o.floor).forEach(k=>{if(S.floor[k])S.floor[k]=floorDefaults(Object.assign(S.floor[k],o.floor[k]))});showStep(cur);}catch(e){alert('Could not read that file: '+e.message)}};
 r.readAsText(f);inp.value='';
}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

/* --------------------------------------------------------- docx assembly */
function xesc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
const PTAG=/<w:p(?:\s[^>]*)?>/g;
function fillToken(xml,token,value,keepEmpty){
 const t='{{'+token+'}}';
 let idx=xml.indexOf(t);
 if(idx<0) return xml;
 PTAG.lastIndex=0;let s=-1,m;
 while((m=PTAG.exec(xml))&&m.index<idx) s=m.index;
 const e=xml.indexOf('</w:p>',idx)+6;
 if(s<0||e<6) return xml.split(t).join(xesc(value));
 const block=xml.slice(s,e);
 const lines=(value||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 let repl;
 if(!lines.length) repl=keepEmpty?block.split(t).join(''):'';
 else repl=lines.map(l=>block.split(t).join(xesc(l))).join('');
 return xml.slice(0,s)+repl+xml.slice(e);
}
function buildRows(key){
 const tpl=SCHEMA.rows[key];
 return S.rows[key].filter(r=>r.some(c=>(c||'').trim())).map(r=>{
   let x=tpl.xml;
   tpl.cols.forEach((c,i)=>{x=fillToken(x,'CELL'+i,interp(r[i]||''),true)});
   return x;}).join('');
}
function buildDoc(){
 let d=b64utf8(PARTS['word/document.xml']);
 Object.keys(SCHEMA.rows).forEach(k=>{
   const re=new RegExp('<w:tr[^>]*>(?:(?!</w:tr>)[\\s\\S])*?\\{\\{ROWS_'+k+'\\}\\}[\\s\\S]*?</w:tr>');
   d=d.replace(re,()=>buildRows(k));});
 QB.forEach(q=>{d=fillToken(d,q.id,answer(q.id),false)});
 QF.forEach(q=>{d=fillToken(d,'F_'+q.floor,floorText(q.floor),true)});
 d=d.split('{{g_org}}').join(xesc(S.g.org||'[Organization]'));
 d=d.split('{{g_user_sig}}').join(xesc(S.g.userSig||'[Name], [Title], [Organization]'));
 d=d.split('{{g_office_code}}').join(xesc(S.g.officeCode||'[office code]'));
 d=d.split('{{g_phone}}').join(xesc(S.g.phone||'[phone]'));
 d=d.split('{{g_email}}').join(xesc(S.g.email||'[email]'));
 d=d.split('{{g_authority}}').join(xesc(S.g.authority||'[approval authority]'));
 return d;
}
function generate(){
 const cv=coverage();
 if(cv.openTop>0 && !confirm('GATE FAIL: '+cv.openTop+' floor requirement(s) are open or unconfirmed.\n\n'+
   'Generating now produces a plan that asserts compliance it cannot evidence. Continue anyway?')) return;
 if(cv.incomplete>0 && !confirm(cv.incomplete+' row(s) are missing disposition-record fields (evidence, health check, sign-off, or acceptance reference).\n\nContinue anyway?')) return;
 try{
  const files=[];
  Object.keys(PARTS).forEach(n=>{
    let bytes;
    if(n==='word/document.xml') bytes=utf8bytes(buildDoc());
    else if(n==='word/footer1.xml') bytes=utf8bytes(b64utf8(PARTS[n]).split('{{g_dist}}').join(xesc(S.g.dist||'')));
    else bytes=b64bytes(PARTS[n]);
    files.push({name:n,data:bytes});});
  const zip=makeZip(files);
  const name=((S.g.program||'Program').replace(/[^\w-]+/g,'_'))+'_CMP_'+((S.g.version||'v00.01').replace(/[^\w.]+/g,''))+'.docx';
  dl(new Blob([zip],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'}),name);
  document.getElementById('genmsg').textContent='Generated '+name+' ('+Math.round(zip.length/1024)+' KB).';
 }catch(e){document.getElementById('genmsg').innerHTML='<span class="bad">Generation failed: '+esc(e.message)+'</span>'}
}

/* ---------------------------------------------------------------- codecs */
function b64bytes(b64){const bin=atob(b64);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
function b64utf8(b64){return new TextDecoder('utf-8').decode(b64bytes(b64))}
function utf8bytes(s){return new TextEncoder().encode(s)}
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function makeZip(files){
 const enc=new TextEncoder();const chunks=[];const central=[];let off=0;
 const dt=new Date();const time=((dt.getHours()<<11)|(dt.getMinutes()<<5)|(dt.getSeconds()>>1))&0xFFFF;
 const date=(((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate())&0xFFFF;
 files.forEach(f=>{
  const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
  const h=new Uint8Array(30+nm.length),v=new DataView(h.buffer);
  v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0,true);v.setUint16(8,0,true);
  v.setUint16(10,time,true);v.setUint16(12,date,true);v.setUint32(14,crc,true);
  v.setUint32(18,sz,true);v.setUint32(22,sz,true);v.setUint16(26,nm.length,true);v.setUint16(28,0,true);
  h.set(nm,30);chunks.push(h,f.data);
  const c=new Uint8Array(46+nm.length),cv=new DataView(c.buffer);
  cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0,true);
  cv.setUint16(10,0,true);cv.setUint16(12,time,true);cv.setUint16(14,date,true);cv.setUint32(16,crc,true);
  cv.setUint32(20,sz,true);cv.setUint32(24,sz,true);cv.setUint16(28,nm.length,true);
  cv.setUint32(42,off,true);c.set(nm,46);central.push(c);
  off+=h.length+sz;});
 let clen=0;central.forEach(c=>clen+=c.length);
 const end=new Uint8Array(22),ev=new DataView(end.buffer);
 ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);
 ev.setUint32(12,clen,true);ev.setUint32(16,off,true);
 let total=off+clen+22,out=new Uint8Array(total),p=0;
 chunks.forEach(c=>{out.set(c,p);p+=c.length});
 central.forEach(c=>{out.set(c,p);p+=c.length});
 out.set(end,p);
 return out;
}
showStep(0);
