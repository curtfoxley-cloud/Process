  });

/* ================= state ================= */
var BUILD=TL.build||'';
var PATH=null;
var ITEMS=['',''];
var PIN='';
var ASSESSOR='';
var DATE='';
var A={};
var CRIT=[[],[]];   /* criteria ticked, one list per item, aligned with ITEMS */
var FAIL={};        /* item indices picked as failing, keyed by question ID */
var RF=['',''];     /* procured-level names, aligned with ITEMS */
var RFPIN='';       /* procured-level PIN */
var RAT=null;
var EDIT=null;

DATE=today();
function curPath(){return PATHS.filter(function(p){return p.id===PATH;})[0]||null;}
function hasPin(){var p=curPath();return !!(p&&p.pinLabel);}
function rawNames(){
  var p=curPath()||{};
  return ITEMS.map(function(v,i){return (v||'').trim()||((p.itemName||'Item')+' '+(i+1));});
}
/* Re-framing. A question with a re-frame answer replaces item names with procured-level names. */
function reframeOn(){
  return NODES.some(function(n,i){return n.reframe&&A[n.g]===n.reframe&&counted(n,i);});
}
function names(){
  var raw=rawNames(), on=reframeOn();
  return raw.map(function(v,i){var r=String(RF[i]||'').trim();return on&&r?r:v;});
}
function pinNow(){var r=RFPIN.trim();return reframeOn()&&r?r:PIN;}
function resetRun(){A={};CRIT=ITEMS.map(function(){return [];});FAIL={};RF=ITEMS.map(function(){return '';});RFPIN='';RAT=null;EDIT=null;}
function syncItems(){
  while(CRIT.length<ITEMS.length) CRIT.push([]);
  while(RF.length<ITEMS.length) RF.push('');
  CRIT.length=ITEMS.length; RF.length=ITEMS.length;
}
function dropItem(i){
  ITEMS.splice(i,1); CRIT.splice(i,1); RF.splice(i,1);
  Object.keys(FAIL).forEach(function(g){
    FAIL[g]=FAIL[g].filter(function(x){return x!==i;}).map(function(x){return x>i?x-1:x;});
  });
}
/* Alternate wording, for example software. Decided from answers, never from the verdict. */
function alt(){return !!(DEF.alt&&arr(DEF.alt.when).length&&COND(DEF.alt.when,get0));}
function W(o,k){var a=o[k+'Alt'];return (alt()&&a&&String(a).trim())?a:o[k];}

var CRITDEF=arr(CRITCFG.items).map(function(c){return {k:c.k,label:PLAIN(c.label)};});
function critIdx(k){for(var i=0;i<CRITDEF.length;i++){if(CRITDEF[i].k===k) return i;} return 99;}
function critLabel(k){var i=critIdx(k);return i<99?CRITDEF[i].label:'';}
function critRef(k){return /^[a-z]$/.test(k)?'('+k+')':k.toUpperCase();}
function critSort(){CRIT.forEach(function(l){l.sort(function(a,b){return critIdx(a)-critIdx(b);});});}
function critOf(i){return arr(CRIT[i]).filter(function(k){return critIdx(k)<99;});}
function critAny(){var u=[];CRIT.forEach(function(l,i){critOf(i).forEach(function(k){if(u.indexOf(k)<0)u.push(k);});});return u;}

var NODES=[];
function buildNodes(){ return ALLNODES.filter(function(n){ return !arr(n.paths).length || arr(n.paths).indexOf(PATH)>=0; }); }

/* ================= flow ================= */
function live(n){return !arr(n.when).length || COND(n.when,get0);}
function opt(n,v){return arr(n.opts).filter(function(x){return x.v===v;})[0];}
function stopIdx(){
  for(var i=0;i<NODES.length;i++){
    var a=A[NODES[i].g]; if(!a) continue;
    var o=opt(NODES[i],a); if(o&&o.stop) return i;
  }
  return -1;
}
function stopHit(){
  for(var i=0;i<NODES.length;i++){
    var n=NODES[i]; if(!live(n)) continue;
    var a=A[n.g]; if(!a) return null;
    var o=opt(n,a); if(o&&o.stop) return {node:n,leaf:o.stop};
  }
  return null;
}
function counted(n,i){var c=stopIdx();return (c<0||i<=c)&&!!A[n.g];}
function editIndex(){
  if(!EDIT) return null;
  var i=NODES.findIndex(function(n){return n.g===EDIT;});
  if(i<0||!live(NODES[i])) return null;
  var c=stopIdx(); if(c>=0&&i>c) return null;
  return i;
}
function prevIdx(from){
  var c=stopIdx();
  for(var i=Math.min(from,NODES.length)-1;i>=0;i--){
    if(c>=0&&i>c) continue;
    if(live(NODES[i])&&A[NODES[i].g]) return i;
  }
  return -1;
}
function lastIdx(){return prevIdx(NODES.length);}
function cursor(){
  if(!PATH) return null;
  var e=editIndex(); if(e!==null) return e;
  if(stopHit()) return null;
  for(var i=0;i<NODES.length;i++){ var n=NODES[i]; if(live(n)&&!A[n.g]) return i; }
  return null;
}
function drivers(){return NODES.filter(function(n,i){return counted(n,i)&&n.fire&&A[n.g]===n.fire;});}
function holds(){return NODES.filter(function(n,i){return counted(n,i)&&n.holdText&&n.holdValue&&A[n.g]===n.holdValue;});}

/* condition subjects */
function ans(g){
  for(var i=0;i<NODES.length;i++) if(NODES[i].g===g && counted(NODES[i],i)) return A[g];
  return '';
}
function get0(k){
  if(k==='path') return PATH||'';
  if(k==='cnt:drivers') return drivers().length;
  if(k==='cnt:holds') return holds().length;
  if(k==='cnt:crit') return critAny().length;
  if(k.indexOf('a:')===0) return ans(k.slice(2));
  if(k.indexOf('fired:')===0){var g=k.slice(6);return drivers().some(function(n){return n.g===g;})?'yes':'no';}
  if(k.indexOf('crit:')===0) return critAny().indexOf(k.slice(5))>=0?'yes':'no';
  return '';
}
function get1(k){ return k==='verdict' ? (leafKey()||'') : get0(k); }
function ruleLeaf(skipHold){
  for(var i=0;i<RULES.length;i++){
    var l=LEAVES[RULES[i].leaf]; if(!l) continue;
    if(skipHold && l.style==='hold') continue;
    if(COND(RULES[i].when,get0)) return RULES[i].leaf;
  }
  return null;
}
function provisional(){var k=ruleLeaf(true);return k?W(LEAVES[k],'title'):'';}
/* A question that shows {provisional} was answered against one screen verdict. That verdict is kept as "@g".
   If an earlier answer changes the screen verdict, the answer is cleared and the question is asked again. */
function basisNodes(){return NODES.filter(function(n){return /\{provisional\}/.test(String(n.q||'')+' '+String(n.why||''));});}
function stampBasis(g){A['@'+g]=ruleLeaf(true)||'';}
function restale(skip){
  var now=ruleLeaf(true)||'';
  basisNodes().forEach(function(n){
    if(n.g===skip||!A[n.g]) return;
    if(A['@'+n.g]!==now){ delete A[n.g]; delete A['@'+n.g]; }
  });
}
/* Items that fail a question. On a criteria question, an item fails when no criterion is ticked for it.
   On any other question, the user ticks the items that fail. */
function failIdx(n){
  if(!n||!n.itemPick||A[n.g]!==n.itemPick) return [];
  if(n.crit) return ITEMS.map(function(x,i){return i;}).filter(function(i){return !critOf(i).length;});
  return arr(FAIL[n.g]).filter(function(i){return i<ITEMS.length;}).sort(function(a,b){return a-b;});
}
function failNames(n){var nm=names();return failIdx(n).map(function(i){return nm[i];});}
function failed(){
  var out=[];
  NODES.forEach(function(n,i){ if(counted(n,i)&&live(n)){ var f=failNames(n); if(f.length) out.push({g:n.g,names:f}); } });
  return out;
}
function leafKey(){
  if(!PATH) return null;
  if(editIndex()!==null) return null;
  var s=stopHit(); if(s) return LEAVES[s.leaf]?s.leaf:null;
  if(cursor()!==null) return null;
  return ruleLeaf(false);
}
function tok(){
  return {__fn:function(k){
    if(k==='provisional') return provisional();
    if(k==='names') return names().join(', ');
    if(k==='failed'){var f=[];failed().forEach(function(x){x.names.forEach(function(m){if(f.indexOf(m)<0)f.push(m);});});return f.join(', ')||'[none named]';}
    if(k==='drivers') return drivers().map(function(x){return x.g;}).join(', ');
    if(k==='holds') return holds().map(function(x){return x.g;}).join(', ');
    if(k==='pin') return pinNow()||'[PIN]';
    if(k==='count') return String(names().length);
    return undefined;
  }};
}
function txt(s){return fill(s,tok());}
function sigList(){var k=leafKey();if(!k)return [];return arr(DEF.sigs).filter(function(x){return COND(x.when,get1);});}
function sigNotes(){return sigList().filter(function(x){return x.note;}).map(function(x){return txt(x.note);});}
function warnings(){
  if(!leafKey()) return [];
  return arr(DEF.warnings).filter(function(w){return COND(w.when,get1);}).map(function(w){
    return {t:txt(w.title),list:lines(w.items).map(txt)};
  });
}
function leafNext(L0){return lines(W(L0,'next')).map(txt);}

/* Returns a message when answer v cannot stand with what is ticked or typed on the card. Empty means fine. */
function okFor(n,v){
  var bare=ITEMS.some(function(x,i){return !critOf(i).length;});
  if(n.crit&&n.critRequire&&v===n.critRequire&&bare) return n.critMsg||'Tick at least one criterion for every item first.';
  if(n.itemPick&&v===n.itemPick){
    if(n.crit){ if(!bare) return n.itemPickMsg||'Every item has a criterion ticked. Clear the ticks on each item that fails.'; }
    else if(!arr(FAIL[n.g]).length) return n.itemPickMsg||'Tick each item that fails first.';
  }
  if(n.reframe&&v===n.reframe&&!RF.some(function(r){return String(r||'').trim();})&&!(hasPin()&&RFPIN.trim()))
    return n.reframeMsg||'Enter at least one procured-level name first.';

function critRows(){

      holds().map(function(n){return '<li><b>'+esc(n.g)+'.</b> '+esc(txt(n.holdText))+'</li>';}).join('')+'</ul>';
    if(drivers().length) html+='<div class="lab" style="margin-top:12px">'+esc(L('driversHeading','Separation drivers'))+'</div><ul>'+
      drivers().map(function(n){return '<li><b>'+esc(n.g)+'.</b> '+esc(txt(n.driver))+'</li>';}).join('')+'</ul>';
    warnings().forEach(function(w){
      html+='<div class="warn"><b>'+esc(w.t)+'.</b><ul style="margin:6px 0 0">'+
        w.list.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
    });
    html+='<div class="lab" style="margin-top:12px">'+esc(L('nextHeading','Next'))+'</div><ul>'+
      leafNext(L0).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
    var sigs=sigList().filter(function(x){return arr(x.when).length;}).map(function(x){return esc(x.name);});
    if(sigs.length) html+='<p class="small" style="margin-top:10px">'+fill(esc(L('sigSentence','This record carries a concurrence line for {list}.')),{list:sigs.join(', ')})+'</p>';
    html+='<div class="fld" style="margin-top:14px"><label for="f-rat">'+esc(L('ratLabel','Rationale for the record'))+'</label>'+
      '<textarea id="f-rat" rows="3">'+esc(RAT!==null?RAT:suggest(key))+'</textarea></div>'+
      '<div class="nav">'+backLink(lastIdx())+'</div>'+
      '<div class="btnrow"><button class="btn pri" id="dl">'+esc(L('dlButton','Download as Word'))+'</button>'+
      '<button class="btn" id="copy">Copy</button>'+
      '<button class="btn" id="save">Save assessment</button>'+
      '<button class="btn gh" id="reset">Clear</button><span id="msg"></span></div>';
  }
  html+='</div></div>';
  $('tree').innerHTML=html;

  /* A tick or a name that no longer fits the answer given reopens the question. */
  function recheck(g,sel){
    var n=NODES.filter(function(x){return x.g===g;})[0];
    if(n&&A[g]&&okFor(n,A[g])){
      delete A[g]; delete A['@'+g]; RAT=null; EDIT=g; render();
      var el=sel&&$('tree').querySelector(sel); if(el) el.focus();
      if($('critmsg')) $('critmsg').textContent=L('reopened','That change no longer fits the answer. Answer again.');
      return true;
    }
    return false;
  }
  $('tree').querySelectorAll('[data-crit]').forEach(function(cb){
    cb.addEventListener('change',function(){
      var k=cb.dataset.crit, i=+cb.dataset.i; syncItems();
      var l=CRIT[i], at=l.indexOf(k);
      if(cb.checked){ if(at<0) l.push(k); } else if(at>=0) l.splice(at,1);
      critSort();
      if($('critmsg')) $('critmsg').textContent='';
      if(!recheck(cb.dataset.g,'[data-crit="'+k+'"][data-i="'+i+'"]')&&$('critstat')) $('critstat').textContent=critStat();
    });
  });
  $('tree').querySelectorAll('[data-fail]').forEach(function(cb){
    cb.addEventListener('change',function(){
      var g=cb.dataset.g, i=+cb.dataset.fail, l=FAIL[g]=arr(FAIL[g]), at=l.indexOf(i);
      if(cb.checked){ if(at<0) l.push(i); } else if(at>=0) l.splice(at,1);
      RAT=null;
      if($('critmsg')) $('critmsg').textContent='';
      recheck(g,'[data-fail="'+i+'"]');
    });
  });
  $('tree').querySelectorAll('[data-rf],[data-rfpin]').forEach(function(inp){
    inp.addEventListener('input',function(){
      if(inp.dataset.rfpin) RFPIN=inp.value; else { syncItems(); RF[+inp.dataset.rf]=inp.value; }
      RAT=null;
      if($('critmsg')) $('critmsg').textContent='';
    });
    inp.addEventListener('change',function(){ recheck(inp.dataset.g,null); });
  });
  $('tree').querySelectorAll('[data-v]').forEach(function(b){
    b.addEventListener('click',function(){
      var g=b.dataset.g, v=b.dataset.v, n=NODES.filter(function(x){return x.g===g;})[0]||{};
      var bad=okFor(n,v);
      if(bad){ if($('critmsg')) $('critmsg').textContent=bad; return; }
      if(n.crit&&n.critClear&&v===n.critClear) CRIT=ITEMS.map(function(){return [];});
      if(A[g]!==v){ A[g]=v; RAT=null; }
      if(basisNodes().some(function(x){return x.g===g;})) stampBasis(g);
      restale(g);
      EDIT=null; render(); focusCur();
    });
  });
  $('tree').querySelectorAll('[data-back]').forEach(function(b){
    b.addEventListener('click',function(){
      if(b.dataset.back==='__path'){
        if(Object.keys(A).length&&!confirm('Going back to the path question clears the answers. Continue?')) return;
        PATH=null;resetRun();render();return;
      }
      EDIT=b.dataset.back; render(); focusCur();
    });
  });
  $('tree').querySelectorAll('[data-resume]').forEach(function(b){
    b.addEventListener('click',function(){ EDIT=null; render(); focusCur(); });
  });
  if(L0){
    $('f-rat').addEventListener('input',function(){RAT=this.value;});
    $('dl').addEventListener('click',doDownload);
    $('copy').addEventListener('click',function(){copyText(textOut(),$('copy'),$('msg'));});
    $('save').addEventListener('click',doSave);
    $('reset').addEventListener('click',function(){
      if(!confirm('Clear the assessment?')) return;
      resetRun();render();
    });
    $('live').textContent=txt(W(L0,'title'))+'. '+txt(W(L0,'desc'));
  } else {
    var n=NODES[cur]; if(n) $('live').textContent=n.g+'. '+txt(n.q);
  }
}
function focusCur(){
  if(PREVIEW&&window.__noFocus) return;
  var b=$('tree').querySelector('.node.here .branch button.cur')||
        $('tree').querySelector('.node.here .branch button');
  if(b){ b.focus(); return; }
  var h=$('tree').querySelector('.leaf.on .box h2');
  if(h){ h.setAttribute('tabindex','-1'); h.focus(); }
}
function suggest(k){ var l=LEAVES[k]; return l?txt(W(l,'rat')):''; }

/* ================= outputs ================= */
function answered(){
  var stop=stopHit(), cut=stop?NODES.indexOf(stop.node):NODES.length-1, out=[];
  NODES.forEach(function(n,i){
    if(!live(n)||i>cut||!A[n.g]) return;
    var o=opt(n,A[n.g]), f=failNames(n);
    out.push({g:n.g,q:txt(n.q),a:(o?o.l:A[n.g])+(f.length?': '+f.join(', '):'')});
  });
  return out;
}
/* A re-framed name prints with the name it replaced, so the record shows what was assessed. */
function rfNote(now,was){return now!==was&&was?now+' ('+L('reframedFrom','re-framed from')+' '+was+')':now;}
function pinShown(){return rfNote(pinNow(),PIN);}
function nameShown(i){return rfNote(names()[i],rawNames()[i]);}
function subjectLines(){
  var p=curPath()||{}, out=[];
  if(p.pinLabel) out.push(p.pinLabel+': '+(pinShown()||''));
  names().forEach(function(v,i){out.push((p.itemName||'Item')+' '+(i+1)+': '+nameShown(i));});
  return out;
}
function sigLine(name){
  var u=Math.max(8,27-name.length);
  return '  '+name+' '+new Array(u+1).join('_')+'  Date __________';
}
function textOut(){
  var L0=LEAVES[leafKey()],out=[];
  out.push(TL.textTitle||'','',L('pathNow','Decision path:')+' '+pathLabel(),'');
  subjectLines().forEach(function(l){out.push(l);});
  out.push(L('assessor','Assessor')+': '+ASSESSOR,L('date','Date')+': '+DATE,'',L('gatesHeading','Gates'));
  answered().forEach(function(s){out.push('  '+s.g+'. '+s.q,'      '+s.a);});
  out.push('');
  var q=quals(), cr=critRows();
  if(q.length||cr.length){out.push(L('qualHeading','CI qualification'));
    q.forEach(function(x){out.push('  '+x.label+' '+x.text);});
    cr.forEach(function(r){out.push('  '+r.name+(r.ks.length?'':': '+L('critNoneItem','No criterion met.')));
      r.ks.forEach(function(k){out.push('      '+critRef(k)+' '+critLabel(k));});});
    out.push('');}
  if(failed().length){out.push(L('failHeading','Items that fail'));
    failed().forEach(function(f){out.push('  '+f.g+'. '+f.names.join(', '));});out.push('');}
  if(holds().length){out.push(L('holdsHeading','Facts outstanding'));holds().forEach(function(n){out.push('  '+n.g+'. '+txt(n.holdText));});out.push('');}
  if(drivers().length){out.push(L('driversHeading','Separation drivers'));drivers().forEach(function(n){out.push('  '+n.g+'. '+txt(n.driver));});out.push('');}
  out.push(L('verdictWord','Verdict')+': '+txt(W(L0,'title')),txt(W(L0,'desc')),'','Rationale: '+($('f-rat')?$('f-rat').value:''),'');
  warnings().forEach(function(w){out.push(w.t);w.list.forEach(function(x){out.push('  - '+x);});out.push('');});
  out.push(L('actionsHeading','Required actions'));
  leafNext(L0).forEach(function(x){out.push('  - '+x);});
  if(L('textAttach','')) out.push('',L('textAttach',''),'');
  else out.push('');
  out.push(L('concurrenceHeading','Concurrence'));
  sigList().forEach(function(x){out.push(sigLine(x.name));});
  out.push('');
  sigNotes().forEach(function(t){out.push(t);});
  out.push('',L('disclaimer','This record is an assessment. It is not a concurrence.'));
  return out.join('\n');
}
function docBody(){
  var L0=LEAVES[leafKey()],b=[],p=curPath()||{};
  b.push(P(TL.docTitle||'',{b:true,sz:32,after:40}));
  if(TL.docSub) b.push(P(TL.docSub,{sz:18,color:'5C6D78',after:160}));
  var mrows=[[{xml:P(L('pathWord','Decision path'),{b:true,sz:18}),shade:'F4F6F7'},{xml:P(pathLabel(),{sz:20})},
              {xml:P(L('assessor','Assessor'),{b:true,sz:18}),shade:'F4F6F7'},{xml:P(ASSESSOR,{sz:20})}]];
  mrows.push([{xml:P(L('date','Date'),{b:true,sz:18}),shade:'F4F6F7'},{xml:P(DATE,{sz:20})},
              {xml:P(p.pinLabel?(p.pinShort||p.pinLabel):(p.countLabel||'Items'),{b:true,sz:18}),shade:'F4F6F7'},
              {xml:P(p.pinLabel?pinShown():String(names().length),{sz:20})}]);
  b.push(TB(mrows,[1500,3180,1500,3180]));
  b.push(P('',{after:120}));
  b.push(P(p.listLabel||'Items',{b:true,sz:24,keep:true}));
  var irows=[];
  names().forEach(function(v,i){irows.push([{xml:P(String(i+1),{b:true,sz:18})},{xml:P(nameShown(i),{sz:18})}]);});
  b.push(TB(irows,[700,8660]));
  b.push(P('',{after:160}));

  b.push(P(L('gatesHeading','Gates'),{b:true,sz:24,keep:true}));
  var rows=[[{xml:P(L('gateCol','Gate'),{b:true,sz:17}),shade:'EDF0F1'},{xml:P('Question',{b:true,sz:17}),shade:'EDF0F1'},{xml:P('Answer',{b:true,sz:17}),shade:'EDF0F1'}]];
  answered().forEach(function(s){rows.push([{xml:P(s.g,{b:true,sz:18})},{xml:P(s.q,{sz:18})},{xml:P(s.a,{sz:18})}]);});
  b.push(TB(rows,[900,6060,2400]));
  b.push(P('',{after:160}));

  var q=quals(), cr=critRows();
  if(q.length||cr.length){
    b.push(P(L('qualHeading','CI qualification'),{b:true,sz:24,keep:true}));
    var krows=[];
    q.forEach(function(x){krows.push([{xml:P(x.label,{b:true,sz:18})},{xml:P(x.text,{sz:18})}]);});
    cr.forEach(function(r){krows.push([{xml:P(r.name,{b:true,sz:18})},
      {xml:r.ks.length?r.ks.map(function(k){return P(critRef(k)+' '+critLabel(k),{sz:18});}).join(''):P(L('critNoneItem','No criterion met.'),{sz:18,color:'9A6508'})}]);});
    b.push(TB(krows,[2400,6960]));
    if(L('qualNote','')) b.push(P(L('qualNote',''),{sz:16,color:'5C6D78'}));
    b.push(P('',{after:160}));
  }
  if(failed().length){
    b.push(P(L('failHeading','Items that fail'),{b:true,sz:24,keep:true}));
    failed().forEach(function(f){b.push(P(f.g+'. '+f.names.join(', '),{sz:18}));});
    b.push(P('',{after:160}));
  }
  if(holds().length){
    b.push(P(L('holdsHeading','Facts outstanding'),{b:true,sz:24,keep:true}));
    holds().forEach(function(n){b.push(P(n.g+'. '+txt(n.holdText),{sz:18,color:'9A6508'}));});
    b.push(P('',{after:160}));
  }
  if(drivers().length){
    b.push(P(L('driversHeading','Separation drivers'),{b:true,sz:24,keep:true}));
    drivers().forEach(function(n){b.push(P(n.g+'. '+txt(n.driver),{sz:18}));});
    b.push(P('',{after:160}));
  }
  b.push(P(L('verdictWord','Verdict'),{b:true,sz:24,keep:true}));
  b.push(TB([[{xml:P(txt(W(L0,'title')),{b:true,sz:22})+P(txt(W(L0,'desc')),{sz:18,color:'5C6D78'})}]],[9360]));
  b.push(P('',{after:80}));
  b.push(P('Rationale',{b:true,sz:20}));
  b.push(TB([[{xml:P($('f-rat')?$('f-rat').value:'',{sz:20})}]],[9360]));
  b.push(P('',{after:160}));
  warnings().forEach(function(w){
    b.push(P(w.t,{b:true,sz:24,keep:true}));
    w.list.forEach(function(x){b.push(P(x,{sz:18}));});
    b.push(P('',{after:120}));
  });
  b.push(P(L('actionsHeading','Required actions'),{b:true,sz:24,keep:true}));
  leafNext(L0).forEach(function(x){b.push(P(x,{sz:18}));});
  b.push(P('',{after:160}));
  b.push(P(L('concurrenceHeading','Concurrence'),{b:true,sz:24,keep:true}));
  var crows=sigList().map(function(x){return [{xml:P(x.name,{b:true,sz:18}),shade:'F4F6F7'},{xml:P('')},{xml:P('Date',{b:true,sz:18}),shade:'F4F6F7'},{xml:P('')}];});
  if(crows.length) b.push(TB(crows,[1700,4260,900,2500]));
  sigNotes().forEach(function(t){b.push(P(t,{sz:16,color:'5C6D78'}));});
  b.push(P(L('disclaimer','This record is an assessment. It is not a concurrence.'),{sz:15,color:'8998A2'}));
  return b.join('');
}
function subjectFilled(){
  var n=ITEMS.filter(function(v){return v.trim();}).length>=2;
  return hasPin() ? (PIN.trim()&&n) : n;
}
function subjectKey(){return hasPin()?pinNow():names()[0];}
function doDownload(){
  var p=curPath()||{};
  if(!subjectFilled()){
    var w=String(p.itemName||'Item').toLowerCase()+'s';
    $('msg').textContent=hasPin()?'Name the '+(p.pinShort||p.pinLabel)+' and at least two '+w+' first.':'Name at least two '+w+' first.'; return; }
  try{
    var title=(TL.docTitle||'Assessment')+': '+(hasPin()?pinNow():names().join(' and '));
    var by=packDocx(docBody(),title,ASSESSOR);
    dlBytes(by,(TL.fileStem||'Assessment')+'_'+slugN(subjectKey(),36)+'_'+(DATE||today())+'.docx',DOCX_MIME);
    $('msg').textContent='Downloaded.';
  }catch(e){ $('msg').textContent='Build failed: '+e.message; }
}
/* ---- save and resume ---- */
function stateBlob(){
  return {tool:TL.id,rev:TL.rev,build:BUILD,path:PATH,items:ITEMS,pin:PIN,
            assessor:ASSESSOR,date:DATE,answers:A,format:2,
            criteria:ITEMS.map(function(x,i){return critOf(i);}),fail:FAIL,reframe:RF,reframePin:RFPIN,
            rationale:($('f-rat')?$('f-rat').value:RAT)};
}
function doSave(){
  dlBytes(utf8(JSON.stringify(stateBlob(),null,1)),
    (TL.fileStem||'Assessment')+'_'+slugN(subjectKey()||'draft',36)+'_'+(DATE||today())+'.json','application/json');
  if($('msg')) $('msg').textContent='Assessment saved. Reopen it with Open saved assessment.';
}
function applyBlob(o){
  function strList(x){
    var a=Array.isArray(x)?x.map(function(v){return typeof v==='string'?v:'';}):[];
    while(a.length<2) a.push('');
    return a;
  }
  PATH=PATHS.some(function(p){return p.id===o.path;})?o.path:null;
  ITEMS=strList(o.items&&o.items.length?o.items:o.inst);
  if(o.path==='B'&&Array.isArray(o.inst)&&o.inst.some(function(v){return v;})) ITEMS=strList(o.inst);
  PIN=typeof o.pin==='string'?o.pin:'';
  ASSESSOR=typeof o.assessor==='string'?o.assessor:'';
  DATE=typeof o.date==='string'?o.date:today();
  A=(o.answers&&typeof o.answers==='object'&&!Array.isArray(o.answers))?o.answers:{};
  var c=o.criteria;
  OLDCRIT=false;
  if(Array.isArray(c)&&c.every(Array.isArray))
    CRIT=c.map(function(l){return l.filter(function(k){return typeof k==='string'&&critIdx(k)<99;});});
  else { CRIT=[]; OLDCRIT=Array.isArray(c)&&c.length>0; }
  FAIL={};
  if(o.fail&&typeof o.fail==='object'&&!Array.isArray(o.fail))
    Object.keys(o.fail).forEach(function(g){FAIL[g]=arr(o.fail[g]).filter(function(i){return typeof i==='number'&&i>=0;});});
  RF=Array.isArray(o.reframe)?o.reframe.map(function(v){return typeof v==='string'?v:'';}):[];
  RFPIN=typeof o.reframePin==='string'?o.reframePin:'';
  syncItems(); critSort();
  EDIT=null;
  RAT=(typeof o.rationale==='string')?o.rationale:null;
}
/* Saves from earlier builds pooled the criteria and did not name failing items.
   Those answers reopen so the assessor can record them per item. Returns how many reopened. */
var OLDCRIT=false;
function afterLoad(){
  NODES=PATH?buildNodes():[];
  var re=0;
  NODES.forEach(function(n){
    var a=A[n.g]; if(!a) return;
    var stale=(n.crit&&OLDCRIT)||((n.crit||n.itemPick)&&okFor(n,a)&&!(n.reframe&&a===n.reframe));
    if(stale){ delete A[n.g]; delete A['@'+n.g]; re++; }
  });
  basisNodes().forEach(function(n){ if(A[n.g]&&A['@'+n.g]===undefined) stampBasis(n.g); });
  OLDCRIT=false;
  if(re) RAT=null;
  return re;
}
function doLoad(ev){
  var f=ev.target.files&&ev.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(o.tool!==TL.id) throw new Error('not an assessment file for this tool');
      applyBlob(o); var re=afterLoad(); render();
      if($('msg2')) $('msg2').textContent=re
        ? fill(L('loadReopened','Assessment loaded. {n} answer(s) reopened. This build records criteria and failing items per item.'),{n:re})
        : 'Assessment loaded.';
    }catch(e){ if($('msg2')) $('msg2').textContent='Could not read that file: '+e.message; }
  };
  r.readAsText(f);
  ev.target.value='';
}
guardUnload(function(){return Object.keys(A).length||critAny().length;});

/* ---- the builder keeps answers across a preview refresh ---- */
window.__getState=function(){var o=stateBlob();o.rationale=RAT;o.edit=EDIT;return o;};
window.__setState=function(o){ if(!o) return; window.__noFocus=1; applyBlob(o); afterLoad(); EDIT=o.edit||null; if(!NODES) NODES=[]; render(); window.__noFocus=0; };
window.__recordText=function(){ if(!PATH) return {text:'',note:'Pick a path in the preview to begin.'}; if(!leafKey()) return {text:'',note:'Answer the questions to reach a verdict. The record appears then.'}; return {text:textOut(),note:'This is the Copy text. The Word record carries the same content.'}; };
window.textOut=textOut; window.leafKey=leafKey;
render();

</script>
